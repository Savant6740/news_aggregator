d": "b3dc577c"}, {"headline": "Gold ETF exits top $100 billion, hopes of US Fed rate hike", "summary": "Gold ETFs saw outflows, pushing global holdings below $100 billion, as expectations of a prolonged high-interest rate environment by the US Federal Reserve weighed on investor sentiment.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "af02a8fb"}, {"headline": "High price of imported urea may hike India’s fertiliser subsidy", "summary": "India faces a potential increase in fertiliser subsidy due to rising international urea prices. India relies heavily on imports, and global price hikes could significantly impact the government's budget and agricultural input costs.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "53b1858d"}, {"headline": "Cyclone Akvan hits early potato, 97 per cent crop damaged", "summary": "Cyclone Michaung (earlier named Akvan) caused extensive damage to early potato crops in West Bengal, with 97% of the yield affected in several districts. This could lead to price rises and shortages.", "category": "India", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "873952c6"}, {"headline": "New tur arrivals start in Karnataka, Maharashtra", "summary": "New tur (pigeon pea) arrivals have begun in Karnataka and Maharashtra, with prices remaining above MSP. Despite early harvests, experts anticipate market arrivals to peak in December, indicating good production.", "category": "Economy", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "877ceddd"}, {"headline": "India may import 2 million tonnes of sugar this season to bolster domestic availability", "summary": "India may need to import 2 million tonnes of sugar during the October 2023-September 2024 season to ensure domestic availability, despite earlier estimates of a surplus. Production forecasts have been revised downwards.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "4f4293e6"}, {"headline": "IMD predicts heavy rain in South India", "summary": "IMD predicts heavy rainfall across Tamil Nadu, Kerala, and South Interior Karnataka for the next few days. A low-pressure area over the Southwest Bay of Bengal is expected to intensify, bringing thunderstorms and strong winds.", "category": "India", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "e7d0c14e"}, {"headline": "Stay off natural gas futures", "summary": "Natural gas prices are volatile due to supply-demand imbalances. Analysts recommend investors to avoid fresh long positions and consider hedging strategies given potential for price fluctuations.", "category": "Economy", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "70d9698d"}, {"headline": "Seafood exporters seek curbs on fishmeal as protection to export aquaculture", "summary": "Seafood exporters have urged the government to restrict fishmeal exports to ensure domestic availability for aquaculture, a crucial input for shrimp farming. This aims to protect the export-oriented aquaculture industry from raw material shortages.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "1c6ead58"}, {"headline": "India’s $44 billion space dream faces funding gaps: ispa Ramchandani", "summary": "India's ambition for a $44 billion space economy by 2033 requires significant investment from both government and private sectors. ISPA President Ramchandani highlighted funding gaps and the need for a robust ecosystem to achieve this goal.", "category": "Technology", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "e1bcf9dd"}, {"headline": "Solar power capacity addition may surpass 2025 record in current year", "summary": "India's solar power capacity addition is projected to exceed the 2025 record in the current financial year. Rooftop solar installations are driving this growth, indicating a shift towards decentralized renewable energy.", "category": "Environment", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "407afcf7"}, {"headline": "Vyoma.ai to deploy Nvidia B300 GPUs", "summary": "Vyoma.ai plans to deploy 2,500 units of Nvidia's B300 GPUs, totaling 2.5 exaflops of AI compute. This investment will enhance India's AI infrastructure, supporting research and development in AI.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "216ed96e"}, {"headline": "Karnataka CM expansion for Toyota", "summary": "Toyota Kirloskar Motor (TKM) is expanding its production capacity in Karnataka. CM Siddaramaiah met with TKM officials, highlighting the state's support for the auto sector and encouraging further investments.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "04211776"}, {"headline": "AP keen to deepen maritime ties with South East Asia: Nara Lokesh", "summary": "Andhra Pradesh Minister Nara Lokesh expressed the state's interest in strengthening maritime and economic ties with Southeast Asian nations. He highlighted opportunities in ports, logistics, and tourism.", "category": "Infrastructure", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "4c6f5b35"}, {"headline": "India’s AI funding nearly doubles to $1.6 billion", "summary": "India's AI sector attracted $1.6 billion in funding in the first nine months of 2023, nearly double the previous year. This growth is driven by rising investor interest and increased adoption of AI technologies.", "category": "Technology", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "76ade2dc"}, {"headline": "Tamil Nadu unveils TN-TREND reforms to speed up approvals, simplify biz regulations", "summary": "Tamil Nadu launched TN-TREND reforms to streamline investment approvals and simplify business regulations. The initiative aims to enhance ease of doing business, promote transparency, and attract more investments to the state.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "dbc0a758"}, {"headline": "J&K’s winter power dependence puts focus on procurement gaps", "summary": "Jammu & Kashmir faces significant power shortages during winter due to increased demand and reliance on energy imports. The situation highlights procurement gaps and the need for improved energy infrastructure.", "category": "Infrastructure", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "7c9a7f3e"}, {"headline": "Families pay ₹4 lakh crore on healthcare, almost equal to government spending", "summary": "Indian households spent ₹4 lakh crore out-of-pocket on healthcare in 2019-20, nearly matching government spending. This burden highlights inadequate public health insurance coverage and high medical costs, particularly in states with lower spending.", "category": "Health", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "e0b86085"}, {"headline": "72% of IT workers ready to switch jobs if pay remains same", "summary": "A survey found that 72% of Indian IT workers are willing to switch jobs, even with the same pay, if they are offered better work-life balance and learning opportunities. This indicates a shift in priorities beyond just compensation.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "91ac926c"}, {"headline": "Bisleri says it maintains stringent quality after FSSAI review", "summary": "Bisleri International stated it maintains stringent quality standards for its packaged drinking water following a recent FSSAI review. The company emphasized its internal checks and compliance with regulatory norms.", "category": "Business", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "9d980351"}, {"headline": "FSSAI suspends license of 5 firms over violations", "summary": "FSSAI suspended the licenses of five food business operators in New Delhi for violating safety and standard norms. Inspections revealed issues with hygiene, quality control, and compliance, leading to enforcement action to ensure public health.", "category": "Law", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "b3bf5474"}, {"headline": "Why India’s AI poster child is facing uncomfortable questions", "summary": "Sarvam AI, an Indian startup, faces scrutiny over its ability to translate significant government and private funding into \"frontier AI capabilities.\" Experts question the company's long-term vision, execution, and claims of building advanced AI models despite substantial backing.", "category": "Technology", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "88572c04"}, {"headline": "Malabar rides Black Friday wave to clear stocks", "summary": "Malabar Gold & Diamonds is offering discounts and schemes for Black Friday, aiming to clear older inventory and boost sales. This strategy capitalizes on the global shopping trend to drive consumer demand.", "category": "Business", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "00da55c7"}, {"headline": "Pilots' body up oversight of SpiceJet ops", "summary": "The SpiceJet pilots' union has asked DGCA to intensify safety oversight on the airline due to recurring incidents and concerns about operational integrity. They urge stricter enforcement of safety regulations.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144574", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144574"}], "article_id": "4583d139"}, {"headline": "Farm pain may lead to softer loan recovery for Indian banks", "summary": "A deficit monsoon in six states, including Maharashtra and Gujarat, has raised concerns over crop yields. This is expected to slow loan recoveries from the agricultural sector. State Bank of India has identified approximately ₹10,000 crore worth of loans as a potential pool for restructuring to ease the burden on rural borrowers facing financial distress.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "5a5104c8"}, {"headline": "IITs begin campus hiring with high pay despite cautious outlook", "summary": "The placement season at Indian Institutes of Technology (IITs) has started with top-tier firms offering lucrative packages. However, there is a cautious sentiment overall due to a slowdown in the global tech sector. While high-frequency trading and AI-focused firms continue to recruit aggressively, many traditional IT service firms are expected to hire fewer students this year.", "category": "Education", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "c3399858"}, {"headline": "Indian box office sets up second record year with blockbuster hits", "summary": "The Indian film industry is on track for another record-breaking year, with box office collections reaching ₹12,534 crore by October 2026. This is a 13% increase over the previous year, driven by large-format spectacles and a surge in admissions at multiplexes. Successes in regional cinema and big-budget sequels have contributed significantly to the growth.", "category": "Culture", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "6b7dc432"}, {"headline": "Private sector growth in India expected to hold up in November", "summary": "The HSBC Flash India PMI Composite Output Index indicated that India's business activity likely maintained its momentum in November. While manufacturing output showed a slight moderation, the services sector remained resilient. Firm demand and a pickup in new orders suggest that the private sector continues to expand, though inflationary pressures remain a concern for manufacturers.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "2f8071be"}, {"headline": "Eleven candidates shortlisted for top drug regulator position in India", "summary": "The Union government has shortlisted 11 candidates to lead the Central Drugs Standard Control Organization (CDSCO) as the Drugs Controller General of India. The selection process, managed by the UPSC, aims to find a leader to oversee the safety and quality of medicines and clinical trials. The final appointment will be cleared by the Appointments Committee of the Cabinet.", "category": "Law", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "0d7784f9"}, {"headline": "Fertilizer subsidy may rise to ₹2.5 trillion due to input costs", "summary": "India's fertilizer subsidy bill is projected to increase by 15% to approximately ₹2.5 trillion this fiscal year. The rise is attributed to higher global prices for raw materials and increased domestic demand following a deficient monsoon. The government has already approved additional outlays for the rabi season to ensure adequate supply and stable prices for farmers.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "18fe09ba"}, {"headline": "India's gold imports decline 40% during April to October period", "summary": "Gold imports into India fell by nearly 40% year-on-year in the first seven months of the current fiscal year. Data shows imports were valued at approximately $14.86 billion, compared to $24.7 billion in the previous year. The decline is linked to higher domestic prices and shifting consumer preferences, which has helped narrow the country's trade deficit.", "category": "Economy", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "5ceea4c8"}, {"headline": "India looks to Semicon 2.0 to bridge semiconductor manufacturing gap", "summary": "The Indian government is preparing the second phase of its semiconductor incentive scheme, Semicon 2.0. The goal is to establish larger facilities that can meet high-volume demand, as current projects are expected to meet only a tenth of the country's chip demand by 2030. The revised plan will focus on attracting major global players to set up advanced fabrication plants.", "category": "Technology", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "eccd2718"}, {"headline": "Brookfield eyes more Indian deals as valuations become attractive", "summary": "Global investment firm Brookfield is seeking further acquisitions in India following its $1.7 billion buyout of PGP Glass. The firm sees strong macroeconomic fundamentals and attractive valuations in sectors like renewables, infrastructure, and financial services. It plans to leverage its global expertise to scale domestic businesses and tap into India's long-term growth story.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "53d84e49"}, {"headline": "Falling gold prices impact Titan Company's inventory and margins", "summary": "Titan Company witnessed a sharp decline in its share price as falling global gold prices triggered concerns over its inventory value. While lower prices typically boost consumer demand, they can lead to mark-to-market losses on existing stocks. The company's management is monitoring the situation, as price volatility affects the margins of its jewelry business in the short term.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "63fc026e"}, {"headline": "SC ruling may define shareholder rights in insolvency proceedings", "summary": "The Supreme Court is set to rule on whether shareholders have the right to challenge insolvency proceedings against their companies. The case follows a challenge by a majority shareholder of a hospitality group. The verdict will clarify the legal standing of equity holders in the corporate insolvency resolution process and could impact the speed of debt settlements.", "category": "Law", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "deccee5b"}, {"headline": "China's electric vehicle boom in Europe impacts Indian engineering services", "summary": "The rapid expansion of Chinese electric vehicle manufacturers in Europe is creating pressure on Indian engineering, research, and development (ER&D) firms. As European automakers lose market share, they are cutting costs and delaying R&D projects. This has led to a slowdown in revenue growth for top Indian firms like L&T Technology Services and Tata Technologies in the European market.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "192a9e34"}, {"headline": "Supreme Court suggests arbitration to settle Kalyani family business feud", "summary": "The Supreme Court has advised industrialist Baba Kalyani and his sister Sugandha Hiremath to settle their long-standing family dispute through mediation. The feud involves the distribution of assets in the multi-billion dollar Kalyani Group. The court suggested a retired judge to lead the arbitration process to avoid prolonged legal battles over ancestral wealth and company stakes.", "category": "Law", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "cc5bfc24"}, {"headline": "LMIL launches radiation-free breast cancer screening device in India", "summary": "Lord’s Mark Industries Limited (LMIL) has introduced a new, non-invasive, radiation-free device for breast cancer screening. The technology uses thermal sensors to identify abnormal tissue patterns, providing an affordable and accessible alternative to traditional mammography. The company plans to deploy these devices across hospitals and rural clinics to improve early detection rates.", "category": "Health", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "c344331a"}, {"headline": "Adani Airport Holdings raises $300 million for non-aero business growth", "summary": "Adani Airport Holdings Limited (AAHL) has raised $300 million from a consortium of global investors to fund its non-aeronautical business expansion. The funds will be used to develop retail, dining, and hospitality services at its eight managed airports. AAHL aims to transform airports into city-side commercial hubs to diversify its revenue streams and enhance passenger experience.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "84bb4b4f"}, {"headline": "Zelenskyy calls for urgent 4-way talks with Russia to end war", "summary": "Ukrainian President Volodymyr Zelenskyy has called for a high-level four-party meeting involving Ukraine, Europe, America, and Russia to discuss a peaceful resolution to the ongoing war. Zelenskyy emphasized the need for a diplomatic framework to secure Ukraine's sovereignty and security. The proposal comes amid intensifying frontline combat and renewed international calls for a ceasefire.", "category": "Politics", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "35429016"}, {"headline": "Capture of major drug kingpin in Mexico risks bloody succession battle", "summary": "The capture of Fausto Isidro Meza Flores, a high-ranking leader of a major Mexican drug cartel, has triggered fears of a violent power vacuum. Security forces are on high alert as rival factions and internal successors are expected to fight for control of the organization’s lucrative smuggling routes. The arrest is a major win for the Mexican government but poses immediate security risks.", "category": "World", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "e5df5f31"}, {"headline": "RBI proposes 'Stop Switch' to curb digital payment frauds in India", "summary": "The Reserve Bank of India has proposed a 'Stop Switch' feature that would allow customers to freeze all digital transactions instantly if they suspect fraud. The initiative aims to provide bank customers with more control and immediate protection against unauthorized fund transfers. The RBI has sought feedback from banks and stakeholders before implementing the feature across all platforms.", "category": "Technology", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "465e07ed"}, {"headline": "Personalized travel startups use AI to offer bespoke holiday experiences", "summary": "A new wave of travel startups in India is leveraging artificial intelligence to create highly personalized holiday packages for travelers. By analyzing user preferences, budgets, and travel history, these platforms can automate complex itineraries that were previously handled by human agents. This trend is attracting significant venture capital as investors bet on the growth of luxury travel.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "15c3f5fe"}, {"headline": "New EPF rules propose 90% withdrawal and monthly income options", "summary": "The Employees’ Provident Fund Organisation (EPFO) has approved several changes to its withdrawal rules, including allowing members to withdraw up to 90% of their corpus after retirement. The board also proposed a systematic withdrawal plan to provide retirees with a steady monthly income. These changes are designed to offer greater financial flexibility and better long-term planning for members.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "0697756a"}, {"headline": "India needs a new national compact on internal migration policy", "summary": "As southern Indian states age rapidly while northern states remain youthful, a new national consensus on internal migration is essential. A unified policy could help balance labor shortages in the south with the surplus workforce in the north. This would ensure economic stability and better demographic alignment across the country, preventing regional disparities from widening over time.", "category": "India", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "889f3474"}, {"headline": "Slowdown in AI data center expansion provides time for risk management", "summary": "Raghuram Rajan argues that a temporary slowdown in the rapid expansion of AI-focused data centers could be beneficial. It provides businesses and regulators with the necessary time to implement better risk management frameworks and ensure that AI deployment is safe and ethically sound. This pause may help prevent potential systemic crises caused by an uncontrolled technological rush.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "1923c7f8"}, {"headline": "Wellness culture shift: Managing healthy habits to avoid lifestyle burnout", "summary": "The modern wellness trend of 'habit stacking' is causing some people to feel overwhelmed by an excessive number of daily health routines. Experts suggest that focusing on a few consistent, manageable habits is more effective than following a rigid and complex schedule. Flexibility and mental well-being are key to maintaining a healthy lifestyle without it becoming a source of stress.", "category": "Health", "page": 14, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "ef502607"}, {"headline": "India faces high cooking oil bill as global prices surge", "summary": "India's edible oil import bill is expected to exceed ₹2 trillion this year due to a sharp rise in global prices and domestic production shortfalls. The cost is significantly higher than the government's budget allocation for agricultural support. As a major importer of palm and sunflower oil, India is vulnerable to international supply shocks and currency fluctuations, impacting retail prices.", "category": "Economy", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "f4aa066d"}, {"headline": "Women emerge as a major force in Indian investment landscape", "summary": "Data reveals that women's share of individual mutual fund assets in India rose to 34.5% in 2026. Women investors are increasingly moving toward equity-oriented funds and show higher average portfolio balances compared to men. Systematic Investment Plan (SIP) contributions from women have grown at a 30% annual rate, reflecting their rising financial independence and long-term wealth creation goals.", "category": "Economy", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144572", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/144572"}], "article_id": "2aed6c59"}, {"headline": "Jensen Huang returns as Nvidia CEO after Trump administration intervention", "summary": "In a surprise move, Jensen Huang was reinstated as Nvidia's CEO on Monday after the board initially rejected his return. The reversal followed reported support from the incoming Trump administration, which emphasized Huang's role in US artificial intelligence leadership. The company is currently facing investigations regarding alleged export control violations.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144564"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144574"}, {"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261124.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144572"}], "importance": 10, "article_id": "9b2e75be"}, {"headline": "Karnataka Backs Toyota Expansion, Pitches Hybrid e-Taxi Launch", "summary": "Karnataka CM DK Shivakumar assured Toyota Motor Corporation of state support for its manufacturing expansion to 1 million vehicles annually. He also urged Toyota to consider introducing its affordable hybrid electric taxi model in Karnataka to lower operating costs.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "importance": 7, "article_id": "28cd58ee"}, {"headline": "Alice Huang Linked to Chinese Spy Agency in Nvidia CEO Probe", "summary": "Reports emerged that Alice Huang, with whom Nvidia CEO Jensen Huang had an extramarital affair, was in contact with an official of China's top spy agency for over a year. Her business partner, Kang Wei, also allegedly worked with the same agency.", "category": "World", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}], "importance": 8, "article_id": "791eaeec"}, {"headline": "SC Suspends Life Term of Godhra Train Burning Convict on Medical Grounds", "summary": "The Supreme Court suspended the life sentence of Irfan Siraj Pada, a convict in the 2002 Godhra train burning case, on medical grounds. The bench noted he had spent over 18 years in prison and was suffering from medical ailments.", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "importance": 7, "article_id": "b003ab6f"}, {"headline": "PM Modi is Asia's Second-Most Effective Leader: Lowy Institute", "summary": "Prime Minister Narendra Modi ranked as Asia's second-most effective leader, behind Xi Jinping, according to the Lowy Institute's 2026 Asia Power Index. India's diplomatic influence, resilience, and cultural clout were highlighted as strengths.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "importance": 8, "article_id": "fa9c237d"}, {"headline": "West Bengal Assembly to Table Resolution Renaming State 'Paschim Banga'", "summary": "West Bengal CM Suvendu Adhikari announced a resolution to rename the state ‘Paschim Banga’ will be tabled in the assembly session starting December 4. After adoption, it will be sent to the Centre for approval.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "importance": 7, "article_id": "3671e236"}, {"headline": "PM Modi Announces `15,000 Crore Development Package for Nepal", "summary": "PM Narendra Modi announced a `15,000 crore development package for Nepal after talks with his Nepalese counterpart Balendra Shah. Seven MoUs were signed covering infrastructure, health, space, and urban development, aiming to strengthen bilateral ties.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144594"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144564"}], "importance": 8, "article_id": "d6cc3aa2"}, {"headline": "ED Summons 2 AAP MLAs in Land Probe", "summary": "The Enforcement Directorate has summoned two Punjab AAP MLAs, Amandeep Kaur Arora and Devinderjit Singh Ladi Dhos, along with family members and officials, in a probe into land acquisition for NH-754A.", "category": "India", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}], "importance": 6, "article_id": "9488d982"}, {"headline": "Darshan Case: Fourth Witness Turns Hostile", "summary": "In the Renukaswamy murder trial, key eyewitness Kiran turned hostile, claiming he did not recognize actor Darshan or other accused. This is the fourth witness to turn hostile in the ongoing case.", "category": "India", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}], "importance": 6, "article_id": "7a7de18d"}, {"headline": "Agra Forensic Lab Clears 800+ Blast Cases in 3 Months", "summary": "Scientists at Agra's Forensic Science Laboratory cleared over 800 bomb blast and explosives-related cases from UP and Uttarakhand in less than three months, working extra hours to clear a backlog before the facility's demolition.", "category": "Science", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144594"}], "importance": 5, "article_id": "9b30f297"}, {"headline": "Ukraine sinks Russian warship off Libyan coast in drone attack", "summary": "Ukraine's military claimed responsibility for sinking a Russian warship and another support vessel off the coast of Libya. The operation involved long-range maritime drones launched in response to Russian activities in the Mediterranean. This attack marks a significant expansion of the conflict’s geographic scop const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
