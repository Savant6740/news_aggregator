<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

ificant step in the growing competition among self-driving car companies like Waymo and Tesla.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "83a8dfaf"}, {"headline": "India frees up wheat exports to unlock overseas markets", "summary": "The Centre has allowed the export of wheat products, including atta, maida, and semolina, without any conditions or restrictions. This shift moves these products from the 'restricted' to the 'free' export category. The policy change aims to help Indian farmers tap into global markets following a record wheat harvest and sufficient domestic supply levels.", "category": "Economy", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "6f7607a5"}, {"headline": "Goyal urges Japanese firms to double presence by 2030", "summary": "Commerce and Industry Minister Piyush Goyal, during a visit to Japan, called on Japanese companies to double their investments and presence in India by 2030. Highlighting India's expanding economy and business-friendly reforms, he focused on deepening ties in manufacturing, semiconductors, and clean energy to strengthen resilient supply chains.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "523d0fc7"}, {"headline": "NSA Doval in Beijing for talks with Chinese FM", "summary": "National Security Adviser Ajit Doval arrived in Beijing for a two-day visit to participate in special representative talks on the India-China border issue. The high-level meeting with Chinese Foreign Minister Wang Yi comes amid speculation regarding a potential meeting between Prime Minister Modi and President Xi Jinping at the upcoming Brics summit.", "category": "Politics", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "cf8ff336"}, {"headline": "Govt eases medical device rules for EU-cleared items", "summary": "The health ministry has relaxed licensing norms for medical devices that have already received European Union certification. This move allows such devices to bypass certain domestic testing requirements, speeding up market access in India. The regulation aims to improve the availability of advanced medical technology while maintaining global quality standards.", "category": "Health", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "783eeb6d"}, {"headline": "Nomura sees India’s public markets and buyout appeal rising", "summary": "Financial services firm Nomura expects strong momentum in India's capital markets to continue, driven by a surge in qualified institutional placements and initial public offerings. The firm noted that global buyout funds are increasingly looking for opportunities in sectors like tech-enabled services, infrastructure, and healthcare as the Indian economy matures.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "973869e7"}, {"headline": "Plaud sees India outpacing global AI wearables growth", "summary": "Plaud, a US-based AI wearables firm, expects India to become one of its largest markets, with growth outstripping global averages. The company noted that India's smartwatch and fitness tracker market is expanding rapidly, and there is significant consumer interest in AI-integrated devices that enhance productivity and health monitoring.", "category": "Technology", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "f81bcda5"}, {"headline": "HC flags green concerns over Google-Adani data centre", "summary": "The Andhra Pradesh High Court has expressed concerns regarding the environmental clearance for a $1.5 billion data centre project in Visakhapatnam, a joint venture between Google and Adani. The court highlighted that the project site's proximity to protected areas and potential ecological impact must be thoroughly assessed before construction continues.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "c7dd9a2e"}, {"headline": "Canada rejected US tariff deal, faces high economic cost", "summary": "Canada has rejected a proposed trade deal from the US that would have avoided new tariffs but imposed strict quotas. Analysts warn this rejection could cost the Canadian economy billions and lead to significant job losses in manufacturing and agriculture. The standoff highlights growing protectionist tensions between the North American neighbors.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "e33bbd4f"}, {"headline": "Wall Street counts on Nvidia to keep AI rally going", "summary": "Investors are closely watching Nvidia's upcoming quarterly results, hoping the chipmaker's performance will sustain the ongoing bull run in technology stocks. As a primary beneficiary of the AI boom, Nvidia's guidance is seen as a bellwether for global demand for artificial intelligence infrastructure and the broader health of the tech sector.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "274c94a3"}, {"headline": "Dr Reddy’s: Seeking a new growth engine beyond generics", "summary": "Pharmaceutical major Dr Reddy’s Laboratories is shifting focus toward biosimilars and innovative drug discovery to counter declining margins in the US generic market. After a significant drop in Q1 profits, the company is betting on a pipeline of weight-loss drugs and specialized therapies to drive long-term growth and diversify its revenue streams.", "category": "Health", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "a3d29b2c"}, {"headline": "GIFT City insurance provides NRIs a dollar-denominated hedge", "summary": "New insurance products launched in GIFT City allow Non-Resident Indians to purchase policies denominated in US dollars. This provides a hedge against rupee depreciation for those with long-term financial commitments abroad. However, experts advise NRIs to weigh the benefits against higher premiums and specific tax implications under Indian law.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "0ed19ffe"}, {"headline": "PM-Setu designed to generate human capital for India", "summary": "The PM-Setu initiative aims to transform Industrial Training Institutes (ITIs) into high-quality human capital hubs for a 'Viksit Bharat'. By collaborating with industry leaders, the program focuses on providing advanced technical training in sectors like semiconductors, defense, and green energy to ensure the workforce is prepared for high-tech manufacturing.", "category": "Education", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "46d1b18a"}, {"headline": "India must acquire AI shield and sword for security", "summary": "National security experts emphasize that India must develop both defensive and offensive AI capabilities to protect its critical digital infrastructure. As AI-driven cyber threats grow more sophisticated, the country needs 'AI shields' to detect intrusions and 'AI swords' to deter hostile state and non-state actors in the global technological arena.", "category": "Science", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "c6bc9035"}, {"headline": "Can India crack the global smartphone brand game?", "summary": "Despite being one of the world's largest mobile phone manufacturers, India lacks a dominant homegrown global brand. The government's new incentive schemes aim to support local companies in design and R&D. Success depends on overcoming intense competition from Chinese brands and building consumer trust through innovation and consistent quality.", "category": "Technology", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "a2c27371"}, {"headline": "How globalization is evolving through services and tech", "summary": "Global trade is shifting from traditional merchandise to services and digital flows. While merchandise trade faces rising tariffs, cross-border integration continues through investments in strategic sectors like AI and green energy. Connector economies like India and Vietnam are playing a crucial role in reconfiguring global supply chains amid geopolitical tensions.", "category": "Economy", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135102", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 25-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135102"}], "article_id": "626cf8af"}, {"headline": "US puts Iran trade partners on notice", "summary": "US Treasury Secretary Scott Bessent announced a new round of sanctions against any entity facilitating money laundering for Iran. The US is prepared to sever financial ties with countries that continue to do business with the Islamic Republic. This move aims to increase economic pressure on Iran, with global markets already reacting to the potential trade disruptions.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "870ffc7a"}, {"headline": "Centre lifts wheat export restrictions", "summary": "The Union government has lifted restrictions on wheat exports, allowing traders to ship grain and flour freely after months of quota-based limits. The decision follows comfortable government stocks and eased food security concerns. However, high domestic prices may keep Indian wheat uncompetitive in most international markets despite the lifting of export bans.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "e8abe2b7"}, {"headline": "India faces deepening sugar shortage", "summary": "India's sugar production estimates have been repeatedly cut, leading to a potential supply crunch. Surging exports and lower-than-expected yields have pushed stocks toward a two-decade low. Experts warn that next year's crop faces significant weather risks, which could further worsen the supply deficit and lead to higher domestic prices.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "f90d7166"}, {"headline": "Officials clarify US envoy’s no questions remark", "summary": "The Ministry of External Affairs clarified that the lack of a press conference during recent diplomatic visits is standard practice for foreign leaders. The response came after comments from the US Ambassador regarding media interactions between Prime Minister Modi and President Trump. Officials stated that interactions are conducted according to mutually agreed protocols.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "09494393"}, {"headline": "Three infants die in Nagpur hospital fire", "summary": "A ventilator explosion sparked a fire in the Special Newborn Care Unit (SNCU) of a government hospital in Nagpur, Maharashtra. Three infants died in the incident, while 36 others were rescued. The state government has ordered a high-level probe into the cause of the blast and announced an audit of fire safety measures in healthcare facilities across the state.", "category": "Health", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "8cc80c3c"}, {"headline": "CRPF jawan injured in Manipur gunfight", "summary": "A CRPF jawan was injured during a gunfight between security forces and unidentified armed individuals in Manipur's Senapati district. The violence followed an arson attack where two houses belonging to different communities were set on fire. Security forces have been deployed in the area to restore order as tensions between local groups remain high.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "5e73d038"}, {"headline": "Karnataka draft electoral rolls show massive deletions", "summary": "The Election Commission of India has omitted 10.8 million electors, or 19.5% of the total, in the draft electoral roll for Karnataka. This follows a verification phase under the Special Intensive Revision. While some deletions are due to shifting or death, officials are investigating over 2 million discrepancies in the data to ensure roll accuracy.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "c01ea508"}, {"headline": "HC seeks Delhi government affidavit on aid", "summary": "The Delhi High Court has directed the state government to file an affidavit explaining the requirement for medical aid applicants to obtain endorsements from lawmakers. The court is hearing a plea challenging the objective criteria for aid eligibility under the Delhi Sahayata Yojana. The move seeks to ensure that political influence does not dictate medical assistance.", "category": "Law", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "629db104"}, {"headline": "SIA to probe 1998 Kashmiri Pandit massacre", "summary": "The Jammu and Kashmir State Investigation Agency has reopened the probe into the 1998 Wandhama massacre, where 23 Kashmiri Pandits were killed by terrorists. This is part of a wider effort to investigate cold cases involving targeted killings of the minority community. The SIA has conducted multiple raids as part of the renewed investigation into the 28-year-old case.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "0d2eb4d5"}, {"headline": "Elderly woman killed by SUV in Delhi", "summary": "A 71-year-old woman died and her husband was injured after they were hit by a speeding SUV in South Delhi's Kailash Colony. The driver of the vehicle has been arrested and booked for rash and negligent driving. The couple was out for a walk when the incident occurred near a metro station. Police are reviewing CCTV footage to confirm the sequence of events.", "category": "India", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "1a6164b7"}, {"headline": "SC censures authorities over monument maintenance", "summary": "The Supreme Court censured the MCD and ASI for the 'total callousness' in maintaining heritage monuments in Delhi. The court noted that many monuments are in a dilapidated state and have been encroached upon. It directed authorities to file a comprehensive report on the status of these structures and provide a timeline for restoration and protection efforts.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "025baa6d"}, {"headline": "Government proposes bundling airports for privatisation", "summary": "The Centre plans to group larger airports with smaller ones for privatization to ensure the financial viability of less profitable hubs. Five bundles have been identified, including airports in Amritsar, Varanasi, and Bhubaneswar. This model aims to use revenues from profitable airports to cross-subsidize infrastructure development at smaller regional facilities.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "a93a9e9e"}, {"headline": "Tamil Nadu scraps Parandur airport project", "summary": "Chief Minister MK Stalin announced that the proposed greenfield airport project at Parandur has been scrapped following years of intense local protests. The project, intended to handle 100 million passengers annually, faced opposition over land acquisition and environmental impact. The government will now look for alternate sites to meet Chennai's long-term aviation needs.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "dfa31e2e"}, {"headline": "Analyzing manufacturing’s role in Viksit Bharat", "summary": "A detailed analysis explores how manufacturing remains a missing link in India's path toward becoming a developed nation. Despite various government initiatives, the sector's contribution to GVA has remained stagnant. The report highlights critical issues such as falling demand in bank credit for big industry and a skewed growth in finance over traditional manufacturing.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "e6225ccf"}, {"headline": "Heavy rain causes flooding in Delhi-NCR", "summary": "Monsoon rain lashed the National Capital Region, causing widespread waterlogging and severe traffic congestion. Parts of Delhi received over 70mm of rainfall, leading to flight diversions and flooded arterial roads. The weather department predicts more showers in the coming days, prompting authorities to deploy additional pumps to clear water from low-lying areas.", "category": "Environment", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "14903c7d"}, {"headline": "Cockroach Janta Party calls for protest march", "summary": "The CJP has announced a peaceful protest march from India Gate to the Centre on September 5, citing unfulfilled government promises. The party claims that initial assurances given during student protests in Rajasthan and Haryana have not been met. Key demands include better educational infrastructure, improved midday meals, and recruitment reforms in state services.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "b27a1537"}, {"headline": "Putin assures India of steady energy supplies", "summary": "Russian President Vladimir Putin met with External Affairs Minister S. Jaishankar to discuss strengthening bilateral ties. Putin assured that Russia remains a reliable supplier of energy and fertilizers despite global supply chain challenges. The two leaders also discussed expanding trade to reach a target of $100 billion and collaborating on civil nuclear energy projects.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "50833703"}, {"headline": "US proposes new H-1B visa application fee", "summary": "The US government has proposed a new $103,265 fee for H-1B visa applications to curb mass filings by IT consulting firms. The move aims to prioritize high-skilled professionals and discourage 'gaming' of the lottery system. If implemented, the new fee structure would significantly impact Indian IT companies that heavily rely on the H-1B program to deploy staff in the US.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "bbe68c76"}, {"headline": "Supreme Court to hear plea on rebel MPs", "summary": "The Supreme Court will hear a petition by the TMC seeking a swift decision on the disqualification of two MPs who broke away from the party. The party alleges that the delay in deciding the disqualification proceedings violates the anti-defection law. The court's decision will have significant implications for party discipline and the rights of legislative members under the Constitution.", "category": "Law", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "11ab44be"}, {"headline": "Global ocean temperatures reach record high", "summary": "The Copernicus Climate Change Service reported that global average sea-surface temperatures hit a record high in August, surpassing previous records from 2024. Experts attribute this to ongoing climate change and the lingering effects of El Niño. Higher ocean temperatures are linked to more intense storms, bleaching of coral reefs, and disruptions in marine ecosystems worldwide.", "category": "Environment", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "9688786a"}, {"headline": "Jaiswal and Fernando fined for misconduct", "summary": "Indian opener Yashasvi Jaiswal and Sri Lankan pacer Asitha Fernando were fined 25% of their match fees for an on-field altercation during the second Test. The incident occurred after a verbal exchange escalated into physical proximity, violating the ICC's Code of Conduct. Both players received one demerit point on their records, with the match referee emphasizing the need for discipline.", "category": "Sports", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "8a3d1614"}, {"headline": "Centre to sell stake in Hindustan Copper", "summary": "The Indian government plans to sell up to a 6% stake in Hindustan Copper Ltd through an Offer for Sale (OFS). The stake sale is part of the government's disinvestment target for the current financial year. The base price has been set at a slight discount to the current market price, with the proceeds intended to fund infrastructure projects and reduce the fiscal deficit.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "95594e36"}, {"headline": "Britain shares classified missile tech with Ukraine", "summary": "The UK government has authorized MBDA to share classified technical information on SCALP missile components with Ukraine. This move is designed to help Ukraine develop its own long-range strike capabilities and reduce reliance on direct Western supplies. The collaboration focuses on local assembly and maintenance, providing a significant boost to Ukraine's domestic defense production.", "category": "World", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "d374d122"}, {"headline": "Bengaluru minister orders cleanup of vacant plots", "summary": "Karnataka Revenue Minister Krishna Byre Gowda has directed city officials to identify unmaintained vacant plots and issue notices to their owners. The drive aims to prevent these areas from becoming health hazards or dumping grounds. Owners who fail to clean their plots within 15 days will face fines, and the civic body will carry out the cleanup at the owners' expense.", "category": "Infrastructure", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "6a8313e2"}, {"headline": "Karnataka legislature adjourned three days early", "summary": "The Karnataka Assembly was adjourned sine die three days ahead of schedule amid persistent protests by the opposition BJP and JD(S). The opposition demanded a discussion on an alleged multi-crore land scam, which the government refused. Several key bills were passed without debate in the final hours, leading to criticism from opposition leaders over the lack of democratic scrutiny.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "a713b2cd"}, {"headline": "Demolition of Bengaluru’s Urvashi theatre begins", "summary": "Demolition work has started at the iconic Urvashi theatre in Bengaluru to make way for a modern commercial complex. The 56-year-old cinema hall was a landmark for film enthusiasts and known for its high-quality projection systems. Fans and locals gathered to see the structure being torn down, marking the end of an era for the city's single-screen cinema culture.", "category": "Infrastructure", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "8f4b89c7"}, {"headline": "Gangster arrested in Udupi murder case", "summary": "Karnataka police have arrested a suspected gangster from Maharashtra in connection with the murder of a local Congress leader in Udupi. The accused was apprehended after a brief chase and exchange of fire. Investigations reveal that the killing was a result of a personal rivalry over a land deal. Police are looking for other accomplices who may have helped the suspect escape.", "category": "India", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "ba20a256"}, {"headline": "HC says husband cannot dictate wife’s choices", "summary": "The Karnataka High Court ruled that a husband has no legal right to dictate his wife's life choices, including where she works or lives. The court dismissed a petition by a man seeking to compel his wife to live with him and leave her job. The judgment emphasized that marriage does not mean the surrender of an individual's autonomy and fundamental rights.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "2e547f0c"}, {"headline": "Cash found at deceased beggar’s home", "summary": "Police in Mandya found over ₹8 lakh in cash at the home of an elderly woman who had recently passed away after begging for years. The money, mostly in small denominations, was found hidden in various containers during a routine check by relatives. The local administration has taken charge of the funds and is looking for legal heirs to claim the inheritance.", "category": "India", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "e8b34b2d"}, {"headline": "Former Andhra minister held in liquor case", "summary": "Former YSRCP minister Karumuri Nageswara Rao has been sent to 14-day judicial custody in connection with an alleged liquor transportation scam. The Enforcement Directorate alleges that Rao was involved in illegal activities that caused a substantial loss to the state exchequer. The investigation focuses on irregularities in contracts awarded during his tenure as a minister.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "f059d365"}, {"headline": "Drug seizure at Chennai international airport", "summary": "Narcotics Control Bureau officials arrested an 80-year-old Kenyan woman at Chennai International Airport for carrying high-grade cocaine. The drugs, valued at several crores in the international market, were concealed in her luggage. The suspect had arrived from Bangkok and was planning to deliver the consignment to a local contact. Investigations are on to trace the supply network.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "95251fec"}, {"headline": "Building owner arrested after Hyderabad collapse", "summary": "Hyderabad police have arrested the owner of an under-construction building that collapsed, resulting in the death of two workers. The arrest follows an FIR registered for culpable homicide not amounting to murder. Preliminary reports suggest that the structure was being built without proper permits and used substandard materials. Several officials from the civic body are also under probe.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "e11ed59b"}, {"headline": "Rifle coach arrested in suicide pact case", "summary": "A rifle coach has been arrested in Kakinada, Andhra Pradesh, following the mass suicide of a panchayat official's family. The coach is accused of harassing the family and driving them to the extreme step over a financial dispute. Police are investigating his links to other similar cases in the region. The incident has prompted calls for stricter regulations on local moneylenders.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "cbcc7805"}, {"headline": "Actor Devan says TVK offered top post", "summary": "Former BJP leader and actor Devan claimed that he was offered the post of state vice-president in Vijay's Tamizhaga Vettri Kazhagam (TVK). Devan stated that while he was honored by the offer, he is yet to make a final decision on joining the party. TVK is currently expanding its base in Kerala and is looking to recruit established faces to lead its state unit.", "category": "Politics", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "f1a41520"}, {"headline": "Kerala CM protests railway jurisdiction transfer", "summary": "Chief Minister Pinarayi Vijayan has written to the Prime Minister protesting the decision to transfer the Mangaluru railway jurisdiction from the Southern Railway to another zone. The Kerala government argues that this move will adversely impact rail connectivity and development projects in the state's northern districts. Vijayan has requested the PM to reconsider the decision.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "d169c28f"}, {"headline": "Revanth Reddy slams Centre over US visit", "summary": "Telangana Chief Minister Revanth Reddy accused the Union government of political bias after he was denied permission to visit the US for an investment meet. Reddy claimed that similar visits by CMs from BJP-ruled states were cleared without delay. He stated that the denial of permission was a loss for the state's economy and an insult to the people of Telangana.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "694eb68c"}, {"headline": "D Raja urges Pinarayi Vijayan to be accommodative", "summary": "CPI General Secretary D Raja has called for more accommodation within the LDF in Kerala over the issue of the Deputy Leader of Opposition post. The disagreement between the CPI(M) and CPI has caused a minor rift in the ruling alliance. Raja stated that such issues should be resolved through dialogue to ensure the stability and unity of the front ahead of upcoming local polls.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "acacf35f"}, {"headline": "Bird hit incident at Patna airport", "summary": "An Air India flight arriving from Delhi suffered a bird hit during landing at Patna airport. The pilot managed to land the aircraft safely, and all 164 passengers on board were unharmed. Technical teams are inspecting the engine for damage before the aircraft can be cleared for its return flight. Airport authorities have stepped up measures to clear birds from the runway area.", "category": "India", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "955ceec4"}, {"headline": "Chidambaram slams One Nation One Election", "summary": "Senior Congress leader P. Chidambaram criticized the 'One Nation, One Election' proposal, calling it 'monstrous' and unconstitutional. He argued that it would undermine the basic structure of the Constitution and the federal system. Chidambaram claimed that the move is an attempt to centralize power and disadvantage regional parties by holding simultaneous polls across the country.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "79f0cb80"}, {"headline": "Yogi Adityanath advises Rahul Gandhi on texts", "summary": "Uttar Pradesh Chief Minister Yogi Adityanath advised Rahul Gandhi to study religious texts before making public comments on them. The remark followed Gandhi's recent statements regarding certain ancient scriptures. Adityanath stated that making ill-informed comments on religious heritage hurts the sentiments of millions and requested the Congress leader to be more responsible.", "category": "Politics", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "31983254"}, {"headline": "BJP leaders concerned over outreach program", "summary": "Internal reports suggest that some senior BJP leaders have expressed concern over the implementation of a new youth outreach program. The leaders worry that the program may be seen as a reactive measure rather than a genuine engagement. The party leadership is currently reviewing feedback to refine the program's messaging and ensure better resonance with young voters.", "category": "Politics", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "6d3f5f64"}, {"headline": "BJP directs cadre to renew voter connection", "summary": "The BJP has instructed its state units to launch a massive outreach drive to reconnect with voters at the booth level. The focus is on addressing local grievances and highlighting the achievements of central welfare schemes. Party workers have been told to emphasize 'door-to-door' engagement to counter opposition narratives ahead of the next round of state elections.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "523c0621"}, {"headline": "HC stays arrest warrant against Mahua Moitra", "summary": "The Calcutta High Court has stayed an arrest warrant issued against TMC MP Mahua Moitra in a defamation case filed by a local businessman. The court noted that the warrant was issued without giving the petitioner a fair chance to present her defense. The stay will remain in effect until the next hearing, providing temporary relief to the MP from potential police action.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "ebb06fde"}, {"headline": "Congress slams Centre over massive job vacancies", "summary": "The Congress party attacked the central government over reports of over 8 lakh vacant posts in various departments. Party leaders alleged that the government's failure to fill these vacancies has led to high unemployment and inefficiency in public services. They demanded an immediate recruitment drive and a transparent calendar for competitive examinations to fill the gaps.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "0d450b5f"}, {"headline": "States take school reform steps after protests", "summary": "Following recent student protests, several states including Rajasthan and Haryana have begun implementing reforms in school infrastructure and midday meal programs. New directives have been issued to ensure the quality of food and the maintenance of school buildings. Local committees have been formed to monitor these improvements and provide regular progress reports to the government.", "category": "Education", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "6ddb9017"}, {"headline": "SC seeks response on Jharkhand JPSC probe", "summary": "The Supreme Court has asked the Jharkhand government to respond to a petition seeking a CBI probe into alleged recruitment irregularities at the JPSC. The petitioners claim that several appointments were made through fraudulent means and favored candidates. The court has given the state four weeks to file its reply, noting the seriousness of the allegations.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "35958496"}, {"headline": "IAF to host second Tarang Shakti exercise", "summary": "The Indian Air Force will host the second phase of its largest multinational air exercise, 'Tarang Shakti,' in Jodhpur. The exercise will see participation from several global air forces, focusing on enhancing interoperability and tactical skills. It includes various complex air combat missions and is expected to strengthen India's defense ties with participating nations.", "category": "India", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "73a90a9b"}, {"headline": "SC rules on bail in serious cases", "summary": "The Supreme Court has ruled that overcrowding in prisons is not a sufficient reason to grant bail to convicts in serious criminal cases. The court emphasized that the nature of the crime and the impact on society must be the primary considerations for bail. It set aside a lower court order that had granted relief to a murder convict on the grounds of poor jail conditions.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "2e60fb66"}, {"headline": "Special Lok Adalat resolves 1,700 cases", "summary": "A three-day Special Lok Adalat held at the Supreme Court successfully resolved over 1,700 pending civil cases through mediation and conciliation. The initiative aimed to reduce the huge backlog of cases and provide quick justice to litigants. Judges and mediators worked overtime to facilitate settlements, and the success rate has prompted calls for more such events across the country.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "90e38d34"}, {"headline": "X removes posts containing activist’s address", "summary": "Social media platform X (formerly Twitter) informed the Delhi High Court that it has removed several posts that revealed activist Saurav Das’s personal home address. The court had earlier directed the platform to take action following a plea by Das, who cited safety concerns. X stated that it is committed to upholding user privacy and will take down similar infringing content.", "category": "Law", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "df923fd2"}, {"headline": "Search continues for missing seafarers off Odisha", "summary": "A large-scale search operation is underway by the Indian Coast Guard for 22 seafarers after their cargo ship sank off the Odisha coast. The vessel was carrying iron ore to China when it encountered rough weather. While some debris has been found, there is no sign of the crew members. The Navy has also deployed aircraft to assist in the search across a wide area of the Bay of Bengal.", "category": "India", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "a2cb28eb"}, {"headline": "SC refuses to hear Tejpal’s appeal", "summary": "The Supreme Court declined to list Tarun Tejpal’s appeal against his conviction in a sexual assault case until his surrender plea is decided. Tejpal has challenged the High Court order that upheld his conviction and 10-year prison sentence. The court stated that the established legal process must be followed, and the petitioner must first fulfill the surrender requirements.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "7375db14"}, {"headline": "NIA searches five locations in cyber case", "summary": "The National Investigation Agency (NIA) conducted searches at five locations in Maharashtra and Delhi as part of its investigation into a cyber-terrorism case. The case involves an attempt to target and hack several Indian government websites last year. NIA officials seized several digital devices and documents during the raids, which are being analyzed to trace the perpetrators.", "category": "India", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "3daf3946"}, {"headline": "SC seeks Centre’s reply on CSAM mechanism", "summary": "The Supreme Court has asked the central government for its stand on a petition seeking a dedicated mechanism to curb the spread of child sexual abuse material (CSAM) online. The plea suggests the formation of a special agency to monitor and remove such content. The court noted that this is a critical issue that requires a coordinated technological and legal response from the state.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "a4bc3309"}, {"headline": "SC bans construction near Jojari river", "summary": "The Supreme Court has banned all construction activity within 100 metres of the Jojari river in Jodhpur to prevent further environmental degradation. The court noted that unregulated development has led to the river becoming highly polluted. It directed local authorities to remove existing illegal structures and ensure that the buffer zone is protected from any future encroachment.", "category": "Environment", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135092"}], "article_id": "c91acf77"}, {"headline": "Fresh debris falls in Silkyara tunnel", "summary": "Construction work at the Silkyara-Barkot tunnel in Uttarakhand was temporarily halted after fresh debris fell inside the structure. Officials stated that no workers were injured in the incident, which occurred during minor excavation work. The tunnel, which previously saw a major collapse, remains under close observation by geological experts to ensure safety before work can resume.", "category": "Infrastructure", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135092", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁵⁰⁸²⁰²⁶.pdf", "page":     chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
