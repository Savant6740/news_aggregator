*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }

.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

ngaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "66171830"}, {"headline": "Hilsa fish spotted in Ganga in UP after decades of absence", "summary": "Scientists have spotted Hilsa fish in the Ganga river near Ghazipur in Uttar Pradesh, marking their return to the region after decades. The migration was previously cut off by the Farakka Barrage. The sighting is attributed to improved water flow and the construction of fish passes, potentially restoring a historical migration route.", "category": "Environment", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "f141412e"}, {"headline": "Drunk driver kills 70-year-old woman in Delhi luxury car crash", "summary": "A 70-year-old woman was killed and her family members were injured when a luxury sedan, allegedly driven by a drunk 27-year-old man, crashed into their vehicle in Delhi. The driver, the son of a Haryana Police sub-inspector, was arrested at the scene. Police found alcohol bottles in the vehicle and are investigating the high-speed impact.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "e797d38f"}, {"headline": "Jharkhand government fails to end student protests over exam irregularities", "summary": "Talks between the Jharkhand government and various student groups over alleged paper leaks and exam irregularities have ended in a deadlock. Protesters have refused to call off their stir until their demands for a thorough investigation and the cancellation of controversial exams conducted by the state commission are met.", "category": "Politics", "p ng education, leading the state Education Minister to order a probe into how the question was included in the competition.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "2f089eec"}, {"headline": "National Testing Agency creates new roles to prevent exam fraud", "summary": "Following recent paper leak controversies, the National Testing Agency (NTA) has created new specialized roles to monitor and probe exam-related frauds. These positions include experts in cybersecurity, intelligence, and forensic investigation. The move is part of a broader effort to restore the integrity of national competitive examinations.", "category": "Education", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "8783dfcf"}, {"headline": "Maharashtra government clears Rs 100 crore for Baramati airport upgrade", "summary": "The Maharashtra government has approved a Rs 100-crore project to upgrade the Baramati airport, including a new terminal and improved safety features. The move aims to enhance regional connectivity and support industrial activity. The project was fast-tracked following a high-level review by the Maharashtra Airport Development Company.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "bc85e797"}, {"headline": "Spain moves to replace ambassador to India following cultural controversy", "summary": "Spain has initiated the process to replace its ambassador to India, Jose Maria Ridao, following reports of disagreements over cultural events. The decision comes after a series of controversies involving the ambassador's management style and handling of diplomatic relations. Ridao is expected to be replaced within a few weeks.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "79b826ba"}, {"headline": "Death toll in Assam floods reaches 99 as thousands remain affected", "summary": "The death toll from the ongoing floods in Assam has risen to 99, with over 1.47 lakh people still displaced across multiple districts. While water levels in some rivers have started to recede, the state disaster management authority warned that many areas remain submerged. Relief operations continue as the government assesses property damage.", "category": "Environment", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "37ce17e3"}, {"headline": "Belgium reviewing extradition of fugitive businessman Mehul Choksi", "summary": "The Belgian government has confirmed that the extradition request for fugitive Indian businessman Mehul Choksi is still under review. Choksi is wanted in India for his alleged involvement in the multi-crore PNB fraud case. Indian authorities have been working with international agencies to secure his return since he fled the country in 2018.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/ 3306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "7dfd2697"}, {"headline": "Shuttler Ashmita Chaliha reaches her first BWF World Tour final", "summary": "Indian badminton player Ashmita Chaliha has reached her first BWF World Tour final at the Korea Masters. She defeated top-seeded players on her way to the final, marking a significant breakthrough. Chaliha's aggressive play and improved fitness have been key to her success, where she looks to secure her first major title.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133306", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁹⁰⁸²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133306"}], "article_id": "0a75f167"}, {"headline": "Arsenal sign midfielder Bruno Guimaraes for record £75 million fee", "summary": "English club Arsenal has signed midfielder Bruno Guimaraes from Newcastle United for a reported transfer fee of £75 million. The move is intended to strengthen the squad’s midfield as they prepare for a Premier League title challenge. The Brazilian international's arrival marks a significant investment in the club's quest for domestic and European silverware.", "category": "Sports", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "acbf8ba1"}, {"headline": "US moves to scrap 60-day H-1B worker grace period", "summary": "The US Department of Homeland Security has proposed a rule to eliminate the 60-day grace period for H-1B visa holders and other foreign professionals who lose their employment. Currently, workers have two months to find a new sponsor or prepare for departure. The move reverses a 2017 regulation and is intended to tighten controls on foreign temporary labor.", "category": "World", "page": 6, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "02e5e99e"}, {"headline": "US Senate passes bill to impose 100% tariffs on Russian oil", "summary": "The US Senate has passed a bipartisan bill authorizing a 100% tariff on Russian oil and natural gas imports to punish Russia for its continued invasion of Ukraine. The legislation aims to cut off a major revenue source for the Kremlin. The bill also targets oligarchs and 'shadow fleet' tankers used to bypass existing international sanctions.", "category": "World", "page": 6, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "87169b47"}, {"headline": "Canada deports record 3,323 Indians in first half of 2026", "summary": "Official data reveals that Canada deported 3,323 Indian nationals in the first six months of 2026, marking a record high. The deportations are largely attributed to non-compliance with immigration rules, including visa overstays, study permit violations, and fraudulent asylum claims. Indians now represent the largest nationality among those removed from the country.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "7ace8b2d"}, {"headline": "Bangladesh Home Minister accuses India of playing ‘Hasina card’", "summary": "The Home Minister of Bangladesh’s interim government, Asaduzzaman Khan, has accused India of 'playing the Hasina card' by hosting former Prime Minister Sheikh Hasina. He described the move as provocative and harmful to bilateral relations. Khan urged India to prioritize relations with the people of Bangladesh over individual political figures.", "category": "Politics", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "41bf1c27"}, {"headline": "Typhoon Dolphin cuts power to 50,000 buildings in South Japan", "summary": "Powerful Typhoon Dolphin has struck southern Japan, causing widespread power outages affecting over 50,000 buildings. The storm brought winds of up to 162 km/h and torrential rainfall, leading to localized flooding and landslides. Disaster management teams have been deployed, and residents in coastal areas have been urged to evacuate to higher ground.", "category": "Environment", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "27fd304d"}, {"headline": "Dozens of Nigerians freed after six months in jihadi captivity", "summary": "Nigerian security forces have rescued dozens of citizens who were held captive for six months by jihadi militants in the country's northern region. The group, including women and children, was found in a forest hideout during a coordinated military operation. Many of the survivors are suffering from severe malnutrition and are receiving medical attention.", "category": "World", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "43647b4f"}, {"headline": "Senegal charges 71 individuals in homosexuality crackdown", "summary": "Authorities in Senegal have charged 71 people following a crackdown on homosexuality, which remains a criminal offense in the West African nation. The suspects were arrested during raids on private residences and social gatherings. If convicted, they face up to five years in prison. Human rights groups have condemned the arrests as a violation of personal freedoms.", "category": "World", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "3d638749"}, {"headline": "Mac users in China gain access to Qwen AI service", "summary": "Apple has reportedly enabled Mac users in China to connect to Alibaba's Qwen AI service via a new system integration. The move follows regulatory requirements in China regarding AI services. It allows users to access advanced language model features directly through their operating system, marking a significant step for local AI adoption on international hardware.", "category": "Technology", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "6172034c"}, {"headline": "India’s stray dog sterilization programme faces integrity questions", "summary": "An investigation into India's Animal Birth Control (ABC) programme reveals potential systemic fraud and inflated sterilization figures. Critics argue that lack of centralized tracking allows contractors to claim payouts for fictitious surgeries. The report highlights instances of dogs previously 'sterilized' giving birth, undermining efforts to  the bathroom of her locked home 18 months after she went missing. Neighbors alerted police after a foul smell persisted despite the house being closed for over a year. Initial investigations suggest no signs of forced entry, but a forensic probe is underway to determine the cause of death.", "category": "India", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "bcd97002"}, {"headline": "India's education spending remains below Unesco's 15% benchmark", "summary": "Latest data shows that India's public expenditure on education stands at 14.2% of total government spending, failing to meet the Unesco-recommended benchmark of 15%. Although there has been a slight increase in the absolute budget, the share of GDP dedicated to education remains at 4.1%. Experts warn that this shortfall may hinder the achievement of Sustainable Development Goals by 2030.", "category": "Education", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "908c1f87"}, {"headline": "Tamil Nadu CM Stalin urges Centre to withdraw FCRA bill", "summary": "Tamil Nadu Chief Minister MK Stalin has written to the Prime Minister urging the withdrawal of the proposed amendments to the Foreign Contribution Regulation Act (FCRA). Stalin argued that the changes could unfairly target non-profit organizations and religious institutions involved in social welfare. He called for a comprehensive review and consultation with state governments.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "afa84dbf"}, {"headline": "Badal backs fresh delimitation push six years after NDA exit", "summary": "Sukhbir Singh Badal of the Shiromani Akali Dal has expressed support for the Centre's move to initiate a fresh delimitation of parliamentary and assembly constituencies. This comes six years after the party left the NDA alliance. Badal emphasized that the process must ensure fair representation for all states and suggested a significant increase in the total number of seats.", "category": "Politics", "page": 11, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "f8ad7956"}, {"headline": "Bengaluru police arrest 105 illegal immigrants in major crackdown", "summary": "In a large-scale operation named 'Operation Mukta,' Bengaluru police have detained 105 Bangladeshi nationals residing illegally in the city. The raids were conducted across multiple locations including Whitefield and Electronics City. Most of the detainees were found working in waste management and domestic labor without valid visas. Legal proceedings for deportation have begun.", "category": "India", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "ca7ff901"}, {"headline": "Indian crew thwarts pirate attack by locking themselves in citadel", "summary": "The captain and crew of an Indian-manned bulk carrier, Golden Arsenal, successfully thwarted a pirate attack in the Gulf of Aden by retreating to the ship's 'citadel.' The reinforced safe room allowed the crew to maintain control of the engines while awaiting naval assistance. An Indian Navy warship responded to the distress call, and the pirates eventually fled the vessel.", "category": "World", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "fc15ee3b"}, {"headline": "Prime Minister Modi addresses IIT convocation on India's future", "summary": "Addressing the convocation at IIT Delhi, Prime Minister Narendra Modi told graduates that they will shape India's development over the next 30 years. He urged the youth to lead a technological revolution in sectors like green energy, artificial intelligence, and semiconductors. The PM highlighted the role of premier institutions in making India a self-reliant global leader by 2047.", "category": "Education", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "04d61b83"}, {"headline": "IN-SPACe to privatize operations of Tamil Nadu spaceport", "summary": "The Indian National Space Promotion and Authorization Centre (IN-SPACe) has initiated the process to hand over the management and operations of the Small Satellite Launch Complex in Tamil Nadu to private entities. This move is part of the government’s policy to encourage private sector participation in the space industry, focusing on the global demand for small satellite launches.", "category": "Technology", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "126bce3b"}, {"headline": "Bengalur Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "d3f59d6b"}, {"headline": "Bengaluru woman sues Rapido after serious accident injuries", "summary": "A 32-year-old woman in Bengaluru has filed a legal notice against the bike-taxi aggregator Rapido after she sustained severe internal injuries during a ride. The victim, who required emergency surgery, alleges the driver was reckless. Rapido stated they are processing the insurance claim but emphasized that their liability is limited. The case highlights safety concerns in the gig economy.", "category": "Law", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "23e8b3ad"}, {"headline": "KSRTC adds 90 special buses for Onam festival travel", "summary": "Ahead of the Onam festival, the Karnataka State Road Transport Corporation (KSRTC) has announced the addition of 90 special bus services to various destinations in Kerala. The move aims to accommodate the heavy rush of travelers from Bengaluru to cities like Kochi, Thiruvananthapuram, and Kozhikode. Booking for these services has opened, with operations starting from August 21.", "category": "Infrastructure", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "5db11b98"}, {"headline": "Bengaluru civic body mandates tracking of animal waste disposal", "summary": "The Bruhat Bengaluru Mahanagara Palike (BBMP) has issued new guidelines making dia", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "721527f3"}, {"headline": "DK Shivakumar heads to Delhi for Karnataka cabinet rejig", "summary": "Karnataka Deputy CM DK Shivakumar is traveling to New Delhi to meet the Congress high command regarding a potential cabinet reshuffle. The talks are expected to address internal party grievances and the filling of vacant ministerial posts. The leadership aims to balance caste and regional representation ahead of the upcoming local body elections in the state.", "category": "Politics", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "9b211e68"}, {"headline": "Two KPSC staffers arrested in 'cash for government job' scam", "summary": "Police have arrested two employees of the Karnataka Public Service Commission (KPSC) for allegedly promising government jobs in exchange for money. The suspects were caught during a sting operation while accepting an initial payment from a candidate. Investigation has revealed a wider network involving middle-men who targeted aspirants for civil service and engineering posts.", "category": "Law", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "a0445d88"}, {"headline": "New Arunachal Pradesh map includes places illegally held by China", "summary": "The Indian government has released a revised map of Arunachal Pradesh that explicitly includes three areas currently under illegal Chinese occupation. The map, based on historical military data, reaffirms India's sovereignty over regions like Maja try", "summary": "An investigative report reveals the massive scale of the shadow economy fueled by stolen mobile phones in India. High-margin components like screens and motherboards are stripped and sold in local grey markets or smuggled across borders. Despite police crackdowns, the industry thrives on a sophisticated network of 'snatchers,' technicians, and international traffickers.", "category": "India", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "353c4ac1"}, {"headline": "EPFO's new IT system faces strain as claims pile up", "summary": "The Employees' Provident Fund Organisation (EPFO) is struggling with a massive backlog of claims following the rollout of its new centralized IT system. Technical glitches and server lag have led to delays in withdrawals and pension processing for millions of subscribers. Employees' unions have warned that the system is 'on the verge of collapse' unless immediate upgrades are made.", "category": "Economy", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133303", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 09-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/133303"}], "article_id": "d3da5d60"}, {"headline": "Seven killed as bus plunges into gorge in Himachal’s Chamba", "summary": "At least seven people were killed and 11 others injured when a private bus fell into a deep gorge in Himachal Pradesh’s Chamba district. The bus was traveling on a narrow mountain road when the driver reportedly lost control at a sharp turn. Rescue operations were hampered by difficult terrain. The state government has announced ex-gratia for the families of the deceased.", "category": "India", "page": 23, "importance": 7, "telegram_url": "https://t.me/c/18774 page": 1, "telegram_url": "https://t.me/c/1877410077/133257"}], "article_id": "4f300fd8"}, {"headline": "Retail investors prioritize quality over listing gains in recent IPO markets", "summary": "Retail participation in IPOs is turning lackluster as investors shift focus to company quality over quick listing gains. In July, only five of 12 issues saw double-digit retail oversubscription. Listing gains have averaged just 11% this year, a significant drop from 2026 levels. Experts suggest investors are now analyzing long-term prospects rather than chasing short-term flips.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "5d2480d4"}, {"headline": "Share of insured bank deposits falls below 40 percent in FY26", "summary": "The value of insured deposits as a ratio of total assessable deposits dropped to 39.7% in FY26, the lowest level since 1962. While 97% of total bank accounts remain fully protected, the growth in high-value deposits exceeding the ₹5 lakh insurance limit has reduced the overall coverage ratio. DICGC data shows a sharp turn from the post-Covid high of 50.9% recorded in 2020.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "b619c539"}, {"headline": "Foreign Portfolio Investors pump ₹12,290 crore into India in August", "summary": "Foreign Portfolio Investors (FPIs) remained net buyers in the first week of August, injecting ₹12,290.68 crore into Indian equity, debt, and hybrid markets. The equity segment alone saw inflows of ₹9,323.38 crore. Experts attribute this trend to better-than-expected Q1 earnings, cooling West Asian tensions, and a balanced RBI monetary policy stance, despite minor volatility.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "1c72b514"}, {"headline": "IOC Chairman announces Project Sprint 2.0 to transform retail and brand", "summary": "Indian Oil Corporation is launching Project Sprint 2.0 to enhance its retail business and brand image. The three-year initiative aims to strengthen its 1.07 lakh-odd fuel retail points, focusing on customer-centricity and operational efficiency. The project follows the first phase which helped the company save approximately ₹2,200 crore through strategic internal improvements.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "4fa397c4"}, {"headline": "EID Parry India stock shows strong long-term bullish reversal signals", "summary": "Technical analysis suggests a bullish outlook for EID Parry India, with the share price potentially reaching ₹1,400 in the long term. The stock has broken out of a long-term downtrend and is supported by the 55-month Moving Average. Traders are advised to accumulate on dips toward ₹760, with immediate resistance levels identified at ₹830 and ₹900-920.", "category": "Business", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "25d33be3"}, {"headline": "Security preparations underway at Red Fort for 80th Independence Day", "summary": "The Archaeological Survey of India has ordered the closure of the Red Fort to the public to facilitate security and logistical preparations for the upcoming 80th Independence Day celebrations. Prime Minister Narendra Modi is scheduled to lead the flag-hoisting ceremony and deliver the national address from the historic monument's ramparts on August 15.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "fc21a1f1"}, {"headline": "US Treasury yields rise amid ongoing West Asian geopolitical tensions", "summary": "US Treasury yields have reached their highest levels since 2007, with the 30-year yield hitting 5.28% and the 10-year yield touching 5.3%. The surge is attributed to rising oil prices driven by the Israel-Iran conflict and concerns over persistent inflation. Technical analysis suggests that yields may remain elevated as long as oil prices stay high, impacting global currency and equity markets.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "ab0949f4"}, {"headline": "Thematic funds show varied long-term performance compared to flexicap funds", "summary": "An analysis of rolling returns over two decades reveals that thematic funds are often tactical rather than long-term core holdings. While sectors like Technology and Healthcare delivered higher average 15-year rolling returns than the flexicap category, themes like Infrastructure and Commodities underperformed. Investors are advised to evaluate fund consistency and their own risk tolerance.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "4e44d8fd"}, {"headline": "Dhoot Transmission launches ₹3,067 crore IPO for business expansion", "summary": "Automotive wiring harness supplier Dhoot Transmission has opened its ₹3,067-crore IPO for subscription. The issue includes a fresh equity component of ₹1,400 crore and an offer for sale. The company, which holds a 58% market share in the 2W wiring harness segment, plans to use the proceeds to repay debt and fund general corporate purposes. The price band is set at ₹829-871.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "5cf40c15"}, {"headline": "Leap India eyes growth through asset-pooling and debt reduction plans", "summary": "Asset-pooling provider Leap India is entering the primary market with a ₹2,480-crore IPO. The company, which rents wooden pallets and containers to manufacturers, plans to use fresh issue proceeds of ₹480 crore to repay ₹360 crore of its existing debt. While the valuation is considered high at 43x FY26 earnings, the company benefits from a dominant 70% market share in organized pallet-pooling.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "d9a6ae5e"}, {"headline": "Global CEOs remain optimistic on India as a manufacturing hub", "summary": "Quarterly earnings calls from global giants like Cummins, Siemens Energy, and Kimberly-Clark highlight continued confidence in India's growth. Cummins reported 6% growth in India revenue, while Siemens Energy increased its stake in Siemens India. Executives cited India's strong demand, infrastructure development, and policy support as key drivers for their ongoing and future investments.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "50152678"}, {"headline": "Molbio Diagnostics IPO focuses on innovative point-of-care testing growth", "summary": "Med-tech firm Molbio Diagnostics is launching an IPO to raise ₹1,445 crore. Known for its Truenat PCR platform, the company provides diagnostic tests for 40 diseases across 90 countries. The IPO proceeds will fund R&D and capital expenditure. The company reports a CAGR of 31% in revenue and 40% in PAT over the last three years, with a strong focus on decentralized testing solutions.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "b2b25b18"}, {"headline": "Milky Mist IPO valued at ₹10,778 crore despite high valuation", "summary": "Value-added dairy firm Milky Mist is hitting the market with a ₹1,553-crore IPO. The company, dominant in the South Indian paneer and curd segments, plans to use ₹496.86 crore for debt repayment and ₹570.74 crore for modernizing its Erode facility. While analysts note the valuation is rich compared to peers, the company's strong brand and expansion plans offer significant growth prospects.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "b450647a"}, {"headline": "Derivatives outlook suggests bulls retain edge despite immediate hurdles", "summary": "The Nifty 50 and Nifty Bank indices showed resilience last week, but analysts warn of resistance at 24,750 and 58,000 levels. Foreign Institutional Investors have reduced their bearish bets, turning slightly less pessimistic. Technical indicators like the Put Call Ratio suggest a neutral-to-positive bias, but sustainable gains depend on a clear breakout above key resistance zones.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "4a5959da"}, {"headline": "Adani Energy Solutions bullish outlook supported by technical breakout", "summary": "Adani Energy Solutions exhibits a positive technical outlook with immediate support at ₹1,370 and ₹1,435. Analysts suggest that a close above ₹1,683 could ignite a fresh rally. Traders are utilizing bull call spread strategies to capitalize on the expected upward movement while managing risk. The stock's performance remains key to sentiment in the energy infrastructure segment.", "category": "Business", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "78e45d99"}, {"headline": "Midcap and Smallcap indices poised for further outperformance in August", "summary": "Technical analysis indicates that the Nifty Midcap 150 and Smallcap 250 indices are better positioned for gains than large-cap indices. The Midcap index has strong support at 23,200, with a potential rally toward 26,000. For the broader market, the Sensex and Nifty 50 are seen waiting for a trigger to break past current consolidation zones near 78,500 and 24,800 respectively.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "4b76d725"}, {"headline": "Automated ULIP strategies help de-risk retirement portfolios over time", "summary": "Unit-linked insurance plans (ULIPs) offering automated life-cycle based asset allocation are becoming popular for long-term goals like retirement. These strategies gradually shift investments from equity to debt as the policy matures, reducing the impact of market volatility near the goal date. Experts advise policyholders to understand the specific 'glide paths' used by different insurers.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "fb4d8e62"}, {"headline": "Parliament passes Tax Laws Amendment Bill to redefine UPI MDR", "summary": "The Parliament has passed the Tax Laws (Amendment) Bill, 2026, which gives the government power to define Merchant Discount Rate (MDR) for UPI transactions. This moves the authority from the Payment and Settlement Systems Act to the Income-tax Act. While the government currently subsidizes these costs, the amendment provides a legal framework for potential future fee structures.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "c63b2a6d"}, {"headline": "ISRO chief highlights perseverance as key to India's space success", "summary": "ISRO Chairman S. Somanath stated that India's evolution from launching foreign satellites to indigenously developed missions like Chandrayaan-3 is a story of national perseverance. Speaking at a graduation ceremony, he emphasized that space success requires shared purpose and teamwork. He noted that ISRO has successfully launched 434 foreign satellites on a commercial basis to date.", "category": "Science", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "3b0e71c9"}, {"headline": "India to launch digital dashboard for seafarer safety on August 15", "summary": "The Union Shipping Ministry will launch a beta version of the 'E-Samudra' digital dashboard on Independence Day to track Indian seafarers globally. The platform will enable constant monitoring and an effective response mechanism for seafarers in crisis. Shipping Minister Sarbananda Sonowal noted this is a step toward making maritime governance more transparent and seafarer-centric.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "42a64652"}, {"headline": "Shiprocket diversifies into new business segments ahead of planned IPO", "summary": "E-commerce enablement platform Shiprocket is expanding into checkout, advertising, and marketing services as it prepares for an IPO. These emerging businesses grew 65% last year and now contribute 25% of total revenue. The company aims to move from being a pure shipping provider to a comprehensive tech stack for small and medium businesses, supported by an $11 million investment in AI.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "f5bc9ced"}, {"headline": "Andhra Pradesh offers free land for mobile towers in remote areas", "summary": "The Andhra Pradesh government will provide rent-free land and subsidized power to telecom companies to install mobile towers in unserved villages. This initiative aims to bridge the digital divide and ensure 100% connectivity. The subsidy will be reviewed every three years, and the policy includes provisions for intra-circle roaming to maximize coverage in low-density areas.", "category": "Infrastructure", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "1790f16b"}, {"headline": "FSSAI crackdowns on food brands for serious safety violations", "summary": "The Food Safety and Standards Authority of India (FSSAI) has suspended the licenses of Chheda Specialities Foods and VKC Nuts following inspections. Violations included unhygienic manufacturing conditions, presence of pests, and use of moldy raw materials. The regulator reported that some units scored as low as 38% on compliance audits, posing a significant risk to public health.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133265", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_09-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133265"}], "article_id": "7426d7b0"}, {"headline": "European Central Bank signals interest rate pause", "summary": "The European Central Bank has hinted at a potential pause in its interest rate hikes, suggesting a shift in monetary policy stance due to slowing economic activity." const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

}
const sortedCats = Object.keys(byCategory).sort(

);

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

    panel.className = 'cat-panel';

    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
