<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

const DIGEST = {"date": "08 September 2026", "articles": [{"headline": "SC rejects Aravalli panel request to extend report deadline", "summary": "CJI Surya Kant rejected a high-powered committee's request for an extension until February 2027 to define the Aravalli hills and range. The court ordered the panel to submit its final report by November 30, 2026, to prevent delays beyond the CJI's tenure. The panel is examining ecological, hydrological, and biodiversity data to establish a uniform definition for the fragile landscape.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "528ecc15"}, {"headline": "DAC clears Rs 1.1 lakh crore proposals for defence boost", "summary": "The Defence Acquisition Council approved military procurement worth Rs 1.1 lakh crore. Key projects include integrating Russian RVV BD long-range missiles with Su-30 fighters, Arudhra radars for the Navy, and CBRN recce vehicles for the Army. Around 98% of the procurements will be sourced from Indian industry to promote self-reliance in the defence manufacturing sector.", "category": "India", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "ce8e13ea"}, {"headline": "Manipur musician killed in Delhi for objecting to noise", "summary": "A 54-year-old Manipuri guitarist was allegedly assaulted and killed by a group of eight people in south-east Delhi’s Kilokari village. The victim had objected to a commotion the group was creating near his home late Sunday night. Police have launched an investigation into the incident, which occurred outside his flat.", "category": "India", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "adaf9ea5"}, {"headline": "Bengal reduces Durga Puja grant and bans DJs during festivities", "summary": "The BJP government in West Bengal slashed the grant for Durga Puja committees from Rs 1.10 lakh to Rs 1 lakh. Chief Minister Suvendu Adhikari also announced a total ban on DJs and the closure of liquor outlets on Maha Ashtami. Large-budget committees were urged to decline government aid, while fire department fees and electricity charges for the festivities were waived.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "5cdd0571"}, {"headline": "High Court orders Noida DM to pay compensation over NSA", "summary": "The Allahabad High Court quashed the detention of student activist Akriti Chaudhary under the National Security Act, describing the procedure as a 'sham'. The court ordered the Gautam Buddha Nagar DM to pay Rs 5 lakh from her salary as compensation. The bench criticized bureaucratic overreach and reminded officials that their primary loyalty is to the Constitution.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "e798a7da"}, {"headline": "Drone sightings suspend flight operations at Amritsar airport", "summary": "Flight operations at Amritsar airport were halted for over an hour on Sunday night after the IAF flagged drone activity. Seven aircraft were diverted to Delhi and Chandigarh during the suspension. An FIR has been registered against unknown individuals. Preliminary inquiries suggest the drones might be linked to a kabaddi tournament in a nearby village.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "deb3a2ee"}, {"headline": "Bypolls for five assembly and one LS seat on October 6", "summary": "The Election Commission announced bypolls for assembly seats in Tamil Nadu, Puducherry, and West Bengal, and one Lok Sabha seat in Assam. Polling is scheduled for October 6, with counting on October 9. The vacancies arose due to resignations by sitting legislators, including BJP's Suvendu Adhikari from the Nandigram seat.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "a3332ee7"}, {"headline": "Far-right AfD wins historic victory in German state election", "summary": "The Alternative for Germany (AfD) secured 43.8% of the vote in Saxony-Anhalt, significantly leading over the conservative CDU at 17.2%. This marks the first time a far-right party has gained such dominance in a German state since WWII. Mainstream parties are struggling to maintain a 'firewall' to prevent the anti-immigrant group from entering power.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "f943808b"}, {"headline": "Twelve pilgrims killed as pickup vehicle overturns in UP", "summary": "At least 12 people died and 16 were injured when a pickup vehicle carrying 32 devotees hit a divider and overturned on the Eastern Peripheral Expressway in Baghpat. The victims were returning from a pilgrimage in Rajasthan. The Uttar Pradesh government announced compensation of Rs 2 lakh for the families of the deceased and Rs 50,000 for the injured.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "948ae101"}, {"headline": "Vietnam emerges as key winner of China plus one strategy", "summary": "Vietnam became the largest exporter to the US in the first half of 2026, gaining significant market share in furniture, footwear, and apparel as US trade diverted from China. While India made gains in electrical machinery and iron articles, Vietnam's success was broader across labor-intensive sectors. Data shows Vietnam maintains deep trade ties with China for intermediate goods.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "c69bb76c"}, {"headline": "Delhi NCR to add 55 new air quality monitoring stations", "summary": "The air quality monitoring network in Delhi-NCR will expand from 102 to 157 stations by the end of 2026. Officials aim to make the data network denser to better track pollution levels. The move comes as part of ongoing efforts to manage ambient air quality across cities in Uttar Pradesh, Haryana, and Rajasthan.", "category": "Environment", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "ef926811"}, {"headline": "Satya Niketan collapse: Building owner arrested after seven die", "summary": "Police arrested Hariram Bansal and his family after a five-storey building housing DU students collapsed in Satya Niketan, killing seven. The FIR states the owner added four illegal floors and conducted unsafe renovations. Five MCD officials were suspended following the tragedy. Rescuers worked through the night to pull victims, including five students, from the rubble.", "category": "India", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "31d5ea09"}, {"headline": "Alternative fuel vehicles outsell petrol cars for first time", "summary": "In August, alternative-fuel passenger vehicles (CNG, hybrid, and electric) accounted for 42% of sales in India, surpassing petrol models at 41%. The shift is attributed to rising oil prices and consumer concerns over higher ethanol content in petrol. Total automobile retail sales rose 17.5% year-on-year to a record 2.4 million units in August.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "b22aab2d"}, {"headline": "Manipur to use 1951 as base year for NRC exercise", "summary": "Manipur Home Minister Govindas Konthoujam announced that 1951 will be the base year for the National Register of Citizens (NRC). The government detected 24,475 undocumented immigrants, with nearly 15,000 pushed back to Myanmar. The state assembly reaffirmed its resolution to push for the NRC despite opposition from Kuki-Zo communities.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "62568965"}, {"headline": "UK recognises India's carbon credit scheme under CBAM", "summary": "The UK has formally accepted India’s Carbon Credit Trading Scheme (CCTS) as a qualifying carbon-pricing mechanism. This recognition allows Indian exporters of steel, aluminium, and cement to seek carbon-tax relief under the UK's Carbon Border Adjustment Mechanism. The decision follows the operationalization of the India-UK trade agreement in July.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "25f9251b"}, {"headline": "King Charles confirms Harry and Meghan are private citizens", "summary": "Buckingham Palace issued a letter confirming that Prince Harry and Meghan remain non-working members of the Royal Family following their return to the UK. The King authorized the message, stating their charitable and commercial interests are private matters. The couple moved to the US in 2020 after stepping down from official duties.", "category": "World", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "ea6be3b3"}, {"headline": "Eiffel Tower closed after staff protest over religious visit", "summary": "The Eiffel Tower was shut down on Monday due to a strike by staff protesting the treatment of female employees during a visit by a Hindu religious group. Workers alleged that professional instructions led to women being 'sidelined' at the request of the BAPS spiritual movement delegation. The operating company, SETE, admitted the conditions should not have been accepted.", "category": "World", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "bc8c34fa"}, {"headline": "Five killed in Amazon Prime Air cargo plane crash", "summary": "An Amazon Prime Air cargo plane crashed into vehicles and caught fire after overrunning a runway at Miami International Airport, killing five people. Three others remain in critical condition. Aviation experts are investigating whether strong winds or pilot error contributed to the 32-year-old Boeing 767 failing to stop within the 9,000-foot runway.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "8500568a"}, {"headline": "AI lung drug shows potential to reverse biological aging", "summary": "An experimental lung disease drug developed using AI, rentosertib, showed promise in reducing biological age in a mid-stage study. Patients taking the drug saw their biological age drop by as much as six years across various chemical body clocks. While results are early, the study by Insilico Medicine suggests broader potential for anti-aging treatments.", "category": "Health", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "10044992"}, {"headline": "Electoral roll flaws: 61-year-old man listed as dead in Mangaluru", "summary": "During the special intensive revision of electoral rolls in Karnataka, a 61-year-old man in Mangaluru discovered he was listed in the 'dead' category. Over 4.3 million voters have received notices regarding discrepancies. Many citizens reported technical hurdles and server errors while trying to rectify errors in the draft electoral roll.", "category": "Politics", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "a512cd00"}, {"headline": "ED questions Nagendra in Valmiki Corporation money laundering case", "summary": "The Enforcement Directorate recorded the statement of former Karnataka minister B Nagendra regarding the alleged misappropriation of funds from the Valmiki Corporation. The 54-year-old MLA resigned in August following opposition pressure. The probe is linked to a CBI chargesheet regarding financial irregularities in the ST development corporation.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "030b26fc"}, {"headline": "Siddaramaiah holds AHINDA meet as key leaders skip event", "summary": "Former Karnataka CM Siddaramaiah presided over a gathering of AHINDA leaders at Palace Grounds, calling for 75% reservation for backward classes and Dalits. However, prominent ministers Satish Jarkiholi and BZ Zameer Ahmed Khan skipped the event. Siddaramaiah also announced he will not contest the 2028 assembly elections due to age and high election costs.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "341636b4"}, {"headline": "Bengaluru Space Expo opens with focus on lunar missions", "summary": "The 9th Bengaluru Space Expo 2026 opened with US Ambassador Sergio Gor inviting India to join NASA's Moon Base programme. ISRO Chairman V Narayanan addressed concerns regarding space sector privatization, stating that 80% of ISRO's budget is invested through Indian industries. The US-India partnership aims to expand cooperation in human spaceflight and lunar exploration.", "category": "Science", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "2e6b9bfe"}, {"headline": "Karnataka proposes 7.5% quota for rural govt school students", "summary": "The Karnataka government has drafted rules to reserve 7.5% of government seats in professional courses for rural students from government schools. An additional 7.5% horizontal reservation is proposed for students from other rural institutions. The move aims to support candidates who studied from Class 1 to 10 in rural areas of the state.", "category": "Education", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "4029eb25"}, {"headline": "TN CM Vijay slams DMK over corruption and lawlessness", "summary": "Tamil Nadu CM C Joseph Vijay attacked the opposition DMK in the Assembly, citing ED documents to allege 'scientific corruption' during their previous regime. Vijay accused former CM M K Stalin and Udhayanidhi Stalin of being beneficiaries of party funds collected through TASMAC shops. The DMK staged a walk-out after being denied a response by the Speaker.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "d5c99be4"}, {"headline": "DVAC FIR names DMK leader KN Nehru in bribery fraud", "summary": "The Directorate of Vigilance and Anti-Corruption registered an FIR against DMK leader KN Nehru and his brothers for alleged tender manipulation involving Rs 1,020 crore. The investigation covers irregularities between 2021 and 2025. Nehru claimed the searches found no evidence, while the opposition called the raids a politically motivated attempt to intimidate.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "44f4f088"}, {"headline": "BRS MLAs clash with police at Telangana assembly session", "summary": "The Telangana monsoon session began with scuffles as BRS lawmakers were prevented from entering the assembly wearing protest T-shirts. BRS leaders KT Rama Rao and Harish Rao alleged police highhandedness and injuries to women legislators. CM Revanth Reddy condemned the BRS behavior as an insult to the state, while police defended their actions citing speaker directions.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "af97f2a2"}, {"headline": "Keralam CM seeks NH-66 safety review after tragic accident", "summary": "Keralam CM V D Satheesan wrote to Union Minister Nitin Gadkari requesting an independent safety review of NH-66. The appeal follows a road accident in Thrissur that killed eight students from Tamil Nadu. The CM raised concerns about illegal parking and unscientific construction zones along the ude a Rs 20,703 crore section of the Western Dedicated Freight Corridor and new railway lines. The PM will also flag off a passenger train to Tanda Road and inaugurate highway projects between Vadodara and Surat.", "category": "Infrastructure", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "667b4f7e"}, {"headline": "Supreme Court warns against roaming free after assaulting doctors", "summary": "The Supreme Court stated that individuals who assault medical staff do not deserve to be free, as it heard a plea involving a Maharashtra corporator. The bench noted a propensity for such violence and issued notice on an appeal against the bail of the accused. The court emphasized the need for a deterrent message to protect health professionals.", "category": "Law", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "a5003a85"}, {"headline": "Lucknow tops Swachh Vayu rankings for cutting PM10 levels", "summary": "Lucknow ranked first among cities with over one million population in the Swachh Vayu Sarvekshan 2026. The city achieved a 46.4% reduction in PM10 levels compared to the 2017-18 baseline. Measures including Miyawaki forests and road repairs contributed to the score. Rourkela and Kalinga Nagar topped other population categories in the air quality rankings.", "category": "Environment", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "d87321d8"}, {"headline": "EOS-05 satellite successfully reaches final geostationary orbit", "summary": "ISRO's EOS-05 Earth observation satellite completed its final orbit-raising maneuver, reaching a height of 35,786 km. Launched via GSLV-F17, the 2,367-kg satellite will provide strategic data and monitor the region for at least seven years. The success marks a recovery for the GSLV program following a 2021 mission failure.", "category": "Science", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "779bb6a4"}, {"headline": "Over 2.9 million people affected by floods in Bihar", "summary": "Floods have impacted 2.9 million people across 13 districts in Bihar due to overflowing rivers, including the Ganga. CM Samrat Choudhary inspected relief camps in Vaishali and Saran, where 190 community kitchens are operational. The government deployed over 1,400 boats for rescue. Downstream areas are on high alert as the Ganga reached record flood levels.", "category": "Environment", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "5564bbc9"}, {"headline": "Indus Waters Treaty remains fully in force, rules Hague Court", "summary": "The Court of Arbitration at The Hague ruled that the Indus Waters Treaty remains fully operative despite India's attempt to hold it in abeyance. The court issued a limited interim order on the Ratle project, restricting certain construction levels until a technical expert's decision. India did not participate in the proceedings, rejecting the court's jurisdiction.", "category": "Law", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "dcb0636e"}, {"headline": "RBI mops up Rs 6 lakh crore to absorb excess liquidity", "summary": "The Reserve Bank of India conducted two variable rate reverse repo auctions to absorb over Rs 6 lakh crore from the banking system. Despite surplus liquidity of Rs 11.16 lakh crore, the 30-day auction saw a tepid response, while the overnight auction was more successful. The move aims to manage the flood of funds following large special deposit inflows.", "category": "Economy", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "c223952c"}, {"headline": "Jaguar Land Rover to cut 4,000 jobs global workforce", "summary": "Luxury carmaker Jaguar Land Rover announced it will eliminate approximately 4,000 roles over the next two years to reduce costs. The decision follows intense competition from Chinese manufacturers and a necessary shift toward electric vehicle investment. The cuts represent about 10% of JLR's global staff, primarily affecting its UK-based employees.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "c6994d9e"}, {"headline": "Magnus Carlsen beats Viswanathan Anand in Global Chess League", "summary": "In a highly anticipated rematch at the Global Chess League in Bengaluru, Magnus Carlsen defeated old rival Viswanathan Anand after the latter ran out of time. Despite the win, Carlsen described his overall performance as 'underwhelming' after later being held to a draw by rising Uzbek star Javokhir Sindarov. PBG Alaskan Knights currently lead the league standings.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "19b0f8bc"}, {"headline": "Kimi Antonelli wins Monza GP from 19th on the grid", "summary": "Twenty-year-old Kimi Antonelli ended Italy's 60-year home Grand Prix drought by winning at Monza after starting from 19th place. Antonelli navigated through multiple restarts and a red flag to overtake Mercedes teammate George Russell in the final laps. He now holds the record for the most wins by an Italian driver in F1 since Alberto Ascari.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "aaef9d1c"}, {"headline": "One-handed backhand 149-year Slam semi-final streak ends", "summary": "For the first time since 1877, no men's singles player with a one-handed backhand will feature in a Grand Slam semi-final. The streak ended at the US Open after Stefanos Tsitsipas lost in the fourth round to Ben Shelton. Modern tennis conditions, including slower courts and heavier balls, have contributed to the decline of the stroke in favor of the two-hander.", "category": "Sports", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "5dc3a3ac"}, {"headline": "Ishan Kishan scores 270 in Duleep Trophy final", "summary": "Ishan Kishan hit 270 runs for East Zone against South Zone, the second-highest score in a Duleep Trophy final. His innings, lasting over 300 balls, included 27 fours and seven sixes. Kishan's performance helped East Zone reach a massive total of 708. The knock is seen as a strong statement of intent regarding his future in first-class cricket.", "category": "Sports", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136679", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 08-09.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/136679"}], "article_id": "9ba0ec87"}], "newspapers": ["Hindustan Times", "Times of India", "Economic Times", "Business Standard", "Financial Express", "Business Line", "Mint", "The Hindu", "Indian Express"], "total_articles": 42};

    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
