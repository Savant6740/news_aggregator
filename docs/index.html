<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

const DIGEST = {"date": "19 November 2026", "articles": [{"headline": "Investor Interest Reignited in Electric Two-Wheeler Startups", "summary": "Record adoption and sharp oil price increases have sparked a funding frenzy for electric two-wheeler startups. Zeno is in talks for $35-40 million, while others like River Mobility and Ultraviolette have recently secured large rounds. Investors view the sector as having crossed the adoption threshold, making fundraising easier than in previous years.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "692b2d68"}, {"headline": "India Joins EAS Nations to Tackle Transnational Cybercrime", "summary": "India has partnered with East Asia Summit members, including the US, China, and Russia, to combat online scams, money laundering, and human trafficking. The joint statement calls for intelligence-sharing and faster recovery of criminal proceeds. PM Modi proposed hosting an EAS Cyber Crime Conference at India's National Forensic Sciences University.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "d7a86314"}, {"headline": "Xi Jinping Meets Trump in Rare Shenzhen Airport Arrival Greeting", "summary": "In a rare diplomatic gesture, Chinese President Xi Jinping personally greeted US President Donald Trump at Shenzhen Airport. This is the first time in nearly 50 years a Chinese leader has met a visiting dignitary at the airport. The meeting occurs amid rising tensions over US curbs on China's access to high-end artificial intelligence technology.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "1cd08cbf"}, {"headline": "Old Monk Maker’s Revenue Halves Following Sales Restrictions", "summary": "Mohan Meakin, the maker of Old Monk, reported a 64% revenue decline in H1 after food safety authorities halted sales of three variants in Maharashtra. Regulators questioned the classification of the products as standard rum. The company withdrew a court challenge and plans to submit revised labels to FSSAI to resume operations at its Khopoli plant.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "d544e6f7"}, {"headline": "SpiceJet Cancels Over 50% of Flights Daily Amid Cash Crunch", "summary": "SpiceJet is operating only about 15 of its 66 scheduled daily flights as a severe cash crunch forces the grounding of many aircraft. Despite the disruptions, the DGCA has not restricted the airline from taking forward bookings. The airline's board has approved raising up to Rs 5,500 crore, but executives warn that sustained operations require immediate funds.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "be4e145d"}, {"headline": "Tata Sons Board to Discuss Mandatory Listing and RBI Compliance", "summary": "Tata Sons will hold a board meeting on November 26 to address the RBI's mandate for the core investment company to list by 2026. Tensions remain between the holding company and Tata Trusts over staying private. The board will also review a presentation by Air India CEO Tewolde Gebremariam regarding the airline’s ongoing transformation and losses.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "4d5058b0"}, {"headline": "Niche Consumer Companies Plan Rs 10,000-12,000 Crore December IPOs", "summary": "A diverse group of niche consumer firms, including Foodlink, Jerai Fitness, and Nobel Hygiene, are set to launch IPOs next month. Collectively seeking up to Rs 12,000 crore, these companies represent a record year for primary markets. Investors are showing increased interest in specialized segments like luxury catering, commercial gym equipment, and wellness.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "8ee61b97"}, {"headline": "Ind AS Amendments to Ease Hyperinflationary Currency Conversions", "summary": "The Ministry of Corporate Affairs is likely to amend Indian Accounting Standard 21 to simplify how companies convert financial statements from hyperinflationary economies. Effective April 2027, the rules will require using the exchange rate at the reporting date for all items. The move aims to align Indian rules with international standards and ensure consistency.", "category": "Economy", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "c77311d1"}, {"headline": "ONGC to Ramp Up Deepwater Exploration as Mature Output Falls", "summary": "ONGC plans to drill 13 exploratory wells in FY28, up from four this year, to counter a 6-8% natural production decline in mature fields. The focus is on deep and ultra-deepwater blocks under the Samudra Manthan initiative. High drilling costs and rig shortages remain challenges, with the company recently awarding contracts for specialized drillships.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "480b608e"}, {"headline": "Centre to Frame Selection Criteria for Sovereign Cloud Hosting", "summary": "The government is developing tighter guidelines for hosting un-anonymized citizen data on cloud platforms to prevent cyber threats. Ministry of Electronics and IT officials are holding industry dialogues to establish selection criteria for sovereign cloud providers. The rules aim to ensure secure hosting for government systems containing personal citizen data.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "ec144f34"}, {"headline": "US Billionaire’s Ivanhoe Atlantic Signs Mining Deal with Pakistan", "summary": "Robert Friedland’s Ivanhoe Atlantic has signed a MoU with Pakistan’s Mari Minerals for greenfield exploration in Balochistan. The deal has raised red flags due to Friedland’s ties with Chinese state-owned entities CITIC and Zijin Mining. Mari Minerals is linked to the Pakistan military-run Fauji Foundation, which maintains deep commercial ties with Chinese firms.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "f80fef48"}, {"headline": "NIA Arrests KZF Supporter Thikriwal After US Deportation", "summary": "The National Investigation Agency arrested Surinder Singh, alias Thikriwal, at IGI Airport following his deportation from the US. Thikriwal is a supporter of the Khalistan Zindabad Force and is accused of involvement in a 2026 blast on a railway line in Punjab. He allegedly posted social media content glorifying the terror incident to disrupt communal harmony.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "47dcdadf"}, {"headline": "SC Issues Notice on Plea Against Political Protests in Delhi", "summary": "The Supreme Court has issued notices to the Cockroach Janta Party, Congress, AAP, and AISA following a petition by Delhi traders. The traders allege that political demonstrations in the capital last month disrupted commercial activities and caused significant financial losses. The plea seeks court intervention to protect the right to carry on trade and business.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "c20454d2"}, {"headline": "Court Seeks Report on Sonia Gandhi Voter List Complaint", "summary": "A Delhi court has directed the police to submit an action-taken report regarding a complaint against Sonia Gandhi. The complaint alleges her name appeared on the New Delhi electoral rolls in 1980, three years before she acquired Indian citizenship in 1983. The court has requested original attested copies of the electoral records for further consideration.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "484f0e65"}, {"headline": "Bengaluru Leads India in AI Startup Funding and Unicorns", "summary": "A report by the Karnataka government reveals Bengaluru accounts for 36.3% of India's AI startup funding and 71% of AI unicorns created since 2023. The city has produced 57 unicorns valued at $211 billion. Bengaluru startups reach 'soonicorn' status in about five years, the fastest in the country, with significant growth in deep-tech and women-led ventures.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "7c386f21"}, {"headline": "Karnataka Plans 1,000-Acre Startup Park Near Bengaluru", "summary": "The Karnataka government will develop a 1,000-acre model startup park near Bengaluru and a 100-200-acre park in Hubballi-Dharwad. Industries minister MB Patil said the move aims to counter rising land costs and encourage manufacturing. The state is also considering an additional 5% subsidy for startups setting up operations outside the capital city.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "e8dfb708"}, {"headline": "Karnataka Flags Excess Ethanol in Petrol, Urges Policy Review", "summary": "Karnataka has urged the Centre to review the E20 ethanol-blending program after state inspections found ethanol levels up to 31%, exceeding the 20% limit. The state government claims these variations indicate non-compliance by retailers and harm consumer interests. The letter also highlighted concerns regarding the quality and composition of premium petrol.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "293dd565"}, {"headline": "BJP Slams Rahul Gandhi for Defaming India Abroad", "summary": "The BJP labeled Rahul Gandhi 'immature' and 'anti-India' following his remarks on the economy at Columbia University. Spokesperson Gaurav Bhatia accused Gandhi of a 'sinister design' to destabilize Indian democracy through baseless remarks on foreign soil. Union Minister Prahlad Joshi added that Gandhi's foreign trips are often used for anti-India propaganda.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "23a811af"}, {"headline": "Putin Pushes for Russia-India EAEU Trade Agreement", "summary": "Russian President Vladimir Putin is advocating to fast-track a free trade agreement between India and the Eurasian Economic Union. Speaking at the APEC Summit, Putin highlighted Asia-Pacific as the global economic driver. Bilateral trade between India and Russia reached $55 billion in the first eight months of 2026, on track to hit a $100 billion target by 2030.", "category": "World", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "318ae496"}, {"headline": "Darjeeling Tea Industry Struggles as Production and Exports Fall", "summary": "Darjeeling tea production has plummeted from 14.49 million kg in 1990 to 5.6 million kg in 2025. The industry is struggling with aging bushes, climate change, and competition from cheaper Nepalese tea, which now sees 11.7 million kg imported into India. Experts warn the 'Champagne of teas' faces a survival crisis unless Nepalese imports are restricted.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "1568645f"}, {"headline": "Disney’s Share of JioStar Loss Narrows to $158 Million", "summary": "The Walt Disney Company reported its equity loss from JioStar India narrowed by 22% to $158 million in fiscal 2026. The reduction is attributed to improved performance in the fourth quarter. JioStar, a joint venture between Disney and Reliance Industries, was formed following the merger of Viacom18 into Star India. Reliance continues to hold a controlling stake.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "d6666fa0"}, {"headline": "Companies Fear Escalating AI-Led Cyberattacks and Website Breaches", "summary": "Businesses are increasingly concerned about AI-driven cyberattacks after incidents exposed vulnerabilities in digital infrastructure. Google flagged that AI can autonomously find and exploit software flaws. Experts warned that Indian websites loading third-party code for chat bots or analytics are at risk, with one breach potentially exposing credentials across 170 organizations.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "04bab1c1"}, {"headline": "Maharashtra FDA Suspends Licenses of Nine South Mumbai Eateries", "summary": "The Maharashtra FDA has suspended the licenses of nine restaurants in South Mumbai, including Cafe Ideal and Bayroute, for hygiene and safety violations. Inspections revealed unhygienic preparation areas, pest infestations, and improper food storage. Additionally, food items worth Rs 1.27 crore were seized across the state for various regulatory violations.", "category": "Health", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "c003d729"}, {"headline": "Finance Ministry Maps Research and Development Spend Across Schemes", "summary": "Ahead of the budget, the finance ministry is assessing R&D expenditures across all government programs to strengthen domestic capabilities. India's current R&D spending stands at 0.83% of GDP, significantly lower than the US and China. The exercise aims to provide a predictable funding framework for long-term technology projects in sectors like semiconductors and AI.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "027bc531"}, {"headline": "Market Stakeholders Seek LTCG and STT Relief in Pre-Budget Meet", "summary": "Capital market representatives urged Finance Minister Nirmala Sitharaman to lower long-term capital gains tax and securities transaction tax. The mutual fund industry lobbied for tax parity between debt funds and equity funds. Other demands included enhancing liquidity for small NBFCs and reducing the threshold for enforcing security under the SARFAESI Act.", "category": "Economy", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "d99f1ba7"}, {"headline": "HDFC Capital Partners with Pecan Realty for Rs 1,000 Crore Project", "summary": "HDFC Capital Advisors has joined forces with Pecan Realty to develop commercial and mixed-use properties in Mumbai. Their first project in Andheri East, valued at Rs 1,000 crore, will feature 400,000 sq ft of office and retail space. The partnership is structured as a long-term platform to create institutional-quality assets in established business districts.", "category": "Infrastructure", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "8e0097e5"}, {"headline": "Mahindra Last Mile Eyes Exports to Africa and Southeast Asia", "summary": "Mahindra Last Mile Mobility plans to expand its electric three-wheeler exports to Africa and Southeast Asia over the next three years. The company targets one million EV sales by FY31 and is considering an IPO in about 18 months. Currently commanding a 36.2% domestic market share, the firm aims for exports to contribute 5% of its total sales volume.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "0bf91387"}, {"headline": "Royal Enfield to Launch 250cc Bikes to Target Young Buyers", "summary": "Royal Enfield is developing a new 250cc motorcycle platform to attract younger riders moving up from entry-level commuter models. The company aims to capture a larger share of the growing mid-weight motorcycle segment, which has doubled in volume over five years. The new models are expected to launch next fiscal as part of a premiumization strategy.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "2c32af2f"}, {"headline": "Cognizant Bags $175 Million IT Deal from UK Network Rail", "summary": "Cognizant has secured a seven-year, $175 million contract from UK Network Rail Infrastructure for data centre and cloud platform services. Beating competitors like HCLTech and TCS, the firm will support government-owned railway networks and mainframe applications. The deal is part of a broader trend of vendor consolidation in the IT services industry.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "2d4c3a03"}, {"headline": "InsuranceDekho Cuts 500 Jobs and Delays IPO After Merger", "summary": "InsuranceDekho has seen 400-500 employees leave following its merger with RenewBuy as it looks to improve efficiency. The company has also postponed its planned Rs 3,000 crore IPO to rethink its business model amid proposed regulatory caps on distribution commissions. The firm continues to evaluate performance and align with changing Irdai guidelines.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "6bece455"}, {"headline": "Satya Nadella Vows to Improve Microsoft Security and AI Reliability", "summary": "Microsoft CEO Satya Nadella stated the company is committed to continuous improvement following recent global outages. Speaking at the Ignite conference, he addressed the challenge of AI alignment, noting that the internal workings of scaling models remain elusive. Nadella emphasized that the company takes its global responsibility for secure infrastructure extremely seriously.", "category": "Technology", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "f3607ef8"}, {"headline": "Sebi Chairman Rules Out Extending Market Trading Hours", "summary": "Sebi Chairman Tuhin Kanta Pandey announced that the regulator has no plans to extend market trading hours, citing potential cybersecurity risks and costs. He also clarified that no decision has been taken to link Margin Trading Facility (MTF) limits to a stock's free float. The comments address recent debates triggered by US markets expanding their trading windows.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "51c446d2"}, {"headline": "Small Loan Defaults Rise, Prompting Lenders to Tighten Norms", "summary": "Housing finance and NBFC firms are tightening underwriting standards after rising repayment stress in loans below Rs 10 lakh. India Shelter Finance and Aptus Value Housing have flagged higher delinquencies among lower-income borrowers. Some lenders have stopped originating small-ticket loans against property to manage rising credit risks and borrower leverage.", "category": "Economy", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "fce1ae41"}, {"headline": "India Champions Climate Finance Justice at COP31 Talks", "summary": "At COP31, Union Minister Bhupender Yadav argued that developing nations should not choose between climate action and poverty reduction. He called on developed countries to discharge climate finance obligations and criticized unilateral trade measures. India insisted that the global south should not bear the burden of historical emissions from industrialized nations.", "category": "Environment", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "952e1984"}, {"headline": "Air India Express Appoints Deepak Rajawat as New CEO", "summary": "Deepak Rajawat, formerly the CFO of Air India Express, will take over as CEO on December 1. He succeeds Aloke Singh, who exited earlier this year. Rajawat, with two decades of aviation experience including roles at Vistara, will lead the budget carrier's expansion and fleet integration efforts as the Tata Group consolidates its low-cost operations.", "category": "Business", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "82459da1"}, {"headline": "Nvidia Q3 Revenue Doubles to $115 Billion Amid Investigation", "summary": "American chipmaker Nvidia reported doubling its Q3 revenue to over $115 billion, driven by surging AI demand. Despite strong earnings, the company faces an SEC investigation into its financial disclosures. Leadership confirmed that former CEO Jensen Huang will not return, ending internal campaigns for his reinstatement. Shares remained under pressure due to long-term debt concerns.", "category": "Technology", "page": 15, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144039", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144039"}], "article_id": "6e5e526c"}, {"headline": "No trade deal till US puts in place new tariff plan", "summary": "India-US trade deal negotiations are stalled until the US establishes a new tariff architecture. Commerce Secretary Rajesh Agrawal stated that a deal cannot be signed without clarity on levy structures following US Supreme Court rulings and Section 301 probes. India aims to preserve comparative advantages while seeking a reciprocal tariff framework to resolve ongoing investigations.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "1945b46d"}, {"headline": "Gold and silver crash to year's low on dollar strength", "summary": "Gold and silver prices hit 14-month lows on Wednesday due to a strengthening US dollar and expectations of US Federal Reserve policy tightening. Pure gold closed at ₹1,31,164 per 10g, while silver plummeted to ₹1,63,733 per kg. Analysts suggest the correction may continue amidst global economic uncertainty and a stronger greenback affecting bullion demand.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "3c2acbcf"}, {"headline": "Consumers remain value-conscious but willing to spend on quality", "summary": "Westlife Foodworld, the operator of McDonald’s in West and South India, reported its strongest Q2 ever in FY27, driven by same-store sales growth. CEO Akshay Jatia noted that while consumers are value-conscious, they are willing to pay for premium quality and service. The company plans to add over 60 restaurants annually to reach 1,000 outlets by 2031.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "1396cb6a"}, {"headline": "UP tops two-wheeler sales while Maharashtra leads in PVs", "summary": "Data from SIAM for Q2 2026-27 shows Uttar Pradesh leading in two and three-wheeler sales, with 7.89 lakh and 34,000 units respectively. Maharashtra led the passenger and commercial vehicle segments. Overall, the western zone had the highest market share in passenger vehicles (35.7%), while the northern zone led in two-wheeler sales with 12.1% market share.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "0f820cfe"}, {"headline": "SML Mahindra offers shares at 37% discount for rights issue", "summary": "SML Mahindra is offering shares at a 37% discount for its ₹1,449.6 crore rights issue, priced at ₹3,506 per share. This move comes as majority shareholder Mahindra & Mahindra (M&M) seeks to increase its stake in the commercial vehicle maker. M&M intends to invest approximately ₹855 crore in the issue, potentially raising its stake beyond its current 58.97%.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "0d0b5fc1"}, {"headline": "India’s CNG infrastructure could be its biggest net-zero advantage", "summary": "A report by EY-CII suggests India’s CNG infrastructure, with 30,000 km of pipelines and 14,000 stations, provides a unique path to net-zero through Compressed Biogas (CBG). CBG can be used in existing CNG vehicles, potentially making India’s fleet carbon-negative. The report highlights that CBG offers significant life-cycle emission reductions compared to diesel fuel.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "eac2d455"}, {"headline": "Dassault Systemes aims to scale India business to $1 billion", "summary": "French software giant Dassault Systemes plans to grow its India business to $1 billion by focusing on startups and its 3DEXPERIENCE platform. The company is seeing 25% of its new commercial logos coming from India through startup programs. It currently serves 18,000-20,000 customers in India across automotive, aerospace, and industrial sectors.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "2acebef0"}, {"headline": "SEBI mulls more safeguards for margin trading with no decision", "summary": "SEBI Chairman Madhabi Puri Buch stated the regulator is considering additional safeguards for the margin trading facility (MTF) to manage risks from leveraged positions. Potential measures include restricting positions in stocks with low free float. The MTF book stood at ₹1.53 lakh crore in November, up 29% from last year, with high exposure in small and mid-cap stocks.", "category": "Business", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "3a967c13"}, {"headline": "Softer oil and AI reset to boost India's growth: CEA", "summary": "Chief Economic Advisor V. Anantha Nageswaran stated that lower oil prices and the global reset in AI valuations will support India's growth and FDI in FY28. He highlighted that despite a recent slowdown in foreign investment, India remains a preferred destination due to macroeconomic stability. He also noted that manufacturing grew by 9.2% in the first quarter of the year.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "e100697f"}, {"headline": "Firms turn to bond market as lenders raise interest rates", "summary": "Indian companies are increasingly turning to the corporate bond market as banks raise their lending rates. Benchmark rates for 5-year bonds from entities like SIDBI, REC, and Tata Capital range from 7.9% to 8.5%. Analysts suggest that high borrowing costs and the transition to external benchmark linked rates are driving firms to seek cheaper financing through bonds.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "cdbf3347"}, {"headline": "Telangana seeks Centre's support for maize-based edible oil project", "summary": "The Telangana government has proposed a ₹100-150 crore project to produce edible oil from maize. The state has sought the Union Agriculture Ministry’s help to set up an expert committee and conduct a feasibility study. The project aims to reduce India's 55% dependency on edible oil imports by utilizing Telangana's 305.09 lakh tonnes of annual maize production.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "185a0cd9"}, {"headline": "Petrol dealers to meet Minister today for margin hike demand", "summary": "Petrol pump operators are scheduled to meet Union Petroleum Minister Hardeep Singh Puri to demand a revision of dealer commissions, which have been stagnant since 2017. Dealers argue that current margins are inadequate for single-shift operations and do not account for rising financial costs. Most retail outlets are reportedly operating at sales of less than 100 kilolitres per month.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "af016e35"}, {"headline": "Rupee pares early gains on RBI dollar supplies to OMCs", "summary": "The Indian rupee ended slightly lower at 93.44 against the US dollar after early gains were offset by RBI's dollar sales to oil marketing companies. The local currency had initially strengthened due to inflows of ₹2,250 crore from institutional investors. Traders expect the rupee to remain in a range of 91.5-92.5 per dollar through December 2026 due to soft commodity prices.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "8efa61b0"}, {"headline": "Public sector banks record ₹1.1 lakh crore profit in H1", "summary": "India's 12 public sector banks reported a combined net profit of ₹1.1 lakh crore for the first half of FY27, a 17% increase over the previous year. The growth was driven by improved asset quality and stronger capital adequacy. Operating profits grew by 14% to ₹1.81 lakh crore. The Ministry of Finance noted that gross NPA ratios for PSBs fell to 1.69% as of September 30.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "e28cb96a"}, {"headline": "Gujarat and Maharashtra lead India’s solar rooftop surge", "summary": "The PM Surya Ghar: Muft Bijli Yojana has reached 57 lakh installations nationwide, with Gujarat (3,523.98 MW), Maharashtra (3,336.54 MW), and Uttar Pradesh (3,231.59 MW) leading in capacity. These three states account for over half of the national total. The government has disbursed ₹6,437.53 crore in subsidies to promote residential solar power and reduce reliance on traditional energy.", "category": "Infrastructure", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "140660c0"}, {"headline": "MoD inks ₹1,976 crore deal with IAI for missile upgrades", "summary": "The Ministry of Defence signed a ₹1,976 crore contract with Israel Aerospace Industries (IAI) to upgrade the Barak-1 missile systems on Indian Navy ships. The project involves upgrading fire-control radars and software to enhance point-defense capabilities against aerial threats. Public sector units BEL and BDL will act as primary industry partners for the upgrade project.", "category": "India", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "cfe8287f"}, {"headline": "Resignation of Nvidia CEO raises corporate governance concerns", "summary": "The resignation of Nvidia's co-founder and CEO Jensen Huang amid allegations of personal misconduct has raised significant corporate governance concerns. The editorial explores the impact of his departure on the company’s leadership stability and global AI market position. It notes that a powerful founder’s success can create risks when leadership is challenged or suddenly changed.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "5ffdcfa3"}, {"headline": "Railway Ministry explores export of Vande Bharat trains to neighbors", "summary": "The Indian Railway Ministry is exploring the export of indigenously developed Vande Bharat train sets to neighboring countries like Sri Lanka and Myanmar. While previous attempts were limited by track gauge differences and lack of electrification, new standard-gauge models could offer opportunities in markets like Thailand and Vietnam, following successful DEMU exports to Sri Lanka.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "32735eb5"}, {"headline": "COP31 climate summit faces hurdles over leader absence and financing", "summary": "As negotiators gather for COP31 in Turkey, the effectiveness of the summit is questioned given the absence of leaders from major carbon-emitting nations like the US and China. While nearly 200 countries are participating, the lack of consensus on fossil fuel phase-outs and a target of $300 billion annually in climate financing remains a significant hurdle to achieving warming goals.", "category": "Environment", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "69b8ccd6"}, {"headline": "Pulses and oilseeds production remains a challenge for Indian agriculture", "summary": "Despite the Green Revolution, India's production of pulses and oilseeds has lagged behind wheat and paddy due to a lack of irrigation and effective procurement. Pulses are primarily grown in rainfed areas, leading to stagnant yields. Achieving self-sufficiency requires a shift in focus toward high-yielding varieties and better price support and research for these essential crops.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "faf67cc9"}, {"headline": "GTA VI release set to grip Indian gaming market", "summary": "Rockstar Games' Grand Theft Auto VI is set for release in late 2026, marking a major milestone for the $480 million-unit selling franchise. The game will feature a return to Vice City and introduce new gameplay mechanics. Pre-orders in India have already surged, with gaming cafes reporting high demand for console bookings and accessories ahead of the highly anticipated launch.", "category": "Culture", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "62d38018"}, {"headline": "FinMin directs ministries to identify unauthorized bank accounts", "summary": "The Finance Ministry has directed all ministries and departments to identify bank accounts opened without proper authorization. This move aims to enhance the security of government banking operations and ensure funds are managed through prescribed channels. Departments must report any suspicious accounts and detail the actions taken to close or regularize them by January 2027.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "db872ee8"}, {"headline": "Contract staffing in India outpaces permanent hiring in tech sector", "summary": "A report by CIEL HR Services shows that contract staffing in India's technology sector grew by 10.1% in FY26, significantly outpacing permanent hiring. Companies are increasingly seeking project-based talent to manage fluctuating demands and specialized skills like AI and cybersecurity. The shift is driven by the need for flexibility and the rapid evolution of technology requirements.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "ef2db624"}, {"headline": "₹6,700 crore worth gold and silver held up at Customs", "summary": "Over 5 tonnes of gold and silver, valued at approximately ₹6,700 crore, are currently stuck at Indian ports due to a delay in the update of tariff rates by the DGFT and CBIC. The delay has led to non-payment of duty, with customs levying interest on the unpaid amounts. Industry bodies are urging the Finance Ministry to rectify the Icegate system to allow for the clearance of goods.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "ec76ee95"}, {"headline": "CCI begins 2026-27 MSP purchase of cotton from Telangana", "summary": "The Cotton Corporation of India (CCI) has started purchasing cotton under the Minimum Support Price (MSP) for the 2026-27 season in Telangana. The CCI has set up 600 centers to procure cotton, with prices for medium-staple cotton set at ₹8,667 per quintal. Market arrivals are expected to pick up as farmers anticipate higher prices due to lower national crop production estimates.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "016612e7"}, {"headline": "Andhra Pradesh amends semicon policy for 80% capital support", "summary": "The Andhra Pradesh government has amended its Semiconductor & Display Fabrication Policy 4.0 to provide up to 80% capital support for semiconductor projects. This includes a 50% contribution from the Centre and 30% from the state. The move aims to attract investments in ATMP (Assembly, Testing, Marking, and Packaging) units and R&D centers within the state’s electronic hubs.", "category": "Infrastructure", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "1f96712b"}, {"headline": "Centre seeks more time for AAIB report on AI crash", "summary": "The Union government has requested an additional two to three weeks from the Supreme Court to file the final report on the Air India Flight 171 crash. The delay is attributed to the need for a thorough investigation and the involvement of international experts. The crash at Ahmedabad airport resulted in the loss of 12 crew members and 229 passengers in July 2026.", "category": "India", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "15e9fa17"}, {"headline": "Male police officers can handle women protesters says Delhi Police", "summary": "The Delhi Police informed the Supreme Court that there is no legal bar preventing male police officers from handling women protesters during crowd-control operations. The affidavit stated that the primary duty of the police is to maintain law and order, and female officers are deployed when available. This response follows petitions alleging manhandling of protesters by male officers.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "c2e0cf1f"}, {"headline": "Ambani plans 1,600-satellite constellation to challenge Starlink", "summary": "Reliance Industries Chairman Mukesh Ambani is seeking global partners to build and launch a 1,600-satellite constellation to challenge Elon Musk's Starlink in India. The project aims to provide low-latency satellite broadband services by 2035. Reliance is currently in talks with US and European firms for satellite manufacturing and ground station equipment to support the network.", "category": "Infrastructure", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "2450359c"}, {"headline": "Profit-booking trims market gains as SEBI margin rules rattle investors", "summary": "Indian markets witnessed profit-booking on Wednesday, with the Nifty50 falling 0.63% to 25,227.95. The sell-off was triggered by SEBI's proposed changes to margin-trading rules, which could impact leveraged positions in small and mid-cap stocks. Retail investors also reacted to hawkish signals from the US Federal Reserve, leading to a decline in consumer durable and jewelry stocks.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144043", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144043"}], "article_id": "c7ff96e1"}, {"headline": "Juan Mata announces retirement at 38", "summary": "Former Manchester United and Chelsea playmaker Juan Mata has announced his retirement from professional football at the age of 38 after a notable international and club career.", "category": "Sports", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "87a1ab51"}, {"headline": "Mary Peltola wins Alaska Senate race, becomes first Alaska Native woman", "summary": "Democrat Mary Peltola has defeated Republican incumbent Dan Sullivan in Alaska, becoming the first Alaska Native woman elected to the US Senate. This win gives Democrats a 56-44 majority in the Senate.", "category": "World", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "fa4ca565"}, {"headline": "Retiring EPFO subscribers may get monthly payouts", "summary": "EPFO plans a systematic withdrawal plan for subscribers, allowing voluntary contributions and monthly payouts for existing members over 55. This proposal will be discussed by the central board.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "bc7a0665"}, {"headline": "Govt health spend per person in 4 northern states less than northeast", "summary": "Government health expenditure per person in Bihar, UP, MP, and Jharkhand averages Rs 1,651, less than half the Rs 3,501 in the Northeast and a fourth of the Rs 7,209 in UTs. Southern states average Rs 2,960.", "category": "India", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "437cbf78"}, {"headline": "Snake catcher dies after handling venomous krait", "summary": "Rahul Dandapat, a snake catcher known as 'Sarpabandhu', died from a black krait bite during a ritual in West Bengal. He was often engaged by state officials and had a large social media following.", "category": "India", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "b8aad196"}, {"headline": "Can an Italian on visa raise slogans against govt? SC to hear PIL", "summary": "The Supreme Court will hear a PIL asking if an Italian visiting India on a conference visa can legally raise political slogans against the Election Commission and the government at an event in Hyderabad.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "403d559c"}, {"headline": "K'taka govt will be 1st customer for startups", "summary": "Karnataka's 'Govt First Policy' makes the state government the first customer for startups developing tech solutions for governance. Selected startups get grants up to Rs 25 lakh and access to anonymized data.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "26e74e5d"}, {"headline": "Can Rahul get EC to answer 48 questions on oath?", "summary": "Opposition leaders want the Supreme Court to allow 48 interrogatories (written questions) to seek sworn answers from the Election Commission on electoral roll revision procedures, alleging irregularities.", "category": "Law", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "24b2fec5"}, {"headline": "Forces kill Kashmir's last active local terrorist", "summary": "Security forces killed 22-year-old Lashkar-e-Taiba terrorist Mohammad Lateef Bhat in Kulgam, ending the hunt for Kashmir's last known ac
