tive oversight to protect the integrity of national exams. Ensuring a fair examination process remains a critical challenge for educational authorities across the country.", "category": "Education", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "cea86c16"}, {"headline": "Lack of high-quality research positions drives Indian postdoctoral scholars overseas", "summary": "A lack of high-quality research positions and competitive stipends is leading many Indian postdoctoral scholars to seek careers in other countries. Experts warned that this trend could negatively impact India's scientific progress and innovation. They called for more government investment in research infrastructure and better support systems for young researchers within the country.", "category": "Science", "page": 22, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "2bbae55d"}, {"headline": "Bar Council of India proposes bilingual law curriculum for future students", "summary": "The Bar Council of India proposed a new 10-year reform plan that includes a bilingual curriculum for legal education. This initiative aims to make the study of law more accessible to students from various linguistic backgrounds across the country. The plan also includes updating course content to reflect modern legal practices and improving the overall standard of professional training.", "category": "Law", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "e32b0bac"}, {"headline": "Several top-ranked Indian institutes face retractions over research misconduct allegations", "summary": "Reports indicated that eight institutions among India's top 100 NIRF rankings have faced retractions of research papers due to allegations of misconduct. The cases involve issues like data manipulation and plagiarism. This has raised concerns about the ethical standards in Indian academia and the need for more rigorous peer review and internal monitoring of research activities at universities.", "category": "Science", "page": 22, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "ab4ca216"}, {"headline": "Pharmacy education integrates AI but lacks practical industry-focused training components", "summary": "While pharmacy colleges are incorporating AI into their teaching, there is still a lack of practical, industry-focused training. Experts emphasized that students need more hands-on experience with the AI tools used in pharmaceutical manufacturing and clinical research. Bridging this gap is essential for preparing the next generation of pharmacists for the tech-driven healthcare industry.", "category": "Health", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "08a4399f"}, {"headline": "Project Management Institute updates PMP exam to include AI-related skills", "summary": "The Project Management Institute (PMI) has updated its PMP certification exam to include skills related to artificial intelligence and automation. This change is in response to the growing use of these technologies in project https://t.me/c/1877410077/132661"}], "article_id": "6b960811"}, {"headline": "New digital platforms like ABC and LMS enhance flexibility of university degrees", "summary": "New digital systems like the Academic Bank of Credits (ABC) and Learning Management Systems (LMS) are making university degrees more flexible. These platforms allow students to transfer credits more easily and access course materials from anywhere. This digital shift aims to make higher education more accessible and student-centered, catering to a wider variety of individual learning needs.", "category": "Education", "page": 24, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "edecc80b"}, {"headline": "RBI funding restrictions hit derivatives trading volumes", "summary": "The Reserve Bank of India's tighter norms for capital market intermediaries have caused a significant drop in derivative trading volumes. Data from NSE shows index futures turnover fell 17% month-on-month to ₹3.96 lakh crore in July, while index options premium turnover declined 16% to ₹9.70 lakh crore. Market participants expect more impact as the new rules take full effect.", "category": "Economy", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "9efd77af"}, {"headline": "MPC likely to hold rates amid inflation risks, global uncertainty", "summary": "The RBI Monetary Policy Committee is expected to maintain the benchmark repo rate at 5.25 per cent during its August meeting. Economists point to rising headline inflation, which reached 4.4 per cent in June, and volatile global oil prices as key reasons for the status quo. The committee aims to achieve a durable 4 per cent inflation target while managing growth risks.", "category": "Economy", "page": 3, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "7d26ff2c"}, {"headline": "Govt to introduce Bill to replace 125-year-old law on bank records", "summary": "The Indian government plans to introduce the Bankers' Books Evidence Bill, 2026, to modernize how banking records are used in court. The new law seeks to replace the 1891 Act, allowing digital records and electronic logs as legal evidence. This move aligns with the rapid expansion of digital banking and aims to streamline legal proceedings in cyber-enabled financial fraud cases.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "687359cc"}, {"headline": "IRDAI tightens ownership rules for insurers to ensure long-term stability", "summary": "The Insurance Regulatory and Development Authority of India (IRDAI) has introduced stricter rules for share transfers and ownership changes. Insurers now require regulatory approval at every key ownership milestone to prevent volatile exits and ensure long-term commitment from promoters. The new guidelines also streamline procedures for amalgamations and mergers within the sector.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "c2fd0582"}, {"headline": "FMCG advertising spend rebounds as consumer sentiment improves", "summary": "Leading FMCG companies like HUL and Dabur have reported a rebound in advertising and promotional spending for the first quarter. The increase follows several quarters of cautious spending and is driven by signs of improving rural demand and overall consumer sentiment. Companies are focusing on digital platforms and quick commerce to reach a wider customer base.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "e69da930"}, {"headline": "AgniKul Cosmos eyes reusable rocket mission for early 2027", "summary": "Space-tech startup AgniKul Cosmos is preparing for its second mission, AgniBaan-2, targeted for early 2027. The mission aims to place a commercial payload in orbit and successfully recover the rocket's lower stage for reuse. The company uses 3D printing for its engines and is scaling up production to meet growing global demand for satellite launch services.", "category": "Science", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "f4008797"}, {"headline": "Commerce Dept moves to allow rupee payments for SEZ units", "summary": "The Ministry of Commerce is preparing to amend rules to allow Special Economic Zone (SEZ) units to accept payments in Indian rupees for services provided to domestic companies. Currently, these units are often required to transact in foreign currency, creating extra costs and administrative hurdles. The change is expected to benefit sectors like IT and aircraft maintenance.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "86800b76"}, {"headline": "Noel Tata highlights need for world-class educational institutions in India", "summary": "Speaking at IIM Bangalore, Noel Tata emphasized the urgent need for more world-class educational institutions in India. He noted that many Indian students currently seek higher education abroad due to a lack of high-quality options at home. Tata highlighted the role of private philanthropy in building institutions that can cater to the country's growing youth population.", "category": "Education", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "f76bbaa3"}, {"headline": "Ashok Leyland to invest ₹1,000 crore in EV and alternative-fuels", "summary": "Ashok Leyland has announced a ₹1,000 crore investment for the financial year 2026-27 to expand its electric vehicle and alternative-fuel capabilities. The funds will be used for battery manufacturing and scaling up production of LNG and CNG trucks. The company's subsidiary, Switch Mobility, is already active in the electric bus segment across several Indian cities.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "2f728113"}, {"headline": "WHO warns of widening Ebola outbreak in Congo as toll rises", "summary": "The World Health Organization has issued a warning regarding an expanding Ebola outbreak in the Democratic Republic of Congo. The number of confirmed deaths has surpassed 1,500, with cases spreading across five provinces. The WHO cited regional preparedness as a priority to prevent cross-border transmission into neighboring countries like Uganda and Rwanda.", "category": "Health", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "1fac9f27"}, {"headline": "Kharif revival boosts fertilizer demand as urea sales lead", "summary": "Improved rainfall in July has led to a significant recovery in fertilizer demand across India. Urea remains the dominant fertilizer, accounting for 25.86 lakh tonnes of the total 41.09 lakh tonnes sold during the month. The government has adjusted subsidy rates to ensure availability and stabilize prices for farmers as sowing activities for the Kharif season pick up pace.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "d00e6e98"}, {"headline": "India’s air freight volumes grow 16 per cent in June", "summary": "Airports in India handled 3.64 lakh tonnes of freight in June 2026, a 16 per cent increase compared to the previous year. The growth was driven by international cargo, which rose 19 per cent year-on-year. Delhi airport handled the largest volume, followed by Mumbai and Bengaluru. The rise in air freight reflects growing international trade and improved domestic logistical connectivity.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "114c1efc"}, {"headline": "Renewable energy curtailment reaches 235 GW in first quarter", "summary": "India faced significant renewable energy curtailment in the first quarter of FY27, with 235.5 GW of clean energy generation lost. Gujarat recorded the highest wastage due to grid constraints and a mismatch between generation and transmission infrastructure. Experts call for improved grid flexibility and energy storage solutions to handle the increasing share of renewables.", "category": "Environment", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "e97d3c8c"}, {"headline": "India Inc plans major capex surge for infrastructure and renewables", "summary": "Indian corporations are significantly increasing capital expenditure for the current fiscal year. Major groups, including Adani and JSW Steel, have announced large-scale investments in green energy, ports, and steel manufacturing. Data indicates that private corporate credit grew by 19.2% year-on-year, reflecting strong demand for funding greenfield projects across the country.", "category": "Business", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "486690c7"}, {"headline": "India needs R&D investment to reduce dependence on solar imports", "summary": "India must increase R&D investment in next-generation solar technology to reduce its dependence on Chinese imports. While domestic manufacturing is growing, critical gaps remain in the production of solar cells and wafers. Experts suggest that funding for basic solar research could come from revenue generated by customs duties on imported solar products.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "0fcc1b7e"}, {"headline": "Tata Steel targets decarbonisation through new steel-making technologies", "summary": "Tata Steel is implementing a long-term strategy to reduce carbon emissions by adopting innovative steel-making processes. The company plans to use biochar as a substitute for coal and is developing technology to melt iron without first producing coke. These initiatives aim to significantly lower the carbon footprint of its existing operations in India and the Netherlands.", "category": "Environment", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "9bd3bf0a"}, {"headline": "Rupee depreciation highlights India's high import dependence in electronics", "summary": "The Indian rupee has depreciated against the US dollar, trading near ₹95.4. This weakness is exacerbated by India's high reliance on imports for electronics, chemicals, and active pharmaceutical ingredients. While exports in some sectors have grown, the widening trade deficit poses challenges for inflation management and the overall current account balance.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "918c3dbb"}, {"headline": "India's pet economy shifts toward healthcare and preventive services", "summary": "The Indian pet market is evolving from basic grooming and food toward integrated healthcare and diagnostic services. Startups are launching clinics and subscription-based health plans to meet the demand for preventive care. The market for pet insurance is also projected to grow significantly as pet owners increasingly treat animals as family members with complex medical needs.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "b1ea595f"}, {"headline": "Niqo Robotics develops AI-powered technology for selective deweeding", "summary": "Bengaluru-based Niqo Robotics has launched an AI-powered spray technology designed to selectively target weeds in farm fields. The system uses computer vision to identify weeds in real-time, allowing for targeted application of herbicides. This approach reduces chemical use by up to 60 per cent, lowering costs for farmers and minimizing the environmental impact of agricultural practices.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "4e75359a"}, {"headline": "PE and VC investments in India soar 85 per cent in July", "summary": "Private Equity and Venture Capital investments in India reached $3 billion in July 2026, marking an 85 per cent increase compared to June. The surge involved 94 distinct deals, with the largest investments flowing into the renewable energy and infrastructure sectors. The average deal value also saw an increase, signaling a recovery in investor sentiment for Indian startups.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "d7966d58"}, {"headline": "SEBI ban on Zee promoters creates uncertainty for warrant issuance", "summary": "A ban by SEBI on the promoters of Zee Entertainment has created legal complications for the company's planned issuance of convertible warrants. Proxy advisory firm inGovern noted that while the company needs funds, the regulatory restrictions on key individuals could impact investor confidence and the governance framework of the fund-raising exercise.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "aafb9714"}, {"headline": "Tamil Nadu CM to relocate office to new Secretariat building", "summary": "Tamil Nadu Chief Minister M.K. Stalin is set to relocate the Chief Minister’s Office to the historic Fort St. George Secretariat building. The move involves moving the CMO and several departmental secretaries to the adjoining multi-storey block to improve administrative coordination. The relocation is part of a plan to modernize governance and streamline ministerial functions.", "category": "Politics", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "186f7f7c"}, {"headline": "Proposals for a GRE-style standardized NEET exam for medical entrance", "summary": "Following concerns over paper leaks and exam irregularities, experts have proposed adopting a GRE-style standardized testing model for the National Eligibility cum Entrance Test (NEET). This model would involve a computer-based format with a vast database of questions and the ability for students to retake the exam throughout the year, aiming to improve security and institutional accountability.", "category": "Education", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132613", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132613"}], "article_id": "daf871a6"}, {"headline": "PM Modi to Spotlight ET World Leaders Forum in New Delhi", "summary": "Prime Minister Narendra Modi will be the chief guest at the Economic Times World Leaders Forum on August 21-22 in New Delhi. The event, themed 'Viksit Bharat by 2047,' will host global business chiefs and policy experts to discuss India's economic expansion and reform agenda amidst global uncertainty. Modi will focus on India's resilience and its role in global supply chains.", "category": "Business", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "f557912e"}, {"headline": "India's Processed Food Exports Rise 16% to $2.4 Billion", "summary": "India's processed food exports grew 16% to $2.4 billion in early 2025-26, with the US emerging as the top market. Key export items include coffee, snacks, and frozen products. The growth is supported by the government's PLI scheme and increasing demand from the global diaspora and international hotel chains.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "5bd3478e"}, {"headline": "RBI's MPC Likely to Maintain Interest Rate Pause in August", "summary": "Economists expect the Reserve Bank of India's Monetary Policy Committee to keep interest rates unchanged at 5.25% in its upcoming meeting. While inflation shows signs of cooling, geopolitical tensions in West Asia and food price volatility may lead the central bank to maintain a cautious 'wait-and-watch' stance.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "d3ba2862"}, {"headline": "Government to Approve Rare Earth Magnet Plants Under ECMS Scheme", "summary": "The Indian government is set to approve manufacturing centers for rare earth permanent magnets under the Electronic Components Manufacturing Scheme (ECMS). The move aims to reduce heavy reliance on Chinese imports, which currently account for 51% of India's non-metal based permanent magnet imports, valued at $110.6 million.", "category": "Science", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "6c3c5b3a"}, {"headline": "FIIs Return to Indian Markets as AI Stock Rout Ends", "summary": "Foreign Institutional Investors (FIIs) returned to the Indian markets in July with net purchases over ₹10,000 crore, ending a multi-month selling streak. The shift follows an easing of the AI-led rout in global tech stocks and a narrowing of the valuation gap between large and small-cap segments.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "9565d4a3"}, {"headline": "IOC Reassessing ₹33,000 Crore Tamil Nadu Refinery Project Viability", "summary": "Indian Oil Corp (IOC) is reassessing its proposed ₹33,000 crore greenfield refinery in Tamil Nadu due to concerns over economic viability. The refiner is exploring the possibility of converting the venture into a standalone petrochemicals complex to improve long-term profitability.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "cbddecbe"}, {"headline": "India Tops Global Growth Charts for Apple, FMCG Multinationals", "summary": "Global brands including Apple, Unilever, and Mondelez reported record growth in India for the June quarter. Apple saw best-ever PC business sales, while FMCG firms reported double-digit growth driven by strong rural demand, despite macro headwinds in other global markets.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "ef66ebac"}, {"headline": "Maharashtra Charity Body Probes Legal Opinion on Tata Trust Row", "summary": "The Maharashtra Charity Commissioner is examining a legal opinion regarding a 1989 transfer of 833 Tata Sons shares from the Navajbai Ratan Tata Trust. The probe follows allegations of procedural irregularities and claims that the transfer violated the Companies Act and trust obligations.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "08debf94"}, {"headline": "Zee Entertainment Warrants Issue Likely to be Deferred", "summary": "Zee Entertainment’s proposed fundraise through convertible warrants could be delayed due to Sebi’s two-month ban on promoter Punit Goenka from holding managerial positions. Legal experts suggest the company may need to restructure the fundraising plan or seek relief from the Securities Appellate Tribunal.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "6b8b4d6e"}, {"headline": "Eight Dead, Thirteen Injured as Heavy Rains Lash Kerala", "summary": "Heavy monsoon rains in Kerala have resulted in eight deaths and left eight others missing. Landslides and floods have displaced nearly 6,000 people to 209 relief camps across the state. Chief Minister Pinarayi Vijayan announced that 196 houses have been partially damaged and 27 completely destroyed.", "category": "India", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "42608ea8"}, {"headline": "Sattuj to Amritpal: Panthic Politics Regains Focus in Punjab", "summary": "Religious and Panthic politics are returning to the forefront in Punjab as the state heads toward local polls. The emergence of figures like Amritpal Singh and Sarabjit Singh Khalsa as electoral factors has prompted major parties like AAP and Congress to shift their focus back to Panthic narratives to consolidate support.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "17c8117e"}, {"headline": "Draft Rules for SHANTI Act on Nuclear Energy Prepared", "summary": "The first draft of rules to operationalize the SHANTI Act on nuclear energy has been prepared by key government departments. The rules aim to facilitate private sector participation in the nuclear power industry, targeting 100 GW of nuclear energy capacity by 2047 through new liability and licensing frameworks.", "category": "Science", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "42c963b4"}, {"headline": "Bengaluru Hoteliers Threaten Swiggy Boycott Over Payout Disputes", "summary": "The Bangalore Hotels Association has threatened to boycott Swiggy from August 15 unless the food delivery platform addresses concerns over pending payouts and high commissions. The association alleges that deep discounting and unauthorized promotional offers are hurting the profitability of local restaurants.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "34f7e007"}, {"headline": "Listed Fintechs Diversify Revenue Streams Beyond Core Lending", "summary": "Listed fintech firms like Paytm, PhonePe, and Groww are aggressively expanding into insurance, stockbroking, and wealth management to reduce exposure to the slowing unsecured credit market. The shift comes as regulatory scrutiny on digital lending increases and firms seek more stable, non-lending revenue toolkits.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "8b7a5b7d"}, {"headline": "Flipkart to Launch Food Delivery Pilot with 11% Commission", "summary": "Flipkart is preparing to pilot a food delivery service in Bengaluru with a 11% commission for restaurants, significantly lower than the 25-30% charged by Swiggy and Zomato. The service will be integrated into the main Flipkart app, focusing on fast delivery of snacks and beverages to capture a share of the quick-commerce market.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "cf3d1a93"}, {"headline": "Shiprocket Plans IPO at ₹7,000 Crore Valuation This Month", "summary": "E-commerce logistics firm Shiprocket is set to launch its IPO in the next 1-2 weeks at an estimated valuation of ₹7,000 crore. The firm has updated its draft prospectus with a reduced fresh capital target of ₹1,100 crore, reflecting current market conditions and a shift toward profitability goals.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "e84dc9c3"}, {"headline": "Meta's AI Capex Surges Toward $145 Billion for Superintelligence", "summary": "Meta Platforms has significantly increased its capital expenditure guidance to nearly $145 billion over the next two years to fund its AI superintelligence goals. The surge is driven by investments in high-end data centers and Nvidia chips, as the company aims to dominate the generative AI and cloud infrastructure space.", "category": "Technology", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "49da763c"}, {"headline": "IN-SPACE Re-entry Rules Expose Satellite Insurance Crunch", "summary": "New guidelines from India's space regulator IN-SPACE for the planned re-entry of space objects have exposed a lack of insurance products for such high-risk operations. Satellite operators are struggling to find affordable third-party liability cover for potential damage caused during atmospheric re-entry, risking project delays.", "category": "Science", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "899f615e"}, {"headline": "Forex Wall May Fall for SEZ Services Exports to DTA", "summary": "The Commerce Ministry is considering a proposal to allow SEZ units to receive payments in Indian rupees for services exported to the Domestic Tariff Area (DTA). Currently, such transactions must be in foreign exchange, which increases costs and creates administrative hurdles for companies in sectors like engineering and IT.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "ca144855"}, {"headline": "Capacity Growth: Four Indian Hubs Account for 65% of Data Centers", "summary": "A report reveals that Mumbai, Delhi NCR, Bengaluru, and Chennai now account for 65% of India's total data center capacity. The sector received 40% of institutional capital in the June quarter, driven by rapid cloud adoption and the demand for localized data storage for AI applications.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "1d237f2b"}, {"headline": "Sun Pharma Banks on Speciality Business Amid US Generic Headwinds", "summary": "Sun Pharmaceutical is increasing its focus on the high-margin speciality business to offset slowing growth in the US generic market. Speciality revenues grew 21% last year, driven by dermatological and ophthalmic products. The company plans further acquisitions to strengthen its global speciality pipeline.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "320d5c39"}, {"headline": "RBI Special Windows Could Attract $100 Billion in Forex Inflows", "summary": "Economists suggest the RBI's special mobilization windows for foreign exchange could bring in up to $100 billion, similar to the 2013 FCNR scheme. The move is intended to bolster India's forex reserves and support the rupee amidst global volatility and potential outflows from emerging markets.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "8286ebce"}, {"headline": "Government Extends Real Estate Project Completion Deadline by 4 Months", "summary": "The Ministry of Housing and Urban Affairs has recommended a four-month extension for all registered real estate projects due to supply chain disruptions caused by the West Asia conflict. The move aims to reduce uncertainty for developers and prevent legal disputes with homebuyers over delayed handovers.", "category": "Infrastructure", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "4894a4d7"}, {"headline": "Vadilal Ice Cream Family Dispute Escalates in Mumbai Court", "summary": "The Vadilal ice cream family dispute has reached the Mumbai court as the Gujarat faction challenged an interim relief order granted to the Mumbai faction. The legal battle centers on the usage of the 'Vadilal' brand name and the division of manufacturing territories across India based on a 1993 settlement agreement.", "category": "Law", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "eb69c4b3"}, {"headline": "FMCG Brands Go into Overdrive for Quick Commerce Success", "summary": "FMCG companies are shortening product innovation and launch cycles to just three months to meet the surging demand on quick-commerce platforms like Blinkit and Zepto. Brands are focusing on pack sizes and localized assortments that cater to the 'instant gratification' behavior of urban consumers.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "9855bb55"}, {"headline": "New Framework to Allow Homegrown Startups to Retain Identity", "summary": "A government panel has proposed a new legal framework for 'inward re-domiciliation' or reverse flipping. The move would allow Indian-origin startups incorporated overseas to relocate back to India while retaining their original legal identity, addressing taxation and regulatory hurdles that previously hindered such moves.", "category": "Business", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "ed5ac742"}, {"headline": "OMC Losses Lower Than Forecast Despite Global Oil Volatility", "summary": "India's Oil Marketing Companies reported combined net losses of ₹18,149 crore for the June quarter, significantly lower than the government's estimate of ₹75,000 crore. The performance was cushioned by higher LPG rates and internal cost-cutting measures, despite the impact of supply disruptions from the Iran-Israel conflict.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "e032ef84"}, {"headline": "Trump Puts Iran Strike on Hold, Bets on Nuclear Deal", "summary": "U.S. President Donald Trump has temporarily suspended plans for a military strike on Iran's nuclear facilities, citing a new diplomatic opening. Trump stated he is willing to negotiate a 'comprehensive deal' if Tehran curbs its enrichment program and ends its support for regional proxy groups, although tensions remain high.", "category": "World", "page": 16, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "9db31dd6"}, {"headline": "Ceasefire Hopes Fade as Gaza Strikes Kill 15 Palestinians", "summary": "Hopes for a ceasefire in Gaza have faded following a new wave of Israeli airstrikes that killed at least 15 Palestinians in Gaza City. The strikes come despite international pressure and a recent diplomatic push by the U.S. to reach a truce and hostage release agreement between Israel and Hamas.", "category": "World", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "27f9481c"}, {"headline": "Kyiv Hits Rosneft Refinery and Engels Air Base in Russia", "summary": "Ukrainian forces launched a major drone attack targeting Russia's Rosneft refinery and the Engels air base. The strikes, which caused significant fires at fuel depots, are part of Kyiv's strategy to disrupt Russia's military logistics and oil revenue as the conflict enters its third year.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "7ec4e2cd"}, {"headline": "South Korea Reels Under Record Heat as Temperatures Hit 42.5°C", "summary": "South Korea recorded its highest-ever temperature of 42.5 degrees Celsius in Yangsan as a severe heatwave gripped the country. Authorities have issued emergency alerts, advising citizens to avoid outdoor activities, as the power grid faces record demand for air conditioning.", "category": "Environment", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "239b8113"}, {"headline": "OPEC+ Approves Oil Output Raise Starting in September", "summary": "OPEC+ members have agreed to increase oil production by 188,000 barrels per day starting in September. The decision marks the beginning of a gradual rollback of voluntary production cuts introduced in 2023, as the group seeks to balance global supply with recovering demand in major economies.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "0343af97"}, {"headline": "UK Prime Minister Pushes for Written Constitution and Devolution", "summary": "British Prime Minister Andy Burnham has called for the codification of a written constitution for the UK to clearly define the powers of the central government and regional authorities. Burnham argues that a formal document is essential to prevent constitutional crises and strengthen the devolution of power.", "category": "World", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132619", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132619"}], "article_id": "37908bf6"}, {"headline": "Trump Pauses Iran Strikes Amid Hopes for Strait of Hormuz Deal", "summary": "US President Donald Trump delayed military strikes against Iran after mediation with Gulf allies. The proposed deal aims to end Iran’s nuclear threat and reopen the Strait of Hormuz in exchange for ending the US naval blockade and halting militia attacks. While Trump claims Iran requested the pause to negotiate, Tehran’s Mehr news agency denied this. Israel has not yet commented on the news.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132626"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132613"}], "importance": 10, "article_id": "ef0a3347"}, {"headline": "PM Modi Launches National Campaign to Create Drug-Free India by 2047", "summary": "Prime Minister Narendra Modi launched the ‘Nasha Mukt Yuva for Viksit Bharat’ campaign, involving over 10 lakh youth across 28,000 locations. Aiming for a drug-free India by 2047, he warned that trafficking is a hostile agenda to weaken the nation. The PM lauded those in recovery as \"real warriors\" and emphasized community-led rehabilitation, particularly in high-risk areas like Punjab.", "category": "Health", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132681"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "importance": 8, "article_id": "c9bc38ab"}, {"headline": "Tamil Nadu Leaders Defer Bengaluru Visit Amid Ongoing Cauvery Water Dispute", "summary": "Following a request from Karnataka Deputy CM D.K. Shivakumar, high-level visits from Tamil Nadu to Bengaluru have been postponed to maintain peace. Actor-politician Vijay and CM M.K. Stalin deferred their trips to avoid escalating tensions linked to the ongoing Cauvery water dispute and recent CWMA directives on water release. Officials aim to maintain cordial relations between the states.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 7, "article_id": "9b90fc2a"}, {"headline": "Sheikh Hasina to Outline Bangladesh Return Plans in Virtual Media Interaction", "summary": "Ousted Bangladesh Prime Minister Sheikh Hasina, currently in exile in India, is set to address international media virtually from New Delhi on August 5. Marking two years since her government's fall, the event will feature her son Sajeeb Wazed Joy and former ministers. Hasina is expected to detail her homecoming plans and discuss the political instability in her home country.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132661"}], "importance": 9, "article_id": "46297197"}, {"headline": "Independent MP Pappu Yadav Attacked During New Delhi Press Conference", "summary": "Independent MP Pappu Yadav was attacked during a press conference at his New Delhi residence. An assailant hurled a slipper and allegedly brandished a knife, citing the MP's defense of a controversial parliamentary skit. While Yadav remained unhurt, a scuffle ensued before the attacker was detained. Yadav was discussing alleged financial irregularities at the Ram Temple during the event.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132661"}], "importance": 6, "article_id": "22061efd"}, {"headline": "Tanvi Sharma Becomes Youngest Champion in Taipei Open Badminton History", "summary": "17-year-old Indian shuttler Tanvi Sharma clinched her first BWF World Tour title at the Taipei Open, defeating Vietnam’s Nguyen Thuy Linh 21-16, 21-16. Sharma is the first Indian woman to win the tournament since Saina Nehwal in 2008 and the youngest champion in the event's history across any discipline. She secured the Super 300 title without dropping a single game in the final.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132661"}], "importance": 8, "article_id": "247caaa0"}, {"headline": "Jasprit Bumrah Ruled Out of Sri Lanka Test Series Due to Injury", "summary": "Premier Indian pacer Jasprit Bumrah will miss the upcoming two-match Test series in Sri Lanka due to a recurring left-knee injury. The BCCI medical team advised further rest to ensure his fitness for the subsequent England tour. Aaqib Nabi has been named as his replacement for the tour starting August 15. Bumrah has been out of action since mid-July following the T20 World Cup.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132661"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 9, "article_id": "735db83e"}, {"headline": "Suicide Bombing at Pakistan Anti-Militant Rally Kills 14, Including Police", "summary": "A suicide bomber targeted a peace rally in Pakistan’s Swat Valley, Khyber Pakhtunkhwa, killing at least 14 people, including five police officers. Demonstrators had gathered near a police station to protest rising militant threats. While no group has claimed responsibility, authorities suspect the TTP. Prime Minister Shehbaz Sharif condemned the attack and vowed to eliminate terrorism.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132661"}], "importance": 9, "article_id": "42883f66"}, {"headline": "Two Pilots Killed in Mid-Air Firefighting Helicopter Collision Near Athens", "summary": "Two firefighting helicopters collided mid-air while battling a wind-driven wildfire west of Athens, killing a Greek and a Danish crew member. A Greek and a British national survived the crash. The accident occurred during efforts to control fires that have destroyed over 12,000 hectares of forest. PM Kyriakos Mitsotakis expressed deep sorrow over the loss of the two pilots.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132588"}], "importance": 6, "article_id": "b13dd365"}, {"headline": "Karnataka Begins Releasing Cauvery Water to Tamil Nadu Following CWMA Directive", "summary": "The Karnataka government has started releasing 3,500 cusecs of Cauvery water daily from the Kabini reservoir to Tamil Nadu for 15 days. The move follows a directive from the Cauvery Water Management Authority and increased inflows due to heavy rainfall in Kerala. While the water is expected to reach Mettur Dam by Tuesday, a state-wide bandh in Karnataka is planned for August 13.", "category": "Environment", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 9, "article_id": "27f3bfa1"}, {"headline": "Karnataka Government Set to Expand Cabinet Following High Command Approval", "summary": "The Karnataka government is expected to expand its Cabinet after receiving approval from the Congress central leadership. Chief Minister Siddaramaiah and Deputy CM D.K. Shivakumar have reportedly finalized a list of legislators to balance regional and caste equations. Over 50 lawmakers are vying for vacant ministerial positions, with a swearing-in ceremony likely at Lok Bhavan.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "importance": 7, "article_id": "e6206e58"}, {"headline": "BSP President Mayawati Expels Former MP Ashok Siddharth for Indiscipline", "summary": "Bahujan Samaj Party (BSP) president Mayawati has expelled former MP Ashok Siddharth and former national coordinator Randhir Singh Beniwal for alleged indiscipline and anti-party activities. This marks the second time in 18 months that Siddharth has been expelled. The party leadership stated he would not be readmitted, citing a failure to perform duties and internal strategy disagreements.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 5, "article_id": "85fa115f"}, {"headline": "Global Insurers Eye 100% FDI to Expand Footprint in India", "summary": "International insurance firms, including South Korea’s Hanwha Group and South Africa’s Discovery, are evaluating expansion in India following the government’s decision to allow 100% foreign direct investment. The move enables global players to gain full control over local joint ventures or establish wholly-owned subsidiaries, tapping into India’s growing $130 billion insurance market.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132626"}], "importance": 8, "article_id": "e2c0e126"}, {"headline": "Mirabai Chanu Targets Elusive Asian Games Medal to Complete Trophy Cabinet", "summary": "Weightlifting champion Mirabai Chanu has returned to training with a focus on winning gold at the upcoming Asian Games, the only major title missing from her career. Following her third consecutive Commonwealth Games gold in Glasgow, Chanu is refining her lifting technique to compete against top Asian lifters. She emphasized the importance of staying injury-free for the 2025 season.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁸²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132663"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132661"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 8, "article_id": "43b0152f"}, {"headline": "Maruti Suzuki Records Q1 Sales Growth Amid Pressure from Rising Costs", "summary": "Maruti Suzuki reported record Q1 sales of 6,82,724 units, with revenue rising 36%. However, Ebitda margins fell to 8.2% due to surging commodity and logistics costs. To ensure supply continuity, the company shortened vendor settlement cycles to 30 days. Management maintained a 10% domestic volume growth guidance, supported by SUV demand and expanded capacity at the Kharkhoda plant.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132626"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132681"}], "importance": 7, "article_id": "b3031fb5"}, {"headline": "Indian Stock Exchanges Transition to Auction-Based Closing Session for F&O Stocks", "summary": "Starting August 3, the NSE and BSE have transitioned 208 derivative-traded stocks to an auction-based closing mechanism. This new single-price call auction replaces the volume-weighted average price (VWAP) method to improve price discovery and prevent manipulation affecting derivative settlements and mutual fund NAVs. The session aims to reduce volatility during the final 30 minutes of trading.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132626"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132619"}], "importance": 7, "article_id": "65de85de"}, {"headline": "Major Cigarette Makers Face Revenue Pressure Following Tobacco Tax Hikes", "summary": "ITC, Godfrey Phillips, and VST Industries reported a decline in net revenue and volumes in Q1 after the government increased tobacco taxes. While gross revenue appeared high due to duty pass-through, underlying sales suffered as firms adopted staggered pricing. The new regime replaced compensation cess with higher excise duties, impacting a market with 100-120 billion annual stick sales.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132626"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132681"}], "importance": 7, "article_id": "e283627b"}, {"headline": "Zoho Founder Warns Rising AI Infrastructure Costs are Stalling IT Job Creation", "summary": "Zoho founder Sridhar Vembu cautioned that the Indian IT industry is failing to create new jobs as funds are diverted to cover soaring AI and data center infrastructure costs. While companies have avoided mass layoffs, the creation of new software roles has slowed. Vembu expressed doubt that manufacturing or AI will easily solve structural income distribution challenges facing the sector.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132626"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132681"}], "importance": 7, "article_id": "68f3adb7"}, {"headline": "Weak Monsoon Drives Surge in Petro
