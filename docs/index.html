<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

 "page": 3, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "06992312"}, {"headline": "ED arrests former KPSC head in recruitment scam probe", "summary": "The Enforcement Directorate has detained Shivashankarappa Sahukar, former chairman of the Karnataka Public Service Commission, in connection with recruitment irregularities. The probe involves alleged money laundering and the sale of government jobs across various departments. Investigators suspect a wide network of middlemen and officials were involved in the multi-crore scam.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "bbbc9ee5"}, {"headline": "Karnataka triples cash rewards for Asian Games gold medalists", "summary": "The Karnataka government has announced a significant increase in cash rewards for athletes from the state who won medals at the Asian Games. Gold medalists will now receive Rs 1 crore, up from Rs 25 lakh. Silver and bronze medalists will also see their rewards tripled to Rs 45 lakh and Rs 25 lakh, respectively. The move aims to encourage sporting excellence in the state.", "category": "Sports", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "115ac15f"}, {"headline": "Karnataka Cabinet approves Rs 8-10 hike in Nandini milk price", "summary": "The Karnataka Cabinet has approved a proposal to increase the price of Nandini milk by Rs 8 to Rs 10 per litre. The decision follows demands from milk unions to support dairy farmers facing rising input costs. The state government stated the hike is necessary to improve the livelihoods of rural producers and ensure the sustainability of the dairy sector in the state.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "56fe944f"}, {"headline": "Five new police commissionerates to be created in Bengaluru", "summary": "The Karnataka government has decided to reorganize the Bengaluru City Police by creating five new police commissionerates. The move is intended to improve law and order, traffic management, and public safety in the rapidly expanding city. The restructuring will involve the addition of approximately 6,550 police personnel and the establishment of new police stations and divisions.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "acd40770"}, {"headline": "Navy staffer and civilian arrested in AP for espionage", "summary": "Andhra Pradesh police and naval intelligence have arrested a Navy staffer and a civilian for their alleged involvement in an espionage racket. The suspects are accused of sharing sensitive information about naval assets and strategic locations with handlers linked to a Pakistani intelligence agency. The arrests follow a coordinated operation involving counter-intelligence cells.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "b5b20888"}, {"headline": "Bypolls conclude with high turnout in TN and Puducherry", "summary": "Bypolls for two assembly seats in Tamil Nadu and one in Puducherry concluded with a voter turnout exceeding 80%. The elections were seen as a test of popularity for the ruling DMK-led alliance and the opposition. Election officials reported the process was largely peaceful, with only minor technical glitches with EVMs. Counting of votes is scheduled for later this week.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "2656443f"}, {"headline": "Rajnath Singh calls for integrated maritime system to enhance security", "summary": "Defense Minister Rajnath Singh emphasized the need for a strong and integrated maritime ecosystem to boost India's naval capabilities. Speaking at the launch of two new ships, he highlighted the importance of indigenization and technological advancement in shipbuilding. He urged the Navy and industry to collaborate on developing advanced surveillance and combat systems for the region.", "category": "India", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "5ea7c1cb"}, {"headline": "Vigilance probe against Kerala Congress leader K. Sudhakaran intensified", "summary": "The Kerala Vigilance and Anti-Corruption Bureau is intensifying its probe into allegations of financial misconduct against state Congress chief K. Sudhakaran. The investigation centers on alleged irregularities in the Kerala State Transport Project (KSTP) during his previous tenure. The opposition has dismissed the probe as politically motivated vendetta by the ruling LDF government.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "3e1168b7"}, {"headline": "TDP and Jana Sena discuss strategy for local body polls", "summary": "Andhra Pradesh CM Chandrababu Naidu and Deputy CM Pawan Kalyan met to discuss the strategy for upcoming local body elections. The NDA allies aim to contest the polls jointly to ensure a consolidated vote bank against the YSRCP. The meeting focused on seat-sharing arrangements and local issues that need to be addressed to maintain their electoral momentum in the state.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "70b71653"}, {"headline": "SC to hear Punjab's plea against CBI graft inquiry", "summary": "The Supreme Court has agreed to hear a petition by the Punjab government challenging a high court order for a CBI probe into alleged corruption within the state administration. The Punjab government argues the probe is an interference with its sovereign powers and lacks a prima facie basis. The case involves allegations of financial misconduct linked to senior officials in the CM's office.", "category": "Law", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "9b8432af"}, {"headline": "Court discharges accused in Bulli Bai app case", "summary": "A Mumbai magistrate court has discharged a 25-year-old engineering student accused in the Bulli Bai app case. The court ruled that there was no evidence to show the individual was involved in creating or sharing derogatory photos of Muslim women. The accused had been in custody since January 2022. The court emphasized that following an app or website does not constitute a criminal offense.", "category": "Law", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "723bcf55"}, {"headline": "India pursuing project to develop domestic jet engines", "summary": "Defense Minister Rajnath Singh announced that India is vigorously pursuing a program to develop indigenous jet engines for combat aircraft. The project, involving DRDO and private partners, aims to achieve self-reliance in critical aerospace technology. Singh stated that the development of a 110kN thrust engine is essential for the future of India's stealth fighter and light combat aircraft.", "category": "Science", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "acaf83a1"}, {"headline": "SC closes 22-year-old legislative privilege case", "summary": "The Supreme Court has closed a 22-year-old case regarding the scope of legislative privileges, citing that the issues have become 'infructuous' over time. The case, which began in 2004, involved a dispute between the Tamil Nadu assembly and senior journalists. While the court declined to issue a detailed ruling now, it left open the possibility of examining the legal questions in the future.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "5d7109f5"}, {"headline": "Nine arrested in Gujarat for gang-rape under guise of 'purification'", "summary": "Police in Gujarat have arrested nine people for the gang-rape of a woman during an alleged 'purification' ritual. The victim was reportedly abducted by family and community members, stripped, and assaulted. The incident, which was recorded and shared on social media, has sparked national outrage. Charges have been filed under various sections of the BNS and IT Act.", "category": "India", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "f2e3ab89"}, {"headline": "Supreme Court seeks report on illegal sand mining in rivers", "summary": "The Supreme Court has directed the Central Empowered Committee to submit a report on rampant illegal sand mining in Indian rivers, particularly in the Chambal region. The court expressed concern over the environmental impact and the failure of authorities to curb such activities despite previous orders. The committee must propose measures for restoration and strict enforcement of mining laws.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "615f5c65"}, {"headline": "SC rules protein powder is not a beverage for tax purposes", "summary": "The Supreme Court has ruled that protein powder cannot be taxed as a beverage, as it is not meant for direct consumption like milk or water. The court clarified that the product, intended for muscle building and nutritional support, should be classified as a food supplement. This decision resolves a long-standing tax dispute between manufacturers and state revenue authorities.", "category": "Law", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "21beeb38"}, {"headline": "HC raps bank for single staffer handling 4,155 arbitrations", "summary": "The Delhi High Court has criticized Axis Bank for appointing a single individual to handle over 4,000 arbitration cases, calling it a 'tip of the iceberg' in procedural unfairness. The court observed that such a practice compromises the neutrality and quality of the arbitration process. The bank has been ordered to review its procedures and ensure a fair selection of independent arbitrators.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "d1ad3dab"}, {"headline": "UP mosques can use loudspeakers if noise limits are met: HC", "summary": "The Allahabad High Court ruled that mosques in Uttar Pradesh can use sound-amplifying devices for azaan, provided they adhere to established noise pollution limits. The court stated that while azaan is an essential part of Islam, the use of loudspeakers is not a fundamental right. Authorities have been directed to ensure that noise levels remain within permitted limits for all religious places.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "33a2667f"}, {"headline": "Earthquake tremors felt in Delhi-NCR after 4.8 magnitude quake in Uttarakhand", "summary": "Mild tremors were felt across Delhi and the National Capital Region following a 4.8 magnitude earthquake in Uttarakhand's Chamoli district. According to the National Center for Seismology, the quake occurred at a depth of 13 km. While there were no immediate reports of casualties or significant damage, the event caused brief panic among residents in high-rise buildings.", "category": "Environment", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "7dbe2831"}, {"headline": "Supreme Court directs optional insurance for rail tickets bought at stations", "summary": "The Supreme Court has directed the Indian Railways to provide optional accident insurance coverage for tickets purchased at station counters, similar to the facility available for online bookings. The court emphasized that the mode of booking should not result in discriminatory treatment of passengers. The move is expected to extend insurance benefits to millions of travelers who use offline counters.", "category": "Economy", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "9f36c669"}, {"headline": "Pakistan test-fires extended range Fatah-4 guided missile", "summary": "Pakistan has successfully conducted a test flight of the Fatah-4 guided multi-launch rocket system with an extended range. The indigenously developed missile is capable of delivering conventional warheads with high precision at long distances. The military stated the test was aimed at validating the weapon's flight parameters and enhancing the country's strategic deterrence capabilities.", "category": "Science", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "f85fce67"}, {"headline": "Houthi rebels claim drone attack on Riyadh's King Khalid Airport", "summary": "Houthi rebels in Yemen claimed to have launched a drone attack on King Khalid International Airport in Riyadh. While Saudi authorities did not immediately confirm any damage, the group stated the operation was a response to ongoing coalition strikes. The incident marks an escalation in regional tensions and has raised concerns over the safety of international civil aviation in the Middle East.", "category": "World", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "ee4bd365"}, {"headline": "Over 250,000 rally in France to demand more school funding", "summary": "More than 250,000 people, including teachers, students, and parents, took to the streets across France to protest against government budget cuts in education. Demonstrators in Paris and other cities called for increased funding, more staff, and better working conditions in public schools. The rallies put significant pressure on President Emmanuel Macron's administration to address the crisis.", "category": "World", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "a07d1ba0"}, {"headline": "Delhi HC stays FSSAI ban on 'Energy Drink' labels for some brands", "summary": "The Delhi High Court has stayed a ban by the food regulator FSSAI on using the term 'Energy Drink' for certain brands like PepsiCo's Sting and Reliance's Charge. The court ruled that the products can continue to be sold under their current labels until a final decision is reached. The dispute involves whether these beverages meet the specific nutritional criteria to be classified as energy drinks.", "category": "Law", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "8d30f5b8"}, {"headline": "Shreyas Iyer century leads India to victory in first T20I", "summary": "Shreyas Iyer smashed an unbeaten 102 off 43 balls to help India chase down a target of 172 against the West Indies in the first T20I in Lucknow. India reached the target in just 14.4 overs, securing an eight-wicket win. Sanju Samson also contributed with a quickfire 42. The victory gives India a 1-0 lead in the three-match series, showcasing a dominant performance by the top order.", "category": "Sports", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "eb2fba93"}, {"headline": "Uruguay defeats India 6-1 in international football friendly", "summary": "The Uruguayan national football team delivered a masterclass in Kolkata, defeating India 6-1 in a friendly match. Despite an early fightback from the Indian side, Uruguay's superior technical skill and pace dominated the second half. Rodrigo Aguirre scored twice for the visitors, while India's lone goal came from Thapa. The match highlighted the significant gap between the two nations in world rankings.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139769"}], "article_id": "979ec48e"}, {"headline": "RPSG Group Considers Selling 15-20 Percent Stake in Lucknow Super Giants", "summary": "The Sanjiv Goenka-led RPSG Group is exploring the sale of a 15-20% stake in its IPL franchise, Lucknow Super Giants. The group is seeking a valuation between $1.5 billion and $2 billion, following a surge in team valuations this year. Goldman Sachs is the frontrunner to advise on the deal, which reflects the growing status of IPL franchises as high-value long-term sports assets.", "category": "Sports", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "0c62bcd8"}, {"headline": "Sebi’s Investor Protection Fund Swells to 969.8 Crore but Spending Stalls", "summary": "The Securities and Exchange Board of India’s (Sebi) Investor Protection and Education Fund (IPEF) grew four-fold to ₹969.8 crore in FY26. However, utilization remains low, with the regulator spending only 0.4% of the total corpus. The government is noticing the underutilization as risks from financial influencers and digital frauds increase, prompting discussions on a potential overhaul.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "6ae65e4c"}, {"headline": "Auto Firms Invest in Captive Green Power to Lower Operating Costs", "summary": "Major automotive companies, including Tata Motors, Mahindra & Mahindra, and Maruti Suzuki, are investing in captive renewable energy projects. These investments aim to provide direct access to clean power, reducing electricity costs by 10-40% while meeting decarbonization targets. Firms are earmarking significant capital to shift manufacturing operations toward green energy sources.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "9783e1c0"}, {"headline": "Court Rulings Stall Trump’s Plan for 100,000 Dollar H-1B Visa Fee", "summary": "Two US district courts have effectively blocked President Donald Trump’s executive proclamation that sought to impose a $100,000 fee on new H-1B visa applications. Judges in California and Massachusetts ruled that the administration exceeded its authority and failed to follow required administrative processes. The fee had been criticized for its impact on small businesses and colleges.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "662675e0"}, {"headline": "RBI Set to Hike Interest Rates as Inflation Crosses Comfort Level", "summary": "The Reserve Bank of India’s rate-setting panel is widely expected to announce a 25-basis-point hike in the benchmark repo rate. Retail inflation rose to 4.8% in August, exceeding the RBI’s 4% target. Rising oil prices and global supply chain shocks have increased pressure on the central bank to tighten monetary policy to protect capital flows and manage broad-based price increases.", "category": "Economy", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "c26022b5"}, {"headline": "Türkiye and Pakistan Join Saudi Arabia in Defense Pact Against Houthis", "summary": "Türkiye and Pakistan are reportedly joining forces with Saudi Arabia to defend the kingdom against Houthi attacks, marking the first invocation of the trilateral Mecca agreement. The move risks direct confrontation with Iran-backed proxies. The conflict in the Arabian Peninsula has disrupted oil exports, and the entry of new combatants could widen the regional theatre of warfare.", "category": "World", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "833e4795"}, {"headline": "Jamie Dimon Warns of New Cybersecurity Vulnerabilities Created by AI Models", "summary": "JPMorgan Chase CEO Jamie Dimon has highlighted legitimate concerns regarding the downside of artificial intelligence. He noted that AI has created previously unknown vulnerabilities that agents and bad actors can exploit to cause trouble. Dimon emphasized that increased global cybersecurity risks from AI models are a real and significant threat to the financial sector.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "99ceeabc"}, {"headline": "India Insurance Penetration Remains Low Compared to Global Average", "summary": "Data from the insurance regulator shows that only 3.7% of Indians are currently insured, significantly below the 7.3% global average. While life insurance penetration is around 3%, non-life coverage remains under 1%. The regulator plans to cap insurer commissions to make products more affordable and address the decline in coverage seen since the pandemic.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "bbf56dff"}, {"headline": "India Faces Solar Manufacturing Imbalances and Grid Storage Bottlenecks", "summary": "India's solar capacity reached 168GW by August, but the sector faces lopsided growth. While module assembly capacity is high at 215GW, domestic cell manufacturing lags at 40GW. Additionally, a noon power glut is causing price collapses on exchanges, while the high cost of lithium carbonate is stalling the deployment of necessary battery storage systems to manage evening peak demand.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "5e11b0dc"}, {"headline": "Foreign Investors Scale Back Bearish Bets on Banks Before RBI Policy", "summary": "Foreign portfolio investors are reducing short positions on banking stocks ahead of the RBI's interest rate decision. Incremental net shorts in Bank Nifty futures fell from ₹1,980 crore to ₹1,074 crore recently. Market participants anticipate a potential short-covering rally if the central bank delivers an expected rate hike without negative surprises regarding liquidity or outlook.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "fd5e5bd4"}, {"headline": "GST Council Considers Data Sharing Frame to Measure Economic Activity", "summary": "The GST Council is likely to approve sharing tax data with the statistics ministry to help estimate trade margins and measure economic activity. The data will be used to develop a statistical business register and an index for the unincorporated sector. The move aims to provide the government with a more timely and comprehensive source of information beyond tax administration.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "39520281"}, {"headline": "India and Ecuador Discuss Crude Oil and Critical Mineral Trade Deals", "summary": "Ecuador is in talks to increase supplies of crude oil, copper, and critical minerals to India. Fernando Buchelli, Ecuador's ambassador, stated that the country is inviting Indian companies to invest in its energy sector, which holds 8.273 billion barrels of oil reserves. India is also looking to buy medical products from state-run HLL Lifecare as part of the strengthening bilateral ties.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "29d32905"}, {"headline": "OpenAI Eyes 30 Billion Dollar Round Backed by UAE and BlackRock", "summary": "OpenAI is in discussions with investment funds from the United Arab Emirates, including MGX, to anchor a $30 billion financing round. BlackRock is also expected to participate. The fundraise aims for a valuation of approximately $1.4 trillion. The capital will support OpenAI's intense needs for developing cutting-edge AI software as it pushes back plans for an initial public offering.", "category": "Technology", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "355f02a0"}, {"headline": "Cybersecurity Startups Face Longer Sales Cycles Due to Evidence-Led Reviews", "summary": "Enterprises are shifting from questionnaire-based onboarding to detailed evidence-led security reviews for cybersecurity vendors. This shift, driven by data protection laws and AI risks, has extended sales cycles from three weeks to over a month. Startups are now required to provide proof of access control, vulnerability fixes, and data processing agreements to win large corporate contracts.", "category": "Technology", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "9bf8dfd6"}, {"headline": "AI Emerges as New Investment Imperial for Entertainment Value Chain", "summary": "Investors are betting on AI-native companies to transform the economics of media production and monetization. Recent deals include Brahma AI raising $150 million and Pratilipi raising $20 million. The focus is shifting toward AI’s ability to compress production timelines, enable localization at scale, and improve personalization, although legal nuances regarding IP ownership remain a concern.", "category": "Technology", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "31daeefb"}, {"headline": "Defense Electronics Firm Sanlayan Targets 200 Million Dollar Valuation", "summary": "Sanlayan, a defense-focused electronics manufacturer, has begun a process to raise $35-40 million at a valuation of $150-200 million. The fundraising follows its securing of various defense contracts. Existing investors include Jungle Ventures and Gemba Capital. The company plans to use the new capital for research and development and potential strategic acquisitions.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "06d2cea0"}, {"headline": "Nykaa Enters Festive Season With Strong 30 Percent GMV Growth", "summary": "FSN E-Commerce Ventures (Nykaa) expects consolidated GMV to grow 30% year-on-year in Q2FY27. The beauty and personal care segment saw high-20s growth, while the fashion segment grew in the high-40s. Operating margins improved due to operating leverage and new brand additions. Net profit for the quarter is estimated to nearly triple to ₹101 crore as store footprint continues to expand.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "64eacaaa"}, {"headline": "Mutual Fund SIP Contributions Hit Record 32,297 Crore in August", "summary": "Monthly systematic investment plan (SIP) inflows reached an all-time high of ₹32,297 crore in August 2026. Despite a rise in SIP discontinuations to 5.38 million, net capital inflows remain strong as new registrations outpace churn. Retail investors are increasingly diversifying into mid-cap and small-cap funds, which have shown resilient returns despite recent market volatility.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "a80eec64"}, {"headline": "Centre Defers Adani Airport Flight Transfer Plans After Airline Pushback", "summary": "The civil aviation ministry has paused Mumbai International Airport's plan to shift 265 weekly international flights to the new Navi Mumbai facility. The decision follows opposition from airlines and IATA regarding technical capacity and tight deadlines. The airport operator must now submit a consensus-based transition plan after further consultations with stakeholders in mid-October.", "category": "Infrastructure", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "f003a4f0"}, {"headline": "High Court Allows Work on 15 Billion Dollar Google-Adani Data Centre", "summary": "The Andhra Pradesh High Court has allowed Vizag Hyperscale Data Center Park Ltd to continue work on its $15-billion project in Visakhapatnam. However, the court cautioned that all investments will be at the developer's risk pending a final decision on a PIL alleging environmental clearance gaps. The project is located near the Kambalakonda Wildlife Sanctuary.", "category": "Law", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "071b06ee"}, {"headline": "Netherlands Backs Tata Steel Greening With Up to 2 Billion Euro Aid", "summary": "The Dutch government has signed a non-binding agreement to provide up to €2 billion in aid to Tata Steel’s IJmuiden plant for its transition to cleaner steelmaking. The total project cost is estimated between €4 billion and €6.5 billion. A final agreement is expected by March 2027, as the parties negotiate regulatory hurdles and financial terms to reduce carbon emissions at the facility.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "5cd3a4a2"}, {"headline": "Saudi-Backed Forces Launch Ground Offensive to Free Strategic Yemen Strait", "summary": "Saudi and Yemeni forces have launched a counteroffensive against Houthi rebels to retake the port city of Mokha near the Bab al-Mandeb Strait. The operation, supported by 100 jet fighters, aims to secure strategic shipping lanes and protect oil exports from missile and drone attacks. The Houthis responded by warning that Saudi airspace has now become a theater for their operations.", "category": "World", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "39a5b7c0"}, {"headline": "France’s High Public Debt Reaches 120 Percent of Gross Domestic Product", "summary": "France faces a dangerous financial spiral as its debt hits 120% of GDP, making it one of Europe's weakest links. Borrowing costs have risen toward 5% amid concerns over a record budget deficit and political gridlock in the National Assembly. Investors worry that upcoming elections may result in more populist spending, further straining the government’s ability to refinance its debt.", "category": "Economy", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139738", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/139738"}], "article_id": "ba15f934"}, {"headline": "Government Unveils Key Economic Reforms", "summary": "The administration today announced a comprehensive package of economic reforms aimed at stimulating growth and job creation, including new initiatives for manufacturing and digital sectors. Analysts predict significant impact from these policies.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139709", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 07-10-2026.pdf", "page": 1, "telegram_url": "https: eed for enhanced conservation efforts to protect fragile ecosystems.", "category": "Science", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139709", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 07-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139709"}], "article_id": "342e31d2"}, {"headline": "International Summit Focuses on Climate Change", "summary": "Global leaders convened at an international summit to discuss urgent climate change actions, emphasizing collaborative strategies for emissions reduction and sustainable development goals for the coming decade. Agreements were reached on key targets.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139709", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 07-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139709"}], "article_id": "febcac7a"}, {"headline": "Financial Markets React to Global Cues", "summary": "Indian financial markets displayed volatility today, responding to a mix of international economic indicators and domestic policy announcements. Analysts advise caution amidst uncertain trends in global trade and investment flows.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139709", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 07-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139709"}], "article_id": "119f4813"}, {"headline": "Cultural Exchange Program Promotes Bilateral Ties", "summary": "A cultural exchange program between India and a neighboring country successfully concluded, fostering deeper understanding and strengthening diplomatic relations through arts and heritage. Students participated actively in the initiative.", "category": "Culture", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139709", "sources": [{"newspaper": "Indian E elegram_url": "https://t.me/c/1877410077/139764", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/139764"}], "article_id": "b4ed981b"}, {"headline": "Festival hiring grows 7% led by qcom", "summary": "India's festival hiring market grew 7% Y-o-Y in 2026, driven by quick commerce, ecommerce, and logistics. Seasonal jobs rose from 98,120 in 2024 to 127,080 in 2026.", "category": "Business", "page": 22, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139764", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/139764"}], "article_id": "5d4e230a"}, {"headline": "Truck rentals hold steady amid festival demand", "summary": "Truck rentals remained steady on major routes above year-ago levels due to resilient economic momentum and consistent freight activity.", "category": "Business", "page": 22, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139764", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/139764"}], "article_id": "b4d2707d"}, {"headline": "Global turmoil may mean multiple routes for IMEC", "summary": "The West Asia war may necessitate multiple routes for the India-Middle East-Europe Corridor (IMEC) for resilience. Oman could play a key role as a safer gateway port.", "category": "World", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139764", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139764"}], "article_id": "5e7cf04d"}, {"headline": "Cabinet honors PM Modi for 25 years as head of government", "summary": "The Union Cabinet passed a resolution congratulating Prime Minister Narendra Modi on completing 25 years as a head of government,  07-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139764"}], "importance": 8, "article_id": "29f69c8e"}, {"headline": "Paramount and Warner Bros Discovery finalize $110 billion merger", "summary": "Media giants Paramount and Warner Bros Discovery have completed a landmark $110 billion merger, creating a new Hollywood powerhouse. The combined entity will oversee a massive library of films, television networks, and streaming services. The deal is expected to reshape the global entertainment landscape and consolidate the industry as it competes for subscribers in the digital era.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139769"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139738"}], "importance": 9, "article_id": "534de8a3"}, {"headline": "Jio Platforms Eyes 114 Billion Dollar Valuation for Mega India IPO", "summary": "Mukesh Ambani’s Jio Platforms is reportedly seeking a valuation of about ₹11 trillion ($114 billion) for its planned initial public offering. The company aims to list by October 30, with the offer potentially raising $3.4 billion. If successful, Jio would become India's third most valuable publicly traded company, trailing only its parent, Reliance Industries, and rivaling Bharti Airtel.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139769"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139738"}], "importance": 9, "article_id": "223083aa"}, {"headline": "India's services sector PMI reaches 3-month high in September", "summary": "India's services sector activity expanded at its fastest pace in three months in September, with the HSBC Services PMI rising to 55.2. The growth was driven by a strong uptick in new business orders, both domestically and internationally. The data indicates resilient demand in sectors such as finance, insurance, and professional services, contributing to overall economic momentum.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139769"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139738"}], "importance": 7, "article_id": "1a9fdc96"}, {"headline": "India and Qatar among seven bidders to host 2036 Olympic Games", "summary": "The International Olympic Committee (IOC) has confirmed that India and Qatar are among seven countries that have submitted bids to host the 2036 Summer Olympics. India's bid is centered on the city of Ahmedabad. The IOC will evaluate the proposals based on infrastructure, sustainability, and financial viability before making a final decision in 2027. Other bidders include Hungary and Turkey.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁷¹⁰²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139769"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/139738"}], "importance": 8, "article_id": "3af52789"}, {"headline": "World Bank Raises India’s FY27 Growth Forecast to 7.1 Percent", "summary": "The World Bank has upgraded India's GDP growth forecast for FY27 from 6.6% to 7.1%. The revision reflects resilient domestic demand, robust exports, and stronger-than-expected industrial activity. However, the report warned that risks remain from higher global oil prices, potential rainfall deficits due to El Niño, and volatile capital flows.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139738"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139764"}], "importance": 8, "article_id": "721e916b"}, {"headline": "DeepVerse Platform Launched to Give Deeptech Ecosystem a Policy Voice", "summary": "The Startup Policy Forum has launched DeepVerse, a multi-stakeholder platform for deeptech sectors like quantum tech, semiconductors, and space technology. Backed by firms like Accel and Skyroot Aerospace, the initiative aims to drive policy dialogue and research. The move comes as deeptech funding in India rose to $2.55 billion in 2026, though it still lags significantly behind the US.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_07-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139738"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139764"}], "importance": 6, "article_id": "f56d869a"}, {"headline": "Foreign Investment in Renewable Energy Sector", "summary": "International investors are increasingly pouring capital into India's renewable energy sector, reflecting confidence in its green growth potential and favorable policy environment. This accelerates the transition to sustainable power sources.", "category": "Business", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 07-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139709"}], "importance": 6, "article_id": "5bfd657d"}, {"headline": "Group insurance likely to get GST input tax credit relief", "summary": "Allowing input tax credit on group health and life insurance could reduce employer costs and expand coverage. The proposal retains 18% GST but makes it recoverable.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139764"}], "importance": 6, "article_id": "71cec979"}, {"headline": "Banks sweeten retail offerings for festival season", "summary": "Banks are launching festival offers for retail customers, including loan fee waivers, concessional interest rates, and discounts/cashback on credit card transactions.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 07-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139764"}], "importance": 7, "article_id": "1f8208a9"}], "newspapers": ["Hindustan Times", "Business Standard", "Financial Express", "Economic Times", "Mint", "Times of India", "Indian Express", "The Hindu"], "total_articles": 184};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
