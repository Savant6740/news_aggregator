<script>
const DIGEST = {"date": "02 October 2026", "articles": [{"headline": "Center extends tax refund scheme for Indian apparel and made-up exports", "summary": "The Union government has extended the Rebate of State and Central Taxes and Levies (RoSCTL) scheme for apparel and made-up exports for three months until December 31. The scheme provides rebates on embedded taxes to keep Indian products competitive in global markets. It benefits over 15,400 exporters, many of whom are small businesses, and supports an industry employing 45 million people.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "722d9d0d"}, {"headline": "Finance ministry review signals cautious outlook despite healthy quarterly economic growth", "summary": "The finance ministry's economic review for September projects 7.3% growth for the July-September quarter but warns of slowing momentum. Key challenges include weak monsoon impact on farm output, high oil prices, and global interest rate hikes. The report maintains a cautious tone, advising policymakers to stay alert as supply chain issues and geopolitical polarization intensify.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "86b153da"}, {"headline": "Inquiry finds Manchester City inflated commercial revenues to bypass financial rules", "summary": "An independent commission found Manchester City guilty of inflating commercial revenues to circumvent financial regulations. Data shows the club's fortunes surged after its 2008 acquisition by the Abu Dhabi United Group. From 2006 to 2018, the club allegedly disguised £30 million in payments from owners as commercial revenue, a practice identified as illegal under league rules.", "category": "Sports", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "a278b8aa"}, {"headline": "Deficient monsoon rains impact foodgrain production and rural agricultural valuations", "summary": "India's southwest monsoon ended at 87% of the long-period average, making it the 13th weakest since 1901. Deficits affected 43% of districts, particularly in Punjab, Karnataka, and Rajasthan. Consequently, the government set a lower foodgrain production target of 332.93 million tonnes for 2026-27, reflecting concerns over lower rice and maize yields due to the El Niño phenomenon.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "fd5c694a"}, {"headline": "Tamil Nadu leads Indian states in manufacturing share and factory employment", "summary": "The Annual Survey of Industries 2024-25 reveals Tamil Nadu holds the largest share of manufacturing gross value added (GVA) at 15.1%, followed by Maharashtra and Gujarat. The number of registered factories in India rose to 2.6% year-on-year, with total employment in the sector reaching 16.6 million. Tamil Nadu’s individual share of national factory employment also grew to 10.9%.", "category": "India", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "d1597e38"}, {"headline": "Indian chess teams secure historic podium finishes at Samarkand Olympiad", "summary": "The Indian men’s and women’s chess teams finished second and third, respectively, at the Chess Olympiad in Uzbekistan. Uzbekistan won the men’s gold, while China took the women's title. India also earned the title of best overall side and individual medals for six players, including a gold for Savitha Shri. This marks the sixth consecutive top-10 finish for the Indian men’s team.", "category": "Sports", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "35c75de5"}, {"headline": "IBI to tweak rules shielding healthy real estate projects from insolvency", "summary": "The Insolvency and Bankruptcy Board of India (IBBI) plans to allow creditors to keep solvent real estate projects operational even if the developer defaults on other projects. This project-wise insolvency approach aims to protect homebuyers in healthy units from construction delays. The proposal requires a 66% vote from the Committee of Creditors and approval from the NCLT.", "category": "Law", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "bcaa78e3"}, {"headline": "UPI transactions dip in September following news of merchant discount rates", "summary": "Unified Payments Interface (UPI) transaction volumes fell 1.5% and values declined 1.8% in September compared to August. The drop follows the government's announcement to reintroduce a merchant discount rate (MDR) starting October 15. Daily transactions fluctuated between 748 million and 810 million, with some experts attributing the decline to consumer caution over potential fees.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "a5c9ec75"}, {"headline": "JSW Group wins major tender for 1,200 electric buses under federal scheme", "summary": "Sajjan Jindal-owned JSW Group has won a contract to supply 1,200 electric buses under the PM-eBus Sewa scheme, outbidding Tata Motors and Ashok Leyland. JSW emerged as the lowest bidder for a fleet of 4,054 buses across multiple categories. The win establishes a significant foothold for the conglomerate in a market previously dominated by legacy commercial vehicle manufacturers.", "category": "Infrastructure", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "157bbf7d"}, {"headline": "India records over two trillion rupees in GST revenue for September", "summary": "Gross Goods and Services Tax (GST) collections reached ₹2.04 trillion in September, a 14.7% increase from ₹1.77 trillion in the previous year. This is the third time this fiscal year that revenue has exceeded the ₹2 trillion mark. The growth was driven by a 26% surge in taxes on imports, while domestic transactions saw a 10.1% increase, reflecting robust consumer demand.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "2e0fa3d2"}, {"headline": "New advisory firms challenge Big Four for startup and private equity business", "summary": "A group of new mid-tier consulting firms, founded by former executives from EY, KPMG, and Deloitte, are gaining ground in the startup and private equity sectors. Firms like Uniqus and Transaction Square offer specialized services in tax, M&A, and digital transformation. They are attracting clients by offering more agile and specialized expertise compared to the traditional Big Four firms.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "0cbe9444"}, {"headline": "Accenture forecasts higher client AI spending as operational token costs decline", "summary": "Accenture Plc expects corporate spending on AI automation to rise as the cost of running large language models decreases. The company reported an 8.8% increase in net profit to $8.5 billion, with revenue reaching $74.2 billion for the fiscal year. Accenture's performance is seen as a bellwether for the Indian IT sector, suggesting a potential rebound in software services demand.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "038e7baf"}, {"headline": "Automakers receive three-year self-certification cushion for fuel efficiency compliance", "summary": "India's Ministry of Road Transport has relaxed Corporate Average Fuel Efficiency (CAFE-III) rules, allowing carmakers three years to self-certify fuel-saving technologies. New standards for lighter vehicles under 909kg were also introduced to ease the burden on manufacturers. The rules aim for a 16% improvement in fuel efficiency by FY28 to meet national energy conservation goals.", "category": "Environment", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "22180478"}, {"headline": "Consumer affairs department establishes guardrails to prevent unfair UPI merchant fees", "summary": "Ahead of new UPI merchant discount rates (MDR) starting October 15, the Department of Consumer Affairs is setting guidelines to ensure fees are not unfairly passed to customers. A dedicated helpline has already received thousands of inquiries regarding the new fee structure. Transactions up to ₹2,000 will remain free, and the government will monitor for unauthorized charges.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "d4549230"}, {"headline": "Power exchange prices hit zero as monsoon rains dampen electricity demand", "summary": "Electricity prices on Indian power exchanges dropped to near zero during late September as widespread rains reduced cooling demand. High wind and solar generation coupled with lower industrial usage led to a temporary surplus. For several 15-minute intervals, clearing prices touched the floor price, marking a significant shift from previous power shortage concerns in the summer.", "category": "Infrastructure", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "e031be23"}, {"headline": "FSSAI suspends licenses of two food firms over safety violations", "summary": "The Food Safety and Standards Authority of India (FSSAI) has suspended the manufacturing licenses of Shivam Agro and TCF Chocolates & Gifts Pvt. Ltd. The action follows inspections that uncovered serious food safety and regulatory compliance violations. The companies have been ordered to cease all production activities until they address the identified hazards and pass re-inspection.", "category": "Health", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "ffbf739f"}, {"headline": "Manufacturing PMI hits seven-month high despite broader economic growth concerns", "summary": "The seasonally adjusted HSBC India Manufacturing Purchasing Managers' Index (PMI) rose to a seven-month high of 55.1 in September. While the figure indicates expansion, economists warn of a 'dead cat bounce' as high input costs and cooling consumer demand loom. Manufacturers reported the fastest rise in new orders since 2021, yet business confidence for the year ahead remains cautious.", "category": "Economy", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "24a72d0a"}, {"headline": "Indian stock markets face eight-week slide as yields and oil prices rise", "summary": "The BSE Sensex and Nifty 50 recorded their longest weekly losing streak since 2001, falling for eight consecutive weeks. Rising US 10-year Treasury yields and crude oil prices near $96 per barrel have triggered significant foreign capital outflows. Investors are now closely watching the Reserve Bank of India’s upcoming policy meeting for signals on interest rate adjustments.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "65e1d239"}, {"headline": "AI investment funds favor Taiwan and South Korea over Indian tech sector", "summary": "Global artificial intelligence (AI) investment flows are shifting toward Taiwan and South Korea, leaving India behind in the current cycle. In the last six weeks, South Korea and Taiwan attracted $23.5 billion and $21.4 billion respectively, while India saw outflows of $3.17 billion. Analysts suggest the concentration of semiconductor hardware manufacturing in Northeast Asia makes those markets more attractive.", "category": "Technology", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "3978f9dd"}, {"headline": "Dilip Buildcon targets doubling coal output to 57 million tonnes by FY29", "summary": "Infrastructure firm Dilip Buildcon Ltd is aggressively expanding its mining portfolio, aiming to reach an annual coal production of 57 million tonnes by FY29. The company is diversifying into minerals like bauxite and iron ore to reduce its reliance on road projects. Mining and infrastructure assets are expected to contribute 75% of the company's profit and cash flows by the end of the decade.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "9d90aac1"}, {"headline": "Hyundai India announces interim salary hikes to curb rising employee attrition", "summary": "Hyundai Motor India has announced immediate interim salary hikes for its employees to counter rising attrition and competition from rivals like Tata and JSW. The move comes as the company prepares for its mega IPO. Employee turnover at Hyundai rose from 5% in FY23 to 7.9% in FY24. The hikes, ranging from 1-2%, are in addition to the standard annual increments to retain key management talent.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "a42c3b73"}, {"headline": "US pressure campaign leaves dozens of Iranian oil tankers stranded in Asia", "summary": "Around 20 Iranian oil tankers are stranded in Asian waters as the U.S. intensifies its sanctions campaign against Tehran. Many of these tankers, carrying millions of barrels of crude, have been drifting for months with their engines idled as port authorities in Malaysia, Sri Lanka, and Indonesia refuse them entry. The squeeze has significantly impacted Iran's illicit oil export revenues.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "da9c1cec"}, {"headline": "Apple faces intense competition from local brands in Chinese foldable phone market", "summary": "Apple is struggling to gain a foothold in China’s foldable phone market, where domestic brands like Huawei, Xiaomi, and Oppo dominate. Huawei currently leads the market with a 77% share, while Apple has yet to launch a foldable iPhone. Analysts suggest that the lack of a foldable device is costing Apple market share in the premium segment as Chinese consumers shift toward innovative form factors.", "category": "Technology", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "bb7d5b06"}, {"headline": "Adani Green expands battery energy storage capacity to over six gigawatt hours", "summary": "Adani Green Energy has increased its operational battery energy storage system (BESS) capacity to 6.63 GWh, enough to power two million homes for several hours. The firm achieved 70% of its FY27 target within just 14 months of starting construction at its Khavda project. The company aims to reach 50 GWh of storage capacity over the next five years to support India’s renewable energy grid.", "category": "Infrastructure", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "45f4bcb2"}, {"headline": "Global cricket faces crisis as players prioritize T20 leagues over national duty", "summary": "The rise of private T20 leagues is creating a power struggle in global cricket, with players increasingly choosing lucrative short-format contracts over international matches. High-profile players like Ben Stokes and Pat Cummins are at the center of the 'club vs country' debate. The financial disparity between league earnings and national retainers is forcing cricket boards to reconsider their domestic schedules.", "category": "Sports", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "09ab6c16"}, {"headline": "Bengaluru luxury real estate boom driven by tech salaries and ESOP liquidity", "summary": "Tech wealth is fueling a massive surge in Bengaluru’s premium housing market, with base prices for luxury apartments rising 60% since 2021. High-income IT professionals and startup founders are reinvesting wealth from ESOP events into high-end real estate. Despite layoffs in the broader tech sector, demand for homes in the ₹2-5 crore range remains strong, particularly in areas near tech parks.", "category": "India", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "aa988fd5"}, {"headline": "India must reform solar policies to support growing energy needs of data centers", "summary": "India's push to become a global data center hub is being hindered by erratic solar energy policies. While solar capacity exists, state-level regulations on battery storage and power evacuation often prevent data centers from utilizing renewable energy efficiently. Experts call for standardized national guidelines to ensure these power-hungry facilities can meet sustainability goals without facing high costs.", "category": "Infrastructure", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139170", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/139170"}], "article_id": "005dd29f"}, {"headline": "Panel recommends statutory Civil Aviation Authority to replace DGCA", "summary": "A special committee has proposed converting the DGCA into a statutory Civil Aviation Authority of India (CAAI) via an act of Parliament. The new body would have administrative and financial autonomy, a governing board, and a dedicated safety fund. Funding would be supported by a proposed ₹15 levy on departing passengers to resolve systemic safety failures and staffing shortages.", "category": "Infrastructure", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "035388d9"}, {"headline": "Modi praises Captain Machchhar for averting 9/11-style tragedy", "summary": "Indian pilot Smit Machchhar was hailed as a hero for preventing a disaster on a flydubai flight to Tel Aviv. Despite being stabbed by his co-pilot, Machchhar opened the cockpit door, allowing crew to subdue the attacker and land safely. President Trump suggested potential links to Iran, while Machchhar has been moved to Abu Dhabi for medical treatment.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "ec5b75d9"}, {"headline": "Supreme Court orders states to freeze services for unpaid traffic fines", "summary": "The Supreme Court directed states and UTs to freeze vehicle-related services, including registration renewals and driving license issuances, for owners with unpaid traffic fines. Vehicles with outstanding e-challans will be blacklisted on the Parivahan portal. The move aims to recover approximately ₹49,194 crore in outstanding fines and enhance road safety enforcement.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "3952c985"}, {"headline": "Supreme Court declines parliamentary panel invite for simultaneous elections talk", "summary": "The Supreme Court administration rejected a proposal for judges to interact with a parliamentary panel examining simultaneous elections. The court cited the potential for the proposed constitutional amendments to face future judicial review, making administrative discussions inexpedient. The 'One Nation, One Election' panel is currently consulting various stakeholders on the bill.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "456050a6"}, {"headline": "Design flaws in new Barapullah spur cause massive traffic crisis", "summary": "The opening of a new Barapullah Phase-III flyover spur from Mayur Vihar has triggered severe traffic congestion across East and South Delhi. Traffic police flagged design flaws where the new corridor merges with the existing network. Authorities are now considering adding a second traffic signal on the elevated corridor to modulate flow, a rare measure for flyovers.", "category": "Infrastructure", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "0e3c2ae5"}, {"headline": "ED links ₹30 lakh royalty payment from ex-minister to Mamata Banerjee", "summary": "An Enforcement Directorate probe into Durga Puja 'preview shows' found that former Bengal minister Indranil Sen’s firm transferred nearly ₹30 lakh to Mamata Banerjee. Sen claimed the payment was 'royalty' via banking channels. The ED alleged that over ₹3.8 crore in cash was deposited into Sen's firm's accounts during his tenure, which were subsequently siphoned off.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c2363576"}, {"headline": "Two ascetics killed and burnt inside Uttar Pradesh temple", "summary": "Two ascetics, aged 60 and 70, were allegedly murdered and their bodies set on fire inside a Shiva temple in Shahjahanpur. Police detained a local man, Sumeet Singh, who allegedly wanted the priests to leave so he could establish control over the shrine. A dispute over the temple property is suspected to be the motive behind the attack.", "category": "Law", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "5c844c4c"}, {"headline": "Justice Nagarathna begins writing Sabarimala reference judgment", "summary": "Justice BV Nagarathna has become the first judge on a nine-member Constitution bench to start writing the verdict for the Sabarimala reference. The judgment is expected to redefine the Supreme Court’s approach to religious freedom and the 'essential religious practices' doctrine. The bench had reserved its judgment in May after a 16-day marathon hearing.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "7d57c852"}, {"headline": "Gola wins posthumous victory in Delhi fat dog contest", "summary": "Gola, a dog from south Delhi’s SDA market, was crowned the winner of the 'Fat Dogs of Delhi' Instagram contest. Gola received over 94,000 votes, beating Saket’s Googoo by nearly 40,000. The victory was bittersweet as Gola passed away before the competition ended. The contest saw higher voter engagement than some local assembly constituencies.", "category": "Culture", "page": 1, "importance": 2, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "df6817e2"}, {"headline": "MCD relaxes ban on ornamental park use for festive functions", "summary": "The Municipal Corporation of Delhi (MCD) has relaxed its ban on booking ornamental parks for socio-religious functions. Parks that have hosted such events continuously for at least five years will now be eligible venues. The move is intended to accommodate Ramleela organizers and other traditional festive celebrations ahead of the upcoming season.", "category": "Culture", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "5d3c8913"}, {"headline": "Karnataka CEO orders legal action against false voter roll claims", "summary": "Karnataka Chief Electoral Officer V Anbukkumar has directed officials to initiate legal proceedings against individuals knowingly submitting false Form 7 objections. The order follows allegations by CM DK Shivakumar of an organized conspiracy to delete nearly 60 lakh voters. Action will be taken under Section 31 of the Representation of the People Act, 1950.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c802f312"}, {"headline": "High volume of voter deletion requests flagged in Jharkhand seat", "summary": "Data from Jharkhand shows that roughly 36% of the 13,443 applications for voter name deletion came from the Chatra assembly constituency alone. The CEO confirmed that 4,790 entries were marked in this single seat. While Congress raised concerns over anomalies, officials stated many entries were automated results of booth rationalization under Form 8.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "821b27ce"}, {"headline": "Goa CEO re-includes 88 eligible voters after revision error", "summary": "The Chief Electoral Officer of Goa confirmed that 88 out of 97 eligible voters who were excluded from the final electoral roll have been re-included as fresh voters. Of the remaining nine, three were found to hold Portuguese passports and six reside abroad. The re-inclusion follows a special intensive revision exercise and subsequent verification.", "category": "Politics", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c9c19797"}, {"headline": "Canada foreign minister to visit India for trade negotiations", "summary": "Canadian Foreign Minister Anita Anand is expected to visit India from October 12-15 to advance negotiations for a Comprehensive Economic Partnership Agreement (CEPA). The visit aims to finalize the trade deal before PM Modi's planned visit to Canada in December. Talks will also include implementing a roadmap for bilateral relations and preparations for high-level summits.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "6426c481"}, {"headline": "Court orders money laundering charges against Yasin Malik", "summary": "A special NIA court has ordered the framing of PMLA charges against jailed JKLF chief Yasin Malik and six others. They are accused of routing Pakistani and foreign funds through hawala channels to finance secessionist activities in Jammu and Kashmir. The Enforcement Directorate alleged the criminal activities generated proceeds of crime totaling ₹8.94 crore.", "category": "Law", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "7e5e6532"}, {"headline": "US death row convict survives failed lethal injection attempt", "summary": "Tennessee Governor Bill Lee halted executions for the year after Christa Gail Pike survived a failed lethal injection attempt on Wednesday. Pike was given two doses of pentobarbital but remained alive and snoring an hour later. The incident, described as an unprecedented failure, has triggered a comprehensive third-party review of the state's execution procedures.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "8a138625"}, {"headline": "Government deliberates airline security advisory after pilot attack", "summary": "Civil Aviation Secretary Samir Kumar Sinha stated that the government is assessing whether to issue a security advisory to Indian airlines following the stabbing of a pilot on a flydubai flight. The internal deliberations follow an incident where an Omani co-pilot allegedly tried to crash an Israel-bound aircraft. Capt Smit Machchhar was praised for saving 174 lives.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c91db38d"}, {"headline": "Customs imposes ₹89 crore penalty on actor Ranya Rao", "summary": "The Customs Department has imposed a penalty of ₹89.91 crore on Kannada actor Ranya Rao for alleged gold smuggling. The order, part of a ₹244 crore penalty across four individuals, follows the 2025 interception of 14.2 kg of gold at Bengaluru airport. Rao was previously under preventive detention for one year. The accused have legal remedies to challenge the penalty.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "5f477add"}, {"headline": "BJP accuses Congress of using Karnataka PSC as an 'ATM'", "summary": "BJP spokesperson Sambit Patra alleged large-scale irregularities in the KPSC veterinary officers' recruitment exam, calling the commission a 'Congress ATM'. The ED recently arrested an IAS officer for allegedly leaking question papers in exchange for bribes. Patra questioned Rahul Gandhi's silence on the matter, while the state government has challenged a court-ordered SIT probe.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "417f8b07"}, {"headline": "Karnataka Deputy CM seeks central aid for severe drought", "summary": "G Parameshwara has written to the Centre seeking urgent assistance to address drought across 177 taluks in Karnataka. Crop losses are estimated at ₹46,324.5 crore, affecting 47 lakh hectares. The state requested ₹7,142.64 crore in relief under NDRF/SDRF norms and urged a revision of outdated relief norms to reflect the current cost of cultivation.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "8565d2e3"}, {"headline": "Opposition mounts against proposed Urdu festival at Vidhana Soudha", "summary": "The Karnataka government’s plan to hold an Urdu festival on the steps of Vidhana Soudha has faced criticism from the BJP and Kannada organizations. Minister U T Khader stated the venue could be reconsidered if it creates trust issues, while BJP leaders accused the government of minority appeasement and neglecting the prominence of the Kannada language at the seat of power.", "category": "Culture", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "2c6869ca"}, {"headline": "Monsoon deficit in AP and Telangana threatens rabi crops", "summary": "Andhra Pradesh and Telangana face a significant rainfall deficit as the southwest monsoon ends, with shortfalls of 34.1% and 17% respectively. The deficit has reduced reservoir storage and paddy acreage, particularly in areas without assured irrigation. Officials warned that continuing El Nino conditions could further impact soil moisture and agricultural yields in the rabi season.", "category": "Environment", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "4b54fa1b"}, {"headline": "Telangana cabinet forms ministers’ group to study El Niño impact", "summary": "A group of ministers has been constituted in Telangana to study the impact of El Niño and prepare a drought action plan. The cabinet urged the Centre to declare 235 mandals as drought-hit. Additionally, the state approved 7,800 MW of renewable energy projects and decided to release two pending Dearness Allowance arrears for government employees and pensioners.", "category": "Environment", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "6ec5baaf"}, {"headline": "Left parties allege 'cash-for-votes' in Tamil Nadu by-elections", "summary": "The CPI(M) and CPI have accused the ruling TVK party of massive money distribution to voters in Madurantakam and Dharapuram constituencies ahead of by-elections. State secretary P Shanmugam demanded the Election Commission take action against the alleged electoral malpractice. TVK spokespersons rejected the claims, asserting their support stems from leadership popularity rather than cash.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "40a59e97"}, {"headline": "ED arrests two in ₹1,417 crore agricultural investment scam", "summary": "The Enforcement Directorate arrested Naveen Kumar and Muthu Selvam in Tamil Nadu for allegedly cheating 35,759 investors. The duo promised high returns through fake agricultural export firms. Investigation revealed over 100 bank accounts were used to route illicit funds, with ₹719 crore traced so far. The accused were remanded to 15 days of judicial custody.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "158cee0e"}, {"headline": "Tamil Nadu grants state honours to legendary actor Sivaji Ganesan", "summary": "The Tamil Nadu government accorded state honours to actor Sivaji Ganesan on his 99th birth anniversary. Official tributes were offered at his memorial in Chennai on behalf of CM C Joseph Vijay. The ceremony included garlanding the late actor's statue and offering floral tributes, recognizing his enduring legacy in Indian cinema.", "category": "Culture", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "d35d1c86"}, {"headline": "Kerala CM questions CPI(M) stance on Congress-led protests", "summary": "Leader of Opposition VD Satheesan criticized the CPI(M) for allegedly attacking Youth Congress workers during protests against the Election Commission. Satheesan claimed the Left party's unease with anti-BJP protests suggests a secret alliance between the CPM and BJP. The CM’s office rejected the allegations, describing the clashes as orchestrated violence to divert from administrative failures.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "1ee9f1ba"}, {"headline": "Supreme Court rejects plea to recall split verdict on EC law", "summary": "The Supreme Court declined to entertain an application seeking the recall of an order referring the challenge of the CEC and ECs appointment law to a Constitution bench. The petitioner cited potential bias as a judge's son appeared for the ECI elsewhere. Justice Dipankar Datta directed the petitioner to approach the Chief Justice as the master of the roster.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "fefb2d12"}, {"headline": "Opposition parties join Sena (UBT) march against Election Commission", "summary": "The Congress and NCP (SP) have joined Uddhav Thackeray’s call for an October 4 protest march in Mumbai. The agitation targets alleged irregularities in voter roll revisions and the conduct of the Election Commission. Leaders Nana Patole and Supriya Sule stated the march aims to protect democracy from systemic electoral manipulation.", "category": "Politics", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c2fda04c"}, {"headline": "Retired Acting Chief Justice rejects 'conspiracy' allegations by SC judge", "summary": "Retired Acting Chief Justice Sanjiv Prakash Sharma dismissed allegations of integrity issues and pressuring judges leveled against him by Supreme Court judge Sandeep Mehta. Sharma termed the claims 'fabricated' and driven by personal jealousy. He has requested the Chief Justice of India for an opportunity to cross-examine Justice Mehta to address the personal and professional hurt caused.", "category": "Law", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "7662f5de"}, {"headline": "CJI clarifies administrative listing of CAPF and IPS deputation cases", "summary": "The Supreme Court clarified that the joint listing of contempt petitions regarding CAPF deputation and challenges to a new law was done with the knowledge of the judges concerned. The move addresses overlaps created by a 2026 act reserving high-level CAPF posts for IPS officers. The registry's failure to properly inform one bench led to temporary confusion and the rescheduling of hearings.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "c192d551"}, {"headline": "Supreme Court denies Ilaiyaraaja relief in song copyright dispute", "summary": "The Supreme Court refused to interfere with a Delhi High Court order ruling that music composer Ilaiyaraaja does not own the copyright to the sound recordings of 'En Iniya Pon Nilave'. The court upheld that rights in the sound recordings vested with Saregama through original producer agreements. Ilaiyaraaja retains copyright in the musical composition but cannot block the sound recording's use.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "3786d5ff"}, {"headline": "All five Nagaland NPP MLAs merge with ruling NPF", "summary": "In a significant political shift, all five MLAs of the National People’s Party (NPP) in Nagaland have joined the ruling Naga People’s Front (NPF). The merger increases the NPF's strength in the 60-member state assembly to 39. The move further consolidates the ruling front's position in the state legislature.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "340be569"}, {"headline": "RSS Indore meet to implement new divisional organizational structure", "summary": "The RSS executive council meeting in Indore this November will formalize a structural shift, replacing 'Prants' with 'Sambhags' (divisions) to increase field reach. The number of divisional coordinators will rise to 85. The three-day meet will also take stock of centenary celebrations and deliberate on policy issues like the Uniform Civil Code and electoral roll anomalies.", "category": "Politics", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "b503906c"}, {"headline": "Allahabad HC judge criticizes quality of Full Court deliberations", "summary": "Justice Vinod Diwakar questioned the 'Chief Justice-centric' model of high court administration, noting that Full Court proceedings often fail to record individual dissents or concurrences. In a September 28 judgment, he called for a more deliberative and participative approach to administrative matters to ensure institutional accountability and preserve judicial character.", "category": "Law", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "b184f3c2"}, {"headline": "Odisha and Chhattisgarh CMs meet to resolve Mahanadi row", "summary": "Union Home Minister Amit Shah chaired a meeting with the Chief Ministers of Odisha and Chhattisgarh to address the long-standing Mahanadi river water dispute. The states agreed to continue data sharing and technical consultations for another month. CM Majhi and CM Sai expressed commitment to finding a fair, scientific settlement to ensure irrigation and flood control.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "4c559c38"}, {"headline": "New pocketless uniforms mandated for Ayodhya Ram Temple staff", "summary": "The Ram Janmabhoomi Teerth Kshetra Trust has introduced one-piece saffron uniforms without pockets for staff involved in counting temple offerings. The measure, alongside a ban on cell phones in sensitive areas, aims to tighten security and cash-handling procedures. Priests will also adopt a new dress code featuring yellow silk dhoti and upper cloth garments.", "category": "Culture", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "afc26e11"}, {"headline": "Allahabad HC: Police cannot illegally detain relatives to pressure accused", "summary": "The Allahabad High Court ruled that detaining an accused person’s family member as a surrendering tactic is unlawful. The court awarded ₹40,000 in compensation to Arvind Kumar Yadav, who was held for four days without connection to his brother's case. The court directed that the fine be recovered from the responsible officers' salaries and recorded in their service files.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "5dbe739a"}, {"headline": "Odisha headmaster booked for murder of Class 5 tribal student", "summary": "Police in Koraput, Odisha, have booked Dilip Panda, a residential school headmaster, for allegedly assaulting and killing a 10-year-old tribal student. The student, Ganga Jani, died at a district hospital after being confined following the assault. Panda faces charges of murder and violations under the SC/ST (Prevention of Atrocities) Act.", "category": "Law", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "e842bd7f"}, {"headline": "Gujarat government compulsorily retires two tainted IAS officers", "summary": "Under 'Operation Gangajal', the Gujarat government has compulsorily retired IAS officers K Rajesh and Gaurav Dahiya for serious misconduct and corruption. Rajesh was facing bribery allegations regarding arms licenses and land allotments, while Dahiya was involved in multiple disciplinary inquiries. The action is based on a review of their service records and ongoing proceedings.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "452a631d"}, {"headline": "Putin warns of global danger and nuclear weapon risks", "summary": "Russian President Vladimir Putin characterized the current global situation as a 'dangerous moment' during a press statement. He emphasized the essential need to ensure that weapons of mass destruction are never utilized. The remarks come amid heightened international tensions and ongoing conflicts involving nuclear-armed nations.", "category": "World", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "431dd4ee"}, {"headline": "Michael Jordan's 1998 Finals jersey sells for record $12.26 million", "summary": "A jersey worn by Michael Jordan during Game 3 of the 1998 NBA Finals has sold for a record-breaking $12.26 million at auction. The jersey, from Jordan's final 'Last Dance' season with the Chicago Bulls, was sold via the Joopiter digital auction house. It marks one of the highest prices ever paid for sports memorabilia.", "category": "Business", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "86ec398f"}, {"headline": "SpaceX launches NASA crew on retiring capsule mission to ISS", "summary": "SpaceX launched four astronauts to the International Space Station on Thursday using a capsule slated for retirement. The mission comes as NASA and SpaceX evaluate the future of human spaceflight programs. The crew will conduct scientific research and maintenance during their stay aboard the orbital laboratory.", "category": "Science", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "ba095954"}, {"headline": "Google releases Gemini 4 Argon AI with advanced reasoning", "summary": "Google has unveiled Gemini 4 Argon, its most advanced AI model featuring an industry-leading 1-million-token output limit for complex reasoning. Access is currently restricted to 'trusted cyber defenders' and US government partners. The model is Alphabet’s direct response to competitors OpenAI and Anthropic in the race for 'Super Intelligence' capabilities.", "category": "Technology", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "9c87012b"}, {"headline": "Federal judge blocks Trump's $100,000 H-1B visa fee", "summary": "A second US federal judge has blocked President Trump's proposed $100,000 fee for new H-1B visas. Judge Haywood Gilliam ruled that the administration failed to follow legal rule-making processes. The fee was intended for highly skilled foreign workers, but unions and employers successfully argued against its implementation pending a full lawsuit.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "e4c6f3cf"}, {"headline": "Indian equities slide for eighth week as Nifty hits 22,421", "summary": "The Nifty 50 recorded its longest weekly losing streak since 2001, falling for eight consecutive weeks. High US bond yields, a weak rupee, and foreign fund outflows of over ₹35,800 crore in September drove the market retreat. Auto and consumer-facing sectors saw the steepest declines, with investors now focused on upcoming RBI monetary policy and quarterly earnings.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "3ac77ee7"}, {"headline": "CBI files second charge sheet in Reliance Home Finance case", "summary": "The CBI named 11 accused, including Reliance ADA group executives, in a second charge sheet related to Reliance Home Finance Ltd. Investigators allege that ₹7,429.16 crore was diverted through conduit entities in violation of lender terms. Those named include former CFO Amit Bapna and group director Amitabh Jhunjhunwala for criminal conspiracy and cheating.", "category": "Law", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "cf760616"}, {"headline": "Steep hike in aviation fuel and commercial LPG prices", "summary": "Aviation turbine fuel (ATF) prices were raised by ₹16 per litre, while commercial LPG cylinder rates increased by ₹62.50. State-owned oil companies cited firming international benchmarks for the revisions. ATF now costs ₹137 per litre in Delhi, significantly impacting operating costs for domestic airlines which already face high fuel expenses.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "4116b27a"}, {"headline": "Indian wrestlers Aman and Sujeet urged to attack at Asian Games", "summary": "Coach Shako Bentinidis has advised Indian wrestlers Aman Sehrawat and Sujeet Kalkal to adopt a more aggressive style in the men's freestyle events in Nagoya. Sujeet, ranked World No. 2, enters with a 15-bout winning streak. The coach emphasized that dominating bouts through frequent attacks is crucial for success against elite Japanese and Iranian opponents.", "category": "Sports", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "8a76fbb4"}, {"headline": "J&K bowl out Rest of India for 237 in Irani Cup", "summary": "Ranji champions Jammu & Kashmir dismissed Rest of India for 237 on Day 1 of the Irani Cup in Srinagar. Medium pacers Sunil Kumar and Lone Nassir took three wickets each, while ROI captain Rishabh Pant fell for a low score due to an aggressive shot. At stumps, J&K reached 21/2, trailing by 216 runs in the opening innings.", "category": "Sports", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "086822cb"}, {"headline": "Vaidehee and Manish lead field for Fenesta Open Tennis", "summary": "Defending champions Vaidehee Chaudhari and Manish Sureshkumar will headline the 31st Fenesta Open National Tennis Championship in New Delhi. Chaudhari seeks her third title, while the field also includes rising star Shruti Ahlawat. The tournament, running from October 5 to 17, is India's premier national domestic tennis event.", "category": "Sports", "page": 13, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "70a0226f"}, {"headline": "Abhishek scores late winner as India beats Pakistan 4-3", "summary": "India secured a place in the Asian Games hockey final after a dramatic 4-3 win over Pakistan. Abhishek scored the decisive goal with 49 seconds left on the clock. India led 3-0 before a spirited Pakistan rally leveled the game. Harmanpreet Singh scored twice as India extended its decade-long unbeaten streak against their rivals to 22 matches.", "category": "Sports", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "b931599f"}, {"headline": "Indian shooters struggle in finals as Asian Games campaign concludes", "summary": "The Indian shooting contingent ended its Asian Games campaign with 15 medals, including 3 golds, but faced criticism for poor performance in individual finals. High-profile shooters like Manu Bhaker and Rudrankksh Patil failed to secure individual golds, with coaches pointing to nerves under pressure. Shooting finished as India's second-most successful discipline behind athletics.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "74f0043b"}, {"headline": "Ishan Kishan’s 80 powers India into cricket final", "summary": "Ishan Kishan smashed a 46-ball 80 to lead India to a 124-run victory over Sri Lanka in the Asian Games cricket semi-final. India posted 169/7 before Jasprit Bumrah and Axar Patel dismantled the Sri Lankan lineup for just 45 runs. India will now face Pakistan in the gold medal match following the latter's victory in their respective semi-final.", "category": "Sports", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "3952cc87"}, {"headline": "Pranavi Urs stays in medal hunt with second-round 63", "summary": "Indian golfer Pranavi Urs carded a bogey-free 63 to sit in second place at the halfway stage of the women's individual competition in Nagoya. Urs is currently two shots behind Singapore's Shannon Tan. Meanwhile, Aditi Ashok and Diksha Dagar struggled in the second round, leaving the Indian women's team in third place overall.", "category": "Sports", "page": 14, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "9cd1eb06"}, {"headline": "Alex Eala loses tennis semi-final to China’s Wang Xiyu", "summary": "Philippines' Alex Eala’s hope for an automatic Olympic berth ended after a 3-6, 6-3, 6-2 loss to China’s Wang Xiyu in the Asian Games semi-finals. Wang will face compatriot Zhang Shuai in the final. Eala additionally faces a potential $10,000 fine for withdrawing from the China Open to compete in the Games.", "category": "Sports", "page": 14, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139206", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139206"}], "article_id": "88de96b8"}, {"headline": "RBI approves record Rs 2.11 lakh crore dividend for the Centre", "summary": "The Reserve Bank of India board approved a record surplus transfer of Rs 2.11 lakh crore to the Union government for FY24. This is more than double the previous year's dividend and significantly higher than the government's budget estimate. The move provides a massive fiscal boost, allowing the government more room for infrastructure spending and deficit management.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "58f6fc3e"}, {"headline": "Sensex and Nifty hit all-time highs following RBI dividend boost", "summary": "Indian equity markets rallied to record levels on Wednesday as investors cheered the RBI’s higher-than-expected dividend announcement. The Nifty 50 surged past the 22,500 mark, while the Sensex gained nearly 1,200 points during intraday trade. Banking and financial stocks led the gains, driven by expectations of improved government liquidity and reduced borrowing requirements.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "d671db11"}, {"headline": "PM Modi sparks controversy with remarks on Mahatma Gandhi global fame", "summary": "Prime Minister Narendra Modi claimed in a television interview that the world did not know enough about Mahatma Gandhi until the 1982 biopic 'Gandhi' was released. He suggested that the Congress party failed to promote Gandhi’s global legacy over seventy years. Opposition parties criticized the statement, asserting that Gandhi’s influence was recognized worldwide long before the film.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "480da362"}, {"headline": "State funeral for Iran President Ebrahim Raisi begins in Tehran", "summary": "Thousands of mourners gathered in the Iranian capital for the funeral of President Ebrahim Raisi, who died in a helicopter crash on Sunday. Supreme Leader Ayatollah Ayatollah Khamenei led the prayers. Iran has scheduled snap presidential elections for June 28, while First Vice President Mohammad Mokhber serves as interim head until a permanent successor is elected.", "category": "World", "page": 10, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "d77a04e2"}, {"headline": "Pune Porsche case: Doctors arrested for allegedly swapping blood samples", "summary": "Pune police arrested two doctors from Sassoon General Hospital for allegedly tampering with blood evidence in the Porsche crash case. The doctors are accused of replacing the minor driver's blood sample with another to hide alcohol consumption. The incident, which killed two techies, has sparked nationwide outrage over attempts by influential families to obstruct the legal process.", "category": "India", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "3580a59e"}, {"headline": "Microsoft unveils Team Copilot and AI chips at Build 2024 conference", "summary": "Microsoft launched 'Team Copilot' at its annual developer conference, expanding its AI assistant from a personal tool to a collaborative group facilitator. The company also debuted its Cobalt 100 custom processor and new AI tools for developers. These updates aim to integrate generative AI deeper into enterprise software and the Windows operating system to compete with rivals.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "c426bec6"}, {"headline": "IndiGo parent InterGlobe Aviation reports Rs 1,895 crore quarterly profit", "summary": "InterGlobe Aviation, the operator of IndiGo, reported a net profit of Rs 1,894.8 crore for the fourth quarter, marking a 106% year-on-year growth. The results were supported by strong travel demand and higher load factors. The airline also announced plans to launch a business-class product on busy routes later this year, departing from its strictly low-cost carrier model.", "category": "Business", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "07f87180"}, {"headline": "Severe heatwave Red Alert persists for North India and Delhi", "summary": "The India Meteorological Department issued a red alert for Delhi and several northern states as temperatures crossed 47 degrees Celsius. Churu in Rajasthan recorded the highest temperature at 47.4 degrees. The weather office warns that severe heatwave conditions will continue for several more days. Authorities have urged residents to take precautions against heat-related illnesses.", "category": "Environment", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "0ce2a721"}, {"headline": "Kolkata Knight Riders reach IPL 2024 Final with win over SRH", "summary": "Kolkata Knight Riders secured their place in the IPL 2024 final after a dominant eight-wicket victory over Sunrisers Hyderabad in Qualifier 1. Mitchell Starc’s three wickets for 34 runs restricted SRH to 159, which KKR chased down easily in 13.4 overs. Shreyas Iyer and Venkatesh Iyer both hit half-centuries. The final match is set for Sunday at the MA Chidambaram Stadium in Chennai.", "category": "Sports", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "f7486693"}, {"headline": "NHAI to launch pilot for satellite-based toll collection this year", "summary": "The National Highways Authority of India announced it will pilot a satellite-based Global Navigation Satellite System tolling system on selected highway stretches. The system will charge vehicles based on the exact distance travelled, eventually eliminating the need for physical toll plazas. The project aims to reduce travel time and improve the efficiency of highway toll collection.", "category": "Infrastructure", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "489b2428"}, {"headline": "ISRO successfully conducts pre-burner ignition test for semi-cryogenic engine", "summary": "The Indian Space Research Organisation achieved a milestone by successfully completing the pre-burner ignition test for its 2,000 kN semi-cryogenic engine. Conducted at the ISRO Propulsion Complex, the test is vital for the development of future heavy-lift launch vehicles. This new liquid propulsion technology uses a kerosene-liquid oxygen combination to enhance rocket payload capacity.", "category": "Science", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "16a0a22c"}, {"headline": "SEBI issues show-cause notice to Hindenburg Research over Adani report", "summary": "The Securities and Exchange Board of India has issued a show-cause notice to Hindenburg Research regarding its critical report on the Adani Group. SEBI alleged that the US-based short-seller violated Indian regulations and engaged in unfair trade practices. Hindenburg denied the allegations, calling the notice an attempt to silence investigative research into corporate governance.", "category": "Business", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "48b6d4a7"}, {"headline": "TotalEnergies to invest 300 million dollars in Adani Green joint venture", "summary": "French energy giant TotalEnergies has entered into an agreement with Adani Green Energy to invest $300 million in a new 50:50 joint venture. The partnership will manage a 1,150 MW portfolio of solar and wind assets in India. This investment reinforces TotalEnergies' commitment to the Indian renewable energy market and marks continued collaboration with the Adani Group.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139177", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE DELHI 2--10.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139177"}], "article_id": "db431de9"}, {"headline": "Modi, Macron discuss strategic autonomy, Indo-Pacific cooperation", "summary": "Prime Minister Narendra Modi and French President Emmanuel Macron held extensive talks on strategic autonomy and cooperation in the Indo-Pacific region. The leaders reviewed bilateral ties and discussed regional and global issues of mutual interest.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "da7c8011"}, {"headline": "India to host G20 summit in September", "summary": "India will host the G20 Leaders' Summit in New Delhi on September 9-10. The summit will bring together leaders of the G20 nations to discuss pressing global economic and developmental challenges.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "87b6f827"}, {"headline": "Supreme Court to hear plea on Manipur violence", "summary": "The Supreme Court will hear a batch of petitions seeking urgent intervention in the ongoing ethnic violence in Manipur. The court has sought detailed reports from the state and central governments.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "7df1380e"}, {"headline": "Inflation concerns persist, food prices eyed", "summary": "Retail inflation remains a concern, primarily driven by rising food prices. The government is monitoring the situation and considering measures to control price increases.", "category": "Economy", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "2361be67"}, {"headline": "India's manufacturing PMI rises to 57.8 in August", "summary": "India's manufacturing Purchasing Managers' Index (PMI) increased to 57.8 in August, indicating a strong expansion in manufacturing activity. New orders and production rose significantly.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "f0c228a8"}, {"headline": "New policy to boost semiconductor manufacturing", "summary": "The government is set to unveil a new policy aimed at boosting domestic semiconductor manufacturing. The policy will offer incentives and support to attract investments in the sector.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "394d1c48"}, {"headline": "Monsoon advances, rainfall deficit narrows", "summary": "The Indian monsoon has advanced further, helping to narrow the rainfall deficit across the country. However, some regions continue to experience below-normal rainfall.", "category": "India", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "b3d4c3a7"}, {"headline": "Heatwave conditions expected in parts of North India", "summary": "Meteorological department forecasts heatwave conditions in several parts of North India, including Delhi, Punjab, and Haryana. Residents are advised to take precautions.", "category": "India", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "a93b0bb5"}, {"headline": "Global economic outlook uncertain, IMF warns", "summary": "The International Monetary Fund (IMF) has warned of persistent uncertainty in the global economic outlook. Slowing growth in major economies and geopolitical tensions are key concerns.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "e14647c9"}, {"headline": "Ukraine conflict continues, peace talks stalled", "summary": "The conflict in Ukraine shows no signs of de-escalation, with fighting continuing in several regions. Diplomatic efforts for a ceasefire and peace talks remain stalled.", "category": "World", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "dfad2075"}, {"headline": "India wins Asian Champions Trophy hockey title", "summary": "India defeated Malaysia 4-0 in the final to win the Asian Champions Trophy men's hockey tournament. This is India's fourth title in the competition.", "category": "Sports", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139123", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139123"}], "article_id": "45ab4f40"}, {"headline": "Neeraj Chopra leads strong In
