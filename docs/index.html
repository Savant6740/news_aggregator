4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "9041bf28"}, {"headline": "Woman loses Rs 67k after son gives bank details to mobile thief", "summary": "A railway passenger lost her mobile phone and Rs 67,749 from her bank accounts after a thief, posing as her, messaged her son for bank details and PIN. The incident occurred on a train in Bengaluru, highlighting cyber fraud risks.", "category": "Law", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "b41f9ec1"}, {"headline": "Devotees pay Rs 2k for special darshan, yet wait for hours", "summary": "Devotees paying Rs 2,000 for special darshan at Sri Chamundeshwari Temple in Mysuru still face 3-4 hour queues, especially on Ashadha Fridays. They complain of poor crowd management, questioning the hefty fee without a hassle-free experience.", "category": "Culture", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8f3b1a40"}, {"headline": "Double-line plan for Hubballi-Ankola project revived", "summary": "The South Western Railway revived the contentious Hubballi-Ankola railway project, submitting a fresh forest clearance proposal for a 163-km electrified double-line corridor costing Rs 16,436 crore. The revised plan seeks 586 hectares, marginally less forest land than previous proposals.", "category": "Infrastructure", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "308b3fa8"}, {"headline": "Pet detective: Canine Simbha sniffs out accused in murder case", "summary": "A police dog, Simbha, helped crack a mysterious murder case in Srirangapatna, leading investigators to the victim's assistant. Simbha traced the accused to a bus near the Tamil Nadu border, and bloodstains confirmed his involvement in the bludgeoning.", "category": "Law", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "58086abb"}, {"headline": "Mobile clinic for injured animals to be launched in Bengaluru East", "summary": "Bengaluru East City Corporation will launch a mobile veterinary clinic on July 30 to provide on-site emergency treatment to injured and sick community animals. Citizens can report cases via Sahaaya App or the civic helpline for first aid and basic treatment.", "category": "Environment", "page": 9, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "0d183093"}, {"headline": "Root canal surgery performed on tigress Sinchana", "summary": "A root canal surgery was successfully performed on four-year-old tigress Sinchana at Wildlife SOS Bannerghatta Bear Rescue Centre. Veterinary teams from BBP and Wildlife SOS saved her damaged canine tooth, ahead of International Tiger Day.", "category": "Science", "page": 9, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "47dad68c"}, {"headline": "India: Pak-backed terror stalls Saarc summit process", "summary": "India reiterated that Pakistan's support for cross-border terrorism and interference in internal affairs has stalled the SAARC summit process, after Maldives President Muizzu called for its resumption. India stated regional cooperation requires goodwill.", "category": "Politics", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "fdaad2e1"}, {"headline": "India, China move ahead on resuming border trade via designated points", "summary": "India and China are progressing with their August 2025 understanding to resume border trade through designated points: Lipulekh, Shipki La, and Nathu La Pass. MEA spokesperson Randhir Jaiswal confirmed the decision is being taken forward.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "3939338d"}, {"headline": "One officer, one car: Finmin tightens rules for babus’ vehicle use", "summary": "The Finance Ministry tightened rules for official vehicle use, stating an officer entitled to a staff car can only be allotted one, even with additional charges. It also barred using PSU/autonomous body vehicles, except on official tour, to prevent misuse and optimize utilization.", "category": "Economy", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "19ac75ff"}, {"headline": "MP groom alleges spouse hid gender identity, files complaint", "summary": "A 32-year-old man in Shajapur, Madhya Pradesh, alleged his spouse is transgender and filed a complaint against his in-laws for concealing this before the wedding. The groom's suspicions grew after repeated excuses to avoid consummating the marriage.", "category": "Law", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "ebae3aa0"}, {"headline": "Why your phone use may be making your neck age faster", "summary": "Prolonged phone use, causing a forward head tilt of 45 degrees, adds 22 kg of weight to the neck, leading to \"phone body\" conditions like chronic stiffness, disc prolapse, and hunched posture. Dermatologists also note increased neck creases and pigmentation due to screen time.", "category": "Health", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8deec86b"}, {"headline": "Heart CT should be selective, can trigger unnecessary anxiety", "summary": "A cardiologist advises selective use of heart CT scans, particularly for patients with chest pain, not as routine screening for everyone. While useful for identifying blockages, overuse can lead to unnecessary anxiety, further tests, and does not guarantee reduced heart attacks.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "45d3949c"}, {"headline": "HC: Can’t tarnish cop’s image over alleged ‘power overuse’", "summary": "The Delhi High Court dismissed a plea seeking removal of an inquiry against Additional DCP Sandeep Lamba, stressing that a police officer's image cannot be \"tarnished\" over alleged \"overuse of power.\" The court noted police officers also have rights to a fair trial.", "category": "Law", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "291c2813"}, {"headline": "‘Streets will speak for youth if promises are broken’: CJP", "summary": "CJP spokesperson Saurav Das warned that if government's assurances regarding no coercive action against NEET protesters are dishonored, \"the streets of India will once again become the voice of its young.\" CJP views SC order as contradictory to July 25 commitments.", "category": "Politics", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "ab576d55"}, {"headline": "India’s Left blind at 14 by pellet, J&K survivor searches for future", "summary": "Insha Mushtaq, blinded at 14 by pellets during J&K's 2016 unrest, now 24, is completing a bachelor's degree in arts through Ignou, hoping for a government job. Her story highlights the lasting impact of conflict and the debate on crowd control.", "category": "India", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "596a51e1"}, {"headline": "PM to secys: Govt must remain youthful & forward-looking", "summary": "PM Narendra Modi told top economic ministry officials that government must remain \"youthful, dynamic, forward-looking,\" adapting to new challenges. He stressed reforming processes, improving work culture, and strengthening institutional efficiency, while addressing misinformation and promoting self-reliance.", "category": "Politics", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "911b917a"}, {"headline": "MeitY probes automated PM video removal from Meta platforms", "summary": "The Ministry of Electronics and Information Technology (MeitY) is probing the brief removal of PM Modi's Facebook post, which Meta attributed to an \"internal technical glitch.\" MeitY seeks to determine if automated systems caused it and what safeguards prevent similar incidents.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "76feda0f"}, {"headline": "‘Motivated elements’ behind attacks on police and RAF: Sources", "summary": "Sources claim \"motivated elements\" attacked Delhi Police and Rapid Action Force personnel with stones and iron rails during protests. CRPF asserts pellet guns are approved \"non-lethal\" measures used with authorization after other crowd control methods failed.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "69296cb4"}, {"headline": "SC orders police not to publicise personal data of protesters", "summary": "The Supreme Court directed police in all states to ensure personal data, including facial recognition data, collected from protesters is not publicly disclosed. This order also means no arrests of students (without prior criminal records) from registered FIRs until further directions.", "category": "Law", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "d354ca32"}, {"headline": "MSMEs to get their dues cleared faster with new bill", "summary": "Small businesses supplying goods and services to central public sector undertakings (CPSUs) will get their dues cleared faster under proposed amendments to the MSME Development Act, 2006. The bill seeks mandatory digital invoicing, stronger protection against delayed payments, and faster dispute settlement.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "4da29014"}, {"headline": "SC warns Bihar govt not to damage water bodies under garb of beautification", "summary": "The Supreme Court warned the Bihar government against filling parts of three historic ponds in Darbhanga for \"beautification\" projects. The court ordered an immediate halt to ongoing work and directed state officers not to touch the water bodies without its approval.", "category": "Environment", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "c5abd3ec"}, {"headline": "Viral map could help make better flu shots, antivirals", "summary": "German scientists created a detailed flu map showing how influenza A virus modifies human cells during infection, published in Nature Microbiology. This could lead to more effective flu vaccines and antiviral drugs, by revealing how the virus invades cell nuclei.", "category": "Science", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "a2e7f180"}, {"headline": "Does eating carrots detoxify your body? Health myth debunked", "summary": "The claim that carrots can detoxify the body, reduce bloating, or regulate hormones is a health myth without scientific backing. The human body has its own efficient detox system via liver, kidneys, and digestive tract; a single food cannot replace this natural process.", "category": "Health", "page": 13, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e8e14960"}, {"headline": "Artificial sweeteners can impact metabolic health, increase insulin resistance", "summary": "Artificial sweeteners, while calorie-free, are not benign additions to diet. Experts warn they can impact metabolic health, increase insulin resistance, and even heighten appetite over time, with some linked to heart disease and negative gut microbiome effects.", "category": "Health", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "85bf24fe"}, {"headline": "Democracy’s Table Manners: Protest beyond law is essential", "summary": "An opini  "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "b950573a"}, {"headline": "Mallika Prasad Sinha’s ‘For My Ela’ wins Best Indie Short at Cannes", "summary": "Mallika Prasad Sinha's short film \"For My Ela\" won the Best Indie Short award at the 12th Cannes Independent Shorts. The film, shot and edited between 2023 and 2025, reflects on environmental themes, inspired by the Spiti Valley.", "category": "Culture", "page": 27, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 27, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "19eb08fc"}, {"headline": "Dear waiters, I’m right here: Social commentary on gender bias in service", "summary": "A social commentary highlights gender bias in restaurant service, where waiters often direct all conversation and the bill to male companions, ignoring female diners. It advocates for inclusive service that acknowledges all guests, regardless of gender.", "category": "Culture", "page": 28, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 28, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "79c7fd47"}, {"headline": "Adil Hussain says family in Assam affected by floods", "summary": "Actor Adil Hussain shared that several of his family members, including nieces, have their houses filled with water in Upper Assam’s Sivasagar due to floods. He is trying to help and believes the recurring crisis needs better planning.", "category": "Culture", "page": 28, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 28, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "386da1dc"}, {"headline": "Tiger Shroff ests. It indicated an independent probe into police excesses, restraining coercive action against students without criminal antecedents. States can continue investigations, but the court will review police conduct.", "category": "Law", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "3f605215"}, {"headline": "CJP warns government against witch-hunt of students, threatens new stir.", "summary": "Cockroach Janta Party (CJP) founder Abhijeet Dipke warned the government to stop \"witch-hunting\" students or face new protests. This comes after concerns that the Centre might \"weaponise\" a recent SC order, despite the Centre's assurance of no punitive action. Delhi Police remain silent on FIR withdrawals.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "5cf902ad"}, {"headline": "Heavy rain causes Delhi waterlogging, sparks AAP-BJP blame game.", "summary": "Delhi experienced waterlogging after heavy rain, leading to a political dispute between AAP and BJP. AAP criticized the BJP for poor civic works, while BJP blamed AAP for 27 years of monsoon issues. CM Rekha Gupta inspected affected areas.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "90e40115"}, {"headline": "Centre argues Delhi HC lacks jurisdiction to stay Gymkhana Club eviction.", "summary": "The Centre opposed a Delhi High Court plea to stay eviction proceedings against the Delhi Gymkhana Club, arguing the court lacks jurisdiction. This dispute follows the Centre's decision in May to terminate the club's perpetual lease, citing land requirements for defense.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "154abe56"}, {"headline": "Delhi L-G lays foundation for city’s first dedicated dog shelter.", "summary": "Lieutenant-Governor Taranjit Singh Sandhu laid the foundation stone for Delhi’s first dedicated dog shelter in Dwarka. The Municipal Corporation of Delhi will build the facility on 6,050 square metres, expected to be operational by November.", "category": "Infrastructure", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "bbc244e0"}, {"headline": "HC refuses to move probe from officer accused of slapping woman.", "summary": "The Delhi High Court declined to transfer a 2025 probe from Additional DCP Sandeep Lamba, who was seen allegedly slapping a woman. The court stated an officer cannot be presumed biased for another incident.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "768ef51a"}, {"headline": "Delhi Lakshmi Yojana roll out August 28; criteria announced.", "summary": "Delhi government's ₹2,500 monthly Lakshmi Yojana will roll out August 28. Women with over three children, taxpayers, government employees, and those receiving other financial aid are ineligib ce": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "39d7aeea"}, {"headline": "Tamil Nadu CM seeks PM's intervention in Mekedatu dam row.", "summary": "Chief Minister C. Joseph Vijay wrote to Prime Minister Narendra Modi, seeking his intervention to prevent approval for the proposed Mekedatu project. He argued it's inconsistent with settled law, requiring consent from lower riparian states and Central government approval.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "ab638c4a"}, {"headline": "Kolkata Police withdraw suo motu FIR against NEET protesters.", "summary": "Kolkata Police withdrew a suo motu FIR against protesters for alleged violence during a July 24 march supporting NEET agitators. A city court granted bail to all 16 accused. The West Bengal Home Department clarified no coercive action would be taken against students.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "e9e2748c"}, {"headline": "Sharad Pawar dismisses NCP merger speculations as irrelevant.", "summary": "NCP (SP) leader Sharad Pawar dismissed reports of a merger between his faction and the Sunetra Pawar-led NCP group as \"irrelevant.\" This statement follows months of speculation about unity, contrary to some leaders' wishes for the two factions to reunite.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "d8763b82"}, {"headline": "Lawyer, food delivery agents among those held in Assam protests.", "summary": "A lawyer in court dress and two food delivery agents were among those detained by Assam Police during NEET paper leak protests, despite identifying themselves. The Assam government later withdrew five cases, and is reviewing arrests of 13 people, including students.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "f32fddec"}, {"headline": "Punjab FM refutes paper leak claims, blames Opposition for lies.", "summary": "Punjab Finance Minister Harpal Singh Cheema rejected opposition claims of paper leaks in the state, accusing them of spreading lies against the AAP government. He asserted no leaks occurred in the past four years of the Bhagwant Mann administration.", "category": "Politics", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "0361204d"}, {"headline": "U.P. school students protest for basic facilities, echoing Jantar Mantar.", "summary": "Hundreds of students at a government-aided school in Uttar Pradesh's Fatehpur district staged a protest for better infrastructure, drawing parallels to the Jantar Mantar stir. They demanded fans, water coolers, and proper midday meals. Nagina MP Chandrashekhar Azad shared videos of the protest.", "category": "Education", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "be836150"}, {"headline": "AISA alleges police crackdown on NEET paper leak protesters.", "summary": "The All India Students’ Association (AISA) alleged a police crackdown on NEET paper leak protesters across the country, citing arrests in Bihar, West Bengal, Jharkhand, and notices based on retina/face scanning in Delhi’s Jamia Nagar. AISA demands release of detainees and compensation for injured.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "159394de"}, {"headline": "Pinarayi Vijayan urges Kerala CM to withdraw student protest cases.", "summary": "Leader of Opposition Pinarayi Vijayan wrote to Kerala Chief Minister V.D. Satheesan, demanding unconditional withdrawal of all cases against students who protested in solidarity with the Jantar Mantar agitation. Reports indicate nearly 5,000 people face charges in Kerala.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "c69e0baf"}, {"headline": "Bankipur byelection campaigning ends; BJP, JSP, RJD in key contest.", "summary": "Campaigning for Bihar's July 30 Bankipur Assembly byelection concluded. BJP's Neeraj Kumar Sinha faces RJD's Rekha Kumari and JSP founder Prashant Kishor in a seat vacated by BJP national president Nitin Nabin. Results will be declared August 3.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "58a0c7be"}, {"headline": "RSS condemns Hindutva ideologue's controversial remarks on student protests.", "summary": "The RSS condemned T.G. Mohandas's controversial remarks against Jantar Mantar student protests, where he suggested shooting protesters and that secular women \"enjoy being gangraped.\" A Kerala RSS official clarified Mohandas's views are personal and not those of the organization.", "category": "Politics", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "2ea498cd"}, {"headline": "Kerala teen critical with rare amoebic brain infection.", "summary": "A teenager in Kasaragod, Kerala, is in critical condition with amoebic meningoencephalitis, a rare but life-threatening brain infection. The teen had bathed in a pond along the Kanhangad-Panathur State highway. Health officials warned against using the pond.", "category": "Health", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "31585483"}, {"headline": "SC pleas allege illegal detentions in Delhi, Bihar student protests.", "summary": "Several petitions in the Supreme Court allege \"illegal and arbitrary detention\" of individuals, including a food volunteer and a law student, associated with student protests in Delhi and Bihar. One applicant claims he was blindfolded and detained after distributing food at Jantar Mantar.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "b23d59ef"}, {"headline": "MP moves SC against mass surveillance at NEET protests.", "summary": "Rajya Sabha MP A.A. Rahim moved the Supreme Court against Delhi Police's use of facial recognition technology and mass surveillance during NEET-UG protests, seeking a judicial declaration that such surveillance is unconstitutional without a valid law.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "0449d434"}, {"headline": "SC hearing on NEET protests yet to reveal police-Home Ministry communication.", "summary": "The Supreme Court hearings on NEET-UG protests haven't revealed if Delhi Police consulted the Union Home Ministry regarding actions on July 20. The Ministry controls Delhi Police, and political executive influence over police is a recurring concern, as highlighted in previous judgments.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "ab3ba5a5"}, {"headline": "India's Gen Z wants Pakistan to end terror activities, says government.", "summary": "India reiterated that Pakistan sponsors cross-border terrorism, stating that India's Gen Z demands an end to such activities. The External Affairs Ministry's spokesperson, Randhir Jaiswal, made these remarks regarding Pakistani social media support for student protesters.", "category": "India", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "6e69737d"}, {"headline": "Meta apologizes for mistakenly removing PM Modi's video.", "summary": "Meta apologized for mistakenly flagging and removing Prime Minister Narendra Modi's video on NEET exam paper leaks, stating it was an error by an automated moderation tool designed for AI-generated content. The content has since been restored. The government has summoned a Meta executive.", "category": "Technology", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "a363d95d"}, {"headline": "Paper leak Bill a milestone, Opposition calls it ‘cosmetic exercise’.", "summary": "The Lok Sabha debated the Public Examinations Amendment Bill, 2026. The government hailed it as a \"milestone,\" strengthening the 2024 anti-paper leak law with stricter penalties. Opposition called it a \"cosmetic exercise\" and \"admission of failure,\" questioning the previous law's effectiveness.", "category": "Politics", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "412aa994"}, {"headline": "Priyanka Gandhi, Venugopal demand accountability for police action on NEET protesters.", "summary": "Priyanka Gandhi Vadra and K.C. Venugopal demanded accountability for police action against NEET-UG protesters, accusing the Centre of using force instead of addressing concerns. Ms. Vadra cited 152 paper leaks and alleged police brutality, while Mr. Venugopal called for identifying and holding responsible those behind the attacks.", "category": "Politics", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "00f247d2"}, {"headline": "Akhilesh Yadav likens police action on protesters to Emergency.", "summary": "Samajwadi Party president Akhilesh Yadav compared police action against NEET-UG protesters to the Emergency, claiming the Modi government was forced to yield. He stated that former Education Minister Dharmendra Pradhan's resignation reflected pressure from the unprecedented student movement.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "4ca50988"}, {"headline": "DMK reiterates demand to scrap NEET, blames Centre for ignoring T.N.", "summary": "The DMK renewed its demand to scrap NEET in the Lok Sabha, arguing proposed amendments to the anti-paper leak law don't address the core issue of the exam itself. DMK MP Dayanidhi Maran claimed NEET disadvantages first-generation learners and benefits coaching centres.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "14bde0ad"}, {"headline": "K.T. Rama Rao calls linking women's quota, delimitation \"unwise\".", "summary": "BRS leader K.T. Rama Rao called linking women's reservation with delimitation \"unwise,\" arguing southern states would be penalized for population control. He suggested either increasing all MLA seats or reaching a consensus to maintain southern states' 24% Lok Sabha representation.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "5fb3e36a"}, {"headline": "Centre reissues draft notification for Western Ghats eco-sensitive zone.", "summary": "The Union Environment Ministry reissued its draft notification for an ecologically sensitive area (ESA) across the Western Ghats for the seventh time, proposing it at 56,825.7 sq. km. This comes amid continuing differences with six States over included villages and regulatory provisions, fearing impact on farming and infrastructure.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "41d2cb83"}, {"headline": "Delhi leads with 6,115 e-Zero FIRs for cyber financial fraud.", "summary": "Delhi has recorded 6,115 e-Zero FIRs for cyber financial fraud since May 2025, the highest among 18 States and Union territories implementing the system, the government informed Parliament.", "category": "Law", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "eaba4dff"}, {"headline": "1.5 lakh Meghalaya voters marked as Absent, Shifted, Dead, Duplicate.", "summary": "Nearly 1.5 lakh electors (6.37% of the electorate) in Meghalaya have been marked under the Absent, Shifted, Dead, and Duplicate (ASDD) category during the ongoing special intensive revision of electoral rolls.", "category": "Politics", "page": 12, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "bc71e5e7"}, {"headline": "44.73 crore Ayushman cards generated under AB-PMJAY.", "summary": "Over 44.73 crore Ayushman cards have been created under the AB-PMJAY scheme, with over 12.69 crore hospital admissions worth ₹1.92 lakh crore authorized, Parliament was told.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "235b3a73"}, {"headline": "Bengal government curtails financial, administrative powers of panchayats.", "summary": "West Bengal's BJP government stripped elected panchayat heads of administrative and financial powers, transferring rights for birth/death certificates and financial disbursements to government officials. This aims to curb corruption and increase bureaucratic intervention in local self-governance.", "category": "Politics", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "e7d73307"}, {"headline": "Government considers relaxing airport-airline cross-ownership rules.", "summary": "The Civil Aviation Ministry is examining relaxing cross-ownership restrictions between airport operators and airlines, following an Adani Group request. This could allow airport operators to acquire airline stakes, but major airlines oppose it due to potential conflicts of interest and weakened competition.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "bb069409"}, {"headline": "The Hindu Group bags 7 awards at MADDYS 2026, including Grand Prix.", "summary": "The Hindu Group won the Grand Prix for \"The Hindu Written by Journalists\" campaign at MADDYS 2026, along with two Gold and two Bronze awards for various campaigns in digital, print, and integrated categories. It was also named 'Client of the Year'.", "category": "Business", "page": 13, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "fd1f1e43"}, {"headline": "LIC appoints Shatmanyu Shrivastava as new CFO.", "summary": "LIC appointed Shatmanyu Shrivastava as Executive Director (Finance & Accounts) and Chief Financial Officer, succeeding Sunil Agrawal. Varadarajan Muthuvenkataraman was appointed Executive Director (Enterprise Risk Management) and Chief Risk Officer.", "category": "Business", "page": 13, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "645e55d6"}, {"headline": "ONGC approves $500 mn guarantee for MRPL's Saudi Aramco crude imports.", "summary": "ONGC approved a $500 million parent company guarantee for its subsidiary MRPL, in favor of Saudi Aramco, to facilitate crude oil imports. This guarantee is valid for approximately two years, from September 1, 226 to August 31, 2028.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "8c3b99e7"}, {"headline": "India is Germany's strongest growth market, says Tourist Office.", "summary": "India is one of Germany's strongest growth markets. The German National Tourist Office (GNTO) unveiled four campaign themes for 2026. Lufthansa Group is investing €3 billion to expand its India-bound fleet, including doubling Mumbai-Munich capacity with an Airbus A380.", "category": "Economy", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "51fb2836"}, {"headline": "Ampere partners with Muthoot Capital for electric mobility financing.", "summary": "Ampere, Greaves Electric Mobility’s e-two-wheeler brand, partnered with Muthoot Capital Services to make electric mobility ownership more accessible and affordable, aiming to remove financial barriers and accelerate clean mobility adoption.", "category": "Business", "page": 13, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "659ce829"}, {"headline": "Air India FY26 loss more than doubles to ₹22,238 crore.", "summary": "Air India's net loss more than doubled to ₹22,238 crore in FY26, from ₹76,754 crore in FY25. Revenue slid to ₹70,081 crore due to geopolitical tensions, operational disruptions, and one-off events. The turnaround may extend to a decade.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "47d508b8"}, {"headline": "Indian space tech firms raised $200 mn in 2025, Bengaluru leads.", "summary": "Indian space tech firms raised a record $200 million in 2025, with Bengaluru attracting over half the funds, according to Tracxn. Skyroot Aerospace leads funding at $150 million. Investor base expanded to include sovereign wealth funds and global institutional investors.", "category": "Technology", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "5cbcb68a"}, {"headline": "Zelenskyy hails \"good\" talks with Trump on Ukraine diplomacy.", "summary": "Ukrainian President Volodymyr Zelenskyy hailed \"good talks\" with Donald Trump at the White House, discussing licenses for Patriot interceptor production and ways to revive negotiations with Russia. He emphasized reinvigorating the diplomatic process.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "f77ee769"}, {"headline": "Israel says U.S. bombers used its bases to hit Iran.", "summary": "Israeli Defence Minister Israel Katz stated American warplanes used Israeli bases for attacks on Iran, following the collapse of an April ceasefire. Katz reiterated Israel's readiness to retaliate if targeted, amid ongoing U.S.-Iran hostilities.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "6137b2e4"}, {"headline": "Iranian Kurdish party denies being proxy, seeks democratic Iran.", "summary": "The Kurdistan Free Life Party (PJAK), an armed Kurdish group in Iran, stated it is not a \"proxy force\" and will only join the U.S.-Israel war against Iran if Kurdish existence is threatened. It seeks a democratic transformation of Iran and views pressure on the regime as positive, if civilians are unharmed.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "9c35a217"}, {"headline": "Netanyahu visits White House for first Trump talks during Iran war.", "summary": "Israeli Prime Minister Benjamin Netanyahu met President Donald Trump at the White House for their first talks since the Iran war began. The meeting, described as \"positive and productive,\" lasted about 90 minutes.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "a7949526"}, {"headline": "U.S. reviews military presence in Europe amid Trump's NATO criticism.", "summary": "The U.S. began reviewing its military presence in Europe after Secretary of War Pete Hegseth informed NATO allies of the analysis. President Donald Trump has repeatedly criticized European allies over their response to his war in Iran.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "a72b5599"}, {"headline": "UN: Cross-border fighting killed 500 Afghan civilians.", "summary": "Cross-border fighting between Pakistan and Afghanistan killed nearly 500 Afghan civilians and wounded over 1,000 between October and June, the UN reported. Pakistan accuses Afghanistan of harboring militants; Kabul denies.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "92c15a61"}, {"headline": "JAAC claims 14 killed, dozens injured in PoK clashes.", "summary": "The banned Joint Awami Action Committee (JAAC) claimed 14 activists were killed and over two dozen injured in clashes with security forces during PoK elections. Officials accused JAAC protesters of opening fire.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "6dfffd26"}, {"headline": "Jadumani Singh reaches CWG boxing semifinals, assures medal.", "summary": "Jadumani Singh advanced to the men’s 55kg boxing semifinals at the Commonwealth Games with a 5-0 victory over Zambia’s Mwengo Mwale, assuring India of at least a bronze medal.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "9c91c4cd"}, {"headline": "Vishal T.K. qualifies for 400m semifinal at CWG.", "summary": "National record holder Vishal T.K. (46.49s) qualified for the men’s 400m semifinals at the Commonwealth Games, keeping India's medal hopes alive. Compatriot Rajesh Ramesh (47.43s) narrowly missed the cut.", "category": "Sports", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "85305b10"}, {"headline": "Ryan ten Doeschate leaves India's cricket coaching staff.", "summary": "Ryan ten Doeschate resigned as India’s assistant coach, ending his stint that began in July 2024. His departure follows the conclusion of India’s recent tour of England.", "category": "Sports", "page": 15, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "d1257d07"}, {"headline": "West Indies one wicket from winning Pakistan Test.", "summary": "West Indies was one wicket away from beating Pakistan when tea was called on Day 4 of the opening Test in Tarouba. Scores: West Indies 311 & 181; Pakistan 282 & 114/9.", "category": "Sports", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "bcd6a13e"}, {"headline": "Boxers Preeti, Priya Ghanghas assure CWG medals for India.", "summary": "Preeti (54kg) and Priya Ghanghas (60kg) advanced to the semifinals in their respective boxing categories at the Commonwealth Games, assuring India of at least two bronze medals. Preeti dominated Northern Ireland's Clyde 5-0, while Priya beat Scotland’s Niamh Mitchell 4-1.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "33d98566"}, {"headline": "Off-spinner Saransh Jain earns maiden Test call-up for Sri Lanka tour.", "summary": "Off-spinner Saransh Jain earned his maiden call-up to India's Test squad for a two-match series against Sri Lanka next month, replacing injured Washington Sundar. Jain, 33, from Madhya Pradesh, has 188 First Class scalps.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "b54a336e"}, {"headline": "Indian women's table tennis team advances to CWG semifinals.", "summary": "The Indian women's table tennis team defeated Australia 3-2 to secure a spot in the Commonwealth Games semifinals. Olympian Sutirtha Mukherjee secured a crucial singles victory. The team then beat Sri Lanka 3-0.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "7ee462d1"}, {"headline": "Josko Gvardiol signs new five-year deal with Manchester City.", "summary": "Josko Gvardiol signed a new five-year contract with Manchester City, committing him until 2031 with an option for 12 additional months. The central defender has made 122 appearances since joining in 2023.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "1926fc43"}, {"headline": "Indian women lose to Malaysia in World Jr. Squash.", "summary": "The Indian women's team lost 1-2 to Malaysia in the World Junior Squash Championships. Anahat Singh won her match, but Rudra Singh and Anika Dubey lost theirs, preventing India from advancing.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "c0fcdba2"}, {"headline": "Punjab FC signs forwards Gurkirat and Nishchal for two years.", "summary": "Punjab FC signed forwards Gurkirat Singh and defender Nishchal Chandan to two-year agreements until May 31, 2028, bolstering its squad for the upcoming I-League season.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "202a8661"}, {"headline": "South United FC defeats CISF Protectors 2-0 in Durand Cup.", "summary": "South United FC defeated CISF Protectors 2-0 in the Durand Cup, with Ashish Chetry scoring in the 84th minute. This win propelled South United to the top of Group-A. TRAU FC and NEROCA FC drew 0-0 in another match.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "56aff42f"}, {"headline": "Manchester City's Rodri sidelined with injury.", "summary": "Spain's World Cup-winning captain Rodri of Manchester City will be sidelined for a \"short period\" after undergoing a procedure for an unspecified issue, which he said he will rehabilitate from.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "215581e5"}, {"headline": "Casper Ruud completes Team Europe's Laver Cup line-up.", "summary": "Norway's Casper Ruud completed Team Europe's line-up for the Laver Cup in London. The team also includes Carlos Alcaraz, Jannik Sinner, Felix Auger-Aliassime, Jakub Mensik, and Rafael Jodar for the September 25-27 event.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "4d4ce8d0"}, {"headline": "Djokovic-Sabalenka top US Open mixed doubles pairings.", "summary": "Novak Djokovic and Aryna Sabalenka headline the initial pairings for the US Open mixed doubles, with both men's World No.1 Jannik Sinner and No.2 Carlos Alcaraz not entered. The competition will feature a shorter scoring format and new scheduling.", "category": "Sports", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "33ad0c50"}, {"headline": "Marc Cucurella gets coach De la Fuente tattoo after WC win.", "summary": "Marc Cucurella revealed a new tattoo of coach Luis de la Fuente on his arm, fulfilling a promise made if Spain won the World Cup. The tattoo depicts De la Fuente in a suit, holding the World Cup.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "1414b032"}, {"headline": "TVS launches mini bikes for grassroots two-wheeler racing development.", "summary": "TVS Motor Company launched TVS Apache RR 200 Mini bikes to train young racers aged 10-14, providing 10 bikes to Madras Motor Sports Club. This initiative aims to develop grassroots two-wheeler racing skills, equipping aspirants with professional training and safety gear.", "category": "Sports", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "128253aa"}, {"headline": "Corinthian wins Colonel B. Santosh Babu Memorial Trophy.", "summary": "Corinthian, ridden by P. Trevor, won the Colonel B. Santosh Babu Memorial Trophy at Hyderabad. Other races saw wins for Everest (Akshay Kumar), Adarsh (Akshay Kumar), and Zindabaad (P. Trevor).", "category": "Sports", "page": 16, "importance": 1, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "24d81be1"}, {"headline": "Abdusattorov confident about Uzbekistan's home Olympiad performance.", "summary": "Former World rapid champion Nodirbek Abdusattorov expressed confidence in Uzbekistan's chess team for the upcoming Olympiad in Samarkand. He will help Javokhir Sindarov prepare for his World Championship match against D. Gukesh, praising the \"golden generation\" of Uzbek chess.", "category": "Sports", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "1ebb2a63"}, {"headline": "Urban Indian private schools at risk near toxic lead sites: report.", "summary": "A Center for Global Development report found over 90% of private schools in New Delhi are near sites contaminated with lead, mercury, arsenic, and/or pesticides. In low- and middle-income countries (LMICs), urban schools are 4-28 times more likely to be near toxic sites than rural ones.", "category": "Environment", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "8bb8dc98"}, {"headline": "Andromeda Galaxy entering galactic middle age, study finds.", "summary": "Hubble Space Telescope data shows the Andromeda Galaxy's star formation rate is steadily dropping, indicating it's transitioning to \"middle age.\" A \"dead zone\" near satellite galaxy M32 suggests a recent interaction disrupted star formation. Understanding Andromeda helps understand massive galaxies.", "category": "Science", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132034", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132034"}], "article_id": "bcd70477"}, {"headline": "Govt Summons Meta Global Leadership Over PM Modi Video Removal", "summary": "The Indian government summoned Meta's global leadership (including US brass) and head of public policy after PM Modi's Facebook Reel on paper leaks was briefly deleted due to an automated glitch. Meta apologized, calling it an error. The IT ministry sought compliance details and also summoned Snapchat, Google, and X for content moderation discussions, treating the matter seriously.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 8, "article_id": "f64c1def"}, {"headline": "CBI Files First Chargesheet Against 13 in NEET-UG Leak Case", "summary": "The CBI filed its first chargesheet against 13 individuals in the NEET-UG paper leak case (2024/2026), primarily from Bihar. They face charges under IPC, Public Examinations Act, and Prevention of Corruption Act, including criminal conspiracy and cheating. Searches in 92 locations yielded evidence. Two special prosecutors are assigned to a fast-track court, as investigation into larger conspiracies and NTA officials' roles continues.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 9, "article_id": "039d1a5a"}, {"headline": "Oman Proposes Voluntary Fee System for Strait of Hormuz", "summary": "Oman presented a Gulf-backed plan to Iran, the UN, and the US for managing the Strait of Hormuz via a voluntary fee system and temporary split control. Modeled after the Strait of Malacca, it aims to end trade disruptions, prevent collisions, reduce tensions, and facilitate nuclear negotiations. Iran has not formally responded.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "6eb73516"}, {"headline": "Apple Briefly Hits $5 Trillion Market Cap, Second Company to Milestone", "summary": "Apple's market capitalization briefly surpassed $5 trillion for the first time, becoming the second company to reach this milestone after Nvidia's $5.7 trillion on May 14. Shares hit $342.89, driven by strong AI-integrated product demand, robust services revenue, and its strategy of avoiding aggressive AI spending. This reflects investor confidence in Apple's long-term strategy.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 7, "article_id": "e5066454"}, {"headline": "Deadly 7.1 Magnitude Earthquake Traps Many in Japan Mall", "summary": "A powerful 7.1-magnitude earthquake struck Japan's southern Kumamoto prefecture (Kyushu island), causing a shopping mall to partially collapse and trapping many, including 20-30 workers. One person died from a house collapse, and over 100 injuries were reported. The quake, reaching Shindo scale 7, caused power outages, road ruptures, and triggered local tsunami warnings; the region was previously devastated a decade ago.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 9, "article_id": "9d0102fb"}, {"headline": "13 Indian Seafarers Trapped in Ukraine's Chornomorsk Port", "summary": "A Tanzanian-flagged cargo vessel with 13 Indian seafarers (among 15 crew) is trapped at Ukraine's Chornomorsk port, Black Sea, following missile and drone attacks. The crew is safe but cannot leave due to hostilities. The Indian government is coordinating with local authorities, and the Forward Seamen’s Union of India appealed for their safety and prompt repatriation.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "22109150"}, {"headline": "Cauvery Panel Orders Karnataka to Release Water to Tamil Nadu", "summary": "The Cauvery Water Management Authority/Regulation Committee ordered Karnataka to release 3,500 cusecs of water daily to Tamil Nadu for 15 days (nearly 4tmcft). This decision, amid distress and low reservoir levels, triggered protests and bandh threats in Karnataka, which plans to appeal, citing drinking water needs and storage deficits.", "category": "Environment", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "4a2bce87"}, {"headline": "Supreme Court Suggests 'Digital Arrest' as Standalone Criminal Offence", "summary": "The Supreme Court suggested the Centre define 'digital arrest' as a standalone criminal offence with specific punishments. This aims to combat rising cyber-enabled frauds involving extortion, impersonation, and deepfakes by criminals posing as law enforcement. The court stressed the need for a structured legislative framework, technological safeguards, and immediate asset freezing for accused.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132096"}], "importance": 9, "article_id": "39023239"}, {"headline": "Geneva to Host Gukesh-Sindarov World Chess Championship Match", "summary": "FIDE announced Geneva will host the World Chess Championship match between India's Gukesh D and Uzbekistan's Javokhir Sindarov from November 25 to December 15. Gukesh will defend his 2024 title against Sindarov, the Candidates tournament winner. Both 22, they are among the youngest challengers in the sport's history.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "88c9533a"}, {"headline": "India Wins Historic CWG Silver, Gold in High Jump and Para Shot Put", "summary": "India saw a successful day at the Commonwealth Games in Glasgow. Sarvesh Kushare secured India's first able-bodied athletics silver in men's high jump (2.25m). Sharmila Dhankar (39) made history, winning India's first ever para-athletics gold for a woman in F57 shot put (9.81m personal best), ending a 20-year wait, and aiming for Asiad gold. Tejaswin Sankar withdrew from high jump due to knee tendonitis.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "dc8e1c1e"}, {"headline": "Tata Sons Chairman's Pay Rises, Optimistic on Tata Electronics", "summary": "Tata Sons Chairman N. Chandrasekaran's FY26 remuneration rose 18% to ₹158.66 crore, including an unchanged ₹140.69 crore profit-linked commission. He expressed optimism for Tata Electronics, building India's first high-volume semiconductor fab in Gujarat, despite a ₹1,611 crore FY26 loss. The unit's revenue grew 97% to ₹1,31,082 crore, as the group focuses on a complete semiconductor ecosystem.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "importance": 7, "article_id": "e43f2fd8"}, {"headline": "India's Industrial Output Jumps 7.3% in June, a 23-Month High", "summary": "India's industrial production (IIP) surged 7.3% in June, hitting a 23-month high. This robust growth, led by manufacturing (7.8%) and electricity (10.6%, a 25-month high boosted by heatwave), exceeded expectations. Capital goods grew 14.2%, with 19 of 23 groups showing positive growth, signaling resilient domestic demand despite global uncertainties. Analysts remain cautious about the future outlook.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132098"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132072"}], "importance": 9, "article_id": "ad7ec024"}, {"headline": "India's Industrial Output Jumps 7.3% in June, a 23-Month High", "summary": "India's industrial production (IIP) surged 7.3% in June, a 23-month high. Driven by manufacturing (7.8%), electricity (10.6%, a 25-month high boosted by heatwave), and capital goods (14.2%), the growth reflects recovering consumer demand, with durables up 7.7% and non-durables 4.9%. Analysts, however, remain cautious about the future outlook despite the uptick.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 9, "article_id": "ad7ec024"}, {"headline": "Johnson & Johnson Offers $5.5 Billion to Settle Talc Lawsuits", "summary": "Johnson & Johnson proposed a $5.5 billion settlement to resolve approximately 76,000 lawsuits alleging its talc products caused ovarian cancer. This aims to end a decade of litigation, with payments starting in 2027. The deal requires approval from 95% of claimants; final cost could reach $7 billion. J&J, which stopped global talc sales in 2023, maintains product safety and asbestos-free claims.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132066"}], "importance": 8, "article_id": "07735115"}, {"headline": "Swiggy Appoints Nandita Sinha as New Instamart CEO", "summary": "Swiggy appointed former Myntra CEO Nandita Sinha as Instamart's new CEO, effective August 3. She succeeds Amitesh Kumar Jha, who resigned, and Phani Kishan Addepalli, who became Swiggy's Chief of Staff. Sinha, who previously led Myntra to Ebitda profitability, will focus on scaling operations, improving profitability, unit economics, and product assortment amidst intense quick-commerce competition, following former COO Ankit Jain's departure.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132066"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 7, "article_id": "9ff99bc1"}, {"headline": "L&T Q1 Net Profit Rises 14% to ₹4,123 Crore", "summary": "Larsen & Toubro (L&T) reported a 14% year-on-year rise in Q1 consolidated net profit to ₹4,123 crore, driven by operational excellence and treasury gains. Revenue grew 7% to ₹67,942 crore, with energy and real estate performing strongly. Order inflows also increased 14% to ₹1.08 lakh crore, despite some Middle East project delays due to geopolitical issues, according to President and CFO R. Shankar Raman.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "a319eb38"}, {"headline": "Varun Beverages Q1 Net Profit Jumps 15% Despite Competition", "summary": "PepsiCo bottler Varun Beverages reported a 15.1% rise in Q1 consolidated net profit to ₹1,525.4 crore, with revenue up 20.8% to ₹8,650.6 crore, though missing analyst estimates. Sales volumes rose 19.8% to 466.7 million cases. Despite intense competition from Reliance's Campa Cola at lower price points, the company reassured investors, focusing on profitable growth, larger pack sizes, and strong demand for low-sugar/energy drinks.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132066"}], "importance": 7, "article_id": "937be660"}, {"headline": "Private Banks Collect More Minimum Balance Penalties Than PSBs", "summary": "HDFC Bank, Axis Bank, and ICICI Bank collectively collected more in minimum balance penalties from FY23-26 than all 12 public sector banks combined. HDFC alone collected over ₹5,600 crore, accounting for 55% of the total. In FY22, private banks collected ₹4,948.71 crore vs. public banks' ₹2,137.92 crore, as PSBs increasingly waived such charges for many accounts.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 7, "article_id": "5bf9de8b"}, {"headline": "India's Infra Projects Face ₹4.92 Lakh Crore Cost Overrun", "summary": "As of June 2026, a government report revealed 1,847 central infrastructure projects (each over ₹150 crore) face a cumulative cost overrun of ₹4,92,752 crore. The total revised cost is ₹40.54 trillion, against an original ₹35.61 trillion. 709 projects have time overruns, though over 700 achieved 80% physical progress, with expenditures incurred at 54.18% of the revised cost.", "category": "Infrastructure", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 7, "article_id": "2a76b5c6"}, {"headline": "City Union Bank Q1 Net Profit Up 25% to ₹383 Crore", "summary": "City Union Bank (CUB) reported a 25% year-on-year rise in Q1 net profit to ₹383 crore. Net interest income increased 31% to ₹820 crore, with interest income up 24%. Gross advances grew 25% to ₹67,645 crore, and deposits climbed 21%, with retail, agri, and MSME accounting for 80% of advances. Net NPA improved to 0.61%, keeping the bank on track for 20% business growth in FY27.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 7, "article_id": "932a9475"}, {"headline": "Delhi High Court Orders Winding Up of Paytm Payments Bank", "summary": "The Delhi High Court ordered the winding up of Paytm Pa
