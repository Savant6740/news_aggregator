se of theft and are scanning CCTV footage to identify the suspect. The loss of data is a major concern for the department.", "category": "India", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "da185beb"}, {"headline": "Mundka Factory Fire: Firefighters Battle Early Morning Blaze in West Delhi", "summary": "A massive fire broke out in a timber and plywood factory in West Delhi's Mundka early Sunday morning. Twenty-five fire tenders were deployed to control the blaze, which started in the building's basement. No casualties were reported as the factory was empty at the time. The cause of the fire is yet to be determined, and a cooling operation continued late into the afternoon.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "6ba5d5ef"}, {"headline": "Four Members of Himanshu Bhau Gang Arrested for Murder", "summary": "Delhi Police's special cell has arrested four members of the notorious Himanshu Bhau gang for their alleged involvement in a recent murder. The suspects were apprehended following a coordinated operation across several locations. They are believed to be part of a larger criminal network involved in extortion and target killings. Cops recovered illegal firearms and ammunition from the accused.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "5d20718a"}, {"headline": "Eighty-Three Detained After Raid on Fraudulent Call Centre in Delhi", "summary": "Police detained 83 individuals following a raid on a call centre in South Delhi that was allegedly operating a credit card fraud scheme. The employees were reportedly contacting US citizens and using stolen data to make unauthorized transactions. During the investigation, cops seized computers, mobile phones, and bank documents. The raid followed a tip-off from international law enforcement.", "category": "Law", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "e0e5ca4c"}, {"headline": "Abandoned Newborn Rescued by Delhi Police PCR Team in Sarita Vihar", "summary": "A six-day-old infant was rescued by a Delhi Police PCR team after being found abandoned on a roadside in Sarita Vihar. Passersby noticed the crying baby and alerted the authorities. The newborn was shifted to AIIMS for a medical checkup and is reported to be in stable condition. Cops have registered a case and are checking local hospital records to trace the parents.", "category": "India", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "69cda9e4"}, {"headline": "Nine-Year-Old Girl Injured After Falling into Open Manhole in Delhi", "summary": "A nine-year-old girl sustained injuries after falling into an open manhole while playing near her residence in a Delhi apartment complex. Her family members rushed her to a hospital, where she is currently recovering from bruises and shock. Residents have blamed the civic authorities for negligence in maintaining drainage lids, especially during the ongoing monsoon season.", "category": "Infrastructure", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "2db8556f"}, {"headline": "Delhi Police Arrest 193 Persons in 72-Hour Crackdown on Illicit Liquor", "summary": "Under 'Operation Chakra', Delhi Police arrested 193 people and registered 154 cases related to the sale and transport of illicit liquor. The 72-hour crackdown involved raids across various parts of the city. Authorities seized over 10,000 liters of country-made and branded liquor. The operation aims to curb the illegal trade of alcohol and enhance public safety in residential areas.", "category": "Law", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "53b7d4d5"}, {"headline": "Rising Career Avenues for Women in Company Secretary Profession", "summary": "The Institute of Company Secretaries of India (ICSI) reports a significant increase in women candidates dominating the top ranks of its professional exams. Data shows that female participation in the CS course has grown steadily, with women now comprising over 66% of the professional student base. Flexibility and increasing demand for corporate governance roles are cited as key drivers for this trend.", "category": "Education", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "c228e433"}, {"headline": "Delhi University Direct PhD Entry May Face Job Market Challenges", "summary": "Academics at Delhi University have raised concerns that students entering PhD programs directly after a four-year undergraduate degree may face challenges in the job market. While the new policy allows for direct entry, faculty members argue that the lack of a Master's degree could affect eligibility for teaching positions in some institutions. The move follows the implementation of the NEP 2020.", "category": "Education", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "ea4b119f"}, {"headline": "FMGE Frequency Increased to Three Times Annually Starting October 31", "summary": "The National Board of Examinations (NBEMS) has decided to conduct the Foreign Medical Graduate Examination (FMGE) three times a year instead of twice. This change aims to provide more opportunities for medical graduates from abroad to qualify for practice in India. The next session is scheduled for October 31, 2026, with subsequent exams planned for early 2027.", "category": "Education", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "5a2d2859"}, {"headline": "Justice Bhuyan Laments Unmet Constitutional Norm for Jurists in Supreme Court", "summary": "Supreme Court Justice Ujjal Bhuyan highlighted that the constitutional provision for appointing distinguished jurists directly to the apex court remains largely unused. He argued that including legal academics and scholars would bring diverse perspectives and intellectual depth to judicial decision-making. He called for a re-evaluation of current appointment practices to enhance the court's functioning.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "f2202bb2"}, {"headline": "Sonam Wangchuk States Political Ambitions Are Not Sinful for Activists", "summary": "Activist Sonam Wangchuk stated that there is nothing wrong with individuals or groups having political ambitions if it helps achieve their goals for the public good. Speaking about his own movement, he emphasized that activists often turn to politics to ensure their demands are met by the establishment. However, he maintained that his current focus remains on constitutional safeguards for Ladakh.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "623fca7e"}, {"headline": "Landslides Hit Himachal Pradesh Tracks Leading to Ten Train Cancellations", "summary": "Heavy rainfall and landslides in Himachal Pradesh have forced the cancellation of ten trains on the Kalka-Shimla heritage track. A major landslide near Koti damaged the tracks, making them unsafe for travel. Railway authorities have deployed teams to clear the debris and restore services, but continuous rain is slowing down the repair work. Passengers have been advised to check for updates.", "category": "Environment", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "5c41a166"}, {"headline": "Tribal Village in Maharashtra Put on Astro-Tourism Map by Student", "summary": "A 22-year-old physics student has successfully transformed a tribal village in Maharashtra into an 'International Dark Sky' destination. By educating locals about light pollution and stargazing, the project has put the remote village on the astro-tourism map. The initiative is expected to boost local tourism and provide sustainable income for the tribal community while promoting scientific interest.", "category": "Science", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "ad1fee5a"}, {"headline": "Hooch Tragedy in Bihar Kills Four Men; Residents Protest Against Police", "summary": "Four men died after allegedly consuming spurious liquor in Bihar's 'dry' Patna district. Following the incident, angry residents blocked roads and shouted slogans against the police, claiming local authorities were aware of the illegal trade. Cops have detained several people for questioning and are awaiting autopsy reports to confirm the exact cause of death.", "category": "India", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "aa728cd1"}, {"headline": "India and Uzbekistan Issue Joint Statement Condemning Cross-Border Terrorism", "summary": "Ahead of the SCO summit, India and Uzbekistan issued a joint statement strongly condemning cross-border terrorism. Both nations called for the elimination of safe havens and the prosecution of those involved in funding or orchestrating terror acts. The statement also highlighted the need for a stable Afghanistan and increased cooperation in counter-terrorism efforts within the SCO framework.", "category": "Politics", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "399f348d"}, {"headline": "PM Modi Likely to Hold Bilateral Talks With Iranian President Pezeshkian", "summary": "Prime Minister Narendra Modi is expected to meet Iranian President Masoud Pezeshkian for bilateral talks on the sidelines of the SCO summit. Discussions are likely to focus on the development of the Chabahar port and regional connectivity projects. This would be the first meeting between the two leaders since Pezeshkian took office, aiming to strengthen long-standing energy and trade ties.", "category": "Politics", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "f25dfb4a"}, {"headline": "Prime Minister Urges Youth to Create Content Against Drug Menace", "summary": "In his latest 'Mann Ki Baat' address, Prime Minister Modi called upon young content creators to use social media to raise awareness against the drug menace. He emphasized that digital influencers can play a major role in keeping India's youth away from addiction. He also praised various community-led initiatives that are successfully helping people recover from substance abuse.", "category": "India", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "8f28ec74"}, {"headline": "CJI Emphasizes Need for Sex-Specific Research in Indian Healthcare", "summary": "Chief Justice of India D.Y. Chandrachud stated that medical research must focus on sex-specific data to address the unique healthcare needs of men and women. He noted that many conditions, including diabetes and heart disease, manifest differently based on gender. He called for incorporating sex-based variables into routine health screenings to ensure more accurate and effective treatment for all patients.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "ab2b64fa"}, {"headline": "CJI States Illicit Wealth and Economic Crimes Outpace Global Treaties", "summary": "Chief Justice of India D.Y. Chandrachud remarked that illicit wealth and economic crimes are evolving faster than the international treaties designed to stop them. He stressed that without a unified global response, tracking and recovering laundered assets remains nearly impossible. He urged for more robust legal frameworks and real-time information sharing between countries to curb financial crimes.", "category": "Law", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "d11793a2"}, {"headline": "Key Conspirator in Al-Hind IS Case Sentenced to Seven Years", "summary": "A special NIA court has sentenced a key conspirator in the Al-Hind IS module case to seven years of rigorous imprisonment. The individual was found guilty of propagating the group's ideology and planning terror activities in South India. The court also imposed a fine on the convict. This sentencing marks a major milestone in the NIA's multi-year investigation into the module's operations.", "category": "Law", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "ee9d7baa"}, {"headline": "HDFC CEO Sashidhar Jagdishan's Exit to End Leadership Uncertainty", "summary": "The announced departure of HDFC Bank's CEO Sashidhar Jagdishan is expected to clear long-standing uncertainty regarding the bank's future leadership. Jagdishan will step down in October after a transformative tenure. The board is now tasked with finding a successor who can navigate the post-merger integration and steer the bank toward its global scale ambitions. Market analysts remain watchful.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "af4ab678"}, {"headline": "India's Q1 GDP Growth Seen Resilient Despite Global Economic Headwinds", "summary": "Economists predict that India's Q1 GDP growth for 2026-27 will remain resilient, estimated between 7.0% and 7.5%. This growth is reportedly driven by strong domestic demand, government capital expenditure, and robust activity in the manufacturing and construction sectors. While global headwinds like geopolitical tensions persist, the Indian economy continues to show significant strength.", "category": "Economy", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "9e4b4a6a"}, {"headline": "Ather Scooter Wait Times Hit Four Months Due to Capacity Crunch", "summary": "Electric scooter manufacturer Ather Energy is reportedly facing a capacity crunch, with wait times for its scooters reaching up to four months. The company stated that a surge in demand during the festive season has outpaced production capabilities. Ather is currently working to scale up its manufacturing facilities to meet the growing consumer interest and reduce delivery backlogs.", "category": "Business", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "926c0385"}, {"headline": "Nippon Life Expects Increased Japanese Portfolio Inflows into India", "summary": "Nippon Life India Asset Management expects a significant increase in portfolio inflows from Japanese investors into the Indian market. The firm highlighted that India's stable policy environment and strong growth prospects make it an attractive destination for foreign capital. They noted that recent regulatory changes have made it easier for Japanese funds to invest across various Indian asset classes.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "39630225"}, {"headline": "Patent System Faces Challenges Due to Surge in Junk Filings", "summary": "The Indian patent system is reportedly struggling with a massive surge in 'junk' or non-serious patent applications. Experts warn that many of these filings are made primarily to boost university rankings rather than for genuine innovation. This practice is creating a backlog and making it difficult for legitimate inventors to secure protection for their intellectual property in a timely manner.", "category": "Science", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "fe1bbddf"}, {"headline": "Scientific Study Urges Regional Cooperation to Manage Himalayan Inundation", "summary": "A new scientific study emphasizes the urgent need for transboundary cooperation between India, Nepal, and China to manage the risk of Himalayan floods. Researchers pointed out that events like glacial lake bursts can cause disasters downstream across borders. The study calls for a unified data-sharing platform and a common geospatial framework to monitor mountain hazards effectively.", "category": "Science", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "36b0f88d"}, {"headline": "NHAI to Implement AI Technology for Better Road Construction Quality", "summary": "The National Highway Authority of India (NHAI) is turning to Artificial Intelligence to improve the quality of road construction. AI-powered systems will be used to monitor work in real-time, identifying defects or deviations from engineering standards immediately. This technology is expected to enhance road durability, reduce maintenance costs, and ensure that contractors follow strict safety protocols.", "category": "Technology", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "deede408"}, {"headline": "Two Militants Killed in Manipur During Factional Gunfights", "summary": "At least two militants were killed in Manipur during intense gunfights between rival insurgent factions. The clashes reportedly occurred near the border regions as groups fought for territorial control. Security forces have been deployed to the area to prevent further violence and restore order. Authorities are closely monitoring the situation as ethnic tensions in the state remain high.", "category": "India", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "65b67a4f"}, {"headline": "Russia Submits Bid for Five Additional S-400 Missile Squadrons", "summary": "Russia has submitted a formal bid to supply India with five more squadrons of the S-400 Triumf long-range air defense system. This potential deal follows the successful delivery of previous squadrons under an earlier agreement. If approved, the contract would significantly bolster India's aerial defense capabilities. The Indian government is currently evaluating the bid and its financial implications.", "category": "Politics", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "be4a22a9"}, {"headline": "Renewable Energy Accounts for Twenty Percent of India's Total Power Generation", "summary": "India's renewable energy sector has reached a new milestone, now accounting for 20% of the country's total power generation. A report by the power ministry shows a 30% year-on-year growth in solar and wind energy capacity. This shift is part of India's larger commitment to reducing carbon emissions and achieving its net-zero goals through sustainable and clean energy sources.", "category": "Environment", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "bd3e7f99"}, {"headline": "Aryna Sabalenka Eyes Three-Peat at US Open Defending Her Title", "summary": "Defending champion Aryna Sabalenka has arrived at the US Open aiming to become the first woman to win three consecutive titles since Serena Williams. The world number one enters the tournament in strong form, having recently won a major warm-up event. Analysts consider her the favorite for the title, though she faces tough competition from top-ranked rivals in the opening rounds.", "category": "Sports", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "6a29b915"}, {"headline": "PCB Prohibits Players from Commenting on Imran Khan's Imprisonment", "summary": "The Pakistan Cricket Board (PCB) has reportedly issued a directive to its players, prohibiting them from making public comments about the imprisonment of former captain Imran Khan. The board stated that players should focus strictly on their professional duties and avoid involvement in political controversies. The move comes as several cricketers have previously expressed support for Khan on social media.", "category": "Sports", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "c637e4f6"}, {"headline": "Viswanathan Anand Discusses Ways to Mirror Cricket's Commercial Success in Chess", "summary": "In an exclusive interview, chess legend Viswanathan Anand shared his insights on how chess can replicate the commercial pull of cricket. He emphasized the need for more franchise-based leagues and better fan engagement to attract major sponsors. Anand also praised the rising performance of young Indian grandmasters and suggested that regional tournaments could help identify and nurture new talent.", "category": "Sports", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "a5d584a2"}, {"headline": "High Court Rules Marriage is Not a Bar to Compassionate Jobs", "summary": "The High Court has ruled that a woman's marital status should not be a disqualifying factor for securing a job on compassionate grounds. The court set aside a previous policy that excluded married daughters from being considered for such appointments. The judgment emphasized that the criteria should be based on dependency and need, rather than whether the applicant is married or single.", "category": "Law", "page": 18, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "adc85775"}, {"headline": "US Government Considers Eliminating Work Permits for H-1B Spouses", "summary": "The US government is reportedly considering a proposal to eliminate work permits for spouses of H-1B visa holders. This move could affect thousands of Indian professionals and their families living in the United States. While no final decision has been made, the potential change has sparked concerns about its impact on the local workforce and the financial stability of immigrant families.", "category": "World", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "81d1a75f"}, {"headline": "Canada to Increase Required Cost of Living Funds for Foreign Students", "summary": "Starting September 1, Canada will significantly increase the amount of cost-of-living funds international students must show to obtain a study permit. The requirement will rise to over $20,000 to reflect the actual cost of living in the country more accurately. The move is intended to ensure that students are financially self-sufficient and to prevent them from facing economic hardship during their studies.", "category": "World", "page": 20, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "9135e248"}, {"headline": "Jinnah's Illness Could Have Prevented Partition Doctors Kept Secret", "summary": "Historical reports suggest that Muhammad Ali Jinnah's secret struggle with tuberculosis could have significantly altered the course of Indian history. Two doctors reportedly kept his deteriorating health hidden during crucial negotiations for partition. Experts believe that if his illness had been public knowledge, the political timeline and the eventual creation of Pakistan might have been very different.", "category": "World", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "fa360f76"}, {"headline": "RBI Approves Record ₹2.11 Lakh Crore Dividend Payout to Government for FY24", "summary": "The RBI board approved a record ₹2.11 lakh crore dividend payout to the central government for FY24, more than double the previous year’s ₹87,416 crore and exceeding the ₹1.02 lakh crore budget estimate. Bolstered by higher interest income and foreign exchange gains, the windfall will help the government manage the fiscal deficit and increase capital expenditure on infrastructure.", "category": "Economy", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135759"}, {"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135683"}], "importance": 10, "article_id": "f62f32c5"}, {"headline": "India and Uzbekistan Sign Strategic Uranium Deal and Set $5 Billion Trade Target", "summary": "PM Narendra Modi and President Shavkat Mirziyoyev elevated ties to a comprehensive strategic partnership, signing 11 agreements including a long-term uranium supply pact. They set a $5 billion bilateral trade target by 2030 and agreed on a defense co-production roadmap. Uzbekistan also conferred its highest state honor on PM Modi during his visit to bolster nuclear and regional security.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/135746"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 10, "article_id": "c9bf8e72"}, {"headline": "NASA Launches $4.3 Billion Roman Space Telescope to Study Dark Matter", "summary": "NASA's Nancy Grace Roman Space Telescope successfully launched from Florida on a SpaceX Falcon Heavy rocket. Positioned 1.5 million km from Earth at Lagrange point 2, the $4.3 billion observatory features a wide-field camera 100 times larger than Hubble's. Its five-year mission aims to investigate dark energy, dark matter, and search for exoplanets to create a 3D map of the universe.", "category": "Science", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 9, "article_id": "6237e202"}, {"headline": "Finance Minister Forecasts Sustained 7% Economic Growth Despite Global Challenges", "summary": "Finance Minister Nirmala Sitharaman expressed confidence that India's economy will maintain a growth momentum of 7% or higher this year. Speaking at an event in Chicago, she highlighted that prudent fiscal policies, domestic manufacturing, and robust internal demand have helped the country navigate global uncertainties and recover well from the pandemic, remaining a bright spot for investment.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 8, "article_id": "96b91d1c"}, {"headline": "Karnataka CID Arrests IAS Officer Over KPSC Veterinary Recruitment Exam Fraud", "summary": "The Karnataka CID arrested IAS officer Gyanendra Kumar Gangwar, former KPSC Controller of Examinations, for alleged irregularities in recruiting 400 veterinary officers. Gangwar is accused of receiving ₹1.1 crore to tamper with OMR sheets and leak papers. The investigation followed reports of inconsistencies in 2023-24 results, leading the state government to order a full inquiry.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 8, "article_id": "e03af6dc"}, {"headline": "NPCI to Enable UPI Auto-Pay Interoperability Across Different Payment Apps", "summary": "The National Payments Corporation of India (NPCI) is set to introduce \"auto-pay portability,\" allowing users to manage recurring UPI payments across different apps like PhonePe and Google Pay. This change enables consumers to view, modify, or transfer mandates for SIPs and loan repayments from a single gateway of their choice, reducing user lock-in and encouraging digital payment adoption.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135755"}], "importance": 8, "article_id": "56cab914"}, {"headline": "Germany Defeats Spain to Win Record-Equalling Fourth Men’s Hockey World Cup", "summary": "Germany secured their fourth FIH Men’s Hockey World Cup title by defeating Spain 1-0 in the final at Kuala Lumpur's Belifus Arena. A decisive goal by Michel Struthoff in the 44th minute broke the deadlock. This victory puts Germany level with Pakistan for the most titles in tournament history. Spain finished as runners-up after failing to convert multiple penalty corner opportunities.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 8, "article_id": "d5198646"}, {"headline": "Iran’s Supreme Leader Urges Gulf Nations to Unite Against Israel and US", "summary": "Iran’s Supreme Leader Ayatollah Ali Khamenei called on Muslim nations, particularly those in the Gulf, to unite against Israel and the United States. During Islamic Unity Week, he described Israeli strikes as a common threat and proposed a \"Mecca defense pact.\" Khamenei warned that internal divisions serve external adversaries and attributed Palestinian struggles to a lack of coordination.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 8, "article_id": "8fb21a96"}, {"headline": "Andhra CM to Inaugurate Veligonda Phase-1 Project to Aid Drought-Prone Regions", "summary": "Chief Minister N. Chandrababu Naidu will inaugurate Phase-1 of the Veligonda irrigation project, featuring an 18.8 km tunnel through the Nallamala hills. The project diverts Krishna River water to provide drinking water for 23 lakh people and irrigation for up to 4.47 lakh acres in the drought-prone Prakasam, Nellore, and Kadapa districts, addressing long-standing fluoride issues.", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "importance": 7, "article_id": "a9e44f82"}, {"headline": "FIR Filed Against Rahul Gandhi in Uttarakhand Over Controversial Caste Remarks", "summary": "An FIR has been registered in Dehradun against Leader of Opposition Rahul Gandhi for alleged remarks concerning a \"purification ritual\" at a Ramlila Ground. The complaint, filed under the BNS and SC/ST Act, claims the comments hurt religious sentiments and incited social disharmony. While the BJP called the remarks an insult to values, Congress dismissed the allegations as political.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 8, "article_id": "880e1301"}, {"headline": "HDFC Bank Accelerates Succession Planning as CEO Sashidhar Jagdishan Set to Retire", "summary": "HDFC Bank is fast-tracking its succession planning following CEO Sashidhar Jagdishan's decision to step down in October 2026. The board is considering internal candidates like Deputy MD Kaizad Bharucha, who may hold interim charge, as well as external options. Jagdishan led the trillion-dollar lender for six years, overseeing the major HDFC merger and significant loan book growth.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135769"}, {"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "importance": 9, "article_id": "48a2f63a"}, {"headline": "Tata Motors Expects Robust Demand for Electric Commercial Vehicles to Continue", "summary": "Tata Motors predicts sustained demand for its electric vehicles despite recent supply chain bottlenecks for imported battery cells, which are expected to clear by the end of the second quarter. The company has already deployed over 3,400 electric commercial vehicles and aims to resolve production issues for its Ace EV to lead the transition to green mobility in the freight sector.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135744"}], "importance": 7, "article_id": "63779cf2"}, {"headline": "NEET-PG Re-exam Ordered for 2,445 Candidates Following Technical Glitches", "summary": "A NEET-PG re-examination has been scheduled for September 5 for 2,445 candidates across two centers in Jaipur and Dwarka. The move follows technical glitches, power disruptions, and server failures that prevented students from completing the nationwide medical entrance exam on August 30. The National Board of Examinations is also seeking action against its technological partner, TCS.", "category": "Education", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 6, "article_id": "144f95ec"}, {"headline": "NCLAT Reaffirms ‘Clean Slate’ Principle Protecting Successful Bidders in Insolvency Cases", "summary": "The National Company Law Appellate Tribunal (NCLAT) has reaffirmed the \"clean slate principle\" under the IBC, protecting new owners of bankrupt firms from past liabilities. The ruling came as the tribunal dismissed an appeal by a former investor seeking ₹110 crore in Sintex Industries' insolvency process, ensuring that successful bidders start with a fresh balance sheet.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 7, "article_id": "b30d1b02"}, {"headline": "India and Uzbekistan Target $5 Billion Annual Trade by 2030", "summary": "India and Uzbekistan have set an ambitious target to increase bilateral trade from $1.3 billion to $5 billion by 2030. During meetings between PM Modi and President Mirziyoyev, both nations agreed to explore a preferential trade agreement and remove non-tariff barriers. Cooperation will focus on digital infrastructure, agriculture, pharmaceuticals, and a long-term uranium supply pact.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135737"}], "importance": 8, "article_id": "131b9df9"}, {"headline": "India Emerges as Major Gasoline Supplier to Russia Following Refinery Disruptions", "summary": "India has become a critical supplier of gasoline to Russia, exporting approximately 1 million barrels over the last two months. This shift follows Ukrainian drone strikes that disrupted Russian refinery production, causing seaborne imports to hit record highs. Indian refiners, including the Rosneft-backed Nayara Energy from its Vadinar refinery, are now pivoting to Russia as a major market.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135755"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 8, "article_id": "eff15d92"}, {"headline": "HDFC Bank CEO Sashidhar Jagdishan to Retire in October 2026", "summary": "HDFC Bank has confirmed that MD and CEO Sashidhar Jagdishan will retire on October 26, 2026. His successor will inherit challenges including reviving retail lending and protecting net interest margins following the HDFC merger. Jagdishan expressed a desire for his successor to start with a \"clean slate\" amid regulatory scrutiny and the need to improve the bank's credit-to-deposit ratio.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 10, "article_id": "ca6e94fb"}, {"headline": "Nepal Monsoon Floods Death Toll Surpasses 800 With Thousands Still Missing", "summary": "Devastating monsoon floods and landslides in Nepal have claimed over 800 lives, with thousands more still missing. Rescue teams have saved over 9,500 people, but efforts are hampered by destroyed infrastructure. The government has requested international aid, including DNA-testing kits and freezer units, to manage recovered bodies and prevent public health risks as search operations continue.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}], "importance": 10, "article_id": "e356f0a8"}, {"headline": "RSS Chief Mohan Bhagwat Says Hindutva is Inclusive of All Communities", "summary": "RSS chief Mohan Bhagwat stated that the vision for a Hindu Rashtra is inclusive and does not envision an India without Muslims. Speaking at a forum in New York, he asserted that anyone believing Muslims have no place in the country ceases to be a Hindu. Emphasizing social harmony and national unity, Bhagwat called for selfless dialogue as the organization nears its centenary year.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "importance": 8, "article_id": "4988f0ad"}, {"headline": "Justice Bhuyan Defends Right to Dissent and Urges Academic Appointments to Supreme Court", "summary": "Supreme Court Justice Ujjal Bhuyan emphasized that the right to dissent is a fundamental part of citizenship and should be encouraged in educational institutions. Speaking at a convocation, he also called for the activation of Article 124(3) to appoint \"distinguished jurists\" from legal academia to the top court, noting that no such appointment has been made in 76 years.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "importance": 7, "article_id": "c4327df7"}, {"headline": "Iceland Rejects Resuming European Union Membership Talks in National Referendum", "summary": "In a national referendum, 52.8% of Icelandic voters rejected a proposal to resume membership negotiations with the European Union. Concerns over national sovereignty and control over the vital fishing industry were central to the \"no\" vote. The result maintains Iceland’s independent economic course outside the bloc and is seen as a victory for the current government’s anti-EU stance.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135744"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 7, "article_id": "dfb3914f"}, {"headline": "GST Council to Meet September 12 to Discuss Rate Cuts and Compliance", "summary": "The 57th GST Council meeting is scheduled for September 12 in New Delhi to discuss rate rationalization and easing business compliance. Key agenda items include a potential rate cut on mobile phones from 18% to 12% and easing restrictions on blocked input tax credits (ITC). The Council will also address inverted duty structures and the distribution of accumulated compensation cess.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 8, "article_id": "495fdca2"}, {"headline": "Lenders Challenge Subhash Chandra’s Insolvency Plan Amid Disputed Debt Claims", "summary": "Zee Group founder Subhash Chandra is disputing debt claims, stating his outstanding dues are ₹4,262 crore against HDFC Bank’s higher estimates. Meanwhile, lenders have challenged his personal insolvency resolution plan, alleging that family-linked entities illegally controlled the voting share to push a ₹6.5 crore settlement against claims exceeding ₹22,000 crore.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 7, "article_id": "3d6e0999"}, {"headline": "Foreign Portfolio Investors Infuse ₹30,919 Crore into Indian Equities in August", "summary": "Foreign Portfolio Investors (FPIs) remained net buyers in Indian equities for the second consecutive month, investing ₹30,919 crore in August following a ₹20,200 crore inflow in July. Analysts attribute the trend to a stable rupee, resilient economic activity, and improving corporate earnings, marking a significant reversal from the heavy selling seen earlier in the year.", "category": "Economy", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 7, "article_id": "1b1d2b6d"}, {"headline": "Government Notifies Indian Standard Time as Mandatory Official Reference Nationwide", "summary": "The Union government has notified the Legal Metrology (Indian Standard Time) Rules 2026, mandating IST as the sole reference for all legal, administrative, and commercial purposes. Organizations have 180 days to comply with the \"One Nation, One Time\" initiative, which aims to synchronize banking, telecom, and transport networks while reducing dependence on foreign satellite time sources.", "category": "Technology", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/135746"}], "importance": 7, "article_id": "e1efd050"}, {"headline": "Tennis Legend Roger Federer Inducted into International Tennis Hall of Fame", "summary": "Swiss legend Roger Federer was formally inducted into the International Tennis Hall of Fame in Newport, calling it one of the greatest honors of his life. In an emotional speech, the 20-time Grand Slam winner reflected on his journey from ballboy to champion. Federer paid tribute to his family, coach Severin Luthi, and childhood idol Stefan Edberg while celebrating his love for the sport.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 9, "article_id": "7885f04d"}, {"headline": "Shafali Verma and Deepti Sharma Lead India to Dominant Asia Cup Win", "summary": "India crushed Thailand in the Women’s T20 Asia Cup behind Shafali Verma’s 64 off 36 balls and a record-breaking bowling performance by Deepti Sharma. Deepti took three wickets for near-zero runs, delivering one of the most economical spells in tournament history to restrict Thailand to just 65 runs. The dominant victory further cements India’s position as a top contender in the series.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 7, "article_id": "7ecea78b"}, {"headline": "England Clinches Test Series Against Pakistan With Decisive Victory at Lord’s", "summary": "England secured an unbeatable 2-0 series lead after a comprehensive 194-run victory over Pakistan in the second Test at Lord’s. Chasing a target of 389, Pakistan was dismissed for 194 despite a fighting 97 from Saud Shakeel. England's bowling attack, led by Ollie Robinson and Jofra Archer, dismantled the visitors' lineup twice to wrap up the series win with one match remaining.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135698"}, {"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135712"}], "importance": 7, "article_id": "a6013cdd"}], "newspapers": ["Hindustan Times", "Financial Express", "Mint", "Business Standard", "Economic Times", "Business Line", "Times of India", "The Hindu", "Indian Express"], "total_articles": 286};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
