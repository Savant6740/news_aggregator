<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

ps, granted by the West Bengal government after 2010. The court termed the reservations arbitrary and illegal. While five lakh certificates are cancelled, those already in service or admitted to institutions remain protected. CM Mamata Banerjee announced her government will challenge the order in the Supreme Court.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "e8b4f42d"}, {"headline": "Grandfather of Pune Porsche Crash Teen Arrested for Alleged Driver Kidnapping", "summary": "Pune Police arrested the grandfather of the 17-year-old involved in a fatal Porsche crash. He is accused of kidnapping the family driver and coercing him to take responsibility for the accident. The minor's father is also in custody. Meanwhile, the state is investigating the Juvenile Justice Board's decision to grant bail to the teen just hours after the accident occurred.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "b61a6440"}, {"headline": "Delhi Records Season High Temperature of 48 Degrees Amid Red Alert", "summary": "A brutal heatwave continues to sweep across North India, with Delhi's Najafgarh area recording a maximum temperature of 47.8 degrees Celsius. The India Meteorological Department has issued a red alert for the next five days. Extreme heat has caused power demand to soar to record levels, and city hospitals report a significant increase in heat-related illnesses among residents.", "category": "Environment", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "b54d2a83"}, {"headline": "PM Modi Discusses AI and Social Justice in Latest Campaign Trail Interview", "summary": "In a recent interview, Prime Minister Narendra Modi addressed concerns over the misuse of AI and deepfakes during the election. He reiterated the BJP's stance on reservations, accusing the opposition of planning to divert quotas to specific religious groups. Modi emphasized that his government’s priority remains inclusive growth and leveraging technology for national development.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "04a969bd"}, {"headline": "Rajasthan Royals Beat RCB in Eliminator to Secure Qualifier 2 Berth", "summary": "Rajasthan Royals defeated Royal Challengers Bengaluru by four wickets in the IPL 2024 Eliminator. Chasing 173, RR reached the target with an over to spare, led by Riyan Parag's steady knock. RCB's six-match winning streak ended despite a valiant effort. RR will now face Sunrisers Hyderabad in Chennai for a spot in the final against Kolkata Knight Riders.", "category": "Sports", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "6ce0b87d"}, {"headline": "Nvidia Revenue Triples as AI Demand Drives Global Semiconductor Market Surge", "summary": "Nvidia reported a massive jump in quarterly revenue, reaching $26 billion, a 262% increase from the previous year. The tech giant's profit soared to $14.88 billion, driven by the insatiable demand for its AI chips. Following the announcement, Nvidia's stock price crossed the $1,000 mark for the first time, reinforcing its position as a leader in the global AI infrastructure race.", "category": "Business", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "50596814"}, {"headline": "Iran Holds Final Funeral Rites for President Ebrahim Raisi in Mashhad", "summary": "Tens of thousands of mourners gathered in the Iranian city of Mashhad for the final burial of President Ebrahim Raisi, who died in a helicopter crash on Sunday. Foreign dignitaries from across the region attended the ceremonies. Iran has announced a five-day mourning period and scheduled fresh presidential elections for June 28 to choose a successor for the late leader.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "75384ff9"}, {"headline": "SEBI Proposes Stricter Rules for Brokerage Employees to Prevent Front-Running", "summary": "Markets regulator SEBI has released a consultation paper proposing to hold brokerage firms and their employees accountable for front-running. The new rules would require institutional mechanisms to detect and prevent market abuse. This comes after several recent cases where internal employees exploited advance information about large trades to make illegal gains from the markets.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "f9258d0c"}, {"headline": "Supreme Court Refuses to Entertain Plea to Extend Polling Hours", "summary": "The Supreme Court dismissed a petition seeking an extension of polling hours during the remaining phases of the Lok Sabha elections due to the heatwave. The court stated that it is for the Election Commission of India to decide on the logistics of polling. It noted that the ECI had already taken steps like providing water and shade at booths to help voters manage the extreme heat.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "9f70791e"}, {"headline": "Researchers Link Microplastic Exposure to Increased Risk of Heart Disease", "summary": "A new study published in a leading medical journal suggests that individuals with microplastics in their carotid artery tissues are significantly more likely to suffer heart attacks or strokes. Scientists found evidence of polyethylene and polyvinyl chloride in plaque removed from patients. This research highlights the growing health risks posed by plastic pollution in the human body.", "category": "Health", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143028", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Mumbai ⁰⁹¹¹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143028"}], "article_id": "bb9455b7"}, {"headline": "RIL, ONGC and BP Explore Common $1-Billion Mahanadi Basin Infrastructure", "summary": "The Ministry of Petroleum and Natural Gas is proposing a $1 billion shared offshore infrastructure facility in the Mahanadi basin. The project, involving ONGC, BP, and Reliance Industries, aims to make deepwater gas discoveries commercially viable by pooling resources. This internationally modeled hub could take 3-4 years to develop, handling natural gas and condensate.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "7efddb2a"}, {"headline": "Quick Commerce Platforms See Surge in Last-Minute Diwali Gifting and Essentials", "summary": "Blinkit, Zepto, and Instamart reported a significant surge in orders during the Diwali weekend as consumers used apps for last-minute shopping and puja essentials. Some platforms introduced gamified rewards and curated menus to drive engagement. High demand led to longer delivery timelines and surge charges in certain areas, particularly in north Indian cities.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "21f591f8"}, {"headline": "Financial Institutions Increase Cyber Insurance Cover Amid Rising Attack Frequency", "summary": "Large financial services companies are expanding cyber insurance limits to protect against technology disruptions and financial losses. A major non-bank financial company plans to increase its cover to ₹2,000 crore from ₹1,400 crore. Insurers noted that business interruption and ransomware are top concerns, though competition keeps premiums under pressure at 0.75%-1.5% of the sum assured.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "96504fa0"}, {"headline": "Coal India and IRP Consortium Seek Zero Subsidies for Rare Earth Magnets", "summary": "State-owned Coal India and a consortium led by IRP Infratech have bid for zero per-kilogram incentives under a ₹7,280 crore government scheme to manufacture rare earth permanent magnets. The initiative aims to reduce dependence on China for components used in new-age industries. The ministry received 20 bids, with other contenders like ReNew and Prozeal seeking varied subsidies.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "1f0b37c3"}, {"headline": "Taxpayers Seek Clarity on Foreign Asset Disclosure Rules Before December Deadline", "summary": "Taxpayers and professionals are urging the CBDT to clarify ambiguities in the FAST-DS amnesty scheme for undisclosed foreign assets. Concerns include the liability of signing authorities for foreign accounts, the segregation of gifts/inheritances, and potential double taxation. A declaration once accepted cannot be changed, and non-disclosure may lead to higher penalties after December 31.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "55d78dda"}, {"headline": "Agricultural Loans Emerge as Major Asset Quality Risk for Indian Banks", "summary": "The gross non-performing asset (NPA) ratio for agricultural loans reached 5.1% in Q2 2026, far exceeding industry and retail segments. Fitch Group's BMI Research highlighted that the vulnerability has increased due to the weakest southwest monsoon since 2015. While the overall system NPA ratio remains healthy at 1.8%, farm credit represents the clearest point of stress for lenders.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "b2139dc6"}, {"headline": "Government Framework Ready to Extend ZED Quality Certification to Service MSMEs", "summary": "The MSME ministry has prepared a framework to expand the Zero Defect Zero Effect (ZED) scheme beyond manufacturing to the services sector. Twenty parameters have been identified, including timely delivery and process control. The expansion will initially cover transport, hotels, and hospitals. Service MSMEs currently account for 38% of India's total MSME base.", "category": "Economy", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "e383b94b"}, {"headline": "Bond Yield Volatility Complicates Banks' Transition to New ECL Accounting Framework", "summary": "Fluctuations in government bond yields are creating uncertainty for Indian banks as they prepare for a forward-looking Expected Credit Loss (ECL) model by April 2027. Lenders like Canara Bank and Central Bank of India have revised their transition cost estimates upward. Banks must also revalue held-to-maturity portfolios at market prices, potentially impacting reserves.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "039d7360"}, {"headline": "Consumer Goods Firms Absorb Higher Raw Material Costs to Protect Demand", "summary": "Major firms like ITC, HUL, and Godrej Consumer are choosing cost-cutting measures over blanket price hikes to sustain volume growth. Rising costs of palm oil, crude derivatives, and freight have pressured margins. Companies are rationalizing vendor networks and optimizing trade investments to limit the impact on consumers as input cost inflation reaches high single digits.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "33409e00"}, {"headline": "Top IT Firms See Faster Growth in Smaller Client Accounts Over Enterprises", "summary": "India's top nine IT services firms are witnessing a trend where client accounts generating $1 million to $10 million in revenue are growing faster than large enterprise accounts. Infosys added 30 clients in this bracket, while TCS added 15. The shift is attributed to clients being cautious about large long-term programs and IT firms deploying flexible models for mid-market deals.", "category": "Technology", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "5c7d8033"}, {"headline": "Congress to Launch Panchayat-Level Campaign Against CEC Gyanesh Kumar", "summary": "AICC general secretary KC Venugopal stated the Congress will continue its agitation against CEC Gyanesh Kumar until his removal. The party plans a 'Vote Bachao, Desh Bachao' campaign at the panchayat level, appointing 'Vote Rakshaks' in every booth to scrutinize electoral rolls. The party alleges unfair deletion of names and aims to make the electoral process transparent.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "677325a2"}, {"headline": "UP CM Yogi Adityanath Accuses Opposition of Propagating Narratives Against Ayodhya", "summary": "Chief Minister Yogi Adityanath alleged that the Samajwadi Party and Congress are spreading propaganda against Ayodhya due to fear of losing their political identity. Addressing a Diwali program in Gorakhpur, he stated that the city's heritage and development threatens the politics of the opposition. He claimed those who created an identity crisis for the state now face one themselves.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "30a76e48"}, {"headline": "Karnataka to Move Ahead with Mekedatu Project Citing Supreme Court Support", "summary": "Karnataka Deputy CM DK Shivakumar asserted the state's right to proceed with the Mekedatu balancing reservoir project. He stated the Supreme Court has already upheld the right subject to Cauvery water-sharing obligations. Shivakumar invited Tamil Nadu CM Joseph Vijay to collaborate, emphasizing the project regulates river flow and manages water efficiently for both states.", "category": "Infrastructure", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "d803fe0d"}, {"headline": "Telangana CM Revanth Reddy Criticizes KTR Over Treatment of Sister K Kavitha", "summary": "CM Revanth Reddy accused BRS leader KT Rama Rao of driving his sister, K Kavitha, out of the family home due to property disputes. Speaking at a meeting for Self-Help Groups, Reddy questioned KTR's commitment to women's welfare given his alleged personal actions. Reddy also announced plans to expand SHG membership in Telangana to one crore women by 2034.", "category": "Politics", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "c822ebd4"}, {"headline": "Stubble Burning Incidents Continue in Punjab Despite Warnings and Legal Action", "summary": "Punjab's Patiala district remains a hotspot for stubble burning, with 200 incidents reported as the air quality in Delhi-NCR worsens. The Punjab Pollution Control Board noted that 3,307 sites were inspected and 1,275 incidents confirmed by November 7. Authorities have registered 870 FIRs and imposed fines totaling ₹60.6 lakh, though recovery remains low at ₹32.5 lakh.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "68292bb7"}, {"headline": "Karnataka and Kerala Order Testing of Petrol for Excess Ethanol Content", "summary": "The Karnataka government will disclose findings from inspections at 67 fuel locations following complaints of petrol containing up to 31.5% ethanol. Kerala has also ordered lab tests on fuel samples. While the Centre defends its 20% blending policy, Oil Marketing Companies have rejected the states' claims, stating that the findings were not based on standard testing procedures.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "936010ad"}, {"headline": "Delhi ITAT Rules Management Services from Chinese Firms Exempt from Indian Tax", "summary": "The Delhi Income Tax Appellate Tribunal ruled that payments for management and technical services rendered entirely in China by Benteler Automotive are not taxable as Fees for Technical Services (FTS) in India. The ruling, based on Article 12(4) of the India-China tax treaty, requires services to be rendered in India for taxation, contradicting a 2010 Mumbai ITAT decision.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "c85a23dc"}, {"headline": "FSSAI Seizes Adulterated Food Worth ₹82 Crore During Festive Season Drive", "summary": "The Food Safety and Standards Authority of India (FSSAI) seized 3,280 tonnes of non-compliant food products during a nationwide inspection that began in September. The regulator cancelled 52 licenses and suspended 1,133 others. Seized items included paneer, milk, and ghee. Additionally, over 10,000 improvement notices were issued to food businesses to ensure consumer safety.", "category": "Health", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "74bc9fe5"}, {"headline": "Subaru and Toyota Gain US EV Market Share Amid Rival Production Cuts", "summary": "Subaru and Toyota sold nearly 62,000 electric vehicles in the US during the first three quarters of 2026, more than doubling their previous year's tally. While other automakers like Ford and GM have scaled back EV plans, the Japanese brands found success with models like the Subaru Trailseeker. Analysts say they are capturing demand from consumers seeking high ground clearance and range.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "e1994f99"}, {"headline": "Kotak Investment Advisors Plans to Raise ₹4,500 Crore for Realty Fund", "summary": "Kotak Investment Advisors is launching its 16th real estate fund, seeking ₹4,500 crore to deploy across residential and commercial properties. The fund will use a mix of debt and equity investments focusing on major cities like Bengaluru, Mumbai, and Pune. Previous funds managed by the firm have generated internal rates of return of approximately 19% with zero credit losses since 2009.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "afd0c989"}, {"headline": "Kalpataru Targets ₹6,500 Crore in Pre-sales for FY27 Amid Housing Demand", "summary": "Realty firm Kalpataru expects to achieve its ₹6,500 crore pre-sales target this fiscal year, representing a 23% increase. CFO Chandrashekhar Joglekar noted that while H1 sales were flat at ₹2,600 crore, the company anticipates 60% of its annual sales to occur in the second half due to festive demand. The firm maintains that housing demand remains strong for established players.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "0125b32b"}, {"headline": "Global Airlines Expand Premium Seating to Boost Revenue Amid Fuel Costs", "summary": "Airlines are increasing the number of premium seats and luxury amenities as demand for high-end travel grows. Delta plans for premium seats to represent 70% of capacity on some flights, featuring Michelin-star menus and improved lounges. While business class takes more floor space, it generates significantly higher profit margins, helping airlines offset rising jet fuel prices.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "1ae2e38f"}, {"headline": "Delhi Real Estate Sees Renewed Interest in High-Rise Luxury Gated Communities", "summary": "Delhi's property market is shifting from low-rise builder floors to integrated high-rise luxury housing. Developers like DLF, TARC, and Unity Group are launching projects to meet demand for security and club amenities within the capital. Recent high-value land sales, including NBFC's Chanakyapuri flats, indicate that buyers are willing to pay premium prices to remain in Delhi.", "category": "Infrastructure", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "2c967233"}, {"headline": "Mahindra & Mahindra Banks on SUV and EV Expansion for Future Growth", "summary": "Mahindra & Mahindra aims to sustain growth through capacity expansion and a strong pipeline of SUV and EV launches. The company plans to increase monthly production capacity to 132,000 units by FY31. While the tractor industry outlook is flat due to weak monsoons, M&M’s aerospace and logistics divisions are emerging as future growth drivers with significant global order wins.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "0be9bece"}, {"headline": "Urgency for Global Climate Action Confronts Geopolitics at Antalya COP31 Summit", "summary": "The 31st UN Climate talks (COP31) begin in Antalya, Türkiye, with delegates negotiating 160 issues including emission reductions and adaptation finance. Australia will lead negotiations as president. Discussions are complicated by geopolitical tensions, rising living costs, and the scientific determination that the world will likely breach the 1.5 degrees Celsius temperature guardrail.", "category": "Environment", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "321a08ea"}, {"headline": "Digital Lenders Record 50% Revenue Growth on Strong Youth Credit Demand", "summary": "Listed fintech companies like Kissht and Moneyview reported 40-50% revenue growth in the September quarter, outpacing traditional banks. Growth is driven by disbursements to Gen Z and self-employed borrowers for unsecured credit. Bajaj Finance saw its assets under management grow 26% to ₹5.85 lakh crore, reflecting a broader expansion in household and small-business credit.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "6344f1d4"}, {"headline": "OpenAI Secures $11 Billion Funding Tranche at $1.25 Trillion Valuation", "summary": "OpenAI has raised approximately $11 billion in the first tranche of a new funding round that values the company at $1.25 trillion. The total round could reach $20 billion. The company continues to lead the AI sector despite recent market volatility. Google executive Donald Harrison resigned from the SpaceX board after a decade, though the reason was not related to company disagreements.", "category": "Technology", ed about the technology's surging electricity and water demand. The UN warns that the global data-centre footprint could double by 2030. Turkey will call on institutions at COP31 to sign a pledge for sustainable AI development and public disclosure of environmental impacts.", "category": "Environment", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "e41b88e2"}, {"headline": "High FCNR(B) Interest Bill Expected to Keep Dollar Hedging Costs Elevated", "summary": "Indian banks face an annual interest bill of up to $9.3 billion on FCNR(B) deposits, with over $4 billion currently unhedged. A new RBI reserve requirement (FERR) of 20% on forex derivative contracts is adding further cost pressure. Treasury executives noted that banks might pass these costs to customers, keeping forward dollar hedging expensive in the near term.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "d0d05a77"}, {"headline": "NBFCs Consider Rate Hikes Following Proposed Regulatory Caps on Insurance Income", "summary": "Non-bank lenders and housing finance companies may increase lending rates and processing fees to offset potential losses from proposed IRDAI caps on insurance commissions. Lenders like Bajaj Housing Finance and Home First expect to recover income through fee corrections. Insurance distribution currently contributes up to 8% of profit after tax for some major NBFCs.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "88ede9da"}, {"headline": "Corporate India Credit Profile Remains Healthy Despite Geopolitical Pressure: Icra CEO", "summary": "Icra Group CEO Ramnath Krishnan stated that corporate India's credit quality is strong due to post-Covid deleveraging, with upgrades outnumbering downgrades three to one. However, high inflation and energy costs remain headwinds. While specific sectors like chemicals and airlines face stress, no systemic crisis is expected as most firms sit on high liquidity.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "61627e14"}, {"headline": "Bank of England Chief Economist Huw Pill Suggests Scope for Rate Cuts", "summary": "BoE economist Huw Pill indicated that interest rates could stay steady or fall if the UK's economic growth stalls next year. While rates were recently raised to 4%, Pill called the decision 'preemptive.' He noted that the scale of current energy price increases is smaller than the 2022 shock and that weakening growth could reduce the need for further hikes.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "0f5523a1"}, {"headline": "NSE Focuses on Diversification Beyond Transaction Fees to Fuel Future Growth", "summary": "The National Stock Exchange is expanding into commodity derivatives, digital gold, and data services after a decline in transaction-charge revenue. Sequential revenue fell to ₹4,067 crore in Q2 following new trading patterns. NSE plans to launch corporate bond index futures and promote Electronic Gold Receipts to create new avenues in the fixed-income and gold segments.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "f5308471"}, {"headline": "India Becomes Largest Market for Electric Three-Wheelers Amid Decisive Shift", "summary": "Over half of all new three-wheelers sold in India are now electric, surpassing penetration rates for cars and two-wheelers. Brands like Mahindra Last Mile Mobility are racing to meet demand driven by government subsidies and low operating costs. Drivers report significant daily fuel savings, making ownership attractive despite higher initial purchase prices compared to gas models.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "7efafe4d"}, {"headline": "Japanese Firms Struggle to Pass on Rising Costs to Deflation-Averse Consumers", "summary": "Companies in Japan, including Uniqlo and Saizeriya, face consumer backlash when attempting small price increases. After decades of deflation, Japanese households remain highly price-sensitive despite rising labor and energy costs. The Bank of Japan's move toward higher interest rates further complicates the situation for businesses trying to maintain loyalty while battling inflation.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "9c268f43"}, {"headline": "Gadi Eisenkot Appointed to Form Israel’s National Emergency Government", "summary": "President Isaac Herzog has nominated former general Gadi Eisenkot to form a new government in Israel. Eisenkot has six weeks to build a coalition to oust Benjamin Netanyahu. The challenger aims for a 'national emergency government' amid war and international isolation. However, he faces challenges in aligning with both Arab minority parties and ultra-Orthodox Jewish groups.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "77c6adc2"}, {"headline": "Aramco’s Riyadh Office Damaged in Houthi Missile Attack; No Casualties Reported", "summary": "A Saudi Aramco administrative building in Riyadh's King Abdullah Financial District suffered limited damage after an attack by Yemen's Houthi rebels. Shrapnel caused structural harm, but no injuries were reported. The attack follows near-daily Houthi strikes on Saudi infrastructure, threatening the kingdom's economic diversification plans and increasing regional pressure.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "d8f784bc"}, {"headline": "Trump Appoints Stephen Miller as Chief of Staff for Combative Final Term", "summary": "President Donald Trump has named loyalist Stephen Miller as White House chief of staff. The appointment suggests a ramp-up in aggressive immigration crackdowns and a fighting approach against a Democratic-controlled Congress in the final two years of his term. Miller is known as a combative ideologue with a deep knowledge of federal power levers.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "19da49d1"}, {"headline": "Iran Removes Self-Imposed Range Limits on Ballistic Missiles Amid Regional Tension", "summary": "The Revolutionary Guard announced that Iran has lifted its 2,000-kilometer limit on ballistic missile ranges. The move follows warnings from Supreme Leader Ayatollah Mojtaba Khomeini that threats from the US or Israel will face geographic-free responses. Meanwhile, the US continues its naval blockade in the Strait of Hormuz, disabling vessels attempting to visit Iranian ports.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "d7e4e4e0"}, {"headline": "Lionel Messi Wins Second Consecutive MLS Golden Boot Award", "summary": "Inter Miami star Lionel Messi has secured his second consecutive MLS Golden Boot after finishing the regular season with 26 goals. His team finished second in the Eastern Conference following a 3-3 draw with Charlotte. Miami will now face Columbus in the playoffs, having set an all-time MLS points record earlier in the season with 77 points.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "7a71d21b"}, {"headline": "An Se-young Claims Korea Open Title for 11th Tournament Win of Year", "summary": "World number one An Se-young won her 11th title of the year by defeating Japan's Akane Yamaguchi in the Korea Open final. The 24-year-old won 21-12, 15-21, 21-16 to continue an unbeaten run since March. An expressed pride in winning her home tournament, extending her head-to-head dominance over Yamaguchi with an 11th straight victory.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "3a741b3f"}, {"headline": "Pakistan Defeats India by Three Wickets in U-19 Asia Cup Thriller", "summary": "Pakistan's U-19 cricket team beat India by three wickets after chasing down a target of 209 in Oman. Hamza Zahoor scored an unbeaten 100 off 108 balls to lead his team home from a top-order wobble. India's Arjun Rajput had earlier scored a century, but the Pakistani middle order, supported by Zahoor's composed knock, secured the victory with 11 balls to spare.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143009", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore ⁰⁹¹¹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143009"}], "article_id": "4e01de73"}, {"headline": "Mekedatu needs TN cooperation, not nod, says CM", "summary": "Karnataka CM D K Shivakumar seeks Tamil Nadu's cooperation for the Mekedatu project, stating permission is not required, only cooperation. This comes after TN CM C Joseph Vijay wrote to the Centre opposing the project.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143014", "sources": [{"newspaper": "Times of India", "pdf_filename": "ToI Bangalore + Times ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143014"}], "article_id": "bbfa3284"}, {"headline": "SEC sets the stage for local body polls in Jan", "summary": "Karnataka State Election Commission plans to hold Zilla and Taluk Panchayat elections in January 2027, directing deputy commissioners to appoint returning officers. Process of appointing officers initiated.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143014", "sources": [{"newspaper": "Times of India", "pdf_filename": "ToI Bangalore + Times ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143014"}], "article_id": "21b80417"}, {"headline": "Muhurat trading ends in the red", "summary": "For the second time in 10 years, Sensex and Nifty closed lower during Diwali Muhurat trading, marking their first negative close since 2017. Profit-booking followed a 7-session rally.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143014", "sources": [{"newspaper": "Times of India", "pdf_filename": "ToI Bangalore + Times ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143014"}], "article_id": "f7b2d9df"}, {"headline": "CM: Ethanol probe covered blending units; findings today", "summary": "CM DK Shivakumar stated ethanol blending probe covered processing units where fuel and chemical are blended. A detailed report with evidence will be released today.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143014", "sources": [{"newspaper": "Times of India", "pdf_filename": "ToI Bangalore + Times ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143014"}], "article_id": "0e3d0f20"}, {"headline": "DKS & Hassan DC deny HDK’s bribery allegations", "summary": "Hassan DC KS Latha Kumari and CM DK Shivakumar denied allegations of bribery and irregularities in land conversion and stone-quarrying permits made by HD Kumaraswamy.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143014", "sources": [{"newspaper": "Times of India", "pdf_filename": "ToI Bangalore + Times ⁰⁹¹¹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143014"}], "article_id": "44272d68"}, {"headline": "First foreign astronaut on China’s Tiangong station will be from const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────

const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;

    panel.className = 'cat-panel';

    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';

}

function buildCard(art, h, m, cat, articleIndex) {

  card.innerHTML = `

          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
