gram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "10cb8aee"}, {"headline": "Karnataka High Court seeks technical report on Hebbal Lake tunnel", "summary": "The Karnataka High Court has requested a technical presentation from an engineering expert regarding the proposed Hebbal Lake tunnel project. The court is investigating whether the construction of the short tunnel will adversely impact the lake's water levels or inflow and outflow. Petitioners have raised concerns about the environmental integrity of the water body.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "1163521f"}, {"headline": "Incorrect India boundary on Anthropic website leads to government notice", "summary": "The Ministry of Electronics and Information Technology (MeitY) has issued a notice to AI company Anthropic after its website allegedly displayed an incorrect map of India. The map depicted parts of Arunachal Pradesh and Ladakh with dotted lines, prompting a complaint from a presentation attendee. The government emphasized that accurate mapping is a legal requirement for digital platforms.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "51729d47"}, {"headline": "Belgium condemns Pahalgam terror attack in solidarity with India", "summary": "During bilateral talks in New Delhi, Belgium condemned the recent terror attack in Pahalgam and expressed solidarity with India in the fight against terrorism. Both nations agreed to enhance intelligence sharing and cooperation on counter-terrorism. The leaders also discussed clean energy, reliable supply chains, and a new mobility agreement for students and professionals.", "category": "India", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "1500a737"}, {"headline": "VHP's restrictive rules for Durga Puja face pushback in Bengal", "summary": "The Vishwa Hindu Parishad's (VHP) set of 'dos and don'ts' for Durga Puja, which includes banning non-Hindus from organizing committees and prohibiting non-vegetarian food near pandals, has met with resistance in West Bengal. Puja organizers and residents in Kolkata argue that the festival is a cultural event that transcends religious boundaries and should remain inclusive.", "category": "Culture", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "691812e7"}, {"headline": "Sudden resignation of popular IAS officer Divya Mittal sparks speculation", "summary": "The unexplained resignation of IAS officer Divya Mittal, who gained popularity for her accessibility and hands-on administration in Uttar Pradesh districts like Mirzapur, has left colleagues and admirers wondering about her next move. Mittal, a 2013-batch officer and IIT-IIM alumna, cited a 'debt to this soil' in her farewell but has not disclosed her future plans or reasons for leaving.", "category": "Politics", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "14253046"}, {"headline": "Apple’s pivot to Indian manufacturing shows smart ecosystem integration", "summary": "Apple is deepening its manufacturing presence in India by integrating with the country's open digital infrastructure, including UPI and ONDC. Reports indicate the tech giant is moving beyond assembly to component manufacturing, aiming to make India a critical hub in its global supply chain. The strategy fits India's PLI schemes and goal of becoming a smartphone export powerhouse.", "category": "Technology", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "910ed3a6"}, {"headline": "Rajnath Singh urges Belgium to restrict sensitive tech sharing with Pakistan", "summary": "Defence Minister Rajnath Singh expressed India's concern regarding the potential transfer of sensitive military technology from Belgium to Pakistan. During talks with Belgian Defence Minister Ludivine Dedonder, Singh emphasized the need for responsible export controls. The two nations discussed deeper industrial cooperation, including the co-production of aerospace and maritime products.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "d7587f17"}, {"headline": "SC: Poverty and migration contribute to child delinquency", "summary": "The Supreme Court observed that poverty, illiteracy, and the discriminatory environment resulting from rural-to-urban migration are major factors driving children toward delinquency. The court emphasized that the state must address socio-economic roots rather than just focusing on punitive measures for juvenile offenders, particularly those from marginalized backgrounds.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "b2007265"}, {"headline": "West Bengal CM to establish 1,000 Vidya Bharati schools annually", "summary": "Chief Minister Mamata Banerjee announced a plan to set up 1,000 new schools annually under the 'Vidya Bharati' initiative to improve the quality of education across the state. The program will prioritize districts like Murshidabad and South 24 Parganas. The move aims to provide modern facilities and a standardized curriculum to bridge the educational gap in rural areas.", "category": "Education", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "c1645aea"}, {"headline": "Karnataka government withdraws controversial park bill following public pressure", "summary": "Following widespread protests, the Karnataka government has withdrawn the proposed park bill that would have allowed commercial activities and construction within public parks. Deputy CM D.K. Shivakumar stated the decision was made to address citizen concerns and ensure the protection of the city's green spaces. The bill will be re-evaluated for future modifications.", "category": "Politics", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "53de5034"}, {"headline": "ISRO shuffles leadership at key centers following superannuations", "summary": "The Indian Space Research Organisation (ISRO) has undergone a major leadership reshuffle at several key centers, including the UR Rao Satellite Centre (URSC) and the Human Space Flight Centre (HSFC). The changes were triggered by the retirement of senior officials and aim to bring new focus to upcoming missions like Gaganyaan. Dr. D.K. Singh has been moved to lead URSC.", "category": "Science", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "f1a52784"}, {"headline": "EAM Jaishankar: Diplomacy, not oil, is key to peace in Ukraine", "summary": "External Affairs Minister S. Jaishankar stated that ending the Russia-Ukraine conflict depends on sincere diplomacy rather than narratives about oil trade. Speaking after a meeting with President Zelenskyy's team, Jaishankar reiterated India's stance that the world expects an early end to the war and that India is willing to contribute to any credible peace process through dialogue.", "category": "Politics", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "d75a1fb4"}, {"headline": "US warns of sanctions over Modi’s meeting with Iranian President", "summary": "The US government has cautioned that any trade or cooperation agreements following Prime Minister Narendra Modi's meeting with Iranian President Masoud Pezeshkian could be subject to sanctions. Washington emphasized its firm stance on isolating Iran's nuclear and regional activities, while New Delhi maintains its strategic autonomy in pursuing regional connectivity through Iran.", "category": "World", "page": 17, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "cfdb62bf"}, {"headline": "Nepal flood: Vehicle plugs tunnel mouth, saving 40 trapped workers", "summary": "In a miraculous escape, 40 workers at a hydropower project in Nepal were saved when a flood-swept vehicle plugged the entrance of the tunnel they were trapped in. The vehicle acted as an accidental barrier against a massive flow of mud and debris. Rescuers worked for over 30 hours to safely evacuate the workers, who had lost all communication with the outside world.", "category": "World", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "69860438"}, {"headline": "US government supports OpenAI in copyright lawsuit by New York Times", "summary": "The US Justice Department has filed a court document supporting OpenAI in its ongoing copyright lawsuit against The New York Times. The government argues that fair use protections should apply to the training of AI models using publicly available text. The brief suggests that overly restrictive copyright laws could hinder the development of transformative AI technologies.", "category": "Technology", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "46eac04d"}, {"headline": "India's 7.8% GDP growth is remarkable despite global headwinds: FM", "summary": "Finance Minister Nirmala Sitharaman stated that India's 7.8% GDP growth in the last quarter is a testament to the country's economic resilience amid global disruptions. She highlighted that India continues to be the fastest-growing major economy. The growth was driven by robust performance in manufacturing and services, supported by government infrastructure spending.", "category": "Economy", "page": 19, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "eb0632a2"}, {"headline": "Sebi to revise CAS settlement method for derivative trades", "summary": "The Securities and Exchange Board of India (Sebi) is set to revise the settlement price mechanism for derivatives following a consultation period. The new method for Closing Auction Session (CAS) seeks to reduce market volatility and prevent price manipulation. Sebi has proposed a system that better reflects true volume-weighted average prices during the final trading hour.", "category": "Business", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "7b5c9d09"}, {"headline": "Nvidia’s price hike may increase costs for Indian AI infrastructure", "summary": "Nvidia's plan to raise prices for its high-end AI chips by up to 15% is expected to significantly increase infrastructure costs for Indian startups and cloud providers. Industry experts warn that the hike will lead to higher deployment costs for AI models and data centers. Firms are now re-evaluating their expansion plans and looking for more power-efficient alternative hardware.", "category": "Technology", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "13a23690"}, {"headline": "Dry lakebeds in Karnataka transformed into 95MW solar fields", "summary": "Karnataka's energy department has successfully converted several dry lakebeds in rural Bengaluru into solar power plants, generating 95MW of electricity daily. The initiative uses solar pumps to provide irrigation to nearby farms while feeding surplus power into the state grid. The project has been hailed as a model for utilizing unusable land for sustainable energy production.", "category": "Environment", "page": 20, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "c5bacb48"}, {"headline": "CBI to probe Disha Salian case following High Court orders", "summary": "The Central Bureau of Investigation (CBI) has taken over the probe into the death of Disha Salian, former manager of actor Sushant Singh Rajput, following directions from the Bombay High Court. The court noted lapses in the initial police investigation and emphasized the need for a thorough inquiry to address inconsistencies in reports regarding her death in June 2020.", "category": "Law", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "62b0bd9c"}, {"headline": "Office-to-home trend drives premium housing demand in Bengaluru", "summary": "The expansion of Global Capability Centres (GCCs) in Bengaluru is creating a ripple effect on the city's real estate, driving demand for premium homes near office corridors. Residential prices in areas like Whitefield and Sarjapur Road have appreciated significantly as employees prefer living close to their workplaces to avoid traffic congestion.", "category": "Infrastructure", "page": 28, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 28, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "9646771f"}, {"headline": "Centre Sees No Cost Pain for RBI on Dollar Deluge", "summary": "The RBI is expected to manage a $127-billion inflow from maturing FCNR(B) deposits and swap facilities without high sterilisation costs. Treasury gains and existing liquidity tools are projected to offset potential hedging expenses of approximately ₹36,000 crore. Analysts believe the central bank's healthy contingency buffer will allow it to absorb the excess liquidity smoothly.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "76b33019"}, {"headline": "Green Flag Up for Purvah to Buy Welspun RE Arm", "summary": "Purvah Green Power is set to acquire Welspun New Energy for an enterprise value of approximately ₹2,500 crore. The deal will add 45 MW of operational projects and a 5 GW pipeline to Purvah's portfolio. The acquisition aligns with the company's goal to build a 10 GW green power capacity through both organic growth and acquisitions by 2030.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "73d1f2b6"}, {"headline": "Jio Sets Eyes on Navratri-Diwali Period to Launch Mega $4b IPO", "summary": "Reliance Industries' telecom arm, Jio Platforms, is planning to launch its $4-billion initial public offering (IPO) during the festive window of Navratri to Diwali. The company is currently finalising international and domestic roadshows. The IPO is expected to be one of India's largest, potentially valuing the company significantly higher than previous funding rounds.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "26781e21"}, {"headline": "Indian Cos Rush to Align with UAE Minimum Tax", "summary": "Multinational companies operating in the UAE are restructuring their operations to comply with a new 15% minimum tax regime starting January 2025. The tax applies to groups with consolidated global revenues exceeding €750 million. The move aims to align with OECD Pillar 2 global tax standards and may impact free zone entities previously enjoying tax-exempt status.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "e8aa8f5b"}, {"headline": "Indian Co in Middle of Ukrainian Arms Supply Scandal", "summary": "An Indian firm, Power Trans, is under investigation for its alleged role in an arms supply chain that diverted artillery ammunition meant for Estonia to Ukraine. The Estonian Ministry of Defence has initiated legal proceedings, claiming breach of contract. The Indian firm denies allegations of unauthorized diversion and maintains the equipment met specified quality standards.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "9a990346"}, {"headline": "India and Belgium to Expand Defence, Trade Partnerships", "summary": "India and Belgium have agreed to deepen ties in defense manufacturing and trade, following a meeting between PM Modi and Belgian counterpart Alexander De Croo. The collaboration includes technology transfer for small arms and potential joint ventures in critical minerals. Both nations reaffirmed their commitment to combatting cross-border terrorism and strengthening maritime security.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "f35e2fba"}, {"headline": "FDA Nod Must in Maha for Iftaars, Langars, Weddings", "summary": "The Maharashtra Food and Drug Administration has mandated prior permission for large-scale food distribution at religious and social events. Organizers of iftaars, bhandaras, and weddings must now file a proforma detailing the caterer and ingredients used. The move aims to prevent incidents of mass food poisoning and ensure adherence to safety standards during peak festive seasons.", "category": "Health", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "72075838"}, {"headline": "Sugar Cosmetics Value May Melt 80% in ₹150cr Bailout", "summary": "D2C beauty brand Sugar Cosmetics is in talks to raise ₹140-150 crore from existing investor A91 Partners at a valuation of ₹500-600 crore. This represents a steep 80% drop from its previous peak valuation of ₹3,000 crore. The firm is struggling with mounting losses and intense competition in the beauty segment, necessitating fresh capital to sustain operations.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "0dc483b6"}, {"headline": "CAS Case: Sebi to Review F&O Settlement Pricing", "summary": "SEBI is reviewing the methodology for determining settlement prices for derivative contracts following market feedback. The move follows concerns over sharp price swings during the recent rollout of the new calling auction session (CAS) in the equity cash segment. A consultation paper on the proposed changes is expected to be released within a week.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "55b12516"}, {"headline": "Large Cos Feel Margin Heat More than Smaller Peers", "summary": "An analysis of 3,340 companies shows that large-cap firms have experienced a sharper contraction in operating margins compared to mid and small-cap peers. Large-cap margins fell by 230 basis points year-on-year to 13.5% in the June quarter. Input cost pressures and a higher base effect are cited as primary reasons for the relative underperformance of bigger corporate entities.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "e819c680"}, {"headline": "Labels are Now Main Course for Top F&B Chiefs", "summary": "Top food and beverage executives are intensifying their focus on label compliance and ingredient safety following recent regulatory crackdowns. Companies are diverting funds from marketing to strengthen internal audits and third-party testing. FSSAI has issued over 150 notices to brands for misleading claims, forcing boards to prioritize product transparency over brand image.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "b06bb880"}, {"headline": "Electronics Cos Plug into Cheaper Inputs, Localisation", "summary": "Indian electronics manufacturers are shifting from copper to aluminum and increasing domestic sourcing to mitigate rising raw material costs. Copper prices have risen nearly 18% year-on-year, prompting companies like Voltas and Bajaj Electricals to redesign products. Localisation efforts have increased from 15% to nearly 40% in some segments to stabilize consumer pricing.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "bea945d9"}, {"headline": "Bring Two GDP Series, with Old & New Base: Sen", "summary": "Former chief statistician Pronab Sen has suggested that the government should release two separate GDP series with both the old and new base years for at least five years. This dual reporting would help identify if 'double deflation' is correctly capturing real economic growth. India last updated its GDP base year to 2011-12 and has delayed further revisions due to data inconsistencies.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "ce9bd4e9"}, {"headline": "Services Activity Grows in Aug, But Near 4-Year Low", "summary": "India's services sector expanded in August driven by strong domestic demand, but the pace of growth hit a near four-year low. The HSBC Services Business Activity Index fell to 54.1 from 55.3 in July. While business confidence remains high, rising input costs and a slight moderation in new orders have slowed the momentum compared to the rapid expansion seen earlier this year.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "5135e0de"}, {"headline": "AB Group Forays into Wires and Cables Business", "summary": "Aditya Birla Group has announced its entry into the ₹1.8 lakh crore wires and cables market under the brand 'Ultravolt'. The new venture, housed under UltraTech Cement, plans to invest ₹1,800 crore to become a top five player within five years. The company will leverage its massive dealer network of over 1 lakh retailers to challenge established players like Polycab and Havells.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "baaec1d7"}, {"headline": "AI Outage: Claude, ChatGPT, Gemini, Grok Services Hit", "summary": "Major AI platforms including OpenAI's ChatGPT, Google's Gemini, and Anthropic's Claude experienced significant service disruptions on Thursday. Users reported errors in generating responses and interface failures worldwide. The outages were attributed to technical issues at infrastructure providers like AWS and internal server errors, highlighting the fragility of global AI dependencies.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "1436469b"}, {"headline": "FSSAI Mulls Ban on Non-dairy Paneer", "summary": "The Food Safety and Standards Authority of India (FSSAI) is considering a ban on 'analog paneer,' which uses vegetable oils instead of milk fats. The regulator noted that such products are often sold as genuine dairy paneer, misleading consumers. New rules may restrict the use of the term 'paneer' for non-dairy alternatives and mandate clear labeling to distinguish plant-based substitutes.", "category": "Health", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "f63c2a12"}, {"headline": "Wipro Kawasaki to Invest ₹1,000cr for Hydraulic Pump Plant", "summary": "Wipro Kawasaki Precision Machinery plans to invest ₹1,000 crore to set up a new manufacturing unit for hydraulic pumps at Harohalli, Karnataka. The plant, sprawling over 30 acres, is expected to create 1,200 jobs and produce over 2 lakh hydraulic pumps annually. The facility will cater to the growing demand in the construction and earthmoving equipment sectors.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "c5fd9362"}, {"headline": "Clock is Ticking as Missing No. Tops 5,000 in Nepal", "summary": "The death toll from catastrophic flash floods in Nepal has risen to 1,259, with over 5,083 people still reported missing. International aid is pouring in as rescue operations face challenges from destroyed infrastructure and blocked mountain passes. The Nepal government has requested satellite imagery and specialist rescue teams to help locate survivors in the remote Langtang region.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "13a7dff0"}, {"headline": "States Draw Up Action Plan For Pollution Season", "summary": "NCR states including Punjab, Haryana, and UP have submitted a 7-point action plan to the Centre to combat stubble burning and winter pollution. Measures include increased subsidies for biomass machinery and strict monitoring of thermal plants. The plan also includes dust control protocols for construction sites and emergency traffic restrictions if AQI levels cross critical thresholds.", "category": "Environment", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "ad3778c5"}, {"headline": "Warring Row Tests Cong's Dalit Pitch", "summary": "Internal friction in the Punjab Congress has intensified as state unit chief Amarinder Singh Raja Warring faces scrutiny over alleged anti-Dalit remarks. The row has sparked protests from within the party's Scheduled Caste wing, potentially undermining the Congress party's efforts to woo the Dalit vote bank ahead of upcoming state elections. Central leadership has called for a detailed report.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "e0c8acb0"}, {"headline": "Recruitment Scam: K'taka Suspends IAS Officer Gangwar", "summary": "The Karnataka government has suspended senior IAS officer Gyanendra Kumar Gangwar following his arrest by the CID in a recruitment scam. The investigation involves alleged irregularities in the recruitment of gazetted probationers by the KPSC. Gangwar is accused of abusing his position to facilitate illegal selections, and a special court has remanded him to judicial custody for 14 days.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "87543367"}, {"headline": "The Un-Unicorn Slice Bags $100m at Slashed $470m Value", "summary": "Fintech startup Slice has raised $100 million in fresh funding but at a valuation of $470 million, a 64% drop from its previous peak of $1.3 billion. The round was led by Tarsadia Investments and GGV Capital. The funding comes as the company pivots to a full-service banking model following regulatory changes in the prepaid card segment that impacted its primary business model.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "762aab29"}, {"headline": "India's Semicon Dream Needs Time to Bloom: Sima AI", "summary": "Sima AI CEO Krishna Rangasayee stated that India's ambition to become a global semiconductor hub will require decades to fully mature. While government incentives are a good start, he emphasized the need for a robust talent pool and indigenous manufacturing ecosystems. He warned that high upfront costs and long gestation periods are major challenges for domestic startups in this space.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "33041bfa"}, {"headline": "Apple Facing $2.7b UK Lawsuit over App Tracking Rules", "summary": "Apple is facing a $2.7-billion class-action lawsuit in the UK, alleging that it used its dominant market position to impose unfair app tracking rules. The claim argues that Apple's 'App Tracking Transparency' framework harmed third-party developers while giving its own advertising services an unfair advantage. Apple has denied the allegations, stating the feature was designed for user privacy.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "d4426660"}, {"headline": "SC Approves Settlement; NSE's Mega IPO Plans Clear Hurdle", "summary": "The Supreme Court has approved a settlement between SEBI and the National Stock Exchange (NSE) regarding the long-standing co-location case. The settlement clears a major regulatory hurdle for the NSE's proposed ₹31,000-crore initial public offering. The exchange had been barred from accessing the capital markets for years due to allegations of giving certain brokers preferential access.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "9f6d2e1b"}, {"headline": "Alcaraz Wants to Break Free", "summary": "Tennis star Carlos Alcaraz advanced to the third round of the US Open with a straight-sets victory. Despite his dominant performance, the Spaniard expressed concerns over the grueling ATP calendar and its physical toll on players. He called for a review of the schedule to prevent long-term injuries, noting that he felt physically drained following the recent Olympic Games in Paris.", "category": "Sports", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "118074a4"}, {"headline": "Drive on Road to Viksit Bharat: PM to Auto Cos", "summary": "Prime Minister Narendra Modi exhorted the Indian automobile industry to lead the transition toward green and sustainable mobility. Speaking at the SIAM annual convention, he urged manufacturers to increase R&D investment and focus on global exports. He emphasized that the auto sector's growth is central to India's vision of becoming a developed nation (Viksit Bharat) by 2047.", "category": "Economy", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "e259080c"}, {"headline": "Preferential Tariffs with US Deal: Goyal", "summary": "Commerce Minister Piyush Goyal stated that India will seek preferential tariff advantages in its upcoming trade deal with the US, similar to those enjoyed by competing economies. The move aims to protect Indian farmers and small businesses while increasing market access for textiles and gems. Negotiations are focused on ensuring a balanced trade partnership without compromising domestic interests.", "category": "Economy", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "48dd32a5"}, {"headline": "Sebi Plans Net Settlement for MF Trades in Cash Mkt", "summary": "SEBI is considering a plan to allow net settlement for mutual fund transactions in the cash market to improve capital efficiency. Currently, these trades are settled on a gross basis, requiring higher liquidity. The proposed change would allow MFs to offset buy and sell obligations within the same settlement cycle, potentially lowering the costs for asset management companies and investors.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "283841a1"}, {"headline": "MS Pill Trial Success a Boost for Novartis' Drug Pipeline", "summary": "Novartis announced that its experimental oral pill for Multiple Sclerosis (MS) has met its primary goals in a late-stage clinical trial. The drug showed significant efficacy in reducing brain lesions and relapse rates compared to existing treatments. Analysts expect the drug to become a blockbuster with peak sales potential exceeding $1.5 billion, strengthening Novartis' neurology portfolio.", "category": "Health", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "f09650e7"}, {"headline": "Home Prices Rise Twice as Fast as Construction Costs", "summary": "A report by Anarock Group indicates that residential property prices in India's top seven cities have risen twice as fast as construction costs over the last five years. While construction costs increased by 25-30%, average home prices surged by over 50%. The gap is attributed to high demand-supply mismatch and rising land acquisition costs in prime urban locations like Mumbai and Gurugram.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136183", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136183"}], "article_id": "c39b43a1"}, {"headline": "India Ready to Help End War, Says EAM in Kyiv", "summary": "External Affairs Minister S. Jaishankar, during a historic visit to Kyiv, stated that India is prepared to contribute to any effort to end the Ukraine conflict. He emphasized that India supports a peaceful resolution through diplomacy and dialogue. The visit marks a significant shift in India's engagement with Ukraine, focusing on humanitarian aid and potential reconstruction support.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136183"}], "importance": 9, "article_id": "16c2e175"}, {"headline": "Smriti Mandhana steers India into semi-finals with record century", "summary": "Indian batter Smriti Mandhana scored a record-breaking 124 off 64 balls to lead the Indian women's team into the semi-finals of the Asian Games cricket tournament. Her performance helped India secure a dominant 137-run victory over Hong Kong. Mandhana's century is the highest score by an Indian woman in T20 Internationals, surpassing her own previous records.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136209"}], "importance": 7, "article_id": "8e6246b7"}, {"headline": "IAS officer Gyanendra Kumar Gangwar suspended over recruitment scam", "summary": "The Karnataka government has suspended IAS officer Gyanendra Kumar Gangwar following allegations of his involvement in a recruitment scam at the Karnataka Public Service Commission (KPSC). The Enforcement Directorate and CID are investigating claims of financial irregularities and shielding of accused persons during his tenure. Gangwar was previously serving as an IAS officer in Bengaluru.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136209"}], "importance": 7, "article_id": "3b8276fa"}, {"headline": "State Withdraws Parks Bill After Citizens' Protests", "summary": "The Karnataka government has decided to withdraw the controversial Parks (Preservation) (Amendment) Bill following intense public protests. The bill sought to allow the government to take over up to 5% of park land for public utility purposes. Activists feared the move would lead to the commercialization of green spaces in Bengaluru and other urban centers.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136183"}], "importance": 6, "article_id": "648ab814"}, {"headline": "Madras HC: Main Medium Must be Tamil; TN to Centre", "summary": "The Madras High Court has passed a resolution stating that Tamil should be the primary medium of instruction in schools and the principal language of the judiciary in Tamil Nadu. The court urged the Union government to recognize Tamil's status as a classical language by ensuring its use in all central government offices in the state. The move is seen as a push for linguistic identity.", "category": "Education", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136183"}], "importance": 6, "article_id": "e603eaa1"}, {"headline": "BCI has No Power to Take Action against Law Students: SC", "summary": "The Supreme Court ruled that the Bar Council of India (BCI) lacks the statutory authority to take disciplinary action against law students for misconduct within universities. The court clarified that BCI's powers are limited to legal professionals enrolled as advocates. Universities retain the sole jurisdiction to penalize students for behavior occurring during their academic courses.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136216"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136183"}], "importance": 8, "article_id": "c39f90ad"}, {"headline": "NHRC Seeks Reports on Insta CSAM Ads", "summary": "The National Human Rights Commission (NHRC) has issued notices to Meta and the Ministry of Electronics and IT regarding reports of advertisements on Instagram promoting child sexual abuse material (CSAM). The commission expressed grave concern over the automated algorithms that allowed such content to be monetized. It has sought a detailed report on safety measures within four weeks.", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136183"}], "importance": 7, "article_id": "b13ea4aa"}], "newspapers": ["Financial Express", "Hindustan Times", "Times of India", "Business Standard", "Economic Times", "Mint", "Business Line", "The Hindu", "Indian Express"], "total_articles": 99};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
