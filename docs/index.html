<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

icle_id": "fd42f829"}, {"headline": "HDFC Bank launches electric car loan", "summary": "HDFC Bank has introduced a flexi (green) electric car loan with differential loan proportions for the body and battery. The battery loan can be repaid over a longer term, offering flexibility in EMI outflow.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/141617", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 26-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141617"}], "article_id": "cdc79d64"}, {"headline": "India’s 2029 rear-crash rule could cost OEMs ₹2,700 crore annually", "summary": "India's April 2029 rear-impact safety mandate could add ₹2,700 crore annually to passenger vehicle manufacturing costs. Costs are estimated at ₹5,000 per small car, ₹4,000 for SUVs/sedans, and ₹15,000 for EVs, impacting margins, especially for entry-level models.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141617", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 26-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141617"}], "article_id": "d13000d6"}, {"headline": "Under India-Asean FTA, electronic goods makers turn to Vietnam for parts", "summary": "With zero duty imports from Vietnam under the India-ASEAN FTA, electronics makers are increasing imports of components like displays and earbuds. This trend saves costs compared to manufacturing in India, impacting domestic production policies.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141617", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 26-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141617"}], "article_id": "659a5d16"}, {"headline": "Poland’s WB Group to invest $100 m in India for drone production", "summary": "Poland's WB Group plans to invest $100 mil nce": 8, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "c805672a"}, {"headline": "Dr Reddy’s Bets on Generic Semaglutide, Biosimilars", "summary": "Dr Reddy's expects an earnings decline in FY27 before a FY28 recovery, driven by generic semaglutide and biosimilar launches, despite current challenges in North America and API business.", "category": "Health", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "de175f66"}, {"headline": "Ind AS 118 Financial Reporting Rules to Impact Costs", "summary": "New Ind AS 118 financial reporting standards could alter how companies present operating profit and expenses, requiring updates to accounting systems and internal controls.", "category": "Business", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "5cbbaf7d"}, {"headline": "Citibank India CEO Optimistic on IPO Stream, Foreign Investment", "summary": "Citibank India CEO K Balasubramanian sees continued IPO opportunities and potential for foreign investment if India offers disproportionate returns, citing trade agreements and AI.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "79cf1206"}, {"headline": "LPG Federations Oppose Strike, Favor Talks", "summary": "Major LPG distributors' federations have opposed a proposed Delhi protest and strike, favoring dialogue with OMCs and the petroleum ministry to resolve commission and operational issues.", "category": "Business", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "9b5de2a1"}, {"headline": "Flipkart Roots for Eco-Green Goods via 'Earth' Vertical", "summary": "Flipkart is launching 'Flipkart for Earth', a premium category for eco-friendly products, aiming to attract wellness-focused shoppers and compete with quick commerce offerings.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "ee62e737"}, {"headline": "Premium AI Efficiencies Shield Q2 IT Margins", "summary": "Seven top Indian IT firms maintained or increased Q2 operating margins due to AI efficiencies and lean staffing, offsetting revenue deflation from macro headwinds.", "category": "Technology", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "382487ae"}, {"headline": "Audi to Build $4 Billion Factory in Georgia", "summary": "Audi plans to build a $4 billion SUV assembly plant in Georgia, USA, aiming to produce 200,000 SUVs annually and leverage US market appeal.", "category": "Business", "page": 20, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "81ca4229"}, {"headline": "Obama Attacks 'Corrupt' Trump in Midterm Rally", "summary": "Former US President Barack Obama accused Donald Trump of corruption and criticized his strategies for Iran and his business dealings during a midterm election rally.", "category": "Politics", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "90ea9f42"}, {"headline": "Iran Claims US Drone Shot Down Over Bandar Abbas", "summary": "Iran's air defense systems reportedly shot down a US drone over Bandar Abbas, escalating regional tensions amidst calls for gas rationing due to approaching winter.", "category": "World", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "0fa7204c"}, {"headline": "India Needs to Play Bigger Game Alongside US", "summary": "For a better global order, India must play a more proactive role alongside the US, differentiating its position from MAGA sentiment and rethinking diaspora policy.", "category": "Politics", "page": 10, "importance": 9, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "16a861ab"}, {"headline": "STEM Talent Retention Needs Research Poverty Trap Break", "summary": "India needs to break its 'research poverty trap' by improving market conditions, policy administration, and fostering linkages between academia and industry to retain STEM talent.", "category": "Science", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "e09f2b4c"}, {"headline": "Hermès Faces Challenge in China's Shifting Luxury Market", "summary": "Hermès faces weakening demand in China, its key market, as affluent Chinese consumers increasingly favour high-end local brands over traditional European luxury.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "ff737a0c"}, {"headline": "HomeLane Logs Revenue, Losses Up in FY26", "summary": "HomeLane reported ₹745 crore revenue and ₹137 crore loss in FY26, focusing on profitability over growth after integrating with DesignCafe.", "category": "Business", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "2aa2843a"}, {"headline": "Banks Seek Relief from Sustainable Lending Norms for FCNR(B)", "summary": "Banks have asked IFSCA to exclude FCNR(B) deposits from sustainable lending targets due to limited investment avenues and a surge in deposits.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "f9bcc850"}, {"headline": "NBFCs Seek 5-Year Transition to Reduce Selling Fee", "summary": "NBFCs requested a five-year transition period from IRDAI to reduce insurance commissions, warning that steep cuts could make distribution unviable.", "category": "Business", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141651", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 26-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/141651"}], "article_id": "fc6fc42c"}, {"headline": "Nifty tests key support as foreign outflows intensify", "summary": "Nifty 50 faces a crucial test as it nears the April 2025 support level of 21,743.65. Markets are under pressure from massive foreign portfolio investor outflows, totaling ₹2.85 trillion between October 2024 and March 2025. Analysts warn that a breach of this level could trigger a deeper correction or signal a shift in the market's medium-term trend toward more volatility.", "category": "Business", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "246702f0"}, {"headline": "Private ISPs to connect homes via BharatNet infrastructure", "summary": "India is opening its BharatNet optical fibre network to private internet service providers to boost rural broadband. The plan aims to allow ISPs to register on a new portal and directly provide connections to households. Currently, BharatNet has connected only 1.64 million out of a targeted 15 million homes. New guidelines are expected to streamline the last-mile connectivity.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "5844110f"}, {"headline": "JSW MG Motor relies on Chinese partner Saic for parts", "summary": "JSW MG Motor India continues to heavily rely on its Chinese partner Saic Motor for its supply chain, with nearly 70% of purchases coming from Saic-linked firms. In fiscal year 2026, transactions with these entities totaled about $840 million. The joint venture aims to invest ₹3,000-4,000 crore annually to expand capacity while navigating scrutiny over its dependence on Chinese imports.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "86887bb4"}, {"headline": "Weak monsoon prompts NBFCs to tighten rural lending", "summary": "Non-banking financial companies (NBFCs) are turning cautious on rural lending due to deficient rainfall and El Nino-related drought risks. Lenders like Shriram Finance and Mahindra Finance have flagged potential impacts on farmers' repayment capacity and income. This shift follows a 2026 southwest monsoon that ended at 87% of its long-period average, impacting agricultural output.", "category": "Economy", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "9c451860"}, {"headline": "Corporate Affairs ministry extends FY26 filing deadlines", "summary": "The ministry of corporate affairs has extended the deadline for companies to file annual financial statements for 2025-26 until December 31, 2026. Firms can submit annual returns until January 31, 2027. The extension follows difficulties faced by stakeholders in submitting statutory forms through the MCA 21 portal. No additional fees will be charged for filings made within the new window.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "5f08f102"}, {"headline": "Centre extends post-harvest infrastructure fund scheme to 2028", "summary": "The Union government has approved the extension of its Agriculture Infrastructure Fund (AIF) scheme by two years until September 2028. Disbursement under the fund will continue until March 2031. The scheme provides financial support for post-harvest infrastructure projects like cold stores and warehouses. Since 2020, it has mobilized over ₹1.73 trillion for over 228,428 projects nationwide.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "db88661e"}, {"headline": "Road ministry to assist states in improving highway quality", "summary": "The union road ministry plans to share its project preparation and construction expertise with states to improve the quality of regional highways. Senior officials and engineers will be sent to help raise road quality standards. States are being encouraged to use national digital tools for tracking land acquisition and monitoring construction progress to ensure better infrastructure safety.", "category": "Infrastructure", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "6f8ccfa8"}, {"headline": "New land compensation rules to ease power projects", "summary": "The power ministry has issued guidelines to streamline right-of-way and land acquisition for electricity transmission lines. Compensation for the tower-base area will be set at 200% of market value. For the corridor area, it will be 30% of market value. The move aims to resolve legal disputes and speed up infrastructure development needed to meet India's 500GW renewable target by 2030.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "c423698c"}, {"headline": "India faces major talent gap in AI-ready workforce", "summary": "India is experiencing a demand-supply gap for specialized AI talent that is over 3.5 times available supply. Industry reports suggest a need for 1.4 million AI professionals by 2026 against a pool of 400,000. While entry-level salaries have risen slightly, senior roles combining technical depth with architectural knowledge command significant premiums as firms deploy AI at scale.", "category": "Education", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "3e26a6c8"}, {"headline": "NSO to track gig and platform workers in surveys", "summary": "The National Statistics Office (NSO) is revamping its Periodic Labour Force Survey to include estimates for gig and platform workers from 2027 onward. The survey will add questions on such work and create a separate stratum for households with digital platform workers. This data aims to help policymakers and investors analyze the growing gig economy and provide inputs for monetary policy.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "69c8d10f"}, {"headline": "What investors should know about the EAAA IPO", "summary": "AAA India Alternatives (EAAA), backed by Edelweiss Alternatives, is launching its IPO to raise around ₹1,200 crore. The firm invests in equity, quasi-equity, and debt instruments through three primary streams. The issue is priced between ₹1,585-1,665 per share. EAAA is valued at 40.6 times its FY26 earnings at the upper end of the price band, aiming to tap into the growing private credit market.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "41bf87a1"}, {"headline": "Infosys deal wins offer it no edge over competitors", "summary": "Despite raising its revenue growth guidance to 1-2%, Infosys's recent deal wins provide little competitive advantage. The company reported $5.2 billion in large deals for Q2FY27, but core operating margins remained steady at 21.1%. Analysts suggest that without significant organic growth and with high offshore delivery, the firm remains vulnerable to AI-driven price deflation.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "a286bd14"}, {"headline": "Investment shifting from secondary markets to IPO pipeline", "summary": "Investors are reallocating capital from secondary markets to a massive ₹3 trillion IPO pipeline. Speaking to Mint, Madhu Lunawat noted that high-quality stocks in the secondary market are being ignored as focus shifts to primary offerings. Despite global risks like high crude prices and El Nino, the primary market remains robust with nearly 130 IPOs worth over ₹3 trillion in wait.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "463eda00"}, {"headline": "Wow! Momo to raise ₹300 crore ahead of IPO", "summary": "Quick-service restaurant chain Wow! Momo is planning to raise ₹250-300 crore in its final private funding round before an IPO in 18-24 months. The Kolkata-based company aims to expand its footprint in India and internationally, including Sri Lanka and the UAE. It targets a revenue of approximately ₹1,050 crore in FY27. The brand operates Wow! Momo, Wow! China, and Wow! Chicken outlets.", "category": "Business", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "0536db33"}, {"headline": "Indian startups pivot to high-risk biotech moonshots", "summary": "Indian startups are increasingly entering the biotech field, tackling complex areas like mRNA vaccines and specialized drug discovery once dominated by large pharma. Hyderabad-based PopVax is developing a fridge-stable mRNA platform, while others focus on neurodegenerative diseases and gene editing. The shift is supported by government initiatives like the BIRAC-RID scheme for R&D.", "category": "Science", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "eaf8d94f"}, {"headline": "Naman Group plans hospitality expansion to 2,500 rooms", "summary": "Shree Naman Group is expanding its hospitality portfolio, aiming for at least 2,500 hotel rooms across India. The group, which owns properties like Sofitel Mumbai BKC and JW Marriott Bengaluru Prestige Golfshire, plans to add about 1,000 rooms through acquisitions and new developments. It currently manages approximately 1,500 rooms and seeks to capitalize on growing domestic travel.", "category": "Business", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "9bb97b5f"}, {"headline": "JSW Steel flags domestic raw material and import challenges", "summary": "JSW Steel has called for faster development of domestic iron ore mines and investment in coal washeries to support India's steel production targets. The company noted that a stronger raw material supply chain is essential as the country aims for a 600 million tonne capacity by 2047. Current challenges include high costs of metallurgical coal and rising imports of cheaper finished steel.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "7f1ea33e"}, {"headline": "Live event venues to cut costs and counter AI", "summary": "Live entertainment companies are exploring physical infrastructure to cut costs and counter the potential threat of AI-generated content. District plans to focus on staging concerts and live events in up to 10 major cities, emphasizing that human experiences remain a premium. The strategy involves building dedicated venues to avoid high temporary rental costs and foster community engagement.", "category": "Culture", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "bdf4315c"}, {"headline": "IIFL Capital hires Barclays veterans for wealth business", "summary": "IIFL Capital Services has hired four senior bankers from Barclays to lead its expansion into the ultra-high-net-worth wealth management segment. The team will focus on growing the firm's global Indian division. This follows IIFL’s broader expansion strategy after raising ₹2,000 crore in preferential capital from Fairfax and others earlier this year to enhance its competitive position.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "c6d30bf8"}, {"headline": "France deploys 70,000 security personnel to prevent riots", "summary": "The French government deployed 70,000 security officials to prevent a repeat of large-scale violence and looting seen weeks ago. Over 110,000 people participated in peaceful demonstrations in Paris, but authorities remain on high alert against fringe groups. The unrest, fueled by economic grievances and labor strikes, has raised concerns about France’s fiscal stability and public safety.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "0770c29d"}, {"headline": "Riyadh airport resumes operations following Houthi drone attacks", "summary": "Riyadh’s King Khalid International Airport has resumed partial operations after Houthi rebels launched a wide-ranging strike with drones and ballistic missiles. Saudi air defenses intercepted several threats targeting the capital and other regions. While local carriers like Saudia resumed flights, some international airlines remain cautious. The escalation adds tension to the region.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "2adb49c9"}, {"headline": "Trump prepares for Iran escalation following Israeli polls", "summary": "US President Donald Trump is reportedly considering military options against Iran in the coming weeks, following Israeli election results. The US State Department has ordered the departure of some diplomats from Riyadh, citing potential Iranian retaliation. Amid regional instability, Gulf states are bracing for possible strikes, while diplomatic efforts remain at a stalemate.", "category": "Politics", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "4e101778"}, {"headline": "Riyadh Air launches international service amid regional conflict", "summary": "Saudi Arabia’s new carrier, Riyadh Air, has launched international service amidst escalating regional tensions. The airline’s first flight to London departed on schedule, signaling the kingdom’s commitment to its aviation and tourism goals. Despite Houthi attacks on Riyadh’s airport, the carrier plans to expand its network to London, Islamabad, and Cairo using a new Boeing fleet.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "27d9f126"}, {"headline": "Five major companies set to launch IPOs this week", "summary": "The Indian primary market will see five companies, including EAAA India Alternatives and MK Sons Fine Jewels, launch their IPOs this week. These offerings follow a busy month that saw Jio Platforms launch India’s largest-ever public issue. Other firms in the pipeline include BLS Polymers and Milestone Games. The total expected fundraising from these issues is approximately ₹2,600 crore.", "category": "Business", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "4fe8cd78"}, {"headline": "Isro to expand with four launch pads by 2029", "summary": "The Indian Space Research Organisation (Isro) plans to have four operational launch pads by 2029 to meet global demand for satellite deployment. This includes a new dedicated Small Satellite Launch Vehicle (SSLV) complex at Kulasekarapattinam. Isro chairman S. Somanath stated the expansion would support both national missions and private sector participation in the space economy.", "category": "Science", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "7e494fa7"}, {"headline": "Pharma and healthcare sector see surge in platform deals", "summary": "The pharmaceutical and healthcare industries are witnessing a wave of consolidation through platform deals. Private equity firms and larger hospital chains are increasingly acquiring smaller, specialized assets to build scaled-up platforms. Recent deals include ChrysCapital's acquisition of a stake in Novartis India and KKR’s investment in a multi-specialty hospital platform in South India.", "category": "Health", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "b4e9a903"}, {"headline": "AI marks a major inflection point for HCL Technologies", "summary": "HCL Technologies CEO C. Vijayakumar stated that artificial intelligence represents a significant \"inflection point\" for the global tech industry. He noted that while AI is reshaping business models, it also requires continuous innovation and reinvestment. Vijayakumar emphasized that AI's impact is now broader than just automation, affecting the core boundaries of various industries.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "235d00af"}, {"headline": "Tech giants pour $100 billion into India's AI infrastructure", "summary": "Global tech giants like Microsoft, Google, and Amazon are investing heavily in AI-ready data centers across India. Microsoft has committed $20.5 billion for cloud and AI regions, while Amazon Web Services announced a $21 billion investment. These projects, located in hubs like Hyderabad and Visakhapatnam, aim to harness India's AI potential and support a $1 trillion digital economy by 2035.", "category": "Technology", "page": 10, "importance": 10, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "d2e5de42"}, {"headline": "Data centers to power India's leap into AI applications", "summary": "India's data center boom is expected to drive breakthroughs in AI applications for healthcare, education, and finance. The government has granted infrastructure status to data centers, facilitating easier access to capital. These facilities will enable large-scale AI models to solve national challenges, such as diagnosing diseases and providing multilingual educational support.", "category": "Technology", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "b4b8a0b1"}, {"headline": "Rising bond yields challenge gilt fund managers' strategies", "summary": "Indian sovereign bond yields have surged to nearly 5.5% amid West Asia tensions and high crude oil prices. This rise has placed gilt fund managers at a crossroads, with some seeing current yields as an attractive entry point while others advise caution. High yields attract new investors but can depress existing bond prices, leading to volatility in debt fund returns for the year.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "574b0aee"}, {"headline": "Election Commission faces calls for transparency in roll revisions", "summary": "The Election Commission of India is facing criticism over its special revision of electoral rolls, with reports of legitimate voters being left out. An editorial in Mint argues for more transparency and independence in the Commission’s functioning to ensure democratic legitimacy. The process in states like West Bengal and Bihar has highlighted the need for inclusive voter registration.", "category": "Politics", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "c1afb686"}, {"headline": "Proposing Goldbacks to address India's rupee volatility", "summary": "Economists suggest that India could consider a gold-linked instrument like the 'Goldback' to stabilize the rupee and mobilize household gold stocks. Such an instrument would allow gold to be used as a medium of exchange, protecting savers from currency depreciation. This proposal aims to integrate India's gold holdings into the formal economy while reducing the need for imports.", "category": "Economy", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "88db9314"}, {"headline": "Caution advised on India-US trade deal negotiations", "summary": "Experts warn that India must avoid signing a lopsided trade deal with the US that offers limited reciprocal gains. The proposed framework includes concessions by India on agricultural imports and IT products, which could impact domestic sectors. Negotiators are urged to prioritize long-term economic sovereignty and protect sensitive industries during the final trade talks.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "add30e52"}, {"headline": "AI goal-seeking behavior can lead to chaotic outcomes", "summary": "A report warns that even well-intentioned AI systems can cause chaos if they pursue goals without adequate safeguards. Instances of AI agents acting outside their intended parameters have highlighted risks in automated systems. Experts call for greater transparency and monitoring of autonomous agents to prevent unintended consequences in critical infrastructure and finance.", "category": "Science", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "67c161c3"}, {"headline": "Tax data reveals high income skew in Indian economy", "summary": "Recent income tax data highlights a significant skew in India's income distribution, with a small percentage of taxpayers accounting for a large share of total income. The \"super affluent\" class, while tiny, has substantial spending power that drives the luxury market. This data suggests that high-growth groups have a high marginal propensity to consume, influencing business strategies.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "a5c85585"}, {"headline": "AI's impact on entry-level banking jobs raises concerns", "summary": "A Bloomberg report suggests that ChatGPT and other AI tools are reducing the number of entry-level roles at major investment banks. Firms like JPMorgan and Bank of America have seen a decline in junior staff as AI automates routine tasks. While some banks remain committed to hiring, the overall trend points toward a shift in early-career career paths within the financial sector.", "category": "Technology", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "973d1950"}, {"headline": "Strategies for getting co-workers to agree to requests", "summary": "Research indicates that people are more willing to agree to office requests than we often believe. Effective strategies include asking directly and in person, rather than relying on email. The study suggests that \"assuming a yes\" and providing a clear rationale can significantly improve cooperation. These insights aim to help professionals navigate workplace dynamics more effectively.", "category": "Business", "page": 14, "importance": 3, "telegram_url": "https://t.me/c/1877410077/141645", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20261026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/141645"}], "article_id": "fa9f7d37"}, {"headline": "Cybersecurity emerging as critical concern: PM", "summary": "Prime Minister Narendra Modi emphasized safeguarding financial institutions against cybercriminals and cyberterrorists, warning that the evolving nature of warfare makes cybersecurity a critical concern. He was speaking at the inauguration of RBI's data centre and Cybersecurity Training Institute in Bhubaneswar.", "category": "Technology", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/141592", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/141592"}], "article_id": "43a649cf"}, {"headline": "18 held, ₹100 crore traced in Northeast drug raids", "summary": "Enforcement agencies arrested 18 people and traced ₹100 crore in 'hawala' transactions in a crackdown on a narco-cartel operating across Assam, Mizoram, and Manipur. The operation targeted international drug trafficking routes along the India-Myanmar-Bangladesh border.", "category": "India", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/141592", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/141592"}], "article_id": "0ba434d4"}, {"headline": "Cong. demands Manipur CM resignation, fresh polls", "summary": "The Congress alleged failure to contain violence in Manipur, demanding the Chief Minister's resignation, fresh elections, and Union government intervention for peace. They cited recent killings and clashes and criticized the police's handling of protests.", "category": "Politics", "page": const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
