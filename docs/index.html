<title>Daily Brief — 23 September 2026</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

<script>
const DIGEST = {"date": "23 September 2026", "articles": [{"headline": "BJP set to gain Rajya Sabha seat in upcoming biennial elections", "summary": "The Election Commission announced biennial elections for 10 Rajya Sabha vacancies in Uttar Pradesh, one in Uttarakhand, and a bypoll in West Bengal on October 16. The BJP, currently holding 116 seats, is expected to gain one seat. The Samajwadi Party is projected to win two seats, while the Bahujan Samaj Party faces losing its entire presence in the Upper House.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "c6775192"}, {"headline": "Supreme Court asks Election Commission to clarify voter roll revision notices", "summary": "The Supreme Court directed the Election Commission to address voter concerns regarding 3.3 million notices issued during Delhi's Special Intensive Revision of electoral rolls. The court questioned if notices were sent mechanically and asked for clarity on 'logical discrepancies.' It emphasized that citizens should not face penal consequences for conscientious objections.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "9323bf39"}, {"headline": "Supreme Court orders Uttar Pradesh to replace Lakhimpur Kheri trial prosecutor", "summary": "The Supreme Court directed the Uttar Pradesh government to replace the public prosecutor in the 2021 Lakhimpur Kheri violence trial against Ashish Mishra. The decision followed reports that crucial witnesses were being dropped. While dismissing a plea to remove the presiding officer, the court asked the Allahabad High Court to t High Commissioner to New Delhi. Siam, a career diplomat who joined the service in 1995, will replace Riaz Hamidullah in the coming weeks. The move comes as both nations seek to reset bilateral relations following recent political transitions in Bangladesh.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "45b04df5"}, {"headline": "Teenager dies by suicide in Jhansi after alleged gang-rape and threats", "summary": "A 19-year-old woman died by suicide in Uttar Pradesh's Jhansi after being allegedly gang-raped by six people, including three minors. The victim's family claimed the suspects threatened to circulate a video of the crime. Police have apprehended five of the six accused and are investigating the circumstances leading to the woman's death on Tuesday morning.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "2f4a086c"}, {"headline": "Governance concerns raised over Tata Sons chairman's family ties with TVS", "summary": "Documents revealed that family members of Tata Sons chairman N. Chandrasekaran hold business relations with TVS Motor Co. Ltd. The relationship, involving a warehouse project, was reportedly not disclosed to the Tata Sons board or Tata Trusts. This revelation has deepened the rift within India's largest conglomerate as leadership performance remains under review.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "63877645"}, {"headline": "India joins EU and others to launch platform for multilateralism", "summary": "India joined the European Union, Australia, Brazil, and Canada to launch the 'Partners for Multilateralism, International Law, Peace and Prosperity' (P4M) platform. External Affairs Minister S. Jaishankar emphasized the need for participative deliberations and transparent decision-making at the UN General Assembly, noting that the global order is currently under stress.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "d12dd860"}, {"headline": "CPWD orders vacation of Shastri and Krishi Bhawans for new construction", "summary": "The Central Public Works Department (CPWD) directed government departments to hand over Shastri Bhawan and Krishi Bhawan by the end of September. The move paves the way for the construction of Kartavya Bhawan 4 and 5 in Central Delhi. The project, part of the Central Vista redevelopment, is estimated to cost approximately ₹3,155.41 crore.", "category": "Infrastructure", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "53db6f26"}, {"headline": "Environment Ministry extends validity of port project clearances to 20 years", "summary": "The Union Environment Ministry extended the validity of environmental clearances for ports, harbours, and dredging projects from 10 to 20 years. The move aims to improve the ease of doing business and rationalizes validity for projects with high gestation periods. This aligns port project clearance timelines with those currently granted to mining projects.", "category": "Environment", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "c05bb48c"}, {"headline": "India wins first gold medal at Asian Games in women's cricket", "summary": "The Indian women's cricket team clinched the nation's first gold medal at the Aichi-Nagoya Asian Games by defeating Sri Lanka by 147 runs in the final. Smriti Mandhana top-scored with 79, and Shafali Verma contributed 48 as India posted 216/3. Sri Lanka was bundled out for 69. This victory marks India's third consecutive major multi-nation final win over Sri Lanka.", "category": "Sports", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "e3cd309b"}, {"headline": "India narrowly defeats Japan by two runs in rain-curtailed T20I", "summary": "India secured a two-run victory over Japan in a rain-curtailed one-off T20 match reduced to five overs. India managed only 32/4 on a turning surface, but Axar Patel's disciplined bowling restricted Japan to 30. The narrow victory against the world's 41st-ranked team came in a historic encounter celebrating 75 years of diplomatic ties between the two nations.", "category": "Sports", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "38147c73"}, {"headline": "Trump confirms meeting between US and Iranian officials at UN", "summary": "President Donald Trump stated that US and Iranian officials met on Tuesday during the UN General Assembly. The meeting occurred shortly after Trump threatened to 'annihilate' Iran if a deal to end the seven-month war is not reached. While describing the meeting as 'very good,' Trump emphasized he has a major decision to make regarding the future of the conflict.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "b9b9c0d2"}, {"headline": "Data shows 53 student deaths at IITs over last five years", "summary": "Official data reveals that at least 53 students died across various IITs between 2020-21 and 2024-25. More than half of the deaths involved students from SC, ST, and OBC categories. The figures, which include 45 suicides, highlight concerns over academic pressure and mental health. The government has reminded institutions to report all such incidents immediately to the police.", "category": "Education", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "fe705749"}, {"headline": "Delhi government plans new think tank for state development plans", "summary": "The Delhi government prepared a cabinet note to establish the Delhi Institute for Transformation and Innovation (DITI). Modeled after the Centre's NITI Aayog, the think tank will frame long-term development plans, including a 'Vision Delhi 2047' document. The initiative aims to help the state government frame detailed development plans and promote innovation.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "6bd54808"}, {"headline": "NDMC introduces mandatory four-way waste segregation and steep fines", "summary": "The New Delhi Municipal Council (NDMC) framed new waste management bylaws for Lutyens' Delhi. The rules mandate four-way waste segregation at the source and impose steep fines for sanitation violations. The civic body is also reworking monthly user charges as part of efforts to modernize waste management and improve environmental standards in the area.", "category": "Infrastructure", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "7bafa5ae"}, {"headline": "India condemns Pakistani air strikes on Afghan border regions", "summary": "India criticized Pakistan's air strikes on Afghan border areas in Kunar and Paktika provinces, which resulted in civilian casualties. The Ministry of External Affairs termed the acts as 'aggression' that vitiates regional peace and security. The statement aligns with New Delhi's consistent stance of backing Kabul during flare-ups of regional tensions.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "6f987e6e"}, {"headline": "JPMorgan CEO urges US not to penalize India over Russian oil", "summary": "JPMorgan Chase & Co Chairman Jamie Dimon stated that the US should not punish India or global oil markets for purchasing Russian crude. In an interview, Dimon highlighted the technical challenges refiners face in switching supplies. He cautioned against disrupting global energy markets while attempting to pressure Russia to end its war in Ukraine.", "category": "Economy", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "f98ac3b8"}, {"headline": "Princess Diana's brother makes damning allegations against King Charles", "summary": "Charles Spencer, the Earl of Spencer, released a book titled 'Swan Song: Diana, My Sister,' accusing King Charles III of having 'contempt' for the late Princess. The book claims Charles was 'elated' after her death and argued against his sons walking behind the funeral procession. Buckingham Palace issued a rare response, suggesting grief may have clouded the Earl's memory.", "category": "Culture", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "0504627e"}, {"headline": "DGCA initiates financial and operational scrutiny of SpiceJet", "summary": "Civil Aviation Minister Ram Mohan Naidu announced that the DGCA is conducting operational and financial scrutiny of SpiceJet following frequent flight delays and cancellations. The airline's domestic market share fell to 1.6% in July. The government aims to ensure no lapses in safety while monitoring the airline's financial health and passenger service stability.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "25ba2df6"}, {"headline": "Angel One founder buys Juhu luxury tower for record ₹711 crore", "summary": "Dinesh Thakkar, founder of Angel One, purchased an eight-storey sea-facing tower in Mumbai's Juhu for ₹711 crore. The 63,000 square foot property represents the most expensive single residential unit purchase in India. The deal highlights the continued demand for luxury high-end real estate in Mumbai's upscale neighborhoods.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "5694f74d"}, {"headline": "India's Russian oil imports drop 16.5% as West Asian supplies rise", "summary": "India's share of Russian oil imports fell by 16.5% in August to 2.1 million barrels per day. The decline coincided with increased supplies from the Middle East, particularly the UAE. Refiners are tapping spot markets amid fears of potential US tariffs on Russian oil and geopolitical tensions in the Strait of Hormuz, though Russia remains India's top supplier.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "082ebd32"}, {"headline": "India rejects Pakistan's attempt to involve UNSC in Indus Waters dispute", "summary": "India dismissed Pakistan's effort to bring a Permanent Court of Arbitration ruling regarding the Indus Waters Treaty to the UN Security Council. New Delhi described the move as 'malicious propaganda' and reiterated that it does not recognize the 'illegally constituted' court in The Hague. India maintain its decision to hold the treaty in abeyance remains in force.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "e1d48a0e"}, {"headline": "Drought conditions affect 52.5% of India as monsoon ends", "summary": "The India Drought Monitor reports that 52.5% of the country is in a drought category due to a 15% rainfall deficit as the monsoon concludes. Maharashtra, Telangana, and Karnataka are severely affected, with soybean and paddy crops facing significant stress. While irrigation coverage has improved to 60%, farmers in rain-dependent regions expect lower yields.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "911556f9"}, {"headline": "CID investigation reveals massive question leak in KPSC recruitment", "summary": "A CID probe into Karnataka Public Service Commission veterinary officer recruitment found that 60 to 80 questions were leaked to candidates. Investigators traced a money trail of ₹1.52 crore and arrested several individuals, including a former controller of examinations. The High Court has ordered a fresh Special Investigation Team to conduct a de novo probe into the case.", "category": "Politics", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "d5c6cf6d"}, {"headline": "Karnataka Assembly unanimously rejects draft ESA notification for Western Ghats", "summary": "The Karnataka Assembly passed a resolution rejecting the Centre's proposal to declare 20,668 sq km of the Western Ghats as an Ecologically Sensitive Area (ESA). The state requested a one-year extension to conduct physical surveys and address livelihood concerns. The resolution opposes the 'unscientific' demarcation based on satellite data rather than survey numbers.", "category": "Environment", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "1706e8d0"}, {"headline": "Karnataka launches action plan to reduce population salt consumption", "summary": "Karnataka Health Minister U.T. Khader launched the 'State Multisectoral Action Plan for Salt Reduction' to promote healthier dietary habits. Indians consume 8-11 grams of salt daily, nearly double the WHO recommendation. A Technical Advisory Group will provide guidance on reducing salt intake to prevent non-communicable diseases like hypertension and cardiovascular issues.", "category": "Health", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "1e054bb8"}, {"headline": "Prime Minister unveils logo for birth centenary of Pejavara Swami", "summary": "Prime Minister Narendra Modi unveiled the logo for the birth centenary celebrations of the late Padma Vibhushan Sri Vishwesha Tirtha Swami of Udupi. Meeting with Sri Vishwaprasanna Tirtha Swamiji in New Delhi, the PM praised the late seer's life of devotion and service. Various initiatives are planned to carry forward his ideals during the upcoming centenary year.", "category": "Culture", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "0fdb2a4e"}, {"headline": "Supreme Court orders fresh SIT probe into Dharmasthala rape-murder", "summary": "The Supreme Court ordered a new Special Investigation Team to probe the 2012 Dharmasthala rape and murder case after DNA evidence revealed hair samples from unknown individuals on the victim's clothing. The court criticized previous investigations for failing to examine key witnesses. The new SIT, headed by a senior officer, has three months to complete the investigation.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "25148f93"}, {"headline": "Opposition claims Karnataka faces financial crisis alongside severe drought", "summary": "Leader of Opposition R. Ashoka alleged that Karnataka is suffering from a 'financial drought' as it exhausts its borrowing capacity while dealing with a natural drought. Ashoka claimed the state lacks funds for relief measures and that pending bills across departments stand at ₹36,136 crore. He criticized the government for failing to take precautionary relief measures.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "e7a1fcaf"}, {"headline": "Kerala government orders bribery inquiry against CM Vijayan and family", "summary": "The Kerala government ordered a police inquiry into allegations of bribery involving Leader of Opposition Pinarayi Vijayan, his daughter Veena T, and son-in-law P.A. Mohammed Riyas. The probe follows an Enforcement Directorate report alleging kickbacks from Cochin Minerals and Rutile Limited. The CPI(M) has alleged a political conspiracy between the Congress and BJP.", "category": "Politics", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "3eabf094"}, {"headline": "Former employee arrested in connection with granite baron's Pocso case", "summary": "Tamil Nadu police arrested a former employee of granite baron R. Veeramani for possessing a video showing the industrialist acting inappropriately with a minor. The suspect, Ganeshan, allegedly failed to report the video and was involved in property sales that helped Veeramani evade arrest. The arrest is part of a broader investigation into sexual crimes and financial transactions.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "bd000c2e"}, {"headline": "Man arrested for setting woman on fire at Tiruvallur hospital", "summary": "A 35-year-old man, Prakash, was arrested for allegedly throwing petrol on a 26-year-old woman and setting her ablaze at a government hospital in Tiruvallur, Tamil Nadu. The victim suffered 50% burn injuries. Prakash was apprehended after a police encounter in which he was shot in the leg. Authorities are investigating the motive behind the attack.", "category": "India", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "2e46d612"}, {"headline": "Tamil Nadu expands school breakfast scheme to benefit 1.5 million students", "summary": "Chief Minister C. Joseph Vijay launched the expanded 'Perunthalaivar Kamarajar Breakfast Scheme,' now covering students in Classes 6 to 8 in government schools. The initiative aims to benefit 1.53 million additional students across 15,454 schools with a total outlay of ₹724 crore. The launch included interactions with students and a breakfast event in Chennai.", "category": "Education", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "f98f1cb7"}, {"headline": "Hyderabad police hunt for man after girlfriend found dead in hotel", "summary": "Police in Hyderabad are searching for Srinivasa Ravi Teja, who allegedly absconded after bringing his girlfriend's body to a hospital. The couple had checked into a hotel in Madhapur where signs of injury and bloodstains were found. The victim, Sharon Nikhitha Topno, had head and face injuries. A murder case has been registered as police track the suspect's movements.", "category": "India", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "22062de6"}, {"headline": "Andhra Pradesh on high alert as Cyclone Arnab approaches coast", "summary": "The Andhra Pradesh government stepped up preparedness as a depression in the Bay of Bengal is expected to intensify into Cyclone Arnab. Heavy to very heavy rainfall and winds up to 60 kmph are predicted for north-coastal districts on September 24. Control rooms have been established, and schools in Srikakulam were closed as authorities prepare for potential landfall.", "category": "Environment", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "99c7b112"}, {"headline": "Prime Minister to chair brainstorming session with Union ministers", "summary": "Prime Minister Narendra Modi will chair a two-day 'Chintan Shivir' starting Wednesday to review the performance of Union ministries. The session will focus on assessing targets, outcomes, and strategizing for the remainder of the government's third term. Eight ministerial groups will present on themes like administrative success and communication to improve governance.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "8ab0ef10"}, {"headline": "Congress alleges BJP orchestrated attack on leaders during Assam bypoll", "summary": "The Congress party alleged that BJP workers attacked the convoy of senior leaders, including Bhupesh Baghel and Gaurav Gogoi, during a bypoll campaign in Nagaon, Assam. Stones and bottles were reportedly hurled at vehicles amid black-flag protests. Chief Minister Himanta Biswa Sarma dismissed the claims, calling it a clash between rival Congress factions.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "9720c2ca"}, {"headline": "Bombay High Court warns Vijay Mallya over social media posts", "summary": "The Bombay High Court cautioned businessman Vijay Mallya against sharing documents from his pending criminal case on social media. The warning came after the Enforcement Directorate objected to Mallya posting their court affidavit on X. The court is hearing Mallya's plea to close criminal proceedings and directed SBI to file a fresh affidavit in the matter.", "category": "Law", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "b35b78ff"}, {"headline": "Amit Shah sets 2029 deadline to eradicate drug trade in India", "summary": "Union Home Minister Amit Shah declared a target to eliminate the drug trade in India by December 31, 2029. Speaking at a conference of anti-narcotics task forces, Shah emphasized moving from 'meeting to mission' mode. He launched a Vision Document for 2026-29, which includes a roadmap for intelligence, investigation, and financial action against narcotics networks.", "category": "India", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "e5de2b1b"}, {"headline": "Allahabad High Court cautions retail chain over Santa cap mandate", "summary": "The Allahabad High Court observed that compelling employees of different faiths to wear Santa Claus caps at the workplace could hurt religious sentiments. The court warned a retail chain management in Agra after a supervisor allegedly forced subordinates to wear the caps. It emphasized that citizens in a democracy are free to follow their own faith and beliefs.", "category": "Law", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "5b2145b1"}, {"headline": "New governance framework under Article 371 proposed for Ladakh", "summary": "Ladakh Chief Secretary Ashish Kundra announced that a new governance model under Article 371 is being developed to provide specific constitutional safeguards for the Union Territory. The Home Ministry is scheduling meetings with local groups to discuss the model. The framework aims to address the administrative and political aspirations unique to the Ladakh region.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "2816de80"}, {"headline": "Fire in Adilabad hospital newborn unit kills three infants", "summary": "Three newborns died after a fire broke out in the Special Newborn Care Unit of the RIMS hospital in Adilabad, Telangana. The fire, allegedly caused by an air-conditioning unit explosion, affected 24 infants in the ward. While one baby died at the spot, two others succumbed during treatment. Chief Minister Revanth Reddy ordered an inquiry into the tragic incident.", "category": "Health", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "a6568d18"}, {"headline": "Man kills wife and two priests in Azamgarh shooting", "summary": "A man in Azamgarh, Uttar Pradesh, allegedly shot and killed his wife and two priests during a religious ceremony at his home. The suspect, Arvind Singh, reportedly opened fire after an argument regarding the priests' identification cards. Following the killings, Singh locked himself in a room with his children. Police are conducting rescue efforts and attempting to apprehend him.", "category": "India", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138254", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 23-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138254"}], "article_id": "2d876b97"}, {"headline": "Kazakh coach booked for allegedly raping minor cyclist at NIS Patiala", "summary": "A cycling coach from Kazakhstan was booked for the alleged rape of a 16-year-old national-level cyclist at the National Institute of Sports in Patiala. The incident reportedly occurred on September 13 in the coach's residential quarters. Police have seized the suspect's passport and issued a lookout circular after he fled the premises. Special teams are les": 59};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
