0, while Rawat secured a 4-2 win over Hrithik Jain. They are among 12 Indian players to progress in the tournament's third event.", "category": "Sports", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "76a7fc4e"}, {"headline": "Rohith Reddy strikes patient century for Karnataka in Vijay Merchant Trophy", "summary": "Karnataka captain Rohith Reddy scored a patient 113 off 136 balls against Uttarakhand in the Vijay Merchant Trophy. Reddy's innings, featuring 18 fours, helped Karnataka reach 284/7 at stumps on Day 2, trailing by just seven runs. Earlier, Ayush YS took three wickets as Uttarakhand were bowled out for 291.", "category": "Sports", "page": 15, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "3cebd41c"}, {"headline": "Graduates turn away from pharmacy field due to significant salary disparity", "summary": "Gen Z students are increasingly avoiding pharmaceutical sciences as entry-level salaries (Rs 25k-35k) fail to match education costs and ROI compared to tech fields (Rs 40k-50k). In Maharashtra, over 15,000 pharmacy seats remained vacant this year. Academicians call for curriculum updates and better clinical career paths to restore the field's appeal.", "category": "Education", "page": 20, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "5bc2c37c"}, {"headline": "UGC NET qualified candidates struggle for jobs despite faculty shortages", "summary": "Aspiring academics face significant uncertainty as permanent teaching positions in central universities remain vacant despite high UGC NET qualification rates. Shortages are particularly high at the professor level (54.4% vacant). Young researchers often rely on low-paid guest lecturer roles without job security, leading many to eventually leave higher education.", "category": "Education", "page": 20, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "c73c82b4"}, {"headline": "KSEAB to standardise First PUC question papers for uniform assessment", "summary": "The Karnataka School Examination and Assessment Board (KSEAB) will introduce common question papers for all First PUC exams starting February 2027. The move aims to eliminate regional and institutional disparities in difficulty levels and syllabus coverage. This standardized system will ensure transparent evaluation for students across 5,000 PU colleges.", "category": "Education", "page": 21, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "b28e802a"}, {"headline": "IGNOU moves to paperless assignments with new digital submission system", "summary": "Indira Gandhi National Open University (IGNOU) has launched the Online Assignment Management System (OAMS), allowing students to submit scanned handwritten assignments digitally. The platform aims to reduce paperwork and geographical barriers for the university's diverse student body. It also features digital audit trails to improve evaluation transparency.", "category": "Education", "page": 22, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "ed1ea939"}, {"headline": "NCTE to revise eligibility rules for integrated teacher education graduates", "summary": "The National Council for Teacher Education (NCTE) is revising eligibility rules to allow graduates of the Four-Year Integrated Teacher Education Programme (ITEP) to take the Central Teacher Eligibility Test (CTET). The revision aims to ensure career parity for ITEP students with traditional BEd graduates and align with the National Education Policy 2020.", "category": "Education", "page": 22, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "3908d0c7"}, {"headline": "CAG flags lapses in BIS gold hallmarking checks", "summary": "The CAG reported that the BIS failed to meet its surveillance audit target for 83% of the 2.3 lakh jewellers registered for gold hallmarking. The report highlights significant regulatory gaps and manpower constraints, potentially undermining consumer confidence in gold purity standards across India.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "f6c17f2e"}, {"headline": "Raymond bets big on aerospace as Singhania eyes next growth phase", "summary": "Raymond Group is sharpening its focus on the aerospace and defense sectors, targeting global supply chains. Chairman Gautam Singhania expects the aerospace business to grow significantly, leveraging engineering expertise to become a major international supplier for aero-engine and landing gear components.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "33feccbc"}, {"headline": "Consent manager portal under DPDP Act goes live", "summary": "The Ministry of Electronics and Information Technology has launched a consent manager framework under the Digital Personal Data Protection Act. While the portal is live, industry experts raise concerns regarding interoperability and the timeline for appointing Data Protection Board members.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "7d55fcd7"}, {"headline": "Historic Delhi monuments to host India Biennale galleries", "summary": "Historic sites in Delhi, including Purana Qila and the Red Fort, will host the 108-day India Biennale starting December 4. The event aims to transform heritage monuments into art galleries, showcasing local and international creative talent through public-private partnerships.", "category": "Culture", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "7e0a685a"}, {"headline": "Pakistan gets GI tag for Basmati rice from Türkiye", "summary": "Türkiye has granted a Geographical Indication tag for Basmati rice to Pakistan. While this impacts Indian branding in the region, officials believe it may help define international standards that could eventually benefit Indian exporters if they secure similar protections for their growing regions.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t re_BL_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "79785293"}, {"headline": "Standard Chartered remains overweight on Indian equity markets", "summary": "Standard Chartered maintains an 'overweight' stance on Indian equities, citing the country's relative resilience amid global market volatility. The bank expects Indian markets to benefit from domestic demand, though it remains neutral on global fixed income and equities.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "d4c5a231"}, {"headline": "IDBI employees’ body urges RBI to freeze Fairfax deal", "summary": "The IDBI Officers’ Association has requested the RBI to halt the proposed investment by Fairfax Financial Holdings until a full review of the disinvestment process is conducted. Concerns were raised regarding the structure of the acquisition and potential impact on employee rights.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "3a0c0f5a"}, {"headline": "Telangana CM seeks PM support for Tummidihetti barrage", "summary": "Telangana CM Revanth Reddy met PM Narendra Modi to seek support for the construction of the Tummidihetti barrage on the Pranhita river. The project is critical for providing irrigation and drinking water to backward districts in the state.", "category": "Infrastructure", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "56a18c1d"}, {"headline": "SEBI developing mechanism to thwart financial sector cyberattacks", "summary": "SEBI Chairperson Madhabi Puri Buch stated that the regulator is developing an evolving mechanism to protect the financial ecosystem from cyberattacks. New guidelines for the responsible use of AI and machine learning in financial markets are expected soon.", "category": "Technology", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "5f130ca9"}, {"headline": "China-plus-one strategy now an operational imperative: Gautam Singhania", "summary": "Raymond Chairman Gautam Singhania stated that the 'China plus one' strategy has evolved from a trend to an operational imperative for global manufacturers. He highlighted Raymond's expansion into aerospace and high-precision engineering as key long-term growth drivers.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "a03f5518"}, {"headline": "Ministries seek extension of RoDTEP and RoSCTL export schemes", "summary": "The Commerce and Textiles ministries are advocating for the extension of export incentive schemes like RoDTEP and RoSCTL. The move aims to provide stability to exporters and help achieve India's $1-trillion export target by 2030.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "2093bbca"}, {"headline": "FSSAI to introduce mandatory logo for dairy products", "summary": "The FSSAI is set to introduce a dedicated logo for milk and milk products to help consumers easily identify authentic dairy items. The regulation, focusing on quality and safety standards, will become mandatory from July 2028.", "category": "Health", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "4cbde844"}, {"headline": "Developed nations urged to fulfill climate finance commitments", "summary": "Discussions at COP31 in Türkiye highlighted the urgent need for developed nations to fulfill climate finance commitments. The UN reports that global temperatures are likely to exceed 1.5°C above pre-industrial levels, making adaptation funding critical for developing states.", "category": "Environment", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "3b0e7698"}, {"headline": "Opinion: The challenges of writing authentic political memoirs", "summary": "A commentary on political memoirs highlights the difficulty of achieving honesty in autobiographies. The piece examines how prominent figures often sanitize their histories, contrasting selective memoirs with more candid diaries and private records.", "category": "Culture", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "fac6495f"}, {"headline": "Microsoft network upgrade causes major global service outage", "summary": "A major outage affecting Microsoft 365 services, including Outlook and Teams, was attributed to an internal network capacity upgrade rather than a cyberattack. The failure raised questions about the resilience of critical digital infrastructure and corporate leadership accountability.", "category": "Technology", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "2971b875"}, {"headline": "Tenure extension dilemmas for heads of Indian financial institutions", "summary": "Recent leadership decisions in Indian Public Sector Undertakings (PSUs) have brought tenure extensions into focus. Officials face a dilemma between remaining in government-linked roles or moving to the private sector as their three-and-a-half-year terms conclude.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "77b3c001"}, {"headline": "New book diagnoses challenges to India's technological sovereignty", "summary": "A new book titled 'Uncertainty' diagnoses India's fragile tech sovereignty, arguing that the country remains dependent on global providers for critical financial and digital infrastructure despite the success of homegrown systems like UPI.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "a459256e"}, {"headline": "Review: Sonia Gandhi’s memoir focuses on personal and family life", "summary": "A review of Sonia Gandhi's memoir 'Belonging' notes that the book focuses heavily on her personal journey, love for her family, and the influence ies.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "b3a1494f"}, {"headline": "Campa Cola launches new 'Tayyari Big, Tyohar Bada' campaign", "summary": "Campa Cola has launched a new festive campaign titled 'Tayyari Big, Tyohar Bada', focusing on the energy and preparation behind Indian festivals. The campaign features humorous, slice-of-life moments of people preparing for celebrations like Dandiya and Diwali.", "category": "Business", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "8644b3a8"}, {"headline": "HP's Deepavali campaign highlights rural innovation and technology", "summary": "HP’s new Deepavali campaign showcases rural innovation, featuring solutions like a Braille device for visually impaired children and a fetal heartbeat monitor for pregnant women. The initiative aims to highlight how technology can improve lives at the community level.", "category": "Technology", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "73fede35"}, {"headline": "PharmEasy campaign promotes early detection of diabetes symptoms", "summary": "On World Diabetes Day, PharmEasy launched 'The Walking Sugar Cube' campaign to raise awareness about early signs of diabetes. The initiative uses eye-catching street marketing to encourage people to take timely health screenings.", "category": "Health", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "9c0c4fd8"}, {"headline": "COP31 summit focuses on turning climate promises into action", "summary": "The UN climate summit in Türkiye is grappling with the challenges of transitioning from climate promises to actual delivery. Key issues include securing $1.3 trillion in annual climate finance and reconciling disagreements between developed and developing nations.", "category": "Environment", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "d87f9e9e"}, {"headline": "UN Adaptation Fund awaits proceeds from carbon-credit sales", "summary": "The UN Adaptation Fund is awaiting the flow of proceeds from carbon-credit sales to finance climate-resilience projects in developing countries. Delays in operationalizing Article 6.4 of the Paris Agreement have stalled the availability of these critical funds.", "category": "Environment", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "ae3dda80"}, {"headline": "Renewable energy sector faces rising legal and regulatory disputes", "summary": "India's renewable energy sector is facing a surge in legal disputes related to tariff changes, habitat constraints, and land acquisition. Developers are seeking a more stable and predictable regulatory framework to protect long-term green energy investments.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "c1c15341"}, {"headline": "EU considers tariffs on solar imports to protect local manufacturing", "summary": "The European Union is considering tariffs on imported solar cells to support its local manufacturing industry. The move follows concerns that cheaper imports are undermining the EU's goal of building 30 GW of domestic solar production capacity by 2030.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "5b5b9f3e"}, {"headline": "Four more nations join COP31 climate implementation initiative", "summary": "Chile, Lebanon, Mexico, and Zambia have joined the COP31 Presidency’s Climate Implementation Bridge initiative. The platform aims to help countries translate climate commitments into investment-ready projects and accelerate the global green transition.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "ccbf6033"}, {"headline": "Pipavav port plans ₹17,000 crore expansion pending lease extension", "summary": "Gujarat Pipavav Port Ltd plans to invest ₹17,000 crore in expanding its infrastructure, including new berths and specialized cargo handling systems. The massive investment project is contingent on the extension of its 30-year operating lease by the state government.", "category": "Infrastructure", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "89cf1287"}, {"headline": "Indian ports transition to digital systems for smart logistics", "summary": "Major Indian ports are adopting digital technologies like AI, IoT, and cloud platforms to transition into 'smart ports.' These upgrades aim to improve cargo visibility, operational efficiency, and global supply chain integration across the country's maritime hubs.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "7e8d9d0d"}, {"headline": "Kochi Water Metro ridership hits 8-million passenger milestone", "summary": "The Kochi Water Metro has surpassed the 8-million passenger mark since its launch in April 2023. The eco-friendly transport system is expanding with new terminals and boats to improve urban connectivity across the city's backwaters.", "category": "Infrastructure", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "925dfeac"}, {"headline": "Cathay Group expands fleet with 14 additional Airbus aircraft", "summary": "The Cathay Group has ordered 14 more Airbus A330-900 and A321neo aircraft to support its long-term growth plans. The new fuel-efficient planes will enhance the airline's regional and long-haul network from its Hong Kong hub.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "86527a46"}, {"headline": "Vietnam launches e-mobility initiative for Ho Chi Minh City waterways", "s nt in healthcare regulation. He emphasized the need to curb high trade margins on medical devices and ensure strict adherence to food and drug safety standards.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "3e39a1d5"}, {"headline": "Early intervention critical for survival of preterm babies in India", "summary": "Health experts emphasize that early intervention and follow-up care are critical for the survival and long-term development of preterm babies. India accounts for a significant portion of global preterm births, requiring improved neonatal infrastructure and family support.", "category": "Health", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "de5e72d9"}, {"headline": "WHO launches global movement to promote science in health", "summary": "The WHO has launched a global movement involving over 240 organizations to promote the role of science in public health. The initiative aims to strengthen trust in scientific evidence and improve healthcare outcomes through international collaboration.", "category": "Science", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "35bcc075"}, {"headline": "Economic growth linked to improvements in national lung health", "summary": "Improving lung health is identified as a critical factor for India's economic growth. Respiratory diseases contribute significantly to lost workdays and reduced productivity, necessitating better air quality and improved access to respiratory healthcare.", "category": "Health", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "5aa5c6e2"}, {"headline": "MSF calls for use of available Ebola vaccines in DRC", "summary": "Médecins Sans Frontières (MSF) has called for the immediate use of available Ebola vaccines in the Democratic Republic of Congo following a new outbreak. The organization emphasized that existing vaccines are effective and should be deployed to prevent further spread.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "38e85efb"}, {"headline": "Maharashtra extends relief on aviation fuel VAT until April 2027", "summary": "The Maharashtra government has extended the 7% Value Added Tax (VAT) on aviation turbine fuel (ATF) until April 14, 2027. The move is intended to help airlines stabilize fares and manage rising operational costs amid high global fuel prices.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "c48c38b0"}, {"headline": "Maruti Suzuki surpasses 2025 export targets ahead of schedule", "summary": "Maruti Suzuki India has surpassed its export target for the 2025 calendar year two months early, exporting over 4.15 lakh units by October. Strong demand in markets like Africa, Latin America, and the Middle East drove the record growth.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "98b9a22d"}, {"headline": "Titan targets buyer growth with affordable gold jewelry segments", "summary": "Titan Company is focusing on entry-level gold jewelry products to attract price-sensitive buyers amid volatile global gold prices. The company aims to sustain growth by expanding its customer base through its Mia and Tanishq sub-brands.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "75e55538"}, {"headline": "Legal challenge seeks GST reduction on air purifiers to 5%", "summary": "A legal challenge has been filed in the Delhi High Court seeking a reduction in the 18% GST rate on air purifiers. Petitioners argue that air purifiers should be treated as essential health devices rather than luxury items given severe air pollution levels.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "92483f0c"}, {"headline": "Private equity funding boosts Indian aerospace manufacturing sector", "summary": "Private equity funding is providing a significant boost to India's aerospace manufacturing sector, helping local suppliers expand capacity and integrate into global supply chains. This capital influx is seen as a key driver for the industry's next growth phase.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143665", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "article_id": "5d9be697"}, {"headline": "India GDP Growth Seen at 7.7% for Q2 FY27", "summary": "Economists in an ET poll estimate India's economy grew 7.7% in the second quarter of FY27. Growth is driven by resilient domestic consumption, manufacturing activity, and an increase in exports despite global geopolitical tensions and high crude prices. The full-year growth is projected to stay on track at 7.3%.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "b20a259b"}, {"headline": "India Inc Logs 26% Rise in Q2 Net Profits", "summary": "Analysis of 3,568 listed companies shows aggregate net profits grew 26.2% in the September quarter, compared to 15.3% last year. Revenue rose 22.6% over a low base. The performance was anchored by the automobile, financial services, oil and gas, and metals industries, while FMCG and pharmaceutical sectors showed relatively slower growth.", "category": "Business", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "f30b3af7"}, {"headline": "Centre Flags Governance Gaps in State AI and Digital Services", "summary": "The Union government has identified gaps in how states manage AI, geospatial, and microbiome technologies. A high-level note sent to chief secretaries warns that missing data standards, fragmented datasets, and weak institutional ownership are hindering modern technology adoption and citizen service delivery across the country.", "category": "Technology", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "9dbfed78"}, {"headline": "Quad Leaders to Discuss Critical Minerals and Energy Supply Chains", "summary": "The upcoming Quad summit in Manila will focus on securing critical mineral supply chains and safeguarding energy shipping lanes. Prime Minister Modi and US President Trump are expected to meet during the event. Discussions will cover the Critical Minerals Initiative Framework to support the development of advanced technologies and industrial bases.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "51bed2e5"}, {"headline": "D2C Brands Weigh Price Hikes Amid Soaring Input Costs", "summary": "Direct-to-consumer brands are considering price increases as rising crude oil prices push up raw material and packaging costs. Plastic input costs have surged 30-40%, squeezing margins. While major FMCG firms are currently absorbing costs to protect sales volume, many D2C players have already implemented hikes of up to 15%.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "01a9b9bc"}, {"headline": "Invest India Chief Urges Full Ecosystem Approach for Semiconductors", "summary": "Invest India MD Nivruti Rai stated that India must look beyond building fabs to develop a complete semiconductor ecosystem, including equipment and materials suppliers. The agency is targeting global companies for memory manufacturing and advanced packaging to reduce reliance on imports and secure global supply chain positions.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "b70d5cfc"}, {"headline": "Microdrama Apps Overtake Traditional Streaming in Downloads", "summary": "Microdrama apps recorded 429 million downloads in the first nine months of 2026, surpassing traditional OTT platforms. However, low user retention and high acquisition costs are testing the business model. Standalone apps like Story TV lead in downloads but see only 1% of users returning after 30 days compared to higher retention for major OTTs.", "category": "Technology", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "53d7c910"}, {"headline": "UpGrad Hires Consulting Veterans to Lead 1,000 Crore Expansion", "summary": "Edtech firm UpGrad has appointed former partners from Deloitte and EY to establish a corporate advisory practice. The move aims to revive growth in its enterprise business and triple revenue over the next three years. This expansion is part of a strategy leading toward a planned initial public offering in late 2028.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "49742408"}, {"headline": "Uber Data Breach Linked to Vendor Exposes Driver Information", "summary": "Uber Technologies has disclosed a security incident involving third-party vendor Fireworks AI. An unauthorized party gained access to credentials to view Uber-related data, including personal information of drivers. The company has severed connections with the vendor and launched an investigation into the extent of the exposure.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "5ac750b8"}, {"headline": "Organic Revenue Growth Stalls for Top Indian IT Firms", "summary": "Major Indian IT services providers reported weak organic revenue growth in the second quarter. Tech Mahindra and LTIMindtree performed best, while Wipro and Infosys saw declines. Experts suggest that overall growth is becoming increasingly dependent on acquisitions rather than core demand, which may be unsustainable without market recovery.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "a9d13313"}, {"headline": "Fusion CX Targets Global Expansion Through AI and Acquisitions", "summary": "Customer experience firm Fusion CX is pursuing both small and large acquisitions to expand its geographical footprint and AI capabilities. The company recently acquired German group Impacx for 2 million euros. It is also shifting toward outcome-based pricing models enabled by AI to improve productivity and market share.", "category": "Business", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "3c2f1af9"}, {"headline": "Italy Fines Meta 880 Million Dollars Over Photo Privacy", "summary": "Italian regulators have fined Meta 805 million euros for accessing users' photos and videos through the Facebook Android app without specific consent. The authority ruled that the company failed to properly inform users or obtain necessary permissions, representing one of the largest data privacy fines in Italian history.", "category": "Law", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "27061e07"}, {"headline": "Peak Repo Rate Pegged Lower at 6% as Inflation Eases", "summary": "Economists have lowered the expected terminal repo rate to 6%, down from previous projections of 6.25%. While a 25-basis point hike is still expected in December following a rise in retail inflation to 6.09%, the overall cycle is anticipated to be shallower due to softening global oil prices and cooling geopolitical tensions.", "category": "Economy", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "357672cb"}, {"headline": "Banks Propose Yield-Based Accounting to Soften Bond Losses", "summary": "Indian lenders are asking the RBI to allow a yield-based accounting method for 'held to maturity' bonds ahead of new 2027 valuation rules. The proposal aims to protect banks' capital reserves from mark-to-market losses caused by rising interest rates, which could otherwise significantly shrink tier-one capital and lending ability.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "c10501a8"}, {"headline": "Foreign Portfolio Inflows Into India Hit Five Year High", "summary": "FPIs pumped $7.5 billion into Indian equities in the first 10 sessions of November, the highest monthly inflow since 2020. The surge is attributed to global portfolio rotation away from AI stocks, falling crude oil prices, and stabilizing rupee value. This buying has restored India to the fifth spot in global market rankings.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "2edadee6"}, {"headline": "PM Says 50 Crore People Moved Above Poverty Line", "summary": "Prime Minister Modi stated that 50 crore Indians have escaped extreme poverty in the last 12 years. Speaking on Birsa Munda’s birth anniversary, he highlighted that the upliftment of tribal communities was a key factor. He also noted that the country is becoming free from Naxalism and Maoist terror, allowing development to reach remote areas.", "category": "India", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "431ea127"}, {"headline": "Bangladesh Delays Posting of New High Commissioner to India", "summary": "Bangladesh has further delayed the arrival of Asad Alam Siam as its new envoy to India, raising concerns about bilateral ties. The delay coincides with uncertainty regarding the renewal of the Ganges Water Sharing Treaty, which expires in December. Diplomatic sources indicate India will not automatically renew the pact without a high-level visit.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "98158422"}, {"headline": "Indigenous Weapons Must Deliver Highest Reliability Says Rajnath Singh", "summary": "Defense Minister Rajnath Singh emphasized that locally developed military platforms must match global performance and reliability standards. He called for a whole-of-ecosystem approach to achieve strategic self-reliance, urging increased investment in research and software to help Indian defense technology compete in international markets.", "category": "India", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "72b7d7f4"}, {"headline": "Election Commission Clarifies No Prosecution for Re-Enrolling Voters", "summary": "The Election Commission of India informed the Supreme Court that voters whose names are missing from draft rolls can apply afresh via Form 6 without fear of prosecution. This clarification follows suggestions to reach out to voters categorized as absent, shifted, or dead to ensure a more inclusive and accurate electoral roll.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "d1afd5d9"}, {"headline": "North and South Blocks to Become World Largest Museum", "summary": "The Union Cabinet approved the 3,230 crore transformation of the historic North and South Blocks into the Yuge Yugeen Bharat Museum. Set to open between 2027 and 2030, it will feature 30 galleries showcasing India’s civilizational journey. The project uses AR and VR for interactive storytelling across 1 lakh square meters of space.", "category": "Culture", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "5865a0e8"}, {"headline": "Karnataka to Pursue Mekedatu Project Despite Tamil Nadu Objections", "summary": "Karnataka CM Siddaramaiah stated the state will continue pursuing the Mekedatu reservoir project within the legal framework and seek central clearances. While Tamil Nadu farmers and leaders have protested against the dam, Karnataka maintains it has the right to build the structure to supply water while ensuring Tamil Nadu's entitled share.", "category": "India", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "53a1dcab"}, {"headline": "Ladakh Protests Continue as Centre Signals December Dialogue", "summary": "The hunger strike in Leh entered its fourth day as leaders demand statehood and constitutional safeguards. While the Centre has informally suggested resuming talks in December after local council elections, protest leaders insist on a formal communication and will continue their agitation until their specific demands are addressed.", "category": "India", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "6460fbc4"}, {"headline": "West Bengal Considers Land Pooling Model for Industrial Investment", "summary": "The West Bengal government is exploring a land pooling model to attract industrial investment. Under the plan, 20-25% of developed land would be returned to owners instead of simple monetary compensation. This aims to overcome challenges posed by high population density and fragmented land ownership that hinder large-scale acquisition.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "245a5a26"}, {"headline": "Gauhati High Court Notes 1.16 Lakh Declared Foreigners at Large", "summary": "The Gauhati High Court expressed concern that over 1.16 lakh individuals declared as foreign nationals in Assam have not been apprehended or expelled. Describing the situation as a 'grim picture,' the court made the observation based on state affidavits while dismissing a petition regarding the expulsion process.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "dae12af6"}, {"headline": "ED Summons TVK Leader Vijayabaskar in Assets Case", "summary": "The Enforcement Directorate has summoned TVK leader Vijayabaskar and his wife for questioning regarding a 35.79 crore assets case. The money laundering probe relates to wealth allegedly accumulated during his tenure as a minister in the previous AIADMK government. The leader has been asked to appear before the agency this week.", "category": "Law", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "3f87bd75"}, {"headline": "Electronics Sales Grow Twice as Fast in Non-Metro Towns", "summary": "A study by Croma and Kearney reveals that consumer electronics sales in non-metro markets are growing at 7.4%, nearly double the 3.8% rate of big cities. Improved electricity access and rising aspirations in tier-3 towns are driving demand for smart devices and premium appliances, with some small towns outperforming state capitals.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "058de483"}, {"headline": "Electric Vehicle Sales Surge 69% During Festive Period", "summary": "While the broader passenger vehicle market retailed 7.2% fewer cars this festive season, electric vehicle sales jumped 69% to 40,122 units. Tata Motors and Mahindra together accounted for 80% of these sales. Petrol car deliveries fell 14.5%, signaling a significant shift in consumer preference toward cleaner fuel options.", "category": "Business", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "3ef92cfc"}, {"headline": "JSW Motors Partners with 50 Global Firms for New SUV", "summary": "Sajjan Jindal-led JSW Motors is collaborating with over 50 domestic and global suppliers for its first plug-in hybrid SUV, launching next month. Partners include Motheron, Bridgestone, and Tata Elxsi. The company aims for high localization while utilizing a proven global platform and secure Indian-hosted cloud servers for connected features.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "21b9123e"}, {"headline": "ICC Announces Major Men’s Cricket Calendar Through 2035", "summary": "The International Cricket Council has approved a schedule of 12 major events, including India hosting the 2029 Champions Trophy and co-hosting the 2031 ODI World Cup. The calendar also confirms the return of cricket to the Olympics at Los Angeles 2028 and provides long-term visibility for player pathways and performance programs.", "category": "Sports", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "db8e101e"}, {"headline": "HDFC Capital Exits HoABL Projects with 1,100 Crore Realization", "summary": "HDFC Capital has realized over 1,100 crore from its investment in projects by the House of Abhinandan Lodha. The exit was achieved ahead of schedule due to strong cash flows from early project deliveries. The partnership continues to invest in other developments across tier-2 cities and emerging residential markets.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "849da119"}, {"headline": "Manufacturing and Logistics Boost India Warehousing Demand", "summary": "Third-party logistics and manufacturing firms now account for 76% of Indian warehousing leasing activity. Demand is shifting toward Grade A facilities and spreading beyond traditional industrial hubs to eight key markets. Bengaluru saw record 98% growth in leasing driven by manufacturing demand and modern stock availability.", "category": "Infrastructure", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "b9edd0dc"}, {"headline": "Hotel Chains Forecast Strong Q3 Growth Despite Dipping November", "summary": "The hotel industry expects 10-15% revenue growth in the October-December quarter despite a slow start in early November due to Diwali. Strong demand from weddings, leisure travel, and corporate events is expected to drive higher room rates and occupancy through December, particularly in hubs like Hyderabad and Delhi-NCR.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "6a0c28e9"}, {"headline": "India to Play Key Facilitator Role in COP31 Mitigation Talks", "summary": "India’s environment minister Bhupender Yadav has been appointed as a ministerial facilitator for mitigation negotiations at COP31. He will work with Germany to build consensus on emissions reduction and transitioning away from fossil fuels. India’s stance on 'phasing down' coal versus 'phasing out' fossil fuels remains a critical point of interest.", "category": "Environment", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "025ea496"}, {"headline": "Niti Aayog Plans Blueprint to Ramp Up Gold Mining", "summary": "Niti Aayog is preparing a policy framework to strengthen domestic gold exploration and mining to reduce high import bills. India’s gold imports reached $71.98 billion in 2025-26. The blueprint aims to streamline regulatory approvals, improve geological data reporting, and provide fiscal incentives to attract private investment in the sector.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "188c519b"}, {"headline": "RBI Mandates 6-Hour Reporting for Payment System Incidents", "summary": "The Reserve Bank of India has issued guidelines requiring non-bank payment system operators to report cyberattacks and system outages within six hours. The directive is intended to enable quicker regulatory intervention and better monitoring of threats in the payments ecosystem to curb digital fraud and secure financial infrastructure.", "category": "Technology", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "5652bb56"}, {"headline": "Finance Ministry Weighs Uniform Customs Rules for Battery Projects", "summary": "The finance ministry is considering a uniform approach for battery storage projects to defer customs duty and GST on imported equipment. Currently, inconsistent rules across states add a 31% upfront tax burden. A clear policy would reduce capital requirements for green energy projects and remove pricing uncertainties for developers.", "category": "Economy", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "acc8605e"}, {"headline": "Piyush Goyal Says Egypt to be India Gateway to Africa", "summary": "Commerce Minister Piyush Goyal stated that bilateral trade between India and Egypt, currently at $6.5 billion, has significant room for growth. On a visit to Cairo, he highlighted potential for investments in food processing and education. Egypt is positioned as a strategic gateway for Indian businesses to access the wider African market.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "505faa9b"}, {"headline": "IMAX Executive Says Indian Films Finding Global Audiences", "summary": "Indian films are increasingly appealing to non-diaspora audiences worldwide due to improved production values and global marketing. The IMAX opening for 'Ramayana' crossed $6 million globally. Upcoming high-budget projects like 'Varanasi' by SS Rajamouli are expected to further the trend of Indian cinema becoming a global phenomenon.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "0d807862"}, {"headline": "Global Supply Chains Need Six Months to Normalise After Conflict", "summary": "DHL Global Forwarding CEO Tobias Maier warned that global supply chains could take three to six months to return to normal even after West Asian shipping disruptions ease. Container shortages and port congestion continue to strain logistics, with India-Europe trade being among the most affected routes due to regional instability.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "1fdc91d2"}, {"headline": "Big Four Accounting Firms See Dealmaking Boom in India", "summary": "Deloitte, PwC, EY, and KPMG have expanded their Indian dealmaking platforms to handle a surge in M&A, IPOs, and private equity transactions. Revenue from these services crossed 10,000 crore last fiscal year. EY India now has the largest deals business in its global network by headcount, reflecting India's status as a top global deal hub.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "70394517"}, {"headline": "Sun Pharma Seeks 4 Billion Dollar Loan for Refinancing", "summary": "Sun Pharmaceutical Industries is in talks with a consortium of five banks for a $4 billion syndicated loan. The funds will refinance bridge financing used for its $11.75 billion acquisition of US-based healthcare firm Organon. The loan is expected to have a five-year tenor with interest margins linked to international benchmarks.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "7de7056c"}, {"headline": "Tata Motors PV Faces Profitability Pressure Despite Sales Record", "summary": "Tata Motors' passenger vehicle business reported record volumes in the September quarter, yet profitability remains under pressure from high commodity costs. While the domestic SUV and EV segments are growing, the Jaguar Land Rover (JLR) unit faces challenges in China and rising marketing spends, leading to a downgrade in global margin guidance.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "ffeb0b77"}, {"headline": "Lenders Shift to Secured Credit as Gold Loans Surge", "summary": "The Indian credit market is tilting toward secured lending, with gold loans growing by 60% as lenders look to manage risk. Borrowers are increasingly choosing gold loans over personal loans for speed and lower interest rates. Despite the rapid growth, experts say repayment trends remain resilient with only minor increases in overdues.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143661", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143661"}], "article_id": "5547dde4"}, {"headline": "Iran Guards Drone Attack U.S. Radar in Bahrain", "summary": "Iran's Revolutionary Guards launched 6 drones at a U.S. air defence radar system at Bahrain's Al-Riffa helicopter base, marking the second strike in three days. Bahrain intercepted the drones, which caused sirens and shelter warnings. The IRGC claimed targets were hit, warned on the Strait of Hormuz, and Iran still seeks US talks despite the aggression.", "category": "World", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143672"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 9, "article_id": "92847b80"}, {"headline": "Yemeni Forces Retreat From Strategic Bab el-Mandeb Strait", "summary": "Saudi-backed Yemeni government forces withdrew from the Bab el-Mandeb Strait coast, a vital shipping link, after Houthi advances. This major setback allows Houthis to control key coastline, threatening global oil exports and increasing risk of attacks, with redeployment aimed at securing Aden.", "category": "World", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143711"}], "importance": 8, "article_id": "d40b7811"}, {"headline": "Amit Shah Slams Rahul Gandhi for Anti-India Remarks", "summary": "Union Home Minister Amit Shah criticized Rahul Gandhi for \"anti-India remarks\" at a global summit in Hyderabad, calling it defaming. Shah, speaking in Pune, stated this won't help Congress, advised Gandhi to visit villages, and highlighted Modi's corruption-free tenure. Police also detained Congress workers in Pune.", "category": "Politics", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 7, "article_id": "f4b28f29"}, {"headline": "India's Health Spending Triples, Out-of-Pocket Costs Drop", "summary": "India's public health spending nearly tripled from ₹1.30 lakh crore (2013-14) to ₹4.14 lakh crore (2023-24). National Health Accounts estimates show household out-of-pocket expenditure dropped from 64.2% to 42.7% in the decade, reflecting improved financial protection and expanded government schemes.", "category": "Health", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "importance": 7, "article_id": "7b714302"}, {"headline": "CRPF Battalion Shifts from Anti-Naxal Duty to Manipur", "summary": "The CRPF de-inducted a battalion of over 1,000 personnel from anti-Naxal operations in Sukma, Chhattisgarh, following the government's declaration of Naxalism's end in March 2026. This first major shift from the LWE theatre sends the unit to Manipur for internal security duties, addressing ongoing challenges.", "category": "India", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 7, "article_id": "62a79a2d"}, {"headline": "Lalit Modi Acquires British Citizenship, Complicates Extradition", "summary": "IPL founder Lalit Modi, who left India in 2010 amidst financial investigations for alleged money laundering since 2009, announced acquiring British citizenship on September 20. This automatic loss of Indian citizenship and new UK/Vanuatu passports complicates India's extradition efforts and ongoing Enforcement Directorate cases, despite Modi claiming no active cases.", "category": "Law", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 8, "article_id": "54c6ed4f"}, {"headline": "FPIs Pump ₹84,290 Crore into Indian Equities in Early November", "summary": "Foreign Portfolio Investors (FPIs) pumped ₹84,290 crore into Indian equities in the first half of November, marking a strong return after two months of net outflows. This surge, attributed to attractive large-cap valuations, falling crude prices, and a global shift from AI stocks, surpasses previous quarterly averages and recovers from October's ₹34,843 crore withdrawal.", "category": "Economy", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143690"}], "importance": 8, "article_id": "98b12f15"}, {"headline": "SpaceX Achieves Historic Starship Booster Catch for Reusability", "summary": "Elon Musk's SpaceX achieved a historic first-ever 'catch' of a Starship booster using mechanical 'chopstick' arms at its Texas Starbase. This 15th test flight marks a major technical milestone for fully reusable spaceflight, demonstrating components recovery to significantly lower launch costs and enabling affordable space travel. NASA eyes Starship for Artemis lunar missions.", "category": "Technology", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143672"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 10, "article_id": "92bfb33a"}, {"headline": "India Clinches ODI Series in New Zealand 3-1", "summary": "India defeated New Zealand by 22 runs in Mount Maunganui, clinching the ODI series 3-1 and ending New Zealand's seven-year unbeaten home run. Arshdeep Singh (3/30) and the pace attack, alongside Axar Patel's 46 runs and 2 wickets, defended 209/210. Gurnoor Brar took 9 wickets in 3 games, while Shreyas Iyer led after Rohit Sharma's struggle.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "importance": 8, "article_id": "957695a7"}, {"headline": "Lakshya Sen Wins Kumamoto Masters Japan, Second Straight Title", "summary": "Indian shuttler Lakshya Sen won his second consecutive BWF World Tour Super 500 title at the Kumamoto Masters Japan, defeating Koki Watanabe 13-21, 21-18, 21-14 in the $500,000 final. This victory earned 9,200 points, propelling Sen from World No. 12 to No. 6 in rankings, virtually guaranteeing a spot in the Hangzhou World Tour Finals.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143722"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143661"}], "importance": 7, "article_id": "c6085112"}, {"headline": "India to Host 2029 Champions Trophy, Co-host 2031 World Cup", "summary": "The ICC approved major event windows through 2035, confirming India will host the 2029 Champions Trophy (Oct 9-28) and co-host the 2031 ODI World Cup with Bangladesh (Oct-Nov). This marks India's first Champions Trophy since 2006. Australia and New Zealand will host the 2028 T20 World Cup.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 8, "article_id": "58738a74"}, {"headline": "PM Modi Blames Past Govts for Neglecting Tribals, Naxal Violence", "summary": "PM Narendra Modi, at Gadchiroli's Janjatiya Gaurav Diwas, accused past governments of neglecting tribal communities and being \"mute spectators\" to Naxal violence, which denied tribals voting rights. He highlighted India's success in eradicating Naxalism and moving 500 million people out of poverty in 13 years, citing a World Bank report.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143690"}], "importance": 8, "article_id": "ac55bd3e"}, {"headline": "Iran Drones Bahrain Air Base While Seeking US Talks", "summary": "Iran's Revolutionary Guard Corps launched six drones at Bahrain's Riffa helicopter base in a direct strike, calling it a response to US military aggression. Despite Bahrain's interception claim and rising Strait of Hormuz tensions, Iran reiterated that a path to ending the conflict with the United States remains open.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143690"}], "importance": 8, "article_id": "fbf687e7"}, {"headline": "Parliament Winter Session Likely December, Focus on Women's Reservation", "summary": "Parliament's Winter Session is expected to begin in the first week of December, possibly Dec 4-22. Key priorities include a Constitution amendment bill for delimitation and 33% women's reservation, potentially expanding the Lok Sabha to 850 seats. The session, requiring significant consensus for this major legislation, comes amid electoral roll tension.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143672"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143661"}], "importance": 8, "article_id": "1ccf682c"}, {"headline": "US FAA Begins Five-Day Safety Audit of Indian Aviation", "summary": "The US Federal Aviation Administration (FAA) began a five-day safety audit of India's aviation oversight system on November 16. The team will evaluate the Directorate General of Civil Aviation (DGCA) on airworthiness, personnel licensing, and aircraft operations. India, holding Category 1 status allowing US flight operations, aims to maintain ICAO compliance.", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143672"}], "importance": 7, "article_id": "fe891637"}, {"headline": "Prince William, Kate to Visit India for Earthshot Prize", "summary": "Prince William and Princess Kate are scheduled for a three-day visit to India this week, attending the Earthshot Prize awards ceremony in Mumbai. The high-profile trip, Kate's first overseas since cancer treatment, includes meeting PM Narendra Modi in Delhi and engaging with Indian business leaders on sustainability and youth leadership.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "importance": 5, "article_id": "07347bd8"}, {"headline": "Air India Restores Non-stop US Flights Via Reopened Iraqi Airspace", "summary": "Air India has restored non-stop flight services on all four routes between India and New York, cutting travel time by up to five hours. This follows the reopening of Iraqi airspace and resolves previous issues forcing longer routes and refueling stops in Rome. The change is expected to save 10% in fuel costs and ease crew duty.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143665"}], "importance": 5, "article_id": "11f2aa7d"}, {"headline": "US Seeks 24-Year Prison Term for Nikhil Gupta in Assassination Plot", "summary": "US federal prosecutors requested a 24-year (293-month) prison sentence for Indian national Nikhil Gupta for his role in an alleged plot to assassinate pro-Khalistan separatist Gurpatwant Singh Pannun, a designated terrorist. Despite Gupta's guilty plea and remorse, prosecutors seek a severe penalty to deter planning murder on foreign soil, while his lawyers argue for leniency due to alcoholism.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 8, "article_id": "aa3a431d"}, {"headline": "West Bengal: Criminal with 36 Cases Killed in Police Encounter", "summary": "Ratan Sheikh, a 31-year-old criminal accused in 36 cases, was killed in a police encounter in West Bengal's Birbhum district after allegedly firing at a constable. The incident occurred during a manhunt ordered by CM Suvendu Adhikari, following Sheikh's shooting of an officer on November 13. This marks the state's fifth encounter death since May.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "importance": 4, "article_id": "d282d0b1"}, {"headline": "Jio Platforms Plans Satellite Internet, Eyes Domestic Launch Partners", "summary": "Jio Platforms is discussing with ISRO and Skyroot Aerospace to launch 1,600 low-earth orbit satellites for its upcoming internet services. While SpaceX remains a potential partner, Jio aims to build a domestic value chain for satellite design, deployment, and operations, with an initial 390-satellite deployment targeting high-speed broadband in remote regions.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143711"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143672"}], "importance": 9, "article_id": "a088e185"}, {"headline": "Hindalco's Novelis to Sell Chinese Units for $265 Million", "summary": "Hindalco-owned Novelis agreed to sell two Chinese subsidiaries, including production and trading units, to Shenzhen Hongzhi Industrial Investment for $265 million, plus a potential $10 million earn-out. This strategic portfolio adjustment, expected to close within 12 months, follows disruptions at US units and a CFO departure. Business Line estimates the deal at $300 million for Changzhou facilities.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 14, "telegram_url": "https
