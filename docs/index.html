*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }

.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

 of others missing in several damaged hydropower sites.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "3d1701eb"}, {"headline": "IndiGo aircraft hits guidance pole at Srinagar airport; no injuries reported", "summary": "An IndiGo flight from Navi Mumbai to Srinagar collided with a Docking Guidance System pole while taxiing into its parking spot at Srinagar International Airport. Officials confirmed that all passengers and crew members are safe with no injuries reported. The incident caused minor damage to the airport infrastructure during the parking process on Friday morning.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "cefdc7ae"}, {"headline": "Delhi Arts Commission approves Manmohan Singh memorial at Rashtriya Smriti Sthal", "summary": "The Delhi Urban Arts Commission has approved a proposal for a memorial dedicated to former PM Manmohan Singh. The commission directed that the architecture and landscaping must match the existing character of Rajghat. Authorities were told to ensure accessibility and use specific materials, and any significant design changes must be submitted for prior approval before execution.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "f6867e51"}, {"headline": "Delhi Police detain content creator for assault after political protests", "summary": "Delhi Police detained 21-year-old Swatantra Bhardwaj for allegedly injuring a man during a June protest at Jantar Mantar. The detention followed a protest by the Cockroach Janta Party. The victim, Sanjay Azad, suffered head injuries. Bhardwaj claimed he acted in self-defence and previously boasted of political ties. Police added SC/ST Act and POCSO sections following the incident.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "713588d8"}, {"headline": "National wrestler and children die in Maharashtra gorge jump incident", "summary": "A 30-year-level wrestler and her two children died after jumping into a gorge in Dharashiv district, Maharashtra. One child survived with serious injuries and is under treatment. Police have booked the woman's husband and three in-laws for abetment of suicide and dowry harassment. The victim had reportedly been living with her parents following domestic disputes over money and gold.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "3a4708e6"}, {"headline": "Supreme Court rules heavy caseload no excuse for unreasoned judicial orders", "summary": "The Supreme Court set aside an Allahabad High Court order, ruling that brevity cannot replace legal reasoning. The bench stated that judicial orders must demonstrate an application of mind to the facts. The case involved an HC order that failed to explain why six people were summoned for trial. The SC emphasized that reasons are essential for the unsuccessful party to challenge a verdict.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "dd4dbdeb"}, {"headline": "RBI to conduct Rs 7 trillion auction to drain excess cash", "summary": "The Reserve Bank of India will hold a 30-day variable-rate reverse repo auction on Monday to manage a record Rs 10.5 trillion liquidity glut. The excess cash resulted from the RBI exchanging dollars from overseas Indians for rupees. The longer 30-day tenor aims to lock up banking cash for an extended period to curb inflationary pressures in the economy.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "57df730b"}, {"headline": "Heavy rains flood IGI Airport and trigger NCR traffic chaos", "summary": "Sudden downpours left parts of Indira Gandhi International Airport waterlogged, forcing passengers to wade through ankle-deep water. At least 11 flights were diverted and over 400 delayed. Major routes like the Delhi-Gurugram expressway saw 10km traffic jams. The disruption comes just days before Delhi hosts world leaders for the Brics Summit, raising questions about infrastructure readiness.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "15a86028"}, {"headline": "ED seeks fugitive economic offender tag for ex-TMC leader Vinay Mishra", "summary": "The Enforcement Directorate moved a Delhi court to declare former Trinamool Congress youth leader Vinay Mishra a fugitive economic offender. The agency seeks to confiscate his properties in cases involving alleged coal and cattle smuggling worth hundreds of crores. Mishra fled India in 2020 and acquired citizenship of Vanuatu. The tag allows for the seizure of his assets across the country.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "82e53d01"}, {"headline": "British pharmacist to be extradited to India for arsenic poisoning case", "summary": "A London court ruled that Ajith Kumar Mupparapu can be extradited to stand trial in India for allegedly poisoning his ex-wife’s family. Mupparapu is accused of killing his mother-in-law with arsenic-laced spices in Hyderabad in 2023. The judge found there was an arguable case against him, dismissing defense arguments regarding potential torture in Indian custody.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "9ab0c623"}, {"headline": "US regulators investigate Tesla Cybercabs over safety and steering compliance", "summary": "The National Highway Traffic Safety Administration opened an investigation into Tesla’s new Cybercab taxis. Regulators are checking if the vehicles, which lack steering wheels, mirrors, and brake pedals, comply with federal safety standards for road deployment. The probe follows Elon Musk’s launch of the ride-sharing service in Austin, which uses two-seater autonomous vehicles.", "category": "Technology", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "a43c3cca"}, {"headline": "India and Japan to play first Twenty20 International cricket match", "summary": "India and Japan will face off in their first-ever men’s T20I cricket match on September 22 at Japan’s Sano International Cricket Ground. The match commemorates 75 years of diplomatic ties between the two nations. The BCCI stated that taking the reigning world champions to Japan marks a significant moment for introducing cricket to a wider audience in the Asian region.", "category": "Sports", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "a24cba35"}, {"headline": "Engineers use WhatsApp to guide trapped survivors in Nepal tunnel", "summary": "A WhatsApp group with over 500 experts is providing technical drawings and real-time guidance to rescuers at flooded hydropower plants in Nepal. The digital collaboration helped locate tunnel entrances buried under millions of tonnes of debris. The effort led to the rescue of two workers from the Trishuli 3A project who had been trapped underground for nine days following a glacial collapse.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "fb13eaef"}, {"headline": "Over 3.6 million voter notices pending distribution in Karnataka revision", "summary": "Data from the Karnataka Chief Electoral Officer shows 3.649 million notices for electoral roll revisions have not reached voters. The notices require electors to resolve logical discrepancies or prove citizenship. Hearings began on September 3 and will run until October 12. Officials are re-examining data to fix mapping errors that flagged families incorrectly before serving more notices.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "1c11c791"}, {"headline": "Three booked for threatening private college students near Mangaluru", "summary": "Police booked three individuals for allegedly abusing and threatening four private college students at a cafe. Two of the accused are alleged to be right-wing activists. The incident occurred on September 3 when the students were having breakfast. The accused reportedly questioned their presence and used verbal abuse. A complaint led to the registration of a case in Moodbidri.", "category": "Law", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "936be735"}, {"headline": "Karnataka launches Rs 28.52 crore cloud seeding project for rain deficit", "summary": "The Karnataka government launched a Rs 28.52 crore cloud seeding project to mitigate a rain deficit and avert drought. Water Resources Minister N Chaluvarayaswamy flagged off a light aircraft at HAL airport for the operation. The initiative targets areas with severe water scarcity. Previous operations had a success rate of 35%, and the state aims to safeguard farmer interests through this move.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "ab89e6e7"}, {"headline": "Three suspended after Bagalkot school ceiling collapse injures eight students", "summary": "Bagalkot authorities suspended an acting headmaster and two PWD engineers after a classroom ceiling collapsed on Wednesday. Eight students were injured, including one with a head injury. The headmaster was accused of failing to report the poor condition of the building, while the engineers were suspended for failing to ensure the school had a mandatory safety fitness certificate.", "category": "Education", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "354a5b4e"}, {"headline": "Karnataka minister urges industry to participate in Rs 241 crore ITI upgrade", "summary": "Industries Minister M B Patil called for public and private sector participation in the PM-SETU scheme to upgrade 48 ITIs. The central and state governments are allocating Rs 210 crore, with industry expected to contribute Rs 31 crore. Firms with Rs 500 crore turnover can help design curricula and training to develop a skilled workforce tailored to regional industrial needs.", "category": "Education", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "58f56a01"}, {"headline": "Undertrial prisoners booked for attempting to strangle warden in Bengaluru", "summary": "Five undertrial prisoners accused of murder were booked for allegedly assaulting a warden at Parappana Agrahara Central Prison. The inmates reportedly pulled the warden into a barrack and tried to strangle him over a dispute involving checks on their belongings. An attempt to murder case was registered at the local police station following a complaint from jail authorities on Thursday.", "category": "Law", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "4cd94be3"}, {"headline": "Telangana CM Reddy battles internal party dissent after cabinet removals", "summary": "Telangana Chief Minister A Revanth Reddy faces growing friction within the Congress after the removal of two leaders for disciplinary violations. Minister Konda Surekha was ousted from the cabinet following disparaging remarks, while G Chinna Reddy lost his planning board post. Dissenters claim Reddy, a newcomer to the party, is excluding senior leaders from the state power structure.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "9ffb43f9"}, {"headline": "Andhra Pradesh restores direct elections for mayors and municipal heads", "summary": "The Andhra Pradesh government passed a bill to restore direct elections for mayors and municipal chairpersons, ending a 21-year system of indirect votes. CM N Chandrababu Naidu said the move will stop frequent leadership changes and defections. The opposition YSRCP welcomed the change, viewing it as a test for the ruling coalition to maintain its hold in urban local body elections.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "fd3ce512"}, {"headline": "Telangana seeks Chhattisgarh NOC for Sammakka Sagar Godavari project", "summary": "Telangana Irrigation Minister N Uttam Kumar Reddy requested a no-objection certificate from Chhattisgarh for the Sammakka Sagar Project. The barrage on the Godavari River requires the NOC to store water at its full reservoir level. Telangana promised to pay full compensation for any land or housing submerged in Chhattisgarh, aiming to realize the project's intended irrigation benefits.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "43091e1d"}, {"headline": "Tamil Nadu woman rescued from torture in Kuwait after viral video", "summary": "Indian Embassy officials in Kuwait rescued a domestic worker named Vanitha after she posted a video detailing starvation and torture by her employers. Back in Tamil Nadu, police booked an employment agent for allegedly duping her. Vanitha confirmed her safety in a follow-up video from the embassy. Authorities are investigating the recruitment process that led to her overseas ordeal.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "d307e6d6"}, {"headline": "Tamil Nadu farmers announce campaign against Mekedatu Dam project", "summary": "Farmers' associations in Tamil Nadu will launch a five-day protest on September 20 against Karnataka's plan to build the Mekedatu Dam on the Cauvery. President P R Pandian called the project legally invalid and detrimental to agriculture in both states. Farmers urged the Centre to deny environmental clearances and suggested Rasimanal as a viable alternative for water storage.", "category": "Environment", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "eafafbff"}, {"headline": "Two arrested for providing mule bank accounts for cyber-fraud in Telangana", "summary": "The TGCSB arrested two people in Khammam for providing 10 mule bank accounts used in cyber-fraud transactions. The accounts facilitated illegal online gaming payments and movement of funds coordinated with foreign Chinese operators. Simultaneous raids were conducted at multiple bank branches and ATM centres. Police have identified an organized local network involved in the scam.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "b7fdbc84"}, {"headline": "Kerala cabinet starts strategic leadership retreat at IIM Kozhikode", "summary": "Kerala Chief Minister VD Satheesan and his council of ministers began a two-day strategic retreat at IIM Kozhikode. Titled \"Reimagining Kerala,\" the programme focuses on climate resilience, fiscal foundations, and higher education. Experts from global universities are leading sessions to improve cabinet coordination and expose ministers to new technological trends in governance.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "fbe441ae"}, {"headline": "Student groups clash at JNTU Hyderabad over inappropriate remarks", "summary": "Police registered three cases after engineering students clashed at the JNTU Hyderabad campus. The fight, involving sticks, was sparked by inappropriate remarks made against a female student. Nineteen students were taken into custody and issued notices after the physical altercation and a subsequent protest at the university gate. One injured student was hospitalised for treatment.", "category": "India", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "4f0e2f70"}, {"headline": "Energy buys won't end Russia-Ukraine war, says EAM Jaishankar", "summary": "External Affairs Minister S Jaishankar said the Russia-Ukraine conflict will only be resolved through diplomacy and dialogue, not by stopping commodity purchases like oil. Speaking in Warsaw, he reiterated that India has a responsibility to meet the energy needs of its 1.4 billion people. He called for intensified global efforts to support negotiations to bring the conflict to an end.", "category": "Politics", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "0331ca40"}, {"headline": "US fraud fugitive Manjit Singh Bedi arrested in Punjab", "summary": "Punjab Police arrested Indian-origin fugitive Manjit Singh Bedi one day after he was added to the FBI's Most Wanted list. Bedi is accused of a $600,000 welfare benefits fraud scheme in Washington state. He had fled to India via Canada to avoid prosecution. The arrest follows an FBI reward offer of $150,000. Bedi allegedly ran an Asian grocery store used to defraud the SNAP program.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "2671160a"}, {"headline": "Registrar General issues circulars for complete enumeration in 2027 Census", "summary": "The Registrar General of India directed census officers to count all settlements, including sailors, forest dwellers, and the homeless for the 2027 Census. Special attention will be given to rapid population growth areas and difficult terrains. Sailors on Indian mercantile ships will be enumerated if present at a domestic port on March 1, 2027. Training for defense census officers is also mandated.", "category": "India", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "aac5bec8"}, {"headline": "Punjab government to hike Dearness Allowance to 60% for employees", "summary": "The Punjab government announced an increase in Dearness Allowance from 42% to 60% for about 85,000 employees recruited after July 2020. The move aligns state salaries with the Central pay pattern. Minister Aman Arora said the recommendation from a cabinet sub-committee would be sent for final approval by the Chief Minister. The decision does not cover employees on older pay matrices.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "6674391b"}, {"headline": "Rahul Gandhi expands Chhatron ki Goonj student outreach to 800 districts", "summary": "Congress leader Rahul Gandhi will expand his student interaction programme to 800 districts ahead of the 2029 Lok Sabha elections. The initiative aims to engage Gen Z on issues like paper leaks and education costs. The first phase includes 28 episodes covering all states. The outreach follows a Congress Working Committee resolution to double down on engaging with India's youth.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "552573d5"}, {"headline": "Terrorist neutralised during joint security operation in Budgam", "summary": "Security forces killed a terrorist during a joint operation by the Army, police, and CRPF in the Ashdar forests of central Kashmir's Budgam district. The operation was launched following specific intelligence on terrorist movement. An AK rifle and other war-like stores were recovered. The Army's 15 Corps confirmed that search operations in the region are still in progress.", "category": "India", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "5175dc1c"}, {"headline": "Egg prices surge as ethanol demand inflates poultry feed costs", "summary": "Retail egg prices across India have hit Rs 9 per piece as maize, a key feed ingredient, is diverted for ethanol blending. Feed costs have risen 25% since April, while maize prices increased from Rs 21,000 to Rs 27,000 per tonne. Poultry farmers are operating at reduced capacity and low margins, struggling to compete with the high demand for grains from the ethanol sector.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "e8de7a69"}, {"headline": "Grenade blast near Manipur Congress MLA's residence; no casualties", "summary": "A suspected hand grenade exploded at the residential campus of Congress leader K Meghachandra Singh in Thoubal district. While no casualties were reported, police recovered a grenade lever from the site. CM Yumnam Khemchand condemned the attack. In a separate incident, a man was found shot dead in Imphal East. Police have registered cases and are investigating both violent incidents.", "category": "India", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "cff85b4b"}, {"headline": "Ram Temple trust to consider deed changes for professional management", "summary": "The Ayodhya Ram Temple trust will consider deed amendments on December 2 to restructure management for security and logistics. The changes follow the appointment of Air Marshal (retd) Jeetendra Mishra as the first CEO. The amendments aim to formalize the CEO's powers and improve transparency in fund management as the temple moves from construction to full-scale operation.", "category": "Culture", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "74ce5c9b"}, {"headline": "Kolkata teacher suspended for allegedly forcing student to remove tilak", "summary": "A private school in Kolkata suspended a teacher for allegedly forcing a Class 5 student to wash off a sandalwood tilak. While the teacher claimed she only asked the boy to wash his face due to sweat smearing the mark, management suspended her pending a final decision. Opposition leader Suvendu Adhikari said a police case has been lodged against the teacher for the incident.", "category": "Education", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "5f674924"}, {"headline": "West Bengal fire department orders Abhishek Banerjee's office to vacate", "summary": "The West Bengal fire department directed TMC MP Abhishek Banerjee to vacate two floors of a Camac Street building due to inadequate safety measures and an expired fire certificate. An audit found the occupancy posed an imminent threat to life and property. The move follows a team inspection of the premises, which are leased for the TMC's youth wing operations.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "6e7a1e48"}, {"headline": "Two dead and one injured in Gorakhpur hit-and-run accident", "summary": "A speeding truck killed two people and injured another in a series of collisions on the Ramkola-Padrauna road in Kushinagar district. The driver was attempting to flee after a previous accident. Local residents chased the vehicle, apprehended the driver, and handed him over to the police. The incident sparked local anger over speeding heavy vehicles on the district roads.", "category": "India", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "edbb04b8"}, {"headline": "Nepal flood losses estimated at $2.56 billion; insurance claims rise", "summary": "Nepal’s disaster authority reported property and infrastructure losses of $2.56 billion after last week's floods. The country must rebuild 20,000 houses and restore power to critical areas. Insurance claims worth over $171 million have been received, mainly from 11 damaged hydropower projects. Early recovery costs for immediate shelter and water are estimated at $52.6 million.", "category": "World", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "7c76aad7"}, {"headline": "Houthis and Saudi-backed forces clash in Yemen; 129 killed", "summary": "At least 129 people were killed in fierce clashes between Houthi rebels and Saudi-backed government forces in Yemen. The fighting erupted as rebels launched a ground and drone assault near the strategic Bab al-Mandab strait at the Red Sea. Military sources confirmed heavy casualties on both sides. The conflict highlights the ongoing instability near a major global oil chokepoint.", "category": "World", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "b1fbce56"}, {"headline": "FSSAI tells court Dabur ignored warnings over 100% pure claims", "summary": "The FSSAI informed the Delhi High Court that its restraining order against Dabur followed five improvement notices and multiple warnings since 2024. Dabur is barred from using \"100% Pure\" and \"100% Natural\" labels on food products. The regulator argued that the firm was given ample opportunity to take corrective measures and that the claims were misleading to consumers.", "category": "Business", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "0e8af56f"}, {"headline": "August e-way bills rise 7.7% signaling resilient goods movement", "summary": "Electronic permit generation for goods shipment rose 7.7% year-on-year to 139.09 million in August. Although slightly lower than July, the figure stayed above the 130-million mark for the fifth straight month. Analysts state the trend signal economic resilience and improved GST compliance. The data is a key high-frequency indicator of domestic trade and consumption demand.", "category": "Economy", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "89486fc5"}, {"headline": "Low tariffs fuel surge in Chinese electric truck sales in India", "summary": "Chinese automakers Sany and Foton are dominating India's electric heavy truck market, with Sany selling 722 units this fiscal year compared to five last year. Local manufacturers are concerned that a low 10% import duty on electric tractors gives foreign firms an unfair advantage. Indian executives are calling for higher tariffs to protect domestic firms investing in local R&D.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "935b0bbd"}, {"headline": "Sugar prices drop at mill gates but retail rates stay high", "summary": "Ex-mill sugar prices have plunged over 23% to Rs 48 per kg following government action against hoarding, but retail prices have only fallen 4%. The retail average remains at Rs 62 per kg despite the sharp decline in wholesale costs. Industry experts expect retail prices to fall within the next 10 days as cheaper inventory moves through the supply chain to consumers.", "category": "Economy", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "8c1a83aa"}, {"headline": "JD Vance and Marco Rubio launch Foundry School for technical talent", "summary": "US VP JD Vance and Marco Rubio announced \"Foundry School,\" a training programme to rebuild domestic manufacturing. The initiative involves eight US universities and mentors from partner nations like India and Japan. Focusing on modern factory design and supply chains, the project aims to foster the high-tech talent needed for advanced manufacturing and assembly line engineering.", "category": "Education", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "a314d8d7"}, {"headline": "Tennis showman Gael Monfils bids farewell to Grand Slams", "summary": "Gael Monfils played his final Grand Slam match at the US Open, losing to American Learner Tien in the second round. The 40-year-old Frenchman, known for his acrobatic athleticism and entertaining style, finishes a 22-season career with 13 ATP titles and 34 US Open wins. Monfils plans to transition into a coaching role for his wife, Elina Svitolina, and work in finance.", "category": "Sports", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 05-09.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/136340"}], "article_id": "dd4fb65f"}, {"headline": "Aryna Sabalenka cruises into US Open fourth round with easy win", "summary": "Two-time defending champion Aryna Sabalenka defeated Kamilla Rakhimova 6-3, 6-4 to reach the US Open fourth round. The top seed fired four aces and saved four break points during the match. Sabalenka has now won 16 consecutive matches at Flushing Meadows. She is aiming to become the first woman since Serena Williams to win three straight US Open crowns.", "category": "Sports", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136340", "sources": [{"newspaper": "Hindustan Times", " ement being uneven on Day One of the ban.", "category": "India", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136330", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136330"}], "article_id": "8064b1ee"}, {"headline": "BMTC set to go 50% electric soon with 4.5k new e-buses", "summary": "BMTC plans to induct 4,500 e-buses under the Centre's PM E-DRIVE scheme, expanding its fleet to nearly 11,000 buses in 18 months, aiming to reduce congestion and environmental benefits.", "category": "Infrastructure", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136330", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136330"}], "article_id": "f0602d4b"}, {"headline": "5 inmates assault, try to strangle prison officer", "summary": "Five prisoners at Central Prison, Parappana Agrahara, allegedly assaulted and attempted to strangle a warder after he confronted one of them over an earlier incident.", "category": "India", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136330", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136330"}], "article_id": "ca60817c"}, {"headline": "New Metro trains to give BMRCL chance to overhaul fleet", "summary": "With four new trainsets for the Green Line expected, BMRCL will get an opportunity to undertake mid-life maintenance of its older rolling stock, improving operational flexibility.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136330", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 05-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136330"}], "article_id": "025755cd"}, {"headline": "DK Shivakumar: Not s const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

  card.style.setProperty('--cc', m.color);
  card.innerHTML = `

          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
