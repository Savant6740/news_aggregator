 in creditor approval and commerciality.", "category": "Law", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "2982b150"}, {"headline": "Franchise Films Continue to Star at BO", "summary": "Franchise films dominated India's box office in Jan-Oct 2026, contributing 74% of the top ten films' cumulative collection. Audiences show selective fatigue for the genre.", "category": "Culture", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "1c81e9a8"}, {"headline": "Carbon Cuts, Cost Gains: India Shows Business Logic of Going Green", "summary": "Panelists at an Earthshot Prize event highlighted India's success in renewable energy, showing no trade-off between growth and climate goals. Finance remains a key challenge for climate initiatives.", "category": "Environment", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "39d90b3a"}, {"headline": "Prince William Lauds India for Reaching 50% Power Capacity from Non-Fossils", "summary": "Prince William praised India's achievement of 50% non-fossil fuel power capacity five years ahead of target, showcasing that growth and environmental protection are not mutually exclusive.", "category": "Environment", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "f001f05b"}, {"headline": "Calcutta High Court cancels all OBC certificates issued after 2010", "summary": "The Calcutta High Court cancelled all OBC certificates issued in West Bengal after 2010, declaring the classification of several groups—mostly Muslim—as illegal. The court found that the State Backward Classes Commission's recommendations were bypassed. While nearly five lakh certificates are affected, individuals already in jobs or educational courses remain protected under the ruling.", "category": "Law", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143808"}], "importance": 10, "article_id": "e2f566c5"}, {"headline": "Bengaluru Tech Summit to showcase AI and indigenous robotics", "summary": "The 29th edition of the Bengaluru Tech Summit begins today with the theme 'AI & Beyond'. The event features over 120 sessions and a dedicated AI & Robotics Pavilion showcasing indigenous humanoids and drones. It will also see the launch of AI Kavach, India’s first AI cybersecurity lab for the BFSI sector. Over 1,000 start-ups and delegations from 65 countries are participating.", "category": "Technology", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143769"}], "importance": 7, "article_id": "736dfaa1"}, {"headline": "IISc researchers find strategy to reverse drug resistance in TB", "summary": "Scientists at the Indian Institute of Science have identified that combining the antibiotic vancomycin with isoniazid can restore the latter's effectiveness against drug-resistant Tuberculosis. The combination showed a 90% reduction in bacterial growth in clinical isolates and significantly reduced bacterial burden in mouse models. The team is preparing the strategy for clinical trials.", "category": "Science", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 8, "article_id": "375b2cc9"}, {"headline": "Indiranagar residents oppose felling 137 trees for BDA complex", "summary": "Citizens in East Bengaluru have submitted objections against the proposed removal of 137 mature trees at the Indiranagar BDA complex. The felling is part of a redevelopment project under a public-private partnership. Residents argue the move violates a High Court interim order and that compensatory plantation cannot replace the ecological value of the existing trees.", "category": "Environment", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 5, "article_id": "c245fbc2"}, {"headline": "Cyclone Akvan likely to cross Andhra Pradesh coast on November 20", "summary": "A deep depression over the Bay of Bengal has intensified into Cyclonic Storm Akvan. It is expected to become a very severe cyclonic storm with wind speeds up to 145 kmph. Landfall is predicted between Nellore and Kakinada on November 20. Several coastal districts are on alert for extremely heavy rainfall, and the CM has instructed officials to prepare for emergencies.", "category": "Environment", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 8, "article_id": "93e55ef0"}, {"headline": "Supreme Court grants bail to two convicts in Bilkis Bano case", "summary": "The Supreme Court suspended the life sentences of Bipinchand Joshi and Pradip Modhiya, two of the 11 convicts in the Bilkis Bano gang rape and murder case. The court noted they had served over 17 years and one is severely handicapped. Earlier this year, the top court had quashed the remission granted to all 11 convicts by the Gujarat government, leading to their return to prison.", "category": "Law", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 9, "article_id": "cc4f68bf"}, {"headline": "Indo-ASEAN ties are at heart of Act East Policy, says Modi", "summary": "Prime Minister Narendra Modi left for Manila to attend the 49th ASEAN Summit and the East Asia Summit. He emphasized that ASEAN is central to India's 'Act East Policy' and 'SAGAR' vision. A Quad leaders' summit involving leaders from the U.S., Japan, and Australia is also expected to be held on the sidelines to discuss maritime security and regional stability.", "category": "Politics", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143763"}], "importance": 9, "article_id": "e65d42e3"}, {"headline": "Sonia Gandhi launches memoir 'Belonging' to set the record straight", "summary": "Sonia Gandhi officially launched her memoir 'Belonging: A Journey of Love', stating it reflects her journey of finding acceptance in India. The event saw participation from top Opposition leaders. Rahul Gandhi recalled the bond between his parents and the country's embrace of his mother after Rajiv Gandhi's assassination. Sonia noted that youth protests for rights are encouraging.", "category": "Culture", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 8, "article_id": "1c33e1bc"}, {"headline": "Lakshmi Venu seeks equal share in Venu Srinivasan family assets", "summary": "Lakshmi Venu has issued a legal notice to her father, TVS Holdings chairman Venu Srinivasan, seeking a formal partition of family assets. She claims she is being wrongfully denied her rightful share, asserting that daughters have equal inheritance rights. The move is supported by her mother, Mallika Srinivasan. The family controls assets worth over $20 billion, including TVS Motor Company.", "category": "Business", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_17-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143763"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143769"}], "importance": 9, "article_id": "24e717ce"}, {"headline": "India's wholesale inflation surges to 12.3 percent in October", "summary": "India's wholesale price index-based inflation rose to 12.3% in October, driven by fuel price spikes and primary article costs. Fuel and power inflation reached 32.8% due to global crude oil uncertainty. While manufactured product price rises slowed slightly to 9.5%, the overall figure was significantly higher than the negative inflation recorded in the same period last year.", "category": "Economy", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 9, "article_id": "ee6e8e38"}, {"headline": "Jay Shah secures second two-year term as ICC Chairman", "summary": "Jay Shah has been reappointed unopposed as the Chairman of the International Cricket Council for a second two-year term. The 38-year-old, who formerly served as BCCI secretary, remains the youngest-ever chairman of the global cricket body. His reappointment aims to ensure continuity during a period of strategic expansion and commercial development for the sport.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "importance": 8, "article_id": "0126765b"}, {"headline": "IBM to invest 10 billion dollars in global quantum computing plan", "summary": "IBM Chairman Arvind Krishna announced a $10 billion global investment in quantum computing over the next five years. He highlighted India’s significance, noting the company spends $3 billion annually in the country. Krishna warned that AI could displace 10-20% of jobs in the next decade, with the BPO sector facing the most significant impact from technological automation.", "category": "Technology", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143830"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143763"}], "importance": 7, "article_id": "3d3ff736"}, {"headline": "RBI directs Tata Sons to comply with listing norms for NBFCs", "summary": "The Reserve Bank of India has ordered Tata Sons to adhere to regulations for upper-layer non-banking finance companies, including the requirement to list its shares. This follows the rejection of Tata Sons' application to surrender its NBFC registration. The central bank's directive complicates efforts by the conglomerate to avoid an initial public offering by the September 2025 deadline.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143763"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143769"}], "importance": 9, "article_id": "a955780c"}, {"headline": "Shareholders sue Intel for $140 billion loss following PC sales slowdown", "summary": "Intel faces a class-action lawsuit from shareholders accusing the company of concealing a prolonged slowdown in PC sales. The nondisclosure led to a 29% one-day stock price plunge, wiping out $140 billion in market value. The suit alleges Intel was aware of inventory gluts and manufacturing shortages while raising capital, misleading investors about the impact of the AI boom.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 2, "teleg const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
