<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

gram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "3c7e5b32"}, {"headline": "High-risk glacial lakes in India under spotlight after Nepal floods", "summary": "Over 200 glacial lakes in the Indian Himalayas have been flagged for high-risk assessment following the recent disaster in Nepal. The NDMA identified 185 vulnerable lakes across five states and union territories. Monitoring reports from June 2024 showed a 147% increase in water spread in certain areas, requiring urgent vigorous monitoring and risk-reduction measures.", "category": "Environment", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "0a462aa9"}, {"headline": "NEET leak probe widens as ED seeks CBI case files", "summary": "The Enforcement Directorate has formally requested the CBI's charge sheet and witness statements regarding the NEET-UG 2024 paper leak. The move adds a financial crime dimension to the investigation, as the ED examines alleged money laundering connected to the scandal. Over 266,000 candidates appeared for a PG retest on Sunday following previous exam failures.", "category": "Law", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "ab525170"}, {"headline": "Army Cheetal carries out daring rescue mission at 18,600ft in Ladakh", "summary": "Indian Army pilots successfully evacuated a critically injured junior commissioned officer from Ladakh's Zanskar range. The mission was conducted in a single-engine Cheetal helicopter at an altitude of 18,600 feet under extreme weather conditions. The pilots landed on a treacherous snow-clad slope with only one skid touching the ground to facilitate the rescue.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "c0303026"}, {"headline": "DGCA flagged Tecnam aircraft safety concerns before UP crash", "summary": "The Directorate General of Civil Aviation had warned flight training organizations twice about safety issues with Italian-made Tecnam aircraft before a recent fatal crash in Kanpur. Records show concerns were raised regarding structural integrity and maintenance protocols as early as July 10. The crash on August 27 resulted in the deaths of a trainee pilot and an instructor.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "70949906"}, {"headline": "Bihar and Jharkhand to sign pact on sharing Sone river waters", "summary": "The governments of Bihar and Jharkhand will formalize an agreement to share waters from the Sone River. This pact resolves a dispute lingering since Jharkhand's creation in 2000. Under the agreement, Bihar will receive 5.75 MAF of water while Jharkhand will be allocated 2.0 MAF. The project aims to improve irrigation and power generation in both states.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "c70c44d9"}, {"headline": "FSSAI proposes mandatory red warning labels on unhealthy food", "summary": "The Food Safety and Standards Authority of India has proposed a 'High Fat, Sugar, Salt' (HFSS) warning label system. Products exceeding specific thresholds for these ingredients must display a red hexagonal warning on the front of the pack. The regulation aims to combat rising obesity and non-communicable diseases by helping consumers make informed choices.", "category": "Health", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "1690d18c"}, {"headline": "Google defends Vizag AI Hub project amid environmental concerns", "summary": "Google has addressed concerns regarding its proposed AI Hub in Visakhapatnam, emphasizing a commitment to water and energy efficiency. The tech giant stated the data center would use advanced air-cooling technology and source 125 MW of renewable energy. The project is expected to create 4,200 construction jobs and support the region's digital infrastructure growth.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "59bdb435"}, {"headline": "Tilottama Sen targets Asian Games glory after Olympic miss", "summary": "18-year-old shooter Tilottama Sen is focusing on the upcoming Asian Games after narrowly missing out on the Paris Olympics. Sen, a gold medalist at the National Selection Trials, competing in the 50m 3-Position event, expressed confidence in her preparation. She emphasized that her mental maturity and recent international experience have prepared her for the high-pressure tournament.", "category": "Sports", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "4a739236"}, {"headline": "Newborn among three killed in Bikaner road accident", "summary": "A two-day-old baby and two other family members died in a road accident in Rajasthan's Bikaner district. The family was returning home from the hospital when their car collided with a camper and was subsequently hit by a Scorpio from behind. Three others, including the baby’s mother, sustained serious injuries and are currently undergoing treatment at a local hospital.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ³¹⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135769"}], "article_id": "f5a851b5"}, {"headline": "Tata Trusts seeks regulatory help to resolve selection deadlock", "summary": "Tata Trusts has approached the Maharashtra charity commissioner to resolve a deadlock in forming a panel to select the next Tata Sons chairman. The trust aims to fast-track the process to avoid a management vacuum. A five-member committee is required to nominate a candidate for board approval. The move follows a three-week delay in finalizing the selection committee composition.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "8aa16450"}, {"headline": "Indian consumer protection laws face AI clarity challenge", "summary": "The Consumer Protection Act 2019 lacks specific provisions for AI-driven harms, creating a legal gap. Current rules exclude services rendered entirely free of charge, potentially leaving users of free AI chatbots without recourse for misinformation or harmful content. Legal experts suggest the framework must evolve to address transparency and accountability in AI-generated outputs.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "066806a5"}, {"headline": "Centre faces fertilizer subsidy pressure as nutrient prices rise", "summary": "India's fertilizer subsidy bill may face pressure as price hikes in some nutrients outweigh declines in others. The government has already spent 56% of its annual subsidy budget in the first four months of FY27. While urea prices have eased, global prices for phosphoric and ammonia have risen sharply, impacting costs for domestic complex fertilizer manufacturers.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "a6f02ebf"}, {"headline": "Indian airport sector faces financial and capacity constraints", "summary": "Despite a passenger boom, Indian airports face financial shocks and capacity limits. GMR Airports expects its net losses to widen to ₹1,220–1,340 crore in FY25 due to aircraft grounding and geopolitical issues. While major hubs like Bengaluru and Delhi see high traffic, industry experts warn that supply chain bottlenecks and rising costs are limiting the sector's profit potential.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "7a82a492"}, {"headline": "Nvidia targets global robotics market with China as key customer", "summary": "Nvidia is focusing on AI chips for physical robots, with CEO Jensen Huang predicting robots will eventually be as common as cars. China remains a vital market, accounting for 90% of the world's humanoid robot production despite US export restrictions. Nvidia’s new chips and platforms aim to provide the 'physical AI' needed for robots to navigate and interact with the real world.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "7e965389"}, {"headline": "Liability for unsafe food sold via e-commerce platforms", "summary": "Karnataka's food safety regulator suspended licenses of major e-commerce platforms after toxic datura fruits were sold as food online. The case highlights a gray area in food safety rules regarding whether platforms are responsible for screening every product listed by third-party sellers. Authorities seized nearly 2,000 units of misbranded products during recent inspections.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "8d0d8986"}, {"headline": "The financial performance and impact of privatized Indian airports", "summary": "A study of airport privatization shows that PPP models have benefited stakeholders through improved operational scale and revenue. Private operators like Adani and GMR have significantly increased non-aero revenues compared to the Airports Authority of India. However, passenger growth at recently privatized airports has slowed compared to the pre-covid era as the sector matures.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "f0ebe5e8"}, {"headline": "Chemical exporters seek incentives to reduce reliance on US", "summary": "The Indian government is considering incentives for chemical exporters to diversify into markets like Southeast Asia and Africa. Currently, the US accounts for 18% of India's chemical exports, and China provides 41.8% of chemical imports. The proposed strategy aims to build a more resilient export ecosystem and reduce vulnerability to trade shifts in major Western economies.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "d16de544"}, {"headline": "Finance Minister states India met FY26 fiscal discipline goal", "summary": "Finance Minister Nirmala Sitharaman confirmed that India achieved its fiscal consolidation target for 2025-26. The government remains committed to reducing the fiscal deficit to below 4.5% of GDP by 2030. While some advanced economies have seen debt levels rise to 200% of GDP, India is focused on a disciplined path to maintain economic stability and investor confidence.", "category": "Economy", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "4e676dfa"}, {"headline": "Women comprise 46% of beneficiaries in street-vendor credit scheme", "summary": "Prime Minister Modi announced that women make up 46% of the 7.8 million beneficiaries under the PM SVANidhi scheme. The program has disbursed ₹19,203 crore in micro-credit to street vendors, helping them expand businesses. The PM also highlighted the role of youth and creators in building a 'Viksit Bharat' and urged them to contribute to the 'Nasha-mukt Yuva' anti-drug campaign.", "category": "India", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "570ae3ad"}, {"headline": "Government plans to triple raw material assistance for MSMEs", "summary": "The Ministry of MSME aims to triple raw material assistance via the National Small Industries Corp (NSIC) to 900,000 tonnes by FY30. The move helps small businesses handle supply-chain costs by aggregating demand for materials like coal and steel. Bulk procurement can lower prices by 3-5%, supporting India's 92 million MSMEs against price volatility.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "cfcfb463"}, {"headline": "India sets first national standards for mortuaries and morgues", "summary": "The Union health ministry has finalized the first national standards for mortuary and post-mortem infrastructure. The new rules ban morgues in basements and near waste disposal sites, mandating storage temperatures between 4°C and 8°C. The standards aim to replace a fragmented system of state-level codes with uniform requirements for staffing, ventilation, and body identification.", "category": "Health", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "e5e24b70"}, {"headline": "Dairy startup Country Delight prepares for $200-300 million IPO", "summary": "Country Delight is in early stages of an IPO that could raise up to $300 million, valuing the dairy brand at $1.2 billion. The company has begun pitching to investment banks for the offering, which is likely to include a mix of fresh equity and an offer for sale. The startup operates in 15 cities and recently expanded into the fruits and vegetables category through a pilot project.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "420225e1"}, {"headline": "SBI and Amundi to sell stakes in NSE public offer", "summary": "State Bank of India (SBI) and its subsidiary SBI Capital Markets plan to sell a 0.65% stake in the National Stock Exchange (NSE) through an upcoming public offering. Amundi also intends to sell a 0.35% stake. The divestment comes as SBI focuses on monetizing non-core assets. SBI currently holds a 3.23% stake in the exchange, which is valued at roughly ₹30,000 crore.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "a389447f"}, {"headline": "Investors increase HDFC Bank holdings ahead of CEO exit", "summary": "Foreign and domestic investors increased their holdings in HDFC Bank just before the announcement that CEO Sashidhar Jagdishan would step down. ADRs rose 2.76% and domestic shares gained 1.3% as markets anticipated a smooth leadership transition. Mutual funds and FPIs have shown strong confidence in the bank's long-term growth prospects despite recent executive changes.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "438e3242"}, {"headline": "Adani Enterprises' high valuation may limit further stock gains", "summary": "Analysts warn that Adani Enterprises Ltd (AEL) faces valuation headwinds that could limit near-term gains. The company is currently valued at roughly 40x EV/Ebitda for its core airport and mining segments, which is significantly higher than global peers. Future growth depends on the successful execution of its green hydrogen and data center projects, which are still in early stages.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "4fe939ea"}, {"headline": "IIFL Founder says modest rate hike won't derail growth", "summary": "Nirmal Jain, founder of IIFL Group, believes that a potential RBI interest rate hike in October will not harm India's long-term growth story. Robust domestic demand, infrastructure investment, and financial sector stability provide a strong buffer against external shocks. Jain noted that while inflation remains a concern, India is better positioned than most economies to handle higher rates.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "b090d77f"}, {"headline": "TAFE to invest ₹1,250 crore in new Rajasthan plant", "summary": "TAFE, India’s second-largest tractor manufacturer, will invest ₹1,250 crore to build its first greenfield plant in 29 years. Located in Rajasthan, the facility will have a capacity of 60,000 tractors annually. The expansion aims to serve both domestic and export markets as the company capitalizes on a strong monsoon and rising mechanization in Indian agriculture.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "3c7109bb"}, {"headline": "Ather Energy shifts strategy to challenge TVS and Bajaj", "summary": "Ather Energy is moving away from niche performance scooters to high-volume family models like the Rizta to compete with market leaders TVS and Bajaj. The company plans to expand its manufacturing capacity to 920,000 units by late 2027. Despite having more expensive models than traditional competitors, Ather aims to capture a larger share of the mass-market electric scooter segment.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "db64c17f"}, {"headline": "Government considers ₹19,852 crore scheme for electric transport", "summary": "The Indian government is planning a ₹19,852 crore scheme to subsidize charging infrastructure for 50,000 electric buses and 50,000 trucks over the next five years. The proposal aims to reduce the high upfront cost of electric heavy vehicles and encourage operators to switch from diesel. Currently, India has only 67,657 public EV chargers, with a high concentration of low-capacity units.", "category": "Infrastructure", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "3b4326d5"}, {"headline": "India nominates Revathi Mannepalli for senior ITU telecom post", "summary": "India has nominated Revathi Mannepalli for the position of director at the ITU’s Radiocommunication Bureau. If elected, she would be the first woman to hold this senior leadership role at the UN agency responsible for global telecommunications coordination. Pakistan has signaled it will not oppose the bid, increasing India's chances of securing the post for the 2027-2030 term.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "2081bf01"}, {"headline": "YouTube updates view count metrics as viewer retention drops", "summary": "YouTube now counts a view as soon as a video starts, but creators report that maintaining viewer retention is becoming more difficult. The change helps creators capture attention on social media but makes it harder to distinguish between 'engaged' views and accidental clicks. Experts suggest creators must focus more on 'hook arbitrage' to keep viewers from scrolling past within seconds.", "category": "Technology", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "c0bc1c65"}, {"headline": "Uniqlo India reports strong growth through local sensibilities", "summary": "Uniqlo India has achieved ₹1,192.9 crore in revenue since its launch seven years ago by localizing its product range for Indian consumers. The brand has focused on winter wear and core 'LifeWear' items while expanding its retail presence to seven cities. Marketing head Nidhi Rastogi stated that the brand has moved beyond the 'initial perception' of being just a winter-wear label.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "1eccbb41"}, {"headline": "Nepal death toll reaches 752 after catastrophic flooding", "summary": "Catastrophic floods and landslides in Nepal have killed at least 752 people and left over 3,000 missing. More than 8,700 people have been rescued, but operations face severe challenges from rising river levels and damaged infrastructure. The disaster was triggered by a glacial collapse that wiped out entire settlements. Nepal is seeking international aid for forensic identification of bodies.", "category": "World", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "5c1ef467"}, {"headline": "US threats of Iran sanctions largely ignored globally", "summary": "Despite US warnings of an 'economic onslaught' against countries trading with Iran, major nations like China and the UAE continue commercial ties with Tehran. China currently buys 90% of Iran's oil, and many international banks in the Middle East remain active in processing transactions. The lack of global consensus has blunted the impact of US efforts to isolate the Iranian economy.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "66768d37"}, {"headline": "SpaceX and rivals face rising satellite collision risks", "summary": "The rapid expansion of satellite constellations, particularly SpaceX’s Starlink, is increasing the risk of collisions in low-earth orbit. There are now over 1.5 million satellites planned for launch by 2034, raising concerns about space debris. A collision between two satellites could trigger a chain reaction of debris, potentially making certain orbits unusable for future missions.", "category": "Science", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "871db41f"}, {"headline": "Russia intensifies 'gray zone' attacks against European nations", "summary": "NATO officials report a surge in Russian 'gray zone' activities, including cyberattacks, arson, and sabotage across Europe. These operations aim to undermine public support for Ukraine and create instability within NATO member states. Recent incidents have been reported in Germany, Poland, and the UK, with intelligence agencies warning of more systematic hybrid warfare tactics.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "a810ad3e"}, {"headline": "Kerala adapts to its status as India's geriatric capital", "summary": "Kerala is facing a demographic shift as the state's elderly population reaches 18.6%, significantly higher than the national average. By 2051, nearly one in three people in Kerala will be aged 60 or above. The state government is developing new blueprints for elderly care, including day-care centers and neighborhood social networks to combat loneliness and provide healthcare support.", "category": "India", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "4c71e3d4"}, {"headline": "Investors advised to check cash flows amid IPO rush", "summary": "With Indian companies raising over ₹22,000 crore via IPOs in August, financial experts are urging investors to look beyond narratives and focus on cash flows. Key red flags include high debt-to-equity ratios, negative operating cash flows, and significant related-party transactions. Analysts suggest comparing valuations with listed peers to avoid overpaying for new listings.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "747a1985"}, {"headline": "India needs faster competitiveness in handset manufacturing sector", "summary": "India must accelerate its handset manufacturing ecosystem by moving beyond assembly to high-value component design and R&D. While the PLI scheme has boosted exports, the local value-add remains modest. Industry experts argue that to compete globally, India must develop its own intellectual property and reduce dependence on imported chipsets and critical sub-assemblies.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "5dfd6a08"}, {"headline": "Geopolitical shifts in West Asia create new world order", "summary": "The conflict in Gaza and shifting alliances between the US, China, and regional powers are reshaping the geopolitical landscape of West Asia. India must navigate these complexities as a permanent shift in regional power dynamics occurs. The rivalry between the US and China is increasingly playing out through their influence on middle-tier powers in the region.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "555c37fa"}, {"headline": "Bitcoin fails to meet its original promise of utility", "summary": "Bitcoin has struggled to fulfill its promise as a decentralized medium of exchange or a reliable 'digital gold' due to extreme price volatility. While it has gained traction as a speculative asset, its lack of practical utility and high transaction costs have hindered its adoption for everyday commerce. Regulatory hurdles and the rise of stablecoins have further complicated its role.", "category": "Economy", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "4ba2164f"}, {"headline": "Personal hobbies on résumés help candidates stand out", "summary": "Career experts suggest that including quirky personal interests on a résumé can humanize candidates and serve as effective icebreakers during interviews. Hobbies like building birdhouses or training pets help candidates differentiate themselves in a competitive job market dominated by standard professional credentials. This trend is particularly popular among Gen Z and millennial job seekers.", "category": "Education", "page": 14, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135755", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint_LiveMint BENGALURU_20260831.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135755"}], "article_id": "a778358f"}, {"headline": "Isro’s Bahubali Attracts Industry Heavyweights", "summary": "L&T, JSW, and Adani Group are among companies seeking to partner with ISRO for the commercial production and launch of the Heavy Lift Launch Vehicle Mark-3 (LVM3). ISRO plans to transfer technology for its most powerful rocket to private industry players, marking a significant step in the privatization of India's space program to tap into a $44 billion global market by 2033.", "category": "Technology", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "6203b6a6"}, {"headline": "Temasek, ChrysCap Brew Up Plans for Blue Tokai Stake", "summary": "Singapore’s Temasek and ChrysCapital are reportedly planning a ₹1,200 crore investment in home-grown coffee chain Blue Tokai, valuing the firm at up to ₹3,700 crore. The funding will support the brand's expansion across India and international markets including Japan and the UAE, as it competes with global brands like Starbucks.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "cc978d67"}, {"headline": "Block & Bulk Trades Make a Splash in Aug", "summary": "August witnessed a surge in bulk and block deals on Indian bourses, reaching an 14-month high with transactions worth at least ₹80,000 crore. Driven by institutional demand and high valuations, the surge reflects strong liquidity and appetite from mutual funds and foreign portfolio investors for mid and small-cap shares.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "5860e36f"}, {"headline": "Truemeds may Acquire DealShare at Low Value", "summary": "Online pharmacy Truemeds is in talks to acquire social commerce firm DealShare in a share-swap deal. Once valued at $1.7 billion, DealShare's value has plummeted following pivots in its business model. The deal is structured around DealShare's remaining $90 million cash balance, signaling a consolidation in the distressed e-commerce space.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "a53bf54d"}, {"headline": "FPIs Want to Link Servers with Bourses", "summary": "Foreign portfolio investors have requested Sebi to allow direct server links with Indian stock exchanges to enable faster trades and more efficient order execution. This move towards 'direct access' aims to reduce latency for high-frequency algorithmic traders and bypass intermediary broker servers, though it raises questions about risk management.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "489e7b93"}, {"headline": "September Series Puts Fresh Set of Stocks in Play", "summary": "The start of the September derivatives series has seen high rollovers and open interest, highlighting potential bullish and bearish bets. Analysts identify Adani Power and Persistent Systems among bullish picks, while Godrej Consumer Products shows bearish trends as investors adjust portfolios to navigate short-term market volatility.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "ef0c07c1"}, {"headline": "Drone Strike Hits Russian Refinery; Moscow Warns Retaliation", "summary": "A Ukrainian drone strike targeted Russia’s Kirishi oil refinery, sparking a fire that was later extinguished. The facility is one of Russia's largest, and the attack follows months of intensifying cross-border drone warfare. Moscow has warned of serious retaliation as Kyiv continues to target energy infrastructure to disrupt Russian military logistics.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "37c9cb52"}, {"headline": "Sitharaman Pitches India as Investment Hub to US CEOs", "summary": "Finance Minister Nirmala Sitharaman met with top US business leaders in Chicago, urging them to view India as a prime destination for AI, electronics, and semiconductor investments. She highlighted India's rapid infrastructure development and policy reforms, seeking to deepen bilateral economic ties and position India as a global manufacturing alternative.", "category": "Economy", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "b9533123"}, {"headline": "Ecuador Declares El Niño Emergency Amid Heatwave", "summary": "Ecuador has declared a state of emergency as it faces extreme weather conditions driven by the El Niño phenomenon. Rising sea temperatures and record-breaking heat have led to agricultural damage and water shortages. The government has activated emergency funds to mitigate the impact on vulnerable regions and prevent health crises related to the heat.", "category": "Environment", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "0572ca62"}, {"headline": "A787 Shutdown Led to Wider GE Inspections: DGCA", "summary": "Following a 2023 engine shutdown on an Air India Boeing 787-8, the DGCA has mandated broader inspections for GE Aerospace GEnx engines. The investigation revealed technical issues that prompted revised borescope inspection requirements to ensure aircraft safety. The disclosure came after an RTI query regarding the incident.", "category": "Infrastructure", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "0ffbcdc5"}, {"headline": "India Inc Pays Record Dividends in FY26", "summary": "Indian companies distributed record dividends worth ₹4.85 lakh crore in FY26, a significant increase from previous years. Banking, IT, and power companies accounted for nearly two-thirds of the total payout. The trend reflects strong corporate earnings and a preference for rewarding shareholders amid cautious capital expenditure plans.", "category": "Economy", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "0a0f903d"}, {"headline": "MeitY Plans R&D Guidelines Rejig for Tech Advancement", "summary": "The Ministry of Electronics and Information Technology is revising its research and development guidelines to improve efficiency and industry collaboration. The new framework will focus on accelerating lab-to-market transitions for AI and semiconductor technologies, with revised funding mechanisms to ensure better capital utilization for state-funded projects.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135744", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 31-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135744"}], "article_id": "528affa8"}, {"headline": "Calcutta High Court cancels five lakh OBC certificates in West Bengal", "summary": "The Calcutta High Court struck down the OBC status of several classes granted after 2010, affecting nearly 5 lakh certificates. The court found the identification process 'illegal' and 'hasty,' noting it was not based on proper data. Chief Minister Mamata Banerjee stated she would not accept the order, while the court protected those already in service or who had availed benefits.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "1e4c1242"}, {"headline": "Pune Porsche crash: Doctors detained for allegedly swapping blood samples", "summary": "Pune Police have detained two senior doctors from Sasoon General Hospital for allegedly swapping the blood samples of the minor involved in the Porsche crash. The investigation suggests the samples were tampered with to show zero alcohol content. The minor's father and grandfather remain in custody as the probe expands into a larger conspiracy to destroy evidence.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "cf7a5cd7"}, {"headline": "Cyclone Remal alert issued for West Bengal and Odisha coastal regions", "summary": "The IMD has warned of a deep depression in the Bay of Bengal likely to intensify into a severe cyclonic storm named 'Remal'. Landfall is expected between Sagar Island and Khepupara by Sunday night. Heavy rainfall and wind speeds up to 120 kmph are predicted. Authorities have begun evacuating vulnerable coastal populations and pausing fishing activities.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "1ccd8b62"}, {"headline": "India rejects US media report on Pannun murder plot investigation", "summary": "The Ministry of External Affairs dismissed a report by a US news outlet regarding the probe into the alleged plot to assassinate separatist Gurpatwant Singh Pannun. India termed the allegations 'unwarranted' and 'baseless.' The government maintained that a high-level committee is currently looking into security concerns shared by the US government regarding the matter.", "category": "World", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "2dd6a027"}, {"headline": "Election Commission directs parties to stop using children in poll campaigns", "summary": "The Election Commission of India issued a stern warning to all political parties to ensure children are not involved in any election-related activities. This includes rallies, poster distribution, or campaign speeches. Citing child labor laws, the ECI stated that party presidents and candidates would be held personally responsible for violations during the ongoing Lok Sabha polls.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "3623b155"}, {"headline": "Adani Ports announces three billion dollar global expansion plan", "summary": "Adani Ports and Special Economic Zone (APSEZ) revealed plans to invest $3 billion over the next three years to enhance its global footprint. The investment will focus on strategic port acquisitions in Southeast Asia, the Mediterranean, and Africa. The company aims to double its cargo volumes by 2030 through these international expansions and domestic capacity upgrades.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "50164e2f"}, {"headline": "Sunrisers Hyderabad face Rajasthan Royals in IPL 2024 Qualifier 2", "summary": "Sunrisers Hyderabad and Rajasthan Royals are set to compete in Chennai for a spot in the IPL 2024 final. The winner will meet Kolkata Knight Riders. Rajasthan enters with momentum after defeating RCB, while Hyderabad seeks to leverage its aggressive batting lineup despite a recent loss. The match is expected to be a high-stakes encounter at the MA Chidambaram Stadium.", "category": "Sports", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "0efc357d"}, {"headline": "Delhi High Court seeks response on plea against WhatsApp privacy policy", "summary": "The Delhi High Court has issued notices to the Centre and WhatsApp regarding a petition challenging the 2021 privacy policy. The plea argues that the policy's 'take it or leave it' approach violates the fundamental right to privacy by forcing data sharing with Meta. The court has combined this with existing probes by the Competition Commission of India.", "category": "Technology", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "78a548e6"}, {"headline": "New study links South Asian heatwaves to anthropogenic climate change", "summary": "A scientific report published in a leading journal asserts that recent extreme heatwaves in India and Pakistan were made 45 times more likely due to human-induced carbon emissions. The study warns that such events, which previously occurred once in a century, could now happen every few years if global temperatures continue to rise unchecked.", "category": "Science", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 31-08-2026_260831062643.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135683"}], "article_id": "76953ddd"}, {"headline": "LIC may raise stake in NSE, eyes reach in every panchayat", "summary": "Life Insurance Corporation of India (LIC) is considering increasing its stake in the National Stock Exchange (NSE). MD & CEO R Doraiswamy stated that the insurer aims to establish a presence in every village panchayat, already covering 92% of India's districts and nearly 56% of panchayats to deepen insurance penetration and reach the last mile.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "ec5e6234"}, {"headline": "Cash market volumes fall to five-month low as CAS swings rattle investors", "summary": "The average daily turnover on the NSE fell 3% in August to ₹1,16,579 crore, a five-month low. Market participants attributed the decline to volatility caused by SEBI's new closing auction session (CAS) introduced on August 3, along with a lack of major IPO activity and prevailing bearish sentiment in the secondary market.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "4731f2dc"}, {"headline": "Iran-UAE rift clouds BRICS summit in India", "summary": "Divergent positions between Iran and the UAE over territorial disputes are complicating efforts to reach a common communiqué for the upcoming BRICS summit in New Delhi. India is stepping up diplomatic efforts to bridge differences among the 11 member nations and ensure a successful conclusion to the summit despite the ongoing West Asia conflict.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "72f31c58"}, {"headline": "India’s GDP growth seen at 7-7.5% in Q1; SBI Research estimates 8%", "summary": "The Indian economy is projected to have grown between 7% and 7.5% during the April-June quarter (Q1) of FY25. While Barclays and the Finance Ministry expect growth around 7-7.5%, SBI Research is an outlier, projecting the rate to touch 8%. Key drivers include government capex and credit growth, though extreme heat waves posed risks to the agriculture sector.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "2c563803"}, {"headline": "Waiting period for EV and CNG cars stretches up to 6 months", "summary": "Waiting periods for electric vehicles (EVs) and CNG cars in India have increased up to six months ahead of the festival season. The surge is driven by high fuel prices and shifting consumer preferences toward greener alternatives. Models like the Mahindra XUV 400 and Tata Punch EV are seeing significantly higher demand, creating a supply-demand mismatch.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "8956552d"}, {"headline": "Gas-based power plants stabilised grid during peak summer demand", "summary": "Gas-based power plants provided crucial grid stability during India's peak electricity demand in April and May 2024. As solar generation dropped after sunset, gas-fired units ramped up production to meet cooling needs during intense heat waves. The Indian Gas Exchange (IGX) saw a 340% year-on-year increase in gas volumes traded for power generation during this period.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "a0699c84"}, {"headline": "SEBI could have been better prepared for closing auction session", "summary": "Former SEBI Chairman UK Sinha remarked that the regulator could have better prepared market participants before rolling out the new closing auction session (CAS). The new mechanism led to sharp price swings and market confusion on its first day. Sinha suggested that more consultation and better trade-off analysis could have made the transition smoother for investors.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "34029bbb"}, {"headline": "Bengaluru’s commercial projects hit approval roadblocks and delays", "summary": "Commercial real estate projects in Bengaluru are facing significant delays of up to 15 months due to a slowing approval process. Developers report that mid-stream rule changes and bureaucratic hurdles at the local municipal level are stalling construction and increasing costs. This has led to a 10.8% drop in new office completions across top Indian cities.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "01aa5806"}, {"headline": "BKT to launch car tyres; aims for ₹23,000 crore revenue", "summary": "Balkrishna Industries (BKT) plans to enter the passenger car tyre segment in November 2024. The company, currently focused on off-highway tyres, aims to double its total revenue to ₹23,000 crore by FY30. BKT is investing ₹5,000 crore in its Bhuj plant to support this expansion and targets export markets including Europe and the US.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "f18ab524"}, {"headline": "Govt broadens digital fertilizer network linking farmers and subsidies", "summary": "The Indian government is expanding its nationwide digital platform to track fertilizer from production to retail. The Integrated Fertilizer Management System (iFMS) now tracks more than 14 crore Aadhaar-linked buyers. New dashboards will provide officials with real-time data on fertilizer sales by landholding size, crop type, and inventory levels to improve subsidy efficiency.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "f9cc5b6f"}, {"headline": "Think tank GTRI calls for review of quality control orders", "summary": "The Global Trade Research Initiative (GTRI) has urged the Indian government to review Quality Control Orders (QCOs), citing high compliance costs and barriers for MSMEs. The think tank noted that while QCOs ensure quality, the lack of domestic testing facilities and high certification fees make it difficult for smaller players to compete and meet international standards.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "013af71f"}, {"headline": "Today’s Pick: Emcure Pharmaceuticals: BUY", "summary": "Market analysis for Emcure Pharmaceuticals suggests a 'BUY' rating with a target price of ₹2,100. The stock has shown a long-term uptrend with key support levels at ₹1,850 and ₹1,780. Analysts accumulate at current levels, citing strong technical indicators and a potential appreciation from the current price of ₹1,871.", "category": "Business", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-0 d memes to exchange barbs on social media.", "category": "Economy", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "687f2c45"}, {"headline": "Turkey’s authoritarian turn: A review of Erdogan’s impact", "summary": "Review of Suzy Hansen’s book 'Life From Life Itself' explores the political and social transformation of Turkey under President Recep Tayyip Erdogan. The book provides a gripping portrait of how Turkey shifted from a late neo-liberal era to an autocracy, and the impact of these changes on the country’s identity and its role in the Middle East.", "category": "World", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "9c8a0c65"}, {"headline": "Tukaram Mundhe and lessons on public leadership", "summary": "The article examines the leadership style of bureaucrat Tukaram Mundhe, known for his focus on accountability, ethics, and transparency. It highlights his work in food safety and public health as examples of strong leadership that prioritize public interest and institutional integrity over individual popularity.", "category": "Politics", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "1876930b"}, {"headline": "Twenty Years Ago Today: Archive news from 2004", "summary": "Historical snippets from 2004: The Indian government planned to partner with private industry for defense R&D; a dispute between Reliance-controlled FLAG Telecom and VSNL escalated; and the Ruia Group ewable energy projects to earn and trade carbon credits. The Joint Crediting Mechanism (JCM) aims to facilitate bilateral cooperation for carbon reduction, providing a lucrative avenue for Indian developers in areas like green hydrogen and carbon capture.", "category": "Environment", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "c4e55589"}, {"headline": "Indosol’s solar ingot plant to be commissioned next month", "summary": "Indosol Solar is set to commission India’s first solar ingot and wafer manufacturing facility in Andhra Pradesh next month. The plant will have an initial capacity of 1.2 GW, with plans to expand to 10 GW. This development marks a significant step toward domestic manufacturing resilience in the solar energy sector.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "820db584"}, {"headline": "Birla vs Adani: Heavy metal rivalry shifts to aluminum", "summary": "The industrial rivalry between the Aditya Birla Group and Adani Group has moved to the aluminum sector. Hindalco, part of the Birla Group, has announced a ₹50,000-crore expansion plan in response to Adani's entry into the market. Both groups are vying for leadership in integrated upstream and downstream aluminum production in India.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "e9d2430b"}, {"headline": "PepsiCo to stop covering weight-loss drugs _url": "https://t.me/c/1877410077/135737"}], "article_id": "6e7f3f79"}, {"headline": "Deep-tech startups need patient and accountable funding", "summary": "Investment in deep-tech startups requires 'patient capital' and rigorous evaluation, according to industry experts. The article emphasizes the need for transparency, accountability, and independent technical evaluations in funding these high-risk ventures, which have long development cycles and significant manufacturing requirements.", "category": "Technology", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "64db365d"}, {"headline": "Mandrake Bio uses generative AI to design precision gene editors", "summary": "Bengaluru-based Mandrake Bio is leveraging generative AI to design precision proteins for gene editing. The startup aims to create custom editors to treat genetic diseases by engineering proteins that don't exist in nature. This approach could lead to more effective and targeted treatments for various medical conditions.", "category": "Science", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "c3026bfc"}, {"headline": "BYT Capital bullish on India’s hardware deep-tech startups", "summary": "In an interview, Amit Chanda of BYT Capital discusses the growing potential for hardware deep-tech startups in India. The venture capital firm is focusing on areas like space, semiconductors, and defense, believing that India's next phase of growth will require homegrown, proprietary hardware and scaled-up manufacturing resilience.", "category": "Technology", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "be97199e"}, {"headline": "Digital lending platforms create new avenues for fintech fraud", "summary": "A report by Experian notes that while digital lending platforms have improved financial inclusion, they have also opened new opportunities for fraud. Tactics such as identity theft, mule accounts, and synthetic identity fraud are becoming more sophisticated, posing challenges for financial institutions in maintaining secure and reliable systems.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "9e6ac02d"}, {"headline": "Interview: LIC CEO R Doraiswamy on digital transformation and rural reach", "summary": "LIC CEO R Doraiswamy discusses transforming the insurer into a digitally strong entity while expanding its reach to every village panchayat. The goal is to achieve 'Insurance for all by 2047' by leveraging a multi-model approach that includes physical presence, digital channels, and a vast network of agents to increase insurance penetration in India.", "category": "Business", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "463d34d6"}, {"headline": "Non-resident Indians increasingly invest in India’s capital markets", "summary": "Confidence in the Indian economy is driving a surge in investments from non-resident Indians (NRIs) into domestic capital markets, startups, and infrastructure. NRIs are moving beyond traditional real estate and gold investments toward mutual funds, REITs, and private equity, contributing to India's long-term growth and financial stability.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "703a2adc"}, {"headline": "Atlassian expands India R&D hub, bets big on AI", "summary": "Software giant Atlassian is significantly expanding its research and development center in India, focusing on AI-assisted software development. The company plans to hire more engineers and sales staff in Bengaluru, leveraging AI to streamline development processes and improve product efficiency for its global customers.", "category": "Technology", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "07e240e5"}, {"headline": "Thousands in Nepal seek temporary shelter after devastating floods", "summary": "Over 3,500 people in Nepal's Nuwakot district are living in temporary shelters following catastrophic floods and landslides that have killed 750 people. Rescue operations continue as over 2,500 people remain missing. The disaster has caused widespread destruction of homes, roads, and infrastructure across several districts in Nepal.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "359606f6"}, {"headline": "Over 500 workers missing at Nepal hydropower project sites", "summary": "More than 537 workers remain unaccounted for at various hydropower project sites in Nepal after severe flooding and landslides. Rescue teams are working in difficult conditions to locate the missing, but blocked tunnels and damaged infrastructure are hindering efforts. The disaster has severely impacted the country's energy sector and infrastructure.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "98201790"}, {"headline": "India becomes key petrol supplier to Russia amid drone attacks", "summary": "India has emerged as a major supplier of petrol to Russia, with exports reaching 125,000 barrels per day. The increase in supply comes as Russian refineries face disruptions due to Ukrainian drone attacks. The shipments are primarily from private refineries in Gujarat, highlighting the shifting dynamics in global energy trade.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "1ce90ead"}, {"headline": "Bahwan CyberTek focuses on AI-driven products and public tech spending", "summary": "IT solutions provider Bahwan CyberTek is targeting growth in AI-driven products and expects significant demand from the public sector in India and the Middle East. The company is bullish on its suite of proprietary products and aims to expand its reach in energy, banking, and financial services over the next few years.", "category": "Technology", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "d1281d51"}, {"headline": "TVS Motor dealer-training programme leads to 300% sales increase", "summary": "A structured dealer-training programme by TVS Motor in Rajasthan resulted in a 300% increase in sales. The programme focused on improving customer interactions and simplifying sales processes, helping sales staff manage information overload and communicate more effectively with potential buyers.", "category": "Business", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135737", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135737"}], "article_id": "35e4d150"}, {"headline": "Karnataka Forms Cabinet Panel to Review Withdrawal of Criminal Cases", "summary": "The Karnataka government has constituted a six-member Cabinet sub-committee, led by Home Minister Priyank Kharge. The panel will examine pending criminal cases in various courts to recommend potential withdrawals. Members include ministers K.H. Muniyappa, U.T. Khader, and Krishna Byre Gowda, who will evaluate the nature and background of each case.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "7127f401"}, {"headline": "Tamil Nadu Moves Supreme Court Seeking Release of Cauvery Water Backlog", "summary": "The Tamil Nadu government has approached the top court seeking a direction for Karnataka to release 17.604 tmcft of water. The State also urged the court to ensure the release of 9,000 cusecs daily as directed by the CWMA. Farmers in the Cauvery Delta are reportedly facing severe prejudice as the Mettur dam remains closed for irrigation.", "category": "Environment", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page"
