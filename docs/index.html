<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

ntenance and lack of proper signage as primary causes. The CM has ordered a high-level probe and requested the central government to hold the NHAI accountable for the loss of lives.", "category": "India", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "5d101c29"}, {"headline": "No mandatory ethanol labels on petrol pumps, says government", "summary": "The Union government has decided not to make ethanol labeling mandatory on petrol pumps, citing potential confusion among consumers. The move comes after petrol pump owners expressed concerns about the costs and logistical challenges. The government stated it would continue with its ethanol blending program but will focus on other ways to inform the public about fuel quality.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "2e493fc3"}, {"headline": "Nine-year-old boy falls into borewell in Rajasthan; rescue ongoing", "summary": "A massive rescue operation is underway in Rajasthan for a nine-year-old boy who fell into an open borewell while chasing a kite. NDRF teams and local authorities are digging a parallel pit to reach the child, who is believed to be at a depth of 50 feet. Oxygen is being supplied into the borewell, and rescuers remain optimistic about his survival as the operation enters its second day.", "category": "India", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "9d94a1b5"}, {"headline": "Four killed as SUV overturns on Ganga Expressway", "summary": "Four people were killed and several others injured when their SUV overturned on the Ganga Expressway in Uttar Pradesh. The police believe a tire burst caused the driver to lose control of the vehicle at high speed. The injured have been admitted to a nearby hospital, and a case of accidental death has been registered as the investigation into the crash continues.", "category": "India", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "d2c3735b"}, {"headline": "Mamata Banerjee seeks swift EC decision on TMC dispute", "summary": "West Bengal CM Mamata Banerjee has urged the Election Commission to make a swift decision on the dispute regarding the Trinamool Congress’s official status and symbol. The dispute began after a faction of the party challenged her leadership and claimed to be the real TMC. Banerjee stated that a quick resolution is essential for the party’s preparation for upcoming local elections.", "category": "Politics", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "386e11ec"}, {"headline": "CERT-In hacker flags new security flaw in government digital system", "summary": "A hacker who was previously asked by CERT-In to tone down his social media posts has flagged a new security flaw in the government’s digital infrastructure. The hacker claimed the flaw could allow unauthorized access to sensitive citizen data. CERT-In is currently investigating the claim and has stated that it is working to fix any potential vulnerabilities to ensure data security.", "category": "Technology", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "5d4e1e44"}, {"headline": "Punjab government to respond on High Court Chief Justice appointment", "summary": "The Punjab government has stated it will soon respond to the Supreme Court collegium’s recommendation for the appointment of a new High Court Chief Justice. The process has been delayed due to several rounds of consultations between the state and the Centre. The government emphasized it is committed to following the constitutional process to ensure the best candidate is selected.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "3baecbe0"}, {"headline": "Meta removes pornographic ads hijacking user phones after government flag", "summary": "Meta has removed several advertisements for pornographic apps that were allegedly hijacking users’ phones after being flagged by the Indian government. The company has also banned the accounts responsible for the ads. The move comes amid a broader government crackdown on malicious digital content and the spread of harmful apps that compromise user privacy and data security.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "baedcc4d"}, {"headline": "RSS chief Mohan Bhagwat praises 'unity in diversity' in Canada", "summary": "RSS chief Mohan Bhagwat praised India’s value of 'unity in diversity' during an address to the Indian diaspora in Canada. Bhagwat stated that India’s cultural richness comes from its ability to embrace different beliefs while remaining united. He urged the diaspora to continue promoting Indian values abroad and contribute to the country’s growth and global influence.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "3e0431be"}, {"headline": "Japan seeks record $55.6 billion defense budget amid regional threats", "summary": "Japan’s defense ministry has requested a record $55.6 billion budget for the next fiscal year to counter growing regional security threats. The budget includes funding for advanced missile systems, stealth fighters, and a new command center. The move reflects Japan’s shift toward a more proactive defense posture as it seeks to maintain stability and deter aggression in East Asia.", "category": "World", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "1c6810f4"}, {"headline": "U.S. military has no plans to deploy for midterm polls", "summary": "The U.S. military has officially stated it has no plans to deploy troops for the upcoming midterm elections, dismissing rumors of potential military involvement. The Pentagon emphasized that the military remains apolitical and its role is to protect the nation from external threats. The statement was issued to reassure the public about the neutrality of the armed forces during the polls.", "category": "World", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "61d62568"}, {"headline": "Government reduces financial support for silicon fabs to 40%", "summary": "The Union government has reduced financial support for domestic silicon fabrication units from 50% to 40% under its Semicon 2.0 scheme. The move aims to encourage more private investment and reduce the government’s fiscal burden. However, the government will continue to provide other incentives and infrastructure support to boost India’s semiconductor manufacturing ecosystem.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "49b7d2ef"}, {"headline": "Airline pilots' association raises concerns over A321 tailstrikes", "summary": "The Indian airline pilots' association has raised concerns over an increasing number of tailstrike incidents involving Airbus A321 aircraft. The body has requested the AAIB to conduct a detailed investigation into the causes, including pilot training and aircraft maintenance. The association stated that preventive measures must be taken to ensure the safety of passengers and crew.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "8c85b373"}, {"headline": "Adani Group shares lose $15 billion in market value", "summary": "Shares of several Adani Group companies lost nearly $15 billion in market value after a closing auction fueled massive price swings. The sudden drop was attributed to large-scale selling by institutional investors during the final minutes of trading. The group’s shares have been under pressure recently due to ongoing regulatory investigations and negative market sentiment about its growth.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "55c3aa30"}, {"headline": "Pakistan cricket coach sacked after poor series performance", "summary": "The Pakistan Cricket Board has sacked the national team’s coach and sent seven players home following a disappointing series performance. The move is part of a major overhaul aimed at improving the team’s discipline and performance ahead of future international tournaments. The PCB stated it would announce a new coaching staff and a revamped squad within the next few weeks.", "category": "Sports", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "94333a55"}, {"headline": "Liverpool signs winger Bradley Barcola for record £124 million", "summary": "Liverpool has signed French winger Bradley Barcola from PSG for a club-record fee of £124 million. The young player is expected to add significant pace and creativity to the team’s attack as they aim for the Premier League title this season. Barcola’s signing is one of the most expensive in English football history and reflects Liverpool’s commitment to strengthening its squad.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "3cbe9de9"}, {"headline": "Rohit Rajpal to run for AITA president post", "summary": "Indian tennis veteran Rohit Rajpal has announced his candidacy for the post of president of the All India Tennis Association (AITA). Rajpal, who has been a long-time member, stated his main goal is to promote tennis at the grassroots level and improve facilities for young players. His candidacy has received support from several state associations ahead of the upcoming elections.", "category": "Sports", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135888", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135888"}], "article_id": "91fb7369"}, {"headline": "Dry Spell Triggers Power Deficits and Load Shedding Across India", "summary": "A severe rainfall deficit in August forced farmers to increase irrigation pump usage, driving the national power deficit past 10 million units on August 27. The shortage has led to average load shedding of 2-3 hours daily. Grid operators are struggling with dwindling coal reserves and reduced hydropower output, testing the stability of the national power grid.", "category": "Infrastructure", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "6e1f59e1"}, {"headline": "India’s Equity Valuation Premium over Asian Peers Hits 2018 Lows", "summary": "India's stock market valuation premium over Asian and emerging-market equities has shrunk significantly. MSCI India now trades at a 57% premium over MSCI Asia, down from 71.5% at the end of 2024. While the reset improves India's relative appeal to global investors, the market has underperformed for nearly two years as capital shifts toward AI-heavy markets like Korea and Taiwan.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "9be30875"}, {"headline": "India Eases FDI Rules for E-commerce Inventory to Boost MSME Exports", "summary": "The government has allowed 100% foreign direct investment in inventory-based e-commerce models exclusively for exports. This move aims to help the 90 million registered MSMEs reach global markets by allowing foreign-funded firms to stock made-in-India goods. NITI Aayog estimates e-commerce exports could reach $200-300 billion by 2030, up from the current $5 billion.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "6d8d99cf"}, {"headline": "Randstad Survey: Work-Life Balance is Top Reason for Employee Resignations", "summary": "A survey of 3,499 respondents by Randstad found that 49% of Indian workers cite work-life balance as the primary reason for leaving jobs. This concern is highest among Gen Z (50%) and Millennials (51%). Other key factors include lack of career growth (42%), low compensation (41%), and poor management relations (32%).", "category": "India", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "c03cd1ea"}, {"headline": "Digital NBFCs Gain Market Share in Personal Lending to Gen Z", "summary": "Digital NBFCs now account for 77% of digital personal loan volumes, catering largely to Gen Z customers. These digital natives, comprising 27% of India's population, prefer seamless mobile interfaces and embedded finance. Fintechs like Slice and Revolut are successfully challenging traditional banks by offering higher interest rates and user-friendly digital tools.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "357c142f"}, {"headline": "India Hits 1.2 Billion Active Mobile Subscribers in July", "summary": "India's active mobile subscriber base reached 1.2 billion in July, meaning approximately 80% of the population now has access to a mobile subscription. Additionally, data shows that 9.35% of .com webpages now show signs of AI editing, highlighting the rapid adoption of technology in content creation.", "category": "Technology", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "1e86553e"}, {"headline": "RBI’s FCNR Scheme Raises $72.85 Billion to Bolster Forex Reserves", "summary": "The RBI's foreign currency non-resident bank deposit window closed on August 31 after attracting much larger-than-expected inflows. Total mobilization, including other windows, reached $72.85 billion. While the scheme successfully built India's external liquidity buffer and foreign exchange reserves, it had a limited impact on arresting the rupee's decline against the dollar.", "category": "Economy", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "98c243af"}, {"headline": "Pernod Ricard India Restructures Operations Cutting 200 Management Jobs", "summary": "French spirits maker Pernod Ricard has reduced its India headcount to 1,400 as part of a major operational restructuring. At least 50 mid-to-senior management roles were cut between January and July 2026, with more exits expected by March 2027. The company is focusing resources on high-return premium categories despite a global slowdown in demand.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "4fb93cdf"}, {"headline": "India Invites Global Firms for Second Chip Fab Under Semicon 2.0", "summary": "The Centre is seeking investors for a second commercial semiconductor fabrication plant under the Semicon 2.0 program. The government will offer 40% cash incentives for facilities using standard 12-inch wafers. The project requires a minimum private capital deployment of ₹20,000 crore. The focus is on quality projects to boost India's strategic autonomy in the chip sector.", "category": "Technology", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "f3683343"}, {"headline": "Modi Meets Iranian President to Discuss West Asia Peace and Security", "summary": "Prime Minister Narendra Modi met Iranian President Masoud Pezeshkian to express concern over escalating regional tensions. Modi emphasized the need for dialogue, diplomacy, and the protection of civilians and commercial shipping. The leaders also reviewed bilateral ties, including the development of Iran's Chabahar port.", "category": "Politics", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "1dd4fcf4"}, {"headline": "Mandatory Silver Jewellery Hallmarking Likely to Start from October", "summary": "The Indian government plans to make silver jewellery hallmarking mandatory starting October to increase consumer protection. The Bureau of Indian Standards has already hallmarked 7.7 million pieces during a voluntary pilot. Non-compliant jewellers could face up to one year in prison or heavy fines. The move brings silver under the same regulatory rigor as gold.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "7b92ba5b"}, {"headline": "Sebi Considers Dynamic F&O Risk Warnings as Retail Losses Mount", "summary": "The Securities and Exchange Board of India is discussing with brokers the implementation of more frequent and dynamic risk warnings on trading platforms. Data shows individual retail traders lost ₹91,685 crore in the F&O segment during FY26, with 87.7% of traders incurring losses. The regulator aims to alert investors more effectively to the high risks involved.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "0280e0ab"}, {"headline": "Tata’s Agratas Partners with Chinese Firm AESC for Battery Tech", "summary": "Tata Group's battery venture, Agratas, disclosed a technology absorption pact with AESC Apollo Holding for manufacturing lithium-ion batteries. AESC, which has Japanese origins and Chinese ownership, will provide expertise in LFP and NMC battery chemistries. Agratas is currently building a 20GWh manufacturing facility in India and a 40GWh plant in the UK.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "046f0448"}, {"headline": "Electric Two-Wheelers Doubled Driving Range Over Last Six Years", "summary": "A review of EV models from Ola Electric, Ather Energy, and Tata Motors shows significant improvements in range and cost. Electric two-wheelers now offer ranges up to 300km, matching petrol scooters, at lower price points. Advancements in battery chemistry and software have narrowed the price gap, with EV penetration in cars and bikes growing steadily.", "category": "Technology", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "b118e49b"}, {"headline": "YRF and Sun TV Enter Microdrama Space as Consumption Habits Shift", "summary": "Mainstream entertainment giants Yash Raj Films and Sun TV are entering the vertical microdrama market to reach mobile-first audiences. While some early startups have exited the space, experts say consumer demand for short, serialized fiction remains high. The move allows major studios to test new intellectual property and reach younger demographics on mobile devices.", "category": "Culture", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "a7bd3331"}, {"headline": "Kotak Mahindra Bank Recommends Internal Candidates Saha and Kashyap for CEO", "summary": "Kotak Mahindra Bank has submitted the names of executive directors Anup Saha and Paritosh Kashyap to the RBI as potential successors to CEO Ashok Vaswani. Vaswani, who took office in early 2024, will step down in December 2026 for personal reasons. The regulator will decide on the final appointment for India's fourth-largest private lender.", "category": "Business", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "be9ff983"}, {"headline": "Old Monk to Remove ‘7 Years Old’ Claim from Labels", "summary": "Mohan Rocky Springwater, the maker of Old Monk rum, informed the Bombay High Court it will relabel its products to remove the '7 years old blended' declaration. The move follows pressure from the FSSAI, which argued the label could mislead consumers since the product contains spirits of younger ages. The company claims the ban has caused losses of ₹1 crore per day.", "category": "Law", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "e1b7f9a4"}, {"headline": "US and Iran Exchange Military Strikes in Strait of Hormuz", "summary": "US forces struck Larak Island in the Strait of Hormuz after Iran attempted to deploy mines in the waterway. Iran retaliated with drone and missile attacks on US air bases in Jordan and the UAE. Crude oil prices rose 2.4% to above $90 a barrel as the escalation threatens global energy supplies. Diplomacy remains deadlocked as both sides refuse to restart negotiations.", "category": "World", "page": 16, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "4683ad6e"}, {"headline": "C-DAC Develops Indigenous Sovereign AI Chip to Rival Nvidia", "summary": "India's C-DAC is developing a sovereign AI chip using 2nm fabrication technology to reduce dependency on foreign giants like Nvidia. The project, with a $200 million budget, has entered trial manufacturing. The chip is expected to be production-ready by 2029 and will be used for strategic deployments in defense, aerospace, and public services.", "category": "Technology", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135837", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135837"}], "article_id": "88a9071f"}, {"headline": "PM Modi urges Iran to ensure peace and freedom of navigation", "summary": "Prime Minister Narendra Modi met Iranian President Masoud Pezeshkian at the SCO summit in Kyrgyzstan. Modi called for stability in West Asia and freedom of navigation in the Strait of Hormuz. Pezeshkian requested India use its contacts to aid dialogue while blaming the U.S. and Israel for regional conflicts. Both leaders committed to expanding bilateral trade and the BRICS partnership.", "category": "Politics", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "807af813"}, {"headline": "Over 6 crore names deleted in third phase of electoral revision", "summary": "The Election Commission has removed over 6 crore names from electoral rolls during the third phase of the Special Intensive Revision (SIR). Carried out across 16 States and three UTs, the process saw a 17.04% deletion rate. Maharashtra recorded the highest absolute deletions at 2.06 crore, while Delhi saw the highest percentage drop at 32.78%. Final lists will be published starting September 6.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "e91b22a2"}, {"headline": "Manipur Deputy CM and 8 MLAs threaten to quit government", "summary": "Deputy CM Losii Dikho and eight other Naga MLAs have threatened to withdraw support from the BJP-led Manipur government. They are demanding action against fellow Deputy CM Nemcha Kipgen, accusing her of colluding with a Kuki insurgent group linked to the killing of Naga civilians. The group also called for the abrogation of the Suspension of Operation agreement with Kuki rebel groups.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "6192d8b0"}, {"headline": "Delhi Police seek to quash FIRs against NEET-UG protesters", "summary": "Following the Supreme Court's refusal to halt a planned protest march by the Cockroach Janta Party (CJP), the Delhi police moved to quash previous FIRs against student protesters. The police stated they no longer wish to pursue charges of rioting and damage to property from the July 20 crackdown. The court will hear the application to invoke Article 142 on September 1.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "265ac8b7"}, {"headline": "Jadavpur University students repaint graffiti despite CM warning", "summary": "Students at Jadavpur University repainted political graffiti on campus after the administration whitewashed previous works following a warning from West Bengal officials. The students claim the move is an artistic resistance to 'reclaim' the walls. The Vice-Chancellor discouraged the practice, while opposition leaders argued for the freedom of expression and dissent on campus.", "category": "Education", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "432f8f88"}, {"headline": "Delhi CEO clarifies 47.56 lakh voter deletions in draft roll", "summary": "Delhi's Chief Electoral Officer published a draft roll showing the removal of 47.56 lakh voters. Poll officials stated the deletions were based on unreturned forms during the Special Intensive Revision. Over 33 lakh voters will receive notices to address anomalies like mismatched names or age gaps. AAP leader Arvind Kejriwal criticized the scale of exclusions, while the BJP defended the process.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "3a10b54a"}, {"headline": "Delhi CM orders sealing of playschool after alleged sexual assault", "summary": "Chief Minister Rekha Gupta has directed the sealing of a private day care facility in Jaffrabad after a three-year-old boy was allegedly sexually harassed and assaulted. A staff member was arrested under the POCSO Act. In a separate incident, an employee was arrested for the alleged assault of a girl at an unrecognised school in Bawana. Education panels have been formed to probe both cases.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "4a35c556"}, {"headline": "AAP protests against alleged 40 crore bicycle procurement scam", "summary": "The Aam Aadmi Party staged a protest near the Delhi Secretariat, accusing the BJP government of a ₹40 crore scam in bicycle procurement. AAP leaders alleged that 1.3 lakh bicycles were purchased at ₹7,000 each, while the market rate is ₹4,000. The Delhi BJP dismissed the claims as 'hit-and-run' allegations intended to distract from other issues.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "3d162f5b"}, {"headline": "Kerala government and Governor settle Vice-Chancellor appointment dispute", "summary": "The Kerala government and Governor Rajendra Vishwanath Arlekar reached a formal settlement regarding the appointment of Vice-Chancellors at KTU and DUK. Following a Lok Adalat conciliation, both parties agreed that current V-Cs will continue their terms. The Supreme Court disposed of the related petitions, ending months of legal conflict over university chancellorship powers.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "cb427946"}, {"headline": "CID arrests key middleman in Karnataka veterinary officer recruitment scam", "summary": "The Criminal Investigation Department arrested Basavaraj Kannale, an alleged kingpin in the Karnataka Public Service Commission recruitment scam. The arrest took place in Delhi. Previously, the CID had arrested IAS officer Gnanendra Kumar Gangwar. The case involves alleged irregularities in the recruitment of veterinary officers and has sparked political sparring between the BJP and Congress.", "category": "India", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "7b057c2a"}, {"headline": "Uttar Pradesh to appoint Gen Z reel makers as cultural ambassadors", "summary": "The UP Tourism Department has launched the 'Visit My State Uttar Pradesh' campaign, inviting Gen Z content creators to share 60-second reels showcasing their cities. Winners will be appointed as cultural ambassadors to promote local heritage, food, and traditions. The initiative aims to leverage short-form digital content to reach younger audiences and boost regional tourism pride.", "category": "Culture", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "5830e2ce"}, {"headline": "Kerala CM orders SIT probe into suspected Messi event tax fraud", "summary": "Chief Minister V.D. Satheesan directed the formation of an SIT to investigate suspected tax fraud and corruption related to a failed attempt to bring Lionel Messi and the Argentina football team to Kochi. A finance department inquiry found suspected GST evasion of over ₹22 crore on foreign remittances made by a sponsoring news company. The probe will also look into a conspiracy to defraud the treasury.", "category": "Politics", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "30d88d7e"}, {"headline": "Noida police arrest two for gang-rape of minor on moving bus", "summary": "A 17-year-old girl was allegedly gang-raped by a bus driver and conductor inside a sleeper bus in Noida. The victim had mistakenly reached Pari Chowk and was offered a lift. The accused were arrested in north Delhi after the girl reported the incident at Kashmere Gate. The case has sparked a political row over women's safety in the NCR, with the NHRC seeking an investigation report.", "category": "India", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "2f9a509e"}, {"headline": "Supreme Court criticizes probe agencies for leniency toward powerful individuals", "summary": "A three-judge SC Bench headed by CJI Surya Kant observed that investigative agencies often 'drag their feet' when questioning persons in authority compared to ordinary citizens. The remarks came during a hearing for Sumit Roy, an assistant to TMC MP Abhishek Banerjee. The court questioned the lack of intensity in interrogations involving overlapping proceeds of crime and influential figures.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "d5ea0fd5"}, {"headline": "Congress labels 7.8% GDP growth numbers a 'Distorted Picture'", "summary": "The Congress party questioned the recently released 7.8% GDP growth figures for Q1, with Jairam Ramesh calling them a 'Greatly Distorted Picture'. Ramesh argued that private investment sentiment remains depressed and consumer confidence is at a post-pandemic low. He highlighted rising household debt, falling savings, and the concentration of wealth as evidence of a struggling real economy.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "bee5f951"}, {"headline": "Conman Sukesh Chandrasekhar sentenced to 8 years for impersonating judge", "summary": "A Delhi court sentenced Sukesh Chandrasekhar to eight years of rigorous imprisonment for impersonating a Supreme Court judge. In 2017, the accused made calls to a judicial officer using a regional accent to attempt to influence bail proceedings. The court found him guilty under multiple IPC sections, including personating a public servant and criminal intimidation.", "category": "Law", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "f719b844"}, {"headline": "India's GDP growth slows to 7.8% in Q1 FY27", "summary": "India's GDP grew by 7.8% in the April-June 2026 quarter, down from 8.6% in the previous quarter but higher than last year's 6.9%. The growth was led by a 9.2% rise in manufacturing and a 12.1% surge in financial and IT services. Agriculture slowed to 3.6%, and mining contracted by 2.4%. Capital formation increased to 34.3% of GDP, indicating robust private and government expenditure.", "category": "Economy", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "dadb4bda"}, {"headline": "AstroRad vest tested on Artemis I to shield astronauts from radiation", "summary": "A study published in Science Advances reveals that the AstroRad vest, tested during NASA's Artemis I mission, can significantly reduce radiation exposure for astronauts. Using hydrogen-rich polymers, the vest can cut doses from major solar storms by 40% to 60%. This technology is crucial for protecting crew members from cancer risks during long-duration missions to the moon and Mars.", "category": "Technology", "page": 20, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135806", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135806"}], "article_id": "50fb9e47"}, {"headline": "GDP accelerates to 7.8% in Q1 on all-round growth", "summary": "India's GDP grew 7.8% in Q1 FY27, up from 6.7% in the previous quarter, led by strong performances in manufacturing (9.2%) and investment (11.9%). Chief Economic Advisor V Anantha Nageswaran noted the numbers reflect continued resilience despite global headwinds such as geopolitical tensions and volatile crude prices.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "300283bf"}, {"headline": "Brands chase India’s 100-m-strong anime fanbase", "summary": "Major brands like Toyota, Oppo, and Disney are targeting India's estimated 100 million anime fans through themed products, merchandising, and marketing campaigns. The trend reflects a massive surge in youth interest in Japanese pop culture, fashion, and food across the country.", "category": "Culture", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "acc10864"}, {"headline": "Tata, Javelin JV team up for anti-tank missiles", "summary": "Tata Advanced Systems and the US-based Javelin Joint Venture have signed an MoU to explore co-production of the Javelin anti-tank guided missile in India. The move aims to strengthen bilateral defense ties and establish a local assembly and integration facility for the shoulder-fired weapon system.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "99d3c722"}, {"headline": "How Zee founder Chandra’s repayment plan survived legal scrutiny", "summary": "The NCLT approved a repayment plan for Zee founder Subhash Chandra involving a ₹6.5 crore settlement against ₹22,006 crore in claims. Despite objections from some lenders regarding the role of the Resolution Professional and asset valuation, the tribunal upheld the plan based on an 81% majority approval from the creditors' committee.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "8f1eeb55"}, {"headline": "Mahindra Aerostructures to make fuselage skins for Airbus A320", "summary": "Mahindra Aerostructures has secured a contract from Airbus to manufacture fuselage skins for the A320 aircraft family at its Bengaluru facility. The deal includes the production of eight fuselage skins and three fuselage sections, reinforcing Airbus's 'Make in India' commitment and deepening Mahindra’s aerospace capabilities.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "efcf8ecf"}, {"headline": "Mapping Himalayan glacier risks easier than taking preventive action", "summary": "Scientists in India are using satellite imagery and advanced modeling to identify high-risk glacial lakes in the Himalayas. However, experts warn that physical intervention to drain lakes or build protective structures remains difficult due to extreme altitudes, hazardous terrain, and unpredictable weather conditions.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "ac900fb7"}, {"headline": "August ends with 16% below-normal rainfall in India", "summary": "India received 16% below-normal rainfall in August, with the overall monsoon season recording a 7% deficit so far. The IMD predicts that September rainfall will also likely be below normal, which could impact crop yields in central and southern parts of the country.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "d0c9ec8d"}, {"headline": "FPI assets under custody rise 12% in July", "summary": "Foreign Portfolio Investors' (FPI) assets under custody in India grew 12% to ₹8.5-lakh crore in July, reversing a previous period of decline. The recovery is attributed to strong performance in equity markets and recent regulatory changes that have improved investor sentiment and eased compliance for FPIs.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "deff60de"}, {"headline": "IOCL targets gas sales of over 10.5 mt by 2030", "summary": "Indian Oil Corporation (IOCL) aims to double its natural gas sales to over 10.5 million tonnes by 2030. The PSU plans to expand its LNG import infrastructure and city gas distribution network, targeting a significant presence across the entire gas value chain to support India's shift to cleaner fuels.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "2fca8e4b"}, {"headline": "Steel prices expected to rise ₹2,000/t on firm demand", "summary": "Domestic steel prices are set to increase by up to ₹2,000 per tonne in September, driven by a post-monsoon recovery in demand and rising input costs for coal. Strong activity in the construction and automobile sectors is supporting the hike as mills look to improve their margins.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "41a98135"}, {"headline": "Mahajan Imaging, Neuberg form JV for North India expansion", "summary": "Mahajan Imaging and Neuberg Diagnostics have formed a joint venture to provide advanced pathology and genomics services across North India. The partnership aims to establish 10 high-end laboratories and 200 collection centers over the next three to five years, focusing on specialized diagnostics.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "521f65c6"}, {"headline": "Concord Biotech investor sells stake in ₹294-cr bulk deal", "summary": "A public shareholder of Concord Biotech sold nearly 2% of the company's shares for ₹294 crore through an open market transaction. DSP Mutual Fund was a major buyer in the deal, increasing its holding in the biotech firm, which saw its stock price fall slightly following the sale.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "e90413dd"}, {"headline": "Strong revenue receipts trim fiscal deficit to 27% of target", "summary": "India's fiscal deficit for the first four months of FY27 stood at ₹4.55 lakh crore, or 27% of the full-year target. The improvement from 29.9% last year is attributed to robust tax collections and a substantial dividend from the RBI. Net tax revenue reached ₹8.44 lakh crore, representing 32.9% of the budget estimate.", "category": "Economy", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "b3b1ebf6"}, {"headline": "Centre transfers ₹3.72 lakh crore as tax devolution to States", "summary": "The central government has transferred ₹3,72,354 crore to state governments as their share of taxes for the April-July period of FY27. This 38% increase from the previous year was driven by higher collections in GST, customs, and income tax, helping states fund their development projects.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "8059f433"}, {"headline": "SpiceJet seeks time to pay ₹50 crore in Kal Air dispute", "summary": "SpiceJet has requested the Delhi High Court for more time to pay ₹50 crore to Kalanithi Maran’s Kal Air as part of an ongoing legal dispute. The airline stated it has received a tranche of emergency credit from the government but needs to prioritize those funds for its immediate operations.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "fc41fa6a"}, {"headline": "Government plans to ease FDI norms in defense sector", "summary": "The Centre is considering further liberalizing foreign direct investment (FDI) rules in the defense sector to attract more global manufacturers. While up to 74% FDI is currently allowed through the automatic route, the new proposal aims to simplify the approval process for higher investment stakes.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "1aadba9a"}, {"headline": "China's factory rebound masks domestic economic growth risks", "summary": "China's manufacturing sector showed a slight recovery in August, but weak domestic demand and a persistent property market slump continue to pose risks to the economy. The official manufacturing PMI stayed below 50, indicating contraction as factory owners struggle with low orders and price pressures.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "0458154b"}, {"headline": "Bank credit grows 16.5% in June, deposits at 11.5%", "summary": "RBI data shows bank credit grew by 16.5% year-on-year in June 2026, driven by strong demand from the services and household sectors. Deposit growth remained steady but lower at 11.5%, highlighting a continuing challenge for banks to mobilize long-term funds to support lending expansion.", "category": "Economy", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "0d16a97c"}, {"headline": "Coal India to launch IPOs of three major subsidiaries", "summary": "State-run Coal India plans to launch initial public offerings (IPOs) for three of its subsidiaries—Mahanadi Coalfields, South Eastern Coalfields, and Western Coalfields. The move is part of a strategy to unlock value and support the group’s diversification into clean energy and coal gasification projects.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "7438fc07"}, {"headline": "Karur Vysya Bank opens 16 new branches across India", "summary": "Karur Vysya Bank expanded its footprint by opening 16 new branches in states including Tamil Nadu, Andhra Pradesh, and Delhi-NCR. The bank now has 919 branches, as it aims to strengthen its physical presence to complement its digital banking services and reach more retail and SME customers.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "e1cf8769"}, {"headline": "Uzbekistan becomes 11th nation to adopt India's UPI", "summary": "NPCI International has partnered with Uzbekistan’s NIPC to enable UPI payments in the Central Asian country. Uzbekistan is the 11th country to adopt the Indian payment system, which will facilitate easier cross-border transactions for tourists and businesses from both nations.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "ad517601"}, {"headline": "Sugar prices drop as government increases mill sale quotas", "summary": "Sugar prices in India have fallen across retail and wholesale markets after the government allowed mills to sell more stock. The move aims to improve domestic availability and keep prices stable for consumers ahead of the upcoming festive season.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "15d2418a"}, {"headline": "Centre releases 13 lakh tonnes of sugar for Sept sale", "summary": "The Indian government has allocated a 13-lakh tonne sugar quota for domestic sale in September. This higher allocation is intended to ensure adequate supply and prevent price spikes during major festivals like Ganesh Chaturthi and Janmashtami.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "fdf85928"}, {"headline": "Weather woes in Brazil and El Nino fuel coffee price rise", "summary": "Global coffee prices surged in July due to adverse weather in Brazil and the strengthening El Niño phenomenon. While international prices for arabica have risen significantly, the impact on Indian domestic retail prices has been gradual so far but is expected to increase soon.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "a70a32b1"}, {"headline": "India's coconut exports surge 62% to record ₹7,038 crore", "summary": "Coconut exports from India reached a record ₹7,038 crore in FY26, a 62% increase over the previous year. Growth was driven by high demand for value-added products like activated carbon and virgin coconut oil in over 155 countries, including the US and European markets.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "8b86c08f"}, {"headline": "Defense PSU turnover grows 15.4% to ₹1.29 lakh crore", "summary": "India's Defense Public Sector Undertakings (DPSUs) reported a 15.4% turnover growth to ₹1.29-lakh crore in FY26. Net profit also rose by 15.6% to ₹23,136 crore, reflecting the government's push for indigenous manufacturing and increased exports of defense equipment.", "category": "Business", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "f2194774"}, {"headline": "SC dismisses plea for mandatory ethanol disclosure at pumps", "summary": "The Supreme Court dismissed a petition seeking mandatory disclosure of ethanol content in fuel at petrol pumps. The court stated that the current policy promotes green energy goals and that existing consumer protection laws do not require such specific labeling for blended fuel.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "01942a77"}, {"headline": "Telangana submits DPRs for ₹50,870 crore rail projects", "summary": "The Telangana government has submitted detailed project reports for rail projects worth ₹50,870 crore to the Railway Board. The projects include 17 new rail lines covering 2,300 km, aimed at improving regional connectivity and supporting the state's industrial growth.", "category": "Infrastructure", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "d635de47"}, {"headline": "PE/VC fund-raising in India hits record $23.7 billion in 2026", "summary": "Private equity and venture capital fund-raising in India reached a record $23.7 billion in the first seven months of 2026. This 52% increase from the previous year was driven by large fund-raises from firms like Bain Capital, IIFL, and ChrysCapital, signaling strong investor confidence.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "e1a60d88"}, {"headline": "Air India Express reports ₹6,748 crore loss for FY26", "summary": "Air India Express reported a net loss of ₹6,748 crore for FY26, citing high fuel costs and adverse currency fluctuations. However, the airline saw a 20% growth in revenue and expects performance to improve as it completes its integration with AIX Connect.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "52be207b"}, {"headline": "IndiGo manages flight network despite ongoing aircraft groundings", "summary": "IndiGo is maintaining its domestic flight network without canceling routes despite facing aircraft groundings due to engine issues. The airline has adjusted its frequencies and redeployed planes to high-demand sectors, keeping its domestic market share stable at around 63%.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "49c83a2e"}, {"headline": "Zomato to delist restaurants selling unlabeled analogue dairy dishes", "summary": "Zomato has announced a zero-tolerance policy against restaurants selling 'analogue' dairy products, such as vegan paneer or butter, without clear labeling. The move follows a ban by the Maharashtra FDA and aims to ensure transparency in food quality for consumers.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "0ca3a10d"}, {"headline": "Orange Health expands into radiology and home-based diagnostics", "summary": "Health-tech startup Orange Health is diversifying its services by expanding from pathology into radiology, including home-based diagnostics. The company expects its revenue to exceed ₹130 crore in FY26 as it increases its physical presence and service offerings across major cities.", "category": "Health", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "2e3db49b"}, {"headline": "IT veteran Ashok Soota continues his success streak with four companies", "summary": "The article profiles IT industry veteran Ashok Soota, highlighting his success in building four major companies: Wipro, Mindtree, Happiest Minds, and his latest venture in medical relief. It reflects on his leadership style and his significant contribution to India's technology sector over several decades.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "4bbf95ad"}, {"headline": "Cipla to commercialize new breast cancer drug in India", "summary": "Cipla has signed a licensing agreement with Hong Kong-based Sino Biopharmaceutical to commercialize a new cancer drug, 'Rolidatamiq Deuderuxtecan', in India. The drug is aimed at treating breast cancer and other solid tumors, providing a new treatment option for patients in the country.", "category": "Health", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135829", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}], "article_id": "a412a972"}, {"headline": "Calcutta HC Cancels All Post-2010 OBC Certificates in West Bengal", "summary": "The Calcutta High Court cancelled all OBC certificates issued in West Bengal after 2010, affecting nearly 5 lakh people. The court ruled the inclusion of 77 communities, primarily Muslims, was illegal and bypassed the Backward Classes Commission. The order does not impact those already in service or who have completed recruitment, but Chief Minister Mamata Banerjee has vowed to challenge it.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "1351d977"}, {"headline": "Fifth Phase of Lok Sabha Polls Records 60.5 Percent Voter Turnout", "summary": "The fifth phase of the general elections across 49 constituencies in six states and two UTs saw a tentative turnout of 60.5%. While the process was largely peaceful, minor clashes were reported in parts of West Bengal. Key candidates in this phase included Rahul Gandhi from Rae Bareli and Smriti Irani from Amethi. The Election Commission noted turnout was slightly lower than 2019 figures.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "b8876660"}, {"headline": "Pune Porsche Case: Doctors Arrested for Swapping Minor's Blood Sample", "summary": "Pune police arrested two doctors and a staff member from Sassoon General Hospital for allegedly swapping the blood sample of the 17-year-old Porsche driver. The accused replaced the minor’s sample with that of another person to hide alcohol consumption during the medical examination. The state government has formed a committee to investigate the hospital’s forensic department conduct.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "64aa1ee2"}, {"headline": "Supreme Court Refuses to Extend Arvind Kejriwal’s Interim Bail", "summary": "The Supreme Court registry declined an urgent listing of Delhi CM Arvind Kejriwal’s plea for a seven-day extension of his interim bail on medical grounds. The court observed that since the main judgment is reserved and he was given liberty to move the trial court for regular bail, the plea was not maintainable. Kejriwal is scheduled to surrender at Tihar Jail on June 2 after polling ends.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "f251ba57"}, {"headline": "One Dead and Dozens Injured on Turbulent Singapore Airlines Flight", "summary": "A 73-year-old British man died and over 30 people were injured after a Singapore Airlines flight from London hit severe turbulence over the Irrawaddy Basin. The Boeing 777-300ER was forced to make an emergency landing in Bangkok. Passengers described a sudden drop that threw unbuckled people into the overhead cabins. Singapore’s transport ministry is investigating the incident.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "a5884843"}, {"headline": "KKR Advance to IPL Final with Dominant Win Over SRH", "summary": "Kolkata Knight Riders secured a place in the IPL 2024 final after a crushing eight-wicket victory over Sunrisers Hyderabad in Qualifier 1. Mitchell Starc’s early three-wicket burst dismantled the SRH batting line-up, holding them to 159. Half-centuries from Venkatesh Iyer and Shreyas Iyer helped KKR chase the target in 13.4 overs. SRH will play the winner of the Eliminator in Qualifier 2.", "category": "Sports", "page": 20, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "0d4149b5"}, {"headline": "Thousands Attend Funeral Rites for Late Iranian President Ebrahim Raisi", "summary": "Massive funeral processions began in Iran for President Ebrahim Raisi and Foreign Minister Hossein Amir-Abdollahian following their deaths in a helicopter crash. Supreme Leader Ayatollah Ali Khamenei led prayers in Tehran as thousands mourned the leaders. Representatives from various regional allies attended. Iran is preparing for a snap presidential election scheduled for June 28.", "category": "World", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "8b89ae5c"}, {"headline": "UGC Approves Biannual Admission Cycle for Higher Education Institutions", "summary": "The University Grants Commission has approved a plan allowing universities to offer admissions twice a year, in July-August and January-February. UGC Chairman M. Jagadesh Kumar stated this would benefit students who miss the summer cycle due to delayed results or health issues. The move is expected to increase the Gross Enrolment Ratio and help India become a global study destination.", "category": "Education", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135796", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135796"}], "article_id": "da644039"}, {"headline": "Severe Heatwave Grips North India as Temperatures Touch 48 Degrees", "summary": "Intense heatwave conditions persisted across Northern and Central India, with Rajasthan’s Sirsa recording a high of 47.8 degrees Celsius. The IMD issued a red alert for Delhi and Punjab, predicting no immediate respite. The extreme weather has pushed power demand to record highs in the National Capital Region, while authorities have warned of increased heat-related health risks.", "category": "Environment", "page": 5, "importance": 8, "telegram_url": "https://
