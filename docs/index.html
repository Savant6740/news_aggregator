perators can now buy cash directly from issue offices", "summary": "RBI allowed white-label ATM operators to buy cash directly from issue offices, in addition to sourcing from banks, potentially easing replenishment and expanding rural access.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "accda523"}, {"headline": "Nomura raises RBI rate-hike call to 50 bps", "summary": "Nomura raised its RBI December policy rate hike forecast to 50 bps from 25 bps, citing a sharper food price increase. Bank of Baroda also expects a 25 bps hike.", "category": "Economy", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "19377cbf"}, {"headline": "K’taka issues show-cause notice to Indian Oil terminal", "summary": "Karnataka issued a show-cause notice to an Indian Oil terminal in Bengaluru over discrepancies in ethanol-petrol blending, citing tests showing over 20% ethanol.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "e0a40ca0"}, {"headline": "Pakistan’s space capability improving with China’s help: CDS Subramani", "summary": "CDS Gen N S Subramani stated Pakistan's space capability is improving with China's help, which must be factored into India's strategic calculus.", "category": "Politics", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "47af550e"}, {"headline": "Strobe Talbott, architect of India-US ties post Pokhran-II, dies at 80", "summary": "Strobe Talbott, former US Deputy Secretary of State and key architect of India-US relations post-1998 nuclear tests, died at 80. He played a crucial role in bridging ties.", "category": "Politics", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "0dd7bab5"}, {"headline": "China-Russia-US in Shenzhen: Why it matters", "summary": "The trilateral summit suggests a bipolar US-China condominium, with Russia less influential, creating a challenging geopolitical landscape for India. It impacts regional stability.", "category": "Politics", "page": 9, "importance": 9, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "52ca6b84"}, {"headline": "Bihar’s Bahubali fixation", "summary": "The article discusses the persistent influence of 'Bahubalis' (strongmen) in Bihar politics, highlighting how criminal backgrounds do not hinder electoral success, impacting governance and societal issues.", "category": "Politics", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "7316c665"}, {"headline": "IPO will damage Tata soul", "summary": "The article argues that an IPO for Tata Sons could damage its 'soul' and culture, citing examples of leadership behaviour and the impact of shareholder capitalism on corporate identity.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "3eb80779"}, {"headline": "IT, bank heavyweights drag mkts down 1%", "summary": "Nifty 50 fell 1.07% and Sensex lost 1.17% on Friday, impacted by rising crude oil prices and geopolitical tensions. IT and bank stocks were major drags.", "category": "Business", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "d317f1d2"}, {"headline": "Small, midcap funds retain folio lead despite fall in inflows", "summary": "Small and midcap funds continue to dominate active equity folio additions, though overall inflows declined in October. Experts cite growth expectations and relative performance.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "4436ace5"}, {"headline": "Retail investors must be cautious on FPI picks", "summary": "Analysts advise retail investors to scrutinize FPI stock purchases, considering pre-IPO capital and potential selling pressure. Tracking promoter stake changes is also recommended.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "5ce3cc7c"}, {"headline": "Facing a gold loan auction? Know all your options", "summary": "The article outlines steps for borrowers facing gold loan auctions, including understanding notices, verifying valuations, attending auctions, and claiming surplus refunds. Legal advice is recommended.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "6ed2321f"}, {"headline": "Pet insurance: What is covered and why claims may get rejected", "summary": "Pet insurance covers illnesses, accidents, and consultations, but exclusions like pre-existing conditions and waiting periods can lead to claim rejection. Careful policy review is essential.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "6ec486f3"}, {"headline": "IndiGo stock gains altitude, but oil, geopolitics and rupee remain key monitorables", "summary": "IndiGo stock is up 22% in a month. While fuel costs and rupee have eased, oil prices and geopolitics remain key monitorables. The airline has strong cash and a large aircraft order book.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "716c5bf8"}, {"headline": "The boy who died in Harry Potter gets a licence to survive (and kill)", "summary": "Robert Pattinson, known for playing characters facing death like Cedric Diggory and Batman, takes on the iconic role of James Bond, navigating a changing definition of cinematic heroism.", "category": "Culture", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "c6aca0e6"}, {"headline": "Tourism hotspot Goa may feel the chill this winter", "summary": "Goa's air passenger traffic declined 9% Y-o-Y in H1FY27, with fewer flights scheduled for Nov-Dec. Higher airfares and competing destinations may impact demand.", "category": "Business", "page": 23, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "b0fc6e01"}, {"headline": "100 Indian chess grandmasters mask financial squeeze", "summary": "Despite 100 Indian GMs, upcoming players face financial strain for travel and coaching, with limited support from sponsors and governments compared to established names.", "category": "Sports", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "bae70ea1"}, {"headline": "Belonging: A Journey of Love by Sonia Gandhi", "summary": "Sonia Gandhi's memoir 'Belonging' recounts her life in India, her family's challenges, and her political journey. It offers insights into her personal and public life.", "category": "Culture", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145018", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/145018"}], "article_id": "afc59874"}, {"headline": "SEBI proposed tenure curbs may trigger leadership changes at NSE, BSE", "summary": "Proposed SEBI regulations capping the tenure of heads at Market Infrastructure Institutions (MIIs) to 15 years could lead to leadership exits at India's top bourses. Current NSE CEO Ashishkumar Chauhan and BSE MD Sundararaman Ramamurthy may be affected by 2027 if the rules are implemented. The move aims to prevent concentration of decision-making power and ensure professionalized management.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "cc71d6ca"}, {"headline": "Nifty ends winning streak as crude oil prices approach $100 barrel", "summary": "Indian benchmark indices snapped a four-week winning streak on Friday as rising global crude oil prices and a weakening rupee dampened investor sentiment. The Nifty 50 and BSE Sensex both fell over 1% as Brent crude climbed toward $98. The rupee hit an all-time low of 93 against the US dollar, driven by concerns over potential supply disruptions in West Asia and persistent inflation.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "7a6468ae"}, {"headline": "CERT-In warns of security vulnerabilities in WhatsApp for various platforms", "summary": "The Computer Emergency Response Team (CERT-In) has issued a high-severity warning regarding multiple vulnerabilities in WhatsApp and WhatsApp Business. These flaws could allow remote attackers to execute arbitrary code or bypass security restrictions on Android, iOS, Windows, and Mac systems. Users are advised to update to the latest versions to mitigate risks of unauthorized data access.", "category": "Technology", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "8573d6d3"}, {"headline": "Adani Group plans IPO for airport business by fiscal year 2028", "summary": "Adani Group CFO Jugeshinder Singh announced plans to list the conglomerate's airport business by FY28. The group intends to invest $140 billion over the next five years across infrastructure and energy sectors. The airport division, which currently generates about 60% of its revenue from non-aeronautical sources, is expected to see significant growth as India's air travel demand increases.", "category": "Business", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "fa60e4a1"}, {"headline": "Gold share in India’s forex reserves falls below 14 percent", "summary": "The share of gold in India's total foreign exchange reserves has dropped to 13.98%, its lowest level since early 2025. This decline is attributed to a sharp correction in international gold prices, which fell to approximately $3,884 per ounce. Despite the drop in value, the physical holdings of the Reserve Bank of India remained stable at roughly 880.18 tonnes as of late 2026.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "de4c4eb9"}, {"headline": "Indian Oil Corporation to invest 800 crore in Vadodara project", "summary": "Indian Oil Corporation (IOC) is moving forward with a ₹800 crore investment to establish a new petrochemical facility at its Gujarat refinery in Vadodara. The project will focus on a Benzene, Toluene, and Xylene (BTX) unit, which provides essential feedstocks for various chemical products. The facility is expected to be commissioned within the next three years to meet rising demand.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "56e0de50"}, {"headline": "BMW India targets 20,000 unit sales in 2026 despite price hikes", "summary": "BMW Group India aims to cross the 20,000-unit sales milestone in 2026, supported by an expanded EV portfolio and new MINI models. The luxury carmaker also announced price increases of 2% to 4% effective January 2027 to offset currency fluctuations and rising input costs. The company notes that EVs now account for nearly 30% of its sales, with demand growing in non-metro markets.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "0ab274b5"}, {"headline": "Uppal Brewers & Distillers targets 100% volume growth for fiscal 2027", "summary": "Uppal Brewers & Distillers (UBD) expects to double its sales volume in FY27, reaching 70,000 cases. The growth strategy includes expanding its premium whiskey brand, Soorahi, into new markets like Uttar Pradesh and Karnataka. The company is also exploring external funding of up to ₹100 crore over the next year to support its expansion and marketing efforts across India.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "7c60074c"}, {"headline": "Jewellery sales lead retail growth during Indian festival season", "summary": "A report by the Retailers Association of India (RAI) shows that the jewellery category recorded the strongest growth at 12.2% during the 2026 festival season. Overall retail sales grew by 9.2%, with North India leading the gains. While high gold prices initially slowed demand, consumer interest shifted toward lighter jewellery and gold coins toward the end of the season.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "386e95eb"}, {"headline": "Rane Madras seeks to reduce revenue dependence on Maruti Suzuki", "summary": "Auto component manufacturer Rane (Madras) is implementing a diversification strategy to reduce its reliance on Maruti Suzuki, which currently accounts for 85% of its steering business revenue. The company plans to bring three new international carmakers into its portfolio by FY29. It has committed ₹300 crore in capital expenditure for FY27 to support its expansion into new product lines.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "56540b66"}, {"headline": "S&P Global Ratings downgrades Tata Motors Passenger Vehicles and JLR", "summary": "S&P Global Ratings has lowered its credit ratings for Tata Motors Passenger Vehicles and Jaguar Land Rover (JLR) to 'BBB-'. The downgrade is attributed to weak sales performance, substantial investment requirements, and mounting cash outflows at JLR. The rating agency notes that JLR's lower-than-expected operating performance has impacted the company's overall financial health.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "02597091"}, {"headline": "Britannia Industries CMO Amit Doshi resigns after brief tenure", "summary": "Amit Doshi, the Chief Marketing Officer of Britannia Industries, has resigned from his position just months after joining the company. According to a regulatory filing, Doshi will be relieved of his duties by December 9, 2026. The company has not yet named a successor for the role, and Doshi plans to pursue an opportunity outside the organization.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "5232afe5"}, {"headline": "India-US trade agreement nearing final conclusion says Piyush Goyal", "summary": "Commerce and Industry Minister Piyush Goyal stated that a trade agreement between India and the US is in its final stages of negotiation. The deal could provide Indian exporters with a competitive edge over some Asian nations that face higher US tariffs. While some details on reciprocal tariffs are still being finalized, Goyal expressed optimism about reaching a formal conclusion soon.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "7256c709"}, {"headline": "Government evaluates compute support for AI inferencing under IndiaAI Mission", "summary": "The Ministry of Electronics and Information Technology (MeitY) is considering expanding its IndiaAI Mission to include support for AI inferencing. While current efforts focus on providing GPU access for model development, Secretary S. Krishnan noted that inferencing is critical for scaling AI solutions. The move aims to help startups and research institutions deploy AI models more efficiently.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "a68d906b"}, {"headline": "US reciprocal tariffs impact sensitive Indian export sectors like textiles", "summary": "Recent US Section 301 reciprocal tariffs have hit Indian exports in gems, jewellery, textiles, and minerals. Shipments of pearls and semi-precious stones fell over 48% in the first half of the fiscal year, while textile and apparel exports also saw declines. Despite these challenges, some sectors like electrical machinery and iron products recorded growth during the same period.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "b98b9487"}, {"headline": "Coal share in power generation hits 70 percent amid El Nino", "summary": "India's reliance on coal for power generation reached a six-month high of 70.16% in October 2026. This surge was driven by increased demand for cooling due to high temperatures and a drop in renewable energy output from wind and hydro sources. Data from the Coal Ministry shows that coal remains the dominant source of electricity as El Nino impacts weather patterns and rainfall.", "category": "Environment", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "e9917830"}, {"headline": "Ujjwala Yojana reduced household PM2.5 emissions by 15 percent", "summary": "A study by the Council on Energy, Environment and Water (CEEW) found that the Pradhan Mantri Ujjwala Yojana has helped reduce particulate matter (PM2.5) emissions from Indian households by 15% in FY26. By providing LPG connections to millions of rural families, the scheme has mitigated the health risks associated with traditional solid fuels, although refill rates remain a challenge.", "category": "Health", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "c63ad279"}, {"headline": "India's foreign exchange reserves fall by 4.4 billion dollars", "summary": "India's forex reserves decreased by $4.443 billion to $700.898 billion for the week ending November 20, 2026. The decline was largely due to a $14.2 billion drop in foreign currency assets, although gold reserves saw a slight increase of $4.095 billion. This marks the second consecutive week of decline for the country's total reserves according to Reserve Bank of India data.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "13824b03"}, {"headline": "Indian Bank to raise 2,500 crore via Additional Tier 1 bonds", "summary": "The board of Indian Bank has approved a proposal to raise ₹2,500 crore through the issuance of Basel III-compliant Additional Tier 1 (AT1) bonds. The capital raise will be executed in one or more tranches during the current financial year, subject to regulatory approvals. The move is intended to strengthen the public sector lender's capital base and support its growth plans.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "5b1070f6"}, {"headline": "Nepal Prime Minister's visit signals new impetus for Indo-Nepal relations", "summary": "Nepal PM Balendra 'Balen' Shah's first official visit to India has focused on resetting diplomatic and economic ties. Key discussions included a major development assistance package for Nepal worth ₹15,000 crore and the resolution of long-standing boundary disputes. Both nations expressed a commitment to a 'future-oriented partnership' focused on energy, connectivity, and education.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "05168f37"}, {"headline": "FCNR deposits and remittances support India balance of payments", "summary": "India's balance of payments for the first half of the year was supported by steady inflows from FCNR(B) deposits and a $77.7 billion surge in remittances. Despite a trade deficit of $176.1 billion caused by rising oil prices, the capital account remained resilient. The Reserve Bank of India notes that external borrowings by Indian companies have also contributed to stabilizing the BoP.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "d656e9fc"}, {"headline": "Government tightens rules for electric vehicle recycling and steel scrap", "summary": "The Ministry of Environment, Forest and Climate Change has revised rules for End-of-Life Vehicles (ELVs) to ensure steel scrap is sourced only from registered vehicle scrappage facilities. This amendment prevents automakers from using non-vehicle scrap to claim recycling credits. The move aims to formalize the recycling sector and improve the environmental impact of vehicle disposal.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "6216e0d8"}, {"headline": "Graphite electrode demand expected to rise as global capacity shrinks", "summary": "HEG Chairman Ravi Jhunjhunwala predicts a rise in demand for graphite electrodes as several plants in the US, Europe, and Japan close down. The global market is expected to grow by 1.50 lakh tonnes over the next few years. HEG is positioning itself to capture this growth by investing ₹2,200 crore in a new facility in Madhya Pradesh to produce specialized electrode materials.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "3e827c02"}, {"headline": "Shriram Finance CFO warns MSME loans carry higher risk than gold", "summary": "Parag Sharma, CFO of Shriram Finance, noted that lending to MSMEs currently poses a greater risk to financial institutions than gold-backed loans. While gold loans are secured by a stable asset, MSME segments are more vulnerable to economic volatility and credit risks. Financial experts highlighted the need for rigorous monitoring of small business portfolios to manage potential defaults.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "edcf6c2b"}, {"headline": "Mahanadi Coalfields shares slip 2.6 percent on stock market debut", "summary": "Mahanadi Coalfields Ltd (MCL) made a disappointing debut on the stock exchanges on Friday, with its shares closing at ₹132.50, down 2.6% from the issue price of ₹136. The company is the third Coal India subsidiary to go public and is the largest coal-producing firm in India by volume. Analysts suggest the tepid response reflects investor caution regarding long-term coal demand.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "8ad5901b"}, {"headline": "SEBI warns investors against relying on IPO grey market premiums", "summary": "The Securities and Exchange Board of India (SEBI) has issued a warning to retail investors against using unregulated grey market premiums (GMP) as a basis for IPO investment decisions. SEBI noted that GMP values are often manipulated by brokers and do not reflect the actual fundamentals of a company. The regulator emphasized that investors should rely only on official prospectus data.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "28c0c9d1"}, {"headline": "Global fashion brands shift orders from Bangladesh to India and Vietnam", "summary": "Ongoing worker protests and political instability in Bangladesh have prompted major fashion retailers like Zara and H&M to shift their manufacturing orders to India and Vietnam. Bangladesh’s garment industry has lost over $400 million in production recently. Indian exporters have reported a significant surge in inquiries and orders as brands seek more stable supply chain alternatives.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "451542f3"}, {"headline": "Volkswagen urges higher scrutiny of rivals' car part imports in India", "summary": "In a legal dispute over a $1.2 billion tax claim, Volkswagen has told an Indian court that its rivals Mercedes-Benz and BMW should also face scrutiny for their car part import practices. Volkswagen argues it has been unfairly targeted with higher tariffs while competitors use similar assembly methods. The court will decide on the matter of import duty classifications on Monday.", "category": "Law", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "084e0f04"}, {"headline": "HSBC reorganizes India support roles leading to job shifts for hundreds", "summary": "HSBC is consolidating its support functions in India, moving roles from various hubs to centralized locations in Chennai, Gurugram, and Bengaluru. While the bank is offering relocation options to affected employees, the reorganization is expected to impact hundreds of positions. The move is part of a broader effort to streamline global operations and accelerate the use of AI.", "category": "Business", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "bf05813f"}, {"headline": "India milk production reaches 253 million tonnes in 2025-26", "summary": "India's milk production grew by 2.4% to reach 253.81 million tonnes during the 2025-26 fiscal year. Tamil Nadu recorded the highest growth rate at 6.59%, while Uttar Pradesh remained the largest producer overall. The increase is attributed to better animal health services and government initiatives. Per capita milk availability in India has also risen to 492 grams per day.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "0c9fd594"}, {"headline": "IIT Madras extends BTech internship period to six months", "summary": "IIT Madras has announced a new curriculum change that extends the mandatory internship period for BTech students from two months to six months. The initiative aims to provide students with deeper industry exposure and better prepare them for the job market. Over 30 companies have already signed up to offer these extended internships starting in the 2027 academic year.", "category": "Education", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "9a0d883f"}, {"headline": "Supreme Court declines to mandate portal for unclaimed financial assets", "summary": "The Supreme Court of India has refused a plea to order a new unified portal for all unclaimed financial assets, stating that the RBI's UDGAM portal already serves this purpose. The court noted that several regulatory measures are in place to help legal heirs identify and claim assets like bank deposits and mutual funds. The bench emphasized that existing systems are being improved.", "category": "Law", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "057ee261"}, {"headline": "Air India issues fuel-saving guidelines to pilots to cut costs", "summary": "Air India has urged its pilots to adopt specific fuel-saving measures, such as single-engine taxiing and better descent planning, to reduce operational expenses. The airline noted that fuel costs account for up to 40% of its operating budget. While the guidelines are advisory, pilots are encouraged to prioritize efficiency to help the carrier navigate financial challenges.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "97a9f9ce"}, {"headline": "TRAI amends telecom regulations to streamline connectivity and interconnection", "summary": "The Telecom Regulatory Authority of India (TRAI) has updated regulations governing interconnection between telecom players to improve service efficiency. The new rules require service providers to enter into agreements within 15 days and set penalties for delays in providing connectivity. These measures are intended to reduce disputes and ensure better network quality for consumers.", "category": "Technology", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144962", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144962"}], "article_id": "adc5ce86"}, {"headline": "Cabinet clears Bill for women’s reservation and delimitation of seats", "summary": "The Union Cabinet has cleared a Constitution Amendment Bill to implement 33% women's reservation and increase Lok Sabha seats to 850 through delimitation. The move aims to freeze the relative share of state representation until 2051. While the DMK and NCP have expressed conditional support, concerns remain regarding the impact on southern states that successfully controlled population growth.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 10, "article_id": "cf8ab933"}, {"headline": "India-U.S. trade deal nearing culmination, says Piyush Goyal", "summary": "Commerce Minister Piyush Goyal announced that a trade agreement between India and the United States is close to completion. Speaking in Mumbai, Goyal noted that the pathway for finalizing the deal is taking shape after progress on previously stalled issues. He highlighted India's ability to maintain investor confidence despite global trade disruptions and tariff uncertainties.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144991"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 9, "article_id": "faf3b958"}, {"headline": "Former CJI Gavai alleges bias in recent judicial selections", "summary": "Former Chief Justice of India B.R. Gavai wrote to President Droupadi Murmu alleging that recent judicial recommendations by the Collegium disregard principles of merit and inclusivity. He claimed a specific community is being favored while candidates from marginalized sections are being excluded, citing specific instances of High Court Chief Justice transfers as evidence of this trend.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 9, "article_id": "5d47a73c"}, {"headline": "RBI reduces daily CRR maintenance requirement to 90% for banks", "summary": "The Reserve Bank of India has lowered the minimum daily maintenance of the Cash Reserve Ratio (CRR) from 99% to 90%, effective December 1. The move is designed to provide liquidity relief to the banking system, which has faced tightening conditions and a shift to deficit recently. The overall CRR rate remains unchanged at 4.50%, with the measure aimed purely at operational flexibility.", "category": "Economy", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144991"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 8, "article_id": "cb299cb3"}, {"headline": "Union cabinet clears fresh delimitation-linked women’s reservation bill", "summary": "The Union cabinet approved a revised women's reservation bill that links quotas to delimitation. The bill includes amendments to ensure no state loses Lok Sabha seats, with a projected 50% increase in total seats. The legislation is expected to be introduced during a special parliamentary session next week.", "category": "Politics", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 9, "article_id": "2e38447b"}, {"headline": "RBI Governor urges MSMEs to leverage lower tariffs under trade pacts", "summary": "RBI Governor Shaktikanta Das has encouraged Indian MSMEs to expand into global markets by utilizing the benefits of India's Free Trade Agreements (FTAs). Currently, only 20-30% of small businesses utilize FTA tariff benefits due to a lack of awareness. The Governor emphasized that diversifying into exports could help MSMEs scale and improve their long-term financial stability.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 7, "article_id": "ed2de461"}, {"headline": "Tata Sons board to meet Monday after High Court denies relief", "summary": "The Bombay High Court refused to grant interim relief to Tata Trusts in their plea to restrain the Tata Sons board from acting on resolutions. The decision allows the board to proceed with a meeting on Monday to discuss several matters, including the proposed initial public offering of Tata Sons. The court has scheduled the next hearing on the matter for January 21, 2027.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/145018"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 10, "article_id": "95eeec3c"}, {"headline": "SEBI investigates Tata Steel-APL Apollo deal over minority shareholder rights", "summary": "SEBI Chairman Tuhin Kanta Pandey has raised concerns regarding minority shareholder protection in Tata Steel's proposed acquisition of a 26.6% stake in APL Apollo Tubes. The regulator is scrutinizing the ₹15,510 crore deal to ensure it does not bypass takeover code requirements. SEBI has extended the deadline for the open offer details to December 8 to allow for further review of the terms.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/144972"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/145018"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 9, "article_id": "63e26c13"}, {"headline": "Interoperability in AA network now from Dec 1", "summary": "The RBI has advanced the deadline for interoperability in the account aggregator (AA) network to December 1 from December 31. Interoperability will now go live on the same day as the network's new pricing model.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 7, "article_id": "5eb60be3"}, {"headline": "RBI restores 90% daily CRR requirement as liquidity tightens", "summary": "The RBI will restore the minimum 90% daily maintenance of the cash reserve ratio (CRR) by banks effective December 1, 2026, amid tight financial conditions. This will release ~50,000 crore into the banking system.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 8, "article_id": "58e0a26f"}, {"headline": "Forex reserves decline by $4.4 bn to $700.9 bn on fall in gold prices", "summary": "India's foreign exchange reserves fell by $4.44 billion to $700.90 billion in the week ended November 20. Gold reserves declined by $4.10 billion to $94.52 billion.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 7, "article_id": "346d7ec0"}, {"headline": "FTA utilisation faces awareness, compliance issues: Experts", "summary": "Experts cite limited exporter awareness, procedural hurdles, and difficulties meeting overseas standards for low FTA benefit utilisation in India, especially among MSMEs.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 7, "article_id": "67e26d4a"}, {"headline": "Swiggy Instamart cuts 340 roles to prioritize AI and automation", "summary": "Swiggy's quick commerce division, Instamart, has laid off approximately 340 employees as it shifts its focus toward generative AI and automation. The company stated the move is part of a broader strategy to streamline operations and enhance efficiency. Affected employees will receive severance packages and support for outplacement as the firm integrates more automated systems.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145018"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 7, "article_id": "7f6f64b8"}, {"headline": "RBI allows debit holds on ‘highly suspicious’ transactions", "summary": "RBI allows banks to hold debit transactions deemed highly suspicious, implementing a uniform procedure for actions, including those linked to money mule activity.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/145018"}], "importance": 7, "article_id": "88a02945"}, {"headline": "TVS Motor launches Armado cargo tricycle for commercial mobility", "summary": "TVS Motor Company has introduced the Armado, a cargo tricycle powered by a 200cc oil-cooled engine, to target the last-mile delivery and commercial transport segments. The vehicle features a 1-tonne payload capacity and a five-speed manual transmission. This launch marks TVS's entry into the globally competitive cargo tricycle market, with plans for exports to Latin America and ASEAN.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/145018"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144962"}], "importance": 6, "article_id": "1c2e5709"}], "newspapers": ["Hindustan Times", "Times of India", "Business Standard", "The Hindu", "Financial Express", "Economic Times", "Mint", "Business Line", "Indian Express"], "total_articles": 176};

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
