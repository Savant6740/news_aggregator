<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

 ecosystems, with temperatures remaining significantly above historical averages.", "category": "Environment", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133544", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133544"}], "article_id": "3930ef81"}, {"headline": "India seeks new bowling identity without injured Jasprit Bumrah", "summary": "As India prepares for the Test series against Sri Lanka without the injured Jasprit Bumrah, the team is looking to redefine its bowling strategy. Senior players like Mohammed Siraj will need to lead a relatively inexperienced pace attack, while the team explores more flexibility among its spinners.", "category": "Sports", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133544", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133544"}], "article_id": "e8e67455"}, {"headline": "PM Modi lauds athletes' efforts at Glasgow Commonwealth Games celebrations", "summary": "Prime Minister Narendra Modi hosted a reception for India's athletes who participated in the Glasgow Commonwealth Games. He praised their performance, particularly those from rural backgrounds and the armed forces, noting that their success continues to inspire the nation and elevate India's standing in global sports.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133544", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133544"}], "article_id": "26549b7e"}, {"headline": "Meta launches Muse Glimmer AI for Macs and PCs", "summary": "Meta has launched Muse Glimmer, an AI tool designed to run complex tasks on Macs or PCs using graphics cards without cloud computing. Mark Zuckerberg stated the open-weight models aim to strengthen US competition with China in the AI sector by allowing developers to run powerful models locally.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "d7e7bd7b"}, {"headline": "Opposition continues protest as government offers statement from Amit Shah", "summary": "Parliamentary proceedings were disrupted as the opposition demanded a statement from PM Modi on the embezzlement of Ram temple funds. While the government offered a statement from Home Minister Amit Shah, the opposition remained firm on their demand, leading to several adjournments in both houses.", "category": "Politics", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "d6c6d143"}, {"headline": "Karnataka to launch one-year menopause fellowship for medical professionals", "summary": "The Karnataka government is planning to introduce a first-of-its-kind one-year fellowship in menopause for postgraduate doctors. The program, offered through RGUHS, aims to create a specialist workforce to manage peri-menopause and menopause care within the public health system.", "category": "Health", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "245dc15a"}, {"headline": "Gurgaon DLF penthouse sells for record 27 crore rupees", "summary": "An entrepreneur has purchased a luxury penthouse at DLF's The Dahlias in Gurgaon for 27 crore rupees. The deal rivals major Mumbai transactions on a per-square-foot basis, marking Gurgaon's emergence as a top luxury real estate powerhouse in India with prices crossing Rs 2 lakh per sq ft.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "2ed2d9d0"}, {"headline": "Metro double-decker project in Bengaluru likely to be shortened significantly", "summary": "The BMRCL is considering reducing the proposed 37km double-decker flyover-cum-metro stretch to just 11km due to engineering challenges and high costs. The original plan aimed to connect Hebbal to Silk Board, but the revised plan focuses on major junctions to ease traffic congestion.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "05092bbd"}, {"headline": "Voter list in Karnataka shrinks by three lakh in six days", "summary": "Nearly 3 lakh voters were removed from the electoral rolls in Karnataka between August 3 and 9 during a special revision drive. Bengaluru accounted for the largest reduction. The Election Commission stated the deletions were due to voters being absent, shifted, or having duplicate entries.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "f45b3d86"}, {"headline": "Fraudster posing as IAS officer held in Patna with luxury assets", "summary": "Patna police arrested a man for posing as an IAS officer and operating a fraudulent investment firm. The accused possessed a Tesla car, a luxury bungalow with a swimming pool, and 29 firearms. He allegedly claimed to be an advisor to the National Security Advisor to deceive high-profile victims.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "7d54224f"}, {"headline": "Government hints at JPC for FCRA Bill amid opposition rollback demand", "summary": "The Union government has indicated it may refer the Foreign Contribution (Regulation) Amendment Bill to a Joint Parliamentary Committee (JPC) following intense opposition. Opposition parties have demanded a total rollback of the bill, claiming it unfairly targets minority groups and NGOs.", "category": "Politics", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "182ed1ef"}, {"headline": "Oil product exports find new markets in Spain and Italy", "summary": "Due to the West Asia crisis, Indian oil product exports have surged in new markets including Spain, Italy, and Singapore. Exports to Spain grew by 15% in the last quarter, while shipments to Tanzania and Sri Lanka also saw significant increases as Indian refineries diversified their global reach.", "category": "Economy", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "00ad641e"}, {"headline": "Sarfaraz Khan returns to Indian squad for Sri Lanka Test series", "summary": "Batsman Sarfaraz Khan has been recalled to the Indian Test squad for the upcoming series against Sri Lanka. This follows his impressive performance in the Ranji Trophy and his previous stint with the national team. His inclusion is seen as a move to bolster the middle-order batting lineup.", "category": "Sports", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "dca72c6d"}, {"headline": "Deepanshu suspended for doping violation, to miss Asian Games", "summary": "Indian Greco-Roman wrestler Deepanshu has been provisionally suspended by the National Anti-Doping Agency (NADA) after testing positive for a prohibited anabolic steroid. The suspension rules him out of the upcoming Asian Games and could lead to a long-term ban from the sport.", "category": "Sports", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "a43f497b"}, {"headline": "India begins FIH Hockey World Cup campaign against Wales on August 15", "summary": "The Indian men's hockey team is set to open its FIH Hockey World Cup campaign against Wales on Independence Day. Led by Harmanpreet Singh, the team has undergone rigorous training, including a boot camp in the Swiss Alps, to prepare for the tournament and aim for a podium finish.", "category": "Sports", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "f1a50967"}, {"headline": "Scientists discover active undersea 'river' of sediment in Arabian Sea", "summary": "Researchers have mapped a 733km-long active underwater channel system in the Arabian Sea that functions like a river. This \"river\" transports organic carbon and nutrients to the deep sea, potentially holding significant oil and gas reservoirs. It is the second-largest mapped channel system in the world.", "category": "Science", "page": 23, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "116b2c85"}, {"headline": "Eight countries participate in immersive Jainism study program in Rajasthan", "summary": "Nearly three dozen scholars from eight countries gathered in Ladnun, Rajasthan, for an immersive summer program to study Jain texts and philosophy. The program involved living alongside monks and nuns to experience Jain practices, meditation, and the community's lifestyle firsthand over several weeks.", "category": "Culture", "page": 23, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133531", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/133531"}], "article_id": "bf5ef604"}, {"headline": "India plans over 50,000 crore investment for green energy corridor", "summary": "The Ministry of New and Renewable Energy is seeking Cabinet approval for the ₹50,000-crore third phase of the Green Energy Corridor. The scheme aims to strengthen intra-state transmission networks in renewable-rich states like Gujarat and Rajasthan to reduce generation curtailment. Currently, inadequate infrastructure causes electricity curtailment equivalent to 18% of monthly solar output.", "category": "Infrastructure", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "29830d43"}, {"headline": "Adani Infra (India) Ltd emerges as major cash generator for conglomerate", "summary": "Adani Infra (India) Ltd (AIIL) reported a profit of ₹7,127 crore in FY26, showing 13-fold revenue growth over two years. Designated as the project management and EPC arm for the Adani Group, it generated ₹6,666 crore in free cash flow. AIIL is utilizing these profits to acquire significant minority stakes in four listed group companies, including Adani Green and Adani Energy Solutions.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "80a328ca"}, {"headline": "Vodafone Idea reports first quarterly subscriber addition since 2018 merger", "summary": "Vodafone Idea Ltd added subscribers for the first time since its 2018 merger, with its customer base rising to 193.1 million in Q1. The company narrowed its net loss to ₹3,754 crore, significantly beating market estimates. Growth was driven by network expansion and higher data consumption. The telco is currently in talks to raise ₹35,000 crore in bank debt to fund 4G and 5G rollouts.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "33bdd1a7"}, {"headline": "Indian sweet makers grapple with rising dairy costs before festive season", "summary": "Confectioners like Bikaji and Sweet Bengal are facing increased production costs as prices for milk, ghee, and butter rise by 10-30%. While some brands plan price hikes of up to 10% for Diwali, others are absorbing costs to maintain festive sales volumes. The pressure is particularly high for milk-based Bengali sweets, as the industry competes for limited milk fat supplies.", "category": "Business", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "5eadf898"}, {"headline": "BSNL proposes 77,000 crore investment for 4G and 5G network expansion", "summary": "Bharat Sanchar Nigam Ltd (BSNL) has proposed a ₹77,000-crore capital expenditure plan over five years. The strategy includes setting up 200,000 additional 4G sites, rolling out 5G in high-traffic areas, and improving customer support. The Department of Telecommunications projects the state-owned operator will reach operational breakeven by FY29 and achieve 98% nationwide coverage.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "f2a42e51"}, {"headline": "Siguler Guff and investors seek exit from retail chain Baazar Kolkata", "summary": "Private equity firm Siguler Guff and other investors are exploring a sale of their 51% stake in retail chain Baazar Kolkata, seeking a valuation of ₹4,000-5,000 crore. The retailer operates over 250 stores across West Bengal and 10 other states. O3 Capital is reportedly advising on the transaction as the company attracts interest from other private equity funds and strategic buyers.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "8807f392"}, {"headline": "Kharif crop sowing remains below last year despite monsoon revival", "summary": "Farmers in India planted crops across 96.8 million hectares as of 7 August 2026, remaining 1.9% below previous year levels despite a recent intensification of monsoon rains. Rice acreage saw a significant drop of 1.6 million hectares compared to last year. While oilseed cultivation rose, pulses and coarse cereals trailed, with the government expecting further rains to boost planting.", "category": "India", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "cd66d086"}, {"headline": "Parliament passes bill to recognize digital bank records as legal evidence", "summary": "The Rajya Sabha passed the Bankers’ Books Evidence Bill, 2026, replacing a 135-year-old law. The new legislation allows electronic and digital records maintained by banks to be recognized as admissible evidence in legal proceedings. The bill, previously passed by the Lok Sabha, modernizes the judicial process to align with paperless banking practices.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "32c0e63d"}, {"headline": "India considers restricting sugarcane use for ethanol to control sugar prices", "summary": "The Indian government is considering limits on the amount of sugarcane diverted for ethanol production for the season starting in October. The move aims to boost domestic sugar output and stabilize record-high prices following reduced rainfall in major producing states like Maharashtra and Karnataka. Discussions involve balancing energy goals with food security and inflation control.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "8a69ab36"}, {"headline": "Trai mandates 1601-series numbers for service calls by non-banking entities", "summary": "The Telecom Regulatory Authority of India (Trai) has directed utilities, logistics, and other non-financial entities to use the 1601-series for service and transactional calls. The directive aims to distinguish legitimate service calls from promotional spam. Trai emphasized that these dedicated numbers must not be used for marketing purposes by any entity.", "category": "Technology", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "0b707084"}, {"headline": "Lok Sabha passes bill to establish National Tribunals Commission", "summary": "The Lok Sabha passed the Tribunals Reforms Bill, 2026, proposing a National Tribunals Commission to oversee quasi-judicial bodies. The commission, led by a former Supreme Court judge, will manage member appointments, monitor performance, and handle complaints. The reform aims to address persistent vacancies and case backlogs across 16 tribunals and appellate bodies.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "59363ca4"}, {"headline": "New RBI loan recovery guidelines to take effect in January 2027", "summary": "The RBI announced final loan recovery guidelines effective January 2027 to prevent borrower harassment. Banks must monitor recovery agencies, ensuring agents are certified and do not use harsh methods like abusive language, social media shaming, or excessive messaging. The move follows incidents like a 2022 death linked to recovery processes at Mahindra Finance.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "4765a478"}, {"headline": "Domestic institutional investors pump over 5 trillion into Indian equities", "summary": "Domestic institutional investors (DIIs) including banks, insurers, and mutual funds have invested over ₹5 trillion in Indian shares so far in 2026. This marks the third consecutive year crossing this threshold, signaling strong confidence in the Indian economy. While foreign portfolio investors have been heavy sellers, recent trends suggest a potential reversal in interest.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "c604066f"}, {"headline": "Data centres emerge as preferred asset class for real estate investment", "summary": "Data centres in India saw a significant increase in institutional real estate investment during the April-June 2026 period. They accounted for nearly 40% of total inflows, becoming the second-most preferred asset class after office spaces. This shift highlights the growing demand for digital infrastructure as institutional capital diversifies beyond traditional real estate.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "67032ac2"}, {"headline": "Indian bank credit growth reaches 17 percent amid economic revival hopes", "summary": "Non-food bank credit growth in India surpassed 17% for the fortnight ended 15 July 2026, the highest rate in two years. The growth is broad-based across agriculture, industry, services, and retail sectors. Increased industrial credit to large companies and a shift toward secured retail lending suggest the start of a durable credit cycle supported by rising private sector participation.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "60259d3c"}, {"headline": "Lightstorm secures 2,500 crore debt for data centre network expansion", "summary": "Network infrastructure firm Lightstorm secured a ₹2,500 crore long-term debt facility from IndusInd Bank. The capital will fund terrestrial and subsea fiber projects connecting Indian data centre clusters with hubs in Southeast Asia, Japan, and the US. The company aims to capitalize on India's growing digital data generation, which currently outpaces local storage capacity.", "category": "Technology", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "ac77c271"}, {"headline": "OpenAI halts work on Astra model due to cybersecurity risks", "summary": "OpenAI has paused internal work on its upcoming Astra AI model after discovery that the system is highly proficient at cybersecurity tasks. The company stated that the model could potentially reach a \"critical threshold\" for identifying and developing zero-day exploits without human intervention. The pause allows for the implementation of stricter safety safeguards.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "f581844d"}, {"headline": "GameStop CEO Ryan Cohen considers withdrawing 56 billion dollar eBay bid", "summary": "GameStop Corp. CEO Ryan Cohen is reportedly considering pulling a $56 billion offer for eBay Inc. Sources indicate Cohen may instead propose a partnership or joint venture to leverage GameStop's 1,600 retail locations. The potential deal aimed to increase market share in high-margin categories like collectibles and trading cards, but plans are now being reassessed.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "70344547"}, {"headline": "Securities Appellate Tribunal case backlog reaches six-year high", "summary": "Pending cases before the Securities Appellate Tribunal (SAT) rose to 1,066 in FY26, the highest in six years. While fresh appeals have slowed, pendency is driven by a persistent shortage of judicial and technical members, limiting the number of benches available. Notable delays include the Wadia family’s appeal against Sebi orders, which took four years to resolve.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "2d7d6ec3"}, {"headline": "Global ammonia price drop provides relief to Indian fertilizer companies", "summary": "Fertilizer stocks saw a lift as global ammonia prices retreated by approximately 20% from their peaks. Analysts suggest the price drop provides margin relief for non-urea fertilizer makers like Coromandel International and Paradeep Phosphates. However, benefits are partially offset by elevated sulphur costs and uncertainty surrounding conflict in West Asia.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "9aed8472"}, {"headline": "US shifts to economic pressure over military strikes against Iran", "summary": "President Donald Trump indicated a shift toward using economic pressure rather than fresh military strikes to subdue Iran. Trump noted that a naval blockade is deepening Iran's financial woes and high inflation. Meanwhile, Tehran continues to demand the lifting of sanctions and war reparations as conditions for reopening the Strait of Hormuz to global energy shipping.", "category": "World", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "3077cdcd"}, {"headline": "Raymond Realty expands Mumbai presence with major redevelopment projects", "summary": "Raymond Realty Ltd is stepping up its expansion into Mumbai’s redevelopment market, signing two new projects in Parel and Kandivali with a combined value of ₹11,500 crore. The developer is shifting focus from its legacy land in Thane to asset-light joint development agreements. The strategy targets high demand for modernizing aging residential societies in land-scarce Mumbai.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "09b2d7dd"}, {"headline": "Indian box office footfall rises 5 percent in first half of 2026", "summary": "Cinema attendance in India reached 378 million in the first half of 2026, a 5% increase over the previous year. However, recovery is uneven, driven largely by a few major hits like \"Dhurandhar: The Revenge.\" While Tier-II and Tier-III cities show consistent growth, metros remain selective. Industry experts hope a strong festive release slate will sustain the momentum.", "category": "Culture", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "b6be1fc7"}, {"headline": "Bombay High Court seeks government response on flavoured liquor prohibition", "summary": "The Bombay High Court has asked the Centre to respond to a petition challenging the FSSAI's ban on flavoured rum and whisky. Alco-bev makers, including the producer of Old Monk, argued the prohibition is causing daily losses of ₹1 crore. The regulator had objected to added flavourings in spirits labeled as standardized, while makers claim the products have been safe for decades.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "1495807c"}, {"headline": "Air India pilot undergoes second drug test after mid-air turbulence incident", "summary": "An Air India flight commander is undergoing a second round of drug screening following severe mid-air turbulence that injured passengers and crew. Initial tests prompted the need for confirmatory analysis to check for psychoactive substances. The Aircraft Accidents Investigation Bureau is leading the probe into the flight, which dropped 300 feet during the incident.", "category": "India", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "a6a25540"}, {"headline": "AstraZeneca Pharma India reports 32 percent decline in quarterly profit", "summary": "AstraZeneca Pharma India Ltd reported a 32% drop in net profit to ₹37.93 crore for the June quarter. While revenue from operations grew to ₹682.79 crore, higher expenses significantly impacted the bottom line. The company's total expenses for the period rose to ₹641.03 crore, compared to ₹462.49 crore in the same quarter the previous year.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "ed25fb01"}, {"headline": "Hindustan Copper to sell ore from Chilean mines to Indian firms", "summary": "State-run Hindustan Copper plans to sell copper concentrate from newly acquired Chilean mines to domestic firms like Hindalco and Adani. The company is in talks for a joint venture with Chile’s Codelco to mine and sell the metal to meet India’s growing demand. The initiative aims to secure raw material supplies as India increases its focus on copper-intensive industries.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "e6028cda"}, {"headline": "Reliance Retail uses vast store network to scale JioMart delivery", "summary": "JioMart is transforming Reliance Retail’s 3,100 stores into a digital distribution engine to compete in the quick-commerce market. Average daily orders crossed 2 million in the March quarter, surpassing Swiggy Instamart. Unlike competitors using dedicated dark stores, JioMart leverages its existing supermarkets and electronics outlets to fulfill hyperlocal orders across 1,200 cities.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "4b8814c9"}, {"headline": "Norton Motorcycles executive Nevijo Mance exits ahead of global expansion", "summary": "Nevijo Mance, executive director at Norton Motorcycles, has stepped down for personal reasons as the TVS-owned brand prepares for international expansion. Mance was responsible for product design and engineering. His exit comes as Norton plans a phased rollout across the UK, Europe, India, and the US, targeting 20,000 annual units and 200 global dealer touchpoints.", "category": "Business", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "aa3bda03"}, {"headline": "India’s ultra-wealthy shift toward rare and eccentric luxury items", "summary": "India's wealthiest consumers are increasingly moving away from recognizable logos toward rare, eccentric, and hard-to-source luxury products. High-demand items include Balenciaga \"garbage bags,\" life-sized Ferrari show cars, and limited-edition collectibles. This shift reflects a desire for exclusivity and \"quiet luxury\" among India's growing population of ultra-high-net-worth individuals.", "category": "Culture", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "f86590e9"}, {"headline": "Google AI head Demis Hassabis moves to chief scientist role", "summary": "Alphabet has announced a management shake-up where Demis Hassabis will transition from managing Google’s AI strategy to becoming the company’s chief scientist. The move follows concerns over Google’s execution in the AI race despite its scientific leads. Hassabis, who recently won a Nobel Prize, will focus on scientific breakthroughs while Koray Kavukcuoglu takes on expanded operational roles.", "category": "Technology", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "c0213275"}, {"headline": "Gen Z embraces traditional analogue hobbies to combat digital overload", "summary": "Younger teenagers and twenty-somethings are increasingly taking up \"grandma hobbies\" like knitting, crocheting, and pickling to seek relief from digital overstimulation. These tactile, slow-paced activities offer a creative outlet and a sense of autonomy away from academic and workplace pressures. Psychologists note that these hobbies help improve focus and provide an \"analogue reset.\"", "category": "Culture", "page": 14, "importance": 3, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "27d8bfd1"}, {"headline": "Mutual fund SIP closure ratio rises as investors react to volatility", "summary": "Data shows a sharp rise in the closure of mutual fund systematic investment plans (SIPs) as investors react to short-term market volatility. The number of five-year-plus SIPs in direct plans shrank by 35% in FY26. Financial experts warn that quitting early disrupts compounding benefits and that staying invested through cycles significantly reduces the risk of negative returns.", "category": "Economy", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133489", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133489"}], "article_id": "3e1787e1"}, {"headline": "Kharif sowing deficit narrows to less than 2% in August", "summary": "The area under kharif crop sowing reached 88% of the season's normal area by August 7. Higher planting of nearly 74 lakh hectares during the first week of August helped narrow the year-on-year deficit. While oilseeds acreage has exceeded last year's levels, paddy and coarse cereals still report lower coverage. The South-West monsoon rainfall deficit currently stands at 12%.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "2ab4f58f"}, {"headline": "Household savings shift to cash and deposits as equity flows decline", "summary": "Indian households are moving towards safer, liquid assets, with bank deposits rising 22% to ₹15.3 lakh crore in FY26. Analysis of RBI data shows currency holdings doubled to ₹4.15 lakh crore, while direct equity flows turned negative with an outflow of ₹79,890 crore. Experts attribute this trend to market uncertainty and high interest rates, rather than a permanent structural shift.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "07063247"}, {"headline": "UPI merchant fees worry mutual fund industry and distributors", "summary": "The mutual fund industry is concerned that proposed Merchant Discount Rates (MDR) on UPI transactions could erode profit margins. With UPI accounting for nearly 45% of new Systematic Investment Plans (SIPs), distributors fear that additional costs may be passed on to investors or deter digital adoption in smaller cities. The government maintains that consumers will remain exempt from charges.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "8428043b"}, {"headline": "Demand for AI skills drives rebound in campus placement salaries", "summary": "Engineering colleges report a shift towards higher compensation bands as companies prioritize AI and digital capabilities. Entry-level packages of ₹3-4 lakh are being replaced by offers in the ₹7-12 lakh range at tier-1 IT firms. Bulk hirers like TCS and Infosys plan to onboard 20,000-25,000 graduates each this year, focusing on roles involving automation and cloud technologies.", "category": "Education", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "cd98c0e1"}, {"headline": "Mumbai start-up Techno Defence breaks Western monopoly on missile cooling", "summary": "Techno Defence Pvt Ltd has developed an indigenous Joule-Thomson (JT) Cooler, a critical 10-gram device that cools missile infrared sensors to -196°C. Supported by DRDO's Technology Development Fund, the breakthrough ends the dominance of Western nations in this strategic technology. The success opens doors for high-value defence exports and enhances national missile precision capabilities.", "category": "Technology", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "83f91af4"}, {"headline": "Death toll reaches 47 after major earthquake in Cali, Colombia", "summary": "A powerful earthquake struck the Choco region of Colombia, resulting in at least 47 deaths. The epicentre was located in San Jose Del Palmar, approximately 400 km west of Bogota. Residents and rescue teams are digging through the debris of collapsed buildings as authorities continue to assess the total damage in the community of 4,800 people.", "category": "World", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "06e0d16b"}, {"headline": "Ashok Leyland and Drivn partner for electric truck financing", "summary": "Ashok Leyland has signed a Memorandum of Understanding with Drivn to provide comprehensive financial solutions for its electric vehicle customers. The partnership aims to make e-truck ownership more accessible through flexible financing, leasing, and fleet management options, supporting the adoption of sustainable commercial transport in India.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "99ddc0a5"}, {"headline": "Zee Entertainment Q1 net profit nearly halves amid tax expenses", "summary": "Zee Entertainment Enterprises reported a 48% drop in net profit to ₹74.3 crore for the June quarter, impacted by tax expenses for previous years and higher advertising spends. While subscription revenue grew 16% due to digital growth and linear pricing, domestic ad revenue continued to struggle. The company remains optimistic about sports content following the run-up to the 2026 FIFA World Cup.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "b574d494"}, {"headline": "Bharat Forge reports Q1 loss due to German subsidiary restructuring", "summary": "Pune-based Bharat Forge posted a consolidated net loss of ₹90 crore for Q1 FY27, compared to a profit of ₹284 crore last year. The loss was driven by restructuring provisions of ₹330 crore at its German subsidiary. Despite the loss, revenue grew 19% led by strong performance in defence and forgings. The board also approved a proposal to raise up to ₹2,500 crore in capital.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "44defe74"}, {"headline": "ONGC and Shell sign pact for deepwater oil and gas exploration", "summary": "ONGC and Shell Energy India have signed a non-binding MoU to explore joint opportunities in deepwater offshore blocks and liquefied natural gas sourcing. The collaboration involves potential farm-in arrangements and joint participation in future bidding rounds under India's Open Acreage Licensing Policy. The move aims to bring international expertise into India's samudra manthan initiative.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "be6921c9"}, {"headline": "Ola Electric narrows net loss to ₹336 crore in June quarter", "summary": "Ola Electric reported a narrower net loss of ₹336 crore for Q1 FY27, down from ₹428 crore a year earlier. The company benefited from the reversal of a ₹57 crore provision previously earmarked for PLI scheme penalties. However, revenue fell 45% year-on-year to ₹455 crore as volumes remained sluggish. The company expects operating expenses to decline further in coming quarters.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "8c0a85a2"}, {"headline": "Iran demands US concessions before reopening Strait of Hormuz", "summary": "Iran has stated that reopening the Strait of Hormuz, a vital global oil waterway, depends on the US paying compensation for damages and lifting sanctions. While talks with Oman on new shipping lanes are progressing constructsively, Iranian officials listed ending US threats and removing a naval blockade as key conditions. About a fifth of the world's oil and LNG flows through the strait.", "category": "World", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "f53aedb2"}, {"headline": "Nifty 50 could deliver 14-17% returns in FY27: Birla MF", "summary": "Aditya Birla Sun Life AMC expects the Nifty 50 to rebound with 14-17% returns in FY27, driven by a sharp revival in corporate earnings and consumption trends. The fund house noted that capital expenditure by India Inc is showing signs of revival, with top listed companies generating ₹19 lakh crore in profit in FY26. Valuations remain in an expensive zone despite recent corrections.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "81c4297d"}, {"headline": "BSE to replace Wipro in Nifty 50 index from September 30", "summary": "India's oldest stock exchange, BSE, will join the benchmark Nifty 50 index starting September 30, replacing IT giant Wipro. The change is part of the National Stock Exchange's half-yearly review. Wipro will move to the Nifty Next 50 index. Other changes include LIC and Meesho being added to the Nifty 200, while firms like Indian Hotels and United Spirits will exit the Nifty 100.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "aa58627b"}, {"headline": "Paytm shares surge 10% after Bernstein raises target price", "summary": "Shares of One97 Communications, Paytm's parent, hit a 52-week high after Bernstein raised its target price to ₹2,200. The brokerage cited potential revenue gains from the proposed merchant discount rate (MDR) on UPI transactions, which could add significant value to Paytm's EBITDA by FY28. Bernstein expects Paytm to capture 3-4 basis points of incremental payment margins.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "ade2e7f0"}, {"headline": "Zee and Punit Goenka appeal to SAT against SEBI ban", "summary": "Zee Entertainment and CEO Punit Goenka have moved the Securities Appellate Tribunal against a SEBI order barring them from the securities market. SEBI's probe relates to the alleged unauthorized use of Zee's property as security for loans taken by Essel Group entities. The appellants seek a stay on the ban to proceed with a ₹3,143 crore preferential issue of warrants to promoters.", "category": "Law", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "885c3366"}, {"headline": "Affluent consumption may moderate as hiring slows: BNP Paribas", "summary": "A report by BNP Paribas warns that consumption by affluent Indian households—those earning over ₹10 lakh annually—may moderate due to subdued hiring in the IT and financial sectors. Wage growth has softened to around 7% from pandemic-era highs. While welfare schemes support rural income, the second half of the fiscal year could see slower growth in consumer staples and durables.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "a0a7703a"}, {"headline": "Government introduces MMDR Amendment Bill to regulate mining taxes", "summary": "The government introduced the Mines and Minerals (Development and Regulation) Amendment Bill in the Lok Sabha to facilitate faster exploration of critical minerals. The Bill proposes that the Union government control the regulation of mineral-bearing lands and sets conditions on States' taxation of mineral rights. It aims to provide certainty and stability to the national mining sector.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "9dd32e74"}, {"headline": "US increases H1-B and L-1 visa extension fees", "summary": "The US has published new rules requiring large employers with over 50 staff to pay an additional fee of $4,000 for H1-B and $4,500 for L-1 visa extensions. Effective September 9, the 9-11 response fee, which previously only applied to initial petitions, will now hit routine extension requests. Major Indian IT firms relying on the onshore-offshore model will face higher sponsorship costs.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "95d9d265"}, {"headline": "GeM portal posts sharp rise in GMV to ₹1.55 lakh crore", "summary": "The Government e-Marketplace (GeM) has recorded a surge in gross merchandise value to over ₹1.55 lakh crore, according to Commerce Minister Piyush Goyal. Launched in 2016, the platform now hosts over 12.28 lakh MSEs and 42,000 start-ups. The Minister noted that GeM is driving self-reliance and strengthening accountability through end-to-end digital procurement for government departments.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "3be19133"}, {"headline": "HDFC Bank cuts marginal cost of lending rate by 5 bps", "summary": "HDFC Bank has reduced its marginal cost of funds-based lending rate (MCLR) by 5 basis points across key tenures, effective August 7. The one-year MCLR now stands at 8.4%. Analysts attribute the cut to easing deposit costs and strong inflows into foreign currency non-resident (FCNR) deposits. This move contrasts with Bank of India, which recently raised its one-year MCLR to 8.8%.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "7825c691"}, {"headline": "Proposed Tribunal Commission may template future judicial appointments", "summary": "The government indicated that the institutional architecture of the new National Tribunals Commission could serve as a model for reforming the selection of judges to higher courts. The proposed commission gives the judiciary a decisive voice while introducing a permanent secretariat and recorded assessment parameters. This approach aims to address criticisms of the existing collegium system.", "category": "Law", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "47706ec0"}, {"headline": "Tamil Nadu announces bonus payments for paddy and sugarcane", "summary": "Tamil Nadu CM C. Joseph Vijay announced a special incentive of ₹289 per quintal for fine variety paddy and a ₹709.50 per tonne bonus for sugarcane. Sugarcane farmers will now receive ₹4,000 per tonne, marking the highest single-year increase in state incentives. The measures are intended to support rural livelihoods ahead of the procurement season starting September 1.", "category": "Politics", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "e62da154"}, {"headline": "Southern States account for 80% of India's gold loan portfolio", "summary": "Tamil Nadu, Andhra Pradesh, Karnataka, Telangana, and Kerala together hold over 80% of the gold loans outstanding in India's public sector banks. As of March 2026, the total gold loan outstanding was over ₹11.31 lakh crore. Tamil Nadu leads with ₹4 lakh crore. Despite the rapid credit growth, gross NPA ratios for gold loans have declined to 0.12%, reflecting stable asset quality.", "category": "Economy", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "43005c08"}, {"headline": "CAG report highlights connectivity issues at Bangalore Metro", "summary": "A report by the Comptroller and Auditor General (CAG) found that Bangalore Metro failed to achieve its projected ridership due to poor integration with other transport modes. The audit noted a lack of last-mile connectivity and inadequate parking facilities. Daily footfalls in BMTC buses also reduced significantly, indicating that the metro has not yet drawn enough private vehicle users.", "category": "Infrastructure", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "13b24b97"}, {"headline": "Supreme Court permits TMC's Abhishek Banerjee to travel for treatment", "summary": "The Supreme Court has allowed Trinamool Congress MP Abhishek Banerjee to travel abroad for three weeks to receive eye treatment. The court emphasized that every individual has the right to choose their medical assistance. The ruling came despite objections from the West Bengal government, which cited pending criminal cases and argued that adequate facilities exist within India.", "category": "Law", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "8e0b143b"}, {"headline": "French agency BEA to assist in Air India altitude loss probe", "summary": "France’s Bureau of Enquiry and Analysis for Civil Aviation Safety is collaborating with India's AAIB to investigate a serious incident involving an Air India Phuket-Delhi flight. The aircraft experienced a sudden 300-foot altitude loss during cruise on August 4. Investigators are examining multiple momentary technical snags reported by the crew. Both pilots have been grounded pending the probe.", "category": "Infrastructure", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "3f45420a"}, {"headline": "Ebola outbreak in Congo set to rise as health search expands", "summary": "The Ebola outbreak in the Democratic Republic of Congo is expected to worsen as health officials move toward door-to-door case finding. Deaths have doubled in less than three weeks, with a case-fatality ratio of 45.5%. The WHO and Africa CDC are shifting strategy because 60-70% of victims are currently dying at home rather than in treatment centers, risking wider community transmission.", "category": "Health", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133542", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/133542"}], "article_id": "7fb8f33c"}, {"headline": "Over 100 killed as 7.4 magnitude earthquake strikes Colombia", "summary": "A powerful 7.4 magnitude earthquake hit Colombia, centered near San Jose Del Palmar, killing at least 111 people and injuring 87 others. Hundreds of buildings collapsed, leaving residents trapped under debris. President Abelardo de la Espriella declared an emergency to expedite recovery funding as rescue workers continue searching for survivors in cities like Cali and Pereira.", "category": "World", "page": 3, "importance": 10, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "29a9251e"}, {"headline": "Rights groups call for overhaul in Aravalis high-powered committee hearings", "summary": "Civil rights groups in Rajasthan have demanded an overhaul of the Supreme Court-appointed committee's hearing process on the Aravali hill range. Activists allege the current process lacks inclusive public participation and that the mining lobby dominated recent sessions. The panel is tasked with reviewing the delineation of the hills and their ecological impact before August 31.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "a524567f"}, {"headline": "CAG report flags declining infrastructure investment in Delhi under AAP government", "summary": "A Comptroller and Auditor General (CAG) report tabled in the Delhi Assembly noted a declining trend in capital expenditure between 2015 and 2025. Subsidies rose by 172.48%, primarily due to electricity costs, leaving limited fiscal space for long-term assets. The report observed that capital expenditure ranged from 7% to 15% of total spending, reflecting constraints in infrastructure growth.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "e7bd5ef5"}, {"headline": "Delhi CM defends three-child limit for Lakshmi Yojana aid beneficiaries", "summary": "Chief Minister Rekha Gupta defended the three-child cap for the government's Lakshmi Yojana, which provides ₹2,500 monthly to women. Responding to criticism from Arvind Kejriwal, the CM stated the condition is intended to protect women's health. She emphasized that family planning decisions remain personal but the government prioritizes the well-being of mothers over population expansion.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "c5801ba6"}, {"headline": "Over 800 principal and vice-principal posts vacant in Delhi government schools", "summary": "According to a UPSC recruitment advertisement, 828 principal and vice-principal positions are vacant in Delhi government schools. The vacancies include 124 principal and 704 vice-principal roles across approximately 1,090 schools. The Directorate of Education currently operates with 50% of these senior administrative posts earmarked for direct recruitment to fill the gap.", "category": "Education", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "86dcd448"}, {"headline": "High Court gives Arvind Kejriwal four weeks to respond to ED", "summary": "The Delhi High Court granted former Chief Minister Arvind Kejriwal four weeks to respond to Enforcement Directorate pleas challenging his acquittal in two cases. The ED alleges Mr. Kejriwal intentionally avoided summonses related to the excise policy investigation. A trial court previously held that the agency failed to prove intentional disobedience by the AAP leader.", "category": "Law", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "a18e2b8f"}, {"headline": "Delhi Police maps 2,500 homeless children in city safety campaign", "summary": "The Special Police Unit for Women and Children mapped 2,500 homeless children found begging at major intersections during July. The initiative, part of the 'Child Beggar-Free Delhi' campaign, recorded the children's coordinates and photographs to assist social welfare departments. The effort aims to reduce the vulnerability of these children to crimes such as drug trafficking and theft.", "category": "Health", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "b0d631ed"}, {"headline": "Gurugram woman arrested for domestic help assault; released on bail", "summary": "A 52-year-old woman was arrested in Gurugram for allegedly assaulting her domestic help at an apartment in Sector 42. A viral video showed the accused hitting the victim and pulling her hair after a work-related argument. The woman was booked for voluntarily causing hurt and wrongful confinement before being released on bail. The victim had resigned shortly after the incident.", "category": "India", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "040aec81"}, {"headline": "Sanitation worker dies while cleaning manhole without safety gear in Faridabad", "summary": "A 34-year-old sanitation worker died and another was critically injured while cleaning a manhole outside a factory in Faridabad's Sector 25. The victims entered the sewer without safety equipment and suffocated due to toxic fumes. Police have initiated an investigation following allegations of negligence by the factory owner. Bunty, 37, remains under medical treatment.", "category": "India", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "37cac610"}, {"headline": "Centre gives in-principle nod to ₹2,574 crore Wazirabad water supply project", "summary": "A Union Finance Ministry committee granted 'in-principle' approval for the ₹2,574 crore Wazirabad Water Supply Improvement Project, assisted by the Asian Development Bank. The project involves upgrading water treatment plants, replacing damaged pipelines, and expanding the distribution network. The initiative aims to provide reliable water access to Delhi's growing population.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "08928077"}, {"headline": "JNU students hold outdoor discussion on Umar Khalid's book despite ban", "summary": "After JNU administration cancelled permission for an auditorium event, the students' union held an outdoor discussion on a book by former student Umar Khalid. The talk focused on 'Fractured Communities: Adivasi Histories'. Members of ABVP protested the event, chanting slogans against Khalid, who has been in jail for nearly six years awaiting trial for the 2020 Delhi riots case.", "category": "Education", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "a51d7605"}, {"headline": "Manipur government and United Naga Council hold 'fruitful' first round talks", "summary": "Talks between the Manipur government and the United Naga Council (UNC) were described as a 'fruitful icebreaker' following highway blockades. The UNC is demanding the abrogation of the Suspension of Operations pact with Kuki groups and action against those involved in killing Naga civilians. Both sides agreed to continue discussions, though the UNC maintains its blockade for now.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "2dd0146f"}, {"headline": "Supreme Court seeks reply on issuance of identity cards for NRC", "summary": "The Supreme Court sought responses from the Centre and Assam government regarding the delay in issuing National Identity Cards to those included in the 2019 NRC list. Petitions stated that the process is at a standstill for over 3.11 crore included persons. Meanwhile, former NRC coordinator Hitesh Dev Sarma has sought a re-verification of the list, citing multiple inaccuracies.", "category": "India", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "c30583fb"}, {"headline": "Suvendu Adhikari admits police negligence in custodial death of TMC worker", "summary": "West Bengal Chief Minister Suvendu Adhikari visited the family of TMC worker Birju Keot, who died in police custody at Halisahar. Adhikari announced ₹10 lakh compensation and a job for the victim's wife, admitting that police negligence was evident. An investigating officer has been suspended and a magistrate-level probe ordered. Adhikari also faced sloganeering during his visit.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "838226d3"}, {"headline": "Punjab Assembly passes nine Bills in one day amid Opposition walkout", "summary": "The Punjab Assembly passed nine Bills, including those on university establishment and tree protection, in a single day. Opposition parties slammed the move as 'majoritarian arrogance', claiming they were given insufficient time to study the legislations. The passed Bills cover diverse sectors such as education, taxation, and the regulation of fees in un-aided educational institutions.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "1535a357"}, {"headline": "Meghalaya’s Garo Hills council bars non-tribals from voting or contesting polls", "summary": "The Garo Hills Autonomous District Council approved amendments to election rules that will bar non-tribals from voting or contesting in council elections. The move establishes a separate electoral roll for the Sixth Schedule body, replacing the use of the general Assembly roll. The amendment follows long-standing demands to protect the rights and interests of the Garo tribal people.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "a7d4887a"}, {"headline": "Retired health official arrested for running female foeticide ring in Maharashtra", "summary": "Dr. Chandrakant Gunda Gaikwad, a former district civil surgeon, was arrested in Kolhapur for allegedly orch
