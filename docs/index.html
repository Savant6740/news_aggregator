": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "e1ea27b7"}, {"headline": "IndiGo strengthening systems to learn from December operational disruption", "summary": "IndiGo Managing Director Rahul Bhatia stated the airline has taken steps to learn from the massive flight cancellations faced in December last year. In the company's annual report, Bhatia emphasized a long-term vision focused on global expansion and building a global aviation hub in India. The airline is preparing to enter its most ambitious phase of growth over the next decade.", "category": "Infrastructure", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "310bcd77"}, {"headline": "Suzlon targets 3 Gw exports by FY31 to international markets", "summary": "Wind energy equipment maker Suzlon Energy plans to reach 3 Gigawatt in exports by FY31, focusing on Southeast Asia, Europe, and Australia. CEO Ajay Kapur noted strong demand in Australia for 5 Mw and 6.3 Mw turbines. Despite a 6% decline in Q1 net profit to ₹305 crore, the company is in active discussions with customers in Germany and Vietnam.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "4a790ea0"}, {"headline": "Telecom subscriber base rises to 1.35 billion in June", "summary": "India's telecom subscriber base grew marginally to 1.35 billion in June. According to Trai data, Bharti Airtel led growth with 3.16 million new users, followed by Reliance Jio with 2.29 million. Together, these two private operators accounted for 87% of the total net addition of 6.2 million subscribers during the month.", "category": "Technology", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "0c47879e"}, {"headline": "Instagram ‘copyright abuse’ racket in legal crosshairs of Delhi HC", "summary": "The Delhi High Court sought responses from the government and Meta on a PIL alleging that cybercriminals exploit Instagram’s copyright enforcement to extort creators. Perpetrators reportedly use manipulated older posts to file false strikes, leading to account suspensions. They then demand large sums to withdraw complaints. The PIL seeks a special investigation and human review for suspensions.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "0cff95f8"}, {"headline": "Indian spacetech startups raise $871 million as sector grows rapidly", "summary": "Spacetech startups in India have raised approximately $871 million across 241 funding rounds as of July 2026. This is a massive jump from the $43 million raised in 2021. More than 60% of the capital has gone to the top 10 most-funded startups, including Skyroot Aerospace. The sector covers launch vehicles, satellite manufacturing, and propulsion systems.", "category": "Science", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "74c7f883"}, {"headline": "Centre shifts export strategy to give states a bigger role", "summary": "The central government plans to increase state governments' involvement in export promotion. The strategy moves beyond financial incentives to addressing structural bottlenecks like logistics, branding, and certification. States are asked to prepare district-level export plans and industrial cluster development. The move aligns with WTO suggestions for India to achieve its $1 trillion goods target.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "eb393319"}, {"headline": "Reforms are a continuous necessity, not just fashionable: PM Modi", "summary": "Prime Minister Narendra Modi, in a meeting with government secretaries, emphasized that reforms must be a permanent feature of governance. He stressed the need for agility, innovation, and greater participation of young entrepreneurs in sectors like cybersecurity. He also highlighted the importance of proactive communication to counter misinformation regarding major government initiatives.", "category": "Politics", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "293bcecd"}, {"headline": "US and Japan urge India to address agricultural non-tariff barriers", "summary": "At a WTO review in Geneva, the US and Japan urged India to discipline unpredictable non-tariff barriers and export restrictions in the agriculture sector. They called for greater transparency and consistency with India's international commitments. Japan also expressed interest in India joining plurilateral initiatives on e-commerce and investment facilitation.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "9ad0f5b2"}, {"headline": "Industry seeks three-month extension for GST e-way bill changes", "summary": "Business bodies have asked the finance ministry to delay the implementation of new GST e-way bill rules scheduled for August 1. The changes require the 'Ship-to GSTIN' for recipients in Bill-to/Ship-to transactions. Industry cites concerns over commercial confidentiality and the need for more time to upgrade technology systems to capture customer data in real time.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "42af10ca"}, {"headline": "FPI inflows into FAR bonds fall 74% in July", "summary": "Foreign portfolio investment in India’s government bonds under the Fully Accessible Route (FAR) slowed sharply to ₹10,814 crore in July, a 74% drop from June's record. Sentiment was dampened by a rebound in crude oil prices and delays regarding India's inclusion in the Bloomberg Global Aggregate Index. However, analysts expect potential yield softening if global conditions stabilize.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "b23cbcd2"}, {"headline": "HDFC Bank penalises CEO Sashidhar Jagdishan over RBI directive violation", "summary": "HDFC Bank has imposed a token penalty of ₹1 lakh on CEO Sashidhar Jagdishan and two other senior executives for violating an RBI directive related to deposit rates offered to a state corporation. An internal review concluded the lapse was business overreach without mala fide intent. The move fixes accountability and clears the path for a decision on Jagdishan’s tenure extension.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "47e3bf1d"}, {"headline": "Washington hosts Zelenskyy and Netanyahu as wars reach critical juncture", "summary": "US President Donald Trump hosted Ukrainian President Volodymyr Zelenskyy and Israeli PM Benjamin Netanyahu for separate high-stakes talks. Zelenskyy is seeking advanced air defense and strategic cooperation, while Netanyahu aims for progress on Abraham Accords expansion and US support for his re-election. Trump signaled a desire to avoid further escalation in the Iran conflict.", "category": "World", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "8d5bd64f"}, {"headline": "Public sector banks’ profit trebled in five years to record high", "summary": "The net profit of India's public sector banks (PSBs) surged to a record ₹1.98 trillion in FY26, nearly three times the levels seen five years ago. Improvement was driven by a sharp drop in the gross non-performing asset (GNPA) ratio to an all-time low of 1.9%. Lending growth remained strong in retail, MSME, and agriculture sectors, reflecting healthier balance sheets.", "category": "Economy", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "301e04c3"}, {"headline": "Isro attrition spikes as its salary expenditure share declines", "summary": "The Indian Space Research Organisation (Isro) is facing a shrinking workforce, with total employees falling to 14,637 in 2025. Data reveals that salary expenditure as a share of revenue expenditure has declined sharply across all divisions. This comes as the Department of Space tightens exit rules for scientists following a wave of resignations during critical missions.", "category": "India", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "f566ceeb"}, {"headline": "BFSI firms double cybersecurity insurance cover to $100 million", "summary": "Indian banks and financial institutions have doubled their cybersecurity insurance limits to $50-100 million in FY26, up from $10-25 million five years ago. The shift is driven by rising cyberattacks, data breaches, and stricter regulatory scrutiny. While premium rates have remained largely stable, the total market for cyber insurance in India has grown to over ₹1,000 crore annually.", "category": "Business", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "e8623296"}, {"headline": "Indian IT stocks on course to beat global chipmakers in July", "summary": "The Nifty IT index has jumped 16% this month, while global semiconductor makers have slipped 13%. This divergence suggests investors are moving out of the AI hardware trade into beaten-down Indian software services. Analysts believe India's limited exposure to AI hardware has insulated it from a broader global sell-off triggered by concerns over capital spending by tech giants.", "category": "Business", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "68c9bbc7"}, {"headline": "Only 6% of prominent Indian finfluencers are Sebi registered: Report", "summary": "A study by the CFA Institute reveals that only 6% of prominent financial influencers in India are registered with Sebi as investment advisers. Despite a regulatory crackdown, 33% continue to provide explicit stock recommendations. The report also noted that more than a third fail to disclose conflicts of interest, such as paid sponsorships or affiliate relationships, in their social media posts.", "category": "Business", "page": 21, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "f79cdcde"}, {"headline": "HUL Warns of Price Hikes as Raw Material Costs Rise", "summary": "Hindustan Unilever Ltd (HUL) reported a 10% revenue increase to ₹17,341 crore for the June quarter, though net profit fell 2% to ₹2,680 crore as input costs climbed. Sales volume grew 5%. Management indicated it may implement calibrated price hikes of 2-5% in the September quarter to offset inflation driven by monsoon conditions and geopolitical volatility in West Asia.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "f46a402f"}, {"headline": "Corporate Revenue Hits Three-Year High but Profit Growth Stalls", "summary": "An analysis of 393 companies shows June quarter revenue grew at its fastest pace in three years, but profits remained flat. While total income rose 18%, expenditure surged 26.5% due to high commodity prices. Excluding financial firms, the non-banking sector saw income rise 26% while operating profitability was eroded by a 35% jump in costs, highlighting margin pressures across India Inc.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2c2c0697"}, {"headline": "Ratan Tata Endowment Fund Received Undisclosed Cash and Shares", "summary": "Investigation of filings shows the Ratan Tata Endowment Fund (RTEF) received a ₹45 crore cash gift, 1% equity in Tata Digital, and an unsecured loan from Tata Group companies starting in 2022. RTEF also purchased Tata Technologies shares at a discount prior to its IPO, later realizing a ₹158 crore profit. The transactions were approved by boards but were not publicly disclosed in annual reports.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "19511014"}, {"headline": "Sebi Proposes Revamping Online Dispute Redressal for Faster Grievance Handling", "summary": "The Securities and Exchange Board of India (Sebi) seeks to shift the administration of online dispute resolution (ODR) from private institutions to market infrastructure institutions like exchanges and depositories. The overhaul aims to address delays in appointing arbitrators and weak enforcement of awards. Investors may receive up to ₹5 lakh while an appeal is pending under the new rules.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "88f2cbad"}, {"headline": "Domestic Commitments Keep Indian Graduate Women Out of Job Market", "summary": "Periodic Labour Force Survey data shows sharp gender differences in why graduates stay out of the labor force. For men aged 20-29, 95.9% cited education as the primary reason. However, 58.4% of women in the same age group and 90.8% of women aged 30-39 cited domestic and care commitments. The findings highlight structural barriers to female workforce participation among highly educated Indians.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "4ff8c935"}, {"headline": "Cult.Fit Targets IPO as Gym Business Moves Toward Operational Profitability", "summary": "Fitness company Cult.Fit, valued at approximately ₹12,600 crore, has filed for an IPO. The firm operates 708 centers with nearly 1 million members. While its fitness center revenue grew at a 33% CAGR over two years, 90% of revenue remains concentrated in four major cities. The company is shifting to an asset-light franchise model to improve capital efficiency and narrow product-side losses.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2d8b4a07"}, {"headline": "India Public Sector Banks Post Record Low Bad Loan Ratios", "summary": "Public sector banks (PSBs) ended FY26 with gross non-performing assets (NPAs) falling to a record low of 1.9%. Combined net profits reached an all-time high of ₹1.98 trillion. The finance ministry informed Parliament that the aggregate business of PSBs grew to ₹283.3 trillion, supported by 19.8% retail loan growth and a strengthened capital adequacy ratio of 16.6%.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "55c93dd0"}, {"headline": "Government Plans Broad Overhaul of PLI Scheme for Bulk Drugs", "summary": "The Centre plans to revamp the Production-Linked Incentive (PLI) scheme for bulk drugs to focus on R&D, infrastructure, and financing. Pharmaceuticals secretary Manoj Joshi stated the revised policy will help reduce dependence on imports for critical drugs like penicillin G and respiratory antibiotics. As of March 2026, the current scheme has generated sales worth ₹3,270 crore.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2f447ac4"}, {"headline": "Exam Reforms Task Force Focuses on Rebuilding Trust After NEET Leak", "summary": "V. Kamakoti, IIT Madras director and member of the government's exam reforms task force, stated that rebuilding public trust is the biggest challenge following the NEET paper leak. Investigations revealed the leak happened at the paper-setting stage rather than during distribution. The committee will propose multi-layered technology and rigorous selection processes for paper setters by August.", "category": "Education", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2625b4a6"}, {"headline": "Sugar Stock Limits Imposed Until November to Curb Festival Season Prices", "summary": "The Centre has imposed stockholding limits on sugar dealers from 1 August to 30 November to prevent hoarding and speculative trading. The food ministry noted that recent increases in ex-mill sugar prices were not supported by demand-supply fundamentals. The move is designed to ensure adequate supplies and stable prices for consumers during the upcoming festival season.", "category": "Economy", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "56dcea76"}, {"headline": "Odisha Crackdown on Miners Misrepresenting Ore Grades for Lower Royalties", "summary": "The Odisha directorate of mines is investigating local officials after miners were found falsifying ore grades to pay lower royalties. Falsification was discovered during inspections of low-grade ore exports. Local officials have been asked to explain verification lapses in a crackdown that could disrupt domestic and international sales from one of India's major mining hubs.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "63f26593"}, {"headline": "Tata Power Plans First Commercial Nuclear Plant by 2032", "summary": "Tata Power aims to build its first nuclear power plant by 2032 following the end of the state monopoly on atomic energy. The company has shortlisted sites in three states as part of its strategy to bolster energy security and decarbonize. The push into nuclear power follows government efforts to invite private investment to reach net-zero goals.", "category": "Infrastructure", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "185bb051"}, {"headline": "Government Establishes India Digital Payment Intelligence Corporation to Fight Fraud", "summary": "Finance Minister Nirmala Sitharaman announced the creation of the India Digital Payment Intelligence Corporation (IDPIC). The new body will share real-time fraud intelligence and alerts with banks and financial institutions to contain rising cyber financial crimes. The initiative aims to provide a coordinated response to digital payment vulnerabilities and protect consumers.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "a0030c9e"}, {"headline": "Bharat Electronics Q1 Revenue Grows 25 Percent on Strong Execution", "summary": "Bharat Electronics Ltd (BEL) reported a 25% year-on-year increase in June quarter revenue to ₹5,533 crore, though Ebitda margins contracted to 25.1% due to high raw material costs. The company's order book remains robust at ₹72,300 crore, providing significant revenue visibility. BEL is focusing on indigenization and expanding its drone and counter-drone systems portfolio.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2215bf99"}, {"headline": "Coforge Reports Record Deal Wins and Operating Margin Beat", "summary": "IT services firm Coforge saw its shares surge 10% after posting a record executable order book of $2.23 billion for the June quarter. Organic revenue grew 5.2% sequentially in constant currency. The company guided for a full-year standalone Ebit margin of 16.5%. The results included contributions from the Encora acquisition, which added $100.7 million in revenue over two months.", "category": "Technology", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "08d57708"}, {"headline": "Brokers Target Niche Segments to Win Experienced Traders", "summary": "With over 5,000 firms in the industry, stockbrokers are moving beyond zero-brokerage models to offer specialized tools. Platforms like Sahi have built in-house charting systems, while Dhan's 'Millions' app targets Gen Z with goal-based investing. Brokers are also focusing on professional traders with apps like '915' by Groww to differentiate in a crowded market.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2dfb3a5e"}, {"headline": "Mutual Funds Turn to Covered Call Strategies Amid Market Volatility", "summary": "Institutional investors have increased net outstanding stock call net sale positions to over 433,000 contracts to hedge against market choppiness. Arbitrage and equity savings funds are using covered call options to generate incremental income and limit losses as geopolitical tensions impact crude prices and corporate profitability. DII net sale positions have risen steadily since February.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "222bc193"}, {"headline": "Ferns N Petals Ramps Up Quick Commerce Presence Before Listing", "summary": "Gifting giant Ferns N Petals (FNP) expects its quick-commerce and food revenue to reach ₹125 crore this year, up from ₹8 crore in FY25. CEO Pawan Gadia stated the company pivoted to instant delivery platforms after seeing high consumer search volume. FNP is investing in cold chain infrastructure as it prepares for a potential initial public offering by early FY29.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "fef0a670"}, {"headline": "Petrol Retailers Seek Reimbursement for E20 Fuel Quality Testing Costs", "summary": "Fuel station operators have asked the petroleum ministry to bear the costs of mandatory E20 quality checks. Dealers claim the prescribed water-mixing test renders fuel samples unfit for sale, leading to significant financial losses. They are calling for scientifically validated non-destructive testing equipment and a standard operating procedure for ethanol-blended petrol.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "9db15763"}, {"headline": "Welspun One to Exit Maiden Logistics Fund via Asset Sale", "summary": "Welspun One is winding down its first ₹500-crore logistics parks fund and has appointed CBRE to sell the remaining four assets. The portfolio, spanning 4.5 million sq. ft across cities like Bengaluru and Lucknow, is expected to have an enterprise value exceeding ₹1,600 crore. The exit marks the planned lifecycle completion of the fund launched in 2020-21.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "6590f2f9"}, {"headline": "Tata Communications Identifies One Billion Dollar Data Centre Connectivity Opportunity", "summary": "Tata Communications CEO Ganesh Lakshminarayanan expects a five-fold increase in Indian data centre capacity, creating a $1 billion networking opportunity. The company is pivoting toward managed network services and digital infrastructure to revive profitability. Despite a 50% drop in Q1 net profit to ₹129.72 crore, the firm is targeting absolute Ebitda growth through cloud and security services.", "category": "Infrastructure", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "f0a8732e"}, {"headline": "IndiGo Plans to Raise Borrowing Limit to 1.1 Trillion Rupees", "summary": "InterGlobe Aviation (IndiGo) is seeking shareholder approval to increase its borrowing limit by 57% to ₹110,000 crore. The airline plans to use 75% of the incremental capacity to finance aircraft leases as it prepares to take delivery of 900 aircraft through 2035. The move supports IndiGo's target of operating a fleet of over 550 aircraft and flying 200 million passengers by 2030.", "category": "Infrastructure", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "ec3f3432"}, {"headline": "Samsung Considers Subscription Fees for Advanced Galaxy AI Features", "summary": "Samsung South-west Asia CEO J. B. Park stated the company may introduce a monthly subscription for heavy users of Galaxy AI to offset soaring computing and memory costs. While 90% of basic AI features will remain free, premium services involving cloud servers may be monetized. The move comes as memory chip prices triple and smartphone manufacturing costs rise globally.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "f8f6fbd1"}, {"headline": "SK Finance Backers Negotiating 60 Million Dollar Secondary Stake Sale", "summary": "Early investors in Jaipur-based NBFC SK Finance, including TPG and Norwest, are in talks with Kenro Capital for a partial stake sale worth $50–60 million. The discussions follow the company's decision to postpone its ₹2,200 crore IPO due to market conditions. The secondary round may also include a primary capital raise as multiple funds express interest in the asset.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "b89cf3a8"}, {"headline": "West Asia War Impacts L&T Margins and Order Inflow", "summary": "Larsen & Toubro Ltd (L&T) reported a June quarter profit of ₹4,123 crore, missing estimates. Revenue grew 7% to ₹67,942 crore, aided by one-off gains. However, Ebitda margins fell to 9% as the US-Iran war and Hormuz Strait blockade delayed material shipments and slowed execution in the infrastructure segment. The company maintains a record order book of ₹7.8 trillion.", "category": "Infrastructure", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "bf1bc7d2"}, {"headline": "Canara Bank Reviews Cybersecurity Architecture Following Peer Data Breach", "summary": "Canara Bank has initiated a review of its cybersecurity systems and earmarked over ₹2,000 crore for technology upgrades. The move follows a data breach at Bank of Baroda involving a terabyte of leaked information. CEO Brajesh Kumar Singh stated the bank is adopting best-in-class solutions to protect customer trust as AI-driven cyber threats grow more sophisticated.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "346c024d"}, {"headline": "Inflexor Ventures Announces 400 Crore Rupee First Close for Fund III", "summary": "Science and technology-focused VC firm Inflexor Ventures has reached a first close of ₹400 crore for its third fund, targeting ₹1,250 crore. The fund is anchored by HDFC AMC and the Self-Reliant India Fund. It will focus on pre-Series A and Series A investments in deep-tech and IP-driven startups, writing cheques between ₹15-45 crore for globally ambitious Indian companies.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "6396f096"}, {"headline": "Regional OTT Platforms Offer Revenue Lifeline to Small Budget Films", "summary": "As major streamers like Netflix and Prime Video turn cautious, regional films in languages like Tamil, Gujarati, and Odia are finding a lifeline through new local channels and OTT platforms. Sony Vizha and Gujarati firm JOJO Ltd are expanding acquisitions of mid-budget titles that lack big star power. These platforms provide critical monetization paths for films unsold after theatrical runs.", "category": "Culture", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "278dd360"}, {"headline": "Mint Sustainability Impact Summit Focuses on ROI of Climate Responsibility", "summary": "The fifth edition of the Mint Sustainability Impact Summit in Mumbai brings together 50 speakers to debate the economics of the net-zero transition. Key themes include the environmental cost of AI, carbon market credibility, and cutting Scope 3 emissions in supply chains. Leaders from SBI, Lupin, and Tata Sons will discuss how firms balance decarbonization with global competitiveness.", "category": "Environment", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "5999eb54"}, {"headline": "IPL Franchise Valuations Surge as RCB and Rajasthan Royals Secure Deals", "summary": "The sales of Royal Challengers Bengaluru ($1.78 billion) and Rajasthan Royals ($1.65 billion) have pushed the IPL into the ranks of global elite sports investments. Houlihan Lokey reports the league's enterprise value rose 11.4% to $20.6 billion. Predictable cash flows from media rights and a lack of relegation risk make IPL teams highly attractive to institutional capital and private equity.", "category": "Sports", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "2e10e0c1"}, {"headline": "Iran and Oman Negotiate Shipping Route Agreement for Strait of Hormuz", "summary": "Diplomatic talks between Iran and Oman have accelerated to establish a safe passage route for ships in the Strait of Hormuz. The waterway previously carried 20% of global oil production. While disagreements remain over transit fees, negotiators hope a temporary 10-day truce and formal maritime security protocol can end current blockades and prevent further military strikes.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "924d8e9a"}, {"headline": "Meta Faces Multibillion Dollar Liability from Teenage User Safety Lawsuits", "summary": "Meta Platforms is defending thousands of lawsuits alleging its apps are intentionally designed to be addictive and harmful to minors. A New Mexico judge warned the company could face $3.7 billion in damages, while other cases seek up to $1.4 trillion. The legal battles come as Meta spends $145 billion on AI infrastructure, potentially impacting its core business model and financial results.", "category": "Law", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "eb75616c"}, {"headline": "Fed Chairman Kevin Warsh Faces Internal Debate Over Monetary Policy", "summary": "Federal Reserve Chairman Kevin Warsh has initiated external task forces to review the Fed's inflation framework and communications. His 'quiet' approach and refusal to signal future rate moves have created tension with colleagues like Christopher Waller. As markets remain uncertain about a potential hike, Warsh's focus is on ending stale data habits and encouraging a 'good family fight'.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "e19bf17b"}, {"headline": "Amazon Data Centres in Bahrain Sustained Damage from Iran Strikes", "summary": "Satellite imagery confirmed damage to two Amazon.com Inc. data centres in Bahrain following missile strikes by Iran’s Revolutionary Guard. Iran alleged the sites were targeted for supporting US military operations. The incident highlights the growing strategic vulnerability of digital infrastructure and AI processing hubs in regional conflict zones during the ongoing West Asia war.", "category": "World", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "4961e19d"}, {"headline": "Supreme Court Directs Protection of Data for Exam Leak Protesters", "summary": "The Supreme Court ordered the release of minors arrested during youth protests over paper leaks and directed authorities to preserve all surveillance footage, including drone and CCTV data. Chief Justice Surya Kant barred any coercive action against participants and emphasized that protesters' digital and personal data must not be made public following allegations of police brutality.", "category": "India", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "22508078"}, {"headline": "Singapore Airlines Posts First Quarterly Loss Since Pandemic", "summary": "Singapore Airlines (SIA) reported a net loss of S$76 million for the June quarter, its first since 2022. The loss was attributed to losses from associate Air India and soaring jet fuel costs linked to the Middle East conflict. Despite record revenue and robust travel demand, rising passenger yields are failing to keep pace with the inflated costs of airline operations and supply chain disruptions.", "category": "Business", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "6e26410a"}, {"headline": "China Targets AI Chip Self-Sufficiency Within Three Years", "summary": "China has launched a state-led effort to rival Nvidia and achieve AI hardware self-sufficiency by 2029. Using 'fine-carving' and circuit stacking, Huawei and local partners aim to bypass US export curbs on advanced lithography machines. Huawei has already reduced dependence on foreign chips to under 60%, with plans to hit 25% within five years despite considerable technological gaps.", "category": "Technology", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "9019349b"}, {"headline": "Returning NRIs Face Financial Challenges While Caring for Ageing Parents", "summary": "A survey found 74% of NRIs cite ageing parents as a primary reason for returning to India. Relocating involves significant income reset, with some returnees accepting 30-70% lower salaries. Out-of-pocket medical expenses often consume 10-20% of income. Financial experts recommend auditing overseas assets and tax planning at least six months before the move to ensure long-term stability.", "category": "Economy", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "25277f09"}, {"headline": "Bitchat App Takedown Order Criticized as Blow to Tech Regulation", "summary": "The government issued a three-hour takedown notice to GitHub for the open-source code of Bitchat, a peer-to-peer mesh messaging app. Authorities cited concerns that the lack of central servers prevents lawful interception. Legal experts argue the move reverses the priority of privacy and may trigger the 'Streisand Effect', drawing more users to the decentralized application.", "category": "Technology", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "3bc7df19"}, {"headline": "Fitness Trackers Provide Useful Health Trends but Lack Diagnostic Accuracy", "summary": "While wearables like Oura rings and Whoop bands offer data on sleep, heart rate variability, and movement, physicians warn they are screening tools, not medical devices. Algorithms across different brands interpret metrics like VO2 max differently, leading to inconsistent scores. Experts suggest using health app data as a lifestyle trend indicator rather than a definitive medical diagnosis.", "category": "Technology", "page": 22, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132066", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132066"}], "article_id": "4161a1fd"}, {"headline": "Adani Ports Weighs Majority Stake in Associated British Ports", "summary": "Adani Ports and Special Economic Zone is reportedly considering a bid for a controlling stake of about 63.9% in Associated British Ports (ABP), the UK's largest port operator. The stake is currently held by Canada Pension Plan Investment Board. ABP operates 21 ports in the UK, handling approximately £40 billion of exports annually and providing significant offshore wind infrastructure.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "35fd236a"}, {"headline": "Nvidia-backed Neoclouds Eyes Data Centre Lease Capacity in India", "summary": "At least six Nvidia-backed global neocloud companies are in talks to lease data centre capacity in India from local operators. These firms, including CoreWeave and Together AI, are attracted by India's 20-year tax break, high-end engineering talent, and lower infrastructure costs. The move aims to provide high-performance compute capacity for AI inference and training workloads.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "1ea71e8c"}, {"headline": "Government Identifies 40 Cities for Eased Immigration Procedures", "summary": "The government has identified 40 cities for allowing liberalized airport immigration and cargo-screening rules to facilitate easier travel and faster trade. The move aims to empower smaller towns and enable faster clearance for passengers and cargo. Civil aviation secretary Samir Sinha stated this is part of a broader push to develop major Indian airports into international hubs.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "d60df123"}, {"headline": "BDR Pharma in Discussions to Acquire Acme Formulation", "summary": "Mumbai-based BDR Pharmaceuticals is in advanced talks to acquire a controlling stake in contract development and manufacturing organization Acme Formulation. The deal, valued at $200-250 million, would see private equity firm PAG exit its 62% stake. The acquisition is expected to strengthen BDR's presence in high-growth segments like oncology and dermatology.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "4ed262c3"}, {"headline": "UpGrad and Unacademy Merger Nears Finalization with New Valuation", "summary": "Edtech firms UpGrad and Unacademy are nearing a merger deal valued at approximately ₹1,955 crore. Under the terms, Unacademy's investors will receive a board seat in the merged entity. The valuation is significantly lower than their previous peak valuations. Almost all institutional investors have signed the share subscription agreement as the companies aim to consolidate operations.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "ad1d4f96"}, {"headline": "Lok Sabha Debates Toughened Anti-Paper Leak Amendment Bill", "summary": "The Lok Sabha discussed the Public Examination (Prevention of Unfair Means) Amendment Bill, 2026. The legislation aims to strengthen the law against paper leaks by introducing stricter punishments, including up to 10 years in prison and ₹50 lakh fines. Minister Jitendra Singh stated the bill is intended to safeguard the interests of students and ensure merit-based selection.", "category": "Politics", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "ad21ac75"}, {"headline": "TDP and Sena Seek Multiple NEET Attempts Per Year", "summary": "NDA allies TDP and Shiv Sena (Shinde) have urged the government to allow students to take the NEET exam multiple times a year instead of once. They argue that a single attempt per year unfairly penalizes students who miss the date due to medical or family emergencies. They also called for stricter regulation of coaching institutes to reduce the financial burden on students.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "406cc8fd"}, {"headline": "Foreign Secretary Misri Holds High-Level Talks in Beijing", "summary": "Indian Foreign Secretary Vikram Misri met with top Chinese officials in Beijing to discuss stabilizing the bilateral relationship. Talks focused on maintaining peace and tranquility along the border and preparing for National Security Advisor Ajit Doval's potential visit. Both sides acknowledged the importance of managing differences and enhancing political and people-to-people exchanges.", "category": "India", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "8abd5530"}, {"headline": "Delhi Government Approves ₹2,500 Monthly Aid for Women", "summary": "The Delhi government has approved the Mukhyamantri Mahila Samman Yojana, which provides ₹2,500 per month to eligible women aged 18-60. The scheme, expected to benefit 17 lakh women, targets those with an annual family income below ₹2.5 lakh. Registration for the program will begin on August 1, 2026, with financial assistance starting from the 2026-27 financial year.", "category": "Politics", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "785d1ffd"}, {"headline": "Government Formulates Cybersecurity Rules for Modern Vehicles", "summary": "The Indian government has begun drafting a comprehensive cybersecurity framework for all new vehicles, including electric e-rickshaws. The rules, expected to be ready in six months, will address vulnerabilities in autonomous features, data collection, and over-the-air updates. Manufacturers will be required to ensure high-grade protection against remote hacking and unauthorized battery tampering.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "91c1c754"}, {"headline": "MSME Bill Introduced in Rajya Sabha to Speed Up Payments", "summary": "The government has introduced the MSME Development (Amendment) Bill, 2026, in the Rajya Sabha. The bill aims to establish a framework for addressing delayed payments to small businesses and improving ease of doing business. Key provisions include strengthening the mediation process for disputes and giving state governments more flexibility in the composition of MSE Facilitation Councils.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "8b9cb1ee"}, {"headline": "ADB Approves $1.85 Billion Loans for India’s Urban Reforms", "summary": "The Asian Development Bank has approved loans totaling $1.85 billion to support urban reforms and clean energy projects in India. The funding includes $1 billion for urban development and $850 million for the second phase of rooftop solar deployment. The initiative aims to provide financial assistance to over 3.7 million rooftop solar installations across the country.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "e6e45271"}, {"headline": "Indus Towers to Launch African Operations This Quarter", "summary": "Indus Towers plans to commence operations in Africa this quarter, starting with Namibia, Zambia, and Uganda. The company is setting up necessary infrastructure and securing regulatory approvals to provide passive telecom services. This international expansion aims to tap into high-growth opportunities beyond India, focusing on tower sharing and data centre services in the region.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "2f3f715f"}, {"headline": "Air India Provisional Q1 Loss Expected to Cross ₹1,200 Crore", "summary": "Air India is expected to report a provisional loss exceeding ₹1,200 crore for the first quarter of FY27. The losses are attributed to sharply higher fuel costs and the closure of several international airspaces. Despite aggressive network expansion and new aircraft inductions, high operating expenses and competitive pressures continue to impact the airline's financial performance.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "8154761b"}, {"headline": "NTPC Plans ₹16.7 Lakh Crore Capital Expenditure Over 11 Years", "summary": "State-run power producer NTPC is set to invest ₹16.78 lakh crore over the next 11 years to triple its power generation capacity to 250 GW by 2037. The plan includes a major focus on nuclear, renewable energy, and green hydrogen. Approximately ₹1.08 lakh crore will be spent between FY26 and FY27 to accelerate India's transition to clean energy sources.", "category": "Infrastructure", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "020a83c8"}, {"headline": "Canara Bank to Raise ₹8,000 Crore in Capital Funds", "summary": "Canara Bank has decided to frontload its Expected Credit Loss (ECL) provisioning and plans to raise ₹8,000 crore in capital during the current financial year. The bank aims to strengthen its capital adequacy ratio, which stood at 17.17% at the end of June. The funds will be raised through a mix of equity shares and tier-2 bonds to support future growth and risk management.", "category": "Economy", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "10e06ed3"}, {"headline": "Visa to Cut 7% of Workforce to Improve Operational Efficiency", "summary": "Payments giant Visa is planning to eliminate approximately 2,600 jobs, representing about 7% of its total workforce. The cuts will primarily affect the company's technology and product teams as it seeks to streamline operations and invest in higher-growth opportunities. CEO Ryan McInerney stated the decision is necessary for long-term competitiveness and financial health.", "category": "World", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132072", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132072"}], "article_id": "871699e8"}, {"headline": "Air India crash report in sealed cover after pilot dad’s plea", "summary": "The Supreme Court accepted the plea from the father of a pilot killed in the Ahmedabad air crash, ruling that the final inquiry report, due in October, would not be made public. The Centre confirmed it would furnish the report in a sealed cover to the court.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "dd18eb0b"}, {"headline": "Dehradun’s Rs 16cr bridge lasts 16 days after opening", "summary": "A Rs 16-crore bridge in Dehradun, opened just 16 days prior, collapsed after its approach road was washed away by heavy rain. Officials maintain the bridge is structurally safe but criticism mounts over construction quality. This incident followed a previous bridge collapse in Sept.", "category": "Infrastructure", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "36f55252"}, {"headline": "Centre to table bill to make deepfakes, digital arrest offences", "summary": "The government plans to introduce a bill in Parliament to define digital arrest and AI-generated deepfakes as distinct offences with specific punishments. This follows a Supreme Court observation that existing laws don't adequately cover these crimes, which are linked to extortion and organised crime.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "3e8869be"}, {"headline": "Govt caps sugar stocks at 400 tonnes for dealers", "summary": "The government has ordered a cap on sugar stocks for dealers at 400 tonnes until November 30. Traders must liquidate any excess stock by August 1, when the directive comes into force. The measure aims to regulate market supply.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "d1c87876"}, {"headline": "PM Modi to open youth centre in Mysuru on Aug 1", "summary": "Prime Minister Modi will inaugurate the Swami Vivekananda Cultural Youth Centre and the restored Vivekananda Memorial in Mysuru on August 1. He will address a public function, and the ashrama will honour him with a Swami Vivekananda sculpture by Arun Yogiraj.", "category": "Culture", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "03c210fe"}, {"headline": "Karnataka overhauls B&B, homestay rules after tourist crimes", "summary": "Karnataka government revamped homestay and B&B regulations following two high-profile tourist crimes. New rules mandate police verification for all staff, CCTV cameras at reception with 30-day footage retention, and digital/physical guest registers. Separate operational guidelines will be issued for B&Bs.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "dd2e6946"}, {"headline": "China growing at 4.3%, but economy shows signs of weakness", "summary": "China's second-largest economy grew 4.3% in Q2, but cautious shoppers, a sinking property market, and reliance on exports indicate underlying weakness. Domestic demand struggles, leading to concerns about the drivers of growth and potential global trade friction, including for India.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "a14d9688"}, {"headline": "India performs 3rd-highest transplants, but meets fraction of need", "summary": "India conducts the world’s third-highest number of organ transplants, yet meets only 7.2% of kidney, 1.5% of liver, 1.2% of lung, and 0.2% of heart transplant needs. A Lancet study reveals significant unmet demand, projected to rise to 4.63 lakh annually by 2040.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8d63f30d"}, {"headline": "SC to cops: Probe FIRs, but no coercive action against students", "summary": "The Supreme Court directed police in Delhi, Bihar, UP, Maharashtra, Assam, West Bengal, and Kerala to investigate registered FIRs but refrain from coercive action against protesting students. Minors without criminal antecedents must be released, and protesters' personal data is not to be publicly disclosed.", "category": "Law", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "272b6023"}, {"headline": "CBI charges 13 for NEET paper leak, NTA experts included", "summary": "The CBI filed a chargesheet against 13 individuals in the NEET-UG 2026 paper leak case, including three NTA subject experts and middlemen. They face charges of criminal conspiracy, cheating, and destruction of evidence. Trial completion is expected within three months if the paper leak bill passes.", "category": "Law", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "13cd24e0"}, {"headline": "Pellet gun use on protesters authorised, all SOPs followed: CRPF", "summary": "The CRPF stated that all standard operating procedures and anti-riot drills were followed during the July 20 police action against anti-NEET leak protesters, including the authorised use of \"non-lethal\" pellet guns after other measures failed.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "233fa45c"}, {"headline": "Man, 27, buried alive in circus stunt suffocates to death", "summary": "A 27-year-old man suffocated to death after being buried in a sack during a bizarre circus stunt in Nuh, Gurgaon. His death was discovered days later when other stunt group members dug up the ground for the finale, expecting him to emerge alive.", "category": "India", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "841a270c"}, {"headline": "Mys girl Shilpa wins C’wealth bronze in F57 shot put", "summary": "Shilpa K S, 36, from Mysuru, won bronze in the F57 shot-put event at the Commonwealth Games in Glasgow with a personal best of 7.26m. An inspiring journey, Shilpa overcame childhood accident and financial hardship, now aiming for the 2028 Paralympics.", "category": "Sports", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e86d1952"}, {"headline": "Maha & Assam start dropping CJP cases after SC order", "summary": "Maharashtra and Assam began withdrawing police cases against students protesting the NEET paper leak, following a Supreme Court order barring coercive action. Maharashtra CM Fadnavis directed immediate action, while Assam ordered release of 13 arrested individuals and case withdrawals.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8e2ca7d0"}, {"headline": "Kol court flips jail order to bail for protesters after SC ruling", "summary": "A Kolkata court reversed its jail custody order for 16 NEET protesters, granting them bail, just hours after an initial remand order. The shift came after the Supreme Court restrained states from coercive action, and the state government confirmed \"no coercive measures.\"", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e7041eb2"}, {"headline": "Junaid Malik moves SC against police action for aiding CJP protest", "summary": "Junaid Malik, who distributed food at the CJP protest in Jantar Mantar, moved the Supreme Court, accusing Delhi police of kidnapping him, questioning his funding, and abandoning him near Dehradun. He also alleged harassment of his family by UP police.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "03bd791a"}, {"headline": "India is second-largest sailor supplier in world, BIMCO-ICS report says", "summary": "India has become the world’s second-largest supplier of sailors, with a 12.2% share of the global seafaring workforce, according to the BIMCO–ICS Seafarer Workforce Report 2026. Indian officers constitute 13.4% and ratings 11.29% of the global workforce, reflecting years of reforms.", "category": "Economy", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8b9a8a0b"}, {"headline": "Jackal on biting spree leaves 13 hurt in MP district", "summary": "A wild jackal went on a biting spree in Itarsi town, Madhya Pradesh, injuring 13 people, including children, in a residential area. Victims suffered severe bite injuries and were administered anti-rabies vaccination. The incident caused panic.", "category": "India", "page": 7, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "03296be0"}, {"headline": "Trucker in lungi to cops: My trousers with Aadhaar, cash missing", "summary": "A truck driver in Bhind, Madhya Pradesh, reported his trousers, containing Rs 1,500, Aadhaar card, and driving licence, missing after he fell asleep intoxicated. Police, unable to get useful details, offered him Rs 400 to return home.", "category": "India", "page": 7, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "816880bd"}, {"headline": "Teen critical after family delays cobra bite treatment for rituals", "summary": "A 15-year-old boy in Mandsaur, Madhya Pradesh, is on ventilator support after a cobra bite. His family delayed medical treatment, opting for superstitious rituals at a local temple, losing crucial time before a snake rescuer intervened.", "category": "Health", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "4e8d3567"}, {"headline": "Generational change: Who next for Congress after Siddaramaiah, DKS", "summary": "Karnataka Congress is grooming a second line of leaders as former CM Siddaramaiah exits electoral politics. The party aims to balance caste equations, regional representation, and governance, identifying young faces like Priyank Kharge, Krishna Byre Gowda, and Sharath Bachegowda for future leadership roles.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "20c02a1e"}, {"headline": "DKS calls MPs’ meet in Delhi a major success", "summary": "Karnataka CM DK Shivakumar declared his meeting with Karnataka MPs in New Delhi a major success, citing unprecedented cross-party response. The focus was on jointly pursuing pending central projects, securing funds, and obtaining drought relief for Karnataka, stressing unity for state development.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e37522d3"}, {"headline": "Farmers resist land acquisition for Bengaluru’s 2nd airport", "summary": "Farmers in Bengaluru South are opposing the proposed second international airport, citing fears of displacement, loss of fertile farmland, and relocation of ancestral shrines. Several villages are uniting against land acquisition, with local leaders seeking political backing to pressure the government.", "category": "Infrastructure", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "a4084969"}, {"headline": "CM DKS to make first visit to Mysuru on Friday", "summary": "CM DK Shivakumar will make his first visit to Mysuru on Friday, a day before PM Modi's scheduled program. The visit was advanced due to security arrangements for the PM, with a grand reception planned for the CM.", "category": "Politics", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "fd16ba88"}, {"headline": "Officials eat meat at temple, Khandre seeks suspension", "summary": "Rural Development Minister Eshwar Khandre sought the immediate suspension of six department officials for allegedly drinking alcohol and eating meat during office hours near the holy shrine of Siddara Betta. A detailed departmental inquiry is pending.", "category": "Law", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "846018a2"}, {"headline": "Push for HAL revival won’t mar Bengaluru’s second airport plan", "summary": "The state's push to reopen the old HAL airport for commercial operations is unlikely to derail plans for Bengaluru's second international airport. Officials confirm both proposals are independent, with work continuing on the four shortlisted sites for the new airport.", "category": "Infrastructure", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8f74f597"}, {"headline": "NPS Yeshwantpur hosts Goonj 2026 inter-school cultural fest", "summary": "National Public School, Yeshwantpur, hosted Goonj 2026, an inter-school cultural and intellectual fest with over 900 participants from 21 schools. The two-day event featured 28 competitions across various disciplines, concluding with Brigade School Malleswaram as champions.", "category": "Education", "page": 8, "importance": 1, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "f7f8c3a3"}, {"headline": "Ryan Group hosts third national First-In-Math 24 Game tournament", "summary": "Ryan Group of Schools hosted the third national First-In-Math 24 Game Tournament in Bengaluru, involving 92 schools across India. Sachchit Jha emerged as overall champion, solving mathematical challenges within 15 seconds.", "category": "Education", "page": 8, "importance": 1, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "fc813e12"}, {"headline": "Young minds explore world of materials at Anweshana 2026", "summary": "Sri Sri Ravishankar Vidya Mandir, Bangalore North, hosted its annual exhibition, Anweshana 2026, themed 'Dravya Yatra – A Journey of Materials Around Us'. Students showcased exhibits on materials from Earth, plants, and animals, promoting responsible resource use.", "category": "Education", "page": 8, "importance": 1, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "301d549d"}, {"headline": "Don’t view paper leaks through political lens, says Jitendra Singh", "summary": "Union minister Jitendra Singh urged against politicizing paper leaks, stating it's a national \"malaise\" affecting exams across parties. He defended the new law as government's commitment to student welfare and noted previous UPA inaction on forming a national testing agency.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "a71f6aeb"}, {"headline": "Priyanka: PM must change ‘dil ka angle’, not ‘camera angles’", "summary": "Priyanka Gandhi Vadra questioned if PM Modi or Amit Shah ordered the use of pellet guns and AK-47s against student protesters, challenging them to answer. She urged Modi to change his 'dil ka angle' instead of 'camera angles' to win over Gen Z.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "8cbd7c15"}, {"headline": "‘Circus feat remain medically perilous despite precautions’", "summary": "Following a man's death in a circus stunt, experts warn that such feats are medically perilous. Surviving underground depends on oxygen, ventilation, temperature, and meticulous preparation, with risks rising sharply over time, despite small air passages and holes in the sack.", "category": "India", "page": 8, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e157452c"}, {"headline": "‘Delulu’ oppn thinks youth are with it, Rahul has ‘FOMO’: NDA", "summary": "BJP and allies mocked Rahul Gandhi's protests as \"delulu\" (delusional) and accused him of having \"FOMO\" (fear of missing out), asserting that youth trust PM Modi's government for exam reforms. They criticized opposition for using students for political gains.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "d05aa017"}, {"headline": "Illegal immigrants on 2025 rolls to get enumeration forms", "summary": "Illegal immigrants listed in the 2025 electoral rolls will receive enumeration forms during the Special Intensive Revision (SIR), as booth-level officers cannot deny them. Discrepancies will be examined post-draft electoral roll publication, with Bengaluru lagging in digitizing forms.", "category": "Politics", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "22de8573"}, {"headline": "Water supply disruption in Bengaluru on Friday for 15 hours", "summary": "Water supply will be disrupted for 15 hours on Friday, from 6 am to 9 pm, in several parts of Bengaluru. Affected areas include Anantapura, Horamavu, Varthur, and Uttarahalli, due to maintenance work.", "category": "Infrastructure", "page": 9, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "e493cd94"}, {"headline": "CID to probe KPSC scam; BJP demands CBI involvement", "summary": "Karnataka government transferred investigations into alleged recruitment malpractices at KPSC to CID, probing a cash-for-jobs racket for 400 veterinary officers. BJP demanded a CBI probe, alleging posts were auctioned for up to Rs 1 crore and provisional lists should be scrapped.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132130", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132130"}], "article_id": "c415ad14"}, {"headline": "Man films wife’s ‘suicide’, sends clip to parents; lands in custody", "summary": "A man from Bagalkot was arrested after filming his wife's alleged suicide and sending the clip to her parents. The parents alleged he assaulted and tried to hang her. The couple reportedly had frequent quarrels over the husband's suspicions of an affair.", "category": "Law", "page": 9, "importance":
