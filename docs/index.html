<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

ssued to prevent outbreaks.", "category": "Health", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136094", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE-Bengaluru 03-09.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/136094"}], "article_id": "32661003"}, {"headline": "Supreme Court Delays Key Verdict", "summary": "The Supreme Court has postponed its decision on a significant legal case, citing the need for further deliberation. The verdict is expected in the coming weeks.", "category": "Law", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136094", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE-Bengaluru 03-09.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/136094"}], "article_id": "da98b9b4"}, {"headline": "New Climate Report Highlights Urgency for Action", "summary": "An updated report on climate change emphasizes the critical need for immediate global action to curb emissions. The findings indicate accelerated warming trends.", "category": "Environment", "page": 20, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136094", "sources": [{"newspaper": "Financial Express", "pdf_filename": "FE-Bengaluru 03-09.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/136094"}], "article_id": "381b5b60"}, {"headline": "Iran-US Attacks Restart: Crude Oil Prices Surge on Geopolitical Tensions", "summary": "Renewed military strikes between Iran and the US have plunged West Asia back into conflict. US forces struck Iran's coast, and Tehran retaliated against American bases. Two Filipino crew members were killed in a tanker attack in the Strait of Hormuz. Brent crude prices rose marginally amid the volatile session.", "category": "World", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "1978ff9d"}, {"headline": "US Weighs Fresh Tariffs on Imported Semiconductors to Boost Domestic Manufacturing", "summary": "The US administration is considering new tariffs on imported semiconductors, potentially coupled with tariff relief for companies investing in domestic chip manufacturing. Commerce Secretary Howard Lutnick indicated a \"thoughtful tariff policy\" that incentivizes US-based production.", "category": "Business", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "3b3a55ee"}, {"headline": "Putin, Xi Discuss Trilateral Talks with Trump at APEC Summit", "summary": "Russian and Chinese Presidents discussed the possibility of a trilateral meeting with Donald Trump at the upcoming APEC summit in Shenzhen. Such a meeting would be unprecedented and could offer Trump a platform to emphasize his peacemaker role.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "7b8586fe"}, {"headline": "SC Questions Bar Council of India Chairman's Extended Tenure", "summary": "The Supreme Court questioned the continued tenure of Bar Council of India chairman Manan Kumar Mishra, stating his continuation cannot be treated as a mandate to remain chairman until 2030. The court emphasized he is only a 'pro tem' chairman until a reconstituted BCI elects office-bearers.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "2e0b10f4"}, {"headline": "Karnataka Approves Projects Worth Rs 29,679 Cr, Creating 66,360 Jobs", "summary": "A high-level committee in Karnataka approved nine new and eight additional investment proposals totaling Rs 29,679.20 crore. These projects are expected to generate 66,360 jobs across the state.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "614cd82d"}, {"headline": "India Semiconductor Mission 2.0: Experts Welcome Sops, Flag IP Rules & VC Barriers", "summary": "Experts have welcomed the India Semiconductor Mission 2.0's incentives but raised concerns over strict IP rules, access to global VC, and demand-side challenges. Policy emphasis on sovereign control could impact startups seeking international investment.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "b44d5933"}, {"headline": "Offshore Betting Platforms Thrive Despite India's RMG Ban", "summary": "A year after India banned real money gaming, offshore betting platforms continue to attract users and funds, posing a challenge for regulators. Deposits are made through UPI, and platforms are accessible even without VPNs.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "2bdc6f8a"}, {"headline": "Amazon India to Hire 160,000 Seasonal Workers for Festive Season", "summary": "Amazon India is hiring 160,000 temporary workers to meet anticipated demand during the festive season, an increase of 10,000 from last year. Most hires will support picking, packing, shipping, and delivery operations.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "3f801723"}, {"headline": "Tata Sons Share Sale Inquiry Closed by Charity Commissioner", "summary": "The Maharashtra Charity Commissioner closed the inquiry into the 1989 Tata Sons share transfer, finding it in full compliance with the law. This decision offers relief to Noel Tata amidst control disputes.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "8f30eaf9"}, {"headline": "India in Talks with UK, EU for Critical Minerals Partnerships", "summary": "India is discussing partnerships with the UK and EU for processing and developing critical minerals. The aim is to build resilient supply chains and ensure security of supply for high-tech manufacturing.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "ffb3d25f"}, {"headline": "Credit Card Spending Rises, but Revolver-led Model Less Lucrative for Banks", "summary": "India's credit card market is becoming less profitable for issuers as interest-bearing balances fall to 11% of spends. Customers use cards more for payments than loans, shrinking profit margins for banks.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sou f_filename": "ET-Bangalore 03-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "0b49f0f2"}, {"headline": "Illicit Money Flows Rising Faster Than World GDP, Global Crime Report Says", "summary": "Global illicit money flows reached $4.4 trillion in 2025, representing 3.8% of world GDP and rising faster than global GDP growth. Organized crime, drug networks, and fraud form a bulk of this dark world.", "category": "Economy", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "e9f56878"}, {"headline": "Govt Defends GDP Data Revisions, Citing Improved Methodology and Data Quality", "summary": "The statistics ministry defended its GDP data revisions, stating they reflect improved data quality and methodology, not an attempt to inflate current year growth. The shift to a new base year and Producer Price Index are key factors.", "category": "Economy", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "da877bf6"}, {"headline": "India's Forex Reserves Cross $729 Billion by August 21", "summary": "India's foreign exchange reserves touched $729.3 billion as of August 21, up nearly $50 billion since June, driven by inflows from forex-in-demand programs and a special swap window for banks.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136102", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136102"}], "article_id": "c8f5c46f"}, {"headline": "Multi-Asset Funds Outperform Nifty Over One and Three Years", "summary": " iscussions on the Indo-Pacific region. The talks focused on strategic cooperation and shared interests in the evolving geopolitical landscape of the area.", "category": "World", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "53d37d50"}, {"headline": "Int'l students in Canada need more reserve funds", "summary": "Canada has increased the required financial reserves for international students. This measure aims to ensure students can support themselves during their studies, preventing potential reliance on public assistance and improving the overall student experience.", "category": "Education", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "9c6678c6"}, {"headline": "Russia, Ukraine help", "summary": "Russia and Ukraine are reportedly cooperating on humanitarian aid. This unexpected collaboration aims to alleviate suffering and provide assistance to affected populations amidst the ongoing conflict, fostering a common ground for humanitarian efforts.", "category": "World", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "aa2b0d21"}, {"headline": "US, India working on high-tech reciprocal trade ties", "summary": "The US and India are collaborating to strengthen high-tech reciprocal trade relations. The initiative aims to boost innovation, facilitate technology transfer, and create new opportunities for businesses in both countries, fostering economic growth.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "57e00df5"}, {"headline": "Govt may exempt high-tech firms from BIS certification", "summary": "The government is considering exempting high-tech firms from Bureau of Indian Standards (BIS) certification. This potential move aims to streamline regulations and encourage innovation within the technology sector, reducing compliance burdens for emerging companies.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "916b3e38"}, {"headline": "Oil shipments war disruptions", "summary": "Disruptions in oil shipments due to ongoing conflicts are causing concerns in the global energy market. The article discusses the impact of these disruptions on supply chains and prices, highlighting the vulnerability of energy security.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "2dbca303"}, {"headline": "Ryabakina fires with No.1 in sight", "summary": "Elena Rybakina is performing strongly in the tennis tournament, with the world number one ranking within her reach. Her consistent performance and recent victories have positioned her as a top contender for the coveted title.", "category": "Sports", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "935f5935"}, {"headline": "Battle for top spot", "summary": "This article analyzes the intense competition for the top ranking in a particular sport. It highlights the key players, their current standings, and the factors influencing their performance, offering insights into the dynamics of professional sports.", "category": "Sports", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "ac01c64b"}, {"headline": "I didn't have a strong will to win, had to learn it: Praggnanandhaa", "summary": "Chess prodigy R. Praggnanandhaa reflects on his journey, stating he had to learn to cultivate a strong winning mentality. He shares insights into his training, mindset, and the challenges he overcame to achieve his current success in the competitive chess world.", "category": "Sports", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "b05da177"}, {"headline": "Making the right moves", "summary": "The article explores the strategic decision-making processes of individuals, likely in sports or business. It analyzes how calculated moves and adaptability contribute to success, offering lessons on effective planning and execution.", "category": "Sports", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "ad0ae1ba"}, {"headline": "India lack finishing again", "summary": "The Indian cricket team's recent performance has been marked by a lack of finishing ability. The article discusses the team's struggles in closing out matches and suggests areas for improvement in their batting and bowling strategies.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "b88f9d1a"}, {"headline": "Asia: Neeraj is Japan but coach, physio are", "summary": "This piece highlights the presence of Indian athletes like Neeraj Chopra in Japan, alongside their Japanese coaches and physiotherapists. It underscores the international collaboration in sports and the support systems crucial for athlete performance.", "category": "Sports", "page": 14, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136058", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136058"}], "article_id": "a4b4c350"}, {"headline": "Ahead of Xi's New Delhi visit, Indian team may go to China", "summary": "An Indian delegation led by Commerce Secretary Rajesh Agrawal plans to visit China to address trade imbalances and investment issues before the BRICS Summit. India aims to flag concerns over its $112.16 billion trade deficit with China and seek market access. The visit, tentatively scheduled for early next week, precedes Chinese President Xi Jinping's expected visit to New Delhi.", "category": "Politics", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "f9ab24ce"}, {"headline": "FCNR(B) inflows top $127 billion in 85 days", "summary": "Indian banks mobilized a record $127.226 billion in Foreign Currency Non-Resident (Bank) deposits between June 8 and August 31. This surge was driven by attractive interest rates and a Reserve Bank of India incentive exempting these deposits from statutory liquidity and cash reserve ratio requirements. Bank of Baroda's Chief Economist noted the inflows significantly exceeded expectations.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "ece66386"}, {"headline": "EV shift intensifies skilled talent crunch in India’s auto industry", "summary": "India's transition to electric vehicles has created a massive shortage of specialized professionals in electronics, cybersecurity, and software. Industry reports indicate that while 27,000 skilled workers are needed annually, local institutions produce only 5,000. Major companies like Tata Motors, Mahindra, and Bajaj Auto are investing in internal training and ITI partnerships.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "d7375fa9"}, {"headline": "PayPal to lay off a quarter of India workforce", "summary": "Digital payments giant PayPal is set to lay off approximately 6,700 employees in India, representing nearly 25% of its local workforce. The move is part of a global restructuring plan to simplify operations, accelerate AI adoption, and reduce costs. The layoffs follow previous staff reductions in Ireland and reflect a broader strategy to optimize the company's global cost structure.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "b64ae9f2"}, {"headline": "Tata Motors CV gets ECB approval for Iveco takeover", "summary": "Tata Motors' commercial vehicle business has received approval from the European Central Bank for its €3.8 billion takeover of the Iveco Group. This acquisition aligns with Tata's strategy to expand its international commercial vehicle footprint by integrating its India-led truck and bus operations with Iveco's global business. The transaction is expected to conclude on schedule.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "5918465c"}, {"headline": "Two-wheeler retail sales fall 8.3% m-o-m in August", "summary": "Retail registrations for two-wheelers in India dropped to 1.53 lakh units in August, an 8.3% month-on-month decline. Industry experts attribute the slump to pre-festival purchase deferrals and monsoon conditions affecting rural demand. While year-on-year registrations grew by 17%, market leaders Honda and Hero MotoCorp saw significant monthly dips of 7.1% and 9.4% respectively.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "5da21343"}, {"headline": "Despite localisation, deficit in auto-component trade widens to $1.37 billion", "summary": "India's auto-component trade surplus of $453 million in FY25 turned into a $1.37 billion deficit in FY26. While exports grew slightly to $24 billion, imports jumped 13% to $25.4 billion. Experts attribute this to a surge in high-value imports for electronics and EV components, primarily from China, which currently supplies about 85% of critical raw materials for lithium-ion batteries.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "8c07437d"}, {"headline": "Simple Energy unveils its first family e-scooter at ₹1.1 lakh", "summary": "Bengaluru-based Simple Energy has launched 'The Wave', its first family-oriented electric scooter, priced at ₹1,09,999. The vehicle features a multi-battery setup and a storage capacity of 41 liters. The company aims to shift from performance-based products to the mass-market family segment, targeting production of 10,000-12,000 units per month by March to achieve EBIDTA-positive status.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "348463d4"}, {"headline": "Goyal urges auto industry to expand global reach and quality", "summary": "Commerce Minister Piyush Goyal has called on the Indian auto industry to move up the value chain and expand into international markets. Speaking at the ACMA annual convention, he emphasized the need for better quality control, investments in AI, and adherence to BIS certification. He also urged the sector to focus on vehicle scrappage and safety, particularly during flood situations.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "f3ffeb3a"}, {"headline": "Maruti MD emphasizes cybersecurity alongside automotive digitalisation", "summary": "Hisashi Takeuchi, MD of Maruti Suzuki India, warned that cybersecurity is now as critical as engine performance in the digitalized auto industry. Speaking at the ACMA convention, he noted that connected cars face rising risks of cyberattacks, as seen recently with other global manufacturers. He urged the industry to identify risks early and develop robust counter-measures.", "category": "Technology", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "010cee27"}, {"headline": "OVL’s Venezuela prospects brighten with US regulatory clearance", "summary": "ONGC Videsh Ltd (OVL) is set to resume operations in its Venezuelan oil fields following a US Treasury license. The move allows OVL to invest roughly $500 million to revitalize the San Cristobal and Carabobo-1 projects. This development coincides with new Venezuelan regulations that simplify oil industry taxation and could help India recover pending dividends through crude oil supplies.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "34635b6d"}, {"headline": "LPG consumption hits 6-month high of 2.42 mt in August", "summary": "India's LPG consumption rose to 2.42 million tonnes in August, the highest in six months, marking a 3.2% month-on-month increase. The growth is attributed to improved supply and the removal of certain distribution restrictions. However, consumption remains 14% lower than last year's figures. Petrol and aviation fuel demand also saw gains, while diesel sales dipped slightly below 8 mt.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "172ad501"}, {"headline": "Belgian Prime Minister De Wever arrives in India for talks", "summary": "Belgian Prime Minister Bart De Wever has arrived in India for a three-day visit to deepen cooperation in trade, defense, and green energy. De Wever, accompanied by a large business delegation, will meet Prime Minister Modi to discuss a roadmap for bilateral ties. Key focus areas include diamond trade, port logistics, and the development of green hydrogen technologies.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "8a19434b"}, {"headline": "Adobe to provide free AI tools in 7 Indian States", "summary": "Adobe has partnered with seven Indian state governments, including Uttar Pradesh and Tamil Nadu, to provide free AI and creativity tools to over 7.8 million students and teachers. The initiative, under the Adobe Digital Academy, will integrate digital literacy into classroom learning across government schools. The program aims to equip the next generation with essential future-ready skills.", "category": "Education", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "3d6714f9"}, {"headline": "Samsung unveils Galaxy S26 FE with AI-powered features", "summary": "Samsung has launched the Galaxy S26 FE, the latest addition to its fan-inspired smartphone lineup. The device features a triple rear camera with 3x optical zoom and integrates Samsung's new 'Galaxy AI' for enhanced photo editing and productivity. Expected to launch in India soon, the S26 FE aims to provide a premium experience at a more accessible price point than the flagship S26 series.", "category": "Technology", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "b21e7a2a"}, {"headline": "10-year G-sec yield briefly breaches 7% on rising crude prices", "summary": "The yield on the 10-year benchmark government security (G-sec) briefly touched 7% on Wednesday, driven by rising international oil prices and higher US Treasury yields. Crude oil prices near $80 a barrel have fueled inflation concerns, putting pressure on domestic bond prices. Analysts suggest that if global yields remain elevated, Indian G-sec yields may find a new equilibrium at 7.10-7.15%.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "3b9120f2"}, {"headline": "NCLAT keeps Subhash Chandra’s insolvency appeals pending", "summary": "The National Company Law Appellate Tribunal (NCLAT) has deferred appeals by creditors challenging the settlement of Subhash Chandra's personal insolvency. Creditors like Indiabulls Housing Finance and Union Bank of India argued that the NCLT-approved settlement significantly undervalued Chandra's assets. The NCLAT has scheduled the next hearing for October, keeping the legal battle ongoing.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "57f897e4"}, {"headline": "Asset quality of SFBs expected to improve this fiscal year", "summary": "Small Finance Banks (SFBs) are likely to see an improvement in asset quality during FY26, according to a CRISIL Ratings report. Gross non-performing assets are projected to decline by 120 basis points to 2.6-2.7% by March 2027. The improvement is driven by a recovery in the credit-per-borrower ratio and a focus on non-microfinance portfolios, which have shown higher resilience.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "58151745"}, {"headline": "Census and tricky issues in recording caste in India", "summary": "The upcoming Indian Census faces significant technical and political challenges regarding the recording of caste data. Experts note that the lack of standardized nomenclature for thousands of sub-castes and synonyms complicates accurate tabulation, as seen in the 2011 SECC data. Extensive consultations are required to ensure the data is useful for policy and doesn't lead to legal disputes.", "category": "India", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "4865250e"}, {"headline": "Nepal seeks climate compensation from China, US and India", "summary": "Nepal’s Minister Shishir Khanal has called on the world’s largest emitters—China, the US, and India—to provide climate compensation for devastating floods in the Bhote-Koshi river basin. Nepal argues that high-emitting nations should bear the financial burden of climate-related disasters in vulnerable mountain regions. The country is seeking urgent help from the UN Loss and Damage Fund.", "category": "World", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "1b3cef05"}, {"headline": "Indian markets recover from lows but oil prices cause concern", "summary": "The Sensex and Nifty recovered from intra-day lows on Wednesday but ended lower for the third consecutive session. The Sensex fell 373.93 points to 76,570.35, while the Nifty dropped 141.35 points to 23,914.45. Market sentiment was dampened by rising crude oil prices and a surge in the 10-year US Treasury yield, although Asian markets showed a mixed trend in closing trade.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "3500e04a"}, {"headline": "Mahanadi Coalfields files DRHP for ₹66.18 crore IPO", "summary": "Coal India subsidiary Mahanadi Coalfields Ltd (MCL) has filed a Draft Red Herring Prospectus for an IPO to sell up to 66.18 crore shares. The offer is entirely an offer for sale by Coal India Ltd, which currently owns 100% of the company. MCL is one of Coal India's most productive subsidiaries, accounting for 21% of the country's domestic coal production last fiscal year.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "e29e7e06"}, {"headline": "Industry flags over 50,000 illegal or non-compliant drones in India", "summary": "The Drone Federation of India (DFI) has warned the Ministry of Civil Aviation that over 50,000 illegal or non-compliant drones are operating in India. Most of these are imported through illicit channels and lack safety certifications. The DFI has urged the government to enforce strict licensing and training requirements to ensure national security and public safety in Indian airspace.", "category": "India", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "f2b70d0e"}, {"headline": "India ranked among top 5 hubs for mechanical engineering talent", "summary": "India has been recognized as one of the world's top five global hubs for mechanical engineering talent at the International Mechanical Engineering Congress & Exposition. Industry leaders noted that India is now competing with China for technical dominance. The country's expertise in nuclear energy and aerospace was highlighted as a key driver for its rising global engineering status.", "category": "Science", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "d6004651"}, {"headline": "FSSAI directs 5-star hotels to ensure food safety compliance", "summary": "The Food Safety and Standards Authority of India (FSSAI) has directed 5-star hotels to strictly adhere to food safety protocols following reports of unhygienic conditions and expired items. FSSAI has issued notices to several Delhi-based luxury hotels, including JW Marriott and Andaz, for violations. The regulator plans to ramp up inspections and surveillance of the hospitality sector.", "category": "Health", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "91eb76d1"}, {"headline": "Policy framework being readied for greening India’s nuclear energy", "summary": "The Indian government is developing a new policy framework to attract green financing for nuclear energy projects. Speaking at the Bharat Electricity 2026 event, officials noted that the framework will help India achieve its target of 100 GW of nuclear power capacity by 2047. The policy aims to align nuclear energy with national and international green investment standards.", "category": "Environment", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "3a1589f5"}, {"headline": "PE-VC investments in India rise 55% in August", "summary": "Private equity and venture capital investments in India surged 55% year-on-year to $3.3 billion in August. This growth was driven by several 'mega deals' over $100 million each, totaling $2.38 billion. Key sectors receiving significant funding included fintech, engineering services, and healthcare. Overall, the January-August period saw investments reach $23.59 billion across 874 deals.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "95cd2334"}, {"headline": "Wheat prices gain ₹150/quintal as govt lifts shipment ban", "summary": "Wheat prices in India have risen by over ₹150 per quintal after the government lifted a four-year ban on exports of wheat products like flour and semolina. Despite the move, stakeholders worry that high global prices and shipping disruptions may limit actual export volumes. Domestic wheat stocks are currently at a five-year high, providing some buffer against potential shortages.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "450e1f26"}, {"headline": "USDA projects 10% drop in India’s 2026-27 corn output", "summary": "The US Department of Agriculture (USDA) expects India's corn production to fall by 10% to 50 million tonnes in the 2026-27 season. The decline is attributed to weak monsoon rains in major producing states like Karnataka and Maharashtra. This follows a record output of 55 million tonnes in the previous year. Low soil moisture may also affect the upcoming rabi (winter) corn crop.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "5748a941"}, {"headline": "Highway toll hikes to nearly double to 6.4% next year", "summary": "Motorists in India face a significant increase in highway tolls, which are projected to rise by 6.2-6.4% from April 2027. This is nearly double the current year's increase of 3.4-4%. The hike, linked to movements in the Wholesale Price Index (WPI), is expected to increase logistics costs for transporters and potentially impact the prices of consumer goods across the country.", "category": "Infrastructure", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "d005525a"}, {"headline": "Chenab basin holds four-fifths of J&K’s untapped hydropower potential", "summary": "A government survey has identified that the Chenab river basin in Jammu & Kashmir holds nearly 80% of the region's untapped hydropower potential. With an estimated capacity of 11,283 MW, the basin is central to India's plan to increase renewable energy generation. Several major projects, including the 1,000 MW Pakal Dul project, are currently under various stages of development.", "category": "Infrastructure", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "f44404ab"}, {"headline": "DRDO and UoH team patent new solid rocket propellant fuel", "summary": "Researchers from DRDO and the University of Hyderabad have patented a novel solid rocket propellant fuel. The new compound offers higher thermal stability and resistance to impact compared to conventional fuels, potentially enhancing the performance and safety of Indian rockets. The breakthrough could lead to more efficient and reliable propulsion systems for future space and defense missions.", "category": "Science", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "1f246d2c"}, {"headline": "CSK’s poor IPL 2025 performance hits company’s FY26 financials", "summary": "Chennai Super Kings Cricket Ltd (CSKCL) reported a decline in net profit to ₹430 crore for FY26, down from ₹468 crore in the previous year. The drop is attributed to the team's 10th-place finish in IPL 2025, which led to lower sponsorship revenue and tournament-related income. Despite the domestic slump, CSK's international ventures in SA20 and Major League Cricket showed growth.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "c0a669d8"}, {"headline": "Private hospitals in north India flag payment delays under Ayushman Bharat", "summary": "Private hospitals in Haryana, Punjab, and Himachal Pradesh have raised concerns over delayed payments and deductions under the Ayushman Bharat health insurance scheme. In Haryana alone, hospitals are reportedly owed over ₹1,800 crore. Several healthcare facilities have threatened to stop providing services under the scheme if the government doesn't clear the pending dues immediately.", "category": "Health", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136076", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136076"}], "article_id": "66c1ea52"}, {"headline": "Why jewellery giants are racing to consolidate", "summary": "India's jewellery market is consolidating with major players like GRT acquiring stakes in listed retailers (e.g., TBZ, Senco Gold, P N Gadgil) to plug strategic gaps and expand regionally. The organized segment's share has nearly doubled to 40-45% by FY26, driven by mandatory BIS hallmarking and movement into smaller cities. Premiumization and regulation also play a role.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "c04290cd"}, {"headline": "RBI's FCNR window attracts $127.2 billion, boosts forex reserves", "summary": "RBI's foreign currency deposit window, closing early, attracted $127.2 billion from banks, plus $9.2 billion from overseas foreign currency and external commercial borrowings, totaling $136.4 billion. This swelled forex reserves to a record $729 billion, helping contain rupee volatility despite liquidity challenges. The scheme benefited overseas Indians with gains.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "00a1e1fa"}, {"headline": "Malicious emails and phishing drive ransomware attacks across sectors", "summary": "A survey (Jan-Mar 2026) of 2,158 IT/cybersecurity decision-makers across 17 countries, including 240 in India, shows malicious emails and phishing as leading causes of ransomware attacks in most sectors. Compromised credentials drive nearly a third of attacks in distribution, healthcare, and energy sectors.", "category": "Technology", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "38bdfb3b"}, {"headline": "India's July economy resilient but inflation, monsoon risks loom", "summary": "India's economic scorecard marginally improved in July, with 9 of 16 indicators above average, driven by vehicle sales, credit, and labor force participation. However, domestic air travel contracted, labor-intensive exports fell, and rupee depreciated. Persistent inflation (food/beverages at 5.7% in August) and a weak August monsoon (15% below normal, 13% cumulative deficit) threaten rural demand and agricultural output.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "abd5cd7f"}, {"headline": "IPO market revives in August with average 28% listing gain", "summary": "India's IPO market saw a strong revival in August, with 18 newly listed companies achieving an average 28% gain on debut, a fivefold jump from 5.6% in Jan-July 2026. This \"listing pop\" indicates conservative valuations, leaving room for investor gains. The upswing spanned various sectors, with Tempsens Instruments leading with 96% returns. Concerns about grey market influence have emerged.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ccd425a2"}, {"headline": "Audit firms bolster teams with AI, data, cyber experts for client mandates", "summary": "India's top audit firms (Deloitte, EY, PwC, KPMG, BDO) are hiring data scientists, AI/cyber experts, and fraud specialists to meet demand from increasingly digital, data-heavy businesses. With over 600 companies changing auditors by FY29, these diverse teams, now including non-CAs, are crucial for winning mandates, as boards look beyond traditional audit benches and seek expertise in tech, data, and cyber risks.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "8831ac1a"}, {"headline": "Adani Group's listed firms' headcount drops on outsourcing strategy", "summary": "Adani Group’s headcount across its nine listed firms fell 8.4% to 115,920 in FY26, the first decline, as jobs moved to vendors and unlisted entities. While the total workforce grew to 390,080 by 31 July, the conglomerate is strategically outsourcing non-core functions like manufacturing and logistics to larger vendors to conserve capital and management bandwidth, a shift highlighted by Gautam Adani.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "e7f2e5a4"}, {"headline": "Russia and India establish functional rouble-rupee payment infrastructure", "summary": "Russia and India have built a functional rouble-rupee payment infrastructure, accounting for 96% of bilateral trade, which reached a record $70 billion in 2024. This development follows India's increased imports of discounted Russian oil since the 2022 Ukraine conflict, enabling smoother trade flows despite Western sanctions.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ed276751"}, {"headline": "Sitharaman meets Russian counterpart, discusses SCO Development Bank", "summary": "Finance Minister Nirmala Sitharaman met her Russian counterpart Anton Siluanov on the sidelines of the G20 Finance Ministers and Central Bank Governors (FMCBG) Meeting in Asheville. They discussed strengthening bilateral cooperation and establishing the Shanghai Cooperation Organisation Development Bank.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "847465e1"}, {"headline": "India's diaspora deposit flows exceed $100 billion, boosting RBI reserves", "summary": "Inflows under RBI's special overseas deposit facility have surpassed $100 billion, pushing forex reserves to a record $729.3 billion. This inflow has helped India avert a third consecutive year of current account deficit, a measure of money flowing in and out of the economy.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "c9f6b635"}, {"headline": "India urged to review green finance rules for 2047 nuclear goal", "summary": "Officials and industry executives urge India to review green financing rules, as the current sovereign green bond framework, green deposit, and financing rules do not cover nuclear investments. This review is essential to achieve India's ambitious goal of expanding nuclear power capacity to 100GW by 2047.", "category": "Environment", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "77f9a165"}, {"headline": "India's August soyoil imports record high, palm oil highest in six months", "summary": "Indian refiners imported a record amount of soyoil in August and the highest volume of palm oil in six months. This surge in buying by the world's biggest importer of vegetable oils is attributed to stock building ahead of the festival season and could help top producers Indonesia, Malaysia, and Argentina reduce stocks and support futures.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ceb62440"}, {"headline": "Pakistan urges constructive engagement with India on Indus Water Treaty", "summary": "Pakistan urged India to engage constructively within the Indus Water Treaty framework after India rejected the Permanent Court of Arbitration’s order setting aside its decision to suspend the IWT. Pakistan reiterated its commitment to implementing the treaty.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "f25f5709"}, {"headline": "India offers to rebuild Nepal’s hydropower and infrastructure after floods", "summary": "India offered to help Nepal restore hydropower plants, roads, and bridges damaged by floods and landslides on 26 August. State-run NHPC and SJVN offered technical assistance, deepening India’s role as a major energy partner. Around 700MW hydropower capacity was knocked out, affecting over 1,100 people dead and 4,800 missing.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "14aaa637"}, {"headline": "India plans voluntary code to curb chemical diversion for illicit drugs", "summary": "India's Narcotics Control Bureau (NCB) plans a voluntary code of conduct for precursor chemicals to prevent diversion from legal uses (medicines, industry) to illicit drug manufacturing. The framework, developed with industry, places onus on supply chain participants to track shipments, verify buyers, and report suspicious activity, without imposing new statutory compliance.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "4ae36c84"}, {"headline": "Hotel majors expand into unexplored Indian micro-markets like Kabini, Salasar", "summary": "India's listed hospitality companies are aggressively expanding into obscure micro-markets like Kabini, Salasar, and Omkareshwar, riding the buoyant domestic leisure travel trend. This strategy allows hotel companies to increase management fees and widen their presence in tier-3 and tier-4 cities, as development peaks in larger cities. ITC Hotels, IHCL, and Lemon Tree Hotels are among those signing new properties.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "28e77e41"}, {"headline": "Indian companies poised to raise over $20 billion in IPOs this year", "summary": "India's equity capital markets are projected to see over $20 billion in IPOs this year, driven by robust activity and a busy pipeline, according to Avendus Capital. 58 companies have already raised ₹73,757 crore (~$8 billion) so far, with momentum fueled by deepening domestic markets and investor acceptance for new business models on a path to profitability.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "64bb1924"}, {"headline": "Nvidia CEO urges G20 nations to accelerate AI adoption", "summary": "Nvidia CEO Jensen Huang urged G20 nations to accelerate artificial intelligence adoption for economic growth. Speaking at a US-hosted event, Huang called on the world's largest economies to expand data centers and other infrastructure to support emerging AI technology.", "category": "Technology", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "4d3f52a9"}, {"headline": "Simple Energy plans large fundraise to boost EV production capacity", "summary": "IPO-bound electric two-wheeler maker Simple Energy is seeking a large fundraise to enhance production capacity and strengthen its supply chain. CEO Suhas Rajkumar announced the plans at the launch of their first family scooter, Wave.", "category": "Business", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "0db3f6ce"}, {"headline": "India's e-commerce market projected to reach $345 billion by 2030", "summary": "India's e-commerce sector is projected to nearly triple to $345 billion by 2030 from $125 billion in 2024, growing at an 18.4% CAGR. This growth will be propelled by rapid quick commerce expansion and artificial intelligence integration, with dark stores expected to triple.", "category": "Technology", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "2665af33"}, {"headline": "JM Financial raises ₹700 crore in first close of pre-IPO fund", "summary": "JM Financial Asset Management secured ₹700 crore in the first close of its maiden pre-IPO fund, which will invest in companies expected to go public within 18 months. The fund targets a ₹1,500 crore corpus with a ₹1,000 crore green shoe option, attracting ultra-high-net-worth individuals, family offices, and institutional investors.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "1b45e7f2"}, {"headline": "Indian data center operators see revenue and margin growth in FY26", "summary": "Major Indian data center operators like Nxtra Data, AdaniConneX, Sify Infinit Spaces, and ESDS Software Solutions reported strong revenue growth and fatter operating margins in FY26. This earnings boom was driven by the utilization of existing capacity rather than new AI workloads, benefiting from rising cloud adoption and data localization.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "dda3dbc2"}, {"headline": "Shadow lenders prepare ₹10,000 crore rupee bond issuance", "summary": "Indian shadow lenders, including Power Finance Corp. and Bajaj Housing Finance, plan to raise at least ₹10,000 crore ($1.1 billion) via local currency bonds next week. They aim to lock in borrowing costs before potential interest rate hikes by the US Federal Reserve later this year, amid rising inflation risks and increased demand for funds ahead of the festive season.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "10964eff"}, {"headline": "Indian auto sales impressive in August, defying slowdown fears", "summary": "Most Indian auto companies reported impressive August sales volumes, with Maruti Suzuki India seeing 21% year-on-year growth and Tata Motors (PV) 59%. Commercial vehicle sales also surged. Despite a dip in Maruti’s exports due to West Asia conflict and sequential drop in PV sales, industrial and consumer demand remains strong, with robust data expected ahead of the festive season.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "f430db5b"}, {"headline": "PVR Inox announces ₹300 crore buyback amid choppy recovery", "summary": "PVR Inox announced a ₹300 crore share buyback at ₹1,450 per share (20% premium), signaling balance sheet confidence. Q1FY27 revenue rose 11.9% year-on-year to ₹1,622 crore, with footfalls up 7.6%. While management expects 80 net screen additions (asset-light), footfalls remain volatile, depending on content. The stock trades at 8x EV/Ebitda.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ece79bd0"}, {"headline": "Yotta Data Services plans early 2027 IPO, seeks $1.5 billion", "summary": "Indian data center operator Yotta Data Services plans a January-March 2027 IPO, aiming to raise up to $1.5 billion for debt repayment, GPU purchases, and sovereign cloud expansion. The Hiranandani Group-backed firm will file draft papers in October, capitalizing on booming AI computing demand. It already raised $150 million in pre-IPO capital at a ₹37,000 crore valuation.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ad3dd9ea"}, {"headline": "NBFCs seek RBI clarity on revolving credit rules", "summary": "Non-banking financial companies (NBFCs) have sought clarity from RBI on \"revolving credit\" definition and exemptions for MSME-focused products, following a proposed ban on such facilities. They've pleaded for continued revolving credit, suggesting tighter underwriting and disclosures, while RBI's concerns stem from potential evergreening of stressed accounts, as households' leverage climbs.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "10a8e1fb"}, {"headline": "Delhi HC: Government cannot revive old dues post-insolvency plan approval", "summary": "The Delhi High Court ruled that government authorities cannot seek recovery of old dues after a firm's insolvency resolution plan is approved. The court quashed a customs order seeking ₹589,000 from Jaiprakash Associates, emphasizing that creditors must file claims during the insolvency process to ensure new owners receive a \"clean slate.\"", "category": "Law", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "81b7be51"}, {"headline": "ONGC Videsh team reviews Venezuela oil assets after US approval", "summary": "A team from ONGC Videsh Ltd (OVL) arrived in Venezuela to review assets, weeks after US government approval lifted sanctions-related restrictions. During a seven-day stay, officials will assess oil fields and meet energy officials, marking the first such visit in years. OVL, holding stakes in San Cristobal and Carabobo-1 projects, aims to multiply production.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "c5a7d77c"}, {"headline": "Upcoming mythological films face backlash risk from religious groups", "summary": "Upcoming mythological films like \"Ramayana\" face potential backlash and legal risks from religious outfits demanding pre-screenings and accurate depictions. The Shri Ramlila Mahasangh warned makers against inaccuracies similar to 2023's \"Adipurush.\" Experts note that seemingly small creative liberties can become contentious due to faith-linked narratives, posing challenges for marketing and distribution.", "category": "Culture", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "3066e7ee"}, {"headline": "BSE seeks HFT support to boost trading under new auction system", "summary": "BSE Ltd is engaging with high-frequency traders (HFT) and other market participants to boost day-end trading volumes. The newly introduced closing auction system (CAS), launched 3 August to align with global peers, has faced hiccups, with thin liquidity and sharp price swings during index rebalancing. CEO Sundararaman Ramamurthy noted HFT firms' low participation.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "16d50950"}, {"headline": "Purple Style Labs IPO oversubscribed 1.29 times on final day", "summary": "The IPO of Purple Style Labs Ltd (Pernia’s Pop-Up Shop parent) was subscribed 1.29 times on its final day, receiving bids for 8.86 million shares against 6.84 million on offer. Retail investors subscribed 1.58 times, QIBs 1.43 times, and non-institutional investors 84%. The company raised ₹306 crore from anchor investors, with the IPO valued at over ₹4,600 crore at the upper price band.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "162a25b3"}, {"headline": "UN: Global warming to exceed 1.5°C limit, world must adapt", "summary": "The UN acknowledges Earth will soon exceed the 1.5° Celsius global warming limit agreed in the 2015 Paris Accord, due to fossil fuel burning. A report by the UN Environment Programme states warming will peak at 1.8°C with ambitious goals, or 2.6°C by 2100 with current policies. The world must now aim to bring temperatures back down, facing decades of increased disasters.", "category": "Environment", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "29db20ba"}, {"headline": "JLR opens orders for first fully electric Range Rover after cyberattack", "summary": "Jaguar Land Rover (JLR) opened orders for its first fully electric Range Rover, one year after a major cyberattack halted production and cost the company £196 million. JLR, owned by Tata Motors, plans to build 12,000-15,000 units over the next six months, confirming recovery from the incident.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "7f4e8b1b"}, {"headline": "Hyundai India MD urges consistent policy for auto tech development", "summary": "Hyundai Motor India MD and CEO Tarun Garg urged for a consistent long-term policy framework to support scale and accelerate technology and component development in the auto industry. Addressing ACMA, Garg stressed India needs to build domestic capabilities in critical technologies like semiconductor chips, EV battery cells, and power electronics, moving beyond conventional component exports.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "0649aba3"}, {"headline": "UltraTech to expand electric vehicle fleet to over 600 trucks by December", "summary": "Leading cement maker UltraTech will scale up its electric vehicle (EV) fleet in logistics operations to over 600 trucks by December, from 100 currently. This move aims for a net annual reduction of over 117,000 tonnes of carbon dioxide and displaces 39 million liters of diesel, operating across multiple states.", "category": "Environment", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "5bfff6c7"}, {"headline": "Indian corporate bond fundraising halves in August amid rising yields", "summary": "Indian corporate bond issuance nearly halved month-on-month in August, with companies raising ₹61,760 crore through private placement of bonds, a 45% drop from July. Rising yields, particularly at the shorter end of the curve, reduced incentives for firms to lock in borrowing, keeping primary-market activity subdued despite easing liquidity.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "8495ee0c"}, {"headline": "Adani Ports handles record 50 million tonnes cargo in August", "summary": "Adani Ports and Special Economic Zone Ltd (APSEZ) handled a record 50 million tonnes (mt) of cargo in August, its highest monthly throu
