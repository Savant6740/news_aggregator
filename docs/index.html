ghput to date, up 19% year-on-year. This growth was broad-based across dry cargo (up 25%), container volumes (up 15%), and commodities, with international operations also contributing.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "0700378a"}, {"headline": "BP names Ian Tyler as new chairman after interim stint", "summary": "BP Plc named Ian Tyler as its new chairman following an interim stint, cementing CEO Meg O’Neill’s control after she became Big Oil's first female CEO in April. Tyler, with a reputation for being collegiate, replaces Albert Manifold and joined BP’s board in 2025.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "2d210469"}, {"headline": "Anthropic's new Fable 5.1 AI model is cheaper, better at coding", "summary": "Anthropic PBC released Fable 5.1, a new AI model that it claims is more economical and better at coding and science tasks. The update improves its ability to handle complex computer programming projects and scientific work, responding to customer feedback amid growing pressure on US-based model makers from cost-effective open-weight models.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "0ef335be"}, {"headline": "Understanding sovereign ratings: India's BBB-grade status analysed", "summary": "India holds a 'BBB-' sovereign risk rating from Fitch (BBB and Baa3 from S&P and Moody's), implying adequate debt repayment capacity with moderate economic vulnerability. Sovereign ratings, a composite measure of economic, institutional, external, fiscal, and monetary factors, change slowly. India's low per capita GDP and tax collections make it fiscally vulnerable, but its fiscal discipline has been praised.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "bd26fe67"}, {"headline": "Sovereign ratings biases against developing nations persist", "summary": "The article continues from P10, discussing how sovereign ratings are biased against developing nations due to subjective qualitative indices and differential application of measurable parameters. Despite India's BBB- rating, global investors consider market indicators like credit default swaps, which price India more favorably, suggesting actual market perception is higher than agency ratings. Improving tax compliance and state fiscal discipline are ways India can strengthen its position.", "category": "Economy", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "b53e3524"}, {"headline": "Foreign university campuses in India offer cost advantage, but outcomes untested", "summary": "India's NEP 2020 allows foreign universities to set up branch campuses, offering significantly lower costs (e.g., University of Liverpool's India campus: ₹14-15 lakh vs. ₹60 lakh overseas). While curricula are similar and degrees from parent universities, employer acceptance, and career outcomes remain untested. Concerns include faculty mix, limited international exposure, and lack of long-term placement data for graduates.", "category": "Education", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "9ae4aa2d"}, {"headline": "Equity-heavy portfolios: Review and diversify for smoother investment journey", "summary": "Indian equity markets have seen negative returns (7-8%) since September 2024, prompting investors with equity-heavy portfolios to review. While corrections are normal, a diversified portfolio across equity, fixed income, and gold offers smoother returns. Investors often chase recent returns, underestimating risks. A balanced approach is advised for long-term resilience, as no single asset class consistently outperforms.", "category": "Economy", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "78d1df53"}, {"headline": "Personal guarantees under IBC face scrutiny in high-profile cases", "summary": "Zee TV founder Subhash Chandra's personal liability case for Essel Group loans has highlighted personal guarantees under India's Insolvency and Bankruptcy Code (IBC). Unlike earlier, lenders can now pursue guarantors simultaneously with corporate debtors. The IBC provides a distinct legal process for personal guarantors, with recent Supreme Court rulings affirming that a guarantor's liability persists even if the corporate debtor's case is resolved.", "category": "Law", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "a7391921"}, {"headline": "Fewer state-run schools not cause for alarm, indicates consolidation", "summary": "India has 94,000 fewer government schools since 2014, a statistic often cited as a decline in public education. However, this largely reflects the consolidation of small, inefficient schools into larger, better-staffed, and better-resourced ones, improving schooling quality without compromising student access. This overdue correction aligns with NEP 2020, making teachers more effective and enhancing student learning experiences.", "category": "Education", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "a9d80596"}, {"headline": "World Bank's B-Ready survey to reveal India's business environment gaps", "summary": "The World Bank's B-Ready assessment, replacing the discredited Ease of Doing Business ranking, will publish findings on India's business environment this September. Measuring firms' actual experiences, it's expected to highlight India's strong progress in business entry (digital systems) but also expose gaps in dispute resolution (50 million pending cases, uneven Commercial Courts Act implementation) and land administration due to state-level variations.", "category": "Economy", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "ac51ab1e"}, {"headline": "Nepal tragedy highlights value of large reservoir dams for flood control", "summary": "The recent floods in Nepal, killing over 1,100, underscore the critical value of large reservoir dams for flood control, despite their environmental criticisms. As climate change destabilizes mountain regions, these dams offer on-demand power and protect downstream communities. Development banks largely ceased funding hydro in the 1990s, an \"unfortunate outcome\" given hydro's zero-carbon, storage benefits and role in disaster mitigation.", "category": "Environment", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "3cda5a1c"}, {"headline": "Adapting India's insolvency law for the age of AI", "summary": "The proliferation of AI tools in business necessitates adapting India's Insolvency and Bankruptcy Code (IBC). Resolution Professionals (RPs) will need expertise to manage AI services (billed in advance/lag), handle cross-border vendor issues, and assess corporate debtors' data/prompts on third-party AI platforms. New challenges arise for identifying avoidance transactions involving AI agents and determining AI agent status in liquidation waterfalls, requiring regulator studies and an Integrated Platform for Insolvency Ecosystem (iPIE).", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "0e137acf"}, {"headline": "Delhi Contemporary Art Week 2026 explores ecology and memory", "summary": "The ninth Delhi Contemporary Art Week (DCAW 2026) features artworks tackling themes of climate, ecology, memory, place, and identity. Two curator-led exhibitions, 'Bye Bye Monsoon' and 'This Animate Earth', showcase 18 and 10 artists respectively, addressing ecological destabilisation, human condition, and personal histories through diverse media. The event highlights artists' engagement with climate exigencies, urban landscapes, and socio-environmental realities.", "category": "Culture", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "01050481"}, {"headline": "Venice Film Festival opens with Danny Boyle's Rupert Murdoch film \"Ink\"", "summary": "The Venice Film Festival opened with Danny Boyle's \"Ink,\" a film about Rupert Murdoch's 1969 acquisition of The Sun. George Clooney received a lifetime achievement award. The festival's lineup includes documentaries on Gaza, Elon Musk, and Ukrainian war journalists, reflecting a focus on geopolitics. Director Alberto Barbera addressed concerns about only one woman-directed film in competition, emphasizing the festival's support for women in cinema.", "category": "Culture", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "87b970a7"}, {"headline": "New book spotlights India's Paralympic stars and their journey", "summary": "“India’s Paralympic Revolution” by Boria Majumdar et al. highlights the remarkable rise of Indian Paralympic athletes like javelin thrower Sumit Antil, a three-time world champion and double Paralympic gold medalist. The book traces their journey from self-funding to government support and private funding, marking India's jump from one Paralympic medal in 2012 to 29 in Paris 2024, advocating for broader public recognition of their achievements.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136069", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136069"}], "article_id": "bbe574b9"}, {"headline": "FCNR(B) Deposits Surge to $127.22 Billion in Special Window", "summary": "Banks mobilized a record $127.22 billion through foreign currency non-resident (FCNR-B) deposits before the special window closed on August 31. This haul boosted total inflows through special schemes to $136.37 billion.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136102"}], "importance": 8, "article_id": "c10ec849"}, {"headline": "Ram Temple Trust Appoints Air Marshal Mishra as First CEO", "summary": "The Shri Ram Janmabhoomi Teerth Kshetra Trust appointed Air Marshal Jeetendra Mishra (retired) as its first chief executive officer. Swami Govinddev Giri was named general secretary and Mahesh Bhagchandka as treasurer.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136110"}], "importance": 8, "article_id": "9cb4a3ee"}, {"headline": "Bengaluru Economic Master Plan Aims for $400 Billion Economy by 2037", "summary": "An Economic Master Plan for Bengaluru Metropolitan Region aims to expand its economy to $400 billion by 2037, create 2-2.5 million jobs, and strengthen its position in technology, manufacturing, healthcare, and tourism.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136110"}], "importance": 8, "article_id": "46f26fce"}, {"headline": "HC orders probe in depth of Disha Salian", "summary": "The High Court has ordered a thorough investigation into the death of Disha Salian. The court's decision comes after concerns were raised about the initial inquiry, emphasizing the need for a comprehensive probe to ascertain the truth and provide closure to the family.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136110"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136058"}], "importance": 9, "article_id": "82fa3df6"}, {"headline": "Japanese agency upgrades India’s credit rating to ‘A-’", "summary": "The Japan Credit Rating Agency (JCR) has upgraded India’s sovereign credit rating to ‘A-’ from ‘BBB+’ with a stable outlook. JCR cited India's robust economic growth, resilient domestic demand, and fiscal stability as key factors. This upgrade follows similar positive moves by other global agencies and reflects international confidence in India's long-term economic reforms and infrastructure.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136110"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136058"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136076"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136069"}], "importance": 9, "article_id": "61d58e57"}, {"headline": "Uttar Pradesh Focuses on Eco-Tourism with New Circuits and Infrastructure", "summary": "Uttar Pradesh is promoting eco-tourism by developing green destinations like Dudhwa and Katerniaghat. The state has invested over Rs 161 crore in infrastructure, focusing on sustainable tourism and community-led initiatives.", "category": "Environment", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/136110"}], "importance": 8, "article_id": "575e82f6"}, {"headline": "La Caisse buys 24% stake in Altius for ₹12,100 crore", "summary": "Canadian investment group La Caisse (CDPQ) has acquired a 24% stake in Altius Infrastructure Trust for ₹12,100 crore. Altius owns over 2,58,000 telecom towers in India, serving major mobile operators. The investment highlights growing global interest in India's digital infrastructure as the nation expands 4G and 5G services to meet rising data demand.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136076"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136069"}], "importance": 8, "article_id": "3fc68e71"}, {"headline": "Godrej Consumer's new CEO focuses on core brands for growth", "summary": "Godrej Consumer Products Ltd's (GCPL) new MD and CEO, Aasif Malbari, outlined a strategy to boost volume and profit growth, addressing \"good but not great\" performance. Plans include a ₹200 crore R&D investment, digital marketing improvements, cutting general trade inventory by ₹125-150 crore, and refocusing on core brands like Godrej No.1 soaps and Good Knight repellents.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136069"}], "importance": 6, "article_id": "d6f2bfcc"}, {"headline": "Subhash Chandra opposes NCLT five-member bench on insolvency plan", "summary": "Zee Group founder Subhash Chandra opposed NCLT's decision to constitute a five-member bench to re-hear his personal insolvency case, questioning the legal basis under the Companies Act. This follows a split two-member bench ruling on his ₹2,574 crore loan repayment plan, where the third member approved it, making it binding on dissenting creditors.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET-Bangalore 03-09.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/136102"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "importance": 7, "article_id": "49ba4e87"}, {"headline": "India to help rebuild damaged school", "summary": "India assured support for the complete reconstruction of the flood-ravaged Tribhuvan Trishuli Secondary School in Bidur, Nepal. The school, which had around 900 students, was seeking India's help after the flash floods.", "category": "World", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136110"}], "importance": 8, "article_id": "5c808773"}, {"headline": "TN to junk cases against, Dmk govt", "summary": "The Tamil Nadu government plans to withdraw several cases against individuals and entities. This move is seen as an attempt to mend relations and focus on governance, following a change in political leadership. The specifics of the cases to be withdrawn are yet to be detailed.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136110"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136058"}], "importance": 7, "article_id": "e1888c66"}, {"headline": "MP denies nod to prosecute minister for Col Qureshi remarks", "summary": "The MP government finalized a reply explaining its decision not to prosecute minister Kunwar Vijay Shah over his remarks on Col Sofiya Qureshi. The reply states the minister expressed regret and did not intend to insult.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 03-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136110"}], "importance": 8, "article_id": "e51a3202"}, {"headline": "Global temp rise to exceed 1.5°C in decade", "summary": "A new report warns that global temperatures are on track to exceed the crucial 1.5°C warming threshold within the next decade. The findings highlight the urgent need for drastic climate action and emission reductions to avert catastrophic consequences, emphasizing the accelerated pace of climate change.", "category": "Environment", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136058"}], "importance": 9, "article_id": "d91ab228"}, {"headline": "CM to host Feb-8 flight", "summary": "The Chief Minister is scheduled to host a delegation for a flight on February 8th. The meeting is expected to focus on regional development and cooperation. This event signifies a move towards strengthening inter-state relations and fostering economic growth.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136058"}], "importance": 5, "article_id": "3fb868b1"}, {"headline": "Surekha refuses to quit, Cong to sack her", "summary": "Suresh Surekha has reportedly refused to resign, prompting her party, the Congress, to consider expelling her. This internal conflict within the party raises questions about leadership discipline and its implications for the Congress's electoral prospects.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136058"}], "importance": 6, "article_id": "a98ac194"}, {"headline": "Jaishankar to visit Ukraine and Poland to boost ties", "summary": "External Affairs Minister S Jaishankar is scheduled for a three-day visit to Ukraine and Poland. Amid the ongoing conflict, the visit to Ukraine aims to discuss bilateral cooperation and express India's commitment to peace through dialogue. In Poland, talks will focus on strengthening diplomatic and economic partnerships, marking a significant outreach to Central and Eastern Europe.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰³⁰⁹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136058"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_03-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136076"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_03-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136069"}], "importance": 9, "article_id": "00b8f29f"}, {"headline": "Banks' CD rates dip as FCNR flows boost liquidity by $127 billion", "summary": "A surge of $127.2 billion in foreign currency non-resident bank (FCNR(B)) deposits, part of a $136.4 billion total inflow from RBI's scheme, has crashed short-term borrowing costs for banks. Rates on three-month certificates of deposit (CDs) cooled to 6.3% from 7.09-7.23% in June, as banks are now flush with funds, reducing their need for CDs, despite broader fixed-income market caution.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Ben const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
