<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

0077/144985"}], "article_id": "b1eb6387"}, {"headline": "UGC allows direct PhD entry for four-year undergraduate degree holders", "summary": "The University Grants Commission (UGC) has announced that students with a four-year undergraduate degree and a minimum of 75% marks can now directly apply for PhD programs. This eliminates the mandatory requirement for a Master's degree for such candidates. The decision aligns with the National Education Policy 2020 to streamline academic pathways and promote research.", "category": "Education", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144985", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_28-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144985"}], "article_id": "6db75547"}, {"headline": "Garden Reach Shipbuilders reports 33 percent growth in Q4 profit", "summary": "Garden Reach Shipbuilders & Engineers (GRSE) reported a 33% increase in net profit to ₹111.6 crore for the quarter ended March 31, 2024. Revenue from operations jumped 69% year-on-year to ₹1,016 crore. The board recommended a final dividend of ₹1.44 per equity share. The growth was attributed to strong execution in shipbuilding and increased order book visibility.", "category": "Infrastructure", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144985", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_28-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144985"}], "article_id": "30f083cf"}, {"headline": "Southwest Monsoon expected to hit Kerala coast by May 31", "summary": "The India Meteorological Department (IMD) has forecast that the southwest monsoon is likely to arrive over Kerala on May 31, 2024. This early onset is seen as a positive sign for the agricultural sector, which relies on the June-September rains for nearly 70% of the country's rainfall. Adequate rainfall is crucial for controlling food inflation and boosting rural demand.", "category": "Science", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144985", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_28-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144985"}], "article_id": "d97fa652"}, {"headline": "Nykaa parent FSN E-Commerce reports 187 percent rise in profit", "summary": "FSN E-Commerce Ventures, parent of Nykaa, reported a consolidated net profit of ₹9.07 crore for Q4 FY24, nearly triple from ₹3.16 crore in the year-ago period. Total revenue from operations grew 28% to ₹1,668 crore. The company cited strong demand in the beauty and personal care segments and improved operational efficiencies for the sharp increase in profitability.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144985", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_28-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144985"}], "article_id": "5369ff9b"}, {"headline": "Supreme Court issues contempt notice to TN in Deepam row", "summary": "The Supreme Court issued a contempt notice to the Tamil Nadu government for allegedly defying orders regarding the Deepam festival at Arunachaleswarar temple. The court noted that authorities brazenly disobeyed its November 20 directive. It directed the state to permit the lighting of a ceremonial lamp atop the hill under specific security conditions.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "8a525bc5"}, {"headline": "Sitting or retired SC judge to head delimitation commission", "summary": "The proposed delimitation bill mandates a three-member commission chaired by a serving or retired Supreme Court judge. Other members include the Chief Election Commissioner or an EC nominee and the state's election commissioner. The commission will have the power of a civil court and will redraft constituency boundaries based on census figures.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "7b2c4725"}, {"headline": "Census 2027 to begin with online enumeration from January 10", "summary": "The Indian government has notified that the enumeration for Census 2027 will begin on January 10. Residents will have a 15-day window for self-enumeration through an online portal. The house-to-house population count is scheduled from March 1 to March 5, 2027. This marks the first digital census in India's history.", "category": "India", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "45d068ab"}, {"headline": "Rohit Sharma returns as Mumbai Indians captain after three seasons", "summary": "Mumbai Indians have reinstated Rohit Sharma as captain for the IPL 2027 season. Rohit, who led the team to five titles, replaces Hardik Pandya. The decision follows three seasons where the team struggled to find consistency. Team owners expressed confidence that Rohit's leadership would help reclaim their former glory in the tournament.", "category": "Sports", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "761ace61"}, {"headline": "Delhi government spent 37.4% of budget in first seven months", "summary": "Data shows the Delhi government utilized 23,391 crore, or 37.4% of its 62,550 crore allocation, between April and October 2026. The department of industries saw the lowest expenditure at 2.07%, while the energy department spent the highest proportion at 77.98%. Officials cited slow progress in some sectors but expect spending to pick up in the second half.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "00bcdf62"}, {"headline": "Safdarjung Hospital denies claims of hiring doctor with fake degrees", "summary": "Safdarjung Hospital authorities denied allegations that they knowingly hired a doctor with fake MBBS and MD degrees. The individual, identified as Ramkishor Mahawar, allegedly worked on a contractual basis using forged documents. The hospital stated it follows due diligence and is cooperating with the police investigation into the matter.", "category": "Health", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "28861357"}, {"headline": "UP Lok Sabha seats could reach 600 plus under delimitation", "summary": "Projections under the new delimitation bill suggest that Uttar Pradesh's Lok Sabha seats could increase from 80 to over 600. The plan proposes a 50% uniform increase across all states and union territories. Critics from southern states have expressed concern that this could lead to political marginalization of regions with successful population control.", "category": "Politics", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "e45fc7f8"}, {"headline": "ECI fixes security flaw that exposed voter data on website", "summary": "The Election Commission of India fixed a vulnerability on its website that potentially exposed personal details of millions of voters. Security researchers discovered that the site allowed access to sensitive data via predictable URL patterns. ECI officials stated that no data was misused and that secondary security layers have been implemented to prevent future risks.", "category": "Technology", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "a60c9cf3"}, {"headline": "CDS warns of space threat as Pakistan gains China's backing", "summary": "Chief of Defence Staff General Anil Chauhan warned that Pakistan's space capabilities, supported by China, pose a growing challenge to India's security. He emphasized the need for India to strengthen its own space assets and integrate them with military operations. He noted that the nature of future conflicts would be increasingly multi-domain.", "category": "Science", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "c95fa481"}, {"headline": "Zelenskyy calls for more US pressure on Putin to end war", "summary": "Ukrainian President Volodymyr Zelenskyy urged the United States to increase pressure on Russian President Vladimir Putin to negotiate an end to the conflict. In an interview, he compared Putin to Hitler and stated that only strong international intervention could stop the aggression. He expressed hope for continued support from the incoming US administration.", "category": "World", "page": 22, "importance": 9, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "0a541029"}, {"headline": "New Zealand leads as India misses early chances in Test", "summary": "New Zealand reached 246/5 on the opening day of the second Test against India in Christchurch. Indian bowlers, led by Akash Deep, struggled to capitalize on early opportunities as Tom Latham and Tom Blundell struck fifties. India's fielding was criticized for dropping crucial catches that allowed the hosts to build a solid platform.", "category": "Sports", "page": 30, "importance": 8, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 30, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "98047c5c"}, {"headline": "Supreme Court directs food regulators to implement health warning labels", "summary": "The Supreme Court ordered the Food Safety and Standards Authority of India to finalize a system for health warning labels on packaged foods. The court emphasized that consumers have a right to clear information about high sugar, salt, and fat content. FSSAI must now revise its nutrient limits and finish the framework within four months.", "category": "Health", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/145037", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ²⁸¹¹²⁰²⁶.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/145037"}], "article_id": "a03f1c55"}, {"headline": "Centre proposes freeze on Lok Sabha seat share until 2051", "summary": "The 132nd Constitutional Amendment Bill proposes extending the freeze on inter-State distribution of Lok Sabha seats for 25 years to 2051. Accompanied by a fresh Delimitation Bill, it seeks to increase the number of seats in each State by 50%, raising the total Lower House strength from 550 to 850. This move also triggers the implementation of 33% reservation for women in the Lok Sabha.", "category": "Politics", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "4d4380f6"}, {"headline": "DMK stands firm on demands regarding seat share and Census", "summary": "DMK chief M.K. Stalin reiterated that the party will not compromise on two key demands: protecting Tamil Nadu's current 7.18% Lok Sabha seat share and freezing State seat proportions based on the 1971 Census for another 25 years. The party has consistently opposed delimitation based on more recent population figures that would disadvantage States with successful family planning.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "420d3353"}, {"headline": "Supreme Court orders ceremonial lamp lighting at Thirupparankundram deepathoon", "summary": "Rejecting the Tamil Nadu government's claims, the Supreme Court ordered the Karthigai Deepam to be lit on the stone pillar atop Thirupparankundram Hill. The court observed 'wilful disobedience' of its prior order and issued show cause notices to top State officials. Receivers were appointed to oversee the ceremony, with Central forces providing security during the event on Saturday.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "c35d36c7"}, {"headline": "Indian Navy receives final Project 17A stealth frigate Vindhyagiri", "summary": "The Indian Navy took delivery of Vindhyagiri, the seventh and final ship of the Nilgiri-class Project 17A stealth frigates, from Garden Reach Shipbuilders and Engineers in Kolkata. The multi-mission platform features 75% indigenous content and advanced weaponry for anti-surface, anti-air, and anti-submarine warfare, marking a milestone in India's warship construction capabilities.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "cf992f27"}, {"headline": "Hackers breach U.S. military flagship cloud computing platform", "summary": "The U.S. Air Force's Cloud One platform has been breached, potentially compromising sensitive tactical, personnel, and logistics data. The intrusion was discovered during a system upgrade. Cloud One serves as a centralized IT hub powered by major tech providers, managing applications including air defense radar data feeds and combat munitions tracking systems across 200 locations.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "dea08fce"}, {"headline": "Early-life sugar restrictions linked to significantly lower cancer risk", "summary": "A study of wartime sugar rationing in the U.K. found that reducing sugar exposure during the first 1,000 days of life is associated with a 36% to 69% lower risk of several cancers later in adulthood. Research published in PNAS suggests early-life restrictions slow biological aging by 2.2 years and establish healthier long-term eating habits through behavioral and biological pathways.", "category": "Health", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "3a429e0d"}, {"headline": "Delhi government opens Kejriwal's former residence for public tour", "summary": "The Delhi government opened 6, Flagstaff Road, dubbed 'Sheesh Mahal' by the BJP, to the media ahead of its public launch. The bungalow, where Arvind Kejriwal stayed as CM until October 2024, features a living room lounge built at a cost of ₹1.48 crore and ₹1.07 crore worth of drapes. Central agencies are currently investigating alleged irregularities in the property's construction.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "9a37f310"}, {"headline": "Calcutta High Court sets aside appointment of Bengal LoP", "summary": "The Calcutta High Court quashed the West Bengal Speaker’s June 3 decision to appoint Ritabrata Banerjee as the Leader of the Opposition. Justice Krishna Rao ruled the appointment unsustainable under law following a split in the Trinamool Congress and allegations of forged signatures. The Speaker has been directed to reconsider the appointment afresh within 10 days.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "08402f98"}, {"headline": "Delhi and Bihar sign pact for 18 inter-State bus routes", "summary": "Delhi and Bihar have agreed to operate inter-State bus services connecting the national capital with 13 destinations in Bihar, including Patna, Gaya, and Purnia. The agreement is expected to benefit 20 lakh people, including students and workers. Fares for the new services, operated under a public-private partnership model, are expected to range from ₹2,000 to ₹3,000.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "14dfcfe4"}, {"headline": "Delhi government develops app to track faulty streetlights", "summary": "A new mobile application is being tested by Delhi Police to map dark spots and route streetlight maintenance complaints to the correct civic agency in real time. Developed by Geospatial Delhi Limited, the app captures location coordinates to reduce jurisdictional confusion. Police have already identified 180 dark spots and over 5,000 defective streetlights across the city.", "category": "Technology", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "2e7c5f36"}, {"headline": "MCD adds 10 mechanical sweepers to tackle Delhi air pollution", "summary": "Delhi CM Rekha Gupta flagged off 10 mechanical road sweepers, bringing the Municipal Corporation of Delhi's fleet to 76. The move aims to combat winter air pollution caused by road dust. Each machine can clean 40 lane-kilometres per shift. The MCD plans to expand the fleet to 136 machines by July to increase daily coverage from 2,100 to 5,000 lane-kilometres.", "category": "Environment", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "0537ec97"}, {"headline": "H.P. BJP demands re-exam for Sikh youth barred over kara", "summary": "The Himachal Pradesh BJP Minority Morcha has sought a re-examination for a patwari post after an Amritdhari Sikh candidate was allegedly barred from the exam for wearing a 'kara' and 'kirpan'. The party called the incident a violation of religious freedom and constitutional rights, demanding a formal probe and an explanation from the State government.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "07749986"}, {"headline": "Congress maintains lead in Rajasthan rural local body elections", "summary": "The Opposition Congress emerged dominant in Rajasthan's panchayati raj elections, securing 255 pradhan posts out of 419 rural bodies. The ruling BJP won 105 seats, while the Rashtriya Loktantrik Party secured 24 posts. Congress won clear leads in 25 of 37 districts, including 16 of 22 panchayat samitis in Jaipur district, despite the BJP's State-level governance.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "94f68a1d"}, {"headline": "TVK MLA Arul Vignesh arrested for harassing woman IAS officer", "summary": "Kallakurichi MLA C. Arul Vignesh of the Tamilaga Vettri Kazhagam (TVK) was arrested for allegedly making inappropriate advances and comments toward a woman IAS officer. The arrest followed a Madras High Court directive to investigate the complaint. Police served a summons at his residence before taking him into custody for interrogation at the local Circuit House.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "c8714fab"}, {"headline": "J&K leaders condemn police summons to cleric over Vande Mataram", "summary": "Kashmir political leaders, including Mirwaiz Umar Farooq and Mehbooba Mufti, condemned the police for summoning Maulana Rehmatullah Qasimi. The cleric had opposed the playing of Vande Mataram at a recent J&K Waqf Board event, calling it 'un-Islamic'. Leaders termed the summons an attempt to intimidate religious voices and suppress dissent within the Union Territory.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "dd1c73dc"}, {"headline": "Telangana to issue land passbooks with embedded maps", "summary": "The Telangana government is preparing to issue first-of-its-kind pattadar passbooks featuring embedded maps and land coordinates. The new design includes a unique QR-style code that provides digital information about the specific plot. The initiative follows a phased resurvey of 10,900 revenue villages and aims to create a comprehensive digital land registry for farmers.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "173ef367"}, {"headline": "UPPSC PCS preliminary results set aside over reservation errors", "summary": "The Allahabad High Court cancelled the PCS-2025 preliminary results, ruling that the UPPSC wrongly excluded meritorious reserved-category candidates from the unreserved list. The court directed the commission to redraw the merit list and conduct the mains examination afresh. This follows findings that thousands of OBC, SC, and EWS candidates outscored unreserved candidates.", "category": "Education", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "8192e9f0"}, {"headline": "Bangladesh unrest shifts global textile orders toward Indian hubs", "summary": "Global fashion giants including Zara and H&M have moved nearly 10% of monthly orders from Bangladesh to other Asian hubs, primarily India, due to ongoing labor unrest. Political uncertainty and energy shortages in Bangladesh have caused over $400 million in production losses, eroding the country's competitive edge in the apparel export market.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "11e5fd45"}, {"headline": "Trump urges Putin to end military aggression in Europe", "summary": "U.S. President Donald Trump stated he asked Russian President Vladimir Putin to 'pull back all military aggression' against European territories during their meeting in China. In a shift in tone, Trump expressed hope for a quick deal between Russia and Ukraine. The comments come as European nations voice increasing concern over potential Russian provocations beyond Ukraine.", "category": "World", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "d96ab82a"}, {"headline": "China military tests makeshift floating bridges for Taiwan landing", "summary": "Satellite imagery reveals the People's Liberation Army is conducting amphibious landing drills in Fujian province, testing methods to link civilian vessels into makeshift floating bridges. Experts suggest the exercise rehearses low-signature logistical support for a potential invasion scenario. The drills in Dacheng Bay have been ongoing since early November.", "category": "World", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "33929e3d"}, {"headline": "Gukesh shows resilience in World Chess Championship draws", "summary": "D. Gukesh and Javokhir Sindarov remain tied 7-7 after three games of the World Chess Championship in Geneva. Gukesh demonstrated high-level preparation and defensive skill, particularly in Game 3 where he equalized easily with the black pieces. The match, consisting of 14 classical games, will proceed to shorter tie-break formats if the score remains level.", "category": "Sports", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144991", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 28-11-2026.pdf .pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/144991"}], "article_id": "9f82ca56"}, {"headline": "James Gray returns to crime thriller genre with Paper Tiger", "summary": "Director James Gray returns to the crime thriller genre with his new film Paper Tiger. The movie follows a New York family that becomes entangled with the Russian mafia. The production features a high-profile cast including Adam Driver, Scarlett Johansson, and Michael Teller, and is currently showing in theatres.", "category": "Culture", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page w regime, data fiduciaries cannot shift legal blame to vendors for breaches. Companies are now ranking vendors by data exposure and demanding stricter security controls.", "category": "Technology", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "cd287b9f"}, {"headline": "Indian automakers face rising tax disputes and multibillion-rupee claims", "summary": "Maruti Suzuki, Toyota, and Mercedes-Benz have reported sharp increases in tax disputes involving income tax, GST, and customs duties. These claims, some reaching thousands of crores, create financial uncertainty as companies plan massive investments. Experts warn that lengthy investigations impact the ease of doing business.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "af5db61d"}, {"headline": "UN food agencies warn of worsening hunger in 16 areas", "summary": "United Nations food agencies have warned that hunger is expected to worsen over the next six months in 16 locations, primarily in Africa. Conflicts in Sudan and Yemen, along with extreme climate events like El Niño, are the primary drivers of acute food insecurity in these regions.", "category": "World", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "a4ee8904"}, {"headline": "Power minister Manohar Lal urges states to add nuclear capacity", "summary": "Union power minister Manohar Lal has emphasized the necessity of increasing nuclear power generation to meet India's clean energy goals. Speaking on Friday, he also urged state governments to implement policy measures to stabilize the financial position of power distribution companies.", "category": "Infrastructure", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "791b5d17"}, {"headline": "RBI reduces 2029 bond sale as market anticipates rate hike", "summary": "The Reserve Bank of India accepted bids for only 40% of its scheduled 2029 bond sale during a Friday auction. The move aims to keep yields below 7% as market expectations of an interest rate hike on 4 December drive bond yields higher across the banking system.", "category": "Economy", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "cdb65638"}, {"headline": "ICC exceeds sponsorship revenue targets in shortened cycle", "summary": "The International Cricket Council met and exceeded revenue expectations during its 2024-27 sponsorship cycle. Commercial officer Anurag Dahiya noted strong growth from global partners like Coca-Cola and Aramco. The ICC is seeing increased interest in longer-term eight-year deals from major advertisers.", "category": "Sports", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144972", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144972"}], "article_id": "2aa6fcc3"}, {"headline": "Companies raise hiring bar on campuses as AI automates roles", "summary": " recruiters are offering higher pay but hiring fewer candidates this placement season as AI takes over routine junior tasks. Engi
