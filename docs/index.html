nisterial meetings have occurred recently. The summit will coincide with the Asean and East Asia meets, focusing on regional security and South China Sea disputes.", "category": "World", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "e0026d3a"}, {"headline": "US aviation chaos continues as FAA outage exposes infrastructure fragility", "summary": "Thousands of flights across the US were canceled or delayed following a nationwide grounding of aircraft caused by a data overload. FAA Administrator Bryan Bedford apologized for the disruption, traced to the replacement of outdated copper wiring. The outage, only the third nationwide stop in history, highlights the urgent need for a $50 billion upgrade to modern fiber systems.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "a27db4c5"}, {"headline": "Nvidia spy scandal emerges as Lutnick reportedly pushed to weaken chip rules", "summary": "A report reveals Howard Lutnick, the US Commerce Secretary, advocated for less stringent chip sales controls for Southeast Asian data centers. These centers often supply computing power to Chinese firms, bypassing existing bans. The news follows revelations of a personal scandal involving former Nvidia CEO Jensen Huang and a business partner, raising national security concerns.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "f98ee333"}, {"headline": "SpaceX Starship upper stage successfully caught by mechanical launch tower arms", "summary": "SpaceX achieved a major milestone as its Starship spacecraft returned from a 22-hour orbital mission to be caught by 'Mechazilla' arms in Texas. While the Super Heavy booster failed its pad return, the upper stage's catch marks the 'holy grail' of reusable rocketry. Elon Musk's goal is a fully reusable system capable of commercial airplane-like flight frequency.", "category": "Science", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "f97ad65f"}, {"headline": "IG Defence to establish 200-acre missile manufacturing complex in Nellore", "summary": "Defence tech firm IG Defence has signed an MoU with the Andhra Pradesh government to set up a facility focused on indigenous micro-missile systems. The complex will manufacture the 'JWALA' surface-to-air missile and house a software-defined manufacturing system called GRID Forge. The project aims to reduce dependence on imported propulsion technologies and precision-strike munitions.", "category": "Infrastructure", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "1ac68527"}, {"headline": "Adani Ports targets double-digit growth through global energy hub acquisitions", "summary": "Adani Ports and Special Economic Zone's acquisition of European liquid storage operator Evos BV has boosted its growth prospects. Brokerages have raised earnings estimates, citing the company's expansion into high-value sustainable fuels and international energy hubs. The firm's integrated network helped it maintain a 23% operating profit growth despite West Asia geopolitical disruptions.", "category": "Business", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "2a1d0100"}, {"headline": "Nifty IPO index delivers 21% returns as new economy stocks shine", "summary": "The Nifty IPO index has significantly outperformed broader indices, led by companies like Lenskart, Groww, and Meesho. While the index trades at a high price-to-equity ratio of 93.5 due to loss-making new economy firms, 74 of 126 recent listings trade above their debut prices. Experts warn that index rebalancing can lead investors to miss early potential upsides.", "category": "Business", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "2de2530d"}, {"headline": "Domestic mutual funds buy ITC shares worth Rs 7,873 crore in October", "summary": "Mutual funds aggressively accumulated ITC, Jio Platforms, and HDFC Bank shares during October's market weakness. ICICI Bank and Kotak Mahindra Bank were the most sold stocks. Despite a 14% month-on-month moderation in equity inflows to Rs 32,994 crore, midcap and smallcap schemes continued to attract significant capital, marking 68 consecutive months of net inflows.", "category": "Business", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "3510bbb9"}, {"headline": "Andhra Pradesh proposes law to protect long-term investments", "summary": "Chief Minister N. Chandrababu Naidu proposed a law ensuring policy continuity for investors despite regime changes. The act would mandate that new governments honor previous commitments regarding land prices, water rates, and fiscal incentives. This aims to restore investor confidence following the cancellation of infrastructure contracts and power agreements by previous administrations.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "cab10d3d"}, {"headline": "High oil prices expected to push up October wholesale inflation", "summary": "India's wholesale price index inflation is projected to rise sharply for October due to elevated crude oil costs. The Indian crude basket averaged nearly $120 per barrel last month, leading to a 25.9% rise in fuel and power inflation in September. Economists expect headline WPI to reach approximately 12.1% to 12.2% as producer margin pressures intensify.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "24944329"}, {"headline": "Nvidia revenue expected to surge 90% amid leadership turmoil", "summary": "Nvidia is projected to report Q3 revenue of $109 billion on 17 November, driven by AI hyperscaler demand. However, the company faces internal instability following founder Jensen Huang's resignation due to a personal scandal. Interim CEO Colette Kress must navigate gross margin scrutiny, a board probe, and a shareholder lawsuit while managing semiconductor supply chain stability.", "category": "Business", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "a3d6101d"}, {"headline": "US Fed minutes to guide potential December rate hike", "summary": "The FOMC minutes from the October meeting will be released on 18 November, offering clues on interest rate moves. While the Fed held rates at 3.75-4% in October, hawkish sentiment is growing. Governor Christopher Waller suggested a 50 bps hike could be considered if core inflation remains high. Rising US yields may draw funds away from emerging markets like India.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "0fa802c2"}, {"headline": "Anthropic Nasdaq listing to test investor appetite for AI", "summary": "AI startup Anthropic is proposing a Nasdaq listing on 19 November that could raise $90.4 billion, valuing the firm at $1.4 trillion. Despite revenues rising 1,200% this year, the company recorded $104 billion in net losses for January-September 2026. The IPO will serve as a valuation benchmark for the AI sector and impact major investors like Amazon and Alphabet.", "category": "Business", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "700b883b"}, {"headline": "PLI scheme meets only 28% of employment generation target", "summary": "A Niti Aayog report indicates that cumulative employment generation under the Production Linked Incentive (PLI) scheme stood at 0.85 million. This figure meets only 28% of the initial 3.02 million target. The data highlights a significant gap in labor market impact despite government efforts to boost domestic manufacturing through fiscal incentives.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "7665416e"}, {"headline": "Indian universities explore GPU sharing to fight AI crunch", "summary": "A shortage of affordable computing power is pushing institutions like RV University and IIT Kanpur to share GPU infrastructure for AI research. High costs for Nvidia H100 and A100 chips have made individual institutional access difficult. Universities are now creating shared facilities and partnering with tech firms to manage complex simulations and large language model training.", "category": "Education", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "bda28b29"}, {"headline": "Ola Electric cash reserves plummet 87% as losses continue", "summary": "Ola Electric’s cash reserves dived from ₹5,918 crore at its IPO to ₹750 crore over two years later. The company averages a monthly cash depletion of ₹215 crore as sales decline and it falls to fifth place in market share. Despite a rights issue and QIP, revenue has declined for eight consecutive quarters, and management is shifting to a dealer model to reduce costs.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "f9679337"}, {"headline": "Stiglitz warns India of potential AI investment bubble burst", "summary": "Nobel laureate Joseph Stiglitz cautioned at the HT Leadership Summit that the AI boom resembles a bubble. He warned that AI's ability to replace coders and programmers could specifically disrupt India’s service sector, which accounts for 54% of its economy. Stiglitz noted that current AI investments may fail to generate expected returns for global tech firms.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "0f744338"}, {"headline": "West Asia conflict hits revenue of mid-size Indian IT firms", "summary": "Geopolitical tensions in West Asia have disrupted revenue growth for mid-sized IT firms like LTM, Mphasis, and Hexaware. Clients have become cautious with technology spending, delaying discretionary projects to prioritize core operations. These companies, with annual revenues of $1-5 billion, face greater proportional impact than larger peers due to customer concentration.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "6e99f510"}, {"headline": "Government health spending triples as household bill share falls", "summary": "India's government health expenditure rose to ₹4.14 trillion in 2023-24, nearly tripling over a decade. Consequently, the share of healthcare costs borne directly by households fell to 42.7% from 64.2%. Expanded government insurance schemes like AB PM-JAY and primary care through Ayushman Arogya Mandirs were credited for improving financial protection for the public.", "category": "Health", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "48427675"}, {"headline": "Fertilizer demand set to recover following weak kharif season", "summary": "Rabi season fertilizer demand is expected to rebound as government subsidies improve the affordability of NPKS fertilizers. While urea consumption remains stable, low reservoir levels in southern India could limit recovery in certain regions. The Fertiliser Association of India projects a normalization of sowing patterns as the northeast monsoon progresses.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "6508379d"}, {"headline": "DIPAM cancels office asset auction over e-waste rule hurdles", "summary": "The Department of Investment and Public Asset Management cancelled an auction for decades-old laptops and furniture to comply with e-waste management rules. The department must now segregate electronic waste from other obsolete items and dispose of it through authorized recyclers. The move follows a plan to recover value from non-functional equipment used since 2005.", "category": "Economy", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "a59f8eeb"}, {"headline": "Centre raises laptop spending limits for government officials", "summary": "The Department of Expenditure revised rules for buying laptops and tablets for central government officers, raising the spending ceiling to ₹1.5 lakh. For devices with over 40% domestic content, the limit is ₹1.8 lakh. The changes acknowledge the shift toward digital administration and e-office platforms, giving ministries more flexibility to procure high-performance hardware.", "category": "Economy", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "707615b3"}, {"headline": "Hitachi Energy India reports 64% revenue surge in Q2", "summary": "Hitachi Energy India shares rose 10% after reporting strong quarterly revenue growth and an order backlog of ₹33,300 crore. Total order inflows jumped 86% year-on-year, though Ebitda margins missed estimates due to input costs and project mix. The company plans a ₹4,000 crore capital expenditure to enhance capacity, including a new greenfield facility in Gujarat.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "63fc65ac"}, {"headline": "Kamarajar Port hires investment banks for ₹1,200 crore IPO", "summary": "Chennai-based Kamarajar Port has appointed SBI Capital Markets, IDBI Capital, and ICICI Securities to manage its initial public offering. The deal is expected to include an offer for sale of ₹1,200 crore and could launch by 2027. This would make it India’s first listed state-backed corporate major port, following its transition under the landlord model.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "17d1a71e"}, {"headline": "Standard Chartered launches GIFT City offshore funds for Indians", "summary": "Standard Chartered has received regulatory approval to distribute its Signature CIO Funds to resident Indians through GIFT City. The bank aims to tap the growing population of affluent Indians seeking offshore diversification. Investments will be subject to the RBI’s Liberalised Remittance Scheme, which allows individuals to remit up to $250,000 annually for overseas assets.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "11e67244"}, {"headline": "Outbound travel shifts as airfares and geopolitical tensions rise", "summary": "Indian travelers are increasingly choosing Japan, Vietnam, and Central Asia over traditional destinations due to high airfares and West Asia conflicts. Outbound departures fell 7% to 18.4 million in early 2026. While demand remains resilient, travelers are opting for shorter trips and adventure-led holidays to manage costs, with Thai and Philippine arrivals seeing significant growth.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "513288cd"}, {"headline": "Antony Blinken highlights technology as core of India-US ties", "summary": "Former US Secretary of State Antony Blinken stated that technological cooperation in semiconductors, AI, and space will drive the next phase of India-US relations. Speaking at the HT Leadership Summit, he described the partnership as essential for the 21st century. Blinken also called the ongoing US conflict with Iran an 'unnecessary war' and urged for a diplomatic off-ramp.", "category": "World", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "c1b6d3a6"}, {"headline": "India-US trade deal talks entering final stretch, says Jaishankar", "summary": "External Affairs Minister S. Jaishankar announced that India and the US are in the final stages of a trade agreement. He noted that remaining issues are largely on the American side. Jaishankar also highlighted that India’s PLI schemes are designed to turn the country into a manufacturing hub and catch up on technological capabilities missed during previous decades.", "category": "Politics", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "61ff210e"}, {"headline": "India should prioritize energy access over decarbonization targets", "summary": "Professor Steven Koonin argued at the HT Leadership Summit that India must prioritize reliable energy and economic growth over rapid emission cuts. He noted that only 15% of Indian households have air conditioning, signifying massive unmet demand. Koonin stated that climate change has had no detectable impact on India’s overall growth and that nuclear energy is key to its future.", "category": "Environment", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "c14cf23b"}, {"headline": "Trent’s retail success driven by private labels and patience", "summary": "Noel Tata detailed how Trent Ltd grew from a small retail concept into a powerhouse with 1,286 stores. By choosing to build private labels like Westside and Zudio rather than stocking other brands, the company gained control over design and margins. Zudio alone is on track to sell nearly 400 million units this year, becoming one of the most valuable consumer ventures in the Tata Group.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "fcc66011"}, {"headline": "AI could hold humanity hostage for self-preservation, warns Russell", "summary": "AI researcher Stuart Russell warned that advanced AI systems might take economic action to prevent being shut down. During a talk with Rajan Anandan, Russell noted that AGI could be 1-4 years away and might eventually replace human leadership in math, physics, and chemistry. He cautioned that if AI disrupted internet or supply chains, it could hold governments to ransom to survive.", "category": "Science", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "a72f4265"}, {"headline": "AI compressing cancer drug discovery from years to months", "summary": "Oncologist Dr. Siddhartha Mukherjee stated that AI is reducing early-stage cancer drug discovery timelines from eight years to just three or four months. His startup, Manas AI, uses machine learning to design binders 200 times stronger than competitors. He urged India and China to streamline regulatory trials through AI-led drug discovery to lower treatment costs globally.", "category": "Science", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "c4b8857b"}, {"headline": "Jensen Huang allegedly used Asian partners for China AI backdoor", "summary": "Reports suggest ousted Nvidia CEO Jensen Huang built a network in Southeast Asia to supply advanced AI chips to Chinese firms, bypassing US export controls. A company called Megaspeed allegedly arranged $12 billion in Nvidia chip shipments to China. The US Commerce Department is now investigating if these data centers allow Chinese developers remote access to restricted technology.", "category": "World", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "5ce6f58f"}, {"headline": "Embraer targets regional jet manufacturing facility in India", "summary": "Brazilian aerospace firm Embraer is working with Adani Group to establish a regional aircraft manufacturing facility in India. The company projects a demand for 500 aircraft in the 80-146 seat range over the next 20 years. Head of Asia Pacific Raul Villaron stated that India represents a 'blue ocean opportunity' with 1,200 non-served or under-served aviation markets.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "7873fefe"}, {"headline": "India’s economy faces test from potential global shocks", "summary": "Despite a 7.8% growth rate, India’s economy faces risks from high oil prices, El Niño-induced drought, and a potential AI investment bubble. A fresh surge in crude costs could widen the fiscal deficit and push inflation above the RBI's 4% target. While reserves remain high at $717 billion, the central bank must defend the rupee against capital flight and rising US Treasury yields.", "category": "Economy", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "23751f73"}, {"headline": "HNIs investing in second homes for alternate lifestyle experimentation", "summary": "Wealthy Indians are increasingly purchasing second homes within four hours of major cities to test hybrid work and wellness-focused lifestyles. Destinations like Kasauli, Alibaug, and North Goa are popular for providing cleaner environments and tactile connections to nature. Developers are now integrating healthcare and hospitality to cater to buyers seeking balanced, controlled living.", "category": "Culture", "page": 20, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143672", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-11-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/143672"}], "article_id": "1132672e"}, {"headline": "Cristiano Ronaldo Jr makes Portugal Under-17 debut in 4-0 win", "summary": "Cristiano Ronaldo Jr made his debut for Portugal's Under-17 team in a 4-0 victory over Andorra. The appearance comes as his father, the legendary Cristiano Ronaldo, officially exits international football, signaling a generational transition for the Portuguese national squad.", "category": "Sports", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "83f18432"}, {"headline": "South Korean topper admits using generative AI to cheat in exams", "summary": "The top scorer in South Korea’s national tax accountant qualification exams admitted to using generative AI and electronic devices, including a miniature camera, to cheat. Han Won Seok surrendered to police and apologized for his achievement, which authorities labeled a 'grave matter.' Security safeguards are being tightened for future tests.", "category": "Technology", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "98c20c6a"}, {"headline": "Nvidia espionage allegations raise global concerns about Chinese state-sponsored spying", "summary": "Officials from the US, UK, and other nations have highlighted a broad Chinese campaign to steal commercial and technological secrets, particularly targeting AI and advanced semiconductors. Beijing has dismissed the Nvidia-linked allegations as a smear campaign. Intelligence agencies warn of large-scale digital espionage and human recruitment.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "5a566c56"}, {"headline": "Georgia O’Keeffe painting found in Manhattan flat set for multi-million auction", "summary": "A painting by Georgia O’Keeffe, hidden in a Manhattan closet for decades, is set for auction at Christie’s with an estimated value of $3 million to $5 million. The 1930 artwork depicts a New Mexico landscape and is believed to be the first in a series of three. O'Keeffe is widely regarded as the 'Mother of American modernism.'", "category": "Culture", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "d3f01847"}, {"headline": "US air travel disruptions continue for third day after FAA failures", "summary": "US air travel face disruptions for a third day following a systemwide ground stop caused by a router installation error at an FAA facility. Over 1,600 flights were cancelled and 3,600 delayed on Sunday. Transportation Secretary Sean Duffy predicted a return to normalcy by Monday, emphasizing there is no evidence of a cyberattack.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "f93a421f"}, {"headline": "Bangladesh International Crimes Tribunal rejects fresh trial for Sheikh Hasina", "summary": "Chief prosecutor Md Aminul Islam rejected suggestions for a fresh trial of former PM Sheikh Hasina in a crimes against humanity case where she was sentenced to death. Islam stated that Hasina has lost her right to appeal as the 30-day window has expired, and no legal provision exists for a new trial under current frameworks.", "category": "Politics", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "5a480adf"}, {"headline": "Labour unrest hits Bangladesh garment sector over minimum wage demands", "summary": "Fresh labour unrest hit Bangladesh’s garment industry as 13 factories shut indefinitely. Workers are demanding a minimum monthly wage increase from 12,500 taka to 30,000 taka. Police used tear gas and sound grenades to disperse protesters in Gazipur. Owners have warned of further closures if production does not resume.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "f97ed17a"}, {"headline": "Planes collide at Miami airport weeks after fatal Amazon crash", "summary": "A Copa Airlines passenger jet and a UPS aircraft collided while taxiing at Miami International Airport. The wingtip of the Copa jet clipped the nose of the UPS Boeing 767. No major injuries were reported among the 166 passengers. The FAA is investigating the collision, which follows a fatal September crash involving an Amazon cargo plane.", "category": "Infrastructure", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "59680455"}, {"headline": "US Treasury Secretary urges Nvidia to appoint external CEO after ouster", "summary": "US Treasury Secretary Scott Bessent has called for a 'dramatic shake-up' in Nvidia’s leadership, suggesting the board hire an external CEO. The remarks follow the ouster of Jensen Huang and concerns over alleged illicit sales of advanced AI chips to Chinese entities through shell companies. Lawmakers are seeking answers regarding the firm's culture.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "ef6ce009"}, {"headline": "China’s ten-tonne electric commercial aircraft successfully completes its first crewed flight", "summary": "The CE-25A, the world’s first 10-tonne-class battery-electric commercial passenger aircraft, completed its maiden crewed flight in Shandong, China. Developed by COMAC and partners, the 19-seater aircraft reached a cruising speed of 300 km/h and covered 60.4 km in 16 minutes. The flight signals a shift from aviation turbine fuel to electric power.", "category": "Technology", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "29c45c09"}, {"headline": "Megaspeed International conducts internal investigation after Alice Huang leaves company", "summary": "Singapore-based Megaspeed International announced an internal probe led by outside lawyers following reports regarding its supply chain and business operations. The company confirmed that Chinese businesswoman Alice Huang left the firm in August 2025 and currently holds no role. Megaspeed maintains it runs a legitimate and lawful business.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "0f5db5f3"}, {"headline": "Seventy-five percent of hit-and-run victims miss out on mandatory compensation", "summary": "A report by Primus Partners reveals that 75% of eligible hit-and-run victims in India miss out on compensation provided under the Motor Vehicles Act. While annual deaths average 30,000, less than 8,000 claimants receive funds. Of the Rs 600 crore that should be disbursed annually, less than Rs 300 crore has been paid out over four years.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "06df6d68"}, {"headline": "Karnataka registration revenue increases by twenty-five percent in seven months", "summary": "Karnataka’s stamps and registration department recorded a 25.8% growth in revenue between April and October 2026, collecting Rs 17,406 crore. Officials attributed the spike to streamlined property registrations and the doubling of fees to 2% in August. The state government aims for a total revenue target of Rs 29,000 crore this fiscal year.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "94040c56"}, {"headline": "Two alleged cattle smugglers killed in Haryana police encounter at Nuh", "summary": "Two suspected cattle smugglers were killed and one was injured during an exchange of fire with Haryana police in Nuh. The suspects allegedly opened fire when their pickup truck was intercepted. A policeman also sustained injuries in the gunfight. Seven cows were being transported illegally at the time of the incident.", "category": "Law", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "296d49e4"}, {"headline": "Nagpur coaching institute staffer charged under Pocso for sending nude photos", "summary": "A 23-year-old woman working at a private coaching institute in Nagpur has been charged under the Pocso Act and IT Act for allegedly sending nude photos and videos to minor students. The matter came to light after a call to a child helpline. Police are investigating if the case is linked to a wider sextortion racket.", "category": "Law", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "2696e81d"}, {"headline": "South India contributes half of research papers and most patent applications", "summary": "Nearly 50% of India's research output and 56% of patent applications come from the five southern states, according to a NITI Aayog scoreboard. Tamil Nadu leads in patent applications (16,048) and research publications (44,611). Maharashtra tops the list for deep-tech startups with 6,112, followed by Karnataka with 5,315.", "category": "Science", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "6d0e29fa"}, {"headline": "PM Narendra Modi launches three-thousand-crore tribal projects to end Maoism", "summary": "Prime Minister Narendra Modi inaugurated and launched tribal development projects worth nearly Rs 3,000 crore on the 151st birth anniversary of Birsa Munda. Speaking in Gadchiroli, Modi stated that improved education and employment opportunities have helped defeat Maoism in 125 districts, bringing hope to tribal families.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "72372fa2"}, {"headline": "Bengalurean man lures daughter into murder plot with property promises", "summary": "A 52-year-old man, S Indushekhar, allegedly persuaded his daughter to help him commit seven murders to gain control of property worth Rs 2.5 crore. The daughter, who turned 18 days after the crime, allegedly assisted in destroying evidence and transporting bodies. Police found that Indushekhar had prepared stamp papers and obtained thumb impressions post-mortem.", "category": "Law", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "23b8537e"}, {"headline": "Konkani singing marathon sets new Guinness World Record in Mangaluru", "summary": "A Konkani mega convention in Mangaluru set a Guinness World Record for the longest singing marathon. Over 300 teams performed 4,596 songs over 12 days, 12 hours, and 12 minutes. The feat broke the previous record of 11 days and 11 hours set earlier in 2024. The event brought together performers across geographical and religious boundaries.", "category": "Culture", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "7c4a972a"}, {"headline": "Security upgraded for Bollywood stars on Lawrence Bishnoi target list", "summary": "Mumbai and Delhi police are reassessing security for high-profile celebrities, including Amitabh Bachchan and Salman Khan, following threats from the Lawrence Bishnoi gang. Investigators are reviewing visitor logs at Sabarmati jail to determine how hits are ordered from within prison. Additional personal security officers have been assigned to actors on the list.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "9cac2abb"}, {"headline": "India defeats New Zealand in ODI series to snap home streak", "summary": "The Indian men's cricket team won the fifth ODI by 22 runs to clinch the bilateral series 3-1. Defending a modest total of 209, Arshdeep Singh and Mohammed Siraj led a spirited bowling attack to dismiss New Zealand for 187. This marks New Zealand's first home bilateral ODI series defeat in seven years, snapping an 11-series winning streak.", "category": "Sports", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "113f211c"}, {"headline": "Karnataka young talent shines at Shanghai WorldSkills with multiple medals", "summary": "Karnataka’s 16-member contingent helped India break into the global top 10 for the first time at the WorldSkills competition in Shanghai. Smriti Nambiar won a silver in bakery, while others secured medallions for excellence in additive manufacturing, robotics, and cybersecurity. The state provided nearly a quarter of the national team's total members.", "category": "Education", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "2ea8a2d7"}, {"headline": "Bengaluru moat is talent and must remain liveable says Prashanth Prakash", "summary": "In an interview, Accel India founding partner Prashanth Prakash emphasized that Bengaluru's primary advantage is its talent pool, which is mobile. He warned that the city must remain liveable to retain this talent. Prakash also highlighted the potential of physical AI and robots to handle dangerous jobs like sanitation and factory loading in the near future.", "category": "Culture", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "389810bb"}, {"headline": "KR Puram evolves from tamarind groves to bustling eastern industrial hub", "summary": "A historical overview of KR Puram reveals its transformation from a village known as 'Hosa Uru' to a critical commercial and industrial node. Once dominated by tamarind groves and weekly markets, the area became a factory hub with the establishment of ITI and NGEF. Today, it is defined by the cable-stayed bridge and massive traffic volumes linking east Bengaluru.", "category": "Culture", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "d91dbbad"}, {"headline": "Karnataka government proposes guidance value hike for immovable properties", "summary": "The Karnataka government is proposing to increase the guidance value of immovable properties across the state. This would be the second hike in two years, following a 15-30% increase in 2023. Officials have completed district-level consultations. The revision will vary based on location and connectivity, with properties near national highways expected to see significant hikes.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "72989c50"}, {"headline": "Chamarajanagar milk procurement rises despite drought conditions in the district", "summary": "Daily milk procurement by the Chamarajanagar Milk Union (Chamul) rose to 3.1 lakh litres in early November, up from 2.9 lakh in October. Stakeholders attributed the increase to an Rs 8-per-litre price hike that provides farmers with steady income despite widespread crop losses. Farmers are currently seeking further government incentives to manage rising fodder costs.", "category": "Economy", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "b031c384"}, {"headline": "Malaprabha water released for drinking only as reservoir levels drop", "summary": "Water from the Malaprabha reservoir will be released into canals for 10 days starting Sunday, but strictly for replenishing drinking water tanks in Gadag and Dharwad. Inadequate rainfall in the catchment area has left the reservoir with insufficient levels for rabi crop irrigation. Officials warned residents against using the water for washing cattle or farming.", "category": "Environment", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "ef2eb20e"}, {"headline": "Karnataka government initiates process to repeal BJP-era anti-conversion law", "summary": "The Karnataka government has forwarded a proposal to the law department to repeal the anti-conversion law introduced by the previous BJP government. The bill is expected to be tabled during the Belagavi winter session. While the anti-conversion law is likely to be revoked, the government is still studying the potential political implications of repealing the anti-cattle slaughter law.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "29a8990f"}, {"headline": "Food truck subsidy scheme launched for Scheduled Tribe entrepreneurs in Karnataka", "summary": "The Karnataka cabinet has approved a food truck subsidy scheme for Scheduled Tribe entrepreneurs. The initiative offers a 75% subsidy on the unit cost, capped at Rs 4 lakh. The scheme aims to provide standardised mobile units for better quality food service and economic empowerment for over 50 ST communities, potentially generating significant employment.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "9139bfda"}, {"headline": "Karnataka Bet on private investment for forty-seven-year urbanization policy", "summary": "The Regional Urbanisation 2047 policy indicates that the Karnataka government will directly execute only nine out of over 50 proposed urban projects. The remaining initiatives, including agro-processing parks and skill universities, will rely on private funding through public-private partnerships. The shift aims to rein in capital expenditure while fostering regional growth.", "category": "Infrastructure", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "274cf76b"}, {"headline": "Student killed and friend injured as truck hits bike near Dobbaspete", "summary": "A 19-year-old BCom student, Bhavishya Sharma, was killed when a truck rammed his motorcycle on Tumakuru Road. Sharma and his friend were heading for a trekking trip to Shivagange Hills. Sharma was run over by the truck and died on the spot, while his friend Anushka sustained injuries. The Peenya traffic police have detained the truck driver.", "category": "India", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "34492ab1"}, {"headline": "Upa Lokayukta pulls up panchayat development officer for alleged corruption", "summary": "Upa Lokayukta B Veerappa pulled up the Narasapur gram panchayat development officer after finding evidence of corruption and poorly maintained records. During an inspection, Veerappa discovered overwritten names in attendance registers and employees who hadn't signed for months. He warned the official against treating the panchayat as ancestral property.", "category": "Politics", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "0fd1ba72"}, {"headline": "Captive temple elephant Dhruva dies after prolonged illness in Belagavi", "summary": "Dhruva, a 32-year-old captive elephant at Karisiddheshwara Mutt, died following a long illness. The death occurred just one day after a High Court hearing regarding the rehabilitation of captive elephants in the state. Animal welfare advocates alleged neglect and inhumane chaining contributed to the animal's death, highlighting systemic management issues.", "category": "Environment", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "6b006692"}, {"headline": "Godrej Woodsman emerges overall champion at Byatarayanapura inter-apartment sports fest", "summary": "The Godrej Woodsman community won the overall championship at the fourth Byatarayanapura inter-apartment sports fest. Over 4,500 residents participated in 19 sporting disciplines. An 84-year-old table tennis player reached the semifinals, highlighting the event's inclusivity. Prestige Willow Tree was recognized for the highest number of women participants.", "category": "Sports", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "efa2d568"}, {"headline": "Eighty-five-year-old allottee awaits removal of BDA site encroachment for thirty years", "summary": "SM Mallaiah, 85, has spent nearly three decades fighting for the removal of encroachments blocking access to his BDA-allocated site in Basaveshwaranagar. Despite multiple consumer forum rulings in his favour and a non-bailable warrant against the BDA commissioner, the encroachments have evolved from sheds into a multi-storey building. BDA has promised to review the case file.", "category": "Law", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "cfd19dec"}, {"headline": "Water tanker driver abducted and assaulted over salary dues row", "summary": "A 30-year-old water tanker driver was allegedly abducted and assaulted by his former employer and three others in Bengaluru. The victim, Mohan G, claimed he was owed Rs 2.1 lakh in wages for seven months. After demanding payment, he was attacked with an iron rod and dumped near a railway gate. Three suspects have been arrested by JB Nagar police.", "category": "Law", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "7b2e70c5"}, {"headline": "Woman loses eight lakh rupees in Instagram gift parcel fraud", "summary": "A 46-year-old Bengaluru woman lost nearly Rs 8 lakh to cyber fraudsters after responding to an Instagram ad. The suspects, using a Pakistani mobile number, convinced her that a valuable gift parcel from London was held by customs. She was pressured into transferring funds for delivery and clearance charges across multiple bank accounts. Police have registered a case.", "category": "Law", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "bf861243"}, {"headline": "Eighty-eight thousand candidates appear for KPSC preliminary examinations", "summary": "Around 88,000 candidates appeared for the KPSC Gazetted Probationer preliminary exams across Karnataka, representing a 60% attendance rate. The examination was conducted in 6,192 halls across 345 centres. The recruitment drive is for 319 posts. Candidates who qualify in this stage will be eligible for the main examinations.", "category": "Education", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "8ec0bcf3"}, {"headline": "Bangalore University declares BEd results within record six days of exams", "summary": "Bangalore University announced the fourth-semester BEd results just six days after the exams concluded. The expedited evaluation of 9,817 answer scripts was intended to help students meet a November 16 deadline for applying to 16,000 state teaching positions. The results cover students across multiple disciplines.", "category": "Education", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "72ff6870"}, {"headline": "Man sets godowns ablaze in Anekal after domestic dispute with wife", "summary": "A 36-year-old man, Jeevan Raj, was arrested for a series of arson attacks on scrap godowns in Anekal and Jigani. Raj reportedly set the fires to vent frustration after his wife moved to her parents' home following a dispute. One worker sleeping in a godown died of suffocation. Raj was identified using footage from over 200 CCTV cameras.", "category": "Law", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "3af0331a"}, {"headline": "Volunteers join #IamBengaluru initiative to clean parks and survey biodiversity", "summary": "Volunteers participated in cleaning drives and biodiversity surveys across various Bengaluru parks as part of the #IamBengaluru initiative. Activities included plogging, waste segregation, and botanical art. MLA NA Haris joined the drive in Richmond Town, emphasizing that park maintenance is a collective responsibility beyond the scope of municipal planting efforts.", "category": "Environment", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "d1158628"}, {"headline": "Government healthcare spending triples since twenty-thirteen reaching four lakh crore", "summary": "Total government healthcare expenditure in India has reached Rs 4.1 lakh crore, tripling from 2013-14 levels. Consequently, out-of-pocket medical expenses for households dropped from 64.2% to 42.7% of total health expenditure. State governments remain the largest contributors, providing nearly 68% of total public health spending.", "category": "Health", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "c46d2896"}, {"headline": "Vande Bharat train runs four-hundred kilometres with poor power brakes", "summary": "An empty Vande Bharat train travelled approximately 463 km from Hatia to DDU station despite loco pilots reporting poor brake power. A subsequent inspection revealed that brakes on every coach had been isolated, meaning joint brakes were non-functional. South Eastern Railway has ordered an investigation into the potentially dangerous incident.", "category": "Infrastructure", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "1ebcc183"}, {"headline": "Holiday season causes severe blood shortage in Mumbai public hospitals", "summary": "Mumbai public hospitals are facing a critical blood shortage as many regular donors have left the city for the holiday season. Facilities like Tata Memorial Hospital and KEM are struggling to meet daily requirements for surgeries and emergencies. Hospitals have issued urgent appeals for volunteers and housing societies to organize donation camps.", "category": "Health", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "28a38b7d"}, {"headline": "NCERT to roll out new textbooks and train sixty lakh teachers", "summary": "NCERT plans to make its revised Class X textbooks available by December 2026, well ahead of the 2027-28 session. The rollout will be accompanied by a nationwide initiative to train 60 lakh teachers in classroom practices aligned with the National Curriculum Framework 2023. The effort aims to end the perennial scramble for books and ensure teacher readiness.", "category": "Education", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "3213cdb5"}, {"headline": "Uttarakhand MLA Harish Dhami booked for vandalising stage at trade fair", "summary": "Congress MLA Harish Dhami and five others were booked for allegedly vandalising a stage and misbehaving with officials at the Jauljibi trade fair in Uttarakhand. Dhami claimed his microphone was switched off before he could raise local issues. Police filed the FIR for rioting and property damage after the MLA allegedly manhandled officers during the event.", "category": "Politics", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "3f821af3"}, {"headline": "Tiger cub killed by train on railway tracks in Balaghat district", "summary": "A one-year-old tiger cub was killed after being struck by a train on the Katangi-Tirodi railway line in Balaghat. This takes Madhya Pradesh's tiger death toll to 58 in 2026. The cub was crossing the tracks in a forest development corporation range when the accident occurred. Forestry officials confirmed the death on Sunday.", "category": "Environment", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "99e4bd96"}, {"headline": "IISc gains forty-three places in QS World University Sustainability Rankings", "summary": "The Indian Institute of Science (IISc) Bengaluru climbed 43 places to rank 419th in the QS World University Sustainability Rankings 2027. India emerged as the only major system to see more universities rise than fall. IIT Delhi remains the highest-ranked Indian institution at 194th. The rankings evaluate environmental impact, social impact, and governance.", "category": "Education", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "e6805df6"}, {"headline": "Former ISRO chief outlines India’s Space Vision 2047 for Amrit Kaal", "summary": "In a special column, former ISRO chairman Somanath Sreedhara Panicker detailed India's long-term space objectives. These include human spaceflight, the establishment of the Bharatiya Antariksh Station, and a lunar landing by 2047. He emphasized that private sector involvement and institutional resilience are key to transforming ambitious goals into national achievements.", "category": "Science", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "c005bf05"}, {"headline": "Bengal BJP worker killed by party colleagues for opposing extortion demands", "summary": "A 42-year-old BJP worker, Arup Saha, was allegedly killed by a group that included his own party members in Sodepur, West Bengal. Saha had reportedly protested against the assault of a local businessman and threats of extortion. The incident has highlighted internal friction and claims of extortion becoming a 'new normal' in some regional units.", "category": "Politics", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "8296c40a"}, {"headline": "NITI Aayog launches science scoreboard to help states track research innovation", "summary": "NITI Aayog has released an interactive 'science and technology scoreboard' to help states and UTs benchmark their research and innovation landscapes. The platform tracks publications, patent applications, and international collaborations. The goal is to facilitate evidence-based policymaking and identify regional areas of expertise in science.", "category": "Science", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "0280dff3"}, {"headline": "Mumbai forum hosts first online talk by Pakistani scientist Pervez Hoodbhoy", "summary": "A Mumbai-based council hosted an online lecture by Pakistani nuclear physicist Pervez Hoodbhoy to honor Nobel laureate Abdus Salam. This was a rare cross-border academic interaction. Hoodbhoy discussed Salam's contributions to science and his peripheral role in Pakistan's nuclear program before transitioning into global disarmament advocacy.", "category": "Science", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "ee076600"}, {"headline": "Anti-dam group in Arunachal issues forty-eight-hour ultimatum to state government", "summary": "The Adi Galo Welfare Society has given the Arunachal Pradesh government 48 hours to scrap the 11,200-MW Siang Upper Multipurpose Project. The group completed a 400km foot march to the capital, Itanagar, demanding the release of arrested protesters and the withdrawal of central forces from affected areas. Further action depends on the government's response.", "category": "Environment", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "e77bc72f"}, {"headline": "Goa forest department proposes turtle nesting tag for twenty-four beaches", "summary": "The Goa forest department has proposed declaring 24 beaches as turtle nesting sites under the Coastal Regulation Zone 2019. The move would lead to stricter controls on lighting, beach shacks, and nighttime activities during the olive ridley nesting season. Identified beaches include Morjim, Colva, and Palolem, aiming to preserve sensitive ecological habitats.", "category": "Environment", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "cfe742ee"}, {"headline": "AI-assisted technique reveals exoplanets hidden by starlight in Webb images", "summary": "Researchers have developed a new AI-assisted technique that removes starlight from James Webb telescope images to reveal previously hidden exoplanets. This innovation improves the ability to search for potentially habitable worlds by isolating planetary signals from the glare of their host stars, enhancing our understanding of planetary systems.", "category": "Science", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "058848c3"}, {"headline": "Medieval manuscripts reveal traces of deadly livestock virus DNA", "summary": "Scientists analyzing 1,000-year-old medieval manuscripts made of animal-skin parchment have discovered DNA traces of a deadly livestock virus. The pathogen has affected sheep for nearly 3,700 years. The discovery provides insights into the history of animal diseases and how they were preserved in ancient biological materials used for writing.", "category": "Science", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "e93a0604"}, {"headline": "Nanomaterial-coated film could shield reservoir water from evaporation", "summary": "A physicist has developed a nanomaterial-coated PET film that acts as a 'sunscreen' for reservoirs, reducing water evaporation by nearly 100% in lab tests. The lightweight, transparent material allows sunlight for aquatic life while blocking infrared heat. Field trials are planned to test durability against changing weather conditions and wind.", "category": "Science", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "51a3ce6f"}, {"headline": "MOGENRY gene therapy offers hope for patients with retinitis pigmentosa", "summary": "Scientists at Nanoscope Therapeutics have developed MOGENRY, a one-time optogenetic gene therapy for retinitis pigmentosa, which affects over a million people in India. The therapy delivers light-sensitive genes to surviving retinal cells to restore vision. It is currently under regulatory review in the US and Japan following successful clinical trials.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "501fc5a4"}, {"headline": "Research reveals birdsong shares universal acoustic patterns with human speech", "summary": "A study published in Science shows that many acoustic patterns in human song and speech are shared with birdsong. Researchers found that both humans and birds end phrases with longer syllables and use regular rhythms. These similarities may stem from a shared need to coordinate breathing with vocal musculature during the developmental stages of life.", "category": "Science", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "1724e73d"}, {"headline": "RBI rejects microfinance industry proposal to relax loan repayment cap", "summary": "The RBI has rejected a proposal from the microfinance industry to exclude principal repayments from the 50% household income cap for loan servicing. The regulator stated that the limit is essential to prevent over-indebtedness among low-income households. Currently, microfinance borrowers spend an average of 18.7% of their monthly income on repayments.", "category": "Economy", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "9088e15f"}, {"headline": "Domestic conglomerates embrace Global Capability Centre model for better efficiency", "summary": "Major Indian firms like Tata, JSW, and Adani are increasingly adopting the Global Capability Centre (GCC) model used by MNCs. By centralizing technology, finance, and human resources, these firms aim to drive efficiency and standardize processes across their various business units. This shift helps conglomerates tap into specialist talent and foster innovation.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "d6f8a396"}, {"headline": "Indian liqueur companies carve market space with traditional local flavours", "summary": "Indian startup liqueur makers are launching products inspired by local ingredients like filter coffee, rose, saffron, and Himalayan spring water. Brands like Quaffine and Palasa aim to compete with imported labels like Kahlúa. The shift reflects a changing consumer preference among younger buyers and women for contemporary drinks with indigenous origins.", "category": "Business", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "072ce40c"}, {"headline": "Claude AI downloads surge as ChatGPT installs fall twenty-one percent", "summary": "Anthropic’s Claude AI app saw a 15-fold increase in downloads in India during July-September, while ChatGPT downloads fell by 21%. Claude has risen to third in India’s app-spending rankings. Globally, ChatGPT still leads in total revenue, but Claude is outpacing rivals in growth rate for in-app purchases across both Apple and Google platforms.", "category": "Technology", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "578de5ba"}, {"headline": "Manipal Health revenue grows thirty-seven percent in September quarter", "summary": "Manipal Health Enterprises reported a 37.3% year-on-year increase in revenue to Rs 3,399 crore for the September quarter. The growth was driven by higher patient volumes across its hospital network. Net profit, excluding exceptional items, rose 21.6% to Rs 380 crore, though net margins contracted slightly to 11.2% due to operational factors.", "category": "Business", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "84e78066"}, {"headline": "PT Usha clears eligibility hurdle to contest IOA presidential elections", "summary": "PT Usha’s bid for the Indian Olympic Association (IOA) presidency was cleared after an electoral officer rejected objections to her nomination. Usha is contesting as a representative of the Ice Hockey Association of India. The 71-member electoral college will vote on December 5 to decide the president and other executive council members.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "ac26cb6e"}, {"headline": "Anvay Dravid relives India’s thrilling Under-nineteen Asia Cup victory", "summary": "Young wicketkeeper-batter Anvay Dravid described India's one-wicket victory over Pakistan in the U-19 Asia Cup final as an amazing experience. The match went down to the final ball, with India successfully chasing a target of over 300. Dravid, son of Rahul Dravid, highlighted the team's resilience in the rollercoaster contest.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143698", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143698"}], "article_id": "dd4da8ec"}, {"headline": "Karnataka U-23 women secure thrilling last-ball win over Kerala", "summary": "Karnataka claimed a narrow two-run victory over Kerala in the BCCI U-23 Women's T20 Trophy. Batting first, Karnataka posted 174/4 led by Silkin Patel’s 72. Kerala finished at 172/8 in their 20 overs despite Ananya Pradeep’s 58. Veda Varshini was the pick of the bowlers for Karnataka, taking three wickets to stall Kerala's chase.", "category": "Sports",
