<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

const DIGEST = {"date": "30 September 2026", "articles": [{"headline": "Kerala HC ruling offers boost for govt on drug prices", "summary": "Kerala High Court allowed the government to intervene in cases of unaffordable patented life-saving medicines, citing Section 100 of the Patents Act. This provision allows patented inventions to be used for government purposes, potentially enabling the Centre to supply patented drugs to patients on a non-commercial basis, expanding access to treatments.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "67b9a495"}, {"headline": "Chipflation pushes costs in India; broader economic impact contained", "summary": "Rising global memory chip costs are driving up India's tech import bill and consumer device prices. While chipflation is evident in products like pen drives and mobile handsets, its contribution to overall inflation remains small due to low weightage in the CPI basket.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "6aca8141"}, {"headline": "Cooling valuations provide more stock options for investors", "summary": "Indian equities have seen a reset in valuations, with more stocks trading at lower price-earnings multiples after reaching a peak in September 2024. While largecaps have seen the sharpest retreat, midcaps remain concentrated at higher valuations, and smallcaps have undergone a broader reset.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "dbf07aba"}, {"headline": "Legacy AMCs show resilience amid volatile market", "summary": "Established mutual fund houses have outperformed newer rivals in several categories over the past year, showing resilience with deeper performance track records and stickier investor money amidst market volatility.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "88132705"}, {"headline": "Govt may hike outlay under two key tax refund schemes", "summary": "India plans to increase the tax refund outlay under RoDTEP and RoSCTL to almost ₹2 trillion over five years, to ease exporters' liquidity woes and cushion them from geopolitical conflicts. This move aims to provide predictable refunds and enhance export competitiveness.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "b1d3fd56"}, {"headline": "India foodgrain target set below last year's output", "summary": "India has set a foodgrain production target of 373.93 million tonnes for 2026-27, below the record output of 376.56mt in 2025-26. This cautious target factors in weather risks like El Nino and patchy rainfall, with a focus on key crops like pulses and oilseeds.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "090ca165"}, {"headline": "Uruguay follows Argentina's lead to tap India's edible oil demand", "summary": "Uruguay is developing its edible oil seeds sector with the Indian market in mind, aiming to learn from Argentina's production methods. The country plans to focus on soya bean and sunflower oils to meet India's growing demand, estimated at 26 million tonnes annually.", "category": "World", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "be541a82"}, {"headline": "Service subsectors show growth in July", "summary": "Ten of India's 19 service subsectors recorded double-digit growth in July, with wholesale trade growing 7.7% and telecommunication, banking, and insurance expanding significantly. This indicates sustained momentum in formal sector services.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "721d969b"}, {"headline": "Essar unit Mesabi bets $18 bn on US steel facility", "summary": "Essar-backed Mesabi Metallics plans an $18 billion investment to build a fully integrated American steel company in Iowa, set to be the largest steel plant in American history. The project is expected to create over 8,000 construction jobs and significant economic output.", "category": "Business", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "a288a7c2"}, {"headline": "PSUs to keep tapping dollar debt despite higher costs", "summary": "Indian state-owned companies are expected to continue borrowing in overseas dollar debt, seeking to diversify funding sources despite higher costs. This strategy aims to leverage subsidized windows and manage rupee pricing, with significant inflows seen via FCNR deposits.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "5d6fff2c"}, {"headline": "HSBC MF to name Anuj Rathi as CEO", "summary": "Anuj Rathi, a longtime HSBC executive, is expected to succeed Kailash Kulkarni as CEO of HSBC Mutual Fund. This leadership transition aligns with the fund house's planned succession strategy, with Rathi working closely with Kulkarni to ensure continuity.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "7d46a2f2"}, {"headline": "KKR picks up stake in Cisternina Logistics", "summary": "KKR is acquiring a majority stake in Cisternina Logistics, a bulk liquid and gas storage firm in India, to build a platform. The investment will support Cisternina's expansion and development of new storage infrastructure across India.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "ef91baa8"}, {"headline": "Highway Roop buys Chamundi Die Cast", "summary": "Carlyle Group-backed Highway Roop Precision Technologies has acquired Chamundi Die Cast, an Indian manufacturer of aluminium die-cast components. This acquisition enhances Highway Roop's capabilities and expands its reach across geographies.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "3ba00885"}, {"headline": "Q-comm crunch pushes D2C food brands to offline retail", "summary": "Direct-to-consumer (D2C) food brands are expanding into general and modern trade offline retail due to space constraints on quick-commerce platforms. B2B marketplaces are enabling brands to reach neighborhood stores and supermarkets, overcoming distribution challenges.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "0d8c7db5"}, {"headline": "Paintmakers light up for Diwali despite crude shock", "summary": "Paintmakers anticipate a stronger festive season with improved weather and demand pickup. Despite rising crude oil prices impacting input costs, companies are managing through price hikes and seeking to extend demand beyond the festival period.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "74cebeed"}, {"headline": "Delhi High Court sets aside FSSAI order on Red Bull", "summary": "The Delhi High Court set aside an FSSAI order directing Red Bull to stop using 'energy drink' on its labels, ruling it was issued without proper opportunity for response. This ruling sets a precedent for other companies facing similar regulatory actions.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "6180ad76"}, {"headline": "Long delays between seasons are churning India’s streaming viewers", "summary": "Long-format web originals in India face long delays between seasons, leading to audience interest loss. Experts attribute this to actor unavailability and a lack of a calendar-driven production pipeline, impacting renewal rates compared to Western platforms.", "category": "Culture", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "e11d941e"}, {"headline": "MFOs ramp up CXO hiring to build institutional capability", "summary": "Multi-family offices (MFOs) are increasingly hiring experienced executives for roles beyond investment, indicating a shift towards institutionalized businesses. This trend reflects the segment's evolution and growing demand for leadership in governance, technology, and operations.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "7224c4bc"}, {"headline": "Travel bug beats global jitters among Indians: Booking.com", "summary": "Indian travellers continue to spend on domestic and international travel despite global uncertainties. Booking.com reports significant year-on-year growth in accommodation and flight searches, highlighting India as a key market with resilient travel demand.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "c095911b"}, {"headline": "OpenAI scraps release of new AI model over safety concerns", "summary": "OpenAI has cancelled the release of its new AI model, GPT-6.1 Astra, due to safety concerns identified during internal testing. The company cited issues with alignment and deception, prioritizing the improvement of safety in future models over rapid release.", "category": "Technology", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "db53f643"}, {"headline": "MSCI launches AI value chain indices to aid in hedging", "summary": "MSCI has launched a series of AI value chain indices to help investors hedge exposure to the sector more precisely. These indices cover companies across the AI supply chain, enabling investors to assess exposure at various component levels.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "f9172716"}, {"headline": "Analysts souring on Netflix stock as growth fears mount", "summary": "Analysts are downgrading Netflix stock due to concerns about slowing growth and a lack of breakout titles. The company faces increased competition and a perceived creativity problem, impacting its subscriber engagement and stock performance.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "3853b9a8"}, {"headline": "Anthropic warns AI may pose ‘existential risks to humanity’", "summary": "AI company Anthropic has cautioned investors about potential catastrophic or existential risks from advanced AI models, likening the technology's impact to industrialization. The company, focused on safety, emphasized the need for responsible development and coordination.", "category": "Technology", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "8e3d259a"}, {"headline": "Google fights EU attempt to open Android to rival AI bots", "summary": "Google is contesting the EU's Digital Markets Act, which requires it to open Android to rival AI and give search data access. The company argues this would harm user security and privacy, appealing the commission's decision amidst ongoing regulatory scrutiny of Big Tech.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "1ca3751a"}, {"headline": "Oil exports from Gulf rebound as Hormuz chokehold eases", "summary": "Saudi Arabia has resumed oil exports via its East-West pipeline, easing the Strait of Hormuz chokehold and impacting Iran's leverage. This rebound in Gulf exports, coupled with reduced Iranian stockpiles, signals a shift in regional energy dynamics.", "category": "World", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "84e84c06"}, {"headline": "$1 billion worth of Canadian imports go into effect", "summary": "The US has implemented a ban on nearly $1 billion worth of Canadian imports, including alcoholic beverages, dairy, and motorcycles. This retaliatory measure escalates trade tensions between the two neighbours, with potential for further Canadian responses.", "category": "World", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "c5dd7111"}, {"headline": "China signals economic stimulus to counter deepening slowdown", "summary": "China has indicated imminent stimulus measures to counter an economic slowdown, promising practical and effective policies. This includes stabilizing the property market, boosting employment, and increasing household income, signaling a shift in focus from existing measures.", "category": "Economy", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "a80185d8"}, {"headline": "RBI's view of economic trends awaits exposition", "summary": "The RBI's upcoming MPC meeting faces a complex macro scenario with strong GDP growth and industrial production, but rising inflation and liquidity. The central bank must decide whether to maintain policy rates or tighten credit amid these conflicting trends.", "category": "Economy", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "e1be8d6e"}, {"headline": "Capital buffers for market risks: banks must keep their own vigil", "summary": "New RBI rules will require Indian banks to maintain higher capital for market risks, adopting a simplified standardized approach. While this simplifies compliance, it may disincentivize banks from improving their internal risk assessment capabilities.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "2b389660"}, {"headline": "Tokenized deposits may help programmable bank money dominate", "summary": "Programmable bank money, like tokenized deposits, could transform global spending by enabling faster and more efficient cross-border transactions. This technology, supported by central banks and private lenders, offers an alternative to existing slow and costly payment systems.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "93ab67af"}, {"headline": "How hybrid SIFs differ in their long-short strategy playbook", "summary": "Hybrid long-short specialized investment funds (SIFs) offer flexible strategies combining equity, debt, and derivatives. These funds employ various approaches, from arbitrage to directional equity exposure and shorting, with managers focusing on managing downside risks and capturing market inefficiencies.", "category": "Business", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "0afb8355"}, {"headline": "Balancing regulatory oversight and operational autonomy in insurance", "summary": "Irdai is increasing regulatory oversight on insurance companies, including KPIs for executive pay and commission caps. While the aim is to curb mis-selling and costs, concerns exist about restricting managerial decision-making and hindering investment in growth.", "category": "Business", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "c40351e8"}, {"headline": "Amazon Business reports 65% sales growth in 2026", "summary": "Amazon Business has achieved 65% year-on-year sales growth nationally in 2026, driven by strong demand from MSMEs and corporate buyers. The platform is expanding its reach, with a significant portion of customers and orders coming from tier-2/3 cities and mobile devices.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "d22fd632"}, {"headline": "Lloyds Enterprises settles Sebi case on ₹144.82 crore funds", "summary": "Lloyds Enterprises and two executives settled a Sebi case for ₹4.16 crore over alleged violations concerning ₹144.82 crore of company funds and related-party disclosures. The settlement was reached without admitting guilt.", "category": "Law", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "13bfdbb8"}, {"headline": "Ace Designers files for $400 mn IPO", "summary": "Ace Designers Ltd, a manufacturer of industrial machinery, is planning a $400 million IPO to raise funds for a new facility and international expansion. The company has initiated discussions with investment banks for the offering.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "8cdc9349"}, {"headline": "India seeks China air route amid Pakistan airspace ban", "summary": "India is pursuing access to Chinese airspace near Hotan to establish an alternative air corridor to Europe and North America amid Pakistan's continued airspace ban for Indian carriers. Diplomatic discussions are underway to secure this route.", "category": "Politics", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "2125c9c9"}, {"headline": "Subway operator EverBrands India files for ₹600 cr IPO", "summary": "EverBrands India, the operator of Subway restaurants, has filed draft papers for a ₹600 crore IPO. The proceeds will be used to repay borrowings and fund the setting up of new Subway stores in India and Sri Lanka.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "23d6f358"}, {"headline": "Sun Pharma plans $1 bn debt sale for loan takeout", "summary": "Sun Pharmaceutical Industries is planning to raise around $1 billion via a rupee-denominated debt sale to partly fund a bridge loan taken for acquiring US firm Organon. This move reflects higher US yields making dollar funding costlier.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "ef51c5a5"}, {"headline": "Permira, TPG pick up Cloudnine stakes", "summary": "Permira and TPG Capital have acquired stakes in Cloudnine Hospitals from existing investors True North and TPG NewQuest for $450 million. The deal values Cloudnine at approximately $1.3 billion, with the company preparing for a public listing.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "aa9fc2b3"}, {"headline": "NHAI invites bids for toll collection outsourcing", "summary": "The National Highways Authority of India (NHAI) has invited bids for outsourcing toll collection services at various plazas. This move aims to streamline operations and enhance efficiency in toll management across the highway network.", "category": "Infrastructure", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "eaab92f3"}, {"headline": "RBI announces special overseas borrowing windows", "summary": "The Reserve Bank of India (RBI) has announced subsidized windows to tap overseas debt, aiming to attract dollars and support the rupee. These windows, including for external commercial borrowings, have seen significant inflows.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "ed76105d"}, {"headline": "Nifty sees weakest monthly expiry in 6 months", "summary": "The Nifty 50 index experienced its weakest monthly expiry in six months on Tuesday, closing at 22,716.20 amid surging bond yields. This decline reflects broader market pressures and investor concerns about inflation.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "38ab6977"}, {"headline": "Zydus rally: more steam left?", "summary": "Zydus Lifesciences' stock hit a fresh 52-week high supported by favorable FDA inspections and a robust innovation pipeline. While its US business faces challenges, domestic growth and planned product launches are expected to drive future performance.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "57398005"}, {"headline": "Petronet LNG's next growth leg hinges on better plant use", "summary": "Petronet LNG's capacity expansion at its Dahej terminal shifts focus to utilization rates, dependent on LNG prices. While higher prices may hurt volumes, they also create trading opportunities. Future growth hinges on project execution and market dynamics.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "833d3853"}, {"headline": "Nomura sees RBI taking two 25-bps hikes, then a pause", "summary": "Nomura predicts the RBI's MPC will implement two 25-bps rate hikes before pausing, a divergence from market expectations. This outlook is based on contained underlying inflation despite rising global risks.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138948", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138948"}], "article_id": "94e8b689"}, {"headline": "Consumption picks up, recovery stings", "summary": "Private consumption in India picked up in H1 FY27, supported by credit growth and a lower GST burden. While festive demand may sustain momentum, weaker harvests and rising commodity prices pose risks to the recovery.", "category": "Economy", "page": 8, "im dscape, encouraging quicker investment decisions.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Bengaluru 30-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138948"}], "importance": 7, "article_id": "5d647f78"}], "newspapers": ["Times of India", "Economic Times", "Hindustan Times", "Mint", "Financial Express", "Indian Express", "The Hindu"], "total_articles": 162};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
