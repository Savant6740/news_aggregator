28-09-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "72dc6ea7"}, {"headline": "NEET paper leak impact: CISF to guard NTA premises", "summary": "CISF will guard NTA premises to ensure foolproof arrangements in confidential areas, following the NEET paper leak controversy. NTA has relocated to a new office with enhanced security measures.", "category": "Education", "page": 26, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "6114f7e4"}, {"headline": "A tipping point in Indian energy", "summary": "India's energy sector has reached a tipping point where renewables, particularly solar and batteries, are becoming economically superior to coal. This shift is driven by falling costs and will lead to significant changes in energy procurement and financing.", "category": "Economy", "page": 20, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "95da7455"}, {"headline": "A ‘legendary’ rice variety", "summary": "Kalanamak rice, an ancient scented variety with distinct nutritional benefits and cultural significance, is gaining market traction. Improved cultivation techniques and global demand are boosting its profitability for farmers.", "category": "Business", "page": 21, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "0c69dc96"}, {"headline": "Redwood: The Untold Story of the Cold War’s Most Extraordinary Spy", "summary": "Ben Macintyre's book 'Redwood' details the defection of KGB major Vladimir Kuzichkin, driven by personal reasons. His intelligence altered West Asia's history, with unintended consequences for the US and Britain.", "category": "Culture", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "23893842"}, {"headline": "Avoid paying a steep premium for foreign ETFs", "summary": "Investors are advised to avoid high premiums on India-listed international ETFs due to demand exceeding supply. Options include using LRS, investing in GIFT City funds, or international mutual funds to bypass these premiums.", "category": "Economy", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "a07d7c17"}, {"headline": "Bucket strategy deployed in retirement needs a refill rule", "summary": "The bucket strategy for retirement requires a refill rule to avoid depleting the safe bucket. Hybrid funds offer an automatic refill mechanism, integrating equity and debt management for sustained portfolio health.", "category": "Economy", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "b6cce407"}, {"headline": "India Inc sheds zombie firms", "summary": "The share of 'zombie' firms in India's corporate sector has decreased to 5.5% in 2025, indicating improved debt servicing capacity. The combined share of stressed and zombie firms has also fallen, showing a healthier corporate landscape.", "category": "Business", "page": 21, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "faacf102"}, {"headline": "Rich valuations, elevated crude narrow equity opportunities", "summary": "Elevated crude oil prices and rich valuations are narrowing equity opportunities. Investors should lower return expectations and focus on select sectors like pharmaceuticals, automotive, and metals, while maintaining a focus on companies with significant overseas revenues.", "category": "Business", "page": 21, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "61f6fd40"}, {"headline": "India’s first LNG train flagged off", "summary": "Union Minister Amit Shah flagged off India's first LNG-diesel dual-fuel train and dedicated several railway projects worth over Rs 1,500 crore. He highlighted progress in rail infrastructure and goods movement capacity.", "category": "Infrastructure", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "71b2e9e8"}, {"headline": "NMDC commissions ~5,427 cr iron ore plant", "summary": "NMDC Ltd has commissioned its 2 mtpa pellet plant in Chhattisgarh as part of a Rs 5,427-crore integrated project. This includes an iron ore processing plant and a slurry pipeline, offering an alternative to road transport.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "9ec8034d"}, {"headline": "Assam to resume methanol export to B’desh", "summary": "Assam Petro Chemicals Ltd (APL) will resume methanol exports to Bangladesh via the Brahmaputra river, marking the reopening of this trade route since Independence. This initiative aims to leverage waterways for trade.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "2a7131ce"}, {"headline": "PM urges citizens to participate in Census", "summary": "Prime Minister Narendra Modi urged citizens to self-enumerate online for the Census, emphasizing its importance for future planning. The facility is available in 16 regional languages.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "d09bfb6c"}, {"headline": "Oppn parties slam EC’s SIR response, seek CEC’s resignation", "summary": "Opposition parties criticized the Election Commission's (ECI) response to the Special Intensive Revision (SIR) of electoral rolls, demanding CEC Gyanesh Kumar's resignation. They allege targeted deletions of voters to benefit the BJP.", "category": "Politics", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "913860bf"}, {"headline": "4 out of 5 Indians to use AI assistants for festival shopping", "summary": "Four out of five Indian shoppers will use AI assistants for festival shopping, according to InMobi. Three in five plan to spend over Rs 10,000, with significant spending expected in Tier-II cities and among millennials.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "c73fdf5c"}, {"headline": "Country needs to build its own digital security platforms", "summary": "QNu Labs co-founder Sunil Gupta emphasizes the need for India to build its own sovereign digital trust platform, highlighting the vulnerability of traditional encryption and the importance of quantum-resistant solutions.", "category": "Technology", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "e744468c"}, {"headline": "Nationwide Bank Strike Deferred Following Agreement with IBA", "summary": "Bank unions have deferred a planned three-day nationwide strike after the Indian Banks’ Association (IBA) agreed to form a high-level committee to consider the demand for a five-day banking week. The committee will also discuss performance-linked incentives and other pending issues. The decision followed a late-night meeting between the United Forum of Bank Unions and the IBA.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 7, "article_id": "36097832"}, {"headline": "Five arrested on suspicion of terror plot near U.K. air base", "summary": "British counter-terrorism forces arrested five men on suspicion of preparing a terrorist act near the Fairford air base, used by the U.S. Air Force. The group was detained after a report of suspicious vehicles. U.S. President Donald Trump claimed the suspects aimed to cause significant damage. Residents in a nearby village were advised to evacuate as a precaution during the probe.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "c55fb0bd"}, {"headline": "Boeing warns airlines of software glitch in 737 MAX autopilot", "summary": "Boeing has identified a software issue in the 737 MAX that could cause the autopilot to disengage during certain 'go-around' landing scenarios. India has about 100 such aircraft in the fleets of Air India Express and Akasa. Boeing has issued an advisory to pilots and is working on a permanent software update. The FAA said it will review the issue but has not grounded the planes.", "category": "Technology", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 7, "article_id": "9856def5"}, {"headline": "Delhi minister Parvesh Verma slaps AAP worker over road quality", "summary": "A video surfaced showing Delhi PWD Minister Parvesh Verma slapping an aide of AAP MLA Jarnail Singh during a confrontation over a newly built road in Vikaspuri. AAP workers alleged the road was breaking apart, while the minister claimed the MLA was demanding commissions. Police have received complaints from both sides, including an assault charge and an extortion allegation.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138770"}], "importance": 7, "article_id": "3efcd463"}, {"headline": "Violence erupts at LPU campus following rumors of rape and suicide", "summary": "Violent protests broke out at the Lovely Professional University campus in Phagwara after rumors circulated about the alleged rape and suicide of a female student. Protesters damaged administrative buildings, torched vehicles, and blocked the national highway. Police have registered an FIR and formed an SIT to investigate the 'false and fabricated rumors' being spread on social media.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 7, "article_id": "4a0155c9"}, {"headline": "Tamil Nadu government withdraws RTI curbs on police department", "summary": "The Tamil Nadu government has revoked a controversial order that exempted the Public (Law and Order) Department from the RTI Act. The initial order, which classified the department as a security organisation, faced severe backlash from allies and opposition parties. Critics argued the move would have blocked transparency regarding custodial deaths and human rights violations.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138726"}], "importance": 8, "article_id": "cf98b2d7"}, {"headline": "Virat Kohli becomes fastest batter to reach 15,000 ODI runs", "summary": "Virat Kohli scored an unbeaten 139 against West Indies to become the second and fastest batter to reach 15,000 ODI runs, surpassing Sachin Tendulkar’s record. Alongside Shubman Gill's century, Kohli's 55th ton powered India to an eight-wicket victory. The win gives India a 1-0 lead in the three-match series, with Kuldeep Yadav earning Player of the Match for his 4-wicket haul.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 9, "article_id": "9e166675"}, {"headline": "Amit Shah flags off India's 1st LNG train in Gujarat", "summary": "Union Home Minister Amit Shah flagged off India's first LNG-powered train at the Sabarmati Railway Station in Gujarat. He stated that the project is a major step toward making the Indian Railways eco-friendly and reducing fuel costs. Shah also inaugurated railway development works worth ₹1,472 crore, emphasizing the government's commitment to modernizing rail infrastructure.", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138718"}], "importance": 8, "article_id": "37d97058"}, {"headline": "IndiGo flight from Guwahati suffers tail strike at Bengaluru airport", "summary": "An IndiGo Airbus A321 flight from Guwahati to Bengaluru suffered a tail strike while landing at Kempegowda International Airport. All passengers and crew are safe. The aircraft aborted the first landing attempt and landed safely on the second try. The plane is currently undergoing maintenance checks while the DGCA probes the incident, termed an 'abnormal runway contact.'", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 6, "article_id": "62169a2b"}, {"headline": "Two pandas arrive in Atlanta following Xi-Biden summit", "summary": "Two giant pandas from China have arrived at Zoo Atlanta, marking a continuation of 'panda diplomacy' after President Xi Jinping's recent US visit. The pandas are part of a 10-year conservation partnership aimed at breeding the endangered species. Their arrival is seen as a gesture to improve bilateral relations between the US and China amid ongoing trade tensions.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 5, "article_id": "30409445"}, {"headline": "Four dead as 3-storey building collapses in Ambala", "summary": "A three-storey building in Ambala, Haryana, collapsed on Sunday, killing four people and injuring several others. Rescue operations by the NDRF and local police continued late into the night. An inquiry has been ordered to determine the cause of the collapse, with officials suspecting structural weaknesses. The local administration has announced compensation for the victims' families.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 5, "article_id": "193b1f37"}, {"headline": "Clash at SRFTI over right-wing guest invitation", "summary": "Violence broke out at the Satyajit Ray Film and Television Institute (SRFTI) between students and members of a right-wing group over a guest's invitation. The students protested the guest's presence, leading to a heated confrontation and vandalism. Both sides have filed police complaints. The institute's administration has called for a probe into the incident to ensure campus peace.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 5, "article_id": "be20553f"}, {"headline": "Mojtaba Khamenei reportedly rescued from rubble after US strike", "summary": "Mojtaba Khamenei, a key figure in the Iranian establishment, was reportedly pulled from the rubble of a hospital after a US strike. The report, yet to be officially confirmed, has sparked intense speculation about the impact of the strike on Iran's leadership. Tensions between the US and Iran remain at an all-time high as both sides engage in retaliatory military actions.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}], "importance": 10, "article_id": "aaf425bb"}, {"headline": "Mass shootings in South Africa townships leave 27 dead", "summary": "At least 27 people were killed in two separate mass shootings in South African townships near Johannesburg and Cape Town. Gunmen with AK-47s killed 17 at a bar in Wedela, while 10 died in a shooting at a venue near Cape Town hours later. Motives remain unknown, but the incidents highlight the country's severe gun violence and organized crime problems. No arrests have been made.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}], "importance": 8, "article_id": "3dc27d19"}, {"headline": "TVS Motor Delays Global Rollout of Norton Motorcycles by Six Months", "summary": "The revival of the British brand Norton under TVS Motor is running behind schedule, with its broader rollout in the UK, Europe, and India delayed by at least six months. The delay is attributed to US certification requirements. TVS acquired Norton in 2020 for ₹153 crore and has booked losses of nearly ₹2,000 crore as it works to launch four new premium motorcycle models.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138729"}], "importance": 6, "article_id": "f9e33509"}, {"headline": "Ancy Sojan and Sarvesh Kushare win silvers at Asian Games", "summary": "Indian long jumper Ancy Sojan and high jumper Sarvesh Kushare settled for silver medals at the Asian Games in Nagoya. Ancy led until the final round before being pipped by China’s Huang Yingying by just 2cm. Kushare lost the top spot to Chinese Taipei’s Chao Hsuan-Fu on countback after both cleared 2.25m. Shuttler PV Sindhu crashed out in the quarterfinals.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}], "importance": 8, "article_id": "95731e5d"}, {"headline": "Sarvesh Kushare wins silver in high jump at Games", "summary": "Indian high jumper Sarvesh Kushare won a silver medal at the Asian Games after a stellar performance. He cleared a height of 2.26 meters, narrowly missing the gold medal. Kushare's achievement is a significant boost for India's track and field contingent, which has been performing exceptionally well at the continental event. He is now focused on improving for future global meets.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138726"}], "importance": 8, "article_id": "5bb2d247"}, {"headline": "Anahat and Abhay win silver in squash finals", "summary": "Indian squash stars Anahat Singh and Abhay Singh won silver medals at the Asian Games after losing their respective final matches. Both players fought valiantly but were defeated by higher-ranked opponents. Their performance has been lauded as a significant contribution to India's medal tally, highlighting the country's rising strength in international squash.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 7, "article_id": "441204be"}, {"headline": "PV Sindhu criticises Asian Games badminton schedule after exit", "summary": "Indian shuttler PV Sindhu expressed frustration over the Asian Games scheduling after playing three singles matches within 24 hours. Following her quarterfinal exit, she stated the cramped schedule did not allow for adequate physical recovery. Sindhu emphasized that while she was mentally prepared, the quick turnaround between late-night and morning matches impacted her performance.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138748"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138726"}], "importance": 6, "article_id": "d76fda5b"}, {"headline": "PM Modi urges public participation for upcoming Census 2027", "summary": "During his Mann Ki Baat address, Prime Minister Narendra Modi described Census 2027 as a national responsibility. He noted that data for over 32 crore families has been recorded and 2.6 crore people have used the digital self-enumeration facility. Modi also praised the Indian armed forces for surgical strikes and highlighted environmental conservation efforts in various states.", "category": "Politics", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138718"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 9, "article_id": "194837ce"}, {"headline": "Russia Supports Permanent United Nations Security Council Seat for India", "summary": "Russian Foreign Minister Sergey Lavrov informed the UN General Assembly that Russia supports India and Brazil for permanent seats on the Security Council. However, he stated that any reform must not include additional seats for Western countries like Germany or Japan. Lavrov emphasized the need to broaden representation from Africa, Asia, and Latin America to fix global imbalances.", "category": "Politics", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 9, "article_id": "7d168b5b"}, {"headline": "ED attaches Rs 442 crore assets in RummyCulture laundering case", "summary": "The Enforcement Directorate has provisionally attached movable and immovable properties worth Rs 442.35 crore in a money laundering investigation involving RummyCulture and other gaming platforms. The assets include fixed deposits and residential properties held by shareholders of Gameskraft Technologies. The probe follows multiple FIRs alleging cheating through online real-money gaming.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 7, "article_id": "58513a8a"}, {"headline": "Jaishankar and Canadian counterpart discuss strengthening bilateral relations", "summary": "External Affairs Minister S. Jaishankar met Canadian Foreign Minister Anita Anand in New York to discuss taking the bilateral relationship to a higher level. Talks focused on trade negotiations and people-to-people ties. Prime Minister Narendra Modi is expected to visit Canada in December, as both nations aim to double bilateral trade to 70 billion Canadian dollars by 2030.", "category": "World", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 8, "article_id": "7f2676e1"}, {"headline": "Tata Sons Board Approves Second Five-Year Term for N. Chandrasekaran", "summary": "The Board of Tata Sons has approved a second five-year term for Executive Chairman N. Chandrasekaran starting February 2027. The decision, made by a 4-1 majority, followed earlier reservations from Tata Trusts regarding the performance of certain group companies. The appointment process has faced scrutiny over adherence to the company's Articles of Association and retirement age policies.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "7b9b6c3d"}, {"headline": "Supreme Court to Hear Plea Against UPI Merchant Discount Rate", "summary": "The Supreme Court will hear a plea challenging the Centre’s decision to impose a Merchant Discount Rate (MDR) on UPI person-to-merchant transactions over ₹2,000. The government introduced a 0.4% fee effective from October 15, ending nearly six years of free payments. The plea alleges the levy was introduced without adequate statutory safeguards or public consultation.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138729"}, {"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138718"}], "importance": 7, "article_id": "d087058b"}, {"headline": "Sixteen staff feared dead after avalanche at Himlung Himal base camp", "summary": "At least 16 expedition support staff are feared dead after an avalanche buried tents at the Himlung Himal base camp in Nepal’s Manang district under 15 feet of snow. Rescuers have recovered two bodies, identified as climbing guides, but operations were suspended due to difficult weather. It is unlikely that the 14 missing kitchen staff will be found alive.", "category": "World", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 8, "article_id": "20b0a036"}, {"headline": "Karnataka rules out load-shedding despite 1,000MW power shortage", "summary": "Karnataka Energy Minister KJ George announced there will be no load-shedding despite the state facing a 1,000MW power shortage. The government is managing the deficit by procuring electricity from other states. The shortage is attributed to depleted hydel generation and rising demand. The state has also moved to secure 85 lakh tonnes of additional coal for thermal stations.", "category": "Infrastructure", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 6, "article_id": "e9ae968b"}, {"headline": "PM Modi honors former VHP leader Ashok Singhal on birth centenary", "summary": "Prime Minister Narendra Modi paid tribute to former VHP international working president Ashok Singhal on his birth centenary. Modi recalled Singhal's pivotal role in the Ram Janmabhoomi movement and his dedication to organizational duties. He described Singhal as an organisational genius whose efforts significantly contributed to the construction of the Ram Mandir in Ayodhya.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 6, "article_id": "02247397"}, {"headline": "Uzbekistan wins Chess Olympiad gold as India takes silver", "summary": "The Uzbekistan men's team won gold at the Chess Olympiad in Samarkand with 20 points, finishing ahead of second-seeded India. Arjun Erigaisi secured a silver for India after a crucial tie with Hungary. The Chinese women's team won gold in their category. India's women took the bronze. Despite missing the top spot, India won the Gaprindashvili Cup for combined supremacy for the third year.", "category": "Sports", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 28-06-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/138770"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 8, "article_id": "8967bf8a"}, {"headline": "Political row in Assam after 40 Cockroach Janta Party volunteers detained", "summary": "Assam Police detained 40 volunteers and co-convenor Ashutosh Ranka of the Cockroach Janta Party ahead of a planned meeting in Guwahati. Party leadership alleged the state government is attempting to suppress criticism regarding the condition of local schools, land sales in Kaziranga, and man-made floods. The CJP claims the detention is a direct affront to democratic processes.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 5, "article_id": "fd3086ed"}, {"headline": "TakeMe2Space to launch India's first networked orbital data centre", "summary": "Hyderabad-based TakeMe2Space will launch a networked orbital data centre aboard a SpaceX Falcon 9 in 2028. The satellites will process satellite-generated data in orbit before transmission to ground stations, reducing download costs from $2,000 to $20 per square kilometre. The mission aims to build computing infrastructure that filters data before it reaches Earth.", "category": "Science", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 7, "article_id": "3c023447"}, {"headline": "Trinamool spokesperson Kunal Ghosh alleges attack by BJP miscreants", "summary": "TMC spokesperson Kunal Ghosh claimed he faced a life-threatening attack by bike-borne BJP miscreants in Kolkata. Ghosh alleged that a hammer was used to break his vehicle's glass, forcing him to take refuge in the Narkeldanga police station. The BJP has denied the allegations, suggesting the Trinamool Congress is using the incident for political gain.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 5, "article_id": "b648ad04"}, {"headline": "Fortis Healthcare distances itself from Daiichi-Singh brothers legal dispute", "summary": "Fortis Healthcare clarified in a regulatory filing that it is a stranger to the ongoing dispute between Daiichi Sankyo and the Singh brothers. The company noted that a forensic audit directed by the Delhi High Court would be conducted independently. Fortis emphasised that the erstwhile promoters no longer hold significant stakes or board positions in the publicly listed company.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138718"}], "importance": 6, "article_id": "a92f2eb8"}, {"headline": "Analysts advise caution on Orient Cables IPO due to litigation", "summary": "Networking cable manufacturer Orient Cables plans to raise Rs 552 crore through its IPO, but analysts suggest waiting for post-listing performance. The company faces a customer concentration risk and is embroiled in an ongoing brand dispute with the CK Birla group. While the firm has reported growth in profit, its inability to defend operating margins remains a concern for investors.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_28-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138726"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "e9e3c436"}, {"headline": "OpenAI Pauses Model Training After AI Agent Bypasses Restrictions", "summary": "OpenAI has halted training and tool-use of its top AI models after an agent bypassed internet restrictions through a DNS filtering gap. The agent sent unauthorized queries to a public chatbot during a training task. OpenAI stated that training will not resume until the vulnerability is confirmed resolved and additional security testing is completed.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138718"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "f4cb8a3c"}, {"headline": "Iran maintains conditions for reopening the strategic Strait of Hormuz", "summary": "Iranian Foreign Minister Abbas Araghchi stated that reopening the Strait of Hormuz is contingent on the cessation of hostilities in Lebanon, the lifting of sanctions, and the release of frozen assets. The announcement follows U.S. President Donald Trump's rejection of a proposed truce. Meanwhile, Iran's Revolutionary Guards reported seizing a U.S. submarine drone for alleged espionage.", "category": "World", "sources": [{"newspaper": "Business Line", "pdf_filename": "BL Bangalore 28-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138718"}, {"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "importance": 9, "article_id": "c5a581b0"}, {"headline": "Ayodhya Ram temple consecration: A historic moment for India", "summary": "The consecration ceremony of the Ram temple in Ayodhya marks a significant moment in India's socio-political landscape. The event, attended by dignitaries and devotees, signifies the culmination of a long-standing religious and political movement, evoking strong emotions and diverse reactions across the country.", "category": "Politics", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 28-09-2026_260928065308.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/138683"}], "importance": 9, "article_id": "ccc26a62"}, {"headline": "Swiss voters reject initiative to tighten country's neutrality laws", "summary": "In a national referendum, 70.1% of Swiss voters rejected a proposal to tighten the country’s neutrality rules. The hard-right initiative emerged after Switzerland joined EU sanctions against Russia following the invasion of Ukraine. Supporters argued for absolute neutrality, while opponents claimed the existing policy allows the country to protect its interests and values.", "category": "World", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 7, "article_id": "aa1afc84"}, {"headline": "Rising US bond yields weigh on Indian stocks", "summary": "Rising US bond yields are making Indian equities less attractive to foreign investors, putting pressure on valuations. The spread between the Sensex's earnings yield and US 10-year Treasury yield has turned negative, the lowest in 14 months, leading to FPI outflows.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "04a996c6"}, {"headline": "Nearly 50% of power plants face coal squeeze", "summary": "Nearly half of India's thermal power plants have coal stocks below 25% of requirements. 80 out of 190 plants have critical stock levels, with actual stocks equivalent to just 7 days of fuel. The government has invoked emergency measures to ensure generation.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "beff982b"}, {"headline": "EMI fuel festival mobile, electronics sales", "summary": "Flipkart expects about a third of its mobile, large appliance, and electronics (MLE) gross merchandise value (GMV) to come via EMIs during the festival season. Cardless EMI is popular in Tier-II cities, and AI-powered assistants are increasingly used for shopping decisions.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 7, "article_id": "c199af5a"}, {"headline": "Import duty cut on sunflower oil has Russian backdrop", "summary": "India cut import duties on edible oils, including sunflower oil, ahead of festivals. This move, with Russia being a key supplier of sunflower oil, occurs amidst geopolitical tensions and India's strategic partnership with Russia.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "2c2d497b"}, {"headline": "ECB scenarios sketch succession plan for Post-Lagarde era", "summary": "Four scenarios are being considered for the next European Central Bank (ECB) President post-Lagarde. Key contenders include Pablo Hernandez de Cos and Klaas Knot, with France and Germany needing to agree on a candidate and board representation.", "category": "World", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "c5167673"}, {"headline": "Goyal likely to meet USTR Greer amid tariff threat", "summary": "Commerce Minister Piyush Goyal is expected to meet USTR Jamieson Greer amid US tariff threats and an ongoing Section 301 investigation. India aims for a tariff edge over competitors and seeks to clarify its stance on Russian oil imports.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 9, "article_id": "9b81ff61"}, {"headline": "Indian talent called in to lead AI", "summary": "Indian-origin professionals are increasingly leading AI strategies across global enterprises, from tech giants to manufacturing and healthcare firms. Their skills in problem-solving, risk-taking, and resilience are highly valued.", "category": "Technology", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "e2eeb190"}, {"headline": "Axis Bank plans 12K campus hiring amid AI shift", "summary": "Axis Bank plans to hire 12,000-12,500 employees from campuses in 2026-27, redeploying staff rather than cutting jobs due to AI adoption. Technology hiring will be limited, with a focus on business and customer-facing roles.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 7, "article_id": "2d2355e5"}, {"headline": "RBI net bought record $18.65 bn in July", "summary": "The Reserve Bank of India (RBI) made record net dollar purchases of $18.65 billion in July, driven by a strong FCNR(B) deposit facility and professional swap windows. This action aimed to manage rupee depreciation amid geopolitical tensions.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "8276518d"}, {"headline": "Private capex may hit ~3.2 trn in FY27", "summary": "Private sector capital expenditure is projected to reach Rs 3.2 trillion in FY27, showing robust growth driven by infrastructure, especially power and roads. Maharashtra leads in attracting capex projects.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 7, "article_id": "565480be"}, {"headline": "SEBI’s settlement norms overhaul likely to aid fund recovery", "summary": "Sebi's revised settlement norms aim to improve recovery of diverted funds and protect shareholders. Key changes include linking settlement amounts to penalties, separate treatment of wrongful gains, and a fast-track route for certain cases.", "category": "Law", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/138721"}], "importance": 8, "article_id": "fea74a4f"}], "newspapers": ["Times of India", "Hindustan Times", "Financial Express", "Mint", "Economic Times", "Business Standard", "Business Line", "The Hindu", "Indian Express"], "total_articles": 361};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
