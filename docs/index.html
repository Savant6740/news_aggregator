: 1, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "ec7dfb6d"}, {"headline": "Twenty Eight Karnataka Residents Reported Stranded or Missing in Nepal", "summary": "Following floods at the Nepal-Tibet border, 28 people from Karnataka are stranded or missing. Most are from Bengaluru, with others from Mysuru, Udupi, and Vijayanagara. Four have been confirmed safe while search operations continue for the remaining 24. The State government is coordinating with the Ministry of External Affairs for their safe return.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "32324b3c"}, {"headline": "Bengaluru Bans Two Wheelers on Major Elevated Corridors From September", "summary": "Bengaluru Traffic Police will ban two-wheelers on the Airport Road (KIA) and Electronics City elevated corridors starting September 4 and September 11, respectively. The move follows a review of accidents and aims to improve safety and traffic flow. Restrictions will also be placed on other vehicles across five city flyovers to manage congestion.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "1b2d8c39"}, {"headline": "JD(S) Decides to Boycott BJP Ballari Padayatra Over Lack of Consultation", "summary": "NDA partner JD(S) will not participate in the BJP's padayatra from Lingasugur to Ballari. Union Minister H.D. Kumaraswamy stated the party was not consulted before dates were announced unilaterally. While the BJP aimed to protest government policies, the JD(S) leadership expressed reservations about the event being treated as a solo BJP affair.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "f0859693"}, {"headline": "Basavaraj Horatti Claims Chief Minister Forced His Resignation", "summary": "BJP MLC Basavaraj Horatti alleged that Chief Minister Siddaramaiah and Deputy CM D.K. Shivakumar pressured him to resign from the post of Chairman of the Legislative Council. Horatti described the process as humiliating and stated he stepped down out of pain. The claims add to the ongoing political tension between the BJP and the ruling Congress in Karnataka.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "45f0330d"}, {"headline": "Greater Bengaluru Authority Faces Staff Shortages One Year After Restructuring", "summary": "A year after the BBMP was replaced by five corporations under the GBA, citizens report a lack of accountability and visibility of officials on the ground. Vacancy rates are at 40%, forcing existing staff to handle multiple roles. New recruitment rules are currently awaiting government approval to address the micro-level governance issues envisioned in the 2024 Act.", "category": "Infrastructure", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "2b8b03d2"}, {"headline": "Prime Minister Praises Bengaluru Street Vendor in Mann Ki Baat", "summary": "PM Narendra Modi highlighted the success story of T.S. Ningamma, a Bengaluru street vendor, during his monthly radio programme. Ningamma used financial support from the PM SVANidhi scheme to expand her food business. The PM cited her as a living example of women's empowerment and how micro-loans can improve family financial conditions and provide education.", "category": "Economy", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "351be989"}, {"headline": "Citizens and BJP Leaders Protest Park Land Diversion for Tunnel Road", "summary": "A large rally was held at Lalbagh against amendments to the Parks Preservation Act, which allows 5% of park land to be used for the city's tunnel road project. Led by activist A.N. Yellappa Reddy and BJP MPs, protesters demanded the government scrap the bill. They argued that the project bypasses environmental due process and threatens the city's limited green space.", "category": "Environment", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "cd197729"}, {"headline": "Bescom to Hold Awareness Meetings for HT Mithra Mobile Application", "summary": "Despite its utility for raising power and billing complaints, industrialists report a lack of awareness regarding Bescom's HT Mithra app. HT consumers contribute 30% of Bescom's revenue despite making up only 0.15% of the population. The app features a six-hour countdown for officials to resolve issues, with escalation protocols for unresolved grievances.", "category": "Technology", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "b06e71fa"}, {"headline": "KPTCL to Replace Mineral Oil with Ester Oil in Transformers", "summary": "Karnataka Power Transmission Corporation plans to swap mineral oil for biodegradable ester oil in high-capacity transformers statewide. Though more expensive at ₹275 per litre, ester oil acts as a better coolant and has a higher flash point, reducing fire risks. The utility has already upgraded 45 transformers to improve efficiency and extend equipment lifespan.", "category": "Technology", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "6df0d90d"}, {"headline": "Special Voter Revision Campaign Marred by Locked Polling Stations", "summary": "The Election Commission's special intensive revision campaign in Bengaluru faced setbacks as many designated polling stations remained locked on Sunday. Voters looking to correct details or submit forms found no Booth Level Officers present at multiple sites in Shivajinagar and Hebbal. The CEO website also faced criticism for persistent errors in draft rolls.", "category": "Politics", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "39d2e0dd"}, {"headline": "Rare Blue Violet Flowers Bloom Along Kudremukh Trekking Trails", "summary": "Neelakurinji-like flowers have bloomed in abundance in the Kudremukh region of Chikkamagaluru, attracting nature enthusiasts. The Tourism Department has issued instructions to visitors not to pluck the flowers or litter, emphasizing eco-friendly travel. The phenomenon is expected to boost local tourism, as similar blooms in 2022 attracted large crowds.", "category": "Environment", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "0786de69"}, {"headline": "Mysuru Palace Illuminated Pink for Gruha Lakshmi Third Anniversary", "summary": "To mark three years of the Gruha Lakshmi scheme, the Mysuru palace was illuminated in pink. The flagship programme provides ₹2,000 monthly to 1.2 crore women heads of households. Over ₹76,500 crore has been credited to beneficiaries so far. The event aimed to symbolize women’s empowerment and the scheme's role in supporting rural families.", "category": "Politics", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "22276c5c"}, {"headline": "Vande Bharat Express Mangaluru Service Set for Launch After Trials", "summary": "The South Western Railway is awaiting a 16-car rake fitted with Automatic Emergency Brakes to start Vande Bharat service between Bengaluru and Mangaluru. Successful trials were recently conducted on the steep Sakleshpur-Subrahmanya Road ghat section. The service is expected to reduce travel time between the two cities to roughly eight hours.", "category": "Infrastructure", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "a2e3b235"}, {"headline": "Benaka Theatre Repertory to Celebrate B.V. Karanth Birth Anniversary", "summary": "Bengaluru-based theatre group Benaka will host 'Karantha Maasa' in September to mark the 98th birth anniversary of founder B.V. Karanth. The celebration includes a three-show tour to Dharwad and a festival at Kalagrama. Programmes will feature workshops exploring AI in theatre and performances of classic plays like 'Hayavadana' and 'Sattavara Neralu'.", "category": "Culture", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "820225a8"}, {"headline": "Software Engineer Dies in Alleged PG Building Jump in Whitefield", "summary": "A 23-year-old woman working for a private company died after allegedly jumping from the seventh floor of a PG facility in Bengaluru. A 30-year-old man who also jumped survived with grievous injuries. Police are investigating their relationship and the circumstances leading to the incident. Helplines were provided for individuals in distress.", "category": "Health", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "956d007d"}, {"headline": "Minister Orders Action Against GBA Officials Over Non Functional Streetlights", "summary": "Greater Bengaluru Development Minister Krishna Byre Gowda directed disciplinary action against GBA officials after an inspection found 140 of 222 streetlights were non-functional between Hudson Circle and Chalukya Circle. Despite previous meetings on maintenance, lapses persisted on this high-traffic stretch connecting to the Kempegowda Bus Station.", "category": "Infrastructure", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "f4a190b7"}, {"headline": "H.D. Kumaraswamy and Priyank Kharge Clash Over KPSC Appointments", "summary": "Union Minister H.D. Kumaraswamy accused the state government of ignoring red flags in KPSC recruitment for rural drinking water schemes. Home Minister Priyank Kharge responded by questioning Kumaraswamy's past interference in selection processes and his visits to jailed officials. The exchange highlights ongoing scrutiny of the state's public service commission.", "category": "Politics", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "9e5107b4"}, {"headline": "Youth Congress Protests Against Amit Shah Over NEET Exam Irregularities", "summary": "Youth Congress workers staged a protest outside the BJP office in Bengaluru, demanding Union Home Minister Amit Shah's resignation. The demonstration was sparked by the alleged use of force against students protesting NEET-PG paper leaks in Delhi. Several protesters were taken into preventive custody as they attempted to breach police barricades.", "category": "Politics", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "a98a08b1"}, {"headline": "Srikanta Named Heaviest Elephant for Mysuru Dasara Procession", "summary": "Tusker Srikanta from the Mathigodu camp weighed in at 5,790 kg, making him the heaviest among the nine jumbos selected for this year's Dasara festival. Other prominent elephants include Ekalavya and Dhananjaya. The Forest Department is monitoring the animals' health and weight as they begin routine training for the Jamboo Savari.", "category": "Culture", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "3eac88be"}, {"headline": "Twenty One LIC Agents Return Safely From Flood Hit Nepal", "summary": "A team of 21 LIC agents and officers from Nippani returned safely to India after being caught in the Nepal floods. The group was on a pilgrimage to Muktinath when the disaster struck. They avoided Kathmandu after learning of the flooding risks and transited through Delhi. All members are expected back in Karnataka by Monday.", "category": "India", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "0c235c75"}, {"headline": "MP Yaduveer Wadiyar Opposes Kambala During Mysuru Dasara Festivities", "summary": "Mysuru-Kodagu MP Yaduveer Wadiyar has extended support to activists opposing the government's proposal to hold Kambala (buffalo racing) during Dasara. A memorandum was submitted by the Joint Action Committee urging the government to drop the plan. Wadiyar confirmed he has already officially conveyed his opposition to the state government.", "category": "Culture", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "bf77b76a"}, {"headline": "CPI and CPI(M) Seek Reconciliation After Public Dispute Over Posts", "summary": "Relations between Kerala's Left coalition partners showed signs of improvement after a rift over the Deputy Leader of Opposition post. CPI leader Rajaji Mathew Thomas emphasized the need for collective leadership and responsibility. Veteran CPI(M) leader A.K. Balan described the two parties as the 'heart and brain' of the LDF, dismissing suggestions of a permanent split.", "category": "Politics", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "158f811f"}, {"headline": "Kerala High Court Rules Supplementary Exams Count Towards MBBS Attempts", "summary": "The Kerala High Court held that both regular and supplementary examinations count toward the 'four attempts within four years' limit for clearing the First Professional MBBS Degree. The ruling dismissed a petition from a student seeking a mercy chance, stating that academic regulations concerning medical competence affect public health and should not be casually interfered with.", "category": "Law", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "c87372b4"}, {"headline": "AITUC Warns of Protests Against Privatisation of Visakhapatnam Steel Plant", "summary": "The All India Trade Union Congress (AITUC) demanded the merger of Visakhapatnam Steel Plant (VSP) with SAIL to ensure its revival. Union leaders warned of intensified protests if the Centre continues with privatization plans. They called for a comprehensive revival package for the plant, which has been the site of a long-running protest by workers and local residents.", "category": "Economy", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "a7de3e2e"}, {"headline": "India Aims to Conclude Trade Agreement With Chile This Year", "summary": "Commerce Secretary Rajesh Agrawal met with Chilean officials to advance negotiations on a Comprehensive Economic Partnership Agreement. India aims to finalize the deal this year to boost exports in healthcare, energy, and agriculture. Bilateral trade currently stands at approximately $5 billion, with significant potential for growth in critical minerals and engineering.", "category": "Business", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "974b3cec"}, {"headline": "Two Police Officials and Suspect Injured in Patna Encounter", "summary": "A shootout between Patna police and criminals involved in illegal sand mining extortion left three people injured. The clash occurred along the Son river when suspects opened fire on a special police team. Authorities recovered illegal weapons, including a rifle and country-made pistols. The injured criminal is being treated under custody at Patna Medical College.", "category": "India", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "3f491054"}, {"headline": "Manipur Chief Minister Supports NRC but Opposes Public Shutdowns", "summary": "Manipur CM Yumnam Khemchand Singh voiced support for updating the National Register of Citizens but warned that shutdowns and blockades are not the appropriate methods for agitation. Meitei and Naga groups are demanding NRC implementation before the next Census. Singh urged democratic forms of protest and warned of stringent action against those attempting to create disorder.", "category": "Politics", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "558c9306"}, {"headline": "Meghalaya Police Kill Four Inter State Gang Members in Shootout", "summary": "Four armed men, allegedly part of a gang involved in the shooting of an Assam businessman, were killed in an encounter with Meghalaya police in East Garo Hills. The shootout occurred early Sunday morning at a checkpoint. Police stated the personnel retaliated after being fired upon. Investigations are ongoing into the group's criminal links across state lines.", "category": "India", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "905cb5de"}, {"headline": "BJP National President Nitin Nabin Holds Gen Z Outreach Session", "summary": "BJP chief Nitin Nabin chaired a brainstorming session with 45 young leaders to improve the party's engagement with Gen Z. Suggestions included abandoning the 'Gen Z' label for the broader term 'youth' and initiating simultaneous outreach to older voters. The party plans to create differentiated strategies for urban and rural youngsters to address diverse aspirations.", "category": "Politics", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "4e1fe3a9"}, {"headline": "Bihar Congress Leaders Threaten Protest at Party Headquarters in Delhi", "summary": "Discontented Bihar Congress workers have written to Mallikarjun Kharge demanding the removal of state in-charge Krishna Allavaru and president Rajesh Kumar. They plan a sit-in on September 8, alleging arbitrary ticket distribution and poor performance in the 2025 Assembly election. The group claims dedicated workers were sidelined in favor of outsiders.", "category": "Politics", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "fc9f14bc"}, {"headline": "OBC Conference Demands Unique Caste Codes in National Census", "summary": "A national OBC conference has called for mandatory caste enumeration and unique codes for every caste in the upcoming Census. Speakers argued that a Census without these measures is a waste of public funds and fails to provide scientifically sound data. They warned of a nationwide movement if separate columns for OBCs are not included alongside SCs and STs.", "category": "India", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "e4f5d92e"}, {"headline": "Congress Questions Delay in Formal Prorogation of Parliament Session", "summary": "Congress leader Jairam Ramesh expressed suspicion over the 17-day delay in proroguing Parliament after the Monsoon Session. He alleged the government might be playing 'mind games' to keep the session alive for a possible Special Session on delimitation. The party reiterated its demand to freeze the current strength of the Lok Sabha at 543 seats for the next 15 years.", "category": "Politics", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "1e422117"}, {"headline": "Tejashwi Yadav Dares Union Ministers to Contest From Unreserved Seats", "summary": "RJD leader Tejashwi Yadav challenged Union Ministers Chirag Paswan and Jitan Ram Manjhi to fight elections from unreserved seats. The comment follows the ministers' demands for reservation sub-categorization and creamy layer reviews for SCs and STs. Yadav accused them of acting on RSS instructions to divert attention from the constitutional agenda of reservation.", "category": "Politics", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "db1f554e"}, {"headline": "Four Dead After Consuming Spurious Liquor in Dry Bihar", "summary": "Four people died in Patna's Bedhna village after allegedly consuming illicit alcohol. Despite a total ban on sale and consumption in the state since 2016, reports of spurious liquor deaths continue. Bodies were sent for post-mortem to confirm the cause of death. Families claim the victims fell ill shortly after drinking together in a private room.", "category": "Health", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "09b870ee"}, {"headline": "Study Finds Early Warning Signals Hours Before Solar Flare Eruptions", "summary": "Scientists from ISRO and Manipal Academy of Higher Education have identified short-lived brightenings in the sun's atmosphere that precede solar flares. Using data from the Aditya-L1 mission, the study suggests these 'transient events' progressively destabilize magnetic fields. The findings could lead to more reliable space weather forecasting and better satellite protection.", "category": "Science", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "3cd3728c"}, {"headline": "Black Flags Waved at Maharashtra Deputy CM Over Maratha Quota", "summary": "Protesters waved black flags at Deputy CM Eknath Shinde during a Shiv Sena event in Parbhani. The protest was linked to the hunger strike by Manoj Jarange Patil, who is demanding Kunbi caste certificates for the Maratha community. Shinde emphasized that his government has already formed a committee and provided 10% reservation to address the community's concerns.", "category": "Politics", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "7bc27a14"}, {"headline": "Power Supply Failure Disrupts NEET PG Exam in Jaipur Centres", "summary": "Internal power supply issues at two SITAPURA centres in Jaipur led to the disruption of the NEET-PG 2026 examination for over 2,400 candidates. The NBEMS has formed a three-member committee to investigate the failure, which was attributed to the exam agency TCS. A re-examination for affected candidates is scheduled for September 5.", "category": "Education", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "0205f53e"}, {"headline": "Mojtaba Khamenei Calls for Muslim Unity Against US and Israel", "summary": "In a written message marking the Prophet’s birthday, Iran's Supreme Leader Mojtaba Khamenei urged Islamic nations to identify their 'real enemy.' He emphasized that unity and cooperation are the only solutions to the region's problems. Khamenei also advised Iranian citizens to maintain national cohesion and avoid allowing internal differences to serve enemy interests.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "9e660d57"}, {"headline": "North Korea Dismisses Defence Minister in Major Military Reshuffle", "summary": "North Korea has dismissed No Kwang Chol from his post as Defence Minister as part of a structural reorganization of the nation's military leadership. No has been demoted within the ruling party to a vice-director role in the Munitions Industry Department. The move is seen as part of Kim Jong Un's efforts to consolidate military control and streamline state policies.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "78675cc1"}, {"headline": "Rival Libyan Groups Sign UN Backed Election Agreement in Tripoli", "summary": "Libya’s opposing political factions signed a pact aimed at holding presidential and legislative elections within 24 months. The agreement, backed by the UN, calls for a unified executive authority and national institutions to oversee the vote. The deal represents a significant diplomatic step toward resolving years of division and delay in the North African nation.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "7ea8ab41"}, {"headline": "Russia Prepares Massive Retaliatory Strikes on Ukraine Energy Sector", "summary": "Russia's Defence Ministry announced preparations for large-scale attacks on Ukraine's energy infrastructure. The ministry claimed the strikes are a response to Kyiv's ongoing attacks on Russian oil and energy complexes. Previous winter strikes by Moscow devastated Ukraine's power grid, plunging millions into darkness, and the latest warning signals a renewed escalation.", "category": "World", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "67ac9b6e"}, {"headline": "Icelandic Voters Reject Proposal to Restart EU Accession Negotiations", "summary": "In a national referendum, 52.8% of Icelanders voted against resuming talks to join the European Union. The results reflected deep concerns over losing control of national fisheries. While support was high in the capital, rural areas largely rejected the move. The outcome comes amid broader debates over geopolitical stability and the impact of US foreign policy in the region.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "c5c458ec"}, {"headline": "Jessica Pegula Overcomes Nerves to Win US Open Opener", "summary": "World No. 3 Jessica Pegula secured a 6-3, 6-2 victory over Elena-Gabriela Ruse to advance at Arthur Ashe Stadium. Pegula admitted to being nervous during the first round but managed to save the only break point she faced. The American, seeking her first Grand Slam title, efficiently converted key break opportunities to finish the match in straight sets.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "95b76442"}, {"headline": "Bruno Fernandes Hat Trick Leads Manchester United to Victory", "summary": "Manchester United captain Bruno Fernandes scored three goals in a 5-2 win over Ipswich Town. The victory helped United bounce back from a previous defeat. Elsewhere in the Premier League, Chelsea beat Brighton 4-3 to maintain Xabi Alonso’s perfect start. In La Liga, Real Madrid secured a 4-0 win against Malaga with goals from Bellingham and Mbappe.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "d662865b"}, {"headline": "Vidwath Kaverappa Takes Four Wickets as South Zone Dominates Duleep Trophy", "summary": "Vidwath Kaverappa’s four-wicket burst helped South Zone bowl out North Zone for 195 on the opening day of the Duleep Trophy semifinal. Qamran Iqbal top-scored for North with 76 despite being dropped twice. South Zone ended the day at 40 for two. Kaverappa stated he used his previous injury break to mature as a bowler and improve his strength.", "category": "Sports", "page": 18, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "70ef1978"}, {"headline": "Magnetar Observations Provide Evidence for Vacuum Birefringence in Space", "summary": "Astronomers using NASA's IXPE satellite detected highly polarized X-rays from magnetar 1E 1547.0-5408. The finding suggests that strong magnetic fields make empty space behave like a crystal, splitting light paths. This supports a 1930s quantum physics prediction by Heisenberg and Euler, showing that the vacuum of space is an active medium.", "category": "Science", "page": 20, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "72c50f98"}, {"headline": "Supreme Court to Re-examine OBC Creamy Layer Income Test Application", "summary": "The Supreme Court will consider the Centre's plea for clarification on a March 11 ruling regarding the OBC creamy layer. The government argues that retrospective implementation of excluding parent's salary from the income test is 'extremely difficult' and could cause a cascading effect on settled services. The issue involves thousands of civil service candidates since 2012.", "category": "Law", "page": 21, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "2cb96914"}, {"headline": "Meta Agrees to Eighteen Billion Dollar Settlement Over Teen Social Media Safety", "summary": "Meta has reached a massive settlement with US states over allegations that Facebook and Instagram are harmful to children. The company will introduce stricter controls, including a default two-hour daily time limit and a 'School Mode' that mutes notifications. The deal also requires rival platforms to adopt similar standards to unlock the full settlement terms.", "category": "Technology", "page": 22, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135698", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Bangalore 31-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/135698"}], "article_id": "a49d9909"}, {"headline": "Private bank CEO exits put board-management relations under lens", "summary": "Strategic differences between boards and management at private-sector banks are being cited as reasons for several CEOs opting not to seek reappointment. Experts note a growing gap between traditional leadership models and evolving board expectations regarding technology and growth strategy. Recent exits include leaders at HDFC Bank, Kotak Mahindra Bank, and South Indian Bank.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "57459d3f"}, {"headline": "Active mutual funds reduce HDFC Bank holdings to multi-year low", "summary": "Active fund managers have significantly reduced their exposure to HDFC Bank, with its share in active schemes hitting multi-year lows. Only 22% of large-cap schemes are currently overweight on the stock compared to its index weight. The retreat follows weak stock performance, soft margins, and governance concerns, though overall mutual fund ownership in the lender remains above 30%.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "2fe06335"}, {"headline": "India to supply extra power to Nepal following flash floods", "summary": "India is set to provide additional electricity to Nepal after flash floods disrupted 550 MW of the neighboring country's power capacity. Nepal has sought advance import approvals for September to manage generation deficits. Indian officials stated the disruption in cross-border flows will not impact India's domestic supply, as national grid reserves are capable of absorbing the shortfall.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "b3f9ea57"}, {"headline": "Rural commercial vehicle sales outpace urban growth for fourth month", "summary": "Rural retail sales for commercial vehicles outgrew urban sales for the fourth consecutive month between April and July 2026. In July, rural growth reached 29.37% compared to 19.36% in urban areas. Experts attribute the trend to the structural diversification of the rural economy and increased consumption driven by e-commerce logistics and infrastructure activity.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "99716e2c"}, {"headline": "Deepak Nayyar argues 1991 reforms failed to foster full industrialisation", "summary": "Former Chief Economic Advisor Deepak Nayyar states that while 1991 reforms managed the immediate fiscal crisis, they lacked a strategic industrial policy, leading to long-term de-industrialisation. He notes that India's manufacturing share in global value-added remains stagnant compared to China. Nayyar emphasizes that the demographic dividend depends entirely on education and R&D capability.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "7e0d76ce"}, {"headline": "Hindusthan National Glass serves default notice to Bira 91 maker", "summary": "Hindusthan National Glass and Industries (HNGIL) has served a default notice to B9 Beverages, the maker of Bira 91 beer, over unpaid dues of Rs 11.77 crore. HNGIL plans to initiate insolvency proceedings under the IBC if the debt for manufactured glass bottles is not settled. The notice is a mandatory step before filing a formal application with the NCLT.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "18e9b15a"}, {"headline": "Ather Energy expects demand to outstrip production for four quarters", "summary": "Electric two-wheeler maker Ather Energy anticipates that demand for its scooters will exceed production capacity for the next year. CEO Tarun Mehta stated that current monthly demand is over 50,000 units, while supply capacity is capped at 35,000. The company plans to ramp up output to 77,000 units once its new Aurangabad facility becomes fully operational by early next year.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "191dd570"}, {"headline": "TVS Motor appoints Peyman Kargar as CEO; Radhakrishnan to retire", "summary": "TVS Motor Company has named Frenchman Peyman Kargar as its next CEO, effective January 27, 2027. He will succeed K.N. Radhakrishnan, who is stepping down after 18 years in the role. Radhakrishnan is credited with transforming TVS into a global automotive player, overseeing an 11-fold increase in revenue and the company's expansion into over 90 countries.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "10d40966"}, {"headline": "Sarvam AI cofounder Vivek Raghavan named in TIME 100 AI", "summary": "Vivek Raghavan, cofounder of Indian startup Sarvam AI, has been featured in TIME Magazine's list of the 100 most influential leaders in artificial intelligence. Sarvam AI is currently developing India's first sovereign large language model (LLM) ecosystem. The company is backed by HCLTech and Nvidia and is valued at approximately $1.5 billion.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "2631398b"}, {"headline": "Cyient shifts strategy toward long-term lifecycle engineering deals", "summary": "Engineering firm Cyient is overhauling its strategy to focus on \"lifecycle engineering services\" to reduce business volatility. CEO Sukamal Banerjee stated the firm is moving beyond design to manufacturing and servicing, targeting deals in the $50 million to $100 million range. The company has also established a new CTO organization to focus on physical AI and quantum computing research.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "b393ee76"}, {"headline": "Cashfree Payments launches AI agents to automate merchant operations", "summary": "Fintech firm Cashfree Payments has introduced AI agents called 'Relay' to help merchants automate payment operations. The agents are designed to handle failed payment retries, abandoned cart follow-ups, and dispute management. Cashfree aims to help merchants recover approximately Rs 20,000 crore in lost gross merchandise value through these automated interactions.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "0e33cc24"}, {"headline": "India's venture capital funding growth trails global recovery", "summary": "Venture capital deal value in India grew by only 5% in the first seven months of 2026, significantly lagging behind the 161% global average surge. Data from GlobalData shows that India's deal volumes fell by 13% as investors maintained valuation discipline. In contrast, China saw deal values surge by 213%, cementing its position as the second-largest VC market after the US.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "2ee430cf"}, {"headline": "South Korean day traders abandon leveraged chip ETFs amid regulations", "summary": "Trading values for leveraged ETFs targeting South Korean chipmakers like Samsung and SK Hynix have collapsed to 4% of their June peak. The decline follows new regulations requiring investors to complete an onerous five-day mock trading course before participating in risky leveraged products. Retail investors have cited the new PC-based training requirements as too cumbersome to meet.", "category": "World", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "b4e11f02"}, {"headline": "Centre launches real-time analytical tool to monitor fertiliser movement", "summary": "The fertiliser ministry has deployed a new national-to-retail dashboard to track fertiliser dispatches and inventories in real time. Integrated with the AgriStack database and Aadhaar-linked sales, the tool aims to detect localized shortages and prevent long queues for farmers. The system processes transactions for 140 million buyers across 250,000 retail outlets.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "b1338d47"}, {"headline": "FM Sitharaman expects India to maintain 7% growth in FY27", "summary": "Finance Minister Nirmala Sitharaman stated India is on track to sustain GDP growth of 7% or more in the 2026-27 financial year. Speaking in Chicago, she noted that the government will continue systemic reforms to attract international investment. While domestic private investment has picked up, the FM highlighted the need for more overseas capital as the economy expands.", "category": "Economy", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "dca6c49a"}, {"headline": "Revised CBG pricing won't materially impact gas consumers, says ministry", "summary": "The Petroleum Ministry clarified that a 28% increase in procurement prices for Compressed Biogas (CBG) will not lead to a sharp rise in retail CNG or PNG prices. The government will provide affordability support of Rs 10 per kg of CBG, and the additional costs will be spread across a large domestic gas pool to minimize the impact on end consumers.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "4ce1843d"}, {"headline": "FSSAI prohibits sale of substandard hing powder by Everest, Laljee Godhoo", "summary": "The Food Safety and Standards Authority of India (FSSAI) has banned the sale of 'hing powder' (compounded asafoetida) variants from Everest Food Products and Laljee Godhoo. The regulator issued prohibition orders after the products were found to be substandard during quality testing. The ban is effective immediately across all retail and distribution channels.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "c2ff8605"}, {"headline": "Fed Chairman Warsh faces no-win situation on interest rates", "summary": "Federal Reserve Chairman Kevin Warsh faces a difficult decision regarding interest rates at the upcoming September meeting. While inflation data remains mixed, markets are pricing in a quarter-point increase. A rate hike would signal commitment to the 2% inflation target but could create immediate friction with the Trump administration, which has pressured the Fed to lower rates.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "69c05877"}, {"headline": "Icelanders vote against reopening EU membership talks in referendum", "summary": "In a national referendum, 52.8% of Icelanders rejected a proposal to reopen membership negotiations with the European Union. The \"no\" vote is seen as a blow to the bloc's geopolitical appeal during a period of global instability. Supporters of EU entry had highlighted economic stability and lower interest rates, while opponents focused on maintaining control over fisheries and agriculture.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "3eab5f87"}, {"headline": "Ukraine to present clear plan for early loan release", "summary": "Ukraine's defense minister has pledged to present partners with a \"clear vision\" of how Kyiv plans to use resources to fight Russia. The move aims to bring forward part of a planned 45-billion-euro EU loan to cover a $27-billion military budget deficit. Ukraine is also lobbying international allies for higher contributions as wartime spending has exceeded initial projections.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "c2e4fb32"}, {"headline": "India's foreign exchange reserves hit record high of $729.3 billion", "summary": "India's forex reserves reached an all-time high of $729.3 billion in late August, driven largely by RBI swap schemes. While providing a cushion against external shocks, economists warn against using reserves to artificially prop up the rupee. A 7.7% real depreciation over the last year has helped maintain external competitiveness despite global geopolitical and crude oil price pressures.", "category": "Economy", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "7c456b5c"}, {"headline": "Four to five private Invits expected to list by March", "summary": "At least four to five privately placed infrastructure investment trusts (Invits) are planning to go public by the end of FY27. This shift is expected to increase the number of publicly listed Invits to 14, improving liquidity and retail participation. The industry is targeting assets under management of Rs 21 trillion by 2030, with roads currently making up 40% of the landscape.", "category": "Business", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "ba378ed5"}, {"headline": "Mutual funds add gold and silver ETFs to active equity portfolios", "summary": "Several asset management companies have updated their scheme mandates to allow gold and silver ETF exposure in active equity and hybrid funds. The move follow Sebi's guidelines allowing non-debt schemes to diversify into precious metals. Fund houses like Bandhan and PPFAS have set upper limits ranging from 10% to 35% for such investments to improve risk-adjusted returns.", "category": "Business", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "1ecb554a"}, {"headline": "Rahul Gandhi's communication team adopts Gen Z outreach playbook", "summary": "The Congress party is recasting Rahul Gandhi's public image using informal interactions and youth-focused digital content. His communication team focuses on extempore sessions with students and workers rather than scripted speeches. The strategy has led to a 22% growth in his Instagram followers, reaching 15.5 million, with engagement rates higher than several global political peers.", "category": "Politics", "page": 21, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "2c67e3d7"}, {"headline": "High memory chip prices drive budget laptop buyers toward tablets", "summary": "Surging costs for memory chips, now making up nearly 50% of personal computer prices, are squeezing India’s budget laptop segment. This has led to a 30% year-on-year growth in Wi-Fi tablet shipments as cost-conscious consumers shift to more affordable devices. Manufacturers like HP and Huawei are re-entering the Indian tablet market to capture demand in the sub-Rs 30,000 category.", "category": "Technology", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "65f400c4"}, {"headline": "Apple enters new era as John Ternus succeeds Tim Cook", "summary": "As Tim Cook transitions to executive chairman, hardware engineer John Ternus takes the helm at Apple. Under Cook, India became a vital manufacturing hub, now producing 25% of global iPhones. Analysts expect Ternus to deepen this integration, potentially shifting 35% of production to India by 2031 and moving beyond assembly into high-precision component manufacturing and R&D.", "category": "Technology", "page": 23, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "33d61c4e"}, {"headline": "49 Indians missing after massive mudslide at Tibet border", "summary": "A massive flash flood and mudslide at the Gyirong port on the Tibet-Nepal border has left 546 people missing, including 49 Indian nationals. The death toll from the regional disaster has reached 781 in Nepal and 16 in Tibet. India has dispatched 68.5 tonnes of relief materials and technical teams to assist in rescue operations at affected hydroelectric projects and tunnels.", "category": "India", "page": 24, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135746", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 31-08-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/135746"}], "article_id": "1e94a0aa"}, {"headline": "Hunt Intensifies for 900 Missing in Nepal Floods as Tunnel Located", "summary": "Rescue teams in Nepal are searching for approximately 900 people missing after massive floods hit hydropower units. One tunnel head at the Trishuli-3A project has been located, but debris hampers access. The death toll has reached 810, with over 3,000 still missing across various regions. Only 29 bodies have been identified so far using DNA evidence and personal belongings.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "429a9f32"}, {"headline": "Eight Dead and Several Missing After Ferry Sinks Off Cyprus Coast", "summary": "A passenger ferry carrying around 30 people capsized and sank approximately 6.5km off the northern coast of Cyprus. At least eight people have been confirmed dead, while several others remain missing. Authorities managed to rescue some crew members and passengers. The vessel reportedly overturned before it could be properly evacuated. Search and rescue operations are ongoing.", "category": "World", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "9cbea43e"}, {"headline": "Delhi Election Commission to Publish Draft Electoral Rolls Today", "summary": "The Delhi Election Commission is set to publish the draft electoral rolls for the upcoming special summary revision (SSR). Around 47.6 lakh residents may find themselves listed on the new rolls. Voters are encouraged to check their details and file claims or objections between August 31 and September 30 to ensure accuracy for the next election cycle.", "category": "Politics", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "64866fdf"}, {"headline": "Delhi Government Reserves 1,300 E-Auto Permits for Women and Transgender Persons", "summary": "The Delhi government is rolling out a new scheme offering 1,300 e-auto permits specifically for women and transgender residents. Under the initiative, 90% of the permits are allocated to women and 10% to transgender applicants. The move aims to provide sustainable livelihood opportunities in the traditionally male-dominated transport sector and promote green mobility.", "category": "Infrastructure", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "be6e705a"}, {"headline": "Two Kerala Women Murdered by Friend in California Apartment", "summary": "Two women from Kerala were found dead in their California apartment, allegedly killed by a male friend following a personal dispute. The suspect, also from Kerala, reportedly turned the weapon on himself after the attack. Local police are investigating the motive behind the double homicide. The families of the victims in India have been notified of the tragedy.", "category": "World", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "482778c1"}, {"headline": "Delhi Records 54% Surplus August Rainfall Improving Air Quality", "summary": "Delhi recorded 653.3mm of rainfall in August 2024, representing a 54% surplus over the monthly average. This marks the highest August rainfall for the city in over a decade. The heavy downpours have significantly improved the air quality index, keeping it in the 'satisfactory' range. However, light to moderate rains are expected to continue through mid-week.", "category": "Environment", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "7cb2abc7"}, {"headline": "Nepal School Rebuilt With Indian Aid Swallowed by Massive Floods", "summary": "A secondary school in Nepal, which was rebuilt with Indian assistance following the 2015 earthquake, has been completely destroyed by the current floods. The Trishuli river breached its banks, swallowing the entire school campus. No casualties were reported at the school as teachers evacuated children just before the water hit. The incident highlights the vulnerability of regional infrastructure.", "category": "World", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "be3a64f2"}, {"headline": "NEET-PG 2026 Conducted Smoothly; Retest Scheduled for Glitch-Hit Jaipur Centre", "summary": "The NEET-PG 2026 exam was held successfully across 1,111 centers for most of the 2.4 lakh candidates. However, a technical glitch at a Jaipur center disrupted the examination for 2,445 students. The National Board of Examinations has announced a retest for the affected Jaipur candidates on September 5. Overall, the exam process was described as transparent and secure.", "category": "Education", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "cb20273b"}, {"headline": "Three-Year-Old Assaulted at Delhi Playschool; Attendant Arrested Under POCSO Act", "summary": "A three-year-old boy was allegedly physically and sexually assaulted by an attendant at a private playschool in North Delhi. CCTV footage reportedly showed the child being tied to a chair and hit. Police have arrested the attendant and registered a case under the POCSO Act and BNS. The Directorate of Education has also ordered an inquiry into the school's conduct.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "fc4c9894"}, {"headline": "AAP Worker Shot in Punjab Market Due to Political Rivalry", "summary": "A member of the Aam Aadmi Party (AAP) was chased and shot at in a busy market in Punjab's Ferozepur district. Police suspect political rivalry behind the attack. The victim was rushed to a hospital and is reported to be in stable condition. An investigation is underway to identify the gunmen, who fled the scene on a motorcycle immediately after the shooting.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "f0f91fe8"}, {"headline": "SC Judge States Right to Question is Not Defiance of Authority", "summary": "Supreme Court Justice Ujjal Bhuyan emphasized that the right to question the government is a fundamental aspect of a constitutional democracy and should not be viewed as defiance. Speaking at a law university convocation, he stated that institutions must allow for dissent to ensure accountability. He stressed that questioning and debate are essential for a healthy and vibrant society.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "9fec52d8"}, {"headline": "CJI Warns Only One Rupee Recovered for Every Hundred Laundered", "summary": "Chief Justice of India D.Y. Chandrachud highlighted a massive gap in anti-money laundering efforts, stating that authorities recover only ₹1 for every ₹100 laundered. Speaking at an international symposium, he noted that 99% of laundered funds remain untraced globally. He called for better international cooperation and advanced technology to track the illicit flow of economic resources.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "048bd6b8"}, {"headline": "Bhopal Man Dies After Hospital Lift Failure Following Fall From Tree", "summary": "A 52-year-old man in Bhopal died after a hospital lift malfunctioned while he was being moved for treatment. The victim had originally suffered injuries falling from a tree. When the lift failed, medical staff reportedly left him unattended in the elevator for nearly an hour. The family has alleged negligence, and authorities have registered a case for further investigation.", "category": "Health", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "470809c4"}, {"headline": "Three Siblings and Cousin Drown in Rajasthan Pond During Ritual", "summary": "Tragedy struck in Rajasthan as three siblings and their cousin drowned in a village pond while performing a religious ritual. The victims, aged between 18 and 25, reportedly slipped into deep water while bathing. Despite efforts by locals to rescue them, all four were declared dead. The state government has announced a compensation of ₹3 lakh for each of the deceased families.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "85ec8c64"}, {"headline": "Congress Leader Alka Lamba's Father's House Burgled in Delhi", "summary": "The house of Congress leader Alka Lamba's 88-year-old father in Delhi's Tagore Garden was burgled by three masked men. The thieves reportedly fled with gold ornaments and ₹1.7 lakh in cash. CCTV footage captured the intruders entering and leaving the property within ten minutes. Police have registered a case and are searching for the suspects based on the video evidence.", "category": "India", "page": 1, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "36a1cb03"}, {"headline": "Balconies Collapse Across Three Floors in Gurgaon Apartment Complex", "summary": "Balconies across three floors of an apartment building in Gurgaon's Sushant Lok-3 collapsed on Sunday. The incident occurred during repair work on a second-floor balcony, which triggered a chain reaction affecting the floors below. No residents were injured, but the collapse has raised serious concerns about the structural integrity of aging residential buildings in the area.", "category": "Infrastructure", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "eba8329e"}, {"headline": "TOI Check Finds Major Deficiencies in Rajasthan Government Schools", "summary": "A Times of India ground report across six Rajasthan districts has revealed severe infrastructure gaps in government schools. Many institutions are operating out of tin sheds, parking kiosks, or under trees due to dilapidated or non-existent buildings. Data shows that 75% of the state education budget is spent on salaries, leaving little for facility maintenance and drinking water.", "category": "Education", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "c4386673"}, {"headline": "Rejected Suitor Attacks Woman and Her Sister With Acid in Meerut", "summary": "A 21-year-old woman and her 19-year-old sister suffered burn injuries in Meerut after a rejected suitor attacked them with acid. The sisters were heading home when the man threw the corrosive liquid at them. Both victims are receiving treatment for burns on their faces and shoulders. Police have arrested the suspect, who allegedly carried out the attack in a fit of rage.", "category": "Law", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "93a29ca9"}, {"headline": "Study Reveals Diabetes Impacts Men and Women Differently Regarding Heart Health", "summary": "A new medical study published in PLOS Medicine suggests that men with type 2 diabetes face heart disease risks earlier than women. However, women with the condition show a higher risk of developing cardiovascular or renal disease over time. Researchers analyzed 28,720 patients, concluding that sex-specific monitoring and mental health screening are crucial for effective diabetes management.", "category": "Health", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "782d5bb1"}, {"headline": "Daughter of Former Maoist Leader Becomes Civil Engineer in Gadchiroli", "summary": "Arvinda Barsagade, the daughter of a former Maoist leader in Gadchiroli, has successfully completed her civil engineering degree. Her father had surrendered in 2010 to ensure a better future for his children. Arvinda now works for a prominent engineering firm, symbolizing the transformative power of education in conflict-hit regions. Her success is being hailed as a sign of progress in the district.", "category": "Education", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "5bc2affa"}, {"headline": "Experts Warn Master Plan Delhi 2047 Needs Action Beyond Green-Blue Labels", "summary": "Urban planning experts have cautioned that the proposed 'Green-Blue' makeover in Delhi's Master Plan 2047 requires more than just new terminology. The plan aims to create buffer zones along drains and water bodies, but experts point out that much of the target land is already saturated or encroached upon. They stressed that strict implementation and local body coordination are vital for success.", "category": "Environment", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "a60d1e0a"}, {"headline": "DDA Launches Digital Platform to Demystify MPD-2047 with Public Feedback", "summary": "The Delhi Development Authority (DDA) has launched a digital outreach program to help residents understand and provide feedback on the Master Plan for Delhi 2047. The initiative includes comprehensive FAQs, videos, and infographics to explain complex land policies. Officials hope this digital approach will increase transparency and encourage wider stakeholder participation in urban planning.", "category": "Infrastructure", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "7cf882ed"}, {"headline": "NGT Upholds Ten Lakh Rupee Fine on Denim Unit for Pollution", "summary": "The National Green Tribunal (NGT) has upheld a ₹10 lakh environmental compensation fine on a denim dyeing unit for discharging untreated effluent. A joint inspection team found that the unit was operating without requisite regulatory clearances and was polluting local water sources. The tribunal rejected the company's appeal, emphasizing the need for strict compliance with waste norms.", "category": "Environment", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "dd607ed7"}, {"headline": "Couple Crushed to Death by Truck on NH-9 Near Indirapuram", "summary": "A man and his wife were killed on Sunday after their motorcycle was hit by a truck on National Highway 9 near Indirapuram. The couple was traveling to Ghaziabad to avoid Raksha Bandhan traffic snarls. The truck reportedly dragged the bike for nearly 100 meters. The driver has been taken into custody, and police are investigating whether speeding or negligence caused the fatal accident.", "category": "India", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "f5866537"}, {"headline": "Delhi Requests for Tree Pruning Rise as Administrative Delays Persist", "summary": "Delhi residents are facing risks from overgrown and dangerous trees as administrative delays stall pruning requests. Since June, over 1,400 requests have been sent to the MCD, but less than 30% have been addressed. The backlog is attributed to a complex approval process between the MCD and the forest department. Experts warn that unmanaged branches pose a severe safety hazard during monsoon.", "category": "Environment", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "e0b55eb4"}, {"headline": "Delhi Reclaims 100 Acres of Land in Battle Against Garbage Mountains", "summary": "The Delhi government has reclaimed nearly 100 acres of land by processing and clearing over 15 lakh metric tonnes of legacy waste from the Bhalswa, Okhla, and Ghazipur landfills. This effort is part of a larger plan to flatten the city's three massive garbage mounds. Officials stated that processed waste is being used for low-lying area filling and road construction projects.", "category": "Environment", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "27211022"}, {"headline": "Police to Recreate Crime Scene in Model Muskan Murder Case", "summary": "Delhi Police are preparing to recreate the crime scene with the accused, Imran Alias Aquib, who was arrested for the murder of model Muskan. Investigators aim to establish the sequence of events leading to her death. Cops are also searching for the weapon used and analyzing social media activities of the suspect. The accused reportedly attempted suicide before his arrest.", "category": "Law", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "0945336d"}, {"headline": "Dirty Toilets in Lutyens Delhi Spark Concern Ahead of BRICS Summit", "summary": "Local authorities in Delhi are scrambling to improve the condition of public toilets in the Lutyens zone ahead of the upcoming BRICS summit. Inspections revealed that many facilities are poorly maintained, with issues like lack of water and broken fixtures. Residents have complained that several toilets remain locked or unusable, prompting the NDMC to initiate an urgent cleaning drive.", "category": "Infrastructure", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "fcf3e48c"}, {"headline": "Delhi Government Schools Face Severe Shortage of Trained Counsellors", "summary": "A report has highlighted a critical shortage of trained vocational and educational counsellors in Delhi's government schools. Currently, there is only one counsellor for every 2,500 students, far below the ideal ratio of 1:500. Experts say this shortage hampers the schools' ability to address students' emotional problems, bullying, and career guidance needs effectively.", "category": "Education", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "dcbf3578"}, {"headline": "IIT Delhi Students Protest Alleged Surveillance and Excessive Police Presence", "summary": "Students at IIT Delhi have staged a protest against what they describe as disproportionate police presence and surveillance on campus. The agitation followed the tragic death of a student, with protesters demanding institutional accountability and a safe campus environment. The administration has appealed for peace and promised to address student concerns through dialogue and a transparent inquiry.", "category": "India", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "e89d4ca7"}, {"headline": "Police Arrest Associate of Nasir Gang in 2022 Murder Case", "summary": "Delhi Police have arrested an associate of the Nasir-Shahrukh gang in connection with a 2022 gang-war murder. The suspect had been evading arrest and was living under a false identity. He is accused of participating in a violent clash that left one person dead. The arrest was made following a tip-off, and the suspect has been remanded to judicial custody for further questioning.", "category": "Law", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135712", "sources": [{"newspaper": "Times of India", "pdf_filename": "Delhi_TOI_31-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135712"}], "article_id": "fb2e4b10"}, {"headline": "Mobile Phone Containing Important Documents Snatched From Official's Car", "summary": "A phone containing sensitive legal and forensic documents was snatched from a government official's car in Northwest Delhi. The victim was traveling when a man approached her vehicle on the pretext of an accident and grabbed the device. Police have registered a ca
