<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

<script>
const DIGEST = {"date": "20 August 2026", "articles": [{"headline": "Congress to expand student outreach and temple donation theft protests", "summary": "The Congress Working Committee resolved to extend Rahul Gandhi’s \"Chhatron ki Goonj\" programme to 800 towns. The party plans a grassroots agitation against alleged donation theft at the Ram Mandir and will skip the full version of Vande Mataram at events. Mallikarjun Kharge asked Congress-led states to prepare blueprints for education and exam reforms to address student grievances.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "59434ae5"}, {"headline": "Iran warns Gulf countries against assisting US military operations", "summary": "Iran’s armed forces warned Gulf nations that providing assistance to the US military would be viewed as participation in aggression. The warning followed the UAE's decision to sever economic ties with Tehran after attacks on shipping. General Ali Abdollahi stated Tehran is fully aware of military aircraft presence at regional bases and cautioned against facilitation.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "ca57cacc"}, {"headline": "Three killed as truck CNG tank explodes at Delhi fuel pump", "summary": "Three workers died and three others were injured after a truck's gas tank exploded during refilling at an IGL pump in Tikri Kalan, Delhi. The deceased were identified as Manish Prasad, Sunny, and Brahmjeet. Police have registered a case of negligence under the Bharatiya Nyay Sanhita while IGL and police personnel investigate the exact cause of the blast.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "fecf1241"}, {"headline": "NCERT revamps class 11 and 12 political science textbook panel", "summary": "The NCERT has reconstituted the textbook development team for class 11 and 12 political science to integrate Indian knowledge systems and cultural rootedness. The team, led by Sandeep Shastri, includes members with direct or indirect links to the RSS. New textbooks are expected by November for class 11 and July next year for class 12.", "category": "Education", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "79c11d7b"}, {"headline": "Kiren Rijiju clarifies China border situation and trashing intrusion reports", "summary": "Parliamentary Affairs Minister Kiren Rijiju stated that differing perceptions of the Line of Actual Control (LAC) in Arunachal Pradesh cause confusion as the border is not demarcated. He dismissed reports suggesting a 60km Chinese intrusion, noting that villagers on both sides claim ancestral land further ahead. He emphasized that the Army and ITBP have strengthened patrolling.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "67fa48ff"}, {"headline": "Fossil fuel light goods vehicles banned from registration in NCR", "summary": "The Commission for Air Quality Management (CAQM) announced a ban on registering new CNG, diesel, or petrol Light Goods Vehicles (N1 category) in Delhi from January 1, 2027. The ban extends to major NCR districts like Gurugram and Noida from July 1, 2027. The move is designed to force a phased transition to electric goods vehicles to improve regional air quality.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "4360c3f0"}, {"headline": "District collectors empowered to decide citizenship applications in border states", "summary": "The Centre amended citizenship rules to empower district collectors in six border states—Gujarat, Rajasthan, Punjab, West Bengal, Assam, Tripura—and two UTs to decide Indian citizenship applications under Section 6B. This decentralises the process previously handled by empowered committees, facilitating the pathway for persecuted minorities from neighboring countries.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "560d3782"}, {"headline": "CBI books BluSmart founders for alleged diversion of IREDA funds", "summary": "The CBI registered a case against Gensol Engineering and BluSmart founders Anmol and Puneet Singh Jaggi for allegedly misutilising loans from IREDA. The FIR involves the diversion of funds intended for purchasing electric vehicles. The investigation follows findings by SEBI, with the Enforcement Directorate also conducting a parallel money-laundering probe.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "a667d9c9"}, {"headline": "Israeli military admits firing on car that killed 5-year-old Hind Rajab", "summary": "The Israeli military admitted its troops fired on a car in Gaza in 2024 carrying five-year-old Hind Rajab, whose death drew global outrage. The military has ordered a criminal investigation into the killing after previously denying presence in the area. A separate probe is being launched into the 2025 killings of 15 other Palestinians, including humanitarian staff.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "04eb8f1d"}, {"headline": "Chinese robotics giants show off latest humanoid innovations in Beijing", "summary": "The 2026 World Robot Conference opened in Beijing featuring over 2,000 exhibits from 300 companies. Chinese firms demonstrated humanoid robots capable of boxing, dancing, and sorting crates. While firms like Unitree saw stock surges of 460%, some robots still struggled with basic manual tasks like folding shirts, highlighting current limitations in the technology.", "category": "Technology", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "4112813e"}, {"headline": "Karnataka to form SIT to probe counterfeit medicine network", "summary": "Health Minister U T Khader announced a Special Investigation Team (SIT) to investigate a network manufacturing and distributing fake branded medicines. The move follows a raid on a farmhouse near Bengaluru where counterfeit labels of multinational companies were applied to ICU drugs. Authorities are tracking distribution links to other states like Himachal Pradesh and Telangana.", "category": "Health", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "d896faf1"}, {"headline": "MUDA cancels 1,100 sites allotted under controversial 50:50 scheme", "summary": "The Karnataka government ordered the cancellation of 1,100 alternative sites allotted by the Mysuru Urban Development Authority (MUDA) in violation of a 2023 directive. Minister Yathindra Siddaramaiah directed authorities to initiate civil proceedings to cancel sale deeds and put khatas on hold. The cancelled sites are estimated to be worth approximately Rs 2,000 crore.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "46f1ee8c"}, {"headline": "Naidu alleges massive corruption in Group-I recruitment under YSRCP", "summary": "Andhra Pradesh CM N Chandrababu Naidu accused the previous YSRCP government of compromising APPSC integrity by using unqualified people, including drivers and electricians, to evaluate Group-I answer scripts. He alleged forensic evidence showed OMR sheet tampering and the use of whitener. An SIT is currently investigating irregularities following a court-directed probe.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "85abdd6c"}, {"headline": "Amit Shah to chair Southern Zonal Council meeting in Mahabalipuram", "summary": "Union Home Minister Amit Shah will chair the 31st Southern Zonal Council meeting on Thursday, featuring representatives from southern states and UTs. The forum aims to resolve disputes and improve coordination between the Centre and states like Karnataka, Kerala, and Tamil Nadu. Security has been tightened in Mahabalipuram, with tourist access partially restricted.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "930b8c10"}, {"headline": "India and Palestine sign deals for Jenin hospital and training centre", "summary": "India and Palestine signed agreements to establish a 200-bed super speciality hospital in Jenin and a vocational training centre. Senior Indian diplomat Sripriya Ranganathan reaffirmed India's support for a negotiated two-state solution during meetings with Palestinian leadership. The hospital will feature a trauma centre to serve Jenin and neighbouring governorates.", "category": "World", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "7a085726"}, {"headline": "Rajasthan government cancer drugs found in Delhi black market", "summary": "A batch of expensive cancer drugs supplied through Rajasthan's free-medicine scheme surfaced in Delhi's black market, sparking a state investigation. Delhi Police arrested members of a syndicate and seized 22 vials of medicines like Bavencio and Darzalex. Health Minister Gajendra Singh Khimsar ordered an inquiry into the procurement and distribution chain to find the leak.", "category": "Health", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "704908b4"}, {"headline": "Gadkari to use GST records to monitor highway project subcontracting", "summary": "Union Minister Nitin Gadkari announced that the government will use GST records to track layers of subcontracting in highway projects. New rules will limit the percentage of work a contractor can subcontract to ensure quality control. The move targets concerns regarding steeply discounted bids that lead to project dilution and poor infrastructure quality.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "d806babb"}, {"headline": "RBI maintains repo rate at 5.25% amid rising inflation concerns", "summary": "The Reserve Bank of India kept the policy repo rate steady at 5.25% as retail inflation rose to 4.45% in July. Governor Sanjay Malhotra signaled a 'neutral' stance, waiting for clarity on whether price pressures from food and fuel prove persistent. The central bank projected core inflation to settle around 4.3% in FY27 while keeping GDP growth projections resilient.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "2056987b"}, {"headline": "US Green Card seekers to face broader scrutiny under new rules", "summary": "Immigrants seeking US permanent residency will face expanded 'public charge' definitions starting September 18. USCIS officers will now consider an applicant's use of Medicaid, food stamps, and housing assistance, as well as their educational background and family finances. The Trump administration rule rescinds 2022 Biden-era regulations, potentially impacting thousands of Indian applicants.", "category": "World", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "e1bc6363"}, {"headline": "Lakshya Sen knocked out of Badminton World Championships by US teen", "summary": "India's 14th seed Lakshya Sen suffered a shock exit from the BWF World Championships after losing 19-21, 21-19, 21-17 to 18-year-old American Garret Tan. The 73-minute match saw Sen struggle with physical exhaustion in the decider. Tan, ranked 92nd in the world, neutralised Sen's net speed with dominant downward smashes to advance to the last 16.", "category": "Sports", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134560", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 20-08.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/134560"}], "article_id": "d01b56ee"}, {"headline": "Experts claim AI recklessly used for drafting exam questions", "summary": "Experts allege that the National Testing Agency (NTA) recklessly used AI to draft questions for UGC-NET and NEET-UG exams, leading to errors and poor translations. NTA has denied these claims, but the controversy has sparked calls for greater human oversight in exam paper setting.", "category": "Education", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "a3428752"}, {"headline": "SC directs Speaker to decide on Maharashtra MLA disqualification", "summary": "The Supreme Court has directed the Maharashtra Assembly Speaker to decide on disqualification petitions against 16 rebel MLAs within a specified timeframe. The court clarified it cannot assume the Speaker's role but emphasized the need for a timely constitutional decision to resolve the political crisis.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "d80d5726"}, {"headline": "Rajdhani Express waits as 90 elephants cross tracks in Assam", "summary": "A Rajdhani Express was halted for 90 minutes in Assam's Hojai district to allow a herd of 90 wild elephants to cross the railway tracks. Forest officials and railway patrol teams coordinated the halt after spotting the herd moving through a known migration corridor, ensuring zero casualties.", "category": "Environment", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "dcd01653"}, {"headline": "PM Modi instructs ministers to visit universities for youth outreach", "summary": "Prime Minister Narendra Modi has directed his cabinet ministers to spend time at universities and schools to engage with Gen Z and Gen Alpha students. The outreach program aims to gather feedback on government schemes and assess educational infrastructure directly from the younger demographic.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "c209bfbc"}, {"headline": "Mercury-rich fairness creams pose severe health risks to users", "summary": "Doctors in Bengaluru have warned against the use of certain fairness creams found to contain mercury levels 11,500 times higher than safety limits. High mercury exposure has led to cases of kidney damage, neurological symptoms, and skin discoloration among several patients recently treated at hospitals.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "c408b896"}, {"headline": "Varthur residents start five hours early for airport flights", "summary": "Severe traffic congestion on State Highway 35 has forced residents of Varthur and Gunjur to leave for Bengaluru's airport five hours in advance. Commuters reported spending over two hours to cover just four kilometers, leading to missed flights and increased demands for infrastructure improvements.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "e9c0e865"}, {"headline": "H1N1 cases rise in Bengaluru, pediatricians urge caution", "summary": "Doctors in Bengaluru report a significant increase in H1N1 (swine flu) cases among children. Pediatricians have advised parents to keep children with flu-like symptoms at home to prevent school-wide transmission. High-risk groups are being encouraged to take annual flu vaccinations as a precaution.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "5284d736"}, {"headline": "Karnataka HC rules 'homemaker' is a gender-neutral term", "summary": "The Karnataka High Court has ruled that the term 'homemaker' can refer to either a man or a woman, regardless of their professional status. The court observed that anyone who sacrifices personal comfort to maintain a stable family and pillar the home should be considered a homemaker in legal contexts.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "7566e87d"}, {"headline": "Bengaluru Lokayukta finds 12 crore in assets with land officer", "summary": "Lokayukta officials raided the premises of a special land acquisition officer in Bengaluru, uncovering assets worth approximately Rs 12 crore. The found assets, which include luxury houses and land parcels, are significantly disproportionate to the officer's known sources of income.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "fb594cf8"}, {"headline": "Police seize 5 crore worth of fake drugs in Bidadi", "summary": "Bengaluru police seized a massive cache of counterfeit life-saving drugs valued at Rs 4.9 crore during a raid in Bidadi. The operation targeted a syndicate involved in relabeling expired or cheap medicines as expensive branded pharmaceutical products for sale in hospitals and pharmacies.", "category": "India", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "f1954d3e"}, {"headline": "Record number of women collectors now leading Chhattisgarh districts", "summary": "In a historic milestone, 12 out of 33 districts in Chhattisgarh are now headed by women collectors. This represents more than one-third of the state's administrative districts being led by women, highlighting a significant shift in the state's governance and administrative leadership profile.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "f0fdd4aa"}, {"headline": "Tamil Nadu raises health insurance cover to 25 lakh per year", "summary": "The Tamil Nadu government has announced a five-fold increase in the annual health insurance coverage under the Chief Minister's Comprehensive Health Insurance Scheme. The cover has been raised from Rs 5 lakh to Rs 25 lakh per family, aimed at providing better access to high-end medical procedures.", "category": "Health", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "4aefa3e2"}, {"headline": "FBI and ED collaborate on 200 crore call centre fraud", "summary": "The FBI and India's Enforcement Directorate are jointly investigating a Rs 200 crore cyber fraud involving a network of call centres in Hyderabad. The syndicate allegedly targeted US citizens through fake technical support and phishing scams, coercing them into making cryptocurrency payments.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "9e6a0da9"}, {"headline": "Half of India's private homeopathy colleges have political links", "summary": "An analysis of 72 private homeopathy colleges in Maharashtra found that nearly 50% are established or controlled by individuals with political connections. Experts suggest this link contributes to the rapid growth of these institutions despite infrastructure deficiencies and lack of qualified faculty.", "category": "Politics", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "437c5b83"}, {"headline": "IIT JEE aspirant found dead in Patna hostel room", "summary": "An 18-year-old student preparing for the IIT JEE entrance exam was found dead in his hostel room in Patna. No suicide note was recovered from the scene. This incident adds to the rising concerns regarding the intense academic pressure and mental health of students in coaching hubs across India.", "category": "India", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "f518a4de"}, {"headline": "Sebi chief warns of strict action against CAS manipulation", "summary": "Sebi Chairperson Madhabi Puri Buch warned market participants against manipulative trades during the Closing Auction Session (CAS). The regulator has noticed unusual price variations and warned that strict disciplinary action will be taken to ensure fair market practices and protect retail investors.", "category": "Business", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "0f2890e5"}, {"headline": "Ram Gopal Varma pays 1.11 crore in technician dues", "summary": "Filmmaker Ram Gopal Varma cleared Rs 1.11 crore in outstanding dues to technicians and daily-wage workers after a strike halted his film shoot in Mumbai. The Federation of Western India Cine Employees (FWICE) had stopped work until the long-pending payments for three previous projects were settled.", "category": "Culture", "page": 28, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134538", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 20-08-2026.pdf", "page": 28, "telegram_url": "https://t.me/c/1877410077/134538"}], "article_id": "b086c1ff"}, {"headline": "Satellite internet rollout stuck over security concerns", "summary": "The commercial launch of satellite internet services in India is delayed as the government raises security concerns regarding data routing. Authorities are worried that foreign satellite operators might bypass Indian gateways, potentially compromising national security. Companies like Starlink, Eutelsat OneWeb, and Jio Satellite are awaiting final spectrum and security clearances.", "category": "Technology", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "ba67e4bf"}, {"headline": "Sebi weighs setting limits on lookalike passive mutual funds", "summary": "The Securities and Exchange Board of India is considering limits on the number of passive mutual fund schemes tracking similar indices. The regulator aims to prevent market clutter and reduce confusion for retail investors caused by repetitive index funds. Currently, over 130 passive funds are active, with many tracking common large-cap benchmarks like the Nifty 50.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "7b792275"}, {"headline": "Shalimar Paints pre-deal price surge risks regulatory scrutiny", "summary": "Shares of Shalimar Paints surged 20% just days before the company announced a share-swap deal with Hella Infra Market. This unusual price and volume activity has caught the attention of stock exchanges and the regulator. Markets are investigating potential leaks or insider trading preceding the official disclosure of the material business agreement.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "54855c76"}, {"headline": "Government to probe manufacturing defects in Oppo Reno 5 phones", "summary": "India's consumer watchdog and Department of Consumer Affairs have initiated an inquiry into manufacturing defects reported in Oppo's Reno 5 series smartphones. The probe follows numerous complaints regarding hardware issues, including the \"green line\" display defect. Oppo executives have been asked to detail their steps for addressing consumer grievances and compensation.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "3d425db9"}, {"headline": "Telcos told to limit SIM cards per subscriber to nine", "summary": "The Department of Telecommunications has issued a directive to telecom operators to ensure no individual subscriber holds more than nine SIM cards across all networks. The rule, effective August 24, aims to curb fraudulent activities and organized crime. Subscribers exceeding the limit must surrender or deactivate their additional connections to comply with the new regulatory cap.", "category": "Technology", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "6c907f47"}, {"headline": "Monsoon crop sowing caught up after July rains: government", "summary": "India's monsoon crop sowing has largely recovered after a deficit in June was offset by heavy July rains. The sowing of most crops, including pulses, oilseeds, and cotton, is progressing satisfactorily according to Agriculture Secretary Atish Chandra. While acreage is slightly lower than previous highs for some crops, the overall outlook for the kharif season remains positive.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "53727502"}, {"headline": "RBI tells banks to stress-test AI tools before deployment", "summary": "RBI Deputy Governor Swaminathan Janakiraman has urged banks to anticipate cyber threats and operational risks associated with artificial intelligence. He stated that financial institutions must conduct rigorous stress tests on AI-based tools before integrating them into their systems. The move is intended to protect consumers and maintain market integrity against emerging tech risks.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "76fcbaf9"}, {"headline": "Crop insurers seek data protection law to expedite farm innovation", "summary": "Crop insurers have requested the government to create a framework for the protection of regulatory data in the Draft Pesticides Management Bill, 2023. They argue that the absence of such a framework is delaying the entry of newer, safer pesticide molecules into the country. They are seeking a five-year data protection window from the first registration of a new molecule.", "category": "Agriculture", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "72f57abb"}, {"headline": "Railways eyes broader logistics play with new parcel app", "summary": "Indian Railways is planning to launch a dedicated mobile application for its parcel services to transform into a broader logistics provider. The app will allow customers to book consignments, track shipments, and arrange pickups without visiting railway stations. The pilot project aims to capture a larger share of the $9.6 billion parcel market and compete with road transport.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "b8a0fc45"}, {"headline": "Sebi proposes revamp of its settlement and disgorgement framework", "summary": "The Securities and Exchange Board of India has proposed a simplified formula for calculating settlement amounts and interest on disgorged gains. The proposal aims to bring settlement costs down to roughly four times the base penalty, from the current average of eight. It also includes a fast-track treatment for cases with settlement amounts up to ₹10 lakh to expedite case closures.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "9918ab52"}, {"headline": "NMDC faces weak offtake and falling iron ore prices", "summary": "NMDC Ltd reported that sales volumes are struggling to keep pace with production growth. Production rose 26% year-on-year to 11.2 million tonnes in the last quarter, but sales grew by only 1.8%. The state-owned miner was forced to cut prices in early August to spur demand amid a global downturn in iron ore prices and a domestic slowdown in steel production.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "74a20445"}, {"headline": "Sebi considers changes to Closing Auction Session for SMEs", "summary": "Sebi is looking to modify the 20-minute Closing Auction Session (CAS) for small and medium enterprises. The regulator aims to improve price discovery and prevent sudden price swings during the final minutes of trading. Proposed changes include allowing only limit orders in the first 15 minutes of the CAS to ensure a more stable and representative closing price.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "6c291b2e"}, {"headline": "Brigade Group fortunes tied to new residential launches", "summary": "Brigade Enterprises is focusing on a pipeline of residential projects to drive future growth despite recent stock price volatility. The company aims to launch 12-13 million square feet of residential space with a gross development value of ₹13,400 crore in FY25. Analysts suggest that timely execution and new project approvals are critical for a re-rating of the developer's stock.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "d6fa0198"}, {"headline": "SHANTI Act boosts India's nuclear energy sector growth", "summary": "The Sustainable Harnessing and Advancement of Nuclear Energy for Transitioning India (SHANTI) Act is set to open the nuclear power sector to private investment. The law allows for a single license for building and operating nuclear plants, previously restricted to state entities. Major companies like Tata Power and Reliance are evaluating entry into the small modular reactor segment.", "category": "Infrastructure", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "9a0625ca"}, {"headline": "Online broker Upstox plans for an Indian stock market IPO", "summary": "Online brokerage firm Upstox is in preliminary discussions with investment bankers for an initial public offering in India. The potential listing could value the company at around $1.28 billion. Upstox currently has 1.9 million active users and is the fifth largest broker in India by client volume. The funds raised would likely be used to expand its digital product offerings.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "3a79150e"}, {"headline": "KKR eyes 6% stake in BookMyShow at $750 million valuation", "summary": "Global investment firm KKR is in talks to acquire a minority stake in BookMyShow from existing investors. The deal, which could value the entertainment platform at $750 million, involves KKR picking up a 6% share. The investment comes as BookMyShow expands beyond movie ticketing into live events and international markets, including Southeast Asia and the Middle East.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "5e8e6d3e"}, {"headline": "IT graduates face long waits for onboarding at top firms", "summary": "Fresh engineering graduates who received offers from IT majors like Cognizant and Wipro are facing significant delays in their joining dates. Some students have been waiting for over a year after selection, as firms cite project readiness and a challenging demand environment. The industry's shifting focus toward AI and automation is also impacting traditional campus hiring timelines.", "category": "Education", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "cb517a2f"}, {"headline": "NCLT fines SpiceJet and lessor for misleading the court", "summary": "The National Company Law Tribunal has imposed a fine of ₹10 lakh each on SpiceJet and its aircraft lessor, Avolon. The bench stated that the parties \"played fraud\" by failing to inform the court about a settlement reached between them just minutes before a scheduled hearing. The tribunal noted that the court's time was wasted due to the lack of timely disclosure of the resolution.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "95659083"}, {"headline": "Sebi bars two entities for manipulating Sensex expiry day", "summary": "The Securities and Exchange Board of India has barred Copthall Mauritius Investment and Mansi Share and Stock Broking for allegedly manipulating prices on a Sensex expiry day. The regulator found that the entities engaged in unfair trade practices that led to an illegal gain of ₹2.96 crore. This is the first time Sebi has issued a formal order against price manipulation in the CAS.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "ac42698f"}, {"headline": "Diageo to relabel brands but retain composition in India", "summary": "Liquor major Diageo will relabel several popular whiskey and rum brands following a directive from the FSSAI. The regulator mandated the removal of labels like \"whisky-flavoured spirit\" to ensure accurate product classification. While the branding will change to comply with food safety standards, the company confirmed that the internal composition of the spirits remains the same.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "a5402332"}, {"headline": "Aditya Birla Group secures core investment company label from RBI", "summary": "After a six-year pursuit, Aditya Birla Capital has obtained the Core Investment Company registration from the Reserve Bank of India. This label allows the group to hold shares in its various financial and non-financial subsidiaries while accessing public funds under specific regulations. The registration follows a restructuring that merged several privately held group companies.", "category": "Business", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "1f3ce6a9"}, {"headline": "Siguler Guff raises $500 mn to target India mid-market", "summary": "Private equity firm Siguler Guff has raised $500 million for its new India-focused fund. The capital will target mid-market companies in sectors like consumer goods, healthcare, and financial services. The firm aims to support founder-led and family-owned businesses that are looking to scale their operations and institutionalize their governance structures.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "3c2684c4"}, {"headline": "China-linked tankers make U-turn in the Strait of Hormuz", "summary": "Several Chinese-linked oil tankers have diverted their course and exited the Strait of Hormuz due to rising maritime security risks. The U-turn follows recent missile attacks and increased threats to shipping traffic in the Persian Gulf. Tracking data shows the vessels are now idling in open waters as operators await further safety clearances in the volatile region.", "category": "World", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "077f1c73"}, {"headline": "Food companies reformulate products for weight loss drug users", "summary": "Major food manufacturers like Conagra and Nestlé are developing new products to cater to consumers using GLP-1 weight loss drugs. As these medications suppress appetite, companies are launching high-protein, nutrient-dense portions and smaller snack packs. Analysts estimate up to 55 million Americans could be using such medications by 2030, fundamentally shifting food demand.", "category": "Health", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "e9b4cf73"}, {"headline": "CBI registers case against BluSmart founders for alleged fraud", "summary": "The Central Bureau of Investigation has registered a case against the founders of EV taxi service BluSmart for alleged financial irregularities. The action follows a complaint claiming the company misappropriated funds intended for expanding its electric vehicle fleet and infrastructure. Investigators are looking into potential diversions of loans worth several hundred crores.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "5a9665f9"}, {"headline": "Finance Minister reviews economic ties at India-Singapore roundtable", "summary": "Finance Minister Nirmala Sitharaman attended the 4th India-Singapore Ministerial Roundtable to review bilateral economic cooperation. The discussions focused on six pillars: sustainability, digitalization, fintech, skills development, and manufacturing. The visit aims to strengthen the strategic partnership and identify new investment opportunities for both nations.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "360b9e24"}, {"headline": "China successfully lands reusable booster in step toward SpaceX rivalry", "summary": "China’s LandSpace has successfully landed its Zhuque-3 reusable rocket booster, marking a milestone in its goal to compete with SpaceX. The methane-fueled rocket prototype completed a vertical landing after a test flight in the Gobi Desert. This achievement signals China's growing capabilities in low-cost, reusable satellite launch technology and space exploration.", "category": "Science", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "aa1b3ac3"}, {"headline": "Inside Noel Tata’s challenge as head of Tata Trusts", "summary": "Noel Tata has taken centrestage as the head of Tata Trusts, inheriting a complex portfolio of investments and unfinished business bets. He faces the challenge of managing a conglomerate that is pivoting toward capital-intensive sectors like semiconductors and airlines. The role requires balancing traditional trust governance with the modern growth ambitions of Tata Sons.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "2dbbd8ac"}, {"headline": "Proportion of working women in India reaches record highs", "summary": "Data from the Periodic Labour Force Survey shows a steady rise in female labor force participation in India, particularly in rural areas. The rate has increased from roughly 20% in 2017-18 to over 40% in the latest annual data. While some critics debate the nature of this employment, the trend indicates a significant structural shift in the country's economic workforce.", "category": "India", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134544", "sources": [{"newspaper": "Mint", "pdf_filename": "Mint Delhi 20-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/134544"}], "article_id": "103309d8"}, {"headline": "Starlink Relaunches Bid for Satellite Internet Space in India", "summary": "Elon Musk's Starlink has applied to IN-SPACe for a Gen 2 satellite constellation license to provide direct-to-device connectivity. The move follows a previous rejection of an earlier application. Starlink currently operates 4,408 satellites and seeks to tap the high-potential local satcom market amidst evolving regulatory norms and security technical conditions.", "category": "Technology", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "e029f415"}, {"headline": "Indian Executives Face Severe Business Visa Rejections from China", "summary": "Indian industry is facing significant hurdles as China tightens its business visa regime, with rejection rates reaching up to 95%. Major firms in auto parts and electronics are forced to shift crucial executive meetings to neutral venues like Singapore and Thailand. The standoff follows deteriorated bilateral ties and stricter security vetting for Indian professionals.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "d119febe"}, {"headline": "Brands Unwrap Premium Gifting Packs on Quick Commerce Platforms", "summary": "FMCG companies and luxury designers are launching specialized stock-keeping units for festive occasions like Rakshabandhan and Onam on quick commerce apps. Brands like Cadbury, Swarovski, and Masaba Gupta have introduced premium gift boxes. Demand for D2C gifting is seeing a 20-30% weekly surge as consumers shift toward instant, high-end gifting solutions.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "e7771d3d"}, {"headline": "KKR Acquires Minority Stake in BookMyShow for Over ₹380 Crore", "summary": "Global private equity major KKR will invest between ₹380-400 crore to buy a minority stake in the entertainment platform BookMyShow. The deal values the company at approximately ₹6,000 crore. The investment comes as the platform expands into live entertainment and broader ticketing services following a post-pandemic recovery in the out-of-home entertainment sector.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "6c2893ad"}, {"headline": "Reliance Industries Proposes India's First Underground Coal Gasification Unit", "summary": "Reliance Industries Limited has proposed to invest ₹2.73 lakh crore over 30 years to develop India's first integrated underground coal gasification complex in Andhra Pradesh. The project aims to convert coal into synthetic gas (syngas) without physical extraction. The proposal, subject to commercial viability, could mark a significant shift in India’s energy security strategy.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "e11e4ecb"}, {"headline": "Tamil Nadu MLAs to Receive Car and Assistant for Work", "summary": "The Tamil Nadu government has announced that all state MLAs will be provided with a car and an assistant to carry out constituency duties. Chief Minister M.K. Stalin stated the move ensures government schemes reach the people effectively. The assistant will receive a monthly allowance of ₹25,000, while the car is provided for official maintenance and travel needs.", "category": "Politics", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "ee1b44fb"}, {"headline": "Ladakh Groups Submit Non-Negotiable Resolution to Union Home Ministry", "summary": "Representatives from the Kargil Democratic Alliance and Apex Body Leh have submitted a resolution to the Ministry of Home Affairs demanding statehood for Ladakh. The groups seek constitutional safeguards under the Sixth Schedule and the establishment of a legislative assembly. They warned of intensified protests if their demands for local governance are not addressed by late September.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "e46ec205"}, {"headline": "Pakistan Summons US Charge d'Affaires Over Kashmir Remarks", "summary": "Pakistan has summoned the US Charge d'Affaires in Islamabad to lodge a 'strong demarche' over remarks made by the US Ambassador during his visit to Jammu and Kashmir. Islamabad expressed concerns that the visit and statements could impact regional stability. The diplomatic tension follows the US envoy's acknowledgment of the region as an integral part of India.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "3ab8ebda"}, {"headline": "CWC Sticks to Two-Stanza Recital of Vande Mataram at Events", "summary": "The Congress Working Committee (CWC) has resolved to continue the practice of singing only the first two stanzas of the national song 'Vande Mataram' at party programs. The decision aims to maintain a long-standing tradition within the party. The CWC also discussed organizational reforms and the upcoming census, while focusing on social justice and economic issues.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "5f71398d"}, {"headline": "Income Tax Department Unearths ₹1.29 Lakh Crore in Foreign Remittances", "summary": "The Income Tax department has identified 6,422 entities that collectively remitted ₹1.29 lakh crore abroad, mostly to tax havens like Singapore, Hong Kong, and Mauritius. Probe officials suspect these transactions involve under-reporting of income or money laundering. The department has issued notices to 394 firms as part of a wider investigation into tax evasion through foreign channels.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "3f0acd8a"}, {"headline": "Niti Aayog Proposes Outcome-Linked Financing for Skill Development", "summary": "Niti Aayog has proposed a new framework for skill development that focuses on outcome-linked financing to ensure employability. The report suggests integrating vocational training from Grade 9 onwards and utilizing private-public partnerships to align education with industry needs. The initiative aims to create a more resilient workforce for India's emerging green and digital economies.", "category": "Education", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "25cbca56"}, {"headline": "Marvell Offers Google Option for $12.2 Billion AI Chip Stake", "summary": "Marvell Technology has entered an agreement with Alphabet (Google) granting the tech giant the right to purchase up to $12.2 billion of its shares. The deal is linked to Google's purchase of custom AI chips from Marvell. This strategic partnership highlights the growing demand for specialized hardware to power large-scale AI models and cloud computing infrastructure.", "category": "Technology", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "db37d8f9"}, {"headline": "Samsung Hikes Chip Prices by 15% Citing Strong Demand", "summary": "Samsung has raised the prices of its advanced memory chips by up to 15% for new orders. The price hike comes as demand from AI data centers and smartphone manufacturers continues to outpace supply. Industry analysts suggest that other major chipmakers may follow suit, potentially leading to higher costs for consumer electronics and server equipment globally.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "ac23d370"}, {"headline": "Trump Pauses Proposed Tariffs on Canada After Late-Night Negotiations", "summary": "US President-elect conomic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "6390b73c"}, {"headline": "Ebola Cases in Congo Surpass 5,000 as Death Toll Rises", "summary": "The Ebola outbreak in the Democratic Republic of Congo has reached 5,021 cases, with the death toll climbing to 2,378. Health officials warned that the virus is spreading to remote regions, making containment difficult. International aid agencies have called for urgent funding to deploy vaccines and medical supplies as the outbreak shows no signs of slowing down.", "category": "Health", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "e4acfa81"}, {"headline": "FSSAI Directs Major Brands to Drop 100% Natural Claims", "summary": "The Food Safety and Standards Authority of India has ordered brands like Amway and Emami to remove '100% natural' or '100% pure' claims from their products. The regulator found the labels misleading and in violation of food safety standards. Companies have been given a timeline to withdraw existing stocks and update their packaging to reflect accurate product descriptions.", "category": "Health", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134515", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 20-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134515"}], "article_id": "bee2da4e"}, {"headline": "Ramayana Film Aims to be India's Biggest Global Content Export", "summary": "A ₹4,000-crore production of the epic 'Ramayana' is being developed for a global audience, targeting over 50,000 screens worldwide. Directed by Nitesh Tiwari, the film seeks to transcend the Indian diaspora and compete with major Hollywood franchises. The two-part pr
