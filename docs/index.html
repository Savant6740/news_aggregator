illion filings recorded in the previous assessment year, indicating higher compliance.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135846", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135846"}], "article_id": "68375daa"}, {"headline": "India Seeks Predictable Rules in Brazil to Boost Pharma Exports", "summary": "India has requested more \"predictable\" regulatory rules from Brazil to facilitate pharmaceutical exports. During a bilateral meeting, both nations agreed to streamline certification processes to make Indian medicines more accessible in South American markets.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135846", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135846"}], "article_id": "90fe8bdb"}, {"headline": "Muthoot Finance to Merge with Subsidiary Muthoot Money", "summary": "Muthoot Finance has announced it will merge with its wholly-owned subsidiary, Muthoot Money, to consolidate its gold loan business. The merger aims to optimize resources and streamline operations across their combined national branch network.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135846", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135846"}], "article_id": "c59c7ab1"}, {"headline": "Human Accountability for AI is Non-negotiable: Atlassian CEO", "summary": "Atlassian CEO Mike Cannon-Brookes emphasized that \"human accountability\" must remain central to AI development. He stated that while AI can operate autonomously, people must remain responsible for the ethics and actions of the systems they build and deploy.", "category": "Tech th Jindal Appointed Chairman of JSW MG Motor", "summary": "Parth Jindal has been appointed as the Chairman of the JSW MG Motor joint venture. He will lead the company’s expansion plans in the electric vehicle segment, with a goal of capturing a significant share of the NEV market in India.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135846", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135846"}], "article_id": "00ecbf9c"}, {"headline": "Closing auction session volumes surge on NSE after MSCI rejig", "summary": "NSE's closing auction session (CAS) saw turnover surge to ~39,718 crore on Monday due to MSCI index rebalancing. This spike contrasts with typical CAS turnover, indicating significant passive fund activity, though it led to sharp price movements in many stocks.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "057ca096"}, {"headline": "Aurobindo Pharma eyes US growth with Advair generic launch", "summary": "Aurobindo Pharma entered the US inhalation market with a generic Advair Diskus, marking expansion into complex respiratory products. The company aims to build a new growth avenue beyond oral formulations.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "f0f47db4"}, {"headline": "PVR Inox board clears ~300 cr share buyback at ~1,450 per share", "summary": "The PVR Inox board approved a share buyback of up to 2,068,965 equity shares at ~1,450 apiece, for an aggregate amount of up to ~300 crore. This represents 4.09% of the company's equity share capital.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "ff167cae"}, {"headline": "Makaibari blends Darjeeling small growers into new Collective", "summary": "Luxmi Group's Makaibari tea estate is forming the Makaibari Collective, bringing together small-farmer cooperatives across Darjeeling. The model ensures fair pricing and profit-sharing for growers, with projected 20% annual growth.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "7e9d67dc"}, {"headline": "~10 trn VRRR draws tepid response amid ~5 trn liquidity flush", "summary": "Banks parked only ~3.84 trillion in RBI's VRRR auctions, less than half the ~10 trillion notified amount. This tepid response occurred despite surplus liquidity rising above ~5 trillion, due to uneven distribution among banks.", "category": "Economy", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "8a314b01"}, {"headline": "El Niño clouds food inflation risks, Ministry says", "summary": "The Finance Ministry noted that El Niño poses risks to food inflation and agricultural output, potentially constraining discretionary spending. Easing cost pressures and firm demand are expected to support activity.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "27e6b245"}, {"headline": "Power reforms need an urgent push, experts say", "summary": "Experts argue that India's power sector struggles due to failing state power regulators influenced by governments. Reforming regulatory independence and increasing discom agency over pricing are suggested solutions.", "category": "Economy", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "71728d59"}, {"headline": "Solar heat: A market waiting to be created", "summary": "The government's Surya Sarovar scheme aims to boost floating solar projects and domestic manufacturing. Challenges like high costs and viability need to be addressed for rapid scale-up.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "3b9c5e2d"}, {"headline": "Mills to malls: How Mumbai transformed post-liberalisation", "summary": "Mumbai's transformation from Bombay involved shifts in land use, repeal of ULC Act, and economic transition to services. Infrastructure development and new business districts also reshaped the city's landscape and culture.", "category": "India", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "0c402a4a"}, {"headline": "Chhattisgarh sees ~4 trn potential from auctioned mineral blocks", "summary": "Chhattisgarh estimates ~4 trillion revenue potential from 65 mineral blocks auctioned. Critical minerals like lithium, graphite, and rare earth elements are identified in Katghora and Bastar regions.", "category": "India", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "fbb2c41d"}, {"headline": "China calls dam claims ‘malicious speculation’", "summary": "China dismissed claims linking its Tibet hydropower projects to Nepal's flash flood disaster as 'malicious speculation'. Chinese foreign ministry spokesman Guo Jiakun rejected criticism about understated casualty figures.", "category": "World", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "90e6b18c"}, {"headline": "Japan seeks record defence budget amid PM's buildup plan", "summary": "Japan's Defence Ministry seeks a record ~$56 billion budget for FY28, including spending on unmanned platforms and AI integration. PM Takaichi plans a new military buildup later this year.", "category": "Politics", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "369a9174"}, {"headline": "Greece, Israel cement $3 bn defence system deal", "summary": "Israel signed a ~$3.5 billion defence export deal with Greece for a multilayered air defence system using Israeli technology. This marks the largest defence deal between the two Mediterranean countries.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "b2f6499b"}, {"headline": "China's factory activity slump eases in August", "summary": "China's factory activity improved in August with stronger demand, but remained in contraction at PMI 49.8. Services activity stayed weak, highlighting deepening economic imbalances.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "dd98667d"}, {"headline": "Huawei H1 profit declines 36% on rising costs, R&D spend", "summary": "Huawei's H1 net profit fell 36% to 23.81 billion yuan due to rising input costs and increased R&D spending. Revenue grew 9.6% to 467.82 billion yuan.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "1f01b7be"}, {"headline": "B’deshi aid giver wins Magsaysay awards", "summary": "Singaporean lawyer Tommy Koh and Bangladeshi activist Runa Khan were among the winners of the Magsaysay awards, recognized for their contributions to public service and humanitarian efforts.", "category": "Culture", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "321470c5"}, {"headline": "NCLT fails to reach majority on Chandra’s insolvency plan", "summary": "The NCLT bench failed to reach a majority verdict on Subhash Chandra's insolvency case due to a third member's differing opinion. The matter is now referred to the NCLT President.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "5be6d386"}, {"headline": "SEBI proposes stricter rules for social media platforms", "summary": "SEBI is proposing stricter rules for social media platforms, including KYC requirements for influencers and disclosure of sponsored content, to enhance transparency and investor protection.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "b0ac5083"}, {"headline": "Private banks’ deposit growth outpaces PSBs’ recovery", "summary": "Private banks saw deposit growth of 13.8% by June 2026, outpacing PSBs' 10.3%. Industry credit growth jumped 20% Y-o-Y, led by manufacturing and petroleum sectors, while gold loans moderated.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135882", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "article_id": "46a6c4d5"}, {"headline": "PM Modi meets Putin in Bishkek, calls for end to wars", "summary": "On the sidelines of the SCO summit, PM Narendra Modi and Russian President Vladimir Putin discussed the conflicts in West Asia and the Black Sea. Modi emphasized that the world must move 'from endless war to the end of war.' Putin highlighted a 2% growth in bilateral trade and a seven-fold increase in Indian students in Russia. Both looked forward to the upcoming BRICS summit in Delhi.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 10, "article_id": "4e7b9652"}, {"headline": "NCLT forms special bench for Subhash Chandra repayment plan", "summary": "The National Company Law Tribunal has constituted a new five-member special bench to reconsider the repayment plan for Zee Group founder Subhash Chandra. The bench will decide on the ₹6.5 crore repayment proposal after an appeals court agreed to hear lenders who had challenged a previous approval. The new panel replaces a three-member bench that had earlier cleared the plan.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "b9d6b976"}, {"headline": "Novak Djokovic knocked out of US Open in third round", "summary": "World No. 5 Novak Djokovic suffered his earliest Grand Slam exit since 2006, losing to 49th-ranked Mariano Navone in the third round of the US Open. Djokovic struggled with physical illness and admitted to playing \"terrible\" tennis during the five-set match. The 39-year-old's loss ends his bid for a record-extending 25th Grand Slam title and raises questions about his future in the sport.", "category": "Sports", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 9, "article_id": "d6cc62f4"}, {"headline": "ONGC plans 1 lakh crore investment for deepwater oil exploration", "summary": "Oil and Natural Gas Corporation (ONGC) intends to invest ₹1 lakh crore by 2030 to drill 87 deepwater and ultra-deepwater wells. Chairman Arun Kumar Singh noted that improved technology and government support are driving the initiative. Separately, ONGC Videsh is negotiating with Venezuela for operatorship of oil assets in the South American nation.", "category": "Business", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 8, "article_id": "70037e74"}, {"headline": "ChatGPT becomes first AI to face strict EU regulations", "summary": "The European Union has designated ChatGPT as a \"very large\" platform under its new AI Act, making it the first AI chatbot to face more stringent regulations. OpenAI must now comply with tougher safety standards, transparency requirements, and systemic risk assessments. The move aims to protect users from potential AI-generated harms and ensure data privacy across the 27-nation bloc.", "category": "Technology", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "85638928"}, {"headline": "Bihar and Jharkhand sign memorandum for Sone river water sharing", "summary": "Bihar and Jharkhand signed an MoU in Delhi to resolve a long-standing dispute over Sone river water. The agreement allocates 5.75 million-acre feet (MAF) to Bihar and 2 MAF to Jharkhand. Union Home Minister Amit Shah stated the pact would provide irrigation to lakhs of farmers and drinking water to large populations in both states, marking the fourth interstate water agreement this year.", "category": "Environment", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135880"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 7, "article_id": "760d1fc1"}, {"headline": "Lionel Messi bids farewell to international football after 207 games", "summary": "Argentina talisman Lionel Messi announced his retirement from international football. The 39-year-old ends his career with 207 games, 125 goals, one World Cup, and two Copa America titles. Messi stated he has given everything he had to his country and decided to step down as his physical limits were being reached. He is widely considered the greatest player of all time by fans and peers.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 10, "article_id": "3b8fd2ec"}, {"headline": "Eleven killed in massive explosion at Uttar Pradesh firecracker factory", "summary": "A massive blast at a firecracker factory in Kaushambi, Uttar Pradesh, killed 11 people and left several others injured. The explosion destroyed the facility and damaged four adjacent houses. Rescue operations involving the NDRF and SDRF are ongoing to reach those trapped under debris. Chief Minister Yogi Adityanath announced ₹2 lakh compensation for the families of the deceased.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 7, "article_id": "93c1b6b6"}, {"headline": "India rejects Hague court ruling on Indus Waters Treaty", "summary": "India has rejected the Permanent Court of Arbitration's ruling setting aside its decision to suspend the Indus Waters Treaty with Pakistan. New Delhi stated it never recognized the competence of the \"illegally-constituted\" court in The Hague. The government maintains that the dispute must be resolved through the specific mechanisms defined within the original treaty framework.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "12482e9c"}, {"headline": "Collegium recommends Sanjay Kumar Agrawal as Rajasthan HC Chief Justice", "summary": "The Supreme Court collegium has recommended Chhattisgarh High Court judge Sanjay Kumar Agrawal as the new Chief Justice of the Rajasthan High Court. This comes amid a row where SC Judge Sandeep Mehta accused Rajasthan's acting chief justice Sanjeev Prakash Sharma of \"corruption\" and \"favoritism.\" The move is seen as an attempt to stabilize the state's highest court following the controversy.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 7, "article_id": "f2db9df3"}, {"headline": "IMD forecasts below-normal rainfall for September after hottest August", "summary": "The IMD expects September rainfall to be 9% below the long-period average, following India's hottest August since 1901. El Niño conditions are likely to intensify, potentially leading to drier weather in many regions. As of August 31, monsoon rainfall was 14% below normal. Above-normal maximum temperatures are predicted for most of the country through the end of the monsoon season.", "category": "Environment", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 8, "article_id": "5d0e5872"}, {"headline": "Government defers Census in Manipur following demands for NRC", "summary": "The Union government has deferred the 2027 Census in Manipur following demands to first implement the National Register of Citizens (NRC). The decision was made in a review meeting chaired by Home Minister Amit Shah. Kuki and Naga groups had urged the government to identify illegal immigrants before conducting the population count to ensure demographic accuracy in the conflict-hit state.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 8, "article_id": "94aaf7dc"}, {"headline": "Three killed in fresh violence in Manipur's Kangpokpi district", "summary": "At least three people were killed after armed gunmen attacked a village and committed arson in Manipur’s Kangpokpi district. The incident marks the latest escalation in the ethnic conflict between Naga and Kuki communities. Security forces have been intensified in the area to prevent retaliatory attacks, while local leaders have urged for immediate central government intervention.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 7, "article_id": "de4aec53"}, {"headline": "Goa government defers anti-conversion bill as MLAs push back", "summary": "The Goa government will not table its proposed anti-conversion bill in the current assembly session after several BJP MLAs and opposition members opposed it. Critics argued the bill was unnecessary and could lead to communal disharmony. CM Pramod Sawant stated that the government would hold further consultations with all stakeholders before deciding on the next steps.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 6, "article_id": "911c82a8"}, {"headline": "U.S. and Iran trade strikes in first direct exchange in weeks", "summary": "The U.S. carried out airstrikes on Larak Island in the Strait of Hormuz, killing three people, to prevent Iran from planting mines. Iran retaliated with missile and drone attacks on U.S. bases in Jordan and the UAE. President Trump threatened to 'hit hard' if attacks continue, while Iranian President Pezeshkian called for dialogue and cooperation to resolve the escalating conflict.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 9, "article_id": "db3dd205"}, {"headline": "Nepal flood death toll nears 1,000; over 4,400 missing", "summary": "The death toll from devastating flash floods in Nepal has reached nearly 1,000, with over 4,400 people still unaccounted for. Rescuers are focusing on 11 hydropower sites where over 600 workers are believed to be trapped in tunnels. A 19-member forensic team from India has arrived in Kathmandu to help identify victims using DNA testing as recovery efforts continue.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "a1dea196"}, {"headline": "Indian Navy commissions indigenous diving support ship INS Nipun", "summary": "The Indian Navy has commissioned its locally built diving support ship, INS Nipun, at the Naval Dockyard in Mumbai. The vessel is equipped for deep-sea diving, underwater intervention, and submarine rescue operations. Built by Hindustan Shipyard Limited, the ship enhances India’s indigenous naval capabilities and its ability to conduct complex underwater missions in the Indian Ocean.", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 7, "article_id": "d1726d69"}, {"headline": "UP Police kill two suspects in singer's murder case", "summary": "Two suspects allegedly involved in the murder of a Haryanvi singer and a YouTuber were killed in a police encounter in Shamli, Uttar Pradesh. The duo opened fire when a special task force tried to intercept them on a highway. Both individuals had a bounty on their heads and were part of a criminal network active across several northern states. Two police officers were also injured.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135888"}], "importance": 5, "article_id": "0948d52f"}, {"headline": "John Ternus officially takes over as new Apple CEO", "summary": "John Ternus has officially succeeded Tim Cook as the CEO of Apple. Ternus, who joined Apple in 2001 and led hardware engineering, is credited with the successful transition to Apple Silicon. He takes over at a time when the company faces challenges from geopolitical tensions and the rise of generative AI. Ternus is expected to continue Apple's focus on hardware and software integration.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 9, "article_id": "86b86cb5"}, {"headline": "Thirteen Karnataka tourists missing after Nepal flash floods", "summary": "Thirteen residents of Karnataka remain untracked following the massive flash floods that hit Nepal. The state government has set up a 24-hour helpline and is coordinating with the Ministry of External Affairs to locate the missing persons. Most of the tourists were visiting pilgrimage sites in northern Nepal when the disaster struck, and communication has been hampered by damaged infrastructure.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}], "importance": 6, "article_id": "48bacd52"}, {"headline": "Food safety department seizes products worth ₹5.9L in raids", "summary": "The Karnataka Food Safety Department seized substandard food products worth ₹5.9 lakh during raids on 16 sweet manufacturing units. The products, including chakli and masala, failed to meet mandatory labeling and quality standards. Officials collected samples for laboratory testing and warned of strict action against units found using harmful ingredients or lacking proper hygiene.", "category": "Health", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 5, "article_id": "3cb42cce"}, {"headline": "TASL and Boeing to manufacture Javelin missiles in India", "summary": "Tata Advanced Systems Limited and Boeing have signed a MoU to manufacture Javelin missiles in India under the \"Make in India\" program. The missiles will be produced for the Indian Army and potentially for export. The deal is expected to create hundreds of jobs and significantly enhance India's defense manufacturing capabilities and self-reliance in advanced weaponry.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "02fd3ed8"}, {"headline": "Congress workers protest across states over FIR against Rahul Gandhi", "summary": "Congress party workers held massive protests in several states against the filing of an FIR against Rahul Gandhi for his recent political remarks. The party alleged the FIR is a politically motivated attempt by the ruling government to silence the opposition. Protesters in Delhi, Mumbai, and Bengaluru demanded the immediate withdrawal of the case and threatened to intensify their agitation.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 6, "article_id": "b940d087"}, {"headline": "More Muslim nations keen to join Pakistan-led defense pact", "summary": "Pakistan’s defense minister stated that several more Muslim-majority nations have expressed interest in joining its regional defense pact. The pact aims to enhance security cooperation, intelligence sharing, and joint military training to combat terrorism in the region. The expansion of the pact is seen as a move to strengthen Islamic unity and regional stability amid global challenges.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "0885cd79"}, {"headline": "Fifteen-year-old Vaibhav Sooryavanshi breaks 57-year-old Duleep Trophy record", "summary": "Young cricket prodigy Vaibhav Sooryavanshi has broken a 57-year-old record by becoming the youngest player to score a century in the Duleep Trophy at the age of 15. His brilliant knock has been hailed as a significant milestone in Indian domestic cricket. Sooryavanshi’s performance has already drawn comparisons to legendary players, and he is seen as a rising star for the future.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰¹⁰⁹²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135888"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135806"}], "importance": 7, "article_id": "e0c30342"}, {"headline": "Indian Economy Grows 7.8% in June Quarter Beating Expectations", "summary": "India's GDP expanded 7.8% in the April-June period, surpassing the RBI's 7% forecast and economist expectations of 7.4%. Growth was driven by manufacturing, services, and construction sectors, despite headwinds from West Asian conflict and global trade tariffs. Nominal GDP grew at 10.3%. Chief Economic Adviser V. Anantha Nageswaran noted continued resilience in domestic demand.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 10, "article_id": "c3798a31"}, {"headline": "HDFC Bank CEO Sashidhar Jagdishan to Step Down in October", "summary": "HDFC Bank shares fell 1.5% following the announcement that CEO Sashidhar Jagdishan will not seek an extension beyond his term ending October 26. The leadership change comes as the bank struggles with post-merger integration challenges, lower net interest margins, and regulatory concerns. The board is fast-tracking the search for a successor to lead India's largest private lender.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "1d06222f"}, {"headline": "ITC Infotech to Acquire 22.1% Stake in Happiest Minds Technologies", "summary": "ITC Ltd’s IT arm will acquire a 22.1% stake in Happiest Minds Technologies from founder Ashok Soota for ₹1,330 crore. The two firms will eventually merge to create a ₹7,000-crore IT services company with 19,000 employees. The deal aims to enhance ITC's digital and AI capabilities, making it the third listed entity in the ITC Group.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "7fb61f25"}, {"headline": "India’s Fiscal Deficit Reaches 26.8% of Annual Target by July", "summary": "Government data shows the fiscal deficit for April-July stood at ₹4.55 trillion, or 26.8% of the full-year budget estimate of ₹16.96 trillion. Capital expenditure reached ₹4.51 trillion, representing 36.9% of its annual allocation. Robust tax collections and non-tax revenues, including RBI dividends, have kept the fiscal position stable in the early months of FY27.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 8, "article_id": "69c87c73"}, {"headline": "NIIF Raises $2 Billion in First Close of Second Infrastructure Fund", "summary": "The sovereign-backed National Investment and Infrastructure Fund (NIIF) raised $2 billion from investors including AustralianSuper, CPP Investments, and Temasek. The fund targets a total of $3.2 billion to invest in energy, transport, and digital infrastructure. New focus areas include electric mobility and urban infrastructure themes.", "category": "Infrastructure", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "a7e66f5d"}, {"headline": "To go pan-India, GRT Jewellers to buy 74% in TBZ", "summary": "Chennai-based GRT Jewellers is set to acquire a 74% stake in Mumbai's Tribhovandas Bhimji Zaveri (TBZ) for ₹1,034 crore. The deal will give GRT access to TBZ’s 37 stores across India. GRT will also launch an open offer for the remaining 26% stake held by public and institutional shareholders.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 8, "article_id": "353c7e0a"}, {"headline": "PhonePe Launches UPI Payments for Feature Phones Without Internet", "summary": "Fintech major PhonePe has introduced 'UPI 123Pay' for feature phone users, allowing digital transactions without internet connectivity. This service targets India's estimated 200 million feature phone users. PhonePe is the first major third-party app provider to offer this capability, expanding the reach of the Unified Payments Interface.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 7, "article_id": "1339465c"}, {"headline": "SpiceJet Requests More Time from Delhi High Court for Maran Payment", "summary": "Cash-strapped SpiceJet has sought more time to deposit a ₹50 crore instalment owed to Kalanithi Maran and KAL Airways. The airline cited delays in receiving government credit support for the request. The long-standing legal dispute involves ₹144.5 crore in total dues following a 2015 ownership transfer. The court will hear the matter on September 21.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "d58b0ff6"}, {"headline": "Milky Mist Reports Tenfold Jump in Q1 Profit Amid Summer Demand", "summary": "Tamil Nadu-based Milky Mist Dairy Food Ltd reported a net profit of ₹64.6 crore for the June quarter, up from ₹6.5 crore last year. Revenue rose 43.6% to ₹973.4 crore, driven by record sales of yogurt, ice cream, and paneer during an extended summer season. The company recently commissioned a new cheddar cheese plant with 120 tonnes daily capacity.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "31bbd16d"}, {"headline": "Delhi High Court Orders Forensic Audit of Fortis Healthcare Transactions", "summary": "The Delhi High Court has ordered a forensic audit into transactions involving Fortis Healthcare and entities linked to former promoters Malvinder and Shivinder Singh. The audit aims to trace asset erosion following a ₹2,562-crore arbitration award won by Daiichi Sankyo in 2016. Investigators have six months to examine shareholding changes and pledged assets.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_01-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135837"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 7, "article_id": "959c15ca"}, {"headline": "Karnataka enforces CWMA order to release 9,000 cusecs to Tamil Nadu", "summary": "Karnataka informed the Supreme Court that it is complying with the CWMA directive to ensure a 9,000-cusec flow of Cauvery water to Tamil Nadu. While Karnataka claimed to have released excess water on some days, Tamil Nadu argued that the current flow does not address an accumulated shortfall of 17.604 tmc ft. The court has scheduled further hearings for September 15.", "category": "Environment", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 7, "article_id": "1da22ed4"}, {"headline": "Government notifies 1.28 lakh crore ISM 2.0 semiconductor scheme", "summary": "The IT Ministry has notified the second phase of the India Semiconductor Mission (ISM 2.0) with an outlay of ₹1.28 lakh crore. The scheme offers up to 40% fiscal support for silicon wafer fabs and up to 75% for R&D and talent development. Minister Ashwini Vaishnaw stated the goal is to make the global supply chain dependent on India's production and design capabilities.", "category": "Technology", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 01-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135806"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}], "importance": 9, "article_id": "7dd15263"}, {"headline": "Maruti Suzuki plans capex of ₹77,500 crore till FY31", "summary": "India's largest carmaker Maruti Suzuki will invest ₹77,500 crore by FY31 to expand production capacity and introduce seven new models. The plan aims to boost its SUV market share and accelerate its transition to green technologies, including E20-compatible engines and carbon reduction measures at its plants.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "1dbfa234"}, {"headline": "Kharif sowing window closes with lower overall acreage", "summary": "The kharif sowing season has concluded with a 0.4% decrease in total area to 1,104 lakh hectares. While pulses and coarse cereals saw some growth, a significant decline in paddy and sugarcane acreage remains a concern for food production and inflation targets in the coming months.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135829"}], "importance": 8, "article_id": "370cbb45"}, {"headline": "Government notifies ₹1,27,500 crore Semicon 2.0 scheme", "summary": "The Centre has officially launched the ₹1.27-lakh crore Semicon 2.0 program to boost India's semiconductor manufacturing ecosystem. The scheme offers 50% fiscal support for fabs and aims to create up to 60,000 direct jobs, focusing on expanding the supply chain and reducing dependence on imports.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "5dc27c04"}, {"headline": "Gujarat CM invites global businesses to invest in State", "summary": "Gujarat Chief Minister Bhupendra Patel invited investors to the state for the upcoming Vibrant Gujarat Global Summit. He highlighted the state's stable policy environment and growth opportunities in sectors like green energy, semiconductors, and advanced manufacturing to attract more investment.", "category": "Politics", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "9b92cc2f"}, {"headline": "NCDEX launches rainfall index futures for Chennai", "summary": "The National Commodity and Derivatives Exchange (NCDEX) has launched rainfall index futures for Chennai. The product is designed to help businesses in sectors like agriculture and retail manage financial risks associated with the variability of the North-East monsoon.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "4c11027b"}, {"headline": "Bank of Baroda to hire 2,482 officers for local branches", "summary": "Bank of Baroda announced plans to recruit 2,482 officers fluent in local languages across various states. The recruitment drive is aimed at improving customer service and communication in rural and semi-urban areas to better serve the bank's growing regional customer base.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "a8d7a4b6"}, {"headline": "Zomato shuts Hyderabad support center, lays off 250 staff", "summary": "Zomato is closing its customer support center in Hyderabad and laying off approximately 250 employees. The company stated the move is part of a restructuring effort to consolidate its customer service operations at its Gurugram headquarters for better efficiency.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135829"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "1364d380"}, {"headline": "IMD Predicts Below-Normal Monsoon Rainfall in September", "summary": "The India Meteorological Department expects rainfall in September to be less than 91% of the long-period average. El Nino conditions and a neutral Indian Ocean Dipole are cited as factors likely to affect the late monsoon stage, impacting Kharif crops and water reservoir levels.", "category": "Environment", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_01-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135846"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "f866a6c0"}, {"headline": "7.8% Q1 GDP growth beats expectations amid global headwinds", "summary": "India's economy grew at a robust 7.8% in Q1 FY27, surpassing forecasts despite West Asia crisis effects. Strong manufacturing and services sectors, coupled with robust investment demand (GFCF up 11.9%), drove the growth. Agriculture and allied sectors' GVA growth slowed to 3.6%.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 10, "article_id": "7fa81fe2"}, {"headline": "Air India faces turbulence on UK route after AI171 crash", "summary": "Air India struggles to fill planes on the India-UK route post-AI171 crash, with passenger traffic declining faster than seat capacity. Seat capacity fell 3.9% in August and 3.5% in September, while traffic dropped 12% and 19.2% respectively.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "81fe2842"}, {"headline": "eCV makers in quandary as localisation norms kick in", "summary": "Electric commercial vehicle makers face a quandary as localisation norms under the PM eDRIVE scheme take effect. Siam seeks a seven-month extension, citing disruptions in rare earth magnet supplies due to China's export curbs.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "2c5cce58"}, {"headline": "Gautam Adani urges rating agencies to develop new credit framework", "summary": "Gautam Adani urged rating agencies to develop a new credit framework for \"integrated platform infrastructure,\" emphasizing wider lenses to capture ecosystem multipliers, not lower standards. India needs wider lenses, he stated.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "742501f9"}, {"headline": "ONGC to pump ~1 trn into deepwater exploration", "summary": "ONGC plans ~1 trillion capex over five years for deepwater exploration, targeting 87 wells. The company seeks domestic output growth and is considering overseas ventures.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "74a36e5e"}, {"headline": "RBI net short dollar position surges to record $136.77 bn", "summary": "The RBI's net short dollar position in forwards surged to a record $136.77 billion by July-end from $103.33 billion in June-end. This surge is attributed to FCNR(B) flows and likely RBI interventions.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "7cde6142"}, {"headline": "GVA growth of agri, allied sectors slows to 3.6%", "summary": "Agriculture and allied activities clocked a GVA growth of 3.6% in Q1 FY27, down from 4.4% last year, possibly due to low production in livestock sectors. Full-year estimates project 3.5-4% GVA growth for the sector.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "6fc0a930"}, {"headline": "Centre spends 37% of capex target in four months", "summary": "The Centre spent 37% of its ~12.22 trillion capex target in the first four months of FY27, spending ~4.51 trillion, a 30% Y-o-Y jump. Fiscal deficit remained at ~4.55 trillion, 27% of the BE.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "0f007872"}, {"headline": "Reaping benefits of reforms in very uncertain global environment: CEA", "summary": "Chief Economic Advisor V. Anantha Nageswaran stated India's economy shows resilience due to reforms, despite global uncertainties. He cited strong manufacturing, services, and favourable domestic demand as key drivers.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "ec5fa2a8"}, {"headline": "PM talks Strait, seafarer safety at SCO meet", "summary": "PM Modi emphasized seafarer safety and freedom of navigation in the Strait of Hormuz at the SCO summit. He urged Russia to end the Ukraine conflict and discussed regional trade with Iran and Kyrgyzstan.", "category": "Politics", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "6a764ec3"}, {"headline": "Mid, smallcaps notch 5th straight monthly gain; benchmarks in red", "summary": "Mid and smallcap indices gained for the fifth consecutive month in August, while benchmarks Nifty and Sensex ended in the red. This resilience in the broader market was also seen in a strong IPO pipeline.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "62b4c6ab"}, {"headline": "Odisha’s first major shipbuilding cluster gets Centre’s nod", "summary": "Odisha's first major shipbuilding cluster, NSHIPOL, received in-principle approval under the Shipbuilding Development Scheme. The ~24,700 crore project aims to create a modern shipbuilding and heavy industries ecosystem.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "eb541d25"}, {"headline": "Power, defence, data centres to drive capital goods order inflow", "summary": "Capital goods sector shows strong growth prospects driven by T&D, data centres, and defence. Private sector orders form 40% of the book, with ABB, Siemens, Cummins, and L&T among key players to watch.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "7a4c6416"}, {"headline": "Mutual funds’ overseas equity holdings rose 37.5% in FY26: RBI", "summary": "Indian MFs' overseas equity holdings grew 37.5% Y-o-Y to ~93,602 crore by March-end, driven by market rallies and investor interest. The US market dominated holdings, accounting for 63.5%.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "9ba88b7e"}, {"headline": "ICICI Bank’s mcap gap with HDFC narrows to 11-yr low", "summary": "ICICI Bank's market capitalization is closing in on HDFC Bank's, with the gap narrowing to ~49,167 crore, the lowest since January 2015. This shift reflects stronger annual price growth for ICICI Bank.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "efe7f288"}, {"headline": "NCDEX launches weather derivatives for N-E monsoon", "summary": "NCDEX launched RAINCHNNAI, a rainfall-based weather derivatives contract for the North-East monsoon, following the success of RAINMUMBAI. The contract aims to help manage rain-fall-linked risk.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "f27926ff"}, {"headline": "Bosch’s Q1 beat puts earnings in driving seat", "summary": "Bosch reported strong Q1 FY27 results with 22% revenue growth, driven by automotive segments. Brokerages raised FY27 earnings estimates, but the stock trades at a premium valuation.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "197f2c0f"}, {"headline": "US, Iran trade fire for first time in a month", "summary": "US forces struck Iranian launchers on Larak Island, leading to two deaths, after Iran allegedly attacked US bases in Jordan. President Pezeshkian seeks a negotiated solution amid renewed hostilities.", "category": "World", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 9, "article_id": "c9cc4475"}, {"headline": "Biden administration imposes new sanctions on Iran", "summary": "The Biden administration is preparing to unveil new secondary sanctions targeting Iran's trading partners, aiming to pressure the regime. Treasury Secretary Scott Bessent referred to this as 'Operation Economic D-Day'.", "category": "Politics", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "2bc7981b"}, {"headline": "High-yield bonds: Understand risks before chasing returns", "summary": "High-yield bonds offer double-digit returns but carry credit and liquidity risks. Investors should demand adequate compensation, diversify portfolios, and consider holding bonds until maturity.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "f5bcbaa8"}, {"headline": "September calendar: Key TDS, advance tax, and audit deadlines", "summary": "September brings key tax deadlines, including TDS/TCS payments by the 7th, advance tax installments by the 15th, and tax audit reports by the 30th for specific taxpayer categories.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "ea58f0d8"}, {"headline": "Oil India Green Energy Ltd signs MOUs with Haryana Municipalities", "summary": "OIL Green Energy Limited signed MOUs with four Haryana Municipalities for integrated CBG and Waste-to-Energy projects. The facilities will process 5,000 tonnes of waste daily, producing 70-75 TPD of CBG and 50 MW green power.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 8, "article_id": "a6e1bd50"}, {"headline": "NHPC hosts 50th Annual General Meeting", "summary": "NHPC held its 50th AGM, considering a final dividend of ₹0.21 per equity share for FY26. CMD Bhupender Gupta highlighted the growing importance of hydropower for grid balancing.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 7, "article_id": "ef55a521"}, {"headline": "Public Notice: Loss of Legal Documents by VECV", "summary": "VECV reported loss of original property documents and claims title to a 28,950 sq. meter property in Thane, Maharashtra. Public is requested to provide any information regarding the lost documents.", "category": "Law", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "8761fcc5"}, {"headline": "TENDER NOTICE: Consultancy services for DPR for road projects", "summary": "The Jharkhand Road Construction Department invites bids for consultancy services for a DPR for road projects around Dhurwa Dam and connecting roads, with a completion period of 45 days.", "category": "Infrastructure", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "33d3bd7c"}, {"headline": "Mukat Pipes Limited: Public Notice for 39th AGM", "summary": "Mukat Pipes Limited will hold its 39th AGM on Sept 28, 2026, via VC/OAVM. Annual Report and AGM Notice sent electronically; physical copies available on request.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "b350dcc6"}, {"headline": "Vidhi Specialty Food Ingredients Limited: Notice of 33rd AGM", "summary": "Vidhi Specialty Food Ingredients Limited will hold its 33rd AGM on Sept 24, 2026, via VC/OAVM. Annual Report sent electronically; physical copies available on request.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "a7f7a4b2"}, {"headline": "IRIS RegTech Solutions Limited: Special Window for Transfer/Dematerialisation", "summary": "IRIS RegTech Solutions Limited opened a Special Window for Transfer and Dematerialization of Physical Securities from Feb 5, 2026, to Feb 4, 2027, for eligible investors.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page": 27, "telegram_url": "https://t.me/c/1877410077/135882"}], "importance": 6, "article_id": "437b0f41"}, {"headline": "Twamev Construction and Infrastructure Limited: Notice of 61st AGM", "summary": "Twamev Construction and Infrastructure Limited will hold its 61st AGM on Sept 22, 2026, via VC/OAVM. Annual Report and AGM Notice sent electronically; physical copies available on request.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 01-09-2026.pdf", "page":
