s amid the leadership transition.", "category": "Business", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "b1ee20d0"}, {"headline": "Ali Fazal to headline Richie Mehta’s next", "summary": "Ali Fazal will star as Dr Aziz in Richie Mehta's five-part adaptation of E M Forster's A Passage to India, filming in India. The cast includes Naseeruddin Shah and Shahana Goswami.", "category": "Culture", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144071", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144071"}], "article_id": "8bc7ed5d"}, {"headline": "Classified US National Security Network Hit by Major Tech Outage", "summary": "An internal National Security Agency (NSA) network used for classified communications, NSANet, went offline on Tuesday. The agency described the disruption as a result of routine maintenance. President Donald Trump downplayed the incident, stating such problems are inevitable. While internal systems were affected, the NSA claimed mission-critical capabilities remained fully operational.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "99ac7f2d"}, {"headline": "Bishnoi Gang Member Harichand Jat Arrested in California", "summary": "US Immigration and Customs Enforcement (ICE) arrested Lawrence Bishnoi gang member Harichand Jat, alias Harry Boxer, in California on November 6. US authorities revealed Jat was previously arrested in October 2024 for illegal entry but released without vetting. Indian agencies allege Jat coordinated criminal activities, including extortion and threats against celebrities, from overseas.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "144a1d34"}, {"headline": "SC to Hear Petition Against Italian Politician Over Political Slogan", "summary": "The Supreme Court will hear a plea seeking action against Italian political official Giacomo Filibeck for raising the slogan 'Vote Chor, Gaddi Chhod' at an event in Telangana. The petitioner alleges Filibeck interfered in India’s democratic system. The plea also demands an apology from the Telangana government for organizing the Bharat Summit where the remarks were made.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "2bba47a2"}, {"headline": "MCD Estimates 2,000 Years for Comprehensive Delhi Building Audit", "summary": "The Municipal Corporation of Delhi (MCD) informed the Centre that a structural and fire safety audit of 4 million buildings would require 4 million man-hours. With 500 personnel, the preliminary survey alone would take over four years. The report follows a Home Ministry directive seeking a safety roadmap after recent building collapses in the capital.", "category": "Infrastructure", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "bd7f32dd"}, {"headline": "RSS Chief Mohan Bhagwat Begins Three-Day Visit to Manipur", "summary": "Rashtriya Swayamsevak Sangh (RSS) chief Mohan Bhagwat arrived in Imphal for a three-day organizational visit. Bhagwat will review the Sangh's activities, centenary celebrations, and social initiatives. The visit also focuses on service efforts for communities affected by ongoing violence in the state. He last visited Manipur in November 2025.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "96eefc05"}, {"headline": "Three Workers Killed in Conveyor Belt Collapse at NTPC Jharkhand", "summary": "A collapse of an under-construction conveyor belt structure at NTPC’s North Karanpura project in Chatra district killed three workers and injured two others on Wednesday. The accident occurred when a counterweight broke during construction. Police suspect a design flaw and have initiated a probe. The deceased were identified as Raju Soni, Bablu Singh, and Baleshwar Paswan.", "category": "India", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "979ad3cc"}, {"headline": "Voyager 1 Reaches Historic One Light-Day Milestone from Earth", "summary": "Nasa’s Voyager 1 probe has reached a distance of one light-day from Earth, approximately 26 billion kilometres away. Launched in 1977, it is the most distant human-made object. Despite its age, recent power-saving measures may allow the spacecraft to continue communicating with Earth for another three to four years as it travels through interstellar space.", "category": "Science", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "5b7c7812"}, {"headline": "Delhi Police Seek Rerouting of Transit Traffic via Google Maps", "summary": "Delhi Traffic Police plan to request Google Maps to stop showing the capital as a preferred route for vehicles not destined for the city. The move follows CAQM directives to reduce vehicular pollution and congestion. Authorities want transit traffic diverted to peripheral corridors. Meetings with traders are also underway to implement one-way traffic in major markets.", "category": "Infrastructure", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "331e27f9"}, {"headline": "Delhi CM Warns Against Negligence as Air Quality Remains 'Poor'", "summary": "Delhi Chief Minister Rekha Gupta warned civic agencies against negligence as the city's AQI reached 232, remaining in the 'poor' category for the fourth day. Civic bodies were directed to intensify mechanized sweeping, road washing, and water sprinkling. The Air Quality Early Warning System has forecasted a deterioration to 'very poor' air quality by Friday.", "category": "Environment", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "eba991b1"}, {"headline": "Parallel Electricity Distribution Licence Put on Hold in Haryana", "summary": "The Appellate Tribunal for Electricity (APTEL) refused immediate relief to Eleven Power Pvt Ltd regarding a stay on its parallel-distribution licence in Gurugram and Nuh. The Haryana government exercised special powers to halt the licence in public interest following worker strikes. APTEL has directed respondents to file replies within two weeks.", "category": "Business", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "677a0633"}, {"headline": "Allahabad HC Freezes New Construction at Jaypee Greens Golf Course", "summary": "The Allahabad High Court ordered an immediate freeze on all new construction and third-party rights across 236.87 acres at Jaypee Greens Golf Course in Greater Noida. The order follows a petition by members alleging the land, meant for a golf course and clubhouse, was being misused for residential villas and condominiums. The court will hear the matter again on December 7.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "50d407b1"}, {"headline": "Law Student Arrested for Stealing ₹30 Lakh from Grandfather", "summary": "A 22-year-old law student, Abhishek Raghav, and his friend were arrested for siphoning nearly ₹30 lakh from his 87-year-old grandfather’s bank account. The accused allegedly used the funds for luxury trips to Manali and Nainital and to buy a car. The victim, a retired Navy official, discovered the fraud after noticing unauthorized transfers over a seven-month period.", "category": "Law", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "d10ff844"}, {"headline": "Sarai Kale Khan Station Slated for Major Commercial Development", "summary": "The NCRTC has invited bids to develop 21,063 square metres of buildable space above the Sarai Kale Khan Namo Bharat station. The project will utilize 'air-rights' to create hotels, offices, and retail outlets. The development aims to transform the transit hub, which records the highest footfall on the Delhi-Meerut RRTS corridor, into a mixed-use commercial destination.", "category": "Infrastructure", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "0b476c59"}, {"headline": "Delhi Reconstitutes Councils for Five Language Academies", "summary": "The Delhi government appointed 101 members to the governing councils of five language academies to promote the capital’s linguistic heritage. Academies for Hindi, Sanskrit, Punjabi, Maithili-Bhojpuri, and Garhwali-Kumaoni-Jaunsari were reconstituted. Art and Culture Minister Kapil Mishra will chair the councils, which include scholars and cultural figures serving two-year terms.", "category": "Culture", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "5e4f3afa"}, {"headline": "DDA and INTACH to Digitize Access to 1,500 Heritage Sites", "summary": "The DDA and INTACH will document 1,500 heritage structures in Delhi to improve public accessibility. The initiative includes installing QR codes and information plaques at lesser-known monuments and historic bazaars. The project aims to create a comprehensive digital e-book and interactive maps to support conservation and cultural tourism under the Master Plan for Delhi 2047.", "category": "Culture", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "86fe3edc"}, {"headline": "New Mental Health Policy for Delhi Schools to Address Crisis", "summary": "The Delhi government will launch a mental health policy for schools and higher educational institutions on November 19. The policy mandates one counsellor for every 500 students and establishes a six-level crisis response mechanism. Schools must keep students at immediate risk of self-harm under adult supervision and are prohibited from promising secrecy regarding safety concerns.", "category": "Education", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "7ea48313"}, {"headline": "Satish Gujral Murals to be Relocated to Jantar Mantar Area", "summary": "Iconic ceramic-tile murals created by artist Satish Gujral in 1968 for Shastri Bhawan are set to be relocated to a site near Jantar Mantar. The NDMC and National Gallery of Modern Art (NGMA) are finalizing the installation near Palika Kendra. The 73-foot-tall murals, featuring abstract motifs and tribal art, were removed to ensure their preservation and public accessibility.", "category": "Culture", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "406d8825"}, {"headline": "Yogi Adityanath Defends Slogan as Pitch for Social Caution", "summary": "UP Chief Minister Yogi Adityanath defended his 'batoge toh katoge' (if divided, you will suffer) slogan, stating it is about remaining alert to lawlessness. Addressing an event in Lucknow, he urged Gen Z and Gen Alpha to learn about the state's past riots and insecurity. He claimed his 80:20 political formula represents those supporting development versus those supporting rioters.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "b902c248"}, {"headline": "UP Cabinet Approves Ordinance to Defer Panchayat Elections", "summary": "The Uttar Pradesh cabinet promulgated an ordinance to extend the tenure of panchayat administrators by six months, effectively deferring elections. Finance Minister Suresh Khanna said the amendment to the UP Panchayat Raj Act allows more time for preparations. The move follows a previous High Court directive to hold local body elections within a three-month timeframe.", "category": "Politics", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "8f9da3cd"}, {"headline": "Centre Notifies New Prison Regulations for Andaman and Nicobar Islands", "summary": "The Centre has notified the Andaman and Nicobar Islands Prisons and Correctional Services Regulation, 2026, replacing three colonial-era laws from 1894, 1900, and 1950. Based on a 2023 model act, the new law incorporates safeguards against discrimination and provides a three-year prison term for inmates caught using mobile phones or other prohibited communication devices.", "category": "Law", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "1cba8ad2"}, {"headline": "ICMR Launches Syndromic Surveillance Grid to Track Outbreaks", "summary": "The Indian Council of Medical Research (ICMR) has launched a syndromic surveillance initiative across 70 laboratories to provide early warnings for infectious disease outbreaks. The network will use real-time health data to detect pathogens causing fever, respiratory illness, and diarrhoeal disease. The system aims to determine the speed and size of potential outbreaks rapidly.", "category": "Health", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "6047afbc"}, {"headline": "Madhya Pradesh Scraps Two-Child Norm for Government Jobs", "summary": "The Madhya Pradesh cabinet, chaired by CM Mohan Yadav, approved the removal of the two-child rule for government employment. The decision ends a 25-year-old provision and withdraws pending disciplinary proceedings against employees for having more than two children. The cabinet also cleared investment proposals worth ₹70,650 crore across various sectors including pharma and solar energy.", "category": "Politics", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "cf351d15"}, {"headline": "Former TN Minister Named in ₹1,427-Crore Sand Mining Case", "summary": "The Directorate of Vigilance and Anti-Corruption has named former Tamil Nadu minister Durai Murugan and several officials in an illegal sand mining case. The FIR alleges collusion resulted in a ₹1,427-crore loss to the exchequer between 2021 and 2024. The probe covers 28 quarry sites where mining was reportedly conducted at the instance of Murugan, a senior DMK leader.", "category": "Law", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "36870498"}, {"headline": "Global South Rejects Burden of Historical Emissions at COP31", "summary": "Environment Minister Bhupender Yadav, delivering India’s national statement at COP31 in Antalya, asserted that the Global South cannot bear the burden of addressing consequences of historical emissions. He called for climate action rooted in equity and the principle of 'Common But Differentiated Responsibilities'. Yadav also opposed unilateral trade measures penalized under climate guises.", "category": "Environment", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "f2f489e3"}, {"headline": "Princess Catherine Wears Indian Designer at Earthshot Prize Awards", "summary": "UK’s Princess Catherine (Kate Middleton) wore a vermilion-red Anarkali by Delhi-based designer Mahima Mahajan at the Earthshot Prize Awards in Mumbai. The outfit, modified with a trail and glass beads for sustainability, was paired with Queen Elizabeth II’s emerald jewels. Prince William accompanied her in a black velvet bandhgala designed by Manish Malhotra.", "category": "Culture", "page": 25, "importance": 4, "telegram_url": "https://t.me/c/1877410077/144059", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/144059"}], "article_id": "ab593699"}, {"headline": "Electric trucks gain traction in India driven by corporate adoption", "summary": "Electric trucks are seeing increased adoption in India, driven by large enterprises like Amazon and UltraTech Cement. Factors like range constraints, high costs, and infrastructure are being addressed. Corporate ESG goals and lower running costs offset upfront prices, making them viable for sectors like cement and ports. Challenges remain in scaling local manufacturing and expanding charging networks.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "98581182"}, {"headline": "Indian economy shows warning signs in October; producer segment resilient", "summary": "India's economic scorecard deteriorated in October, with 10 of 16 high-frequency indicators below their one-year averages. Pockets of resilience are in the producer economy, particularly credit growth. However, retail inflation breached the 6% tolerance limit. Challenges ahead include moderating GDP growth in H2 FY27 due to adverse rainfall and rising inflation.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "b3b50cb7"}, {"headline": "Indian companies stage broad earnings recovery in Q2 FY27, strongest in three years", "summary": "Indian companies saw a broad earnings recovery in Q2 FY27, with aggregate net profit up 30% year-on-year, the strongest in three years. This was driven by robust sales and a favourable statistical base. However, profit margins are retreating from last year's highs due to rising costs, raising concerns about sustained momentum.", "category": "Business", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "cc56bcf7"}, {"headline": "Soya bean oil's share rises in India's edible oil import mix", "summary": "India's soya bean oil imports are rising, increasing its share in the edible oil import mix. This shift is influenced by competitive pricing, disruptions in Black Sea supplies, and diversification efforts. Crude palm oil remains the largest import, but soya bean oil shows significant growth.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "3f9fc0f5"}, {"headline": "Govt better its rural worker grievance redressal framework", "summary": "The government has launched a new grievance redressal framework under the Viksit Bharat–Guarantee for Rozgar and Ajeevika Mission (Gramin) Act, 2025. This aims to ensure timely hearing and resolution of complaints from rural workers regarding job cards, wages, and other entitlements.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "dadafeec"}, {"headline": "Centre eases export support rules, ups aid for small exporters", "summary": "The commerce ministry has expanded eligibility for export support programs, allowing more small and medium exporters to claim reimbursements for trade promotion, quality certifications, and logistics costs. This aims to improve competitiveness and market access for Indian MSMEs.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "c479b30b"}, {"headline": "India calls for equitable global climate action at COP31", "summary": "India urged equitable global climate action at COP31, stating it's unjustified to expect developing nations to bear the burden of historical emissions. It stressed that climate cooperation must be based on equity, differentiated responsibilities, and respective capacities.", "category": "Environment", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "3525d051"}, {"headline": "Bhim app focuses on repeat users over market share", "summary": "Bhim app is prioritizing building a base of active, repeat users rather than chasing market share from rivals like PhonePe and Google Pay. It aims for gradual growth by focusing on products that encourage repeat use, including NPS investments and RuPay credit card payments.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "fa89f497"}, {"headline": "NSE takes equity options playbook to commodity F&O", "summary": "The National Stock Exchange is adopting a playbook similar to equity derivatives for commodity derivatives, specifically revising expiry dates for crude oil options. This move aims to attract more participants and increase turnover in the commodity derivatives market.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144023", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144023"}], "article_id": "f04f8ce5"}, {"headline": "Cummins faces margin compression due to cost inflation and project execution", "summary": "Cummins India is experiencing steep margin compression in Q2 FY27 due to severe cost inflation in raw materials and higher freight rates. Delayed pass-through of costs and execution of older projects at fixed prices have impacted gross and EBITDA margins. Price hikes are being implemented to mi mary": "Insights into startup funding ecosystem reveal growing investor interest in innovative ventures. Discusses venture capital trends, government support for startups, and emerging sectors attracting significant capital, fostering a dynamic entrepreneurial landscape.", "category": "Business", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144029", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_19-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/144029"}], "article_id": "77b9383b"}, {"headline": "Public Service Delivery Improvements", "summary": "Improvements in public service delivery rolled out, leveraging technology for greater efficiency and citizen convenience. Details initiatives like online portals, expedited application processing, and feedback mechanisms for enhanced public interaction with government.", "category": "Politics", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144029", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_19-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/144029"}], "article_id": "0d6c0c37"}, {"headline": "Last Active Local LeT Commander Killed in Kashmir Encounter", "summary": "Security forces neutralised Mohammed Lateef Bhat, the last known active local recruit of Lashkar-e-Taiba in the Kashmir Valley, during a 12-hour operation in Kulgam. Bhat was linked to multiple attacks, including the killing of migrant workers and security personnel. Union Home Minister Amit Shah praised the synergy between the J&K Police, Army, and CRPF in the coordinated mission.", "category": "India", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144071"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 9, "article_id": "9262cedf"}, {"headline": "PM Modi Urges National Campaign to Eradicate Drug Abuse", "summary": "Prime Minister Narendra Modi chaired a meeting of the council of ministers, calling for a concerted effort to eliminate drug addiction. Comparing the challenge to the fight against left-wing terrorism and poverty, Modi emphasized that no effort should be spared to protect the youth. The government has set a target to create a 'Drug-free India' by December 31, 2029.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 9, "article_id": "63cbbdd0"}, {"headline": "Defence Ministry seeks 20% hike in Budget for FY28", "summary": "The Ministry of Defence has requested a 20% increase in its budget allocation for FY28 to fund major acquisitions, including Rafale fighter jets and submarines. The ministry is aiming for a budget of approximately ₹7.84 lakh crore to cover previous contract commitments and support modernization. A significant portion of the hike is intended for private sector production projects.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144043"}], "importance": 9, "article_id": "a773cb10"}, {"headline": "Sarvam AI launches Token Factory for inference as a service", "summary": "AI startup Sarvam has launched Token Factory, a platform offering inference-as-a-service for Indian enterprises. The service allows developers to access global AI models through India-hosted infrastructure, focusing on cost-efficiency and local-language support. Sarvam claims to offer competitive pricing, starting at ₹14 per million input tokens for various enterprise models.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "importance": 7, "article_id": "df2078c3"}, {"headline": "Goldman Sachs upgrades India and sets Nifty target of 28,500", "summary": "Goldman Sachs has upgraded India to ‘Overweight’ in its Asia-Pacific portfolio, projecting a Nifty target of 28,500 by the end of 2027. The brokerage cited India’s resilient earnings growth and potential for a private capex recovery as key drivers. It highlighted that India is well-positioned to benefit from global AI investment and remains a preferred market for long-term growth.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144043"}], "importance": 8, "article_id": "4d59d491"}, {"headline": "Delhi Court Orders Framing of Charges in NEET Paper Leak Case", "summary": "A Delhi court ordered the framing of charges against 14 individuals in the NEET-UG 2026 paper leak case. The court rejected arguments that the National Testing Agency (NTA) is not a public body, noting it receives central government funding. Charges include criminal conspiracy and cheating. The trial is scheduled to proceed on a day-to-day basis starting November 25.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 8, "article_id": "ac92046f"}, {"headline": "Azam Khan Released from Jail After SC Refuses Stay on Bail", "summary": "Samajwadi Party leader Azam Khan walked out of Ghaziabad’s Dasna jail on Wednesday after the Supreme Court refused to stay his interim bail in a money laundering case. The Allahabad High Court had granted relief, citing potential procedural lapses in his arrest. The Enforcement Directorate's challenge to the high court order will be heard by the top court on Thursday.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 7, "article_id": "12cf955d"}, {"headline": "SC Seeks Centre's Response on Delay in Judge Appointment Rules", "summary": "The Supreme Court issued notices to the Centre and the top court’s Secretary General regarding a petition questioning the delay in finalising the amended Memorandum of Procedure (MoP). The MoP governs the appointment and transfer of constitutional court judges. The NGO petitioner alleges a lack of transparency and objectivity in the current Collegium-led selection process.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 7, "article_id": "6de152ed"}, {"headline": "Bengal CM Vows to Cancel All Fake ST Certificates", "summary": "West Bengal Chief Minister Suvendu Adhikari stated that his government would protect tribal rights and cancel all fake Scheduled Tribe certificates issued in the state. Addressing a Janjatiya Gaurav Diwas event, he accused the previous TMC government of diluting safeguards for the community and promised to maintain proper reservation in government jobs.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 7, "article_id": "073f5f0c"}, {"headline": "Rahul Gandhi Criticizes Indian Economy and Education System During US Visit", "summary": "Leader of Opposition Rahul Gandhi, speaking at Columbia University in New York, alleged that India is facing an economic disaster characterized by massive unemployment. He criticized the central government’s 'Make in India' and 'Startup India' initiatives as failures and highlighted systemic issues in the education sector. The BJP responded by accusing Gandhi of undermining India's image.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 8, "article_id": "fcfe2245"}, {"headline": "Nike Aims to Triple India Sales Within Five Years", "summary": "Nike Global COO Venkatesh Alagirisamy announced plans to triple sales in India over the next five years, focusing on a younger consumer base. The strategy includes localized pricing, innovation, and an athlete-first focus. Nike will launch a new cricket footwear line and partner with the Mumbai Indians to capitalize on the country's growing sports and fitness culture.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}], "importance": 7, "article_id": "6f97c49d"}, {"headline": "India Imposes 162.5% Effective Duty on Bulk Scotch Imports", "summary": "In a dispute linked to the India-UK trade pact, Indian authorities are now charging an effective duty of 162.5% on bulk Scotch concentrates. Investigators argue companies are using incorrect customs classifications. The standoff has left thousands of litres of Scotch stuck at ports, impacting major firms like Pernod Ricard and Diageo despite the trade agreement's intended 75% tariff.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 7, "article_id": "e3cbc000"}, {"headline": "Bombay High Court Quashes Prosecution Sanction Against Chanda Kochhar", "summary": "The Bombay High Court set aside the 2023 sanction granted by ICICI Bank's board to prosecute former CEO Chanda Kochhar for alleged loan irregularities. Justice Milind Jadhav ruled the board was not the competent authority to grant the sanction, stating statutory approval rests with the Reserve Bank of India. The ruling impacts the CBI’s ongoing case regarding Videocon Group loans.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144043"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144071"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/144023"}], "importance": 8, "article_id": "f1e28810"}, {"headline": "Physical AI Startup Humyn Labs Raises $47 Million", "summary": "Humyn Labs, founded by Manish Agarwal and Ishank Gupta, raised $47 million in a round led by Accel. The startup focuses on data infrastructure for physical AI and robotics, serving frontier AI labs and world model developers. The funds will be used to expand data capture infrastructure and build deployment capabilities across the US, UK, and South Korea.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144023"}], "importance": 7, "article_id": "f0ca7032"}, {"headline": "Fairfax arm sells IIFL stake to SBI MF for ₹3,488 crore", "summary": "FIH Mauritius Investments, an arm of Canada-based Fairfax, sold a 15.2% stake in IIFL Finance for ₹3,488 crore. The buyers include SBI Mutual Fund, which acquired a 3.52% stake, along with Rimco, Nimco, and several other funds. The sale follows a board approval for Fairfax to raise funds, possibly to finance a majority stake acquisition in IDBI Bank.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144043"}], "importance": 7, "article_id": "ff4b2781"}, {"headline": "Equitas Small Finance Bank to Seek Universal License in 2027", "summary": "Equitas Small Finance Bank plans to apply for a universal banking license in 2027. Interim CEO Balaji Nuthalapadi stated that while the bank meets regulatory parameters, the application will proceed after appointing a new permanent MD and CEO next month. The bank's focus remains on strengthening control systems and leadership capacity for its next growth phase.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_19-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144023"}], "importance": 7, "article_id": "01b7ca6a"}, {"headline": "Lakshya Sen Secures Spot in BWF World Tour Finals", "summary": "Indian shuttler Lakshya Sen sealed his place in the BWF World Tour Finals following results at the Hong Kong Open. Sen's qualification was confirmed after K Srikanth defeated Sen's closest rival, Japan’s Koki Watanabe, in the opening round. Sen also progressed in his match against Frenchman Arnaud Merkle. The top eight players qualify for the prestigious season-ending tournament.", "category": "Sports", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_19-11-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/144039"}, {"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/144071"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 7, "article_id": "93b8bbe5"}, {"headline": "SpiceJet board approves plan to raise up to ₹5,500 crore", "summary": "The board of cash-strapped SpiceJet has approved a proposal to raise up to ₹5,500 crore to strengthen its financial position and support its revival. The funding, which includes a reported ₹5,000 crore investment from a consortium of investors, will be used to restore operations, settle liabilities, and expand its fleet as the airline struggles with recent cash crunches.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144043"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 8, "article_id": "7792a428"}, {"headline": "Odisha and Andhra Pradesh Prepare for Severe Cyclone Akvan", "summary": "Andhra Pradesh and Odisha are on alert for severe Cyclone Akvan, expected to make landfall on November 20 between Narsapur and Puri. The IMD predicts wind speeds of 90-100 kmph and heavy rainfall in coastal districts. The states recently dealt with Cyclone Arnab, and emergency services are being deployed to minimize the impact on South Odisha and North Andhra Pradesh.", "category": "Environment", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_19-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144043"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 7, "article_id": "4510fc81"}, {"headline": "Democrats Nominate Hakeem Jeffries for US House Speaker", "summary": "House Democrats have nominated Hakeem Jeffries to serve as speaker, positioning him to become the first Black lawmaker to hold the gavel. Jeffries secured the nomination in a 251-11 internal vote. He will face a full House vote in January. Jeffries' leadership team includes Katherine Clark and Pete Aguilar, representing a historic shift in party leadership.", "category": "World", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144071"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 9, "article_id": "d8ce7f39"}, {"headline": "K'taka hikes RTE income eligibility limit to Rs 8 lakh", "summary": "Karnataka has raised the annual income ceiling for Right to Education (RTE) Act eligibility from Rs 3.5 lakh to Rs 8 lakh, making it the highest in the country. The move aims to help more families benefit from the scheme.", "category": "India", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 7, "article_id": "3f42f3ce"}, {"headline": "Pew Projections Suggest Islam Will Surpass Christianity as Largest Religion", "summary": "The Pew Research Center forecasts that Islam will become the world's largest religion by 2035, primarily driven by higher fertility rates. Projections suggest there will be 2.57 billion Muslims compared to 2.52 billion Christians by that year. By 2070, Pakistan is expected to have the largest Muslim population, followed by India, Nigeria, and Indonesia.", "category": "World", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144071"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 19-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144059"}], "importance": 8, "article_id": "4b3f729a"}, {"headline": "US court to Delhi courts: Help serve summons", "summary": "A US district court has ordered alternative delivery of summons via Indian courts for civil lawsuits against NSA Ajit Doval and former RAW chief Samant Goel, citing failed attempts through diplomatic channels.", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 7, "article_id": "c1e8e8f7"}, {"headline": "Assam tribunal reverses ruling against family", "summary": "A tribunal in Silchar reversed its ruling against a family of six, declaring five members Indian citizens. The patriarch was tagged 'streamline foreigner', losing voting rights for 10 years.", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 6, "article_id": "93abffcc"}, {"headline": "Why the split? To boost visible policing, says city’s new top cop", "summary": "Bengaluru's new police chief R Hitendra explains that splitting the city into five commissionerates aims to increase visible policing and improve crime prevention and law and order.", "category": "India", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 7, "article_id": "1c5fccc2"}, {"headline": "K’taka minister seeks E20 review", "summary": "Karnataka minister Rizwan Arshad urged the Centre to review the E20 ethanol blending programme after tests allegedly found excess ethanol in petrol samples. He cited citizen cost and ecosystem readiness.", "category": "Environment", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 19-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144071"}], "importance": 7, "article_id": "7151bece"}, {"headline": "Nvidia stops shipping US-approved AI chips to China", "summary": "Nvidia has ceased shipping powerful AI chips approved by the US to China, raising doubts about an agreement. This move comes amid ongoing scruti     : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
