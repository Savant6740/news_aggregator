<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

ilename": "IE Delhi 17-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "04f34336"}, {"headline": "Sensex and Nifty hit record highs after RBI dividend boost", "summary": "Indian equity markets rallied to all-time highs as investors cheered the RBI's massive ₹2.11 lakh crore dividend payout to the government. The Sensex surged over 1,100 points, while the Nifty 50 crossed the 22,900 mark. Banking and financial stocks led the gains, as the payout is expected to bolster the government’s fiscal capacity and liquidity in the banking system.", "category": "Business", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143808", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "d39fb3e0"}, {"headline": "Adani Ports to invest $3 billion in global expansion strategy", "summary": "Adani Ports and Special Economic Zone (APSEZ) has announced a plan to spend $3 billion over the next few years on international acquisitions and greenfield port projects. The company is targeting strategic locations in Southeast Asia, East Africa, and the Mediterranean to expand its global logistics footprint and reduce dependence on its domestic Indian operations.", "category": "Infrastructure", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143808", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "5fc18c79"}, {"headline": "Iran holds state funeral for President Raisi and Foreign Minister", "summary": "Millions of people gathered in Tehran for the funeral of President Ebrahim Raisi, Foreign Minister Hossein Amir-Abdollahian, and others killed in a helicopter crash. Supreme Leader Ayatollah Ali Khamenei led the prayers. Iran has announced presidential elections for June 28 to find a successor, while Mohammad Mokhber continues as the interim president during the transition.", "category": "World", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143808", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "ee78546a"}, {"headline": "Rajasthan Royals knock out RCB to enter IPL Qualifier 2", "summary": "Rajasthan Royals ended Royal Challengers Bengaluru’s late-season surge with a four-wicket victory in the IPL 2024 Eliminator at Ahmedabad. Chasing 173, RR navigated a tense middle-over phase to win with six balls to spare. Avesh Khan and Ravichandran Ashwin starred with the ball, while Yashasvi Jaiswal provided a solid start. RR will now face Sunrisers Hyderabad in Qualifier 2.", "category": "Sports", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143808", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "3d6aafa0"}, {"headline": "India and Oman move closer to signing major trade deal", "summary": "India and Oman have finalized the majority of chapters in their Comprehensive Economic Partnership Agreement (CEPA). The deal aims to significantly reduce or eliminate customs duties on over 80% of Indian exports, including textiles, electronics, and machinery. Officials suggest the agreement could be signed within the next few weeks, deepening India's strategic ties in the Gulf.", "category": "Economy", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143808", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 17-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/143808"}], "article_id": "c662092a"}, {"headline": "Census portal briefly lists 287 other religions in drop-down menu", "summary": "The Union government briefly included 287 options under the ‘Other’ religions category on the Census 2027 self-enumeration portal. Listed options included ISKCON, Sanatan, and Shia. Officials clarified the list was intended as predictive text to help enumerators avoid spelling errors and was removed after queries. Tribals continue to demand a separate column for Adivasi faiths.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "c0dc541e"}, {"headline": "Gunfight erupts during anti-terror operation in South Kashmir's Kulgam", "summary": "Security forces encircled a group of terrorists believed to be responsible for a recent attack on a CRPF post in Kulgam. A gunfight broke out in the Laroo Bypass area following six days of anti-terror operations. Police suspect Lashkar-e-Taiba-affiliated terrorist Mohammad Lateef Bhat is among those trapped. Operations are ongoing to track bodies and hiding militants in the area.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "96c0608a"}, {"headline": "Karnataka plans law to mandate meters for all app-based taxis", "summary": "Transport Minister Byrathi Suresh announced a proposed law making digital meters mandatory for all taxis, including those on apps like Ola and Uber. The move follows complaints of exorbitant surge pricing and exploitation of drivers. Vehicles found plying without meters will be seized. The government also released ₹280 crore to clear salary arrears for state transport employees.", "category": "Infrastructure", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "1e4b1189"}, {"headline": "Riding on footpaths in Bengaluru to attract 5,000 rupee fine", "summary": "The Karnataka Transport Department is drafting provisions to hike the fine for riding on footpaths to ₹5,000 for first-time offenders. Repeat offenders will face a ₹10,000 penalty, and third-time violators will have their vehicles confiscated. Bengaluru Traffic Police recorded 19,296 cases of footpath riding till October-end, a 30% increase over the annual average.", "category": "Infrastructure", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "99728b7f"}, {"headline": "Karnataka likely to ban half helmets for two-wheelers by 2027", "summary": "The State Transport Department plans to prohibit the use of half helmets across Karnataka starting in the new year. Officials noted that half helmets fail to provide adequate safety, and full helmets will be made mandatory for both riders and pillions. Statistics show that riding without a helmet remains the most common traffic violation in the state.", "category": "Infrastructure", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "eb38b65f"}, {"headline": "ED files prosecution complaint against former KPSC chairman and members", "summary": "The Directorate of Enforcement filed a complaint against former KPSC chairman Shivashankarappa Sahukar and member B.V. Geetha in a recruitment scam case. The agency alleges the accused laundered ₹8.17 crore generated from manipulating 1:3 eligibility lists and leaking question papers. Proceeds were allegedly parked in bogus accounts or used for personal property acquisitions.", "category": "Law", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "423c6a87"}, {"headline": "KPSC candidates allege intrusive frisking and lack of basic amenities", "summary": "Aspirants appearing for the KAS Preliminary Examination reported poor facilities at centers, including lack of drinking water and washroom access. Some Muslim women candidates alleged they were asked to remove hijabs despite prior physical frisking. Many candidates also complained about the lack of special transport arrangements to reach distant examination centers on the outskirts.", "category": "India", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "010d89af"}, {"headline": "Bengaluru leads India in voluntary foreign assets disclosure scheme", "summary": "Bengaluru has emerged as the top city for voluntary foreign assets disclosure under the FAST-DS 2026 scheme. The city accounted for 217 out of 1,026 applications received nationwide as of October 20. The scheme allows small taxpayers to disclose previously undeclared foreign assets or income and obtain relief from certain penal and prosecution consequences.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "e650a041"}, {"headline": "BWSSB clarifies no NOC issued for Kanakapura Road elevated corridor", "summary": "The Bengaluru Water Supply and Sewerage Board stated it has not granted approval or a no-objection certificate for the proposed 18.5-km elevated corridor. Residents oppose the project as the alignment runs along four major water mains supplying south Bengaluru. The BWSSB noted it does not possess the project's feasibility report or technical documents.", "category": "Infrastructure", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "e156a013"}, {"headline": "Water sports at Harangi backwaters suspended after fatal boat accident", "summary": "Authorities suspended water adventure activities at the Harangi backwaters in Kodagu following the death of a couple from Gujarat. Their speedboat capsized during a turn, trapping them underneath. While their two children were rescued, the parents died. Officials are investigating whether adequate safety measures were in place at the privately-operated facility.", "category": "India", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "fb9f8abe"}, {"headline": "Lokayukta constitutes committee to inspect polluted Valagerahalli Lake", "summary": "The Karnataka Lokayukta has formed a joint inspection committee to assess the deteriorating condition of Valagerahalli Lake. The move follows complaints of sewage entering the lake and associated health hazards. The committee, including KSPCB and Lokayukta officials, must submit a report by November 30. Authorities have been warned of action for dereliction of duty.", "category": "Environment", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "f29a3d1c"}, {"headline": "Karnataka registers cases against 275 traders for weight manipulation", "summary": "Officials conducted simultaneous raids at nine major Agricultural Produce Markets across Karnataka to check for cheating on weights. Fines totaling ₹9.6 lakh were imposed on 275 traders for violating standards. The 'Nikhara' drive followed complaints from farmers about being cheated. The government is also tendering for new e-PoS machines at fair price shops.", "category": "Economy", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "befec006"}, {"headline": "Three new drought-resistant crop varieties released at Krishi Mela", "summary": "Scientists at UAS-B have developed new varieties of maize, ragi, and amaranth designed to provide high yields with minimal water. Agriculture Minister P.M. Narendraswamy also announced plans for the 'Negila Yogi Yojane', offering ₹4,500 annually to small farmers owning less than three acres. The state reported massive crop loss due to drought in 226 of 240 taluks.", "category": "Science", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "a0d88760"}, {"headline": "El Nino impact leads to record crop insurance registrations in Karnataka", "summary": "Over 37.5 lakh farmers registered for crop insurance in Kharif 2026, the highest in Karnataka's history, as the state grapples with 90% crop loss due to El Nino. Union Minister Shobha Karandlaje expressed concern over private insurance companies failing to compensate eligible farmers and urged the state to hold discussions with these firms to ensure timely payouts.", "category": "Environment", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "8df89fab"}, {"headline": "Over 1.13 lakh new voter enrolments in Bengaluru are untraceable", "summary": "An analysis found that 44% of new additions to Bengaluru’s final electoral rolls could not be matched to Form 6 or Form 8 records. In constituencies like Bangalore South and Mahadevapura, nearly half of the new enrolments were 'untraceable'. The Election Commission has ordered a Special Summary Revision with January 1, 2027, as the qualifying date to address gaps and identify new voters.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "adee9706"}, {"headline": "Second elephant attack death in 48 hours shocks Belur taluk", "summary": "A 60-year-old man was trampled to death by a wild elephant at Nagenahalli in Belur, less than two days after a woman died in a similar attack nearby. Protesters blocked roads, blaming the Forest Department for failing to drive away the roaming herds. In response, the State government has committed to relocating 56 wild elephants to the Bhadra Wildlife Sanctuary within a month.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "222e65e2"}, {"headline": "Deve Gowda seeks review of Cauvery Water Disputes Tribunal Award", "summary": "Former PM H.D. Deve Gowda wrote to PM Narendra Modi seeking a revision of the Cauvery award, citing that its 36-year-old data is obsolete due to climate change. He argued the CWMA's powers are unconstitutional and that Karnataka should be allowed to prioritize drinking water for Bengaluru. He also sought early clearance for the Mekedatu project and a higher share in river linking.", "category": "Politics", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "f3d6492d"}, {"headline": "SC warns of contempt over Aadhaar accessibility for visually challenged", "summary": "The Supreme Court issued a notice to the Centre regarding the failure of Aadhaar face authentication for blind and low-vision persons. The application claims that e-KYC processes are impossible for those who cannot focus their eyes into frames, affecting access to banking and credit services. The court warned of contempt if prior 2025 directions for digital accessibility were not met.", "category": "Law", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "b89ffc26"}, {"headline": "CBI takes over probe into death of tribal activist in Jharkhand", "summary": "The CBI has re-registered a case to investigate the death of tribal activist Nisha Kumari Bhagat, who allegedly committed suicide in Ranchi. Before her death, she had posted on Facebook accusing the state government and land brokers of harassment. The Jharkhand government referred the case to the central agency following widespread protests demanding an independent probe.", "category": "India", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "94e1b6ef"}, {"headline": "Six Naga civilians abducted in May laid to rest in Manipur", "summary": "The bodies of six Liangmai Naga civilians were buried in Kangpokpi district, 187 days after they were abducted and killed. Families had refused to claim the bodies from the mortuary until their demands for justice and the removal of certain militant groups were met. The United Naga Council called the killings the 'darkest day' in Manipur's history and urged central intervention.", "category": "India", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "9fc321d7"}, {"headline": "UP BJP leaders decry fake news regarding Assembly candidate lists", "summary": "Chief Minister Yogi Adityanath and UP BJP president Pankaj Choudhary issued a joint statement to dismiss rumors that 209 candidates had been finalized for the upcoming Assembly election. The intervention aimed to calm party cadres and dispel reports of factionalism. The leaders clarified that the candidate selection process has not yet begun for the 403-seat state assembly.", "category": "Politics", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "54d2e4e5"}, {"headline": "India aims to be among top 10 shipbuilding nations by 2030", "summary": "Union Minister Sarbananda Sonowal announced that India is targeting a spot in the global top 10 shipbuilding nations by 2030 and top five by 2047. The plan involves $10 billion in investment across five greenfield coastal shipbuilding clusters in Andhra Pradesh, Gujarat, Maharashtra, Odisha, and Tamil Nadu. The initiative aims to attract global shipping lines and financial institutions.", "category": "Infrastructure", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "f5f4ff5e"}, {"headline": "Indian student enrolment in U.S. universities drops by 6.5 percent", "summary": "The number of Indian students in the U.S. fell to 3,39,435 in 2025-26, a decline of 6.5% from the previous year. According to the Open Doors 2026 report, graduate-level enrolments saw a significant 34% drop. Institutions cited visa application processes and travel restrictions as key factors. Despite the decrease, India remains the largest source of international students for the U.S.", "category": "Education", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "f27ae9ad"}, {"headline": "AIIMS Delhi performs India's first open foetal spinal surgery", "summary": "Doctors at AIIMS Delhi successfully performed India's first open foetal repair of a lumbosacral myelomeningocele on a 25-week-old foetus. The six-hour surgery repaired a severe spinal defect in utero to prevent lifelong paralysis. The procedure was provided free of cost under the Union government's JSSK scheme. Both the mother and foetus are reported to be stable following the operation.", "category": "Health", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "a3bc54a3"}, {"headline": "Ukraine launches biggest drone attack on Russia since war began", "summary": "Russia intercepted over 1,300 Ukrainian drones in a massive overnight barrage, the largest since the invasion started. Ukraine targeted the Moscow region, two oil depots in Azov and Krasnodar, and the Kerch Bridge linking Russia to Crimea. In retaliation, Russian strikes on Ukraine's energy grid left hundreds of thousands without power as the country braces for a harsh winter.", "category": "World", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "c850e14a"}, {"headline": "Andreeva wins WTA Finals title without dropping a single set", "summary": "19-year-old Mirra Andreeva defeated Elina Svitolina 7-5, 6-3 to win the WTA Finals in Budapest. She became the 11th player to win the season-ending championship without losing a set, joining legends like Martina Navratilova. The win secures Andreeva a career-high world No. 2 ranking to end the year, capping a dominant performance throughout the tournament.", "category": "Sports", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "0519fb31"}, {"headline": "Third U.S. aircraft carrier arrives in West Asia amid Iran tensions", "summary": "The USS Theodore Roosevelt has arrived in West Asia, bringing the number of U.S. carrier strike groups in the region to three. The deployment follows a drone attack on U.S.-allied Bahrain and renewed fighting in the region. The move is intended to deter Iran and stabilize global energy supplies amid escalating tensions between regional powers and the United States.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143830", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH-Bangalore 17-11.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/143830"}], "article_id": "dcdf6994"}, {"headline": "Gangster Goldy Dhillon issues death threats to Amitabh and Abhishek Bachchan", "summary": "Gangster Goldy Dhillon issued death threats against Amitabh Bachchan and son Abhishek over alleged remarks regarding the 1984 anti-Sikh riots. He claimed bulletproof glass would not protect them and that 200 operatives remain ready. The threat followed Amitabh's social media post saying he survived a close encounter. Mumbai police are reviewing security protocols for the actors.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "daed0634"}, {"headline": "ECI orders Special Summary Revision to enroll left-out voters in Karnataka", "summary": "The Election Commission of India ordered a Special Summary Revision in Karnataka starting December 1 to enroll eligible and first-time voters previously left out. Final rolls will be published on January 20, 2027. Registration officers must verify stations where deletions exceed 2%. Help desks will assist vulnerable groups, and field verification is mandatory for duplicate entries.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "03ff2e61"}, {"headline": "Indian student enrollment in US universities drops for first time in years", "summary": "Indian student numbers in US universities fell 6.5% to 3.4 lakh in 2025-26, the first decline in four years. New international enrolments dropped 18% due to visa uncertainties and a difficult job market. Despite the dip, Indian students contributed $14.3 billion to the US economy, overtaking Chinese spending for the first time. Enrollment from China also fell 4% to 2.5 lakh.", "category": "Education", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "89dcb93a"}, {"headline": "Karnataka CM Shivakumar moves home office to renovated Ganga heritage bungalow", "summary": "Chief Minister DK Shivakumar relocated his home office to the 160-year-old Kumara Krupa heritage bungalow, renamed Ganga. The premises were renovated with rooms named after Karnataka rivers. Shivakumar performed a puja on Monday and will begin meeting the public there from Thursday. His predecessor Siddaramaiah remains in the Cauvery bungalow, which was Shivakumar's first choice.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "7c9b288f"}, {"headline": "US imposes new restrictions on China access to advanced AI chips", "summary": "The Trump administration issued rules restricting China's access to top-tier AI chips via overseas data centers in countries like Malaysia and Thailand. Firms in Singapore, Brazil, and Indonesia must now apply for export licenses. The move aims to prevent Chinese companies from using remote computing to train AI models using sensitive US technology, ahead of high-level diplomatic talks.", "category": "Technology", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "950d76d1"}, {"headline": "IBM CEO Arvind Krishna discusses two large-scale AI projects in India", "summary": "IBM is negotiating two major projects in India, following the Amravati Quantum Tech Park, according to CEO Arvind Krishna. The company spends approximately $3 billion annually in the country. Krishna noted that while AI might displace 10-20% of jobs, roles will evolve toward system engineering. IBM has doubled its entry-level hiring for 2026 and writes half its code using AI tools.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "052e967e"}, {"headline": "Jimmy Tata raises governance concerns over potential takeover of Tata Sons", "summary": "Jimmy Tata, brother of Ratan Tata, flagged concerns regarding the governance of Tata Trusts. In a recorded note with trustee Vijay Singh, he warned of a potential \"backdoor takeover\" of Tata Sons due to recent inductions of Noel Tata's family members into the trusts. He spoke in favor of listing Tata Sons to increase transparency and dismantle a \"pervasive culture of secrecy.\"", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "2f2bc0ce"}, {"headline": "Karnataka restricts Vietnamese firm Green SM to 100 electric taxis", "summary": "Karnataka Transport Minister Byrathi Suresh announced a cap of 100 taxis for Vietnamese electric mobility firm Green SM in Bengaluru. The decision aims to protect local taxi drivers from corporate competition. The government will mandate digital meters for all app-based and traditional taxis, allowing collection of only government-fixed fares to ensure a level playing field.", "category": "Infrastructure", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "6fac5566"}, {"headline": "Belgium's all-time leading scorer Romelu Lukaku retires from international football", "summary": "Romelu Lukaku, Belgium's record goalscorer, announced his retirement from international football after a 16-year career. The striker scored 94 goals in 135 appearances for his country. He represented Belgium in four World Cups, helping them reach the 2024 quarterfinals. Lukaku stated he is \"at peace\" with his decision to step away from the national team.", "category": "Sports", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "96d0e8f4"}, {"headline": "Bengaluru inventor Rajah Vijay Kumar patents nuclear transmutation process", "summary": "Inventor Rajah Vijay Kumar received an Indian patent for Gravitoradiophysical Nuclear Transmutation, a process claiming to convert elements like mercury into gold and silver using specific frequencies. The reactor, called the 'Boom Tube', operates in a vacuum without fission or fusion. While an accredited lab reported gold in samples, experts say more work is needed to verify the claims.", "category": "Science", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "a2267667"}, {"headline": "Bihar woman arrested for beating daughter to death over puja offerings", "summary": "Police in Bihar's Samastipur district arrested Reena Devi for allegedly beating her four-year-old daughter to death. The mother was reportedly angered when the child touched offerings prepared for the Chhath festival. The child died at a private nursing home. The victim's father, Raju Paswan, filed the complaint, leading to the arrest. Investigation is currently ongoing.", "category": "India", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "e8f11ef1"}, {"headline": "DVAC uncovers library book procurement scam involving ghost writers", "summary": "Tamil Nadu's DVAC arrested R. Mohan for a scam involving 5,300 bogus AI-generated book titles with fictitious authors. Operating through Agal Vilakku and Phoenix publications, Mohan allegedly sold books with inflated prices to state libraries. The FIR revealed that some non-existent authors were credited with over 100 books each, and original works by foreign authors were reproduced.", "category": "Law", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "7c871ecb"}, {"headline": "Uttar Pradesh adds 1.7 million voters ahead of 2027 assembly elections", "summary": "Uttar Pradesh has registered nearly 17 lakh new voters since April 2026, bringing the total electorate to 13.56 crore. Chief Electoral Officer Navdeep Rinwa will publish the draft roll on Tuesday. Despite the increase, a gap of 2.6 crore remains between the projected adult population and registered voters, particularly among youth aged 18-19, who account for 23% of their age bracket.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "2245ac32"}, {"headline": "Electrocution remains leading cause of unnatural elephant deaths in India", "summary": "RTI data reveals 1,765 elephants died of unnatural causes in India over 17 years, with 1,185 deaths (67%) caused by electrocution. Odisha reported the highest fatalities (371), followed by Assam (356) and Karnataka (223). Train hits caused 277 deaths. The environment ministry is surveying sensitive railway stretches and validating corridors to mitigate conflict.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "ec3979ae"}, {"headline": "Maharashtra forest department halts Adani pumped storage project", "summary": "The Satara forest division issued a stop-work order for Adani Renewable Energy's 1,500MW Tarali pumped storage project. The project was initiated without mandatory approval from the National Board for Wildlife. Authorities also questioned if trees were felled without permission. Adani Group stated that the wildlife clearance proposal has been submitted.", "category": "Environment", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "345d1143"}, {"headline": "India signs San Francisco Declaration to protect critical AI infrastructure", "summary": "India joined the US and eight other partners in signing the San Francisco Declaration to safeguard critical infrastructure and supply chains essential for AI. Part of the Pax Silica initiative, the pact covers raw materials, manufacturing, and energy networks. Signatories treat AI hardware and logistics as national assets to protect against economic coercion.", "category": "Technology", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "e4b7fe4a"}, {"headline": "Opposition INDIA bloc seeks SC nod to interrogate ECI officials", "summary": "Rahul Gandhi and INDIA bloc leaders requested Supreme Court permission to serve 48 questions to the Chief Election Commissioner and Election Commissioners. The \"interrogatories\" seek clarity on Special Intensive Revision decisions, unanimity within the commission, and changes to voter registration forms. The move aims to verify ECI assertions and ensure election transparency.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "85ba1991"}, {"headline": "IndiGo flight to Madurai aborts take-off at Bengaluru airport after snag", "summary": "An IndiGo flight from Bengaluru to Madurai aborted its take-off on Monday morning due to a suspected hydraulic system failure. The pilot applied emergency brakes as the aircraft accelerated, bringing it to a halt. Passengers were deboarded safely and accommodated on an alternative flight. The airline confirmed the pilots followed standard procedures for necessary technical checks.", "category": "Infrastructure", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "23ee2c69"}, {"headline": "General strike paralyses Manipur following killing of four Nagas", "summary": "A 24-hour strike over the November 13 killing of four Tangkhul Nagas shut down markets, schools, and transport in Manipur. Protesters blocked roads in Imphal, leading to police firing tear gas. Simultaneously, six Naga civilians found beheaded in June were buried after a five-month delay. Local committees blamed militant groups for the violence and called for security action.", "category": "India", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "19bb3a47"}, {"headline": "Supreme Court lawyer faces potential contempt for questioning CJI's integrity", "summary": "A lawyer created a scene in the Supreme Court by questioning Justice Surya Kant’s legitimacy to continue as Chief Justice after a petition was not listed. The court objected to the unscheduled mentioning and asked the lawyer to follow proper registrar channels. Some bar members have requested contempt proceedings against the lawyer for his remarks regarding the CJI's integrity.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "35d707a0"}, {"headline": "Security forces kill terrorist associate in Kulgam; wanted suspect escapes", "summary": "In a gunfight in south Kashmir’s Kulgam district, security forces killed terrorist associate Umar Nasir, while wanted terrorist Mohammad Latief Bhat escaped with bullet wounds. The duo was allegedly involved in a recent attack that wounded three CRPF personnel. Drones were deployed to scan the area. Latief carries a Rs 15 lakh bounty on his head.", "category": "India", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "dc6918e7"}, {"headline": "High Court stays deportation of Bengaluru scrap dealer pending nationality check", "summary": "The Karnataka High Court restrained authorities from deporting Abdul Rahim, a Bengaluru-based scrap trader accused of being an illegal Bangladeshi immigrant. Rahim claims Indian citizenship by birth and produced documents like a voter ID and Aadhaar. Authorities allege his documents are fraudulent. The court ruled deportation should not proceed until his nationality is determined.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "2f4a8342"}, {"headline": "Sweden targets Indian STEM professionals to fill 18,000 tech job vacancies", "summary": "Sweden is looking to attract skilled Indian professionals in STEM fields to address a shortage of 18,000 specialists. Ambassador Petra Menander launched a dedicated website, workinsweden.com, to facilitate applications. Last year, 2,600 Indians received Swedish work permits. The country projects 30% annual growth in tech talent demand.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "f1b1da89"}, {"headline": "Technical software glitches halt trade license issuance in Bengaluru", "summary": "Trade license issuance and renewals have been stalled across five Bengaluru city corporations for three months due to technical glitches in new software. The transition from the old system to a new platform has caused significant revenue losses. GBA officials expect the service to resume in a week once the activation process is complete.", "category": "Infrastructure", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "28dd6852"}, {"headline": "KRV demands employment data for locals from 500 IT-BT companies", "summary": "Karnataka Rakshana Vedike launched a campaign seeking employment data on Kannadigas in 500 IT-BT firms. State president TA Narayana Gowda stated that preliminary findings show some firms have zero local representation. KRV plans a mega rally on November 27 to demand legislation mandating jobs for locals, citing the infrastructure benefits companies receive from the state.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "a71c272f"}, {"headline": "BWSSB to pilot startup technologies for non-revenue water leak detection", "summary": "Bangalore Water Supply and Sewerage Board will partner with four startups to find innovative solutions for pipeline leaks. The pilot projects aim to detect leaks without digging up roads. BWSSB seeks to reduce water losses by using advanced technology like robotic inspection to identify structural defects, funded by a Rs 1 crore grant from the IT department.", "category": "Infrastructure", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "bd2281d6"}, {"headline": "South Western Railway proposes month-long closure of Hennur-Bagalur Main Road", "summary": "South Western Railway has requested permission to close a section of Hennur-Bagalur Main Road from November 28 to December 30 for bridge-widening and girder replacement. The closure is expected to worsen traffic at existing bottlenecks. SWR plans to conduct a line block on December 2 and place concrete structures on December 10, pending traffic police approval.", "category": "Infrastructure", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "2e6f0056"}, {"headline": "Karnataka to report excessive ethanol blending by oil companies to Center", "summary": "Karnataka Food Supplies Minister Rizwan Arshad stated the state will submit lab reports showing excessive ethanol blending at six terminals to the Union government. Tests on fuel samples from across the state indicated levels exceeding permissible limits. Arshad claimed the process is controlled by oil companies, causing problems for motorists and vehicle owners.", "category": "Economy", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "7fdbd375"}, {"headline": "National conference for women legislators to address cyberbullying and mentorship", "summary": "Around 150 women parliamentarians and legislators will gather in Bengaluru to discuss cyberbullying, online harassment, and mentorship pathways. The conference, inaugurated by Lok Sabha Speaker Om Birla, will also feature a special session on menopause and women’s health. The event aims to address challenges that prevent women from entering public life.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "2fc45f43"}, {"headline": "Supreme Court rules voters have no right to demand specific reserved seats", "summary": "The Supreme Court ruled that no voter or candidate has a legal right to demand the reservation of a specific constituency for SC/ST communities. Dismissing a petition regarding Zilla Parishad seats in Maharashtra, the court held that the government's decision on reservation is valid as long as the total number of reserved seats remains proportionate to the population.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "1d01b943"}, {"headline": "Chief of Defence Staff clarifies Agnipath revisions are not a rollback", "summary": "Chief of Defence Staff General N S Raja Subramani stated that revisions to the Agnipath scheme do not constitute a rollback but are part of a planned periodic review. He accused critics of trying to confuse the public and clarified that Agniveers will be absorbed into the forces based on requirements. He also emphasized the importance of integrated theatre commands.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "e1b45dd9"}, {"headline": "Global retail investors increase exposure to US stocks amid AI boom", "summary": "Retail investors worldwide, including from India, poured 80% of global equity flows into US markets this year. Despite volatility in AI stocks like Nvidia, individual buyers have \"bought the dip\" as hedge funds exited. Analysts warn that a potential 25% market crash could lower global consumer spending significantly due to the wealth effect and foreign holding of $25 trillion in US shares.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "5e6982cb"}, {"headline": "Actor Robert Pattinson cast as the next James Bond", "summary": "Amazon MGM Studios announced that British actor Robert Pattinson will take over the role of James Bond, becoming the first actor to play 007 since Daniel Craig. The upcoming film will be directed by Denis Villeneuve with a script by Steven Knight. Pattinson, known for \"The Batman,\" described the opportunity to play the secret agent as the honor of a lifetime.", "category": "Culture", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "c21648b8"}, {"headline": "Kannada superstar Shivarajkumar cast as villain in Ajith Kumar's Dare Devil", "summary": "Director Adhik Ravichandran confirmed that Kannada superstar Shivarajkumar will play the main antagonist in Ajith Kumar’s upcoming film, \"Dare Devil.\" Shivarajkumar, who recently appeared in \"Jailer,\" will join the film's shoot in Hyderabad this November. The movie also stars Prabhu, Parthiban, and Sreeleela, with an intensive production schedule currently underway.", "category": "Culture", "page": 19, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "9acfaedc"}, {"headline": "Technologist CV Rao honored as first South Indian SMPTE Fellow", "summary": "CV Rao, Chief Technology Officer of Annapurna Studios, has been named an SMPTE Fellow for 2026, the first from South India. Rao was instrumental in developing technology for blockbusters like \"Baahubali\" and \"RRR.\" The prestigious distinction from the Society of Motion Picture and Television Engineers recognizes his contributions to India's first virtual production and motion capture stages.", "category": "Technology", "page": 21, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "179e3ec3"}, {"headline": "Diljit Dosanjh addresses performance restrictions during Indore concert", "summary": "Singer Diljit Dosanjh went ahead with his Indore concert despite reported bomb threats and restrictions barring four songs from his setlist. Addressing the crowd, he recited Rahat Indori's poetry to emphasize artistic freedom and noted that he fulfilled his promise to perform despite attempts to cancel the show. The concert was part of his ongoing AURA India Tour 2026.", "category": "Culture", "page": 21, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "d9bafae2"}, {"headline": "India and Pakistan to clash in SAFF Championship football final", "summary": "India and Pakistan will meet in the final of the SAFF Championship in Dhaka on Tuesday. Nine-time champions India reached the final despite a depleted squad and injuries. Pakistan is making its first-ever final appearance under coach Nolberto Solano. India previously defeated Pakistan 3-2 in the s are not filled. Staff alleged that new digital tax requirements have significantly increased their administrative burden.", "category": "Infrastructure", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "56c08896"}, {"headline": "Delivery agent beaten to death by friend in Koramangala brawl", "summary": "A 35-year-old delivery agent, Shivakumar, was beaten to death by his friend Naveen following an argument over abusive language in Koramangala. The incident occurred near a paan shop after the duo consumed alcohol at a bar. Naveen allegedly used a stick to fatally attack Shivakumar. Koramangala police arrested the suspect shortly after the incident.", "category": "India", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "53923589"}, {"headline": "Exposed drains and damaged covers cause traffic snarls in Chokkanahalli", "summary": "A narrow road connecting Jakkur to Thanisandra has become a traffic bottleneck due to damaged drain covers and exposed pits. Residents of Chokkanahalli complained that the road is used by school buses and tankers, posing a safety risk. Despite eight months of appeals to corporation engineers, no repairs have been undertaken to fix the hazards along the stretch.", "category": "Infrastructure", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "e1a0344d"}, {"headline": "Biji S S appointed interim MD and CEO of Karnataka Bank", "summary": "Karnataka Bank has appointed Biji S S as its interim managing director and CEO, effective November 16. The appointment is for a two-month period or until a regular candidate takes charge. The Mangaluru-based bank announced the move to ensure administrative continuity following the end of the previous leadership's tenure.", "category": "Business", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "58b422b5"}, {"headline": "President Trump's Nvidia stake reportedly grows to $62 million", "summary": "President Donald Trump’s holdings in Nvidia stock have grown to an estimated $13 million to $62 million as of August, according to financial disclosures. This marks a significant increase from previous filings. The disclosure comes amid heightened scrutiny of the relationship between the Trump administration and the tech giant, especially following the recent resignation of Nvidia's CEO.", "category": "Business", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "eb5bb752"}, {"headline": "Former Pakistan Army captain Rehman Gul named new BLA commander-in-chief", "summary": "The Baloch Liberation Army has appointed Rehman Gul, a former captain in the Pakistan Army, as its new commander-in-chief. Gul deserted the military in 2010 to join the separatist group. The move is seen as a major organizational shift for the BLA. Gul’s younger brother reportedly remains an active Major in the Pakistan Army’s Signals Corps.", "category": "World", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore umbent PT Usha is also in the fray as the electoral college is finalized.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "6cd20da7"}, {"headline": "Uttar Pradesh defeats Karnataka by 19 runs in Syed Mushtaq Ali T20", "summary": "Uttar Pradesh secured a 19-run victory over Karnataka in their Syed Mushtaq Ali T20 fixture. Batting first, UP posted 204/5 behind Divyansh Joshi's 65 and Sameer Rizvi's unbeaten 46. In response, Karnataka was restricted to 188/9 despite R Smaran's 68. UP bowlers Bhuvneshwar Kumar and Yash Dayal were instrumental in destabilizing Karnataka's top order early in the chase.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "b4abacf1"}, {"headline": "Political battle intensifies over control of Gokul dairy cooperative in Maharashtra", "summary": "A dispute over the chairmanship of Gokul, Maharashtra’s largest dairy cooperative, has sparked political tension in Kolhapur. After a Congress-backed panel claimed victory, a state government ordinance shifted control to the Mahayuti alliance. The dairy’s Rs 4,300 crore turnover and influence over 5.5 lakh farmers make it a critical factor in local elections.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "4d1812e0"}, {"headline": "New four-layer motor insurance structure mandatory from December 15", "summary": "The IRDAI has mandated a new \"four-layer\" structure for motor insurance policies starting December 15. Following a Supreme Court ruling, policies will be split into third-party liability, passenger liability, personal accident, and own-damage sections. While third-party and owner's accident cover remain compulsory, other sections will be optional to allow better transparency for customers.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "8f479651"}, {"headline": "Experts propose multi-dimensional strategy to make cancer care affordable in India", "summary": "Former RBI deputy governor Usha Thorat and Nachiket Mor propose a multi-layered approach to reduce cancer treatment costs. Recommendations include utilizing the National Cancer Grid for pooled procurement and integrating insurance with care delivery. The strategy emphasizes that price regulation alone is insufficient without improved prevention and early detection services.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143791", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_17-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143791"}], "article_id": "f3548605"}, {"headline": "Government considers stakeholders' demand to review long-term capital gains tax", "summary": "The Finance Ministry is examining demands to review the 12.5% long-term capital gains tax on listed equity shares ahead of the 2027 budget. CBDT officials stated that various stakeholder proposals, including the removal of the tax or a graded holding period approach, are under analysis. The review aims to balance tax revenue with the growth of India's stock markets.", "category": "Economy", "page": 13, "importance": 8, "telegram_url": "https ET_17-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "8b629912"}, {"headline": "D-St Extends Gains on FPI Inflows, Softer Oil", "summary": "Indian equity indices gained on Monday due to sustained foreign fund inflows and easing crude oil prices. The Sensex rose 0.63%, and Nifty gained 0.58%.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "68e8af2d"}, {"headline": "NSE Joins 5 Lakh Crore MCap Club", "summary": "The National Stock Exchange (NSE) crossed Rs 5 lakh crore market capitalization, becoming India's 11th company to achieve this milestone after a 16% rally in November.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "751afff9"}, {"headline": "As Factories Step Up Activity, Corp Borrowing Follows", "summary": "Improving capacity utilisation and private sector investment are driving corporate loan demand in steel, cement, and manufacturing sectors. Banks report a robust credit pipeline.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143769", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_17-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143769"}], "article_id": "fb38713a"}, {"headline": "Urban Company Unveils QIP to Raise 2,500 Cr", "summary": "Home services platform Urban Company plans to raise Rs 2,500 crore via a QIP to fund its InstaHelp business, marketing, and technology development.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https:/
