<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "a450de7f"}, {"headline": "CDSCO probes if rabies vaccines are fake after failed test", "summary": "India's drug regulator is investigating a batch of Abhayrab rabies vaccines that failed a potency test in April. The batch was traced to an unlicensed flat in North Delhi. While four people have been arrested, the regulator has asked state controllers to maintain strict vigilance over the distribution and storage of the vaccine batch.", "category": "Health", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "8b2d8170"}, {"headline": "Woman rescued in flood-hit Nepal after 10 days", "summary": "A woman was rescued from a damaged house in Nepal's Nuwakot town, 10 days after devastating floods hit the region. In a separate operation, three workers were pulled alive from a hydropower tunnel. Search operations continue for thousands missing in the country as floodwaters recede from several districts.", "category": "World", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "f3f7b62a"}, {"headline": "Mosque razed at Saharanpur collectorate after court order", "summary": "Authorities in Saharanpur demolished a mosque located inside the district collectorate complex following a court order. The mosque was built on government land, and earlier court directives had declared the structure illegal. High security, including Rapid Action Force personnel, was deployed to maintain law and order during the demolition.", "category": "Law", "page": 1, "importance": 6, "telegram_u nfrastructure challenges during the monsoon season.", "category": "Environment", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "e76bc1f1"}, {"headline": "AP to explore gallium and lithium in Kadapa basin", "summary": "Andhra Pradesh has begun exploring deposits of critical minerals, gallium and lithium, in the Kadapa basin. Initial samples show lithium concentrations up to 1,000 ppm. The project, in collaboration with the Geological Survey of India, involves a four-stage exploration process across 200 km to confirm the extent of these high-value deposits.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "44b8190c"}, {"headline": "Stalin hits out at DVAC raids on ex-minister Nehru", "summary": "Tamil Nadu CM MK Stalin has condemned the Directorate of Vigilance and Anti-Corruption raids at premises linked to DMK leader and senior minister KN Nehru. Stalin termed the searches a 'political vendetta' and an attempt to intimidate the party. The raids were conducted to investigate alleged irregularities during Nehru's previous tenure.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "4a514a61"}, {"headline": "Karnataka to scrap NPS and reintroduce Old Pension Scheme", "summary": "The Karnataka government has announced plans to scrap the New Pension Scheme and reintroduce the Old Pension Scheme for state employees. Deputy CM DK Shiv  "summary": "Interacting with National Teacher Award winners, PM Modi emphasized the need for educators to focus on a child's character and mental well-being rather than just academic scores. He urged teachers to protect students from digital addiction and to nurture curiosity, noting that a teacher's role extends beyond the classroom to holistic nation-building.", "category": "Education", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "31c8af7c"}, {"headline": "Charge sheet filed against 13 in Pakistan espionage case", "summary": "The National Investigation Agency has filed a charge sheet against 13 individuals involved in a Pakistan-linked espionage network. The accused allegedly used Indian SIM cards to gather sensitive information on military installations and shared it with overseas handlers. The network operated across multiple states, focusing on intelligence gathering.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "5a6bcec3"}, {"headline": "Terrorist Yasir killed in Jammu and Kashmir encounter", "summary": "Security forces killed Lashkar-e-Taiba terrorist Yasir in an encounter in the Pir Panjal range of J&K. Yasir was allegedly involved in several attacks, including the 2024 Poonch ambush. An AK rifle and ammunition were recovered from the site. The operation was hampered by heavy rain and fog in the high-altitude forested area.", "category": "India", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "57d57cfa"}, {"headline": "CJI: Timely justice delivery can steer economic progress", "summary": "Chief Justice of India DY Chandrachud stated that a reliable and efficient justice system is essential for a nation's economic growth. Speaking at a legal forum, he noted that timely dispute resolution boosts investor confidence and fosters a stable business environment, highlighting the role of the judiciary in supporting India's economic goals.", "category": "Law", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "cfef7fad"}, {"headline": "Adani Defence signs supply pact for AK-203 rifles", "summary": "Adani Defence & Aerospace has signed a five-year agreement with Indo-Russian Rifles Pvt Ltd to supply ammunition for AK-203 rifles. The rifles are being manufactured in India under a technology transfer agreement. This partnership aims to strengthen the indigenous supply chain for the Indian Army and reduce dependence on foreign imports.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "972bca3b"}, {"headline": "Direct tax buoyancy remains above 1 for third year", "summary": "India's direct tax collections have grown faster than the nominal GDP for the third consecutive year, with a buoyancy ratio above 1. This trend indicates that structural reforms and increased compliance are broadening the tax base. Data submitted to Parliament suggests this buoyancy will continue into the next fiscal year, supporting government spending.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "h  High Court. The move aims to fill vacancies and improve the disposal rate of cases.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "9e4fdac6"}, {"headline": "Putin meets US envoys, pauses strikes for three days", "summary": "Russian President Vladimir Putin held talks with US representatives and ordered a 72-hour pause in strikes on Ukraine. The move follows diplomatic efforts to de-escalate tensions and explore a path to negotiations. While the Kremlin described the talks as difficult, the temporary ceasefire has provided a window for humanitarian aid in conflict zones.", "category": "World", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "96acb664"}, {"headline": "Satwik-Chirag storm into third badminton final of year", "summary": "India's top doubles pair Satwiksairaj Rankireddy and Chirag Shetty have reached their third final of the year at the Shenzhen Masters. They defeated the Malaysian pair of Nur Mohd Azriyn and Tan Wee Kiong in a grueling three-game semi-final. The duo will face the world number 7 pair from China in the title clash on Sunday.", "category": "Sports", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136406", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/136406"}], "article_id": "3ce010f6"}, {"headline": "Controversy over Sonia Gandhi memoir highlights legal vetting issues in Indian publishing", "summary": "Penguin Random House India has reportedly halted the publication of Sonia Gandhi's memoir, 'Belonging,' after the author declined to remove content flagged by legal counsel. The disputed portions reportedly touched upon sensitive political figures and events. This incident has sparked a national debate regarding legal vetting and self-censorship in the Indian publishing industry.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "1dd98bab"}, {"headline": "Historical analysis of movements to democratize access to Indian temple sanctums", "summary": "Author Manuraj Shunmugasundaram examines the legal and social efforts to reform temple entry in India over the last century in 'The People’s Sanctum.' The text discusses the transition from discriminatory traditional customs to a more democratic religious landscape. It highlights the convergence of thought between various social reformers and the role of the judiciary in upholding civil rights.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "fb98bfc3"}, {"headline": "Designer Sabyasachi Mukherjee collaborates with The Met on jewelry collection inspired by antiquities", "summary": "Designer Sabyasachi Mukherjee is set to unveil a new jewelry collection during New York Fashion Week, created in collaboration with The Metropolitan Museum of Art. The collection draws inspiration from the museum's Byzantine holdings, including funerary objects and sarcophagi. This marks a significant move for the designer into the global luxury market beyond traditional wedding attire.", "category": "Culture", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "0608540a"}, {"headline": "Poet-actor Aamir Aziz releases new single reflecting on contemporary social struggles", "summary": "Aamir Aziz has released a new hip-hop single titled 'Dopeher Blues,' a thematic follow-up to his 2019 viral hit. The song and its music video address themes of social struggle, farmer suicides, and the feeling of helplessness in the current sociopolitical climate. Aziz, known for his protest poetry, aims to use his art as a witness to the contemporary issues facing the country.", "category": "Culture", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "cf1ec8a1"}, {"headline": "New biography of Garry Sobers offers detailed portrait of cricket icon", "summary": "Duncan Hamilton’s new book, 'The Man Who Walked Out of the Sun,' provides a comprehensive portrait of West Indian cricket legend Garfield Sobers. The biography covers his athletic genius, personal relationships, and the cultural impact of his career. It examines both his triumphs on the field and the personal challenges he faced, offering a detailed account for a new generation of fans.", "category": "Sports", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "68b3b9ed"}, {"headline": "Maggie O’Farrell’s new novel depicts Irish family mapping land after Famine", "summary": "Maggie O’Farrell’s novel 'Land' is set in 1865 Ireland during the mapping of the country following the Great Famine. The story follows a surveyor and his son as they document a landscape scarred by devastation and loss. The work explores themes of colonialism and memory, blending historical fiction with oral traditions to examine the relationship between a people and their territory.", "category": "Culture", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "cf63551c"}, {"headline": "Naveen Kishore’s poetry collection explores themes of loss and state violence", "summary": "Naveen Kishore’s new book, 'Ode to a Grieving Angel,' explores themes of suffering and the limitations of language. Organized into four cycles, the work uses abrasive imagery and staccato forms to represent the difficulty of speaking about state violence and personal grief. The poems are described as a performance of language that captures a sense of gentle sadness and historical pathos.", "category": "Culture", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "129866a5"}, {"headline": "New publication explains Indian public finance through relatable everyday stories", "summary": "Sarthak Pradhan and Pranay Kotasthane have authored 'Fiscal Fables,' a guide to India's public finance system using simplified narratives. The book aims to explain complex economic topics, such as GST disagreements and national funding disputes, through relatable examples. It serves as an educational tool for citizens to better understand the management of the country's collective resources.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "1b3e5e9b"}, {"headline": "Arjun Dangle chronicles the rise of the Dalit Panther movement in India", "summary": "Arjun Dangle provides a first-hand account of the Dalit Panther movement’s rise in 1972 in a newly translated work. The book chronicles one of India’s most radical social movements, focusing on its literary culture and internal ideological debates. It offers insights into the post-Ambedkarite era and the movement's enduring influence on contemporary identity politics and social discourse.", "category": "Culture", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "d82fb7c7"}, {"headline": "Cultural analysis examines the evolution of female police depictions in Indian media", "summary": "An analysis of contemporary Indian film and television highlights the rise of female police protagonists in works like 'Santosh' and 'Dahaad.' These characters are shown balancing professional duties with the pressures of a patriarchal society and personal expectations. The study suggests these roles reflect broader societal tensions regarding gender, caste, and institutional power.", "category": "Culture", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "9adaee6a"}, {"headline": "Essay discusses the declining engagement and modern relevance of public libraries", "summary": "Vipin Benny examines the status of India's public library network, noting a shift in how citizens engage with physical reading spaces. While membership has grown in some areas, the essay warns that libraries risk losing relevance due to digital competition and aging collections. It calls for reimagining these institutions as active social hubs for discovery, learning, and preservation.", "category": "Education", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "b9134253"}, {"headline": "YouTube star MrBeast and James Patterson release high-stakes thriller and contest", "summary": "YouTube personality MrBeast and novelist James Patterson have released a new survival thriller titled 'The Most Dangerous Games.' The launch is accompanied by a skill-based competition offering a million-dollar prize to a reader. The book combines high-stakes suspense with a unique promotional strategy to engage a digital-first audience through literature and large-scale incentives.", "category": "Culture", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "623ebef3"}, {"headline": "Surekha Davies investigates the historical role of monsters in defining humanity", "summary": "Historian Surekha Davies explores how humans have used the concept of monsters to define ideas of race, gender, and nation in 'The Humans: A Monstrous History.' The book examines a wide range of subjects, from ancient deities to artificial intelligence. It investigates how society creates 'monstrous' others to establish its own identity, providing a perspective on human categorization.", "category": "Culture", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "5a59f41f"}, {"headline": "Memoir collection uncovers history of female Hajj pilgrims from Assam", "summary": "A collection of eleven memoirs translated by Teresa Rehman chronicles the experiences of female Hajj pilgrims. 'Her Hajj Story' uncovers a forgotten tradition of travel writing by Muslim women from Assam. These personal accounts provide a unique lens into their spiritual journeys and everyday lives, documenting a previously overlooked aspect of the region's cultural and religious history.", "category": "Culture", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "bdd494bf"}, {"headline": "Essay reflects on the unseen labor and persistence required for research", "summary": "Aakriti Srivastava discusses the demanding nature of computational and academic research, emphasizing the importance of determination and discipline. The piece argues that while breakthroughs receive acclaim, the long process of failure and repeated testing remains largely invisible. It calls for greater recognition of the personal sacrifices and persistence required in scientific fields.", "category": "Science", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136442", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 06-09.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136442"}], "article_id": "23524b6a"}, {"headline": "Booker-longlisted novel explores queer life in 1980s Jamaica", "summary": "Marlon James’s novel 'The Disappearers' offers a portrayal of queer life in Jamaica during the 1980s. The crime saga focuses on themes of human connection, acceptance, and the challenges faced by marginalized communities. The author uses the fictional format to bring closed historical chapters into the open, highlighting the long road toward societal change and inclusion.", "category": "Culture", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136442", "sources": angalore_FE_06-09-2026.pdf", "page": 31, "telegram_url": "https://t.me/c/1877410077/136372"}], "article_id": "ba8c4827"}, {"headline": "India's automotive sector sees robust sales growth", "summary": "India's automotive sector has reported robust sales growth for the latest quarter, driven by increased demand for passenger vehicles and two-wheelers. The industry's performance reflects a positive economic trend.", "category": "Business", "page": 32, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136372", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_06-09-2026.pdf", "page": 32, "telegram_url": "https://t.me/c/1877410077/136372"}], "article_id": "54f75bea"}, {"headline": "PM Flays GDP Critics, Says They’re Unable to Digest India’s Strength", "summary": "PM Narendra Modi defended India's 7.8% GDP growth amid global turmoil, attacking critics for questioning the nation's progress. Speaking at SRCC, he contrasted India's current economic dynamism with the gloomy situation in 2013, now leading as the fastest-growing major economy.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "4a376279"}, {"headline": "Warning Needed for Even Single Excess Ingredient: Plea in SC", "summary": "A Supreme Court petition argues FSSAI's proposed front-of-pack food labels could be dodged if products are high in only one nutrient (salt, sugar, or fat) in the first phase. Petitioner seeks a single-phase rollout and bilingual, larger warnings covering total nutrient content, not just \"added\" ones.", "category": "Health", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "9db68f35"}, {"headline": "There’s a Lot Riding on Cos Getting Rural 2-wheeler Mix Right", "summary": "Two-wheeler manufacturers face a complex rural stocking challenge for the festive season, as rural markets account for 55% of registrations. Getting the product mix right is crucial, given diverse regional preferences, varying EV penetration, and potential impacts of rainfall/inflation on purchasing power.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "f11d8c80"}, {"headline": "Gen Z Makes Luxe Watches Get with Time(s)", "summary": "The luxury watch industry needs bolder innovation to attract younger consumers, as their strategy of boosting revenue with pricier offerings hits limits. Gen Z and millennials prioritize excitement and discovery over brand loyalty, impacting Swiss watchmakers' exports amid rising competition and a booming resale market.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "22a9f87c"}, {"headline": "Palette Cleanse", "summary": "Colour analysis, a popular styling method, helps individuals find flattering shades based on skin undertone, hair, and eye colour. Originating in early 20th-century colour theory, it guides choices in clothing, makeup, and accessories, emphasizing dramatic effects on appearance.", "category": "Culture", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "5bf7dffe"}, {"headline": "10 Convicted in Jheeram Ghati Naxal Attack", "summary": "A special NIA court convicted all 10 accused, including two women, for planning and executing the 2013 Naxal attack in Chhattisgarh, which killed almost the entire state Congress leadership. Sentencing is reserved for September 16, with the defense planning an appeal.", "category": "India", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "679c23d4"}, {"headline": "Former YSRCP MP Vijay Sai Reddy to Launch Party", "summary": "Former YSR Congress Rajya Sabha MP Vijay Sai Reddy, who quit the party in January 2025, is set to launch a new party in Andhra Pradesh. He aims to offer an alternative to the \"two-family rule\" and will address press conferences in four cities, starting September 7 in Vijayawada.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "e8136c80"}, {"headline": "Munde’s Action Wins Public Praise, But Court Rebukes FDA Over Process", "summary": "FDA Commissioner Tukaram Mundhe is praised for cracking down on hotels and eateries, but the Bombay High Court has rebuked the FDA for cancelling licences without due process, imposing a `5 lakh fine in one instance. The state CM also intervened in a loose edible oil ban.", "category": "Law", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "65c79286"}, {"headline": "CM Calls Alliance Meet Amid ‘Vijay for PM’ Push", "summary": "Tamil Nadu CM Vijay has called an alliance meeting on September 9 to resolve issues, as some TVK ministers openly pitch him for PM in 2029. This has not gone well with Congress, which insists Rahul Gandhi is the opposition's PM candidate, causing internal alliance friction.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "ad984aae"}, {"headline": "YSRCP Flags Financial Irregularities, MSME Closures in Andhra Pradesh", "summary": "YSRCP leader PV Midhun Reddy questioned Andhra Pradesh's economic performance, citing Union government data showing 4,520 MSME closures between 2024-25 and June 2026, affecting nearly 48,500 people. He highlighted investment inflows falling short of TDP-led government's projections.", "category": "Economy", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "5f80fcca"}, {"headline": "PDA Dig, 4Cs Focus: Tawde Begins Mission UP", "summary": "BJP's new Uttar Pradesh in-charge Vinod Tawde began his assignment with a sharp dig at Samajwadi Party chief Akhilesh Yadav's PDA plank, signaling an intent to counter SP's social coalition narrative. His immediate focus for 2027 groundwork is on \"4Cs\": coordination, cadres, caste, and candidature.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "0da8f06a"}, {"headline": "Iran CJ Seeks Action Over War Crimes, Sovereignty Violations", "summary": "Iran’s Chief Justice Ayatollah Gholam-Hossein Mohseni-Eje’i called for stronger international action against war crimes and sovereignty violations, citing military strikes by US and Israel. India’s CJI Justice Surya Kant proposed a common BRICS arbitration platform for cross-border commercial disputes.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "edb99ef4"}, {"headline": "Pakistani Killed Identified as LeT Man", "summary": "The infiltrator killed in an operation in Budgam district, central Kashmir, was identified as Yasir, a Pakistani Lashkar-e-Taiba member. Yasir was involved in the 2024 Poonch IAF convoy ambush and other attacks. A search continues for a second infiltrator, Musa.", "category": "India", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "002fe355"}, {"headline": "Jarange Patil Stops Water, Saline on 8th Day of Fast", "summary": "Maratha leader Manoj Jarange Patil, fasting for Kunbi caste certificates for Marathwada's Maratha community (for OBC reservations), has stopped taking water and saline on his eighth day. He warns of large-scale protests in Mumbai after September 12 if demands are not met.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "08054f7e"}, {"headline": "India Votes for UN Resolution on More Accurate World Map", "summary": "India voted for a UN General Assembly resolution promoting a \"more accurate representation\" of continental landmasses on world maps. The resolution highlights concerns about the Mercator projection distorting sizes of Africa, Latin America, and South Asia. India supports \"Equal Area\" projections.", "category": "World", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "594678fc"}, {"headline": "IIL: Seized Abhayrab Vials Not Made by Co", "summary": "Indian Immunologicals Limited (IIL) stated that rabies vaccine Abhayrab vials found substandard in Delhi were not from its authorized supply channel and differed from retention samples. The company clarified its batch was tested and released by Central Drugs Laboratory, Kasauli.", "category": "Health", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "7582821e"}, {"headline": "Global Hotel Chains Step up India Presence as Luxury Demand Rises", "summary": "International hotel chains are expanding their presence in India due to rising luxury demand. Banyan Tree is evaluating entry, Kerten Hospitality plans 1,000 keys, Marriott is introducing Marriott Marquis, and Hyatt is scouting locations for its boutique brand.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "b201c17c"}, {"headline": "Anthropic Delays its IPO Plans, Listing Expected in November", "summary": "Artificial intelligence company Anthropic has delayed its IPO plans, with the prospectus now expected in late September and listing in November, days before the US midterm elections. This could be a significant $2 trillion IPO, testing public market appetite for AI.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "90d0b1f3"}, {"headline": "Talcher Fertilisers, NTPC Apply for Coal Gasification Scheme", "summary": "Talcher Fertilisers Ltd and NTPC Ltd have applied under the government's `37,500 crore coal and lignite gasification scheme. The initiative promotes converting domestic coal/lignite into higher-value products like syngas, chemicals, and fertilizers to reduce import dependence.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "4252425f"}, {"headline": "Coal India Offers Road Route to Power Plants to Augment Coal Supplies", "summary": "State-run Coal India offers thermal plants with fuel supply agreements the option to lift additional coal via road transport, beyond contracted amounts. This aims to boost supplies expeditiously to the power sector, which faces stock depletion amid high electricity demand.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "b3aa2543"}, {"headline": "What Should the Kids Study in the Age of AI?", "summary": "Parents are grappling with education choices for their children in the age of AI, questioning the relevance of traditional degrees and future job security. Many are prioritising breadth over specialisation and exploring AI-immune careers like humanities or arts, rather than just engineering.", "category": "Education", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "c988544e"}, {"headline": "You’ve Got (Art) Mail", "summary": "Independent artists are reviving \"art mail\" subscriptions, sending subscribers curated physical items like prints, postcards, and letters. This trend, driven by screen fatigue and a desire for analogue hobbies, offers an intimate way to collect art and connect directly with artists.", "category": "Culture", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "8975f92a"}, {"headline": "Development Turns Disaster: Floods in India", "summary": "India is experiencing increasingly frequent and unpredictable extreme weather events like floods and landslides, amplified by unchecked development in fragile mountain landscapes. Experts call for risk-informed development, strict floodplain zoning, and stronger regional cooperation on early warnings and monitoring.", "category": "Environment", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "80e24d1f"}, {"headline": "Glasses with Bold Frames Emerge as Professional Self-Expression", "summary": "Bold, distinctive eyewear frames are becoming the new professional power accessory, replacing ties or watches as a form of self-expression. Professionals are opting for stronger shapes and colours, viewing glasses as a fashion statement, leading to multiple-pair ownership and diverse styles.", "category": "Culture", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "ae01697a"}, {"headline": "Why Footpaths in This Country Are Not Paved with the Best of Intentions", "summary": "Despite the Supreme Court declaring the right to walk on footpaths a fundamental right, pavements in India are often non-existent, encroached upon, or used as roads by two-wheelers. Walking is seen as déclassé, highlighting a significant gap between policy and ground reality.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "c10063ef"}, {"headline": "Between Begging & Belligerence: Customer Service Tactics", "summary": "In Indian customer service interactions, a common dynamic oscillates between begging and belligerence to persuade service professionals. As AI takes over these roles, the question arises whether it will remember its job description to help customers, without requiring such tactics.", "category": "Business", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "3af995ca"}, {"headline": "Working Naam Ke Vaaste on Benami Dealings", "summary": "The article humorously discusses the power of names, from Shakespeare to Donald Trump's renaming of geographical features. It critiques Trump's \"Drumpferie\" as \"naam ke vaaste exercises,\" suggesting a superficial approach to identity and governance and calling him another \"benami guy.\"", "category": "Politics", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "7f3dc360"}, {"headline": "Nip-caraz", "summary": "Tennis star Carlos Alcaraz's return to court has sparked buzz, with fans noting \"nip-slips\" due to the deep cut of his new Nike X Cactus Jack kit. Fans critique the outfit's focus on hypebeast fashion over athletic functionality, making him \"Nip-caraz.\"", "category": "Sports", "page": 6, "importance": 2, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "90f8c9da"}, {"headline": "Politicians as Endorsers: A New Breed for Businesses", "summary": "The article humorously observes that politicians are the most visible \"brand ambassadors\" in India, appearing on advertisements for schemes, events, and even private businesses. It suggests businesses should tap into this \"breed of influencers\" for visual advocacy and cross-endorsement.", "category": "Politics", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "2114c23e"}, {"headline": "US Envoys in Moscow, Putin Halts Kyiv Strikes for 72 Hrs", "summary": "Putin ordered a 72-hour pause in Kyiv strikes as US envoys Steve Witkoff and Jared Kushner arrived in Moscow to revive stalled peace talks. Zelenskyy confirmed speaking with envoys, agreeing to reciprocate strike halts. The trip comes as both sides escalate aerial attacks.", "category": "World", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "e2d51881"}, {"headline": "Fresh Yemen Clashes Kill More than 60", "summary": "Renewed clashes between Yemen’s Saudi-backed government forces and Houthi rebels killed over 60 people, including civilians, in the country’s southwest. This follows the collapse of a 2022 truce, marking some of the deadliest fighting in years and highlighting persistent conflict.", "category": "World", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "781232a6"}, {"headline": "Do Flip-Flops Impact Our Feet Health?", "summary": "Experts debate the health impact of flip-flops. While they increase fall risk like other unsecure shoes, there's no evidence they cause heel pain or toe alignment changes in healthy feet. For those with pre-existing conditions, supportive footwear is crucial, but flip-flops can build foot strength.", "category": "Health", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "5c70bff7"}, {"headline": "Carlos the Jackal: Recalling the OPEC Hostage Crisis", "summary": "The article recounts the 1975 OPEC headquarters attack in Vienna led by Ilich Ramírez Sánchez, \"Carlos the Jackal,\" where 62 people were held hostage. Decades later, Carlos, now imprisoned, still boasts of killings but struggles with details of the Libyan-orchestrated plot.", "category": "World", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "90b87752"}, {"headline": "Why We’re Still Nuts for This Metal Toy, 125 Years Later", "summary": "Meccano, the metal construction toy created in 1901, has sold over a billion sets and influenced notable figures like Nobel winner Harry Kroto and the inventor of the smart card. Its reusable parts revolutionized educational play, and it even contributed to wartime manufacturing.", "category": "Culture", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "0e6599bf"}, {"headline": "How Nomads Influenced Indian Cooking", "summary": "Nomads, often marginalized in history, significantly influenced Indian cooking. Examples include asafoetida (hing) brought by Central Asian traders and the likely origin of kebabs from nomadic grilling practices, challenging myths like raw meat eating Mongols.", "category": "Culture", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "af18abab"}, {"headline": "Valverde Named in Uruguay Squad for India Friendly", "summary": "Real Madrid star Federico Valverde headlines Uruguay’s squad for an international friendly against India on October 6 in Kolkata. The team, led by coach Diego Forlan, features a mix of established internationals and emerging talents for the high-profile series of friendlies.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "b055742b"}, {"headline": "ETPL Looks to Redraw Cricket’s Map", "summary": "The European T20 Premier League (ETPL), co-founded by Abhishek Bachchan, aims to expand cricket's global footprint beyond traditional markets. By offering more fixtures and full-time contracts, ETPL seeks to develop cricket in European nations like Ireland, Scotland, and the Netherlands.", "category": "Sports", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "7964b080"}, {"headline": "The Williams Show Goes On", "summary": "Serena and Venus Williams reunited their iconic doubles team at the US Open, thrilling fans by playing a three-set thriller. Despite a narrow loss, their return symbolized their enduring legacy and dedication to the sport, four years after Serena announced her \"evolution away from tennis.\"", "category": "Sports", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "ad46c980"}, {"headline": "Anaha’s Impressive Run Ends in Quarters", "summary": "India's Anahat Singh exited the London Squash Classic women's quarterfinals, losing 4-11, 4-11 to Malaysia's Sivasangari Subramaniam. The reigning world junior champion, ranked 20th, will next compete in the Qatar Classic before the Asian Games in Japan.", "category": "Sports", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "35da32f8"}, {"headline": "Mbappe Misses Penalty as Betis Beat Real Madrid", "summary": "Kylian Mbappe missed a late penalty, and Troy Parrott scored his first goal, as Real Betis secured a 1-0 win over Real Madrid. This ended Jose Mourinho’s side’s perfect start to the La Liga season, sealing a memorable victory for Betis.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "34a64814"}, {"headline": "Alpine’s Gasly Seizes First Career Pole Ahead of Russell", "summary": "French Formula One driver Pierre Gasly achieved his first career pole position with Alpine at the Italian Grand Prix, surprising favorites. His lap of 1 minute 21.786 seconds was 0.060 quicker than Mercedes’ George Russell, marking Alpine’s first pole since 2021.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "5a2a02b7"}, {"headline": "Potapova Sends Home Hope Anisimova Packing in Third Round", "summary": "American 10th seed Amanda Anisimova was defeated 6-2, 7-5 by Anastasia Potapova in the US Open third round. Potapova reached the fourth round in New York for the first time, successfully defending 13 of 16 break points to win.", "category": "Sports", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "56f550ae"}, {"headline": "The Reinvention of Raphinha", "summary": "Brazilian winger Raphinha has stepped up as Barcelona's unlikely solution at number nine, scoring five goals in three games this La Liga season. His blistering start has impressed coach Hansi Flick, who values Raphinha's work rate and leadership in the team's pressing game.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "4c68ceff"}, {"headline": "How ‘Brave’ Small-town Club Elversberg is Shaking up German Football", "summary": "Small-town club Elversberg, from a town of 13,000, is making waves in the Bundesliga with a \"brave\" playing style and transfer strategy. They stunned Bayer Leverkusen 3-2 and beat Borussia Moenchengladbach 4-3 in their first top-flight campaign, relying on high-potential young players.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136380", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/136380"}], "article_id": "6fecb573"}, {"headline": "Mutual funds spread wider, bet lighter on IPOs in 2026", "summary": "Mutual fund participation in IPOs rebounded in 2026, with MFs participating in 79% of issues compared to 61% in 2024. However, average investment per issue has shrunk as MFs focus on a broader range of smaller offerings. Average listing day gains improved to 12.9% in 2026 from 8.3% in 2025, while average 90-day returns stayed healthy at 24.8%, despite shifting market dynamics.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "e3ad7a15"}, {"headline": "Tata Motors arm launches tender offer for Iveco Group shares", "summary": "TML CV Vehicles B.V., a subsidiary of Tata Motors, launched a tender offer to acquire 100% of Iveco Group N.V. for €3.82 billion. The offer is priced at €14.10 per share. Tata already holds a 43.19% stake and aims to reach at least 95% to delist the company from Euronext Milan, creating a major global force in the commercial vehicle industry.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "db269018"}, {"headline": "RBI approves LIC application to increase stake in ICICI Bank", "summary": "The Reserve Bank of India granted approval to Life Insurance Corporation of India (LIC) to increase its shareholding in ICICI Bank to up to 9.99%. LIC currently holds a 4.35% stake in the private lender. The approval is subject to various conditions, including compliance with statutory and regulatory provisions. LIC has been a long-term institutional investor in Indian banks.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "e072e15a"}, {"headline": "IRDAI flags fake insurance grievance portal igmsirdai.online", "summary": "The Insurance Regulatory and Development Authority of India (IRDAI) cautioned policyholders against a fake grievance registration site, igmsirdai.online. The regulator clarified that this site is not official and advised stakeholders to use the integrated grievance management system on the official IRDAI website to lodge complaints against insurance companies.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "4e835262"}, {"headline": "Axis Bank and Scapia launch no-fee travel credit card", "summary": "Axis Bank partnered with fintech startup Scapia to launch a co-branded travel credit card. The card offers zero forex markup on international transactions and rewards for travel and stay. It targets digital nomads and frequent travelers with benefits like unlimited lounge access and reward points on travel bookings that can be redeemed for flights and hotels through the Scapia app.", "category": "Business", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "bb10788b"}, {"headline": "Big money managers rebuild gold positions on inflation fears", "summary": "Global central banks and fund managers are increasing gold allocations as a hedge against inflation and US dollar concerns. Gold prices are expected to return toward $5,000 an ounce by year-end. Central bank buying remained strong in the second quarter, reaching 289 tonnes. Portfolio managers at Amundi and Robeco view gold as a necessary diversifier amid geopolitical risks.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "01f51c01"}, {"headline": "Helios Mutual Fund crosses ₹15,000-crore AUM milestone", "summary": "Helios Mutual Fund, founded by Samir Arora, reached ₹15,000 crore in assets under management (AUM) within three years of its first equity scheme launch. Equity-oriented schemes account for over 95% of the total AUM, at approximately ₹14,356 crore. The fund house seen 200% growth compared to the previous year, driven by its flagship Flexi Cap fund and other equity offerings.", "category": "Business", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "461f5c1c"}, {"headline": "PFRDA revises Point of Presence charges for NPS subscribers", "summary": "The Pension Fund Regulatory and Development Authority (PFRDA) revised the charge structure for Points of Presence (PoPs) across NPS and NPS Lite. PoPs will be allowed a one-time onboarding charge of ₹200 per Permanent Retirement Account Number. Subsequent transaction charges are set at 0.20% of contributions, with a minimum of ₹250 for dormant accounts to be reactivated.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "0c8c33ef"}, {"headline": "Maruti Suzuki launches Baleno with Level 2 ADAS features", "summary": "Maruti Suzuki India launched an updated Baleno premium hatchback equipped with Level 2 Advanced Driver Assistance Systems (ADAS). Priced at ₹6.09 lakh (ex-showroom), the model features radar-and-camera-based safety systems like lane keep assist, adaptive cruise control, and blind spot monitoring. The update aims to strengthen Maruti's position in the premium hatchback market segment.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "44a12a2f"}, {"headline": "Indian Immunologicals MD says seized rabies vaccines are counterfeit", "summary": "Indian Immunologicals Ltd (IIL) managing director K. Anand Kumar stated that rabies vaccines seized by drug controllers in Delhi were counterfeit and not produced by IIL. The vaccines, under the brand name Abhayrab, were identified as 'Not of Standard Quality' and misbranded. IIL alerted the Drug Controller General of India and local authorities to investigate the source of the fakes.", "category": "Health", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "36c1d7ae"}, {"headline": "PM Modi says 7.8% GDP growth reflects economic strength", "summary": "Prime Minister Narendra Modi hailed India's 7.8% quarterly GDP growth as a reflection of the country’s economic strength and resilience despite global uncertainty and West Asia conflicts. Speaking at an event, he emphasized that the growth was fueled by sectors like construction, housing, and infrastructure, noting that India is transitioning from one of the 'fragile five' to a major economy.", "category": "Economy", "page": 12, "importance": 10, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "898d1c8f"}, {"headline": "Localisation deadline for e-bus and truck motors extended", "summary": "The Ministry of Heavy Industries extended the localisation deadline for electric bus and truck motors to April 1, 2027. The move follows challenges in sourcing rare earth magnets, which are currently largely imported from China. The government also postponed the phased manufacturing programme (PMP) for e-trucks, allowing manufacturers more time to establish domestic production facilities.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "ab584a9e"}, {"headline": "Singapore government will not interfere in SIA’s Air India decision", "summary": "Singapore’s Minister for Transport, Chee Hong Tat, stated that the Singapore government will not interfere in Singapore Airlines' (SIA) commercial decisions regarding its investment in Air India. SIA is currently in the process of seeking final approvals for a merger with Air India. The minister emphasized that commercial entities must make their own decisions based on commercial logic.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "2cd22ee2"}, {"headline": "India targets FTA and textile sector push in Europe", "summary": "The Indian government and textile industry representatives are intensifying efforts to conclude Free Trade Agreements (FTAs) with the EU and UK by early 2027. A high-level delegation visited France and Italy to meet major retailers and promote Indian brands. The move aims to provide duty-free access and boost India's market share in the European apparel and textile market.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "5c1bb18b"}, {"headline": "Vice-President Jagdeep Dhankhar launches India Valves Registry", "summary": "Vice-President Jagdeep Dhankhar launched the India Valves Registry, a national database for tracking valvular heart disease treatments and long-term outcomes. The AI-enabled registry will provide clinical evidence to improve patient care and create a comprehensive record of valvular procedures across the country. The initiative was launched during a national conference in Chennai.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "cf313786"}, {"headline": "IndiGo to launch daily flights from Mumbai to Tanzania", "summary": "IndiGo announced it will launch daily direct flights between Mumbai and Dar es Salaam, Tanzania, starting November 2026. This marks the airline's second destination in Africa, following Mauritius. The expansion is part of IndiGo's strategy to strengthen its international presence and cater to the growing travel demand between India and East Africa for business and tourism.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136383", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_06-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136383"}], "article_id": "42e18570"}, {"headline": "CBI books Subhash Chandra in ₹1,322-crore LIC HFL fraud case", "summary": "The CBI registered a case against Zee Group founder Subhash Chandra and others for allegedly misappropriating ₹1,322 crore borrowed from LIC Housing Finance Ltd (LICHFL). The FIR alleges that loan funds sanctioned to Essel Group companies for business expansion were diverted for other purposes, with LICHFL officials accused of being part of a criminal conspiracy.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁶⁰⁹²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/136406"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_06-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/1
