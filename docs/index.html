estrating a massive female foeticide racket. Gaikwad reportedly admitted to performing up to 250 illegal abortions. The State government announced plans to invoke the MCOCA against such networks. The case highlights deep-rooted son preference and the failure of existing safeguards.", "category": "Health", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "002a01bc"}, {"headline": "Moradabad driver dies after alleged assault by kanwariyas following road accident", "summary": "A 24-year-old driver died in a hospital days after being allegedly assaulted by a group of kanwariyas in Hapur, Uttar Pradesh. The assault occurred following a collision between the victim's goods vehicle and an autorickshaw carrying the pilgrims. Cross-FIRs have been filed, with the autorickshaw driver's family also alleging that the victim used his vehicle as a weapon.", "category": "India", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "2f9a5548"}, {"headline": "Prosecution under PMLA after predicate offence conviction is not double jeopardy", "summary": "The Karnataka High Court ruled that prosecuting a person under the PMLA after they have been convicted of a predicate offence does not constitute a second trial for the same crime. The court dismissed petitions from 11 individuals convicted in a notes exchange scam, stating that money laundering is an independent statutory offence distinct from the original criminal act.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "022cced5"}, {"headline": "Karnataka has second-highest number of EV charging stations in India", "summary": "Ministry of Heavy Industries data reveals Karnataka has 6,805 electric vehicle charging stations, the second-highest in the country after Maharashtra. The State accounts for nearly 13% of India's total 52,718 stations. Experts attribute this growth to Karnataka's proactive 2017 EV policy, though they call for better standardization of tariffs and real-time availability data.", "category": "Infrastructure", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "733e04c7"}, {"headline": "Google rolls back AI satellite image feature over deepfake safety concerns", "summary": "Google withdrew an AI image-generation feature from Google Earth just one day after its launch due to misuse. Users bypass safeguards to create 'satellite deepfakes' depicting violence, terrorist attacks, and environmental disasters. Experts warned that fake satellite imagery could be used for misinformation in conflicts or real estate scams, highlighting flaws in AI guardrails.", "category": "Technology", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "3ca4e46a"}, {"headline": "High-level panel visits Jammu to study demographic changes in border areas", "summary": "A four-member committee led by former IAS and IPS officers arrived in Jammu to study demographic shifts in regions bordering Pakistan. The team will visit Hiranagar, where 450 Rohingyas are detained, and meet civil society groups. The study, mandated by the Union Home Ministry, focuses on settlement patterns and their impact on national security in Kathua and Samba districts.", "category": "Politics", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "4b681358"}, {"headline": "RTI replies confirm at least ten people injured by pellets on July 20", "summary": "Hospital records obtained through RTI show that at least 10 people suffered pellet gun injuries during the July 20 protest in Delhi. Lady Hardinge Medical College reported nine victims, while Safdarjung Hospital recorded one. The data contradicts initial denials regarding the use of such weapons. Among the injured were students, an artist, and a journalist.", "category": "India", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "f6cd1a2a"}, {"headline": "Allahabad High Court upholds religious conversion of two Hindu women to Islam", "summary": "The Allahabad High Court directed the release of two adult sisters who voluntarily converted to Islam, ruling that their father had unlawfully confined them. The court awarded ₹25 lakh compensation for the violation of their fundamental rights. The sisters, aged 35 and 20, are now free to reside and practice their faith of choice without state or parental interference.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "d4bfe252"}, {"headline": "Government adds 11 new entry points for international e-visa holders", "summary": "The Union Home Ministry notified 11 new international entry points for e-visa holders, including airports in Bhopal and Tirupati and nine land ports. The expansion brings the total number of authorized ports to 88. The move is aimed at boosting tourism and facilitating easier travel for foreign nationals using the electronic visa regime for entry into India.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "6b8dee3d"}, {"headline": "Russia's share in India's oil imports jumps to 48% in June", "summary": "Russia's share of India's crude oil imports reached a record high of 48% in June 2026, despite threats of U.S. sanctions. India imported 8.7 million metric tonnes of Russian oil, a 25% increase from the previous year. Simultaneously, imports from the UAE rose to historic levels. Combined, Russia and the UAE now account for nearly two-thirds of India's total oil imports.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "342f0038"}, {"headline": "Mojtaba Khamenei rejigs Iran’s top leadership; Mohsen Rezaei to head security", "summary": "Iran's Supreme Leader Mojtaba Khamenei appointed former Guards commander Mohsen Rezaei as secretary of the Supreme National Security Council. The leadership reshuffle also saw Ali Abdollahi named as head of the armed forces. The changes in Iran's top security and military establishments come amid heightened regional tensions and ongoing disputes with the United States.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "6b5edf3b"}, {"headline": "Taiwan tests internet throttling for first time during annual war exercises", "summary": "Taiwan slowed mobile internet access in a large part of the island during its annual Han Kuang war games to simulate communication disruptions. The 'throttling' drill, conducted in Taichung, restricted users to basic services for 30 minutes. The exercise aims to prepare the nation for potential infrastructure attacks or natural disasters amid ongoing threats from China.", "category": "Technology", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "ee61efa8"}, {"headline": "India clinches 17 medals at u-23 Commonwealth Fencing Championships", "summary": "Indian fencers won 17 medals, including four gold, on the opening day of the under-23 Commonwealth Fencing Championships in Lagos, Nigeria. Gold medalists included Nikhil Wagh in men's sabre, Joys Ashita in women's foil, Prachi Lohan in women's epee, and Jeferlin in women's sabre. The team reached the podium in all six individual events across Sabre, Foil, and Epee categories.", "category": "Sports", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "3958a74d"}, {"headline": "Scientists turn to sharks for hurricane predictions along U.S. East Coast", "summary": "University of Delaware researchers are using sharks equipped with electronic tags to measure ocean temperature, salinity, and depth. This data helps scientists predict hurricane intensity by monitoring the ocean's 'mixed layer' heat. Sharks are ideal observers because they surface often, allowing tags to transmit real-time data to satellites as they swim across the Atlantic.", "category": "Science", "page": 20, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133465", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/133465"}], "article_id": "9933622c"}, {"headline": "IPOs Flood Indian Market with 34 Issues Expected by September", "summary": "Around 34 companies are racing to launch initial public offerings (IPOs) before the September 30 deadline. These companies seek to raise approximately ₹45,000 crore, aiming to utilize the current market window before renewed regulatory approvals are required.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "49867bd8"}, {"headline": "Lawmakers Support Restrictions on Social Media for Minors", "summary": "Members of Parliament from various political parties have proposed private members' bills to limit social media access for minors. The proposed Safeguarding Healthy Internet Environment for Little Digital-Natives (SHIELD) Bill includes features like parental dashboards and night-time curfews.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "8120439c"}, {"headline": "Digital Spending via UPI and Cards Surpasses Cash Payments", "summary": "Retail digital payments via UPI and cards have overtaken cash withdrawals and debit card usage in India. UPI transactions grew 16.9% year-on-year, while cash withdrawals at ATMs fell 6.8%, signaling a major shift in consumer payment behavior.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "3be4e6e7"}, {"headline": "Corporate Revenues Rise but Profits Fall Amid High Costs", "summary": "Indian corporate earnings for the June quarter show revenue growth of 7% but a 25.1% drop in net profits. The decline is attributed to rising interest margins and high raw material costs across sectors like auto and consumer goods.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "13d8405b"}, {"headline": "Centre Proposes Mining Law Changes to Curtail State Taxing Powers", "summary": "The Union government has proposed changes to mining laws to limit the powers of state governments to impose taxes or cesses on mineral rights. The move aims to prevent excessive fiscal burdens that make mining operations unviable following a Supreme Court verdict.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "b55ee791"}, {"headline": "TCS Reports Possible Exposure of Employee Data via Cyber Incident", "summary": "Tata Consultancy Services (TCS) reported a potential data breach involving the exposure of some employee-related information. The company stated that no customer data or core systems were affected, and the incident occurred through a phishing attack on an employee.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "482e2c5b"}, {"headline": "Delhi Airport Operator to Raise ₹3,550 Crore via Bonds", "summary": "Delhi International Airport Ltd (DIAL) plans to raise ₹3,550 crore through a 10-year bond issue. The proceeds will be used to refinance existing dollar-denominated notes of $522.6 million due for maturity in early 2027.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "fe30036f"}, {"headline": "Sun Pharma Recalls Eye Drops After Bacterial Contamination Alert", "summary": "Sun Pharmaceutical Industries has recalled its Predmet eye drops after a safety alert from the All India Ophthalmological Society. The recall follows reports of potential bacterial contamination in certain batches, which could lead to severe eye infections.", "category": "Health", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "30962a64"}, {"headline": "Purvah Green Power to Acquire 1.4 GW Solar Assets", "summary": "Purvah Green Power, a subsidiary of CESC, has entered into an agreement to acquire 1.4 gigawatt-peak (GWp) of solar assets from ReNew. The deal, valued at an enterprise price of ₹4,859 crore, aims to bolster Purvah's renewable energy portfolio to 10 GW by 2032.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "181d27b3"}, {"headline": "Quick Commerce Firms to Create 100,000 Temporary Jobs for Festive Season", "summary": "Quick commerce and e-commerce firms in India are expected to hire over 100,000 temporary workers for the upcoming festive season. This represents a 35-40% increase compared to last year, driven by higher demand for fast deliveries and expanded logistics networks.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "4431a15a"}, {"headline": "Banks Seek RBI Permission to Spread Mark-to-Market Losses", "summary": "Indian lenders have requested the Reserve Bank of India for permission to spread their mark-to-market (MTM) losses over several quarters. The request comes as rising bond yields have impacted the valuation of banks' investment portfolios.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "d65d938e"}, {"headline": "Bhagwati Products Delays IPO Amid Volatile Chip Prices", "summary": "Bhagwati Products, a joint venture between Micromax and China's Huaqin Technology, has deferred its proposed ₹2,000-₹5,000 crore IPO by two to three quarters. The delay is attributed to volatility in chip prices and a slump in the smartphone market.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "fb5f7bff"}, {"headline": "Aviation Ministry Evaluates Request for Airport Cross-Holding Waiver", "summary": "The Union aviation ministry is reviewing a request to waive the cross-holding cap for private airport operators. The current rule limits a company from holding stakes in multiple major airports, but proponents argue a waiver would encourage investment and competition.", "category": "Infrastructure", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "d026448c"}, {"headline": "Opposition Rejects Government Proposal for Home Minister's Statement", "summary": "Opposition parties have rejected the government's offer for a statement by the Home Minister on student protests, demanding instead a full-fledged debate and accountability for recent police actions. The impasse continues to disrupt parliamentary sessions.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "b6916b03"}, {"headline": "Parliamentary Panel Criticizes Continued Suspension of National Talent Search Exam", "summary": "A parliamentary standing committee has expressed concern over the suspension of the National Talent Search Examination (NTSE) since 2021. The panel termed the delay a \"severe blow\" to identifying and nurturing young talent across the country and urged immediate resumption.", "category": "Education", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "1bca2610"}, {"headline": "Students Protest in Ranchi Demanding Examination and Recruitment Reforms", "summary": "Hundreds of students in Ranchi marched towards the Jharkhand Assembly to protest against irregularities in state recruitment exams. Police used tear gas and water cannons to disperse the crowd, resulting in several injuries among both students and security personnel.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "0085f5d0"}, {"headline": "Panel Highlights Poor Execution of Free Coaching for Underprivileged Students", "summary": "A parliamentary committee noted significant deficiencies in the implementation of the free coaching scheme for SC and OBC students. The panel observed that financial targets were not met and many eligible students were unable to access the benefits due to administrative hurdles.", "category": "Education", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "728bb25f"}, {"headline": "NCP Faction Demands Bharat Ratna for Social Reformers", "summary": "MPs from the Sharad Pawar-led NCP met Prime Minister Modi to request the Bharat Ratna for social reformers Mahatma Jyotirao Phule, Savitribai Phule, and Annabhau Sathe. They also raised issues concerning reservation and drought relief in Maharashtra.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "0a5bd06c"}, {"headline": "Supreme Court Expresses Alarm Over Rising Drug Abuse in India", "summary": "The Supreme Court has expressed serious concern over the increasing cases of drug abuse and trafficking across India. The court has directed the central and state governments to submit detailed reports on the measures being taken to curb the menace and improve rehabilitation.", "category": "Law", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "3a66241f"}, {"headline": "Indian Envoys Hold Key Meetings with Nepal and Bangladesh Leaders", "summary": "India's ambassadors to Nepal and Bangladesh held high-level meetings with the respective Prime Ministers to discuss bilateral ties and regional security. The discussions focused on infrastructure projects, trade cooperation, and stability in the neighborhood.", "category": "World", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "a1144fde"}, {"headline": "Food Safety Officials Seize Unsafe Food from Bengaluru Luxury Hotels", "summary": "The Karnataka Food Safety and Standards Department conducted raids on 60 star hotels in Bengaluru, seizing over 1,000 kg of unsafe and misbranded food. Violations included the use of expired ingredients, lack of proper labeling, and unhygienic storage conditions.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "12558f07"}, {"headline": "Security Concerns Over Potential Crime Networks in Colombo Port City", "summary": "Security agencies have raised alarms regarding the potential for transnational criminal networks to exploit the Colombo Port City project. Concerns include money laundering, cybercrime, and the use of the special economic zone as a hub for illicit activities.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "daeca257"}, {"headline": "Kannada Organizations Call for State Bandh Over Mekedatu Project", "summary": "Several Kannada organizations have called for a statewide bandh on Thursday to protest against the delay in the Mekedatu drinking water project. The activists are demanding that the Karnataka government expedite the project despite opposition from Tamil Nadu.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "70dd6736"}, {"headline": "Karnataka Council Session Likely to Face Political Turmoil", "summary": "The upcoming session of the Karnataka Legislative Council is expected to be stormy, with the ruling Congress and opposition BJP-JD(S) alliance set for a confrontation over various issues, including the Mekedatu project and administrative lapses.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "e02e446e"}, {"headline": "Indian Companies Adopt Hybrid AI Strategy to Balance Performance and Cost", "summary": "Major Indian firms are increasingly adopting a hybrid AI approach, combining open-source and proprietary models. This strategy aims to optimize costs, enhance data security, and tailor AI applications to specific business needs while avoiding vendor lock-in.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "d230a266"}, {"headline": "Microsoft Expected to Unveil New Custom AI Chip in September", "summary": "Microsoft is reportedly planning to launch its next-generation custom AI chip, Maia 300, in September. The move is part of the company's efforts to reduce its reliance on Nvidia and optimize its AI infrastructure for internal workloads and Azure customers.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "cbcb2d29"}, {"headline": "Chinese AI Models Spark Global Price War with Low-Cost Offerings", "summary": "The emergence of low-cost, high-performance AI models from Chinese labs is triggering a price war in the global AI market. US-based labs are facing pressure to lower their API pricing to remain competitive against efficient models like DeepSeek and Qwen.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "da7c09d2"}, {"headline": "Rapid Lifecycle of Frontier AI Models Challenges Enterprises", "summary": "The rapid release cycle of new AI models is forcing companies to frequently update their infrastructure. Many frontier models are being replaced or retired within months, creating a need for flexible AI strategies that can adapt to the evolving technological landscape.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "c62086a9"}, {"headline": "Volunteer Communities Drive AI Adoption at Grassroots Level in India", "summary": "Volunteer-driven communities and 'AI evangelists' are organizing meetups and workshops in cities across India to promote the use of frontier AI tools. These grassroots efforts aim to bridge the gap between complex AI technology and practical applications for developers and startups.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "0f54b123"}, {"headline": "Improved Rainfall Helps Narrow Gap in Kharif Crop Sowing Acreage", "summary": "The gap in kharif crop sowing has narrowed as monsoon rains have improved across several parts of India. Data from the agriculture ministry shows that sowing of key crops like rice and pulses is nearing normal levels, boosting hopes for a good harvest.", "category": "India", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "9c5863b0"}, {"headline": "Andhra Pradesh Launches Campaign to Attract Investors from Tamil Nadu", "summary": "The Andhra Pradesh government is organizing roadshows in major cities of Tamil Nadu to attract investment in sectors like textiles and manufacturing. The initiative aims to highlight the state's competitive advantages and ease of doing business.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "10c40437"}, {"headline": "India Urged to Increase Rice Usage for Ethanol Production", "summary": "A government report has suggested that India should increase its reliance on rice as a feedstock for ethanol production. The move aims to meet blending targets and reduce the dependence on sugar-based ethanol, which has faced supply constraints.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "e68e067d"}, {"headline": "India's Digital Infrastructure Faces Risks from Post-Quantum Security Gaps", "summary": "Experts have warned that India's digital infrastructure, including Aadhaar and banking systems, could be vulnerable to future quantum computing attacks. The report highlights the need for a rapid transition to post-quantum cryptographic standards to safeguard national data.", "category": "Technology", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "2799e536"}, {"headline": "Indian VCs Adjust Investment Strategies Amid High AI Stakes", "summary": "Indian venture capital firms are modifying their investment strategies to focus more on AI startups. VCs are increasing their ticket sizes and conducting deeper technical due diligence to identify high-potential AI ventures in a competitive global market.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "f8a49a4f"}, {"headline": "Info Edge Reports 43% Profit Growth Driven by Naukri and 99acres", "summary": "Info Edge reported a 43% increase in its June quarter profit, supported by strong performance in its core recruitment portal Naukri.com and real estate platform 99acres. The company saw robust growth in billings and operational efficiency across its business segments.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "1ec93cb8"}, {"headline": "South Korea Announces $3.5 Billion Fund to Boost Semiconductor Industry", "summary": "The South Korean government has announced a $3.5 billion fund to support its domestic semiconductor industry. The initiative aims to provide low-interest loans and subsidies to chipmakers to maintain the country's global leadership in the memory chip market.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "19b78441"}, {"headline": "Meta Faces New Trial Over Child Safety and Mental Health Concerns", "summary": "Meta is set to face a major trial in the US over allegations that its platforms, Instagram and Facebook, have negatively impacted the mental health of children. The trial will focus on the company's internal research and its failure to implement adequate safety measures.", "category": "Technology", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "ad77972a"}, {"headline": "EV Rental Startups Yulu and Bounce Seek Fresh Funding", "summary": "Electric vehicle rental startups Yulu and Bounce are in talks to raise fresh capital to expand their fleets. The demand for gig-economy EV rentals is surging, driven by the growth of food and grocery delivery platforms in major Indian cities.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "510e6096"}, {"headline": "AI Hardware Startup Discovered Materials Raises $9 Million in Funding", "summary": "Discovered Materials, a startup focused on developing new materials for AI chips, has raised $9 million in its latest funding round. The company aims to create more energy-efficient chips that can handle the high thermal loads of modern AI processing.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "6431d6d5"}, {"headline": "Space-Tech Startup GalaxEye Acquires Bengaluru-Based StarOps", "summary": "Space-tech startup GalaxEye has acquired StarOps, a Bengaluru-based engineering firm, to strengthen its in-house satellite development capabilities. The acquisition will help GalaxEye accelerate its plans to launch a constellation of multi-sensor satellites.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "ca0c4e7a"}, {"headline": "Satellite Internet Adoption Remains Low Globally Despite Technological Advancements", "summary": "A recent report indicates that satellite internet adoption remains limited to a small niche globally. High costs, latency issues, and the availability of terrestrial fiber connections have restricted its growth, despite the launch of several low-earth orbit satellite constellations.", "category": "Technology", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "87fa6a67"}, {"headline": "Indian Super League Faces Crisis Following Tata Steel's Exit", "summary": "The Indian Super League (ISL) is facing a significant challenge after Tata Steel announced the withdrawal of its team, Jamshedpur FC. The move has raised concerns about the league's commercial viability and the long-term commitment of corporate sponsors to Indian football.", "category": "Sports", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "a72f3216"}, {"headline": "FIFA President Infantino Faces Criticism from Continental Football Confederations", "summary": "Gianni Infantino is facing backlash from the heads of several continental football confederations over his proposed changes to the international match calendar. The critics argue that the plans prioritize commercial gains over player welfare and the integrity of regional competitions.", "category": "Sports", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "b95bdea5"}, {"headline": "Zostel Withdraws Legal Plea Against Oyo's Parent Company in Long-Running Dispute", "summary": "Zostel has withdrawn its latest legal application against Oyo's parent company, PRISM, in the Delhi High Court. The move marks a pause in the long-standing legal battle between the two hospitality startups over acquisition and intellectual property issues.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "e4986ad3"}, {"headline": "Russian Sports Federations File New Appeals Against Global Bans", "summary": "Several Russian sports federations have filed fresh appeals at the Court of Arbitration for Sport (CAS) against their ongoing exclusion from international competitions. The federations argue that the bans are politically motivated and discriminatory against Russian athletes.", "category": "Sports", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "35324781"}, {"headline": "Trust Remains Paramount in Financial Services Despite Technological Advancements", "summary": "Industry leaders at a recent forum emphasized that while technology like AI is transforming financial services, customer trust remains the most critical factor. They argued that tech should be used to enhance transparency and security rather than replace human judgment in high-stakes decisions.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "a4e7e8bd"}, {"headline": "Indian Corporate Sector Sees Revenue Growth but Lower Profits", "summary": "Data from the June quarter shows that while Indian companies recorded a 7.2% increase in revenue, their combined net profit fell by 25.1%. The results reflect the impact of higher input costs and interest rates across key industrial sectors.", "category": "Economy", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "cb93de22"}, {"headline": "Market Experts Predict Indian Equities to Reach Record Highs in 2027", "summary": "Market analysts suggest that Indian equity indices could reach new record highs by early 2027. The positive outlook is driven by expectations of steady economic growth, moderate inflation, and continued foreign institutional investment inflows.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "ac15ba6d"}, {"headline": "India's Transition to Cashless Economy Accelerates with Rising Digital Payments", "summary": "New data reveals that digital payments via UPI and cards have significantly surpassed cash-based transactions in India. The shift is particularly evident in retail and e-commerce segments, where consumers are increasingly opting for digital wallets and contactless payments.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "499892db"}, {"headline": "Non-Banking Financial Companies Outperform Banks in Retail Lending Segment", "summary": "Retail-focused NBFCs are growing faster than traditional banks in the retail loan segment. While credit card usage has slowed, NBFCs have seen a surge in demand for personal and consumer durable loans, particularly in smaller cities.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "807d0a1b"}, {"headline": "Dairy Firm Milky Mist Prepares for Initial Public Offering", "summary": "Dairy product manufacturer Milky Mist is preparing for its initial public offering to fund its expansion plans. The company, known for its premium dairy products in South India, aims to use the proceeds to upgrade its manufacturing facilities and enter new markets.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "79c8842a"}, {"headline": "Implementation of Microfinance Credit Guarantee Scheme Faces Challenges", "summary": "The government's microfinance credit guarantee scheme has reportedly struggled to achieve its intended targets. Lenders have expressed concerns over the scheme's complex requirements and the slow pace of fund disbursement to small-scale borrowers.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "62a273ee"}, {"headline": "Proposed Mining Bill Aims to Limit State Taxation Powers", "summary": "A new central bill proposes to limit the powers of state governments to levy additional taxes on mining activities. The move aims to create a more uniform and predictable tax regime for the mining industry across India, following recent legal disputes over state-level cesses.", "category": "Economy", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "f41b73fc"}, {"headline": "Iran Expresses Readiness to Engage in Negotiations with US", "summary": "An Iranian government spokesperson stated that the country is prepared to enter into negotiations with the United States if certain conditions are met. The statement comes amid rising regional tensions and ongoing international efforts to revive the nuclear deal.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "e900edc7"}, {"headline": "Intel to Sell $15 Billion Stake to Fund Expansion Plans", "summary": "Intel Corp. plans to raise $15 billion through a share sale following a recent rally in its stock price. The funds will be used to support the company's ambitious plan to expand its chip manufacturing capacity and regain its leadership in the global semiconductor market.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "64c81712"}, {"headline": "Powerful Earthquake in Colombia Leaves Over 20 People Dead", "summary": "A powerful 7.4-magnitude earthquake in western Colombia has killed at least 20 people and injured dozens more. The quake caused widespread damage to buildings and infrastructure, leading to large-scale rescue and relief operations in the affected regions.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "3722c003"}, {"headline": "Sony and TSMC Discuss $6.4 Billion Joint Venture for Sensors", "summary": "Sony and TSMC are reportedly in advanced talks to establish a $6.4 billion joint venture for a semiconductor sensor factory in Japan. The project aims to secure a stable supply of advanced image sensors for the global smartphone and automotive markets.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "122705e1"}, {"headline": "Anthropic and Partners to Build AI-Focused Data Centres Globally", "summary": "AI startup Anthropic has partnered with Macquarie and GIC to develop a series of specialized data centres for AI workloads. The venture aims to build energy-efficient infrastructure that can handle the massive computing requirements of large language models.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "e63765e1"}, {"headline": "Fashion Giant Shein Receives $25 Billion Valuation Ahead of Public Offering", "summary": "Fast-fashion retailer Shein has reportedly been valued at around $22-25 billion as it prepares for its much-anticipated initial public offering. The valuation reflects the company's rapid global growth and its dominant position in the online fashion market.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "d01f21be"}, {"headline": "Taiwan Conducts First Internet-Slowing Drills to Test Cyber Resilience", "summary": "Taiwan has conducted its first-ever military drills that involve intentionally slowing down internet speeds to simulate a cyberattack. The exercise aims to test the resilience of the island's digital infrastructure and prepare for potential disruptions during a conflict.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "2178b365"}, {"headline": "US Announces New Fees for H1-B and L-1 Visa Extensions", "summary": "The US government has announced that extensions for H1-B and L-1 visas will require a new fee starting September 9. The move is part of a broader effort to fund the processing of visa applications and improve the efficiency of the country's immigration system.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "6271bb9e"}, {"headline": "Greek Island Ithaca Sees Tourism Surge Following Popular Media Series", "summary": "The Greek island of Ithaca has experienced a significant increase in tourism following the success of a popular media series inspired by Homer's Odyssey. Local businesses have reported record visitor numbers, boosting the island's economy after years of stagnation.", "category": "Culture", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "1ff21c76"}, {"headline": "Kalshi Partners with Nasdaq to Enhance Its Trade Surveillance Capabilities", "summary": "Prediction market platform Kalshi has entered into a partnership with Nasdaq to use its advanced trade surveillance technology. The move aims to improve the integrity of Kalshi's markets and ensure compliance with regulatory standards for financial trading.", "category": "Technology", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/133508", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/133508"}], "article_id": "3cc6410a"}, {"headline": "Airbus Joins Investigation Into Air India Phuket-Delhi Flight Altitude Plunge", "summary": "Airbus and French investigators have joined the probe into an Air India A320neo flight's 300-foot plunge near Phuket on August 4. Initially attributed to turbulence, reports now show nine technical failures occurred within one minute, including elevator faults and autopilot disconnect. The incident injured 17 people. The Aircraft Accident Investigation Bureau is leading the inquiry.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/133531"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 8, "article_id": "e87dde20"}, {"headline": "Bangladesh Formally Requests India to Expedite Extradition of Former PM Sheikh Hasina", "summary": "During a meeting with Indian High Commissioner Dinesh Trivedi, Bangladesh Prime Minister Tarique Rahman formally requested the expedited extradition of deposed leader Sheikh Hasina. Dhaka expressed outrage over Hasina's recent political remarks from New Delhi, warning they could undermine bilateral relations. Discussions also focused on creating a conducive environment for future ties.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133489"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 9, "article_id": "acb02a84"}, {"headline": "Vande Mataram to be Sung in Full at 80th Independence Day Celebrations", "summary": "For the first time, Vande Mataram will be sung in full from the Red Fort to mark the song's 150th anniversary and India's 80th Independence Day. The theme 'Yuva Shakti' focuses on youth's role in achieving 'Viksit Bharat' by 2047. Around 27,000 guests, including farmers and startup founders, will attend the ceremony featuring student achievers and National Cadet Corps volunteers.", "category": "Culture", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133465"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "importance": 7, "article_id": "e8a33631"}, {"headline": "Tamil Nadu Assembly Mandates Singing State Anthem at All Official Functions", "summary": "The Tamil Nadu Assembly unanimously passed a resolution making it mandatory to sing the state anthem, 'Tamil Thai Vaazhthu', at the start of all government, educational, and public sector functions. Moved by CM C. Joseph Vijay, the move aims to preserve the state's cultural and linguistic identity following recent controversies regarding the anthem's performance at official events.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133465"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133508"}], "importance": 8, "article_id": "d99478fe"}, {"headline": "Nine Family Members Killed as Van is Swept Away in Madhya Pradesh", "summary": "Nine members of a family, including children, died after their van was swept into a flooded drain while crossing an unfinished bridge in Madhya Pradesh's Rajgarh district. The driver reportedly ignored warnings about high water levels. While two people were rescued, the state administration has announced ₹4 lakh compensation for the next of kin of each deceased victim.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133531"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 8, "article_id": "8dc29a20"}, {"headline": "Amit Shah to Address Lok Sabha Debate on Student Protests and Police", "summary": "Home Minister Amit Shah will respond to a Lok Sabha debate regarding recent student protests and police actions. While the government expressed readiness to discuss issues including examination reforms and the Ram Temple, the Opposition demanded clarity on the use of pellet guns. Amid disruptions, the House passed the Tribunals Reforms Bill, 2026, to establish a National Tribunals Commission.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/133465"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "importance": 9, "article_id": "771cd6ee"}, {"headline": "New Bill Introduced to Bar States From Taxing Mineral Rights and Land", "summary": "The government introduced the Mines and Minerals Amendment Bill, 2026, in the Lok Sabha to prevent state governments from imposing taxes or royalties on mineral-bearing lands. The legislation follows a Supreme Court ruling that upheld states' taxing powers. The move aims to ensure commercial viability and bring uniformity to the mining sector by easing its financial burden.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "importance": 8, "article_id": "baea530d"}, {"headline": "Supreme Court to Hear Plea Challenging Ram Rahim's 2002 Murder Acquittal", "summary": "The Supreme Court has agreed to hear a plea challenging the acquittal of Dera Sacha Sauda chief Gurmeet Ram Rahim Singh in the 2002 murder of journalist Ram Chander Chhatrapati. A bench led by Justice Surya Kant issued a notice to the sect leader, who is currently imprisoned for other crimes. The final hearing is scheduled for November to review the Punjab and Haryana High Court's decision.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 8, "article_id": "36fc7cd8"}, {"headline": "Vodafone Idea Narrows Q1 Net Loss to ₹3,754 Crore as Revenue Grows", "summary": "Vodafone Idea reported a narrowed net loss of ₹3,754 crore for the June quarter, supported by a one-time accounting gain of ₹1,611 crore from legal settlements. Revenue from operations rose 6% to ₹11,689 crore, while average revenue per user reached ₹190. The company’s 5G services are live in 200 cities as it continues discussions with lenders to fund network expansion and compete with rivals.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Business Line", "pdf_filename": "BL Bangalore 11-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/133542"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/133508"}], "importance": 8, "article_id": "5e08f7c5"}, {"headline": "Powerful 7.4 Magnitude Earthquake in Western Colombia Kills Over 100 People", "summary": "A massive 7.4-magnitude earthquake struck western Colombia, claiming at least 111 lives and injuring hundreds. The quake destroyed more than 4,800 buildings across 20 municipalities, prompting a state of emergency. Tremors were felt as far as Bogota and Venezuela. Rescue teams continue searching for survivors in several cities where significant structural damage and building collapses occurred.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133531"}], "importance": 10, "article_id": "d7735443"}, {"headline": "Supreme Court Sets Hearing for Tamil Nadu's Cauvery Water Release Plea", "summary": "The Supreme Court has scheduled an August 13 hearing for Tamil Nadu's plea seeking the release of 3,500 cusecs of Cauvery water from Karnataka for 15 days. Tamil Nadu reports a shortfall of 26.954 tmc ft and alleges that Karnataka’s non-compliance with water-sharing orders has endangered Samba crops. The state argues that farmers are in a perilous situation due to the lack of irrigation.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 8, "article_id": "f155a52f"}, {"headline": "Nagaland CM Urges Review of FCRA Amendments Over Impact on Christian Organizations", "summary": "Nagaland Chief Minister Neiphiu Rio has expressed concerns to Home Minister Amit Shah regarding proposed amendments to the Foreign Contribution (Regulation) Act. Rio warned the changes could negatively impact Christian organizations and social services in the state. He requested that the bill be referred to a joint parliamentary committee for wider stakeholder consultation and a comprehensive review.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_11-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/133508"}], "importance": 6, "article_id": "912c8d6e"}, {"headline": "Supreme Court Proposes Special Courts for Manipur Ethnic Violence Cases", "summary": "The Supreme Court has requested the Gauhati High Court to establish special courts for day-to-day hearings of 2023 Manipur ethnic violence cases investigated by the CBI and NIA. The move aims to expedite trials for over 30 cases involving heinous crimes, including sexual assault. Current reports indicate that 891 out of 904 witnesses in CBI cases have yet to be examined by the judiciary.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 11-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133465"}], "importance": 8, "article_id": "758a38f0"}, {"headline": "Centre Achieves 74 Percent of Annual PSU Disinvestment Target", "summary": "The Indian government has raised ₹59,082.95 crore, nearly three-fourths of its ₹80,000-crore asset-sale target for the current fiscal year. The revenue was primarily driven by offer-for-sale (OFS) transactions in public sector companies, including a 6.5% stake in LIC and holdings in Coal India. The progress puts the Centre on track to meet disinvestment goals that were missed in previous years.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ¹¹⁰⁸²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/133544"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_11-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/133489"}], "importance": 8, "article_id": "cdf617ef"}, {"headline": "UPI Transactions Will Remain Free for Consumers and Small Merchants",
