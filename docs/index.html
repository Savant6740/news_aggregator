<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

[{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "f5fe5643"}, {"headline": "Government considers selling minority stake in state-run banks via OFS", "summary": "The Finance Ministry is evaluating a plan to sell minority stakes in state-owned lenders like Indian Overseas Bank through the Offer for Sale route. This move aims to help the government achieve its disinvestment targets and ensure banks meet the minimum 25% public shareholding requirement. The sale is expected to be launched in the second half of the current financial year.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "9eab98b0"}, {"headline": "Swiggy receives shareholder approval for proposed 1.25 billion dollar IPO", "summary": "Food delivery major Swiggy has reportedly received approval from its shareholders for its upcoming Initial Public Offering worth $1.25 billion. The company plans to raise ₹3,750 crore through a fresh issue of shares, alongside an offer for sale component. The IPO is expected to be one of the largest in the Indian consumer tech sector, valuing the company at over $12 billion.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "01a75a73"}, {"headline": "Akasa Air signs strategic deal with Boeing for maintenance and spares", "summary": "Akasa Air has entered into a strategic partnership with Boeing to enhance operational efficiency as it expands its fleet. The agreement covers a comprehensive package of maintenance services and spare parts for its Boeing 737 Max aircraft. The airline currently operates 24 aircraft and has a pending order for over 200 more as it prepares for international operations.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "c3a669fd"}, {"headline": "NHAI targets road projects worth ₹2 lakh crore in current fiscal", "summary": "The National Highways Authority of India has set a target to award highway projects spanning 5,000 km with a total investment of ₹2 lakh crore during FY25. The authority plans to focus on the Build-Operate-Transfer model to attract more private investment. Several greenfield expressways are identified for priority development to improve logistics efficiency across the country.", "category": "Infrastructure", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "61e25028"}, {"headline": "TCS partners with Burgan Bank to modernize banking technology in Kuwait", "summary": "Tata Consultancy Services has been selected by Burgan Bank in Kuwait to transform its core banking technology using the TCS BaNCS suite. The partnership aims to consolidate legacy systems into a single platform to improve operational efficiency and customer experience. This deal strengthens TCS's footprint in the Middle East financial services market.", "category": "Technology", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "f2a2888b"}, {"headline": "Health ministry issues advisory as heatwaves persist in Northern India", "summary": "The Ministry of Health issued a public health advisory as temperatures cross 45 degrees Celsius in several parts of North India. The advisory urges citizens to avoid outdoor activities during peak hours and maintain hydration. Hospitals have been directed to set up special heatstroke units and ensure adequate supplies of IV fluids as cases of heat exhaustion rise.", "category": "Health", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "87b57e69"}, {"headline": "Cabinet likely to approve hike in Kharif crop MSP next month", "summary": "The Union Cabinet is expected to consider a proposal to increase the Minimum Support Price for Kharif crops for the 2024-25 season in June. Sources indicate that the Commission for Agricultural Costs and Prices has recommended a 5-10% increase to cover rising input costs. The move comes ahead of the monsoon season and assembly elections in key states.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "841f23e5"}, {"headline": "Court extends judicial custody of politician in money laundering case", "summary": "A Delhi court has extended the judicial custody of a prominent politician in a money laundering case related to the scrapped excise policy. The judge noted that the investigation is at a crucial stage and releasing the accused could potentially hamper the probe. The next hearing in the case is scheduled for June after the conclusion of the general elections.", "category": "Law", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "62d34b38"}, {"headline": "BSE to cut transaction charges on equity derivatives from June 1", "summary": "BSE announced a reduction in transaction charges for its equity derivatives segment effective from June 1, 2024. The exchange aims to attract more retail participants and improve liquidity in its Sensex and Bankex options contracts. The revised fee structure will apply to all trades in the S&P BSE Sensex Options and S&P BSE Bankex Options.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143680", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_16-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/143680"}], "article_id": "5f6b63ed"}, {"headline": "Israeli Military Kills Senior Hamas Military Commander Samir Abu Younis", "summary": "The Israeli military and internal security agency Shin Bet confirmed the killing of Samir Abu Younis, a senior leader in Hamas's military wing. Younis, who reportedly played a key role in planning the October 7, 2023 attacks on Israel, was struck in Gaza. Hamas’s Al-Qassam Brigade confirmed his death, describing him as one of their most important commanders involved in strategic operations.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "29942aec"}, {"headline": "PM Modi Cites Poverty Decline and End of Naxalism as Milestones", "summary": "Addressing a gathering in Gadchiroli, Prime Minister Narendra Modi quoted a World Bank report stating nearly 50 crore Indians have escaped extreme poverty over the last 13 years. He termed the country's freedom from Naxalism and Maoist terror as a historic achievement. The PM also inaugurated 246 development projects worth ₹3,000 crore as part of the Janjatiya Gaurav Divas celebrations.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "2f711d4a"}, {"headline": "Severe Cyclonic Storm Akvan Likely to Strike Andhra Pradesh Coast", "summary": "A depression in the Bay of Bengal is expected to intensify into a very severe cyclonic storm, named Akvan, with wind speeds reaching up to 145 kmph. The system is moving towards the Andhra Pradesh coast. The Regional Meteorological Centre has forecast heavy to extremely heavy rain for northern coastal Tamil Nadu and Andhra districts between Monday and Wednesday.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "61bed645"}, {"headline": "Eight Injured in Slab Collapse at Under-Construction Hotel in Delhi", "summary": "Eight people were injured after a slab collapsed at an under-construction hotel in Central Delhi's Paharganj. The victims were rushed to Lady Hardinge Medical College and Hospital with various injuries, including fractures. Police are investigating how construction work was ongoing despite current restrictions in the Delhi-NCR region aimed at checking air pollution.", "category": "Infrastructure", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "e6327bbc"}, {"headline": "Yamuna Pollution Persists Despite Ambitious Clean-up Plans and DMRC Adjustments", "summary": "The Yamuna river remains heavily polluted with faecal coliform levels 660 times the desirable limit. The Delhi government plans to divert 500 cusecs of Ganga water by 2028 to flush pollutants. Meanwhile, Delhi Metro services will begin at 4:30 a.m. on Monday to facilitate devotees for the final day of Chhath Puja, following participation by CM Rekha Gupta and AAP leaders in evening rituals.", "category": "Environment", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "fd706e48"}, {"headline": "Four Arrested for Alleged Religious Conversion Bid in Gurugram Slums", "summary": "Gurugram Police arrested four women for allegedly attempting to influence children in makeshift schools to adopt Christianity. The accused, including citizens of Manipur, Mizoram, and Nepal, were reportedly luring children with food and gifts. They have been booked under the Haryana Prevention of Unlawful Conversion of Religion Act, 2022, following a complaint in Sector 56.", "category": "Law", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "31e32303"}, {"headline": "Man Arrested for Murdering Sister-in-Law Inside West Delhi Store", "summary": "Delhi police arrested a 23-year-old man, Suraj, for allegedly murdering his 18-year-old sister-in-law inside the trial room of a clothing store in Moti Nagar. The victim, Shabnam, was attacked with a sharp-edged weapon after an argument. CCTV footage helped identify the suspect, and a motive is currently being established through questioning.", "category": "Law", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "cee2d5f4"}, {"headline": "Haryana Guest Teachers Hold Mock Assembly to Demand Service Regularisation", "summary": "Guest teachers in Haryana held a symbolic mock Assembly in Kurukshetra to demand permanent status under a 2014 policy. The resolution seeks regularisation for teachers serving for up to 21 years. The group plans to submit their demands to Chief Minister Nayab Singh Saini and hold a national rally in Delhi on December 12 to seek intervention from the President.", "category": "Education", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "acb4ec39"}, {"headline": "Assam Minibus Owner Arrested Following Fatal Crash That Killed 26", "summary": "Police arrested Anjir Ali, the owner of a minibus involved in a collision with a truck near Kaziranga National Park that claimed 26 lives. Investigators suspect Ali tampered with the vehicle's speed regulator to increase trips. Meanwhile, Congress leaders have urged the Prime Minister to increase victim compensation to ₹20 lakh and improve safety on the National Highway-715 stretch.", "category": "Law", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "37e6e357"}, {"headline": "Madhya Pradesh CM Announces Crop Loss Survey in Rain-Deficit Alirajpur", "summary": "CM Mohan Yadav has ordered a crop loss survey in Alirajpur, the state's worst rain-deficit district, to facilitate financial aid for farmers. The district recorded 52% lower rainfall than normal. Additionally, the CM inaugurated the ₹1,353 crore Dahi Micro Lift Irrigation Project in Dhar, which aims to irrigate 47,000 hectares using Narmada river water across 126 villages.", "category": "Economy", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "aa259236"}, {"headline": "Family of Deceased Tamil Nadu Truck Driver Refuses to Receive Body", "summary": "Relatives of R. Balakrishnan, who died in police custody at the Chekkanoorani station, refused to accept his body after a post-mortem. The family alleges custodial torture and has demanded the arrest of the involved officers and a CBI probe. Local political groups joined the protest, citing procedural lapses and illegal detention without a formal FIR.", "category": "Law", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "e6794f6b"}, {"headline": "Yogi Adityanath Pledges Aggressive Job Creation for Uttar Pradesh Youth", "summary": "U.P. Chief Minister Yogi Adityanath distributed 25 lakh tablets to students and stated that his government has created 9.5 lakh jobs in the last nine years. He promised a massive push for employment in his potential third term starting in 2027. Adityanath also claimed the state's zero-tolerance policy towards crime has fundamentally transformed its identity and investment climate.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "32f44338"}, {"headline": "Conservationists Seek Action Against T.N. Minister for Harassing Tiger", "summary": "Wildlife activists have called for a case against Tamil Nadu Minister Vanni Arasu after a video surfaced showing him allegedly pursuing a tiger on foot in the Mudumalai Tiger Reserve. While forest officials claimed the Minister was on private resort land and accompanied for safety, conservationists argued that such actions violate the Wildlife Protection Act and set a poor precedent.", "category": "Environment", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "07325401"}, {"headline": "West Bengal BJP Chief Samik Bhattacharya Warns Missionary Schools Over Conversions", "summary": "BJP's West Bengal unit chief Samik Bhattacharya alleged that some Christian missionary schools are engaging in anti-India activities and religious conversions. He claimed one institution forbade a teacher from wearing saffron saris. Christian organizations have condemned the remarks as sweepingly general and dangerous, demanding that Bhattacharya name specific institutions involved.", "category": "Education", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "b12bd33c"}, {"headline": "Revanth Reddy Meets PM Modi to Discuss Telangana Irrigation and Sports", "summary": "Telangana CM Revanth Reddy requested Prime Minister Narendra Modi to expedite clearances for irrigation projects, including the Palamuru-Rangareddy scheme. He sought an additional ₹5,000 crore in special assistance and appealed for help in resolving the Tummidihatti project dispute with Maharashtra. Reddy also invited the PM to the 2026 Khelo India Youth Games in Hyderabad.", "category": "Infrastructure", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "050a65d6"}, {"headline": "Kashmir Health Experts Link Diabetes Spike to High-Calorie Wazwan Feasts", "summary": "Medical experts in Kashmir are attributing a sharp rise in Type 2 diabetes cases to the traditional wazwan feast. The multi-course meat-heavy meal can contain up to 5,500 calories. Data shows 2.18 lakh new diabetes patients in J&K over three years. Doctors suggest that the rice-centric diet and excessive mutton consumption contribute significantly to the region's metabolic health burden.", "category": "Health", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "90fdb912"}, {"headline": "Sabarimala Season Begins with Strict Crowd Management Targets for Pilgrims", "summary": "The annual Sabarimala pilgrimage begins Tuesday with authorities aiming to move 75 pilgrims per minute across the 18 holy steps. Devaswom Minister K. Muraleedharan ensured that production of Appam and Aravana prasadam is on track, with 75 lakh tins of Aravana ready. The government has released the first instalment of payments for local bodies to manage pilgrim facilities.", "category": "Culture", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "2a2d7029"}, {"headline": "CGHS Beneficiaries in Keralam Face Hardships Due to Doctor Shortage", "summary": "Over one lakh Central Government Health Scheme beneficiaries in Keralam, mostly pensioners, are facing severe delays and overcrowding. With only six wellness centres and a major shortage of doctors, elderly patients often queue from 4:30 a.m. The daily closure of the central server at 2 p.m. further restricts access to medicines and consultations for thousands of senior citizens.", "category": "Health", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "d2d7c1a1"}, {"headline": "Tamil Nadu Tells SC Karthigai Deepam Has No History on Hilltop", "summary": "The Tamil Nadu government informed the Supreme Court that there is no established tradition of lighting the Karthigai Deepam on the Thirupparankundram hill summit. The state clarified that the ritual has been performed only at the Deepa Mandapam for 150 years. The affidavit was filed in response to a petition by the Hindu Dharma Parishad seeking control of the site from the ASI.", "category": "Law", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "4f4a2a9b"}, {"headline": "Fourteen Arrested for Cheating Racket in J&K Recruitment Examination", "summary": "Jammu and Kashmir Police busted a cheating racket during the Services Selection Board Finance Assistant examination, arresting 14 individuals. The suspects allegedly planned to transmit answers to candidates using wireless radio sets and other modern electronic devices. The operation was based on intelligence inputs, and multiple teams were deployed to secure the examination's integrity.", "category": "Law", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "5e16860a"}, {"headline": "India and Egypt Plan Working Group to Finalise Potential Trade Pact", "summary": "Commerce Minister Piyush Goyal announced that India and Egypt will form a working group to establish terms of reference for a bilateral trade agreement. Bilateral trade currently stands at $6.5 billion. The ministers discussed boosting cooperation in pharmaceuticals, engineering, fintech, and culture, including the linking of India's UPI with Egyptian payment systems.", "category": "Economy", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143722", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143722"}], "article_id": "934d2ee2"}, {"headline": "SpaceX successfully captures Starship rocket at launch pad after test flight", "summary": "SpaceX’s Starship rocket was caught by mechanical arms at its Texas launch pad following a 22-hour test flight. The mission involved 14 orbits around Earth and the deployment of 26 Starlink satellites. This achievement marks a significant milestone in developing fully reusable rocket systems intended to drastically reduce space mission costs and increase launch frequency.", "category": "Science", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "dff9ac0a"}, {"headline": "Police arrest man for killing 17-year-old girl in west Delhi shop", "summary": "A 24-year-old man named Suraj Kumar was arrested for allegedly killing a 17-year-old girl inside an apparel shop in Moti Nagar. The suspect, who had a history of harassing the victim, allegedly slit her throat after she rejected his advances. The incident occurred despite a previous police case against him for assault in 2025 that resulted in a court acquittal in June 2026.", "category": "India", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "e0242805"}, {"headline": "Indian student enrollment in US colleges drops 6.5 percent in 2025-26", "summary": "The number of Indian students in the United States declined to 339,435 in the 2025–26 academic year, marking the first drop since 2020–21. Despite the 6.5% decrease, India remains the largest source of international students for the third consecutive year. The decline was largely driven by a 34% drop in graduate program enrollments amid tightening immigration measures.", "category": "Education", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "08530a49"}, {"headline": "Megaspeed launches probe into compliance amid Nvidia chip export allegations", "summary": "Singapore-based data center firm Megaspeed International has retained legal counsel to investigate claims of bypassing US export controls on Nvidia chips. The company stated that suspected spy Alice Huang left the firm in August 2025. Authorities are scrutinizing the company for allegedly routing high-end chips to China through Southeast Asian data centers to evade US restrictions.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "bde11936"}, {"headline": "Four family members killed as truck overturns on car in Haryana", "summary": "Four members of a Delhi-based family died when a truck carrying sacks of gram overturned onto their car on the Delhi-Jaipur National Highway. A five-year-old boy survived the accident with head injuries. The family was returning to Delhi after visiting a temple in Rajasthan when the crash occurred near Bawal in Rewari district around 11:30pm on Saturday.", "category": "India", "page": 1, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "a99285b3"}, {"headline": "US air travel chaos continues following botched communication line upgrade", "summary": "A nationwide ground stop in the United States triggered by a faulty air traffic control communication cable upgrade resulted in thousands of flight cancellations. President Donald Trump blamed the previous administration for the outdated system and demanded Congress release $50 billion for upgrades. Officials warn that travel disruptions could persist for another day as airlines recover.", "category": "World", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "a3e50fc5"}, {"headline": "Two arrested for Rajasthan railway blast suspected of having ISI links", "summary": "Police arrested two suspects from Punjab in connection with a November 3 railway track blast in Rajasthan’s Sri Ganganagar district. Investigators believe the pair has links to Pakistan’s Inter-Services Intelligence (ISI). The suspects allegedly made two unsuccessful attempts to blow up the line before carrying out the explosion that damaged concrete sleepers near the border.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "d0d3567e"}, {"headline": "El Nino impacts drive global sea surface temperatures to record highs", "summary": "Data indicates that the current El Nino phenomenon has pushed global sea surface temperatures to record levels in 2026. Experts project 2026 will be the second year to breach the 1.5°C warming threshold. The event has also led to record-high accumulated cyclone energy in the northeastern Pacific and triggered extreme weather events like heatwaves in Europe and droughts in India.", "category": "Environment", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "01b4c00d"}, {"headline": "Strong winds push Delhi air quality back into the poor category", "summary": "Delhi’s air quality index (AQI) improved significantly to 290 on Sunday, moving from the \"very poor\" to the \"poor\" category. Experts attributed the 77-point drop to stronger winds and a western disturbance that helped disperse pollutants. However, the relief is expected to be temporary, with air quality likely to deteriorate back to \"very poor\" in the coming days.", "category": "Environment", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "d917ee03"}, {"headline": "Eight workers injured as under-construction hotel building collapses in Paharganj", "summary": "An under-construction hotel building collapsed in Central Delhi’s Paharganj area on Sunday evening, injuring eight workers. The incident occurred during the removal of shuttering for a lintel on the second floor. All victims were rescued and are reported to be in stable condition. Authorities are investigating potential safety violations and illegal construction during pollution bans.", "category": "India", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "715bfd40"}, {"headline": "Brazilian legend Ronaldinho returns to professional football with Italian club", "summary": "More than a decade after retiring, Brazilian football icon Ronaldinho made his debut for Italian third-division club Ravenna. At age 46, the former Ballon d’Or winner played the first half of a local derby against Forlì, contributing to the buildup of a goal. Ronaldinho signed with the Serie C team in June 2026, marking his first club appearance since 2015.", "category": "Sports", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "7c11385d"}, {"headline": "Violent clashes erupt in Bangladesh over Sheikh Hasina’s planned return", "summary": "Supporters of deposed Prime Minister Sheikh Hasina staged violent demonstrations in her hometown of Gopalganj, Bangladesh. Activists attacked police vehicles and installations with machetes and spears, protesting against her removal and supporting her planned return in December. The unrest comes as political tensions rise following the student-led uprising that toppled her government.", "category": "World", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "58e49b78"}, {"headline": "International Court of Justice to rule on Myanmar Rohingya genocide case", "summary": "The International Court of Justice is set to deliver a landmark judgment this week on whether Myanmar committed genocide against its Rohingya minority. The case, brought by The Gambia, weighs accusations that Myanmar’s military campaign violated the 1948 UN convention. The ruling is expected to set a major international law benchmark for the gravest of global crimes.", "category": "World", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "c73619f9"}, {"headline": "World leaders prepare for APEC economic forum summit in China", "summary": "Leaders from 21 member economies, including the US, China, and Russia, are gathering in Shenzhen for the Asia-Pacific Economic Cooperation (APEC) forum. The summit focuses on regional growth and investment, representing 62% of global GDP. Key discussions are expected to include the Ukraine and West Asia conflicts, artificial intelligence, and trade relations between major powers.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "232c9903"}, {"headline": "Global space agencies and private firms race to build lunar bases", "summary": "A new space race is unfolding as the US-led Artemis program and the China-led International Lunar Research Station seek to establish permanent bases on the Moon's South Pole. A growing private industry is developing technologies for 3D-printed habitats using lunar soil, power-beaming infrastructure, and micro-rovers to support long-term human habitation within the next decade.", "category": "Science", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "b1ce9a08"}, {"headline": "Cab driver arrested for impersonating SDM to evade pollution curbs", "summary": "Delhi Police arrested a 59-year-old cab driver for allegedly impersonating a Ghaziabad sub-divisional magistrate (SDM). The suspect, Manoj Sharma, used fake identity cards to try to evade traffic restrictions on diesel vehicles under the Graded Response Action Plan (Grap). He was caught at a check in Civil Lines after spelling errors on the forged IDs raised suspicion.", "category": "India", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "e0dd9ac0"}, {"headline": "Two killed in Bawana following dispute and revenge attack", "summary": "A double murder occurred in North Delhi’s Bawana after a man shot his friend over an old dispute, only to be killed by the victim’s brother minutes later. Police arrested 30-year-old Naresh Kumar for allegedly bludgeoning Sonu Pradeep to death with a stone after Sonu had shot Sachin Kumar. The incident was reportedly rooted in a two-year-old grudge involving a previous assault.", "category": "India", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "6e0f75d2"}, {"headline": "Five arrested after woman shot dead during argument in Ghaziabad", "summary": "Ghaziabad Police arrested five members of a family for allegedly shooting a 34-year-old woman dead and injuring a man in Loni. The violence erupted following an argument that began when the victim’s brother reportedly urinated near the neighbors' residence. The suspects allegedly used casteist slurs before firing upon the victim and her friend during a confrontation.", "category": "India", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "08591184"}, {"headline": "Delhi schools grapple with infrastructure gaps as hybrid classes resume", "summary": "Schools in Delhi are facing implementation hurdles after the government directed a shift to hybrid learning for classes up to Class V due to air pollution. Teachers reported low attendance in online sessions, particularly in government schools, where many parents lack digital literacy or consistent internet access. Private school students show a strong preference for offline learning.", "category": "Education", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "ad2e0b51"}, {"headline": "Delhi Police seize heroin worth 5 crore in inter-state drug bust", "summary": "The Delhi Police anti-narcotics task force arrested six people and seized 2.25kg of heroin valued at approximately ₹5 crore. The operation began with the arrest of three family members at the Signature Bridge and expanded to raids in Ghaziabad and Roorkee. This was the first major case registered at the city’s newly operational narcotics-specific police station.", "category": "Law", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "1e656c00"}, {"headline": "Defunct mammography machines at Delhi govt hospitals force patients to private labs", "summary": "Major government-run hospitals in Delhi, including RML and Safdarjung, have been operating with non-functional mammography machines for years. The lack of operational diagnostic tools forced patients to pay for expensive scans at private facilities. Hospital authorities stated that equipment has reached the end of its service life and procurement for replacements is underway.", "category": "Health", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "7a0985b0"}, {"headline": "Security tightened at Bharat Mandapam for International Trade Fair", "summary": "Delhi Police deployed 3,000 personnel and 1,500 cameras at Bharat Mandapam for the 45th India International Trade Fair. The security arrangements include an AI-based facial recognition system and coordination with the CISF. The fair is expected to see a significant surge in footfall when it opens to the general public on November 19, with shuttle services ready for visitors.", "category": "Infrastructure", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "f43d1dd5"}, {"headline": "Akhilesh Yadav claims Dalits will oust BJP in 2027 UP elections", "summary": "Samajwadi Party chief Akhilesh Yadav asserted that the Dalit community has become \"damdar\" (assertive) and will help his PDA alliance defeat the BJP in the 2027 Uttar Pradesh assembly elections. Speaking in Agra, Yadav criticized the BJP for allegedly deleting marginalized voters from electoral rolls and claimed the upcoming fight would be between \"laptop and lathi.\"", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "468ebb1f"}, {"headline": "NITI Aayog to document PM Modi's 25-year governance legacy", "summary": "NITI Aayog is launching a series of five national workshops to document and draw lessons from Prime Minister Narendra Modi’s quarter-century as a head of government. The sessions, running through October 2027, will study his \"Pradhan Sevak\" approach and its impact on infrastructure, inclusion, and the global economy. The findings will be developed into research papers for civil servants.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "2fb48bfb"}, {"headline": "Punjab BJP constitutes manifesto and chargesheet committees for 2027 polls", "summary": "Punjab BJP president Kewal Singh Dhillon formed key committees to prepare for the 2027 state assembly elections. Senior leader Avinash Rai Khanna will head the manifesto committee, while Sunil Jakhar will lead the \"chargesheet\" committee. The groups include several high-profile members like Manpreet Badal and Amarinder Singh, aimed at developing a comprehensive election strategy.", "category": "Politics", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "122b809e"}, {"headline": "Rajnath Singh emphasizes defect-free production for national security", "summary": "Defence Minister Rajnath Singh stated that Indian defence manufacturing must adhere to the highest quality standards to ensure mission success. Addressing an aerospace conference, he called for embedding non-destructive evaluation (NDE) technologies at every manufacturing stage. Singh emphasized that achieving \"atmanirbharta\" requires India to become a global leader in critical domains.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "93e14f65"}, {"headline": "Four men killed as speeding car rams tree in Uttar Pradesh", "summary": "Four young men died in Ballia district, Uttar Pradesh, after their car went out of control during an attempt to overtake another vehicle and struck a tree. The victims were returning from Nagra Bazaar late Saturday when the crash occurred near Nichhuadih. Police have sent the bodies for autopsy and are investigating the cause of the high-speed accident.", "category": "India", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "22f457b8"}, {"headline": "Three from Pune family killed in head-on collision in Karnataka", "summary": "A family from Pune traveling to a temple in Karnataka met with a fatal accident when their car collided head-on with a truck in Belagavi district. Three people, including a four-year-old child, died on the spot, while three others were seriously injured. The IAF declared a full emergency at the site to facilitate rapid response by fire and ambulance teams.", "category": "India", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "5ec7dbc5"}, {"headline": "Odisha teacher rescued after surviving 15 days in forest ravine", "summary": "A 47-year-old primary school teacher in Odisha’s Kandhamal district was rescued after surviving on rainwater for 15 days inside a forest ravine. Mohan Kumar Maharana became trapped following a landslide triggered by Cyclone Arnab. A goat herder eventually heard his cries and alerted authorities. The teacher was found in an extremely weak condition but is expected to recover.", "category": "India", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "3a2d8a98"}, {"headline": "Six Haryana police personnel booked for murder following custody death", "summary": "Karnal Police registered a murder case against six of its personnel, including an inspector, after a 30-year-old man died in custody. The victim, Jitender Singh, had been detained in an Arms Act case. His family alleged he was healthy when picked up but was found dead shortly after. Protests by villagers and relatives led to the filing of the FIR and a judicial probe.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "d6713efb"}, {"headline": "Woman gang-raped and assaulted by four men in Rajasthan's Karauli", "summary": "A 30-year-old woman was allegedly gang-raped and brutally assaulted by four men in a forested area of Rajasthan’s Karauli district. The victim sustained serious facial injuries and is undergoing treatment at a district hospital. Police have detained one suspect and are searching for the remaining three. The incident occurred early Sunday when the woman was alone near a hill.", "category": "India", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "15cfd9d9"}, {"headline": "Homebuyers' forum proposes national tribunal and new laws to protect buyers", "summary": "The Forum for People’s Collective Efforts (FPCE) has submitted structural reform proposals to the Cabinet Secretariat to enhance protection under the RERA Act. Key demands include a national appellate tribunal, a statutory exit mechanism for personal cancellations, and automatic compensation for project delays. The forum aims to standardize interpretation of real estate laws across all states.", "category": "Economy", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "660df136"}, {"headline": "Houthi rebels launch ballistic missiles at Riyadh airport and business center", "summary": "Iran-aligned Houthi rebels in Yemen claimed to have targeted Riyadh’s King Khalid International Airport and a financial center with two ballistic missiles. The attack is part of an intensifying campaign against Saudi energy and transport infrastructure. While the Houthis claim successful strikes, Saudi authorities continue to manage regional security amid the ongoing civil war spillover.", "category": "World", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "6642b782"}, {"headline": "Non-smartphone electronic exports surge 57 percent in first half of FY27", "summary": "India's electronics exports are diversifying beyond smartphones, with non-smartphone components like circuit boards and memory chips growing by 57% in the current fiscal half. Total electronics exports reached $31.97 billion, with significant demand from China, Singapore, and the US. The surge reflects a broadening of India's manufacturing base across high-tech communication equipment.", "category": "Economy", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "029703d0"}, {"headline": "Surging airfares and regional conflicts alter Indian overseas travel plans", "summary": "Indian travelers are shifting holiday destinations toward Japan and Central Asia as rising airfares and West Asia tensions disrupt traditional routes. Data shows a 7% year-on-year decline in international passengers from India in the first half of 2026. Higher costs, driven partly by Iraqi and Pakistani airspace restrictions, have prompted travelers to opt for shorter, experience-led trips.", "category": "Economy", "page": 14, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "63489f36"}, {"headline": "Rory McIlroy wins eighth Race to Dubai title to tie record", "summary": "Northern Irish golfer Rory McIlroy secured his eighth Race to Dubai title, equaling the record held by Colin Montgomerie. McIlroy finished second in the season-ending DP World Tour Championship to clinch the seasonal points victory. His performance throughout the year solidified his position at the top of European golf, marking a historic achievement in his professional career.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "be0b078f"}, {"headline": "Magnus Carlsen remains winless as Fabiano Caruana tops chess group", "summary": "World number one Magnus Carlsen struggled at the Total Chess Pilot tournament in Budapest, remaining winless after a chaotic draw against Ian Nepomniachtchi. Meanwhile, American Grandmaster Fabiano Caruana secured the top spot in Group B. In other matches, India’s Arjun Erigaisi defeated Women’s World Championship challenger Vaishali Rameshbabu to lead his respective group.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "8f5580a1"}, {"headline": "Imtiaz Ali and Ananya Panday discuss cinema and Gen Z at HTLS", "summary": "Filmmaker Imtiaz Ali and actor Ananya Panday discussed the evolution of romance and the challenges of the film industry at the 24th Hindustan Times Leadership Summit. Ali addressed the nepotism debate, defending second-generation actors for their high parameters of success. Panday defended Gen Z against stereotypes of laziness, emphasizing that the generation simply defines success differently.", "category": "Culture", "page": 19, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "d6e10b56"}, {"headline": "Court releases man accused of circulating morphed photos of Sonakshi Sinha", "summary": "A Mumbai court ordered the release of Aryan Deepak Jain, who was arrested for allegedly circulating morphed nude images of actor Sonakshi Sinha. The magistrate ruled that the police failed to follow mandatory arrest procedures and did not produce the suspect before a local magistrate in Delhi. The court rejected the custody plea due to lapses in compliance with the BNSS.", "category": "Law", "page": 19, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "ac083b6c"}, {"headline": "Tiger Shroff returns to filming with strict security and NDAs", "summary": "Actor Tiger Shroff has resumed shooting for the film \"Lag Jaa Gale\" in Pune under heavy security following a shooting incident targeting his car in October. His team has been required to sign non-disclosure agreements regarding his schedules and locations. Despite the threats, Shroff completed a dance sequence with Janhvi Kapoor and is planning a new music release this week.", "category": "Culture", "page": 21, "importance": 3, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "39399543"}, {"headline": "Delhi Police foil plot to target Amitabh Bachchan's Mumbai residence", "summary": "Delhi Police’s Special Cell arrested two suspected shooters linked to a foreign-based gang for allegedly planning a firing incident at actor Amitabh Bachchan’s residence. The plot was reportedly motivated by the gang’s desire for extortion and retaliation over alleged remarks concerning the 1984 riots. The arrests also prevented a planned attack on a Delhi-based businessman.", "category": "India", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "6c5c1fc5"}, {"headline": "Director Nitesh Tiwari defends warrior portrayal of Sita in new film", "summary": "Filmmaker Nitesh Tiwari addressed criticism regarding his depiction of Sita as a warrior in the upcoming \"Ramayana: Rise of a Legend.\" Tiwari cited historical Sanskrit and Odia texts that describe Sita as an embodiment of Shakti who assume fierce forms. The portrayal, played by Sai Pallavi, aims to highlight the character’s strength and active role rather than just passive endurance.", "category": "Culture", "page": 20, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "236f11c7"}, {"headline": "Delhi University includes students in women's safety panel for first time", "summary": "Delhi University has reconstituted its Committee on Women Safety and Security to include elected student representatives. The decision follows protests over a recent gang-rape incident near the campus and marks the first time student union leaders have a formal role in administrative safety discussions. The panel plans to conduct safety audits and implement gender sensitization programs.", "category": "Education", "page": 24, "importance": 4, "telegram_url": "https://t.me/c/1877410077/143711", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT-Delhi 16-11.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/143711"}], "article_id": "08d6219c"}, {"headline": "India-China trade deficit projected to reach $150 billion in FY27", "summary": "India's trade deficit with China hit a record $83 billion in the first seven months of FY27, a 30% year-on-year increase. Imports rose 31% to $97 billion, while exports grew 38% to $14 billion. At current monthly averages of $12 billion, the annual deficit could approach $150 billion by the end of the fiscal year, up from $112 billion in FY26.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "904f63fe"}, {"headline": "Sebi considers revisiting promoter classification framework to identify control", "summary": "The Securities and Exchange Board of India is planning a consultation paper to review how 'promoters' are classified. The regulator may move toward identifying 'principal shareholders' with a 20% to 25% ownership threshold. The move addresses changing ownership patterns where founders exit firms and private equity investors seek significant control without formal promoter labels.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "c5b3dbc7"}, {"headline": "Indian automakers face rising procurement costs due to AI chip demand", "summary": "Tata Motors, M&M, and Ather Energy report increased semiconductor costs as AI data centers tighten global supplies. Manufacturers are paying premiums and building inventories to avoid production disruptions. Automotive memory chips face particular pressure, with prices expected to rise 70-100% in 2026 as suppliers prioritize higher-margin AI infrastructure products.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "2c8d9cfc"}, {"headline": "Commodities and energy sectors drive record corporate profits in Q2", "summary": "Listed companies reported record adjusted net profits of Rs 4.92 trillion in Q2FY27, up 29.8% year-on-year. Growth was primarily driven by mining, metals, and oil and gas firms, which benefited from higher prices and excise duty cuts. Conversely, pharma, cement, and IT services lagged, while manufacturing and service sector margins fell to a 16-quarter low.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "df91afd0"}, {"headline": "Andhra Pradesh readies Rs 25,000 crore space city near Sriharikota", "summary": "Andhra Pradesh is developing a private space technology hub spread across Sri Sathya Sai and Tirupati districts. The state signed Rs 1,800 crore in initial deals with startups like Agnikul Cosmos and Bellatrix Aerospace for rocket engine manufacturing and testing. The ecosystem aims to provide vertical integration for MSMEs near India's iconic launch pad.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "79de3f0b"}, {"headline": "Mahindra Finance to shift focus from vehicle loans to diversified segments", "summary": "Mahindra & Mahindra Financial Services plans to reduce its mobility loan share from 85% to 70% by FY31. The NBFC aims to scale up affordable housing and MSME lending to achieve a targeted AUM of Rs 3 trillion. MD Raul Rebello expects 16-18% compounded annual growth while maintaining return on assets between 2.2% and 2.5%.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "e2b06145"}, {"headline": "Tata Steel targets completion of NINL amalgamation by end of FY27", "summary": "Tata Steel is on track to finalize the merger of Neelachal Ispat Nigam Limited (NINL) this financial year, pending NCLT approval. The integration follows Tata Steel's Rs 12,100 crore acquisition of the asset. The company plans a Rs 40,000 crore expansion at the NINL site once the amalgamation is complete.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "b5efa163"}, {"headline": "Real estate pre-sales hit by approval delays despite strong luxury demand", "summary": "Major listed developers witnessed mixed Q2FY27 results as project approval delays slowed bookings. DLF saw a 12% decline in pre-sales, while Godrej Properties fell 5.8%. However, Oberoi Realty reported a seven-fold jump driven by a successful luxury launch in Gurugram. Analysts note market consolidation, with larger developers gaining share through superior execution.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "572450a1"}, {"headline": "Norwest India bets on value-added manufacturing with new $4 billion fund", "summary": "Investment firm Norwest has closed its largest-ever $4 billion fund to target growth capital in India, the US, and Israel. The firm is focusing on Indian 'value-added manufacturing' and healthcare services. MD Niren Shah highlighted that government policy supports like GST cuts and the 'China Plus One' strategy are driving Indian companies to strike long-term global deals.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "8da94bd0"}, {"headline": "FDA closes inspection of Dr Reddy's Hyderabad facility with VAI status", "summary": "The US Food and Drug Administration has classified its inspection of Dr Reddy’s Laboratories' Bachupally facility as 'Voluntary Action Indicated'. The regulator has officially closed the inspection of the formulations manufacturing unit. The company informed stock exchanges that the Good Manufacturing Practices probe, conducted in August 2026, is now concluded.", "category": "Health", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "b37f183b"}, {"headline": "Oracle executive advises measuring AI by results rather than agent count", "summary": "Businesses should judge AI success by measurable outcomes, such as reduced accounting errors or transport costs, according to Oracle senior VP Natalia Rachelson. She emphasized that the number of deployed agents is less important than the improvements they deliver. As technology shifts from assisting to performing work, companies must establish clear baselines for assessment.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "4db78f80"}, {"headline": "IIT Bhubaneswar and Coratia Tech to research advanced underwater systems", "summary": "IIT Bhubaneswar has partnered with Coratia Technologies to develop indigenous underwater communication and robotic platforms. The collaboration combines the institute's expertise in acoustic signal processing with Coratia's experience in unmanned underwater vehicles. The project aims to bridge the gap between laboratory research and industry-ready maritime solutions.", "category": "Science", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "6b2bf98c"}, {"headline": "India's first Zika vaccine recommended for Phase I human clinical trials", "summary": "An expert committee of the CDSCO has recommended Phase I human trials for a recombinant live attenuated Zika vaccine developed by Indian Immunologicals Limited. The trials, funded by ICMR, will evaluate safety and immunogenicity in healthy adults aged 18-50. Zika is a mosquito-borne virus that can cause severe birth defects if contracted during pregnancy.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "d1b6199f"}, {"headline": "Health insurance spending in India crosses 20% of total health expenditure", "summary": "Government-funded schemes and private health insurance accounted for 21.2% of India's total health expenditure in FY24, up from 15.9% in FY21. Out-of-pocket expenditure declined to 42.7% as government health spending rose nearly threefold over a decade to Rs 4.14 trillion. Increased investment in primary healthcare and Ayushman Bharat are credited for the shift.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "97d4a0d0"}, {"headline": "Delhi air pollution hits three-year high before Diwali fireworks", "summary": "Analysis by the Centre for Science and Environment reveals Delhi's PM2.5 levels were at a three-year high even before Diwali 2026. While farm fires contributed up to 16%, vehicular emissions and local sources remained the primary drivers. Poor air quality is now threatening Rabi crops like wheat and mustard, with ground-level ozone potentially damaging leaf tissues.", "category": "Environment", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "d461c5e4"}, {"headline": "Third-party litigation funding could unlock Rs 4.38 trillion in IBC recoveries", "summary": "The Ministry of Corporate Affairs is exploring third-party funding for insolvency proceedings involving fraudulent or undervalued transactions. Experts believe this could provide the private capital needed for forensic audits and legal battles. As of March 2026, nearly Rs 4.38 trillion was locked in pending avoidance applications, which currently see only a 12% clawback rate.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "ee3983f9"}, {"headline": "Scotch whisky imports held at ports over India-UK trade duty dispute", "summary": "UK Scotch whisky consignments are facing delays at Indian ports as Customs officials demand 150% duty, despite a trade agreement prescribing 75%. The Directorate of Revenue Intelligence argues the concession applies to bottled spirits, not bulk concentrates or compounds. The Ministry of Finance is engaging with stakeholders to resolve the definition of eligible imported goods.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "0c422c4e"}, {"headline": "BJP recalibrates UP policy and welfare outreach ahead of elections", "summary": "The BJP is expanding its welfare schemes in Uttar Pradesh to address youth discontent and farm distress before upcoming assembly polls. Key moves include a revamped Agnipath scheme, paddy procurement targets of 6.5 million tonnes, and raised dearness allowance for state employees. The party seeks to maintain its social coalition amid rising prices and agrarian challenges.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "f8de2bd1"}, {"headline": "Telangana targets $1 trillion economy through divided regional development zones", "summary": "Deputy CM Mallu Bhatti Vikramarka detailed a blueprint dividing Telangana into 'CURE', 'PURE', and 'RARE' zones for urban, peri-urban, and rural growth. The state is investing Rs 47,267 crore in capital outlay for FY27, viewing welfare schemes as investments to boost GST revenue. The plan prioritizes Hyderabad's infrastructure alongside regional clusters in districts like Warangal.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/143690", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi  16-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/143690"}], "article_id": "eecf6049"}, {"headline": "US working to formalize Quad Leaders' Summit alongside Asean meet", "summary": "The White House is moving to formalize a Quad summit in Manila next week featuring leaders from the US, India, Australia, and Japan. Despite concerns over shifting US foreign policy, officials emphasized that multiple mi
