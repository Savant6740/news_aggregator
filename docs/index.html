 for EPFO.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132681", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132681"}], "article_id": "55d311d1"}, {"headline": "Trump claims agreement reached to end West Asia conflict", "summary": "US President Donald Trump announced that a framework for a peace agreement has been reached to end the conflict in West Asia. The deal includes reopening the Strait of Hormuz and ending attacks on Jordan and Arab Gulf nations. In exchange, the US would lift naval blockades and allow Iran to resume oil exports under certain conditions.", "category": "World", "page": 20, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132681", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132681"}], "article_id": "235dc4a6"}, {"headline": "Controversy erupts over Indian hockey team's new saffron jersey", "summary": "Hockey India's decision to adopt a saffron-colored jersey for the upcoming World Cup has sparked debate. While the organization claims the color represents 'India's pride,' former players like Viren Rasquinha and critics have questioned the departure from the traditional blue jersey. Blue has been the primary identity of Indian hockey for decades.", "category": "Sports", "page": 20, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132681", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 03-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132681"}], "article_id": "984b3e79"}, {"headline": "Kerala rain death toll rises to 11 as 7,600 evacuated", "summary": "The death toll from rain-related incidents in Kerala reached 11 on Sunday. Over 7,600 people have been moved to 273 relief camps across the state. Malappuram reported the highest casualties with four deaths. The India Meteorological Department has issued a yellow alert for all 14 districts for Monday, though the intensity of rainfall is expected to decrease later in the week.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "59fab9af"}, {"headline": "Karnataka CM says Cauvery situation better; appeals against August 13 bandh", "summary": "Chief Minister D.K. Shivakumar stated the Cauvery water situation has improved due to recent rains but reiterated that water is being released only for drinking purposes. At an all-party meeting, he urged Kannada organizations to withdraw their August 13 bandh plan. He also emphasized that the Mekedatu project remains the long-term solution for water sharing disputes with Tamil Nadu.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "a709849f"}, {"headline": "Diesel and petrol consumption surges in July; LPG usage declines", "summary": "Diesel consumption rose by 9.4% and petrol by 8.7% in July, driven by a below-average monsoon that forced farmers to use irrigation machinery. Diesel sales hit 8.05 million metric tonnes. Conversely, LPG use fell 17.4% to 2.373 MMT despite the rollback of supply curbs. Increased adoption of piped natural gas among domestic and industrial consumers contributed to the decline in LPG demand.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "c64ba535"}, {"headline": "Bhiwani boxers lead India to record Commonwealth Games medal haul", "summary": "Boxers from Bhiwani, Haryana, powered India to its best-ever performance at the Commonwealth Games with 10 medals, including seven gold. Five of the gold medallists hail from the town known as 'Mini Cuba'. Coaches credited the success to a shift back to a transparent, trial-based selection process. The haul included four women gold medallists: Sakshi Chaudhary, Preeti Pawar, Jaismine, and Priya.", "category": "Sports", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "6b1046a2"}, {"headline": "Delhi transporters to march to Parliament over E20 fuel issues", "summary": "The Delhi Taxi and Tourist Transporters' Association announced a march to Parliament on Tuesday to protest the E20 petrol rollout. The group is demanding the continued availability of E0, E5, and E10 fuel grades and financial compensation for mileage losses and higher maintenance costs associated with ethanol-blended fuel. They have called on other motor unions to join the demonstration.", "category": "Infrastructure", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "ea8734bf"}, {"headline": "AAP and BJP trade charges over Vidya Vahini Yojana bicycle purchase", "summary": "AAP leader Saurabh Bharadwaj alleged a ₹90-crore scam in the Delhi government's purchase of 1.3 lakh bicycles for girl students, claiming tenders were tailored to benefit one firm. The BJP dismissed the allegations as an attempt to divert attention from other issues, stating the prices were consistent with market rates. The scheme aims to improve educational access for Class 9 students.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "3cf222c2"}, {"headline": "Delhi prison inmates' kin eligible for ₹7.5 lakh unnatural death compensation", "summary": "Chief Minister Rekha Gupta notified a new scheme providing up to ₹7.5 lakh compensation to families of inmates who die under unnatural circumstances in Delhi's jails. Clashes or torture by personnel merit ₹7.5 lakh, while medical negligence or suicide cases receive ₹5 lakh. A committee headed by the Director General of Prisons will review cases to ensure administrative accountability.", "category": "Law", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "a173b0a8"}, {"headline": "Six Bangladeshi nationals moved to Delhi detention centre for overstaying", "summary": "Delhi Police rounded up six Bangladeshi nationals for violating visa conditions by staying beyond the permitted 15-day duration per visit. They were discovered during inspections of hotels in central Delhi's Nabi Karim area. While their double-entry visas remained valid, they had exceeded the specific stay limits. They have been moved to a detention centre pending deportation.", "category": "India", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "ee1a67fe"}, {"headline": "Three people escape Rajouri Garden fire using sari as rope", "summary": "A three-year-old girl and two adults escaped a fire in a four-storey residential building in west Delhi's Rajouri Garden by sliding down a sari used as a makeshift rope. The blaze started in a ground-floor shaft containing waste material and spread upward. Five fire tenders brought the situation under control within 30 minutes. No injuries were reported in the incident.", "category": "Infrastructure", "page": 2, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "5c73472b"}, {"headline": "Delhi government doubles salaries of disaster management personnel", "summary": "Remuneration for Delhi Disaster Management Authority (DDMA) personnel has been increased by 100% with immediate effect. Chief Minister Rekha Gupta stated the hike was the first in 16 years and aims to support project officers and coordinators facing increased disaster management challenges. The move is part of a broader effort to modernize the capital's disaster response system.", "category": "Economy", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "e1347da6"}, {"headline": "Congress criticizes Delhi government proposal for 250 water ATMs", "summary": "Delhi Congress president Devender Yadav attacked the BJP-led Delhi government's plan to install 250 water ATMs in areas lacking pipeline connectivity. Yadav labeled the move a failure to provide permanent piped water and an attempt to divert attention from existing shortages. He demanded a time-bound expansion of the water network instead of temporary measures like tankers and ATMs.", "category": "Politics", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "3c4ed385"}, {"headline": "Digital arrest scam victim moves Delhi High Court for CBI probe", "summary": "A 75-year-old breast cancer survivor, who lost nearly ₹3 lakh and was forced to sell her home during a 21-day 'digital arrest,' has petitioned the Delhi High Court for a CBI investigation. She alleges the Delhi Police have made little progress since the FIR in April. Fraudsters claiming to be from the CBI and ED placed her under constant video surveillance to extort her assets.", "category": "Law", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "d31e7abd"}, {"headline": "Over 1.45 lakh register for Delhi Lakshmi Yojana on first day", "summary": "More than 1.45 lakh women registered for the Delhi Lakshmi Yojana within 24 hours of its portal launch. The scheme provides monthly financial aid of ₹2,500 to eligible women aged 21-60 from families with annual incomes up to ₹2.5 lakh. The government has allocated ₹5,100 crore for the initiative, which excludes taxpayers and government employees.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "be930667"}, {"headline": "Gurugram Forest Department staff protest seeking pay parity", "summary": "Contractual workers of the Gurugram Forest Department staged a protest outside Haryana Cabinet Minister Rao Narbir Singh's residence. Their demands include regularisation of services, implementation of 'equal pay for equal work,' and a minimum wage of ₹26,000. They also sought the reinstatement of employees who won court cases and action against alleged corruption within the department.", "category": "Environment", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "dd31b9e5"}, {"headline": "Drunk man arrested after driving away state bus in Andhra Pradesh", "summary": "A 45-year-old inebriated man, Siva Prasad, was arrested after he drove away a parked APSRTC bus from Kadiri to Madanapalle. The 80-km unauthorized journey triggered a police chase on Friday night. Prasad allegedly took the bus because no other transport was available for his travel. He was caught the following morning and taken into custody by the Annamayya district police.", "category": "India", "page": 3, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "784650f8"}, {"headline": "Container ship SSL Mumbai goes adrift off Cochin Port after failure", "summary": "The container ship SSL Mumbai suffered an engine failure and went adrift shortly after leaving Cochin Port on Saturday night. The vessel was brought to safety by two accompanying tugboats and moved to Ernakulam Wharf Q7. The incident caused a brief period of tension at the port, but no injuries or cargo damage were reported. The ship is now undergoing technical assessments.", "category": "Infrastructure", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "ea799c8b"}, {"headline": "Activist Amitabh Thakur seeks special cell for U.P. paper leak cases", "summary": "Social activist Amitabh Thakur has urged the Uttar Pradesh government to establish a state-level special monitoring cell to investigate and prosecute paper leak cases. Thakur highlighted that many serious cases remain pending for decades, undermining public faith in recruitment. He demanded a comprehensive review of all such cases and the appointment of special public prosecutors.", "category": "Education", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "3d325aa8"}, {"headline": "Congress demands White Paper on irregular recruitments in Uttar Pradesh", "summary": "The Congress party in Uttar Pradesh has demanded a White Paper detailing all recruitment exams conducted in the last nine years and the instances of paper leaks. National secretary Shahnawaz Alam criticized the state's 'zero tolerance' policy as ineffective, noting that many old cases involve ruling party allies. The party seeks transparency on actions taken against those responsible.", "category": "Politics", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "b3b6a841"}, {"headline": "Three killed in Karnataka landslip at Tirthahalli village", "summary": "A couple and their three-year-old son were killed when a landslip buried their zinc-sheet shed in Tirthahalli town, Shivamogga district. The family had migrated from Koppal for plantation work just four days prior. Heavy rain triggered the slip around 3:30 a.m. While one person was rescued alive, the three victims were retrieved from the debris by emergency services using earthmovers.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "bd42fb46"}, {"headline": "YSRCP legislator B. Virupakshi arrested over Dalit family attack", "summary": "Alur MLA B. Virupakshi and 14 followers were arrested for an alleged attack on a Dalit family in Chippagiri mandal, Andhra Pradesh. The incident followed a clash between YSRCP and TDP activists. The TDP alleged the MLA entered the home of an SC activist and assaulted him and his wife. Virupakshi was taken into custody after tension prevailed at the local police station.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "b7e73950"}, {"headline": "Centre announces interest-free loans for 45,000 tobacco farmers", "summary": "Union Minister Pemmasani Chandra Sekhar announced a relief package for tobacco farmers in Andhra Pradesh, including interest-free loans of ₹50,000 each for 45,000 growers. The ₹250-crore initiative aims to provide price support for various tobacco grades. Additionally, the state government will provide an incentive of ₹10 per kg for low-quality varieties via direct bank transfers.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "756ed2e8"}, {"headline": "Tata Trusts to shift focus toward building permanent institutions", "summary": "Noel Tata, Chairman of Tata Trusts, announced a strategic shift from project-based philanthropy to building enduring institutions in healthcare and education. The trust plans to establish 40 to 50 not-for-profit general hospitals using a cross-subsidy model. Tata emphasized that the move revives the legacy of the group's founders to provide high-quality services for future generations.", "category": "Education", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "7f71341f"}, {"headline": "Kerala Forest Department to remove illegal online geo-tags", "summary": "The Kerala Forest Department will identify and seek the removal of illegal geo-tagged locations inside reserve forests from online map platforms. Officials say unauthorized tagging of sensitive trekking trails encourages unlawful entry and endangers wildlife. The department's IT wing is compiling a list of these coordinates to forward to map agencies for immediate deletion.", "category": "Environment", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "271f8305"}, {"headline": "JPSC exam aspirants continue protest in Ranchi demanding CBI probe", "summary": "Hundreds of students in Ranchi continued their protest for the fifth day over alleged irregularities in the 14th Jharkhand Public Service Commission (JPSC) exam. Protesters are demanding a CBI investigation, claiming that OMR sheets were leaked and previous probes were unsatisfactory. They seek comprehensive reforms in recruitment agencies to prevent recurring paper leaks in the state.", "category": "Education", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "0dcfb2c0"}, {"headline": "BSP expels former MP and coordinator for indiscipline", "summary": "BSP president Mayawati announced the expulsion of former Rajya Sabha member Ashok Siddarth and party coordinator Randhir Singh Beniwal for repeated 'indiscipline' and violation of directives. Siddarth, the father-in-law of Akash Anand, had previously faced action during the Maharashtra assembly elections. The party cited the need for strict adherence to organizational rules.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "190190ea"}, {"headline": "Haryana CM Saini vows full MSP crop procurement in Punjab", "summary": "Addressing a 'Nasha Mukt Yuva' event in Kotkapura, Haryana CM Nayab Singh Saini expressed confidence that the BJP would form the government in Punjab next year. He promised that a BJP administration would procure all crops from farmers at Minimum Support Price (MSP), similar to the policy implemented in Haryana. Saini highlighted the party's commitment to strengthening the farming community.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "fe3929be"}, {"headline": "Punjab Congress rift deepens during Barnala party meeting", "summary": "Internal divisions in the Punjab Congress surfaced as supporters of former CM Charanjit Singh Channi raised slogans during a meeting attended by state in-charge Bhupesh Baghel. State chief Amrinder Singh Raja Warring urged workers to maintain discipline. Baghel maintained that the party operates on consensus and democracy, despite the visible friction among different leadership factions.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "6f04db09"}, {"headline": "Akhilesh Yadav accuses BJP of misusing vulnerable Ramlila artistes", "summary": "Samajwadi Party president Akhilesh Yadav criticized the BJP for allegedly using vulnerable artistes for political interests after an incident where an artiste dressed as Lord Hanuman was made to dance for a political event. Yadav made an 'offering' of ₹51,000 to two Ramlila artistes in Lucknow. He claimed the BJP's actions caused resentment among devotees and creators.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "6e9635ed"}, {"headline": "Census 2027 self-enumeration begins in Assam despite flood recovery", "summary": "Self-enumeration for Census 2027 commenced in Assam on Sunday, though work is suspended in the flood-hit districts of Sivasagar and Charaideo. Citizens can use the online portal until August 16 to provide household information. Trained enumerators will follow up with house-to-house visits starting August 17. Officials assured that all data collected is protected under the Census Act, 1948.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "7b3a3bdc"}, {"headline": "Tamil Nadu to withdraw cases against NEET student protesters", "summary": "The Tamil Nadu government has decided to withdraw all criminal cases registered against students who protested the alleged NEET paper leak. Education Minister Rajmohan stated that Chief Minister C. Joseph Vijay directed the move to protect students' futures. The protests included major demonstrations in Chennai and at Jantar Mantar in New Delhi against exam irregularities.", "category": "Education", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "395992b3"}, {"headline": "Raigad farmers oppose 'Third Mumbai' project over land acquisition", "summary": "Landowners across 124 villages in Raigad district are protesting the 'Third Mumbai' infrastructure project, fearing low compensation and displacement. The project, aimed at decongesting Mumbai, spans 323 square kilometers. Villagers in Chirner, who have a history of land-rights activism, submitted over 17,000 objections, demanding market-rate compensation and a partnership model for development.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "34c7ad0d"}, {"headline": "Accreditation or illusion? The debate over higher education quality", "summary": "The National Assessment and Accreditation Council (NAAC) faces scrutiny following a scandal where members were arrested for allegedly accepting bribes for 'A++' grades. Critics argue the system has become a documentation-heavy 'industry' that rewards presentation over academic depth. The National Education Policy 2020 proposes a restructured framework to emphasize genuine learning results.", "category": "Education", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "8c229b3a"}, {"headline": "Gaps in per capita public health spending expand globally", "summary": "WHO data indicates a three-fold expansion in the per capita health spending gap between low-middle-income countries (LMICs) and high-income countries since 2000. Development assistance for health is expected to drop by up to 60% by 2025. Experts call for LMICs like India to improve budget execution, governance, and focus on primary preventive care to maximize existing health allocations.", "category": "Health", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "508e4766"}, {"headline": "Supreme Court's rights-based framework for sex work analyzed", "summary": "Legal experts are analyzing a landmark May 29, 2026, Supreme Court judgment that affirms constitutional rights for consenting adult sex workers. The court ruled that agency and vulnerability can coexist and rejected forced rescues and indefinite detention in 'corrective homes.' The ruling invokes Article 142 to give these directions legal force across India.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "4cccdfea"}, {"headline": "Bengaluru initiates drives to clear footpath encroachments and garbage", "summary": "Minister Krishna Byre Gowda is leading campaigns to reclaim Bengaluru's pedestrian infrastructure from commercial encroachments, abandoned vehicles, and garbage blackspots. While residents welcome the move, street vendor unions argue they lack notified vending zones. Urban planners note that these temporary drives must be backed by long-term planning and public transport strengthening.", "category": "Infrastructure", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "c2c98120"}, {"headline": "Record heat in Europe triggers unprecedented wildfires in France, Spain", "summary": "Wildfires have destroyed 91,209 hectares in France this year, surpassing records since at least 1980. Spain has lost 1.9 lakh hectares, the second-highest figure since 2022. The World Weather Association attributes the severity to record-high temperatures and depleted soil moisture. Over 2.2 lakh people in the Bordeaux region were temporarily relocated due to the fires' rapid spread.", "category": "Environment", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "bea3511e"}, {"headline": "94,000 government schools closed in India over past decade", "summary": "A NITI Aayog report reveals that nearly 94,000 government schools were closed or merged over the last ten years under state-led rationalisation drives. Uttar Pradesh and Madhya Pradesh saw the highest closures. The trend has led to a 2.26 crore decline in government school enrolment and disproportionately affects girls and students from Scheduled Castes and Tribes in rural areas.", "category": "Education", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "b1b84bde"}, {"headline": "Leptospirosis becomes Kerala's deadliest communicable disease this year", "summary": "Leptospirosis claimed 50 lives in Kerala during July, making it the communicable disease with the highest mortality profile in the state. Heavy monsoons and high rodent proximity are cited as key environmental factors. Health experts recommend preventive gear like gum boots for manual laborers and emphasize early antibiotic treatment (Doxycycline) to curb the high case fatality rate.", "category": "Health", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "b7a500db"}, {"headline": "Social media childbirth advice leads to fatal medical complications", "summary": "The death of a 32-year-old woman in Tamil Nadu after a medically unassisted home birth has highlighted the dangers of 'free birth' influencers on social media. Platforms like YouTube and Instagram are hosting unvetted content promoting unassisted deliveries, often monetizing high-risk videos. Experts warn that avoiding medical supervision increases the risks of hemorrhage and stillbirth.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "c90d929f"}, {"headline": "Indian diaspora in China raises concerns over anti-India content", "summary": "At the Indian Embassy's first Open House in Beijing, diaspora members flagged abusive anti-India content on Chinese social media and difficulties in obtaining work visas. Ambassador Vikram Doraiswami stated the mission is using social media to counter misinformation and simplifying documentation for Chinese nationals to visit India to help improve bilateral ties and travel.", "category": "World", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "7ae56aef"}, {"headline": "Prashant Kishor accuses Patna SSP of influencing Bankipur bypoll", "summary": "Jan Suraaj Party founder Prashant Kishor alleged that Patna SSP Kartikey Kumar Sharma influenced the Bankipur byelection by raiding workers' homes and making illegal arrests. Kishor claimed over 50 people were detained under Section 144 despite no violations. He accused the police of acting on behalf of the BJP and misusing administration power during Nitish Kumar's tenure.", "category": "Politics", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "2d4fec93"}, {"headline": "Bihar municipal official murdered; wife alleges MLA Sonu Singh's involvement", "summary": "Vimal Kumar, Executive Officer of Dalmianagar Municipal Council, was beaten to death in Aurangabad. His wife, Babita Kumari, alleged that LJP (RV) MLA Rajiv Ranjan Singh, alias Sonu Singh, was pressuring her husband for ₹25 lakh to ₹50 lakh. The police have arrested the victim's driver, who reportedly confessed to the crime. An investigation into the MLA's alleged role is ongoing.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "d5e639fe"}, {"headline": "Youth Congress student helpline receives 3,000 calls in one week", "summary": "A helpline launched by the Indian Youth Congress to support students facing harassment during protests has received over 3,000 calls since July 27. IYC leaders noted a high volume of calls from women. The initiative follows a police case against a protester for 'insulting the Prime Minister's Office' at Jantar Mantar, which the Congress described as an attempt to stifle dissent.", "category": "Politics", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "42e6acb2"}, {"headline": "Congress labels SIT probe into Ram Temple theft a 'sham'", "summary": "Congress leader Pramod Tiwari dismissed the SIT probe into the alleged theft of Ram Temple donations as a sham and demanded a Supreme Court-monitored investigation. Tiwari alleged that financial irregularities date back to the 1980s and accused the BJP and RSS of excluding saints from the temple trust to maintain political control over the offerings and funds.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "2809fb0b"}, {"headline": "Rahul Gandhi demands apology from PM Modi over NEET suicides", "summary": "Leader of the Opposition Rahul Gandhi stated that students do not need the Prime Minister's forgiveness but deserve an apology for a 'dishonest system.' After meeting families of three students who died by suicide in Tamil Nadu, Gandhi criticized the government for destroying years of preparation through paper leaks and cancelled exams, calling for systemic education reforms.", "category": "Politics", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "935d714d"}, {"headline": "Aaditya Thackeray seeks clarity on withdrawal of student FIRs", "summary": "Shiv Sena (UBT) leader Aaditya Thackeray has written to Maharashtra DGP Sadanand Date seeking details on the procedure for withdrawing FIRs against protesting students. Thackeray noted confusion among parents and lawyers regarding whether students need to file independent court applications or if the Home Department will pursue the withdrawals suo motu through a standard procedure.", "category": "Politics", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "ce4807f9"}, {"headline": "YouTube terminates viral Delhi slum-dweller's channel; users protest", "summary": "YouTube terminated the channel of Mohammad Irfan, a Delhi slum-dweller whose content went viral after he recited the Preamble at a protest. Irfan's channel gained 70,000 subscribers in one day before being taken down for 'violating terms of service.' Supporters, including senior journalists, have called for the restoration of the account, labeling the termination an error.", "category": "Technology", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "466619fb"}, {"headline": "Raj Thackeray alleges ₹18 crore siphoned from Siddhivinayak Temple", "summary": "MNS president Raj Thackeray alleged that ₹18 crore in donations are stolen annually from Mumbai's Siddhivinayak Temple. Citing a letter from trustees to the Deputy CM, Thackeray claimed employees were caught stealing from donation boxes. He also alleged a massive ₹1,400-crore theft at the Ram Temple in Ayodhya and called for Prime Minister Modi to address these issues publicly.", "category": "Politics", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "f31986eb"}, {"headline": "FPIs return to Indian equities with ₹20,200 crore July inflow", "summary": "Foreign Portfolio Investors (FPIs) turned net buyers in July after four months of selling, pumping ₹20,200 crore into Indian stocks. The reversal follows a massive withdrawal of ₹1.17 lakh crore in March and ₹60,847 crore in April. Improved corporate earnings and attractive valuations are cited as key reasons for the renewed interest by foreign investors according to CDSL data.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "1c8ad792"}, {"headline": "Assam CM Sarma oversees flood recovery in Dibrugarh and Sivasagar", "summary": "Chief Minister Himanta Biswa Sarma toured flood-hit districts in eastern Assam to assess damage that has claimed 82 lives since April. Sarma waived July electricity bills for low-consumption households in Sivasagar and Charaideo and released funds for student uniforms. A comprehensive statewide flood damage assessment is set to begin on August 9 to guide rehabilitation efforts.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "d19e0344"}, {"headline": "India home to 8.25% of world's butterfly and moth species", "summary": "The Zoological Survey of India (ZSI) published a catalogue documenting 13,703 species of lepidoptera (butterflies and moths) in India. The 12-year study positions India as a megadiverse nation with 1,417 butterfly and 12,286 moth species. Scientists noted that butterflies and moths play vital roles as pollinators and food resources for insectivores in maintaining ecological balance.", "category": "Environment", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "e5a6a180"}, {"headline": "Israeli air strikes kill 13 Palestinians in deadliest day in weeks", "summary": "Israeli strikes targeted Gaza City, Deir al-Balah, and Khan Younis on Sunday, killing 13 people. Israeli Energy Minister Eli Cohen stated there was no deal to halt attacks despite U.S. President Trump's ceasefire breakthrough announcement. Israel demands Hamas disarm completely, while Hamas insists on a full military withdrawal and an end to strikes before handing over any weapons.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "dc9205e8"}, {"headline": "Accusations of hubris as FIFA President Infantino shelves private investment plan", "summary": "FIFA President Gianni Infantino withdrew a $4.2 billion private investment plan following a global backlash from major football governing bodies like UEFA and CONCACAF. Marketing experts described the situation as a 'fast fall from grace' and criticized the mismanagement of the multi-billion dollar scheme. Infantino faces significant pressure ahead of next year's leadership elections.", "category": "Sports", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "f08744bc"}, {"headline": "Nearly 120 scientists resign from ISRO raising brain drain concerns", "summary": "Reports of nearly 120 scientists resigning from the Indian Space Research Organisation (ISRO) have sparked concerns about workplace culture and rigid hierarchies. Experts argue that while Indian science produces brilliant minds, institutional bureaucracy and lack of autonomy are driving researchers toward private firms or international collaborations where professional dignity is better protected.", "category": "Science", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "fc05ec20"}, {"headline": "New metal alloy discovered in Hiroshima atomic bomb debris", "summary": "Researchers identified a previously unknown metal alloy inside 'hiroshimaites'—glass beads formed during the 1945 Hiroshima atomic blast. The complex alloy of iron, chromium, and nickel formed through ultrafast quenching in the 7,000-degree Celsius fireball. The discovery, published in Science Advances, demonstrates how nuclear detonations can act as laboratories for unique material synthesis.", "category": "Science", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132588", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 03-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132588"}], "article_id": "dc75e4a8"}, {"headline": "Kunal Kamra cancels Whitefield shows after Hindu activists' opposition", "summary": "Comedian Kunal Kamra cancelled his scheduled stand-up shows in Whitefield, Bengaluru, due to opposition from Hindu activists. The performer moved the event to Koramangala to ensure it proceeded safely. This follows previous protests against his content in the city. Organizers stated the shift was necessary to maintain security for both the audience and the artist.", "category": "Culture", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "5f3cde1e"}, {"headline": "Karnataka government keeps legal options open as Kabini reservoir refills", "summary": "Nearly 4tmcft of water is expected to flow into Tamil Nadu as the Kabini reservoir reaches full capacity. The Karnataka government stated it is monitoring levels and will keep all legal options open before the Supreme Court to protect state interests. Rainfall in the Cauvery basin has surged recently, leading to significant inflows into state dams after a prolonged dry period.", "category": "India", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "494e29b7"}, {"headline": "Former MLA Vatal Nagaraj confirms August 13 Karnataka bandh schedule", "summary": "Kannada activist and former MLA Vatal Nagaraj affirmed that the statewide bandh on August 13 will proceed as planned. He urged the state government to prioritize the Mekedatu reservoir project. The protest aims to draw attention to regional water rights and infrastructure demands amidst ongoing disputes over Cauvery water sharing with neighboring Tamil Nadu.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "a90d819b"}, {"headline": "Heavy rain triggers wall collapse killing three family members in Shivamogga", "summary": "Three members of a family, including a child, died when a 60-foot retaining wall collapsed onto temporary sheds in Thirthahalli, Shivamogga. Continuous heavy rain in the Malnad region triggered the landslide. Local officials reported that while three perished, over 16 other residents managed to escape the incident caused by severe monsoon weather impacting the district.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "490a8df0"}, {"headline": "Over 10,000 cases pending in Supreme Court for over a decade", "summary": "Law Minister Arjun Ram Meghwal informed Parliament that more than 10,000 cases have been pending in the Supreme Court for over 10 years. Additionally, 80,000 cases in High Courts remain unresolved after three decades. The government cited judicial vacancies and lack of fixed timeframes for disposal as key factors contributing to the massive legal backlog across the country.", "category": "Law", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "15c2710c"}, {"headline": "Doctors successfully preserve 23 sperms for teenage cancer survivor", "summary": "Specialists at Sir HN Reliance Foundation Hospital preserved 23 viable sperms for a 19-year-old testicular cancer patient. The complex procedure, known as 'ex-vivo Onco-TESE,' was performed during surgery to remove a tumor-affected testis. This medical breakthrough provides the young survivor a future opportunity for biological fatherhood despite his condition and surgery.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "004e4873"}, {"headline": "NTA seeks 24/7 security for offices and confidential examination materials", "summary": "The National Testing Agency (NTA) is inviting tenders to hire professional security for its offices and warehouses. The agency plans to spend ₹7.5 crore for round-the-clock monitoring of sensitive areas and confidential exam records. This initiative follows recent paper leaks and aims to restore the integrity and security of national entrance exams for millions of students.", "category": "Education", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "68d8c160"}, {"headline": "National highway fatalities in India record first decline since pandemic", "summary": "Fatalities on India's national highways fell by 4.1% in 2024, marking the first decline since the Covid-19 pandemic. Government data showed NH deaths dropped from 64,772 to 62,122. While total road deaths rose slightly, the reduction on highways is attributed to better safety enforcement and improved infrastructure design across key transit corridors in multiple states.", "category": "Infrastructure", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "80793392"}, {"headline": "India’s Russian crude oil imports reach record high in July", "summary": "India's imports of Russian crude oil surged to 2.8 million barrels per day in July, representing over 50% of the country's total imports. As Western sanctions continue to redirect Russian energy, Indian refiners have significantly increased their intake of discounted barrels. This shift has made Russia India's largest oil supplier, surpassing traditional West Asian partners.", "category": "Economy", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "cba3bfe7"}, {"headline": "Donald Trump suspends planned military strikes on Iran citing diplomatic progress", "summary": "Former US President Donald Trump announced a halt to planned military strikes against Iran, claiming a breakthrough in nuclear deal negotiations. Trump stated that Iranian efforts to revive the 2015 agreement showed enough promise to delay kinetic action. The move follows intensive shuttle diplomacy by Middle Eastern mediators aimed at de-escalating regional tensions.", "category": "World", "page": 5, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "98e4c5e6"}, {"headline": "Indian women athletes secure eight gold medals at Commonwealth Games", "summary": "India's women athletes won eight of the country's 13 gold medals at the Commonwealth Games. The contingent secured a total of 39 medals, with standout performances in boxing and wrestling. Winners like Lovlina Borgohain helped India maintain a high position on the leaderboard, highlighting the growing prowess and investment in female athletes on the global stage.", "category": "Sports", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "9b0c54de"}, {"headline": "Women dominate workforce in India's expanding electronics manufacturing sector", "summary": "Major electronics firms like Foxconn and Tata Electronics are hiring women for over 70% of high-precision assembly roles. In factories across Tamil Nadu and Karnataka, specialized training and on-site dormitories have boosted female participation. This shift is part of a broader trend where women are becoming the primary workforce in India's growing high-tech manufacturing industry.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "fb9d04ba"}, {"headline": "ISRO satellites grounded at spaceport awaiting final government launch clearance", "summary": "Two strategic satellites, NVS-03 and Gisat-1A, are currently grounded at Sriharikota awaiting final government approval. The delay has impacted the launch schedule for the GSLV-Mk2 rocket. While the hardware is ready, the mission remains on hold due to administrative requirements related to national security and strategic communication goals for the current year.", "category": "Science", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "f2ffffd3"}, {"headline": "Mumbai couples increase premarital background checks following recent violent incidents", "summary": "Detective agencies in Mumbai report a sharp rise in premarital background check requests. This trend follows recent incidents of domestic violence, including a high-profile case at Lohagad Fort. Families are seeking detailed verification of potential partners' past relationships, financial status, and social media behavior to ensure safety before finalizing marriages.", "category": "India", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "15902de4"}, {"headline": "Supreme Court rejects petition seeking review of Anurag Thakur’s clean chit", "summary": "The Supreme Court dismissed a petition by Brinda Karat seeking a review of its decision to give BJP leaders Anurag Thakur and Parvesh Verma a clean chit in an alleged hate speech case. The court maintained there was no prima facie case to initiate criminal proceedings. The ruling ends a years-long legal effort to hold the politicians accountable for controversial remarks made in 2020.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "fd549ee4"}, {"headline": "India’s electric vehicle sales surge by 66 percent in July", "summary": "Electric vehicle registrations in India grew by 66% in July, reaching nearly 3.3 lakh units. The two-wheeler segment led the drive, accounting for over 1.2 lakh sales. Growth is attributed to improved battery technology, expanded charging networks, and government subsidies, signaling a significant shift toward sustainable urban transport among middle-class consumers.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "f8d1cab0"}, {"headline": "International drug mule arrested outside Bengaluru airport with 3kg ganja", "summary": "A 40-year-old man from Maharashtra was arrested outside Kempegowda International Airport with 3kg of high-grade ganja. The suspect had allegedly smuggled the drugs from Thailand, clearing customs before being caught. Police believe he is part of an international syndicate using air routes to deliver narcotics to major Indian cities for local distribution networks.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "a6f9cf7b"}, {"headline": "Drug peddler arrested for running distribution network near Bengaluru police station", "summary": "Police arrested a 30-year-old drug peddler operating a distribution network just 100 meters from Chamarajpet police station. The suspect used courier services to deliver synthetic drugs and ganja, worth ₹50 lakh, across the city. Authorities uncovered a sophisticated model that avoided detection by using regular delivery channels to move narcotics stealthily.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "c7e0408f"}, {"headline": "Notorious history-sheeter brandishes machete in public threatening Bengaluru citizens", "summary": "A 31-year-old history-sheeter caused chaos in Bengaluru's Old Mill Road by brandishing a machete and threatening the public. When police arrived, the suspect threatened self-harm before being apprehended. He has been booked for criminal intimidation. The incident raised concerns about local gang activity and the safety of residents in busy city neighborhood areas.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "916263fc"}, {"headline": "Private bus driver robbed at knifepoint during daylight in Bengaluru", "summary": "A private bus driver was robbed of his phone and gold chain at knifepoint by two motorcycle-borne men in Bengaluru's Byatarayanapura. The daylight robbery took place while the victim was on a service trip. Police are examining CCTV footage from the area to identify the suspects, as the incident highlights rising concerns over street crime and public safety in broad daylight.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "42dc7289"}, {"headline": "Karnataka authorities approve Hebbal lake land use for tunnel project", "summary": "The Karnataka Tank Conservation Authority approved the use of 3.3 acres of Hebbal lake land for a proposed tunnel road project. Officials stated the project includes measures to protect water levels and local ecology. However, the decision has drawn criticism from environmentalists who worry about the impact on the lake's delicate ecosystem and city biodiversity.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "dcf4a1cb"}, {"headline": "Lalbagh morning walkers form human chain against proposed tunnel road", "summary": "Hundreds of morning walkers and activists formed a human chain at Lalbagh Botanical Garden to protest a proposed tunnel road. They argue the project will damage the city's green cover and affect groundwater systems. Protesters are demanding that the government prioritize ecological preservation over massive infrastructure projects that threaten historic green landmarks.", "category": "Environment", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "e0607e5f"}, {"headline": "Karnataka High Court upholds Hindu Succession Act provision for former royals", "summary": "The Karnataka High Court upheld Section 5(ii) of the Hindu Succession Act, which regulates inheritance of impartible estates for former rulers. The court dismissed a petition challenging the clause, ruling it does not violate constitutional equality. The decision impacts long-standing property disputes among descendants of the state's former princely families and rulers.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "d85ab4e2"}, {"headline": "Forest department seizes seven SUVs for illegal off-roading in Sakleshpur", "summary": "Karnataka forest officials seized seven high-end SUVs and booked 22 people for illegal off-roading in protected forest areas of Sakleshpur. The group was caught driving through sensitive terrain and camping without permission. Authorities warned of strict penalties for activities that disturb wildlife and damage the local ecosystem during the fragile monsoon season.", "category": "Environment", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "1c83d747"}, {"headline": "New research highlights significant water-related risks for Bengaluru homeowners", "summary": "A study of 611 residential projects in Bengaluru found that over 53% face risks of flooding or groundwater depletion. Researchers warned that many new developments are built on former lake beds or low-lying land. The report advises potential homebuyers to conduct thorough drainage and soil quality checks before investing in real estate across the expanding city.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "6ced3a2e"}, {"headline": "Karnataka government implements new police transfer policy to curb lobbying", "summary": "The Karnataka Home Department has issued new guidelines for police transfers to reduce political influence and ensure fixed tenures. The policy mandates minimum service terms and cooling-off periods for officers before new postings. These reforms aim to create a more transparent, performance-based system and prevent frequent, arbitrary transfers within the state force.", "category": "Politics", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "680012c7"}, {"headline": "Elderly pedestrian killed by KSRTC bus in Bengaluru road accident", "summary": "An 86-year-old man was killed after being hit by a KSRTC bus while crossing a road in Yeshwantpur, Bengaluru. The victim sustained fatal injuries and was pronounced dead at a nearby hospital. Police have arrested the bus driver and registered a case of rash and negligent driving, highlighting ongoing concerns regarding pedestrian safety in the city's heavy traffic zones.", "category": "India", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "65112650"}, {"headline": "Bengaluru records second-driest July in over a century as monsoon weakens", "summary": "Bengaluru recorded its second-driest July in 108 years, receiving only 18.5mm of rain against a 94mm average. Meteorologists attribute the deficit to a weak monsoon phase over southern India. The lack of rainfall has raised concerns about city water levels and agricultural output, with authorities monitoring state reservoirs for potential shortages in the coming months.", "category": "Environment", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "6cc420aa"}, {"headline": "Karnataka Examination Authority investigates OMR sheet numbering error reports", "summary": "The Karnataka Examination Authority (KEA) has requested a report after candidates alleged numbering errors on OMR sheets during a recent recruitment exam. Some reported mismatches between answer sheet serial numbers and attendance registers. KEA stated they are looking into the matter to ensure the fairness and transparency of the state's official selection process.", "category": "Education", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "ed3710f5"}, {"headline": "Three Bengaluru police officers care for baby during mother's exam", "summary": "Three women police officers at a Bengaluru exam center cared for an eight-month-old baby while his mother appeared for a recruitment test. The officers took turns rocking and singing to the infant after he became restless. This act of compassion has been widely praised on social media, showcasing the supportive and humane side of the city's law enforcement force.", "category": "India", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "227fe17b"}, {"headline": "Karnataka faces potential 17th drought declaration in twenty-six years", "summary": "With a 26% rainfall deficit in July, Karnataka is considering declaring a drought for the 17th time since 2001. Data shows 176 out of 236 taluks are experiencing drought-like conditions. The state government is monitoring crop losses and water levels closely to determine if central assistance is required to mitigate the impact on farmers and municipal water supply.", "category": "Environment", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "faedc5c4"}, {"headline": "Water levels in Tungabhadra dam rise sharply following heavy rainfall", "summary": "Inflows into the Tungabhadra dam have surged due to heavy rain in the Malnad region. The reservoir is expected to reach full capacity soon, providing significant relief to farmers in the command area. Authorities have already begun releasing water into canals for irrigation, marking a major turnaround from previous months' drought-like conditions and low water levels.", "category": "Environment", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "e9ed006c"}, {"headline": "Union Minister Shobha Karandlaje demands CBI probe into veterinary recruitment", "summary": "Union Minister Shobha Karandlaje has requested a CBI probe into alleged corruption in the recruitment of veterinary officers in Karnataka. She claimed the selection process by the state service commission was marred by irregularities and favoritism. Karandlaje called for a transparent investigation to ensure that qualified candidates are not unfairly bypassed in government hiring.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "a4871450"}, {"headline": "Central government allocated ₹90 crore for Karnataka’s protected monuments", "summary": "The Union Ministry of Culture provided ₹90 crore over three years for the upkeep of 509 protected monuments in Karnataka. The funding focuses on conservation, site development, and improving visitor amenities. State officials noted that these investments are essential for preserving the region's rich historical heritage and promoting cultural tourism to iconic historical sites.", "category": "Culture", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "e33fc397"}, {"headline": "NHA allows oncologists with specialized fellowships to join Ayushman Bharat", "summary": "The National Health Authority (NHA) updated its guidelines to permit oncologists with fellowships from recognized institutes to be empanelled under Ayushman Bharat. This change, which previously only allowed MD or MCh holders, aims to increase the number of specialists available for cancer care in smaller cities, significantly improving treatment access for millions of beneficiaries.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "3cc5845b"}, {"headline": "CBI investigates wife of railway officer for alleged recruitment exam fraud", "summary": "The CBI is probing the wife of a senior railway official for her role in a recruitment examination scam. She is accused of facilitating illegal appointments through bribes and manipulating test results. The investigation has uncovered a network that helped unqualified candidates secure government jobs by bypassing standard selection and official vetting procedures.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "0a928a69"}, {"headline": "Sun Pharma recalls eleven eye medications from market over safety concerns", "summary": "Sun Pharmaceutical Industries has voluntarily withdrawn 11 types of eye medications, including drops for glaucoma, due to potential contamination risks. The recall followed a recent inspection at one of its manufacturing plants. The company has advised all retailers and distributors to stop sales immediately and return existing stocks to ensure consumer safety and health.", "category": "Health", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "9666a100"}, {"headline": "Trafficked woman from Bihar dies after falling while escaping Madhya Pradesh", "summary": "A 23-year-old woman, allegedly trafficked from Bihar and sold into marriage in Madhya Pradesh, died after falling from a roof while trying to escape. Police arrested several individuals linked to the human trafficking ring that lured her with a fake marriage proposal. The case highlights the persistent national issue of cross-state trafficking and exploitation of women.", "category": "Law", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "752d9c0d"}, {"headline": "Five men sentenced to life for kidnapping girl missing since 2007", "summary": "An Aligarh court sentenced five men to life imprisonment for kidnapping a teenage girl in 2007. Despite the conviction, the victim remains missing 19 years later. The family welcomed the judgment but continues their long search for her. The case underscores the difficult legal journey for victims of kidnapping and the enduring trauma faced by their families over decades.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "f96da818"}, {"headline": "Education experts debate reforms to India's competitive entrance examination system", "summary": "Following recent controversies, educationists are debating major reforms for exams like NEET and CUET. Proposed changes include multiple attempts per year, decentralizing testing centers, and giving more weight to board exam performance. The goal is to create a more secure and student-friendly system that reduces reliance on expensive coaching centers and single-day testing.", "category": "Education", "page": 11, "importance": 8, "telegram_url": "https://t.m formance at the Commonwealth Games, she emphasized the importance of staying motivated and enjoying the competitive journey. Lovlina remains a key part of India's elite sports contingent and is looking forward to upcoming major international challenges.", "category": "Sports", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "672e2b1d"}, {"headline": "Boxing coach Santiago Nieva praises Indian athletes’ performance at CWG", "summary": "India's boxing coach Santiago Nieva expressed satisfaction with the team's performance and medal haul at the Commonwealth Games. He highlighted the significant progress made by both young and experienced boxers. Nieva noted that the medals won are a testament to the team's hard work and will serve as a strong foundation for future international competitions and Olympic goals.", "category": "Sports", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "d6e88fbc"}, {"headline": "Lovlina Borgohain identifies incorrect map of India at Glasgow restaurant", "summary": "Indian boxer Lovlina Borgohain noticed and pointed out an inaccurate map of India at a restaurant in Glasgow. The map reportedly omitted certain regions, which she brought to the attention of the management. The incident sparked a conversation about the need for accurate geographical representation and respect for national boundaries in prominent international settings.", "category": "Sports", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf ": "Analysts predict that 2026 will be a record-breaking year for Hollywood films in the Indian box office. With several highly anticipated blockbusters scheduled for release, industry experts expect unprecedented viewership and revenue growth. Studios are increasing their focus on localized marketing and multiple-language dubbing to capture a broader audience across the country.", "category": "Culture", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "7c17838c"}, {"headline": "Debate grows over potential for Bengaluru to transition into 24/7 economy", "summary": "A debate is ongoing over whether Bengaluru should transition into a 24/7 economy to boost growth and cater to its tech workforce. Proponents believe this would make the city more vibrant and economically competitive. However, experts highlighted significant challenges, including the need for better public transport, enhanced security, and fair working conditions for night staff.", "category": "Infrastructure", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132661", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 03-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132661"}], "article_id": "cb78fb91"}, {"headline": "Actress Rashmika Mandanna sidelined from filming following minor hip injury", "summary": "Actress Rashmika Mandanna is taking a break from filming after suffering a minor hip injury during a dance sequence. Doctors recommended several days of rest, leading to temporary changes in the shooting schedules of her upcoming film projects. Mandanna's team stated she is recovering well and expects to return to work soon after her prescribed medical rest period.", "category": "Culture", "page": 17, "importance": 4, "teleg
