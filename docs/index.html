uja pandals are focusing on heritage themes this year, recreating iconic film sets and colonial-era architecture. Organizers are using the festival to raise awareness about the need to restore the city's historical buildings and celebrate its cultural history.", "category": "Culture", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "9bb0436a"}, {"headline": "Govt silent on technical queries from ACC PLI bidders", "summary": "The Ministry of Heavy Industries has reportedly failed to provide specific answers to technical queries from bidders for the Advanced Chemistry Cell (ACC) PLI scheme. Bidders sought clarity on vanadium redox flow batteries and domestic value addition calculations before the bidding deadline.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "c6682b1d"}, {"headline": "Sameera Group to invest ₹1,800 crore in Tamil Nadu warehousing", "summary": "Real estate developer Sameera Group plans to invest up to ₹1,800 crore to develop industrial parks and warehousing across six locations in Tamil Nadu. The project aims to add 150 lakh sq ft of space to meet growing demand from the Chennai industrial corridor.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "4e547a57"}, {"headline": "FMCG firms face earnings pressure as input costs rise", "summary": "Indian FMCG companies are expecting uneven earnings in FY27 due to rising raw material costs and intense competition. While slow growth is projected for HUL and Emami, analysts expect better profit trajectories for Godrej Consumer and Marico due to improved product mixes.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "5c1f08f6"}, {"headline": "Volvo targets luxury EV market with EX90 launch", "summary": "Swedish automaker Volvo has launched its flagship EX90 electric SUV in India at ₹1.26 crore. The company aims to capture a larger share of the luxury EV market, reporting that electric models now account for 28% of its total sales in the country.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "b7fd6b49"}, {"headline": "Hyundai bets on Talegaon plant as major export hub", "summary": "Hyundai Motor India is transforming its Talegaon facility into a primary export hub as part of a ₹45,000 crore investment plan. The plant, which will start commercial production in October 2025, has an annual capacity of 1.70 lakh units to meet global demand.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "6e4daaf7"}, {"headline": "India making significant strides in AI sovereignty and models", "summary": "Experts highlight that India is successfully developing its own AI ecosystem, focusing on sovereign models, semiconductor hardware, and localized applications. Domestic firms are building AI solutions for healthcare and education to reduce dependence on global technology giants.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "05f0627e"}, {"headline": "GOBARdhan scheme faces logistical and financial challenges", "summary": "The Union government’s GOBARdhan scheme aims to convert agricultural waste into compressed biogas to boost rural energy. However, experts warn that the project faces significant hurdles in feedstock collection and requires large-scale private sector participation to be successful.", "category": "Environment", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "00cfd5c4"}, {"headline": "Kospi crashes 5.5% as AI tech rally fades", "summary": "South Korea's Kospi index suffered its sharpest drop in years, falling 5.46% as global investors retreated from AI-linked technology stocks. Concerns over rising competition in the memory-chip sector and potential interest rate hikes triggered a broad market sell-off.", "category": "World", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "6e3786f2"}, {"headline": "Fintech funding in India rises 14% to $2.2 billion", "summary": "Fintech funding in India grew by 14% to $2.2 billion during the first nine months of 2026, despite a decrease in the total number of deals. Large funding rounds for companies like Digit Insurance and KreditBee drove the growth in capital raised.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "fea927e5"}, {"headline": "SC dismisses MMTC appeal against NSEL settlement", "summary": "The Supreme Court has dismissed an appeal by MMTC against a ₹1,950 crore one-time settlement for NSEL investors. The ruling facilitates the recovery of funds for thousands of small investors who have been waiting nearly 13 years for their claims to be settled.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "bc97d51d"}, {"headline": "Govt confident of meeting tax target despite shortfall", "summary": "The Finance Ministry expects to meet its ₹12.1 lakh crore direct tax collection target for the current fiscal year. Officials believe that high growth in income and corporate tax collections will offset the revenue gap caused by a shortfall in central excise duty.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "4bdac102"}, {"headline": "India and Canada discuss advancing trade pact talks", "summary": "Trade ministers from India and Canada met to discuss progress on a Comprehensive Economic Partnership Agreement (CEPA). The discussions focused on enhancing market access for goods and services and strengthening bilateral trade ties between the two nations.", "category": "Politics", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "74508363"}, {"headline": "RBI drains ₹25,000 crore liquidity via G-Sec sale", "summary": "The Reserve Bank of India conducted an open market operation (OMO) sale of Government Securities worth ₹25,000 crore to absorb excess liquidity from the banking system. The move aims to manage market interest rates and maintain financial stability.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "13b68b0f"}, {"headline": "Rupee gains 145 paise following RBI intervention", "summary": "The Indian rupee appreciated by 145 paise over two trading sessions after the RBI introduced measures to curb currency speculation. The central bank's intervention and a weaker US dollar helped the rupee recover to 95.28 against the greenback.", "category": "Economy", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "efb949f6"}, {"headline": "UK-India trade deal could boost trade by £25 billion", "summary": "A proposed trade agreement between the UK and India has the potential to increase bilateral trade by £25 billion annually by 2030. The deal aims to reduce tariffs on key sectors and simplify mobility for professionals working in both countries.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "a3af8320"}, {"headline": "Govt allocates 16 lakh tonnes sugar for sale", "summary": "The Union government has allocated 14 lakh tonnes of sugar for domestic sale during the second half of October. The move is aimed at ensuring adequate supply and controlling prices during the Deepavali festival season to protect consumers from price hikes.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "9d1afdaa"}, {"headline": "India’s steel demand to grow 9% in 2027", "summary": "India's steel demand is projected to grow by 9% in 2027, making it the fastest-growing major market globally. According to Worldsteel, the growth is driven by infrastructure projects, automotive manufacturing, and steady demand from the real estate sector.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "d003cbe2"}, {"headline": "MoD to frame long-term defence procurement plan", "summary": "The Ministry of Defence is developing a 10-15 year procurement plan to provide the domestic industry with a clear capability roadmap. The plan aims to encourage indigenous manufacturing of critical technologies like drones and autonomous systems.", "category": "Infrastructure", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "c76ae37c"}, {"headline": "SC grants interim stay on defamation case against Rahul Gandhi", "summary": "The Supreme Court has granted an interim stay on criminal defamation proceedings against Rahul Gandhi for his 2018 remarks about PM Modi. The court noted that the remarks were directed at a political party's leadership rather than a specific individual.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "5e6bc2b3"}, {"headline": "Air India to review staff travel policy for savings", "summary": "Air India is expected to review its staff travel policy and introduce cost-saving measures to reduce financial losses. The proposals include restricting free travel for staff on duty and optimizing travel arrangements to improve the airline's operational efficiency.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "3840081d"}, {"headline": "Flying Wedge Defence unveils indigenous autonomous fighter jet", "summary": "Bengaluru-based startup Flying Wedge Defence has unveiled a prototype of India's first indigenous autonomous fighter jet, the FWD-200B. The jet features a maximum speed of Mach 0.8 and is designed for long-endurance strategic missions.", "category": "Science", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "e5267e98"}, {"headline": "Delhi steps up HPV vaccination awareness drive", "summary": "The Delhi government has intensified its awareness campaign for HPV vaccination to prevent cervical cancer. Only 20% of the target population has been vaccinated so far, and health officials are working to address misconceptions and improve uptake through schools.", "category": "Health", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140472", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140472"}], "article_id": "46fdab25"}, {"headline": "FM Nirmala Sitharaman open to hearing stock market tax debate", "summary": "Finance Minister Nirmala Sitharaman said she will keenly hear the debate regarding stock investment taxes, including LTCG and STT. While she declined to share specifics due to upcoming budget preparations, her comments sparked late-afternoon market optimism. The FM also emphasized that the RBI will continue measures to prevent rupee volatility rather than 'fixing' a specific level.", "category": "Economy", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "1a7764bd"}, {"headline": "Indian equities surge 1.6 percent on hopes of tax review", "summary": "The Nifty 50 rose 1.6% to close at 22,722, marking its biggest single-session jump in two months. The rally was triggered by short-covering following Finance Minister Nirmala Sitharaman's remarks on stock transaction taxes. A surge in IT stocks, amid a selloff in AI-related shares in East Asian markets, further supported the domestic gains.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "ed945bc7"}, {"headline": "RBI curbs on forex trades help strengthen Indian rupee", "summary": "The Indian rupee gained 0.5% to end at 95.28 per dollar as banks adjusted to fresh derivative-deal curbs. The RBI directive requires banks to maintain a foreign exchange risk reserve (FERR) of up to 20% on certain contracts. The measure aims to deter speculative trading, arrest capital outflows, and curb imported inflation.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "2d80a1da"}, {"headline": "Centre mandates hospitals prominently display service rates for transparency", "summary": "The Union Health Ministry has directed states to ensure all clinical establishments prominently display their rates for services and facilities. The move is intended to help patients make informed decisions, minimize billing disputes, and improve trust. Package rates for foreign patients visiting for medical treatment must also be clearly visible.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "4ac7e8c7"}, {"headline": "GQG Partners reduces stakes in five Adani Group companies", "summary": "Investment firm GQG Partners has pared stakes worth approximately Rs 8,000 crore across five Adani companies during the September quarter. While GQG reduced holdings in firms like Adani Energy Solutions and Adani Power, other foreign portfolio investors showed mixed trends, increasing stakes in Adani Enterprises and Adani Total Gas.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "d012a9c3"}, {"headline": "Inflation expected to pressure FMCG volume growth in urban markets", "summary": "India's FMCG sector faces renewed volume pressure as retail inflation rose to 5.54% in September. Data indicates consumers are shifting toward smaller packs and cheaper unbranded products. While rural demand remains steadier, urban premium volume growth has slowed significantly, mirroring the consumption squeeze seen between 2022 and 2024.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "63854ba6"}, {"headline": "Blackstone aims for $100 billion investment in India within five years", "summary": "Blackstone COO Jonathan Gray stated the firm plans to double its Indian investment to $100 billion. Gray expressed confidence in India's capital markets, describing it as the easiest place to list a company after the US. The firm plans to expand across private equity, real estate, infrastructure, and credit sectors.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "3b1c12db"}, {"headline": "INDIA bloc pauses Delhi street protests for festive season", "summary": "Leaders of the INDIA bloc have decided to pause their daily united marches in Delhi due to the ongoing festive season. While regular street protests are on hold until late October, the group plans to continue its legal battle in the Supreme Court against the Election Commission's special intensive revision of electoral rolls.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "c8ee1f55"}, {"headline": "Delhi road fatalities reach six-year high in 2026", "summary": "Official data reveals that Delhi averaged five road deaths daily in the first nine months of 2026. A total of 1,309 fatalities were recorded, with pedestrians and two-wheeler riders accounting for 81% of the victims. Both accidents and injuries have reached their highest levels in six years, with an average of 17 accidents occurring daily.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "ed9a4a8e"}, {"headline": "Petitions filed in SC over INDIA bloc gathering on court premises", "summary": "Writ petitions have been filed in the Supreme Court regarding a large gathering of INDIA bloc leaders and supporters inside the court complex. Senior advocates sought urgent listing, citing commotion and the entry of political figures on Monday evening. The CJI has agreed to list the petitions for hearing on Thursday.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "e5b0e84c"}, {"headline": "CJP leaders detained for protesting at Jantar Mantar", "summary": "Cockroach Janta Party (CJP) leaders Saurav Das and Ashutosh Ranka were detained by Delhi Police after entering the de-notified Jantar Mantar protest site. The activists were demanding the resignation of the Chief Election Commissioner. CJP founder Abhijeet Dipke criticized the detention and the closure of public spaces for peaceful dissent.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "8ad1f47c"}, {"headline": "Siddaramaiah gets court injunction against media over honey trap claims", "summary": "A Bengaluru court has granted an interim injunction to veteran leader Siddaramaiah, restraining 42 media organizations and digital platforms from linking his name to a viral honey trap video. The leader filed a defamation suit alleging a malicious campaign intended to tarnish his reputation for political reasons.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "9fb8cb8a"}, {"headline": "Kumaraswamy demands CBI probe into Karnataka sting operation allegations", "summary": "Union Minister HD Kumaraswamy has called for a CBI investigation into reports of surveillance and sting operations targeting Karnataka political leaders. He plans to submit a formal complaint to the Union Home Minister. Kumaraswamy urged the state government to refer the matter to the central agency to ensure an independent and impartial probe.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "51ae7cfb"}, {"headline": "Centre urges states to speed up utilization of capex loans", "summary": "The Department of Expenditure has flagged slow utilization of the Rs 2 lakh crore interest-free capex loan program for states. Only 26% of the allocation has been released so far. States have been asked to submit utilization certificates and expedite approvals to ensure that public investment goals for infrastructure are met during the fiscal year.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "60d90b46"}, {"headline": "India may increase thermal power capacity targets to meet demand", "summary": "The Central Electricity Authority (CEA) indicated that India might need to add 115 GW of coal-fired power capacity by 2032, up from previous estimates. CEA Chairman Ghanshyam Prasad cited a 10% year-on-year surge in electricity demand. While renewable energy is growing, a judicious mix of resources is required to manage peak demand and maintain grid stability.", "category": "Infrastructure", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "415f80e6"}, {"headline": "Rising sugar prices increase festive budgets for Indian consumers", "summary": "Inflation in sugar and confectionery reached 13.8% in September, driving up the cost of festive sweets and gifting. Higher input costs and strong seasonal demand are putting pressure on manufacturers. While the upcoming sugarcane crushing season may bring some relief, experts warn that prices are likely to remain elevated through the peak of the festive period.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "9b341ccf"}, {"headline": "MSMEs must improve quality to gain from free trade pacts", "summary": "MSME Ministry Secretary Bharat Khera stated that while FTAs offer global opportunities, Indian enterprises must focus on quality and cost competitiveness. He highlighted formalization, access to finance, and technology upgrades as priority areas. Currently, only 32% of surveyed MSMEs hold recognized certifications, indicating a need for standards alignment.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "adfef10a"}, {"headline": "Bihar restricts sale of non-subsidized fertilizers alongside subsidized products", "summary": "Following Uttar Pradesh and Maharashtra, Bihar has restricted the sale of non-subsidized fertilizers by companies supplying government-subsidized nutrients. The industry warns this could limit farmers' access to advanced crop nutrition technologies and efficient fertilizers. The move aims to prevent 'tagging' by dealers but may impact soil health initiatives.", "category": "Economy", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "ac99e431"}, {"headline": "PM GatiShakti evaluates infra projects worth over Rs 20 lakh crore", "summary": "The PM GatiShakti initiative has recommended over 400 infrastructure projects for approval as it completes five years. The projects, primarily in roads and railways, are valued at approximately Rs 20.23 lakh crore. The digital platform has integrated 1,800 data layers across 58 central ministries to streamline data-driven infrastructure planning.", "category": "Infrastructure", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "87f9c87f"}, {"headline": "RITES dispatches first rake of passenger coaches to Bangladesh", "summary": "Railway PSU RITES has dispatched the first 18 broad-gauge passenger coaches to Bangladesh under a Rs 915-crore contract. Manufactured by Rail Coach Factory, Kapurthala, the shipment is part of a 200-coach project funded by the European Investment Bank. This is the first shipment to Bangladesh since the recent change in the country's regime.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "1ab4667f"}, {"headline": "Nifty IT index jumps 5.2 percent on strong HCL earnings", "summary": "The Nifty IT index recorded its biggest single-day gain in 17 months, led by an 8.4% surge in HCL Technologies. Strong quarterly results eased investor fears regarding AI-led disruptions and slowing demand. While technology shares globally faced pressure, Indian IT exporters benefited from positive sentiment and a stronger US dollar.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "0096ddd3"}, {"headline": "Sebi extends IPO sizing flexibility through March 2027", "summary": "The Securities and Exchange Board of India has extended the period allowing companies to adjust their IPO issue sizes without fresh regulatory approvals by six months. The measure, now valid for prospectuses filed until March 31, 2027, aims to help issuers navigate market volatility and reduce compliance costs associated with listing on stock exchanges.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "0ee15e4e"}, {"headline": "Fusion CX launches Rs 702 crore IPO for debt repayment", "summary": "Business process outsourcing firm Fusion CX is launching an IPO to raise up to Rs 702 crore. The funds will be used to repay debt and finance future acquisitions. Despite deriving 90% of its revenue from overseas markets and facing currency risks, the company has shown strong growth, with net profit increasing nearly fivefold over two years.", "category": "Business", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "574b2a9b"}, {"headline": "IBM to install India's first quantum computer in Amaravati", "summary": "IBM plans to deploy India's first quantum computer in early 2027 at the Andhra Pradesh Quantum Valley. Partnering with TCS and the state government, the facility will focus on practical applications and post-quantum cryptography. IBM India MD Sandip Patel emphasized that training 100,000 developers is critical for India's quantum leadership goals.", "category": "Technology", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "b57a71c0"}, {"headline": "Urban Company seeks Rs 2,500 crore war chest via QIP", "summary": "Home services platform Urban Company is planning to raise up to Rs 2,500 crore through a qualified institutional placement. The funds are expected to support its InstaHelp business, which is competing in the high-growth instant househelp market. A portion of the capital will also be used for international expansion and inorganic growth opportunities.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "7b25c60e"}, {"headline": "Ircon International to monetise highway assets worth Rs 3,000 crore", "summary": "PSU Ircon International plans to unlock value from four operational highway projects as part of the government's infrastructure monetization plan. The portfolio includes two toll-road assets and two hybrid annuity model projects in Madhya Pradesh, Rajasthan, Karnataka, and Gujarat. Axis Capital has been mandated to manage the sale process.", "category": "Infrastructure", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "7445a9ce"}, {"headline": "Major fire shuts down ONGC oil platform off Mumbai coast", "summary": "A large fire at ONGC's NQG platform forced a temporary shutdown of the facility, which processes over 40,000 barrels of crude oil daily. The blaze was triggered by a ruptured gas cooler finger but was controlled within an hour by firefighting teams. No injuries were reported, and normal operations were expected to resume following safety protocols.", "category": "Business", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "bc4fb9a7"}, {"headline": "Reliance Consumer Products focuses on building billion-dollar brands", "summary": "Reliance Consumer Products (RCPL) is targeting the creation of several Rs 1,000-crore brands, with Campa and Independence already crossing the threshold. The company aims to offer global-quality products at affordable prices by investing in its own supply chain and R&D. RCPL plans to expand its portfolio to include ice cream and staple categories.", "category": "Business", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "928d61c4"}, {"headline": "Parle appoints George Kovoor as its first-ever CEO", "summary": "Parle has appointed former PepsiCo executive George Kovoor as its first Chief Executive Officer, marking a shift from its traditional promoter-led management. Kovoor’s decades of experience in the beverages sector are expected to help Parle navigate rising competition and sharpen its focus on innovation and premiumization in the FMCG market.", "category": "Business", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140481", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/140481"}], "article_id": "7314bb9a"}, {"headline": "Nifty firms expected to report strongest earnings growth in a year", "summary": "Nifty 50 companies are projected to report a 23% year-on-year rise in net profit for the September quarter, the best in a year. Metals, mining, and banks are expected to lead the growth. However, analysts warn that rising commodity prices, inflation, and higher interest rates could dampen performance in the second half of the fiscal year as demand and margins face pressure.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "a7509885"}, {"headline": "Blackstone in talks to invest $500 million in Accord Software Systems", "summary": "Global private equity firm Blackstone is negotiating a $400-500 million investment for a minority stake in Bengaluru-based Accord Software Systems. The deal highlights growing interest in India’s defense technology sector amid rising geopolitical tensions. Accord specializes in global navigation satellite systems and defense electronics for military and space programs.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "01c021c6"}, {"headline": "India faces potential 100% US tariffs under new Graham Act", "summary": "India risks 100% tariffs on exports to the US following the enactment of the Lindsey O. Graham Sanctioning Russia and Iran Act. The law penalizes top importers of Russian oil. While the US recently purchased diesel from Russia, India may still need to seek a waiver or reduce imports to avoid significant trade barriers that could impact 20% of its overall exports.", "category": "Economy", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "247a516b"}, {"headline": "Indian rupee slides despite record domestic institutional investor inflows", "summary": "The rupee remains vulnerable as foreign portfolio investors (FPIs) turned net sellers, with $27.8 billion in equity outflows through September 2026. While domestic institutional investors (DIIs) pumped in a record $64.6 billion to support stock prices, the lack of dollar supply from FPIs has pressured the currency. FPIs continue to favor IPOs over secondary markets for better valuations.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "16800e7e"}, {"headline": "Stocks rally as Finance Minister indicates openness to tax reviews", "summary": "Indian markets posted their biggest single-day gain in two months after Finance Minister Nirmala Sitharaman said the government would hear investor views on capital gains taxation. The Nifty rose 1.6% to settle at 22,721.95. While no policy changes were officially signaled, the comments lifted sentiment in a market recently battered by sustained foreign investor selling.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "52dcdcd1"}, {"headline": "PFRDA seeks MDR exemption for NPS contributions via UPI", "summary": "The Pension Fund Regulatory and Development Authority (PFRDA) has requested the finance ministry to exempt National Pension System (NPS) contributions from UPI merchant charges. The regulator argues that subscribers using the D-Remit facility are transferring personal funds between their own accounts rather than making merchant payments, thus qualifying as person-to-person transfers.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "87885225"}, {"headline": "NIIF plans $600 million e-mobility platform and new green fund", "summary": "The National Investment and Infrastructure Fund (NIIF) is launching a $600 million e-mobility platform named Avega. CEO Sanjiv Aggarwal stated the sovereign wealth fund also seeks anchor investors for a $1 billion Green Transition Fund. NIIF recently closed its second infra fund at ₹20,000 crore and plans to dilute a 40% stake in its power transmission platform, AnantGrid.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "ecf410c8"}, {"headline": "Railways report 6.1% growth in September freight loading", "summary": "Indian Railways recorded freight loading of 135.35 million tonnes in September, a 6.14% increase from the previous year. Revenue for the first half of the current fiscal year grew by 3.7%. Growth was driven across multiple commodity segments, reflecting steady industrial demand despite broader global economic uncertainties.", "category": "Infrastructure", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "5d9a0db6"}, {"headline": "Sebi notifies new rules for portfolio management services", "summary": "The Securities and Exchange Board of India has notified the Portfolio Managers Regulations 2026, effective April 1, 2027. The framework allows portfolio managers to invest in IPOs, primary market debt, and a wider range of overseas securities. It also introduces a dedicated route for mutual fund investments, aiming to broaden the scope for high-net-worth individual portfolios.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "046acc11"}, {"headline": "State borrowing costs hit six-year high as bond yields spike", "summary": "Borrowing costs for Indian state governments breached the 8% threshold for the first time in over six years. The spike followed a rise in central government yields and weakening investor appetite. The increase in state development loan rates reflects tighter liquidity conditions and cautious market sentiment regarding fiscal deficits and global interest rate trajectories.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "aa01a472"}, {"headline": "Rishi Sunak warns US-led global order is ending", "summary": "Speaking at the Bloomberg New Economy Forum, former UK Prime Minister Rishi Sunak stated that the US-led global order is over. He described heightened geopolitical uncertainty as a new reality where China acts as a major competitor to the US. Sunak remarked that the political rise of Donald Trump is a symptom, rather than the cause, of this shifting global power dynamic.", "category": "World", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "7a0d2974"}, {"headline": "Zoho Corp co-founder announces salary freeze amid AI disruption", "summary": "Zoho Corp. will not provide salary hikes this year as artificial intelligence puts pressure on its low-cost software business model. Co-founder Sridhar Vembu cited grim outlooks for software jobs and a slowdown in employee headcount growth over the last 18 months. The move signals broader profitability concerns in the Indian SaaS sector as AI automates routine technology operations.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "0f556cb6"}, {"headline": "SpaceX IPO drives record space economy investment in 2026", "summary": "Investment in the global space economy is projected to exceed $100 billion for the first time in 2026, fueled by the SpaceX IPO. Analysis from Space Capital suggests more space firms are reaching unicorn status. The record activity is partly driven by a potential rocket shortage as SpaceX sunsets older models, leading to increased funding for alternatives like Stoke Space and Blue Origin.", "category": "Science", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "88342c13"}, {"headline": "Bumble in talks to go private at $1 billion valuation", "summary": "Dating app company Bumble is in advanced negotiations to be taken private by Ithaca Holdings, a firm founded by former Sequoia and Meta executives. The deal, valued at roughly $1 billion, follows a 90% drop in Bumble's share price since its 2021 IPO. The move reflects broader struggles in the dating app industry as younger users drift away from traditional online platforms.", "category": "Technology", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "5b8bb1c3"}, {"headline": "GreenCell Mobility secures ₹330 crore for electric bus expansion", "summary": "Electric bus platform GreenCell Mobility has received a ₹330 crore equity investment from Impact Fund Denmark. The capital will facilitate the rollout of 4,500 additional e-buses over the next 18 to 24 months. The expansion will bring the company’s total fleet to over 6,000 buses operating across 105 Indian cities, supporting the country's green public transport goals.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "ab5ceef8"}, {"headline": "HCL Technologies reports Q2 revenue miss despite strong deal wins", "summary": "HCL Technologies’ shares rose 8.4% after Q2 results, despite sequential revenue growth of 2.3% falling short of analyst estimates. The company reported robust new deal wins of $3.26 billion, with AI becoming a central theme. However, weakness in telecom and manufacturing accounts persists. The firm maintained its FY27 Ebit margin guidance of 17.5-18.5% despite upcoming wage hikes.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "dbf06e43"}, {"headline": "MahaTransco selects Axis Capital to lead ₹10,000 crore IPO", "summary": "Maharashtra State Electricity Transmission Co. (MahaTransco) has reportedly chosen Axis Capital to lead its planned ₹10,000 crore initial public offering. The sale is expected to include fresh issues and an offer for sale, valuing the country's largest state transmission utility at up to ₹50,000 crore. The listing aims to fund grid expansion to meet rising electricity demand.", "category": "Infrastructure", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "92a81eba"}, {"headline": "ICICI Prudential AMC profit grows 6.1% amid market volatility", "summary": "ICICI Prudential Asset Management Co reported a net profit of ₹889 crore for Q2, up 6.1% year-on-year. While operating revenue grew 16.3% driven by equity fund market share, mark-to-market losses on treasury holdings dampened overall earnings. The AMC maintained a 13.3% market share in actively managed funds, though debt fund assets fell 9% to ₹1.81 trillion.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "bb45c87e"}, {"headline": "SIP growth slows as investors shift toward lump-sum payments", "summary": "Monthly SIP contributions reached a record ₹32,490 crore in September, but the year-on-year growth rate slowed significantly to 10.7%. Analysts suggest market volatility and the 'base effect' are tempering regular investment growth. Active SIP folios as a share of total mutual fund folios fell to 35.2%, indicating a potential shift toward lump-sum investments during market corrections.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "523ec653"}, {"headline": "Logistics providers weigh festive surcharges as delivery costs rise", "summary": "Logistics firms including Blue Dart and Emiza are raising prices by 9-15% due to rising labor, warehousing, and last-mile delivery costs. These increases are forcing e-commerce brands to reassess discounts and pricing margins during the festive season. Blue Dart's 9-12% hike will take effect in January 2027, while others are implementing surcharges to manage high seasonal volumes.", "category": "Infrastructure", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "2927b45c"}, {"headline": "Titan focuses on design for lab diamonds as prices fall", "summary": "Titan Co. is positioning its lab-grown diamond brand, beYon, through unique designs and colored stones to avoid being viewed as a cheap alternative. Wholesale prices for lab-grown stones have plunged 97% since 2018 due to improved manufacturing. Titan aims to expand the market by offering unconventional cuts and silver-gold settings rather than competing on price alone.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "123bc896"}, {"headline": "Delhi High Court rejects SpiceJet’s plea for more payment time", "summary": "The Delhi High Court dismissed SpiceJet's request for additional time to deposit ₹144.51 crore in its ongoing dispute with Kalanithi Maran and KAL Airways. The court noted that the airline failed to honor its undertaking to deposit an initial ₹50 crore within 45 days. The judge refused to grant repeated extensions, stating the airline must comply with its financial commitments.", "category": "Law", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "ca52eefe"}, {"headline": "Radisson targets 500 hotels in India by 2030", "summary": "Radisson Hotel Group plans to expand its Indian footprint to 500 properties by 2030, shifting focus toward major cities and premium luxury brands. Currently operating 146 hotels, the group aims to match its 28-year global growth in just four years in India. About 60% of new additions will be in tier-1 and tier-2 markets, utilizing an asset-light model through management and franchises.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "80a78b55"}, {"headline": "MUFG considers $10 billion investment in Shriram Finance", "summary": "Mitsubishi UFJ Financial Group is exploring a potential $10 billion investment to gain majority control of Shriram Finance. This would represent the largest foreign investment in India's financial sector. While discussions are in early stages, the move underscores Japanese banks' appetite for overseas expansion and India's growing consumer and small business financing market.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "a7896212"}, {"headline": "Indian auto firms establish sourcing bases in China", "summary": "Ather Energy, Ceat, and Lumax are setting up dedicated teams and subsidiaries in China to secure supply chains for critical components like rare earth magnets. China’s share of India's auto component imports reached 36% in FY26. The move aims to optimize procurement costs and manage export restrictions on materials essential for electric vehicle manufacturing.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "72942b6b"}, {"headline": "AI tools reshape India’s growing microdrama video market", "summary": "Microdrama platforms like Bullet and Story TV are deploying proprietary AI tools to generate scripts, visuals, and dubbed audio for short episodic series. While traditional production costs ₹18-20 lakh per series, AI is acting as a production multiplier. The microdrama market in India is projected to grow from ₹2,300 crore in FY26 to over ₹23,000 crore by FY32.", "category": "Technology", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "388b8abd"}, {"headline": "Saudi Arabia intercepts Houthi ballistic missiles over Riyadh", "summary": "Saudi-led coalition forces intercepted multiple Houthi ballistic missiles targeting Riyadh and Khamis Mushait. The attacks have left at least 18 dead and 300 wounded over several days, disrupting operations at Riyadh’s international airport. The escalation poses a threat to Saudi Arabia's efforts to transform its economy into a global finance and tourism hub.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "897857bb"}, {"headline": "Iran fortifies nuclear sites amid fears of US attacks", "summary": "Satellite imagery shows Iran is strengthening defenses around nuclear sites and border areas. The regime is also conducting paramilitary training for civilians and female commando units. Iranian officials warned that any US strike would lead to a wider Middle East escalation, including land incursions and attacks on regional internet cables and data centers.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "2299b8c1"}, {"headline": "Chinese EVs dominate Europe’s premier Paris Motor Show", "summary": "Chinese carmakers made up one-third of all brands at the Paris Motor Show, showcasing advanced EV features at competitive prices. Brands like BYD, XPeng, and Li Auto are accelerating European sales to offset potential job cuts in the local industry. The EU recently reached a deal to annually quota Chinese hybrid imports to manage a growing trade deficit.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "b07f8e2c"}, {"headline": "Barclays plans return to investment banking advisory in India", "summary": "Barclays Plc is preparing to restart its investment banking advisory business in India after a nearly ten-year absence. The move aims to capitalize on the surge in domestic share sales and IPOs. Investment banks in India earned a record $417 million in IPO fees last year, driven by high deal volumes and improved pricing power in a busy fundraising market.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "331e573e"}, {"headline": "Jio Platforms draws $20 billion in bids for record IPO", "summary": "Jio Platforms has reportedly attracted over $20 billion in interest from global investors like Fidelity and Allianz for its upcoming IPO. The company is targeting a valuation of approximately $108 billion. The share sale, expected to be India’s largest-ever, could open before October 30. Final anchor investor lists are currently being decided by parent Reliance Industries.", "category": "Business", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "e7a7b757"}, {"headline": "FSSAI to tighten safety rules for quick-commerce delivery apps", "summary": "The Food Safety and Standards Authority of India (FSSAI) is preparing stricter regulations for quick-delivery platforms like Blinkit and Swiggy Instamart. New rules will mandate the display of manufacturing and expiry dates on listings and hold platforms accountable for misleading claims. Dark kitchens and stores will also face more rigorous inspections regarding storage conditions.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "76ddbb72"}, {"headline": "Urban Company eyes fundraise amid intensifying home services competition", "summary": "Home services marketplace Urban Company is considering an equity or convertible security fundraise to combat rising competition from rivals like Snabbit and Pronto. The company’s board will meet on October 16 to discuss the capital raise. This follows the successful launch of its InstaHelp service, which recently crossed 100,000 delivered orders.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "ce8a8d00"}, {"headline": "Meta Muse AI model claims parity with OpenAI and Anthropic", "summary": "Meta Platforms has released Muse Wonder, its most advanced AI model to date. The company claims the model's capabilities in coding and professional tasks put it on par with OpenAI’s ChatGPT and Anthropic’s Claude. The release follows a multibillion-dollar infrastructure push and marks a milestone for Meta's AI organization under its new leadership.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "445ddb20"}, {"headline": "Strict overtime rules hinder India's factory competitiveness vs global rivals", "summary": "Indian factories struggle to match the speed and cost of rivals in Vietnam and China due to rigid overtime limits and inflexible work schedules. While global competitors can average working hours over months, Indian law locks factories into strict weekly caps. This makes India up to 23% slower and 18% more expensive for high-volume manufacturing, deterring major global brands.", "category": "Economy", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "00cd4214"}, {"headline": "NRIs returning to India face complex tax rules on UK pensions", "summary": "Non-resident Indians relocating permanently from the UK must navigate tax implications for pension schemes like Nest. While initially qualifying as Resident but Not Ordinarily Resident (RNOR), global income becomes taxable in India once status changes to ROR. Pension received in India is generally taxable as salary income, though standard deductions apply under bilateral tax treaties.", "category": "Economy", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "62b0a698"}, {"headline": "Sebi launches color-coded risk gauge for listed corporate bonds", "summary": "The Securities and Exchange Board of India has introduced a 'Credit Risk-o-Meter' to help retail investors assess corporate bond risks. The six-color dial ranges from Irish green (AAA) to red (B+ or below). The tool aims to simplify risk assessment as Sebi lowers bond ticket sizes to ₹10,000, though critics warn it relies solely on credit ratings which can lag behind market collapses.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "f1523d78"}, {"headline": "Robert Hall and Michael Woodford win 2026 Nobel Economics Prize", "summary": "The 2026 Nobel Prize in Economics has been awarded to Robert Hall and Michael Woodford for their research on macroeconomics. Their work explains how household and firm decisions influence inflation and employment. Woodford’s research on central bank credibility and Hall’s work on consumption patterns have shaped modern monetary policy and the 'New Keynesian' framework.", "category": "Science", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "5e627f1c"}, {"headline": "Decentralized exchange Hyperliquid faces scrutiny in Singapore", "summary": "Hyperliquid Labs is facing regulatory pressure in Singapore for offering perpetual futures without standard oversight. The platform uses algorithms to automate trades, bypassing traditional brokers. While Singapore aims to be a digital asset hub, the Monetary Authority has placed the bourse on an investor alert list due to the high risks associated with leveraged crypto products.", "category": "Technology", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "037fdda8"}, {"headline": "Review: iPhone 18 Pro Max leads on performance over Pixel", "summary": "A comparison between Apple’s iPhone 18 Pro Max and Google’s Pixel 11 Pro XL shows Apple leads in raw performance and battery life thanks to its A20 Pro chip. Google’s Pixel offers superior AI integration via Gemini and more creative camera tools. However, the iPhone remains the more consistent choice for heavy everyday use and motion-blur photography.", "category": "Technology", "page": 18, "importance": 4, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "0a473b27"}, {"headline": "Vivo V80 launched with massive 7,200mAh battery", "summary": "The new Vivo V80 features a 7,200mAh battery and a 144Hz AMOLED display. Priced from ₹62,999, the phone includes a Zeiss-tuned triple camera system and solid IP69 durability. While its Snapdragon 7 Gen 4 processor is outperformed by rivals at this price point, its exceptional battery endurance and portrait photography tools make it a robust choice for non-gamers.", "category": "Technology", "page": 18, "importance": 4, "telegram_url": "https://t.me/c/1877410077/140465", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/140465"}], "article_id": "c023cbab"}, {"headline": "Regaining ground: Rupee rallies to 1-month high on RBI curbs", "summary": "The Indian rupee strengthened 0.5% to a one-month high on Tuesday, outperforming Asian peers. Reserve Bank of India measures to curb speculative bets supported the currency. However, the central bank's latest foreign exchange curbs have unsettled some banks due to implementation uncertainty.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140509", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140509"}], "article_id": "f808f2d0"}, {"headline": "Corporate treasury centres queue up for GIFT-IFSC base", "summary": "GIFT City is experiencing a sharp pickup in corporate treasury activity, with 12 units approved or operational and nearly a dozen more in discussions. Investments in these centres have nearly doubled to $496 million as of June, indicating growing interest in the financial hub for cross-border funding.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140509", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140509"}], "article_id": "03ae5396"}, {"headline": "Auto revenue seen rising up to 28% in Q2, but margins may squeeze", "summary": "Automobile manufacturers are expected to see revenue grow 26-28% in Q2 FY27, driven by strong sales and demand. However, rising commodity costs may squeeze margins, limiting profit growth despite strong volumes.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140509", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140509"}], "article_id": "ad41527c"}, {"headline": "Sun Pharma board approves plan to raise up to ₹10,000 crore", "summary": "Sun Pharmaceutical Industries' board has approved a proposal to raise up
