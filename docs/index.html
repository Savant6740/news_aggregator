l column Allegedly explores absurd child questions and climate anxiety", "summary": "G. Sampath’s satirical column features a father’s humorous encounter with his son’s relentless questioning, ranging from nuclear explosions to the rights of trees. The piece touches on environmental concerns, such as forest destruction in India and species extinction, using a conversational format between a parent and child.", "category": "Culture", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "1bf6ab70"}, {"headline": "Documentary The Wolf of Winter explores Novak Djokovic’s career longevity", "summary": "A new Amazon Prime Video documentary, The Wolf of Winter, examines the career of 39-year-old tennis champion Novak Djokovic. The film delves into his Serbian upbringing, the concept of \"inat\" (stubbornness), and his rigorous wellness and recovery practices. It portrays his resilience as he continues to compete against younger rivals while facing questions about retirement.", "category": "Sports", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "2cf81075"}, {"headline": "Essay highlights laughter as a vital safety valve for human tension", "summary": "Writer George Netto discusses the universal importance of humor and laughter in human life. The piece reflects on how cartoons by artists like R.K. Laxman and Mario Miranda have historically enriched Indian culture by parodying social and political foibles, serving as a release for repressed frustrations and building social bonhomie.", "category": "Culture", "page": 7, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "7e0229e3"}, {"headline": "Urbanization and aging population increase importance of neighborly relationships", "summary": "N. Rama Rao explores the evolution of neighborly ties in India, contrasting rural interdependence with urban privacy concerns. The article highlights how community apps and group chats are replacing traditional interactions in cities like Chennai. It emphasizes the need for a hybrid network model to support senior citizens and manage civic disputes over parking and pets.", "category": "Culture", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "1d4bc8bd"}, {"headline": "Morning park routines reveal diverse social archetypes in urban spaces", "summary": "Ayisha Lubna Hameed profiles the various types of people encountered during morning walks in public parks, from \"reel-fluencers\" and \"enthusiastic retirees\" to \"politically minded\" news broadcasters. The essay describes the park as a unique shared space where sedentary corporate workers and focused athletes coexist within a quiet morning rhythm.", "category": "Culture", "page": 7, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "1ae2ef81"}, {"headline": "Indian designers use sculpted couture to reshape modern body silhouettes", "summary": "Fashion designers Anamika Khanna and Tarun Tahiliani are reviving the use of padding and bustles to manipulate silhouettes. Khanna’s \"Moonlit Palace\" and Tahiliani’s \"Ang\" explore sculpted forms using foam and boning, reacting to narrow modern body ideals and referencing diverse histories from Victorian bustles to Kalighat paintings and 1947 Dior suits.", "category": "Culture", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "ee61d1e8"}, {"headline": "Personal essay reflects on childhood redemption and unconditional love", "summary": "Saba Mahjoor recounts a childhood memory of stealing plums and the subsequent lesson in acceptance from her aunt, Phuphee. The narrative explores themes of honesty, redemption, and the importance of being loved wholly, including one's \"dark side,\" within the context of a Kashmiri summer.", "category": "Culture", "page": 8, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135670", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH- Delhi-sm 30-08.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135670"}], "article_id": "ff69ba84"}, {"headline": "Nepal flash flood toll hits 700 with nearly 3,000 people missing", "summary": "The death toll from Himalayan flash floods reached 682, with nearly 3,000 people reported missing in Nepal and China. Rescuers are scouring debris following a glacier collapse four days ago. India's MEA reported over 275 nationals and 128 people of Indian origin are among the missing. A surge of ice and water has destroyed infrastructure across hundreds of kilometers.", "category": "Environment", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "ca9f8383"}, {"headline": "PM Modi arrives in Tashkent to bolster strategic ties with Uzbekistan", "summary": "Prime Minister Narendra Modi began a four-day visit to Uzbekistan and Kyrgyzstan, arriving in Tashkent for bilateral meetings and the SCO Summit. He was received by Uzbek President Shavkat Mirziyoyev. The visit aims to strengthen partnerships in trade, energy, and defense. Modi took a longer flight route via Chinese airspace due to the continued closure of Pakistani airspace.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "482df795"}, {"headline": "Rahul Gandhi seeks FIR over purification of Haldwani venue after rally", "summary": "Congress leader Rahul Gandhi demanded an FIR against those involved in \"purifying\" a Haldwani ground after a speech by party president Mallikarjun Kharge. Gandhi accused the BJP and RSS of maintaining a mindset that discriminates against Dalits. He called the act a crime under the Constitution and the SC/ST Act, while the Uttarakhand BJP chief defended the ceremony.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "5dd0adcd"}, {"headline": "Kolkata police file FIR against Mamata Banerjee for violating court order", "summary": "An FIR has been registered against former West Bengal CM Mamata Banerjee for allegedly violating a Calcutta High Court order during a Trinamool Congress student rally. Charges include criminal conspiracy and disobedience. The action follows a complaint by BJP's Suvendu Adhikari, who alleged the rally obstructed traffic and exceeded permitted time limits on Cathedral Road.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "fbf6a5f0"}, {"headline": "Over 500 workers trapped at hydropower projects after Nepal flash floods", "summary": "At least 573 workers remain trapped or out of contact at 11 hydropower project sites in Nepal following Wednesday's flash floods. The most affected sites include Upper Trishuli 1 and Upper Trishuli 3B. India has sent technical teams and Army tunnel rescue units to assist. The workforce includes nationals from Nepal, India, China, South Korea, and Germany.", "category": "Environment", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "1a0c3424"}, {"headline": "Bar Councils must earn respect of members, says Justice Nagarathna", "summary": "Supreme Court Judge Justice BV Nagarathna stated that Bar Councils must introspect and work to earn the respect of their members to uphold professional ethics. Her comments follow recent friction between the Bar Council of India and NALSAR University students. She emphasized that the legal profession is an \"office of trust\" and that the Bar should maintain its independence.", "category": "Law", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "e518bc80"}, {"headline": "Maharashtra FDA withdraws suspension of eateries at Mumbai Cricket Association", "summary": "The Maharashtra Food and Drugs Administration withdrew orders suspending food safety licenses for five eateries at the Mumbai Cricket Association. The move came after the Bombay High Court criticized the department for passing \"mechanical orders.\" The court warned against \"high-handed\" actions and directed the FDA to follow proper legal procedures and the principles of natural justice.", "category": "Law", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "b0ffbac2"}, {"headline": "Delhi man and associate arrested for killing mentally ill son", "summary": "Delhi police arrested a 64-year-old man and his associate for the alleged murder of his 38-year-old son, Gul Hasan. The victim, who suffered from schizophrenia, was found dead in a shipping container near the Delhi-Mumbai Expressway. The father reportedly killed his son because of his mental health struggles, luring him to the spot on the pretext of visiting a doctor.", "category": "India", "page": 1, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "de259943"}, {"headline": "Delhi notifies new fire safety rules replacing inspections with checklists", "summary": "The Delhi government has notified the Delhi Fire Service (Amendment) Rules, 2026, introducing a standardized auditor checklist for safety clearances. The new system replaces the previous inspection format and grants the fire service more power to prescribe safety measures. Requirements include six-metre access routes for fire engines and automated monitoring systems.", "category": "Infrastructure", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "60921569"}, {"headline": "Ligament tear rules Neeraj Chopra out of 2026 Asian Games", "summary": "Two-time Olympic medallist Neeraj Chopra will not defend his Asian Games crown due to an ankle ligament tear sustained during training. Chopra announced the end of his 2026 season, which marks his first winless year. The javelin star has struggled with multiple injuries since the Paris Olympics. His absence leaves the Asian Games field open for competitors from Sri Lanka and Pakistan.", "category": "Sports", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "d91c1fa1"}, {"headline": "Telangana CM seeks four-week extension for electoral roll revision", "summary": "Telangana Chief Minister A Revanth Reddy requested the Election Commission to extend the Special Intensive Revision of electoral rolls by four weeks. He cited concerns over the potential deletion of 7.3 million voters classified under \"absent, shifted, or dead\" categories. Reddy proposed helpdesks and better notice mechanisms to ensure no eligible voter is excluded.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "d2bff1a8"}, {"headline": "Man posing as IPS officer arrested for sexual assault in Keralam", "summary": "Police in Keralam arrested a man named Adithyan for allegedly posing as an IPS officer on social media to cheat and sexually assault a minor. The accused befriended the girl online and promised to marry her, but distanced himself after she became pregnant. He has been charged under the POCSO Act and remanded to judicial custody following a complaint by the victim's family.", "category": "Law", "page": 2, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "f319f67c"}, {"headline": "Tamil Nadu school headmistress booked for abetment after Dalit student's suicide", "summary": "A government school headmistress in Madurai has been booked for abetment of suicide and making casteist slurs against a 16-year-old Dalit girl. The student died by suicide after allegedly being humiliated while seeking admission. Police are retrieving CCTV footage and consulting with child welfare officials to determine if charges under the SC/ST Act apply.", "category": "Law", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "0dc5bc3b"}, {"headline": "Four of a family found dead in Visakhapatnam in suspected suicide", "summary": "An autorickshaw driver, his wife, and their two young daughters were found dead at their residence in Chintala Agraharam, Visakhapatnam. Police suspect a murder-suicide pact after the man sent an \"RIP\" message to his brother. Preliminary investigations are exploring financial distress or family disputes as possible motives for the tragedy.", "category": "India", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "29cba36d"}, {"headline": "AIMIM expels Telangana MLC Mirza Rahmat Baig over assault allegations", "summary": "The AIMIM party has expelled MLC Mirza Rahmat Baig following allegations of sexual assault on a minor. Party leadership directed Baig to resign from his legislative post immediately. The move comes amid reports of a video involving the MLC and a minor. The BJP has demanded a full investigation, while Baig previously claimed he was being blackmailed with deepfake content.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "ca8c9452"}, {"headline": "Transferred ED officer Shekar Kumar faces fresh assault allegations in Shillong", "summary": "An Enforcement Directorate officer, already under investigation for a ₹2-crore bribery case in Kerala, is now accused of physical assault in Shillong. A man summoned for questioning alleged the officer assaulted him inside the agency's office on August 27. The complainant sought medical treatment for arm injuries, while the officer denies the latest claims of misconduct.", "category": "Law", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "4a8de3d2"}, {"headline": "AI-powered Coolphabets app launched to teach kids Indian languages", "summary": "A Boston-based company launched Coolphabets, an AI platform designed to help children aged three to 10 read and write in their mother tongues. The app supports Telugu, Hindi, Marathi, Tamil, and Kannada. It uses a patent-pending handwriting engine to analyze stroke order and proportions. Leaders including Andhra Pradesh CM Chandrababu Naidu praised the initiative.", "category": "Technology", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "90ea47e1"}, {"headline": "Debris and carcasses from Nepal floods sweep into Uttar Pradesh", "summary": "The impact of Nepal’s devastating floods reached Kushinagar, Uttar Pradesh, as the Narayani river carried carcasses, debris, and household items downstream. Local authorities recovered 13 bodies from the river over three days. Residents in nearby areas have been advised to remain alert, though state officials say current water levels do not pose an immediate threat.", "category": "Environment", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "64d89d85"}, {"headline": "Rajeev Singh Thakur likely to become Manipur's fifth Chief Secretary", "summary": "Manipur is set to appoint Rajeev Singh Thakur as its fifth Chief Secretary in three years as current top bureaucrat Puneet Goel retires. The 1995-batch IAS officer will transfer from the Rajasthan cadre to Manipur. The leadership change comes amid heightened ethnic tensions in the state, including recent violence in the Kangpokpi district that left four civilians dead.", "category": "Politics", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "fe78cdf1"}, {"headline": "Cert-In asks security researcher to delay disclosure of critical vulnerabilities", "summary": "Government cybersecurity agency Cert-In has requested 19-year-old researcher Nisarga Adhikary to halt the public disclosure of over 100 vulnerabilities. The researcher, who previously exposed CBSE flaws, rejected the request, accusing the agency of incompetence and failing to patch reported bugs. Cert-In cited policy aimed at preventing exploitation by bad actors before fixes are ready.", "category": "Technology", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "f6c5f733"}, {"headline": "Judicial commission confirms 24 died from contaminated water in Indore", "summary": "A judicial commission confirmed that 24 people died in Indore’s Bhagirathpura after consuming sewage-contaminated water. The report blamed a delayed municipal tender process for the epidemic, which occurred between late 2025 and early 2026. The commission recommended doubling compensation for victims' families to ₹4 lakh and identified municipal engineers responsible for the delays.", "category": "Health", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "ae1132a9"}, {"headline": "SC refuses to rollback order for SIT on forest land diversion", "summary": "The Supreme Court dismissed a curative petition seeking to roll back its order for a Special Investigation Team to restore illegally diverted forest land. The 2025 judgment requires states to identify reserved forest land held by private parties and recover costs. The bench emphasized that no case was made out to challenge the previous ruling regarding land in Pune, Maharashtra.", "category": "Law", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "54a04c75"}, {"headline": "Two killed in factional clashes between armed groups in Manipur", "summary": "Two people were killed and six injured during clashes between rival factions of the Zeliangrong United Front (ZUF) in Manipur's Noney district. The violence involved heavy gunfire in the Oktan and Muktina villages. Security concerns prevented police and local women's groups from reaching the site immediately. The fatalities included high-ranking members of the underground outfit.", "category": "Politics", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "7921430b"}, {"headline": "Chirag Paswan demands Jitan Ram Manjhi's resignation over reservation comments", "summary": "Union Minister Chirag Paswan called for the resignation of Jitan Ram Manjhi and his son Santosh Kumar Suman over their support for sub-categorizing SC/ST reservations. Paswan argued that reservation is a constitutional right based on historical discrimination, not an economic measure. The clash highlights growing divisions within the NDA over the Supreme Court's ruling on quotas.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "a44d42a7"}, {"headline": "Mobile phones and routers seized from Aftab Ansari's prison cell", "summary": "Jail authorities seized smartphones, WiFi routers, and SIM cards from the cell of 2002 American Centre attack mastermind Aftab Ansari in Kolkata. The surprise raid at Presidency Correctional Home also recovered cash and wireless earbuds. Ansari is serving a life sentence for the shooting that killed five. The incident follows recent suspensions of jail officials over mobile phone use.", "category": "India", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "15047ec7"}, {"headline": "Trump announces massive oil deal with Venezuela for US access", "summary": "President Donald Trump announced a sweeping agreement with Venezuela that grants the US rights to develop 17 oil fields with 65 billion barrels of reserves. The deal gives the US a 55% output stake and rights to buy oil at cost. The move aims to lower domestic gas prices amid the ongoing war in Iran. Experts warn that repairing infrastructure will take years to boost production.", "category": "Economy", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "80568136"}, {"headline": "Far-right activist Milo Yiannopoulos detained by ICE and deported to UK", "summary": "British far-right commentator Milo Yiannopoulos was detained by US Immigration and Customs Enforcement (ICE) at a New Orleans airport and deported to the UK. Authorities stated he was an \"illegal alien\" who had overstayed his visa since 2019. Ironically, Yiannopoulos had previously advocated for strict ICE checkpoints and summary deportations for visa violators in the US.", "category": "World", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "983c8ba4"}, {"headline": "Iranian leaders admit heavy economic toll from sanctions and war", "summary": "Iran’s Supreme Leader and President acknowledged that US sanctions and the ongoing war have caused foreign trade to shrink by a third. President Pezeshkian called for curbing inflation and job creation as the economy faces extreme pressure. Despite the hardship, Tehran vowed to maintain control over the Strait of Hormuz, through which 20% of the world's oil previously passed.", "category": "Economy", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "83078cec"}, {"headline": "Pharmaceutical firms target baldness treatments as next major gold rush", "summary": "Investors are flocking to drugmakers developing new treatments for pattern hair loss, viewing it as a massive market similar to weight-loss drugs. Shares of companies like Veradermics and Absci have surged as they test novel medicines. Current options like minoxidil and finasteride are limited by side effects, creating demand for innovative topical solutions that block hormones.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "fe727171"}, {"headline": "US Open presents wide open field as top seeds face injuries", "summary": "The final Grand Slam of the year begins with significant uncertainty as world No. 1 Jannik Sinner withdraws and Carlos Alcaraz returns from injury. Top seed Alexander Zverev and veteran Novak Djokovic enter the tournament following inconsistent hard-court results. The women's draw features Aryna Sabalenka and Elena Rybakina as frontrunners in a field lacking a clear favorite.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "3253f765"}, {"headline": "Indian women’s hockey team targets podium after best World Cup finish", "summary": "Following their best World Cup performance in 52 years, the Indian women’s hockey team is shifting focus to the upcoming Asian Games. Goalkeeper Savita Punia emphasized the team's improved attacking mindset and tactical discipline under coach Harendra Singh. A gold medal at the Asian Games would secure India’s qualification for the 2028 Los Angeles Olympics.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "440deeb2"}, {"headline": "Indian pace attack shows promise as fast bowlers adapt to Tests", "summary": "India's recent Test series in Sri Lanka highlighted the ability of young fast bowlers to adapt from T20 rhythms to the endurance required for red-ball cricket. Despite the absence of Jasprit Bumrah, Prasidh Krishna and others managed heavy workloads and maintained intensity. Coaches noted that while physical demands differ, the fundamental skills remain consistent across formats.", "category": "Sports", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "b80674e5"}, {"headline": "North Zone and East Zone advance to Duleep Trophy semi-finals", "summary": "North Zone and East Zone secured victories to reach the Duleep Trophy semi-finals in Bengaluru. North Zone defeated West Zone by 52 runs behind Abid Mushtaq's bowling, while East Zone crushed North East by an innings and 210 runs. They now face South Zone and defending champions Central Zone. The tournament features top Indian domestic players including Tilak Varma and Rajat Patidar.", "category": "Sports", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "015faed7"}, {"headline": "Liverpool held by Forest as Manchester City beats Crystal Palace", "summary": "In the Premier League, Liverpool was held to a 2-2 draw by Nottingham Forest at Anfield, with Victor Munoz scoring the equalizer. Meanwhile, Manchester City secured a 4-1 victory over Crystal Palace, featuring two goals from Erling Haaland. In Formula 1 news, Lando Norris signed a contract extension with McLaren that will keep him at the team until 2030.", "category": "Sports", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "6c1db08a"}, {"headline": "Rain halts play as England maintains lead in second Test", "summary": "Heavy rain forced an early abandonment of the third day’s play in the second Test between England and Pakistan at Lord’s. England currently holds a 357-run lead. Pakistan's Mohammad Abbas took 3-48 before the downpour started. Only one session was possible before officials called off play for the day, leaving England in a strong position with two days remaining.", "category": "Sports", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "97674fe9"}, {"headline": "Museums work to restore legacy of forgotten female art masters", "summary": "Major museums worldwide are launching retrospectives to accurately credit women artists whose works were historically attributed to men or forgotten in storage. Figures like Michaelina Wautier and Hilma af Klint are being celebrated as pioneers of Renaissance and abstract art. The effort aims to fix a \"massive blind spot\" in art history that excluded women from academies and guilds.", "category": "Culture", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "42157015"}, {"headline": "TV shows focusing on professional excellence gain popularity as competency porn", "summary": "A new trend in television and film, dubbed \"competency porn,\" focuses on characters who excel at highly skilled jobs despite living in dysfunctional worlds. Shows like \"The Bear\" and \"The Pitt\" offer viewers psychological satisfaction and a sense of agency amid real-world uncertainty. Experts suggest these portrayals of adept problem-solving provide refuge for audiences during crises.", "category": "Culture", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "c8b9255d"}, {"headline": "Streaming series Furious earns acclaim for dark, witty portrayal of rage", "summary": "The new crime series \"Furious,\" created by Elizabeth Meriwether, is receiving praise for its sharp writing and exploration of female rage. Starring Emmy Rossum as an FBI agent hunting a serial killer, the show avoids traditional victimhood tropes. Critics highlight its polished excellence and strong performances, marking it as one of the standout streaming releases of 2026.", "category": "Culture", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "6b644f3a"}, {"headline": "New book The Great Shadow explores how illness shapes human history", "summary": "Historian Susan Wise Bauer’s new book examines the profound impact of sickness on human civilization, from ancient Rome to the Covid-19 pandemic. The work explores how disease has influenced social norms, religion, and economic decisions like insurance. Bauer notes that public reactions to pandemics, including resistance to quarantine, have remained consistent throughout history.", "category": "Science", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "76aad619"}, {"headline": "Resource scarcity linked to rising aggression and civil wars in animals", "summary": "Research into chimpanzees, mongooses, and ants reveals that habitat loss and resource scarcity are driving unprecedented levels of internal conflict. A decade-long \"civil war\" among chimps in Uganda and increased aggression in ant colonies are being studied as potential outcomes of the climate crisis. Scientists are observing how environmental stress alters social hierarchies.", "category": "Science", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "07bab137"}, {"headline": "Global pregnancy rituals offer insight into historical health and reproduction", "summary": "A study of pregnancy rituals across cultures, from Chinese wedding traditions to Scandinavian folklore, highlights the human effort to understand and protect birth. While many beliefs are based on superstition, others ensured that pregnant women were well-fed and cared for in times of scarcity. These traditions reflect diverse societal attitudes toward fertility.", "category": "Culture", "page": 12, "importance": 2, "telegram_url": "https://t.me/c/1877410077/135665", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 30-08.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135665"}], "article_id": "4f520beb"}, {"headline": "GST Council waives interest and penalty on certain tax notices", "summary": "The GST Council recommended waiving interest and penalties for tax notices issued for the fiscal years 2017-18 to 2019-20, provided the full tax is paid by March 2025. Chaired by Finance Minister Nirmala Sitharaman, the council aimed to reduce litigation for taxpayers facing demands under Section 73. This was the first meeting held since the formation of the new central government.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "2a1e74fa"}, {"headline": "Finance Ministry likely to retain FY25 fiscal deficit target at 5.1%", "summary": "The Indian government is expected to stick to its fiscal deficit target of 5.1% of GDP for the 2024-25 fiscal year in the upcoming July budget. Despite receiving a record dividend of Rs 2.11 lakh crore from the RBI, officials indicate that the surplus may be diverted toward increased capital expenditure and infrastructure development rather than further reducing the deficit target.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "617b2c12"}, {"headline": "India and Bangladesh to initiate negotiations for bilateral trade pact", "summary": "Prime Minister Narendra Modi and Bangladesh PM Sheikh Hasina agreed to start talks on a Comprehensive Economic Partnership Agreement (CEPA). During the bilateral summit, the two nations signed ten agreements covering digital partnerships, green transition, maritime cooperation, and rail connectivity. The move aims to strengthen economic ties and regional stability between the neighbors.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "525648fb"}, {"headline": "Govt to expand health insurance for all seniors aged 70 plus", "summary": "The Union Cabinet is finalizing a proposal to extend Ayushman Bharat PM-JAY health insurance coverage to all senior citizens aged 70 and above. The scheme, expected to be part of the upcoming Union Budget, will provide an additional health cover of Rs 5 lakh per family for elderly members. The expansion aims to ensure universal health security for the aging population regardless of income.", "category": "Health", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "63db6b89"}, {"headline": "CBI takes over investigation into NEET-UG exam paper leak allegations", "summary": "The Central Bureau of Investigation has registered a fresh case to probe alleged irregularities and paper leaks in the NEET-UG medical entrance exam. This follows the Education Ministry's decision to hand over the investigation to the agency amid nationwide student protests. The probe will focus on organized syndicates and the integrity of the National Testing Agency's exam process.", "category": "Education", "page": 2, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "1148ac81"}, {"headline": "Om Birla and K Suresh file nominations for Lok Sabha Speaker", "summary": "In a rare move, the Lok Sabha will see an election for the Speaker's post as both the NDA and the opposition filed nominations. The ruling alliance fielded Om Birla, while the INDIA bloc nominated K Suresh after failing to reach a consensus with the government on the Deputy Speaker position. This marks the first such contest for the post in several decades.", "category": "Politics", "page": 2, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "b03cb4d3"}, {"headline": "Severe heatwave conditions to persist in North India says IMD", "summary": "The India Meteorological Department has issued a warning that severe heatwave conditions will continue in parts of Northwest and Central India for the next three days. While the monsoon has advanced into southern and eastern states, record-high temperatures in the national capital region have led to increased power demand and acute water shortages across urban areas.", "category": "Environment", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "2b8c1641"}, {"headline": "ISRO successfully conducts landing experiment for Reusable Launch Vehicle", "summary": "The Indian Space Research Organisation completed its third and final landing mission for the Reusable Launch Vehicle (RLV) named 'Pushpak'. The autonomous landing was performed under challenging conditions at the Aeronautical Test Range in Karnataka. The mission validates India's capability to develop low-cost access to space through reusable technology platforms.", "category": "Science", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "19e1626f"}, {"headline": "Opposition parties to meet to coordinate strategy for Parliament session", "summary": "Leaders of the INDIA bloc are scheduled to meet in New Delhi to discuss a unified strategy for the first session of the 18th Lok Sabha. Key topics include the NEET controversy, rising inflation, and the conduct of the Speaker election. The opposition aims to challenge the government on several policy issues and demand transparency regarding recent exam cancellations.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "a8a7263a"}, {"headline": "International Yoga Day celebrations held across major global cities", "summary": "Millions of participants worldwide observed the 10th International Day of Yoga. Prime Minister Narendra Modi led the main national event in Srinagar, emphasizing yoga's role in promoting global health and wellness. Mass demonstrations were held at iconic heritage sites and schools across India to promote the ancient practice's holistic benefits for physical and mental well-being.", "category": "Culture", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "9622ba60"}, {"headline": "Maruti Suzuki to hike vehicle prices from July due to inflation", "summary": "India's largest carmaker, Maruti Suzuki, announced a price increase for select vehicle models effective from July. The company cited rising input costs and persistent inflationary pressure on commodities as reasons for the hike. This follows similar adjustments by other automakers earlier this year to protect margins amid fluctuating raw material expenses.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "1d915ef9"}, {"headline": "Adani Group to invest 100 billion dollars in energy transition", "summary": "The Adani Group has announced a commitment to invest $100 billion over the next ten years in digital infrastructure and energy transition. Group chairman Gautam Adani stated the focus will be on green hydrogen, renewable energy production, and data centers. The plan is part of the conglomerate's strategy to become a major global player in sustainable energy solutions.", "category": "Infrastructure", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "3895835a"}, {"headline": "Supreme Court refuses to stay NEET-UG counseling process", "summary": "The Supreme Court of India declined to stay the ongoing NEET-UG counseling, emphasizing that the process cannot be stalled to prevent academic delays for students. However, the bench clarified that all admissions granted will be subject to the final outcome of the litigation regarding alleged exam paper leaks. The court has scheduled the next hearing for July 8.", "category": "Law", "page": 4, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "af3d28c9"}, {"headline": "Amul increases milk prices by 2 rupees per litre nationwide", "summary": "The Gujarat Cooperative Milk Marketing Federation has raised milk prices by Rs 2 per litre for all Amul variants across India. The federation cited rising costs of animal feed and a general increase in production expenses as the drivers for the price revision. This hike aims to support dairy farmers while maintaining the viability of the cooperative milk supply chain.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "a71d8188"}, {"headline": "Govt invites bids for fourth tranche of critical mineral blocks", "summary": "The Ministry of Mines has launched auctions for the fourth tranche of critical mineral blocks, including lithium and graphite. The move is part of India's strategy to secure raw materials for green energy and EV battery manufacturing. These mineral blocks are vital for reducing import reliance and achieving the country's carbon neutrality targets in the coming decades.", "category": "Economy", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "1578f011"}, {"headline": "Sebi to tighten norms for retail investors in F&O segment", "summary": "The Securities and Exchange Board of India is set to release a consultative paper proposing stricter norms for retail participation in the futures and options (F&O) segment. The initiative follows concerns from the RBI and Finance Ministry regarding the high volume of losses incurred by individual traders in speculative derivative markets compared to institutional players.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "4c2f3c9b"}, {"headline": "HDFC Bank to sell stake in HDFC Education through Swiss Challenge", "summary": "HDFC Bank plans to divest its 100% stake in its subsidiary, HDFC Education and Development Services, using the Swiss Challenge method. The divestment is part of the bank's effort to streamline operations following its merger with HDFC Ltd. The process will allow the bank to discover a transparent market price for the asset while focusing on its core retail banking portfolio.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "2f64930f"}, {"headline": "Sensex and Nifty trade flat amid mixed global market cues", "summary": "Benchmark indices Sensex and Nifty remained range-bound in early trade, reflecting cautious sentiment in global markets. Gains in information technology and banking stocks provided some support, while selling pressure in the energy and pharmaceutical sectors weighed on the indices. Investors are currently awaiting domestic quarterly results and global inflation data for market direction.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "605340bb"}, {"headline": "Nvidia shares fall as investors engage in profit taking", "summary": "Shares of Nvidia Corporation fell by 4%, continuing a downward trend that erased nearly $200 billion from its market value over three days. The decline is attributed to investors booking profits after the company's rapid surge to become the world's most valuable firm. Despite the drop, analysts remain focused on the long-term demand for AI-related hardware and software.", "category": "Technology", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "21c506f3"}, {"headline": "Julian Assange reaches plea deal with US Justice Department", "summary": "WikiLeaks founder Julian Assange will plead guilty to one felony count of conspiring to obtain and disclose national defense information. According to the deal, he will be sentenced to time already served in a UK prison and be permitted to return to Australia. The agreement concludes a 14-year legal battle over the publication of classified US military and diplomatic documents.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "8581f97f"}, {"headline": "European stock markets open higher as political uncertainty eases", "summary": "Major European indices, including the DAX and FTSE 100, opened in positive territory as regional political tensions showed signs of stabilizing. Markets are turning their focus to upcoming Eurozone inflation data and central bank policy statements. Support for the rally came from the healthcare and consumer staples sectors, which helped offset weakness in commodity stocks.", "category": "World", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "5694eafc"}, {"headline": "Apple reportedly in talks to launch Apple Pay in India", "summary": "Apple is exploring the launch of its digital payment service, Apple Pay, in the Indian market to compete in the growing mobile payments space. Reports suggest the company is in discussions with local banks and the NPCI to integrate with the UPI framework. The move is part of Apple's broader strategy to expand its services revenue and ecosystem footprint within the country.", "category": "Technology", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "0ac806e8"}, {"headline": "India defeats Australia to enter T20 World Cup semi-finals", "summary": "The Indian cricket team secured a 24-run victory over Australia in their final Super 8 match of the T20 World Cup. Captain Rohit Sharma led the charge with a brilliant 92 off 41 balls, helping India reach a total of 205. The win guarantees India a spot in the semi-finals against England, while Australia’s progress now depends on other results in the group.", "category": "Sports", "page": 22, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135611", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_30-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/135611"}], "article_id": "08e64efb"}, {"headline": "Calcutta High Court cancels OBC certificates issued in Bengal after 2010", "summary": "The Calcutta High Court cancelled all OBC certificates issued in West Bengal after 2010, finding the inclusion process illegal. The order affects nearly 5 lakh certificates but does not impact those already in service. The court ruled that the state government failed to follow the proper legal framework for sub-classification of these categories.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "556a5984"}, {"headline": "RBI approves record 2.11 lakh crore dividend payout to central government", "summary": "The Reserve Bank of India approved a record dividend payout of 2.11 lakh crore rupees to the central government for fiscal year 2024. This transfer is significantly higher than previous years and is expected to help the government manage its fiscal deficit. The decision followed the central bank's annual board meeting to review economic performance.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "0cce30c8"}, {"headline": "Pune Police seek court permission to try Porsche crash minor as adult", "summary": "Pune Police have asked a sessions court for permission to prosecute a 17-year-old boy involved in the fatal Porsche crash as an adult for trial. The incident resulted in the deaths of two individuals. The minor's initial bail conditions, which included writing an essay, caused widespread public outcry and led to more stringent legal actions by the authorities.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "5f8e5209"}, {"headline": "British Prime Minister Rishi Sunak announces general election for July 4", "summary": "British Prime Minister Rishi Sunak announced a general election for July 4, surprising many in his party. Sunak stated that the election would be a choice between future stability and returning to square one. Recent polls show the Conservative Party trailing the Labour Party, making the upcoming vote a significant challenge for the incumbent leader.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "7fdea322"}, {"headline": "IMD predicts early monsoon arrival in Kerala by May 31", "summary": "The India Meteorological Department expects the southwest monsoon to hit Kerala by May 31. This arrival is slightly ahead of the normal onset date of June 1. Favorable weather conditions in the Arabian Sea are supporting the monsoon's progress. Early arrival could benefit the agricultural sector following several weeks of extreme heatwaves.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "db472fc0"}, {"headline": "PM Modi draws controversy with appeasement comments at Bihar election rally", "summary": "Prime Minister Narendra Modi faced criticism from the opposition for using a controversial term while discussing appeasement politics at a Bihar rally. The Congress party accused the PM of lowering the dignity of his office and filed a complaint with the Election Commission. Modi claimed the opposition was working against the interests of majority voters.", "category": "Politics", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "c16bab72"}, {"headline": "Severe heatwave persists across North India with temperatures reaching 47 degrees", "summary": "Northern India continues to suffer under a severe heatwave, with temperatures in Rajasthan and Delhi crossing 47 degrees Celsius. The weather department has maintained a red alert for the region. High demand for electricity has put pressure on the power grid as citizens use cooling appliances to cope with the record-breaking summer temperatures.", "category": "Environment", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "44c0a981"}, {"headline": "State funeral for President Raisi begins in Iran following helicopter crash", "summary": "A state funeral for President Ebrahim Raisi began in Tehran, attracting thousands of mourners and international delegates. Supreme Leader Ayatollah Ali Khamenei led the prayers for the deceased president and his entourage. The crash has led to an interim presidency and an upcoming national election to choose a permanent successor on June 28.", "category": "World", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "cfe62fc4"}, {"headline": "UGC allows universities to offer student admissions twice every year", "summary": "The University Grants Commission has announced that universities can now admit students twice a year, in the July-August and January-February cycles. This policy change aims to help students who miss out on regular admission windows and to increase total college enrollment. The move follows similar systems used by international educational institutions.", "category": "Education", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "0aa9d1a8"}, {"headline": "First human case of H5N1 bird flu detected in Australia from India", "summary": "Australian health officials confirmed the country's first human case of H5N1 avian influenza in a child who had recently traveled from India. The patient experienced severe symptoms but has since recovered fully. Authorities emphasized that there is no risk of a wider outbreak, as the virus does not spread easily between humans at this time.", "category": "Health", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "07bfefc9"}, {"headline": "Expanded Terminal 1 at Delhi airport set to become fully operational", "summary": "Delhi International Airport Limited is preparing to open the expanded Terminal 1 to the public within the next few weeks. The project increases the airport's annual passenger handling capacity to 100 million. The new facility includes advanced biometric entry systems, expanded check-in counters, and upgraded security zones to streamline travel.", "category": "Infrastructure", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "29deeb4d"}, {"headline": "SEBI issues notices to Adani firms over disclosure and related-party transactions", "summary": "SEBI has issued show-cause notices to various Adani Group entities for alleged non-disclosure of related-party transactions and breach of listing regulations. The notices follow a detailed investigation into the group's corporate governance practices. Adani Group companies have denied any wrongdoing and stated they remain in compliance with all laws.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "8df71c5a"}, {"headline": "ISRO successfully tests liquid rocket engine made using 3D printing technology", "summary": "ISRO has successfully conducted a hot test of a liquid rocket engine manufactured using 3D printing technology. The test lasted for 665 seconds and met all performance parameters. This achievement marks a significant step toward using additive manufacturing for future space missions, reducing production time and costs while maintaining engine reliability.", "category": "Science", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "0eebac95"}, {"headline": "International Museum Expo 2024 opens in Mumbai to celebrate cultural heritage", "summary": "The International Museum Expo 2024 has opened in Mumbai, showcasing India’s rich cultural heritage and modern conservation techniques. The event features exhibits from major national museums and interactive displays for visitors. It aims to modernize museum management and improve the visitor experience across the country's cultural institutions.", "category": "Culture", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "e03b071f"}, {"headline": "Kolkata Knight Riders beat Sunrisers Hyderabad to enter IPL 2024 final", "summary": "Kolkata Knight Riders secured their place in the IPL 2024 final by defeating Sunrisers Hyderabad by eight wickets in Qualifier 1. Mitchell Starc’s early wickets limited Hyderabad to a score of 159. KKR chased the target easily with strong performances from Venkatesh Iyer and Shreyas Iyer. Hyderabad will get another chance to reach the final in the second qualifier match.", "category": "Sports", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135581", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 30-08-2026_260830070346.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135581"}], "article_id": "c8288a43"}, {"headline": "Lando Norris extends McLaren contract until at least 2030", "summary": "Formula One world champion Lando Norris has signed a contract extension with McLaren, securing his future with the team until the end of 2030. The driver expressed his commitment to the British team, stating his desire to eventually conclude his racing career with them.", "category": "Sports", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "9962d7fd"}, {"headline": "Chinese chipmaker CXMT sues US Pentagon over military affiliation tag", "summary": "ChangXin Memory Technologies (CXMT), China's top memory chipmaker, has filed a federal lawsuit against the US Defense Department. The company seeks to be removed from a list of entities allegedly aiding the Chinese military, arguing its DRAM chips are produced for strictly civilian use.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "1cb78f7f"}, {"headline": "OpenAI halts AI model access for Elon Musk's Cursor company", "summary": "OpenAI announced it will stop providing AI models to Cursor, a coding-tool company owned by Elon Musk's SpaceX. The move follows a bitter rivalry between CEO Sam Altman and Musk, with OpenAI citing a lack of confidence that SpaceX will adhere to its terms of service.", "category": "Technology", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "c3f59d26"}, {"headline": "Nashville airport to be renamed after country legend Dolly Parton", "summary": "Tennessee officials have announced plans to rename Nashville International Airport in honor of country music icon Dolly Parton, following her death at age 80. Governor Bill Lee and airport officials are coordinating the move following a viral social media campaign by fans.", "category": "Culture", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "c4c713d4"}, {"headline": "Nepal rescue agencies race to save 500 trapped in hydropower projects", "summary": "Nepalese army and police personnel are attempting to reach over 500 people trapped in six separate hydro-power projects following devastating flash floods. Rescue efforts are being hindered by heavy mud, boulders, and road connectivity issues, with 13 personnel currently reported missing.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "4769323b"}, {"headline": "Turkey summons Ukraine envoy over Black Sea civilian ship attacks", "summary": "The Turkish foreign ministry summoned Ukraine's ambassador after two vessels, the Lider Bordo Mavi and the Lider Kocatepe, were attacked in the Black Sea. Turkey emphasized the absolute necessity of ensuring the safety of civilian assets and navigation in the region.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "dbf0b80a"}, {"headline": "Nepal faces five billion dollar bill for post-flood reconstruction", "summary": "Finance Minister Swarnim Wagle estimated that Nepal may require $4 billion to $5 billion for rebuilding efforts following catastrophic floods. The damage has severely impacted the nation's hydropower capacity, which accounts for over 12% of its national power generation.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "5d7e9351"}, {"headline": "Russia introduces mandatory military training for children in schools", "summary": "Revised civics courses in Russian schools now include mandatory military training for teenagers as young as 13. Students will learn to operate machine guns and anti-tank weapons, alongside field medicine, as part of a national effort to shape the next generation of recruits.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "47b9450f"}, {"headline": "England's water network buckles under severe sudden flash drought", "summary": "A intense flash drought in England has pushed water infrastructure to a breaking point, leading to potential hosepipe bans for 30 million people. Utilities are seeking emergency permissions to draw from protected rivers as reservoirs and boreholes fail to meet surging demand.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "8f4949ba"}, {"headline": "Donald Trump moves to seize control of major Venezuelan oil wealth", "summary": "President Donald Trump announced a maneuver to establish US dominance over 65 billion barrels of Venezuelan oil reserves. Working with interim leader Delcy Rodriguez, the plan aims to create the world's second-largest private oil company to secure American petroleum supplies for decades.", "category": "World", "page": 2, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "c147613c"}, {"headline": "Iran President admits US sanctions are severely impacting national economy", "summary": "President Masoud Pezeshkian admitted that US sanctions are causing 'economic asphyxiation,' with national exports and imports falling by up to 35%. He urged the nation to accept 'wartime conditions' and proposed increasing petrol prices to offset revenue losses.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "af22bb19"}, {"headline": "Italian abstract photography master Franco Fontana dies at 92", "summary": "Renowned photographer Franco Fontana has died in his hometown of Modena. Famous for his use of geometry and vivid colors in landscapes, Fontana was a pioneer who transformed photography from a documentary medium into an interpretative art form influenced by minimalism.", "category": "Culture", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "84107dc0"}, {"headline": "Minibus collision in central Zimbabwe kills 27 churchgoers", "summary": "At least 27 people were killed near Chivhu when a minibus carrying worshippers to a conference collided head-on with a truck. Police reported that the foreign-registered truck was attempting to overtake another vehicle at the time of the fatal crash.", "category": "World", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "2cbf5ef0"}, {"headline": "Vietnam surpasses China and India in export surplus with US", "summary": "Vietnam has recorded a $114 billion trade surplus with the United States in the first half of 2026, outpacing larger economies like China and India. The success is credited to the 'China plus one' strategy and Vietnam's deep integration into global machinery and electronics supply chains.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "c8846a5e"}, {"headline": "Liverpool signs Bradley Barcola in record one hundred twenty-three million deal", "summary": "Liverpool has finalized a massive £123 million transfer to sign French forward Bradley Barcola from Paris Saint-Germain. The deal represents a significant investment as the club looks to strengthen its offensive capabilities for the upcoming Premier League season.", "category": "Sports", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "b0ad0d70"}, {"headline": "PM Modi seeks terror-free region ahead of SCO summit", "summary": "Prime Minister Narendra Modi arrived in Tashkent for a two-nation tour, emphasizing India's vision for a region free from terrorism and extremism. At the upcoming SCO summit in Kyrgyzstan, Modi intends to reiterate India's stance on sovereignty and territorial integrity.", "category": "Politics", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "17c86977"}, {"headline": "High Court slams civic officials for ignoring SC bulldozer ruling", "summary": "The Bombay High Court reprimanded Nagpur Municipal Corporation officials, including an IAS officer, for claiming ignorance of a Supreme Court ruling on demolitions. The court noted that even a layman knows the laws regarding a 15-day notice period before property demolition.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "dc62ef8c"}, {"headline": "Amethi factory begins testing of fully indigenous AK-2 kh after being lured to a meeting by a woman he met on a dating app. The victim was kidnapped by four men in an SUV, forced to reveal bank details, and eventually abandoned behind a metro station after the extortion.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "62c811a3"}, {"headline": "Study finds forty-seven percent of Karnataka pollution comes from other states", "summary": "A new CSTEP study reveals that nearly half of Karnataka's air pollution originates outside its borders, primarily from Andhra Pradesh. Researchers recommend an 'airshed-based' management approach involving all southern states to coordinate emission controls and EV targets.", "category": "Environment", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "1a234cb9"}, {"headline": "Serbian model Lazar Jankovic launches cleanliness drive in Bengaluru", "summary": "Model Lazar Jankovic has started the '4cleanIndia' campaign, personally cleaning debris and garbage from city streets. The initiative has grown into a social media movement with 1.5 lakh followers, urging residents to take responsibility for the public spaces outside their homes.", "category": "India", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135652", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI-Bangalore 30-08.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135652"}], "article_id": "1e82366e"}, {"headline": "Bengaluru police reunite missing two-year-old girl with mother", "summary": "City police successfully found and returned a toddler who had wandered away from const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────

const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);
