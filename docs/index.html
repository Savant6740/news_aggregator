<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

"https://t.me/c/1877410077/132769"}], "article_id": "feb694d5"}, {"headline": "Kanwariyas blamed for ransacking school van in Lucknow accident", "summary": "A group of Kanwariyas allegedly ransacked a private school van and pelted stones at it in Lucknow’s Chowk area. The incident occurred after a minor collision between the van and a bike carrying three Kanwariyas. While no children were injured, the van’s windows were smashed. Police have registered an FIR against unidentified persons and are reviewing CCTV footage.", "category": "India", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "fd17b8ec"}, {"headline": "Justice Liberhan, who headed 17-year Babri probe, dies at 87", "summary": "Justice Manmohan Singh Liberhan, former Chief Justice of Andhra Pradesh and head of the Liberhan Commission that investigated the 1992 Babri Masjid demolition, passed away at 87. His report, submitted in 2009 after 17 years and 48 extensions, was India’s longest-running judicial inquiry. It concluded that the demolition was a 'premeditated' conspiracy involving several political leaders.", "category": "India", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "33c636d8"}, {"headline": "Monsoon fury continues in Kerala, death toll rises to 15", "summary": "Heavy rainfall and landslides in Kerala have claimed 15 lives over the past week. Several districts remain on high alert as rivers overflow and roads are blocked. Chief Minister Pinarayi Vijayan chaired a high-level meeting to oversee relief operations, with NDRF teams deployed for rescue. More than 11,000 people have been shifted to 316 relief camps across the state.", "category": "Environment", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "453276dc"}, {"headline": "Telangana fast-tracks Rs 84k-cr Palamuru Rangareddy Lift Irrigation Scheme", "summary": "The Telangana government has issued orders to fast-track the Palamuru Rangareddy Lift Irrigation Scheme (PRLIS), estimated to cost ₹84,000 crore. The project aims to provide irrigation and drinking water to drought-prone areas. CM Revanth Reddy directed officials to clear all pending land acquisition and environmental clearances within two weeks to ensure the project meets its deadlines.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "5fdb68fb"}, {"headline": "ONGC to set up strategic petroleum reserves for energy security", "summary": "The government has approved a proposal for ONGC to set up two new strategic petroleum reserve (SPR) facilities with a total capacity of 4 million metric tonnes. These reserves, to be located in Odisha and Karnataka, are intended to bolster India’s energy security against global supply disruptions. The project is estimated to cost ₹25,000 crore and will be completed by 2029.", "category": "Infrastructure", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "e7b6840c"}, {"headline": "Greece and France battle intense wildfires; UK faces drought", "summary": "Firefighters in Greece and France are struggling to contain massive wildfires fueled by extreme heatwaves and high winds. Thousands of residents have been evacuated, and millions of hectares of forest have been destroyed. Meanwhile, the UK government has officially declared a drought in several regions as water levels in reservoirs hit record lows during the hottest summer in decades.", "category": "Environment", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "7881bbfc"}, {"headline": "Zeel shares tank 15% after SEBI regulatory order on ESOPs", "summary": "Shares of Zee Entertainment Enterprises Ltd (ZEEL) fell by 15% on Monday after SEBI issued an order regarding irregularities in the company’s Employee Stock Option Plan (ESOP) scheme. The regulator highlighted concerns over the transparency of the scheme’s administration and its impact on minority shareholders. ZEEL has stated it will appeal the order in the Securities Appellate Tribunal.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "3b01d687"}, {"headline": "Gulveer, Tejaswin lead India's success at CWG athletics", "summary": "Indian athletes Gulveer Singh and Tejaswin Shankar secured medals at the Commonwealth Games athletics events. Gulveer won silver in the men’s 10,000m, while Tejaswin clinched bronze in the decathlon. Their performances have bolstered India's medal tally and provided a strong outlook for the upcoming Asian Games and World Championships.", "category": "Sports", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132769", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132769"}], "article_id": "64707d84"}, {"headline": "Iran President Ebrahim Raisi killed in helicopter crash near border", "summary": "Iran's President Ebrahim Raisi, Foreign Minister Hossein Amir-Abdollahian, and other officials were confirmed dead after their helicopter crashed in East Azerbaijan province. The crash occurred on Sunday during heavy fog. Supreme Leader Ayatollah Ali Khamenei has declared five days of national mourning and Mohammad Mokhber has been named acting president.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "1e7bd2eb"}, {"headline": "ICC prosecutor seeks arrest warrants for Netanyahu and Hamas leaders", "summary": "The International Criminal Court prosecutor Karim Khan has requested arrest warrants for Israeli PM Benjamin Netanyahu, Defense Minister Yoav Gallant, and three Hamas leaders including Yahya Sinwar. They are accused of war crimes and crimes against humanity related to the October 7 attacks and the subsequent conflict in Gaza. Israel and the US have condemned the move.", "category": "World", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "de637b78"}, {"headline": "Fifth phase of Lok Sabha polls records 60 percent turnout", "summary": "Voting for the fifth phase of the Lok Sabha elections across 49 constituencies in eight states saw a tentative voter turnout of 60.09%. West Bengal recorded the highest turnout, while Maharashtra saw the lowest. High-profile candidates included Rahul Gandhi and Rajnath Singh. The Election Commission noted that the polling process was largely smooth despite minor incidents.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "ad2b6160"}, {"headline": "Pune Porsche crash: Minor’s father arrested as police seek harsher charges", "summary": "The Pune police arrested the father of a 17-year-old boy involved in a Porsche crash that killed two IT professionals. The father, a prominent realtor, is accused of allowing his son to drive without a license. Public outcry intensified after the Juvenile Justice Board initially granted bail with conditions including writing an essay on road safety for the minor.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "8f5f83ee"}, {"headline": "Delhi court sends Bibhav Kumar to police custody for five days", "summary": "A Delhi court remanded Bibhav Kumar, aide to CM Arvind Kejriwal, to five-day police custody following his arrest for the alleged assault on AAP MP Swati Maliwal. The police sought custody to recover Kumar's mobile phone data and recreate the crime scene at the CM's residence. Maliwal alleged she was kicked and slapped during the incident on May 13.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "3114e75b"}, {"headline": "IMD issues red alert for severe heatwave in North India", "summary": "The India Meteorological Department (IMD) has issued a red alert for Rajasthan, Punjab, Haryana, and Delhi due to severe heatwave conditions. Temperatures exceeded 47 degrees Celsius in several parts of North India. The IMD warns of a high likelihood of heat illness and heatstroke for all ages, advising extreme caution for the next four days.", "category": "Environment", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "811fc4d4"}, {"headline": "ISRO achieves successful flight test of liquid rocket engine", "summary": "ISRO successfully conducted a long-duration test of the liquid rocket engine for the Gaganyaan mission's human-rated L110 stage. The test lasted 720 seconds at the ISRO Propulsion Complex. This milestone validates the engine's performance under simulated flight conditions, bringing India closer to its first manned space flight scheduled for next year.", "category": "Science", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "090806cb"}, {"headline": "Sensex and Nifty end lower amid election uncertainty and profit booking", "summary": "Indian stock indices closed in the red on Monday as investors remained cautious during the ongoing general elections. The BSE Sensex fell 202.91 points to 73,895.54, while the NSE Nifty dropped 52.90 points to 22,442.70. Major laggards included Nestle India and Maruti, while power and metal stocks saw some buying interest despite the broader volatility.", "category": "Economy", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "716ef857"}, {"headline": "Adani stocks jump as group market cap nears record highs", "summary": "Shares of Adani Group companies surged on Monday, adding over Rs 1 lakh crore to investor wealth. The combined market capitalization of the group’s 10 listed firms reached Rs 17.51 lakh crore, close to their pre-Hindenburg peaks. Gains were led by Adani Power and Adani Ports following positive brokerage reports and strong quarterly earnings expectations.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "0ef564fa"}, {"headline": "KKR and SRH set for Qualifier 1 showdown in Ahmedabad", "summary": "Kolkata Knight Riders (KKR) will face Sunrisers Hyderabad (SRH) in the first qualifier of the IPL 2024 at the Narendra Modi Stadium. KKR finished the league stage as table-toppers with 20 points. SRH secured the second spot after a win against Punjab Kings. The winner of this match will progress directly to the final scheduled for May 26 in Chennai.", "category": "Sports", "page": 18, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "5e489c6c"}, {"headline": "Supreme Court pulls up Patanjali for misleading advertisements", "summary": "The Supreme Court continued its hearing in the misleading ads case against Patanjali Ayurved. The court emphasized that public trust must not be exploited through false claims about medicinal cures. While the company has issued public apologies, the bench remains critical of the initial defiance shown by Ramdev regarding court orders and regulatory compliance.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132779", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 04-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132779"}], "article_id": "3876cb3f"}, {"headline": "Adani Group plans ₹1 trillion investment for AI data center in Odisha", "summary": "Adani Group has proposed a 1-gigawatt AI-based data center in Odisha with an investment of ₹1 lakh crore. The group has requested 250 acres of land from the state government. This is one of the largest data center investments by an Indian company, aligning with the group's global plan to invest $100 billion in AI-ready infrastructure by 2035.", "category": "Business", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "c6a5eb4f"}, {"headline": "New Taxation Bill to boost foreign investment and ease manufacturing norms", "summary": "The Taxation and Other Laws (Amendment) Bill, 2026 aims to encourage foreign investment by simplifying tax rules for electronics manufacturing, data centers, and diamond trading. It proposes tax exemptions until 2041 for specific funds and aims to establish India, particularly Gift City, as a global fund management hub while reducing uncertainty for institutional investors.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "dc9a317e"}, {"headline": "V2V communication mandatory for all new vehicles from October 2028", "summary": "The Ministry of Road Transport and Highways issued a draft notification making Vehicle-to-Vehicle (V2V) communication systems mandatory for new vehicles from October 2028. The system enables real-time data exchange between vehicles to prevent accidents. The government has invited stakeholder feedback on technical standards and frequency bands until the end of August.", "category": "Technology", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "d37ae577"}, {"headline": "New stock closing auction system leads to divergence in index prices", "summary": "The first day of the closing auction system for F&O stocks saw significant price differences between Sensex and Nifty. Nifty closed 1.6% higher at 24,774, while Sensex gained 0.7% to 78,639, showing a 91-basis point gap. Experts believe the variation was due to large buy orders in high-weightage Nifty stocks during the new auction process.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "e1655bd5"}, {"headline": "FCNR(B) deposits surge as banks reduce reliance on Certificates of Deposit", "summary": "Increased foreign currency non-resident (FCNR-B) deposits have reduced bank reliance on Certificates of Deposit (CD). Banks raised ₹95,000 crore via CDs in July, down from ₹1.8 lakh crore in June. A concessional swap facility provided by the RBI helped attract nearly $28 billion in foreign deposits, lowering funding costs for the domestic banking system.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "46cfb5f2"}, {"headline": "Yashwant Sinha reflects on 1991 reforms and current economic trajectory", "summary": "Former Finance Minister Yashwant Sinha stated that if not for political shifts in 1991, he would have been recognized as India's primary reformer. He noted that many elements of Manmohan Singh's historic 1991 budget were based on his previous 'mini-budget'. Sinha expressed concerns over current research funding and the need for continuous, bold structural reforms.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "8e60e670"}, {"headline": "Ashok Leyland July sales increase by 30 percent", "summary": "Ashok Leyland reported a 30% year-on-year growth in vehicle sales for July. The stock closed at ₹174.0, marking a 4.8% increase from the previous close. The growth reflects strong demand in the commercial vehicle segment.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "959d2d53"}, {"headline": "Bajaj Auto reports 30 percent growth in July vehicle sales", "summary": "Bajaj Auto's sales for July 2026 reached 4,74,677 units, a 30% increase compared to the previous year. Despite the sales jump, the stock saw a marginal decline of 0.1% to close at ₹11,508.3.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "09ba8431"}, {"headline": "Ethos Q1 net profit surges 48 percent to ₹28 crore", "summary": "Luxury watch retailer Ethos reported a 48% increase in net profit for the first quarter of FY27, reaching ₹28 crore. The company's stock responded positively, jumping 15.7% to close at ₹2,969.3.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "bbc5d2de"}, {"headline": "ITC completes ₹3,500 crore acquisition of Century Pulp and Paper", "summary": "ITC Limited has completed the acquisition of Century Pulp and Paper (CPP) from Aditya Birla Real Estate Limited for ₹3,500 crore. This acquisition makes ITC India's largest integrated paperboard and paper company. The CPP business will now operate as part of ITC's Paperboards and Specialty Papers division.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "8d5869c0"}, {"headline": "SEBI fines Nalco for non-compliance with corporate governance norms", "summary": "Stock exchanges BSE and NSE have imposed a fine of ₹5.31 lakh on National Aluminium Company Limited (Nalco) for failing to comply with board composition rules. The penalty specifically pertains to the quarter ending March 31, citing violations of SEBI's Listing Obligations and Disclosure Requirements.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "e274ac2b"}, {"headline": "IndiGo maintains low-cost discipline while expanding premium services", "summary": "Entering its third decade, IndiGo aims to maintain strict cost discipline while expanding into business class and long-haul flights. Chief Strategy Officer Aloke Singh emphasized that their 'IndiGo Stretch' business class will cater to market demand without sacrificing operational efficiency. Former IATA Director Willie Walsh has officially joined as the new CEO.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "5d57bcd4"}, {"headline": "TRAI re-launches MyCall app to improve voice call quality monitoring", "summary": "The Telecom Regulatory Authority of India (TRAI) has re-launched its 'MyCall' mobile application with a new interface. The app allows consumers to rate their voice call quality on a scale of 1 to 5 stars, providing real-time data to the regulator to monitor and improve network performance across the country.", "category": "Technology", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "9359e107"}, {"headline": "Jindal Stainless Q1 net profit grows 7.6 percent to ₹769 crore", "summary": "Jindal Stainless Limited (JSL) reported a 7.6% year-on-year increase in consolidated net profit to ₹769 crore for the June quarter. Revenue rose 10.5% to ₹11,279 crore. The company overcame supply chain disruptions in LPG and propane caused by Middle East tensions, though sales volume dipped slightly to 5,80,805 tonnes.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "ac9b830c"}, {"headline": "Escorts Kubota reports Q1 net profit of ₹386 crore", "summary": "Tractor and construction equipment maker Escorts Kubota reported a consolidated net profit of ₹385.93 crore for the June quarter. Revenue from operations stood at ₹1,027.63 crore. The company is focusing on infrastructure projects and agricultural demand to drive growth.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "afd6f914"}, {"headline": "MobiKwik turns profitable with ₹7.61 crore net gain in Q1", "summary": "Fintech firm MobiKwik reported a consolidated net profit of ₹7.61 crore for the first quarter of FY27, recovering from a loss of ₹41.92 crore in the previous year. Revenue grew 3.72% to ₹281.41 crore. This marks the third consecutive profitable quarter for the company since its December 2024 listing.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "04435d3d"}, {"headline": "Torrent Power Q1 profit drops 10.75 percent to ₹661 crore", "summary": "Torrent Power's consolidated net profit fell 10.75% to ₹661.85 crore in the first quarter, primarily due to higher LNG costs and global supply issues. Revenue grew slightly by 3% to ₹8,124 crore. The company received regulatory approval for ₹110 crore in costs related to a 113 MW hydroelectric project.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "e32d278a"}, {"headline": "Dhanuka Agritech Q1 profit falls 35 percent to ₹36 crore", "summary": "Agrochemical company Dhanuka Agritech reported a 35% decline in net profit to ₹36.30 crore for the June quarter. The company plans to set up a new ₹200 crore pesticide plant in Maharashtra to expand its manufacturing capabilities despite the current quarter's downturn.", "category": "Business", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "8d3cd64f"}, {"headline": "DLF reports 4 percent growth in Q1 profit to ₹794 crore", "summary": "Real estate major DLF reported a 4% rise in consolidated net profit to ₹793.9 crore for the June quarter. While operational revenue dropped 52% to ₹1,280.34 crore, the company saw strong growth in its residential and annuity businesses. Chairman Rajiv Singh cited government infrastructure focus as a key growth driver.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "bbf580b5"}, {"headline": "Sarda Energy Q1 net profit up 10 percent to ₹478 crore", "summary": "Sarda Energy and Minerals Limited reported a 10% increase in integrated net profit to ₹478 crore for the first quarter of FY27. Total income rose to ₹1,717 crore compared to ₹1,397 crore in the previous year's June quarter.", "category": "Business", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "8e1ab2e7"}, {"headline": "Persistent Systems Q1 profit increases 13.67 percent to ₹483 crore", "summary": "IT firm Persistent Systems reported a 13.67% rise in integrated net profit to ₹483.04 crore for the first quarter. Revenue grew to ₹1,329 crore. The company attributed the growth to increased digital transformation demand across its core markets.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "b9f4a71f"}, {"headline": "GSK Pharma Q1 net profit rises 16 percent to ₹237 crore", "summary": "GlaxoSmithKline Pharmaceuticals (GSK India) reported a 16% increase in consolidated net profit to ₹237.18 crore for the quarter ending June 30. Revenue from operations climbed to ₹938.44 crore, driven by strong performance in its specialty medicine portfolio.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "55626312"}, {"headline": "Pharma body OPPI seeks 10-year regulatory data protection from government", "summary": "The Organization of Pharmaceutical Producers of India (OPPI) is urging the government to implement 10-year Regulatory Data Protection (RDP) for new drugs from the date of Indian approval. Local generic firms oppose this, fearing higher drug prices. OPPI argues this will encourage innovation, while the government is still evaluating the impact on the affordable generics market.", "category": "Health", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "93cf4225"}, {"headline": "Bond yields soften and Rupee ends at 95.34 per dollar", "summary": "Indian government bond yields softened as crude oil prices eased and state borrowing expectations remained low. The 10-year benchmark yield closed at 6.83%. The Rupee closed at 95.34 per dollar, recovering from intraday lows of 95.39 as state-run banks sold dollars. Markets now await the RBI's upcoming monetary policy decision for further cues.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "375d0689"}, {"headline": "ITC shares hit record high on improved cigarette business outlook", "summary": "ITC shares jumped 4% to ₹292.50 as analysts predicted the worst is over for its cigarette business. Despite a 35% drop in Q1 cigarette earnings, volume decline was lower than expected. Analysts from Nomura and Motilal Oswal suggest that strategic price hikes and a stable tax environment will improve unit economics in the coming quarters.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "64076cfa"}, {"headline": "CAMS Q1 net profit rises 17.6 percent to ₹127 crore", "summary": "Computer Age Management Services (CAMS) reported a 17.6% rise in net profit to ₹127 crore for the June quarter. Operational revenue grew 11.5% to ₹395 crore. The company’s mutual fund Average Assets Under Management (AAUM) reached a record ₹56 lakh crore, maintaining a market share of 67.2%. A dividend of ₹2.50 per share was announced.", "category": "Business", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "5592e224"}, {"headline": "Zee Entertainment shares crash 15 percent following SEBI ban", "summary": "Shares of Zee Entertainment Enterprises Limited (ZEEL) fell 15% after SEBI barred Subhash Chandra and Punit Goenka from the securities market for one year. The regulator also ordered a freeze on assets related to an unauthorized land mortgage case in Hyderabad. The company's market capitalization dropped by over ₹1,661 crore in a single day.", "category": "Business", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "85335702"}, {"headline": "Government considers duty benefits for SEZ units selling in domestic market", "summary": "The government is evaluating a proposal to allow Special Economic Zone (SEZ) units to pay customs duty only on imported inputs when selling finished goods in the domestic tariff area (DTA). Currently, they pay duty on the full value of the finished product. This move aims to increase capacity utilization in SEZs, which has been hit by slowing global exports.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "7188b2b9"}, {"headline": "Higher appeal thresholds reduce disputed tax demand by ₹16,690 crore", "summary": "Increasing the monetary limits for filing tax appeals in tribunals and courts has reduced disputed tax demands by approximately ₹16,690 crore. Finance State Minister Pankaj Chaudhary informed the Lok Sabha that 11,390 appeals were either withdrawn or not filed. This measure is part of the government's effort to reduce litigation and provide certainty to taxpayers.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "50c96f3f"}, {"headline": "Supreme Court dismisses IEX petition against market coupling framework", "summary": "The Supreme Court dismissed a petition by the Indian Energy Exchange (IEX) challenging the Central Electricity Regulatory Commission's (CERC) market coupling framework. The court allowed CERC to continue drafting the rules, which aim to create a single price across electricity exchanges. IEX shares fell 4% following the ruling, as the company argued the move would harm competition.", "category": "Law", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "f08e389a"}, {"headline": "Government targets five indigenous Small Modular Reactors by 2033", "summary": "The government aims to develop and commission at least five indigenous Small Modular Reactors (SMRs) by 2033. Cost estimates for these reactors range from ₹320 crore for a 5 MW thermal unit to ₹7,000 crore for a 55 MW nuclear module. These factory-made reactors are intended for captive power in energy-intensive industries and green hydrogen plants.", "category": "Science", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "66311a7b"}, {"headline": "GST refund pendency significantly reduced over the last two years", "summary": "Finance State Minister Pankaj Chaudhary informed the Lok Sabha that the number of pending GST refund claims has significantly decreased. As of March 31, 2026, only 64 claims were pending for more than 60 days. The total amount involved in older pending claims fell to ₹164 crore, down from much higher levels in previous fiscal years.", "category": "Economy", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "2edabf7e"}, {"headline": "India-UK FTA: A major step toward free trade despite remaining hurdles", "summary": "The India-UK Free Trade Agreement (FTA) officially became effective on July 15. The deal eliminates duties on 99% of Indian exports immediately, while India will reduce tariffs on British cars and whiskey over 10 years. Challenges remain regarding professional services and the Carbon Border Adjustment Mechanism (CBAM), but the deal signals India's growing economic confidence.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "bb33d7a7"}, {"headline": "Asset monetization: States must convert idle land into growth engines", "summary": "Expert analysis suggests Indian states must monetize idle assets like urban land and public enterprises to fund infrastructure. By creating asset management agencies and sovereign-style endowment funds, states can leverage institutional capital. Following models from Norway and Singapore could help states finance modern cities, ports, and universities without increasing debt.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "c58003b0"}, {"headline": "India breaches record high data breach costs in 2026", "summary": "An IBM report reveals that the average cost of a data breach in India reached an all-time high of ₹25.5 crore in 2026, a 16% increase from the previous year. Phishing remains the top entry point for attackers. Companies using extensive AI and automation for security saved an average of ₹10.3 crore and identified breaches 61 days faster than those without such tech.", "category": "Technology", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "56beb15a"}, {"headline": "Meta apologizes for temporary block on PM Modi's Facebook post", "summary": "Meta officials apologized to a Parliamentary Committee for a technical glitch that temporarily blocked a post by Prime Minister Narendra Modi. The committee questioned the company on 'algorithmic bias' and its failure to remove other offensive content. Members demanded greater accountability and legal action for glitches involving high-profile national leaders.", "category": "Politics", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "e444dcd4"}, {"headline": "Inter-state water disputes intensify as monsoon variations spark concern", "summary": "Water disputes are escalating between states including Odisha-Chhattisgarh (Mahanadi) and Karnataka-Tamil Nadu (Cauvery) due to climate change concerns. Tamil Nadu has moved the Supreme Court for its share of water, while Odisha seeks a solution via a technical committee. Experts warn that El Nino-induced water scarcity is driving these political tensions over river management.", "category": "Environment", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "1e659af3"}, {"headline": "Trump postpones Iran strike after advice from Gulf nation leaders", "summary": "US President Donald Trump announced he has postponed a major planned attack on Iran following requests from leaders of Qatar, Saudi Arabia, and the UAE. Trump stated that Gulf leaders preferred a diplomatic solution and a potential new agreement over a military conflict. The planned strike was described as one of the largest since World War II.", "category": "World", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "8da98eab"}, {"headline": "Vishwesh Negi appointed as India's new Ambassador to Iran", "summary": "Vishwesh Negi, a 2002-batch Indian Foreign Service (IFS) officer, has been appointed as India's next Ambassador to the Islamic Republic of Iran. Currently serving as Joint Secretary in the Ministry of External Affairs, Negi is expected to take up the high-profile assignment shortly amidst regional tensions.", "category": "India", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132741", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132741"}], "article_id": "abdfe458"}, {"headline": "Supreme Court considers petition to discontinue Jantar Mantar as protest site", "summary": "Chief Justice Surya Kant asked the Solicitor-General to consult with authorities regarding a petition claiming Jantar Mantar is no longer suitable for mass demonstrations. The plea flags logistical issues like medical supply access and traffic ingress-egress. The court noted the importance of balancing the right to peaceful protest with public order and convenience.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "18fbe68c"}, {"headline": "Delhi High Court orders pilot camps for stray dog sterilisation", "summary": "The Delhi High Court directed the MCD and NDMC to organize pilot camps to sterilize and vaccinate stray dogs in identified wards. The court suggested leaving a small proportion (5%) of the population unsterilized to prevent total disappearance over time. The initiative aims to encourage community participation and allay fears among animal lovers that dogs would be permanently removed.", "category": "Health", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "f61d105d"}, {"headline": "Arvind Kejriwal criticizes Delhi Lakshmi Yojana eligibility norms as restrictive", "summary": "AAP convener Arvind Kejriwal accused the BJP of imposing restrictive rules on the Delhi Lakshmi Yojana to limit the number of beneficiaries. The scheme offers ₹2,500 monthly to women, but requires an endorsement from an MLA or MP and 10 years of residency. Kejriwal claimed fewer than 10% of Delhi's women would qualify under these conditions.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "e22897aa"}, {"headline": "Delhi Police moves against social media handles for misleading protest videos", "summary": "Delhi Police issued takedown notices to Meta and X regarding handles circulating old videos of Jantar Mantar protests as 'live' events. The police clarified that the Cockroach Janta Party agitation ended over a week ago. The government's fact-check unit also intervened to warn the public against sharing unverified content that falsely suggests demonstrations are ongoing.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "9073c9f5"}, {"headline": "School van vandalised in Lucknow; educational institutes shut for Kanwar Yatra", "summary": "A school van carrying students was attacked and vandalised by a group in Lucknow, leading to the booking of three unidentified persons. Meanwhile, administrations in Meerut, Ghaziabad, and Baghpat ordered the closure of all schools and colleges until August 12 to manage traffic and ensure student safety during the heavy movement of Kanwar Yatra pilgrims.", "category": "India", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "1bcda4fe"}, {"headline": "Supreme Court restores gram panchayat rights over Gurugram land", "summary": "Setting aside a 2007 High Court judgment, the Supreme Court restored ownership of 436 bighas of land in Gurugram to a gram panchayat. The court ruled the land was 'shamilat deh' (common village land) and not private property. The Bench noted that land proximate to urban hubs like Gurugram is increasingly valuable, making common land protection essential.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "92f31f36"}, {"headline": "Odisha seeks UNESCO Intangible Cultural Heritage tag for Puri Rath Yatra", "summary": "Odisha Chief Minister Mohan Charan Majhi has requested the Union Culture Ministry to nominate the Puri Rath Yatra for UNESCO's list of intangible cultural heritage. The CM described the festival as a symbol of India's cultural diversity, spirituality, and community participation. The BJD criticized the move as a publicity exercise to divert from recent administrative failures.", "category": "Culture", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "31f0a278"}, {"headline": "Kerala rain toll rises to 18 as heavy showers continue", "summary": "Persistent heavy rainfall in Kerala has resulted in 18 deaths and displaced over 13,000 people to 363 relief camps. The state government announced a rehabilitation package, including ₹8 lakh for families of the deceased and assistance for house construction. Although rainfall intensity has decreased, an orange alert remains for 12 districts as rescue operations continue.", "category": "Environment", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "dd5f7d69"}, {"headline": "Karnataka Cabinet expanded with 19 legislators amid internal party dissent", "summary": "The D.K. Shivakumar-led Congress government in Karnataka expanded its Cabinet by inducting 19 legislators, including eight first-timers. The expansion triggered protests and resignations from several senior MLAs who were excluded. One Cabinet berth remains vacant. Discontent spilled onto the streets, with supporters of excluded leaders staging demonstrations in Bengaluru.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "b4bb7cdd"}, {"headline": "Russia air strike on Kharkiv warehouse destroys eight million books", "summary": "A Russian air strike on a warehouse in Kharkiv destroyed approximately eight million books, according to the Ranok publishing house. Ukrainian officials described the incident as a deliberate attack on the country's cultural infrastructure. The loss represents the largest single destruction of book inventory since the conflict began in 2022.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "f51af9ab"}, {"headline": "Ankur Bhattacharjee wins Commonwealth Table Tennis men’s singles title", "summary": "19-year-old Ankur Bhattacharjee won the men’s singles crown at the 22nd Commonwealth Table Tennis championships. Bhattacharjee, who missed the Asian Games squad earlier, defeated Payas Jain in a seven-game final at the Thyagaraj Sports Complex. He described the victory as a validation of his place in the national team.", "category": "Sports", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "92a4bde4"}, {"headline": "Study links maternal heat stress to adverse birth outcomes in India", "summary": "A nationwide study using NFHS-5 data found that prolonged exposure to extreme heat during pregnancy is linked to increased risks of low birth weight, preterm birth, and stillbirth in India. The research highlighted that heat stress during the first trimester is most strongly associated with preterm births, while third-trimester stress increases stillbirth risks.", "category": "Science", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132697", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132697"}], "article_id": "4233a84c"}, {"headline": "New closing price method causes 200-point Nifty surge", "summary": "Traders were caught off-guard as the Nifty 50 surged nearly 400 points, with 200 points added during the final 20-minute closing auction. The jump is attributed to SEBI's new Call Auction Session (CAS) methodology, which replaces volume-weighted average pricing. Heavyweight stocks like ICICI Bank and HDFC Bank saw sharp spikes, contributing to a total CAS turnover of ₹11,546 crore.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "33cd1d53"}, {"headline": "Centre to impose MDR on UPI and extend tax breaks", "summary": "The government is amending laws to introduce a Merchant Discount Rate (MDR) on UPI payments to provide a sustainable revenue model for service providers. Additionally, it plans to extend tax exemptions until 2041 for foreign companies supplying machinery to domestic contract manufacturers. The proposals are part of the Taxation and Other Laws (Amendment) Bill to be tabled in Parliament.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "778aed63"}, {"headline": "Private banks lead FCNR (B) deposit mobilisation", "summary": "Private sector banks outpaced public sector counterparts in mobilising Foreign Currency Non-Resident (Bank) deposits. Five top banks, led by ICICI, HDFC, and Standard Chartered, collected over $10.73 billion, accounting for the bulk of inflows. Among PSBs, State Bank of India led with $6.14 billion. The total mobilisation across 42 participating banks reached $60.55 billion by July 30.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "88f3ef64"}, {"headline": "India sees strong demand for premium large-screen TVs", "summary": "Consumer electronics firms like Sony India are witnessing a shift toward premium, large-screen televisions, with 75-inch and 85-inch models growing at 30-40%. Sony targets ₹10,000 crore in revenue from its premium Bravia 9 line. The trend is driven by high-income consumers in tier-2 and tier-3 cities seeking better picture quality and larger cinematic experiences for their homes.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "9a20e181"}, {"headline": "Sundaram Finance consolidated Q1 net profit rises 34%", "summary": "Sundaram Finance reported a 34% increase in consolidated net profit to ₹636 crore for the quarter ended June 30, 2024. Revenue from operations grew to ₹2,644 crore. Total disbursements rose 22% to ₹8,947 crore, driven by strong demand across asset classes. Asset quality improved with Stage 3 assets at 1.35% compared to 2.28% in the previous year, showing healthy credit growth.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "11f5bafb"}, {"headline": "Torrent Power to retire Sabarmati thermal plant by 2030", "summary": "Torrent Power plans to decommission its 362-MW coal-fired Sabarmati thermal power plant in Ahmedabad by December 2030. The company will replace the facility with an 800-MW gas-based or renewable energy unit to comply with environmental regulations and urban development needs. The Sabarmati plant is one of India's oldest, with units dating back to 1934.", "category": "Infrastructure", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "c4a4138f"}, {"headline": "Michelin launches premium car tyre range in India", "summary": "French tyre giant Michelin has launched its Primacy 5 range in India, targeting the premium passenger vehicle segment. Manufactured at its Chennai plant, the tyres cater to 16 to 22-inch rim sizes. Michelin aims to make India a global export hub while focusing on high-performance tyres for the growing SUV and luxury car market in the country.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "794bb1ab"}, {"headline": "IIP data signals industrial resilience despite external shocks", "summary": "India’s Index of Industrial Production (IIP) showed a 23-month high growth of 7.3% in June, indicating economic resilience. Growth was led by manufacturing (4.9%), electricity (12.8%), and capital goods (8.8%). Strong performance in electrical equipment and vehicles suggests that the manufacturing momentum is sustainable despite global volatility and domestic inflation pressures.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "3bde9bcb"}, {"headline": "MV Electrosystems IPO sees massive 188x subscription", "summary": "The mainboard IPO of MV Electrosystems received an overwhelming response, being subscribed 188.85 times on its closing day. The non-institutional investor category led with 374.58 times subscription, while the retail portion was 205.42 times. Separately, Juniper Green Energy's IPO was subscribed 7.97 times. Both companies plan to use the proceeds for debt repayment and general corporate purposes.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "14ebcfee"}, {"headline": "FM moves Bill to allow digital bank records as evidence", "summary": "Finance Minister Nirmala Sitharaman introduced the Bankers' Books Evidence Bill, 2026, in the Lok Sabha. The legislation aims to replace the 125-year-old law to reflect the shift from paper-based to digital and electronic record-keeping. The new Bill provides a legal framework for digital signatures and electronic authentication, simplifying legal proceedings for banks in court.", "category": "Law", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "495bbe20"}, {"headline": "Sun Pharma recalls 11 eye drop products from market", "summary": "Sun Pharmaceutical Industries has voluntarily recalled 11 ophthalmic products from the domestic market as a precautionary measure. While the company stated the products meet safety standards, the recall was initiated to maintain 'abundant precaution.' Health experts have called for more transparency regarding the specific reasons for the withdrawal of common brands like Deprol and Loterid.", "category": "Health", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "f225cecd"}, {"headline": "Kharif sowing deficit narrows as monsoon covers 81% area", "summary": "The deficit in kharif crop sowing has shrunk to less than 3% as of July 31, with 894.22 lakh hectares covered so far. Improved rainfall in late July helped narrow the gap from 5% earlier in the month. While paddy and pulses show slight declines of 2.2% and 6.3% respectively, oilseeds have seen a 0.7% increase. The government targets a record foodgrain production of 170.6 million tonnes.", "category": "Economy", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "e4cff46d"}, {"headline": "Anthropic brings Claude AI to India via Amazon Bedrock", "summary": "AI startup Anthropic has made its Claude model family available in India through Amazon Bedrock. This allows Indian enterprises to process sensitive data on local servers, complying with data residency requirements. The move targets heavily regulated sectors like banking and government agencies. Anthropic's Claude 3.5 Sonnet will support local languages to enhance accessibility in the region.", "category": "Technology", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "c9466bea"}, {"headline": "Prashant Kishor's party wins Bihar bypoll in historic shift", "summary": "Strategist Prashant Kishor’s Jan Suraj Party scripted a major upset by winning the Bankipur Assembly by-election in Bihar, a seat held by the BJP for 30 years. The victory is seen as a potential shift in the state's political landscape ahead of the 2025 Assembly elections. Kishor claimed the win reflects a public desire for a third alternative to the established RJD-NDA alliances.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "4b56cf63"}, {"headline": "NHAI plans ₹1-lakh crore highway expansion in Tamil Nadu", "summary": "The National Highways Authority of India (NHAI) announced an ambitious 2,500-km road development plan for Tamil Nadu with an investment of ₹1 lakh crore. Key projects include the 6-laning of the Chennai-Trichy-Madurai corridor and several new expressway links. The push aims to improve industrial connectivity and port access, supporting the state’s goal of a $1-trillion economy.", "category": "Infrastructure", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "9847e2a4"}, {"headline": "FSSAI warns liquor firms over non-permitted added flavours", "summary": "The Food Safety and Standards Authority of India (FSSAI) has taken action against alcobev manufacturers for using non-permitted flavours in products like whiskey and rum. Labels must accurately reflect if a product is 'flavoured' or a 'premix' rather than misleading consumers. The regulator found that several brands were adding artificial flavours that masked the natural spirit quality.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132728", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132728"}], "article_id": "cfe94ce2"}, {"headline": "India’s data centre boom faces critical power grid infrastructure bottlenecks", "summary": "India's data centre and AI sector faces power grid bottlenecks as capacity is expected to add 26.3GW of load by FY32. Over $250 billion has been committed by firms like Google and Microsoft. Transmission infrastructure struggles to keep pace, with high-voltage substations requiring years to build, shifting the primary development bottleneck from land to power.", "category": "Infrastructure", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "231833bd"}, {"headline": "Mega IPOs in September expected to fuel Indian primary market rebound", "summary": "Bankers expect major IPOs from the National Stock Exchange (NSE) and Jio Platforms in September to unlock a crowded pipeline of companies waiting to go public. These offerings could raise up to ₹37,700 crore, potentially becoming India's largest listings. The recovery is already reflected in July’s fundraising of ₹28,584 crore by 12 companies, marking a sharp revival in activity.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "bbeb20cf"}, {"headline": "Supreme Court rules IBC moratorium protects companies only not promoters", "summary": "The Supreme Court held that Section 14 moratoriums under the IBC apply only to corporate debtors, not to promoters or directors. The ruling allows homebuyers of Bengaluru's Mantri Manyata Energia project to pursue legal action against company officials despite ongoing insolvency proceedings against the firm itself, clarifying accountability limits for non-corporate parties.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "ff5b1289"}, {"headline": "US and Japan coordinate yen boost in echo of Plaza Accord", "summary": "The US acted with Japan to strengthen the yen as it neared a 40-year low. This echoes the 1985 Plaza Accord aimed at coordinated dollar weakening. US President Donald Trump praised the joint action as beneficial for the global economy, though risks remain that if Japan sells US Treasury bonds too quickly to support the yen, it could raise US government financing costs.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "3dfc5cbc"}, {"headline": "West Asia war drives surge in India fertilizer and gold revenue", "summary": "Higher global prices due to the West Asia conflict drove India's fertilizer subsidy spending up 57.6% year-on-year in the April-June quarter. Fuel excise duty collections dropped 22.4% following tax cuts to manage domestic prices, while higher gold tariffs boosted customs duty revenue by 36.1%. The data highlights the significant impact of regional conflict on government finances.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "0b957225"}, {"headline": "RBI faces dilemma over repo rate hike amid rising inflation risks", "summary": "The Reserve Bank of India's Monetary Policy Committee faces a choice between holding the 5.25% repo rate or raising it to counter inflationary pressures from the West Asia war and El Niño. While inflation surpassed the 4% target in June 2026, market indicators like Overnight Interest Swap rates suggest expectations for at least two rate hikes in the current financial year.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "ed047384"}, {"headline": "FPIs return as net buyers for first time since Iran war", "summary": "Foreign portfolio investors (FPIs) turned net buyers in India's secondary cash market in July, injecting ₹6,731.97 crore. This marks the first month of net buying since the West Asia conflict began in February. Combined with domestic institutional purchases and short-covering in futures, the inflows helped the Nifty rise 2.17% in July as geopolitical tensions slightly moderated.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "563c097f"}, {"headline": "ITC cigarette business hit by tax hikes but FMCG segment grows", "summary": "ITC Ltd's cigarette business faced pressure in Q1FY27 as net operating revenue fell 14.4% year-on-year, reflecting the impact of sharp tax increases. However, the FMCG segment grew 12% and the paperboards business saw a 38% jump in Ebit. Analysts expect cigarette profitability to improve in coming quarters as staggered price hikes help offset the tax burden.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "dfad7695"}, {"headline": "Visa layoffs in India hit tech teams as AI drives efficiency", "summary": "Visa Inc. laid off approximately 7% of its workforce, around 2,600 roles, with a significant impact on its technology hubs in India. The cuts, announced by CEO Ryan McInerney, are aimed at driving efficiency as the company transitions toward agentic AI. Employees in Bengaluru and Mumbai were informed via pre-dawn emails, with entire teams in engineering and product being hollowed out.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "48fd36e8"}, {"headline": "Mandatory V2V communication in new Indian cars proposed from Oct 2027", "summary": "The ministry of road transport and highways has proposed making vehicle-to-vehicle (V2V) communication systems mandatory in all new vehicles starting October 2027. The phased rollout aims to improve road safety by allowing cars to exchange real-time data on speed and location. The technology utilizes the 5.9 GHz band to alert drivers of hazards beyond their line of sight.", "category": "Technology", "page": 6, "importance": 7, "telegram_url":
