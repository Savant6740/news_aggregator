": "Health ministry urges vigilance against seasonal diseases", "summary": "The Union Health Ministry has issued a directive urging public vigilance against seasonal diseases, especially with changing weather patterns. Health advisories have been released to promote preventive measures and early detection.", "category": "Health", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138683", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 28-09-2026_260928065308.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/138683"}], "article_id": "cc416226"}, {"headline": "Congress slams Election Commission over electoral roll revision measures", "summary": "Congress leader Jairam Ramesh criticized the Election Commission's proposed measures to address the Special Intensive Revision (SIR) of electoral rolls as desperate damage control. He alleged the SIR caused mass disenfranchisement of marginalized voters to benefit the BJP. The Congress called for the suspension of the SIR, while 2,000 citizens petitioned the CJI for suo motu proceedings.", "category": "Politics", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "9584e082"}, {"headline": "Bengaluru parking policy review follows over 800 citizen objections", "summary": "The Karnataka government referred the Greater Bengaluru Authority's draft Parking Rules to a legal research firm for review after receiving over 800 objections. Key concerns include annual parking permit charges ranging from ₹15,000 to ₹25,000 and the impact on middle-class residents. Forest Minister Ramalinga Reddy has also called for a comprehensive review of the policy.", "category": "Infrastructure", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "ee7a0cff"}, {"headline": "Odisha woman survives 12 hours in crocodile-infested river", "summary": "Keshi Dalai, a 75-year-old woman from Jajpur, survived 12 hours in the swollen Brahmani river after being swept away by floodwaters. Despite the presence of crocodiles, she clung to life for 25 kilometers before being rescued by youth in Kendrapara district. She was treated for dehydration at a hospital and has since been reunited with her family.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "6616b2f4"}, {"headline": "KEA considers triple-layered OMR sheets to prevent exam malpractices", "summary": "The Karnataka Examinations Authority (KEA) is considering the introduction of three-layered OMR sheets for recruitment exams. Under the proposal, one copy would be kept at the Deputy Commissioner's office to allow verification if tampering is alleged. This move follows ongoing investigations into recruitment irregularities at the Karnataka Public Service Commission (KPSC).", "category": "Education", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "9e4b2afa"}, {"headline": "Karnataka opposition parties decline joining all-party delegation for drought relief", "summary": "The BJP and JD(S) in Karnataka refused to join an all-party delegation led by Chief Minister D.K. Shivakumar to meet Prime Minister Narendra Modi for drought relief assistance. Union Minister H.D. Kumaraswamy and R. Ashok labeled the delegation a waste of resources. Meanwhile, a Central team is scheduled to visit Karnataka from October 4 to assess crop damage.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "530fe189"}, {"headline": "Karnataka Cabinet expansion and women representation to be discussed in Delhi", "summary": "Karnataka Deputy Chief Minister D.K. Shivakumar stated that discussions regarding two remaining Cabinet vacancies and the inclusion of a woman legislator would occur during his visit to Delhi. He is attending a Congress Working Committee meeting to discuss the Election Commission's Special Intensive Revision and chairperson appointments for various boards and corporations.", "category": "Politics", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "8bfdfe3d"}, {"headline": "FIR registered against protesters for blocking road at Bidadi", "summary": "Bidadi police registered an FIR against a group of protesters for staging an unauthorized demonstration against the Bidadi Township project. The protesters blocked State Highway 265 for five days, disrupting traffic and movement of goods. Chief Minister D.K. Shivakumar stated the government is not pressuring land owners, while H.D. Kumaraswamy questioned the police intervention.", "category": "Infrastructure", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "c517a7ef"}, {"headline": "ED custody of IAS officer Gyanendra Kumar Gangwar extended", "summary": "A Bengaluru court extended the Enforcement Directorate’s custody of IAS officer Gyanendra Kumar Gangwar by eight days. Gangwar is under investigation for alleged money laundering and irregularities in KPSC recruitment exams. The ED suspects he received ₹1.3 crore in cash from an associate to leak question papers for the Veterinary Officers’ Recruitment Examination.", "category": "Law", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "a902a4d9"}, {"headline": "Kumaraswamy to visit villages affected by NICE Road project", "summary": "Union Minister H.D. Kumaraswamy announced a visit to villages along the Nandi Infrastructure Corridor Enterprises (NICE) Road from October 2 to meet families affected by the project. He accused the Karnataka government of protecting the project promoter despite judicial observations. Kumaraswamy plans to make a presentation on past irregularities regarding illegal toll collection.", "category": "Infrastructure", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "eaa94f84"}, {"headline": "Karnataka government considers building large convention center in Bengaluru", "summary": "Chief Minister D.K. Shivakumar announced that the state is considering constructing a \"Karnataka Mantapa,\" modeled after Delhi's Bharat Mandapam. Potential locations include Jakkur, Mysore Lamps, or NGEF. The announcement was made during the first-ever Karnataka Tourism Awards ceremony held on World Tourism Day to recognize contributions to the state's tourism sector.", "category": "Infrastructure", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "23fff1fa"}, {"headline": "Karnataka Health Minister seeks action against inflated high-cost drug prices", "summary": "Karnataka Health Minister U.T. Khader has written to the Union Health Ministry seeking national action against massive price gaps in specialty drugs for cancer and kidney ailments. He pointed out that hospitals and stockists sell these medicines at up to 70 times their procurement cost. Khader proposed capping margins on high-value medicines and medical devices.", "category": "Health", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "61f6e0cf"}, {"headline": "Four lion cubs die shortly after birth at Shivamogga Zoo", "summary": "Four lion cubs born to a three-year-old lioness named Sara died within a day of birth at Shivamogga Zoo. Zoo officials stated the lioness failed to nurse the cubs, leading to severe dehydration. This was the lioness's first pregnancy, and staff were reportedly not anticipating the delivery. The deaths represent a setback for the zoo’s lion breeding program.", "category": "Environment", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "1e66c43f"}, {"headline": "Severe drought damages 84,656 hectares of coconut plantations in Karnataka", "summary": "Karnataka’s Horticulture Department reported that 84,656 hectares of coconut plantations have been damaged due to severe drought. Officials warn the impact could persist for three years as the dry spell disrupts flowering and fruiting cycles. Hassan district is the worst affected. Experts noted that drought has also worsened pest infestations like the black-headed caterpillar.", "category": "Environment", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "cba14163"}, {"headline": "St. Joseph’s University holds third annual convocation for 2,300 graduates", "summary": "St. Joseph’s University in Bengaluru awarded degrees to 2,300 graduates during its third annual convocation. Home Minister Priyank Kharge urged students to learn from failures and stay curious. Fairfax Financial CEO Prem Watsa announced $5 million in support for the university and highlighted India's rapid economic growth as a source of opportunity for graduates.", "category": "Education", "page": 5, "importance": 2, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "c674a1c1"}, {"headline": "R. Ashok challenges Congress to seek fresh mandates in ruled states", "summary": "Leader of Opposition R. Ashok accused the Congress of attacking the Election Commission because it fears losing upcoming Parliamentary polls. He challenged the party to cancel elections in states where they won, like Karnataka, and face fresh polls. Ashok defended the current election process and criticized Congress for opposing reforms in the KPSC recruitment process.", "category": "Politics", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "998ffb49"}, {"headline": "Uttaradi Mutt seer out of danger after road accident in Hubballi", "summary": "Satyatma Teertha Swami, the seer of Uttaradi Mutt, was discharged from a Hubballi hospital after surviving a road accident on NH-48. The seer and two others sustained minor injuries when their SUV met with an accident. In a video message, the seer reassured devotees of his safety. Hospital tests confirmed his condition was normal following the incident.", "category": "India", "page": 6, "importance": 2, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "ec25ab85"}, {"headline": "Eshwar Khandre highlights irony of Lingayat community seeking social justice", "summary": "Minister Eshwar Khandre remarked on the irony of the Veerashaiva-Lingayat community having to seek justice despite historically working for social equality. Speaking at a dharma convention, he announced that the ₹750-crore Anubhava Mantapa in Basavakalyan will be completed by late 2027. The event was attended by Chief Minister D.K. Shivakumar and various community seers.", "category": "Politics", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "26bd0c8c"}, {"headline": "Kerala Minister defends decision against filing FIR in CMRL pay-off case", "summary": "Kerala Home Minister Ramesh Chennithala stated that an FIR cannot be filed against Pinarayi Vijayan and his family based solely on the Enforcement Directorate's proposal in the CMRL-Exalogic pay-off case. The government has ordered a preliminary inquiry instead. The ED alleges fraudulent payments of ₹2.78 crore were made to T. Veena’s company, Exalogic Solutions.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "edda8165"}, {"headline": "Foreign Secretary Misri discusses U.S. Russia sanctions with Congressional delegation", "summary": "Foreign Secretary Vikram Misri met a U.S. Congressional delegation to discuss the Sanctions against Russia and Iran Act (SRIA). The legislation mandates sanctions on countries buying Russian oil. The delegation, led by Brian Mast, also discussed energy security and counter-terrorism. Representative Shri Thanedar, who opposed the bill, was part of the group.", "category": "World", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "d3f4592a"}, {"headline": "BJP Minister Parvesh Sahib Singh allegedly slaps AAP MLA's aide", "summary": "A video surfaced showing BJP Minister Parvesh Sahib Singh allegedly slapping an aide of AAP MLA Jarnail Singh during an inspection of a new road in Delhi. The AAP has called for the Minister's arrest, while Singh claimed he reacted to abuse directed at his family. The incident occurred as AAP members questioned the quality of work on the Outer Ring Road.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "58c9ebb2"}, {"headline": "Powerful thunderstorms and floods kill 56 people in Uttar Pradesh", "summary": "At least 56 people have died in Uttar Pradesh over three days due to rain-related incidents and thunderstorms. The state received 45.1 mm of rainfall in 24 hours, far exceeding the normal 1.8 mm. Eight districts face flood-like conditions as the Ghagra and Rapti rivers rise. Over 1,000 houses have been damaged, and residents are being moved to relief centers.", "category": "Environment", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "d1109825"}, {"headline": "Tribal students begin 180-km march to Mumbai for better school facilities", "summary": "Hundreds of tribal students in Maharashtra launched a long march from Nashik to Mumbai to demand better safety and facilities in government-run residential schools. Their demands include the resignation of the Tribal Development Minister and an independent inquiry into student deaths. The protest follows a 40-day sit-in at Nashik’s Idgah Maidan.", "category": "Education", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "4d23c815"}, {"headline": "IIT-Bombay alumni demand reforms following student suicide on campus", "summary": "A group of IIT-Bombay alumni has written to the institute's Director calling for comprehensive reforms after the suicide of student Sahil Wakode. They alleged the incident reflects a militarised campus and caste-based inequities. Demands include an impartial investigation into harassment allegations, faculty sensitization, and a survey of student mental health.", "category": "Education", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "31082d68"}, {"headline": "Opposition leaders discuss Election Commission row and central agency misuse", "summary": "CPI(M) leader M.A. Baby met AAP national convener Arvind Kejriwal to discuss the functioning of the Election Commission and the alleged misuse of the Enforcement Directorate. The leaders sought coordinated action within the INDIA bloc to expose authoritarian practices by the Chief Election Commissioner. A joint meeting is scheduled for September 30.", "category": "Politics", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "942b880d"}, {"headline": "Congress plans Delhi meeting to protest Haldwani ‘purification ritual’", "summary": "The Congress SC/ST Parliamentarians Forum will hold a Dalit-Adivasi Self-Respect Meeting in Delhi on September 29. The protest follows a purification ritual conducted by BJP supporters in Haldwani after a rally by Mallikarjun Kharge. Congress leaders criticized the Uttarakhand government for failing to condemn the incident, labeling it an insult to Dalits and tribals.", "category": "Politics", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "42bc0b48"}, {"headline": "Houthi rebels claim Saudi air strikes killed 50 in Taiz", "summary": "Houthi military officials accused Saudi Arabia of launching air raids on a market near Taiz, Yemen, resulting in nearly 50 casualties. The escalation follows the breakdown of a truce and intensified Houthi blockades on Saudi energy exports. In response to the strikes, schools in Riyadh shifted to remote learning for a week due to potential security threats.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "07b26af5"}, {"headline": "Israeli Finance Minister Smotrich calls for annexation and West Bank war", "summary": "Israeli Finance Minister Bezalel Smotrich urged for the annexation of parts of southern Lebanon and the Gaza Strip. He also called for Israeli forces to go to war to dismantle the Palestinian Authority in the West Bank. Meanwhile, Gaza's Health Ministry reported the Palestinian death toll has reached 74,016 since the start of the nearly three-year conflict.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "c71eed2c"}, {"headline": "Russian strikes kill eight in Ukraine targeting data centers and ports", "summary": "Russian drone and missile strikes killed eight people across Ukraine, including a teenager in Sumy and a man in Kyiv. Moscow claimed its forces successfully targeted drone storage sites in Mykolaiv, a naval base at Kiliya port, and data centers belonging to Kyivstar and Omega Telecom. Ukraine reported that a cargo ship carrying military goods was struck in Odesa.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "deed3244"}, {"headline": "Taliban forces kill 28 IS fighters allegedly crossing from Pakistan", "summary": "The Taliban government in Afghanistan claimed its forces killed 28 Islamic State-affiliated fighters and captured 32 others in Nuristan. The Taliban alleged the fighters were sent from Pakistan to carry out subversion. Pakistan's government rejected the claims as baseless. The incident follows a surge in cross-border tensions and Pakistani military operations.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "35d3bda5"}, {"headline": "Massive manhunt in South Africa after mass shootings kill 27", "summary": "South African police launched a search for gunmen involved in two separate mass shootings that left 27 people dead in Johannesburg and Cape Town. President Cyril Ramaphosa stated that security forces are working to end the surge in criminal violence. These incidents follow another mass shooting near Durban just five days prior that claimed 11 lives.", "category": "World", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "1b69d335"}, {"headline": "Ishan Om’s five-wicket haul puts India U-19 in control against Australia", "summary": "India U-19 bowler Ishan Om took five wickets for 53 runs to bowl out Australia U-19 for 217 on the opening day of the Youth Test in Rajkot. Despite a resilient century from Australia's Blake Cattle (102), Mohit Ulva’s three wickets helped India dismantle the lower order. India ended the day at 8 for no loss, trailing by 209 runs.", "category": "Sports", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "1d47d2bd"}, {"headline": "Tom Banton’s maiden century leads England to ODI series win", "summary": "Tom Banton scored 126 runs to guide England to a 223-run victory over Sri Lanka in the third One-Day International, clinching the series. England posted 355 for seven before dismissing Sri Lanka for just 132 runs. Liam Dawson took 3 for 26 to lead the bowling attack. Banton’s dominant performance earned him the Player of the Match award.", "category": "Sports", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "e3049391"}, {"headline": "Centuries from Bavuma and Miller lead South Africa to series victory", "summary": "Temba Bavuma (103) and David Miller (142) both struck centuries as South Africa defeated Australia by 32 runs to win the three-match ODI series. South Africa amassed 365 for nine before bowling out Australia for 333. Despite 84 runs each from Mitchell Marsh and Travis Head, the visitors fell short, continuing South Africa's dominance in recent ODI meetings.", "category": "Sports", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "40481aab"}, {"headline": "Spain defeats England 3-2 in Nations League encounter", "summary": "Mikel Oyarzabal scored a late winner as Spain beat England 3-2 in a Nations League match. Despite goals from Anthony Gordon and Harry Kane, England suffered from defensive errors and a missed penalty by Kane. In another match, Luka Modric led Croatia to a 2-1 victory over Czechia. Switzerland also recorded a 3-0 win against North Macedonia.", "category": "Sports", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "63d472cf"}, {"headline": "India wins multiple athletics medals at the Aichi-Nagoya Asian Games", "summary": "Ancy Sojan clinched silver in the women’s long jump, missing gold by just 2cm, while Sarvesh Kushare also won silver in high jump. Tejaswin Shankar secured a bronze in the decathlon with 7,934 points. Parul Chaudhary and Harita Bhadra also added bronze medals to India's tally. Conditions remained challenging due to constant rain and cold at the Nagoya stadium.", "category": "Sports", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "6c09009a"}, {"headline": "Indian men's cricket team prepares for Asian Games quarterfinal against Afghanistan", "summary": "India captain Shreyas Iyer emphasized the need to adapt to the challenging hybrid pitch and rainy conditions in Nagoya ahead of their Asian Games quarterfinal against Afghanistan. The team held its only training session on Sunday amid persistent downpours. Afghanistan enters the match with two prior games' experience, while India is the favorite to retain gold.", "category": "Sports", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "0dea7689"}, {"headline": "Organizational failures reported at 13th edition of Bengaluru Marathon", "summary": "The Wipro Bengaluru Marathon, featuring 45,000 runners, was marred by complaints of inadequate water supply and route congestion. Participants reported empty water stations and clashes between different race categories. Organizer Nagaraj Adiga apologized for the lapses, citing issues with reusable cup distribution, and promised improvements for future editions.", "category": "Sports", "page": 14, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "a553f934"}, {"headline": "Ishaan Madesh records first win of the season at MRF Racing", "summary": "Bengaluru racer Ishaan Madesh registered his first victory of the season in the MRF Formula 2000 class during the second round of the National Racing Challenge in Chennai. He finished second and third in earlier races before topping the final race. Meanwhile, in the MRF Formula 1600 class, Bhuvan Bonu dominated by winning two out of three races.", "category": "Sports", "page": 14, "importance": 3, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "3349777a"}, {"headline": "Kabaddi star Aslam Inamdar celebrates second Asian Games gold medal", "summary": "Indian kabaddi player Aslam Inamdar secured his second Asian Games gold after India defeated Iran in a close final. Inamdar, who grew up in poverty and worked various manual jobs to support his training, has become a leading raider and captain in the Pro Kabaddi League. He now uses his platform to inspire underprivileged young athletes to pursue professional sports.", "category": "Sports", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "5bfee959"}, {"headline": "Australia and Türkiye prepare for COP31 amid fossil fuel dependency concerns", "summary": "Australia and Türkiye will co-host the COP31 climate summit, facing pressure to include language on transitioning away from fossil fuels. Both countries currently rely on fossil fuels for over 80% of their domestic energy needs. The summit’s priority themes include electrification of industry and protecting marine resources, though direct phase-out plans remain unclear.", "category": "Environment", "page": 19, "importance": 8, "telegram_url": "https://t.me/c/1877410077/138699", "sources": [{"newspaper": "The Hindu", "pdf_filename": "THE HINDU HD Bangalore Editable Full Edition 28~09~2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/138699"}], "article_id": "6b5269b4"}, {"headline": "UN General Assembly approves consensus declaration on sea level rise", "summary": "The UN General Assembly approved a declaration ensuring that low-lying island nations threatened by rising seas will retain their statehood and maritime rights under international y April after a reverse flip from Singapore to India. The company is setting up a 1.2 GW solar cell manufacturing facility in Madhya Pradesh, aiming for 2.3 GW total cell capacity.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "b7c665b3"}, {"headline": "Vedanta seeks Odisha push to revive aluminium ops", "summary": "Vedanta Group urged the Odisha government to expedite its expansion plans, including a 3 mtpa smelter and 6 mtpa alumina refinery. However, tribal communities in Niyamgiri reiterated their opposition to bauxite mining.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "18716c8d"}, {"headline": "Fortis confident of clean chit from forensic audit", "summary": "Fortis Healthcare is confident that an independent forensic audit will clear it of any role in share transfers by its erstwhile promoters. The Supreme Court allowed the audit but clarified that the High Court's observations were tentative.", "category": "Business", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/138721", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 28-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/138721"}], "article_id": "0ec95181"}, {"headline": "HDFC Bank MD & CEO succession task", "summary": "HDFC Bank faces a challenging succession with priorities including restoring investor confidence, reigniting growth, improving Casa deposits, and enhancing its tech architecture. The new CEO will inherit a solid balance sheet but needs to address margin and operational
