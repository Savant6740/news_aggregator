"https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "876d3800"}, {"headline": "IMD warns of flash floods in North-East as rains intensify", "summary": "The India Meteorological Department (IMD) has issued warnings for flash floods in parts of Arunachal Pradesh, Assam, and Meghalaya due to intensifying monsoon rains. Extremely heavy rainfall is forecast across several states over the next seven days. The low-to-moderate risk warning follows reports of widespread heavy rain expected to impact the region's infrastructure and safety.", "category": "Environment", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "f68fd63a"}, {"headline": "Parliamentary committee backs overhaul of Indian corporate law framework", "summary": "A joint committee of parliament has supported the Corporate Laws (Amendment) Bill, 2026, proposing a major overhaul of India's corporate legal framework. Key proposals include the decriminalization of procedural lapses, compliance relief for small businesses, and relaxed corporate social responsibility (CSR) norms. The move aims to improve the ease of doing business in India.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "85f5c74e"}, {"headline": "Rajya Sabha clears bill to speed up MSME payment dispute settlements", "summary": "The Rajya Sabha passed a bill to tackle payment delays for MSMEs by prescribing faster adjudication timelines. The Micro Small and Medium Enterprises Development (Amendment) Bill, 2026 allows courts to order a payment of at least 50% of the awarded amount to suppliers if an application to set aside an order is pending for over six months, addressing liquidity issues for small firms.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "878f5779"}, {"headline": "Lok Sabha passes bill to increase Supreme Court judge count", "summary": "The Lok Sabha passed a bill to increase the number of Supreme Court judges from 34 to 38. The legislation replaces an earlier ordinance and was passed without debate amid opposition protests over other issues. The increase in judicial strength is intended to help the apex court manage its growing caseload and reduce the pendency of legal matters.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "bbc7cf2f"}, {"headline": "United Spirits moves Bombay High Court against FSSAI sales restriction", "summary": "United Spirits Ltd has challenged a FSSAI order in the Bombay High Court that restricts the sale of one of its rum products. The regulator alleged that the product's labels violated food safety acts regarding flavouring and age-related claims. The company argues its labels comply with industry practices and legal norms, and that the order has no material financial impact.", "category": "Law", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "dd4ef340"}, {"headline": "Centre searches for new DCGI chief amid widened eligibility controversy", "summary": "The health ministry has invited applications for a new Drugs Controller General of India (DCGI) to succeed Rajeev Singh Raghuvanshi. New rules widen eligibility to include non-pharmacy engineering disciplines, sparking opposition from regulatory officers. Critics argue that candidates without pharmaceutical backgrounds lack the academic foundation to handle complex drug safety issues.", "category": "Health", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "2820b1fc"}, {"headline": "Family offices provide long-term capital for Indian deeptech startups", "summary": "Single family office investments into Indian deeptech startups surged to $467.1 million in 2025 from $15.3 million in 2020. Unlike venture capital funds with fixed cycles, family offices offer patient capital over 15-20 years, essential for commercializing complex tech in space, semiconductors, and AI. This shift is helping bridge the funding gap for capital-intensive innovation.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "49005bcd"}, {"headline": "Peak XV-backed Neo Group appoints Vikas Khattar for investment banking", "summary": "Wealth management platform Neo Group has hired veteran banker Vikas Khattar from Ambit Capital to lead its new investment banking business. The firm has applied for a merchant banking licence with Sebi as it expands into advisory services and capital markets. Valued at ₹10,000 crore, Neo managed approximately ₹1.3 trillion in client assets as of June 2026.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "555e227c"}, {"headline": "Airtel network spending to remain high at $3-4 billion annually", "summary": "Bharti Airtel chairman Sunil Bharti Mittal expects the company to maintain annual capital expenditure of $3-4 billion despite completing its bulk 5G rollout. Mittal cited the rapid pace of technology shifts and network expansion needs for the continued high spend. Telcos currently face challenges in monetizing heavy 5G investments due to limited consumer use cases.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "483e83c2"}, {"headline": "Swiggy and Zomato adopt divergent strategies for food delivery growth", "summary": "Swiggy is launching 'Toing,' a standalone app for affordable meals leveraging its existing logistics network, while Zomato's Eternal is investing in 'Bistro by Blinkit' to redesign supply chains for low-cost production. Both companies are shifting focus toward acquiring new, price-sensitive users rather than increasing frequency among current customers to drive the next growth phase.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "03e91ebc"}, {"headline": "Online dispute resolution platforms urge Sebi against proposed framework overhaul", "summary": "Executives from online dispute resolution (ODR) platforms are petitioning Sebi to refine the existing framework rather than dismantle independent entities. A proposed overhaul could eliminate private ODR roles, stranding investments in specialized tech and teams. Platforms also highlighted an unviable fee structure where conciliation costs often exceed the regulated reimbursement rates.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "15159cc5"}, {"headline": "Indian government to sell 6.5% stake in LIC for ₹31,000 crore", "summary": "The government is selling a 6.5% stake in Life Insurance Corp. (LIC) at a floor price of ₹382 per share through a two-day offer for sale. The move aims to help LIC meet minimum public shareholding requirements and could fetch about ₹31,000 crore for the disinvestment kitty. The floor price represents a 10% discount to the stock's Monday closing price of ₹424.35.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "003ce311"}, {"headline": "Nexus Select Trust plans eight retail acquisitions across Indian cities", "summary": "Nexus Select Trust is targeting eight retail property acquisitions, including a 500,000 sq. ft shopping centre in Guwahati, as it enters eastern India. The Reit reported an 11% increase in net operating income to ₹510 crore for the June quarter. Backed by a strong balance sheet and $1 billion in debt headroom, the firm aims to continue scaling its platform through inorganic growth.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "f65cd755"}, {"headline": "New capital pools emerge to support India's net-zero transition", "summary": "Sovereign wealth and pension funds are increasingly investing in India's sustainable infrastructure, shifting focus from power generation to transmission and storage. Projects are becoming more bankable as they mature and de-risk, attracting long-term capital. While 96% of debt for India's transition remains domestic, foreign institutional interest is growing in dedicated climate platforms.", "category": "Environment", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "cd8c2fd4"}, {"headline": "Aadhar Housing Finance rules out fresh capital raise for four years", "summary": "Aadhar Housing Finance, backed by Blackstone, is sufficiently capitalized with a 40% capital adequacy ratio and does not expect to raise funds for at least four years. The company plans to grow its loan book by 20% annually and add 50 branches in FY27. Expansion is focused on emerging locations in district centres to maintain higher risk-adjusted spreads.", "category": "Business", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "d3baec0b"}, {"headline": "Wipro revenue hit as Meta shutters digital marketing outsourcing unit", "summary": "Wipro is expected to lose approximately $25 million in annual revenue after Meta Platforms Inc. closed its digital marketing arm as part of an AI-led overhaul. This marks Wipro's second major client loss in six months. Meta previously generated $100 million for the firm. Other tech giants including Accenture and Concentrix also faced pullbacks as Meta reduced its outsourcing footprint.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "ba98ad9e"}, {"headline": "Reliance’s JioStar shifts content focus to resonate with diverse audiences", "summary": "JioStar, the media arm of Reliance Industries, is moving toward a selective content strategy focused on 'many Indias' rather than just major metros. The firm is blurring lines between linear TV and streaming, with a strong emphasis on regional language programming and profitability. High-profile shows like 'Bigg Boss' are slated for launch across both digital and television platforms.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "987cd471"}, {"headline": "DLF sales bookings crash 94% in Q1 amid project delays", "summary": "DLF Ltd's new sales bookings fell to ₹657 crore in the June quarter, a 94.3% drop from the previous year, as the developer skipped new project launches. Revenue from operations also fell 52.8% to ₹1,280 crore. Despite the slowdown, the company maintained its ₹20,000 crore annual sales target for FY27, banking on a strong pipeline of upcoming luxury project approvals.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "e6fa17a6"}, {"headline": "Elevation Capital to offload shares in Paytm and Meesho via block deals", "summary": "Elevation Capital plans to sell shares worth up to ₹2,002 crore in Paytm parent One 97 Communications and shares worth ₹1,912 crore in Meesho. The Paytm stake sale involves approximately 2.3% of the company's equity at a 5% discount to Monday's close. Peak XV Partners will also participate in the Meesho exit, following the e-commerce firm's recently reported quarterly losses.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "e8df7973"}, {"headline": "Della Group targets 3,600 hotel keys through new township partnerships", "summary": "Della Group plans to expand from a single resort to a 3,600-key hotel pipeline across 12 township projects in cities like Pune and Ahmedabad. The strategy uses destination attractions like adventure sports to drive year-round occupancy and boost real estate values. The hospitality arm reported ₹200 crore in revenue for FY25 and follows a model of partnering with developers rather than land acquisition.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "bb0bd592"}, {"headline": "Finance ministry proposes legal amendments to allow MDR on UPI", "summary": "The Union finance ministry has proposed changes to the Payment and Settlement Systems Act that could pave the way for a merchant discount rate (MDR) on UPI transactions. The bill gives the government flexibility to levy charges on specific digital payment modes to create a sustainable funding model. MDR was banned in 2020 to promote digital payment adoption in India.", "category": "Economy", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "0032798f"}, {"headline": "ONGC to reserve half of new Mangaluru storage for strategic oil", "summary": "Oil and Natural Gas Corp. (ONGC) will reserve half of its planned 1.75 million metric tonne Mangaluru storage facility for India's strategic petroleum needs. India currently has the capacity to meet 74 days of net crude import needs. The facility is part of a broader effort to expand reserves through private participation and ensure energy security amid global supply disruptions.", "category": "Infrastructure", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "0aa593fd"}, {"headline": "Encube Ethicals and LEAP India file for IPOs worth nearly $1 billion", "summary": "Encube Ethicals and KKR-backed LEAP India have filed for initial public offerings. Specialty pharma firm Encube plans a ₹3,000 crore offer for sale, while supply chain company LEAP seeks a ₹7,000 crore valuation for its $260 million IPO opening on 7 August. The filings come amid a surge in primary market activity as companies capitalize on stable domestic macroeconomic conditions.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "b7d98854"}, {"headline": "Derivatives trading on NSE sinks to 17-month low following RBI curbs", "summary": "Average daily notional turnover for futures and options on the NSE declined 23% to ₹214 trillion in July, the lowest since early 2025. The slump follows tighter RBI funding rules requiring bank guarantees for trading firms to be fully backed by collateral. While the measures reduce systemic risk, they have limited the capacity of firms to execute large-scale derivatives deals.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "704dffa6"}, {"headline": "Why most Indian AI pilots fail to reach enterprise-wide scale", "summary": "While 47% of Indian enterprises have multiple AI use cases, only 15% have successfully scaled AI across their organizations. Many projects fail due to messy legacy data, lack of process redesign, and the 'sandbox trap' where pilots work in controlled but unrealistic environments. Experts argue that scaling AI is primarily a change management challenge rather than a technical one.", "category": "Technology", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "4822be90"}, {"headline": "Passive funds go niche as investors bet on sectoral and thematic indices", "summary": "Asset managers are increasingly launching low-cost sectoral and thematic index funds tracking areas like defence, healthcare, and capital markets. In early 2026, healthcare and pharma indices outperformed the Nifty 50 significantly. While these funds eliminate manager risk, they carry high concentration risks and timing challenges, making them more suitable for tactical allocations.", "category": "Business", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "381e476f"}, {"headline": "Govt moots tax relief for offshore funds using Indian managers", "summary": "India has proposed tax amendments to shield offshore investment funds from local tax liabilities when routing capital through India-based fund managers. The bill seeks to remove minimum size and diversification requirements under safe harbour rules, aiming to promote domestic fund management activity and provide tax certainty as the country faces foreign capital outflows.", "category": "Economy", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "0d805179"}, {"headline": "Gift City luring foreign F&O traders with attractive tax benefits", "summary": "The Gujarat International Finance Tec-City (Gift City) is emerging as a tax-efficient alternative to Mauritius for foreign derivative traders. Category III AIFs in the IFSC benefit from statutory exemptions on futures and options trading profits. By March 2026, cumulative commitments to Gift City funds crossed $39 billion as India’s benchmark Nifty derivatives moved home from Singapore.", "category": "Business", "page": 18, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "544cbbca"}, {"headline": "The $2 trillion climate finance figure is a misleading illusion", "summary": "While reports claim global climate finance surpassed $2 trillion in 2024, critics argue the figure is misleading for developing nations. Most of the capital is domestic funding within EMDEs, while direct flows from advanced economies to developing countries totaled only $58.7 billion. The discrepancy highlights the massive gap in international grant-based funding required for adaptation.", "category": "Environment", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "b2c73f99"}, {"headline": "Jordan alliance with U.S. comes at high security cost in Iran war", "summary": "Jordan is increasingly caught in the crosshairs of the Iran war due to its deep military alliance with the United States. While receiving $2 billion in annual aid, the kingdom has faced frequent missile attacks and internal public opposition. King Abdullah II faces a delicate balancing act as the conflict threatens national security and fuels anti-U.S. sentiment among its population.", "category": "Politics", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "962ac321"}, {"headline": "Trump employs high-stakes pressure and retreat strategy in Iran war", "summary": "US President Donald Trump is using a strategy of bellicose threats followed by tactical retreats to create movement in negotiations with Tehran. Despite warnings of 'obliterating' Iranian power plants, Trump has repeatedly paused military strikes to allow for diplomacy. Iran is betting it can outlast these pressures as Trump faces political constraints ahead of US midterm elections.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "ad648309"}, {"headline": "Amazon surpasses $3 trillion market value following cloud revenue surge", "summary": "Amazon.com Inc. has reached a $3 trillion market capitalization, joining Apple, Microsoft, Nvidia, and Alphabet in the exclusive club. The milestone followed a 15% share price jump after second-quarter earnings showed accelerating growth in its cloud-computing division. The stock has gained significantly this year as investors reward companies showing tangible returns on AI investments.", "category": "Business", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "a6db2d04"}, {"headline": "Health risks rise as India's appetite for raw fish dishes grows", "summary": "Gastroenterologists warn of rising food poisoning cases linked to raw fish dishes like sushi and ceviche in India. High humidity and monsoon rains make maintaining the required cold chain (-20°C to -50°C) difficult. Consumers are advised to pick restaurants with high turnover and visible hygiene standards, as improper storage can lead to severe bacterial infections and intestinal ulcers.", "category": "Health", "page": 20, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "51bcca9e"}, {"headline": "Science of muscle memory helps the brain retain exercise patterns", "summary": "Muscle memory is primarily a function of the brain and nervous system storing movement patterns, making it easier to return to fitness after a break. Exercise increases the number of myonuclei in muscle fibers, which remain even during inactivity. This 'neural memory' allows the body to relearn physical tasks much faster the second time, providing a blueprint for motor movement.", "category": "Science", "page": 20, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132715", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132715"}], "article_id": "7a12b8df"}, {"headline": "Reconfigured Tax Laws to Help Activate Global and Local Investments", "summary": "The government is set to introduce the Taxation and Other Laws (Amendment) Bill, 2026, extending tax incentives for electronics manufacturing until 2040-41. The bill simplifies tax rules for digital infrastructure, relaxes conditions for foreign fund managers, and enhances the attractiveness of REITs and InvITs by exempting dividend income from tax at the SPV level.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "e73374af"}, {"headline": "Promoter Stakes in NSE Companies Hit 14-Year High in June Quarter", "summary": "Indian promoters increased their ownership in NSE-listed companies to 41.36% in the June quarter, the highest level since 2022. Promoters purchased shares worth ₹36,336 crore as foreign institutional investors (FIIs) reduced their holdings to 17.0%. Domestic institutional and retail investor ownership also reached record highs, signaling long-term confidence in the Indian market.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "bb2c8987"}, {"headline": "Bank Lending to Tech Infrastructure Sector Doubles in Two Years", "summary": "Loans to India’s technology infrastructure sector reached ₹53,859 crore by June 2024, nearly doubling from ₹26,667 crore in 2022. This growth is driven by massive investments in data centers, cloud services, and AI-led upgrades. Tech infra now accounts for approximately 0.87% of the total ₹61.53 lakh crore in service sector bank credit.", "category": "Infrastructure", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "3e26714f"}, {"headline": "PepsiCo Drops Energy Tag from Sting Following FSSAI Regulatory Order", "summary": "PepsiCo India has removed the ‘energy’ descriptor from its Sting drink labels to comply with FSSAI regulations. The move follows a deadline for the ‘energy drinks’ category to cease using the term on labels and advertising. Other major brands, including Red Bull and Monster, have also sought extensions or are reworking their marketing to align with the new food safety standards.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "76f2bf63"}, {"headline": "Bajaj Auto Likely to Receive ₹4,000 Crore Under PLI Scheme", "summary": "Bajaj Auto is expected to receive approximately ₹4,000 crore in incentives this fiscal year under the production-linked incentive (PLI) scheme for automobiles. The company has already received approval for 13 of its vehicle models. The government has earmarked ₹5,939 crore for the total PLI disbursement in FY26, a significant increase from previous years.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "6bee2be5"}, {"headline": "India’s Fuel Exports Hit One-Year High on Strong Diesel Demand", "summary": "India's fuel exports reached a one-year high in July, driven by strong diesel margins in Europe and Asia. Refiners exported 1.526 million barrels per day of refined products, with diesel making up a significant portion. The increase comes as domestic demand dipped during the monsoon and Indian refiners capitalized on favorable global price spreads and stable crude supplies.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "3ce5938e"}, {"headline": "New Nifty Closing Auction System Causes Market Confusion and Spikes", "summary": "The first day of a new closing auction system on the NSE led to a sudden spike in the Nifty 50 and Sensex, causing confusion among traders. The Nifty jumped 390 points in the final minutes to end at 24,774.30. Exchanges introduced the system to improve price discovery for large-cap stocks, but the abrupt price divergence on day one has raised technical concerns.", "category": "Business", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "9cc0d11a"}, {"headline": "Amazon Joins Elite Group with Market Cap Surpassing $3 Trillion", "summary": "Amazon has become the fifth company globally to reach a $3 trillion market capitalization, joining Apple, Microsoft, NVIDIA, and Alphabet. The stock has surged over 21% this year, fueled by strong growth in its AWS cloud division and generative AI investments. Analysts believe Amazon's diversified revenue streams in retail and tech position it for continued long-term growth.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "222cb89f"}, {"headline": "DK Shivakumar Expands Karnataka Cabinet with 19 New Ministers", "summary": "Karnataka Chief Minister DK Shivakumar inducted 19 new ministers into his cabinet, filling vacant slots since he took office in June. The expansion was marked by protests and resignations from several MLAs who were excluded from the list. The new cabinet aims to balance regional and community representation, with a focus on consolidating power before upcoming local body elections.", "category": "Politics", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "9f8bfdba"}, {"headline": "Supreme Court Orders MEA to Trace Seafarers Hit by Drone Attack", "summary": "The Supreme Court has directed the Ministry of External Affairs to locate four Indian seafarers missing since a drone attack on their cargo vessel near Ukraine. The court emphasized the need for immediate steps to ensure their safety and return. Reports indicate that while some crew members were rescued by the Romanian Coast Guard, the whereabouts of the four Indians remain unknown.", "category": "World", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "47f27d0f"}, {"headline": "Illegal AI Services Accelerate Cybercrime and State-Sponsored Attacks", "summary": "Generative AI is making cyberattacks cheaper and more sophisticated, with hackers using tools like WormGPT to automate phishing and malware creation. Cybercrime-as-a-service platforms now offer deepfake tools for as little as $50 per month. Experts warn that state-sponsored actors are weaponizing AI to target critical infrastructure, with AI-led breaches costing companies an average of $6 million.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "44717a98"}, {"headline": "IT Sector Hiring Revives in July with 6% Monthly Growth", "summary": "Hiring in India’s IT sector grew by 6% in July, rebounding from a 3% dip in June, according to the Naukri JobSpeak Index. The growth was led by demand for roles in Artificial Intelligence, machine learning, and data science. Overall white-collar hiring also saw a 6% acceleration, with sectors like oil and gas, healthcare, and real estate continuing to show strong recruitment trends.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "b96e1b90"}, {"headline": "Joint Parliamentary Committee Backs Decriminalization of Minor Corporate Offences", "summary": "A joint parliamentary committee has supported government proposals to decriminalize minor corporate offences and simplify regulatory processes. The changes aim to improve ease of doing business and encourage ‘reverse flipping’ where Indian startups move their headquarters back to India. The panel recommended easing CSR rules and allowing firms to buy back shares more frequently.", "category": "Law", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "764eac1e"}, {"headline": "FSSAI Directs Dabur to Halt Misleading 100% Claims on Food Products", "summary": "The Food Safety and Standards Authority of India (FSSAI) has ordered Dabur India to stop using ‘100%’ claims on several food products, including honey and fruit juices. The regulator deemed these labels misleading and in violation of advertising standards. Dabur must withdraw all such promotional material within 15 days and ensure future labels comply with the Food Safety and Standards Act.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "0d3a46ff"}, {"headline": "IndiGo to Launch Small Business Class for Long-Haul Flight Routes", "summary": "IndiGo plans to introduce a small business class on long-haul flights to Europe and Asia using its new Airbus A321 XLR aircraft. The airline aims to provide a premium option while maintaining its low-cost model. This move marks a shift from its traditional all-economy configuration and is intended to compete more effectively with full-service carriers on popular international routes.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "a6c97fd9"}, {"headline": "Oil Prices Fall 5% as Iran Remains Unmoved by Trump’s Negotiation Claims", "summary": "Global oil prices dropped by 5% following claims by Donald Trump that he was in negotiations with Iran to reach a new deal. However, Iran’s foreign ministry denied any such talks, stating there is no basis for negotiations. Brent crude fell to $83.64 per barrel. Markets remain volatile as geopolitical tensions in the Middle East continue to influence supply expectations and global prices.", "category": "World", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "e4ab03bb"}, {"headline": "US Signs Multi-Billion Dollar Deal to Boost Patriot Missile Production", "summary": "The US Defense Department has signed agreements with Lockheed Martin and Northrop Grumman to increase production of Patriot and THAAD missile interceptors. The deals, valued at up to $3 billion, are aimed at replenishing US stockpiles and supporting allies like Ukraine. The expansion of manufacturing capacity comes amid heightened global security concerns and increased demand for air defense systems.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "cfbe6fb6"}, {"headline": "Electronics Output Could Fall 40% Due to Severe PCB Shortage", "summary": "India’s electronics manufacturing sector faces a potential 40% drop in output within three months if the current shortage of printed circuit boards (PCBs) persists. Manufacturers have warned the government that the crisis is threatening production of mobile phones, laptops, and servers. The shortage has led to a 200% spike in the price of key raw materials like copper clad laminates.", "category": "Technology", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "adbc0627"}, {"headline": "WhatsApp Piloting Age-Verification Trial to Comply with DPDP Act", "summary": "WhatsApp is testing a new age-verification feature for Indian users to align with the Digital Personal Data Protection (DPDP) Act. The law requires parental consent for users under 18. The trial allows users to voluntarily verify their age using government-issued IDs or other secure methods. This move is part of the platform's efforts to enhance data privacy and child safety in India.", "category": "Technology", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132737", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132737"}], "article_id": "1614dc25"}, {"headline": "Jan Suraaj Jolts BJP in Bankipur as Congress Retains Datia Seat", "summary": "Prashant Kishor’s Jan Suraaj Party scripted a major upset in Bihar by defeating BJP’s Neeraj Kumar Sinha in Bankipur by 19,324 votes. In Madhya Pradesh, Congress candidate Ghanashyam Singh retained the Datia seat, defeating BJP by over 6,000 votes. While BJP suffered setbacks in Bihar and MP, it retained its Manjalpur seat in Gujarat. Kishor has urged the BJP to change Bihar’s Chief Minister.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 10, "article_id": "15dddba1"}, {"headline": "Nifty and Sensex Diverge Following Debut of New Closing Auction System", "summary": "Indian stock indices showed a rare divergence as exchanges adopted a new SEBI-mandated Closing Auction Session for F&O stocks, replacing the 30-minute volume-weighted average pricing method. Nifty 50 surged 1.6% to 24,774, while the Sensex closed 0.7% lower at 78,639. Low participation and lack of arbitrageurs led to pricing gaps between exchanges and underlying futures contracts.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 7, "article_id": "06c62fd7"}, {"headline": "India Proposes Extending Electronics Manufacturing Tax Breaks Until 2041", "summary": "The Indian government has proposed a draft bill to extend tax exemptions for foreign companies providing machinery to contract manufacturers until March 31, 2041. Seen as a major win for firms like Apple, the move aims to provide long-term policy certainty and encourage supply chain diversification from China. The rules apply to manufacturers of mobiles, tablets, and wearables.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 8, "article_id": "2476d6b5"}, {"headline": "Delhi Court Acquits Former WFI Chief Brij Bhushan in Harassment Case", "summary": "A Delhi court has acquitted former WFI president Brij Bhushan Sharan Singh and co-accused Vinod Tomar in a sexual harassment case filed by six women wrestlers. The court cited a lack of evidence to prove the allegations beyond reasonable doubt. Former Olympian Vinesh Phogat expressed disappointment, announcing that the wrestlers will challenge the \"honourable acquittal\" in a higher court.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 9, "article_id": "e0cd220c"}, {"headline": "Supreme Court Allows States to Withdraw Minor Cases Against Student Protesters", "summary": "The Supreme Court clarified that state governments can withdraw FIRs against student protesters involved in minor offenses, such as traffic violations, to protect their educational and career prospects. However, the court emphasized that this relief does not extend to students accused of grave or heinous crimes. It urged states to distinguish between habitual criminals and localized protesters.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132741"}], "importance": 8, "article_id": "21b7c5d7"}, {"headline": "Trump Warns Iran of Last Chance for Nuclear Deal Amid Tensions", "summary": "U.S. President Donald Trump has offered Tehran a \"last chance\" to negotiate a new nuclear agreement, warning of massive strikes on Iranian infrastructure and oil facilities if talks fail. While Trump claimed negotiations are currently active, Iran’s Foreign Ministry denied direct talks with Washington, stating that only discussions via Oman regarding the Strait of Hormuz are ongoing.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132697"}], "importance": 9, "article_id": "7fb32897"}, {"headline": "Government to Sell 6.5 Percent Stake in LIC via Offer for Sale", "summary": "The Union government has announced an Offer for Sale to divest up to a 6.54% stake in Life Insurance Corporation of India (LIC), aiming to raise approximately ₹31,000 crore. The move helps LIC move toward SEBI’s 10% minimum public shareholding requirement by May 2027. The floor price is set at ₹382 per share, representing a discount to the market price. Non-retail bidding opens Tuesday.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 10, "article_id": "b3327f35"}, {"headline": "Dhaka Warns Sheikh Hasina’s Political Activities in India Could Strain Ties", "summary": "The Bangladesh government has cautioned India that continued political activity by deposed Prime Minister Sheikh Hasina from Indian soil could negatively impact bilateral relations. Dhaka expects India to prevent Hasina from making statements that create instability, following reports of a \"homecoming\" media event in New Delhi. Meanwhile, the BNP has called for her extradition to face trial.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132697"}], "importance": 9, "article_id": "474544d5"}, {"headline": "July Rains Boost Kharif Sowing but Acreage Still Lags Last Year", "summary": "Despite a revival in monsoon rainfall during July, kharif crop sowing in India reached approximately 89.4 million hectares, lagging about 2.9% behind last year’s pace. While paddy and oilseed acreage showed recovery, pulses and cotton still lag. Concerns remain over El Nino and lower-than-average reservoir levels, which currently stand at 37% of capacity across 150 major reservoirs.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 7, "article_id": "52fd06e8"}, {"headline": "Tamil Nadu Moves Supreme Court Seeking Release of Cauvery Water from Karnataka", "summary": "The Tamil Nadu government has petitioned the Supreme Court to direct Karnataka to immediately release its share of Cauvery water, seeking 3,500 cusecs for 15 days. TN alleges a seasonal shortfall of 28,022 TMC and claims Karnataka is defying Cauvery Water Management Authority orders despite having adequate storage. Karnataka maintains that poor catchment rainfall has caused the delay.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 9, "article_id": "fe129664"}, {"headline": "Supreme Court Extends Domestic Cruelty Protections to Live-in Relationships", "summary": "The Supreme Court has ruled that women in live-in relationships are entitled to protection under domestic cruelty laws, including Section 498A of the IPC (now BNS Sections 85 and 86). The court clarified that the legal definition of \"relationship in the nature of marriage\" must be interpreted broadly to adapt to modern realities, ensuring legal recourse against cruelty for domestic partners.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132697"}], "importance": 9, "article_id": "59dc60b5"}, {"headline": "Government Introduces Bill to Reform Indian Statistical Institute Governance", "summary": "The Union government has introduced the Indian Statistical Institute (Amendment) Bill, 2026, in the Lok Sabha to modernize the 1959 Act. The Bill proposes replacing the existing Council with a Board of Governors to enhance autonomy and align the institute with global standards in data science and statistics. The reform aims to transform the ISI into a modern, data-driven statutory body.", "category": "Education", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132728"}], "importance": 7, "article_id": "55e1fbc1"}, {"headline": "Lok Sabha Passes Bill to Increase Supreme Court Judge Strength to 38", "summary": "The Lok Sabha passed the Supreme Court (Number of Judges) Amendment Bill, 2026, increasing the sanctioned strength from 34 to 38 judges, including the Chief Justice. Law Minister Arjun Ram Meghwal stated the move addresses the growing case backlog. The legislation was approved within minutes amid Opposition protests over the Jantar Mantar crackdown and Ayodhya temple donation allegations.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 8, "article_id": "4988db92"}, {"headline": "India’s Manufacturing Sector Growth Hits Five-Year Low in July", "summary": "India's manufacturing sector growth slowed to a five-year low in July, with the HSBC India Manufacturing PMI falling to 53.5 from 54.2 in June. While production and new orders continued to expand above the 50-mark threshold, the rate of increase was the weakest in months. Growth was hampered by softened domestic demand and cost pressures, though export demand from the US and UAE remained resilient.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132728"}], "importance": 9, "article_id": "419ac5b2"}, {"headline": "Uncapped Auqib Nabi Replaces Injured Jasprit Bumrah for Sri Lanka Series", "summary": "Jammu and Kashmir pacer Auqib Nabi has earned his first senior national call-up for India’s upcoming two-Test series against Sri Lanka. He replaces fast bowler Jasprit Bumrah, who was ruled out after failing to receive fitness clearance for a left knee injury. The 29-year-old Nabi’s selection follows a stellar Ranji Trophy season where he claimed 60 wickets for his state.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁸²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132769"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132697"}], "importance": 7, "article_id": "33862304"}, {"headline": "Government Hikes Windfall Tax on Petroleum Exports for August", "summary": "The Indian government has increased windfall taxes on the export of petroleum products for the current fortnight to capture gains from high global refining margins. The tax on diesel exports rose to ₹25.5 per litre, while levies on aviation turbine fuel (ATF) and petrol exports were hiked to ₹22 and ₹3.5 per litre, respectively. The rates are revised fortnightly based on international prices.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 8, "article_id": "7f7544c5"}, {"headline": "Ather Energy Narrows Q1 Loss to ₹51 Crore as Revenue Doubles", "summary": "Electric scooter maker Ather Energy narrowed its net loss to ₹51 crore in Q1 FY27, down from ₹178 crore a year ago. Revenue nearly doubled to approximately ₹1,217 crore, supported by an 81% surge in sales volume. The company achieved its first-ever operating profit with an EBITDA margin of 0.8% and plans to expand production to 150,000 units per year at its new Aurangabad facility.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132715"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 6, "article_id": "3eb43587"}, {"headline": "Rajya Sabha Passes Bill to Address MSME Payment Delays and Registration", "summary": "The Rajya Sabha passed the MSME Development (Amendment) Bill, 2026, to address payment delays and improve liquidity. The legislation mandates a national digital platform for free registration and requires CPSEs to use the TReDS platform for invoice settlements. It also empowers courts to order the payment of at least 50% of awarded amounts to MSME suppliers when an order is challenged.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi H 04-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132741"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132728"}], "importance": 8, "article_id": "dd41dd07"}, {"headline": "India Finishes Fourth as Glasgow 2026 Commonwealth Games Conclude", "summary": "The 2026 Commonwealth Games in Glasgow concluded with India finishing fourth in the medal tally with 13 gold, 17 silver, and 9 bronze medals. During the closing ceremony at the OVO Hydro, the Games flag was handed to Indian representatives as Ahmedabad was confirmed as the 2030 host. Top performers included Neeraj Chopra and Sakshi Chaudhary as India broadened its base in para-athletics and judo.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132697"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 8, "article_id": "eefec40b"}, {"headline": "Essar Group to Invest $5.8 Billion in UK Low-Carbon Energy Hub", "summary": "Essar Group has launched a $5.8-billion (£4.3 billion) investment plan to transform its Stanlow Manufacturing Complex in the UK into a leading low-carbon energy transition hub. The project focuses on green hydrogen production and refinery decarbonisation to support the UK’s 2050 net-zero goals. The move aims to secure 5,000 jobs and create a new industrial cluster in North West England.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 8, "article_id": "bee9828c"}, {"headline": "India and Uzbekistan Target Doubling Bilateral Trade to $3 Billion", "summary": "India and Uzbekistan have set a goal to double their bilateral trade to $3 billion within the next three years, up from the current level of approximately $1.5 billion. Commerce Minister Piyush Goyal and Uzbek Minister Laziz Kudratov identified mining, energy, and digital infrastructure as key areas for co-investment. Both nations are also utilizing a recent investment treaty to boost confidence.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 7, "article_id": "2afe1c5d"}, {"headline": "Muthoot Finance Shares Slump 7% on Concerns Over Narrowing Interest Margins", "summary": "Muthoot Finance shares dropped 7% after the company reported a sequential fall in net interest margins to 10.41% for the June quarter. While the gold loan book grew 44% year-on-year to ₹70,244 crore and net profit rose 25%, analysts expressed concerns over margin pressure caused by increased competition and lower lending rates. The stock fell despite strong customer additions in the quarter.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 6, "article_id": "1b080c0d"}, {"headline": "Aviation Veteran Willie Walsh Takes Charge as CEO of IndiGo", "summary": "Willie Walsh, former Director-General of IATA and chief of IAG, has assumed the role of CEO at IndiGo, succeeding Pieter Elbers. Walsh takes charge as India’s largest airline prepares for major international expansion, including long-haul flights to Europe and the US using new Airbus A350 aircraft. IndiGo currently commands over 66% of the domestic market and has 900 planes on order.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_04-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132728"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132715"}], "importance": 7, "article_id": "598c9fe4"}, {"headline": "India’s Manufacturing Expansion Slows to Five-Year Low in July", "summary": "The HSBC India Manufacturing PMI fell to 53.5 in July from 54.2 in June, marking the slowest expansion pace in nearly five years. While the index remains above the 50-point threshold, the slowdown was driven by a cooling in new domestic orders and softer demand. Manufacturers reported a moderation in input cost inflation, while export demand from the US and UAE remained resilient.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_04-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132715"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_04-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132737"}], "importance": 8, "article_id": "7d432718"}], "newspapers": ["Indian Express", "Hindustan Times", "Times of India", "Business Standard", "Economic Times", "Business Line", "Financial Express", "Mint", "The Hindu"], "total_articles": 181};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
