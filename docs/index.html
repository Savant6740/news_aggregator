<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

const DIGEST = {"date": "29 July 2026", "articles": [{"headline": "SC clears path for independent probe into attacks on student protesters", "summary": "The Supreme Court has allowed an independent probe into alleged police excesses during recent student protests across several states, including Delhi and Bihar. The court ordered the release of minors and protected activists from coercive action. A high-powered panel will examine the incidents to ensure accountability for both students and security personnel during civil demonstrations.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "49dd716d"}, {"headline": "Delhi government approves cash aid scheme with three-child eligibility cap", "summary": "The Delhi Cabinet approved the Delhi Lakshmi Yojana, providing ₹2,500 monthly to adult women. However, women with more than three children are ineligible. The scheme also excludes households earning over ₹2.5 lakh annually or using more than 200 units of electricity. The move aims to provide financial independence while encouraging family planning among the city's beneficiaries.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "f6d90b47"}, {"headline": "Top Maoist leader Misir Besra arrested in Jharkhand joint operation", "summary": "Misir Besra, a CPI (Maoist) Central Committee member with a ₹1 crore bounty, has been arrested in Jharkhand. Besra was the last major active leader of the outfit in the region. The arrest followed a coordinated operation by the CRPF and state police. Officials called the capture a major success in the ongoing campaign against left-wing extremism in India's red corridor.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "d79eff0d"}, {"headline": "FCI sold rice for ethanol at 40% below average acquisition cost", "summary": "The Food Corporation of India sold 6.35 million tonnes of rice to ethanol distilleries between June 2025 and 2026 at ₹2,250-2,320 per quintal, significantly below the acquisition cost of ₹3,720-3,889. The government justified the move to support the ethanol blending program and manage surplus grain stocks. The program aims to increase domestic biofuel production using excess food grains.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "3e60ca2b"}, {"headline": "Heavy rain brings relief from heat but triggers traffic chaos in Delhi", "summary": "Parts of Delhi-NCR received heavy rainfall on Tuesday, providing relief from high temperatures but leading to massive traffic snarls and waterlogging. The city recorded 57.6mm of rain in just a few hours. Several key arterial roads were inundated, slowing down commutes. The weather office predicted more rain over the next few days as the monsoon remains active over northern India.", "category": "India", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "a434caac"}, {"headline": "Lancaster University set to open international campus in Bengaluru", "summary": "Lancaster University, a leading UK institution, is set to establish its first Indian campus in Bengaluru. The move follows approval under the University Grants Commission's new regulations for foreign universities. The campus will offer programs in business, management, and technology, with the same curriculum as its UK base. Operations are expected to commence by the 2027 academic year.", "category": "Education", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "9b215043"}, {"headline": "Assam flood toll rises to 75 as rains wreak havoc", "summary": "The death toll from floods in Assam has risen to 75 as several more fatalities were reported from various districts. Torrential rains have inundated hundreds of villages and displaced thousands of people. Large tracts of farmland and infrastructure have been damaged. The state government has ramped up relief efforts and established more camps for the affected population in the Brahmaputra valley.", "category": "Environment", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "7e1a1a9e"}, {"headline": "EU requires AI-generated content to carry clear transparency labels", "summary": "The European Union has implemented new rules requiring tech firms to clearly label content generated by artificial intelligence. Under the AI Act, images, videos, and text produced by AI must carry watermarks or visible tags to prevent the spread of misinformation. The move aims to increase transparency and help users distinguish between human-made and machine-generated digital media.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132098", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁹⁰⁷²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132098"}], "article_id": "80017b68"}, {"headline": "Small banks raise FCNR(B) deposit rates to attract NRI funds", "summary": "Small and mid-size banks are offering interest rates up to 150 bps higher than larger lenders for Foreign Currency Non-Resident (B) deposits. Equitas SFB, AU Small Finance Bank, and others have raised rates to mobilize foreign currency inflows and provide an alternative to standard dollar deposits.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "bc1a8d6c"}, {"headline": "HUL Q1 net profit declines 2% to ₹2,680 crore", "summary": "Hindustan Unilever Ltd (HUL) reported a 2% year-on-year decline in standalone net profit to ₹2,680 crore for the June quarter. Revenue grew 10% to ₹17,529 crore, but margins were pressured by commodity inflation and a one-time tax credit in the previous year. Underlying volume growth was recorded at 5%.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "8a0cfe32"}, {"headline": "TVS Motor increases stake in TVS Credit to 85.15%", "summary": "TVS Motor Company has acquired an additional 4.39% stake in its subsidiary, TVS Credit Services, for ₹711 crore. This transaction raises TVS Motor's total shareholding in the non-banking financial company from 80.76% to 85.15%. The acquisition was made from Lucas-TVS Ltd and other shareholders.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "4b798bfe"}, {"headline": "Ambuja Cement Q1 net profit drops 37% to ₹660 crore", "summary": "Ambuja Cement, part of the Adani Group, saw its June quarter net profit decline by 37% to ₹660 crore. Revenue fell to ₹9,474 crore from ₹10,041 crore due to lower realisations and a decrease in production volume to 17 million tonnes. Operating expenses decreased by 4% due to lower power and fuel costs.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "7aa2b386"}, {"headline": "Suzlon selects Singapore as global hub for international expansion", "summary": "Wind turbine maker Suzlon Energy is setting up a wholly owned subsidiary in Singapore to lead its international business. The move aims to strengthen its presence in Europe, Australia, and parts of Asia, targeting 1 GW of annual overseas sales by FY31. The hub will serve as the coordination center for global sales and operations.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "13c49180"}, {"headline": "Suzlon Energy Q1 net profit declines 6% to ₹305 crore", "summary": "Suzlon Energy reported a 6% year-on-year decline in consolidated net profit to ₹305 crore for the first quarter of FY27. Revenue from operations grew 23% to ₹3,819 crore. The company delivered 506 MW of wind energy capacity during the quarter, more than doubling its performance from the previous year's first quarter.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c5ca4ad9"}, {"headline": "Radico Khaitan Q1 net profit surges 76% to ₹230 crore", "summary": "Liquor maker Radico Khaitan reported a 76% increase in consolidated net profit to ₹229.60 crore for the June quarter. Revenue from operations grew 13.2% to ₹5,867.69 crore, fueled by strong performance in its premium brands like Rampur Indian Single Malt and Jaisalmer Indian Craft Gin.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "53bcdde9"}, {"headline": "Coca-Cola reports strong volume growth in India during June quarter", "summary": "The Coca-Cola Company highlighted strong volume growth in India during the recent quarter, contributing significantly to its performance in the Asia-Pacific region. Growth was observed across categories, particularly in the premium and affordable segments. The company continues to invest in capacity expansion to meet long-term demand.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "682448ff"}, {"headline": "Government considers easing FDI norms to attract overseas investments", "summary": "The Indian government is exploring a proposal to ease foreign direct investment (FDI) norms to boost job creation and investment. The proposal, currently under inter-ministerial discussion, may involve liberalizing rules for certain sectors to attract more inflows. Most sectors currently allow 100% FDI under the automatic route.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "bcd04de6"}, {"headline": "Public sector banks record ₹1.98 lakh crore profit in FY26", "summary": "Public sector banks (PSBs) achieved a record aggregate net profit of ₹1.98 lakh crore in FY26, according to the Finance Ministry. Gross non-performing assets (GNPAs) for PSBs dropped to a multi-decadal low of 1.9%. The performance was attributed to healthy balance sheets and improved asset quality across all 12 major public lenders.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "d3b71d1f"}, {"headline": "Indian rupee appreciates to 95.86 against US dollar", "summary": "The Indian rupee appreciated 0.4% over the past week to close at 95.86 against the US dollar. Gains were supported by positive foreign portfolio investor (FPI) inflows of approximately $665 million and a decline in global crude oil prices. Markets are awaiting the US Federal Reserve's policy statement for further direction.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "cf7b5702"}, {"headline": "Banks warned of liquidity risks under FCNR(B) deposit scheme", "summary": "Experts warn that the special FCNR(B) deposit scheme, which has attracted an estimated $32 billion, could pose liquidity and asset-liability management risks for banks. The concentration of high-net-worth NRI deposits could lead to sudden outflows if global interest rates change, potentially impacting banks' net interest margins.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "57dc5e87"}, {"headline": "Indian fintech sector reaches profitability in FY25: Jefferies report", "summary": "A report by Jefferies indicates that India's fintech sector turned profitable in FY25, with aggregate profit after tax (PAT) reaching ₹23 billion. Revenue grew nearly five-fold between FY21 and FY25, and is projected to reach ₹2,396 billion by FY30. Growth is shifting from customer acquisition to monetization and operational efficiency.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "8779a709"}, {"headline": "Adani Energy Solutions ₹3,500 crore QIP oversubscribed three times", "summary": "Adani Energy Solutions received strong demand for its ₹3,500 crore Qualified Institutional Placement (QIP), which was oversubscribed three times. The issue saw interest worth ₹10,800 crore from mutual funds and insurance companies. Proceeds will be used for capital expenditure, repayment of loans, and future acquisitions.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "5b7bb11b"}, {"headline": "Indian markets remain resilient despite volatility in Asian markets", "summary": "The Indian stock market remained stable despite significant drops in South Korean and Japanese markets. The Nifty 50 closed slightly lower at 23,985, while the Nifty IT index rose 3.3%, led by a surge in Coforge shares. Investors were encouraged by positive domestic earnings reports and lower global crude oil prices.", "category": "Economy", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "b8223bdc"}, {"headline": "Mutual fund SIP inflows see sequential decline in June quarter", "summary": "Systematic Investment Plan (SIP) inflows for top listed mutual fund houses showed a flat or declining trend on a sequential basis in the June quarter. ICICI Prudential, HDFC, and Nippon India reported marginal dips, attributed to market volatility and cautious investor sentiment. However, monthly SIP inflows remain above the ₹30,000-crore mark.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "d2ee124f"}, {"headline": "Meenakshi India shares list at 5% premium on BSE", "summary": "Shares of Meenakshi India Ltd listed on the BSE at ₹296.08, a 5% premium over its issue price of ₹281.99. The Tamil Nadu-based company plans to use the IPO proceeds of approximately ₹40 crore to expand its manufacturing capacity for various products to nearly 35 lakh kg by FY30.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "2f758f40"}, {"headline": "SEBI proposes new mutual fund-only investment category for PMS", "summary": "SEBI has proposed a new registration category under Portfolio Management Services (PMS) that would exclusively invest in mutual fund products. The move aims to provide a regulated and transparent channel for investors seeking professional fund selection and asset allocation, potentially reaching a wider segment of mass-affluent investors.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "b088dd21"}, {"headline": "Zepto reserves ₹2,298 crore for anchor investors in upcoming IPO", "summary": "Quick-commerce firm Zepto has set aside ₹2,298 crore for anchor investors as part of its proposed ₹5,106-crore initial public offering (IPO). The company is reportedly seeking a valuation of around $3 billion for the public issue. The IPO will include a fresh issue of shares and an offer for sale from existing investors.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "5cb4e8f7"}, {"headline": "Sunidhi Solaira Capital to acquire stake in Saffron Capital Advisors", "summary": "Sunidhi Solaira Capital, a SEBI-registered Category 1 merchant banker, plans to make a strategic investment in Saffron Capital Advisors. The partnership aims to enhance merchant banking services and expand distribution capabilities for high-net-worth clients. Jayakumar Krishnaswamy will join the board of Saffron Capital as Managing Director.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "be5af589"}, {"headline": "PMS industry net inflows reach ₹3.55 lakh crore in June", "summary": "Net inflows into the portfolio management services (PMS) industry jumped to ₹3,55,755 crore in June 2026, a significant increase from the previous month. Total assets under management (AUM) for the industry rose to ₹43.27 lakh crore, driven by increased participation from both retail and corporate investors seeking specialized investment strategies.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c1337fee"}, {"headline": "Ashok Leyland and UCO Bank partner for vehicle financing solutions", "summary": "Ashok Leyland has signed a Memorandum of Understanding (MoU) with UCO Bank to provide customized financial solutions for its customers. The partnership aims to offer competitive financing options for buyers of Ashok Leyland's range of commercial vehicles, including trucks and buses, across the bank's pan-India network.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "ea7a744a"}, {"headline": "WazirX introduces crypto tax reporting tool for Indian users", "summary": "Cryptocurrency exchange WazirX has launched a new tool to help users calculate and report their tax liabilities on crypto transactions in accordance with India's tax laws. The tool simplifies tax filing by generating reports on gains, losses, and tax-deductible expenses based on user transaction history from any exchange.", "category": "Technology", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "80db25a5"}, {"headline": "Equitas Small Finance Bank Q1 net profit at ₹183 crore", "summary": "Equitas Small Finance Bank reported a net profit of ₹183 crore for the June quarter. Gross advances grew 27% year-on-year to ₹30,625 crore, driven by growth in its microfinance, small business, and small enterprise loan segments. Disbursements during the quarter rose by 93% to reach ₹1,165 crore.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "6b7b56c4"}, {"headline": "Canara Bank sees strong loan demand from infrastructure and energy sectors", "summary": "Canara Bank's MD & CEO Brajesh Kumar Singh stated that the bank is seeing healthy credit demand from sectors like battery storage, data centers, and power evacuation. The bank reported a 2.1% increase in June quarter net profit to ₹4,086 crore. Gross advances grew to ₹13 lakh crore, with a significant portion coming from corporate and MSME loans.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "7145db00"}, {"headline": "Cholamandalam Investment Q1 net profit surges 46% to ₹1,654 crore", "summary": "Cholamandalam Investment and Finance Company reported a 46% year-on-year jump in net profit to ₹1,654 crore for the first quarter. Net income grew 28% to ₹3,865 crore, while assets under management (AUM) reached ₹2.54 lakh crore. The company saw strong growth in its vehicle finance and loan against property segments.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "2c35e4b9"}, {"headline": "Sundaram Clayton Q1 net loss widens to ₹59 crore", "summary": "Chennai-based Sundaram Clayton reported a widened consolidated net loss of ₹59 crore for the June quarter, compared to a ₹58-crore loss last year. Revenue rose 16% to ₹592 crore, but performance was impacted by higher input costs for materials and logistics. The company noted signs of recovery in the commercial vehicle segment.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "2bcd343d"}, {"headline": "Tata Capital Q1 net profit jumps 56% to ₹1,547 crore", "summary": "Tata Capital Ltd reported a 56% year-on-year increase in consolidated net profit to ₹1,547 crore for the June quarter. Net interest income rose 25% to ₹3,571 crore. The company also announced the acquisition of a nearly 89% stake in Yoga-kshemam Loans, marking its entry into the gold loan market.", "category": "Business", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "be3515a5"}, {"headline": "Northern Arc Capital reports Q1 net profit of ₹114 crore", "summary": "Northern Arc Capital reported its highest-ever first-quarter profit of ₹114 crore, a 41% increase year-on-year. Assets under management (AUM) grew 26% to ₹10,766 crore. The company also announced plans for a ₹3,000-crore IPO to support its future growth and diversification into direct-to-customer lending.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "bcb9897e"}, {"headline": "Tata Power targets ₹30,000 crore rooftop solar revenue by 2029", "summary": "Tata Power aims to reach ₹30,000 crore in annual revenue from its rooftop solar business by 2029, a six-fold increase. The company plans to double its market share in the segment to nearly 25%, driven by government incentives, falling battery costs, and rising consumer awareness. Cumulative rooftop solar installations reached 5.2 GW in June.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "3c62fe18"}, {"headline": "Government plans performance-based safety norms for two-wheelers", "summary": "The Ministry of Road Transport and Highways is working on a performance-based safety framework for two-wheelers. The move aims to improve vehicle braking and stability by mandating specific technologies like anti-lock braking systems (ABS) or combined braking systems (CBS) across various categories, aiming to reduce fatalities and improve road safety.", "category": "Infrastructure", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "cbf11d27"}, {"headline": "HyFun Foods announces ₹1,500 crore investment for capacity expansion", "summary": "Frozen potato products maker HyFun Foods plans to invest ₹1,500 crore to set up new manufacturing units in Gujarat and Madhya Pradesh. The expansion aims to increase its production capacity to meet growing demand in the domestic and international markets. The company expects the new units to be operational by January 2027.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "7deb9adb"}, {"headline": "Bottled soft drink penetration in India reaches 44% in summer", "summary": "The penetration of bottled soft drinks in Indian households reached 44.1% during the March-May 2026 period, the highest level ever recorded. Volume growth was driven by a harsh summer and increased rural consumption. The category has seen significant post-pandemic evolution, with households increasingly consuming these drinks at home.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "4da5e3b4"}, {"headline": "Kumar Mangalam Birla emphasizes long-term vision for building enduring businesses", "summary": "Aditya Birla Group Chairman Kumar Mangalam Birla stated that enduring businesses are built by taking long-term, transformational bets that may be unpopular in the short term. He highlighted the group's ₹20,000 crore investment in its paints business as a strategic move aimed at long-term value creation and industry leadership.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c2b41d45"}, {"headline": "Adani Green says rooftop solar won't impact utility-scale renewable projects", "summary": "Adani Green Energy's CEO Ashish Khanna stated that the rapid growth of rooftop solar installations is unlikely to negatively impact utility-scale renewable energy projects. He believe both segments will grow to meet India's rising electricity demand, particularly during peak hours, and that rooftop solar will complement larger grid-connected projects.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "7282c0db"}, {"headline": "TruAlt Bioenergy Q1 net profit surges to ₹59.27 crore", "summary": "TruAlt Bioenergy reported a multi-fold increase in net profit to ₹59.27 crore for the June quarter, driven by higher revenues and expanded production capacity. Revenue for the quarter rose 96% year-on-year to ₹641.41 crore. The company is focusing on producing ethanol from diverse feedstocks, including sugar and grains.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "a32b2c21"}, {"headline": "Cognizant wins major IT operations deal from pharma giant Novartis", "summary": "IT services major Cognizant has been selected by Swiss pharmaceutical giant Novartis for a multi-year deal to manage its global IT operations. Cognizant will utilize AI and automation to streamline Novartis' technology infrastructure, including applications, security, and digital workplace services, to improve operational efficiency and agility.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "f72f674e"}, {"headline": "Infosys partners with NTN for cloud-based e-commerce transformation", "summary": "Infosys has successfully migrated the e-commerce platform of NTN Corporation, a global manufacturer of precision equipment, to SAP Commerce Cloud. This transformation aims to enhance NTN's digital operations, improve agility, and provide a better customer experience through a scalable and secure cloud infrastructure.", "category": "Technology", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "75473a5c"}, {"headline": "Vodafone Idea adds over 1.6 lakh mobile subscribers in June", "summary": "Telecom operator Vodafone Idea added 1,63,757 mobile subscribers in June 2026, marking its fifth consecutive month of positive subscriber growth. Reliance Jio added 21.46 lakh users, while Bharti Airtel saw a net addition of 29.89 lakh subscribers during the same period. The total number of wireless subscribers in India reached 1,201.06 million.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c2b94743"}, {"headline": "Nuvoco Vistas expects Gujarat cement business to match North India profitability", "summary": "Nuvoco Vistas Corp expects its cement business in Gujarat to reach profitability levels comparable to its North India operations within 2-3 years. The company recently commissioned a 1.2 million tonne per annum grinding unit in Gujarat and plans further capacity expansion to capture market share in the western region.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "51a9d6d5"}, {"headline": "Tata Communications launches AI-driven virtual assistants for small businesses", "summary": "Tata Communications and Tata Tele Business Services have launched AI-driven virtual assistants to help small and medium businesses (SMBs) manage customer interactions more efficiently. The solution provides 24/7 automated support for queries, scheduling, and order processing, helping SMBs digitize their customer engagement.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "da512c93"}, {"headline": "Low maize acreage may force ethanol makers to use rice", "summary": "A sharp drop in maize (corn) acreage in major producing Indian states like Madhya Pradesh and Karnataka is expected to force ethanol makers to rely more on rice in the 2026-27 season. This shift could lead to higher rice prices as demand for the grain increases for fuel production, potentially impacting food price stability.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "3d976300"}, {"headline": "Gold prices decline as US dollar reaches one-month high", "summary": "Gold prices fell on Tuesday as the US dollar hovered near a one-month high. Investors are cautiously awaiting the Federal Reserve's interest rate decision. Spot gold fell 1.1% to $4,032.42 per ounce, while US gold futures also dropped. Geopolitical tensions continue to be a key factor influencing market sentiment.", "category": "Economy", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "a5b54f97"}, {"headline": "Industrial metal prices decline ahead of Federal Reserve interest rate decision", "summary": "Prices for copper, aluminum, and zinc fell as a stronger US dollar and anticipation of the Federal Reserve's rate decision weighed on industrial metals. Benchmark copper on the London Metal Exchange dropped 0.9% to $13,605 a tonne. Traders are also monitoring global economic growth prospects and their impact on metal demand.", "category": "Economy", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "bb2d8dca"}, {"headline": "Global crude oil prices decline amid easing US-Iran tensions", "summary": "Crude oil prices dropped by over $1 per barrel due to hopes for a resolution in the US-Iran conflict and easing geopolitical tensions. Brent crude futures fell to $86.89 per barrel, while US WTI crude was at $81.16 per barrel. The decline in prices is positive for India, potentially reducing its import bill and trade deficit.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "4f851a8e"}, {"headline": "Cotton sowing area in India exceeds 100 lakh hectares", "summary": "Cotton sowing in India has surpassed 100 lakh hectares as the monsoon gathers momentum in key producing states. Telangana, Maharashtra, and Andhra Pradesh reported significant increases in acreage. Stakeholders expect total coverage to exceed 120 lakh hectares this season, supported by favorable weather conditions and firm prices.", "category": "Environment", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "93490493"}, {"headline": "Women constitute 60% of India's agricultural workforce: Government report", "summary": "A government report indicates that women accounted for nearly 60% of India's agricultural workforce in 2025. Data from the Periodic Labour Force Survey (PLFS) showed that 59.8% of the total female workforce in India is engaged in agriculture, primarily as self-employed workers. The report also noted an increase in female participation in government welfare schemes.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "6647f0f4"}, {"headline": "Global gold ETFs see positive inflows led by US and China", "summary": "Physically backed gold exchange-traded funds (ETFs) recorded net inflows of $2.62 billion last week, with the US and China leading the trend. The World Gold Council reported renewed investor interest as US-China tensions eased and gold prices remained relatively stable. ETFs in Europe and other Asian countries also saw significant inflows.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "95511734"}, {"headline": "Indian government imposes 400-tonne sugar stock limit for dealers", "summary": "The Indian government has issued an order imposing a maximum stock limit of 400 tonnes for sugar dealers until November 30, 2026. The move aims to maintain price stability and ensure adequate domestic supply during the upcoming festival season. Dealers are required to disclose their sugar stocks within 30 days to the Food Ministry.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c95bfec0"}, {"headline": "El Nino strengthens, could reach strongest levels since 1950: Australian Bureau", "summary": "Australia's Bureau of Meteorology reported that the current El Nino event is strengthening and could reach its strongest levels since 1950. The phenomenon is likely to persist through the southern hemisphere summer, potentially impacting global weather patterns, agricultural output, and commodity prices across the Asia-Pacific region.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "02b5628f"}, {"headline": "VST Tillers Tractors to invest ₹100 crore in Hosur technology centre", "summary": "Farm equipment maker VST Tillers Tractors Ltd is setting up a Global Tech Centre in Hosur with an investment of ₹100 crore. The facility will focus on research and development for next-generation tractors, sustainable agricultural solutions, and electric vehicle drive trains, aiming to accelerate the development of innovative farming technologies.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "80a5ec82"}, {"headline": "Trading view: Short-term outlook for aluminium prices remains bearish", "summary": "Technical analysis suggests a bearish short-term outlook for aluminium prices, which have been declining recently. Analysts recommend a \"go short\" strategy if the price breaks below ₹338 per kg, with a potential target of ₹328. The downward trend is attributed to a stronger US dollar and weakening global industrial demand.", "category": "Economy", "page": 12, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "2c3532a8"}, {"headline": "CMFRI launches digital tools for shark conservation awareness", "summary": "The Central Marine Fisheries Research Institute (CMFRI) has developed a mobile app, \"Shark Aware,\" and an e-learning module to promote conservation of protected shark species. The tools aim to educate fishers, officials, and the public about identification, legal protection, and the importance of sharks in marine ecosystems.", "category": "Environment", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "bbddc673"}, {"headline": "Parliament debates Bill to prevent unfair means in public examinations", "summary": "The Lok Sabha witnessed a heated debate on the Public Examinations (Prevention of Unfair Means) Bill, 2024. The Opposition criticized the Bill's focus on students rather than systemic issues, while the government defended it as a necessary step to curb leaks and malpractices in national exams like NEET. The bill proposes strict penalties for offenders.", "category": "Politics", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "90b5aa8b"}, {"headline": "AstraZeneca to establish genomic research hub in Amaravati, Andhra Pradesh", "summary": "The Andhra Pradesh government and AstraZeneca India have signed an MoU to set up a genomic research hub in Amaravati. The facility will focus on personalized cancer diagnosis and treatment through advanced genetic research and integrated precision oncology programs, aiming to improve healthcare outcomes for cancer patients in the state.", "category": "Health", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "538538c0"}, {"headline": "Gig workers demand transparency in platform payment and commission structures", "summary": "Platform and gig workers' unions have urged the government to mandate transparency in the payment systems of apps like Uber, Ola, and Zomato. They are seeking a minimum base fare, clear disclosure of commissions, and a time-bound grievance redressal mechanism for deactivated accounts to ensure fair compensation and job security.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "673bcf32"}, {"headline": "GMR Aero Technic and Honeywell Aerospace partner for MRO services", "summary": "GMR Aero Technic has signed a licensing agreement with Honeywell Aerospace to provide maintenance, repair, and overhaul (MRO) services for aircraft components. The partnership will focus on components for LEAP engines used in Boeing 737 MAX and Airbus A320neo aircraft, helping to expand MRO capabilities in India and the region.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "dc4224ec"}, {"headline": "Supreme Court awaits official report on Air India Flight 171 crash", "summary": "The Supreme Court has deferred its ruling on a plea seeking a Court of Inquiry into the Air India Flight 171 crash at Ahmedabad, which resulted in 242 deaths. The court will wait for the final report from the Aircraft Accident Investigation Bureau (AAIB), expected by mid-September, before deciding on further judicial action.", "category": "Law", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "8ebc0c5c"}, {"headline": "Kerala's umbrella industry faces sales decline due to weak monsoon", "summary": "Umbrella manufacturers in Kerala are facing a challenging season due to a deficient southwest monsoon, leading to a significant drop in sales. Rising production costs and a lack of rain during the peak months of May-July have impacted margins and left companies with unsold inventory, forcing many to offer discounts to attract buyers.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "ed0bce27"}, {"headline": "Kerala CM requests Tamil Nadu to lift ban on stone transport", "summary": "Kerala Chief Minister Pinarayi Vijayan has written to his Tamil Nadu counterpart requesting the lifting of a ban on the transport of stones and aggregates across the state border. The ban is reportedly impacting major infrastructure projects in Kerala, including National Highway construction and the development of the Vizhinjam seaport.", "category": "Politics", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "c3fafa67"}, {"headline": "Delhi High Court seeks government response on artificial sweetener regulations", "summary": "The Delhi High Court has issued a notice to the central government regarding a petition by the Indian Sugar and Bio-Energy Manufacturers Association (ISMA). The petition seeks stricter regulations and clearer labeling for products containing non-sugar sweeteners, such as aspartame and sucralose, to ensure better consumer awareness.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "b67713ac"}, {"headline": "IndiGo airline recruited 330 new pilots in FY26: Annual report", "summary": "IndiGo's annual report for FY26 reveals that the airline added 330 pilots and 2,013 cabin crew members during the year. The carrier's total fleet size reached 442 aircraft. The company plans to hire another 5,000 pilots by FY30 to support its fleet expansion goals and meet growing demand for domestic and international air travel.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "8f89fa0a"}, {"headline": "US Senators agree on bipartisan bill for new Russia, Iran sanctions", "summary": "A bipartisan group of US Senators has reached an agreement on a bill to impose new sanctions on Russia and Iran. The legislation aims to target major buyers of Russian crude oil and increase pressure on Iran over its regional activities and human rights record. The move could have significant implications for global energy markets and trade.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "f7c54c6e"}, {"headline": "Indian squash player Anahat Singh defeats top-seeded Egyptian opponent", "summary": "Indian squash prodigy Anahat Singh achieved a significant victory by defeating a top-seeded Egyptian opponent in a recent international tournament. The win highlights Singh's rising profile in the sport and her potential as a future star for Indian squash on the global stage. This success follows her recent strong performances in various competitions.", "category": "Sports", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "f681a6f6"}, {"headline": "Parliamentary panel urges fixed trade margins for anti-cancer medicines", "summary": "A Parliamentary Standing Committee has urged the Indian government to implement a permanent mechanism to regulate trade margins for life-saving anti-cancer drugs. The panel rejected the government's previous response, emphasizing the need to make essential treatments more affordable for patients and ensure price transparency across the pharmaceutical sector.", "category": "Health", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "18ec6dbb"}, {"headline": "Fermenta Biotech sees growth potential for plant-based Vitamin D3", "summary": "Fermenta Biotech is optimistic about the prospects for its plant-source Vitamin D3, developed from a byproduct of soybean oil. The company, which already exports the product to over 70 countries, believes its sustainable and plant-based nature will drive future growth in the supplement and food fortification markets, both in India and overseas.", "category": "Business", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132087", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132087"}], "article_id": "de01f4e7"}, {"headline": "Calcutta HC cancels all OBC certificates issued in Bengal after 2011", "summary": "The Calcutta High Court cancelled all OBC certificates issued in West Bengal after 2011, affecting nearly 5 lakh people. The court stated the state government bypassed the Backward Classes Commission and followed an illegal process. Existing jobs and educational benefits remain protected, but no new reservations under these categories can be claimed until a fresh review is conducted.", "category": "Law", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "7ae85e3e"}, {"headline": "RBI board approves record dividend of Rs 2.11 lakh crore to Centre", "summary": "The Reserve Bank of India’s board approved a transfer of Rs 2.11 lakh crore as surplus to the Union government for the financial year 2023-24. This record-high dividend is over double the previous year's transfer of Rs 87,416 crore. The boost is expected to provide significant fiscal relief to the government and help achieve the 5.1 percent fiscal deficit target for the current year.", "category": "Economy", "page": 1, "importance": 10, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "22b529cb"}, {"headline": "Pune Porsche case: Doctors arrested for allegedly swapping blood samples of minor", "summary": "Two doctors and a staff member from Pune’s Sassoon Hospital were arrested for allegedly swapping blood samples of the minor driver involved in the Porsche crash. Police claim the samples were discarded to show the teenager was not under the influence of alcohol. The juvenile's father and grandfather are already in custody for related attempts to influence the criminal investigation.", "category": "India", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "58e6e677"}, {"headline": "Rahul Gandhi vows to conduct caste census if INDIA bloc wins power", "summary": "Congress leader Rahul Gandhi reiterated his party’s commitment to conducting a nationwide caste census during an election rally. He described the census as an 'X-ray' that would reveal the social and economic status of various communities. Gandhi claimed that the current governance system lacks representation for Dalits, Tribals, and OBCs in key decision-making positions.", "category": "Politics", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "b20d83c9"}, {"headline": "Judicial custody of Arvind Kejriwal and K Kavitha extended in excise case", "summary": "A Delhi court extended the judicial custody of Chief Minister Arvind Kejriwal and BRS leader K Kavitha until June 3 in the excise policy money laundering case. The ED sought the extension, stating that the probe is at a crucial stage. Kejriwal remains in Tihar Jail following the expiry of his interim bail, which was granted by the Supreme Court for election campaigning purposes.", "category": "Law", "page": 7, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "1c56f1ba"}, {"headline": "IMD issues red alert as north India faces severe heatwave conditions", "summary": "The India Meteorological Department issued a red alert for Delhi, Rajasthan, Punjab, and Haryana as a severe heatwave swept across North India. Temperatures breached 47 degrees Celsius in several locations, including Delhi's Najafgarh. The IMD predicts that heatwave to severe heatwave conditions are likely to continue for at least five more days due to dry westerly winds.", "category": "Environment", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "79e550be"}, {"headline": "Health Ministry issues guidelines to states regarding heat-related illness surveillance", "summary": "The Union Health Ministry has asked all states to ensure heat-related illness surveillance is operational under the National Programme on Climate Change and Human Health. Hospitals are directed to maintain adequate stocks of IV fluids, ORS, and essential medicines. The advisory emphasizes the need for dedicated heatstroke rooms in medical facilities to handle the surge in cases.", "category": "Health", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "90d24a5a"}, {"headline": "UGC extends registration deadline for NET June 2024 due to demand", "summary": "The National Testing Agency has extended the registration date for the UGC NET June 2024 session until May 23. This extension comes after candidates reported difficulties in applying due to heavy server traffic on the official website. Candidates can pay the application fee until May 24. The exam is scheduled for June 18 in an OMR-based pen-and-paper format across the country.", "category": "Education", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "19bf4e80"}, {"headline": "Atal Setu sea bridge records 33 percent rise in average traffic", "summary": "The Mumbai Trans Harbour Link, also known as Atal Setu, has recorded a 33 percent increase in average daily traffic over the last month. Officials stated that more commuters are using the bridge to save travel time between Mumbai and Navi Mumbai. The bridge has significantly eased congestion on the old Vashi creek bridge, though toll rates remain a topic of public discussion.", "category": "Infrastructure", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "28a915d2"}, {"headline": "Massive crowds in Tehran for funeral of Iranian President Ebrahim Raisi", "summary": "Funeral ceremonies for President Ebrahim Raisi, Foreign Minister Hossein Amir-Abdollahian, and others who died in a helicopter crash began in Tehran. Hundreds of thousands of people gathered to pay respects. Supreme Leader Ayatollah Ali Khamenei led the prayers. Representatives from various countries, including India's Vice President, attended the ceremonies to offer condolences.", "category": "World", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "84823a7d"}, {"headline": "Indian markets hit fresh all-time highs led by banking and metals", "summary": "Indian equity benchmarks Sensex and Nifty reached new record peaks during intraday trading. The rally was fueled by positive global cues and the substantial record dividend payout by the RBI to the government. Banking, metal, and energy stocks were the top gainers. Investors remain optimistic about India's economic growth prospects and ongoing quarterly corporate earnings reports.", "category": "Business", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "64064c0f"}, {"headline": "OpenAI signs multi-year deal with News Corp to use media content", "summary": "OpenAI has entered a multi-year partnership with News Corp, allowing the AI firm to use content from publications like The Wall Street Journal and The Times. The deal, valued at over $250 million over five years, aims to provide users with high-quality journalism in AI responses while ensuring publishers are compensated for their work in the evolving technology landscape.", "category": "Technology", "page": 20, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "79d56e47"}, {"headline": "Kolkata Knight Riders reach IPL final with dominant win over Sunrisers", "summary": "Kolkata Knight Riders entered the IPL 2024 final after defeating Sunrisers Hyderabad by 8 wickets in Qualifier 1. Mitchell Starc’s fiery opening spell took 3 wickets, helping bowl SRH out for 159. Venkatesh Iyer and Shreyas Iyer then struck unbeaten half-centuries to chase the target in 13.4 overs. SRH will now face the winner of the Eliminator in Qualifier 2 to decide the second finalist.", "category": "Sports", "page": 22, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132055", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 29-07-2026_260729063914.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132055"}], "article_id": "e62dabb5"}, {"headline": "Ministries told to form QRTs to fight fake online content", "summary": "The central government has directed all ministries to set up Quick Response Teams (QRTs) to detect and respond to fake social media content in real time. QRTs must post official responses within two hours of misleading content appearing. The move follows student protests fuelled by social media. Prime Minister Modi also urged ministers to increase their presence on platforms like Instagram.", "category": "Politics", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "05e0c1fe"}, {"headline": "AI data centre rush fuels India’s next growth wave", "summary": "The rush to build physical infrastructure for AI models is creating significant demand across India’s clean energy, manufacturing, and real estate sectors. Major players like Reliance, Adani, Microsoft, and Google are investing billions. This 'multiplier effect' is boosting orders for electrical equipment and cooling systems, and creating demand for specialized data centre professionals.", "category": "Technology", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "7d595179"}, {"headline": "Hindustan Unilever pins hopes on volume growth after June quarter miss", "summary": "Hindustan Unilever (HUL) reported a 3% decline in consolidated net profit to ₹2,673 crore for Q1FY27, missing analyst estimates. Net sales rose 10.1% to ₹17,341 crore, while underlying volume growth stood at 5%. The company's stock fell nearly 7% following the results. Management cited a volatile environment but remains focused on driving volume-led revenue growth in rural and urban markets.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "a95d7d86"}, {"headline": "June IIP growth hits nearly two-year high of 7.3%", "summary": "India's industrial output growth surged to 7.3% in June, the highest in 23 months. Data from the National Statistics Office shows broad-based acceleration across mining, manufacturing, and electricity. Manufacturing output growth rose to 7.8% from 5.2% in May. Analysts attribute the jump to a favourable base effect and robust investment activity despite a large rainfall deficit in June.", "category": "Economy", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "ab850adb"}, {"headline": "The reform booster shot that transformed Indian pharma", "summary": "Since the 1991 liberalisation, India has become the 'pharmacy of the world,' accounting for 20% of global generic supply and 60% of vaccine demand. Exports hit a record $31.12 billion in FY26. The shift from product to process patents allowed local firms to master reverse engineering. However, the industry now faces the challenge of moving from generics to high-value original drug innovation.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "c9a80fea"}, {"headline": "L&T Q1 profit beats estimates, jumps 14% on higher income", "summary": "Engineering major Larsen & Toubro (L&T) reported a 14% year-on-year growth in Q1FY27 net profit to ₹3,926 crore. Revenue rose 6.7% to ₹67,942 crore, driven by progress in core infrastructure and renewable energy. The company secured orders worth ₹1.08 trillion during the quarter. However, management noted that revenue growth was somewhat subdued due to supply-chain disruptions in West Asia.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "7d8d97fd"}, {"headline": "JLR India retail sales hit record in June quarter", "summary": "Jaguar Land Rover (JLR) India reported its highest-ever first-quarter retail sales, retailing 1,665 vehicles in Q1FY27, an 11% increase. Demand was driven by premium SUVs like the Range Rover and Defender. The company benefited from the India-UK free trade agreement, which allowed for price reductions of up to ₹75 lakh on high-end models, spurring customer inquiries.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "bcd18fbb"}, {"headline": "Tata Sons’ FY26 consolidated net profit falls to five-year low", "summary": "Tata Sons saw a 35.7% drop in consolidated net profit to ₹17,923.4 crore in FY26, despite a 16.8% increase in revenue to ₹6.49 trillion. The decline was attributed to widening losses in unlisted subsidiaries like Air India, Tata Digital, and Tata Electronics. Air India's net loss more than doubled to ₹22,238 crore, significantly impacting the holding company's overall financial performance.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}], "article_id": "a385bfdf"}, {"headline": "Unilever to invest in India to protect its leadership position", "summary": "Unilever CEO Fernando Fernandez stated the company will invest in India to protect its pole position, describing the coming years as the 'decade of India.' India is currently Unilever's second-largest market. The group reported record market share in laundry and hair categories. CFO Srinivas Phatak added that the goal is for the Indian market to deliver high single-digit growth.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132096", "sources
