d": "2063bac7"}, {"headline": "Saudi-Led Coalition Strikes Houthi Oil Storage Facilities in Sanaa", "summary": "A Saudi-led coalition carried out new airstrikes on Houthi-held Sanaa, targeting oil company storage sites. The strikes followed warnings for civilians to evacuate. While Houthi media reported loud explosions, the oil company claimed the hit facilities were empty at the time of the attack. Tensions remain high in the West Asian region.", "category": "World", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "e76369df"}, {"headline": "Explosions Reported Near Saudi Aramco Headquarters in Dhahran", "summary": "Loud booms were heard in the vicinity of Saudi Aramco’s headquarters in Dhahran, with reports indicating a fire and subsequent building evacuation. While no official confirmation has been issued by the company, sources suggest the site may have been struck. The incident is part of widening regional instability.", "category": "World", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "e5ccfd2a"}, {"headline": "Nobel Laureate Yunus Harassed by Awami Supporters at New York Airport", "summary": "Former Bangladesh interim government head Muhammad Yunus was confronted by Awami League supporters at JFK Airport in New York. Protesters labeled him a 'terrorist' and accused him of destroying democracy in Bangladesh. The current Bangladeshi government condemned the harassment and asked its mission to contact law enforcement.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "5b58b734"}, {"headline": "UK Home Office Data Shows 15 Percent Rise in Hindu Hate Crimes", "summary": "Religious hate crimes against Hindus in Britain increased by 15% over the last year, according to UK Home Office data. Similar rises were recorded for Muslims and Jews. Advocacy groups criticized the lack of dedicated security funding for Hindu temples compared to other religious institutions despite the rise in physical assaults.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "72ff210b"}, {"headline": "US Ambassador to Greece Kimberly Guilfoyle Resigns Amid Ethics Probe", "summary": "The White House requested the resignation of US Ambassador to Greece Kimberly Guilfoyle following allegations of improper conduct and unethical behavior. Guilfoyle is accused of accepting improper gifts and offering access to officials for payment. She denied the accusations and stated she would vigorously defend herself.", "category": "World", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "0418a412"}, {"headline": "Pope Leo XIV Undergoes Successful Lung Surgery in Rome", "summary": "Pope Leo XIV underwent a successful surgery to remove a nodule from his lung at Gemelli Hospital in Rome. The Vatican confirmed the procedure was completed without complications. The 85-year-old pontiff is expected to remain hospitalized for recovery following the successful medical intervention.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "9493ae91"}, {"headline": "Nearly Half of Karnataka Government Schools Lack Internet Connectivity", "summary": "Despite pushing for AI education, 48% of schools in Karnataka do not have internet connectivity. Data from the UDISE+ report shows that nearly 30,000 government-managed schools lack web access, giving the state the lowest connectivity rate in South India. This digital divide poses a challenge to new technology initiatives in education.", "category": "Education", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "890fdddd"}, {"headline": "Report: India Building Energy System Based on Solar Not Coal", "summary": "Energy strategists observe that India is attempting to become the first major modern economy to power industrial expansion using clean energy rather than fossil fuels. Between 2024 and 2026, all additional electricity demand in India was met by clean power, primarily solar. Coal still generates two-thirds of power, but solar is expected to overtake it by 2038.", "category": "Environment", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "b09d98d9"}, {"headline": "Government to Roll Out BS-VII Emission Norms Starting April 2029", "summary": "India will roll out BS-VII emission standards, aligned with Euro 7 norms, in phases beginning April 2029 for cars and SUVs. The new rules target ultrafine particles and non-exhaust pollutants like brake wear. Existing vehicles will not be affected, but the automotive sector must upgrade engines to meet the stricter real-world driving limits.", "category": "Environment", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "4ba9d4e6"}, {"headline": "India Rejects Chinese Objections to Mapping Geographical Features in Ladakh", "summary": "India reaffirmed that Ladakh is an integral part of its territory after China opposed the standardization of 28 places on official Indian maps. New Delhi stated that domestic administrative mapping is an internal matter. China had earlier claimed it does not recognize the Union Territory of Ladakh, leading to renewed diplomatic tensions.", "category": "Politics", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "e8640ebc"}, {"headline": "Sensex Gains 1100 Points on Hopes for Capital Gains Tax Cut", "summary": "The Sensex surged 1,109 points after Finance Minister Nirmala Sitharaman indicated the government is open to debating long-term capital gains (LTCG) tax. Her comments sparked investor hope for tax reductions in the upcoming budget. Nifty also rebounded significantly as domestic markets reacted positively to the prospect of healthier tax discussions.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "0268c6ef"}, {"headline": "Anti-Drug Activist Parminder Singh Jhota Shot Dead in Punjab", "summary": "Anti-drug activist Parminder Singh Jhota was shot dead in broad daylight in Mansa, Punjab, by a chemist he had previously accused of selling synthetic drugs. The murder, caught on camera, triggered protests and a business shutdown in the town. Opposition parties criticized the state government for a breakdown in law and order.", "category": "India", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "2b116cf2"}, {"headline": "ASI Finds Missing Head of Eleventh Century Vishnu Idol in Khajuraho", "summary": "The Archaeological Survey of India has recovered the missing head of an 11th-century Vishnu idol at the Javari temple in Khajuraho. The statue was at the center of a Supreme Court controversy last year. Experts will now examine the piece before reattaching it. ASI has also set a three-year deadline for completing archaeological excavations.", "category": "Culture", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "52f9b989"}, {"headline": "Sugarcane Farmers Block Karnataka Highways Demanding Higher Produce Prices", "summary": "Sugarcane farmers in North Karnataka blocked national highways to demand higher prices for their produce and the implementation of Swaminathan Commission recommendations. The protests affected traffic on the Pune-Bengaluru highway. The Central government has promised a joint committee and urged the state to act on recovery rate discrepancies.", "category": "Economy", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "f43d798e"}, {"headline": "Drone Drops Seven Kilograms of Explosives Near Rajasthan Border", "summary": "A drone from across the border dropped 7kg of explosives, two firearms, and 600 cartridges in Rajasthan’s Sriganganagar district. Two suspects from Punjab were arrested by the Anti-Narcotics Task Force. Investigators are probing whether the cache was meant for a terror plot or criminal networks during the festive season.", "category": "India", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "34e3b7fd"}, {"headline": "Air Ambulance Service to Launch on Major Maharashtra Highways", "summary": "The Maharashtra government plans to launch an emergency air ambulance service on the Mumbai-Nagpur, Pune-Mumbai, and Mumbai-Goa highways by early next year. The service aims to provide medical care to road accident victims during the 'golden hour'. A standard operating procedure is expected by November 15 to facilitate faster response times.", "category": "Infrastructure", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "3d432f17"}, {"headline": "Keralam Introduces India's First Rights Bill for Senior Citizens", "summary": "The Keralam government has introduced a bill to protect the rights of senior citizens and leverage their expertise in a 'silver economy'. The legislation aims to ensure care for the elderly as the state's demographic shifts toward an older population. The bill also proposes honorariums for retired professionals who mentor young entrepreneurs.", "category": "Politics", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "1bc6f7f7"}, {"headline": "Afghanistan Secures Dramatic Draw Against Bangladesh in Abu Dhabi Test", "summary": "Sediqullah Atal’s maiden Test century and a determined lower-order stand helped Afghanistan secure a dramatic draw against Bangladesh. Chasing a target of 479, Afghanistan finished at 346-8 after 142 overs. Qais Ahmad remained unbeaten on 49 to frustrate the Bangladesh bowlers on the final day, marking Afghanistan's highest fourth-innings total.", "category": "Sports", "page": 27, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140489", "sources": [{"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 27, "telegram_url": "https://t.me/c/1877410077/140489"}], "article_id": "641b89f9"}, {"headline": "Battle against ‘vote theft’ will go on, says Rahul", "summary": "Opposition leaders, activists, and students met to discuss continuing protests against the Chief Election Commissioner and the Special Intensive Revision (SIR) of electoral rolls. Rahul Gandhi stated that political resistance will continue and triumph, regardless of the institution involved.", "category": "Politics", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "01cda383"}, {"headline": "13 children killed in Bihar boat capsize", "summary": "At least 13 children died when a boat capsized in the Ganga river in Bihar's Vaishali district. Seven children were rescued, and their condition is stable. Rescue operations are ongoing.", "category": "India", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "2477303a"}, {"headline": "Delhi gets 150 electric buses, 13 new air monitoring stations", "summary": "Union Minister Bhupender Yadav and Delhi CM Rekha Gupta inaugurated 13 new air quality monitoring stations and flagged off 150 electric buses. The city now has 60 monitoring stations and 5,238 electric buses.", "category": "India", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "bbfee545"}, {"headline": "After route diversions, commuters face reduced DTC services", "summary": "Commuters in Delhi are facing disruptions due to protest-related diversions and the deployment of hundreds of DTC buses for police duty. Services have been reduced, causing inconvenience.", "category": "India", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "3e4af25d"}, {"headline": "Govt. makes Aadhaar mandatory to avail power subsidy scheme", "summary": "The Delhi government has made Aadhaar mandatory for domestic consumers to avail power subsidies. This move aims to simplify benefit delivery and promote transparency in the subsidy system.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "a5dc759a"}, {"headline": "AMU, Jamia students launch hunger strike over union elections", "summary": "Two Jamia Millia Islamia students began a hunger strike demanding the reinstatement of student union elections, which have not occurred since 2006. AMU recently reinstated elections after a similar protest.", "category": "Education", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "19a1418e"}, {"headline": "₹10-lakh cancer drugs ‘missing’ from hospital; FIR registered", "summary": "Four boxes of cancer drug injections, valued at ₹9 lakh to ₹10.8 lakh, went missing from Delhi State Cancer Institute. An FIR has been registered, and an internal inquiry is underway.", "category": "Health", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "b2620ba4"}, {"headline": "Khandu agrees to withdraw FIRs over Siang dam protest", "summary": "Arunachal Pradesh CM Pema Khandu agreed to reduce security personnel and withdraw FIRs registered during protests against the Siang dam project, facilitating dialogue.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140432"}], "article_id": "c796871f"}, {"headline": "Shivraj’s twin remarks fuel buzz of rift in M.P. BJP", "summary": "Former MP CM Shivraj Singh Chouhan's remarks, including a rebuke of CM Mohan Yadav, have fueled speculation of a rift within the Madhya Pradesh BJP. His comments are seen as a move to maintain relevance.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/140432", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 6, "telegram_url": " bstances. The murder has led to protests and vandalism by his supporters and sharp criticism of the ruling government's law and order.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140432"}], "importance": 8, "article_id": "ebad1777"}, {"headline": "India rejects China's objection to naming locations in Ladakh", "summary": "The Ministry of External Affairs reiterated that Ladakh is an integral and inalienable part of India, rejecting China's opposition to the standardization of 28 place names. India stated that the naming exercise was a routine administrative matter to facilitate accurate cartography and public awareness in the sensitive border region.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 9, "article_id": "e07e7b08"}, {"headline": "Canadian PM Mark Carney Invited as Republic Day Chief Guest", "summary": "India is discussing a possible visit by Canadian PM Mark Carney as the chief guest for Republic Day in January. During a phone call, PM Modi and Carney reaffirmed their commitment to doubling bilateral trade by 2030 and finalizing a Comprehensive Economic Partnership Agreement. The leaders also discussed regional security and AI.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 8, "article_id": "307b0859"}, {"headline": "Mumbai int'l flights shift to NMIA deferred till March '27", "summary": "The plan to move international flight operations from Mumbai airport to the new Navi Mumbai International Airport has been pushed back to March 2027. Authorities cited delays in infrastructure completion and airline scheduling requirements for the postponement.", "category": "Infrastructure", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "cc306f3a"}, {"headline": "Breaking Bad Actor RJ Mitte Dies at Age 34", "summary": "Actor RJ Mitte, famous for playing Walter White Jr. in the series 'Breaking Bad,' has died at the age of 34 in Texas. Mitte, who had cerebral palsy, was a prominent disability rights activist and spokesperson. Former co-star Bryan Cranston expressed deep despair over the death of his on-screen son.", "category": "Culture", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 5, "article_id": "5297b664"}, {"headline": "Supreme Court stays defamation trial against Rahul Gandhi", "summary": "The Supreme Court has stayed trial court proceedings in a criminal defamation case against Rahul Gandhi. The case involves remarks made by the Leader of the Opposition in 2018 regarding the Rafale deal. The court has issued notices to the Maharashtra government and the complainant, seeking responses within four weeks.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "importance": 7, "article_id": "4a0bf6f6"}, {"headline": "Nilekani Proposes Last-Minute Exam Paper Generation to Stop Leaks", "summary": "Nandan Nilekani, head of the task force on examination reforms, suggested generating question papers at the last minute from a massive digital bank to prevent leaks. He argued that fixed papers create economic incentives for theft. PM Modi is reportedly keen on implementing the panel's technology-driven overhaul for high-stakes exams.", "category": "Education", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 7, "article_id": "d76eb9a8"}, {"headline": "Kerala becomes first state to introduce comprehensive Elderly Care Bill", "summary": "The Kerala government has introduced the Keralam Senior Citizens (Care and Protection of Rights) Bill, 2026. This legislation makes Kerala the first Indian state to establish a comprehensive framework to protect the elderly from abuse and exploitation. The Bill also seeks to regulate elderly care centres and ensure better social security and healthcare access.", "category": "Health", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}], "importance": 6, "article_id": "b22aa77e"}, {"headline": "Nasa rover breaks record for off-planet driving on Mars", "summary": "NASA's Perseverance rover set a new record by driving more than 45 kilometers on Mars autonomously. This achievement demonstrates the potential for advanced robotic navigation in exploring the most challenging terrains of the Red Planet.", "category": "Science", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "bcd7fea5"}, {"headline": "Two Maldivian Pilots Arrested in UAE Over Alleged Hijack Plot", "summary": "UAE authorities have detained two Maldivian pilots employed by flydubai in connection with a suspected plot to hijack and crash a flight from Dubai to Tel Aviv. The arrests follow an incident where an Omani co-pilot allegedly attacked the Indian captain with an axe. Investigators are probing the extent of a possible larger conspiracy.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140509"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 8, "article_id": "7ac345c8"}, {"headline": "Tata Sons defends long-term semiconductor investment strategy", "summary": "Tata Sons Chairman N Chandrasekaran defended the group's ₹1.18 lakh crore investment in semiconductors, stating that long-term strategic value is more important than immediate returns. The group is building major manufacturing facilities in Dholera and Assam.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 9, "article_id": "617ae9f6"}, {"headline": "Hyundai commits $15.5 billion for India operations through 2032", "summary": "Hyundai Motor Group has pledged to invest $15.5 billion in India between 2026 and 2032. The investment will fund manufacturing capacity expansion, research and development, and local supplier ecosystems for both Hyundai and Kia. This follows the group's record ₹27,870 crore IPO and reaffirms India's position as one of its most strategic global markets.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Delhi ¹⁴¹⁰²⁰²⁶.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/140499"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140465"}], "importance": 9, "article_id": "815784e2"}, {"headline": "MDR on high-value UPI transactions postponed after Deepavali", "summary": "The National Payments Corporation of India (NPCI) has deferred the rollout of the merchant discount rate (MDR) on high-value UPI transactions above ₹2,000. Originally set for October 15, the 0.4% levy will now be implemented after the festival season following industry feedback.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140432"}], "importance": 8, "article_id": "dc2f0d9d"}, {"headline": "B.R. Shetty seeks $15 billion from Bank of Baroda", "summary": "NMC Healthcare founder B.R. Shetty has filed a $15 billion lawsuit against Bank of Baroda in the Bombay High Court. Shetty alleges that the bank's Abu Dhabi branch facilitated transactions linked to the fraud that collapsed his business empire. The suit claims the bank ignored anti-money laundering alerts and helped structure suspicious transactions.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140465"}], "importance": 7, "article_id": "5de39a7e"}, {"headline": "Tata Elxsi Q2 profit rises 10% to ₹170 crore", "summary": "Tata Elxsi reported a 10.1% increase in net profit to ₹170.30 crore for the second quarter ended September 2026. Revenue from operations grew by 15% to ₹1,055.66 crore, supported by strong performance in the transportation, media, and healthcare segments.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "36a0013e"}, {"headline": "Nilekani proposes computer-based testing to stop paper leaks", "summary": "Infosys co-founder Nandan Nilekani has proposed a secure computer-based testing infrastructure to prevent paper leaks in competitive exams. He suggested using AI to generate unique question papers just before an exam starts to minimize the risk of theft and fraud.", "category": "Education", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "175801d3"}, {"headline": "IMF raises India’s GDP growth forecast to 7% for FY27", "summary": "The International Monetary Fund has upgraded India’s economic growth forecast for 2026-27 to 7%, citing strong domestic demand and robust services activity. The IMF also raised the FY28 projection to 7%. In contrast, China’s growth outlook was lowered to 4.5% for 2026. The report notes that India remains a global standout despite energy shocks and uneven resilience elsewhere.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140465"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140509"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 9, "article_id": "71e77384"}, {"headline": "PNGRB proposes 5% hydrogen blending in piped gas", "summary": "The Petroleum and Natural Gas Regulatory Board has issued draft guidelines for blending 5% green hydrogen in piped natural gas for households. The move is part of India’s decarbonization strategy and aims to promote the use of clean energy in the domestic sector.", "category": "Environment", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "b8ff0008"}, {"headline": "Zoho defers annual pay hikes due to AI costs", "summary": "Zoho Corp has deferred its usual pay hike roll-out for employees, citing high costs associated with AI development and data centers. CEO Sridhar Vembu noted that a global economic slowdown and rising infrastructure expenses have impacted the company's profit margins.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 6, "article_id": "173548ea"}, {"headline": "Adani and Jabil sign deal for AI hardware manufacturing JV", "summary": "Adani Enterprises and Jabil have signed a non-binding agreement to form a 50:50 joint venture for manufacturing AI and data center equipment in India. The venture will produce servers, storage, liquid-cooling systems, and AI racks. It is designed as a multi-gigawatt platform to serve global hyperscalers as demand for computing infrastructure accelerates.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/140465"}], "importance": 8, "article_id": "743f706c"}, {"headline": "Adani Airport defers international flight shift plan for Mumbai", "summary": "Adani Airport Holdings has delayed its plan to move one-third of international flights from Mumbai's Terminal 2 to the new Navi Mumbai airport by five months. The delay followed resistance from 46 airlines regarding winter schedule disruptions. The transition will now begin with the summer schedule in late March, potentially pushing back Terminal 1 redevelopment projects.", "category": "Infrastructure", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_14-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/140472"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/140465"}], "importance": 7, "article_id": "936d0768"}, {"headline": "Mumbai International Airport defers international operations shift to summer", "summary": "The planned shift of international flight operations from Mumbai to the Navi Mumbai airport has been deferred by five months to the summer schedule. The decision follows protests from airlines against moving during the peak winter festive season. Adani-led MIAL has assured that historical slots will be protected during the Terminal 1 redevelopment process.", "category": "Infrastructure", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140432"}], "importance": 7, "article_id": "c15be5e2"}, {"headline": "PM Modi highlights 'Power to Empower' at Bloomberg forum", "summary": "Prime Minister Narendra Modi stated that India's focus in the 21st century is 'Power to Empower' through the sharing of technology, data, and innovation. Speaking at the Bloomberg New Economy Forum, he emphasized that India aims to grow with the world and not at the expense of others, citing the country's inclusive growth and digital public infrastructure.", "category": "India", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 9, "article_id": "200bc08a"}, {"headline": "Amit Shah Accuses Rahul Gandhi of Fabricating Lies Over Electoral Rolls", "summary": "Union Home Minister Amit Shah accused Rahul Gandhi of creating a 'disinformation campaign' regarding the special intensive revision (SIR) of electoral rolls to hide Congress's recent poll defeats. Shah stated the SIR process is essential for maintaining the integrity of the voter base and criticized the opposition for targeting constitutional institutions.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 8, "article_id": "b2103478"}, {"headline": "Karnataka Cabinet to review HC verdict on SC/ST quota", "summary": "The Karnataka Cabinet will examine the High Court's decision to quash the 2022 law that increased reservations for SC/STs to 56%. Deputy CM G Parameshwara stated the government will assess legal options, including a potential Supreme Court appeal. The ruling impacts recruitment and educational admissions already conducted under the enhanced quota.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/140489"}], "importance": 7, "article_id": "38d328d7"}, {"headline": "Trump doubts China and Russia are assisting Iran in conflict", "summary": "US President Donald Trump stated he does not believe China and Russia are providing significant help to Iran, suggesting they have 'too much to lose.' His comments follow reports that foreign entities supplied intelligence for attacks on US troops. Trump warned that direct weapon sales to Iran by these powers would lead to severe consequences from the US.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/140509"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/140432"}], "importance": 7, "article_id": "ba166bba"}, {"headline": "Australia defeats South Africa by 214 runs in opening Test", "summary": "Australia secured a 1-0 lead in the three-match series after Josh Hazlewood took 6/49 to bowl out South Africa for 206 on the final day. Despite a patient partnership between Aiden Markram and Wiaan Mulder, the home side's resistance ended before tea. Australia had earlier declared their second innings at 314/6 to set a challenging target.", "category": "Sports", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Times of India", "pdf_filename": "Bangalore_TOI_14-10-2026.pdf", "page": 27, "telegram_url": "https://t.me/c/1877410077/140489"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 14-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/140432"}], "importance": 7, "article_id": "141fc9e4"}, {"headline": "Fundamentum raises deeptech fund target to ₹3,500 crore", "summary": "Nandan Nilekani-anchored investment firm Fundamentum Frontier Advisors has increased the target for its maiden deeptech fund by ₹500 crore due to strong domestic demand. The firm is now eyeing ₹3,500 crore. The capital will target startups developing proprietary technologies, reflecting a shift in domestic growth investors moving toward capital-intensive deeptech sectors.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/140481"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_14-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/140465"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 14-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/140509"}], "importance": 7, "article_id": "b132ed21"}, {"headline": "Citi and Credendo close $328 million financing for IndiGo jets", "summary": "Citigroup and Belgian credit insurer Credendo have completed a $328 million financing deal for eight Airbus aircraft for IndiGo. This marks the world's first Credendo-insured aviation financing and the first ECA-led deal via GIFT City’s IFSC structure. The transaction supports IndiGo's fleet expansion while positioning India as a competitive global aircraft leasing hub.", "category": "Infrastructure", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_14-10-2026.pdf", "page": 17, "t const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
