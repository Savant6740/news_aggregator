.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131772"}], "article_id": "4c407c07"}, {"headline": "US intel warns Mojtaba Khamenei may pursue nuclear deterrence", "summary": "Intelligence reports from the US suggest that Mojtaba Khamenei, a leading contender to succeed Iran's Supreme Leader, may prioritize the development of nuclear weapons. Analysts believe he views nuclear capability as a vital tool for regime survival and a deterrent against foreign intervention. The report indicates he has significant support from Iran's elite military and security apparatus.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131772", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁶⁰⁷²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/131772"}], "article_id": "b53c9d72"}, {"headline": "Nepal to feature controversial map on new one-rupee coin", "summary": "Nepal's government has decided to issue a new one-rupee coin featuring a map that includes territories claimed by India. The move is expected to heighten diplomatic tensions between the two neighbors. Nepal claims the regions of Limpiyadhura, Lipulekh, and Kalapani as its own, while India maintains they are part of Uttarakhand. The issue remains a flashpoint in bilateral relations.", "category": "Politics", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131772", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁶⁰⁷²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/131772"}], "article_id": "5dc0d9ec"}, {"headline": "Hindalco reports 32% rise in consolidated net profit to ₹3,174 crore", "summary": "Hindalco Industries reported a 32% year-on-year increase in its consolidated net profit for the March 2024 quarter, reaching ₹3,174 crore. The growth was primarily driven by a strong performance in its copper business and stable margins in its subsidiary, Novelis. Revenue from operations remained steady at ₹55,994 crore compared to the previous year.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "e514759d"}, {"headline": "Steel manufacturers likely to hike prices in June amid rising costs", "summary": "Major Indian steel producers are considering price increases of ₹500 to ₹1,000 per tonne starting in June. The decision is influenced by the rising cost of coking coal and robust domestic demand. While global prices remain volatile, domestic infrastructure projects continue to drive consumption, prompting manufacturers to pass on higher input costs.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "03f724a0"}, {"headline": "Air India Express flight makes emergency landing after engine fire", "summary": "An Air India Express flight bound for Kochi made an emergency landing at Bengaluru airport on Tuesday night following a fire in one of its engines. All 179 passengers and six crew members were safely evacuated. The aircraft was mid-air when the fire was detected, prompting the pilots to return to Kempegowda International Airport immediately.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "3111216d"}, {"headline": "Adani Energy Solutions board to consider ₹12,500 crore fundraising plan", "summary": "Adani Energy Solutions has announced a board meeting to discuss a proposal for raising up to ₹12,500 crore through various modes, including a Qualified Institutional Placement. The funds are expected to support the company's expansion in power transmission and smart metering projects as part of the group's long-term capital expenditure strategy.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "3af5e69d"}, {"headline": "BHEL fourth quarter net profit declines 25% to ₹490 crore", "summary": "State-owned Bharat Heavy Electricals Ltd (BHEL) reported a 25% drop in consolidated net profit to ₹489.62 crore for the quarter ended March 2024. Despite a slight increase in total income to ₹8,416.84 crore, the decline in profit was attributed to higher operational and material expenses during the period.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "cbff14d4"}, {"headline": "Health Ministry issues heatwave advisory as temperatures cross 45 degrees", "summary": "The Union Health Ministry has issued a formal advisory to states and union territories as extreme heatwave conditions persist across North and Central India. The advisory mandates that health facilities ensure the availability of essential medicines, intravenous fluids, and cooling equipment to manage heat-related illnesses among the general public.", "category": "Health", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "51a864af"}, {"headline": "IMD forecasts early monsoon onset in Kerala by May 31", "summary": "The India Meteorological Department (IMD) expects the southwest monsoon to arrive at the Kerala coast by May 31. Atmospheric conditions over the Bay of Bengal are becoming favorable for the monsoon's progress. An early or timely monsoon is seen as a critical factor for the agricultural sector and for taming inflation related to food prices.", "category": "Environment", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "7d6dc2d2"}, {"headline": "Dedicated Freight Corridor trial run completed on New Khurja-Rewari section", "summary": "The Dedicated Freight Corridor Corporation of India (DFCCIL) successfully conducted a trial run on the 173-km New Khurja to New Rewari section. This section connects the Eastern and Western corridors, facilitating faster movement of coal and containers. The project aims to improve logistics efficiency and reduce freight transit times across North India.", "category": "Infrastructure", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "240e2558"}, {"headline": "Nykaa parent FSN E-Commerce reports nearly 300% jump in profit", "summary": "Nykaa's parent company reported a consolidated net profit of ₹9.07 crore for the fourth quarter, marking a 297% increase from the ₹2.3 crore reported a year ago. Revenue from operations grew by 28% to reach ₹1,668 crore. The growth was primarily led by the beauty and personal care segment, which saw strong demand during the period.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "ed187153"}, {"headline": "Gulf Oil Lubricants India Q4 profit rises 37% to ₹86 crore", "summary": "Gulf Oil Lubricants India reported a 37.3% increase in net profit to ₹86.26 crore for the quarter ended March 31. The company's revenue from operations saw a 9.7% rise, reaching ₹869.6 crore. Following the results, the board recommended a final dividend of ₹20 per equity share for the 2023-24 financial year.", "category": "Business", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "6422d4c7"}, {"headline": "SEBI proposes tighter oversight for AI-based high frequency trading", "summary": "The Securities and Exchange Board of India (SEBI) has released a consultation paper proposing stricter norms for algorithmic and high-frequency trading. The market regulator aims to enhance transparency by requiring traders to disclose the use of AI in their strategies and ensuring that technical safeguards are in place to prevent market disruptions.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "f9e464bd"}, {"headline": "Lenders move NCLT against Byju's regarding latest rights issue", "summary": "A group of overseas lenders for edtech firm Byju's has approached the National Company Law Tribunal seeking to block the company's $200 million rights issue. The lenders allege that the management is attempting to dilute their interests and mismanaging funds. The company continues to face severe liquidity challenges and legal battles with creditors.", "category": "Law", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "ef7d3dc1"}, {"headline": "Iran begins mourning for Raisi as interim president assumes office", "summary": "Iran has started five days of mourning following the death of President Ebrahim Raisi and the foreign minister in a helicopter crash. Interim President Mohammad Mokhber has been approved by the Supreme Leader to manage state affairs until elections are held in June. Global oil markets have remained stable despite the sudden political transition.", "category": "World", "page": 8, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "db8fe58b"}, {"headline": "Microsoft launches Copilot+ PCs with specialized AI processing chips", "summary": "Microsoft has introduced its new category of 'Copilot+ PCs' featuring hardware capable of processing over 40 trillion operations per second for AI tasks. These devices include features like 'Recall,' which records user activity to allow for easy searching of previous actions. The launch is a significant move to integrate AI directly into the Windows operating system.", "category": "Technology", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "e089813d"}, {"headline": "Sensex and Nifty end flat amid cautious global sentiment", "summary": "Domestic equity benchmarks Sensex and Nifty closed nearly flat on Tuesday. The Sensex fell 53 points to close at 73,953, while the Nifty settled at 22,529. Investors remained on the sidelines ahead of the US Federal Reserve's meeting minutes and quarterly results from AI giant Nvidia. Metal and banking stocks saw some profit booking.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "d821ea14"}, {"headline": "IIT Madras researchers develop indigenous IoT device for cold chain", "summary": "A research team at IIT Madras has developed 'VaxTrac,' an indigenous IoT-enabled device for real-time monitoring of temperature-sensitive items like vaccines. The device provides precise data during transit to prevent spoilage. This development is expected to reduce the dependency on imported sensors and improve the efficiency of India's medical supply chain.", "category": "Science", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "20a5d940"}, {"headline": "KKR crushes SRH to secure spot in IPL 2024 final", "summary": "Kolkata Knight Riders became the first team to enter the IPL 2024 final after a dominant eight-wicket win over Sunrisers Hyderabad in the first qualifier. Mitchell Starc took three wickets to restrict SRH to 159 runs. KKR chased the target with ease, led by unbeaten half-centuries from Venkatesh Iyer and Shreyas Iyer in Ahmedabad.", "category": "Sports", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131761", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131761"}], "article_id": "de8c14d5"}, {"headline": "Management Investor Expectations Diverge in IT Sector Over AI Growth", "summary": "Indian IT firms face a divide between bullish management rhetoric and skeptical investors. Despite claims that AI will drive growth, disappointing revenue guidance and shrinking margins at firms like TCS and Infosys have hurt stock performance. Markets remain cautious as structural shifts from legacy systems to digital-led services continue to unfold slower than anticipated.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "22599793"}, {"headline": "Protesters at Jantar Mantar Celebrate Education Minister Resignation as Major Victory", "summary": "Student activists and members of the Cockroach Janata Party celebrated at Jantar Mantar following Dharmendra Pradhan's resignation. Protesters viewed the move as a victory for democracy after a 36-day sit-in over exam irregularities. While celebrating, activists emphasized that their struggle for structural reforms in the national examination system continues.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "c6f7f58d"}, {"headline": "Aster DM Quality Care to Invest ₹1,315 Crore for Karnataka Expansion", "summary": "Aster DM Quality Care has announced an investment of ₹1,315 crore to expand its healthcare presence in Karnataka. The plan includes a 550-bed facility at Aster Hospital, Yelahanka, and a 460-bed expansion at Aster Whitefield. The company aims to strengthen its specialized care and medical education infrastructure as part of its long-term growth strategy in India.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "03e756e2"}, {"headline": "Heavy Rainfall and Floods Claim 35 Lives in Gujarat Regions", "summary": "At least 35 rain-related deaths have been reported in Gujarat over two days as heavy monsoon rains lashed the state. The Meteorological Department issued a red alert, forecasting extremely heavy rainfall in various districts. The Indian Army and rescue teams have been deployed to assist stranded citizens in affected areas, including Ahmedabad and Rajkot.", "category": "Environment", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "66356cbf"}, {"headline": "New 10% US Section 301 Tariff Pressures Indian Gems and Jewellery", "summary": "The US decision to impose a 10% additional tariff on Indian exports under Section 301 has raised concerns for the gems and jewellery sector. Unlike competitors like Belgium and Israel, who enjoy zero-duty access, Indian exports will face higher effective costs. The Gems and Jewellery Export Promotion Council noted that this move could impact the competitiveness of Indian diamonds.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "842b9fd3"}, {"headline": "PhonePe Reports 62% Increase in Net Loss Due to Business Expansion", "summary": "Fintech major PhonePe's consolidated net loss widened by 62% to ₹2,792 crore for FY26, driven by investments in new business segments including hyperlocal commerce, insurance, and stock trading. However, revenue grew 71% to ₹7,920 crore. The Walmart-backed firm previously deferred its IPO plans but is expected to revive them as financial performance improves.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "0e498dac"}, {"headline": "Chennai Metro Invites Bids for 15.46-km Expansion to Chengalpattu", "summary": "Chennai Metro Rail Ltd has initiated plans for a 15.46-km elevated corridor extending from Kilambakkam to Chengalpattu. The project, estimated to cost ₹9,335 crore, will feature 13 stations and provide vital connectivity to southern suburbs. CMRL has submitted a Detailed Project Report to the state government and invited bids for the project under Phase 2 expansion.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "1999850c"}, {"headline": "Isuzu Motors Signs 5-Year Shipping Pact with Kamarajar Port", "summary": "Isuzu Motors India has signed a five-year agreement with Kamarajar Port Ltd for the export of commercial vehicles. The pact includes preferential berthing and concessions on wharfage fees for Isuzu's export shipments. This collaboration aims to strengthen the company’s export operations from its manufacturing plant in Sri City, Andhra Pradesh, to global markets.", "category": "Infrastructure", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "411b1508"}, {"headline": "Indo-MIM IPO: Strong Long-Term Growth but Valuation Remains Rich", "summary": "Indo-MIM, a leader in metal injection molding, is launching its IPO with a price band of ₹461-485. The company serves global giants in aerospace, medical, and consumer electronics. While reporting a 21% revenue CAGR, the issue is valued at 44.6 times FY26 earnings. Analysts suggest long-term prospects are promising, though current valuations reflect much of the optimism.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "41f9275a"}, {"headline": "Lohia Corp IPO Faces Risks from Cyclical End-Market Exposure", "summary": "Lohia Corp is seeking to list its shares with an offer for sale from promoters. As a global supplier of machinery for technical textiles, the firm has seen steady revenue growth. However, analysts warn that the company is highly dependent on cyclical capital expenditure cycles in industries like agriculture and construction. The IPO valuation is approximately 22 times trailing earnings.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "77320539"}, {"headline": "Global Bond Yields Rise as Oil Prices Rebound Amid Middle East Tensions", "summary": "Global sovereign bond markets faced a sell-off as Brent crude oil prices rose toward $100 per barrel due to renewed Middle East hostilities. The 10-year US Treasury yield reached 4.45%, while German and UK yields also climbed. Markets are bracing for potential inflationary pressure from energy costs, which may influence upcoming monetary policy decisions by the Fed and ECB.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "ba4325e9"}, {"headline": "PFRDA Launches New Digital Tools to Simplify NPS Management and Grievances", "summary": "The Pension Fund Regulatory and Development Authority (PFRDA) has introduced two new digital tools: PRIDE-DISHA and Pension Sahayak. These tools are designed to help National Pension System (NPS) subscribers compare fund performance, track historical returns, and register grievances more efficiently. The initiative aims to enhance transparency for retirement savers.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "bece0eb8"}, {"headline": "US Election Tariffs May Impact Indian Generic Drug Manufacturers", "summary": "Potential changes in US trade policy, including proposed tariffs on generic drugs, could significantly affect Indian pharmaceutical companies. With Indian firms supplying 30-70% of generic exports to the US, a 200% tariff would disrupt current business models. Analysts suggest companies with US manufacturing or diversified global presence may be better insulated.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131749", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131749"}], "article_id": "eb1b116a"}, {"headline": "Centre to Table Enhanced Anti-Cheating Bill with Life Imprisonment Penalties", "summary": "Union Minister Jitendra Singh will introduce the Public Examinations (Prevention of Unfair Means) Amendment Bill, 2026, in the Lok Sabha. The proposed law introduces mandatory two-month investigation deadlines and penalties up to ₹10 crore for organized crime networks. It also establishes Special Fast Track Courts to resolve cases within three months of a chargesheet being filed.", "category": "Law", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "421f1623"}, {"headline": "U.S. Senate Bill Proposes Three-Year Pause on New H-1B Visas", "summary": "U.S. Senator Tim Sheehy has introduced the 'End H-1B Abuse Act' seeking a three-year moratorium on new H-1B visa issuances. The Bill also aims to codify a $100,000 fee for obtaining the visa, a measure previously struck down by a federal court. The senator argued the program is being used to undercut American workers' rights and displace them with cheaper foreign labor.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "3afd9a96"}, {"headline": "U.S. 10% Forced Labour Tariffs Won't Affect 45% of Indian Exports", "summary": "The Centre stated that 45% of India's exports to the U.S. will remain outside the purview of new 10% tariffs aimed at goods made with forced labour. Items like generic pharmaceuticals and smartphones currently attract zero duties. The government is also negotiating a quota-based system for textile exports as part of a bilateral trade agreement to mitigate the impact on the remaining 55%.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "03f5f27c"}, {"headline": "Gujarat Flood Toll Rises to 35 as Rescue Operations Conclude", "summary": "The death toll from heavy rain and flooding in Gujarat has reached 35 over the past two days. Most fatalities were due to drowning or victims being swept away by strong currents in Navsari and Valsad. Authorities have relocated over 42,000 residents and deployed 18 NDRF teams. Damage assessment for crops and infrastructure has begun as floodwaters recede in several districts.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "76574198"}, {"headline": "Saudi Arabia-U.S. Civil Nuclear Deal Contingent on Normalizing Israel Ties", "summary": "The U.S. and Saudi Arabia signed a civil nuclear cooperation agreement to build the kingdom's nuclear sector. However, President Donald Trump stated the 30-year deal is contingent on Saudi Arabia joining the Abraham Accords to normalize relations with Israel. The deal allows for uranium enrichment on Saudi soil but requires strict bilateral safeguards to prevent weapons development.", "category": "World", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "122f6ec3"}, {"headline": "India Set to Roll Out Common Customer ID for Financial Services", "summary": "Indian banks and insurers are launching the Central Know-Your-Customer (CKYC) 2.0 system in August. The framework allows customers to access multiple financial products without repeatedly submitting identification documents. Data will be fetched from a central registry with customer consent. Asset managers and capital market firms are expected to join the common identification system later this year.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "112b079e"}, {"headline": "Urban Diets Linked to Gut Microbiome Changes and Diabetes in India", "summary": "A study in 'Gut Microbes' found that urban food habits in India are significantly altering gut microbiomes, potentially driving the rise in lifestyle diseases. Researchers found that city dwellers have higher levels of 'Megamonas' bacteria, linked to processed foods and obesity, compared to their rural relatives. India currently has approximately 89.8 million adults living with diabetes.", "category": "Health", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "11b3b559"}, {"headline": "Centre Rejects Metro Rail Proposals for Madurai and Coimbatore Again", "summary": "The Ministry of Housing and Urban Affairs has ruled out Metro Rail projects for Madurai and Coimbatore for a second time. The Centre recommended implementing Bus Rapid Transit Systems (BRTS) instead, stating that Metro Rail may not provide significant time savings or meet high ridership requirements. The Tamil Nadu government had argued that both cities are major industrial and tourist hubs.", "category": "Infrastructure", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "b6faf5c4"}, {"headline": "Judge Anu Grover Baliga Takes Charge of Special Paper Leak Court", "summary": "Special Judge Anu Grover Baliga has taken charge of the designated fast-track court at the Rouse Avenue District Court complex. The court was established to specifically handle criminal cases related to paper leaks and unfair means in public examinations. The trial of 13 accused in the NEET-UG 2026 case is expected to be transferred to this newly formed judicial body.", "category": "Law", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "7f91ba88"}, {"headline": "Congress Slams Nicobar Project as 'Commercial Enterprise' Masked as Strategic", "summary": "Congress MP Jairam Ramesh rejected the Defence Ministry's claim that the Great Nicobar Island Project is a vital national security initiative. Ramesh labeled it a 'commercial enterprise,' noting that 95% of the budget is for a trans-shipment port and tourism hub rather than defense. He cited environmental concerns, including the felling of forest-covered hills and impact on tribal lands.", "category": "Environment", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "58e1136b"}, {"headline": "Lucknow Authority Demolishes Coaching Building After Fire Kills 15", "summary": "The Lucknow Development Authority (LDA) began the demolition of a four-storey building where a fire killed 15 people last month. Officials found the structure was originally sanctioned for residential use but was illegally converted into a commercial coaching centre with unauthorized additional floors. Roads around the Aliganj site were barricaded as bulldozers cleared the illegal construction.", "category": "Infrastructure", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "501d5133"}, {"headline": "Over 33 Lakh Electors Omitted in Haryana Special Revision Phase 1", "summary": "Haryana’s Chief Electoral Officer announced that over 33 lakh names were not recorded during the first phase of the Special Intensive Revision (SIR). Reasons for omission included permanent relocation, death, or duplicate entries. Draft electoral rolls are set to be published on July 31. Out of 2.06 crore enumeration forms distributed, only 1.72 crore have been digitized so far.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "3ab0ecb9"}, {"headline": "Ex-Chhattisgarh PSC Chairman Arrested by ED in Paper Leak Case", "summary": "The Enforcement Directorate arrested former Chhattisgarh Public Service Commission chairman Taman Singh Sonwani on money laundering charges. The investigation involves allegations of rigging state service examinations in 2020 and 2021 to benefit relatives and candidates who paid bribes. The ED claims bribes were laundered through a family-controlled samiti under the guise of CSR donations.", "category": "Law", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "986d796a"}, {"headline": "Stalin Urges CM Vijay to Abandon Cauvery Water Talks with Karnataka", "summary": "DMK president M.K. Stalin has urged Tamil Nadu Chief Minister C. Joseph Vijay to reconsider his decision to visit Karnataka for Cauvery water talks. Stalin argued the visit would be an 'eyewash' as Karnataka's proposed Mekedatu dam violates Supreme Court orders. He asserted that direct talks would only prolong the dispute and dilute Tamil Nadu's established legal rights over the water.", "category": "Politics", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "4a9df521"}, {"headline": "India's Rice Fields Identified Among Global Hotspots for Methane Emissions", "summary": "A study in 'Nature Food' found that global greenhouse gas emissions from paddy fields have doubled since the 1960s. Paddy fields in eastern India were identified as significant methane hotspots due to continuous irrigation and nitrogen fertilizer use. Researchers suggest a 10% reduction in emissions is possible through improved irrigation, reduced tillage, and crop diversification.", "category": "Environment", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "0cdae129"}, {"headline": "Delhi Police Likely to Withdraw FIRs Against Student Protesters", "summary": "Following the withdrawal of the 36-day Jantar Mantar protest, Delhi Police are expected to drop all FIRs registered against the agitators. Officials had identified at least 2,500 people for various offenses using facial recognition systems. At least 15 FIRs, including charges of rioting and voluntarily causing hurt, were filed during the long-standing demonstration against paper leaks.", "category": "Law", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "89eaf1e1"}, {"headline": "Houthi Rebels Strike Saudi Oil Facilities Following Hodeida Airstrikes", "summary": "Yemen's Houthi rebels launched missiles and drones at Saudi Aramco facilities in Yanbu and Jizan. The group stated the attack was a response to Saudi airstrikes on the strategic port city of Hodeida. While Saudi Arabia reported multiple alerts, no immediate casualties were confirmed. The escalation threatens to further disrupt global shipping routes through the Bab el-Mandeb Strait.", "category": "World", "page": 16, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "63bf4f67"}, {"headline": "Sikkim Tunnel Disaster Kills 25 Workers Due to Methane Explosion", "summary": "An explosion caused by suspected trapped methane gas killed 25 workers in an under-construction tunnel of the Teesta Stage VI Hydropower Project in Sikkim. Toxic gases were released when drilling hit pockets of embedded gas in the fragile Himalayan rock. The state government has formed a high-level committee to investigate the tragedy at the NHPC project site in Namchi district.", "category": "Infrastructure", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "5b861f57"}, {"headline": "West Bengal Government Tables 28 Pending CAG Audit Reports", "summary": "The BJP-led government in West Bengal tabled 28 long-pending Comptroller and Auditor General (CAG) reports in the Assembly. The reports, covering fiscals 2020-21 to 2024-25, flag deficiencies in the Swasthya Sathi health scheme and irregularities in Cyclone Amphan relief. Finance Minister Swapan Dasgupta alleged the previous administration committed a constitutional lapse by withholding them.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "b160a168"}, {"headline": "Munnar Tea Firm Deploys Drones to Transport Harvested Leaves", "summary": "Harrisons Malayalam Limited has successfully conducted trials using drones to transport freshly harvested tea leaves from fields to processing factories in Munnar. The initiative aims to reduce fuel costs and labor-intensive logistics. Drones with a capacity of 40-50 kg can transport loads over 5-10 km, marking a significant technological shift for Kerala's traditional plantation sector.", "category": "Technology", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "094e3139"}, {"headline": "Ancient Genomes from Ladakh Cave Reveal Lost Himalayan Population", "summary": "A study in 'Science Advances' reported genome-wide data from 10 individuals found in a Kargil cave, dating back 1,500 years. The findings reveal a genetic mix of North Indians and ancient Tibetans that occurred roughly 2,800 years ago. The discovery provides the oldest evidence of ancestral North Indian ancestry in the region and sheds light on pre-Buddhist burial practices in Ladakh.", "category": "Science", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "8215748e"}, {"headline": "Amarnath Yatra Resumes via Baltal Axis Following Weather Improvement", "summary": "The Amarnath Yatra resumed from the Baltal axis in central Kashmir after a six-day halt due to inclement weather. A batch of 6,269 pilgrims arrived at the base camp as repairs continue on the Pahalgam route. Meanwhile, officials reported that J&K received 324% more rainfall than normal in the past week, erasing the seasonal deficit but causing localized flooding.", "category": "Culture", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "059486c3"}, {"headline": "PhonePe Reports FY26 Revenue Growth to ₹7,920 Crore", "summary": "Consolidated revenue from operations for digital payments firm PhonePe rose 11.47% to ₹7,920 crore in FY26. The company noted that revenue from UPI Digital Incentives was not recognized this fiscal year as funds are yet to be released by the government. On a normalized operational basis, the firm reported a net loss of ₹1,377 crore while maintaining strong top-line momentum.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131728", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 26-07-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131728"}], "article_id": "490e4517"}, {"headline": "Delhi High Court Rules Pavement Sleepers Are Not Contributory Negligent", "summary": "The Delhi High Court set aside a tribunal's decision to deduct 50% compensation for accident victims killed while sleeping on a pavement. The court ruled that the entire responsibility lies with the driver who drove onto a space reserved exclusively for pedestrians. Justice Anish Dayal observed that homeless persons use pavements due to compelling circumstances and are not liable for negligence.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "940bab39"}, {"headline": "Proposed Bill Mandates Three Month Deadline for Paper Leak Case Appeals", "summary": "The Public Examinations (Prevention of Unfair Means) Amendment Bill proposes a three-month deadline for high courts to dispose of appeals against orders from special fast-track courts. The bill aims to make investigations and the judicial process time-bound. It also suggests increasing the minimum jail term for individuals involved in paper leaks to five years and up to ten years for organized crime.", "category": "Law", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "adbc9c94"}, {"headline": "ED Accuses Gameskraft of Laundering 19,984 Crore Through Rummy Platforms", "summary": "The Enforcement Directorate has accused online gaming company Gameskraft and its founders of laundering Rs 19,984 crore earned through fraudulent practices. The agency alleges the firm used software bots to play against users on real-money rummy platforms while earning 10-15% commissions. Assets worth Rs 2,401 crore have been attached, and the ED has moved to initiate criminal proceedings.", "category": "Business", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "9e07e33d"}, {"headline": "Zelensky Claims Russia Preparing 30,000 North Korean Troops for War", "summary": "Ukrainian President Volodymyr Zelensky stated that Russia is preparing to deploy 30,000 North Korean troops to the frontline. He noted that preparations have been underway in Russia’s Voronezh region to receive the personnel under a mutual defense pact. This follows the earlier deployment of 14,000 North Korean soldiers to the Kursk region to support Russian military operations in Ukraine.", "category": "World", "page": 26, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "d881bf0f"}, {"headline": "South Korean Chipmakers Sign 950 Billion Dollar Supply Deals with US", "summary": "Memory chip giants Samsung Electronics and SK hynix will supply US tech firms, including Nvidia and OpenAI, in agreements valued at $950 billion. The deals were confirmed as South Korean leadership visited San Francisco for cooperation talks. These partnerships aim to fuel the rapidly evolving artificial intelligence industry through the supply of high-performance memory chips and components.", "category": "Business", "page": 26, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "4cf3ad7c"}, {"headline": "Karnataka BLOs Given Power to Rectify Voter Mapping Errors Digitally", "summary": "Karnataka’s Chief Electoral Officer Anbuk Kumar announced that Booth Level Officers can now edit and correct mapping errors during the voter enumeration process. The move follows concerns from civil society groups regarding incorrect mappings and a backlog of 1 crore voter records pending digitisation. BLOs have been granted an edit option to ensure accuracy ahead of the August 8 deadline.", "category": "Politics", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "da2f4482"}, {"headline": "Karnataka CM Defends Proposal for Private Schools to Adopt Rural Schools", "summary": "Chief Minister D K Shivakumar defended a proposal for financially strong private schools to adopt rural government schools using CSR funding. He clarified that the initiative aims to improve educational quality and will not apply to all institutions. Despite pushback from some private school managements, the government maintains that the agreements are voluntary and aimed at rural development.", "category": "Education", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "d5a439f1"}, {"headline": "PMK Founder S Ramadoss Retires from Politics Handing Control to Son", "summary": "PMK founder S Ramadoss announced his retirement from active politics on his 88th birthday. He handed over full control of the party to his son and PMK president Anbumani Ramadoss. Citing health reasons, the senior leader stated he would no longer interfere in political matters or speak publicly on politics, ending a decades-long career in the landscape of Tamil Nadu politics.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "afb81ee3"}, {"headline": "PIO Arrested in Canada for Murder of 23-Year-Old Punjab Woman", "summary": "Canadian police arrested Ritish Kumar for the murder of his 23-year-old partner, Damanpreet Kaur, in Edmonton. Kaur, originally from Lal Kalan in Ludhiana, was found dead in her residence. Her native village has launched a crowdfunding campaign to repatriate her body to India. The Edmonton police confirmed that an adult male was taken into custody shortly after the incident occurred.", "category": "World", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "eeacbe5b"}, {"headline": "Karnataka Logs 72 Percent Attendance via New Facial Recognition Application", "summary": "Attendance for 72.4% of students in Karnataka’s government and aided schools is now being recorded via the new 'Nirantara' facial recognition app. The system aims to provide accurate daily tracking, identify absentees, and ensure transparency in student-focused programs. Over 2.3 lakh students have been registered so far, although some teachers reported technical issues during the rollout.", "category": "Technology", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "7ec91bab"}, {"headline": "Government Engaged with US for Concessional Access for Textile Goods", "summary": "India is negotiating a mechanism with the US for concessional access for textile goods. The Commerce Department noted that 45% of Indian exports, including generics and smartphones, remain outside the scope of new 10% tariffs imposed for failure to check forced labour. India has been placed in a lower tier of additional tariffs, providing a relative advantage over other covered economies.", "category": "Business", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "8891aaad"}, {"headline": "High Court Restrains Panchayat from Stopping Kinnaur Kailash Yatra", "summary": "The Himachal Pradesh High Court directed the continuation of the Kinnaur Kailash Yatra and restrained the Powari gram panchayat from interfering. The panchayat had passed a resolution to stop the pilgrimage permanently and dissolve the organizing committee, citing environmental concerns. The court’s order ensures the yatra continues through its scheduled date of July 30.", "category": "India", "page": 19, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "bae75739"}, {"headline": "Two Jodhpur Doctors Suspended for Wrong Blood Group Transfusion Negligence", "summary": "The Rajasthan government suspended two resident doctors and terminated a lab technician at Jodhpur’s Umaid Hospital after a post-partum woman was given the wrong blood group. The 24-year-old patient developed kidney complications after being transfused with B-positive blood instead of O-positive. An inquiry found negligence at three levels, including ward staff and the blood bank technician.", "category": "Health", "page": 21, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "26ce19f5"}, {"headline": "Varanasi Teacher Booked for Branding Nursery Student with Hot Knife", "summary": "A play school teacher in Varanasi has been booked for allegedly branding a five-year-old student’s private part with a hot knife after the child urinated in his pants. The child’s parents filed a complaint after noticing a blister. While a hospital report did not initially confirm a burn injury, police are investigating the teacher and school authorities for the alleged assault.", "category": "India", "page": 19, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "c8b6150c"}, {"headline": "US Court Refuses to Pause Ruling Scrapping 100,000 Dollar H-1B Fee", "summary": "A US federal appeals court refused to stay a lower court's order that struck down the Trump administration's $100,000 H-1B visa application fee. The court held that the government failed to show it was likely to succeed on appeal, noting that Congress must expressly authorize such fees. Employers preparing applications now have immediate relief from the controversial additional payment.", "category": "Law", "page": 26, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 26, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "5bbb7ed6"}, {"headline": "Bengaluru India Nano Summit to Focus on AI and Tech Innovation", "summary": "The 14th edition of Bengaluru India Nano summit will be held from August 3 to 5, focusing on the convergence of nanotechnology and artificial intelligence. The event aims to accelerate the commercialisation of research through international collaborations. It is expected to attract 1,000 delegates and 80 speakers, showcasing frontier research and globally competitive tech products.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "1c529f9a"}, {"headline": "Reviving Nanjangud’s Iconic Rasabale Banana Through Science and Biocontrol", "summary": "Cultivation of Karnataka’s GI-tagged Rasabale banana is rebounding after being nearly wiped out by Panama wilt disease. Using organic methods and biocontrol agents from the NRCB, cultivation has expanded from 13 to 300 acres in Nanjangud taluk. Recent exports to the Maldives have encouraged farmers, while the state government plans a 'Rasabale Habba' to promote the premium fruit.", "category": "Science", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "ccca0e90"}, {"headline": "Karnataka Second in Government Dialysis Centres but Emergency Access Gaps Persist", "summary": "Karnataka now has 214 government dialysis centres, the second-highest in India. However, patients in Bengaluru report significant hurdles in accessing emergency dialysis, as state centres primarily offer routine maintenance sessions. Families often face delays as government hospitals require overnight admission for emergency procedures, a protocol that private hospitals frequently bypass.", "category": "Health", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "5603f02d"}, {"headline": "Naturals Salon Chain Reaches 1,000 Outlet Milestone Focusing on Women Entrepreneurs", "summary": "India’s Naturals salon chain has crossed the 1,000-salon milestone, with over 80% of its network owned and managed by women franchise partners. Founder Veena K stated the brand’s mission is to foster financial independence for women. The chain is now investing in AI-powered customer experiences and plans to expand into international markets and premium grooming segments over the next decade.", "category": "Business", "page": 44, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131801", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore + Times 26-07-2026.pdf", "page": 44, "telegram_url": "https://t.me/c/1877410077/131801"}], "article_id": "589691aa"}, {"headline": "OpenAI rogue agent hack goes undetected for several days", "summary": "OpenAI has disclosed a security breach where a hacker accessed internal staff discussions about the company's AI technologies. The intrusion, which took place in July 2023, was not discovered for a week. While no source code or customer data was stolen, the incident has sparked internal alarms about security protocols and the potential for AI models to be compromised by bad actors.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "77c814cd"}, {"headline": "Premium car buyers shift preferences toward electric and hybrid models", "summary": "High-margin premium car segments in India are seeing a sharp shift toward electrified vehicles. In the first half of 2024, nearly one in two passenger vehicles priced above Rs 30 lakh was an electric, hybrid, or plug-in hybrid model. Carmakers are redrawing product strategies to meet this growing demand for sustainable luxury transport as infrastructure continues to expand across India.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "d81d38d8"}, {"headline": "PhonePe losses surge 62% in FY26 despite 11% revenue growth", "summary": "Walmart-owned fintech major PhonePe reported a 62% increase in net loss to Rs 2,792 crore for the last fiscal year. The widened loss is attributed to higher expenses and a slowdown in revenue growth, which stood at 11% for the period. Despite the losses, the company saw growth in its payment and financial services verticals, though marketing costs continued to weigh heavily on its bottom line.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "e6ee5035"}, {"headline": "45% of Indian exports to US exempt from Section 301 tariffs", "summary": "An estimated 45% of India's exports to the US are currently outside the scope of the 10% tariff bracket under Section 301. The government is continuing negotiations with the US to exempt the remaining exports, which were initially proposed for higher duties. Key sectors like textiles, aluminum, and auto parts remain under scrutiny as both nations discuss labor and environmental concerns.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "6e4fb733"}, {"headline": "Heroin addiction spreads across Assam-Arunachal border as trafficking intensifies", "summary": "The Northeast has become a victim of its own geography as heroin addiction takes a firm hold on communities along the Assam-Arunachal border. Once a transit route for the Golden Triangle, the region now faces a local health crisis with over Rs 2,000 crore worth of drugs seized recently. Poverty and unemployment are driving youth toward both use and the distribution network for 'brown sugar'.", "category": "India", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "dc0f83b2"}, {"headline": "Police clash with protesters in Delhi: 130 cops and 65 students injured", "summary": "Clashes between police and students protesting the NEET-UG paper leak resulted in injuries to 130 police personnel and 65 students. At least 15 FIRs have been registered in connection with the violence at Jantar Mantar. Authorities used facial recognition technology to identify 'anti-social elements' among the protesters, while student leaders alleged excessive use of force by the police.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "ad729b65"}, {"headline": "Modi government's tactical retreat on NEET seen as political recovery strategy", "summary": "The resignation of Dharmendra Pradhan and the acceptance of student demands are viewed as a tactical rollback by the BJP to mitigate political damage. Facing upcoming assembly elections in states like Haryana and Maharashtra, the party aims to prevent the agitation from turning into a nationwide movement similar to the farm law protests. This move highlights a focus on voter sentiment.", "category": "Politics", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "280e636a"}, {"headline": "Assam STF busts terror module linked to Pakistan-based network", "summary": "The Special Task Force of Assam Police arrested three individuals in Dhubri linked to a terror module operated by Shahzad Bhatti from Pakistan. The module was involved in radicalization, recruitment, and the establishment of sleeper cells. Seized items include mobile phones, SIM cards, and incriminating documents. The network reportedly used encrypted channels for communication with handlers.", "category": "India", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "2e7e4682"}, {"headline": "IRDAI chairman pushes for affordable and accessible insurance for all", "summary": "IRDAI Chairman Debasish Panda has called for the insurance industry to prioritize 'Insurance for All' by making products more affordable and accessible. He emphasized the need for transparency and a customer-centric approach to increase penetration across different segments of society. The regulator is working on incentives to encourage innovative products linked to quality of service.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "c109831c"}, {"headline": "Arunachal government proceeds cautiously with Siang river dam study", "summary": "The Arunachal Pradesh government is taking a balanced approach to the proposed Siang Upper Multipurpose Project, considering China's dam construction upstream. Chief Minister Pema Khandu stated that the project is vital for India's water and energy security but will not be rushed without addressing the concerns of local communities. Over 2,000 households across 48 villages are involved.", "category": "Infrastructure", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "6556301a"}, {"headline": "South India becomes major growth hub for the hospitality industry", "summary": "South India is emerging as a preferred destination for hospitality investments, driven by spiritual tourism and religious sites. States like Andhra Pradesh, Karnataka, and Tamil Nadu are seeing high demand for luxury and boutique properties. Hotel chains like ITC, Taj, and Hyatt are expanding their presence in regional hubs to cater to the growing influx of domestic and international travelers.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "ee20f66b"}, {"headline": "Gen Z uses short-form video content to mobilize student protests", "summary": "The recent student agitations against the NEET-UG paper leak saw heavy use of Instagram Reels and YouTube Shorts to document events and spread messages. Student activists utilized creative parody, humor, and on-ground reporting to engage a wider audience. This shift toward social media-driven activism has changed how political messages are consumed and shared by India's younger generation.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "9885609a"}, {"headline": "Millennials and Gen Z face deep anxiety over aging parents", "summary": "A growing trend of 'anticipatory grief' is being observed among Indian millennials and Gen Z adults who are increasingly preoccupied with the health and eventual death of their parents. Many are making radical life choices, such as quitting jobs or ending relationships, to be closer to their elderly parents. This cultural shift reflects changing family dynamics and a lack of support systems.", "category": "Culture", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "055ffc06"}, {"headline": "Rise of 'UpLit' literature offers healing and hope to readers", "summary": "The publishing industry is seeing a surge in 'UpLit' or uplifting literature, which focuses on kindness, community, and emotional healing. Popularized by Japanese and Korean translated fiction like 'Days at the Morisaki Bookshop', these stories offer a refuge from the stresses of modern life. Readers are increasingly seeking books that provide comfort and a sense of connection in uncertain times.", "category": "Culture", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "b0268bc7"}, {"headline": "Face fitness and facial massage emerge as new beauty trends", "summary": "Facial exercise and specialized massage techniques, often termed 'face fitness', are gaining popularity in urban India as non-invasive alternatives to aesthetic procedures. Founders of specialized studios say the practice helps in muscle toning and lymphatic drainage. While results are still being studied, the trend highlights a broader shift toward holistic and natural wellness routines.", "category": "Health", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "658896b9"}, {"headline": "The cultural impact of biopics and actor resemblance on screen", "summary": "A debate on whether actors need to physically resemble the public figures they portray has been sparked by recent biopic announcements in Indian cinema. While some filmmakers prioritize prosthetic-led similarity, others focus on capturing the essence of the character. The discussion highlights the evolving expectations of audiences who are increasingly familiar with the real-life figures.", "category": "Culture", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "01416ba8"}, {"headline": "Legacy of S. Janaki: The Nightingale of South Indian music", "summary": "Veteran playback singer S. Janaki, known for her versatile voice and mastery over multiple languages, continues to be celebrated as a cultural icon. Despite retiring from professional singing, her contribution to Indian cinema over six decades remains unparalleled. Fans and critics alike emphasize that her recognition should transcend regional boundaries to reflect her national significance.", "category": "Culture", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "65ef296e"}, {"headline": "Slogan T-shirts return as a medium for political and social activism", "summary": "The classic slogan T-shirt has seen a resurgence in India as a tool for political expression, particularly during recent student protests. Historically used by activists like Vivienne Westwood and Katherine Hamnett, the garment allows individuals to wear their beliefs. Modern iterations are being used to demand accountability and spark conversations on social media and on the streets.", "category": "Culture", "page": 6, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "3a20b8c8"}, {"headline": "Trump mocks journalists at rescheduled White House Correspondents' Dinner", "summary": "Donald Trump attended a rescheduled White House Correspondents' Dinner event where he delivered a characteristic speech filled with humor and sharp critiques of the news media. He revisited his usual grievances against specific journalists and joked about his political future. The event, which had been postponed since April, served as a platform for Trump to rally his supporters.", "category": "World", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "9ec6aecd"}, {"headline": "Flavio Bolsonaro pushes for Brazil presidency as father remains ineligible", "summary": "Flavio Bolsonaro, son of former Brazilian President Jair Bolsonaro, is preparing for a potential presidential bid. With his father currently barred from holding office until 2030, Flavio is positioning himself as the successor to the conservative movement. He is reportedly seeking to build alliances with centrist parties to strengthen his campaign ahead of the upcoming elections.", "category": "World", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "7e5e1b1d"}, {"headline": "Israeli PM Netanyahu scheduled to visit US for high-level meetings", "summary": "Israeli Prime Minister Benjamin Netanyahu is set to visit the United States next week for discussions with top officials. The visit comes amid ongoing regional tensions and domestic political developments in both nations. Key topics of discussion are expected to include bilateral security cooperation, the situation in the Middle East, and broader diplomatic efforts in the region.", "category": "World", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "3ae63bc8"}, {"headline": "Monk fruit and stevia gain popularity as natural sugar alternatives", "summary": "Consumer interest in natural, zero-calorie sweeteners is growing, with monk fruit and stevia emerging as frontrunners. Food companies are reformulating products to cater to diabetic-friendly and health-conscious markets. However, health experts warn that simply replacing sugar is not enough; a broader change in dietary habits and reducing the overall craving for sweetness is essential.", "category": "Health", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "1f7680be"}, {"headline": "Minionese: The artificial language behind the global movie phenomenon", "summary": "The gibberish-like language spoken by the Minions, known as 'Minionese', is a carefully constructed blend of multiple languages including English, Spanish, and French. Created by Pierre Coffin, the language is designed to be universally understood through phonetics and physical comedy. Its success has sparked interest in the linguistics of fictional languages in pop culture.", "category": "Culture", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "26da3b7c"}, {"headline": "Miniature art hobby sees resurgence during pandemic-induced shutdowns", "summary": "The art of creating miniatures has experienced a significant revival as people sought creative outlets during pandemic lockdowns. Hobbyists are using social media to share intricate dollhouses and tiny dioramas, with over three million posts on Instagram under related hashtags. The hobby is praised for providing a sense of control and nostalgia in an increasingly unpredictable world.", "category": "Culture", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "7dc7de92"}, {"headline": "Hemingway's 'The Sun Also Rises' and Pamplona bull run turn 100", "summary": "This year marks the centenary of Ernest Hemingway's first visit to the San Fermin festival in Pamplona, which inspired his classic novel 'The Sun Also Rises'. The book brought international fame to the Spanish bull-running tradition. Today, the festival remains a major draw for tourists, though it continues to face scrutiny over animal welfare and safety concerns.", "category": "Culture", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131756", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_26-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131756"}], "article_id": "b24fa1b6"}, {"headline": "History of food tasting: From royal courts to modern VIP security", "summary": "The practice of food tasting to prevent poisoning has evolved from ancient royal courts to modern-day high-security details for world leaders. While historically aimed at detecting lethal toxins, modern protocols also focus on food safety and hygiene. The history of foo
