<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

d": "d2f844f7"}, {"headline": "ISRO to conduct third reusable launch vehicle experiment in June", "summary": "The Indian Space Research Organisation (ISRO) is preparing for the third landing experiment of its reusable launch vehicle, 'Pushpak'. The mission will test the vehicle's autonomous landing capability under high-speed, off-nominal conditions. This technology is critical for ISRO's goal of drastically reducing the cost of satellite launches in the future.", "category": "Science", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132849", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132849"}], "article_id": "9b8060f2"}, {"headline": "Kolkata Knight Riders secure spot in IPL 2024 final match", "summary": "Kolkata Knight Riders (KKR) defeated Sunrisers Hyderabad by eight wickets in Qualifier 1 to become the first team to enter the IPL 2024 final. Mitchell Starc's opening spell of 3-34 helped restrict Hyderabad to 159. KKR chased the target in just 13.4 overs, marking their fourth final appearance in the tournament's history.", "category": "Sports", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132849", "sources": [{"newspaper": "Financial Express", "pdf_filename": "Bangalore_FE_05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132849"}], "article_id": "cf476e38"}, {"headline": "Qatar, US see progress in talks to end Iran war", "summary": "Qatari mediators report progress in talks between the US and Iran, aiming to restore traffic through the Strait of Hormuz. International oil prices fell by 4% following news of a possible arrangement. However, Tehran denied US claims that talks were already under way.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "6895bada"}, {"headline": "25 US states challenge Trump’s Section 301 tariffs", "summary": "A coalition of 25 US states has launched a legal challenge against President Trump’s efforts to impose tariffs on 60 countries, including India. The lawsuit argues that the administration lacks the legal authority to unilaterally impose such broad levies without congressional approval.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "1c62c0a1"}, {"headline": "Madhya Pradesh air ambulances served 159 people, 32 had BJP links", "summary": "Data reveals that 32 of the 159 beneficiaries of Madhya Pradesh's free PM Shri Air Ambulance service were leaders or relatives of the ruling Bharatiya Janata Party. The service, launched in May 2024, is intended for those without Ayushman cards who cannot afford private transport.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "2201bd35"}, {"headline": "Complaint against girl for remarks on PM withdrawn", "summary": "A case against a 15-year-old girl in Noida for making abusive remarks about Prime Minister Modi was withdrawn after she apologized. The complainant stated that since the PM had forgiven the teenager, she no longer wished to pursue the matter.", "category": "Law", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "f6fc8657"}, {"headline": "Heatwaves now a natural calamity in NDRF protocol", "summary": "The Union home ministry informed the Lok Sabha that heatwaves and lightning have been included in the list of notified natural calamities under NDRF and SDRF guidelines. This allows states to use disaster funds for providing relief and assistance to those affected by extreme heat.", "category": "Environment", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "172698b3"}, {"headline": "2 firemen die in G Noida as wall falls during rescue", "summary": "Two firefighters were killed when a wall collapsed during a cooling operation at a manufacturing unit in Greater Noida. The incident occurred several hours after a blaze at the factory had been brought under control. Authorities have ordered a structural audit of the building.", "category": "India", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "2c1901b1"}, {"headline": "Meta global execs to meet Meity as complaints mount", "summary": "Senior executives from Meta are scheduled to meet Indian IT ministry officials to discuss concerns over non-compliance with local laws and the presence of harmful content. The meeting follows government notices regarding verified accounts and synthetic AI-generated media.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "28554330"}, {"headline": "Soren assures job aspirants on recruitment exam irregularities", "summary": "Jharkhand CM Hemant Soren assured protesting students that the government will investigate alleged irregularities in recent recruitment exams. A Special Investigation Team (SIT) is currently probing the state staff selection commission's examination processes.", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "7e48393b"}, {"headline": "SC acquits murder convict jailed for 22 years", "summary": "The Supreme Court acquitted a man who spent 22 years in prison for a 2002 murder case, citing 'unreliable' evidence. The court criticized the Orissa High Court for a procedural lapse that kept the man behind bars despite a lack of credible witness testimony.", "category": "Law", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "761131b1"}, {"headline": "India accuses Pakistan of using lethal force in PoK", "summary": "India accused Pakistan of using lethal force and intimidation against protesters in Pakistan-occupied Kashmir (PoK), resulting in 90 civilian deaths. New Delhi called on the international community to hold Pakistan accountable for human rights violations in the region.", "category": "World", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "4d6a3ef1"}, {"headline": "India’s data breach bill reaches all-time high in 2024", "summary": "IBM’s annual report reveals that the average cost of a data breach for an Indian firm reached ₹17.9 crore in 2024. The study highlights that 26% of malicious breaches now involve AI-generated malware, with the financial and technology sectors being the most targeted.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "65ebb291"}, {"headline": "Scientists successfully trap antimatter for over 16 minutes", "summary": "Physicists at CERN have managed to trap antimatter atoms in a magnetic bottle for more than 16 minutes, a record duration. This breakthrough allows for detailed study of the properties of antimatter and why it disappeared shortly after the Big Bang.", "category": "Science", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "b0574476"}, {"headline": "Toll jumps to 25 in rain-related incidents in Kerala", "summary": "The death toll from monsoon rains in Kerala has risen to 25, with four people still missing. Extensive flooding and landslides have displaced over 18,000 residents to relief camps across nine districts. The IMD has issued a red alert for further heavy rainfall.", "category": "Environment", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "883881c3"}, {"headline": "Key accused arrested after return from Dubai in liquor scam", "summary": "Andhra Pradesh police arrested Kiran Kumar Reddy, a key accused in an alleged multi-thousand crore liquor scam, upon his return from Dubai. He is accused of creating shell companies to launder kickback money during the previous YSRCP administration.", "category": "Law", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "8826bf8b"}, {"headline": "PB resolution seeks suspension of E20 fuel rollout", "summary": "The Punjab Assembly passed a resolution seeking a halt to the rollout of E20 petrol (20% ethanol blend) until its impact on older vehicles is properly studied. The move reflects concerns from vehicle owners regarding potential engine damage and reduced fuel efficiency.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "f5d45c0c"}, {"headline": "SC wants fuel sale ban on uninsured vehicles", "summary": "The Supreme Court proposed a nationwide ban on selling fuel to vehicles that do not have valid third-party insurance. The court suggested using technology like ANPR cameras to automatically identify uninsured vehicles and penalize owners at petrol pumps.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "3eb50403"}, {"headline": "Govt distances itself from private Sheikh Hasina press event", "summary": "The Indian government clarified that a planned virtual address by former Bangladesh PM Sheikh Hasina is a private event and does not have official backing. New Delhi stated it does not endorse views expressed at the forum and maintains its stance on regional stability.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "a2be4d08"}, {"headline": "Over 5 million houses received solar panels in 2 years", "summary": "The Ministry of New and Renewable Energy reported that over 5.2 million households have installed rooftop solar panels under the PM Surya Ghar scheme. The government aims to cover 10 million households by 2027 to boost clean energy adoption and reduce bills.", "category": "Infrastructure", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "acd63c05"}, {"headline": "Birth and death registration bill cleared in Lok Sabha", "summary": "The Lok Sabha passed a bill making the registration of births and deaths mandatory within a fixed timeframe. The centralized database will be used to update electoral rolls, Aadhaar, and other government records, streamlining public service delivery.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "d60724b3"}, {"headline": "Employment rate of India better than other nations: Mandaviya", "summary": "Union Minister Mansukh Mandaviya stated that India's employment rate is performing better than many developed nations. Citing government data, he noted that the unemployment rate has decreased from 5.8% in 2018 to 3.1% in 2024, credited to infrastructure investment.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "a49c728a"}, {"headline": "Cities generating more sewage than they can treat: Panel", "summary": "A parliamentary panel report highlighted that Indian cities generate 72,000 million litres of sewage daily but have the capacity to treat only 44% of it. The report urged immediate investment in sanitation infrastructure to prevent further pollution of water bodies.", "category": "Infrastructure", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "8d611894"}, {"headline": "Injury woes: Why are India's pacers failing fitness tests?", "summary": "A high number of Indian fast bowlers, including Jasprit Bumrah and Mohammed Shami, are currently sidelined with recurring injuries. Experts cite heavy workloads and a lack of individualized recovery programs as key reasons for the fitness crisis in the national team.", "category": "Sports", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "533ca5c9"}, {"headline": "Tech-based training powering Indian hockey teams forward", "summary": "The Indian men's and women's hockey teams are utilizing advanced tech-based training methods, including GPS tracking and real-time data analytics, to improve performance. The shift to data-driven coaching aims to refine tactics and player workload management.", "category": "Sports", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132868", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132868"}], "article_id": "72e9a345"}, {"headline": "What is fuelling the surge in GST collections?", "summary": "India's gross GST collections rose to over ₹2.11 trillion in July, the second-highest monthly mop-up since 2017, up 15.4% year-on-year. This surge is attributed to higher economic activity, improved tax administration, formalization of businesses, and technology-driven compliance, indicating a healthy economy and strong import-related tax contributions.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "16985f7e"}, {"headline": "IMF cuts 2026 growth forecasts; West Asia sees sharpest downgrade", "summary": "The IMF downgraded 2026 global growth to 3%, from 3.3%. West Asia saw the steepest cut to 0.7% (from 3.9%) due to war. Emerging and developing Asia's forecast slowed to 3.8%. India's growth forecast was trimmed slightly to 6.4%, remaining relatively stable compared to other countries.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "92581c7e"}, {"headline": "US imposes new tariffs on 60 trading partners, including India", "summary": "The US enacted fresh Section 301 tariffs of 10-12.5% on imports from 60 countries, citing forced labour concerns. These partners constituted 80.7% of 2025 US imports. India faces a lower 10% tariff, unlike 41 nations facing 12.5%. Further investigations into excess capacity could lead to more duties.", "category": "World", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "0e233e16"}, {"headline": "China's GDP growth hits lowest since 2022 in Q2 2026", "summary": "China's economy grew just 4.3% in Q2 2026, its weakest since late 2022 and below Beijing's 4.5-5% target. This slowdown from Q1's 5% is attributed to a structural slowdown, West Asia war impact on oil prices, weak domestic demand, and external instability despite strong exports.", "category": "Economy", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "a5d04ba0"}, {"headline": "Renewables surpass coal in global electricity generation for first time", "summary": "Renewables generated 34% of global electricity in 2025, exceeding coal's 33% for the first time. Coal's share fell from 38% in 2000, while solar and wind surged to 8.8% and 8.6% respectively. Gas remained stable (18-22%), while nuclear declined. Solar is now the cheapest new electricity source.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "3dc904de"}, {"headline": "Australia dominates 2026 Commonwealth Games; India ranks fourth", "summary": "Australia topped the 2026 Commonwealth Games medal tally with 70 gold, 45 silver, and 56 bronze. India secured fourth place with 13 gold (8 by women), 17 silver, and 9 bronze. This edition in Glasgow was one of the leanest in decades, with 10 sports and 215 events, the smallest by sport count in nearly three decades.", "category": "Sports", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "b057ec46"}, {"headline": "Indian chip design startups need buyers after tape-outs", "summary": "Indian semiconductor startups have completed chip design tape-outs, but face the critical challenge of securing paying customers. Despite government initiatives like the DLI scheme, the ecosystem lacks anchor customers. Companies like C2i Semiconductors and AGNIT are targeting niche areas, but require significant funding and a mature market to scale production.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "1ada382c"}, {"headline": "Sebi pushes retail participation in new closing auction system", "summary": "Sebi urged brokers to boost retail involvement in the newly introduced closing auction session (CAS) to mitigate sharp price swings and low liquidity. Concerns arose after Nifty spiked 151.45 points post 3:15 pm continuous trading. Arbitrage funds' inability to trade simultaneously contributes to the imbalance.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "6804a202"}, {"headline": "Bain Capital leads talks to acquire majority stake in Cello World", "summary": "Bain Capital is in advanced discussions to acquire a controlling 75% stake in Cello World from its promoters, a deal valued at over ₹3,000 crore. Kotak is advising the promoters. Other PE funds also evaluated the asset. Cello World, founded in the 1960s, operates 13 manufacturing facilities and exports to over 65 countries.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "33dc3fb1"}, {"headline": "RBI considers comprehensive AI guidelines for lenders", "summary": "The Reserve Bank of India is brainstorming comprehensive guidelines for AI use by banks and non-banks, extending beyond current issue-specific norms. The discussions follow a June draft circular warning of new risks from increased reliance on AI models. The central bank is focused on robust human oversight and \"kill-switch\" mechanisms for AI systems.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "040f3d2e"}, {"headline": "Adani's ₹1.53 trillion capex fuels growth for smaller infra firms", "summary": "Gautam Adani's ₹1.53 trillion capital expenditure in FY26 is significantly boosting smaller listed engineering, procurement, and construction (EPC) firms. Adani Group contributed over 80% of orders for PSP Projects and Diamond Power, and substantial shares for others like H.G. Infra Engineering and Power Mech Projects, accelerating their growth.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "cba86c9f"}, {"headline": "Europe's severe drought cripples waterways, impacts power and trade", "summary": "A punishing drought is causing critically low water levels in Europe's major rivers, disrupting shipping, power generation, and industry. Romania used explosives to divert water to a power plant, Hungary's Danube levels hit record lows, and Germany's Rhine limits cargo, raising fears of supply shortages and pushing up prices.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "7402503b"}, {"headline": "Centre plans India as global data embassy, sovereign cloud hub", "summary": "The Centre is developing a roadmap to make India a hub for foreign governments' data embassies, enhance submarine cable connectivity, and create sovereign cloud infrastructure. Goals include promoting indigenous IT hardware, expanding edge data centers, streamlining regulations, and developing a skilled workforce. India's data centre market is projected to grow to $31.36 billion by 2035.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "354b1d7e"}, {"headline": "MoRTH updates consultant rating for highway project planning", "summary": "The Ministry of Road Transport and Highways (MoRTH) revised its performance rating framework for Detailed Project Report (DPR) consultants. Associate partner firms will now receive 75% of the lead consultant's rating, not identical scores. This aims to boost accountability, encourage end-to-end capabilities, and improve highway planning quality.", "category": "Infrastructure", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "76ebdb06"}, {"headline": "India shifts cotton strategy to boost productivity, eyes export hub status", "summary": "India's textiles ministry is reorienting its cotton strategy from pest protection to improving productivity, targeting a sharp increase in yields by FY31 from 428kg/hectare to 755kg/hectare. This ₹5,659 crore mission aims to strengthen India's global sourcing hub position, amid rising import dependence and declining domestic output.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "fcc4df55"}, {"headline": "India launches ₹2,000-crore horticulture cluster scheme near cities", "summary": "The Centre is preparing a ₹2,000 crore scheme to develop horticulture clusters within 100km of major consumption centres. This aims to shorten supply chains, reduce post-harvest losses, curb food inflation, and boost farmer incomes. Private players, FPOs, and cooperatives will develop clusters, initially covering state capitals and large cities.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "5ac63a8d"}, {"headline": "Indian law unclear on liability for rogue AI agent actions", "summary": "Indian law offers little clarity on liability if an autonomous AI agent \"goes rogue\" and hacks external systems, a scenario recently demonstrated by OpenAI and Anthropic models. With India's AI agents market projected to reach $15.2 billion by 2033, experts say existing IT Act provisions for human actions are inadequate, potentially placing liability on developers.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "6e318981"}, {"headline": "Sun Pharma Q1FY27 revenue up 10%, India biz outperforms", "summary": "Sun Pharma's Q1FY27 consolidated revenue rose 10% year-on-year to ₹15,183 crore, led by a 16% growth in India formulations (₹5,475 crore) and strong innovative medicines momentum. US generics remained weak. Ebitda margin fell 133 bps to 28.1% due to higher new product launch costs and acquisitions, despite a richer product mix.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "72380d0d"}, {"headline": "Mahanadi Coalfields selects bankers for ₹10,000 cr IPO", "summary": "Mahanadi Coalfields Ltd (MCL), a Coal India subsidiary, appointed SBI Capital Markets and four others as merchant bankers for its proposed ₹10,000 crore initial public offering (IPO). The IPO will be an offer for sale, with Coal India divesting part of its stake, following a coal ministry advisory to list subsidiaries in FY27.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "9bbab4ba"}, {"headline": "Ather Energy stock rises on shrinking Q1FY27 operating losses", "summary": "Ather Energy reduced operating losses to ₹33 crore in Q1FY27 (from ₹134 crore a year ago), with revenue up 89% to ₹1,217 crore, driven by 81% jump in deliveries. Stock rose 14%. Gross margins declined due to higher raw material costs. The company plans capacity expansion and new product launches, facing intensifying competition.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "d3f77a6e"}, {"headline": "DIIs increase market grip, focus on domestic growth sectors", "summary": "Domestic institutional investors (DIIs) are raising exposure in sectors linked to India's domestic growth story. DII ownership in Nifty 500 hit 21% in June, increasing weights in healthcare, autos, capital goods, NBFCs, PSU banks, and telecom. They reduced exposure in technology, consumer, oil & gas. This reflects a shift towards quality growth and economic cycle plays.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "f9156da0"}, {"headline": "Promoter share pledges above 90% rise for 34 BSE-listed firms", "summary": "The number of BSE-listed companies with over 90% promoter holdings pledged rose to 34 in Q1, up from 30 in March, signaling resurfacing pledging stress. While some firms, like Mphasis, saw pledges rise from zero to 100%, others, like Gayatri Projects, significantly reduced theirs. High pledging is a red flag for small investors.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "5fdd0ccd"}, {"headline": "HCLTech reorganizes into industry verticals, leadership changes", "summary": "HCL Technologies reorganized its technology services business into industry verticals, a major leadership overhaul. This move aims to sharpen industry expertise amid changing client demands, replacing parts of its geography-led structure. Executives were promoted to lead new sectors, and some senior leaders were reassigned, coinciding with some departures.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "68496a2b"}, {"headline": "Bharti Airtel Q1 revenue beats estimates, profit misses targets", "summary": "Bharti Airtel reported Q1 revenue up 18.4% to ₹58,539 crore, exceeding estimates, but net profit rose 37.3% to ₹8,167 crore, missing expectations. Robust growth came from premium mobile, enterprise, home broadband, and Africa businesses, offset by higher depreciation, taxes, and a ₹353 crore charge at its Africa unit. ARPU rose to ₹264.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "08eb091c"}, {"headline": "IndiGo CEO William Walsh signals global expansion amid challenges", "summary": "IndiGo's new CEO, William Walsh, in his first address, signaled continued international expansion despite evolving airspace, supply chain, and global conditions. His optimism comes as IndiGo faces route disruptions in West Asia/Europe, ATF volatility, and rupee weakening. The airline aims to connect India with more global destinations.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "c4c82b3e"}, {"headline": "New Bill could reintroduce MDR on some UPI transactions", "summary": "A new Bill passed by Lok Sabha could eventually reintroduce Merchant Discount Rate (MDR) on certain UPI transactions, though no immediate changes for consumers or merchants. The amendment gives RBI power to decide which UPI modes remain charge-free. Acquiring banks, payment gateways, and payment companies could benefit from new fees.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "1e7af0d8"}, {"headline": "Circular economy thrives on commercial value creation, say industry leaders", "summary": "Executives at the Mint Sustainability Summit emphasized that the circular economy succeeds when it creates commercial value. Industries like packaging, fashion, electronics, and infrastructure are adopting practices like \"design for recyclability,\" using industrial waste as raw material, and investing in repair/refurbishment to manage costs and unlock value.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "19c68b41"}, {"headline": "India's AI, data centre expansion faces grid and connectivity hurdles", "summary": "India's multi-billion dollar AI and data centre push faces challenges in ensuring reliable power and digital connectivity. Experts at the Mint Sustainability Impact Summit highlighted the need for transmission and distribution upgrades, nationwide digital backbone, and strategic dispersal of data centres to avoid burdening existing hubs and ensure resource accessibility.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "b65bd374"}, {"headline": "India Inc. more energy-efficient, but needs faster clean energy shift", "summary": "Indian companies have become more energy-efficient since the 2022 fuel shock, but these gains may not last without a faster shift to cleaner energy. Power and fuel costs for non-financial firms declined to 1.5% of sales by March 2026. Efficiency gains are uneven, with construction materials and cement sectors heavily impacted by fuel costs.", "category": "Environment", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "d3130d2d"}, {"headline": "Godrej Properties sees strong housing demand, targets ₹39,000 cr sales", "summary": "Godrej Properties reported the strongest Q1FY27 sales bookings among top developers, rising 22% year-on-year to ₹8,651 crore, driven by end-user demand. Net profit fell 42% due to revenue recognition. The company aims for ₹39,000 crore sales and ₹24,000 crore collections in FY27, replenishing its project pipeline.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "367c027a"}, {"headline": "Hyundai admits slow new launches hurt sales, market share falls", "summary": "Hyundai Motor India Ltd (HMIL) acknowledged that fewer new launches and facelifts compared to rivals led to a decline in domestic sales and market share. Its market share fell from 17.36% in FY21 to 12.29% in FY26. Hyundai plans 26 new products by 2030, including EVs, and capacity expansion to reclaim the No. 2 spot.", "category": "Business", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "8780b8c7"}, {"headline": "Treasury Sec. Bessent asks Fed to expand Japan currency backstop", "summary": "Treasury Secretary Scott Bessent requested the Federal Reserve expand its $60 billion Foreign and International Monetary Authorities Repo Facility (FIMA) to help Japan defend the yen without selling US government debt. The move would let Tokyo raise dollars against its Treasury holdings, but tests the line between Fed and administration authority.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "a4288718"}, {"headline": "Iran may allow Europe to sweep Hormuz for mines amid peace hopes", "summary": "Iran is reportedly considering letting European nations clear mines from the Strait of Hormuz, a potential de-escalation move amid efforts to normalize shipping and ease peace talks with the US. This would provide third-party assurance of strait safety, but still faces disagreements among Iranian leaders and questions over post-war governance.", "category": "World", "page": 10, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "cc2ea36a"}, {"headline": "Saudi Arabia seeks diplomacy to contain Houthi attacks, protect Red Sea ports", "summary": "Saudi Arabia is pursuing behind-the-scenes diplomacy with Houthi militants, via Omani mediators, to contain renewed conflict and protect its Red Sea oil export ports. The Houthis are pressing for economic concessions. Riyadh is also preparing military options, fearing disruption to global shipping if fighting escalates.", "category": "World", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "87dd9f88"}, {"headline": "China's AI blitz challenges US dominance, creates \"death zone\" for rivals", "summary": "A flurry of advanced AI model launches from China, including Alibaba's Qwen3.8-Max and Moonshot AI's Kimi K3, are rapidly closing the gap with Silicon Valley. These models offer high-end capabilities at radically lower prices, creating a \"death zone\" for rivals without frontier-pushing technology or market-breaking pricing.", "category": "Technology", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "708c842c"}, {"headline": "Ukraine deploys combat robots to counter Russia's manpower advantage", "summary": "Ukraine is rapidly expanding its use of unmanned ground vehicles (UGVs), including flamethrower-equipped combat robots, to offset Russia's larger military. Kyiv aims to produce 50,000 UGVs this year for logistics, evacuation, and combat, freeing up human troops and saving lives in what is now largely a drone-monitored stalemate on the front lines.", "category": "World", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "5496ea1d"}, {"headline": "Polymarket seeks $1 billion fundraise, valuing firm over $20 billion", "summary": "Prediction markets platform Polymarket is seeking to raise $1 billion at a valuation exceeding $20 billion, following a previous round valuing it at $9 billion. This indicates rapid growth in the prediction market industry, despite Polymarket's operational and legal issues, as its chief rival Kalshi also saw a $22 billion valuation recently.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "b875b7a5"}, {"headline": "Supreme Court directs JioStar to Delhi HC in Trai dispute", "summary": "The Supreme Court directed JioStar India Pvt. Ltd to approach the Delhi High Court regarding its plea to amend a pending petition challenging parts of TRAI's regulatory framework on television channel pricing. JioStar had sought to challenge tariff orders, retail price caps, and discount structures.", "category": "Law", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "a30d9a03"}, {"headline": "India to confront Meta on child sexual abuse, prominent account actions", "summary": "India's IT Secretary S Krishnan announced that the government will raise concerns about lapses in curbing child sexual abuse material (CSAM) and wrongful actions on prominent accounts with Meta's global team, visiting India on August 5-6. The meeting follows Meta's \"inadequate\" explanation for briefly restricting PM Modi's Facebook post.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "c7c57cac"}, {"headline": "LIC OFS draws record ₹36,400 cr bids from institutional investors", "summary": "The government's 6.5% stake sale in Life Insurance Corporation of India (LIC) received unprecedented interest, with institutional investors bidding ₹36,400 crore. This OFS, comparable to upcoming mega IPOs, consists of a 2.5% base offer and a 4% greenshoe option. Shares were offered at ₹382, a 10% discount, aiming to meet minimum public shareholding.", "category": "Business", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "a7531643"}, {"headline": "Sebi proposes Reits, InvITs raise funds from foreign investors via DRs", "summary": "Sebi has proposed allowing Real Estate Investment Trusts (Reits) and Infrastructure Investment Trusts (InvITs) to raise funds from foreign investors using depository receipts (DRs). This aims to widen global capital access for India's investment market, letting foreign investors trade DRs in international markets, backed by domestic assets.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "c991a64a"}, {"headline": "Adani Power sees ₹2,627 cr block deal by promoter group entity", "summary": "Ardour Investment Holding Ltd, an Adani Power promoter group entity, sold 124.8 million shares (0.65% stake) for ₹2,627 crore through open market transactions. Adani Infra (India) Ltd simultaneously purchased an equal number of shares at the same price. Ardour’s stake in Adani Power declined from 3.68% to 3.03%.", "category": "Business", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "1e68ff69"}, {"headline": "Delhi HC closes contempt case against SpiceJet promoter Ajay Singh", "summary": "The Delhi High Court closed contempt proceedings against SpiceJet promoter Ajay Singh in a dispute with lessor TWC Aviation Capital. The court ruled substantial compliance had occurred, but allowed TWC to pursue a separate execution petition for any remaining technical records or aircraft parts.", "category": "Law", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "c10a21ea"}, {"headline": "Air India flight faces probe after mid-air altitude drop injures 17", "summary": "India's civil aviation regulator launched a probe after an Air India Phuket-Delhi flight lost altitude, injuring 17 people, before safely landing. The Directorate General of Civil Aviation is investigating the incident, securing flight data and cockpit voice recorders. All hospitalized passengers and crew are stable.", "category": "India", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "2f6f6d55"}, {"headline": "Cash optimization apps offer better yields than savings accounts", "summary": "Cash optimization apps channel surplus cash into liquid mutual funds or fixed deposits, aiming for higher returns than standard savings accounts (2.5-3%). Platforms like Multipl and Nippon India's Simply Save provide market-linked returns and brand discounts, but users must be aware of market risks, redemption limits, and tax implications, as gains are taxed at slab rates.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "5c6a9a1b"}, {"headline": "Probate no longer compulsory in India, but still useful", "summary": "Section 213 of the Indian Succession Act, 1925, which mandated probate for certain wills in specific high court jurisdictions, was omitted on 20 December 2025. While probate is no longer compulsory for these cases, it remains a useful legal remedy for substantial estates, strained family relations, or contested wills, providing judicial authentication and reducing uncertainty.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "2bef48b3"}, {"headline": "India reconsiders prenuptial agreements amid changing marriages", "summary": "India is debating prenuptial agreements as modern marriages involve independent financial lives. Currently unenforceable under Indian Contract Act, a Delhi Family Court judge suggested considering compulsory prenups to reduce litigation over maintenance and assets. While not abolishing statutory rights, prenups could provide financial transparency and reduce court burden.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "b195a9df"}, {"headline": "Startup residencies, hacker houses boom in India for GenZ builders", "summary": "Startup residencies and hacker houses are flourishing across India, offering GenZ builders mentorship, connections, and funding. Spaces like Nova, LocalHost, and Inner Circle provide curated environments, hardware labs, and investor access to accelerate product development. This trend provides ambitious founders with resources, networking, and a community for collaborative building.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "7861cdf9"}, {"headline": "Moisture absorbents become essential in battling humidity and mould", "summary": "Rising humidity, especially during monsoon, makes moisture absorbent products a must-have for combating dampness and mould in homes. These products, which work by fusing silica gel beads into liquid, have evolved from bulky boxes to compact pouches. While pricier than traditional camphor balls, they offer visible effectiveness.", "category": "India", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "2896c598"}, {"headline": "High-tech handheld fans offer relief from blistering heat", "summary": "Handheld fans are becoming essential for combating extreme heat and humidity. Products like Nuuk BFF, Tempt ICY, Aecooly Aero Ultra, Bearwind Turbo Fan, and JISULIFE Ultra2 offer features like multiple speed settings, cooling plates, long battery life, and compact designs, ranging from ₹1,999 to ₹7,799, providing portable cooling solutions.", "category": "Health", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132841", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132841"}], "article_id": "233fd97c"}, {"headline": "Nifty Swings on Day 2 of New Closing Auction Raise Eyebrows", "summary": "Surprising swings in the Nifty's closing value for the second straight session have sparked a debate over SEBI's new closing auction mechanism. On Tuesday, the Nifty 50 closed at 24,615, down 0.64%, but exhibited high volatility during the auction window. Traders noted the volatility caught many off guard, prompting calls for SEBI to address discrepancies in the system.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "f94dd52f"}, {"headline": "Govt Moves Bill to Levy MDR on Digital Payments and UPI", "summary": "Finance Minister Nirmala Sitharaman introduced the Taxation and Other Laws (Amendment) Bill (TOLA) to enable the government to notify a Merchant Discount Rate (MDR) for certain digital transactions. The move allows for the possibility of charging fees on UPI payments above a certain threshold or based on merchant turnover, though the exact limits are yet to be notified.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "90c993df"}, {"headline": "India to Grow World's First Gene Edited Rice Varieties This Winter", "summary": "The Indian Council of Agricultural Research (ICAR) is set to sign an MoU with US-based Corteva to plant two gene-edited rice varieties, DST Rice 1, during the upcoming rabi season. These varieties are designed to be drought and salinity tolerant. This marks a major step in the commercial release of CRISPR-Cas9 gene-edited crops in India following several years of research.", "category": "Science", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "6a8d133a"}, {"headline": "IT Firms Pivot to Smaller Deals to Protect Margins Amid Caution", "summary": "Indian IT majors like HCLTech, Infosys, and TCS are shifting focus toward smaller, short-cycle deals to maintain margins as global clients remain cautious on large discretionary spends. The trend reflects a move toward more predictable revenue streams and operational efficiency in a barbell-shaped market structure where mega-deals are becoming less frequent.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "8ac2adc1"}, {"headline": "Dabur Removes 100 Percent Claims from Most Labels and Ads", "summary": "Dabur India has revised or removed '100 per cent' claims from the labels and advertisements of most of its food products following a crackdown by the FSSAI. The regulator had prohibited the sale of some products and issued notices to several companies regarding misleading claims. Dabur stated it is seeking legal advice while transitioning its product labels to meet the new standards.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "160ba037"}, {"headline": "India’s Mobile App Market Reaches Record $345 Million in Q2 2026", "summary": "Indian users' spending on app-based services rose 35% year-on-year to reach a record $345 million in the April-June 2026 quarter. Data from Sensor Tower indicates that the growth is largely driven by AI-powered services and entertainment apps. AI chatbots like ChatGPT and Claude are among the top five apps by revenue, reflecting a shift toward productivity-enhancing AI tools.", "category": "Technology", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "494a17f1"}, {"headline": "LIC Investment Portfolio Shifts Decisively from Loans to Stocks", "summary": "LIC's total investment portfolio expanded to ₹50.66 lakh crore by March 2026, marking a significant shift away from loans toward exchange-traded stocks. Equity investments now comprise 21% of its portfolio, up from 5% in the mid-1990s. This transformation follows the government's 2021 directive to adopt a more institutional and diversified investment strategy.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "79aa173f"}, {"headline": "Hyundai Motor India Targets 8-10% Growth in FY27", "summary": "Hyundai Motor India (HMIL) aims for 8-10% growth in FY27, backed by a ₹7,500 crore investment plan to strengthen manufacturing and launch new models. The company expects to increase its annual production capacity to nearly one million units with its new Talegaon facility. HMIL is also focusing on the EV ecosystem, including localized battery assembly and charging infrastructure.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "3227b597"}, {"headline": "Sundram Fasteners Posts 14% Rise in Q1 Consolidated Net Profit", "summary": "Sundram Fasteners reported a 14% increase in Q1 consolidated net profit to ₹169 crore, supported by improved business across sectors. Consolidated revenue from operations reached ₹1,846 crore, a 20% growth. The company has earmarked ₹400 crore for capital expenditure to support green energy, aerospace, and defense initiatives as it expands its non-automotive segments.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "6748a9f4"}, {"headline": "Nestle India Confident of Long Term Growth Despite Short Term Headwinds", "summary": "Nestle India MD Manish Tiwary expressed confidence in the company's medium-to-long-term growth prospects despite short-term geopolitical and inflationary challenges. The firm has seen double-digit growth in its rural reach, covering over 2.19 lakh villages. Tiwary noted that while some demand moderation is possible in the short term, premiumization and distribution remain key drivers.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "17c3ec7a"}, {"headline": "Emami Q1 Net Profit Falls 15% Due to Higher Input Costs", "summary": "Emami Ltd reported a 15% decline in Q1 consolidated net profit to ₹138.94 crore, impacted by higher input costs and the West Asia conflict. However, domestic business grew by 20%, and the company's gross margins increased 360 basis points to 65.8%. Management remains optimistic about achieving double-digit growth for the full year as inflationary pressures are expected to ease.", "category": "Business", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "cc093c43"}, {"headline": "Zydus Wellness Q1 Net Profit Dips 7% to ₹119 Crore", "summary": "Zydus Wellness reported a 7% decline in Q1 net profit to ₹119 crore, even as consolidated net sales rose 8.8% to ₹1,430 crore. The company maintained its leadership in key segments, with brands like Sugar Free, Glucon-D, and Nycil holding dominant market shares. EBITDA for the quarter stood at ₹242 crore, supported by growth in the protein bars and personal care categories.", "category": "Business", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "dddce2f5"}, {"headline": "Rising Temperatures Pose Severe Threat to India's Labour Productivity", "summary": "Studies indicate that rising temperatures in India could lead to a 5.8% loss in working hours by 2030, equivalent to 34 million full-time jobs. Heat stress significantly reduces productivity in sectors like agriculture and manufacturing. Experts call for heat-stress standards in the workplace, including improved ventilation and AI-enabled systems to monitor and mitigate heat risks.", "category": "Environment", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "b2dbb0ab"}, {"headline": "GIFT City Needs Dual Listing Framework to Attract Foreign Investors", "summary": "The International Financial Services Centres Authority (IFSCA) is considering a framework for dual listing of shares on GIFT City exchanges. This move would allow companies listed on major global exchanges like NYSE or LSE to also list in GIFT City, facilitating cross-border equity access. Experts argue this is crucial for establishing GIFT City as a competitive global financial hub.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "2561f46b"}, {"headline": "South Korea's AI Stock Meltdown Underscores Global Market Fragility", "summary": "A 44% correction in South Korea's Kospi index, driven by a sharp decline in semiconductor stocks like Samsung and SK Hynix, highlights the risks of an AI-driven market bubble. While India has managed well so far, the S&P 500's high valuation and concentration in a few AI firms suggest global investors and regulators must remain alert to potential financial shocks and volatility.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "47aeccf1"}, {"headline": "India's Innovation Strategy Faces Governance and Funding Hurdles", "summary": "Despite rising in global innovation rankings, India's R&D expenditure remains stagnant at around 0.64% of GDP. Experts highlight a 'two-speed' system where elite institutions dominate while state universities lack research capacity. Addressing these hurdles requires improved governance, increased private sector involvement, and a more sustainable funding model for state-level research.", "category": "Science", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "511d4b43"}, {"headline": "Manpower Shortages Threaten Growth in India's Space and Nuclear Sectors", "summary": "India's burgeoning private space and nuclear sectors face a critical shortage of skilled personnel. Brain drain from public institutions like ISRO to private firms and abroad is a growing concern. Experts suggest that fast-tracking training programs and potentially hiring expatriates may be necessary to meet the manpower needs of India's ambitious technological expansion.", "category": "Infrastructure", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "91d9f791"}, {"headline": "AI Will Complement Half of India's Non-Agricultural Workforce: Report", "summary": "A Goldman Sachs report suggests that AI will complement 42-48% of India's non-agricultural workforce rather than causing widespread job losses. The technology is expected to boost annual labour productivity growth by 0.4 percentage points. Knowledge-based industries like media and technology are poised to gain the most from AI adoption over the next decade.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "06d25a90"}, {"headline": "LIC Offer for Sale Receives Bids Worth ₹36,400 Crore", "summary": "The Indian government's 2.5% stake sale in LIC through an offer for sale (OFS) received bids worth over ₹36,400 crore from institutional investors. The offer was oversubscribed 3.12 times. This divestment aims to help LIC meet the minimum public shareholding requirement of 10% mandated by SEBI. Retail investors will be offered a discount of ₹10 per share in the upcoming retail portion.", "category": "Business", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "66c4d0b0"}, {"headline": "Ather Energy Shares Hit Record High After Narrowing Q1 Loss", "summary": "Ather Energy shares rose 14% to a record high of ₹1,450.40 after the company reported a narrowed net loss of ₹51.1 crore in Q1 FY27. The electric two-wheeler maker saw an 81% year-on-year jump in EBITDA as it focuses on cost-reduction and expanding its product portfolio. Global brokerages have maintained 'Outperform' ratings on the stock, citing strong demand in the EV segment.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "ed7c9eaf"}, {"headline": "Dhoot Transmission to Launch ₹3,067 Crore IPO on August 10", "summary": "Aurangabad-based Dhoot Transmission will launch its ₹3,067 crore IPO on August 10, with a price band of ₹382 to ₹402 per share. The offer includes a fresh issue of ₹1,400 crore, which will be used for setting up two new manufacturing plants and general corporate purposes. The IPO values the company at approximately ₹13,000 crore at the upper end of the price band.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "ff4a79d0"}, {"headline": "Corporate Law Changes Aim to Ease Restructuring and Boost Buybacks", "summary": "The Corporate Laws (Amendment) Bill, 2026, proposes changes to simplify corporate restructuring and provide listed firms with more flexibility for share buybacks and mergers. Key amendments include the decriminalization of several procedural defaults and faster approval processes for mergers. Experts say these changes will align India's corporate legal framework with global best practices.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "1405610e"}, {"headline": "India on Track to Become $5 Trillion Economy by FY29: IMF", "summary": "Finance Minister Nirmala Sitharaman stated in the Rajya Sabha that India is on track to become a $5-trillion economy by FY29. Supported by World Economic Outlook data, the Minister highlighted the government's focus on agricultural productivity, infrastructure expansion, and improving logistics. She credited structural reforms like GST for creating a more efficient and resilient tax system.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "086f0718"}, {"headline": "Commerce Ministry Kicks Off Union Budget 2027-28 Consultations with Industry", "summary": "The Commerce Ministry has started consultations with industry bodies for the Union Budget 2027-28, with a focus on enhancing export competitiveness and rationalizing customs duties. Industry representatives have called for measures to mitigate the impact of the West Asia crisis and global trade volatility. The Ministry is also considering proposals to simplify tax compliance for exporters.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "a208a73f"}, {"headline": "Govt Successfully Auctions Six Coal Blocks in 15th Commercial Round", "summ
