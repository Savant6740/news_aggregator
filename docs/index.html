yments Bank (PPBL) and appointed former SBI Chief General Manager Girikumar M Nair as official liquidator. This follows RBI's request and license cancellation in April, three months after, due to persistent non-compliance and management prejudicial to public/depositor interests. Nair will oversee final operations and asset distribution under Banking Regulation and Companies Acts.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132066"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 9, "article_id": "72e9ffa4"}, {"headline": "Supreme Court Orders Release of Minor Protesters", "summary": "The Supreme Court ordered immediate release of all minors detained in recent student protests across several states, including Delhi and Uttar Pradesh, provided they have no prior criminal record. Emphasizing the right to protest, the court will form a high-power committee to investigate police excesses and ordered preservation of CCTV footage and police recordings for the investigation.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_29-07-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132087"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132072"}], "importance": 8, "article_id": "5364978b"}, {"headline": "Government Summons Meta Over PM Modi Video Removal", "summary": "The Indian government summoned Meta's President of Global Affairs, Joel Kaplan, and head of public policy after PM Modi's video post on exam leaks was removed, attributed by Meta to an automated moderation glitch. The government deemed the explanation unreasonable, demanding improved tools. A Parliamentary panel also summoned Meta, X, Snapchat, and Google over privacy and compliance issues.", "category": "Technology", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132066"}], "importance": 8, "article_id": "728f617c"}, {"headline": "Ambuja Cements Q1 Profit Drops 33% on Lower Sales Volume", "summary": "Adani Group's Ambuja Cements reported a 33% decline in Q1 consolidated net profit to ₹577 crore, with revenue down 7.3% to ₹9,474 crore. Sales volumes fell 7% to 17.1 million tonnes as the company deliberately pulled back from low-margin sales and shut high-cost plants to improve efficiency. It focused on rationalizing low-margin volumes and pushing for blended cement amid elevated fuel and freight costs.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132066"}], "importance": 7, "article_id": "b6cb49ba"}, {"headline": "Meta and BlackRock Partner for $14 Billion AI Data Centre", "summary": "Meta Platforms and BlackRock announced a $14 billion venture to develop a data center campus in El Paso, Texas, dedicated to powering advanced AI models. BlackRock-managed funds will own 80% of the venture, with Meta holding 20% and being the primary tenant. This reflects tech giants' growing need for physical AI infrastructure and their seeking external capital from fund managers.", "category": "Technology", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132072"}], "importance": 7, "article_id": "c914f8bd"}, {"headline": "Coforge Q1 Net Profit Surges 519% Driven by AI Demand", "summary": "Mid-tier IT firm Coforge reported a Q1 net profit surge of 519% to ₹518.6 crore, with revenue up 24.2% to ₹5,527.7 crore. Growth was driven by AI-led demand and strategic execution, supported by healthcare and insurance divisions. The firm also completed Encora integration, received China entity approval, and signed four $20M+ deals, helping offset global economic headwinds.", "category": "Technology", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132072"}], "importance": 7, "article_id": "84f95ac9"}, {"headline": "India Plans to Import 25% of LPG from US by 2027", "summary": "India plans to buy up to 25% of its liquefied petroleum gas (LPG) imports from the United States by 2027. This strategy aims to reduce dependence on West Asian suppliers and support a broader trade deal with Washington. Three state-run refiners (IOC, BPCL, HPCL) are expected to issue tenders for these US supplies shortly, within the next two months.", "category": "Economy", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}], "importance": 7, "article_id": "789df6c5"}, {"headline": "Lok Sabha Debates Anti-Paper Leak Bill Amid Opposition Criticism", "summary": "Lok Sabha debated an anti-paper leak bill proposing up to 10 years jail and ₹50 lakh fines. Opposition MPs supported it but criticized alleged police brutality against student protesters, with Priyanka Gandhi demanding government responsibility and some calling for NEET's scrap. NDA countered by citing past leaks under UPA and in opposition-ruled states, asserting commitment to exam reforms.", "category": "Politics", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 9, "article_id": "e6faeff1"}, {"headline": "India Dismisses PoK Elections as \"Cosmetic Exercise\"", "summary": "India dismissed the three-phase legislative assembly elections in Pakistan-occupied Kashmir (PoK) as a \"cosmetic electoral exercise\" to camouflage Pakistan's illegal occupation of Indian territory and grave human rights violations. The MEA spokesperson Randhir Jaiswal reiterated India's consistent stance on PoK being integral, noting the polls occurred amid massive rigging allegations and recent violence.", "category": "Politics", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132096"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 8, "article_id": "a60b5fd2"}, {"headline": "India Curtails 8,133 GWh Solar Power for Grid Security", "summary": "India curtailed 8,133 GWh of solar power in April-June 2026 to maintain grid security, as the grid struggled to absorb excess renewable energy. This was due to transmission bottlenecks and infrastructure constraints, limiting record high solar generation in May during peak supply and low midday demand. Total installed solar capacity stood at 162.15 GW as of June 30.", "category": "Infrastructure", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132066"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 6, "article_id": "b712b8fb"}, {"headline": "Over 20 Killed in PoK Election Violence, Activists Claim", "summary": "Over 20 people, including 14 activists from the banned Joint Awami Action Committee, were killed and dozens injured in clashes with security forces during the first phase of Pakistan-occupied Kashmir (PoK) legislative assembly elections. Protesters alleged rigging and demonstrated against high energy costs. Authorities disputed the death toll, accusing protesters of firing amidst reports of live ammunition use.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 7, "article_id": "919b4180"}, {"headline": "Zinedine Zidane Appointed France Men's National Football Coach", "summary": "Zinedine Zidane, 54, has been officially appointed head coach of the French men’s national football team on a four-year deal. Replacing Didier Deschamps after the World Cup, Zidane, a two-time World Cup winner as a player, stated this was \"the only job I wanted,\" having rejected other club offers. The French Football Federation aims to revitalize the squad ahead of upcoming international competitions.", "category": "Sports", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 7, "article_id": "f1bac5d2"}, {"headline": "Trump Irritated With Netanyahu Over Leaked Iran Nuclear Talks", "summary": "Israeli PM Netanyahu and US President Trump discussed shared concerns over Iran's nuclear program. Trump, reiterating his hardline stance, voiced irritation over leaked details of his talking points, questioning Netanyahu's public announcements. This suggests strain between the leaders ahead of Bibi's crucial re-election campaign, despite their continued strong alliance on regional security and intelligence matters.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Delhi 29-06-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132072"}, {"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 9, "article_id": "a230016c"}, {"headline": "India's Industrial Output Rises 7.3%; HUL Plans Price Hikes", "summary": "India's industrial production surged 7.3% in June, a 22-month high, driven by strong growth in manufacturing (7.8%) and electricity. This was aided by resilient domestic demand and a low base, with a rise across 19 sectors. Meanwhile, Hindustan Unilever (HUL) plans more price hikes for the coming quarter, citing volatile commodity costs and projecting 2-5% inflation in the September quarter.", "category": "Economy", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132130"}], "importance": 7, "article_id": "539edfdf"}, {"headline": "Police Deny Truck of Stones Near Jantar Mantar Linked to Protests", "summary": "Delhi Police clarified that a dumper truck filled with stones and construction material, parked near Jantar Mantar before a protest, was seized after a July 16 accident and held for safe custody, not linked to any conspiracy against protesters. A Newslaundry report also confirmed the truck was in police custody, refuting social media claims of deliberate deployment as \"false and misleading.\"", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 6, "article_id": "3a8dd653"}, {"headline": "Congress, BJP Spar Over Pralhad Joshi's Education Minister Appointment", "summary": "Congress and BJP clashed over Union Minister Pralhad Joshi's appointment as Education Minister. Rahul Gandhi accused Joshi of defending rapists, referencing purported remarks about the Bilkis Bano case, calling his appointment an \"insult to students\" and the education system. BJP spokesperson Anil Baluni condemned these remarks as \"misleading and factually incorrect,\" stating Joshi commented only on a legal process, not the case itself, accusing Congress of character assassination.", "category": "Politics", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 7, "article_id": "aa75a5c5"}, {"headline": "Ajaya Babu Wins CWG Weightlifting Silver, Betters Father's Bronze", "summary": "Valluri Ajaya Babu, 21, won a silver medal in the men’s 79kg weightlifting at the Commonwealth Games, lifting 330kg. He set a new CWG snatch record of 149kg, missing gold by just 1kg. His achievement comes 16 years after his father, Srinivasa Rao, won bronze in the same sport in 2010, marking a successful day for India’s contingent.", "category": "Sports", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 5, "article_id": "96f23da0"}, {"headline": "Roberto Mancini Returns as Italy Men's National Football Coach", "summary": "Roberto Mancini will return for his second spell as head coach of Italy's men’s national football team, replacing Vincenzo Montella. Confirmed by FIGC president Giovanni Malago, this aims to revitalize the Azzurri, who missed the last three World Cups. Mancini, who led Italy to the Euro 2021 title, will have Claudio Ranieri serving as technical director.", "category": "Sports", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 6, "article_id": "cd8e2d7e"}, {"headline": "Police Probe Claims of Pellet Gun Use on Delhi Protesters", "summary": "Delhi Police is probing a \"back-dated\" general diary entry claiming a DCP ordered the Rapid Action Force (RAF) deputy commander to fire plastic pellets/pellet guns at protesters on July 20. This contradicts police denials and marks the first potential use of pellet guns in Delhi, emerging after at least four pellet injuries and highlighting \"serious deficiencies\" in RAF conduct.", "category": "Law", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 29-07-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132130"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 29-07-2026_260729063809.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132034"}], "importance": 8, "article_id": "e27742de"}], "newspapers": ["Times of India", "Hindustan Times", "Business Standard", "Business Line", "Financial Express", "Economic Times", "Mint", "Indian Express", "The Hindu"], "total_articles": 390};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
