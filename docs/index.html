 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "fd4fd740"}, {"headline": "Government Nears Picking AI Integrators for DigiLocker Ecosystem", "summary": "The government is close to empaneling private AI integrators to expand the DigiLocker ecosystem, bringing in more institutions who use the platform.", "category": "Technology", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "edb630bc"}, {"headline": "Insolvency Plea Against Shapoorji Pallonji Dismissed by NCLT", "summary": "The NCLT rejected a petition by Uniton Infra seeking bankruptcy proceedings against Shapoorji Pallonji & Co over an alleged default of ₹4.31 crore.", "category": "Law", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "e944f517"}, {"headline": "Chip Firm Agrani Labs Eyes ₹850 Crore Funding from Samsung, Others", "summary": "Bengaluru-based AI semiconductor startup Agrani Labs is in talks to raise ₹800-850 crore from investors like Samsung, 360 One Asset Management, and existing backer Peak XV Partners. The funding is expected to value Agrani Labs at ₹2,400-2,500 crore post-money.", "category": "Technology", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "39d5145e"}, {"headline": "SBI Mutual Fund Raises Stake in Swiggy to Over 5%", "summary": "India's largest AMC, SBI Mutual Fund, increased its stake in food and grocery delivery firm Swiggy to 5.1% by purchasing shares worth ₹300 crore in open market transactions. This comes amid Swiggy facing selling pressure and plans for an IOCC structure.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "8db1b5c4"}, {"headline": "Insurers May Seek Tiered Expense Structure Against Uniform Cap", "summary": "The insurance industry is considering advocating for a tiered expense structure, similar to mutual funds, instead of uniform expense limits. Smaller insurers seek higher initial EoM limits that progressively decline as they grow, to invest in distribution and tech.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "758217cc"}, {"headline": "Nifty 50 Logs Longest Weekly Losing Streak in 25 Years Amid Global Heat", "summary": "Indian equity benchmarks recorded their longest weekly losses in a quarter century, falling 8.7% over 8 weeks. US 10-year bond yields surged, causing an Asian currency rout and prompting foreign institutional investors to exit Indian equities.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "f10b62a7"}, {"headline": "India to Elevate Aviation Security Standards Following Flydubai Incident", "summary": "India mandates facial recognition for airline/airport employees and accelerates full-body scanner installation at eight major airports. These measures follow a mid-air incident on a Flydubai flight where a co-pilot attempted to seize control.", "category": "India", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "b51b352c"}, {"headline": "Foreign Portfolio Investor Equity Outflows Exceed ₹3 Lakh Crore in 2026", "summary": "Foreign portfolio investors have withdrawn over ₹3 lakh crore from Indian equities in the first nine months of 2026, surpassing previous annual outflow records. This is driven by risk-off sentiment, rising US bond yields, and reallocation to AI-centric markets.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "59c00aec"}, {"headline": "Supreme Court Refuses to Lift Freeze on Trinamool Congress Bank Accounts", "summary": "The Supreme Court declined to unfreeze four Trinamool Congress bank accounts, directing the Calcutta High Court to expedite the party's challenge. TMC argued the freeze paralyzes its functioning, especially with upcoming byelections.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "a56ccb86"}, {"headline": "Tigress from Valmiki Reserve to be Released in Buxa Tiger Reserve Today", "summary": "A tigress, translocated from Bihar’s Valmiki Tiger Reserve, will be released into Bengal's Buxa Tiger Reserve today, which currently has no tigers. This is a major boost for tourism and ecosystem preservation in the Dooars region.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "3b51dc7a"}, {"headline": "Rahul Gandhi Questions ECI on TCS Changes to Online Form 6", "summary": "Congress leader Rahul Gandhi asked if TCS was pressured to change the online Form 6 illegally, and who at ECI and TCS approved it. Congress spokesperson Jairam Ramesh alleged the CEC orchestrated the changes to remove Gen Z voters.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "130a976e"}, {"headline": "CJP to Begin Nationwide Protests Seeking CEC Gyanesh Kumar's Resignation", "summary": "Cockroach Janta Party (CJP) founder Abhijeet Dipke announced countrywide protests starting today from Mumbai's Shivaji Park, demanding CEC Gyanesh Kumar's resignation. He labeled Kumar a 'traitor' for allegedly removing 13 crore voters from electoral rolls.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "9d876d95"}, {"headline": "Bombay High Court: Citizens Can Question ECI on SIR Orders", "summary": "The Bombay High Court stated citizens are within their rights to question the Election Commission's special intensive revision (SIR) orders, asserting the ECI's primary mandate is to ensure voting rights. This was in response to a petition regarding voter list deletions.", "category": "Law", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "9ab8d371"}, {"headline": "Mamata, Abhishek Allege ECI Handed 150 Seats to BJP in West Bengal", "summary": "Mamata Banerjee and Abhishek Banerjee accused the ECI of irregularities in West Bengal's electoral roll revision, claiming deletions exceeded winning margins in around 150 assembly seats, effectively handing them to BJP. Mamata called CEC Gyanesh Kumar 'Vanish Kumar.'", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "8cf16a29"}, {"headline": "Congress MP Venugopal Urges Speaker to Make JPC Do Job on FCRA Bill", "summary": "Congress MP KC Venugopal wrote to Speaker Om Birla, complaining that the JPC scrutinizing the FCRA Amendment Bill hasn't consulted stakeholders enough, indicating a rushed passage. He urged against taking up the bill until a detailed examination is done.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "13cf1817"}, {"headline": "Karnataka CM DK Shivakumar Stages Dharna Over Bulk Form 7 Filings", "summary": "Karnataka CM DK Shivakumar staged a dharna at the ECI office in Bengaluru, accusing BJP of bulk Form 7 applications to delete voters, especially minorities, SCs, STs, and OBCs. He demanded an FIR and statewide probe into the alleged misuse.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "fae147b7"}, {"headline": "Disability Rights Activists Object to 'Nihshakt' Term in Census 2027", "summary": "Disability rights activists have criticized the use of 'nihshakt' (incapable) in the Census 2027 notification, calling it 'derogatory' and 'illegal.' They argue it violates the Rights of Persons with Disabilities Act 2016, which uses 'divyangjan.'", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "d80a6d50"}, {"headline": "Bengaluru Gets Direct Vande Bharat Train Connectivity to Goa via Hassan", "summary": "Bengaluru now has direct Vande Bharat Express connectivity to Goa, extended from the existing Madgaon-Mangaluru route via Hassan, Udupi, and Karwar. This boosts links for tourists, pilgrims, and professionals between Bengaluru and coastal Karnataka/Goa.", "category": "Infrastructure", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "673fc79a"}, {"headline": "Karnataka Flags Steep Mark-ups on Cancer Drugs, Seeks Centre's Aid", "summary": "The Karnataka government reported '10 to more than 52 times' mark-ups on cancer drugs and medical devices by hospitals, billing patients at MRP despite procuring at heavy discounts. It urged the Centre and NPPA for transparency and corrective measures.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "ca2e4d24"}, {"headline": "4,000 Arrested in J&K Drug Crackdown Since April 2026", "summary": "Jammu and Kashmir police have arrested over 4,000 people and registered 3,257 drug-related cases since April as part of the 'Nasha Mukt Abhiyan.' DGP Nalin Prabhat reported 288 properties worth ₹138 crore attached, highest in India.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "d3e7cf61"}, {"headline": "Swiss President to Visit India Marking FTA First Anniversary", "summary": "Swiss President Guy Parmelin will visit New Delhi early next week to mark the first anniversary of a free trade agreement between India and EFTA countries. The visit aims to accelerate Swiss investments in India and strengthen bilateral cooperation.", "category": "World", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "12ba7f58"}, {"headline": "Assam Revises CM Convoy Rules After Ambulance Halted Incident", "summary": "Assam Chief Minister Himanta Biswa Sarma apologized and suspended four police officials after an ambulance was stopped for his convoy. The state government issued new guidelines to restrict convoy size and ensure VIP movement doesn't disrupt ordinary citizens.", "category": "Politics", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "6fc256de"}, {"headline": "Mumbai Neighbourhood Prays for 'Global Hero' Pilot Smit Machchhar's Recovery", "summary": "Residents of Mumbai's Swastik Heights, where Captain Smit Machchhar grew up, are praying for his speedy recovery after he thwarted a hijacking attempt on a Flydubai flight. They express pride in their 'global hero' but deep concern for his safety.", "category": "India", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "337f3947"}, {"headline": "India's Factory Workforce Crosses 20 Million, Earnings Rise to ₹3.8 Lakh", "summary": "India's factory workforce exceeded 20 million in 2024-25, driven by gains in West Bengal, Telangana, Maharashtra, and UP, and sectors like food products. Industrial GVA rose 9.6% to ₹26.9 lakh crore, and average earnings increased to ₹3.8 lakh.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "5754d175"}, {"headline": "Renaissance Solar to Invest ₹5,000 Crore in Karnataka for 5 GW Solar Facility", "summary": "Indo-US joint venture Renaissance Solar and Electronic Materials (RSOLEC) plans a ₹5,000 crore investment to build a 5 GW solar ingot and wafer manufacturing facility in Tumakuru, Karnataka. Operations are expected to commence by mid-2028.", "category": "Business", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "375bc457"}, {"headline": "TCS to Acquire Best Buy's India Global Capability Centre in Multi-Year Deal", "summary": "Tata Consultancy Services (TCS) will take over US electronics retailer Best Buy’s global capability centre in India under a multi-year agreement. TCS plans to transform the centre into an AI-native capability hub, leveraging its global value & innovation centres framework.", "category": "Technology", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "a7fafe2a"}, {"headline": "Slurrp Farm Seeks Fresh Funding as Early Investors Eye Exit", "summary": "Bollywood actress Anushka Sharma-backed healthy snacking firm Slurrp Farm is seeking a new funding round. Some existing investors are looking to divest their holdings amid heightened interest in the healthy snacking category. Slurrp Farm was valued at ₹827 crore in August.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "dd3d9bbf"}, {"headline": "Anup Bagchi Profile: Easy Colleague, Sharp Boss at ICICI, Now HDFC Bank CEO", "summary": "Anup Bagchi, HDFC Bank's incoming MD & CEO, is described as a sharp executive with an informal manner. With 34 years at ICICI Group, he led retail, wholesale banking, and ICICI Prudential Life, known for his deep understanding and ability to connect with colleagues.", "category": "Business", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "3da73189"}, {"headline": "US Treasury 10-Year Yield Hits Highest Since 2002 at 5.34%", "summary": "The US benchmark 10-year Treasury yield briefly rose above its 2007 peak to 5.34%, the highest since 2002. This latest milestone in a monthslong global sovereign debt selloff is driven by elevated oil prices, massive government borrowing, and AI infrastructure investment.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "9adc01a4"}, {"headline": "ARCs Urge Government Intervention to Expedite Debt Recovery", "summary": "Asset Reconstruction Companies (ARCs) are seeking government help to speed up debt recovery through Debt Recovery Tribunals (DRTs) and Sarfaesi mechanisms. They propose interim stays on recovery lapse after two months and greater use of electronic services.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "16e03291"}, {"headline": "Sri Lotus Developers Poised for Growth with Redevelopment Pipeline", "summary": "Sri Lotus Developers & Realty shares surged 29% as upcoming luxury launches and redevelopment opportunities are expected to fuel pre-sales, collections, and earnings. The company has a pipeline of 22 projects with an aggregate GDV of ₹17,500-18,000 crore.", "category": "Business", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "ecd88d7d"}, {"headline": "Digital Lender Moneyview Shares Close 67% Above IPO Price", "summary": "Moneyview's shares closed 67% above its IPO price on listing day, increasing the paper value for early investors like Ribbit Capital, Accel, and Tiger Global. The stock listed at ₹55, a 61.8% premium, and ended at ₹56.75.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "b55a4ed6"}, {"headline": "Vedanta Copper Aims for 1 Million-Tonne Output by 2030, Plans $2.3 Billion Capex", "summary": "Vedanta Copper plans to invest $2.3 billion over 3-4 years to expand copper output beyond 1 million tonnes by 2030. This includes potentially restarting its Tuticorin smelter in Tamil Nadu and developing operations in Saudi Arabia and Fujairah, UAE.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "217b315d"}, {"headline": "SK Hynix Listing Sustains US IPO Momentum, Bolstered by AI Deals", "summary": "SK Hynix's $26.5 billion US listing contributed to $36.1 billion raised in US IPOs in Q3, making it the second-busiest quarter since June 2021. Despite some postponements, AI-related mega-deals continue to drive market activity, lifting weighted average returns to 8.8%.", "category": "Technology", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "517b7a6f"}, {"headline": "Rupee Falls Most in Over 2 Months to 96.31 Against Dollar", "summary": "The rupee depreciated by half a percentage point, closing at 96.3150 against the dollar, its biggest fall in over two months. Rising US bond yields and a stronger dollar dented emerging market currencies, pushing the dollar index to 101.9.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "0cb89152"}, {"headline": "Dani Rodrik: Services, Not Manufacturing, Will Drive Global Economy", "summary": "Harvard professor Dani Rodrik argues that 'productivity growth in consumer services is powering India's rise' and will be the new motor of the global economy. He emphasizes ending poverty, boosting the middle class, and tackling climate change as interlinked, services-based challenges.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "ba118ecb"}, {"headline": "RBI Directs Banks to Address Recurring Customer Complaints and Gaps", "summary": "The Reserve Bank of India instructed banks to strengthen systems, identify underlying systemic issues, and conduct root-cause analysis for recurring customer complaints and regulatory compliance gaps. Over 1.33 million complaints were received in FY25, a 13.55% increase.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "f4b3f7cb"}, {"headline": "Vedanta Bets on Mangla, Northeast for Growth, Plans $200M Investment", "summary": "Vedanta Oil and Gas plans a $200 million investment in its Rajasthan fields in FY27 to boost crude output from existing wells, targeting over 150,000 bpd from Mangla. It's also developing the northeast region as a new hub for gas growth.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "e9920c28"}, {"headline": "Car Companies Increase Dispatches as Festive Season Approaches", "summary": "Automakers posted strong double-digit growth in September sales, dispatching an estimated 460,000 units (up 21% YoY) to dealerships. Maruti Suzuki led with 37% growth. Tailwinds include GST rate cuts, policy rate cuts, and income tax relief.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "0d5aed6b"}, {"headline": "Electric Car Sales Double in September Amid New Models, Improved Infra", "summary": "India's electric car market nearly doubled in September, with sales surging 95% to 34,894 units. EV penetration in PV market rose to 8.2%. Tata Motors retains lead at 42.2%, with new entrants like VinFast and Maruti rapidly gaining share.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "eeb08b77"}, {"headline": "WhatsApp Introduces New Optional Parental Controls for Teen Accounts", "summary": "WhatsApp launched new parental controls, allowing parents to manage teens' privacy settings, group activity, Channels, and Meta AI experience. Parents will be notified when teens join/leave groups or if group size significantly increases.", "category": "Technology", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "88712619"}, {"headline": "TDB Halts R&D Funding Call Citing Massive Backlog of Proposals", "summary": "The Technology Development Board (TDB) paused new project proposals under the government’s Research, Development and Innovation (RDI) scheme due to a 'massive influx' of applications, not a fund shortage. It aims to clear a backlog of 124 proposals received by April.", "category": "Science", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "44b2147b"}, {"headline": "UPI Crosses 200 Billion Transactions in 9 Months, MDR Regime Looms", "summary": "India's UPI processed 205.24 billion transactions worth ₹261.61 lakh crore from January-September 2026, a 24% volume increase YoY. Daily transaction value averaged ₹97,913 crore in September. New MDR regime from Oct 15 will impact economics.", "category": "Technology", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "340ef7a3"}, {"headline": "OpenAI Accuses Chinese Rival Moonshot AI of Mass Data Swipe", "summary": "OpenAI accused its Chinese competitor Moonshot AI of a wide-scale effort to extract data from its GPT systems. OpenAI observed thousands of attempts to decipher how its models reason, peaking at 16,000 requests, to reproduce its capabilities.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "0653e464"}, {"headline": "Bessemer Venture Partners Names Mayank Khanduja as India Partner", "summary": "Mayank Khanduja, former Elevation Capital partner, joined Bessemer Venture Partners as a partner in its India team. He will focus on early-stage investments, working with founders from their first institutional funding round.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "1dedd9a0"}, {"headline": "China Leads Global AI Innovation Race with Dominant Patent Share", "summary": "China holds a dominant share of granted artificial intelligence patents worldwide, leading the global AI innovation race. This indicates significant advancements and investment in AI R&D, outpacing other nations including the United States and Europe.", "category": "Technology", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "152c257d"}, {"headline": "Kuku Technologies Turns Profitable, FY26 Revenue Jumps Sixfold", "summary": "Kuku Technologies, parent of Kuku FM, reported a sixfold jump in operating revenue to ₹1,484.2 crore in FY26, turning profitable with a net profit of ₹182.7 crore. The turnaround was boosted by deferred tax credit despite rising customer acquisition costs.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "c2cd8661"}, {"headline": "City Hotels See Rising Weekend Occupancy, Signaling Market Maturity", "summary": "Indian city hotels are experiencing increased weekend occupancies, signaling a maturing hospitality market. Nationwide Friday-Saturday occupancy reached almost 67% for January-August. Staycations and business travelers extending stays are driving demand.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "25037aaf"}, {"headline": "Todd Boehly's Chelsea Dream Ends as Clearlake Capital Buys Him Out", "summary": "Todd Boehly's tenure as Chelsea's public face ends as majority shareholder Clearlake Capital agrees to buy him out. Despite two trophies, Boehly, who was hands-on in recruitment, failed to win over fans and fell out with partners over differing visions and team performance.", "category": "Sports", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "d004bb7d"}, {"headline": "Titan Launches Vetra, an In-House Mechanical Movement Brand", "summary": "Titan Company Limited is making a deliberate move into modern horology with Vetra, its new in-house mechanical movement brand. Vetra aims to bring Titan into a select group of global watchmakers developing movements, strengthening Indian watchmaking.", "category": "Business", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "ac8b4862"}, {"headline": "Lionel Messi Hints at Florida Future with $8 Million Mansion Purchase", "summary": "An entity linked to Lionel Messi has purchased a neighboring property for $8 million in Fort Lauderdale, next to his current $10.8 million home. This acquisition hints at the football superstar's long-term plans to stay in the city where he plays for Inter Miami.", "category": "Sports", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "16e5674c"}, {"headline": "Elizabeth Holmes Documentary Offers Shocking Unprecedented Access", "summary": "A new documentary provides unprecedented behind-the-scenes access to disgraced Theranos founder Elizabeth Holmes, starting 34 days before her prison sentence. The film, unveiled at Telluride Film Festival, delves into her life post-conviction for fraud.", "category": "Culture", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "c3cf20ad"}, {"headline": "Eight Rules for Eating Out with Kids for a Positive Experience", "summary": "Experts offer eight tips for dining out with children, emphasizing practice, choosing the right place, open communication with restaurants, mindfulness, having an extraction plan, involving kids in ordering, low-tech entertainment, and showing appreciation.", "category": "Culture", "page": 18, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "8b8d9f67"}, {"headline": "The Runway Edit Fuses Fashion with Luxe Experiences in Bengaluru", "summary": "Bengaluru hosted 'The Runway Edit' (TRE), an invitation-only luxury platform merging fashion with premium experiences. The event, by MKJ Entertainment, featured designer Shubhika Sharma's Papa Don't Preach, actress Riya Sen, and live performances for HNIs.", "category": "Culture", "page": 18, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "8a02d638"}, {"headline": "Amsterdam's Tulip Museum: A Guide to Tulipmania and Spring Plantings", "summary": "As tulip planting season approaches, Amsterdam's Tulip Museum is recommended for its varieties and history of 'tulipmania.' The article highlights species bulbs and old favourites like 'Angelique' and 'Blue Diamond' for spring displays.", "category": "Culture", "page": 18, "importance": 3, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "c77db574"}, {"headline": "How AI Makes Scams More Sophisticated and Harder to Detect", "summary": "AI is making scams like voice cloning, deepfake videos, and phishing more sophisticated and harder to detect. Americans reported over $893 million in losses from AI-connected cases in 2025. Scammers exploit fear and urgency, making detection challenging.", "category": "Technology", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "32d8fd74"}, {"headline": "Doomers and Boosters: The Warring Camps in the AI Debate", "summary": "The AI debate has hardened into 'doomers' (fearing dangerous consequences) and 'accelerationists' or 'boosters' (demanding faster progress). Doomers include figures like Dario Amodei, while boosters include Marc Andreessen and Jensen Huang, who oppose regulation.", "category": "Technology", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "d5ac75a7"}, {"headline": "Sheep's Wool Tested as Sustainable Glacier Protection in Switzerland", "summary": "Swiss researchers are testing sheep's wool as an alternative to plastic tarpaulins for protecting Alpine glaciers from melting. Early results show wool covers melting as effectively as synthetics, while being biodegradable and using discarded Swiss wool.", "category": "Environment", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "c9cb78c6"}, {"headline": "Shakti Group Celebrates 70 Years of Success Across Varied Sectors", "summary": "The Shakti Group, founded in 1950, celebrates 70 years of evolution across automotive, consumer lifestyle, and hospitality sectors. Under Venkatesh Tatuskar, it grew from cattle feed to partnerships with Tata Motors, Toyota, JLR, Tanishq, and luxury stays.", "category": "Business", "page": 19, "importance": 4, "telegram_url": "https://t.me/c/1877410077/139167", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139167"}], "article_id": "47bc4302"}, {"headline": "Govt Halves Sugar Stock Limit to 1,000 Quintals to Curb Hoarding", "summary": "The government reduced the sugar stock limit for dealers from 2,000 to 1,000 quintals for a 15-day period, effective October 15 to November 30. This measure aims to prevent hoarding and stabilize prices during the festival season, which ends November 11. Ex-mill prices are between ₹4,500-₹4,800 per quintal.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}], "importance": 6, "article_id": "b07cdf74"}, {"headline": "India, US Discuss Interim Trade Deal Progress at G20", "summary": "Commerce Minister Piyush Goyal and US Trade Representative Katherine Tai met at the G20 Trade Ministers' meeting to discuss progress on an interim trade deal. Talks focused on market access, resolving legal frameworks for preferential tariffs, and reducing trade barriers, with Goyal emphasizing the need for Global South food security.", "category": "Politics", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/139160"}], "importance": 8, "article_id": "f3aac0bf"}, {"headline": "Google's Gemini 4 AI Faces Internal Skepticism Over Coding Skills", "summary": "Google's new AI model, Gemini 4, is facing internal skepticism regarding its coding proficiency. Some employees believe it lags behind competitors like OpenAI's Astra, potentially hindering its adoption by professional developers due to difficulties with complex software engineering prompts.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139160"}], "importance": 8, "article_id": "d1a6edcb"}, {"headline": "Anup Bagchi Appointed HDFC Bank MD & CEO; Anup Saha to Lead Kotak", "summary": "The RBI approved Anup Bagchi as HDFC Bank MD & CEO for three years from Oct 27, and Anup Kumar Saha as Kotak Mahindra Bank MD & CEO from Jan 1, 2027. Both are ICICI Bank veterans and IIT alumni. Bagchi will manage HDFC's retail growth post-merger; Saha aims to scale Kotak's retail and digital offerings.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139206"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 02-10-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/139133"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/139160"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139167"}], "importance": 9, "article_id": "63956177"}, {"headline": "Anup Kumar Saha to Lead Kotak Mahindra Bank for Three Years", "summary": "The RBI cleared Anup Kumar Saha to become MD & CEO of Kotak Mahindra Bank for a three-year term starting January 1, 2027. Saha, currently a director, succeeds Ashok Vaswani. He is known for his strategic execution abilities and experience from ICICI Bank and Bajaj Finance.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/139160"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 02-10-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/139167"}], "importance": 9, "article_id": "39a1282b"}, {"headline": "Airtel Money Plans Multi-Billion Dollar IPO in London", "summary": "Bharti Airtel's mobile money arm, Airtel Money, is preparing for an IPO in London, potentially valuing it at $8-10 billion. Existing investors like Qatar Investment Authority are expected to sell shares. This move aims to monetize digital assets and fund African network expansions.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/139206"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139160"}], "importance": 8, "article_id": "9f72c79d"}, {"headline": "Orissa High Court Rejects Vedanta Plea for Discounted Bauxite", "summary": "The Orissa High Court dismissed Vedanta's petition seeking bauxite at discounted rates from Odisha Mining Corporation (OMC). Vedanta challenged a 2018 agreement linking prices to market rates, not production costs. This ruling impacts Vedanta's Lanjigarh alumina refinery operations.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_02-10-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/139170"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 02-10-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/139160"}], "importance": 6, "article_id": "434e70d8"}, {"headline": "Eight Pune Students Drown at Maharashtra Beach", "summary": "Eight 16-year-old students from a Pune coaching institute drowned at Diveagar beach in Raigad, Maharashtra, during a picnic. They were part of a 48-member group swept away by strong currents. Search teams recovered all bodies; authorities cited inadequate safety measures.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru 02-10.pdf" const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
