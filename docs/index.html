 "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "68ad7f40"}, {"headline": "JSW Energy's future gains hinge on renewables execution, debt control", "summary": "JSW Energy's Q1FY27 results exceeded expectations, with revenue at ₹5,210 crore and Ebitda at ₹2,870 crore. Future gains depend on successful execution of renewable energy projects and controlling high debt. The company commissioned 1.1 GW in FY27, acquired thermal assets, and expects generation to normalise from Q2.", "category": "Business", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "536e6378"}, {"headline": "IndiGo's revenue growth strong despite Q1 net loss on high costs", "summary": "IndiGo reported a Q1FY27 net loss of ₹240 crore due to sharply higher fuel (86% jump) and leasing costs, despite 19% revenue growth from 21% fare hikes. Analysts remain positive, citing strong demand, international expansion, and improved pricing discipline, with flat capacity growth expected in Q2FY27. The stock is trading under 10x EV/Ebitda.", "category": "Business", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "9af3f270"}, {"headline": "How to compare forex cards on total cost and transparency", "summary": "When selecting a forex card, travelers should compare exchange rates, fees (issuance, reload, inactivity, ATM withdrawal), acceptance, reload options, and security features. Thomas Cook India's One Currency Card offers zero forex markup and cross-currency conversion charges, allowing users to lock in rates and spend in multiple currencies. Transparency in pricing is crucial.", "category": "Economy", "page": 17, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "adf2a4d5"}, {"headline": "Risks of buying resale flat without NOC: Experts explain old dues", "summary": "Purchasing a resale flat without a no-dues certificate from the apartment association can expose homebuyers to unexpected maintenance claims from previous owners. Legal experts advise obtaining an NOC, ensuring the sale deed clearly assigns responsibility for pre-sale dues to the seller, and including an indemnity clause to cover undisclosed liabilities.", "category": "Law", "page": 17, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "3ecfb00a"}, {"headline": "VinFast’s India entry: Can Vietnamese EV giant sustain growth?", "summary": "Vietnamese EV giant VinFast has rapidly become India's fifth-largest electric car maker, leveraging aggressive pricing and integrated mobility services like Green SM. Despite a swift plant setup and strong initial sales, the company faces intense competition in India's hyper-competitive market and auditors have raised 'going concern' doubts due to significant global losses and heavy reliance on its domestic market.", "category": "Business", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "93fbcc5d"}, {"headline": "Narayana Murthy: Entrepreneurs face tougher challenges now than in 80s-90s", "summary": "Infosys co-founder N R Narayana Murthy stated that today's entrepreneurs face tougher challenges, competing globally and needing to be smarter and more innovative. He noted the shift to venture capital funding, leading founders to divest more equity earlier. Murthy emphasized AI's potential in increasing productivity and revenue if employees are well-trained, especially in requirement definition and complex algorithm development.", "category": "Business", "page": 23, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 23, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "8bdfbb36"}, {"headline": "Govt orders GitHub to take down BitChat citing anonymity concerns", "summary": "India's Cybercrime Coordination Centre (I4C) ordered GitHub to remove code for BitChat, a peer-to-peer messaging platform using Bluetooth mesh technology without internet. The government argues BitChat's anonymity (no user registration or logging) impedes lawful interception, attribution, and investigation, facilitating misuse during public disorder, terrorism, or internet shutdowns.", "category": "Technology", "page": 24, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "ef3eb2ab"}, {"headline": "13 dead, including infant, as boulders crush vehicle in Himachal", "summary": "Thirteen people, including a six-month-old infant, were killed when massive boulders from a nearby hill crashed onto a moving taxi in Himachal Pradesh’s Lahaul and Spiti. Two others narrowly escaped as the vehicle, traveling from Kullu to Killar, was completely crushed near Kadu nallah and subsequently caught fire.", "category": "India", "page": 24, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "3685d67b"}, {"headline": "US levies 10% tariff on India; trade concerns remain", "summary": "India faces a lower 10% US tariff under the Section 301 forced-labour regime, aligning with Bangladesh, Sri Lanka, Indonesia, Malaysia, and Pakistan. This is a partial win, but unresolved issues like pharma tariffs and Russian oil purchases remain.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "6eb0bee4"}, {"headline": "Deadlock continues over Education Minister Pradhan’s resignation demand", "summary": "A standoff persists between the Centre and protesters demanding Union Education Minister Dharmendra Pradhan's resignation. Talks failed, and activist Sonam Wangchuk ended his 26-day fast, but government sources state no decision has been made on Pradhan's departure.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "0d5960e3"}, {"headline": "Gujarat plans ₹35,000-crore maritime push: 3 shipyards, 6 new ports", "summary": "Gujarat unveiled plans for three greenfield shipyards, an integrated mega shipbuilding cluster, and six new ports, attracting over ₹35,000 crore investment. Projects will be developed under a BOOT model, strengthening Gujarat's position as India's leading port and shipbuilding hub.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "6c330e8f"}, {"headline": "Government orders GitHub to block Bitchat repositories amid Jantar Mantar protests", "summary": "The Centre directed GitHub to disable access to Bitchat repositories, citing concerns the Bluetooth mesh-based app could bypass internet shutdowns and facilitate unlawful activities during protests. This sparked debate between national security and digital rights advocates.", "category": "Law", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "1dd2e632"}, {"headline": "HCLTech and Sarvam invest ₹14,257 crore in Odisha AI technology centre", "summary": "HCLTech signed an MoU with the Odisha government to establish a world-class AI technology centre in Bhubaneswar by 2028. The ₹14,257 crore investment, including HCLTech's strategic stake in Sarvam AI, aims to innovate AI solutions and boost local talent.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "e8c60c66"}, {"headline": "Engineering leads bank credit growth with 17% CAGR over 3 years", "summary": "Engineering recorded the fastest growth in bank credit deployment, up 17.6% CAGR over three years, reflecting India's infrastructure push. Outstanding credit reached ₹3.24 lakh crore by May 2026. Other sectors like electronics and edible oils also saw significant growth.", "category": "Economy", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "764755b0"}, {"headline": "Laurus Labs Q1 net profit jumps 126% to ₹368 crore", "summary": "Hyderabad-based Laurus Labs reported a 126% rise in Q1 FY27 net profit to ₹368 crore, with total revenue up 29% to ₹2026 crore. Growth was driven by CDMO deliveries and strength in affordable medicines, expanding profitability and portfolio transformation.", "category": "Business", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "dd827729"}, {"headline": "Government eases FDI rules for e-commerce to boost exports", "summary": "The government's decision to allow foreign-funded e-commerce companies to hold inventory for exports is expected to boost export volumes and reduce compliance burdens for Indian sellers. Experts caution against misuse as a backdoor for domestic B2C e-commerce. MSMEs are likely to gain.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "eac4e17e"}, {"headline": "Hindustan Zinc Q1 net profit more than doubles to ₹5,469 crore", "summary": "Hindustan Zinc reported a 145% increase in Q1 FY27 net profit to ₹5,469 crore, driven by better realization and lower costs. Revenue rose 72% to ₹13,033 crore. The company also announced the appointment of Amarendu Prakash as CEO and Amit Gupta as CFO.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "4df5c2fa"}, {"headline": "Welspun Corp acquires 26% stake in GGBS green construction materials venture", "summary": "Welspun Corp Ltd is expanding into green construction materials by taking a 26% stake in Slagexcel Private Ltd, a new company manufacturing ground granulated blast furnace slag (GGBS). Welspun Corp also increased its stake in Welspun Captive Power Generation to 74%.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "c6c40cf9"}, {"headline": "JM Frictech India targets 20% revenue growth in FY27 from tractor demand", "summary": "Chennai-based auto component manufacturer JM Frictech India aims for 20% revenue growth in FY27, largely driven by the tractor industry. The company, which posted ₹520 crore revenue in FY26, is investing ₹35 crore in a new plant in Chandigarh.", "category": "Business", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "74a0c6b2"}, {"headline": "Indian electric bus makers enter global market, challenging China's dominance", "summary": "Indian commercial vehicle makers like EKA Mobility and Switch Mobility are entering the $40 billion global electric bus market, currently dominated by Chinese manufacturers. They target markets in Africa, Mauritius, and Europe, focusing on cost-effectiveness and customization.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "f7378545"}, {"headline": "PSU oil marketing firms' LPG under-recoveries exceed ₹51,000 crore", "summary": "Cumulative under-recoveries for PSU OMCs on domestic LPG crossed ₹51,000 crore by June 2026, despite ₹52,000 crore government compensation. Oil Minister Hardeep Singh Puri stated the implicit subsidy on a 14.2 kg cylinder was over ₹700 in June.", "category": "Economy", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "370ff2da"}, {"headline": "India's power demand surges 11% in early July amid delayed monsoon, high humidity", "summary": "Electricity demand increased by 10.7% y-o-y from July 1-16, driven by delayed monsoon and high humidity boosting cooling needs. India hit its second-highest peak power demand of 270.20 GW on July 16. Spot power tariffs rose to ₹7 per unit.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "5b213b7d"}, {"headline": "Mercedes-Benz launches AMG E 53 Hybrid in India", "summary": "Mercedes-Benz has launched the AMG E 53 Hybrid in India, a performance derivative of the E-Class. Available in Performance (₹1.45 crore) and Racing (₹1.48 crore) editions, this plug-in hybrid features a 3.0-litre inline-six turbo-petrol engine with 4Matic+ AWD and 577 bhp.", "category": "Business", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "85158952"}, {"headline": "Force Motors launches Urbania Deluxe variant with refreshed interior", "summary": "Force Motors introduced a Deluxe variant of its Urbania people-mover, featuring a refreshed interior with leatherette seats, wood-finish floor, 9-inch touchscreen, 8-speaker sound, powered sliding footstep, and 16-inch alloy wheels. Prices start at ₹28.7 lakh (ex-showroom).", "category": "Business", "page": 4, "importance": 1, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "5ac5d0b5"}, {"headline": "Royal Enfield updates Classic 350 with slip-and-assist clutch", "summary": "Royal Enfield updated the Classic 350 dual-channel ABS versions with a slip-and-assist clutch for lighter action and improved gearshifts. It also added a faster USB Type-C charging port. Prices start at ₹1.95 lakh (ex-showroom).", "category": "Business", "page": 4, "importance": 1, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "4579d2ad"}, {"headline": "REC's Q1 consolidated net profit stands at ₹4,193 crore", "summary": "State-run REC reported a 6% y-o-y decline in Q1 consolidated net profit to ₹4,193 crore. Total income was ₹14,200 crore. Despite the dynamic environment, REC maintained a healthy net interest margin of 3.34%.", "category": "Business", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "ec6997ab"}, {"headline": "Smaller UPI players urge NPCI to rethink UPI Meta rollout", "summary": "Smaller UPI players have asked NPCI to reconsider UPI Meta, arguing it could strengthen larger apps' dominance by shifting consumer choice from transaction-specific to one-time onboarding. They contend UPI already offers frictionless payments and call for wider consultations.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "c309ccb8"}, {"headline": "Crypto exchanges welcome government's SRO proposal for virtual digital assets", "summary": "Cryptocurrency industry leaders praised the government's call for self-regulatory bodies (SROs) to regulate virtual digital assets (VDAs), calling it a \"practical\" interim move. The proposal from the Parliamentary Standing Committee on Finance addresses the regulatory grey area.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "b2ff2e53"}, {"headline": "AI productivity offsets wage hikes, supports IT margins in Q1", "summary": "Top IT services companies faced margin pressure in Q1 due to annual wage hikes and AI investments. However, AI-led productivity gains, operational efficiencies, and currency tailwinds helped cushion the impact, with companies expecting margin improvement.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "502ab25a"}, {"headline": "Jubilant Ingrevia plans ₹600 crore annual capex, eyes $500 million acquisitions", "summary": "Jubilant Ingrevia plans to invest ₹500-600 crore annually in capex to expand production of Vitamin B3, Vitamin B4, personal care actives, and vitamin-mineral premixes. It also considers acquisitions exceeding $500 million in emerging sectors.", "category": "Business", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "7b3a24d2"}, {"headline": "Saraswat Co-op Bank targets ₹2 lakh crore business by doubling in six years", "summary": "Saraswat Co-operative Bank (SCB) plans to double its total business (deposits + advances) to ₹2 lakh crore and become a pan-India bank within six years. The bank, India's largest UCB, ended FY26 with ₹1.06 lakh crore business and zero net NPAs.", "category": "Business", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "29cc7a7f"}, {"headline": "Infosys target price trimmed by analysts after Q1 results", "summary": "Infosys shares fell after Q1 results, with the tech major moderating its FY27 constant currency revenue growth guidance to 1.5–3%. BofA, Morgan Stanley, Jefferies, and Elara Capital all cut target prices, citing worsening growth outlook and a client contract termination.", "category": "Business", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "d8a12379"}, {"headline": "Juniper Green Energy's ₹1,800-crore IPO to open July 30", "summary": "Renewable energy company Juniper Green Energy will open its ₹1,800-crore IPO for public subscription from July 30 to August 1. The issue is a fresh issue of shares, with proceeds primarily used to repay borrowings.", "category": "Business", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "bcd0b61e"}, {"headline": "Nifty, Sensex fall for fifth day as surging oil prices rattle market", "summary": "Indian equities, Nifty and Sensex, fell for a fifth consecutive session, with Brent crude surpassing $100/barrel due to West Asia conflict. Rate-sensitive sectors like private banks and realty plunged over 4%, while FPIs net sold ₹3,289.31 crore equities.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "441d1ebf"}, {"headline": "Advanced Sys-Tek files IPO papers with SEBI for ₹98 crore fresh issue", "summary": "Advanced Sys-Tek has filed preliminary papers with SEBI for an IPO comprising a fresh issue of up to ₹98 crore and an offer-for-sale. Proceeds will fund expansion plans and working capital, including a fabrication facility in Vadodara.", "category": "Business", "page": 8, "importance": 2, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "cbf33561"}, {"headline": "Caliber Mining and Logistics debuts with 23% gains at ₹528.20", "summary": "Caliber Mining and Logistics shares made a strong debut, listing at a nearly 18% premium and closing with 23% gains at ₹528.20 over the ₹424 IPO price. The IPO was subscribed 146.64 times and included a fresh issue of ₹400 crore.", "category": "Business", "page": 8, "importance": 2, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "b88d41e2"}, {"headline": "Naresh Pal Gangwar appointed Higher Education Secretary; Opposition criticises move", "summary": "Naresh Pal Gangwar, previously Animal Husbandry Secretary, was appointed Higher Education Secretary. Opposition leaders criticized the move, citing past corruption allegations involving his family's receipt of over ₹1.16 crore in government subsidies.", "category": "Politics", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "1bfadb2e"}, {"headline": "Supreme Court seeks Centre’s response to NEET reforms", "summary": "The Supreme Court indicated it would monitor the Centre's NEET overhaul, directing a detailed response on shifting to a computer-based test (CBT) and data security safeguards. It noted ad-hoc fixes like IAF question paper transport aren't permanent solutions.", "category": "Education", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "8e4e9edc"}, {"headline": "LMW plans foray into EVs, renewables, and robotics with MoA amendment", "summary": "Lakshmi Machine Works Ltd (LMW) proposes amending its memorandum of association to enter emerging sectors like electric vehicles, renewable energy, and robotics. This aims to facilitate future business growth and align with evolving technological advancements.", "category": "Business", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "598a91bf"}, {"headline": "First cohort of RDI Fund managers to be unveiled within a week, says official", "summary": "The Union government's Research Development and Innovation Fund (RDIF) will announce and disburse money to its first cohort of around 20 Second Level Fund Managers within a week. The government expects ₹20,000 crore to be deployed annually.", "category": "Economy", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "ea0d9b19"}, {"headline": "Crude oil retreats, but set for weekly rise amid West Asia concerns", "summary": "Crude oil futures fell over 3% on Friday but are still poised for weekly gains due to West Asia tensions and fears of US-Iran war escalation, particularly around the Red Sea. Brent futures fell to $96.70/barrel.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "671d8178"}, {"headline": "Copper prices edge higher, set for weekly gain as stocks tighten", "summary": "Copper prices ticked higher, on course for a small weekly gain as stocks outside the US tightened, despite macro concerns. Benchmark three-month copper on the LME was up 0.2% at $13,615 a tonne. Aluminium and zinc also saw movement.", "category": "Economy", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "1d271efb"}, {"headline": "North India sees 8% rise in urad acreage after recent rains", "summary": "Urad (black matpe) acreage in North India is up 8% y-o-y to 18.67 lakh hectares this kharif season, driven by recent rains and remunerative prices. Farmers in UP, MP, and Rajasthan expanded coverage, while Maharashtra and Karnataka saw declines.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "d2fab731"}, {"headline": "Over 10% monsoon deficiency impacts kharif output, says Union government", "summary": "The Union government stated that kharif output is hit by monsoon deficiencies above 10%, citing historical data. Union Minister of State for Textiles Pabitra Margherita noted cotton production declined from 352.48 lakh bales (2020-21) to 290.91 lakh bales (2025-26).", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "58aa73d0"}, {"headline": "Widespread rain forecast for North, Central, and West India in coming week", "summary": "The IMD forecasts widespread to heavy rainfall across large parts of North-West, Central, and Western India for the coming week. South Gujarat and Ahmedabad experienced extremely heavy rain, with continued showers expected in several states.", "category": "Environment", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "78f0c44c"}, {"headline": "Gold holds steady ahead of Fed rate decision, West Asia tensions", "summary": "Spot gold remained unchanged at $4,046.10/ounce as investors assessed West Asia developments and their inflation implications before next week's US interest rate decision. US gold futures for August delivery gained 0.3% to $4,063.60.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "dd55c5bd"}, {"headline": "India's value-added coffee exports grow 46% to $686 million in three years", "summary": "India's value-added coffee exports increased by 46% to $686 million from 2023-24 to 2025-26. Total coffee exports reached $2,083 million in 2025-26. Karnataka is the largest producer, with Coffee Board supporting processing upgrades and brand promotion.", "category": "Economy", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "842c9aa4"}, {"headline": "Global crude steel output up 1.7% in June; India records 4.5% rise", "summary": "Global crude steel production rose 1.7% y-o-y to 155.7 million tonnes in June 2026, with India's output increasing 4.5% to 14.1 million tonnes. India retained its position as the second-largest producer, showing the fastest growth among top five nations.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "fd8cf92f"}, {"headline": "CMFRI launches DeepDATA app for digital documentation of deep-sea marine biodiversity", "summary": "The ICAR-Central Marine Fisheries Research Institute (CMFRI) launched DeepDATA, a mobile app for digitally documenting deep-sea marine biodiversity. The app, funded by the Deep Ocean Mission, allows users to explore and contribute scientifically verified information on deep-sea fish species.", "category": "Science", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "c3b2d343"}, {"headline": "Quality tea prices rise at Kochi auctions due to blenders, exporters", "summary": "Quality teas at Kochi auctions fetched better prices across dust and leaf categories, supported by blenders' and exporters' buying. The CTC dust market gained ₹2/kg, while orthodox leaf teas saw steady demand from CIS buyers.", "category": "Business", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "a09f777d"}, {"headline": "Geopolitical crises highlight need for India's farm resilience: SML Executive Director", "summary": "Komal Shah Bhukhanwala, Executive Director of SML Ltd, stated that current geopolitical tensions emphasize the need to strengthen India’s agricultural resilience due to import dependence on fertilizer raw materials. She urged policy support for innovative solutions to improve yields.", "category": "Economy", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "f10097bb"}, {"headline": "IISR partners Spices Board to boost spice sector start-ups and exports", "summary": "The ICAR-Indian Institute of Spices Research (ICAR-IISR) signed an MoU with the Spices Board to strengthen enterprise development and promote export-oriented start-ups. Their Agventure TBI will be an incubation centre for the ASPIRE scheme.", "category": "Business", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "2899fe2f"}, {"headline": "Tamil Nadu Industries Minister reviews projects, seeks feedback", "summary": "Tamil Nadu Minister for Industries S Keerthana reviewed ongoing projects and investment plans with representatives from leading companies and industry associations, including Agnikul and American Chamber of Commerce, focusing on strengthening the state's industrial ecosystem.", "category": "Business", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "8f9ba9e8"}, {"headline": "Karnataka Cabinet expansion expected soon, says AICC General Secretary", "summary": "AICC General Secretary KC Venugopal stated that the expansion of Karnataka Chief Minister DK Shivakumar-led cabinet is imminent. With 20 berths still vacant, pressure mounts on Shivakumar to complete the expansion.", "category": "Politics", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "2cf610aa"}, {"headline": "Karnataka CM unveils infra plans beyond Bengaluru, invites CEOs", "summary": "Karnataka CM DK Shivakumar announced plans for policies to encourage industries beyond Bengaluru with world-class office infrastructure at affordable costs ($0.50/sq ft). He also announced an AI University and Bengaluru Robotics and Innovation Zone.", "category": "Infrastructure", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "07256c95"}, {"headline": "RE corridors in Gujarat, Rajasthan to boost Adani Energy’s revenue", "summary": "Renewable energy corridors in Gujarat's Khavda park and Rajasthan's Bhadla zone, to be commissioned around FY29, will account for 63% of Adani Energy Solutions Ltd's (AESL) under-construction transmission portfolio, boosting future billing potential.", "category": "Infrastructure", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "4a8a48f5"}, {"headline": "Government panel considers parallel power distribution licensing to boost efficiency", "summary": "The Consultative Committee of the Power Ministry discussed a proposal for parallel electricity distribution licensing, allowing new private firms to use existing networks for a fee. This aims to promote consumer choice and improve service, despite opposition from public discoms.", "category": "Economy", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "0912cb70"}, {"headline": "Fusion CX expects to cut 90% of debt post IPO", "summary": "Kolkata-based IT services company Fusion CX expects to resolve nearly 90% of its ₹166.8 crore debt after its proposed ₹1,000 crore IPO. The firm plans to double down on its new AI data infrastructure business.", "category": "Business", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "fae69f86"}, {"headline": "Chennai Mathematical Institute seeks industry partnerships in AI, mathematical sciences", "summary": "The Chennai Mathematical Institute (CMI) plans to deepen industry collaborations in AI and mathematical sciences to enrich student experience and contribute to real-world challenges. It will engage with industry and government, expanding activities through the new Dr FC Kohli Centre of Excellence.", "category": "Education", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "c72d371e"}, {"headline": "Adani Energy Solutions wins ₹8,500 crore Vizag transmission project", "summary": "Adani Energy Solutions Ltd (AESL) secured an ₹8,500 crore inter-state transmission project in Andhra Pradesh to supply power to upcoming green hydrogen and ammonia projects in Visakhapatnam. This will support an estimated 4,500 MW power demand.", "category": "Infrastructure", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "09d269a5"}, {"headline": "Merck licenses experimental once-monthly oral HIV pill to generics", "summary": "Merck signed seven voluntary licensing agreements with generic drug manufacturers to produce lower-cost versions of its experimental once-monthly oral HIV pill, alimatravir, in 129 low- and lower-middle-income countries. The drug is in late-stage development.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "37aac5c8"}, {"headline": "ED seizes Gameskraft assets worth ₹1,906 crore over betting charges", "summary": "The ED provisionally attached Gameskraft assets worth ₹1,906 crore, alleging the online gaming company created an \"addictive\" environment encouraging repeated wagering. This brings total attachments to ₹2,401 crore. Online money gaming was banned in August 2025.", "category": "Law", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "f8c7e911"}, {"headline": "Viasat calls for public-private partnership to drive India's satcom future", "summary": "Global satellite communications firm Viasat advocated for public-private collaboration to unlock India's satcom potential. It emphasized balanced regulation, risk-managed environments, and leveraging India's human capital to attract global talent and investment in the sector.", "category": "Technology", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "abc051d2"}, {"headline": "Air India Express cancels Bahrain, Kuwait flights; IndiGo assesses West Asia", "summary": "Air India Express cancelled flights to Bahrain and Kuwait until July-end, while IndiGo is assessing the West Asia situation following rising tensions between Iran and the US. Airlines are reviewing operations due to geopolitical flare-ups affecting travel.", "category": "World", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "4c59a57e"}, {"headline": "Centre: No proposal to prioritize treating doctors' opinion on insurance claims", "summary": "The Centre stated there's no proposal to require health insurers to prioritize treating doctors' clinical opinions on claims. Insurers assess claims based on policy terms, medical records, and treatment standards. IRDAI does not classify claim rejections by specific reasons like \"non-medical necessity.\"", "category": "Health", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "18752e0a"}, {"headline": "India's weight-loss drug market reaches ₹2,000 crore in one year", "summary": "India's weight-loss drug market grew to ₹2,000 crore within a year, driven by affordable generics and rising obesity treatment acceptance. The GLP-1 market expanded 237% from May 2025 to May 2026. Experts emphasize appropriate prescription and medical supervision.", "category": "Health", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131646", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "article_id": "668aff13"}, {"headline": "Cabinet approves anti-paper leak Bill: up to 10-year jail, ₹10 crore fine", "summary": "The Union Cabinet approved \"The Public Examinations (Prevention of Unfair Means) Act, 2024,\" proposing jail terms up to 10 years and fines up to ₹10 crore for paper leak convictions. Prime Minister Modi announced its introduction in Parliament, emphasizing fast-track courts and retests to prevent academic year loss.", "category": "Politics", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 9, "article_id": "e4b6af4f"}, {"headline": "Bain Capital to acquire UK vitamins maker Vitabiotics for $1.2 bn", "summary": "Bain Capital will acquire 55-year-old UK vitamins maker Vitabiotics, including its India business Meyer Organics and operations across Africa, for approximately $1.2 billion. The private equity firm plans to invest in digital capabilities, e-commerce, international distribution, supply chains, and new product development to support global expansion.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 7, "article_id": "dd1fa92e"}, {"headline": "OpenAI's use of ANI data not copyright infringement: Delhi HC", "summary": "The Delhi High Court ruled that OpenAI's use of copyrighted content to train generative AI models constitutes 'fair dealing' under the Copyright Act, providing interim relief to OpenAI. The court noted that AI model success depends on publicly available information, and licensing from multiple sources would be economically unviable.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 8, "article_id": "7dd0166b"}, {"headline": "Manipal Health can be net debt zero after India's biggest healthcare IPO", "summary": "Manipal Health Enterprises MD & CEO Dilip Jose stated that the company could achieve net debt-zero status after its ₹9,200 crore initial public offering (IPO), which includes an ₹8,000 crore fresh issue to primarily prepay debt and for general corporate purposes. Temasek's and the promoter group's holdings will dilute from 50% to 44% and 70% to 62% respectively.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 7, "article_id": "cd3b5508"}, {"headline": "Hindustan Zinc net profit more than doubles to ~5,469 cr", "summary": "Vedanta subsidiary Hindustan Zinc Ltd's (HZL) net profit more than doubled to ₹5,469 crore in Q1FY27, up from ₹2,234 crore a year ago. The growth was attributed to higher metal prices, increased mined metal production, lead concentrate sales, and a stronger dollar, boosting total income by 74% to ₹14,063 crore.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 7, "article_id": "2c30883e"}, {"headline": "Tata Consumer Products net profit jumps 28% in Q1", "summary": "Tata Consumer Products reported a 27.8% jump in net profit attributable to shareholders at ₹427.0 crore in Q1FY27. Net sales increased by 11.93% to ₹5,348.9 crore, driven by healthy underlying volume growth in India, strong international performance, and significant contributions from Capital Foods and Organic India.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 7, "article_id": "7a15c478"}, {"headline": "Jindal Steel Q1 net falls 43%; reappoints V R Sharma as MD", "summary": "Jindal Steel reported a 43.53% fall in Q1FY27 consolidated net profit to ₹843.80 crore due to higher expenses, despite increased income of ₹15,501.32 crore. The company also reappointed Vidya Rattan Sharma as Managing Director for a two-year term, effective July 24, 2026.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 7, "article_id": "3633939a"}, {"headline": "SC proposes special courts for Manipur violence cases", "summary": "The Supreme Court proposed setting up special courts to conduct day-to-day trials in criminal cases arising from the 2023 ethnic violence in Manipur. It also directed probe agencies to expeditiously complete pending investigations and ensure victims receive copies of chargesheets within one week of legal aid counsel contact.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 8, "article_id": "4a6f3e92"}, {"headline": "Sebi bars Viresh Joshi from markets for 7 years in front-running case", "summary": "Market regulator Sebi barred Viresh Joshi, former chief dealer of Axis Mutual Fund (MF), for seven years from the securities market and imposed a ₹3 crore penalty for alleged front-running trades. Twenty others involved in the manipulation activities also received debarments (3-7 years) and penalties (₹10 lakh-₹1 crore).", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "d34b1da4"}, {"headline": "NTA Sacks 47 Officials; Delhi Police Sets up STF to Probe Paper Leaks", "summary": "Amid NEET-UG leak protests, NTA terminated 47 officials with \"more cleanup to follow\". Delhi Police formed a Special Task Force (STF) to investigate paper leaks under the Public Examinations (Prevention of Unfair Means) Act, 2024. Legal and criminal action will be initiated against some officials, with STF expediting trials.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 9, "article_id": "0de13d26"}, {"headline": "Union Minister Bittu Resigns to Shift Focus to Punjab Politics", "summary": "Union Minister of State for Railways and Food Processing Industries Ravneet Singh Bittu resigned from the Union Council of Ministers. His Rajya Sabha term ended in June. BJP plans for him to play a bigger role in upcoming Punjab assembly elections, potentially fielding him from a Ludhiana assembly seat.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 5, "article_id": "0832a480"}, {"headline": "Supreme Court to hear petitions on alleged police excesses during protests", "summary": "The Supreme Court agreed to hear two petitions alleging police excesses during the July 20 crackdown on student protesters. Chief Justice Surya Kant clarified that no formal petition was filed earlier, but two were formally instituted later, seeking urgent listing.", "category": "Law", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 7, "article_id": "fd9eada8"}, {"headline": "Bill in Rajya Sabha seeks to penalise insult to ‘Vande Mataram’", "summary": "The government introduced 'The Prevention of Insults to National Honour (Amendment) Bill, 2026' in the Rajya Sabha. It aims to make any obstruction or insult to the national song 'Vande Mataram' a criminal offense, carrying a punishment of up to three years' imprisonment, extending similar protection as 'Jana Gana Mana'.", "category": "Politics", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "b21ae753"}, {"headline": "Bengaluru Tech Summit to Add Electronics, Semiconductor Track for 2026", "summary": "Bengaluru Tech Summit will feature a dedicated track and exhibition for electronics and semiconductors in November 2026, themed \"AI and Beyond\". Karnataka CM Shivakumar announced the initiative to foster a globally connected innovation ecosystem, expecting 1,800 exhibitors and 25,000 delegates.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "8f8232aa"}, {"headline": "India's private sector activity fell to 4-year low in July: Flash PMI", "summary": "India's private sector activity slowed to a four-year low in July, with the HSBC Flash India Manufacturing PMI easing to 53.9 and Services PMI falling to 53.1. Growth in sales and output weakened due to renewed West Asia tensions and rising inflationary pressures, according to the HSBC PMI survey compiled by S&P Global.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 8, "article_id": "e6bab6c2"}, {"headline": "FM Sitharaman urges I-T authorities to speed up appeal disposals", "summary": "Finance Minister Nirmala Sitharaman urged income tax authorities to accelerate the disposal of taxpayer appeals, noting that the 224,000 disposals in FY26 were insufficient against 540,000 pending cases. She emphasized that tax certainty is crucial for improving ease of doing business and India’s attractiveness as an investment destination.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "8cd2a859"}, {"headline": "Swiggy CEO: Quick Commerce to Stay Well-funded, Product Differentiation Key", "summary": "Swiggy founder Sriharsha Majety said the quick commerce industry will remain well-funded and competitive. He emphasized winning through distinctive product offerings rather than just price, focusing on reliable availability, differentiated categories, strong partner brands, and making Instamart a destination for everyday upgrades.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "f4b31702"}, {"headline": "Coforge Lands Five-Year AI Transformation Deal Worth $230M in Europe", "summary": "Mid-tier IT player Coforge secured a five-year AI-led transformation deal worth over $230 million with a European client. The company's stock surged on the news, making it one of its largest AI-led programs in the region, aiming to improve decision-making, increase productivity, and reduce manual effort.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 6, "article_id": "f6bb8054"}, {"headline": "HCLTech to set up AI data centre with ~15,000 cr outlay in Bhubaneswar", "summary": "HCLTech announced it will establish its first AI-optimised data centre and global technology centre in Bhubaneswar, Odisha, with a total investment estimated around ₹15,000 crore. This project, in partnership with Sarvam AI and the Odisha government, aims to deliver AI-led digital solutions and strengthen India's sovereign AI ecosystem by 2028.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 7, "article_id": "09dbe7ce"}, {"headline": "Lakshmi Mittal’s Rajasthan Royals Deal Sparks London Lawsuit", "summary": "Billionaire Lakshmi Mittal's acquisition plan for Rajasthan Royals cricket franchise sparked a London lawsuit. Minority shareholders allege they're being forced to sell shares worth $50 million for £1, accusing Emerging Media Ventures Ltd of \"serious misconduct\" to deny them sale proceeds from the $1.65 billion sale.", "category": "Sports", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 5, "article_id": "a30f9704"}, {"headline": "India’s Forex Reserves Up $1 Billion to $749 Billion", "summary": "India’s foreign exchange reserves increased by $1 billion to $749 billion in the week ended July 16. Foreign currency assets rose by $4.5 billion, despite RBI selling dollars to curb rupee volatility. This was offset by a $3.5 billion decline in gold reserves. Inflows from FCNR(B) deposits are expected to boost reserves further.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 5, "article_id": "b012d9cc"}, {"headline": "Bank of Baroda net profit slumps 72% due to $600 mn settlement", "summary": "State-owned Bank of Baroda (BoB) reported a 72% year-on-year drop in net profit to ₹1,278 crore for Q1FY27. This sharp decline was due to a $600 million out-of-court settlement with administrators of UAE-based NMC Health Plc, resolving all litigation related to the company's collapse. Excluding this, profit would have been ₹5,528 crore.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 5, "article_id": "29932d70"}, {"headline": "Shriram Finance Reports 60% Profit Growth in Q1", "summary": "Shriram Finance reported a 60% increase in Q1 standalone net profit to ₹3,445 crore. Net interest income climbed 33.7% to ₹8,056 crore, and net interest margin expanded to 9.04%. Gross stage 3 assets stood at 4.64%, with net stage 3 assets improving to 2.33%, indicating improved asset quality.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 4, "article_id": "60ddf4b7"}, {"headline": "Bank of India Net Up 36%, Eyes $1.2 Billion FCNR Flows", "summary": "Bank of India reported a 36% YoY jump in Q1 net profit to ₹3,068 crore. The state-owned bank aims to raise $1.2 billion in FCNR-B deposits and $2 billion from other overseas borrowings, leveraging the RBI's subsidised hedging facility to lower deposit costs and substitute reliance on bulk deposits.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 5, "article_id": "98ab7e4c"}, {"headline": "SBI Life Net Profit Rises 22% on Strong Premium Growth", "summary": "SBI Life Insurance reported a 22% YoY rise in Q1 net profit to ₹720 crore, driven by strong premium growth. Value of new business (VNB) increased 29%, while annualised premium equivalent (APE) rose 36%. VNB margin declined to 26.2% due to a larger share of lower-margin group term insurance products.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 4, "article_id": "e8a83fc9"}, {"headline": "Nityas Gems, Intellius Recode receive SEBI approval for IPOs", "summary": "Nityas Gems and Jewellery Ltd and Intellius Recode Ltd received SEBI approval for their IPOs. Nityas Gems' IPO is a fresh issue of 1.44 crore shares. Intellius Recode's IPO includes a ₹117 crore fresh issue and an OFS.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 3, "article_id": "7e862938"}, {"headline": "Trump mulls wider Iranian attacks, threatens 'massive military punishment'", "summary": "US President Donald Trump is considering a 'massive attack' on Iran to force a peace deal, threatening 'major military punishment' if Iran and Houthi militants target commercial ships. Iran rejected a ceasefire proposal; its foreign minister called Trump's threat to use frozen funds for ship damages an 'incendiary precedent'.", "category": "World", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 9, "article_id": "a76125e6"}, {"headline": "Verizon signs $1 bn fibre deal with Google, lifts annual forecasts", "summary": "Verizon secured a deal exceeding $1 billion with Google to provide dark fiber connectivity for data centers and raised its annual adjusted profit forecast to $4.99-$5.04 per share. The telecom operator anticipates more agreements by year-end, potentially generating billions in revenue over several years.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131694"}], "importance": 6, "article_id": "619d8c89"}, {"headline": "Manipal Health to launch India's biggest healthcare IPO on July 29", "summary": "Manipal Health Enterprises will launch India's largest healthcare IPO on July 29, aiming to raise ₹9,275.22 crore at a price band of ₹560-590 per share. The Temasek-backed hospital chain will be valued around ₹77,607 crore. The IPO comprises a fresh issue of ₹8,000 crore and an offer for sale of ₹1,275.22 crore.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 7, "article_id": "2b62473e"}, {"headline": "ACC's Q1 profit plunges 61% to ~147 crore", "summary": "Cement maker ACC's net profit for Q1FY27 fell 60.90% year-on-year to ₹147 crore, impacted by planned maintenance and a higher master supply agreement with Ambuja Cements. Revenue from operations dipped 8.22% to ₹5,808 crore, with sales volume declining 6.54% to 10 million tonnes.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 4, "article_id": "74a168b4"}, {"headline": "Fractal Analytics Q1 net profit almost doubles to ~74 crore", "summary": "AI firm Fractal Analytics reported a nearly twofold surge in consolidated net profit to ₹74.2 crore in Q1FY27, with revenue growing 20% to ₹912.5 crore. The company noted increased enterprise budgets for AI transformation, although TMT sector capex caused a drag on headline growth.", "category": "Business", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 5, "article_id": "67936503"}, {"headline": "Bangladesh President Shahabuddin resigns citing health reasons", "summary": "Bangladesh President Mohammed Shahabuddin resigned on Friday, two years ahead of his tenure's end, citing serious health complications including heart disease, high blood pressure, and Autonomic Neuropathy. Parliament Speaker Hafiz Uddin Ahmed will serve as Acting President until a new one is elected.", "category": "World", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 5, "article_id": "846bbf13"}, {"headline": "SC bars posting court proceedings on social media without prior nod", "summary": "The Supreme Court prohibited posting audio-video recordings of judicial proceedings on social media or other digital platforms without prior court permission. Citing misuse, including selective and edited clippings, and the challenge of regulating digital data, the interim order aims to prevent courts from becoming '24x7 entertainment channels' and ensure limited access.", "category": "Law", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 24, "telegram_url": "https://t.me/c/1877410077/131694"}, {"newspaper": "The Hindu", "pdf_filename": "TH BL HD Bangalore 25~07~2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131646"}], "importance": 7, "article_id": "4f54e5d5"}], "newspapers": ["Economic Times", "Business Standard", "Financial Express", "Times of India", "Hindustan Times", "The Hindu", "Mint", "Indian Express"], "total_articles": 225};
const CAT_META = {"Politics": {"color": "#e8334a", "icon": "🏛️"}, "Economy": {"color": "#f5a623", "icon": "📊"}, "Business": {"color": "#f0c040", "icon": "💼"}, "India": {"color": "#ff7043", "icon": "🇮🇳"}, "World": {"color": "#5c9eff", "icon": "🌍"}, "Sports": {"color": "#36c46f", "icon": "🏆"}, "Science": {"color": "#a78bfa", "icon": "🔬"}, "Technology": {"color": "#38bdf8", "icon": "💻"}, "Health": {"color": "#34d399", "icon": "🏥"}, "Law": {"color": "#fb923c", "icon": "⚖️"}, "Environment": {"color": "#4ade80", "icon": "🌿"}, "Education": {"color": "#e879f9", "icon": "📚"}, "Culture": {"color": "#f472b6", "icon": "🎭"}, "Infrastructure": {"color": "#94a3b8", "icon": "🏗️"}};
const DEFAULT_META = { color: "#636e72", icon: "📰" };

// ── Safety helpers ───────────────────────────────────────────────────────
// Article text comes from Gemini's reading of the newspaper PDFs, so it is
// technically external content (e.g. "AT&T", "R&D", or worse). Escape every
// dynamic string before it goes into innerHTML.
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cat';
}

// ── Shared data (used by both Index and Reader) ─────────────────────────
const allArts = [...DIGEST.articles].sort((a, b) => (b.importance || 0) - (a.importance || 0));
const byCategory = {};
for (const art of allArts) {
  const c = art.category || "India";
  (byCategory[c] || (byCategory[c] = [])).push(art);
}
const sortedCats = Object.keys(byCategory).sort(
  (a, b) => (byCategory[b][0].importance || 0) - (byCategory[a][0].importance || 0)
);

// ── Screen switching ─────────────────────────────────────────────────────
const indexScreen  = document.getElementById('indexScreen');
const readerScreen = document.getElementById('readerScreen');

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
