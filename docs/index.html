<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

phy.", "category": "Culture", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "928c949e"}, {"headline": "India’s table tennis duo power on", "summary": "Manav Thakkar and Manush Shah have become the first Indian pair ranked World No.2 in men's doubles table tennis. Their consistent performance and dedication, despite a challenging training routine, have led to significant international success.", "category": "Sports", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "a87dd883"}, {"headline": "CWG glory target for Chopra, Chanu, Borgohain", "summary": "Olympic medalists Mirabai Chanu, Lovlina Borgohain, and Neeraj Chopra aim for comebacks at the Commonwealth Games after setbacks. Indian athletics has seen significant progress with new national records.", "category": "Sports", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "fd39b6c1"}, {"headline": "Being vigilant citizens in the bystander age", "summary": "Experts discuss bystander inaction during violent attacks, attributing it to fear of legal entanglement and distrust in systems. They emphasize the need for improved police response, public awareness of safe intervention, and better public transport safety.", "category": "Law", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077  "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "f650ee21"}, {"headline": "Oil keeps flowing from Red Sea as Hormuz bypass stays open", "summary": "Despite Houthi threats, Saudi oil continues to flow from Red Sea ports to global markets. Western shipowners are rerouting vessels, while some Iranian-linked ships transit the Bab el-Mandeb strait, highlighting geopolitical risks to oil trade.", "category": "World", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "34d2dd0a"}, {"headline": "Electronics maker IL JIN picks bankers for ₹3,500 crore IPO", "summary": "IL JIN Electronics, a subsidiary of Amber Enterprises India, plans a ₹3,500 crore IPO, appointing Axis Capital, Jefferies, and Motilal Oswal as advisors. The listing aims to raise funds for expansion and a potential secondary share sale.", "category": "Business", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "b9f75435"}, {"headline": "Edge data centres eye India’s hinterland despite odds", "summary": "Data centres are expanding beyond metros into smaller cities, attracted by state incentives and AI demand. However, reliable power, fibre connectivity, and skilled talent remain crucial for sustainable growth in these emerging hubs.", "category": "Technology", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "cfe7d717"}, {"headline": "Consulting firm il prices and potential disruptions to global oil supply.", "category": "Economy", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "ec3b0cf0"}, {"headline": "Widening local sourcing rules to end solar cell makers’ arbitrage", "summary": "New government rules mandating domestic solar cells in renewable projects will end arbitrage for module makers selling imported cells. This aims to boost local cell manufacturing capacity and reduce reliance on imports.", "category": "Business", "page": 17, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "830f431f"}, {"headline": "India’s sushi craze whets appetite for sweet-sour ginger gari", "summary": "Imports of sushi ginger (gari) have surged due to the rising popularity of sushi in India. While Indian ginger is abundant, imports from Thailand, China, and Japan offer a milder flavour preferred for sushi.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "6ffea366"}, {"headline": "Retail veteran revives plan to crack premium grocery", "summary": "Arvind Mediratta is launching Fresh Terra, a premium grocery chain focusing on private labels and healthy staples. The model aims to build trust and quality, offering in-store prepared foods and home delivery within 30-45 minutes.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "3fdfc0d1"}, {"headline": "Existing Instamart network can handle 2X demand, says Swiggy", "summary": "Swiggy's Instamart network can support more than double its current gross order value by optimizing existing dark stores. The company will focus on wider product assortments, larger baskets, and existing infrastructure for profitability.", "category": "Business", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131636", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_25-07-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/131636"}], "article_id": "6af568a7"}, {"headline": "Nifty Settles Below Key 23,800 Level Amid Oil Price Spike, Rupee Depreciation", "summary": "Indian equities fell Friday due to rising crude oil prices and rupee depreciation. Nifty dropped 0.4% to 23,767.45, closing below 23,800, increasing likelihood of further declines. Sensex also fell 0.4%. Both indices recorded weekly declines of 2.3%. FPIs net sold ₹3,893 crore shares.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "903117f2"}, {"headline": "US Slaps 10% Duty on India After Forced Labour Probe", "summary": "The US imposed a 10% tariff on goods from India and 16 other countries over alleged forced labor, replacing a temporary duty. India didn't receive textile and apparel tariff-rate quota exemption for US-origin cotton/fiber exports, raising concerns for exporters about competitive disadvantage.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "e8379c0b"}, {"headline": "Cabinet Clears Stricter Bill on Paper Leaks, Proposing 10-Yr Jail, ₹10cr Fine", "summary": "The cabinet approved a bill for stricter punishment on paper leaks, including up to 10-year jail and ₹10 crore fine for syndicates. This comes amidst NEET paper leak protests. Union ministers are also engaging with CJP leaders for an amicable solution.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "406987a2"}, {"headline": "Adani Says Want to Start Airline, Shows Letter; Group Denies Plans", "summary": "Adani Airport Holdings sought a waiver from AAI to hold over 10% stake in airlines, indicating plans for a next-gen airline. However, Adani Enterprises denied such plans in a stock exchange filing, calling reports “entirely baseless and factually incorrect.”", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "5f39721c"}, {"headline": "RJ Group Picks Ex-Diageo Maven Mishra to Lead Alcobev Foray", "summary": "Ravi Jaipuria's RJ Corp group hired former Diageo executive Prathmesh Mishra to expand its beverages footprint into premium alcoholic drinks, likely under listed Varun Beverages. This strategic move aligns with India's alcoholic beverages market regaining momentum with rising premium demand.", "category": "Business", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "aed0cffa"}, {"headline": "FMCG Cos Get Online Shopping Rewards as Digital-First Brands Drive Revenue", "summary": "India's large consumer goods companies are profiting from acquired digital-first brands. These brands generated over ₹2,000 crore in combined revenue in FY26, up 20% YoY, becoming fast-growing divisions, often achieving double-digit profitability. Marico's acquired portfolio accounted for over 11% of FY26 revenue.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "87d3fb4c"}, {"headline": "BNP Paribas Cardif to Re-enter India, Buy Warburg Stake in IndiaFirst Life", "summary": "BNP Paribas Cardif has agreed to acquire Warburg Pincus’ 25.96% stake in IndiaFirst Life Insurance, marking the French insurer’s re-entry into India’s life insurance market after nearly five years.", "category": "Business", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "69e5368a"}, {"headline": "Assam Flood Toll Rises to 47, CM Flags ‘Unusual’ Rainfall Pattern", "summary": "Assam CM Himanta Biswa Sarma reported 47 deaths and eight missing due to \"unusual\" floods caused by exceptionally heavy rainfall (up to 493% above normal) in Nagaland's Mokokchung, Wokha, Mon districts and Assam's Charaideo. Water could not flow into the overflowing Brahmaputra. An inter-ministerial team will assess damage.", "category": "India", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "b5da1eb9"}, {"headline": "Centre Airlifts 10 More CRPF Companies to Delhi to Bolster Security", "summary": "Ten Central Reserve Police Force (CRPF) companies were airlifted from Chhattisgarh to Delhi to bolster security amidst continuing student protests. The Central Industrial Security Force (CISF) restricted leaves for its Delhi Metro security unit due to the ongoing protests, requiring maximum manpower.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "88f3e39b"}, {"headline": "SC Asks Govt to Spell Out CBT Plan, Pushes for Systemic NEET Reform", "summary": "The Supreme Court pushed for systemic NEET reforms beyond ad hoc measures, asking the Centre for a comprehensive plan on transitioning to a computer-based test (CBT) and protecting data. The government assured a \"holistic view\" for safeguarding exam integrity, following high-level committee recommendations.", "category": "Education", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "5eda698f"}, {"headline": "LS Logjam Enters Day 5 as Govt, Oppn Stick to Their Guns on Paper Leak", "summary": "Lok Sabha was disrupted for the fifth day due to opposition demands for Education Minister Dharmendra Pradhan's resignation over paper leaks. Parliamentary Affairs Minister Kiren Rijiju appealed for discussion, while Rahul Gandhi highlighted police's alleged use of pellet guns on students, causing eye injuries.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "9e7b5903"}, {"headline": "Centre, CJP to Meet Again as Talks Progress on NEET Paper Leak Agitation", "summary": "The Centre and Cockroach Janta Party (CJP) held third-round talks on the NEET paper leak, agreeing to meet again. CJP insists on Education Minister Pradhan's resignation, which government sources indicate is not under consideration. Other demands like compensation for student suicides and FIR withdrawal saw positive responses.", "category": "Politics", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "9a6f7999"}, {"headline": "Selja Slams Wangchuk’s Wife for Targeting Congress, Not Modi Govt", "summary": "Congress General Secretary Kumari Selja criticized activist Sonam Wangchuk's wife, Gitanjalai J Angmo, for questioning Congress's sincerity in protesting paper leaks. Selja asked why Angmo targeted Rahul Gandhi and Congress instead of the Modi government, stating Congress will not stop its fight.", "category": "Politics", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "08dc123b"}, {"headline": "Congress MP Vivek Tankha Expresses Happiness Over Sonam Wangchuk Ending Fast", "summary": "Congress Parliamentarian Vivek Tankha expressed happiness over activist Sonam Wangchuk ending his hunger strike after talks with the government. Tankha, who was part of Opposition MPs urging Wangchuk to end his fast, stated that student agitation would continue even after his fast ended.", "category": "Politics", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "0bb23e45"}, {"headline": "Govt Orders GitHub to Remove Access to Bitchat App in India Citing Misuse Risks", "summary": "The government ordered GitHub to remove access to Bitchat, Jack Dorsey's Bluetooth-based messaging app, in India. Citing IT Act Section 79(3)(b), it stated the app's architecture impedes lawful interception and may be misused by anti-national elements, terrorist organizations, and cybercriminals.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "7199b710"}, {"headline": "Byju’s RP Moves NCLT Against Google in Data-access Dispute", "summary": "Byju's resolution professional moved NCLT against Google LLC and Google India over access to the company’s data and digital services, including Google Cloud. The RP needs this access to control digital records, examine information, and preserve data for the insolvency process, mirroring a past dispute with AWS India.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "bcf1f3e5"}, {"headline": "Mphasis Reports 11% Rise in Q1 Net Profit, Revenue Beats Estimates", "summary": "Mid-sized IT firm Mphasis reported an 11% YoY rise in Q1 net profit to ₹489.5 crore and revenue of ₹4,384.05 crore, beating analyst estimates. CEO Nitin Rakesh noted strong deal bookings (up to $461 million) despite macroeconomic uncertainties, with a focus on attractive propositions without dropping prices.", "category": "Business", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "2bf3d8e1"}, {"headline": "Flood Scare Grips J&K as Intermittent Rainfall Swells Rivers", "summary": "Intermittent rainfall in Jammu and Kashmir caused major rivers and streams to swell, triggering a flood scare. The Srinagar-Jammu highway remained closed for a third day due to flash floods, landslides, and shooting stones, stranding hundreds of trucks and private vehicles.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "ac160873"}, {"headline": "RE Expansion, Battery Storage Push Key for Green Transition: Minister Joshi", "summary": "Renewable energy minister Pralhad Joshi stated India's policy drive and investments in battery storage, wind, and solar expansion are crucial for its clean energy transition, aiming to lower electricity costs. Industry leaders highlighted clean energy as a strategic economic opportunity and urged building storage capacity.", "category": "Environment", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "2fee1eb6"}, {"headline": "New 10% US Levy to Put Apparel Exporters at a Disadvantage: CITI", "summary": "The Confederation of Indian Textile Industry (CITI) stated that the new 10% US tariff on Indian goods, citing forced labor, will disadvantage textile and apparel exporters. The US is India's largest market for these items, with annual imports around $11 billion. CITI chairman Ashwin Chandran called the imposition \"deeply unfortunate\".", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "13927143"}, {"headline": "Ecomm Export FDI Policy Eases Rules, But Raises Compliance Questions", "summary": "The Centre relaxed its FDI policy to allow foreign direct investment in inventory-based e-commerce for exports. While expected to boost small sellers and MSMEs, experts warn of potential misuse and compliance challenges if controls aren't robust, fearing blurring lines between export and domestic operations.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "19325192"}, {"headline": "Karnataka Eyes ₹5.5 Lakh Crore Software Exports This Fiscal Year", "summary": "Karnataka expects software exports to reach ₹5.5 lakh crore this fiscal year, up from ₹4.36 lakh crore last year. CM DK Shivakumar pitched the state as a preferred tech investment destination, highlighting Bengaluru's talent pool and innovation ecosystem, and seeking long-term partnerships.", "category": "Economy", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "e529e180"}, {"headline": "Fractal CEO: Execution Bigger Challenge than Profitability Amid Q1 Setback", "summary": "AI analytics firm Fractal Analytics reported a 38% sequential decline in Q1 net profit to ₹72.3 crore, attributing weakness to execution lapses and client ramp-downs in its TMT business. CEO Srikanth Velamakanni stressed improving execution over blaming industry trends like hyperscalers diverting budgets to AI infrastructure.", "category": "Business", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "a3961b08"}, {"headline": "Pronto Scales Verified Service with AI Training via Headcam Footage", "summary": "Home services startup Pronto is scaling its \"Verified\" premium booking service, where professionals can record jobs via headcams with customer consent. Anonymized footage is used to train AI models. The optional feature, developed in response to trust and safety demands, has sparked privacy concerns.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "09aeb347"}, {"headline": "Lawyers Warn No Law Authorises Live Facial Recognition by Police", "summary": "Senior lawyers warn that India lacks a law expressly authorizing police to deploy live facial-recognition technology (FRT) at public gatherings, risking constitutional challenge. Its use must satisfy Supreme Court privacy standards and include safeguards for authorization, transparency, retention, and data deletion.", "category": "Law", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "35516296"}, {"headline": "FSSAI to Intensify Nutraceuticals Scrutiny After Action Against Rehaan Healthcare", "summary": "FSSAI will intensify inspections of nutraceutical manufacturing units after suspending Rehaan Healthcare's license for alleged food safety violations at its production facility. The firm was ordered to halt production of all products, including digestive syrups and multivitamins, until identified shortcomings are rectified.", "category": "Health", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "2af7df16"}, {"headline": "Hostels See Surge in Biz as Gen Z Travellers Check In for Jantar Mantar Protests", "summary": "Backpacker hostel chains in Delhi are experiencing an uptick in bookings from Gen Z travelers attending Jantar Mantar protests, with student traveler share increasing by 30% in July. However, city hoteliers report a dip in corporate movement due to internet slowdowns, traffic curbs, and security alerts from embassies.", "category": "Business", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "634899aa"}, {"headline": "Hyderabad All Set to Become India’s Next Retail Hotspot", "summary": "Hyderabad is emerging as a retail investment destination with over 20 malls planned, driven by GCC-led hiring, rising disposable incomes, and record housing sales. Its Grade A mall stock is projected to grow 2.5x by 2030, attracting international and Indian brands and making it a priority market for new store launches.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "3a98477b"}, {"headline": "More Banks May Join Overseas Bond Run After ICICI Bank’s Success", "summary": "ICICI Bank's successful $1 billion dollar bond sale, marked by strong investor demand and low interest, is expected to encourage other Indian lenders to tap overseas debt markets. This is driven by RBI's subsidised hedging facility, making overseas borrowings more attractive and reducing hedging costs.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "6a6659e3"}, {"headline": "Rupee Hits Intraday Low, Recovers on RBI Support Amid Oil Test", "summary": "RBI interventions ensured the rupee didn't weaken beyond its record low of 96.96, recovering to close at 96.562 after hitting an intraday low of 96.70 per dollar. High oil prices and heavy dollar demand from oil companies and importers added pressure, despite a slight fall in crude prices.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "820a5557"}, {"headline": "Index-Entry Wait May Temper India Bond Rally, FPI Inflows Ease", "summary": "The rally in Indian bonds may slow as foreign portfolio investor (FPI) flows ease, lacking definitive signs of Bloomberg's Global Aggregate Index inclusion. Bond yields, currently at 6.84% for the 10-year benchmark, could soften 3-4 bps with inclusion or see an 8-10 bps sell-off without.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "7d309c97"}, {"headline": "China May Not Retaliate Against US Levies Ahead of Xi’s US Trip", "summary": "China might not retaliate against new US tariffs (effective 12.5% on certain goods, 1.4% higher than existing) ahead of President Xi Jinping's September US trip. Chinese officials seek clarity on upcoming AI talks. The US aims to ensure its dominance in AI.", "category": "World", "page": 9, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "b48e5e6e"}, {"headline": "China Puts 14 EU Entities Under Export Controls List in Russia Sanctions Retaliation", "summary": "China added 14 European entities to its export control list, retaliating against the EU's sanctions on Chinese enterprises for ties to Russia's war in Ukraine. Chinese companies are barred from exporting dual-use items to these EU organizations, and foreign firms cannot supply them Chinese-made dual-use items.", "category": "World", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "7d6f7a57"}, {"headline": "EU: TikTok Failed to Protect Minors’ Privacy, Exposed Children to Risks", "summary": "The European Commission found TikTok inadequately protected children's privacy by allowing adults to view minors' accounts, exposing them to cyberbullying and predatory behavior. It stated children's content must never be visible to strangers and demanded effective default privacy settings for minors under the Digital Services Act.", "category": "Technology", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "3a4545a5"}, {"headline": "Lebanese Castles, West Bank Site Added to UNESCO World Heritage List", "summary": "A UN committee voted to inscribe a major archaeological site in the West Bank (Sebastia) and a set of castles in southern Lebanon as World Heritage sites. This decision came despite objections from Israel, which called the nominations a \"weaponization of cultural heritage.\"", "category": "Culture", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "4fcb850d"}, {"headline": "2 Israeli Soldiers, 4 Palestinians Killed in West Bank Clashes", "summary": "Four Palestinians and two Israeli soldiers were killed near a Palestinian village in the West Bank, adding to a growing toll from intensifying Israeli settler violence. The incident occurred in Area A, under Palestinian Authority control, where Israelis are officially prohibited from entering. IDF prepares for \"extensive counter-terror operational activity\".", "category": "World", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "d1bc7823"}, {"headline": "US Measles Infections at 35-Year High with 2,318 Cases in 2026", "summary": "US measles cases in 2026 have already reached 2,318, surpassing last year’s total and hitting a 35-year high. Forty-three states and Washington, DC, reported at least one infection. Vaccine policy changes under the Trump administration, including firing CDC scientists, are cited as contributing factors.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "f552171d"}, {"headline": "World Cup, July 4 Spending Drive Up US Business Activity to 8-Month High", "summary": "US business activity expanded at its fastest pace in eight months in July, with the S&P Global flash composite PMI rising to 53.6. Strong service demand, boosted by World Cup and July 4th celebrations, offset cooling factory production, growing supply chain delays, and rising costs, hinting at potential downside risks.", "category": "Economy", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "f39d0653"}, {"headline": "Warner-Paramount Deal Pause Extended Till August 17 by Federal Judge", "summary": "The pause on Paramount Skydance Corp.’s $110 billion takeover of Warner Bros. Discovery Inc. has been extended for two weeks to August 17 by a federal judge. The judge oversees multiple challenges to the deal and will hold a hearing on August 3 on whether to delay it further pending a trial.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "1ef3aa2d"}, {"headline": "Argentine Prez Milei in Brazil to Support Bolsonaro Amid Corruption Probe", "summary": "Argentine President Javier Milei is in Brazil to support Jair Bolsonaro, who faces a corruption firestorm and bank fraud probe. Milei will appear at a Liberal Party convention on Saturday to back Flávio Bolsonaro's bid to unseat President Luiz Inácio Lula da Silva, marking a high-stakes regional bet.", "category": "World", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "5a8490bc"}, {"headline": "Medieval Combat World Championship Features Modern Fights with Ancient Weapons", "summary": "The International Medieval Combat Federation's annual world championship is underway in Denmark, featuring armor-clad competitors from 30 countries fighting with 14th-century weapons. It blends modern techniques and safety rules with historical combat, with participants drawn to its \"violence\" and technical aspects.", "category": "Sports", "page": 9, "importance": 2, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "d59b7acc"}, {"headline": "FIDE Chief Dvorkovich Faces EU Sanctions; Anand Takes Over as Interim President", "summary": "Five-time world chess champion Viswanathan Anand took over as interim president of FIDE after incumbent Arkady Dvorkovich stepped aside due to his inclusion on the European Union’s sanctions list related to the Russia-Ukraine war. Dvorkovich, a Russian, vowed to challenge the decision \"by all means.\"", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "04980acc"}, {"headline": "Judoka Tulika Maan Withdrawn from CWG Over Whereabouts Failures, Faces Ban", "summary": "Commonwealth Games silver medallist judoka Tulika Maan was withdrawn from the Glasgow Games after receiving a provisional suspension from NADA for three whereabouts failures in 12 months. She faces a two-year ban. Another judoka, Arun Kumar, was also provisionally suspended for a failed dope test.", "category": "Sports", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "fcbdc2c9"}, {"headline": "India, Pakistan Secure Direct Knockout Berths in Asian Games Cricket", "summary": "India, Bangladesh, Pakistan, and Sri Lanka secured direct entry into the men’s cricket knockout stage at the 2026 Asian Games following Thursday’s draw. The 10-team men’s competition, which begins at the quarter-final stage, will run from September 24-27.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "029261c5"}, {"headline": "Klopp Era Begins as New Germany Coach Vows Dedication, Sets Boundaries", "summary": "Jürgen Klopp began his tenure as Germany's national football coach, signing a contract through the 2030 World Cup. In his first press conference, he promised full dedication, set boundaries on media intrusion into his family life, and indicated this could be his final coaching role after leaving Liverpool.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "bde0852f"}, {"headline": "LeBron James Joins Philadelphia 76ers for 24th NBA Season", "summary": "LeBron James announced he will embark on his 24th NBA season with the Philadelphia 76ers, aiming to win a fifth championship. He stated it is the “last decision” for the league’s all-time leading scorer, signaling his commitment to the new team.", "category": "Sports", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "ab2d9ec7"}, {"headline": "Guardiola Turns Down Italy National Team Coaching Role", "summary": "Pep Guardiola, regarded as one of football's greatest managers, held talks with Italy's football federation (FIGC) but turned down the opportunity to coach the Italy national team. FIGC had been searching for a new coach since Gennaro Gattuso stepped down in April.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "3b4c40d9"}, {"headline": "Indian Swimmer Srihari Nataraj Qualifies for 50m Backstroke Semifinals", "summary": "Indian swimmer Srihari Nataraj qualified for the men’s 50m backstroke semifinals at the Glasgow Games, finishing joint 14th in the heats. Another Indian in the fray, Paramjeet Kumar, finished seventh overall with 135.6 points in the men's 100m freestyle S13 final, not reaching the medal bracket.", "category": "Sports", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "246c85d9"}, {"headline": "Cricket Australia Considers Hosting Future Ashes Test in India", "summary": "Following its decision to stage the Big Bash League opener in Chennai, Cricket Australia is now considering hosting a future Ashes Test in India. However, CEO Todd Greenberg stated there were no immediate plans, but it is \"open to consideration\" given opportunities in India.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "8ed571f4"}, {"headline": "Vaibhav Sooryavanshi ‘Not Taking Anything for Granted’ After Match-Winning Knock", "summary": "Vaibhav Sooryavanshi, India’s batting sensation, scored 50 off 19 balls in the first T20I against Zimbabwe at Harare Sports Club. Despite his match-winning knock, the 15-year-old said he’s \"certainly not taking anything for granted\" and aims to contribute to the team, expressing confidence after his maiden half-century.", "category": "Sports", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "42e39b3f"}, {"headline": "Glasgow CWG Medals Feature Braille, Tactile Elements for Visually Impaired Athletes", "summary": "For the first time, Commonwealth Games medals in Glasgow feature braille and tactile elements, making them accessible to visually impaired athletes. The Reuleaux triangle shape, inspired by the Finnieston Crane and tartan, reflects the city's emphasis on inclusion with a record 47 gold medals across six Para sports.", "category": "Sports", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "ee6fbff9"}, {"headline": "Shakta and Vaishnav Traditions Coexist Beautifully in Guptipara, Bengal", "summary": "Guptipara, West Bengal, beautifully melds Shakta and Vaishnav traditions. The town is known for its Rath Yatra, where devotees rush to grab 'bhog prasad', symbolizing Jagannath's return. It also hosts ancient Dasamahavidya and terracotta Vaishnav temples, showcasing diverse faith streams and Bengal's rich cultural heritage.", "category": "Culture", "page": 10, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131700", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 25-07-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/131700"}], "article_id": "e5c1fa9b"}, {"headline": "US puts 10% 'forced labour' tariff on Indian goods", "summary": "The US imposed a 10% tariff on Indian goods after a Section 301 investigation into forced labor, effectively retaining existing tariffs. This followed New Delhi's amendment to its Foreign Trade Policy. The tariff is lower than the initially proposed 12.5%. Approximately 60-65% of Indian exports to the US are likely to be affected.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "67ce6d89"}, {"headline": "Bengal needs to integrate into national economy: FM Dasgupta", "summary": "West Bengal Finance Minister Swapan Dasgupta stated the state must 'integrate back into the national economy' by aligning with the Centre, signaling a break from past policies. He aims to attract investment, revive industrial incentives, and explore negotiated settlements for significant arbitral awards and unpaid arrears to fill a 'budgetary black hole'.", "category": "Economy", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "137c2473"}, {"headline": "Infosys cofounder Murthy: Post-1991, we had to innovate, not wait in Delhi", "summary": "Infosys co-founder N R Narayana Murthy recounted the challenging pre-1991 business environment marked by high friction, bureaucratic hurdles, and lack of venture capital. He emphasized that 1991 liberalization, led by architects like P V Narasimha Rao and Manmohan Singh, enabled entrepreneurs to focus on innovation and competition rather than seeking government approvals.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "252cd62c"}, {"headline": "Organon approves Sun Pharma's $11.75 bn acquisition proposal", "summary": "Organon & Co. shareholders approved Sun Pharmaceutical Industries' proposal to acquire the US-based firm for an enterprise valuation of $11.75 billion. The acquisition, pending regulatory approvals, will make Organon a wholly-owned subsidiary of Sun Pharmaceutical Holdings USA, Inc.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "493c6e26"}, {"headline": "Lodha's Q1 profit doubles to ₹1,372.1 crore on higher revenue", "summary": "Real estate company Lodha Developers' Q1FY27 profit attributable to owners grew 103.36% year-on-year to ₹1,372.1 crore, marking its highest-ever quarterly profit. Revenue from operations increased 43.1% to ₹4,996.7 crore, surpassing analyst estimates, driven by strong collections of ₹4,205 crore.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "df4ba2d9"}, {"headline": "Avenue E-commerce FY26 loss widens to ~306.5 crore", "summary": "Avenue E-commerce Ltd (AEL), the online arm of DMart, saw its loss widen to ₹306.53 crore in FY26, up from ₹247.37 crore in FY25. This increase is attributed to the company's focus on strengthening DMart Ready's Home Delivery business, with revenue from operations rising 17% to ₹4,093.61 crore.", "category": "Business", "page": 2, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "71da878f"}, {"headline": "Tata Consulting Engineers aims for $1 bn revenue by FY31", "summary": "Tata Consulting Engineers (TCE), a Tata group consultancy, aims to achieve $1 billion in revenue by financial year 2031 (FY31). The company plans a threefold expansion over five years, betting on sustained investments in energy, semiconductors, metals, infrastructure, and manufacturing sectors, both in India and overseas.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "a6ee8bd7"}, {"headline": "Oriflame sells India manufacturing operations to Akums Drugs", "summary": "Swedish beauty and wellness brand Oriflame announced the sale of its India manufacturing operations to Pure and Cure Healthcare Private Limited, a subsidiary of Akums Drugs and Pharmaceuticals. As part of the agreement, Akums will continue to manufacture Oriflame products under a long-term strategic partnership, ensuring supply continuity.", "category": "Business", "page": 2, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "bc1ede4d"}, {"headline": "Maruti Suzuki targets 25-30% SUV sales growth in FY27", "summary": "Maruti Suzuki India targets a 25-30% year-on-year increase in SUV sales in FY27, aiming for 653,000-679,000 units. This growth will be driven by the refreshed Brezza, recently launched models, and additional production from its Kharkhoda plant. The new Brezza was launched with introductory prices starting at ₹7.3 lakh.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "9c981484"}, {"headline": "Top 5 IT firms’ recovery falters on AI impact and macro uncertainty", "summary": "India's major IT services firms experienced muted constant currency growth in Q1FY27 (TCS 3.2%, Tech Mahindra 6.6%, Infosys cut guidance) due to persistent macro uncertainty and the deflationary effect of AI on traditional revenue. Wipro recorded the slowest growth at 0.9%, and deal wins were sluggish, indicating tightened client spending.", "category": "Business", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "79f33c38"}, {"headline": "Govt bars telecom infra providers from sharing data outside India", "summary": "The Indian government has prohibited communication infrastructure providers, including cloud-based networks for telecom services, mobile towers, and satellite gateways, from sharing any telecommunication data outside the country. An official notification mandates that all such data must be stored within India.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "6abbf020"}, {"headline": "India, Israel conclude second round of trade pact negotiations", "summary": "India and Israel concluded the second round of negotiations for a proposed free-trade agreement (FTA) in New Delhi. Discussions covered various issues including trade in goods and services, rules of origin, technical barriers, intellectual property rights, customs procedures, and trade facilitation, with both sides aiming to narrow gaps.", "category": "Economy", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "bc92b033"}, {"headline": "Credit card spends hit ~2 trillion for second straight month in June", "summary": "India's credit card spending reached ₹2.01 trillion in June, marking the second consecutive month above ₹2 trillion. Overall spending rose 9.8% year-on-year, driven by HDFC Bank and SBI Card. Public sector banks are benefiting from higher adoption of UPI-linked RuPay credit cards, while some private banks remain cautious due to unsecured lending concerns.", "category": "Economy", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "d8b99c94"}, {"headline": "ICICI Bank raises $1 bn in largest dollar issue this year", "summary": "ICICI Bank, India’s second-largest private sector lender, raised $1 billion through a five-year senior unsecured US dollar bond. This marks its first public dollar bond issuance since 2017 and is the largest single-tranche US dollar bond issuance by an Indian issuer in 2026. The issue was priced at 100 basis points over the five-year US Treasury yield.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "c1f7688a"}, {"headline": "Technology no substitute for auditor judgement: NFRA", "summary": "The National Financial Reporting Authority (NFRA) stated that technology, including AI, cannot replace auditor judgment, and auditors remain responsible for audit opinions. It warned against automation bias and stressed the need for formal processes for technology adoption, validation, and quality control, ensuring technology enhances audit quality without undermining professional skepticism.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "fe4f1cf6"}, {"headline": "NTPC profit up 13% on higher revenues in Q1", "summary": "State-owned power giant NTPC reported a nearly 13% rise in consolidated net profit to ₹6,896.44 crore for the April-June quarter (Q1FY27), up from ₹6,108.46 crore in the year-ago period. Total income also increased to ₹51,141.51 crore, driven by higher revenues.", "category": "Business", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "0a8ca690"}, {"headline": "Power ministry weighs parallel distribution licencing to boost competition", "summary": "The power ministry is discussing a proposed framework for parallel electricity distribution licensing, aiming to introduce competition in supply without duplicating physical networks. Existing licensees would maintain their infrastructure, while new licensees could use it by paying regulated wheeling charges, with options to build their own networks where permitted.", "category": "Infrastructure", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "5ea96719"}, {"headline": "Trade body calls for rollback of FDI in inventory-based e-commerce policy", "summary": "The Confederation of All India Traders (Cait) demands an immediate rollback of India's new FDI policy allowing foreign investment in inventory-based e-commerce for exports. Cait argues the policy disproportionately benefits multinational giants like Amazon and Flipkart, undermining Indian exporters and small retailers, and could lead to misuse without adequate safeguards.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "6ff25a01"}, {"headline": "Neet protest outreach: Pradhan's resignation non-negotiable, says CJP", "summary": "Protesters, led by the Cockroach Janata Party (CJP), maintained Education Minister Dharmendra Pradhan’s resignation is non-negotiable, alongside demands for ₹1 crore compensation for Neet suicide victims. The Supreme Court agreed to hear pleas on police excesses against protesters on July 27, while the NTA sacked 47 officials amid ongoing examination reforms.", "category": "Politics", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "839b0791"}, {"headline": "SC to hear pleas on police excesses against protesters on July 27", "summary": "The Supreme Court agreed to hear two petitions on July 27 regarding alleged excessive police force used against protesters demonstrating against the Neet paper leak. Senior Advocate Gopal Sankaranarayanan mentioned the matter, stating police excesses were continuing daily and urgent intervention was required.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "0f7a6f4b"}, {"headline": "Tuition fees witness higher rise at school level than higher education", "summary": "While overall education services saw retail price inflation below 4% in H1 2026, tuition fees at primary and secondary school levels rose 6-9% over 2024. This rate remains significantly higher than the 4-6% increase observed for higher education tuition fees, indicating a disproportionate cost burden at the school level.", "category": "Education", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "45df4579"}, {"headline": "Cabinet clears ~3,030 cr scheme for setting up 3 chemical parks", "summary": "The central government approved the Bharat Audyogik Vikas Yojana Rasayan (BHAVYA-Rasayan) Scheme, allocating ₹3,030 crore for establishing three large chemical parks, each spanning at least 2,000 acres. This initiative aims to attract domestic and foreign investments, enhance domestic production capacity, and generate employment, boosting the sector's global competitiveness.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "bb457b52"}, {"headline": "Rail line expansion project for Ballari-Guntakal gets Cabinet nod", "summary": "The Cabinet Committee on Economic Affairs approved a ₹1,264 crore rail project to add third and fourth rail lines on the Ballari-Guntakal section, spanning Karnataka and Andhra Pradesh. The project aims to increase rail capacity, improve freight and passenger movement, and strengthen connectivity under the PM Gati Shakti National Master Plan.", "category": "Infrastructure", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "4227639b"}, {"headline": "IRS officer Satya Pal Kumar appointed FIU director", "summary": "IRS officer Satya Pal Kumar, a 2005-batch officer of the Income Tax Department cadre, has been appointed as the director of the Financial Intelligence Unit (FIU). This appointment is part of a major joint secretary-level reshuffle effected by the Union government.", "category": "Politics", "page": 7, "importance": 3, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "d7841d20"}, {"headline": "Domestic demand cushions gems and jewellery MSMEs amid export headwinds", "summary": "India's gems and jewellery industry, where MSMEs account for 75% of value, faces weak exports (down 5% in FY26) due to geopolitical tensions and soft global demand. However, domestic gold demand is projected to grow 17-20% by value in FY27, driven by investment preference for gold, offering some relief.", "category": "Economy", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "fbfa9cc0"}, {"headline": "Fast-track courts face mounting backlogs despite disposals", "summary": "Despite Prime Minister Modi's announcement of fast-track courts for paper leak cases, India's 880 fast-track courts (FTCs) had 1.39 million pending cases as of October 2024, after disposing of 1.33 million in 2025. Fast-track special courts (FTSCs) also saw pending cases rise to 245,579 in 2025, highlighting persistent backlogs.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "a7d31b78"}, {"headline": "Novo Nordisk seeks injunction against Eli Lilly weight-loss drug ads", "summary": "Novo Nordisk is seeking a preliminary US court injunction to block Eli Lilly's obesity and diabetes drug advertisements, alleging they mislead consumers about product comparisons based on outdated studies. The two companies are fierce rivals in the rapidly expanding obesity drug market, projected to exceed $100 billion by decade-end in the US.", "category": "Business", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "b03d6965"}, {"headline": "DOJ drops subpoenas to NYT reporter over Air Force One report", "summary": "The US Department of Justice (DOJ) withdrew subpoenas to New York Times reporters concerning security issues with President Trump’s Air Force One. This followed a federal judge questioning the subpoenas, citing “profound First Amendment” issues and advising investigators to exhaust other sources before demanding journalist testimony.", "category": "Law", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "1857d33a"}, {"headline": "SK Group boss ordered to pay $640 mn in record divorce case", "summary": "A South Korean court ordered SK Group Chairman Chey Tae-won to pay 944 billion won ($640 million) in a divorce settlement to his former spouse, Roh Soh-yeong, setting a new record for South Korea. The ruling highlights Chey's significant stake in SK Group, whose chip affiliate SK Hynix is a key AI processor supplier.", "category": "Business", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "4fb27e0b"}, {"headline": "Spain declares national emergency over wildfires; France seeks EU aid", "summary": "Spain declared a national emergency over wildfires for the first time, and France requested help from the European Union to combat a large blaze on its Atlantic coast. Searing heat is fueling fires across Europe, forcing tens of thousands of evacuations and destroying thousands of hectares of land and homes.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "dd0df1cd"}, {"headline": "AI boom drives Intel's quarterly forecast past estimates", "summary": "Intel forecast quarterly profit and revenue above estimates, fueled by the agentic AI boom which is increasing demand for its central processing units (CPUs). The company plans to boost spending over the next two years. Its shares, despite a recent selloff, are up over 170% for the year.", "category": "Technology", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "ce563b23"}, {"headline": "Volkswagen makes case for deep cost cuts amid competitive pressures", "summary": "Volkswagen CEO Oliver Blume stated the company must deepen cost cuts to remain competitive against Chinese brands, following a 9.5% drop in Q2 operating profit to €3.5 billion. The automaker maintained its profit guidance but now expects a revenue decline of up to 3% in 2026, battling weak China sales and restructuring needs.", "category": "Business", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "6256a2d1"}, {"headline": "China's memory chip makers ride AI boom to new power and US scrutiny", "summary": "Chinese memory chip manufacturers CXMT and YMTC are gaining significant market power due to the AI boom, dictating prices and expanding capacity. This rise is leading to increased US scrutiny, with Washington considering further restrictions, even as these firms pursue blockbuster IPOs and challenge global rivals.", "category": "Technology", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "f5474f00"}, {"headline": "Trump warns China, Russia against involvement in Iran conflict", "summary": "US President Donald Trump warned China and Russia that involvement in the Iran conflict 'would be very bad for them.' He claimed both President Xi Jinping and Vladimir Putin had assured him they would not sell weapons to the Islamic Republic of Iran, expressing belief they were not participating.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "e120c317"}, {"headline": "Fund mobilisation hit new high in June due to debt issuances", "summary": "Total fund mobilisation in India reached a record high of ₹3.15 trillion in June, a 122% month-on-month jump, primarily driven by debt issuances. Debt issuances rose 142% to ₹2.59 trillion, with significant contributions from commercial papers and privately-placed non-convertible debentures. Equity mobilisation recovered to ₹53,000 crore.", "category": "Economy", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "011fa8cc"}, {"headline": "Indian markets log longest losing streak in over 6 months", "summary": "Indian shares recorded their longest losing streak in over six months, with benchmark indices Sensex and Nifty both declining for five consecutive sessions. Sensex fell 0.4% to 76,060 and Nifty closed at 23,768, down 0.4%, primarily due to the escalating West Asia conflict keeping Brent crude prices elevated and intensifying inflationary fears.", "category": "Economy", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "bd0a0b26"}, {"headline": "IFSCA plans independent arbitration centre in GIFT City", "summary": "The International Financial Services Centres Authority (IFSCA) plans to establish an independent arbitration centre in GIFT City, aiming to improve ease of doing business and strengthen dispute resolution. This initiative is considered a key reform for GIFT City's success as an international financial hub, addressing a critical demand from reinsurers and other businesses.", "category": "Law", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "c6b226e2"}, {"headline": "Cube Highways Trust raises ~1,687 crore from anchors ahead of IPO", "summary": "The initial public offer of Cube Highways Trust received 9.35 times subscription on its closing day, with institutional investors subscribing 13.20 times. The ₹5,000-crore infrastructure investment trust (Invit) raised ₹1,687.5 crore from anchor investors, with Prazim Trading and Investment, an entity associated with Premji Invest, as the largest allocatee.", "category": "Business", "page": 16, "importance": 4, "telegram_url": "https://t.me/c/1877410077/131694", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 25-07-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/131694"}], "article_id": "74922369"}, {"headline": "IFSCA drafts framework for unclaimed deposits in GIFT-IFSC", "summary": "The International Financial Services Centres Authority (IFSCA) has proposed the IFSC Depositor Education and Awareness Fund Scheme, 2026, to manage and utilize funds linked to unclaimed deposits in GIFT-IFSC. The framework aims to protect depositors' interests and align norms with domestic banking regulations for unclaimed funds, which stood at $8.98 billion as of March 2026.", "category": "Economy", "page": 16, "importance": 5, "telegram_url":
