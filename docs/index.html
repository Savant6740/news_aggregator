<title>Daily Brief — 16 September 2026</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

<script>
const DIGEST = {"date": "16 September 2026", "articles": [{"headline": "Himalayan infrastructure projects face sharp insurance premium hikes", "summary": "Infrastructure in the Himalayas is becoming more expensive to insure following devastating floods in Nepal and Sikkim. Insurers are reassessing risk profiles as climate change increases the frequency of flash floods and landslides. Premiums for roads and bridges rose 21% after previous events, and further spikes are expected based on global reinsurance costs.", "category": "Infrastructure", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "248337ca"}, {"headline": "Free UPI era ends with 0.4% fee on large merchant transactions", "summary": "The finance ministry has introduced a 0.4% merchant discount rate (MDR) for person-to-merchant UPI transactions above ₹2,000, effective October 15. Transactions under ₹2,000 and person-to-person transfers remain free. The move aims to build a sustainable revenue model for payment providers. Fees for transactions above ₹75,000 will be capped at ₹300.", "category": "Economy", "page": 5, "importance": 10, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "0021f424"}, {"headline": "AI pioneers urge slowdown amid risks of self-training algorithms", "summary": "Founders of Anthropic, OpenAI, and xAI have expressed rare consensus on the need to regulate AI development. Concerns involve AI potentially creating versions of itself beyond human control. Critics suggest the calls for caution may be intended to stifle competition or create barriers for new startups, while the US and China remain in a race for technological dominance.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "2f86de2d"}, {"headline": "India's goods exports jump 26% in August despite global headwinds", "summary": "Government data shows India’s merchandise exports surged to $43.8 billion in August, a 26% year-on-year increase. The trade deficit narrowed to $26.9 billion as imports grew at a slower pace of 14%. Robust momentum in sectors like electronics and machinery suggests resilience against global tariff tensions and rising crude oil prices which recently hit $110 a barrel.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "a842759f"}, {"headline": "Reducing public debt remains crucial to safeguard India's investor trust", "summary": "India aims to reduce central government debt to 50% of GDP by 2030. While lower than advanced economies, India's debt is high among emerging markets. Interest payments consume 25% of government revenue, significantly higher than peers like China. Fiscal consolidation is deemed necessary to manage high borrowing costs and maintain global investor confidence.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "05794d4d"}, {"headline": "Bank of Baroda lent to NMC Group despite internal fraud alerts", "summary": "Bank of Baroda sanctioned fresh loans to the NMC Group between 2017 and 2019 despite its anti-money laundering unit flagging suspicious 'roundtripping' of funds as early as 2016. The bank eventually settled a $600 million legal battle involving founder B.R. Shetty. Failure to act on internal alerts has raised questions regarding staff accountability and regulatory compliance.", "category": "Business", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "8ab8c7e0"}, {"headline": "Centre mandates three-month shelf life for specialized cement", "summary": "The consumer affairs ministry plans to enforce a three-month shelf life for specialized cement used in dams and bridges. The move aims to prevent the use of degraded materials that lose strength due to moisture. New rules will require 'best before' dates on bags and more rigorous testing, ensuring better quality control for major national infrastructure projects.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "6f576d76"}, {"headline": "Delhi High Court orders ₹783 crore tax refund to Teva", "summary": "The Delhi High Court quashed tax proceedings against Israeli drugmaker Teva Pharmaceutical and its US affiliate. The court ruled that the income tax department's notices regarding a 2011 deal with Ranbaxy Laboratories were time-barred and lacked jurisdiction. The department must refund approximately ₹783 crore with interest within two months.", "category": "Law", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "e76a5ba7"}, {"headline": "Mazagon Dock to build India's largest shipyard in Raigad", "summary": "Defence PSU Mazagon Dock Shipbuilders Ltd will invest ₹27,000 crore to develop a greenfield shipbuilding cluster at Dighi Port in Maharashtra. The project aims to achieve a capacity of 2 million gross tonnes and is expected to generate 90,000 jobs. This major expansion supports India’s maritime infrastructure and indigenous defence manufacturing capabilities.", "category": "Infrastructure", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "683cfba5"}, {"headline": "E-commerce rules may reshape brand discount strategies from 2027", "summary": "New e-commerce rules effective January 2027 will require platforms to display the lowest price offered in the last 30 days alongside any advertised discount. This transparency measure aims to curb 'dark patterns' but may force brands to rethink frequent short-term price cuts. Sellers expect demand to shift as successive promotions become harder to execute.", "category": "Business", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "ac78b1f6"}, {"headline": "PhonePe evaluates restarting IPO plans after UPI fee notification", "summary": "Digital payments firm PhonePe is reconsidering its public listing process following the government's decision to allow a 0.4% fee on large UPI transactions. The company had previously paused IPO plans due to market volatility. The new fee structure provides commercial clarity for fintechs, potentially strengthening the business case for a valuation of $9 billion to $10.5 billion.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "d5c5350b"}, {"headline": "NSE IPO opens at 30% discount to rival BSE Ltd", "summary": "The National Stock Exchange (NSE) is launching a ₹22,569 crore IPO with a price band of ₹1,700-1,785. The valuation appears cheap compared to BSE, but analysts warn of a weaker derivatives outlook. New regulatory changes and closing auction session rules have already impacted monthly derivatives turnover, which fell to ₹33.5 trillion in August.", "category": "Business", "page": 10, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "5d677b5b"}, {"headline": "Oil executives warn of global fuel crisis as supplies deplete", "summary": "Top energy executives, including Chevron CEO Mike Wirth, warn that the global fuel crisis has arrived. Strategic crude reserves are low and the closure of the Strait of Hormuz has strained markets. Diesel prices have hit record highs, and analysts suggest prices may remain elevated as demand increases for the harvest season without adequate supply buffers in the system.", "category": "World", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "11838d7c"}, {"headline": "Ukraine hits Russian refinery as energy truce claims are rejected", "summary": "Ukraine's military targeted the Syzran oil refinery in Russia's Volga region, damaging a primary crude processing unit. Ukrainian President Volodymyr Zelensky denied reports of an energy truce proposed by the US, stating that Russia continues to strike critical infrastructure. The attack underlines ongoing hostilities despite Moscow's claim that a halt to strikes was a 'good idea'.", "category": "World", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "0859f73a"}, {"headline": "Amazon India's quick commerce sales set to cross $1 billion", "summary": "Amazon's rapid delivery service in India, 'Amazon Now', is on track to reach $1 billion in annualized gross revenue. Launched in 2025 to compete with local leaders like Blinkit and Zepto, the service has seen orders double every quarter. Amazon plans to expand the service to 100 cities by Diwali to capture a larger share of the world's most populous market.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "4196e23e"}, {"headline": "El Niño's impact on sugar creates domino effect for poultry", "summary": "A 40% spike in sugar prices due to climate-related crop damage is spilling over into the maize market. With sugar diverted for ethanol production, maize is now being used as a primary feedstock, raising costs for the poultry industry. Deficit rains have lowered maize yields, threatening to increase the prices of eggs and chicken meat across the country.", "category": "Environment", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "e4c0733c"}, {"headline": "Sebi proposes shortening disaster recovery drills to four hours", "summary": "Capital markets regulator Sebi has proposed reducing the duration of disaster recovery drills for exchanges and depositories from a full day to at least four hours. The drills would be conducted on non-working days to minimize market disruption. The move aims to strengthen operational resilience and data recovery mechanisms while making it easier for market participants to comply.", "category": "Law", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137461", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/137461"}], "article_id": "6369cd93"}, {"headline": "Pentagon admits ammunition shortages following first months of Iran conflict", "summary": "The US Pentagon acknowledged strategic inventory shortfalls and industrial bottlenecks for munitions after Operation Epic Fury in Iran. Acquisition officials are working to streamline procurement after spending an estimated $22.3 billion on munitions through June. The report contradicts previous administration claims that the US possessed virtually unlimited ammunition supplies.", "category": "World", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "2a8dc2a9"}, {"headline": "Two Kuki-Zo women killed at farms in Manipur’s Tamenglong district", "summary": "Two Kuki-Zo women were shot dead while working at their farms in Leisang Kuki village, Manipur. Several farmhouses were also set ablaze during the attack. The Kuki Inpi Manipur apex body blamed the NSCN-IM and ZUF for the unprovoked killings. One victim had recently completed nursing studies. The incident marks a continuation of lethal ethnic tensions in the region.", "category": "India", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "d308f266"}, {"headline": "Sports Ministry forms task force to explore Formula 1 revival", "summary": "The Indian government has constituted a task force to assess the potential revival of Formula 1 races and the broader motorsports ecosystem in India. Led by Niti Aayog, the group will address taxation issues and infrastructure requirements. The goal is to create a roadmap that attracts international investment and tourism while establishing India as a hub for motorsports.", "category": "Sports", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "59f1140c"}, {"headline": "Oracle India workforce shrinks to 27k amid fresh round of layoffs", "summary": "US software giant Oracle has initiated job cuts expected to impact roughly 3,000 employees in India, representing about 10% of its local workforce. The layoffs are part of a global restructuring as the company shifts focus and spending toward AI infrastructure. India's total Oracle headcount is expected to drop to approximately 27,000 following these role eliminations.", "category": "Business", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "4b242e36"}, {"headline": "Drought conditions affect over 53% of India’s landmass", "summary": "According to the India Drought Monitor, 53.2% of India is experiencing varying degrees of drought, up from 46% a week ago. Severe or exceptional drought impacts 15.4% of the country, particularly affecting Maharashtra, Andhra Pradesh, and Karnataka. The findings raise concerns for standing kharif crops and soil moisture ahead of the winter planting season.", "category": "Environment", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "b74f9867"}, {"headline": "Fintech lender Moneyview halves fresh issue size for proposed IPO", "summary": "Accel-backed Moneyview has reduced the fresh issue component of its initial public offering from 1,500 crore to 750 crore rupees. An addendum filed with Sebi also showed a reduction in the number of shares offered by existing investors. The firm plans to use 325 crore from the proceeds to support loan disbursals, a major cut from the 650 crore planned earlier.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "3cb31429"}, {"headline": "Bangladesh to review 101 agreements signed with India", "summary": "The BNP-led government in Dhaka has decided to review 101 memorandums of understanding and agreements signed with India, primarily in infrastructure and transit. Bangladesh officials stated the review aims to safeguard national interests. Additionally, bureaucrats trained in India over the last decade are being placed under scrutiny as ties between the neighbors face a recalibration.", "category": "Politics", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "af3bd8a8"}, {"headline": "Widow’s Bay and The Pitt win top honors at Emmy Awards", "summary": "Horror comedy \"Widow's Bay\" set a record with 14 Emmy statuettes, including best comedy, at the 78th Primetime Emmy Awards. Medical drama \"The Pitt\" repeated its win for best drama series. Jean Smart won her fifth Emmy for \"Hacks,\" while Matthew Rhys became the first person to win two lead acting honors at the same ceremony. The event occurred amid industry anxiety over AI and mergers.", "category": "Culture", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "3628bb48"}, {"headline": "Digital lender Fibe receives Sebi approval for 750 crore IPO", "summary": "Pune-based fintech startup Fibe has secured regulatory approval for its initial public offering. The issue includes a fresh issue of 750 crore rupees and an offer for sale of 40.07 million shares by existing investors. Proceeds will be used to augment the capital base of its NBFC arm, EarlySalary Services, to support expanded lending operations.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "6ed29875"}, {"headline": "Manoj Jarange Patil leads Maratha march to Mumbai despite police ban", "summary": "Maratha leader Manoj Jarange Patil is proceeding with a march and fast in Mumbai's Azad Maidan starting September 19, despite being denied police permission. Patil is demanding Kunbi caste certificates for all Marathas. State officials cited the ongoing Ganesh festival as the reason for denying the agitation permit to prevent public inconvenience and law and order issues.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "6bca7c5b"}, {"headline": "Enforcement Directorate to fast-track high-profile money laundering trials", "summary": "The ED has directed its zonal offices to identify 10 high-profile cases for fast-tracking, aiming for convictions within six to eight months. The agency is also expanding its sanctioned strength by 60% to over 3,200 posts. The restructuring includes the creation of 50 PMLA zones and dedicated FEMA zones to be rolled out by early 2027 to shorten the lifecycle of investigations.", "category": "Law", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "0297679c"}, {"headline": "US bill names India and China for potential Russia trade tariffs", "summary": "A new US sanctions bill amendment proposes 100% tariffs on Moscow’s top oil trading partners, including India, China, and Turkiye. While the White House has expressed reservations, the bill aims to penalize countries purchasing Russian energy. India remains Russia's top oil supplier, with Moscow holding a 45% share of India's crude imports in August.", "category": "Politics", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "932c3f9a"}, {"headline": "Defence Minister urges industry investment in emerging military technologies", "summary": "Addressing a DRDO-Industry meeting, Rajnath Singh called on companies to invest in deep-tech and emerging technologies to secure strategic advantages in future warfare. He announced initiatives to lower financial barriers for startups and launched a framework for sharing DRDO-developed software source codes with domestic manufacturers to accelerate defense capabilities.", "category": "Technology", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "6dd02af5"}, {"headline": "High demand causes 45-day lag in Pashmina GI-tagging certifications", "summary": "Demand for geographical indication (GI) tagging of Kashmiri Pashmina shawls has surged to 250 requests daily, leading to a 45-day certification backlog in Srinagar. The Craft Development Institute plans to increase staff and machinery to handle up to 50,000 tests annually by 2027. The certification ensures the authenticity and cultural distinctiveness of high-value Pashmina products.", "category": "India", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "5afd7bb2"}, {"headline": "Rescue teams evacuate 7,350 pilgrims from landslide-hit Kedarnath route", "summary": "Disaster response teams have safely evacuated 7,350 pilgrims from the Kedarnath trek route following landslides in Uttarakhand’s Rudraprayag district. The pilgrimage has been temporarily halted as workers clear debris. State officials confirmed that 150 people were brought to safety on Tuesday alone, following the earlier evacuation of 7,200 people.", "category": "Environment", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "f99e74aa"}, {"headline": "PIL challenges Karnataka’s order to shorten rendition of National Song", "summary": "A public interest litigation has been filed in the Karnataka High Court against the state government's decision to sing only the first two stanzas of \"Vande Mataram\" at official events. The petitioner argues the executive order conflicts with Union government guidelines that prescribe the complete six-stanza composition as the official version of the National Song.", "category": "Politics", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "7099ac86"}, {"headline": "India’s market capitalization falls below $5 trillion on oil spike", "summary": "The total market value of BSE-listed companies dropped below $5 trillion for the first time in three months on Tuesday. The sell-off was triggered by Brent crude prices rising above $100 and US bond yields hitting 5%. India’s share of global market capitalization has slipped to 2.95% as the Sensex fell nearly 1% amid global inflationary concerns.", "category": "Economy", "page": 18, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 18, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "4a56daf3"}, {"headline": "Reliance Industries to raise 12,500 crore through five-year bonds", "summary": "Reliance Industries is launching its first major domestic bond issue since 2023, seeking to raise up to 12,500 crore rupees via five-year notes. The bonds are expected to be priced at 7.47%. The move follows a surge in foreign currency deposits in the Indian banking system, providing lenders with high liquidity to fund corporate loans and bonds.", "category": "Business", "page": 19, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "c53bf623"}, {"headline": "India and China discuss measures to address structural trade imbalance", "summary": "Commerce Secretary Rajesh Agrawal met with Chinese counterparts to discuss narrowing the trade gap and easing cross-border commerce. India is pushing for greater market access for its products and addressing supply-chain challenges. Despite rising exports to China, India faces a $56 billion trade deficit with the country in the first five months of the current fiscal year.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "6c310758"}, {"headline": "US seeks details on Indian rice used for ethanol production", "summary": "The United States has asked India to explain its use of government-held rice stocks for ethanol manufacturing at the WTO. Washington alleges that India is releasing rice below cost, potentially distorting trade. India recently resumed allocating Food Corporation of India (FCI) rice to ethanol makers through e-auctions to manage domestic surplus stocks.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "8e59fe05"}, {"headline": "Hindustan Coca-Cola Beverages to invest 1,127 crore in Andhra Pradesh", "summary": "HCCBL announced a 1,127 crore rupee investment to set up a new bottling plant in Vizianagaram and expand its existing Chittoor facility. The expansion will add multiple bottling lines for brands including Thums Up and Sprite, aiming to meet rising demand across southern India. The Vizianagaram unit will have an 18-million case annual capacity and juice/tetra pack lines.", "category": "Business", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "60d48d12"}, {"headline": "Air India board approves operational handover to new CEO", "summary": "Air India’s board met to facilitate the leadership transition as Tewolde Gebremariam prepares to take charge. Outgoing CEO Campbell Wilson reviewed the airline’s progress and ongoing structural challenges. Chairman N Chandrasekaran emphasized operational reliability, safety, and consistent execution as top priorities for the next phase of the carrier's transformation.", "category": "Business", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "ce7789f4"}, {"headline": "Nagoya Asian Games set to open with record 17,000 participants", "summary": "The 20th Asian Games will open in Japan this Saturday, featuring 17,000 athletes and officials from 45 countries. The event serves as a qualifier for the 2028 Olympics in seven sports, including surfing and squash. Organizers have faced housing challenges, with thousands of participants staying on a cruise ship to cut costs during the two-week competition.", "category": "Sports", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137454", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137454"}], "article_id": "291df0db"}, {"headline": "SC to hear plea against Manipur High Court order.", "summary": "Supreme Court agrees to hear a
