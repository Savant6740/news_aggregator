urces": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "d92074bf"}, {"headline": "India deeply concerned by blockades in Red Sea and Persian Gulf", "summary": "The Ministry of External Affairs expressed deep concern over Houthi-led blockades in the Bab-el-Mandeb Strait and the Strait of Hormuz. India condemned attacks on civilian infrastructure and commercial shipping, which threaten global trade and navigation freedom. This follows recent attacks on a ship with 14 Indian seafarers off the Oman coast and strikes on Saudi sovereign territory.", "category": "World", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "d95e2d91"}, {"headline": "Omar Abdullah warns against backdoor route for Uniform Civil Code", "summary": "Jammu and Kashmir Chief Minister Omar Abdullah criticized the BJP's strategy of implementing the Uniform Civil Code (UCC) through individual states. He argued that a major policy change of this nature should be debated and legislated in Parliament rather than using a 'backdoor entry.' He also noted that many National Democratic Alliance (NDA) allies are currently opposed to the UCC.", "category": "Politics", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "8f82de7e"}, {"headline": "L-G approves 427 ancillary posts for 53 Delhi fast-track courts", "summary": "Delhi Lieutenant-Governor Taranjit Singh Sandhu approved the creation of 427 ancillary posts for 53 newly established fast-track special courts. These courts are designed to expedite judicial processes in the capital. The approval is subject to the condition that 243 vacant posts in existing courts are filled first. The move aims to strengthen the Delhi Higher Judicial Service infrastructure.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "be9561e6"}, {"headline": "Delhi government to build hostels for 10,000 university students", "summary": "Chief Minister Rekha Gupta announced plans to construct hostels for 10,000 students across Delhi government colleges and universities. The project will use a public-private partnership (PPP) model to ensure maintenance and rapid construction. Sites have been identified at Ambedkar University and Delhi Sports University. A survey will also identify colleges with space for further expansion.", "category": "Education", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "476fe44e"}, {"headline": "BJP Mundka MLA booked for alleged assault on party worker", "summary": "Delhi police registered an FIR against BJP MLA Gajender Drall for allegedly beating and using casteist slurs against mandal chief Sunil Kumar. The victim alleged he was confined and thrashed with pipes and belts. The case includes sections of the SC/ST Act and the Arms Act. The BJP has referred the matter to its disciplinary committee for further action based on the findings.", "category": "Politics", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "5c61d053"}, {"headline": "NDMC declares 145 housing quarters unsafe for sanitation workers", "summary": "The New Delhi Municipal Council (NDMC) ordered residents of 145 Type-I quarters at Valmiki Sadan to vacate after a structural assessment found eight blocks unsafe. The buildings, constructed between 1965 and 1986, are primarily occupied by sanitation staff. The move follows a recent fatal building collapse in Satya Niketan, highlighting safety concerns in aging civic infrastructure.", "category": "Infrastructure", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "b05f9e83"}, {"headline": "DTC drivers’ strike over wages disrupts Delhi bus commute", "summary": "Bus services across Delhi were disrupted on Tuesday as private agency drivers for the Delhi Transport Corporation (DTC) went on strike. Commuters were left stranded at several depots, including Burari and Nehru Place. Drivers are demanding higher wages, currently ₹862 per day, along with medical and social security benefits. The DTC Karamchari Ekta Union said the protest will continue.", "category": "Infrastructure", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "9455390e"}, {"headline": "Punjab Congress protests against Harpal Cheema over Dalit death", "summary": "Congress workers in Chandigarh protested against Punjab Finance Minister Harpal Singh Cheema following the death of 47-year-old Gulzar Singh. The opposition alleges the victim was pressured by the minister after questioning drug availability in his village. State Congress chief Amrinder Singh Raja Warring and Sachin Pilot were detained after police used water cannons to disperse the crowd.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "3cd26292"}, {"headline": "Raut alleges political conspiracy in CBI probe of Disha Salian", "summary": "Shiv Sena (UBT) leader Sanjay Raut claimed the CBI's FIR in the Disha Salian death case is a political conspiracy to tarnish the Thackeray family. He stated that Mumbai police had already cleared Aaditya Thackeray of any link to the death. Maharashtra Deputy CM Devendra Fadnavis countered that the CBI must be allowed to investigate and urged against public speculation on the matter.", "category": "Politics", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "848cdd9b"}, {"headline": "CBI books activist Bhanu Tatak over illegal foreign funding", "summary": "The CBI booked Arunachal Pradesh activist and lawyer Bhanu Tatak for allegedly receiving ₹20.94 lakh in foreign funds without requisite FCRA registration. The agency claims the money was used to organize protests against two major hydropower projects in the state, including the Siang Upper Multipurpose Project. The funds were allegedly received via several foreign UPI transactions.", "category": "Law", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "fd788352"}, {"headline": "DMK MP Raja and two MLAs booked for derogatory remarks", "summary": "Tamil Nadu police registered cases against DMK MP A. Raja and two MLAs for allegedly making derogatory remarks against Chief Minister C. Joseph Vijay and Law Minister C.T.R. Nirmal Kumar. The complaints alleged the use of obscene language and inciting violence during a DMK protest. This follows rising political tensions between the DMK and the TVK party in the state.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "545cfdf8"}, {"headline": "Indore boy stabbed to death during Ganesh Chaturthi procession", "summary": "A 16-year-old boy was killed and another injured after an argument during a Ganpati procession in Indore’s Musakhedi area. The altercation began when the accused allegedly pushed the victims while dancing. The minor suspect is at large, and police have formed teams for his arrest. Charges of murder and attempt to murder have been filed under the Bharatiya Nyaya Sanhita.", "category": "India", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "946f4465"}, {"headline": "Indian citizen released on bail after 3 months in detention", "summary": "Jalil Akhtar, a 66-year-old resident of West Bengal, was released on bail after being detained for three months on suspicion of being a Bangladeshi national. Despite having a valid voter ID and PAN card since 1995, he was held in holding centers and jail. The court granted bail after the investigating officer admitted the documents were valid and could not prove any fabrication.", "category": "Law", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "a15afd87"}, {"headline": "CPI(M) condemns ED bid to implicate Pinarayi Vijayan", "summary": "The CPI(M) passed a resolution against the Enforcement Directorate's (ED) move to recommend an FIR against Kerala's Pinarayi Vijayan in the CMRL-Exalogic pay-off case. The party termed it a 'political witch-hunt' against the leader and his family. The Kerala police chief confirmed receiving the ED's letter and has forwarded it to the state government for further legal examination.", "category": "Politics", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "8b5bba72"}, {"headline": "Former Andhra Pradesh Deputy CM Alla Nani dies at 56", "summary": "Alla Kali Krishna Srinivas, a senior YSRCP leader and former Deputy Chief Minister of Andhra Pradesh, died of a heart attack at the age of 56. A three-time MLA from Eluru, Nani served as the Health Minister during the previous YSRCP government. Leaders across the political spectrum, including CM N. Chandrababu Naidu, expressed their condolences over his untimely demise.", "category": "India", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "82207e7a"}, {"headline": "CPI(M) reshuffles Kerala leadership with fresh faces in secretariat", "summary": "The CPI(M) in Kerala announced significant leadership changes, including nine new members in the State secretariat as part of 'corrective steps' following election setbacks. Leaders like John Brittas and M.B. Rajesh have been included, while veterans T.P. Ramakrishnan and Thomas Isaac were removed from the secretariat. State secretary M.V. Govindan stated the move aims to revive the party.", "category": "Politics", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "555002e7"}, {"headline": "Badruddin Ajmal to contest Nagaon Lok Sabha bypoll in Assam", "summary": "The All India United Democratic Front (AIUDF) named its president, Mohammed Badruddin Ajmal, as the candidate for the Nagaon Lok Sabha byelection scheduled for October 6. Ajmal will face BJP's Devasish Sharma and Congress's Sibamoni Bora in a high-stakes contest. The Trinamool Congress has also fielded a candidate, Abdul Salam, for the seat.", "category": "Politics", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "812eabdc"}, {"headline": "China calls for India to advance ties without backsliding", "summary": "Chinese Foreign Minister Wang Yi stated that India and China should remain partners and advance bilateral relations steadily following the New Delhi consensus. Wang urged both nations not to allow the boundary question to define the entire relationship. Prime Minister Modi emphasized that peace at the border remains the essential basis for the continued development of ties.", "category": "World", "page": 12, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "ec250437"}, {"headline": "Registrar-General warns of narrow error margin in 2027 Census", "summary": "The Registrar-General of India notified states that the second phase of the 2027 Census has a narrower margin for error due to numerous and sensitive questions. Nearly 34 lakh enumerators will be trained for the digital exercise, which includes gender sensitisation. Self-enumeration will be encouraged through a mobile app to improve data accuracy and simplify the recording process.", "category": "India", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "7f1573c5"}, {"headline": "West Bengal withdraws Akshaya Patra mid-day meal deal", "summary": "The West Bengal government has withdrawn approval for the Akshaya Patra Foundation to provide mid-day meals in four districts, including Howrah and Purulia. The pilot project had faced controversy over the exclusion of eggs from the menu. Chief Minister Mamata Banerjee had previously stated that eggs would be provided separately to students after criticism from political groups.", "category": "Education", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "b1f83493"}, {"headline": "Congress labels 0.4% UPI fee as Modi Tax", "summary": "Congress leaders Mallikarjun Kharge and Rahul Gandhi accused the central government of surrendering to U.S. pressure by introducing fees on UPI transactions above ₹2,000. They termed the move a 'Modi Tax' that would squeeze household savings. The BJP countered that the claims are 'fake news,' asserting that 96% of transactions remain free and no charges apply to individual consumers.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "f6eaa5e2"}, {"headline": "TDP and Shiv Sena support nationwide Uniform Civil Code", "summary": "Key NDA allies TDP and Shiv Sena backed Home Minister Amit Shah's statement on implementing a Uniform Civil Code (UCC) across all NDA-ruled states by 2029. TDP's P. Srinivasa Rao stated they are bound by the Home Minister's vision, while Maharashtra CM Eknath Shinde said the move aligns with Bal Thackeray’s 'one country, one law' principle. Both parties signaled positive stances on the reform.", "category": "Politics", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "6a57a9b2"}, {"headline": "FPIs offload ₹13,138 crore from Indian stocks in September", "summary": "Foreign portfolio investors (FPIs) sold Indian equities worth ₹13,138 crore in the first 10 trading sessions of September, reversing recent inflows. The cumulative net outflow for 2026 has reached a record ₹2,37,579 crore. Analysts attribute the selling to high equity valuations relative to corporate earnings and global macroeconomic uncertainty, including rising crude oil prices.", "category": "Business", "page": 15, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "872a9221"}, {"headline": "Sensex tanks 778 points amid global geopolitical tensions", "summary": "The BSE Sensex plummeted 777.94 points to close at 74,003.82, while the NSE Nifty dropped 279.50 points to settle at a five-month low of 23,118.60. The market crash was triggered by surging oil prices above $100 per barrel and geopolitical risks in the Middle East. Banking, auto, and oil stocks led the losses, while some IT firms like HCL Tech and Infosys saw gains.", "category": "Business", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "2fbfc4a6"}, {"headline": "Passenger vehicle sales in India grow 36.5% in August", "summary": "India's passenger vehicle wholesales surged 36.5% in August 2026, reaching 4,39,309 units. Data from SIAM showed growth across two-wheelers (10.5%) and three-wheelers (22.8%) as well. The industry is benefiting from high consumer confidence, resilient rural markets, and festive demand. Total production across all categories reached 31.57 lakh units during the month.", "category": "Business", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "25c5dcd0"}, {"headline": "Bangladesh court sentences seven Awami League leaders to death", "summary": "An International Crimes Tribunal in Bangladesh sentenced seven senior leaders of the former ruling Awami League to death in absentia. The convicted individuals, including former Minister Obaidul Quader, were found guilty of crimes against humanity and murder during the 2024 uprising. The court's decision follows the ouster of leader Sheikh Hasina on August 5.", "category": "World", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "f0c09ce8"}, {"headline": "Nitish and Samson lead India to T20I series win", "summary": "India secured a 2-0 lead in the three-match T20I series against Afghanistan with a seven-wicket victory in New Delhi. Nitish Kumar took 3 for 24 to help restrict Afghanistan to 159 for eight. In response, Sanju Samson struck a blistering 57 off 22 balls, and Abhishek Sharma hammered 82 runs as India chased the target in just 14.5 overs. Jasprit Bumrah also impressed on his return.", "category": "Sports", "page": 17, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "4824d854"}, {"headline": "Nepal flash floods threaten regional hydropower and energy security", "summary": "Devastating flash floods in Nepal have damaged at least 13 hydroelectric projects, potentially disrupting export earnings and domestic power supply. Scientists warned that climate change is increasing sediment loads in Himalayan rivers by 80%, wearing out turbines and infrastructure. Nepal, which relies on hydropower for 90% of its needs, may now have to increase power imports from India.", "category": "Science", "page": 25, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137434", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 25, "telegram_url": "https://t.me/c/1877410077/137434"}], "article_id": "c4ea8a88"}, {"headline": "Oil spike drags rupee near 96/$; Nifty dips 1.2%", "summary": "Indian markets fell as Brent crude topped $108/bbl and US 10-year Treasury yield breached 5%, increasing inflation and interest rate concerns. The rupee weakened 0.42% to 95.96 against the dollar. Nifty 50 dropped 1.19% to 23,118.60, Sensex 1.04%. Foreign investors sold ~2,978 crore equities.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "46deeab4"}, {"headline": "PV exports fell 17% in Aug as firms stocked up for festivals", "summary": "India's passenger vehicle (PV) exports dropped 17% YoY in August, while domestic dispatches surged 36.5% to a record 439,309 units. This was driven by festival season stocking and replacement demand. Two-wheeler and three-wheeler segments also saw growth. ICRA anticipates a moderation in growth for the second half of FY27.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "41adbca2"}, {"headline": "Schaeler India expects no major change from EU FTA", "summary": "Schaeler India MD Harsha Kadam stated the India-EU FTA will not significantly alter their imports or exports, as all European companies will receive similar tariff benefits. He noted that increased LPG and CNG prices have raised manufacturing costs, with the company absorbing some of these. Schaeler plans to focus on domestic business growth.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "f083305f"}, {"headline": "Bharat Forge, Pratt & Whitney team up for DRDO programme", "summary": "Bharat Forge Ltd and Pratt & Whitney Canada are collaborating on a DRDO high-altitude, long-endurance unmanned aerial vehicle program. Pratt & Whitney will assess engine compatibility, while Bharat Forge will lead engine-airframe integration and systems interfaces.", "category": "Technology", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "5a3e9cb2"}, {"headline": "Embassy Developments to invest ~2,000 crore in Bengaluru project", "summary": "Real estate developer Embassy Developments will invest around ~2,000 crore in the first phase of Embassy Origins, an 85-acre residential development in North Bengaluru. This phase includes two projects, Embassy Riverine and Embassy South Reserve, with a combined gross development value (GDV) of ~4,500 crore, offering over 2.6 msf of residential space.", "category": "Business", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "37e45d83"}, {"headline": "Uno Minda to invest ~1,415 crore across business verticals", "summary": "Auto component maker Uno Minda plans to invest ~1,415 crore to strengthen its manufacturing footprint and boost capacities across business verticals. This capital expenditure includes setting up a new aluminium casting unit in Hosur, Tamil Nadu, and expanding two-wheeler alloy wheel operations in Kharkhoda, Haryana, plus a new JV plant in Maharashtra.", "category": "Business", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "cffa1f84"}, {"headline": "Fada pushes automakers for more dealer contractual certainty", "summary": "The Federation of Automobile Dealers Associations (Fada) is urging automakers to adopt a model dealer agreement for greater contractual certainty. Dealers invest heavily based on short-term Letters of Intent. The proposed framework, based on international agreements, aims to protect dealers and ensure financial viability against sudden policy shifts or OEM management changes.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "185babeb"}, {"headline": "Blue Star JV partner seeks annulment of arbitration award", "summary": "Blue Star Ltd's Oman-based joint venture partner, W J Towell & Co LLC (WJT), has appealed to the Dubai Court of Appeal to annul an arbitration tribunal award. The tribunal dismissed WJT's claims worth ~223.6 crore against Blue Star in July this year. Annulment proceedings are confined to limited grounds.", "category": "Business", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "9d9c7830"}, {"headline": "Hilton adopts long-term approach for India luxury market growth", "summary": "Hilton is expanding its luxury presence in India, adding LXR to Bengaluru and Waldorf Astoria properties in Delhi, Jaipur, and Goa by 2030. Vice President Candice D’Cruz emphasizes precise brand placement to cater to evolving Indian luxury travelers, noting strong domestic demand and international awareness.", "category": "Business", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "74ca55c4"}, {"headline": "Entry-level engineers face widest hiring gap: foundit report", "summary": "India's engineering market has a widening talent mismatch: 45% of candidates have 0-3 years' experience, but only 28% of jobs. This leads to 9.5 candidates per entry-level job. Engineers with 4-10 years' experience account for 54% of jobs but only 42% of the active pool. Overall, there are 5.9 candidates for every engineering job.", "category": "Economy", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "e7470faf"}, {"headline": "Flipkart hires 250,000 for festival season demand", "summary": "Flipkart has hired over 250,000 people, including gig workers, to meet festival season demand. Nearly 75,000 of these roles are for first-time entrants. The jobs span 7,000+ facilities, expanding the delivery network to meet growing demand in Tier-II and Tier-III markets, also increasing opportunities for women and persons with disabilities.", "category": "Business", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "4d7e1ab1"}, {"headline": "CCPA escalates probe into Apple’s software warranty terms", "summary": "India’s Central Consumer Protection Authority (CCPA) is investigating Apple’s software warranty terms following allegations that the iOS 18 update damaged iPhone functionality, compelling users to pay \"exorbitant\" sums for repairs. This adds to Apple’s challenges in India, including accusations of breaching domestic antitrust laws.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "e28ad6d8"}, {"headline": "TotalEnergies partners Mistral AI for oil exploration boost", "summary": "TotalEnergies SE will partner with French AI startup Mistral AI, investing over €100 million ($115 million) over three years, to boost its oil and gas exploration capabilities. They will develop proprietary frontier AI models trained on geoscience data to extend the life of existing fields.", "category": "Business", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "4886c23a"}, {"headline": "Air India expands Salesforce AI use for customer services", "summary": "Air India is expanding its use of Salesforce’s Agentforce AI platform to streamline customer service processes. This includes automated email resolution, name change processing, and an AI-powered knowledge assistant for customer service teams, integrating AI across its digital ecosystem.", "category": "Technology", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "bbff0529"}, {"headline": "CCPA fines Rapido ~10 lakh for misleading ads", "summary": "The Central Consumer Protection Authority (CCPA) imposed a ~10 lakh penalty on ride-hailing platform Rapido for unfair trade practices and misleading advertisements. This action is part of a sector-wide examination into practices like pre-ride tipping and dynamic pricing among cab and bike-taxi aggregators.", "category": "Law", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "d93b1ddc"}, {"headline": "PhonePe cofounder: UPI is fully interoperable, no concentration risk", "summary": "PhonePe cofounder Rahul Chari states UPI is fully interoperable, ensuring systemic risk is solved with multiple PSP partners and data centers. PhonePe aims to deepen existing user engagement and bring in new users through diverse use cases, expecting financial services, especially lending, to be a significant revenue driver.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "1b362c63"}, {"headline": "Trade deficit hit five-month low in Aug", "summary": "India's trade deficit narrowed to a five-month low of $26.86 billion in August as merchandise exports surged 26.1% YoY to $43.81 billion, the fastest growth since June 2022. Imports rose 14% to $70.67 billion. Services exports yielded a $17.45 billion surplus. Growth was led by engineering goods, petroleum, chemicals, and textiles.", "category": "Economy", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "0172ee0a"}, {"headline": "Piyush Goyal to visit US for G20 trade ministerial", "summary": "Commerce and Industry Minister Piyush Goyal will visit the US at the end of September for the G20 trade ministerial in Milwaukee. He is expected to hold a bilateral meeting with US Trade Representative Jamieson Greer to discuss various trade issues between India and the US.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "98061f92"}, {"headline": "India can avoid middle-income trap with infrastructure investment", "summary": "French economist Thomas Piketty stated India can escape the 'middle-income trap' through substantial investments in education, healthcare, and infrastructure. He emphasized that India's involvement in global coalitions is essential for driving inclusive and sustainable growth, preventing slow growth and rising inequality.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "773af2af"}, {"headline": "Defence sector cornerstone of self-reliant India by 2047: Rajnath", "summary": "Defence Minister Rajnath Singh stated that technological leadership will determine strategic advantage in future warfare, making the defence sector the \"cornerstone\" of the vision for a \"technologically self-reliant, socially inclusive, environmentally sustainable, and strategically secure India\" by 2047.", "category": "India", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "9854a0de"}, {"headline": "India, China to address bilateral trade concerns", "summary": "Commerce Secretary Rajesh Agrawal stated India and China will continue discussions to address bilateral trade concerns like structural imbalance and supply-chain issues, and how to build trust. This follows a meeting between PM Modi and Chinese President Xi Jinping at the Brics Summit, amidst efforts to build trust.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "3271d23a"}, {"headline": "Unemployment rate falls to 5% in August on rural revival", "summary": "India’s unemployment rate eased to a five-month low of 5% in August, down from 5.1% in July, driven primarily by rural areas where it fell to 4.1%. The labour force participation rate (LFPR) rose to 55.6%, and the worker population ratio (WPR) also strengthened, indicating improving employment.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "86be9bd4"}, {"headline": "Telangana remains costliest state for 8th straight month", "summary": "Telangana has recorded the highest retail inflation in India for eight consecutive months, reaching 6.27% in August. Its rural inflation was 6.79% and urban inflation 5.88%, topping both sub-tables. Tamil Nadu (5.92%), Madhya Pradesh (5.93% rural), Andhra Pradesh (5.88% rural), and Odisha (5.90% rural) followed.", "category": "Economy", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "7309a67a"}, {"headline": "Food inflation unlikely to persist through year-end: Nageswaran", "summary": "Chief Economic Advisor V Anantha Nageswaran stated that the high food price inflation of around 6% recorded in August is unlikely to persist through year-end. He emphasized India’s intact economic momentum, while acknowledging current uncertainties require policy flexibility and agility.", "category": "Economy", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "43fbe39d"}, {"headline": "Domestic rice exporters eye Turkey, Jordan as new frontiers", "summary": "Indian rice exporters are shifting focus to unconventional markets like Turkey and Jordan, where shipments have risen significantly. This strategy, to be discussed at BIRC 2026, challenges the assumption that only major importing nations offer the best opportunities, seeking better returns from smaller, fast-growing destinations.", "category": "Business", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "3fd1d72b"}, {"headline": "NPCI to establish dedicated fund for small merchants", "summary": "NPCI will establish a dedicated fund for small merchants to subsidize and accelerate digital-payment infrastructure across Tier III to Tier VI regions, including the north-eastern states, Jammu and Kashmir, and Ladakh, as well as Tier-I and Tier-II areas. The fund is expected to receive about ~700 crore a year.", "category": "Economy", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "93c6b786"}, {"headline": "RBI absorbs ~3.93 trn through VRRR amid liquidity surplus", "summary": "The Reserve Bank of India (RBI) absorbed ~3,93,352 crore through a variable rate reverse repo (VRRR) auction, accepting all bids at a cut-off weighted average rate of 5.24 per cent. This action aims to absorb the banking system's estimated ~10.73 trillion excess liquidity and align overnight money market rates to the repo rate.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "8403d4d4"}, {"headline": "RBI likely to hike rates by 50 bps in Oct & Dec", "summary": "Economists predict the RBI will hike the repo rate by 50 bps (25 bps each in October and December) to 5.75%, as the retail inflation rate in Q3FY27 is expected to peak at 6.1%. Rising crude oil prices, continuing El Niño concerns, and narrowing rate differentials with the US are key influencing factors.", "category": "Economy", "page": 7, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "a65d3390"}, {"headline": "Non-life insurance premium rose 10% in August", "summary": "Gross direct premium underwritten by non-life insurers rose 10.05% year-on-year (Y-o-Y) to ~27,454.5 crore in August. This growth, which nearly doubled July's rate, was significantly supported by a 30.4% premium increase from standalone health insurers, while multi-line general insurers grew 8.7%.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "1e0e301c"}, {"headline": "India top waste generator, recycling rate improves", "summary": "India was the highest per capita waste generator among the top 10 economies in 2024. Nationally, total garbage generated nearly doubled from 101,066 tonnes per day (tpd) in 2015-16 to 185,195 tpd in 2023-24. Over the same period, India’s waste treatment rate rose significantly from 20% to 60%.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "3ec69a06"}, {"headline": "GenZ, GenAlpha must put nation first: Nirmala Sitharaman", "summary": "Finance Minister Nirmala Sitharaman urged GenZ and GenAlpha graduates to prioritize the nation, asking what they can contribute. She highlighted India's 7.8% growth amidst global uncertainties and Tamil Nadu's emergence as a tech powerhouse, encouraging humility and civic duty. Over 3,200 students received degrees.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "95743820"}, {"headline": "66 thermal power plants face low coal stocks", "summary": "Coal stocks at 66 thermal power plants are critical, up from 59 last week, with actual stocks dropping 9% to 24.04 mt, just 41% of normative levels. This worsening situation is due to higher electricity demand (17.6% YoY in Sept) and lower hydropower production, impacting states like Karnataka.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "9997677d"}, {"headline": "Houthi attacks on Saudi Arabia threaten regional stability: MEA", "summary": "India's External Affairs Ministry expressed serious concern over Houthi attacks on Saudi Arabia's civilian infrastructure and economic assets, cautioning that such strikes undermine regional stability and threaten freedom of navigation through the Bab-el-Mandeb strait. The MEA confirmed continued energy supplies from the region.", "category": "Politics", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "c1ef3132"}, {"headline": "Fertiliser sales dip 10% in Aug on weak monsoon", "summary": "Domestic fertiliser sales fell 10.33% year-on-year to 6.51 million tonnes in August, primarily due to a weak monsoon with an all-India rainfall deficit of 16.3%. Urea sales dropped 3.66%, while Muriate of Potash (MOP) and other complexes saw larger declines. Input prices for sulphur and ammonia also rose.", "category": "Economy", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "5f18b499"}, {"headline": "Govt assuages water worries amid data centre surge", "summary": "A senior official clarified that growing data centers in India are unlikely to drain local water supplies as they use advanced closed-loop, air-cooling, and direct-to-chip liquid-cooling systems, relying on industrial wastewater or desalinated water. India ranks seventh globally in data center facilities, with $90 billion investment pipeline.", "category": "Technology", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "45156801"}, {"headline": "Delhi HC quashes ITAT orders in Patanjali case over 'undue haste'", "summary": "The Delhi High Court set aside seven Income Tax Appellate Tribunal (ITAT) orders concerning Patanjali Ayurved, citing \"undue haste\" and a lack of reasoning. The court directed a fresh hearing by a different ITAT bench and forwarded its order to the Law Ministry regarding procedural deficiencies.", "category": "Law", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "188d19b8"}, {"headline": "SC issues notice on religious studies' institutions regulation", "summary": "The Supreme Court sought a response from the school education secretary in the Ministry of Education regarding a petition. The plea alleges non-compliance with a previous court order to consider regulating institutions that impart religious instruction to children aged below 14.", "category": "Law", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "a4032d3a"}, {"headline": "SC asks Centre to consider extending tribunal members' tenure", "summary": "The Supreme Court asked the Centre to consider extending the tenure of retiring presiding officers and members of quasi-judicial tribunals for approximately a month. This measure aims to prevent these tribunals from becoming defunct due to vacancies while fresh appointments are being processed.", "category": "Law", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "47890e62"}, {"headline": "RBI to mediate PayU, banks in merchant codes dispute", "summary": "The Delhi High Court has directed the RBI to mediate a dispute between PayU Payments, Yes Bank, ICICI Bank, and Visa regarding the classification of merchants and related interchange fee claims. ICICI alleged incorrect Merchant Category Codes led to lower fees; PayU denies assigning MCCs. Status quo is ordered during mediation.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "47ce5297"}, {"headline": "Emmy-winning fashion designer Bob Mackie dies at 87", "summary": "Legendary Hollywood fashion designer Bob Mackie, celebrated for his use of sequins, rhinestones, and glitter while dressing icons like Cher and Elton John, passed away at 87. He won nine Emmy Awards and received Oscar nominations for his costume designs.", "category": "Culture", "page": 8, "importance": 3, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "c79aa33d"}, {"headline": "LVMH, L’Oréal vie for France’s largest market cap", "summary": "LVMH and L’Oréal are in a tight race for France’s top market capitalization. LVMH shares fell 2.5%, reducing its market value to €201 billion, just below L’Oréal SA. This drop also pushed LVMH out of Europe’s top 10 listed firms for the first time since 2017.", "category": "Business", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "d7d28042"}, {"headline": "Singapore’s air quality worst since 2019 due to haze", "summary": "Singapore experienced its worst air quality since September 2019, with all five regions reporting unhealthy levels on Tuesday. The deterioration is attributed to smoke from wildfires in neighboring Indonesia, leading Singapore to rank among the world's most polluted cities, according to IQAir data.", "category": "Environment", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "4831fd59"}, {"headline": "US 10-year bond yield highest since 2007 as rate hike looms", "summary": "The US 10-year Treasury yield rose to its highest level since 2007, surpassing 5%, amidst a global bond selloff. This surge is driven by rising energy prices, increasing debt, and inflation concerns, ahead of the Federal Reserve’s interest-rate decision on Wednesday. Global yields in Germany and Australia also increased.", "category": "Economy", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "c5550ad9"}, {"headline": "Saudi Arabia on high alert after week of strikes", "summary": "Saudi Arabia issued security alerts across regions, including Mecca and Jeddah, after a week of attacks from Iran-aligned Houthis, drawing it deeper into the West Asia war. Egyptian President Abdel Fattah al-Sisi and Saudi Crown Prince Mohammed bin Salman discussed ensuring navigation freedom in the Bab el-Mandeb Strait and Red Sea.", "category": "World", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "4b6e1ba1"}, {"headline": "Gates Foundation warns AI inequality, pledges $1 billion for equity", "summary": "Bill Gates' foundation pledges $1 billion over two years to ensure AI combats social inequities, not deepens disparities. The funds will support training AI models on local languages, improving health and education tools, and informing small farmers globally, focusing on underserved communities. Gates highlights biases if AI isn't controlled.", "category": "Technology", "page": 8, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "b3e35057"}, {"headline": "NY leader Alex Bores launches $30M AI safety group for 2028 election", "summary": "New York Assemblyman Alex Bores and his former chief of staff are launching \"Who Decides,\" a $30 million initiative to develop an artificial intelligence (AI) safety agenda for the 2028 election. The group will collaborate with Democratic organizations to make AI safety a pressing issue for candidates.", "category": "Politics", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "b51e68fe"}, {"headline": "US court blocks Trump’s cap on student, scholar visas", "summary": "A federal judge temporarily blocked a Trump administration rule that sought to cap stays for foreign students, exchange visitors, and journalists to four years. The judge cited \"catastrophic\" damage to the US economy and higher education. The rule had included a 90-day limit for Chinese media persons.", "category": "World", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "e7abc4df"}, {"headline": "Nato shoots down drone entering Lithuanian airspace", "summary": "Nato jets shot down an unidentified drone that flew into Lithuanian airspace from neighboring Belarus. The drone was intercepted five kilometers from a power plant near Pratkūnai. This incident, amid rising concerns over Russia's war spilling into Europe, prompted air alerts over Vilnius and Kaunas. Preliminary indications suggest no explosives.", "category": "World", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "6464a4fc"}, {"headline": "Cement capacity buildup risks surplus supply, price pressure", "summary": "India’s cement industry risks capacity additions outpacing demand growth over FY27-FY28, potentially leading to lower utilization (expected to ease to 68-69%) and pricing pressure. While demand fundamentals remain strong, with major players aggressively expanding, regional markets could see differing impacts on utilization.", "category": "Business", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "18ad0f2e"}, {"headline": "Homebuyers: Choose RERA or Consumer Court carefully", "summary": "Homebuyers must carefully choose between RERA and Consumer Protection Act forums for relief in delayed or stalled projects. A recent NCDRC ruling affirmed the 'doctrine of election', generally preventing parallel proceedings or switching forums for the same claim. RERA is for possession/refund, Consumer Court for deficient service/damages.", "category": "Law", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "e891184d"}, {"headline": "Explain source of funds or risk tax scrutiny: ITAT case", "summary": "A recent ITAT case highlighted the importance of maintaining a clear financial trail for bank deposits to avoid tax scrutiny. Taxpayers must satisfactorily explain the source of funds with supporting documents like bank statements, FD records, or sale/succession proceeds, otherwise, deposits may be treated as taxable unexplained income.", "category": "Economy", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "0ae7f908"}, {"headline": "Rising oil, yields sour Nifty; NSE IPO gets large demand", "summary": "The Nifty fell 1.19% due to rising crude prices and US bond yields, with IT stocks being a rare gainer. NSE CEO Ashishkumar Chauhan stated the exchange's IPO attracted \"unexpectedly large\" demand, exceeding available shares. The offer size was reduced to 5.11% from 6.2% due to initial reluctance from existing shareholders.", "category": "Business", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "0fa15e10"}, {"headline": "SC refuses Ramkrishna's plea against HC order in NSE case", "summary": "The Supreme Court declined to interfere with the Delhi HC's refusal to quash PC Act proceedings against former NSE CEO Chitra Ramkrishna in the co-location case. The SC clarified that the trial court can determine her \"public servant\" status, and the special court retains jurisdiction even if she is deemed not a public servant.", "category": "Law", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "27562fab"}, {"headline": "Tata firms rally; FPI onboarding to speed up", "summary": "Tata Group companies rallied on Tuesday after the RBI rejected Tata Sons' bid to shed its core investment company (CIC) status, potentially paving the way for a listing. Meanwhile, FPI onboarding is accelerating, with Citi launching fast-track registration, cutting the process to five business days.", "category": "Business", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "fb1cb3c0"}, {"headline": "HDFC Bank shares rise after CEO candidate submission", "summary": "HDFC Bank shares rose over 3% after the bank submitted two candidate names for the chief executive officer position to the RBI, easing investor concerns over succession. Kaizad Bharucha (Deputy MD) and Anup Bagchi (ICICI Prudential Life Insurance) are reportedly the internal and external candidates, respectively.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "41d7141d"}, {"headline": "Sebi plans stronger tech resilience norms for exchanges", "summary": "Sebi proposed shortening disaster recovery (DR) drills for market infrastructure institutions (MIIs) to at least four hours and introducing tighter operational resilience norms for stock exchanges. Drills must cover all market operation scenarios, simulate real-life loads, and include comprehensive testing of non-transactional components at the primary data center.", "category": "Business", "page": 16, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "fd8110e6"}, {"headline": "Integrated Battle Groups to reshape Indian Army warfare", "summary": "Indian Army is operationalizing Integrated Battle Groups (IBGs) – agile, self-contained, brigade-sized units of up to 5,000 troops integrating all combat arms. Designed for rapid deployment (12-48 hours), they aim to overcome traditional divisions' mobilization slowness, especially against threats from China, transforming land warfare tactics.", "category": "India", "page": 20, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 20, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "c8375bc3"}, {"headline": "India’s tax system makes huge progress, but reforms unfinished", "summary": "India's tax system has transformed significantly since 1991 with lower rates, a broader base, and digital administration, culminating in the Income Tax Act, 2025, and GST rollout in 2017. Direct tax revenue as a share of GDP rose from 2% to 6%. Remaining challenges include simplifying GST, clearing appeals, and easing business compliance.", "category": "Economy", "page": 21, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 21, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "aed4c599"}, {"headline": "Meta to share child abuse case details directly with Indian agencies", "summary": "Meta has agreed to directly share child sexual abuse material (CSAM) cases and details of repeat offenders with Indian law enforcement agencies. This marks a first for any social media platform in India, bypassing the National Center for Missing & Exploited Children (NCMEC) route which previously caused delays in critical investigations.", "category": "Technology", "page": 22, "importance": 8, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "98620410"}, {"headline": "AstaGuru opens new Southeast Asia home in Singapore", "summary": "Mumbai-based auction house AstaGuru launched its first Southeast Asia office and gallery in Singapore, featuring an exhibition of modern and contemporary Indian art. It aims to champion South Asian art and cater to a growing international collector base, expanding offerings to fine jewellery, luxury watches, and rare collectibles.", "category": "Culture", "page": 22, "importance": 4, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "b47d70d8"}, {"headline": "Police to question Google over 500K fake Gmail IDs in bomb hoax", "summary": "Indian police will question Google over a lack of safeguards after busting a criminal network that used over 500,000 fake Gmail IDs for bomb threats and financial scams. Gujarat police broke up the network, which sent \"inter-state\" bomb threats, and plan to formally designate Google as a subject of investigation.", "category": "Law", "page": 22, "importance": 6, "telegram_url": "https://t.me/c/1877410077/137478", "sources": [{"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137478"}], "article_id": "67b7df87"}, {"headline": "India’s unemployment rate drops to six-month low of 5% in August", "summary": "Official Periodic Labour Force Survey data shows India’s unemployment rate fell to 5% in August from 5.1% in July. The decline was driven by rural areas where joblessness hit an eight-month low of 4.1%. Female unemployment improved significantly to 5.1%, while urban unemployment saw a slight uptick to 6.8%. The labor force participation rate rose marginally to 55.6%.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137454"}], "importance": 9, "article_id": "89f9db78"}, {"headline": "Current account deficit widens to $7 billion in July", "summary": "India's current account deficit expanded to $7 billion in July from $3.2 billion a year ago, primarily due to a higher merchandise trade deficit of $31.7 billion. Net foreign direct investment rose to $7.3 billion, while services surplus improved to $17.6 billion. The overall balance of payments recorded a surplus of $20.8 billion for the month.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 8, "article_id": "0cdab063"}, {"headline": "AI startup Flam raises $40 million in Series B funding", "summary": "Interactive AI content company Flam has secured $40 million in a round led by QED Investors. The funds will be used for R&D of AI models and global enterprise sales expansion. Flam targets $100 million in annual recurring revenue within 24 months. Participants in the round included existing investors and celebrity actor Shah Rukh Khan.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 6, "article_id": "88f790e7"}, {"headline": "Hero Motors eyes ₹1,000 crore IPO driven by EV growth", "summary": "Hero Motors Ltd is launching a ₹1,000 crore IPO to fund debt repayment and expansion. The company is pivoting toward higher-margin powertrain solutions for electric vehicles, which now contribute 23% of sales. While profit growth is leading peers, the company faces challenges with underutilized facilities and high customer concentration, with the top buyer accounting for 35% of revenue.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/137454"}], "importance": 7, "article_id": "04cff342"}, {"headline": "Tata Sons may challenge RBI order on mandatory public listing", "summary": "Tata Trusts is urging Tata Sons to seek a review of the RBI's decision denying its request to surrender NBFC registration. The RBI has filed a caveat in the Bombay High Court to ensure its stance is heard. A mandatory listing would force transparency on the conglomerate's internal capital shifts, potentially complicating the search for a successor to chairman N. Chandrasekaran.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 10, "article_id": "7c5c38c8"}, {"headline": "Solar Industries acquires Omnia for $1.35 billion, valuations high", "summary": "Solar Industries India will acquire South Africa's Omnia Holdings for $1.35 billion (~12,950 crore), accelerating its growth in industrial explosives and defence products. Omnia's mining and agriculture businesses offer enhanced market share and supply chain flexibility. Despite strong growth, Solar Industries' valuations are consistently high, around 55x expected FY28 EPS.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 7, "article_id": "bf2b2eaa"}, {"headline": "Delhi High Court seeks OpenAI's response in ANI content lawsuit", "summary": "The Delhi High Court has issued a notice to ChatGPT creator OpenAI following an appeal by news agency ANI. The lawsuit alleges unauthorized scraping of news content. OpenAI previously undertook not to download ANI content as an interim pact. The court declined to pass an immediate injunction, noting the public interest and educational benefits of generative AI models.", "category": "Law", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 7, "article_id": "2b5794fb"}, {"headline": "Meta agrees to report child abuse cases directly to Indian portal", "summary": "Meta has agreed to report Child Sexual Abuse Material (CSAM) cases directly to the Indian Cybercrime Coordination Centre (I4C) under the home ministry. The move simplifies the previous process of routing through US-based non-profits, aiming to accelerate law enforcement action. Meta India head Arun Srinivas recently appeared before the NCPCR regarding child abuse content on its platforms.", "category": "Technology", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_16-09-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/137461"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "importance": 8, "article_id": "11cf2820"}, {"headline": "NPCI sets 0.4% merchant fee for UPI payments above 2,000", "summary": "The National Payments Corporation of India (NPCI) announced a 0.4% Merchant Discount Rate (MDR) for person-to-merchant UPI payments exceeding 2,000 rupees, effective October 15. The levy aims to improve financial viability for banks and payment operators. Small-ticket transactions and peer-to-peer transfers remain free. Most average merchant payments fall below the 2,000 threshold.", "category": "Business", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 10, "article_id": "973538b4"}, {"headline": "US confirms first-ever deployment of defensive weapons in space", "summary": "Air Force Secretary Troy Meink confirmed the US has fielded on-orbit space control weapons to defend against hostile adversary actions. The announcement follows concerns over Russian anti-satellite weapon development. China has urged the US to halt space militarization to avoid an arms race. Meink predicted the service would look radically different by 2032 due to autonomous systems.", "category": "Technology", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "Business Standard", "pdf_filename": "BS Delhi 16-09-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/137478"}], "importance": 8, "article_id": "18b898db"}, {"headline": "India’s August goods exports surge 26% narrowing trade deficit", "summary": "India’s trade deficit narrowed to $9.4 billion in August 2026, driven by a 26.1% growth in merchandise exports to $43.8 billion. Overall exports, including services, rose 25.4% to $82.7 billion. Commerce Secretary Rajesh Agrawal noted that the growth was led by significant volume increases across 68 principal commodities, rather than just currency depreciation factors.", "category": "Economy", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "importance": 9, "article_id": "cbee5858"}, {"headline": "Six States sign ₹15,624-crore pact for Kishau multipurpose project", "summary": "Himachal Pradesh, Haryana, Uttarakhand, Uttar Pradesh, Rajasthan, and Delhi signed an agreement for the 422-MW Kishau multipurpose project on the Tons river. The project aims to resolve a long-pending water dispute and will irrigate 97,000 hectares while generating 1,476 million units of hydropower. The Centre will bear 90% of the financial burden, with states sharing the remainder.", "category": "Infrastructure", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore ET 16-09-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/137454"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 16-09-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/137434"}], "importance": 8, "article_id": "d320d0bd"}, {"headline": "Odisha rejects premature release of Staines murder convict Dara Singh", "summary": "Odisha’s State Sentence Review Board rejected the premature release of Rabindra Kumar Pal, alias Dara Singh, who is serving a life sentence for the 1999 murder of Australian missionary Graham Staines and his two sons. The board cited potential communal disturbances and societal ramifications as reasons for the denial,
