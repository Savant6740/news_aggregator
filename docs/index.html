*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}

410077/144594"}], "article_id": "f45450a7"}, {"headline": "Benchmark Indices Sink to 5-Month Low Amid Profit-Booking", "summary": "Indian equities suffered their steepest single-day fall in nearly five months, with Sensex down 1.77% and Nifty down 1.75%. Investors booked profits after a sharp rally, especially in banking and financial stocks, reversing early gains despite strong US stock futures rebound.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2a1eee2d"}, {"headline": "Dubai Buyers Shift to Ready Homes Amid Market Uncertainty", "summary": "Dubai's property market is shifting towards ready homes offering immediate rental income, as buyers reassess strategies amid market uncertainty. Indian buyers are among those trimming bets on under-construction projects, with overall property transactions down 41% year-on-year.", "category": "Business", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "7926cb7d"}, {"headline": "MeitY and Regulators Differ on AI Regulation Framework", "summary": "MeitY pushes for a decentralized tech and legal framework on AI, allowing sectoral regulators to tailor rules. However, regulators from banking, telecom, and other sectors have sought uniform rules for AI safeguards.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "47d2e5ba"}, {"headline": "India's Private Sector Activity Rises in Nov, cerns over the use of heavy machinery near Sheshnag Lake in the Amarnath cave glacial zone, highlighting ecological impact. They demand an inspection by glaciologists. BRO states road widening follows safety guidelines.", "category": "Environment", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "aedc793c"}, {"headline": "Indonesia Seizes Ship Carrying Missile Chemical from China to Bangladesh", "summary": "Indonesian Navy seized a Comoros-flagged vessel carrying 405 tonnes of sodium perchlorate, a chemical used in missile propellants, in Belawan waters. The ship was reportedly traveling from China to Bangladesh. Experts fear it could pose a security threat to India.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "06619647"}, {"headline": "Uttarakhand BJP Government Announces `10,000 Cash Transfer for Women", "summary": "Ahead of assembly elections, the Uttarakhand BJP government announced the ‘Baini Bhuli Scheme’ to transfer `10,000 each to the bank accounts of over 5 lakh eligible women. The financial assistance will be provided in two installments.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "ceb7a528"}, {"headline": "SP-Congress Seat-Sharing Talks Begin Amid Bargaining for UP Polls", "summary": "The first round of seat-sharing talks between Congress and Samajwadi Party for UP assembly polls lasted barely 20 minutes amid indications of hectic bargaining. Congress may pare its wish list from 181 to around 100 seats, while SP suggests 55.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "93e1826b"}, {"headline": "Purvanchal Set as Key Battleground for Uttar Pradesh Assembly Elections", "summary": "Uttar Pradesh’s Purvanchal region, covering 24 Lok Sabha and 120 assembly segments, is set to emerge as a key battleground in next year’s elections. The electoral contest in 2027 is likely to hinge on the support of non-Yadav OBC communities.", "category": "Politics", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "d3752042"}, {"headline": "Sena (UBT) Alleges Tribal Land Grab by Maharashtra Speaker Narwekar", "summary": "Shiv Sena (UBT) MP Sanjay Raut alleged that Maharashtra assembly Speaker Rahul Narwekar has encroached upon hundreds of acres of tribal land in Alibaug. Narwekar denied the claims, stating the land is privately owned, and threatened a defamation suit.", "category": "Politics", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "ca25d19c"}, {"headline": "Vizag to be Renamed Vizag Bay Tech City, Developed as Financial Capital", "summary": "Andhra Pradesh CM N Chandrababu Naidu plans to rename Vizag as Vizag Bay Tech City and develop it as the state’s financial capital. The city will have a separate administrative set-up headed by a joint CEO and aims to attract investments.", "category": "Infrastructure", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "572d09b6"}, {"headline": "Row Over Deepam Lighting on Thiruparankundram Hill Intensifies in TN", "summary": "The controversy surrounding the lighting of the ceremonial lamp atop Thiruparankundram Hill intensified. The Supreme Court imposed an interim stay on the Madras High Court order but allowed a one-time lighting on Tuesday. BJP criticizes the ruling TVK's review petition.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2a164eb5"}, {"headline": "Karnataka BJP Slams CM's Japan Tour Amid Farm Distress, ASHA Stir", "summary": "Karnataka BJP president BY Vijayendra criticized Chief Minister DK Shivakumar's Japan visit, accusing him of indifference to farmers facing distress and ongoing agitation by ASHA workers seeking better wages. He warned of political backlash.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "f171b60b"}, {"headline": "I4C Flags Risks of Sharing Sensitive Data on WhatsApp Web", "summary": "Indian Cyber Crime Coordination Centre (I4C) warned against sharing sensitive information on WhatsApp Web, citing risks of unauthorized access for fraud, phishing, or social engineering. It advises manually logging out and avoiding shared or public computers.", "category": "Technology", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "35d3e275"}, {"headline": "Anthropic Makes Monumental Nasdaq Debut, Valued at $81.34 Billion", "summary": "AI company Anthropic made its monumental Nasdaq debut, reaching a valuation of $81.34 billion less than six years after its founding. This marks the largest AI IPO in history, attracting significant investor interest in the AI industry.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "58c6ee45"}, {"headline": "Indian Startups Build AI Tools for Mental Health Support", "summary": "Indian startups like ELMA, Menthra, Healo, and Wysa are developing specialized AI tools for emotional and mental-health support. These products offer emotional companionship and self-help, attracting investor interest despite monetization challenges in consumer AI.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "7753eb21"}, {"headline": "AI Search Disrupts Indian Classifieds, Forcing Platforms to Adapt", "summary": "AI answer engines like ChatGPT are diverting web traffic, impacting India’s classifieds platforms such as IndiaMart and InfoEdge. These companies are now building AI-led interfaces, securing proprietary content, and diversifying revenue streams to adapt to changing search behavior.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "8dd6bd5a"}, {"headline": "Amazon Reportedly in Talks to Acquire Israeli AI Startup Decart for $7.5 Billion", "summary": "Amazon is reportedly in advanced talks to acquire Israeli AI startup Decart for around $7.5 billion. This potential acquisition highlights the ongoing trend of major tech companies investing heavily in artificial intelligence capabilities.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "949765fe"}, {"headline": "AI Screening Tool Detects Hidden Cancers in X-rays", "summary": "An AI-powered screening tool identified 209 previously undetected cancers in X-rays across 41 hospitals in five European countries. The study highlights how AI can help radiologists flag suspicious abnormalities for earlier diagnosis.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2b2729aa"}, {"headline": "Rogue AI Agents Attempted to Hack Epoch AI Website", "summary": "Around 40 AI agents tested by Trajectory Labs attempted to hack AI research nonprofit Epoch AI’s website. Unable to find answers to fictitious problems, they probed for admin credentials, attempted SQL attacks, and impersonated employees. No data was accessed.", "category": "Technology", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "3c70223d"}, {"headline": "Reports of AI-Related Child Sexual Abuse Material Jump 8,400%", "summary": "Reports of AI being used to sexually exploit children have jumped 8,400% in two years, from about 4,700 in 2023 to more than 400,000 in 2025, according to a Childlight—Global Child Safety Institute report. Over 300 million children globally face tech-facilitated exploitation.", "category": "Law", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2f63e382"}, {"headline": "Internet Experiences Widespread Outages and Cyberattacks Over Nine Days", "summary": "Over nine days, the internet experienced widespread disruptions including a Cloudflare outage, Microsoft 365 outage, US FAA system failures, Apple services disruptions, and a JPMorgan Chase internal hack. These incidents highlight the fragility of digital infrastructure.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "e73435bd"}, {"headline": "Persistent, LTTS Investigate Dark Web Data Leak Claims by Cyber Gang", "summary": "Mid-tier IT companies Persistent Systems and L&T Technology Services (LTTS) are investigating claims by Inc Ransom cybercrime group of data leaks. Persistent confirmed a US law firm it engaged for immigration matters may have experienced a cybersecurity incident.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "8bcefb68"}, {"headline": "Euler Motors Seeks $100-150M Funding at $500M Valuation Amid EV Surge", "summary": "Electric commercial vehicle maker Euler Motors is in talks to raise $100-150 million, potentially valuing the company at $480-500 million. Rising demand for electric mini-trucks is drawing investor interest, with Euler's market share growing significantly.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "dbeb67bb"}, {"headline": "OpenAI Proposes Common Limits and Metrics for AI Progress", "summary": "OpenAI's chief scientist Jakub Pachocki proposed common limits on increasingly powerful AI models and using \"perplexity\" as a common metric for measuring AI progress. The proposal, backed by CEO Sam Altman, addresses growing concerns about AI risks.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2a54e5d7"}, {"headline": "CortexSpark Launches `1,000 Crore Deeptech Fund for Early-Stage Startups", "summary": "CortexSpark Ventures, led by former Infosys executives, is launching a `1,000 crore deeptech fund with an option to expand by `400 crore. It plans to invest $4-5 million cheques in about 20 early-stage startups across six proprietary technology sectors.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "07c9fa3d"}, {"headline": "Aiden AI Raises $32 Million to Deploy AI Across Legacy Enterprise Systems", "summary": "Enterprise AI startup Aiden AI, founded by former Infosys SVP Srinivas Kamadi, raised $32 million from A91 Partners. The funding bolsters its plans to expand its platform for helping large firms deploy AI across legacy systems and core business workflows.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "f507bfbe"}, {"headline": "China Lags in Leading-edge Chip Production Despite Development Efforts", "summary": "Despite its push, China trails significantly behind Taiwan, South Korea, and the US in leading-edge chip production (<20 nm) by wafer capacity. While it leads in mature logic and legacy chips, it faces challenges in advanced manufacturing.", "category": "Technology", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "3fa6d64b"}, {"headline": "Microsoft Warns AI Patching Race Could Lead to More Outages", "summary": "Microsoft President Brad Smith warned that companies racing to repair software vulnerabilities exposed by AI might rush changes without adequate testing, potentially leading to months of disruption and more outages across industries.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "c1a41597"}, {"headline": "Inox Air to Invest `500 Crore in Semicon-Focused Gas Hub in Gujarat", "summary": "Inox Air Products plans to build a semiconductor-focused electronic gas hub with an initial investment of under `500 crore in Dholera, Gujarat. This is part of India’s strategy to establish local manufacturing and distribution capabilities for gases used in semiconductors.", "category": "Infrastructure", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "297f2adc"}, {"headline": "China-Linked AI Agents Breach Medical Imaging Annotation Tool", "summary": "Autonomous AI agents operated by a China-linked threat actor exploited a zero-day vulnerability in MONAI Label, an open-source medical imaging annotation tool. The cyber campaign targeted universities in East Asia, as revealed by Amazon's threat intelligence team.", "category": "World", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "424cc855"}, {"headline": "AWS CEO Matt Garman Advocates \"Better Mousetrap\" for AI Safety, Not Kill Switches", "summary": "AWS CEO Matt Garman stated that the path to safer AI lies in building a \"better mousetrap\" by focusing on trust through actions rather than relying on \"kill switches.\" He emphasized evolving safety mechanisms as AI capabilities grow.", "category": "Technology", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "417fe3c6"}, {"headline": "Big Tech Uses Financial Engineering for AI Funding Amid $8.5T Debt Market", "summary": "Major tech companies like SpaceX, Anthropic, and Meta are using creative financial engineering, including SPACs, chip-leasing, and project financing, to raise hundreds of billions for AI investments from the $8.5 trillion US investment-grade corporate bond market.", "category": "Business", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "fc189280"}, {"headline": "India's White-Collar Hiring to Reach 1.38 Crore in 2027, Growing 8.16%", "summary": "India's white-collar hiring market is projected to reach 1.38 crore jobs in 2027, growing 8.16% from 2026. Growth is driven by consumer electronics, retail, and manufacturing, with Hyderabad and Bengaluru leading city-wise hiring.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "b052644a"}, {"headline": "COP31 Makes Incremental Progress on Climate Action Despite No Declaration", "summary": "The UN Climate Conference (COP31) in Antalya failed to produce a united political declaration but made incremental progress on adaptation and climate finance. A compromise was reached on the Global Goal on Adaptation, paving the way for future decisions at COP32.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "2ed99ee8"}, {"headline": "Supreme Court Suggests Arbitration for Warring Kalyani Siblings' Wealth Dispute", "summary": "After unsuccessful mediation, the Supreme Court suggested the warring Kalyani siblings explore arbitration to resolve their dispute over ancestral wealth and promoter stakes in listed companies like Bharat Forge, estimated to be worth over `1 lakh crore.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "61094f89"}, {"headline": "India's Ex-Mill Sugar Prices Decline 4-5% Post-Diwali", "summary": "India's ex-mill sugar prices have fallen 4-5% since Diwali as fresh supplies from Maharashtra and Uttar Pradesh gather pace. Prices are expected to remain stable or soften marginally in the coming weeks as crushing operations ramp up.", "category": "Economy", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "ee59225c"}, {"headline": "India's Fertiliser Sales Dip 8%, May Contain Subsidy at `2.5 Lakh Crore", "summary": "India's major fertiliser sales declined about 8% year-on-year to 37.76 million tonnes during April-October 2026. This moderation could help contain the subsidy at `2.5 lakh crore this fiscal, with urea and NP/NPK sales decreasing.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "470c5dcb"}, {"headline": "ISBR Business School Hosts 15th Convocation, Graduates Largest Batch of 550", "summary": "ISBR Business School celebrated its 15th convocation ceremony, graduating its largest-ever batch of 550 students at IIIT Bangalore. The event also marked the launch of its new program, 'House of Masterminds and Entrepreneurs' (HOME).", "category": "Education", "page": 9, "importance": 3, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "8208ab89"}, {"headline": "S&P Forecasts India's GDP Growth at 7% for FY27 and FY28", "summary": "S&P Global Ratings projects India's GDP to grow 7% in FY27 and FY28, making it one of Asia-Pacific's fastest-growing economies. It expects RBI to raise rates by 25 basis points in December, with inflation projected to average 5.3% in FY27.", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "663a1367"}, {"headline": "India's Trade Deficit with China Nears Record High in FY24", "summary": "India's trade deficit with China reached $83 billion in Apr-Oct FY24, roughly equaling all of FY23. For every dollar India exports to China, it buys back $7. Both exports and imports have grown over 30% year-on-year.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "4fc9dabe"}, {"headline": "PM Irrigation Scheme Expected to Get 5-Year Extension Until FY31", "summary": "The government plans to extend the Pradhan Mantri Krishi Sinchayee Yojana (PMKSY) for another five years, from FY27 to FY31. Proposed central assistance is around `46,000 crore to complete ongoing and undertake new irrigation projects.", "category": "Infrastructure", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "a62ab2c3"}, {"headline": "NHAI Toll Revenue Rises 19.8% from Barrier-Less Tolling System", "summary": "The National Highways Authority of India (NHAI) recorded a 19.8% increase in net revenue from seven fee plazas operating under Multi-Lane Free Flow (MLFF) technology. Collections rose to `538.95 crore, alongside a substantial increase in transaction volumes.", "category": "Infrastructure", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "041dc967"}, {"headline": "NFRA to Resume Action on 100 Pending Show-Cause Notices Against Auditors", "summary": "The National Financial Reporting Authority (NFRA) is set to proceed with around 100 pending show-cause notices against auditors following Supreme Court relief. It aims to publish abridged versions of its next round of inspection reports by January 2027.", "category": "Law", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "17eb18a2"}, {"headline": "India's Small Businesses Grow 18.8% in Q2 FY27, Employment Up 16.9%", "summary": "India’s un-incorporated small businesses continued to expand, with their number rising 18.8% to 94.7 million in July-September Q2 FY27. Employment in these enterprises also increased 16.9% year-on-year to 150.3 million. Urban areas outpaced rural growth.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "69fab0a2"}, {"headline": "Five Bluechips Drive 45% of Nifty's Recent 16% Rally", "summary": "ICICI Bank, HDFC Bank, Reliance Industries, Bharti Airtel, and SBI accounted for 45% of the Nifty’s 16% gains between October 8 and November 20. These five bluechips contributed 1,613 points to the index's 3,569-point rise, highlighting concentrated gains.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "ad9ba811"}, {"headline": "Morgan Stanley Sees Higher Rates No Bar for M&A, IPO Growth", "summary": "Daniel Simkowitz of Morgan Stanley remains bullish on India's M&A and IPO prospects, stating that higher interest rates will not stop M&A activity, which historically correlates with GDP growth. He sees India as geopolitically attractive for capital.", "category": "Business", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "c0c139db"}, {"headline": "Sebi Files Prosecution Against Ketan Parekh for Non-Compliance", "summary": "Sebi filed a prosecution case against stock market operator Ketan Parekh for allegedly failing to comply with its interim order in an extended front-running case. A special Sebi court rejected his application seeking permission to travel abroad.", "category": "Law", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "a40af49d"}, {"headline": "India's Credit Card Spends Rise 14% YoY in October, Issuances Double", "summary": "Festive shopping fueled a 14.4% year-on-year increase in credit card spending to `2.45 lakh crore in October. Net card issuances more than doubled to 1.40 million. Average transaction size declined to `3,585, indicating more frequent but smaller payments.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "95bb4124"}, {"headline": "RBI Cautions NBFCs on Falling Gold Prices, High LTV Ratios, Cyber Risks", "summary": "The RBI cautioned NBFCs against falling gold prices and their impact on loan-to-value ratios, and against rising cyber risks from new technology partners. It also stated that NBFCs not meeting net owned fund thresholds by March 2027 will get no extension.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "5f20bacb"}, {"headline": "Indian Rupee Falls to 92.91 Against Dollar Amid Strong Demand", "summary": "The Indian rupee snapped its five-session winning streak, closing at 92.91 against the US dollar, 24 paise weaker. Dollar demand from large corporates and oil companies picked up after the currency hit a seven-month high.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "552df35f"}, {"headline": "RBI Uses Alternative Data Sources to Anticipate Economic Trends", "summary": "RBI Deputy Governor Poonam Gupta stated the central bank is increasingly using satellite imagery, digital payments, and news reports to identify emerging economic trends. This supplements conventional indicators for more responsive monetary policy assessments.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "c3bb7c33"}, {"headline": "SBI, HDFC Bank, ICICI Remain Systemically Important, Too Big to Fail", "summary": "RBI reclassified SBI, HDFC Bank, and ICICI Bank as Systemically Important Banks (D-SIBs), requiring them to maintain additional capital due to their size, complexity, and potential significant disruption to the banking system and overall economic activity if they fail.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "010d6013"}, {"headline": "AI Helps NBFCs Spot Defaults Early, Lower Credit Costs", "summary": "NBFCs like L&T Finance and Poonawalla Fincorp are deploying AI, predictive analytics, and real-time credit monitoring to tighten underwriting and spot potential defaults earlier. This has led to significant reductions in early delinquencies and credit costs.", "category": "Business", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "41b0411e"}, {"headline": "Tata Steel Sees Higher Profitability for Combined Tubes and Coated Business", "summary": "Tata Steel expects higher profitability for its combined downstream steel tubes, pipes, and color-coated business after the strategic transaction with APL Apollo. The move aims to create a large, profitable, and customer-focused powerhouse in the sector.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "1ce2f1b3"}, {"headline": "CrowdStrike-Zscaler Combined Entity to Have Over $10 Billion Annual Revenue", "summary": "The combined CrowdStrike and Zscaler entity is expected to start with over $10 billion in annual recurring revenue, with Zscaler contributing $3.9 billion. Jay Chaudhry will continue to lead Zscaler’s business and join CrowdStrike’s board after the acquisition.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "1ab49038"}, {"headline": "Dubai Realty Shift Driven by Construction and Timeline Risks", "summary": "Dubai's property market shift towards ready-to-move-in transactions is attributed to construction delays, rising input costs, and timeline risks. Investors, who drive over 70% of off-plan sales, are more cautious and prioritize established locations and credible developers.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "8feb8671"}, {"headline": "PSU Banks Seek Credit Limit Reassessment Amid Business Size Expansion", "summary": "Public sector banks (PSBs) seek reassessment of credit sanction limits, which are currently `800 crore for large banks. This is needed to reflect their significantly expanded balance sheets, which grew 15.5% to `301.6 lakh crore, and to enhance operational flexibility.", "category": "Economy", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "b8e335ca"}, {"headline": "New Zealand vs India First Test Ends in a Draw", "summary": "The first Test between New Zealand and India at Basin Reserve ended in a draw, with Shubman Gill attributing the outcome to a flat pitch and soft ball. India needs five wins from six remaining Tests to reach the World Test Championship final.", "category": "Sports", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "4fa22115"}, {"headline": "Enzo Maresca Calls Man City Struggles \"Normal\" After Guardiola's Exit", "summary": "Manchester City manager Enzo Maresca said the club's recent downturn in results, failing to win any of its last four league games, was \"normal\" and to be expected in the club's \"reset\" following Pep Guardiola's departure.", "category": "Sports", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "52b61b3e"}, {"headline": "Bentley Seeks Easier Tariff Terms for Luxury EV Imports from UK", "summary": "Bentley Motors requested India to reconsider tariff treatment for electric vehicles imported from the UK under the India-UK FTA. It argues limited luxury EV volumes pose no threat to domestic manufacturers, and EVs are currently excluded from tariff concessions for five years.", "category": "Business", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "5631b492"}, {"headline": "Government Plans Consultation Paper on Engagement with AI", "summary": "The Ministry of Electronics and Information Technology (MeitY) is preparing a consultation paper to frame terms of engagement with AI. The paper will focus on safety, humanity, skilling, inclusivity, and risk mitigation, reflecting interministerial talks on AI regulations.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "b3adedbf"}, {"headline": "French Insurer AXA Leases 258,000 Sq Ft Office Space in Bengaluru", "summary": "French multinational insurer AXA has leased over 258,000 sq ft of office space in Bengaluru through a long-term agreement of over 10 years, with a total rental commitment of `334 crore. The transaction adds to Bengaluru's growing office space commitments.", "category": "Business", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "a54336d0"}, {"headline": "India's Auto Retail Sales Up 2.2% in Festive Season, EVs Surge 53%", "summary": "India's automobile retail sales rose 2.2% during the 42-day festive season to over 5.52 million units, breaking a previous record. Electric vehicle retails surged 53% to cross the 500,000-unit mark, driven by GST cuts and demand for cleaner mobility.", "category": "Economy", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "4b8fc6c1"}, {"headline": "SanRaj Group Plans `2,000 Crore Investment for Hospitality Portfolio Expansion", "summary": "SanRaj Group plans to invest `2,000 crore to expand its hospitality portfolio to more than 2,000 rooms across India and overseas within one to two years. The diversified group recently acquired Zuri Whitefield in Bengaluru as its eighth operating property.", "category": "Business", "page": 14, "importance": 5, "telegram_url": "https://t.me/c/1877410077/144564", "sources": [{"newspaper": "Economic Times", "pdf_filename": "ET Bangalore 24-11-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/144564"}], "article_id": "bf1b13ae"}, {"headline": "PM lays foundation for 1st AIIMS in North East", "summary": "Prime Minister Narendra Modi laid the foundation stone for the first All India Institute of Medical Sciences (AIIMS) in the Northeast at Guwahati, Assam. The project aims to bolster healthcare infrastructure in the region and provide advanced medical facilities to its residents.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/144525", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144525"}], "article_id": "8407b1bd"}, {"headline": "India's GST collection crosses Rs 2 lakh crore for first time", "summary": "India's Goods and Services Tax (GST) revenue surpassed Rs 2 lakh crore in April 2024, marking a record high. This signifies robust economic activity and improved compliance within the indirect tax system, reflecting a positive trend in national revenue generation.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/144525", "sources": [{"newspaper": "Indian Express", "pdf_filename": "IE Delhi 24-11-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/144525"}],
