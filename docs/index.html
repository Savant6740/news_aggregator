<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

const DIGEST = {"date": "28 August 2026", "articles": [{"headline": "GST cut on mobiles likely as L&T back to asset ownership", "summary": "The GST Council may consider lowering the GST rate on mobile phones to boost slowing handset demand and support India's electronics manufacturing ambitions. Separately, L&T is shifting its strategy to own assets in new-age industries like data centers and green hydrogen.", "category": "Business", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "6785b773"}, {"headline": "Sugar prices surge, is ethanol diversion the sole reason?", "summary": "Retail sugar prices have jumped 41% year-on-year due to falling production and diversion to ethanol. Sugar output declined in recent years due to crop diseases and adverse weather. Over-estimation of production and stock limits are also factors.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "42298052"}, {"headline": "Indians' infrastructure priorities tilt towards essential services", "summary": "A survey shows Indians prioritize water supply, solar energy, local roads, and EV charging infrastructure. Cycle routes, housing supply, and airports rank lower in priority compared to global preferences.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "2d4c36dd"}, {"headline": "UPI completes a decade as India's digital payments backbone", "summary": "Unified Payments Interface ( elegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "cbe294ae"}, {"headline": "India retains top spot in Emerging Markets Tracker", "summary": "India leads Mint's Emerging Markets Tracker with a score of 77.3, ahead of Vietnam and Malaysia. GDP growth remained strong, but manufacturing PMI eased and inflation rose.", "category": "Economy", "page": 4, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "760b8b52"}, {"headline": "H-1B visa shock to hit Indian IT firms", "summary": "US H-1B surcharges, scrutiny, and visa pauses could increase costs for Indian IT firms and curb talent mobility, potentially leading to prioritization of senior talent and expansion of offshore centers.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "f27161a9"}, {"headline": "GST Council focuses on mobile tax cuts, FMCG margins", "summary": "The GST Council may consider a GST rate cut on mobile phones to revive demand. It will also examine if GST reforms' benefits were passed to consumers, as FMCG margins hit a four-year low due to sugar price spikes.", "category": "Business", "page": 5, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "2ca37c7c"}, {"headline": "NHB classifies Star Housing Finance account as fraud", "summary": "The National Housing Bank has classified Star Housing Finance's refinance account as 'fraud' after audits flagged phantom loan accounts and fund diversion. The company acknowledged ar stores, reducing the count to four from over 20, as the format failed to generate sufficient sales and profitability.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "19e1ac6a"}, {"headline": "Alphabet shares slide on AI competition and leadership concerns", "summary": "Alphabet shares have fallen 15% from their peak due to concerns about losing its edge in AI, leadership changes, and heavy spending on infrastructure. It faces increased competition from rivals.", "category": "Business", "page": 11, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "9460638d"}, {"headline": "Nepal flash flood turns valleys into debris fields", "summary": "A catastrophic flash flood in Nepal, triggered by an ice and rock collapse, has killed 359 people, with over 1,000 missing. Rescuers are searching for survivors amid widespread devastation.", "category": "World", "page": 11, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "ef1ea8f4"}, {"headline": "288 Indians remain missing after Nepal flash floods", "summary": "The Indian government confirmed 288 Indians are missing following the Nepal flash floods, including those working on hydropower projects and tourist groups. India is providing assistance.", "category": "World", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "cf113b05"}, {"headline": "Hormuz crude oil flows rising as Gulf giants ramp up", "summary": "Crude oil shipments through the Strait of Hormuz are increasing as Gulf producers boost exports. Despite risks, higher earnings for tankers incentivize navigation, keeping global prices in check.", "category": "Economy", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "4a2bc31d"}, {"headline": "Meta's new safety measures for teens on apps", "summary": "Meta is introducing daily time limits, nighttime off-limits, and reduced functionality during school hours for teens on Instagram and Facebook. It also calls for competitors to adopt similar measures.", "category": "Technology", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "92c65955"}, {"headline": "Why Indian factories need a makeover to compete globally", "summary": "Indian factories excel at assembly but need to automate and manufacture more components to truly 'Make in India'. Government incentives like PLI are pushing for higher localization and digitization.", "category": "Business", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "ba5db6d0"}, {"headline": "RBI wants banks, NBFCs to use common loan-pricing rules", "summary": "RBI proposed common rules for loan pricing by banks and NBFCs to increase transparency and comparability. Spreads would be standardized, with non-credit-risk components fixed for three years.", "category": "Economy", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "babb910f"}, {"headline": "NRI marriages: One estate, multiple inheritance laws", "summary": "NRIs with assets in India and foreign spouses face complex inheritance laws, with movable assets governed by domicile and immovable by situs. A will is crucial for simplifying distribution.", "category": "Law", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "2e1b1afc"}, {"headline": "Indian universities must become the student's sandbox", "summary": "Universities need to foster self-discovery and experimentation, moving beyond job guarantees. The NEP 2020's blueprint for cross-disciplinary learning and agility is crucial for students in the AI era.", "category": "Education", "page": 15, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "30173f75"}, {"headline": "The five anti-canons of taxation for India", "summary": "India's tax policy should prioritize economic impact over revenue maximization, avoid retrospective amendments, and not be cadre-driven. It must serve the economy, not the state's convenience.", "category": "Law", "page": 15, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "5f6d7f74"}, {"headline": "Age of Gated Recessions: Time to resist runaway inequality", "summary": "The US and India face 'gated recessions' where aggregate indicators mask hardship for many. AI's impact on jobs and growing inequality necessitate policies like higher taxes on the ultra-rich.", "category": "Economy", "page": 16, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "8a85ba77"}, {"headline": "AI chatbots for teens: No relief for parents", "summary": "Concerns over AI's impact on teens' critical thinking and social development are high. Safety features in teen-focused AI chatbots may not fully address risks, emphasizing the need for limited access.", "category": "Technology", "page": 16, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "b96aeeb1"}, {"headline": "Uncorking Georgia’s ancient wine region", "summary": "Georgia's Kakheti region boasts an 8,000-year-old wine culture, using traditional qvevri vessels. Wine is considered sacred, integral to feasts and the country's identity.", "category": "Culture", "page": 17, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "112f83c5"}, {"headline": "Celebrating art and Krishna's 50th anniversary", "summary": "Delhi hosts a dance-drama tracing Krishna's journey, marking its 50th anniversary. Other events include music performances and art exhibitions.", "category": "Culture", "page": 17, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "bfb1ac6a"}, {"headline": "Where to eat in the world's most populous city", "summary": "Jakarta is highlighted as an emerging culinary destination, with Kaum, Pagi Sore, Sate Khas, and August restaurant recommended for their diverse Indonesian flavours and dining experiences.", "category": "Culture", "page": 17, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135402", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_28-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/135402"}], "article_id": "78aa7d1d"}, {"headline": "BRICS Summit may push for cross-border payment systems", "summary": "India is advocating for mechanisms to facilitate cross-border payments between BRICS members using national currencies and digital assets. The initiative aims to reduce transaction costs and boost trade and investment. Discussions on interlinking fast payment systems are expected during an upcoming September meeting of BRICS Finance Ministers and Central Bank Governors in New Delhi.", "category": "Economy", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "c7ab1785"}, {"headline": "ChatGPT Ads set to rewrite India's digital advertising rules", "summary": "OpenAI is launching ChatGPT Ads in India to reshape the digital advertising landscape through contextual targeting. The rollout will initially target logged-in adult users on Free and Plus plans. The company plans to compete by offering ads that align with conversational intent rather than traditional keyword-based search, while maintaining user data privacy standards.", "category": "Technology", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "deadde10"}, {"headline": "46 thermal power plants face coal shortage as demand rises", "summary": "More than 63 GW of India's coal-fired capacity is facing critically low fuel stocks, with 46 plants having less than five days of supply. The shortage is attributed to high power demand through August and monsoon rains disrupting mining and transport in Odisha, Jharkhand, and Chhattisgarh. Daily coal consumption reached a record 3.12 million tonnes in July.", "category": "Infrastructure", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "9ec44ee3"}, {"headline": "Tight liquidity and FEMA rules lift ECBs to $6.08 billion", "summary": "India's external commercial borrowings (ECBs) surged to $6.08 billion in June 2026, driven by tight domestic liquidity and revised FEMA rules. PSUs contributed significantly to this rise, with borrowings more than doubling from the previous year. Most companies sought funds for working capital, sub-lending, and general corporate purposes as domestic interest rates remained high.", "category": "Economy", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "d445a286"}, {"headline": "OMCs deliberating on logistics for supplying E10 fuel: BPCL", "summary": "Oil marketing companies are discussing the logistics of providing 10% ethanol-blended petrol (E10) parallel to existing E20 supplies. BPCL Chairman Sanjay Khanna noted that while E20 is the target, E10 may be required for older vehicle fleets. The industry is assessing the costs and infrastructure needed to maintain two distinct fuel grades at retail outlets.", "category": "Environment", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "cda797ab"}, {"headline": "Maharashtra leads India in vehicle sales for Q1 FY27", "summary": "Maharashtra emerged as the top state for both passenger and commercial vehicle sales in the quarter ended June 2026. Data from SIAM shows the state sold over 1.47 lakh passenger vehicles and 36,433 commercial vehicles. Uttar Pradesh led in two-wheeler and three-wheeler sales, while overall industry trends showed significant growth in the Western and Northern regions.", "category": "Business", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "c499b56e"}, {"headline": "Yamaha Motor India may expand manufacturing capacity by 2028", "summary": "Yamaha Motor India is exploring the addition of a new manufacturing unit within the next two to three years as its current facilities approach full capacity of 1.5 million units. The company has invested ₹3,800 crore in India over the last decade and is now focusing on the 200cc sports bike segment and electric vehicle development to drive future growth.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "16bf3cd7"}, {"headline": "Telcos need periodic tariff revisions to survive, says Birla", "summary": "Kumar Mangalam Birla, Chairman of Aditya Birla Group, emphasized that the Indian telecom sector needs regular tariff hikes to ensure long-term sustainability. He noted that Indian ARPU remains among the lowest globally, hindering the industry's ability to invest in network expansion and 5G technology. The sector requires a healthy ecosystem to maintain a three-player market.", "category": "Business", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "1d198025"}, {"headline": "Acer India expands into consumer electronics and AI PCs", "summary": "Acer India is diversifying its portfolio beyond laptops into consumer electronics, including smart TVs, washing machines, and premium luggage. The company is focusing on AI-enabled PCs to drive growth in the enterprise and consumer segments. Acer aims to achieve $1 billion in annual revenue as it transitions into a lifestyle brand while maintaining its core PC market share.", "category": "Technology", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "3a9f19ba"}, {"headline": "Tata Motors rebrands passenger electric vehicle business as Tata.ev", "summary": "Tata Motors has unveiled 'Tata.ev' as its new brand identity for the passenger electric vehicle segment. The rebranding aims to create a unified ecosystem for EVs, including products, charging infrastructure, and digital solutions. The company has crossed seven million vehicle sales on Indian roads and plans to reach 17-18% market share in the EV segment by the end of the year.", "category": "Business", "page": 2, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "9f5b819a"}, {"headline": "Summit diplomacy signals steady reset in India-China relations", "summary": "Prime Minister Narendra Modi is expected to hold bilateral meetings with President Xi Jinping and President Vladimir Putin at upcoming summits in Bishkek and New Delhi. Diplomatic engagement is intensifying as both nations look to resolve border patrolling issues along the LAC. The meetings signal a potential stabilization of ties through high-level dialogue and strategic resets.", "category": "Politics", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "45d0ec46"}, {"headline": "Manufacturing firms report 21.3% operating profit growth in Q1", "summary": "According to RBI data from 3,247 listed non-government firms, manufacturing companies saw operating profit growth rise to 21.3% y-o-y in the first quarter. This improvement came despite higher input costs, supported by strong sales growth in petroleum, iron, and steel sectors. Conversely, IT services firms saw a slight moderation in profit margins during the same period.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "66f2355e"}, {"headline": "FM Sitharaman invites Canadian pension funds to invest in India", "summary": "Finance Minister Nirmala Sitharaman met with leaders of major Canadian pension funds and insurers in Toronto to pitch India's infrastructure and insurance sectors. She highlighted recent liberalizations in FDI limits and the 'Insurance for All by 2047' vision. Sitharaman encouraged funds like CPP Investments and OTPP to explore green energy and digital infrastructure projects.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "875f489b"}, {"headline": "RBI provides flexibility in swapping overseas dollar deposits", "summary": "The Reserve Bank of India has allowed banks more flexibility to swap dollar deposits from non-resident Indians under the FCNR (B) scheme. Banks can now access the dollar-rupee swap facility outside the designated weekly window for transactions exceeding $100 million. The move aims to help lenders manage sudden surges in dollar inflows and stabilize domestic liquidity.", "category": "Economy", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "1b9a53c5"}, {"headline": "New Zealand FTA offers scope for deeper trade ties", "summary": "Industry leaders at an India-New Zealand trade session emphasized the need to leverage the recently signed Free Trade Agreement (FTA) to boost bilateral trade. Key focus areas include infrastructure, smart cities, and agriculture. The agreement is expected to provide duty-free access for various manufacturing sectors and facilitate technical cooperation in renewable energy.", "category": "Economy", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "492d8561"}, {"headline": "India and Chile to conclude trade pact review this year", "summary": "The Indian Ministry of Commerce is working to finalize a review of the preferential trade agreement with Chile by the end of 2026. The expansion of the pact is expected to include more product lines and simplify customs procedures. Bilateral trade between the two nations is primarily driven by minerals, chemicals, and agricultural products.", "category": "Economy", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "607395eb"}, {"headline": "Speculation and hoarding drive retail sugar price spike", "summary": "Retail sugar prices in India have climbed to ₹45-48 per kg ahead of the festive season. While El Niño affected production, experts point to speculative hoarding by market intermediaries and the diversion of sugarcane for ethanol as primary causes. The government has responded by releasing buffer stocks and restricting ethanol production from sugarcane juice to stabilize costs.", "category": "Economy", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "45cde85f"}, {"headline": "Apple Pay entry may disrupt India's premium card market", "summary": "Apple Pay is reportedly preparing for a 2026 entry into the Indian market, targeting the premium credit card segment. The service will utilize Apple's existing NFC technology but will face challenges in India's UPI-dominated landscape. Analysts suggest Apple's focus will be on ecosystem loyalty and high-value transactions rather than mass-market volume currently held by PhonePe.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "14606daf"}, {"headline": "Chennai second airport project hits delay over land issues", "summary": "The proposed second airport for Chennai at Parandur faces significant delays due to local displacement and environmental concerns. The project, intended to handle overflow from the existing Meenambakkam airport, is critical for the region's industrial growth. The Tamil Nadu government is currently reviewing site plans and rehabilitation packages for affected residents.", "category": "Infrastructure", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "6cdeb697"}, {"headline": "Meta's new teen safety features apply only to US users", "summary": "Meta Platforms has introduced new safeguards to protect teenagers on Instagram and Facebook, but the measures are currently limited to US users. Global regulators have criticized the selective rollout, demanding similar protections worldwide. The features include restricted access to sensitive content and limits on nighttime usage, costing the company an estimated $18 billion to implement.", "category": "World", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "565569cf"}, {"headline": "Generative AI tools spark debate over academic and creative ethics", "summary": "The rise of GenAI tools like ChatGPT has triggered a debate on intellect and authenticity. Experts warn against 'shaming' individuals for using AI, comparing it to the use of calculators in math. However, concerns persist regarding the spread of misinformation and the lack of accountability for AI-generated content that draws from public data without permission.", "category": "Technology", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "b579bf94"}, {"headline": "Sensex falls 2,500 points during call auction session window", "summary": "Indian equity markets witnessed extreme volatility as the Sensex dropped 2,500 points from its daily high during the new Call Auction Session (CAS) window. Selling pressure in PSU banks and metals erased early gains. Market experts highlighted that the gap between buyers and sellers widened significantly, leading to sharp price swings and heavy losses for retail traders.", "category": "Business", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "88aefb62"}, {"headline": "SEBI close to approving NSE's long-awaited IPO", "summary": "SEBI Chairman Tuhin Kanta Pandey announced that the regulator is in the final stages of reviewing the National Stock Exchange's (NSE) draft papers for its initial public offering. The approval follows the resolution of the co-location case and recent settlements. The NSE IPO is expected to be one of the largest in Indian market history, aiming for a valuation of over ₹30,000 crore.", "category": "Business", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "a6474745"}, {"headline": "Zerodha reports FY26 profit of ₹4,283 crore", "summary": "Discount brokerage Zerodha recorded a net profit of ₹4,283 crore for the financial year ending March 2026, despite flat revenue of ₹8,847 crore. The profit was primarily sustained by interest income on the broker's cash book, which offset a slowdown in market trading activity. The company remains cautious about future growth due to evolving regulatory norms on referral commissions.", "category": "Business", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "c0da631b"}, {"headline": "Sembcorp Green Infra files for ₹3,750-crore IPO", "summary": "Temasek-backed Sembcorp Green Infra has filed draft papers with SEBI for a ₹3,750-crore initial public offering. the proceeds will be used to fund the company's renewable energy projects and repay existing debt. The firm currently manages a portfolio of 7.64 GW, including wind and solar projects, and plans to expand its battery energy storage systems.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "fa0e4ac5"}, {"headline": "Recent IPOs see massive oversubscription from institutional investors", "summary": "The IPOs of Hy-Tech Engineers, Skyways Air Services, and Symbiotec Pharmalab received overwhelming responses, with oversubscription rates ranging from 71x to 244x. Hy-Tech Engineers led the pack with institutional investors driving the demand. The trend indicates strong appetite for mid-sized manufacturing and service firms in the current market environment.", "category": "Business", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "39ddfe24"}, {"headline": "RBI proposal to curb credit facilities may hurt MSMEs", "summary": "An RBI proposal to restrict revolving credit facilities for non-banking financial companies (NBFCs) has raised concerns among MSMEs. Industry bodies warn that curbing working-capital loans could significantly increase borrowing costs for small businesses. MSMEs rely heavily on these flexible credit lines for day-to-day operations and seasonal liquidity requirements.", "category": "Economy", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "4ec7badd"}, {"headline": "Home Ministry clearance mandatory for directors from bordering countries", "summary": "The Ministry of Corporate Affairs (MCA) has clarified that companies appointing directors from China or other countries sharing land borders with India must obtain security clearance from the Home Ministry. The rule applies to both Indian companies and Indian subsidiaries of foreign firms. The measure is part of continued efforts to oversee foreign influence in critical business sectors.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "dbd41427"}, {"headline": "LTM commissions global AI and technology centre in Kolkata", "summary": "Larsen & Toubro Mindtree (LTM) has inaugurated a new global delivery and AI competency centre in Kolkata. The facility will house nearly 5,800 engineers and focus on high-value technologies, including generative AI and digital transformation projects. The move is expected to boost West Bengal's status as a growing technology hub for international clients.", "category": "Technology", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "9825cffe"}, {"headline": "Cult.fit waits for optimal market conditions for IPO", "summary": "Fitness platform Cult.fit is delaying its initial public offering, stating it is waiting for improved investor sentiment rather than trying to time the market. CEO Naresh Krishnaswamy said the company is focused on achieving profitability and expanding its gym network to 100 cities. The firm has seen a recovery in its business model following post-pandemic challenges.", "category": "Business", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "ad08135c"}, {"headline": "Global palm oil prices projected to rise through 2027", "summary": "Global palm oil prices are expected to remain firm, driven by a tightening supply-demand balance and Indonesia's B50 biodiesel mandate. Research indicates a production surplus decline in the 2026-27 season, potentially pushing prices above $1,000 per tonne. Increased demand for food and fuel in India and China is also contributing to the upward price pressure.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "ac8aa84f"}, {"headline": "New low-pressure area over Bay of Bengal to bring rain", "summary": "A new weather system is forming over the Bay of Bengal, promising to revive monsoon activity across Central India. The system is expected to provide much-needed rainfall to drought-stressed regions in Maharashtra and Madhya Pradesh. However, heavy rains in Himalayan foothills continue to pose risks of flash floods and landslides in northern states.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "61cb1908"}, {"headline": "Andhra Pradesh registers 51% rainfall deficit due to El Nino", "summary": "Andhra Pradesh is facing a severe 51% rainfall deficit for the current monsoon season, with 28 districts reporting significant shortages. The drought-like conditions have delayed kharif sowing for paddy and groundnut crops. The state government has announced mitigation plans, including the promotion of drought-resistant seeds and localized water management strategies.", "category": "Environment", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "50089cba"}, {"headline": "MNRE orders wind turbine makers to report on cybersecurity", "summary": "The Ministry of New and Renewable Energy has directed wind turbine manufacturers to submit detailed cybersecurity compliance reports. The order concerns the security of data centers and R&D facilities to prevent cyberattacks on the national power grid. Companies must ensure all software and hardware components meet strict security standards specified by the ministry.", "category": "Infrastructure", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "219f988f"}, {"headline": "Nhava Sheva Port records 14% growth in container traffic", "summary": "Jawaharlal Nehru Port (Nhava Sheva) has climbed to the 21st position among the world's top 30 container ports. The port recorded a 14% year-on-year growth in traffic during the first half of 2026, driven by increased transshipment volumes and a diversion of trade from West Asian routes. The port authority plans to further expand capacity to break into the global top 15.", "category": "Infrastructure", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "a6245732"}, {"headline": "India extends deadline for AMCA project fighter jet RFP", "summary": "The Defence Research and Development Organisation (DRDO) has extended the deadline for the Advanced Medium Combat Aircraft (AMCA) project RFP to October 30. The extension aims to allow more private sector players to participate in the development of India's fifth-generation fighter jet. The project is seen as a cornerstone of India's 'Atmanirbhar Bharat' initiative in defense.", "category": "Technology", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "43139bbf"}, {"headline": "Centre begins subsidized onion sales at ₹35 per kg", "summary": "The Union government has started selling onions from its buffer stock at a subsidized rate of ₹35 per kg in major cities like Delhi and Mumbai. The intervention aims to cool retail prices, which had spiked to over ₹60 per kg in some regions. Cooperatives like NCCF and NAFED are coordinating the distribution through mobile vans and retail outlets.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "dc3083aa"}, {"headline": "Karnataka declares 101 taluks drought-hit following rain deficit", "summary": "The Karnataka government has officially declared 101 taluks as drought-hit after the state recorded a 46% rainfall deficit during the June-August period. The shortage has severely impacted kharif sowing, particularly in the northern and interior regions. The state is seeking central assistance and implementing water conservation measures to support affected farmers.", "category": "Environment", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "6509587e"}, {"headline": "Singapore Airlines to review Air India capital funding requests", "summary": "Singapore Airlines (SIA) stated it will carefully evaluate any requests for additional capital from Air India, where it holds a 25.1% stake. The decision will be based on Air India's business requirements and SIA's broader investment strategy. Air India is currently undergoing a massive fleet expansion and restructuring under the Tata Group's leadership.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "1eaa8ded"}, {"headline": "Nepal flash floods leave 1,400 missing including foreigners", "summary": "Devastating flash floods and landslides in Nepal and neighboring Tibet have left at least 359 dead and 1,400 people missing. Among the missing are 517 foreign nationals, including tourists from India and Europe. The disaster has destroyed critical infrastructure, including hydro power plants and bridges, disrupting rescue efforts across the difficult Himalayan terrain.", "category": "World", "page": 10, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "55792a3c"}, {"headline": "D2C funding in India shifts toward early-stage startups", "summary": "Investment in India's direct-to-consumer (D2C) sector is shifting toward early-stage funding as exits for established brands become more frequent. Data shows that while overall funding reached $6 billion between 2021-2026, 70% of total value in 2025 went to seed and early-stage rounds. Major players like Lenskart and Licious continue to dominate the sector's total capital raised.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135409", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore BL_28-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/135409"}], "article_id": "b92168b3"}, {"headline": "PM heads to Uzbekistan, SCO summit; key bilaterals likely", "summary": "Prime Minister Narendra Modi begins a four-day visit to Uzbekistan and Kyrgyzstan to attend the SCO Summit. He is expected to hold bilateral meetings with leaders including Russian President Vladimir Putin to review ties and regional security. Earlier, External Affairs Minister S. Jaishankar visited Moscow to prepare for the summit which marks 25 years of the grouping.", "category": "Politics", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "10616ef0"}, {"headline": "India in ‘frank’ talks with Brics states over meeting declaration", "summary": "India is engaged in discussions with Brics nations to finalize a consensus declaration amid differences between Iran and the UAE over the West Asia conflict. Meetings in New Delhi focus on resolving the crisis through dialogue and diplomacy while ensuring the unimpeded flow of maritime commerce. The discussions follow a foreign ministers' meeting that concluded without a joint statement.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "64c6f075"}, {"headline": "2 killed in training plane crash in UP", "summary": "A four-seater Tecnam P2006T twin-engine training aircraft crashed in Kanpur, Uttar Pradesh, killing a flight instructor and a trainee pilot. The aircraft, operated by Garg Aviation Ltd., crashed shortly after takeoff. An investigation by the Aircraft Accident Investigation Bureau is underway to determine the cause of the incident, which occurred 20 minutes after takeoff.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "6cd349e3"}, {"headline": "Maha govt gives auto-rickshaw, taxi drivers 1 yr to learn Marathi", "summary": "Maharashtra Deputy CM Devendra Fadnavis announced a one-year extension for auto and taxi drivers to learn functional Marathi. No action will be taken during this period, but licenses may be suspended later if drivers fail to comply. The decision follows a transport department rule requiring drivers to have working knowledge of the language, which had faced opposition from some unions.", "category": "Politics", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "02b9e82a"}, {"headline": "Jharkhand to move SC against mines act amendment", "summary": "The Jharkhand government is set to move the Supreme Court to challenge the Mines and Minerals (Development and Regulation) Amendment Act. The state argues the law unconstitutionally bars it from levying taxes or cess on minerals mined within its borders. This follows a recent SC judgment affirming states' rights over mineral wealth, which the new central legislation seeks to override.", "category": "Law", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "dc6821e5"}, {"headline": "S Delhi hit by traffic gridlock as multiple projects clog roads", "summary": "A series of infrastructure and repair projects across South Delhi have caused severe traffic jams on key routes including the Ring Road and Outer Ring Road. Commuters faced long delays as work on flyovers and road expansions restricted space. Traffic police have issued advisories and suggested diversions, but congestion is expected to worsen as projects move into critical phases.", "category": "Infrastructure", "page": 1, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "7572ba6a"}, {"headline": "Andhra: 7 die as bus rams into auto rickshaw", "summary": "Seven people, including four children, were killed when a private bus collided with an auto-rickshaw in Andhra Pradesh’s Palnadu district. Several others were injured and are receiving treatment. The accident occurred on a highway when the bus reportedly hit the smaller vehicle while attempting to overtake. Local authorities have ordered an inquiry into the cause of the fatal crash.", "category": "India", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "54a71b9c"}, {"headline": "Cops probe ‘toxic relationship’ angle in Tilak Nagar murder", "summary": "Delhi police are investigating a 'toxic relationship' and harassment angle in the murder of a 21-year-old woman in Tilak Nagar. The victim was allegedly stabbed by her boyfriend following frequent arguments and accusations of cheating. The suspect, who was on the run, has been apprehended. Police said the motive appeared to be related to the suspect's possessiveness and anger.", "category": "India", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "b8959366"}, {"headline": "Rescuers scour Nepal as toll, missing count surge", "summary": "Rescuers in Nepal are searching through mud and debris after catastrophic flash floods. The death toll has reached 392, with over 1,500 people missing, including several Indian pilgrims and tourists. The wave of devastation followed a glacial collapse near the China border. The MEA confirmed that at least 290 Indians remain unreachable in flood-hit areas, including workers and pilgrims.", "category": "World", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "09376c48"}, {"headline": "4 Nagas killed, 1 hurt in latest Manipur ambush", "summary": "Armed militants ambushed a vehicle in Manipur's Kangpokpi district, killing four Naga people and injuring one. The attack occurred near Thabamba Naga village, triggering intense firing and fresh tension in the conflict-torn state. The victims were traveling in a private vehicle when they were targeted. Security forces have launched a search operation to nab the perpetrators.", "category": "India", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "b3095621"}, {"headline": "Kharge seeks all-party meet on delimitation in letter to PM", "summary": "Congress president Mallikarjun Kharge wrote to PM Modi seeking an all-party meeting on delimitation. He questioned the delay in conducting the Census and the continued extension of the delimitation freeze. Kharge argued that transparency is needed regarding the government's plans for the future redrawing of constituency boundaries to ensure fair representation for all states.", "category": "Politics", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "8607b173"}, {"headline": "NLSIU cancels convocation citing ‘unavoidable circumstances’", "summary": "The National Law School of India University (NLSIU) canceled its 34th annual convocation citing unavoidable circumstances. The decision follows protests from students over invitations to the CJI and BCI chairman amid a dispute regarding institutional autonomy. Degrees will now be conferred in absentia. The university has not specified the exact nature of the 'unavoidable circumstances'.", "category": "Education", "page": 1, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "ce17dda1"}, {"headline": "Nadda holds talks with group opposing caste reservations", "summary": "Union Minister J.P. Nadda met with a group demanding that caste-based reservations in education and government jobs be replaced by income-based quotas. The group, representing various communities, presented their demands for a more equitable system. Nadda reportedly assured them that the government is open to dialogue on the issue, though no official policy change has been announced.", "category": "Politics", "page": 1, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "24fbb7ca"}, {"headline": "Sensex plunges 2.9% in ‘flash crash’ during closing auction", "summary": "The BSE Sensex plunged nearly 3% during the closing auction window due to low liquidity and possible manipulation. The index slid over 2,200 points before a partial recovery. Analysts suggest the sharp drop was triggered by a large sell order in a single heavyweight stock. SEBI and exchange authorities are investigating the incident for potential market irregularities.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "374575b9"}, {"headline": "UP: Singer posted song on murder before his killing", "summary": "Haryanvi singer and YouTuber Ankit Baliyan was shot dead in UP's Shamli district. Hours before his death, he had posted a video featuring a song with lyrics about murder. Police suspect the killing may be related to an ongoing feud or personal enmity. Several suspects have been identified, and a special task force is conducting raids to make arrests.", "category": "India", "page": 1, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "aad15448"}, {"headline": "Yamuna yet to hit warning level in Delhi this season", "summary": "Despite regular monsoon rains, the Yamuna river in Delhi has not yet reached its warning level of 204.5 meters this season. Experts say this is unusual for late August and could impact groundwater replenishment in the floodplains. Authorities are monitoring water levels at the Hathnikund Barrage, but current flow remains within safe limits for the national capital.", "category": "Environment", "page": 1, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "afc2e4ad"}, {"headline": "Formation of 2 new lakes raise concerns in Himalayas", "summary": "Satellite imagery has revealed the formation of two new lakes in the Himalayas following recent floods and landslides. Experts warn these lakes pose a risk of Glacial Lake Outburst Floods (GLOFs), which could devastate downstream areas in India and Nepal. Monitoring agencies are tracking the water levels and stability of the natural dams formed by debris in the Lhende Khola river basin.", "category": "Environment", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "26c67b78"}, {"headline": "Global warming worsens fury of falling glaciers, floods", "summary": "Scientists attribute recent catastrophic flash floods in Nepal to a rock and ice avalanche triggered by melting glaciers. Rising global temperatures are accelerating glacier mass loss and declining snow packs in the Himalayas. Data shows that the scale of such disasters is increasing, with higher risks for downstream populations in the Indo-Gangetic plains as the climate continues to warm.", "category": "Environment", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "926cd20b"}, {"headline": "‘Butcher of Bosnia’ Ratko Mladic dead", "summary": "Former Bosnian Serb military chief Ratko Mladic, convicted of war crimes and genocide, has died in The Hague at the age of 84. Mladic was serving a life sentence for his role in the 1995 Srebrenica massacre and the siege of Sarajevo. His death marks the end of a long legal process for one of the most notorious figures from the Balkan conflicts of the 1990s.", "category": "World", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "438fc575"}, {"headline": "9/11 mastermind to go on trial in June ‘28", "summary": "Khalid Sheikh Mohammed and four other 9/11 plotters will finally go on trial at the US naval base in Guantanamo Bay in June 2028. The trial date follows years of legal delays and debates over the use of evidence obtained through torture. The proceedings will be closely watched as the long-awaited quest for justice for the 2001 attacks continues.", "category": "Law", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "608ebc59"}, {"headline": "Central govt appoints two NTA directors, joint director", "summary": "The government has appointed two directors and a joint director to the National Testing Agency (NTA). This move is part of a structural overhaul following controversies over paper leaks and exam irregularities. The new officials are tasked with restoring the agency's credibility and ensuring the smooth conduct of future competitive examinations across the country.", "category": "Education", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "3c78bbb2"}, {"headline": "‘Polka dot queen’ Yayoi Kusama dies", "summary": "Celebrated Japanese artist Yayoi Kusama, famous for her vibrant polka dot paintings and immersive 'Infinity Mirror Rooms', has died in Tokyo at the age of 97. Kusama was one of the most influential contemporary artists, known for her unique style that merged pop art, minimalism, and surrealism. Her work has been exhibited in major museums and galleries worldwide.", "category": "Culture", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "a3927bd0"}, {"headline": "New drugs reshaping the cholesterol control battle", "summary": "New medical treatments, including PCSK9 inhibitors and innovative gene-editing techniques, are transforming how doctors manage high cholesterol. These advanced drugs offer more potent ways to lower LDL levels and reduce the risk of heart attacks compared to traditional statins. While current costs are high, clinical trials show promising results for long-term cardiovascular health.", "category": "Health", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "aa423206"}, {"headline": "China in emergency mode as Premier Li visits Tibet", "summary": "Chinese Premier Li Qiang visited flood-hit regions of Tibet to oversee emergency rescue and relief operations. Massive landslides and mudslides have caused significant damage to infrastructure and displaced thousands. Li emphasized the need for a swift response to locate missing persons and restore essential services in the remote mountainous areas affected by the disaster.", "category": "World", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "01090605"}, {"headline": "Rahul to attend gig workers’ meet in Bengaluru", "summary": "Congress leader Rahul Gandhi is scheduled to visit Bengaluru to interact with gig workers and discuss their challenges regarding job security and social benefits. The visit comes as the Karnataka government prepares a welfare bill for the sector. Gandhi is expected to hear concerns from delivery partners and cab drivers to help shape the party's national policy on the gig economy.", "category": "Politics", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "a34639c9"}, {"headline": "Clash erupts during Eid Milad procession in Bengaluru; 8 held", "summary": "Eight people were arrested in Bengaluru following a clash between two groups during an Eid Milad procession. The incident led to minor injuries and property damage before police intervened to restore order. Cases have been registered for rioting and obstruction of public roads. Security has been heightened in the affected area to prevent further communal tension.", "category": "India", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "728bbc1f"}, {"headline": "Pregnant B’luru cop attacked with iron rod at station", "summary": "A pregnant police constable in Bengaluru was allegedly attacked with an iron rod by a thief after she caught him stealing her mobile phone at a railway station. The constable sustained injuries but is reported to be out of danger. The accused has been apprehended and charged with attempted murder. Police have increased patrolling at major transit hubs following the incident.", "category": "India", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "9d0a40ec"}, {"headline": "K’taka explores pilot projects using voice AI", "summary": "The Karnataka government is exploring the use of voice-based AI to improve public service delivery and simplify access to welfare schemes. The pilot projects aim to help citizens, especially in rural areas, interact with government portals using local languages. The initiative is part of a broader digital transformation strategy to make administration more inclusive and efficient.", "category": "Technology", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "18c9151a"}, {"headline": "I am not aware of matter regarding Cabinet change: Kharge", "summary": "Congress president Mallikarjun Kharge stated he has no official information regarding a possible reshuffle of the Karnataka cabinet. His comments come amid intense speculation about changes in the ministry to balance regional and community representation. Kharge emphasized that any such decision would be taken after consultations between the state leadership and the high command.", "category": "Politics", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "546231fc"}, {"headline": "B’luru to witness 2,500-km road revamp worth ₹8,000 cr", "summary": "Karnataka Minister Krishna Byre Gowda announced a massive ₹8,000 crore project to revamp 2,500 km of roads in Bengaluru. The project focuses on improving road quality, drainage, and pedestrian facilities to ease traffic congestion. The initiative will be implemented in phases, with priority given to high-traffic corridors and areas prone to flooding during the monsoon.", "category": "Infrastructure", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "8a02bb5b"}, {"headline": "13 from K’taka stuck in Nepal, Tibet after floods", "summary": "At least 13 people from Karnataka are reported to be stranded in flood-hit regions of Nepal and Tibet. The state's Chief Minister's Office is coordinating with the MEA and local authorities to ensure their safety and arrange for their return. Families have been provided with helpline numbers, and efforts are underway to establish contact with those in areas with poor connectivity.", "category": "India", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "c673f21d"}, {"headline": "State launches GIS app to geo-tag rural water assets", "summary": "The Karnataka government has launched a GIS-based mobile application to geo-tag and monitor rural water supply assets. The tool aims to improve transparency, prevent fake billing, and ensure regular maintenance of water infrastructure. Local officials have been trained to use the app to update the status of borewells, tanks, and pipelines in real-time.", "category": "Technology", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "fdf71c5e"}, {"headline": "Clean your own vacant plots, min urges owners", "summary": "Karnataka Minister Krishna Byre Gowda has urged owners of vacant plots in Bengaluru to take responsibility for cleaning their properties. Accumulated waste and stagnant water on such plots pose health risks, including the spread of vector-borne diseases. The city corporation may impose fines on owners who fail to maintain their plots despite multiple notices.", "category": "India", "page": 3, "importance": 3, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "6d34d306"}, {"headline": "86 from TN, Puducherry still missing after Nepal floods", "summary": "Eighty-six pilgrims from Tamil Nadu and Puducherry remain missing after catastrophic floods in Nepal. Search and rescue teams are working in challenging terrain to locate the stranded individuals. The state government has set up a dedicated help desk to assist families and is in constant touch with the Indian embassy in Kathmandu to coordinate rescue efforts.", "category": "India", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "d47fee98"}, {"headline": "34 from Andhra located, 7 remain untraceable in Nepal", "summary": "Thirty-four pilgrims from Andhra Pradesh have been successfully located in flood-hit Nepal, but seven others remain untraceable. The state government is using satellite phones and local networks to reach those in remote areas. Special flights are being arranged to bring back the rescued pilgrims, while search operations continue for those still missing.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135428"}], "article_id": "07acd52a"}, {"headline": "Whereabouts of 22 from Telangana remain unknown", "summary": "The Telangana government is working to trace 22 pilgrims whose whereabouts remain unknown following the flash floods in Nepal. Helplines have received numerous calls from anxious families. State officials are coordinating with the MEA and NDRF to expedite search missions in the affected regions, although poor weather and damaged roads are hindering progress.", "category": "India", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/135428", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ²⁸⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/135428"}]
