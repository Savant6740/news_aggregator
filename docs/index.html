ary": "The Coal Ministry auctioned six coal blocks in the 15th round of commercial coal auctions, with a total peak rated capacity of 11.62 million tonnes per annum. The auctions are expected to generate annual revenue of ₹1,983 crore and attract capital investment of ₹1,743 crore. This move is part of India's strategy to enhance domestic coal production and achieve energy self-sufficiency.", "category": "Economy", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "9bd910ac"}, {"headline": "Jet Fuel Demand in July Slipped to Lowest in Two Years", "summary": "India's aviation turbine fuel (ATF) consumption fell 4% month-on-month in July to 699,000 tonnes, its lowest level since December 2023. The decline is attributed to monsoon-related moderation in air travel and reduced flight operations due to capacity constraints. Domestic airlines operated 82,437 flights in July, an 8.6% drop from June, reflecting seasonal trends in the aviation sector.", "category": "Economy", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "0b112ccb"}, {"headline": "Wind Power Tenders Surpass Solar for First Time in Q1", "summary": "Wind power tenders exceeded 9 GW in the April-June quarter, surpassing solar for the first time as the government focus shifts to round-the-clock renewable energy. Industry experts say this reflects an evolution in India's energy mix, with a growing emphasis on wind and hybrid-RTC projects. The move is expected to support a more resilient and reliable green power grid.", "category": "Infrastructure", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "9d6c8b3c"}, {"headline": "LPG Consumption Reaches Six-Month High in July 2026", "summary": "India's LPG consumption rose to a six-month high of 2.37 million tonnes in July, an 8% increase compared to the same month last year. The growth was supported by government schemes promoting clean cooking fuel and an increase in residential connections. Meanwhile, diesel and petrol consumption saw a slight decline in July due to monsoon-related moderation in transport activity.", "category": "Economy", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "06b9fea9"}, {"headline": "PM Surya Ghar Achieves 5 Million Residential Solar Installations Milestone", "summary": "The PM Surya Ghar: Muft Bijli Yojana has achieved 5 million residential rooftop solar installations within its first year. The Ministry of New and Renewable Energy stated that the scheme has seen rapid acceleration, with over 50 lakh households now benefiting from free electricity. The government has released over ₹28,024 crore in subsidies to support this initiative.", "category": "Environment", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "827b5fc9"}, {"headline": "Indian Rupee Remains Range-Bound as FPI Outflows Offset High Forex Reserves", "summary": "The Indian rupee remained range-bound between 95 and 96 per dollar as foreign portfolio investment (FPI) outflows and a strong US dollar offset the impact of high forex reserves. While the RBI's hawkish stance and high reserves provide support, global geopolitical uncertainties and dollar strength continue to exert pressure on the currency. Analysts expect the rupee to remain volatile.", "category": "Economy", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "1f83640b"}, {"headline": "ESAF Small Finance Bank Aims for ₹1 Lakh Crore Business by 2030", "summary": "ESAF Small Finance Bank (ESAF SFB) has set a target to reach ₹1 lakh crore in total business by 2030, supported by its planned transition to a universal bank. CEO K. Paul Thomas stated that the bank aims to achieve this through a focus on micro-loans and expanding its branch network across India. The bank reported ₹23,216 crore in gross advances as of June 2026.", "category": "Business", "page": 8, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "47916f06"}, {"headline": "Andhra Pradesh Charts Renewable Energy Course Focused on Infrastructure and Storage", "summary": "Andhra Pradesh aims to achieve 100 GW of renewable energy capacity by 2030, focusing on grid infrastructure, storage, and land availability. NREDCAP Vice Chairman Kamalakar Babu stated that the state is developing pumped hydro and green hydrogen projects to meet its targets. The government has already assigned 40,000 acres of land for various renewable energy initiatives.", "category": "Infrastructure", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "f124e6c6"}, {"headline": "Aditya Birla Health Insurance Targets Younger Consumers for Growth", "summary": "Aditya Birla Health Insurance reported a 29.38% growth in gross direct premium in the last financial year as it targets younger consumers through digital platforms. CEO Mayank Bathwal stated that the company is focusing on wellness and preventive health programs to attract this demographic. Currently, less than 15% of the company's policyholders are below the age of 35.", "category": "Business", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "a52b5a7d"}, {"headline": "Twenty-Five US States Sue Trump Administration Over Illegal Tariff Hike", "summary": "Twenty-five US states have filed a lawsuit against the Trump administration, alleging that the 10-25% global tariffs on imports are illegal. The states argue that the administration failed to follow proper procedures and that the tariffs are causing significant economic harm to businesses and consumers. This legal challenge follows a recent Supreme Court ruling on executive power.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "ba192f22"}, {"headline": "India Engaged with All Stakeholders on Chabahar Port Operations: MEA", "summary": "The Ministry of External Affairs (MEA) stated that India remains in contact with all stakeholders regarding the Chabahar Port project despite US sanctions warnings. India views the port as a critical gateway to Afghanistan and Central Asia. The MEA spokesperson emphasized that the project is strategically important for regional connectivity and India's long-term economic interests.", "category": "Politics", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "fd93c123"}, {"headline": "Global Crude Oil Prices Drop Below $80 on US-Iran Deal Hopes", "summary": "Global crude oil prices fell below $80 per barrel amid optimism that a deal between the US and Iran could be reached to de-escalate regional tensions. Progress in facilitate talks, reported by Qatar, has raised hopes for a diplomatic resolution and the potential return of Iranian oil to the global market. However, the situation remains fluid with ongoing conflict in the Red Sea.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "37be379b"}, {"headline": "Hatsun Agro Product Plans ₹1,000 Crore Capex to Enhance Production", "summary": "India's largest private sector dairy firm, Hatsun Agro Product, plans to invest ₹1,000 crore in FY27 to enhance its production capacity and marketing efforts. Chairman RG Chandramogan stated that the investment will be used for setting up new plants and expanding its retail network. The company reported a 14.5% increase in revenue for the first quarter of the current fiscal year.", "category": "Business", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "137e323d"}, {"headline": "PVR-INOX to Open Lower Priced 'Smart' Screens in Tier-3 Towns", "summary": "PVR-INOX plans to launch 'smart' cinema screens in tier-3 cities like Muzaffarnagar and Muzaffarpur, with ticket prices 30-35% lower than in metros. The company aims to reach audiences in smaller towns where theatre density is low. These screens will offer a high-quality cinematic experience at a more affordable price point, supporting PVR-INOX's strategy for nationwide expansion.", "category": "Business", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "5a165ad4"}, {"headline": "Nexus Select Trust Reports 17% Growth in Mall Consumption", "summary": "Nexus Select Trust reported a 17% growth in consumption across its mall portfolio and plans to add more premium global brands to its retail spaces. The trust saw a significant increase in footfalls and rental income during the first quarter. Management remains optimistic about the outlook for the retail sector and plans to continue its focus on portfolio optimization and expansion.", "category": "Business", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "4b11b69f"}, {"headline": "Symphony Reports 5% Drop in Q1 Net Profit Despite Revenue Growth", "summary": "Symphony reported a 5% decline in Q1 net profit to ₹40 crore, despite an 8% increase in revenue. The company saw strong performance in its standalone business, but overall profit was impacted by higher expenses and one-off items. Management remains optimistic about the demand for air coolers and plans to focus on product innovation and market expansion to drive growth.", "category": "Business", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "d0995250"}, {"headline": "India Can Meet 20% of Gold Demand Through Domestic Mining by 2047", "summary": "A World Gold Council report suggests India could meet 20% of its annual gold demand from domestic mining by 2047 if the government provides more policy support. The report recommends the formation of three task forces to focus on gold financing, exploration, and manufacturing. This initiative aims to reduce India's reliance on gold imports and support the 'Make in India' program.", "category": "Economy", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "6eb9ef65"}, {"headline": "IMD Forecasts More Heavy Rainfall for Assam and Meghalaya", "summary": "The India Meteorological Department (IMD) has forecast heavy to very heavy rainfall for Assam and Meghalaya over the next few days. The monsoon shift toward Northeast India is expected to bring widespread rain across the region. Authorities have warned of potential flooding and landslides in vulnerable areas. Other parts of the country are expected to see more moderate rainfall.", "category": "Environment", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "110ced82"}, {"headline": "Fishermen Express Concerns Over Proposed Changes to Merchant Shipping Act", "summary": "A fishermen's coordination committee has raised concerns that proposed amendments to the Merchant Shipping Act could favor larger operators over small-scale fishing. The committee argued that the changes could lead to the marginalization of traditional fishers and impact their livelihoods. They have called for more consultations with the fishing community before finalizing the amendments.", "category": "Law", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "25e5dd2b"}, {"headline": "Monoculture is Impacting Soil Health in Punjab, Says PAU Study", "summary": "A Punjab Agricultural University (PAU) study has warned that the continuous rice-wheat monoculture is leading to soil degradation in the state. The study highlighted the decline in soil organic carbon and the depletion of groundwater due to water-intensive crops. Experts have called for crop diversification and the adoption of more sustainable farming practices to protect soil health.", "category": "Environment", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "81a6ce9a"}, {"headline": "Supreme Court Rules 10-km Buffer Zone Applies to All Wetland Reserves", "summary": "The Supreme Court has clarified that the 10-km buffer zone for mining activities applies to all wetland reserves and wildlife sanctuaries across India. The court stated that mining near these areas requires prior approval from the National Board for Wildlife. This ruling aims to ensure the protection of ecologically sensitive areas and prevent unauthorized mining activities.", "category": "Law", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "026d7cae"}, {"headline": "Bengaluru Urged to Become a Deep-Tech Hub, Not Just GCC Destination", "summary": "Karnataka Chief Minister Siddaramaiah urged global companies to focus on research and deep-tech in Bengaluru, rather than just routine operations. Speaking at an event, the CM highlighted the state's vibrant ecosystem for innovation and urged firms to set up more R&D centres in the city. The government is committed to supporting deep-tech initiatives to drive future economic growth.", "category": "Technology", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "72c9a592"}, {"headline": "Govt Attaches Assets Worth ₹17,874 Crore from Fugitive Economic Offenders", "summary": "The Indian government has attached assets worth ₹17,874 crore from fugitive economic offenders between 2019 and 2026 under the PMLA. This move is part of a broader crackdown on financial crime and the recovery of illicit funds. The authorities have also stepped up efforts to extradite fugitives and bring them to justice. The government remains committed to tackling economic offences.", "category": "Law", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "4e6334ed"}, {"headline": "Top Five Listed Firms Account for 45% of India's CSR Spending", "summary": "HDFC Bank, Reliance Industries, TCS, ICICI Bank, and SBI accounted for nearly 45% of India's total CSR spending of ₹11,391 crore in FY26. Data from the Corporate Affairs Ministry shows that CSR spending by these firms has grown significantly over the last five years. Maharashtra remained the largest recipient of CSR funds, followed by Gujarat and Tamil Nadu.", "category": "Economy", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "dcd8833b"}, {"headline": "China's AI Blitz Creates Intense Competition for US Model Makers", "summary": "Chinese AI firms are rapidly releasing models that challenge the lead held by US companies like OpenAI. A series of model launches from China has narrowed the gap in performance and cost-efficiency, creating a 'death zone' for some US rivals. This surge in AI development from China reflects a growing global competition for technological leadership and market dominance.", "category": "Technology", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132855", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132855"}], "article_id": "bb9277f1"}, {"headline": "Indian-flagged ship sinks in Red Sea after attack; 14 rescued", "summary": "An Indian-flagged merchant vessel sank off Yemen after being hit by a projectile. All 14 crew members, including 13 Indians, were rescued. India condemned the attack, calling for an end to targeting commercial shipping in the Red Sea.", "category": "World", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "7da3894c"}, {"headline": "Delhi taxi drivers protest E20 fuel over mileage, costs", "summary": "Around 100 Delhi taxi drivers protested E20 petrol, citing reduced mileage, increased maintenance costs, and impact on older vehicles. The association submitted a representation to Union Minister Nitin Gadkari, who previously stated E20 reduces fuel economy by 2%-6%.", "category": "Economy", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "d22b9dad"}, {"headline": "Election Commission revises Delhi electoral roll revision deadline again", "summary": "The Election Commission extended the special intensive revision (SIR) of Delhi’s electoral rolls to August 17, with the final roll publication now set for October 27. This is the second extension, citing slow progress in digitisation of enumeration forms by Booth Level Officers (BLOs).", "category": "Politics", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6c57e22b"}, {"headline": "Over 3 lakh women register for Delhi Lakshmi Yojana", "summary": "Over 3 lakh women have registered for the Delhi Lakshmi Yojana, with 71,411 applications submitted. The scheme offers ₹2,500/month to eligible women aged 21-60 with annual family income up to ₹2.5 lakh, excluding taxpayers and government employees.", "category": "India", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "62939bc5"}, {"headline": "HC directs NCSC to act on JNU V-C 'casteist' remarks complaint", "summary": "The Delhi High Court directed the National Commission for Scheduled Castes (NCSC) to act on a complaint by JNU Students’ Union against Vice-Chancellor Santishree Dhulipudi Pandit for alleged casteist remarks. NCSC is to decide the matter within eight weeks.", "category": "Education", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "481d6ae0"}, {"headline": "Delhi HC grants 4 weeks to AAP leaders in contempt case", "summary": "The Delhi High Court gave Aam Aadmi Party leaders Arvind Kejriwal, Manish Sisodia, Sanjay Singh, and others four weeks to respond to a criminal contempt case. The case pertains to alleged \"vilifying\" social media posts against Justice Swarana Kanta Sharma.", "category": "Law", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "0fe67040"}, {"headline": "Dwarka Golf Course lifetime memberships oversubscribed: DDA", "summary": "The Delhi Development Authority (DDA) received 856 applications for 850 lifetime memberships of the Dwarka Golf Course within 11 days. The non-government category is oversubscribed, while government category applications are nearing full. Allotments will be via computerized draw if oversubscribed.", "category": "Infrastructure", "page": 4, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6159541a"}, {"headline": "Rajasthan HC grants 20-day parole to Asaram", "summary": "The Rajasthan High Court granted 20-day parole to self-styled \"godman\" Asaram, serving a life sentence for sexually assaulting a minor. The court noted his incarceration duration and conduct, stating the State government failed to justify rejecting his parole.", "category": "Law", "page": 5, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "cc72c093"}, {"headline": "Assam CM links floods to Nagaland mining, to discuss with Centre", "summary": "Assam CM Himanta Biswa Sarma linked unprecedented floods, which killed 87, to mining in Nagaland, stating he would raise the issue with the Centre. He denied illegal mining in Assam and announced damage assessment and rebuilding efforts from August 9.", "category": "Environment", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "4b836124"}, {"headline": "Himachal Pradesh plans health scheme with ₹10 lakh coverage", "summary": "Himachal Pradesh CM Sukhvinder Singh Sukhu announced a health insurance scheme covering up to ₹10 lakh for poor families at a nominal premium. This aims to provide quality healthcare access, potentially benefiting 10 lakh families, making HP the first state to offer such a scheme.", "category": "Health", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "855d33b7"}, {"headline": "Chhattisgarh UCC panel invites public suggestions by Oct 15", "summary": "Chhattisgarh's committee for Uniform Civil Code (UCC) implementation has invited suggestions from citizens, legal experts, and social organizations by October 15. The panel will study legal, social, and administrative aspects, and UCC models from other states to prepare a comprehensive draft.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "bac9a2b6"}, {"headline": "Haryana demands co-hosting 2030 CWG after strong performance", "summary": "Haryana's strong performance at the Commonwealth Games sparked demands from politicians and sportspersons to co-host the 2030 CWG. MPs staged a protest, arguing Haryana, which wins 50% of India's medals, faces neglect and deserves to host events.", "category": "Sports", "page": 5, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "4882ff95"}, {"headline": "MEA denies involvement in Sheikh Hasina’s FCC event", "summary": "The External Affairs Ministry stated it has no involvement in Bangladesh's deposed Prime Minister Sheikh Hasina's upcoming press conference at the Foreign Correspondents Club. This came after Bangladesh PM Tarique Rahman's adviser met India's High Commissioner, cautioning against political activities by Hasina on Indian territory.", "category": "World", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6744d59e"}, {"headline": "Centre considers CBT mode for NEET, informs Supreme Court", "summary": "The Union Education Ministry informed the Supreme Court that migrating the NEET-UG exam from pen-and-paper to computer-based testing (CBT) is under \"active consideration\". A final approach will be decided after recommendations from a task force chaired by Nandan Nilekani and consultation with Health Ministry and NMC.", "category": "Education", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "30fcf749"}, {"headline": "Questions raised on NTA chief Pradeep Joshi's role amid reforms", "summary": "Following Education Minister Dharmendra Pradhan's resignation over exam irregularities, questions are raised on NTA Chairman Pradeep Kumar Joshi's role. Opposition leaders allege political recommendations for his appointment and links to RSS, despite his absence from public eye.", "category": "Education", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "ae49e583"}, {"headline": "SC seeks Centre's response to CAPF Act challenge", "summary": "The Supreme Court issued notice to the Union government on petitions challenging the Central Armed Police Force (General Administration) Act, 2026. Petitioners, including a CRPF Assistant Commandant, argue sections regarding IPS officer deputation are \"ultra vires the Constitution\".", "category": "Law", "page": 10, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "8db77306"}, {"headline": "Educationist D.Y. Patil, former Governor, dies at 90", "summary": "Padma Shri awardee D.Y. Patil, educationist and former Governor of Tripura, Bihar, and West Bengal, passed away at 90. He founded the D.Y. Patil Group, comprising 182 institutes and seven universities. PM Modi and Rahul Gandhi offered condolences.", "category": "India", "page": 10, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "7d68a9bb"}, {"headline": "Phase 2 Census questions, including caste, expected next week", "summary": "Questions for the second phase of Population Census 2027 are expected next week, including caste enumeration. The exercise begins August 17 in Ladakh and snow-bound areas, ahead of the main phase in February 2027. This will be the first time caste is recorded for all residents.", "category": "India", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "18a0ae9f"}, {"headline": "Rajya Sabha passes Births and Deaths Registration Bill", "summary": "The Rajya Sabha passed the Registration of Births and Deaths (Amendment) Bill, 2026, amid Opposition protests. The Bill makes delayed registration more stringent, aiming to encourage timely reporting of births and deaths, as stated by Minister of State for Home Nityanand Rai.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "b3c91708"}, {"headline": "Opposition seeks debate on Ram Temple theft, police action", "summary": "The Opposition intensified protests, demanding a Parliament debate on the alleged Ram Temple donation scam and police brutality against student protesters. Mallikarjun Kharge said a debate would reveal the \"truth,\" but the government seemed \"panicked\" and avoided accountability.", "category": "Politics", "page": 11, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "8b394bbc"}, {"headline": "NCP demands Congress apology over 'gungi gudiya' remark for Sunetra Pawar", "summary": "The NCP demanded an apology from Congress after its social media post called Maharashtra Deputy CM Sunetra Pawar a \"gungi gudiya\" (dumb doll). The remark followed a video where a journalist's question to Ms. Pawar was allegedly stopped. NCP criticized the sexist comment, linking it to the Pawar family.", "category": "Politics", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "be434795"}, {"headline": "Rahul Gandhi: Students need apology, not PM's 'forgiveness'", "summary": "Rahul Gandhi stated that protesting students, suffering from unemployment and education system issues, deserve an apology from the government, not Prime Minister Modi’s \"forgiveness.\" He linked protests to RSS attempts to impose a single historical narrative, urging respect for diverse state histories.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "2d6c3c76"}, {"headline": "CPI(ML) Liberation leader urges reducing voting age to 16", "summary": "CPI(ML) Liberation general secretary Dipankar Bhattacharya advocated reducing India's voting age to 16. His remarks came as RSS chief Mohan Bhagwat was set to address young students. Bhattacharya called this a \"desperate\" attempt to reach Gen Z, contrasting it with calls for student apologies.", "category": "Politics", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6b2a23ab"}, {"headline": "NDA government's sports policies yielded results: Minister Mandaviya", "summary": "Union Sports Minister Mansukh Mandaviya stated that NDA government efforts since 2014 resulted in significant sports achievements, including many international medals. He also claimed 17.1 crore youth secured employment between 2014-2026, compared to 2.89 crore during 2004-2014.", "category": "Sports", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "2c854d3a"}, {"headline": "Madhya Pradesh to hold student union polls in September", "summary": "The Madhya Pradesh government informed the High Court that student union elections in higher educational institutions will be held in September, ending a nine-year gap. The court directed authorities to hold elections in every college of the State.", "category": "Education", "page": 11, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "4a60d8d2"}, {"headline": "Bihar Police action against students threatens democracy: Congress", "summary": "A Congress fact-finding team's preliminary report alleged Bihar Police used excessive force (gunfire, tear gas, lathis) against student protesters without legal procedures. Congress leader Kanhaiya Kumar demanded a judicial inquiry, accusing police of blatantly disregarding the law to crush peaceful protests.", "category": "Politics", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "49646d6b"}, {"headline": "Three CRPF personnel killed in Assam fratricide", "summary": "Three CRPF personnel died in a suspected fratricide incident at a camp in Assam. Assistant Sub-Inspector Ballani Premabaram shot himself after firing at two Head Constables, who died on the spot or later succumbed to injuries. Investigations are underway by CRPF and Nagaon police.", "category": "India", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "e40e78a7"}, {"headline": "ESIC considers raising wage ceiling for benefits", "summary": "The ESIC is considering a proposal to increase the wage limit for qualifying for its benefits from ₹21,000 to ₹30,000, as demanded by employees' representatives. Labour Minister Mansukh Mandaviya stated a decision would be made soon, potentially covering over 50 lakh additional workers.", "category": "Economy", "page": 12, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "0727a29d"}, {"headline": "WHO agency classifies 3 common medicines as carcinogenic", "summary": "The International Agency for Research on Cancer (IARC) classified three widely used medicines—hydrochlorothiazide, voriconazole, and tacrolimus—as \"carcinogenic to humans\" (Group 1). These drugs treat high blood pressure, fungal infections, and transplant rejection. Experts advise against discontinuing treatment without consulting doctors.", "category": "Health", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "ecb8d4d5"}, {"headline": "Transport, pharma, biotech lead India's private R&D investment", "summary": "Transportation, pharmaceuticals, biotechnology, and IT industries overwhelmingly drive India's private-sector research. Transport companies are the largest industrial R&D contributors, spending ₹39,137 crore in 2023-24. Private industry now accounts for 51.8% of national R&D spending, exceeding government contribution for the first time.", "category": "Business", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "9db0154d"}, {"headline": "FSSAI bans '100% pure' labels on Dabur products; shares fall", "summary": "FSSAI directed Dabur India Ltd. to withdraw products with \"misleading 100% claims\" like '100% Pure' on honey, apple cider vinegar, etc., citing ambiguity and unverifiability. Dabur claims labels comply with regulations and are transitioning, but its shares fell 4%.", "category": "Economy", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "2ac97c0a"}, {"headline": "LIC shares dip 8% after Centre’s discounted stake sale", "summary": "LIC shares fell almost 8% to ₹391/share after the government sold a 6.5% stake via OFS at a 10% discount. This is four years after LIC's IPO. The offer included a base offer of 2% equity with an option to sell an additional 4.5%.", "category": "Business", "page": 13, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "0465a91a"}, {"headline": "ONGC net profit doubles to ₹17,034 crore on crude price rise", "summary": "ONGC's net profit more than doubled year-on-year to ₹17,034 crore in the June quarter, driven by a 50.4% increase in net crude price realisations to $99.45 per barrel. Gross revenue rose 45.2% to ₹46,460 crore, while crude oil and natural gas production remained nearly flat.", "category": "Business", "page": 13, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "698f8d7f"}, {"headline": "Indian wind turbine firms seek export incentives, PLI", "summary": "The Indian Wind Turbine Manufacturers Association requested the Union Ministry for New and Renewable Energy for an export-linked incentive scheme and support for indigenous manufacturing of flanges and large bearings. They aim to boost cost-competitiveness against countries like China and tap global demand.", "category": "Business", "page": 13, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "d7857afa"}, {"headline": "Lebanon, Israel hold U.S.-sponsored talks in Rome", "summary": "Lebanon and Israel held a new round of U.S.-sponsored talks in Rome, with Beirut seeking Israel's phased withdrawal from its south. Hezbollah leader Naim Qassem criticized direct negotiations, calling them \"shame, humiliation, and compromises\" for Lebanon.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "e846a019"}, {"headline": "Netanyahu: No Gaza withdrawal until Hamas disarmed", "summary": "Israeli Prime Minister Benjamin Netanyahu stated Israel will not withdraw from Gaza until Hamas is completely disarmed. He confirmed receiving a U.S. draft proposal but did not agree, reiterating Israel's firm stance on its interests.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "ad84d2da"}, {"headline": "Yemen's Houthis claim airport attack in Saudi Arabia", "summary": "Yemen’s Iran-backed Houthis claimed to have attacked Najran Airport in southern Saudi Arabia with a drone. This comes amidst rising tensions, after the rebels declared a maritime blockade on Riyadh and struck its ships.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "768a2103"}, {"headline": "Ex-Army chief Zaluzhny: Ukraine will never join NATO", "summary": "Ukraine's former Army chief Valery Zaluzhny stated the country will \"never\" join NATO, despite Kyiv's stated intention to become a member. He delivered these comments at a meeting of Kyiv’s ambassadors, contrasting with the nation's pro-NATO stance amidst the Russian invasion.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "37d4cfe4"}, {"headline": "US used 'virtually all' precision missiles in Iran war", "summary": "The U.S. Army has reportedly used most of its highly accurate long-range missiles (ATACMS and PrSM) during its five-month war with Iran, raising concerns about readiness for future conflicts. The reduction could limit the US's ability to deter adversaries like Russia and China.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "3ac0e4b0"}, {"headline": "US hopeful Strait of Hormuz deal soon despite ship hit", "summary": "The U.S. is hopeful a deal to reopen the Strait of Hormuz will be done \"today or tomorrow,\" despite another cargo ship being hit. U.S. Treasury Secretary Scott Bessent stated a deal was possible, though Iran's Foreign Ministry denied direct talks with Washington were taking place.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "36bf7b54"}, {"headline": "Bangladesh proposes death penalty for enforced disappearance", "summary": "Bangladesh's government proposed the death penalty for enforced disappearances after an inquiry recorded over 1,500 cases during deposed PM Sheikh Hasina’s rule. Hasina was accused of using security forces against political rivals. The Bill awaits Parliament's passage.", "category": "World", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "fa48c253"}, {"headline": "Drones kill five in Moscow region, five in Ukraine", "summary": "Ukrainian drone attacks killed five in the Moscow region, while Russian aerial strikes caused at least five civilian deaths in Ukraine's Donetsk region. Both countries reported casualties from the ongoing drone warfare, with 250-kg glide bombs striking Kramatorsk.", "category": "World", "page": 14, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "eaec3c28"}, {"headline": "Sri Lanka seeks national consensus for new Constitution", "summary": "Sri Lankan President Anura Kumara Dissanayake favors building \"national consensus\" rather than \"hastily\" drafting a new Constitution. He discussed reforms and abolishing the Executive Presidency with Tamil-speaking minority leaders, reaffirming the government's commitment to a broad national dialogue.", "category": "Politics", "page": 14, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "f93996b6"}, {"headline": "Koneru Humpy to lead India's title defense at Chess Olympiad", "summary": "Two-time World rapid champion Koneru Humpy will lead India's title defense at the Chess Olympiad in Samarkand. She missed the 2024 gold-winning team but is determined to play this year, expecting strong challenges from Russia, China, and other top teams.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "244df3ea"}, {"headline": "Badminton's new scoring system to impact players: Gopi Chand", "summary": "P. Gopi Chand stated that badminton's upcoming scoring overhaul (15x3 replacing 21x3) will create a \"tactical shift,\" potentially \"wiping off\" some players while benefiting others. He recalled past disruptions, noting shorter games will make every phase more critical, especially for doubles players.", "category": "Sports", "page": 15, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "b5e2c285"}, {"headline": "Shafique century, Babar fifty give Pakistan lead over West Indies", "summary": "Abdullah Shafique scored his sixth Test century (160 n.o.) and Babar Azam made 88 as Pakistan posted 387 in reply to West Indies' 344. Jomel Warrican took six wickets, but Shafique and Babar's 183-run stand helped Pakistan gain a 43-run lead on day three of the second Test.", "category": "Sports", "page": 15, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "562349fd"}, {"headline": "Garaga-Roy duo advances at Korea Masters", "summary": "The unseeded Indian pair of Krishna Prasad Garaga and Pruthvi Krishnamurthy Roy defeated sixth-seeded Thai pair Chaloempon Charoenkitamorn and Worrapol Thongsa-Nga in straight games (21-16, 21-18) to reach the men's doubles second round at the Korea Masters Super 300 badminton tournament.", "category": "Sports", "page": 15, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6230155a"}, {"headline": "Satwik-Chirag highest seeded Indians at World Championships", "summary": "Last year's bronze medalists R. Satwiksairaj and Chirag Shetty are the highest-seeded Indians at fifth for the upcoming BWF World Championships (August 17-23). They are the only Indians besides P.V. Sindhu and Saina Nehwal to win multiple medals in the competition.", "category": "Sports", "page": 15, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "ffae9cf3"}, {"headline": "Barcelona goalkeeper Ter Stegen joins Ajax on loan", "summary": "Barcelona goalkeeper Marc-Andre ter Stegen has joined Ajax on loan for the 2026/27 season. The 34-year-old, who has been with Barcelona since 2014, has missed much of the last two seasons due to serious injury issues.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "89498019"}, {"headline": "Taylor Fritz wins ATP title; Alexandra Eala makes WTA history", "summary": "World No. 10 Taylor Fritz claimed his first ATP title of 2026 at Washington, defeating Rafael Jodar 7-6(2), 6-4. Alexandra Eala made history, becoming the first player from the Philippines to win a WTA title, overcoming top-seeded Jessica Pegula 4-6, 6-4, 6-0.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "a2375bae"}, {"headline": "Vladimir Petkovic leaves as Algeria head coach", "summary": "Algeria's Football Federation announced that head coach Vladimir Petkovic has left by mutual consent, just two months after extending his contract until 2028. Petkovic, 62, led Algeria to the World Cup knockout stage for the second time in 2026.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "9cb2176e"}, {"headline": "Tamil Nadu government grants ₹10 crore for Chennai Open", "summary": "The Tamil Nadu Government committed ₹10 crore financial support for the WTA 250 Chennai Open, ensuring the tennis tournament's return for a second consecutive year. The TNTA and SDAT will jointly conduct the event from November 2 to 8, with a total financial commitment of $283,347.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "d0b5dc51"}, {"headline": "Manvir Singh hat-trick in Mohun Bagan's 8-0 Durand Cup win", "summary": "Manvir Singh scored a hat-trick as Mohun Bagan Super Giant thrashed South United FC 8-0 in the Durand Cup, strengthening their top position in Group A. Other scorers included Suhail Bhat (2), Alberto Rodriguez, Rahul Bheke, and an own goal.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "b90f5846"}, {"headline": "Jamshedpur FC's ISL exit a strategic move: Tata Steel", "summary": "Tata Steel stated Jamshedpur FC's withdrawal from the upcoming Indian Super League season was a long-planned strategic decision to refocus on grassroots football development, not due to ISL's commercial uncertainty. They assured honoring player contracts and facilitating new club placements.", "category": "Sports", "page": 16, "importance": 3, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "1812ddf1"}, {"headline": "Monu Shukla's blitz leads Warriors to Super Over win", "summary": "Outer Delhi Warriors secured a morale-boosting win against New Delhi Tigers in the first Super Over of the Delhi Premier League. Monu Shukla scored 45 off 17 balls to tie the game, then added three maximums in the tiebreak, leading Warriors to victory.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6fa7b3ad"}, {"headline": "Fulham signs striker Gonzalo Garcia from Real Madrid", "summary": "Spanish striker Gonzalo Garcia joined Fulham from Real Madrid, signing a contract until 2031. The 22-year-old had a productive season last term, scoring eight goals for Real, including six in LaLiga.", "category": "Sports", "page": 16, "importance": 2, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "f6075e9d"}, {"headline": "Serena and Venus Williams reunite for Cincinnati Masters doubles", "summary": "Serena and Venus Williams will play doubles together on a wild card entry at the Cincinnati Masters. The sisters, with 14 Major doubles titles and three Olympic golds, last played together at the 2022 US Open. Venus will also compete in singles.", "category": "Sports", "page": 17, "importance": 4, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 17, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "6181aba6"}, {"headline": "Zidane, Klopp, Mancini take top football managerial roles", "summary": "Zinedine Zidane is France's new head coach, Jurgen Klopp takes over Germany, and Roberto Mancini returns to manage Italy, while Jorge Jesus guides Portugal. These managerial changes mark a significant shift, as teams prepare for major tournaments and post-star player eras.", "category": "Sports", "page": 19, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "8825959d"}, {"headline": "SpaceX rocket stage to crash on moon, astronomers monitor", "summary": "A SpaceX Falcon 9 rocket stage, abandoned after launching satellites in January 2025, is set to impact the moon at 12:05 p.m. IST on August 5. Astronomers are monitoring its trajectory, seeing it as a rare opportunity to study artificial impacts, specifically how lunar dust behaves.", "category": "Science", "page": 22, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "0fa5712f"}, {"headline": "New study finds global warming is accelerating", "summary": "A new study in Geophysical Research Letters found evidence that global warming is accelerating, with the Earth warming faster in the last decade than any prior decade since 2015. Scientists are more than 98% certain of this acceleration, predicting a breach of 1.5 degrees Celsius warming by 2030.", "category": "Environment", "page": 22, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132814", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 22, "telegram_url": "https://t.me/c/1877410077/132814"}], "article_id": "e467e8ac"}, {"headline": "JSW and VW Group Plan Joint Venture for Indian Car Market", "summary": "JSW Group and Volkswagen Group are planning a joint venture to manufacture internal combustion engine and new energy vehicles in India. The deal, expected to be finalized by September, aims to capitalize on India's $186-250 billion domestic auto market. JSW seeks a controlling stake, while the venture will likely exclude super-luxury brands like Porsche and Lamborghini.", "category": "Business", "page": 1, "importance": 9, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "81edaf4d"}, {"headline": "Supreme Court Orders SOPs to Curb Digital Arrests and Mule Accounts", "summary": "The Supreme Court has directed the Reserve Bank of India to prepare a Standard Operating Procedure (SOP) within four weeks to deal with the rising menace of 'mule' bank accounts used in cybercrime. A bench led by CJI Surya Kant emphasized the need for grievance redressal and money restoration modules to protect citizens from fraudulent digital arrests and financial exploitation.", "category": "Law", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "9e906f47"}, {"headline": "Nvidia Joins Sarvam AI’s $75 Million Series B Funding Round", "summary": "Nvidia has become the first global chipmaker to invest in an Indian sovereign AI firm, participating in Sarvam AI’s $75 million funding round. The investment aims to help Sarvam develop its full-stack AI platform and applications tailored for the Indian market. The startup will utilize Nvidia’s technology to scale its infrastructure and reach more developers across the country.", "category": "Technology", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "8425f122"}, {"headline": "World Bank Sees AI Boosting Growth in Developing Economies", "summary": "A World Bank report suggests that artificial intelligence could significantly lift growth in developing economies, including India, by enhancing productivity and services. The report warns that failing to adopt AI could widen the gap between rich and poor nations. It advocates for investments in digital infrastructure and skills to help smaller firms compete globally.", "category": "Economy", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "74b990d2"}, {"headline": "Netflix Co-CEO Ted Sarandos Sees India as Major Global Growth Market", "summary": "Netflix Co-CEO Ted Sarandos stated that India is central to the streaming giant's next phase of growth, citing the country's vibrant creative ecosystem and affordable internet. Sarandos emphasized that Netflix's strategy in India focuses on offering diverse, high-quality content rather than chasing live sports rights. He noted that India’s average revenue per user remains a challenge.", "category": "Business", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "5b0a5d42"}, {"headline": "Takeda Plans to Launch Dengue Vaccine Qdenge in India by 2027", "summary": "Japanese pharmaceutical giant Takeda is planning to launch its dengue vaccine, Qdenge, in the Indian private market by the first half of 2027. The company is currently navigating the regulatory process with the Drug Controller General of India. India accounts for nearly one-third of the global dengue burden, making it a critical market for the vaccine's global rollout.", "category": "Health", "page": 1, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "86bcf89c"}, {"headline": "Women’s Quota-Delimitation Bill Remains Under Discussion for Possible Early Implementation", "summary": "The Indian government is considering the possibility of bringing a fresh constitutional amendment to operationalize the women's reservation quota before the 2029 polls. The proposed bill aims to decouple the quota from the next census and link it to the delimitation of constituencies. Sources suggest a separate parliamentary session may be called to discuss the proposal.", "category": "Politics", "page": 1, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "1e0d3616"}, {"headline": "SC Reserves Verdict on Reconsidering Two-Child Policy for Panchayat Polls", "summary": "The Supreme Court has reserved its verdict on a plea challenging the disqualification of candidates with more than two children from contesting local body elections in Haryana. The petitioner argued that the current law is outdated and violates fundamental rights. The court is considering whether its 2003 judgment upholding the policy requires review by a larger bench.", "category": "Law", "page": 2, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "a05a40c9"}, {"headline": "Centre Forms 12-Member Expert Committee to Review NEET-PG Exam System", "summary": "The Union government has informed the Supreme Court that it has constituted a 12-member expert committee to review the National Eligibility-cum-Entrance Test for postgraduates (NEET-PG). The panel will look into systemic flaws and suggest improvements to ensure a transparent and fair examination process following complaints of discrepancies in OMR sheets and scoring.", "category": "Education", "page": 2, "importance": 8, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "eda9bdbc"}, {"headline": "Karnataka to Release 3,500 Cusecs of Cauvery Water to Tamil Nadu", "summary": "The Karnataka government has agreed to comply with the Cauvery Water Management Authority’s (CWMA) directive to release 3,500 cusecs of water per day to Tamil Nadu until August 7. Despite earlier resistance due to water scarcity, improved inflows into state reservoirs have allowed the government to meet the demand. The CWMA will review the situation again later this week.", "category": "Environment", "page": 2, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "ee149eec"}, {"headline": "Lok Sabha Clears Appropriation Bill in Just Three Minutes Amid Protests", "summary": "The Lok Sabha passed the Appropriation (No. 3) Bill, 2026, in just three minutes without any discussion as opposition members continued to protest over various issues. Finance Minister Nirmala Sitharaman introduced the bill, which authorizes the government to utilize funds from the Consolidated Fund of India for the current financial year. The bill was approved by a voice vote.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "b6f21f52"}, {"headline": "DK Shivakumar Says Resignations of Rebel Karnataka MLAs Will Be Accepted", "summary": "Karnataka Deputy Chief Minister DK Shivakumar stated that the party will immediately accept the resignations of any rebel MLAs who are unhappy with the recent cabinet expansion. Shivakumar emphasized that party discipline must be maintained and that ministerial berths cannot be given to everyone. He urged disgruntled legislators to remain patient and work for the party's future.", "category": "Politics", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "bd95cf2b"}, {"headline": "GCC Net Hiring in India to Hit 200,000 in FY27", "summary": "Net hiring in Global Capability Centres (GCCs) in India is projected to reach 200,000 in FY27, even as traditional IT services firms slow down recruitment. The growth is driven by demand for specialized roles in AI, cloud, and cybersecurity. Experts suggest that while entry-level hiring remains under pressure, the demand for mid-level talent in niche technologies continues to outpace supply.", "category": "Economy", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "38a5d6e1"}, {"headline": "Nykaa Reports 3x Jump in Q1 Net Profit to ₹80 Crore", "summary": "Beauty and fashion retailer Nykaa reported a nearly threefold increase in its Q1 net profit to ₹80 crore, driven by a 29% rise in revenue. The company’s beauty and personal care segment saw a 24% growth in Gross Merchandise Value (GMV), while the fashion business grew by 54%. Nykaa attribute the strong performance to successful execution during key sales events and store expansion.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "107fb33d"}, {"headline": "Trump Administration to Meet Tech Giants to Discuss AI Safety Protocols", "summary": "The Trump administration has scheduled a meeting with major technology firms, including Meta and OpenAI, to discuss voluntary safety testing for advanced AI models. The White House expressed concerns over the potential for AI to be misused in cyberattacks or biological warfare. The meeting aims to establish a framework for testing the capabilities and vulnerabilities of AI systems.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "d468cc22"}, {"headline": "Persistent Systems Launches $1.6 Billion Bridge Loan for Nagarro Acquisition", "summary": "Persistent Systems has launched a bridge loan of approximately $1.6 billion to fund its proposed acquisition of German digital engineering firm Nagarro. The 18-month facility is being underwritten by Barclays. The acquisition is expected to significantly enhance Persistent's capabilities in the European market and strengthen its overall digital engineering portfolio.", "category": "Business", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "c7aa0d4f"}, {"headline": "Persistent CEO Warns AI Could Deflate IT Revenue by 25-30%", "summary": "Sandeep Kalra, CEO of Persistent Systems, warned that the adoption of generative AI could lead to a 25-30% reduction in IT service billing cycles. He noted that as AI tools mature and become more efficient, clients will expect lower costs for traditional coding and maintenance tasks. Companies that fail to adapt to these changes risk falling behind in the rapidly evolving market.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "d4f194f2"}, {"headline": "Climate-tech Firm InRisk Raises $27 Million from Bessemer and Others", "summary": "InRisk, a climate-tech startup focused on risk management for the energy sector, has raised $27 million in a funding round led by Bessemer Venture Partners. The company plans to use the capital to expand its operations in India and global markets. InRisk provides AI-driven data and analytics to help firms mitigate the financial impact of climate-related risks and disasters.", "category": "Environment", "page": 4, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "2e96424a"}, {"headline": "Apple Seeks Injunction Against Former Employees for OpenAI Trade Secret Leaks", "summary": "Apple has filed a lawsuit and is seeking a preliminary injunction against two former employees for allegedly disclosing confidential information and trade secrets to OpenAI. The suit claims that the individuals shared proprietary details about Apple’s AI and machine learning projects. OpenAI is not named as a defendant in the case, which highlights the intense rivalry in the AI sector.", "category": "Technology", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "0685da2d"}, {"headline": "Palo Alto Networks Reports 31 Billion Daily Cyber Attacks Globally", "summary": "Cybersecurity firm Palo Alto Networks has reported that it currently blocks approximately 31 billion cyber attacks every day globally. The company noted that hackers are increasingly using AI to identify and exploit vulnerabilities at a much faster rate. Experts emphasized that traditional security measures are being stretched to their limits by the sheer volume and speed of these attacks.", "category": "Technology", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "c9af4193"}, {"headline": "Karnataka Plans New Procurement Framework to Help Tech Startups", "summary": "The Karnataka government is developing a new procurement policy to make it easier for startups to supply technology solutions to state departments. The move aims to bridge the gap between innovation and public procurement by easing conventional tender requirements that often exclude younger companies. The initiative is part of the state's efforts to boost its vibrant startup ecosystem.", "category": "Business", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "1acb1ffc"}, {"headline": "Hotels in India Optimistic for Q3 Growth Driven by Domestic Travel", "summary": "India's hospitality sector is expecting a strong third quarter, with hotel companies reporting high booking rates driven by domestic travel, weddings, and business events. Major players like Marriott and IHG have noted a significant uptick in demand across tier-1 and tier-2 cities. Industry experts suggest that the current momentum will help offset the impact of global economic headwinds.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "beebb170"}, {"headline": "New IndiGo CEO Walsh Aims to Make Carrier Globally Preferred Airline", "summary": "The new CEO of IndiGo, Peter Walsh, has stated his vision to make the low-cost carrier the airline of choice for both domestic and international travelers. Walsh emphasized the need for operational excellence and customer-centricity to achieve this goal. He also highlighted the airline's plans for fleet expansion and exploring new international routes to maintain its market leadership.", "category": "Business", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "ed2b692b"}, {"headline": "ITAT Rules Flipkart Employee ESOP Payout of ₹2.3 Crore as LTCG", "summary": "The Income Tax Appellate Tribunal (ITAT) has ruled that a ₹2.3 crore ESOP payout to a former Flipkart employee should be taxed as long-term capital gains (LTCG) rather than salary. The tribunal noted that the shares were held for a sufficient period and met the criteria for capital assets. The ruling is expected to provide clarity on the taxation of stock options for many startup employees.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "d310d08b"}, {"headline": "Macquarie in Final Talks to Acquire 96% Stake in Fourth Partner Energy", "summary": "Macquarie Asset Management is in the final stages of negotiations to acquire a 96% stake in Fourth Partner Energy for an estimated $1 billion. The deal would provide an exit for existing investors like IFC and DEG. Fourth Partner Energy is one of India's leading providers of renewable energy solutions for commercial and industrial customers, with a significant portfolio of solar projects.", "category": "Business", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "63839bc3"}, {"headline": "Rupee Remains Steady at 95.37 Ahead of RBI Policy Meeting", "summary": "The Indian rupee traded in a narrow range and ended nearly unchanged at 95.37 against the US dollar on Tuesday. Market participants are cautious ahead of the Reserve Bank of India’s monetary policy announcement scheduled for later this week. Traders noted that while oil prices have eased, global economic uncertainty and potential capital outflows continue to weigh on the local currency.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "9f72408b"}, {"headline": "Indian Markets Diverge as Sensex Falls While Nifty Recovers Early Losses", "summary": "The Indian stock market witnessed a rare divergence on Tuesday, with the Sensex closing down 0.27% while the Nifty managed to recover most of its intraday losses to end 0.64% lower. Analysts attributed the volatility to confusion over a new closing auction system and the expiry of weekly futures and options contracts. Traders have expressed frustration over the increased complexity and risks.", "category": "Economy", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "6d64a7d2"}, {"headline": "Nabard Cancels ₹8,000 Crore Bond Issue After Investors Demand Higher Yields", "summary": "The National Bank for Agriculture and Rural Development (Nabard) has canceled its planned ₹8,000 crore bond issue after investors demanded higher-than-expected yields. Market sources said Nabard was unwilling to pay more than 7.45% for the five-year bonds, while investors were looking for yields above 7.60% due to rising interest rate concerns and a tighter liquidity environment.", "category": "Economy", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "172e032d"}, {"headline": "LIC Offer for Sale Fails to Attract Retail Investors Despite Discount", "summary": "The retail portion of Life Insurance Corporation’s (LIC) Offer for Sale (OFS) remained undersubscribed on the second day, despite a 10% discount to the market price. Analysts suggest that the lack of interest from retail investors is due to the company's weak stock performance since its IPO and concerns over long-term growth prospects in the highly competitive insurance sector.", "category": "Business", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "c3b05bef"}, {"headline": "Microfinance Sector Contracts 4% in Q1 as Monsoon Impacts Rural Demand", "summary": "India's microfinance sector reported a 4% contraction in the first quarter of the current financial year as an uneven monsoon impacted rural income and demand. Leading players like Bandhan Bank have noted a slight increase in loan defaults in certain re
