<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

n will be framed within the Constitution, with promises of adequate Central funding.", "category": "Politics", "page": 3, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "65382989"}, {"headline": "Aroma Chundan wins 72nd Nehru Trophy Boat Race in Alappuzha", "summary": "The 'Aroma Chundan' rowed by the Aroma Boat Club finished first at the 72nd Nehru Trophy Boat Race on Punnamada Lake in Alappuzha, Keralam. The prestigious annual event saw intense competition among traditional snake boats. The victory marks a significant achievement for the club in the historic race, which attracts thousands of spectators and celebrates regional maritime culture.", "category": "Culture", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "5ea4884a"}, {"headline": "Centre expands restrictions on cold medicines for children under four", "summary": "The Union Health Ministry has mandated a warning on all fixed-dose combinations of chlorpheniramine maleate and phenylephrine hydrochloride, prohibiting use for children under four. The decision follows expert committee findings that such multi-ingredient medicines pose risks of dosing errors and adverse effects like drowsiness and altered heart rates in young children.", "category": "Health", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "c6121129"}, {"headline": "Cross FIRs filed after Cockroach Janta Party visit to Jaipur school", "summary": "Members of the Cockroach Janta Party (CJP) and villagers in Rampura-Kanwarpura village lodged FIRs against each other following a school inspection. CJP members alleged assault by \"BJP goons\" while villagers claimed the team frightened students and disrupted school. The incident occurred as students were being taught in a cattle enclosure due to the school building being unsafe.", "category": "Politics", "page": 3, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "a2d60fd2"}, {"headline": "H1N1 cases surge in Delhi as hospitals see sharp spike", "summary": "Delhi has recorded 1,777 H1N1 cases this season, a significant increase from 229 last year. Doctors attribute the surge to weather changes conducive to viral spread. While healthy adults are recovering with rest, vulnerable groups are at risk of respiratory complications. Hospitals have set up dedicated ICUs and isolation wards to manage the influx of symptomatic patients.", "category": "Health", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "0617462a"}, {"headline": "IIT Delhi MSc student dies by suicide on campus", "summary": "A 31-year-old MSc student at the Indian Institute of Technology (IIT) Delhi allegedly died by suicide on campus on Saturday morning. Police found the student injured following a PCR call; he was declared brought dead at the hospital. A forensic team collected evidence, and authorities are examining his cell phone and academic records to determine the circumstances of the death.", "category": "India", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "03dd365d"}, {"headline": "New Narela prison complex scheduled to open by November 2027", "summary": "A new 40-acre prison complex in Narela is being developed to address overcrowding in Delhi's Tihar, Rohini, and Mandoli jails. The facility will include a high-security wing for 256 high-risk prisoners and two general prisons. Currently, Delhi's prisons house twice their sanctioned capacity, with 88% of inmates being undertrials. The project is 10% complete.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "04b580f8"}, {"headline": "Taxi driver and family arrested for killing passenger over fare dispute", "summary": "Delhi Police arrested a taxi driver, his wife, and son for the murder of a passenger and the subsequent concealment of his body. The victim was allegedly killed following a dispute over the fare for a trip from Gurugram to Delhi. The naked, blood-stained body was discovered on a pavement in Naraina Vihar. All three suspects were apprehended on Friday night.", "category": "India", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "6544538a"}, {"headline": "Labourer dies after falling from five-storey building in west Delhi", "summary": "A 44-year-old labourer died and another was injured after falling from the roof of a building while whitewashing in Fateh Nagar. Police reported that the workers were sitting on a plank tied to a rope without safety equipment. An FIR has been registered under relevant sections of the BNS for negligence. The injured labourer is currently in stable condition.", "category": "India", "page": 4, "importance": 3, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "f5790b79"}, {"headline": "Job aspirants detained in Patna after scuffle with police during march", "summary": "Several job aspirants were detained in Patna during a march to Lok Bhavan demanding a transparent recruitment process. Security personnel used \"mild force\" to disperse the crowd after protesters attempted to breach barricades near R-Golumber. The protest caused a scuffle, leading to several detentions. Heavy police deployment remains in the area to maintain order.", "category": "India", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b67d9ad3"}, {"headline": "M.P. CM Mohan Yadav orders review of Ken-Betwa project impact", "summary": "Madhya Pradesh CM Mohan Yadav directed officials to visit villages in Panna and Chhatarpur to address grievances of families displaced by the Ken-Betwa river link project. The move follows protests by tribal families and a meeting between the affected and LoP Rahul Gandhi. The CM instructed early payment of increased compensation, rising from ₹5 lakh to ₹12.5 lakh per family.", "category": "Environment", "page": 5, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "1c159539"}, {"headline": "YouTuber reporting on Ram Temple theft alleges harassment by U.P. police", "summary": "Abhishek Upadhyay, a YouTuber who reported on alleged donation theft at the Ram Temple, claimed he is being harassed via a fresh FIR in Ghaziabad. He alleged that police refused to provide a full copy of the FIR and that a previous school-related report was removed from YouTube. Opposition leaders have extended support, claiming the journalist is being hounded for his work.", "category": "Law", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "18033ef1"}, {"headline": "LDF members clash over Deputy Leader of Opposition post in Keralam", "summary": "A rift has emerged within Keralam's LDF as CM Pinarayi Vijayan and CPI State secretary Binoy Viswam lock horns over the Deputy Leader of the Opposition post. Viswam asserted the post belongs to the CPI(M), while ruling out its allocation to the CPI. The dispute has highlighted internal friction regarding institutional appointments within the legislative front.", "category": "Politics", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "d68a1ac4"}, {"headline": "U.P. Deputy CM assures dialogue with reservation reform agitators", "summary": "Uttar Pradesh Deputy CM Brajesh Pathak met with leaders of the \"reservation reform\" movement at Jantar Mantar. He assured that their demands for equal opportunities would be discussed with the BJP's central leadership and relevant Union Ministers. While some members distanced themselves from the meeting, Pathak emphasized the government's commitment to hearing student concerns.", "category": "Politics", "page": 5, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "cce2b194"}, {"headline": "BJP demands CBI probe into Jharkhand recruitment exam irregularities", "summary": "Union Minister Sanjay Seth has accused the Jharkhand government of using force against students protesting recruitment exam irregularities. He demanded a CBI probe into all recruitment examinations conducted in the state over the last six years. BJP leaders alleged that JMM workers assaulted protesters in various districts, including Ranchi and Hazaribagh.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "c9d43856"}, {"headline": "ED searches Jaipur premises of pastor over alleged FCRA violations", "summary": "The Enforcement Directorate searched premises linked to Rajasthan pastor Ravi Mohan Pahadiya for alleged Foreign Exchange Management Act violations. The ED claims Pahadiya received ₹2.88 crore in foreign funds without FCRA registration for proselytisation and conversions among Valmiki and Bhill communities. Funds were allegedly diverted for personal property and travel.", "category": "Law", "page": 6, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "eb3b880b"}, {"headline": "Akhilesh Yadav says Samajwadi Party will not break political alliances", "summary": "SP chief Akhilesh Yadav asserted that his party remains committed to its alliances in the fight against the BJP. He announced plans for a \"youth manifesto\" for the U.P. Assembly elections, focusing on employability, digital learning, and time-bound teacher recruitment. He also clarified the SP's 'PDA' outreach after criticism from CM Yogi Adityanath.", "category": "Politics", "page": 6, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "6848323f"}, {"headline": "DMK revamps organisation with age caps and term limits for leaders", "summary": "The DMK has announced a major restructuring based on President M.K. Stalin's recommendations. The party fixed a maximum age of 70 for district secretaries and limited their tenure to three terms. To infuse youth, local unit secretaries must be under 45 and can serve only two terms. The number of district units will be increased from 77 to 110 to improve grassroots management.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "5119430a"}, {"headline": "Maharashtra issues notices to 777 drivers over Marathi language proficiency", "summary": "The Maharashtra Transport Department issued notices to 777 autorickshaw and taxi drivers for failing a functional Marathi language test. Out of 5,211 drivers tested, those lacking proficiency have been given until September 30 to comply. Proficiency is mandatory for permit renewals and new badges under State Motor Vehicle Rules. The drive will continue across the state.", "category": "India", "page": 6, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "d88a13ec"}, {"headline": "Rajasthan’s first farmer-owned agrophotovoltaics pilot boosts income in Bassi", "summary": "A 600 kW agri-PV pilot on 3 acres in Kundanpura village allows farmer Kajodmal Jat to grow maize beneath solar panels. The project, supported by ICRIER and GIZ India, has increased his annual income from ₹40,000 to nearly ₹3 lakh. The electricity feeds a local grid providing daytime irrigation for 250 farms. Experts call for national standards to scale this dual-use land model.", "category": "Science", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "e59334e9"}, {"headline": "Chintha Jerome elected first woman president of DYFI in Keralam", "summary": "Chintha Jerome has been elected as the first woman president of the Democratic Youth Federation of India (DYFI) in Keralam during its 16th State Conference. A native of Kollam and CPI(M) State committee member, she rose through the ranks of the SFI. M. Vijin was elected as the State secretary. The election marks a historic shift in the leadership of the youth wing.", "category": "Politics", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b7da4184"}, {"headline": "Karnataka government bans sale of non-dairy paneer for one year", "summary": "The Karnataka government has prohibited the manufacture, storage, and sale of non-dairy or analogue paneer sold under the name \"paneer.\" The ban, effective for one year, aims to protect public health and prevent consumer deception. Analogue paneer uses vegetable fats instead of milk solids. The order follows reports of misleading branding in local markets.", "category": "Economy", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b82e7d28"}, {"headline": "Centre orders complete withdrawal of CISF from Visakhapatnam Steel Plant", "summary": "The Ministry of Home Affairs has approved the withdrawal of 1,329 CISF personnel from the Visakhapatnam Steel Plant by November 17. The move affects both security and fire wings. The pullback comes amid ongoing discussions regarding the strategic disinvestment of the public sector unit. Local stakeholders have expressed concern over the safety and security of the industrial complex.", "category": "Infrastructure", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "250f8d53"}, {"headline": "Keralam protests Railway Board’s decision to merge Mangaluru with Mysuru", "summary": "Keralam CM V.D. Satheesan has protested the Railway Board's decision to detach the Mangaluru region from the Palakkad division and merge it with South Western Railway’s Mysuru division. Keralam fears substantial revenue loss and an impact on train services. Conversely, Karnataka rail patrons welcomed the move, stating Mangaluru's revenue was previously diverted to Keralam projects.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "43518120"}, {"headline": "Mann’s wife sends legal notice to ex-judge over bribery allegations", "summary": "Gurpreet Kaur, wife of Punjab CM Bhagwant Mann, sent a legal notice to a former High Court judge over allegations that she sought ₹5 crore to suppress a rape case. The NHRC has directed a probe into the claims following a complaint by the Legal Rights Observatory. Opposition leaders, including former CM Charanjit Singh Channi, have demanded a CBI inquiry into the matter.", "category": "Law", "page": 7, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "269ad152"}, {"headline": "Founder of shooting academy arrested after family suicide in Andhra", "summary": "Sk. Sadhik Khan, founder of a shooting academy, was arrested in Meerut for allegedly abetting the suicide of an Assistant Engineer and his family in Andhra Pradesh. The bodies of the engineer, his wife, and daughter were recovered from the Godavari. The victim left a note accusing Khan of harassment and threats. Seven police teams were involved in the interstate manhunt.", "category": "Law", "page": 7, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "3acbab40"}, {"headline": "Two workers killed in pharma unit reactor blast in Telangana", "summary": "A reactor blast at Hazelo Lab in Yadadri-Bhongir district triggered a massive fire, killing two workers and injuring nine others. The deceased were identified as residents of Nalgonda and Khammam districts. The facility manufactures active pharmaceutical ingredients. Fire officials are investigating the cause of the blast while the injured are receiving treatment at private hospitals.", "category": "India", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "2a7ffd20"}, {"headline": "Karnataka voter list revision marks 16.38 lakh people as dead", "summary": "Under the ongoing voter list revision in Karnataka, 16.38 lakh individuals have been marked as \"dead,\" nearly four times the state's annual average death rate. The high figure has raised questions about the accuracy of the Sample Registration System versus electoral data. Officials identified over 1.08 crore voters under categories including shifted, duplicate, and absent.", "category": "Politics", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "2fef504d"}, {"headline": "Keralam Governor summons PSC Secretary over examination anomaly controversy", "summary": "Governor Rajendra Vishwanath Arlekar summoned KPSC Secretary Saju George to discuss alleged irregularities in examinations and evaluation processes. The PSC is facing scrutiny over evaluation anomalies, leading to a Crime Branch probe. The Governor sought progress reports on the investigation and general information regarding the ongoing controversy surrounding public recruitment.", "category": "Law", "page": 7, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "631077d1"}, {"headline": "Naidu rejects water shortage fears over Google data centre in Vizag", "summary": "Andhra Pradesh CM N. Chandrababu Naidu dismissed criticism that Google's proposed data centre in Visakhapatnam would cause water shortages. He stated the project's construction has not yet reached a significant pace. Speaking in Anakapalli, he emphasized that industrial investments and the \"Swachch Andhra\" program would turn the district into an economic leader over 25 years.", "category": "Infrastructure", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "045d9577"}, {"headline": "BJP passes resolution against Congress over Vande Mataram stanza decision", "summary": "The BJP passed a resolution criticizing the Congress Working Committee for its decision to singing only the first two stanzas of Vande Mataram. The BJP will launch a nationwide campaign to educate youth on the song’s six-stanza history and constitutional status. The resolution accuses Congress of vote-bank politics and disregarding the National Song's significance established in 1950.", "category": "Politics", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "7deb9a24"}, {"headline": "Congress flags concerns over Supreme Court ruling on ‘industry’ definition", "summary": "Congress leader Jairam Ramesh expressed concern that a recent Supreme Court judgment might narrow the definition of \"industry,\" potentially weakening worker safeguards. The court revisited the 1978 Bangalore Water Supply case, introducing a \"discernible commercial character\" requirement. Ramesh argued this creates interpretive vacuums that could lead to industrial unrest and litigation.", "category": "Law", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "a340e29f"}, {"headline": "Assam MLA blames BJP legislators for flood deaths and devastation", "summary": "Sivasagar MLA Akhil Gogoi accused three BJP legislators, including a Minister, for 105 flood-related deaths in eastern Assam. He rejected the government's \"cloudburst\" claim, citing drone footage of five coffer-dams and excavated embankments along the Dikhow River. Gogoi alleged these structures created a 350-km reservoir upstream, causing the catastrophic flooding.", "category": "Environment", "page": 8, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "3ccc1905"}, {"headline": "Congress slams Centre for failing to control rising commodity prices", "summary": "Congress president Mallikarjun Kharge accused the Centre of allowing sugar prices to rise by 40% while diverting crops for ethanol production. Party leaders claimed essential items like flour, cumin, and turmeric have seen sharp price hikes over the past month. The party warned that the public would not forgive the government's failure to contain inflation ahead of the festival season.", "category": "Economy", "page": 8, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "7892c90e"}, {"headline": "Manipur CM lauds resumption of public transport to Guwahati", "summary": "Manipur CM Yumnam Khemchand Singh welcomed the resumption of bus and commercial vehicle services between Imphal and Guwahati. Services were disrupted since May 2023 due to ethnic conflict, forcing valley residents to rely on air travel. The CM stated the move would provide relief to students and medical patients, signaling a step toward normalcy in regional connectivity.", "category": "Infrastructure", "page": 8, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "f215d6ee"}, {"headline": "Project in Assam converts invasive weeds into carbon-rich biochar", "summary": "A conservation project in Udalguri, Assam, is reclaiming elephant habitats by uprooting invasive species like Lantana camara and converting them into biochar. Led by Aaranyak and the BTR government, the project aims to restore native grasses for herbivores. Biochar, a stable form of carbon, improves soil health and water retention while mitigating the proliferation of invasive alien plants.", "category": "Environment", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "afe69802"}, {"headline": "Infant dies after radiant warmer fire in M.P. government hospital", "summary": "One newborn died and two others suffered burns after a radiant warmer machine caught fire in the NICU of Chhindwara district hospital. Officials blamed a short circuit in the filament coil that sparked near oxygen tubing. While 30 other children were saved, a probe has been ordered into potential negligence. The hospital lacks a paediatric surgeon, necessitating transfers to Jabalpur.", "category": "Health", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "73044d0e"}, {"headline": "Court denies bail to accused in 2019 Pulwama terror attack", "summary": "A special NIA court rejected the bail plea of Insha Jan, accused in the 2019 Pulwama suicide attack. The judge observed sufficient prima facie evidence against her and cited the statutory bar under Section 43-D(5) of the UAPA. Jan, a resident of Pulwama, was arrested in 2020 for her alleged role in the attack that killed 40 CRPF personnel. She remains in judicial custody.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b2fcd64f"}, {"headline": "Five killed as bus ploughs into cultural event in Bihar", "summary": "At least five men were killed and several injured in West Champaran when a bus veered into a crowd at a roadside cultural programme. The driver reportedly lost control while attempting to avoid a head-on collision with a truck. The incident led to a stampede-like situation. Local police have registered a case and are investigating the circumstances of the fatal accident.", "category": "India", "page": 9, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "ea8f80cc"}, {"headline": "Indian national arrested in U.S. for fraud targeting elderly victims", "summary": "Jay Sunilbharthi Goswami, a 21-year-old Indian from Gujarat, was arrested in Canada while fleeing to Qatar for his role in a multi-million-dollar fraud scheme. Operating as a \"money mule\" in the U.S., he targeted elderly victims through wire fraud and money laundering. He faces a maximum of 20 years in prison under charges filed by the U.S. Attorney for New Jersey.", "category": "Law", "page": 9, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "4ffe2cc1"}, {"headline": "Chhattisgarh professor arrested for leaking question paper using endoscopic camera", "summary": "Police arrested a private college professor and five students in Durg for leaking an agriculture university question paper. The accused allegedly used an endoscopic camera to photograph papers inside sealed envelopes before the exam on August 20. The exam, involving 1,500 students, was cancelled. A team of 100 personnel uncovered the sophisticated leak method involving digital capture.", "category": "Law", "page": 9, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "3ec65af7"}, {"headline": "Supreme Court directs DDA to refund ₹5 crore to Art of Living", "summary": "The Supreme Court directed the Delhi Development Authority (DDA) to refund ₹5 crore deposited by Sri Sri Ravi Shankar’s Art of Living Foundation for Yamuna restoration. The NGT had held the foundation responsible for damage during a 2016 festival. However, the top court noted the NGT failed to recognize the site was already damaged prior to the event and clarified DDA's ongoing duties.", "category": "Environment", "page": 9, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 9, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "64bb550a"}, {"headline": "White House report alleges Indian production hubs enable Chinese tariff evasion", "summary": "A U.S. report titled 'The Great Transhipment Scam' accuses India’s Pune-Gujarat-Chennai belt of being a transit point for Chinese pumps and compressors to evade U.S. tariffs. It claims Chinese exporters use limited Indian value addition to bypass Section 301 duties. Indian industry sources refute this, noting that many exporters are U.S. multinationals with legitimate global supply chains.", "category": "Business", "page": 10, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "d6e2d507"}, {"headline": "Mauritius Minister says tax treaty amendments ensure genuine investment flows", "summary": "Mauritius Finance Minister Jyoti Jeetun stated that ratified amendments to the India-Mauritius tax treaty will restore investor certainty and plug shell company loopholes. Mauritius accounted for $6.6 billion in FDI to India in 2025-26. Jeetun emphasized that India’s $5 trillion ambition makes it a highly attractive destination, with the treaty now featuring a 'Principal Purpose Test.'", "category": "Economy", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "3c0c7882"}, {"headline": "SEBI reviews framework for monitoring and disclosing issue proceeds utilization", "summary": "SEBI Chairman Tuhin Kanta Pandey announced a review of the framework for monitoring how companies use funds raised from public issues. The goal is to improve transparency, quality, and timeliness of disclosures for investors. SEBI also proposes to clarify related-party transaction rules and prevent duplication of fines across multiple stock exchanges for the same violations.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "7c5fce2e"}, {"headline": "FSSAI issues 150 notices to major food brands over misleading ads", "summary": "Food regulator FSSAI issued 150 notices to companies including Nestle India, PepsiCo, and Coca-Cola over misleading advertisements and false labelling claims. The enforcement actions target non-compliance with safety and standard regulations. FSSAI cited serious violations and warned food business operators to adhere to legal provisions regarding promotional claims and transparency.", "category": "Business", "page": 10, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "50abb52d"}, {"headline": "Traces of 3.5 billion-year-old microbial life discovered in Indian rock", "summary": "Researchers have found evidence of microbial life in a 3.5 billion-year-old carbon-bearing rock from the Singhbhum Craton in eastern India. Analyzing banded chert from Bhitardari, the team used carbon isotope balances and zircon crystals to confirm biological signatures. The discovery suggests life was established on Earth just a billion years after its birth, challenging evolutionary timelines.", "category": "Science", "page": 11, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "3e11c97f"}, {"headline": "Retractions alone fail to correct India’s damaged scientific record", "summary": "Experts warn that simply retracting fraudulent or faulty research papers does not fix the scientific record, as these works continue to be cited. A study of 12,000 citations of _url": "https://t.me/c/1877410077/134815"}], "article_id": "dae0e3ce"}, {"headline": "Diamonds remain structurally intact at extreme pressure of 10 million atmospheres", "summary": "By using shock waves to reach 1 terapascal of pressure, scientists found that diamonds maintain their crystal structure before melting into a metallic liquid. The experiment showed that diamond's melting point drops slightly at extreme pressures. The findings assist in understanding the interior composition of giant planets and refining nuclear fusion components that use diamond.", "category": "Science", "page": 11, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "2221ab27"}, {"headline": "New research suggests milk in coffee may offer health benefits", "summary": "A study from Copenhagen published in the Journal of Agricultural and Food Science indicates that adding milk to coffee can be beneficial due to antioxidants and minerals. Additionally, research from CFTRI Mysore suggests that a 70:30 coffee-to-chicory blend helps protect the liver and control blood sugar. Moderate caffeine intake is linked to lower risks of type-2 diabetes and stroke.", "category": "Science", "page": 11, "importance": 4, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "74d96eb0"}, {"headline": "OpenAI launches ChatGPT for Teens with stricter parental controls and guardrails", "summary": "OpenAI has introduced a version of ChatGPT for 13-to-17-year-olds featuring stronger protections against content related to self-harm and sexual material. The tool includes parental controls, quiet hours, and a study mode that provides hints rather than direct answers. The launch follows concerns that AI chatbots contribute to mental health issues and learning losses among youth.", "category": "Technology", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "c757b9e7"}, {"headline": "Explainer: U.S. allegations of transshipment fraud against Indian exports", "summary": "The U.S. has identified India as a top hub for 'illegal transshipment,' alleging that $67 billion in Chinese goods are routed through third countries to evade tariffs. The White House report claims products are repackaged or slightly modified to appear as having non-Chinese origin. This causes an estimated $28 billion in lost U.S. revenue and impacts domestic manufacturing in America.", "category": "Economy", "page": 12, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "75ce0698"}, {"headline": "Mirza Fakhrul Islam Alamgir elected as the new President of Bangladesh", "summary": "Mirza Fakhrul Islam Alamgir, former general secretary of the BNP, has been elected President of Bangladesh. A veteran politician and economist, Alamgir steered the party through the challenging Hasina years. In his new role, he faces the task of stabilizing the country under the interim government and managing diplomatic ties, including the potential extradition of Sheikh Hasina.", "category": "World", "page": 13, "importance": 10, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "36d447d4"}, {"headline": "Mohsen Rezaee appointed Secretary of Iran’s Supreme National Security Council", "summary": "Former IRGC commander Mohsen Rezaee has been named Secretary of Iran’s Supreme National Security Council. Picked by Supreme Leader Ayatollah Mojtaba Khamenei, Rezaee is now a central figure in Iran's wartime leadership. His elevation signals a shift toward hardline security strategies as Iran faces ongoing conflicts and strategic challenges regarding uranium enrichment and regional control.", "category": "World", "page": 13, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "f1d32303"}, {"headline": "UKMTO: The British maritime agency tracking Houthi threats at sea", "summary": "The United Kingdom Maritime Trade Operations (UKMTO) has become the primary source for maritime security alerts in the Red Sea and Gulf of Aden. Operating with a team of 15 watch-keepers, it coordinates responses to Houthi attacks and piracy. The organization issued 71 warnings late last year, assisting commercial vessels navigating through high-risk zones near Yemen and Somalia.", "category": "World", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "d06e52c7"}, {"headline": "U.S. imposes 50% tariffs on $20 billion of Canadian products", "summary": "The Trump administration has levied 50% tariffs on $20 billion worth of Canadian imports after trade negotiations failed. Canada immediately pledged to match the tariffs dollar-for-dollar. Affected products include steel, aluminum, autos, and lumber. The breakdown calls into question the future of the North American trade agreement as both nations prepare for economic retaliation.", "category": "World", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "6f189fc8"}, {"headline": "Russian strikes kill ten in Ukraine as ballistic missile attacks intensify", "summary": "Russian drone and missile strikes killed at least seven people in Ukraine, targeting railway infrastructure and residential areas. Ukrainian President Zelenskyy reported casualties in Kyiv and Zaporizhzhia. Meanwhile, a Ukrainian drone attack in Russia's Krasnodar region killed three people. Moscow has recently exploited Ukraine's air defense shortages to launch heavy ballistic strikes.", "category": "World", "page": 14, "importance": 9, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "c36edb82"}, {"headline": "U.S. federal judge strikes down Trump administration’s 75-country visa ban", "summary": "A New York federal judge ruled that the Trump administration’s suspension of immigrant visas from 75 countries was \"contrary to law.\" Judge Jeannette Vargas stated Secretary of State Marco Rubio exceeded his authority with the January policy. The ban targeted countries including Nigeria, Iran, and Afghanistan to prevent immigrants from allegedly utilizing U.S. welfare systems.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b1e3d62d"}, {"headline": "Armed men abduct over 60 worshippers from Nigerian mosque", "summary": "Gunmen kidnapped more than 60 people during Friday prayers at the Kpenya Mosque in Nigeria's Niger state. The mass kidnapping is the latest in a series of attacks by violent gangs in the north-central region. Police confirmed that attackers stormed the mosque in the Borgu local government area, but no group has claimed responsibility for the abduction as search operations begin.", "category": "World", "page": 14, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "b32b7e1e"}, {"headline": "Rohit Yadav wins javelin gold with world-class 87.68m throw", "summary": "Rohit Yadav clinched the javelin gold at the inter-state meet in Bhubaneswar with a throw of 87.68m, ranking him fourth in the world this year. In women’s sprints, 19-year-old Abinaya Rajarajan set a national U-20 record of 11.34s to win the 100m gold. Nine Indians overall secured gold medals on a dominant day for local athletes at the Kalinga Stadium.", "category": "Sports", "page": 15, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "2fba7c19"}, {"headline": "India holds the edge against Sri Lanka in second Colombo Test", "summary": "India leads 1-0 heading into the second Test at the Sinhalese Sports Club Ground in Colombo. Following a 165-run win at Galle, Shubman Gill's side seeks to clinch the series. Sri Lanka faces injury woes with Dinesh Chandimal out due to a concussion. Coach Gautam Gambhir praised young stars Devdutt Padikkal and Manav Suthar for their match-winning performances in the series opener.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "18583fcb"}, {"headline": "Mitchell Starc takes six as Bangladesh skittled for 64 in Mackay", "summary": "Australian pacer Mitchell Starc took 6 for 12 in a devastating 22-ball spell to skittle Bangladesh for 64 on the opening day of the second Test in Mackay. Australia struggled in response, ending the day at 165 for 8 with a 101-run lead. Shoriful Islam also starred with 6 for 35 as 18 wickets fell on a fast-bowling dominated day. Cameron Green remains unbeaten on 51.", "category": "Sports", "page": 15, "importance": 6, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "d4df4946"}, {"headline": "Netherlands defeats India 3-1 to reach Hockey World Cup semifinals", "summary": "The Netherlands beat India 3-1 in a clinical Pool E performance in Amstelveen. Thijs van Dam scored a late goal following a counter-attack to seal India's fate. Despite a goal from captain Harmanpreet Singh, India is on the brink of elimination, languishing at the bottom of the pool. India now relies on a massive victory over Argentina and other results to progress.", "category": "Sports", "page": 16, "importance": 5, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 16, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "39933626"}, {"headline": "Chromium contamination turns groundwater yellow in three Uttar Pradesh districts", "summary": "Unchecked dumping of hazardous chromium waste since 1976 has contaminated groundwater in Kanpur Dehat, Fatehpur, and Akbarpur. Handpumps are drawing bright yellow water, and soil samples show dangerous levels of hexavalent chromium. A 2025 report found 73% to 96% of villagers had toxic levels in their blood. Remediation efforts by the NGT and government remain slow and incomplete.", "category": "Environment", "page": 19, "importance": 8, "telegram_url": "https://t.me/c/1877410077/134815", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 19, "telegram_url": "https://t.me/c/1877410077/134815"}], "article_id": "2c47add7"}, {"headline": "Protests Erupt After Hooda Calls Sajjan Kumar’s Death an Irreparable Loss", "summary": "Sikh protesters burned Rahul Gandhi's effigy in Delhi and were detained after MP Deepender Hooda called 1984 riot convict Sajjan Kumar’s death an \"irreparable loss.\" Demonstrators demanded Hooda's resignation. Punjab Congress leaders, including Amrinder Singh Raja Warring, distanced the party from the remarks, calling them personal views, while AAP sought a formal clarification on the stance.", "category": "Politics", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH -Delhi -23-08-2026_260823072837.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/134815"}], "importance": 6, "article_id": "5626e457"}], "newspapers": ["The Hindu"], "total_articles": 69};

  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
