gions. Experts warn that if the monsoon continues to be erratic, it could further stress the repayment capacity of rural borrowers.", "category": "Economy", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "fff5d567"}, {"headline": "Muthoot Finance Faces Pressure from Rising Cost of Funds and Competition", "summary": "Gold loan major Muthoot Finance is facing headwinds from the rising cost of borrowing and intense competition from banks and other NBFCs. The company's net interest margin saw a slight compression in the latest quarter. Management noted that while gold prices remain high, attracting new customers has become more expensive as players compete to maintain their market share.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "eed16517"}, {"headline": "HSBC India Reports 4% Rise in H1 Profit Before Tax", "summary": "HSBC's India operations reported a 4% increase in profit before tax to $931 million for the first half of 2026. The growth was driven by strong performances in the commercial and investment banking divisions. India continues to be one of the top contributors to HSBC's global profits, reflecting the bank's successful strategy in tapping into the country's growing corporate sector.", "category": "Business", "page": 10, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "3154018e"}, {"headline": "India's Retail Leasing Hits 4-Year High in First Half of 2026", "summary": "Leasing of retail space in India's top seven cities reached a four-year high in the first half of 2026, driven by strong demand from domestic and international brands. According to a report by JLL, retail leasing grew by 11% compared to the same period last year. Tier-1 cities like Mumbai and Bengaluru saw the highest activity as retailers expanded their footprint in major malls.", "category": "Business", "page": 11, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "902d6b11"}, {"headline": "Government to Expedite Compressed Biogas Production with New Subsidies", "summary": "The Union government is planning to expedite the production of compressed biogas (CBG) by offering assured procurement prices and capital subsidies. The move is part of the SATAT initiative, which aims to set up 5,000 CBG plants across India. The government believes that increasing CBG production will help reduce the country's dependence on imported natural gas and promote green energy.", "category": "Environment", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "f00634be"}, {"headline": "India Set to Add Record Distributed Renewable Energy Capacity in FY27", "summary": "India is projected to add its highest-ever distributed solar capacity in the current financial year, supported by the PM Surya Ghar Muft Bijli Yojana. The scheme aims to provide solar rooftop systems to 10 million households, which could add over 16 GW of capacity. Experts noted that while the targets are ambitious, improved supply chains and rising awareness are driving the growth.", "category": "Infrastructure", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "ce72d5e8"}, {"headline": "Parliamentary Panel Finds Just 18% Sewer Management Projects Completed Under AMRUT", "summary": "A parliamentary standing committee has noted that only 18% of the sewer management projects planned under the AMRUT 2.0 mission have been completed in the last five years. The panel expressed concerns over the slow progress and the impact on urban sanitation and pollution control. It urged the government to speed up project implementation and ensure better coordination with states.", "category": "Infrastructure", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "e5fd3a68"}, {"headline": "Gen Z Is Reshaping India's Gold Market, Says World Gold Council", "summary": "A report by the World Gold Council highlights that India’s Gen Z is increasingly viewing gold as a modern asset, shifting away from traditional jewelry. Younger consumers are showing a preference for digital gold and ETFs due to their transparency and ease of investment. The report suggests that brands need to adapt their marketing strategies to cater to the evolving tastes of this generation.", "category": "Business", "page": 12, "importance": 5, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "ffc07270"}, {"headline": "India Inc’s Overseas Push Drives Significant Increase in FDI Outflows", "summary": "Indian companies are increasingly investing abroad, leading to a significant rise in outward foreign direct investment (FDI) outflows. According to government data, Indian firms are pursuing acquisitions and setting up operations in overseas markets to expand their global reach. Experts suggest this trend reflects the growing financial strength and global ambitions of Indian corporations.", "category": "Economy", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "a142be29"}, {"headline": "Centre Collects ₹32.05 Lakh Crore Through Cesses and Surcharges Over Five Years", "summary": "The Central government has collected approximately ₹32.05 lakh crore through various cesses and surcharges over the last five fiscal years. Finance Ministry data shows that these collections are used to fund major public welfare schemes and infrastructure projects. Some opposition parties have raised concerns about the impact of these levies on the overall tax burden of citizens.", "category": "Economy", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "7612d08b"}, {"headline": "ED Investigating 32 Cases Under PML Law Involving Economic Fugitives", "summary": "The Enforcement Directorate (ED) is currently investigating 32 cases under the Prevention of Money-Laundering Act (PMLA) involving high-profile economic fugitives. The agency is coordinating with international law enforcement bodies to track down and extradite individuals accused of major financial frauds. The government reaffirmed its commitment to bring these individuals back to justice.", "category": "Law", "page": 12, "importance": 6, "telegram_url": "https://t.me/c/1877410077/132864", "sources": [{"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "article_id": "5d91f995"}, {"headline": "Indian-flagged vessel sinks after Red Sea attack; 14 rescued", "summary": "An Indian-flagged merchant vessel, MSV Faize Noore Oliyathat, sank off Yemen's coast after being hit by a projectile. All 14 crew members, including 13 Indians, were safely rescued by the Yemeni Coast Guard. India condemned the attack, calling for an end to targeting commercial shipping.", "category": "World", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 8, "article_id": "ea1e882e"}, {"headline": "CRPF Officer Kills Two Colleagues and Himself in Assam’s Nagaon", "summary": "A Central Reserve Police Force (CRPF) sub-inspector allegedly shot dead two of his colleagues and injured another before killing himself at a camp in Assam’s Nagaon district. The incident occurred on Tuesday morning at the 34 Battalion camp. The injured personnel has been shifted to a hospital for treatment, and an investigation into the motive behind the shooting is underway.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 5, "article_id": "af55ae7c"}, {"headline": "SC Mandates SOPs to Curb 'Digital Arrests' and Ensure Time-Bound Refunds", "summary": "The Supreme Court has directed authorities to establish standard operating procedures (SOPs) to curb the growing menace of 'digital arrests' and ensure time-bound refunds for fraud victims. The court expressed concern over the rise in financial fraud cases and the lack of a robust mechanism for victim compensation. The move aims to strengthen the legal framework for tackling cybercrime.", "category": "Law", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 9, "article_id": "58390c28"}, {"headline": "Udhayanidhi Stalin Arrested and Released on Bail Following Protest", "summary": "DMK leader Udhayanidhi Stalin was briefly arrested and released on bail following a protest against an alleged remark. The arrest sparked protests by DMK supporters in several parts of Tamil Nadu. The party leadership condemned the arrest and stated that they would continue to protest against the government's policies. Udhayanidhi was later released on station bail after questioning.", "category": "Politics", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132814"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 8, "article_id": "55631c99"}, {"headline": "Air India flight hits turbulence, 17 injured", "summary": "Thirteen passengers and four crew members on an Air India flight from Phuket to Delhi were injured when the aircraft encountered severe turbulence and a sudden drop in altitude. The Airbus A320 has been grounded, and the DGCA is investigating the incident.", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 7, "article_id": "057ac885"}, {"headline": "Apple's India sales exceed $10 billion in FY26, surging demand", "summary": "Apple Inc. surpassed $10 billion in annual sales in India for the first time last fiscal year, with revenue growing double-digits from $9 billion a year earlier. iPhones accounted for most sales, while iPads and MacBooks also rose. India is emerging as a key sales region outside the US and China, with Apple expanding its retail network.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132841"}], "importance": 7, "article_id": "f9edbf93"}, {"headline": "SC: 10-km mining buffer applies to all wetland reserves", "summary": "The Supreme Court clarified that its direction banning mining within a 10-km radius of the Asan wetland conservation reserve in Uttarakhand would apply to all similar wetland reserves across India. Himachal Pradesh had sought an exemption, but the court insisted on parity across Himalayan terrain.", "category": "Environment", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 7, "article_id": "24aa72a5"}, {"headline": "India repatriated 274 fugitives from 36 countries since 2019", "summary": "The Union Home Ministry announced 274 fugitive criminals have been repatriated from 36 countries in the past seven years. Home Minister Amit Shah emphasized a three-pronged strategy against fugitives: global outreach, coordination, and smart diplomacy, marking it a \"national priority\".", "category": "India", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 7, "article_id": "35d7385d"}, {"headline": "Finance Minister Introduces Bill to Attract More Global Capital to India", "summary": "Finance Minister Nirmala Sitharaman has introduced the Taxation Laws Amendment Bill in the Lok Sabha to attract more foreign investment. The bill proposes to eliminate certain tax hurdles for offshore investment funds and streamline tax rules for foreign companies. The move is part of the government's broader strategy to position India as a global manufacturing and financial hub.", "category": "Economy", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/132841"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 8, "article_id": "cb657f72"}, {"headline": "Bharti Airtel Q1 Net Profit Jumps 37% on India Business Strength", "summary": "Bharti Airtel reported a 37% rise in Q1 net profit to ₹8,167 crore, aided by subscriber additions and a focus on premiumisation. Total revenue grew 18% to ₹58,539 crore. The company's India business revenue rose 9.7%, while its ARPU increased to ₹264. Airtel's homes segment also showed strong growth, supported by continued expansion of its fiber-to-the-home services.", "category": "Business", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "importance": 7, "article_id": "3b9d8885"}, {"headline": "Neeraj Chopra to Compete in Lausanne Diamond League Against Nadeem", "summary": "Olympic champion Neeraj Chopra will compete in the Lausanne Diamond League on August 21, facing a tough field that includes Pakistan’s Arshad Nadeem. This will be their first meeting since the 2024 Olympic Games. Chopra, who has been in good form recently, is looking to maintain his top ranking as he prepares for the end-of-season Diamond League finals.", "category": "Sports", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁵⁰⁸²⁰²⁶.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132868"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 6, "article_id": "8dd951c2"}, {"headline": "L&T Bags ₹15,000 Crore Order from Adnoc for Offshore Facilities", "summary": "Larsen & Toubro’s hydrocarbon business has secured a major contract valued at over ₹15,000 crore from Abu Dhabi National Oil Company (Adnoc). The project involves the engineering, procurement, and construction of multiple offshore facilities in the UAE. This mega-order is part of Adnoc's efforts to expand its offshore energy infrastructure and enhance production capacity.", "category": "Business", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132841"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 8, "article_id": "3c7ca0e2"}, {"headline": "Oil Prices Fall Below $80 on US-Iran Truce Hopes", "summary": "Global oil prices fell by over 5% to a three-week low on Tuesday following reports of progress in US-Iran truce talks. Brent front-month futures dropped to $79.38 per barrel. The potential reopening of the Strait of Hormuz has eased concerns over global supply disruptions, despite ongoing geopolitical tensions in the Middle East.", "category": "Economy", "sources": [{"newspaper": "Mint", "pdf_filename": "BENGALURU_Mint_05-08-2026.pdf", "page": 10, "telegram_url": "https://t.me/c/1877410077/132841"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 8, "article_id": "1a6f1a69"}, {"headline": "Supreme Court Extends Mandatory Third-Party Insurance for New Vehicles", "summary": "The Supreme Court has mandated a four-year third-party insurance period for new cars and a six-year period for two-wheelers. The court observed that many vehicles continue to operate on Indian roads without insurance once the initial mandatory period expires, leaving accident victims and their families without recourse. The move aims to enhance road safety and victim compensation.", "category": "Law", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 7, "article_id": "83afb242"}, {"headline": "US Plans Ban on Chinese Data Centre Components Over Security Fears", "summary": "The US administration is drafting a ban on components from Chinese data centres to prevent firmware-level data theft and protect the AI boom. The FCC is working on measures to bar these imports, fearing they could be used to disrupt service or steal secrets. This move targets major Chinese brands and reflects growing US concerns over technological security and competition.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132855"}], "importance": 8, "article_id": "901b506f"}, {"headline": "Marico Q1 Profit Jumps 25% on Strong India Volume Growth", "summary": "Marico reported a 25% year-on-year increase in Q1 consolidated net profit to ₹630 crore, driven by 11% domestic volume growth. Revenue from operations rose 9% to ₹3,221 crore. The company saw strong performance across its core Parachute and Saffola brands, as well as its foods and premium personal care portfolios. International business also saw constant currency growth of 15%.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "importance": 5, "article_id": "08c1be3c"}, {"headline": "ONGC Q1 Consolidated Net Profit Drops 43% to ₹6,554 Crore", "summary": "ONGC reported a 43% decline in Q1 consolidated net profit to ₹6,554 crore, primarily due to losses at its subsidiary HPCL. Despite the profit dip, ONGC's standalone net profit rose to ₹17,034 crore. The company saw a decrease in its share of profit from subsidiaries and joint ventures, but remains committed to its investment plans for enhancing domestic oil and gas production.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132855"}], "importance": 6, "article_id": "3ab0a29d"}, {"headline": "Bharti Airtel Q1 Net Profit Jumps 35% on Data Growth", "summary": "Bharti Airtel reported a 35.45% year-on-year increase in consolidated net profit to ₹8,057.2 crore for the April-June quarter. The growth was driven by record postpaid subscriber additions and rising data consumption. The company's Average Revenue Per User (ARPU) rose to ₹264, the highest in the Indian telecom industry, supported by a growing base of 4G and 5G users.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 1, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 8, "article_id": "52b29639"}, {"headline": "Taxation Bill to Make India More Attractive for Global Capital", "summary": "The Taxation and Other Laws (Amendment) Bill, 2026, was introduced in the Rajya Sabha to attract foreign investment by offering tax exemptions for certain data centres. The Bill also aims to simplify tax procedures and provide a stable tax regime to encourage the 'Make in India' initiative. Finance Minister Nirmala Sitharaman stated the move will help India become a global manufacturing hub.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 8, "article_id": "71d2d352"}, {"headline": "Piyush Goyal to Visit US for G20 Trade Ministers Meeting", "summary": "Commerce and Industry Minister Piyush Goyal will visit the US later this month to attend the G20 Trade Ministers' meeting. The visit aims to strengthen bilateral trade ties and discuss key issues like market access and labor standards. Goyal is also expected to hold meetings with top US officials to push for a more comprehensive trade agreement between the two nations.", "category": "Economy", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 7, "article_id": "22140abb"}, {"headline": "JSW Group to Invest ₹1.2 Lakh Crore in Karnataka Over Five Years", "summary": "JSW Group has announced plans to invest ₹1.2 lakh crore in Karnataka over the next five years for steel, green energy, and port projects. The investment includes the expansion of its Vijayanagar Works steel plant and new renewable energy initiatives. Chairman Sajjan Jindal stated that the group is committed to supporting Karnataka's industrial growth and green energy transition.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 8, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 2, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 7, "article_id": "a20bf379"}, {"headline": "Alembic Pharmaceuticals Reports 12.1% Growth in Q1 Net Profit", "summary": "Alembic Pharmaceuticals reported a 12.1% rise in its consolidated net profit to ₹173.1 crore for the first quarter ended June 30. The growth was supported by strong sales in the domestic and international markets. The company's consolidated revenue from operations also saw an 11.2% increase compared to the same period last year, reaching ₹2,149.8 crore.", "category": "Business", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 11, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 5, "article_id": "bad60af2"}, {"headline": "Meta to Meet MeitY Officials Over Child Sexual Abuse Material Compliance", "summary": "Officials from Meta are scheduled to meet with the Ministry of Electronics and Information Technology (MeitY) to discuss the platform's compliance with laws regarding child sexual abuse material (CSAM). The meeting follows reports of alleged child pornography ads appearing on Instagram. MeitY is expected to seek explanations on the effectiveness of Meta's content moderation and safety tools.", "category": "Technology", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 7, "article_id": "090791b4"}, {"headline": "DGCA Probes Air India Flight Altitude Loss Incident That Injured 13", "summary": "The DGCA is investigating an incident where an Air India flight from Phuket to Delhi experienced a sudden altitude loss, injuring 13 people. The aircraft encountered severe turbulence, causing injuries to several passengers and crew members. The flight landed safely in Delhi, and the injured were taken to a hospital for treatment. The DGCA has sought a report from the airline on the incident.", "category": "Infrastructure", "sources": [{"newspaper": "Business Line", "pdf_filename": "Bangalore_BL_05-08-2026.pdf", "page": 14, "telegram_url": "https://t.me/c/1877410077/132855"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 6, "article_id": "1e239185"}, {"headline": "BJP accuses Kejriwal of false claims on E20 fuel", "summary": "BJP MP Sudhanshu Trivedi accused AAP chief Arvind Kejriwal of making unsubstantiated and baseless claims regarding E20 fuel without scientific evidence. Trivedi criticized Kejriwal for making \"usual drama\" and questioned his understanding of the issue despite his engineering background.", "category": "Politics", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 7, "article_id": "675ab578"}, {"headline": "FIFA Faces Internal Conflict Over President Infantino’s World Cup Plan", "summary": "FIFA President Gianni Infantino is facing a major internal crisis over his proposal to sell a stake in the FIFA World Cup to private investors. Key figures within the organization have publicly criticized the plan, leading to what some describe as a 'civil war' within the governing body. Critics argue the move would undermine the integrity and independence of global football's premier event.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}, {"newspaper": "Economic Times", "pdf_filename": "Bangalore_ET_05-08-2026.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/132864"}], "importance": 6, "article_id": "4a36e0cf"}, {"headline": "Mandaviya felicitates CWG medalists, urges focus on Asian Games", "summary": "Union Sports Minister Mansukh Mandaviya felicitated Commonwealth Games medal-winners in boxing, judo, and para-athletics with cash prizes. He urged them to carry their momentum to the Asian Games, aiming for more gold, and to mentor future athletes, while not forgetting coaches' contributions.", "category": "Sports", "sources": [{"newspaper": "The Hindu", "pdf_filename": "TH Delhi 05-08-2026.pdf", "page": 15, "telegram_url": "https://t.me/c/1877410077/132814"}], "importance": 4, "article_id": "9a68d48c"}], "newspapers": ["Times of India", "Hindustan Times", "Economic Times", "Business Line", "Financial Express", "Mint", "The Hindu", "Indian Express"], "total_articles": 259};

function showIndex() {
  readerScreen.classList.remove('active');
  indexScreen.classList.add('active');
}
function showReader() {
  indexScreen.classList.remove('active');
  readerScreen.classList.add('active');
  initHintsOnce();
}

// ── Index screen ─────────────────────────────────────────────────────────
function buildIndex() {
  const chipNav      = document.getElementById('chipNav');
  const indexList    = document.getElementById('indexList');
  const mastheadDate = document.getElementById('mastheadDate');
  const mastheadMeta = document.getElementById('mastheadMeta');
  const startBtn     = document.getElementById('startBtn');

  mastheadDate.textContent = DIGEST.date || 'Today';
  const totalArticles = DIGEST.total_articles ?? allArts.length;
  const totalPapers   = (DIGEST.newspapers || []).length;
  mastheadMeta.textContent = totalArticles
    ? `${totalArticles} article${totalArticles === 1 ? '' : 's'} · ${totalPapers} newspaper${totalPapers === 1 ? '' : 's'}`
    : 'No articles yet';

  if (!allArts.length) {
    startBtn.style.display = 'none';
  } else {
    startBtn.addEventListener('click', () => openReader(allArts[0].article_id));
  }

  chipNav.innerHTML = '';
  indexList.innerHTML = '';

  if (!sortedCats.length) {
    indexList.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📭</div>' +
        '<div class="empty-state-title">No articles yet</div>' +
        '<div class="empty-state-sub">Check back after the next digest run</div>' +
      '</div>';
    return;
  }

  const chips = [];
  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const slug = 'sec-' + slugify(cat);

    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (ci === 0 ? ' active' : '');
    chip.style.setProperty('--cc', m.color);
    chip.innerHTML = `<span>${m.icon}</span><span>${esc(cat)}</span><span class="chip-count">${arts.length}</span>`;
    chip.addEventListener('click', () => {
      const sec = document.getElementById(slug);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    chipNav.appendChild(chip);
    chips.push(chip);

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = slug;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.style.setProperty('--cc', m.color);
    head.innerHTML = `<span class="sh-icon">${m.icon}</span><span class="sh-name">${esc(cat)}</span><span class="sh-count">${arts.length}</span>`;
    section.appendChild(head);

    arts.forEach(art => section.appendChild(buildRow(art, m)));
    indexList.appendChild(section);
  });

  setupChipObserver(chips);
}

function buildRow(art, m) {
  const src   = art.sources && art.sources[0];
  const extra = (art.sources && art.sources.length > 1) ? art.sources.length - 1 : 0;
  const srcLabel = src
    ? `${esc(src.newspaper || '')} · Pg ${src.page || 1}${extra ? ` <span class="row-more">+${extra} more</span>` : ''}`
    : '';
  const flame = (art.importance || 0) >= 8 ? '<span class="row-flame">🔥</span>' : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.style.setProperty('--cc', m.color);
  row.dataset.articleId = art.article_id;
  row.innerHTML = `
    <div class="row-top">
      ${flame}
      <span class="row-source">${srcLabel}</span>
    </div>
    <div class="row-headline">${esc(art.headline)}</div>
    <div class="row-summary">${esc(art.summary)}</div>
  `;
  row.addEventListener('click', () => openReader(art.article_id));
  return row;
}

let chipObserver = null;
function setupChipObserver(chips) {
  const indexList = document.getElementById('indexList');
  const sections  = sortedCats.map(cat => document.getElementById('sec-' + slugify(cat)));
  if (chipObserver) chipObserver.disconnect();
  chipObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const idx = sections.indexOf(entry.target);
      if (idx === -1) return;
      chips.forEach(c => c.classList.remove('active'));
      chips[idx].classList.add('active');
      chips[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { root: indexList, rootMargin: '-10% 0px -75% 0px', threshold: 0 });
  sections.forEach(s => s && chipObserver.observe(s));
}

// ── Reader screen (swipe-based; logic unchanged from the original) ──────
let catIdx = 0, vpW = 0, vpH = 0;
const panels    = [];
const outer     = document.getElementById('outer');
const hTrack    = document.getElementById('hTrack');
const hintUp    = document.getElementById('hintUp');
const hintRight = document.getElementById('hintRight');
const catFlash  = document.getElementById('catFlash');
const cfIcon    = document.getElementById('cfIcon');
const cfName    = document.getElementById('cfName');
const backBtn   = document.getElementById('backBtn');

function buildAllReaderPanels() {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.innerHTML = ''; panels.length = 0;

  sortedCats.forEach((cat, ci) => {
    const m    = CAT_META[cat] || DEFAULT_META;
    const arts = byCategory[cat];
    const panel = document.createElement('div');
    panel.className = 'cat-panel';
    panel.id = `cat-panel-${ci}`;
    panel.style.setProperty('--cc', m.color);
    panel.innerHTML = `<div class="progress-row" id="prow-${ci}" style="--cc:${m.color}"></div><div class="v-feed" id="vfeed-${ci}"><div class="v-track" id="vtrack-${ci}"></div></div>`;
    hTrack.appendChild(panel);

    const pRow   = panel.querySelector(`#prow-${ci}`);
    const vFeed  = panel.querySelector(`#vfeed-${ci}`);
    const vTrack = panel.querySelector(`#vtrack-${ci}`);
    const cardH  = vFeed.getBoundingClientRect().height || vpH;

    arts.forEach((art, ai) => {
      const card = buildCard(art, cardH, m, cat, ai);
      card.id = `article-${art.article_id}`;
      vTrack.appendChild(card);
    });

    panels.push({ pRow, vFeed, vTrack, articles: arts, artIdx: 0 });
    buildPRow(ci);
  });

  hTrack.style.transition = 'none';
  hTrack.style.transform = 'translateX(0)';
  if (panels.length) syncV(0, false);
}

function buildCard(art, h, m, cat, articleIndex) {
  const src = art.sources && art.sources[0];
  // Direct PDF link with #page=N - respected by all modern browser PDF viewers
  // when the file is opened via a link click (Chrome, Firefox, Safari, Edge).
  // Falls back to the Telegram source URL if no PDF is available.
  const href = (src && src.pdf_filename)
    ? ('pdfs/' + src.pdf_filename + '#page=' + (src.page || 1))
    : ((src && src.telegram_url) || '#');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.articleId = art.article_id;
  card.style.height = h + 'px';
  card.style.setProperty('--cc', m.color);
  card.innerHTML = `
    <div class="card-content">
      <div class="card-toprow">
        <div class="cat-pill">
          <div class="pill-icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="2" rx="0.6" fill="#888"/><rect x="1" y="4.5" width="5" height="1.5" rx="0.6" fill="#666"/><rect x="1" y="7" width="6" height="1.5" rx="0.6" fill="#666"/></svg></div>
          ${esc(cat.toUpperCase())}
        </div>
        <div class="card-date">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="11" height="9.5" rx="1.8" stroke="#555" stroke-width="1.2"/><path d="M4.5 1v3M8.5 1v3" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6h11" stroke="#555" stroke-width="1.2"/></svg>
          ${esc(DIGEST.date)}
        </div>
      </div>
      <div class="card-headline">${esc(art.headline)}</div>
      <div class="card-summary">${esc(art.summary)}</div>
      <div class="card-divider"></div>
      <div class="card-footer">
        ${src ? `<a class="src-chip" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(src.newspaper)}<span class="src-chip-sep">&middot;</span><span class="src-chip-pg">Pg ${src.page || 1}</span><span class="src-chip-ext"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 7.5L7.5 3.5M7.5 3.5H5M7.5 3.5V6" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>` : '<div></div>'}
        <div class="info-btn"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="#444" stroke-width="1.3"/><circle cx="7.5" cy="4.5" r="0.8" fill="#555"/><path d="M7.5 7v4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>`;
  return card;
}

function buildPRow(ci) {
  const p = panels[ci], ai = p.artIdx;
  p.pRow.innerHTML = '';
  p.articles.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'pseg' + (i < ai ? ' done' : i === ai ? ' active' : '');
    p.pRow.appendChild(seg);
  });
}

function syncV(ci, animated) {
  const p = panels[ci], h = p.vFeed.getBoundingClientRect().height;
  p.vTrack.style.transition = animated ? 'transform 0.35s cubic-bezier(0.4,0,0.2,1)' : 'none';
  p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  buildPRow(ci);
}

// General-purpose jump: used by row taps, the Start button, and deep links.
function openReader(articleId, isDeepLink) {
  const ci = sortedCats.findIndex(cat => byCategory[cat].some(a => a.article_id === articleId));
  if (ci === -1) return;
  const ai = byCategory[sortedCats[ci]].findIndex(a => a.article_id === articleId);
  if (ai === -1) return;

  catIdx = ci;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-ci * vpW}px)`;
  panels[ci].artIdx = ai;
  syncV(ci, false);

  showReader();
  history.replaceState(null, '', '#article-' + articleId);

  if (isDeepLink) {
    const card = document.getElementById('article-' + articleId);
    if (card) {
      card.classList.add('target-highlight');
      setTimeout(() => card.classList.remove('target-highlight'), 3000);
    }
  }
}

function closeReader() {
  showIndex();
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

function goArt(d) {
  const p = panels[catIdx];
  if (!p) return;
  const n = Math.max(0, Math.min(p.artIdx + d, p.articles.length - 1));
  if (n === p.artIdx && d !== 0) return;
  p.artIdx = n; syncV(catIdx, true); dismiss();
}

function goCat(idx, animated = true) {
  idx = Math.max(0, Math.min(idx, sortedCats.length - 1));
  if (idx === catIdx && animated) return;
  const prev = catIdx; catIdx = idx;
  hTrack.style.transition = animated ? 'transform 0.38s cubic-bezier(0.4,0,0.2,1)' : 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  if (animated && idx !== prev) {
    const m = CAT_META[sortedCats[idx]] || DEFAULT_META;
    catFlash.style.background = m.color + '18';
    cfIcon.textContent = m.icon; cfName.textContent = sortedCats[idx]; cfName.style.color = m.color;
    catFlash.classList.add('on'); setTimeout(() => catFlash.classList.remove('on'), 500);
  }
  dismiss();
}

let dismissed = false;
function dismiss() {
  if (dismissed) return; dismissed = true;
  hintUp.classList.remove('visible'); hintRight.classList.remove('visible');
  hintUp.classList.add('gone'); hintRight.classList.add('gone');
}

// Hints are scheduled once, the first time the reader ever opens (not on
// page load) — the parent #readerScreen sits at opacity:0 while inactive,
// so even if this timer fires while the index is showing, the hint stays
// invisible; it will simply appear next time the reader is open.
let hintsInitialized = false;
function initHintsOnce() {
  if (hintsInitialized) return;
  hintsInitialized = true;
  const KEY = 'dailyBriefHintSeen';
  try {
    if (!localStorage.getItem(KEY)) {
      localStorage.setItem(KEY, '1');
      setTimeout(() => { if (!dismissed) { hintUp.classList.add('visible'); hintRight.classList.add('visible'); } }, 2500);
    }
  } catch (e) { /* localStorage unavailable (e.g. private browsing) — skip hints */ }
}

backBtn.addEventListener('click', closeReader);

// ── Gestures — scoped to #outer, so they're automatically inert whenever
// the reader screen is inactive (pointer-events:none redirects hit-testing
// to the Index screen beneath it; no extra guard needed). ──────────────────
let tsX = 0, tsY = 0, tcX = 0, tcY = 0, axis = null, drag = false;
outer.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; tcX = 0; tcY = 0; axis = null; drag = true;
  hTrack.style.transition = 'none';
  const p = panels[catIdx]; if (p) p.vTrack.style.transition = 'none';
}, { passive: true });

outer.addEventListener('touchmove', e => {
  if (!drag) return;
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  tcX = dx; tcY = dy;
  if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  if (!axis) return;
  e.preventDefault();
  if (axis === 'h') {
    const edge = (catIdx === 0 && dx > 0) || (catIdx === sortedCats.length - 1 && dx < 0);
    hTrack.style.transform = `translateX(${-catIdx * vpW + dx * (edge ? 0.14 : 1)}px)`;
  } else {
    const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height;
    const edge = (p.artIdx === 0 && dy > 0) || (p.artIdx === p.articles.length - 1 && dy < 0);
    p.vTrack.style.transform = `translateY(${-p.artIdx * h + dy * (edge ? 0.14 : 1)}px)`;
  }
}, { passive: false });

outer.addEventListener('touchend', () => {
  if (!drag) return; drag = false;
  if (axis === 'h') {
    const t = vpW * .2;
    if (tcX < -t) goCat(catIdx + 1);
    else if (tcX > t) goCat(catIdx - 1);
    else { hTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; hTrack.style.transform = `translateX(${-catIdx * vpW}px)`; }
  } else if (axis === 'v') {
    const t = vpH * .2;
    if (tcY < -t) goArt(1);
    else if (tcY > t) goArt(-1);
    else { const p = panels[catIdx], h = p.vFeed.getBoundingClientRect().height; p.vTrack.style.transition = 'transform 0.3s cubic-bezier(.4,0,.2,1)'; p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`; }
  }
  axis = null;
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (readerScreen.classList.contains('active')) { e.preventDefault(); closeReader(); }
    return;
  }
  if (!readerScreen.classList.contains('active')) return;
  if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goArt(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); goArt(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); goCat(catIdx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goCat(catIdx - 1); }
});

let wl = false;
outer.addEventListener('wheel', e => {
  e.preventDefault(); if (wl) return; wl = true;
  Math.abs(e.deltaX) > Math.abs(e.deltaY) ? goCat(catIdx + (e.deltaX > 0 ? 1 : -1)) : goArt(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => wl = false, 500);
}, { passive: false });

window.addEventListener('resize', () => {
  vpW = outer.offsetWidth; vpH = outer.offsetHeight;
  hTrack.style.transition = 'none';
  hTrack.style.transform = `translateX(${-catIdx * vpW}px)`;
  panels.forEach(p => {
    const h = p.vFeed.getBoundingClientRect().height;
    p.vTrack.querySelectorAll('.card').forEach(c => c.style.height = h + 'px');
    p.vTrack.style.transition = 'none';
    p.vTrack.style.transform = `translateY(${-p.artIdx * h}px)`;
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
// No hash → show the Index immediately. A #article-<id> hash (from a push
// notification) → skip the Index entirely and jump straight into the
// Reader once layout has settled (200ms, same as the original deep-link
// timing) so card heights are measured correctly before the jump.
function init() {
  buildIndex();
  buildAllReaderPanels();

  const hash  = window.location.hash;
  const rawId = hash.startsWith('#article-') ? hash.slice(9) : (hash ? hash.slice(1) : '');
  const target = rawId && DIGEST.articles.find(a => a.article_id === rawId);

  if (target) {
    setTimeout(() => openReader(target.article_id, true), 200);
  } else {
    showIndex();
  }
}

init();
</script>
</body>
</html>
