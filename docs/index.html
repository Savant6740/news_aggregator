<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background: #0c0c0c; color: #fff;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ── Index screen ────────────────────────────────────────────────────── */
#indexScreen { display: flex; flex-direction: column; background: #0c0c0c; }

.masthead { flex-shrink: 0; padding: 22px 20px 14px; }
.masthead-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.masthead-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: #c9a66b; text-transform: uppercase; margin-bottom: 5px; }
.masthead-date { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.masthead-meta { margin-top: 9px; font-size: 12.5px; font-weight: 500; color: #666; }
.start-btn {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #c9a66b; color: #14110a; font-weight: 700; font-size: 12.5px;
  padding: 10px 14px; border-radius: 100px; letter-spacing: 0.005em;
}

.chip-nav {
  flex-shrink: 0; display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #1a1a1a;
}
.chip-nav::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap;
  background: #141414; border: 1px solid #232323; border-radius: 100px;
  padding: 7px 13px 7px 11px; font-size: 12.5px; font-weight: 600; color: #999;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip-count { color: #555; font-weight: 500; }
.chip.active { color: #fff; border-color: var(--cc); background: color-mix(in srgb, var(--cc) 18%, #141414); }
.chip.active .chip-count { color: color-mix(in srgb, var(--cc) 65%, #fff); }

.index-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 32px; }
.cat-section { display: flex; flex-direction: column; }

.section-head { display: flex; align-items: center; gap: 8px; padding: 20px 20px 8px; }
.sh-icon { font-size: 14px; }
.sh-name { font-size: 12.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--cc); }
.sh-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #444; }

.row {
  display: flex; flex-direction: column; width: 100%; text-align: left; gap: 5px;
  padding: 13px 20px; border-bottom: 1px solid #131313; position: relative;
}
.row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--cc); opacity: 0.6; }
.row:active { background: #111; }
.row-top { display: flex; align-items: center; gap: 6px; min-height: 14px; }
.row-flame { font-size: 11px; line-height: 1; }
.row-source { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #5e5e5e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.row-more { color: #444; font-weight: 500; }
.row-headline { font-size: 15px; font-weight: 700; line-height: 1.32; color: #eee; letter-spacing: -0.01em; }
.row-summary { font-size: 12.5px; line-height: 1.5; color: #666; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 6px; padding: 40px 24px; text-align: center; }
.empty-state-icon { font-size: 34px; opacity: 0.55; margin-bottom: 6px; }
.empty-state-title { font-size: 14.5px; font-weight: 700; color: #888; }
.empty-state-sub { font-size: 12px; color: #454545; }

/* ── Reader screen (swipe cards) — unchanged from the original design ──── */
.outer { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.h-track { display: flex; height: 100%; will-change: transform; }
.cat-panel { flex-shrink:0; width:100vw; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.progress-row { flex-shrink:0; display:flex; gap:4px; padding:14px 16px 10px; background:#0c0c0c; position:relative; z-index:5; overflow:visible; }
.progress-row::after { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:80%; height:120px; background:radial-gradient(ellipse at top,color-mix(in srgb,var(--cc) 30%,transparent) 0%,transparent 70%); pointer-events:none; z-index:-1; }
.pseg { flex:1; height:2px; border-radius:1px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; }
.pseg::after { content:''; position:absolute; inset:0; background:var(--cc,#e8334a); transform:scaleX(0); transform-origin:left; transition:transform 0.25s ease; }
.pseg.done::after, .pseg.active::after { transform:scaleX(1); }
.v-feed { flex:1; overflow:hidden; position:relative; clip-path:inset(0); }
.v-track { display:flex; flex-direction:column; will-change:transform; }
.card {
  width:100%; flex-shrink:0; background:#0c0c0c; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
  scroll-margin-top: 80px;
}
.card.target-highlight {
  background: linear-gradient(135deg, #fff3cd22 0%, #ffeaa722 100%) !important;
  box-shadow: 0 0 30px rgba(255, 193, 7, 0.4);
  border: 2px solid #f39c12;
  animation: pulse-highlight 2s ease-in-out;
}
@keyframes pulse-highlight {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 193, 7, 0.4); }
  50% { box-shadow: 0 0 50px rgba(255, 193, 7, 0.6); }
}
.card-content { flex:1; display:flex; flex-direction:column; padding:36px 20px 22px; min-height:0; position:relative; z-index:1; }
.card-toprow { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-shrink:0; }
.cat-pill { display:inline-flex; align-items:center; gap:7px; background:#1c1c1e; border-radius:8px; padding:7px 12px 7px 10px; font-size:11.5px; font-weight:700; letter-spacing:0.07em; color:#d0d0d0; text-transform:uppercase; line-height:1; }
.pill-icon { width:16px; height:16px; background:#2e2e30; border-radius:3px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pill-icon svg { display:block; }
.card-date { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:#666; letter-spacing:0.01em; }
.card-headline { font-size:28px; font-weight:800; line-height:1.18; color:#fff; letter-spacing:-0.03em; margin-bottom:20px; flex-shrink:0; }
.card-summary { font-size:15.5px; font-weight:400; line-height:1.62; color:#6b6b6b; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; }
.card-divider { height:1px; background:#1e1e1e; margin:20px 0 16px; flex-shrink:0; }
.card-footer { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.src-chip { display:inline-flex; align-items:center; gap:6px; background:#181818; border:1px solid #282828; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; color:#c0c0c0; text-decoration:none; letter-spacing:0.005em; line-height:1; }
.src-chip-sep { color:#3a3a3a; font-weight:400; }
.src-chip-pg { color:#555; font-weight:500; }
.src-chip-ext { margin-left:2px; }
.src-chip-ext svg { display:block; }
.info-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #252525; background:#141414; display:flex; align-items:center; justify-content:center; color:#555; flex-shrink:0; }

.back-btn {
  position: fixed; top: 16px; left: 16px; z-index: 500;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(20,20,20,0.72); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center; color: #ddd;
}

.cat-flash { position:fixed; inset:0; z-index:600; pointer-events:none; opacity:0; transition:opacity 0.12s; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
.cat-flash.on { opacity:1; }
.cf-icon { font-size:34px; }
.cf-name { font-size:22px; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase; }
.hint { position:fixed; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; z-index:400; opacity:0; transition:opacity 0.6s ease; }
.hint.visible { opacity:1; }
.hint.gone { opacity:0 !important; transition:opacity 0.4s; }
.hint-pill { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.07); backdrop-filter:blur(10px); padding:5px 13px; border-radius:100px; border:1px solid rgba(255,255,255,0.09); }
.hint-arr { font-size:16px; color:rgba(255,255,255,0.4); }
.h-up { bottom:28px; left:50%; transform:translateX(-50%); animation:bUp 2s ease-in-out infinite; }
.h-right { top:50%; right:14px; transform:translateY(-50%); animation:bRight 2s ease-in-out infinite 0.6s; }
@keyframes bUp { 0%,100% { bottom:28px; opacity:.65; } 50% { bottom:36px; opacity:1; } }
@keyframes bRight { 0%,100% { right:14px; opacity:.65; } 50% { right:6px; opacity:1; } }

/* ── Accessibility & responsive ──────────────────────────────────────── */
button:focus-visible, a:focus-visible { outline: 2px solid #c9a66b; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

@media (min-width: 640px) {
  .masthead, .chip-nav, .cat-section { max-width: 640px; margin-inline: auto; }
}
</style>

4428fb70"}, {"headline": "Karnataka approves ₹25 crore for fodder in drought areas", "summary": "The Karnataka cabinet has approved an allocation of ₹25 crore to provide fodder for livestock in 135 drought-affected taluks. The government plans to set up fodder banks and provide subsidies to farmers to prevent distress sale of cattle. This is part of a larger ₹600 crore relief package being planned for agriculture and rural sectors.", "category": "Economy", "page": 3, "importance": 5, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "d009f6d6"}, {"headline": "Telangana minister Konda Surekha sacked over daughter's remarks", "summary": "Telangana Chief Minister Revanth Reddy has dropped Konda Surekha from the state cabinet after her daughter made controversial remarks about senior political leaders. The decision followed a directive from the Congress high command. Surekha, who held the endowments and forest portfolios, expressed shock but stated she would remain loyal to the party.", "category": "Politics", "page": 4, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "2c46a15f"}, {"headline": "Tamil Nadu plans new secretariat and Olympic City", "summary": "Tamil Nadu CM Vijay announced the construction of a new administrative secretariat complex and a 'Sports Olympic City' in Chennai. The projects, estimated to cost over ₹1,200 crore, aim to modernize state administration and provide world-class facilities for athletes. The CM stated that the secretariat would be a symbol of Tamil culture and efficiency.", "category": "Infrastructure", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "8e04aea3"}, {"headline": "Andhra ACB arrests TTD deputy executive officer", "summary": "The Andhra Pradesh Anti-Corruption Bureau (ACB) arrested a Deputy Executive Officer of the Tirumala Tirupati Devasthanams (TTD) for allegedly possessing assets disproportionate to his known sources of income. Raids at multiple locations in Tirupati and Nellore led to the seizure of cash, gold, and property documents valued at several crores.", "category": "Law", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "6ae3c220"}, {"headline": "Rajnath Singh unveils 10-year roadmap for defence diplomacy", "summary": "Defence Minister Rajnath Singh launched 'Raksha', a 10-year roadmap to strengthen India's defense ties and bolster exports. The strategy focuses on proactive global cooperation, technology transfer, and joint manufacturing with friendly nations. India aims to reach ₹50,000 crore in annual defense exports by 2030 through this initiative.", "category": "India", "page": 5, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "011ba99d"}, {"headline": "Mayawati removes nephew Akash Anand from BSP post", "summary": "Bahujan Samaj Party chief Mayawati has removed her nephew Akash Anand from the post of national coordinator. She stated that Anand needs 'more maturity' before taking on such a senior role. This is the second time he has been removed from the position, reflecting internal shifts within the BSP leadership ahead of upcoming regional polls.", "category": "Politics", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "16a35faf"}, {"headline": "Abhishek Banerjee's Kolkata office ransacked and looted", "summary": "A group of armed, masked individuals allegedly ransacked and looted the office of TMC leader Abhishek Banerjee in South Kolkata. The intruders reportedly stole computers and sensitive documents. The TMC has alleged a political conspiracy, while the Kolkata police have launched a high-level probe and detained several suspects for questioning.", "category": "India", "page": 5, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 5, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "58f99b16"}, {"headline": "306 killed in Manipur ethnic violence since 2023", "summary": "Manipur Home Minister Govindas Konthoujam informed the state assembly that at least 306 people have been killed in ethnic violence since May 2023. He added that 49 people remain missing. The government is working with the Centre to restore peace and provide relief to thousands of displaced families currently living in temporary camps.", "category": "India", "page": 6, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "32a62978"}, {"headline": "Centre invites Ladakh leaders for talks on Sept 9", "summary": "The Union Home Ministry has invited leaders from the Leh Apex Body and Kargil Democratic Alliance for a new round of talks in Delhi on September 9. The discussion will focus on demands for statehood, constitutional safeguards under the Sixth Schedule, and job reservations for locals. Previous rounds of talks had ended in a deadlock.", "category": "Politics", "page": 6, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 6, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "c9754590"}, {"headline": "Accused stabs sexual assault survivor to death in Haryana", "summary": "A 24-year-old woman, who was a survivor of sexual assault, was allegedly stabbed to death by the accused in Haryana's Jind district. The incident occurred while the accused was out on bail. The victim's family has alleged police negligence in providing security. The police have registered a fresh case of murder and are conducting raids to nab the accused.", "category": "Law", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "e0576ea0"}, {"headline": "UP rains: 5 dead as Ganga crosses danger mark", "summary": "Heavy monsoon rains in Uttar Pradesh have resulted in five deaths and caused the Ganga to flow above the danger mark in several districts. Flooding has affected low-lying areas in Varanasi and Prayagraj. CM Yogi Adityanath has directed district officials to expedite relief operations and evacuate people from vulnerable riverside settlements.", "category": "Environment", "page": 7, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 7, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "992b7398"}, {"headline": "India seeks tariff advantage in bilateral US trade deal", "summary": "The Indian government is pushing for preferential tariff treatment in its ongoing trade negotiations with the United States. Commerce Minister Piyush Goyal stated that India seeks 'comparative advantage' to boost exports of labor-intensive goods. Finalizing the deal could significantly increase bilateral trade and provide a stable framework for investments.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "e73d514f"}, {"headline": "Services sector growth slows to four-year low in August", "summary": "India's services sector growth decelerated to its slowest pace in four years in August, according to the HSBC India Services PMI. The index dropped to 53.3 from 54.3 in July. While still in expansion territory, the slowdown was attributed to weaker demand and competitive pressures, marking the softest growth since March 2022.", "category": "Business", "page": 12, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 12, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "fa91adbd"}, {"headline": "BCCI backs Rohit Sharma; notes schedule impact on team", "summary": "The BCCI has officially backed Rohit Sharma to continue as captain despite a recent slump in India's ODI performance. In a review meeting, the board noted that 'too much cricket' and a congested schedule are impacting player fitness and performance. The BCCI plans to implement better workload management ahead of the next World Cup cycle.", "category": "Sports", "page": 13, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "40bea795"}, {"headline": "Yashvir Singh replaces injured Neeraj Chopra for Asian Games", "summary": "Javelin thrower Yashvir Singh has been named as a replacement for Olympic champion Neeraj Chopra in the Indian squad for the Asian Games. Chopra was forced to withdraw due to a persistent groin injury. Yashvir, a bronze medalist at the Commonwealth Games, is expected to lead India's challenge in the event alongside Kishore Jena.", "category": "Sports", "page": 13, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136216", "sources": [{"newspaper": "Hindustan Times", "pdf_filename": "HT Bengaluru ⁰⁴⁰⁹²⁰²⁶.pdf", "page": 13, "telegram_url": "https://t.me/c/1877410077/136216"}], "article_id": "e3d7ca41"}, {"headline": "Handwriting on tissue paper triggers probe into Air India Express crew", "summary": "Security agencies and police are investigating cabin crew members of an Air India Express flight after a tissue paper with a handwritten bomb threat was found in the lavatory. All 40 people on board, including crew, have undergone handwriting sampling. The aircraft was diverted to Ahmedabad following the discovery of the note during the Dammam-Delhi flight.", "category": "India", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "6f4d0c93"}, {"headline": "India and Belgium to double bilateral trade via defense and energy", "summary": "Prime Minister Narendra Modi and Belgian Prime Minister Alexander De Croo agreed to double bilateral trade within five years, focusing on defense, green energy, and semiconductors. The leaders signed ten agreements, including the joint manufacturing of defense equipment and cooperation on clean technology and maritime security during talks in New Delhi.", "category": "Economy", "page": 3, "importance": 8, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "34a7727f"}, {"headline": "Govt to permit emission retrofit kits in heavy commercial vehicles", "summary": "Union Minister Nitin Gadkari announced that the government will allow the installation of retrofit emission-control devices in older heavy vehicles to reduce pollution. The move aims to cut particulate matter emissions by up to 90%. Technology developed by an IIT Delhi startup will enable BS-IV and BS-III trucks to comply with BS-VI standards at a cost of ₹4,000-₹5,000.", "category": "Environment", "page": 3, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "6e04927b"}, {"headline": "Kenya orders Tata Chemicals to cease operations in Kajiado", "summary": "Kenya's President William Ruto has ordered Tata Chemicals Magadi Ltd to stop operations in Kajiado County, claiming the local community has not benefited from the company's presence. Ruto criticized the century-old contract for mineral extraction and asked the company to vacate the area. Tata Chemicals has operated the Magadi resource since acquiring it in 2005.", "category": "Business", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "15f62162"}, {"headline": "Ladakh's seven districts to get autonomous hill councils for self-governance", "summary": "The Union government announced that all seven districts of the Union Territory of Ladakh will now have autonomous hill councils. The move is intended to provide local self-governance and empower the region's inhabitants. Council elections will be held soon to establish administrative bodies similar to those already existing in Leh and Kargil.", "category": "Politics", "page": 3, "importance": 7, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 3, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "db2587ad"}, {"headline": "Bengaluru bikers demand refund of road tax amid flyover restrictions", "summary": "Two-wheeler riders in Bengaluru are demanding a refund of life-time road tax following restrictions on their access to major flyovers, including the Electronics City and KIA elevated roads. Bikers staged a 'Last Ride' protest, arguing that they paid substantial taxes for infrastructure that is now being denied to them based on safety concerns cited by police.", "category": "Infrastructure", "page": 4, "importance": 4, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "ecabae4e"}, {"headline": "Aero India 2027 to be held in Yelahanka from February 8", "summary": "The 16th edition of Aero India will take place at the Air Force Station, Yelahanka, from February 8 to 12, 2027. The Ministry of Defence confirmed the dates for the biennial air show and aviation exhibition, which serves as a major platform for global aerospace and defense firms to showcase technology and sign strategic agreements.", "category": "Business", "page": 4, "importance": 6, "telegram_url": "https://t.me/c/1877410077/136209", "sources": [{"newspaper": "Times of India", "pdf_filename": "TOI Bangalore Times 04-09-2026.pdf", "page": 4, "telegram_url": "https://t.me/c/1877410077/136209"}], "article_id": "72d215a0"}, {"headline": "Bone marrow transplants provide second chance
